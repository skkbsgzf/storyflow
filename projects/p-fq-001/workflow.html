达总结句，每章 ≤1（「认命和认输，就差一口气」）。\n11. **章末钩零氛围**：全是台词/懵逼/倒吸凉气/半截动作——具体反应收尾。\n12. **次章无缝续钩**：次章首段直接演上章末钩的反应，不重述。\n13. **能力做用法乘法**：不加第二异能，把「吞」玩出一万种用法（时停=只玩一分钟的同款结构）。\n14. **章名即第一梗**：双句梗章名（「好消息时间静止，坏消息一分钟」式）——章名先笑一次。\n\n**开场七式轮换**（同式不连用）：人物状态单句 / 上章钩续接 / 冲突对白 / 拟声单段 / 两字转场 / 时间跳切 / 地点定场。\n\n## 十二、开篇定场与读者认知（新读者官条款 · v3）\n\n> 来源：用户判词「小说开篇完全没介绍世界观/背景/主角，读者不知道发生在哪」——冷 open 不能以读者迷路为代价。执尺人：**新读者官**（agents/first-reader.profile.json，零上下文首读者，评审前禁读大纲/圣经/底牌）。\n\n**定场四问**（首章前 300 字交齐，缺一打回）：\n\n1. **何时**——时代坐标一句话（本书：「神明降临第四十年」）；\n2. **何地**——地点 + 靠什么活着（本书：青礁聚落，开祭日全村到场的海边废土聚落）；\n3. **谁**——主角姓名 + 处境 + 想要什么（本书：陈潮生，18，海记食堂独子，嘴笨记账，全家赌他火系）；\n4. **世界规矩**——核心规则一条（本书：献什么换什么，神收什么就还什么）。\n\n定场必须**长在事件和对话里**（价目牌/台位费/狠话都是载体），禁说明书式倾泻。\n\n**新设定词引入五手法**（每个新词首现必选其一）：\n\n| 手法 | 例 |\n| --- | --- |\n| 场景演示 | 器型「厨具？」——执事当众登记 |\n| 官方文书 | 价目牌「献双眼，得火」 |\n| 人物一句话 | 「思维链供品，潮生懂：收的就是人一天里想的事」 |\n| 用后即释 | 先见鱼吞征收令，后补「征收令=悬了四十年的神谕链」 |\n| 刻意存疑 | 老人「不饿的神，怎么开了口」——角色也不懂，每章 ≤2 |\n\n**读者认知边界**（断层双向定义）：\n\n- 正文出现而世界书未登记的词 = 断层（agent 库库写、读者跟不上）；\n- 世界书里有而没向读者介绍过的词，被正文当已知用 = 同罪；\n- 执行：每章结算在章账记「读者此刻知道/不知道」（见 世界书/纪律.md 第七件），新词先登记再进正文（登记台账在 设定/名目与黑话.md）。\n\n**去AI味·禁则清单**（OpenAI 官方 8 类，全清单见 kb/aesthetic/slop-list）：结论式收尾句 / 套话动词 / 提示性过渡（「值得注意的是」）/ 自问自答 / **假对比句「不是A而是B」每千字 ≤1** / 强调词（真的·确实）/ 自造复合概念词 / 模糊限定。词表双向：管输出也管提示词。交稿加检：a) 全章搜「不是…而是/…，不是…」计数；b) 删掉任何一句结尾的「总之/综上/这就是」试读，意思不变就删；c) 「真的/确实/其实」删一遍试读。\n\n## 十、与既有约束的关系\n\n负面约束照常生效：ai-trace 五指纹、24 类、快餐红线（句长抖动/排比配额/无总分总）管「不像 AI」；本档管「像谁」。两套叠用，缺一不可。\n", "世界书/纪律.md": "# 世界书纪律（更新机制·逆向 deepwrite）\n\n> 来源注记：体系逆向自 `.refs/deepwrite` 长篇工作台——worldbuilding（list/text 双格式，`contentAuthority: files` 文件即真相）/ characters+continuity（人物分型 + 每章结算四件）/ plot（六阶段）。按 miniflow 的 md-first 约定落地，零数据库。\n\n## 一、双格式\n\n- **list 型**（人物/势力/地理/设定）：总览在 index.json，**一人一文件/一势力一文件**——文件即真相（contentAuthority: files），索引只是指针；\n- **text 型**（底牌/大事记）：单文件整体维护。\n\n## 二、人物分型（deepwrite 四型）\n\n**主角 / 主要配角 / 次要配角 / 路人**——入场即建档：角色首次出场当章，写手待登记清单必须含其动机三行（要/怕/卡），宿主结算时建卡。路人若无升级预期不入卡（防百科化）。\n\n## 三、章回结算五件（「不断更新」的执行点）\n\n每章 flow_submit 之后、下一章派发之前，宿主按写手「待登记清单」结算：\n\n| # | 结算件 | 写入处 | deepwrite 对应 |\n| --- | --- | --- | --- |\n| 1 | **章卡**：本章一句话+梗点+钩型+新名目 | 编年/章账.md 追加一节 | chapter card |\n| 2 | **人物状态推进**：谁的状态变了（伤/钱/知情/关系/位置）→ 改人物卡「当前状态」段，变动摘要追加「变动史」 | 人物/*.md | characterState + history |\n| 3 | **交接（handoff）**：下一章写手必须知道的 3-5 条（=章账末节「交接下一章」） | 编年/章账.md 末节 | handoff 文件 |\n| 4 | **伏笔变动**：新埋/回收/顺期 → 伏笔/台账.md 表格更新（状态 open/paid/retired） | 伏笔/台账.md | foreshadowingChanges |\n| 5 | **世界揭示**：本章确立了什么新设定事实 → 设定词条或编年追加（version+1，updated 改） | 设定/*.md、编年/大事记.md | worldReveals |\n| 7 | **读者认知边界**：本章末「读者此刻知道/不知道」各 1-3 条记章账本节；本章新词落档 设定/名目与黑话.md 登记台账（首现章/读者已解章/说明手法）。断层双向：正文有而世界书无=断层；世界书有而读者未被介绍却当已知用=同罪 | 编年/章账.md、设定/名目与黑话.md | readerKnowledge |\n\n## 三·五、结算第六件：快照（Diff 的数据底座）\n\n结算五件落盘后，宿主用快照工具把**本行改动过的文件**（章账/人物卡/设定词条/伏笔台账）与**正文**留不可变快照：\n\n```bash\npython tools/snapshot.py capture <flow> <project> <node> --files \"世界书/编年/章账.md,世界书/人物/陈潮生.md,正文-第001章.md\"\n```\n\n工作台据此提供行级 Diff（世界书变了哪些 / 正文变了哪些）；无快照的文件不出现 Diff 按钮。\n\n## 四、状态机与版本\n\n- 词条状态：`draft（设定中）→ active（已进正文）→ retired（被推翻；不删，留档）`——**世界观的迭代本身可以成为剧情**（版本更新日设定即来源于此）；\n- 每次修改：frontmatter `version` +1、`updated` 改当日；大改在词条末尾「变动史」记一行。\n\n## 五、RAG 规则（写第 N 章的开工动作）\n\n1. 读 `世界书/index.json`，按本章 tags 拉相关词条（写第 47 章只拉 3 个词条，不重读全书）；\n2. 读 `编年/章账.md` **末节**（=上一章 handoff，含人物当前状态**与读者认知边界**）；\n3. 读 `伏笔/台账.md` 中 status=open 且预定回收点临近的条目；\n4. 底牌目录仅暗线节点需要时按节点号取对应段，禁止整读。\n\n## 五·五、正文驱动补全（写到哪里、补到哪里）\n\nRAG 不是只读的：**正文推进到哪，世界书就跟到哪**，防「agent 库库写、读者断层」。\n\n- **写前准入**：本章细纲里的新名目/新人物，先在 设定/名目与黑话.md（或对应词条）登记为 draft，并定好首现说明手法（五手法之一，见文风档 §十二）；\n- **写中即录**：写作中冒出的计划外新词，进「待登记清单」随稿提交，禁止用了就忘；\n- **结算落档**：第七件把新词转正（draft→active），补「读者已解章/说明手法」；\n- **断层自检**：结算时逐词核对——正文出现而台账没有的词，要么补写巧妙说明，要么改写掉；下一章写手以「读者认知边界」为准判断哪些词可直接用、哪些必须再说明。\n\n## 六、禁区\n\n- 正文不得出现 banned 词（词汇表.json）与底牌内容；\n- 新名目/新人物：先登记（本索引+设定/名目与黑话）再进正文；\n- 词条之间用 `[[id]]` 交叉链接；文件即真相，改文件不改索引=失效（结算时必须同步 index.json 的 status/version）。\n"}}, {"round": 5, "ts": "2026-09-17 04:32", "note": "", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n", "世界书/设定/文风档.md": "---\nid: style-voice\ntitle: 文风档（本书声音规范）\n类型: 设定（文风）\ntags: [文风, 声口, 节奏, 校准, 样张]\nlinks: [w-slang, w-power, style-learning, naturalness-zh]\nstatus: active\nversion: 3\nupdated: 2026-09-17\n---\n\n# 文风档（本书声音规范）\n\n## 一、一句话定义本书声音\n\n**「账本体的废土童话」**——像一个小饭馆老板在废土上记账：账目冰冷，账本里夹着神话。\n\n三个关键词：**记账**（万事可计价，情绪也记账）、**废土的冷**（世界不答应任何事）、**灶台的暖**（人情的暖只在吃饭时给）。\n\n## 二、叙述基准\n\n- **视角**：第三人称贴身限知（潮生）。信息=潮生所见+鱼泡。禁止上帝补课（不能写潮生不知道的事）。\n- **时态**：现场进行地讲——每一段都是「正在发生」，不是「发生过」。\n- **段落**：1-3 行为主。**单句成段=重锤**，每章 2-4 处，只砸在真相和转折上，不许随手砸。\n\n## 三、句子节奏（治「平」的核心药方）\n\n- 短句（≤7 字）占比 ≥40%；\n- **连续三句等长必拆**；连续两段同一节奏模板必换；\n- 三段式节奏：铺垫（可长）→ 转折（短）→ 落锤（更短，名词句最佳）——落锤示例：「祭台上空，征收令。」\n- 「的」字连用 ≤3；形容词堆叠 ≤2；每章「突然/仿佛/似乎」合计 ≤2。\n\n**「平」的病根只有一个：用总结代替场景。** 每句概括性的话，都必须翻译成一个有声音、有动作、有价码的画面再落笔（见 §九样张）。\n\n## 四、声口规范（人物=声音）\n\n| 人 | 声口 | 校准例句 |\n| --- | --- | --- |\n| 潮生 | 短、账本体、嘴笨 | 「记账。」「饭勺。」 |\n| 鲲崽 | 吐泡文，懒，两三字 | 「加钱。」「巢。」 |\n| 陈母 | 金句+生意腔+市井量词 | 「在我家灶台垫脚，是它八辈子修来的福分。」 |\n| 陈大海 | 半截话+动作代话 | 「不是异能。是祸。」 |\n| 尖嘴哥 | 语速快、见风转舵、职业腔 | 「消息换口粮，童叟无欺。」 |\n| 执事/神殿 | 官腔+表格词 | 「器型：厨具？」 |\n| 雷臂 | 骄傲转敬、短促 | 「你家雷炒面。」 |\n\n判据：**遮住名字，三句内认出是谁**。认不出=声口不成立，改。\n\n## 五、幽默方式（只准三种）\n\n1. **错位正经**：大词说小事——官方表格写「器型：厨具？」；\n2. **降维实诚**：神话事物用市井逻辑接——神谕=零嘴，神崽=加钱；\n3. **预期违背**：前文铺足 A 的期待，落地给 A-1——抬着担架来赴宴，一口饭，担架先坐下了。\n\n禁：网络烂梗直贴、谐音硬挠、旁白解说式玩梗、贫嘴连珠炮。\n\n## 六、比喻系统（语料域白名单）\n\n比喻必须出自**角色生活域**：灶台/海鲜/账本/海潮/渔网/腌货/秤。\n例：「征收令没了……像嗑瓜子」✓。\n禁：出戏的文艺比喻（「如同深渊吞噬大地」类）；废土人口中蹦科技词（潮生看链时的系统词除外）。\n\n## 七、情绪段规则（真段落）\n\n- 情绪真段落：**零梗**、放慢、允许一个 ≤25 字的长句收尾；每章 1-2 处，多了腻；\n- 落点永远是「人」，不是「景」——写爸爸的袖管，不写废土的黄昏。\n\n## 八、交稿前十条自检\n\n1. 开头两行是事件或反常，不是写景；\n2. 遮住名字，三句内认出说话的人；\n3. 删光「突然/仿佛/似乎」，读感不降才算过；\n4. 无连续三句等长；\n5. 无超过 5 行的段落；\n6. 梗全在对话/情境里，旁白贴梗=打回；\n7. 情绪真段落零梗；\n8. 章末钩是具体期待，不是氛围；\n9. 本章至少动用一个名目（勺语/黄三/含机量/吞三式）——名目用了才活；\n10. **朗读一遍：想跳过的段落，就是平的段落——重写那里。**\n\n## 九、校准样张（平 vs 味）\n\n**病样（平·总结体）**：\n> 觉醒礼上，众人都展示了自己的强大异能，只有陈潮生的异能是一只蓝色的鱼，看起来像一把饭勺，大家都嘲笑他，这让他非常尴尬。\n\n**样张（味·场景体）**——取自本书第 1 章成稿：\n> 别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚——「啪叽」，栽进妈妈的面盆。他端详半天：「是个饭勺？」执事落笔：「器型：厨具？」连问号都是官方盖的章。\n\n差别不在辞藻，在**信息交付方式**：病样是「告诉」（一句话总结了尴尬），样张是「上演」（镜头+台词+官方文件梗，读者自己笑）。全书所有总结句，都必须按此翻译成画面。\n\n## 十一、时停体技法迁移（拆书炼化 v2 · 2026-09-17）\n\n> 拆解《时停！》449 章所得（全案见 内部/时停体炼化报告.md）。逐条为「可直接抄进正文」的写法。\n\n1. **好消息/坏消息模板**：铺垫长句 → 一句段落锤 → 复读确认 → 自嘲具体化（「一分钟够干什么的？泡碗面都不够」式）。\n2. **拟声单段**：「砰！」「咕咚。」「滋啦。」独立成段——转场、惊变、节奏换挡（本书高频用：鱼咬/勺敲/雷进嘴）。\n3. **两字转场段**：「第二天。」「外界。」——切场景不写过渡句。\n4. **自嘲确认句**：「嗯，他的异能是一把饭勺。」——身份+黑色幽默一句双清。\n5. **反讽词**：褒义词形容危险事（「青礁聚落民风淳朴，就是隔三差五死人」）。\n6. **夸张数字梗**：「引发了一亿点小小的骚动」。\n7. **名目可见化**：重要名目用【征收令】【勺语】方括号标记（每章 ≤3 处，重要才加）。\n8. **黑历史复读**：丢人语录被聚落传唱回响（潮生的丢人宣言/「黄三」诨名定期复读打脸）。\n9. **高潮喜剧调剂**：紧张场面写配角丑态（水军哥式抽焦），高压段必须留泄压阀。\n10. **格言透视句**：人情练达总结句，每章 ≤1（「认命和认输，就差一口气」）。\n11. **章末钩零氛围**：全是台词/懵逼/倒吸凉气/半截动作——具体反应收尾。\n12. **次章无缝续钩**：次章首段直接演上章末钩的反应，不重述。\n13. **能力做用法乘法**：不加第二异能，把「吞」玩出一万种用法（时停=只玩一分钟的同款结构）。\n14. **章名即第一梗**：双句梗章名（「好消息时间静止，坏消息一分钟」式）——章名先笑一次。\n\n**开场七式轮换**（同式不连用）：人物状态单句 / 上章钩续接 / 冲突对白 / 拟声单段 / 两字转场 / 时间跳切 / 地点定场。\n\n## 十二、开篇定场与读者认知（新读者官条款 · v3）\n\n> 来源：用户判词「小说开篇完全没介绍世界观/背景/主角，读者不知道发生在哪」——冷 open 不能以读者迷路为代价。执尺人：**新读者官**（agents/first-reader.profile.json，零上下文首读者，评审前禁读大纲/圣经/底牌）。\n\n**定场四问**（首章前 300 字交齐，缺一打回）：\n\n1. **何时**——时代坐标一句话（本书：「神明降临第四十年」）；\n2. **何地**——地点 + 靠什么活着（本书：青礁聚落，开祭日全村到场的海边废土聚落）；\n3. **谁**——主角姓名 + 处境 + 想要什么（本书：陈潮生，18，海记食堂独子，嘴笨记账，全家赌他火系）；\n4. **世界规矩**——核心规则一条（本书：献什么换什么，神收什么就还什么）。\n\n定场必须**长在事件和对话里**（价目牌/台位费/狠话都是载体），禁说明书式倾泻。\n\n**新设定词引入五手法**（每个新词首现必选其一）：\n\n| 手法 | 例 |\n| --- | --- |\n| 场景演示 | 器型「厨具？」——执事当众登记 |\n| 官方文书 | 价目牌「献双眼，得火」 |\n| 人物一句话 | 「思维链供品，潮生懂：收的就是人一天里想的事」 |\n| 用后即释 | 先见鱼吞征收令，后补「征收令=悬了四十年的神谕链」 |\n| 刻意存疑 | 老人「不饿的神，怎么开了口」——角色也不懂，每章 ≤2 |\n\n**读者认知边界**（断层双向定义）：\n\n- 正文出现而世界书未登记的词 = 断层（agent 库库写、读者跟不上）；\n- 世界书里有而没向读者介绍过的词，被正文当已知用 = 同罪；\n- 执行：每章结算在章账记「读者此刻知道/不知道」（见 世界书/纪律.md 第七件），新词先登记再进正文（登记台账在 设定/名目与黑话.md）。\n\n**去AI味·禁则清单**（OpenAI 官方 8 类，全清单见 kb/aesthetic/slop-list）：结论式收尾句 / 套话动词 / 提示性过渡（「值得注意的是」）/ 自问自答 / **假对比句「不是A而是B」每千字 ≤1** / 强调词（真的·确实）/ 自造复合概念词 / 模糊限定。词表双向：管输出也管提示词。交稿加检：a) 全章搜「不是…而是/…，不是…」计数；b) 删掉任何一句结尾的「总之/综上/这就是」试读，意思不变就删；c) 「真的/确实/其实」删一遍试读。\n\n**排比配额与文书体豁免**（prose-scan 执行口径）：叙述层三连排比每章 ≤1、「不是A（而）是B」每章 ≤2（webnovel-fastfood 红线）。文书体（价目牌/布告/账目/链画面分格编号）的排比豁免条件=它本身是笑点或世界文书本体，且每章仅此 1 处；**定场区（前 300 字）不豁免**——开篇节奏是读者对本书的第一印象（2026-09-17 用户揪出价目牌三连后定此规矩）。机械层交稿前必跑 `python tools/prose-scan.py 章节正文/第N章.md`；语义层排比（管X叫Y 式）机器抓不全，归新读者官通读兜底。\n\n## 十、与既有约束的关系\n\n负面约束照常生效：ai-trace 五指纹、24 类、快餐红线（句长抖动/排比配额/无总分总）管「不像 AI」；本档管「像谁」。两套叠用，缺一不可。\n"}}, {"round": 6, "ts": "2026-09-16T21:07:55.063Z", "note": "submit r3", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 7, "ts": "2026-09-17 05:08", "note": "v7 回写：三遍法修订进章节正文（与终稿 v7 同文）", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 8, "ts": "2026-09-16T21:50:34.787Z", "note": "submit r5", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 9, "ts": "2026-09-17 05:51", "note": "", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 10, "ts": "2026-09-16T22:15:57.835Z", "note": "submit r7", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 11, "ts": "2026-09-17 06:16", "note": "", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 12, "ts": "2026-09-17T00:33:59.001Z", "note": "submit r8·第1章.md", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 13, "ts": "2026-09-17T00:33:59.155Z", "note": "submit r8·第2章.md", "content": {"章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n"}}, {"round": 14, "ts": "2026-09-17T00:33:59.308Z", "note": "submit r9·第3章.md", "content": {"章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 15, "ts": "2026-09-17T01:10:39.845Z", "note": "submit r10·第1章.md", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早就在街里横着走，把鱼腥气和神殿的香灰味搅在一起，灌进每一扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空——下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 16, "ts": "2026-09-17T01:10:39.999Z", "note": "submit r10·第2章.md", "content": {"章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝——吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿——儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，蹲在圈边看着猪吃完，一等就是小半天。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真，好像多抹两下，罪过就能少一点。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边。缸沿冰凉，他把胳膊肘架上去，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n"}}, {"round": 17, "ts": "2026-09-17T01:10:40.163Z", "note": "submit r11·第3章.md", "content": {"章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦。头一勺油下锅，整条街的味就换了——海记门口头一回，闻不见海腥，只有锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯眼看碗底，像验一张元石的成色，验完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了——那碟咸鱼是隔壁三婶给的，他当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 18, "ts": "2026-09-17T02:16:24.111Z", "note": "submit r12·第1章.md", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早就在街里横着走，把鱼腥气和神殿的香灰味搅在一起，灌进每一扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 19, "ts": "2026-09-17T02:16:24.265Z", "note": "submit r12·第2章.md", "content": {"章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，蹲在圈边看着猪吃完，一等就是小半天。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边。缸沿冰凉，他把胳膊肘架上去，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n"}}, {"round": 20, "ts": "2026-09-17T02:16:24.428Z", "note": "submit r13·第3章.md", "content": {"章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，他当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 21, "ts": "2026-09-17T03:21:19.623Z", "note": "submit r14·第1章.md", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早在街里横着走，把鱼腥气和香灰味搅在一起，灌进每扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬。名册页边翻起一圈毛边，几十年了。「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色，热浪隔着几步远烘在潮生脸上。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层。裹到第二层，里头动了一下，爸爸手上加了把劲。塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n"}}, {"round": 22, "ts": "2026-09-17T03:21:19.774Z", "note": "submit r14·第2章.md", "content": {"章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，膏稠，拉出的丝挂在槽沿上半天断不干净。她蹲在圈边看着猪吃完，一等就是小半天，日头斜了又斜，猪低头，她也低头。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，纸边毛糙，裁得急，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，沿着旧折痕折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边，凳腿吱呀了一声。缸沿冰凉，他把胳膊肘架上去，压出一道印，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n"}}, {"round": 23, "ts": "2026-09-17T03:21:19.927Z", "note": "submit r15·第3章.md", "content": {"章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。有几粒饭粘在了筐沿上。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉，眼睛盯着筐沿那几粒饭，咽了口唾沫。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖上的灰印，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦，人一趴上去，桌面吱呀晃两下就稳了。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，三婶围裙油亮，站在桌边手都没处放，潮生当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放，袖口的缝线都崩开了半寸：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。夜露下来了，他手心里一层潮。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，遇了夜潮发黏。奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}], "polish": [{"round": 1, "ts": "2026-09-16T19:04:18.402Z", "note": "submit r1", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章 ｜ 本稿已过三遍法（声口/处境/机味），修订留痕见 内部/修订对照表.md\n\n## 第1章 开祭礼，掉进面盆的神\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，四十年了，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。这条规矩，大断代以前就有。大断代以后，废土上的法律死绝了，就剩这一条还作数。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，轮到他儿子。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。\n\n潮生不用问这八个元石是哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n攒出来，买台位，赌他今天觉醒个火系。火系进膏厂点火熬膏，一晚上顶爸爸劈一个月蟹壳。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n那少年下了台，嘴角是翘着的。他爹在台底下抹眼泪，不知道是喜是疼。\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨，从小就说不过人。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n## 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁。吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里，「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n## 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地，手里的秤砣「咣当」砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n\n（前三章试稿 · 完）\n"}}, {"round": 2, "ts": "2026-09-17 04:14", "note": "", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v5 · 读者契约回修版）\n\n> 本版变更：第1章开篇补齐定场四问（神明降临四十年/青礁聚落/陈潮生锚定/献祭规矩），「思维链供品」首现即巧妙说明；全稿过 OpenAI 8 类禁则清单扫描与新读者官零上下文通读。世界观/人物/名目登记台账同步结算（世界书/纪律.md 第七件）。合计约 5602 字。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。聚落里管换回来的东西叫异能，管跪上台的少年叫虔客，管没换回来的那些，叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 3, "ts": "2026-09-17 04:32", "note": "", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v6 · 机味回炉版）\n\n> 本版变更（用户揪出价目牌三连排比）：真跑机味扫描——新增 tools/prose-scan.py 机械配额门（三连排比每章≤1/不是A是B每章≤2/slop词计数），第1章修净4处（价目牌三连改参差、「管叫」三连拆解、「当着×3」改双锤短句、「飘过×3」换动词），第3章「不是A是B」压回配额2；第2章原样合规。第3章「编一条念一条改一条」为本章唯一配额内笑点本体，依文书体豁免保留。合计约 5614 字。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供
