。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 4, "ts": "2026-09-16T20:51:52.285Z", "note": "submit r4", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v6 · 机味回炉版）\n\n> 本版变更（用户揪出价目牌三连排比）：真跑机味扫描——新增 tools/prose-scan.py 机械配额门（三连排比每章≤1/不是A是B每章≤2/slop词计数），第1章修净4处（价目牌三连改参差、「管叫」三连拆解、「当着×3」改双锤短句、「飘过×3」换动词），第3章「不是A是B」压回配额2；第2章原样合规。第3章「编一条念一条改一条」为本章唯一配额内笑点本体，依文书体豁免保留。合计约 5614 字。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 5, "ts": "2026-09-16T21:01:57.829Z", "note": "submit r6", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v7 · 三遍法执行版）\n\n> 本版变更：novel-deai 三遍法完整执行（声口 1 / 处境 1 / 机味 5）——删纯告知句「心情很复杂」（内心外化）；拆「海记为什么没事？因为…」自问自答（slop 第4类）；删「比抖更吓人的是」提示性过渡（slop 第3类）；「三天后」孤立时间过渡改事件承载（结构指纹：过渡方式单一）；「悬」字重复、「这位是聚落的骄傲」介绍腔、链底句冗括各修一处。机械层收据：内部/prose-scan-v7.md + 内核 audit AE-PROSE-* 三章全绿。逐处台账见 内部/修订对照表.md。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 6, "ts": "2026-09-17 05:01", "note": "v7 三遍法执行版：声口1/处境1/机味5", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v7 · 三遍法执行版）\n\n> 本版变更：novel-deai 三遍法完整执行（声口 1 / 处境 1 / 机味 5）——删纯告知句「心情很复杂」（内心外化）；拆「海记为什么没事？因为…」自问自答（slop 第4类）；删「比抖更吓人的是」提示性过渡（slop 第3类）；「三天后」孤立时间过渡改事件承载（结构指纹：过渡方式单一）；「悬」字重复、「这位是聚落的骄傲」介绍腔、链底句冗括各修一处。机械层收据：内部/prose-scan-v7.md + 内核 audit AE-PROSE-* 三章全绿。逐处台账见 内部/修订对照表.md。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n", "内部/修订对照表.md": "# 修订对照表 · 前三章终稿（内部留痕，不外发）\n\n> polish 节点 ｜ 三遍法：声口 → 处境 → 机味 ｜ 2026-09-17\n\n## 一、声口修订（人物维度）\n\n| # | 位置 | 原文 | 终稿 | 触发 |\n| --- | --- | --- | --- | --- |\n| 1 | 第1章 雷臂 | 直接口出「我家雷劈桌子」 | 前加演示动作（断掌按蟹壳，崩成八瓣壳肉分离）——雷臂人设=力量外露型，光说不练不合声口 | character·行为佐言 |\n| 2 | 第2章 妈妈 | 「退。一颗都不要。」 | 前置动作「把最后一盒砸回筐里」 | character·妈妈嘴硬心软，话跟动作走 |\n| 3 | 第3章 潮生答「来头」 | 初稿为长解释 | 收敛为「饭勺。」二字 | character·潮生嘴笨人设，长话不会说 |\n\n## 二、处境修订（场景维度）\n\n| # | 位置 | 修订 | 触发 |\n| --- | --- | 对照）\n"}}, {"round": 7, "ts": "2026-09-16T21:07:55.475Z", "note": "submit r8", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（v7 · 三遍法执行版）\n\n> 本版变更：novel-deai 三遍法完整执行（声口 1 / 处境 1 / 机味 5）——删纯告知句「心情很复杂」（内心外化）；拆「海记为什么没事？因为…」自问自答（slop 第4类）；删「比抖更吓人的是」提示性过渡（slop 第3类）；「三天后」孤立时间过渡改事件承载（结构指纹：过渡方式单一）；「悬」字重复、「这位是聚落的骄傲」介绍腔、链底句冗括各修一处。机械层收据：内部/prose-scan-v7.md + 内核 audit AE-PROSE-* 三章全绿。逐处台账见 内部/修订对照表.md。\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 8, "ts": "2026-09-16T21:49:11.937Z", "note": "submit r11", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 9, "ts": "2026-09-16T21:51:08.957Z", "note": "submit r13", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 10, "ts": "2026-09-17 05:51", "note": "", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n", "内部/修订对照表.md": "# 修订对照表 · 前三章终稿（内部留痕，不外发）\n\n> polish 节点 ｜ 三遍法：声口 → 处境 → 机味 ｜ 2026-09-17\n\n## 一、声口修订（人物维度）\n\n| # | 位置 | 原文 | 终稿 | 触发 |\n| --- | --- | --- | --- | --- |\n| 1 | 第1章 雷臂 | 直接口出「我家雷劈桌子」 | 前加演示动作（断掌按蟹壳，崩成八瓣壳肉分离）——雷臂人设=力量外露型，光说不练不合声口 | character·行为佐言 |\n| 2 | 第2章 妈妈 | 「退。一颗都不要。」 | 前置动作「把最后一盒砸回筐里」 | character·妈妈嘴硬心软，话跟动作走 |\n| 3 | 第3章 潮生答「来头」 | 初稿为长解释 | 收敛为「饭勺。」二字 | character·潮生嘴笨人设，长话不会说 |\n\n## 二、处境修订（场景维度）\n\n| # | 位置 | 修订 | 触发 |\n| --- | --- | --- | --- |\n| 4 | 第1章 | 补一句「攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的」 | 处境：面盆必须先有来源——妈妈在礼上卖面，盆才能被鱼掉进去（v8 报告遗漏的前置伏笔） |\n| 5 | 第2章 | 中毒名单加年龄（最老七十三/最小九岁/吃母乳的没事） | 处境：抽象的「三十多人」无体感，具体年龄才有疼感 |\n| 6 | 第2章 | 退订损失具体化（两桌升学酒/三桌寿宴+妈妈数筹码「给鱼算个命」） | 处境：泛写「退订潮」无节目效果 |\n| 7 | 第3章 | 验毒宴加「抬着担架来赴宴」+老太婆哭锅气 | 处境：废土真饭的重量需要身体细节 |\n| 8 | 第3章 | 潮生席间逐链扫「下毒」二字并当面吃第一口 | 处境：能力在场但克制使用（伦理红线 演 而非 说） |\n\n## 三、机味修订（结构维度·AI 痕迹）\n\n| # | 位置 | 修订 | 触发 |\n| --- | --- | --- | --- |\n| 9 | 第1章 | 「湿漉漉，慢悠悠」删「湿漉漉」（叠词三连） | ai-trace·手法配额 |\n| 10 | 第1章 | 「四十年」全章 6 处删至 4 处（台阶/神谕/老人/爸爸——主题位保留） | ai-trace·重复词密度 |\n| 11 | 第1章 | 爸爸夜谈段补「妈妈炖汤/留着下蛋」黑色幽默一拍 | 密度地形：压抑段（爸爸藏鱼）后必须有泄压阀 |\n| 12 | 第2章 | 章末补「鱼打个饱嗝——像在说：快了」 | 章末钩子预告式改造（原版陈述句收尾无钩力） |\n| 13 | 全局 | 「不是……而是……」句式全文 1 处（≤2 配额）；三连排比 0 处；总分总 0 处 | 配额复核 |\n| 14 | 第3章 | 章末「鱼的眼睛里没有眼白，只有一圈一圈的蓝」保留为危险感收口（非总结句） | 无总分总红线 |\n\n## 四、自检声明\n\n三遍法已完成：声口 3 处 / 处境 5 处 / 机味 6 处修订（合计 14 处，逐条见上表）。\n梗点盘点：每章 ≥3 喻（文风档 §六样张级，保留）。\n\n自检：四遍法 声口 0 / 处境 0 / 比喻 5 / 机味 3；覆盖率 对话 47/47 场景 11/11 明喻 13/13 章 3/3；修订率 1.38 处/千字；盲读 5/5 段判人；prose-scan-v8 机械层全绿。\n", "内部/deai-v8-诊断单.md": "# deai-v8 诊断单（novel-deai v2.0 · 四遍法 · 诊断先行）\n\n> 对象：章节正文三章 v7（2178 / 1767 / 1857 字，合计 5802 字）｜轮次性质：回炉轮（第 5 轮同类检查：v4 时停体回修 / v5 / v6 机味回炉 / v7 三遍法之后）\n> 输入：三章全文 + 终稿 v7 + 文风档 v3 + 梗卡 v7 + 断言报告-audit + 修订对照表旧账 + 7 张 rubric 卡（skill v2.0 bind 全读）\n\n## 第一遍 声口校准（覆盖：对话句 47/47 逐句过卡，其中链语/告示/请帖文书体 3 处按本体豁免）\n\n逐句对 `kb/aesthetic/character` 遮名测试 + 文风档 §四声口表。判定摘要：\n\n- 全部对白过遮名三句测试：潮生（短/账本体）、妈妈（金句+生意腔）、爸爸（半截话）、尖嘴哥（见风转舵）、执事（官腔表格词）、鲲崽（吐泡两三字）——声口成立；\n- 心理外化检查：v7 已删「心情很复杂」；本轮无新发现纯告知句；\n- 候选 1 处 → **查无病灶**：ch2「潮生看妈妈的眼神，变了。」——纯告知形态，但为 6 字单句重锤（文风档 §二允许的节拍位，v7 轮同点已判保留），转折功能无可替代 → 保留。\n\n**本遍修订：0 处。**\n\n## 第二遍 处境校准（覆盖：场景 11/11 逐场景三行卡）\n\n- ch1 祭台礼/夜院/床上钩子、ch2 祠堂口/布告栏/灶台/夜米缸、ch3 后巷/验毒宴/散场/夜袭——「知道什么/刚经历什么/想要什么」三行卡逐场景过；\n- 处境真反应密度良好：喂猪试毒（妈妈才干的事）、十七张错别字（账本体反应）、担架赴宴（预期违背）、爸爸攥锅盔埋伏（不知道站了多久）——均成立；\n- 候选 1 处 → **查无病灶**：ch1「台下一片倒吸凉气的声音」的处境合理性（集体震惊节拍）——保留节拍但套话形态问题移交第四遍处置（见 E1）。\n\n**本遍修订：0 处。**\n\n## 第三遍 比喻与意象（覆盖：明喻清点 13/13 逐个四问）\n\n明喻总数 13（ch1 3 / ch2 3 / ch3 7）。配额（metaphor-zh §三）：≤2 处/千字。ch1=1.4 ✓、ch2=1.7 ✓、**ch3=3.8 超配**。域外零命中（全部过通用喻体测试，1 处边缘）。逐个处置：\n\n| # | 位置 | 原文喻体 | 四问判定 | 处置 |\n| --- | --- | --- | --- | --- |\n| E3 | ch3 | 很轻的一口，**像燕子掠过水面** | 删喻句意不损=悬浮；且鱼非燕，轻感由上下文承担 | **删喻** |\n| E4 | ch3 | **像在挑拣什么能吃的** | 鱼吃雾的动作白描可自足；降密度 | **白描化**「挑挑拣拣的」 |\n| E5 | ch3 | 一格一格，**像传讯石过片子** | 「格」分镜自明；传讯石 ch1 已向读者介绍过，无需再比 | **删喻** |\n| E6 | ch3 | 腿肚子里**像塞了两团棉花** | 身体感成立但密度超载；白描不损 | **白描化**「腿肚子软了」 |\n| E7 | ch3 | 腿抖得**像风里的旗** | 通用喻体（换世界仍成立）；破帆=渔村域 | **换域内喻体**「风里的破帆」 |\n| — | ch1 | 笑声跟涨潮一样 / 像嗑瓜子 / 像隔着水面说了句话 | 场景内喻体（渔村域），文风档 §六样张级 | 保留 |\n| — | ch2 | 像按住要跑出来的东西 / 疤像咧开的嘴（命名伏笔）/ 像在说：快了 | 功能性（链机制/疤嘴命名/章末钩） | 保留 |\n| — | ch3 | 抹布擦脑子 / 像废墟海底最深的地方 | 峰值段身体感 / 章末钩+势力伏笔，域内 | 保留 |\n\n**本遍修订：5 处（E3-E7）。ch3 明喻 7→3（1.6/千字 ✓）。**\n\n## 第四遍 节奏去机味（覆盖：五指纹×3 章 + 八维画像逐维 + 黑名单/分级词表逐条）\n\n- 八维画像：3-gram 重复（专名复现为主，无病灶短语）✓；句长抖动（拟声单段/独词句密度好）✓；对白比例 20-30% ✓；情绪地形（吞令/浅尝/夜袭三峰）✓；总分总绝迹 ✓；标点节奏 ✓；\n- 叙事套话黑名单：命中 1 处 → E1；\n- 分级词表：一级/二级/拔高/鸡汤/机器人短语——零命中 ✓；\n- 断言配额预检：不是A是B ch1×2/ch2×1/ch3×1 全在配额内；三连排比 0（价目牌为文书体豁免·定场区外）；突然/仿佛/似乎 0；\n- 候选 3 处 → **修订 3 处**：\n\n| # | 位置 | 原文 | 病灶 | 处置 |\n| --- | --- | --- | --- | --- |\n| E1 | ch1 | 台下一片倒吸凉气的声音 | 套话黑名单·反应套话族（倒吸凉气）；顺手拆一句变两句改句长抖动 | 「台下的抽气声连成一片。」 |\n| E2 | ch1 | 执事的笔，**第二次**掉在了台上 | 指涉落空：全文无第一次掉笔（疑为前版删改残留），首次读者卡壳 | 删「第二次」 |\n| E8 | ch2 | **见看他**，搓着手凑过来 | 语病硬伤（「看见他/一见他」之误） | 「一见他」（与「眼睛不看他」成对照） |\n\n**本遍修订：3 处（E1/E2/E8）。**\n\n## 深度口径\n\n回炉轮下限 ≥1 处/千字：本轮 **8 处 / 5.8 千字 = 1.38 ✓**（声口 0 / 处境 0 / 比喻 5 / 机味 3；声口处境两遍零修订附覆盖律与查无病灶记录，非未扫）。无需收敛声明。\n\n## 梗点存活与钩子复核\n\n- 梗点全存活：器型厨具（错位正经）/ 留着下蛋 / 给鱼算个命 / 灾星鱼掌勺敢吃吗 / 加钱 / 锅盔埋伏——梗失效测试全过（换平实说法情境不成立=梗在干活）；\n- 钩型轮换：ch1 信息反转（鱼说话）→ ch2 悬念（快了）→ ch3 状态改变+危险（鱼醒了）——三连不同型 ✓。\n", "内部/deai-v8-盲读.md": "# deai-v8 盲读报告（first-reader 剖面 · 零上下文切片）\n\n> 方法：v8 终稿每章截 1-2 段（150-300 字，去章节号），以零上下文首读者身份盲读，判「像人写的 / 像 AI 写的」并给依据。执行轮：novel-deai v2.0 §五盲读内环。\n\n## S1（第1章·觉醒段）\n> 头顶那团东西降下来了。不是火。不是雷。是一团蓝的。圆滚滚，慢悠悠。「啪叽。」它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。整个祭台前，静了三息。然后笑疯了。\n\n**判：人。** 依据：句长剧烈抖动（独词句「啪叽」插在两组长句中间）；信息走具象价码（面盆/油花/三息）不走情绪标签；「笑疯了」是市井动词不是修辞。无模板句。\n\n## S2（第1章·夜院段）\n> 妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n**判：人。** 依据：夫妻对话靠动作打断（捅/瞪/咽回去）；笑点长在情境里（下蛋）不是旁白贴梗；拟声单段承节奏。找不出「正确但空转」的句子。\n\n## S3（第2章·喂猪段）\n> 猪吃了三盒，没事。「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。「哐当。」「退。一颗都不要。」潮生看妈妈的眼神，变了。\n\n**判：人。** 依据：决策过程全用动作链上演（喂猪→砸筐→退订），零解释；「哐当」独立成段是活人排版。潮生那句若在 AI 文里会被写成「潮生对母亲刮目相看」——此处只有一个六字节拍。\n\n## S4（第3章·浅尝段，v8 修订后）\n> 尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。就一口。很轻的一口。尖嘴哥整个人僵在原地。「咣当。」手里的秤砣砸在脚面上，他都没觉着疼。……他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n**判：人。** 依据：痛感延迟（砸脚面没觉着疼）是真实 shock 反应；「不撕整本，只撕一页」是主角自己的记账式命名，视角贴死；本段 v8 删了「像燕子掠过水面」后，轻的一口由「就一口。很轻的一口。」的节奏自己扛，读感更冷。\n\n## S5（第3章·夜袭开场）\n> 当夜，三更。院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。网兜落下一半，停了。一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n**判：人。** 依据：悬念靠物件链条（网兜/膏渍/锅盔）不靠氛围词；「不知道站了多久」一句把爸爸的处境（早就防着）全给了；锅盔是废土饮食细节，AI 套话库产不出这种具体的吃食。\n\n## 结论\n\n5/5 段判**人**。本轮无判 AI 段落，无回炉项。备注：修订前第 3 章的明喻密度（7 处/千字 3.8）是全文唯一的「AI 指纹聚集地」（每个动作都配一个比方=统计上的平滑感），已在 v8 比喻遍拆到 3 处/千字 1.6。\n", "内部/prose-scan-v8.md": "# prose-scan v8 收据（对象=终稿 v8 合稿；三连/不是A是B 配额按章计：合并稿计数=三章之和，逐章判定以内核 audit AE-PROSE-* 为准）\n\n\n== projects/p-fq-001/对外交付/02-前三章终稿.md ==\n  [✗超配额] 三连排比(同句)  编一条，念一条，改一条\n  [·计数] 不是A是B ×4(配额2)  不是火。不是 ｜ 不是人念的，是 ｜ 不是仇人。他是 ｜ 不是毒，是\n\n结论：三连排比超配额 1 处需修（配额=每章1处；已计入未判超的自行对照）\n"}}, {"round": 11, "ts": "2026-09-16T22:15:57.422Z", "note": "submit r15", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 12, "ts": "2026-09-16T22:16:07.031Z", "note": "submit r17", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 13, "ts": "2026-09-17 06:16", "note": "", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n", "内部/修订对照表.md": "# 修订对照表 · 前三章终稿（内部留痕，不外发）\n\n> polish 节点 ｜ 三遍法：声口 → 处境 → 机味 ｜ 2026-09-17\n\n## 一、声口修订（人物维度）\n\n| # | 位置 | 原文 | 终稿 | 触发 |\n| --- | --- | --- | --- | --- |\n| 1 | 第1章 雷臂 | 直接口出「我家雷劈桌子」 | 前加演示动作（断掌按蟹壳，崩成八瓣壳肉分离）——雷臂人设=力量外露型，光说不练不合声口 | character·行为佐言 |\n| 2 | 第2章 妈妈 | 「退。一颗都不要。」 | 前置动作「把最后一盒砸回筐里」 | character·妈妈嘴硬心软，话跟动作走 |\n| 3 | 第3章 潮生答「来头」 | 初稿为长解释 | 收敛为「饭勺。」二字 | character·潮生嘴笨人设，长话不会说 |\n\n## 二、处境修订（场景维度）\n\n| # | 位置 | 修订 | 触发 |\n| --- | --- | --- | --- |\n| 4 | 第1章 | 补一句「攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的」 | 处境：面盆必须先有来源——妈妈在礼上卖面，盆才能被鱼掉进去（v8 报告遗漏的前置伏笔） |\n| 5 | 第2章 | 中毒名单加年龄（最老七十三/最小九岁/吃母乳的没事） | 处境：抽象的「三十多人」无体感，具体年龄才有疼感 |\n| 6 | 第2章 | 退订损失具体化（两桌升学酒/三桌寿宴+妈妈数筹码「给鱼算个命」） | 处境：泛写「退订潮」无节目效果 |\n| 7 | 第3章 | 验毒宴加「抬着担架来赴宴」+老太婆哭锅气 | 处境：废土真饭的重量需要身体细节 |\n| 8 | 第3章 | 潮生席间逐链扫「下毒」二字并当面吃第一口 | 处境：能力在场但克制使用（伦理红线 演 而非 说） |\n\n## 三、机味修订（结构维度·AI 痕迹）\n\n| # | 位置 | 修订 | 触发 |\n| --- | --- | --- | --- |\n| 9 | 第1章 | 「湿漉漉，慢悠悠」删「湿漉漉」（叠词三连） | ai-trace·手法配额 |\n| 10 | 第1章 | 「四十年」全章 6 处删至 4 处（台阶/神谕/老人/爸爸——主题位保留） | ai-trace·重复词密度 |\n| 11 | 第1章 | 爸爸夜谈段补「妈妈炖汤/留着下蛋」黑色幽默一拍 | 密度地形：压抑段（爸爸藏鱼）后必须有泄压阀 |\n| 12 | 第2章 | 章末补「鱼打个饱嗝——像在说：快了」 | 章末钩子预告式改造（原版陈述句收尾无钩力） |\n| 13 | 全局 | 「不是……而是……」句式全文 1 处（≤2 配额）；三连排比 0 处；总分总 0 处 | 配额复核 |\n| 14 | 第3章 | 章末「鱼的眼睛里没有眼白，只有一圈一圈的蓝」保留为危险感收口（非总结句） | 无总分总红线 |\n\n## 四、自检声明\n\n三遍法已完成：声口 3 处 / 处境 5 处 / 机味 6 处修订（合计 14 处，逐条见上表）。\n梗点盘点：每章 ≥3 可切片梗点（饭勺认错/器型厨具/雷炒面/神谕零食/灾星鱼/黄字贰号/加钱/种）——超出 ≥1 的最低配额。\n钩型对账：第1章反常 → 第2章悬念 → 第3章危险，无连续同型。\n\n\n---\n\n# 时停体回修记录（v2 · 依据 时停体炼化报告 + 文风档 §十一）\n\n| # | 位置 | 回修 | 触发技法 |\n| --- | --- | --- | --- |\n| 1 | 第1章 | 新增「好消息/坏消息」双段模板（觉醒了/神殿管它叫厨具） | 好消息坏消息模板 |\n| 2 | 第1章 | 新增开场狠话「陈家的种，必须是火」→ 聚落传唱「火没等着端饭碗」 | 黑历史复读 |\n| 3 | 第2章 | 「哐当。」砸筐独立成段 | 拟声单段 |\n| 4 | 第2章 | 皮筋童谣「火没等着端饭碗」（东头孩子编词） | 黑历史复读·变奏 |\n| 5 | 第2章 | 「嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。」 | 自嘲确认句 |\n| 6 | 第2章 | 补疤脸惯犯半句（死驴旧账点过海记的名） | 字数到线+甩锅惯犯逻辑 |\n| 7 | 第3章 | 「咣当。」秤砣独立成段 | 拟声单段 |\n\n## 读者契约回修（v5 · 2026-09-17）\n\n> 触发：用户判词——开篇没交代世界观/背景/主角；需要读者视角评审角色；新设定词必须巧妙说明；需要「写到哪里补到哪里」的 RAG；文风挖掘不够深。\n\n| # | 位置 | 改法 |\n| --- | --- | --- |\n| 1 | 第1章开篇 | 新增定场段：「神明降临第四十年。四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意」——何时+世界规矩两行交齐 |\n| 2 | 第1章 | 新增主角锚定：「陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细」+「是全家算好的账」（谁+想要什么） |\n| 3 | 第1章 | 「思维链供品」首现即巧妙说明：潮生账本体内心解释（发呆数账骂街掐三十息上供，神收念头不收钱） |\n| 4 | 第1章 | 「坏消息」改两层递进（厨具点名→厨具点不了膏厂的火），主角愿望落空闭合定场四问 |\n| 5 | 机制 | flow v2.2.0：S4 六问制，新读者官 first-reader 入 gate-final reviewers；chapter/polish 契约挂定场四问+新词五手法+断层检查 |\n| 6 | 机制 | 世界书纪律第七件：读者认知边界（章账逐章记「读者此刻知道/不知道」）+ 正文驱动补全（写前准入/写中即录/结算落档/断层自检）；名目与黑话增登记台账 |\n| 7 | 去AI味 | 新增 kb/aesthetic/slop-list（OpenAI 官方 8 类禁词+中文映射），polish 扫描；「不是A是B」配额改每千字 ≤1 |\n\n## 机味回炉（v6 · 2026-09-17，用户揪出价目牌三连）\n\n> 承认：v5 是绕过 polish 直接改的文件，未重跑去AI味——被用户抓到。本轮补跑并固化为可复跑工具。\n\n| # | 位置 | 病灶 | 改法 |\n| --- | --- | --- | --- |\n| 1 | 1章 价目牌 | 「献X，得Y。」三连同模板（用户标红） | 改参差：「眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱」（顺手加世情：嗓子最贱） |\n| 2 | 1章 觉醒段 | 「管X叫Y」三连（v5 我新写的） | 拆：「换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。」 |\n| 3 | 1章 吞神谕 | 「当着×3」三连（扫描器抓到） | 改双锤短句：「全村都在看着的时候…／执事看着。他爸妈也看着。」 |\n| 4 | 1章 米缸 | 「飘过×3」三连（旧稿遗留） | 换动词拆等长：「挤出来／过…没停／掠过／最后贴上」 |\n| 5 | 1章 炖汤 | 「像是…又像是」双喻 | 「半是抗议「炖汤」二字，半是记仇」 |\n| 6 | 3章 验毒宴 | 「不是A是B」第3处超配额 | 「饭他放心，人不放心：」 |\n| 7 | 机制 | 病根=v5 绕过 polish | 新增 tools/prose-scan.py 机械配额门（三连排比≤1/章、不是A是B≤2/章、slop词计数）；文书体豁免条件
