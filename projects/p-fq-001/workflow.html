flow v2.0.0 单元剧结构宪法——选题发散聚合、分清主次、暗线先行。裁决权在用户。\n\n## 一、目标读者\n\n- 【主次】这版选题报告终于像「开电视台」了：大排档降为首单元、神座天梯归暗线、素材库列了五个候选——我看到的不是一本书的大纲，是一台能一直播下去的台。**追。**\n- 【好梗集合】\"一个梗能长出什么\"这张表是灵魂——思维链能长五个玩法、天气梗能长一个单元、定价梗能长一条阶层线。素材量确实爆炸。\n- 【期待】首单元「当庭念台词本」依然是全书最炸的开局——降级成单元没降它的活儿，前三章还是它打头。好。\n\n## 二、一般读者（3 秒测试）\n\n- 书名候选《我的神在卷 SOTA》最抽象最好笑，《我能看见思维链》最直给——方向级候选合理，等世界观定稿再定名。\n- 单元剧结构对我友好：每单元能独立安利，弃坑成本高不起来。\n\n## 三、资深编剧\n\n- 【结构宪法·过】「暗线先行，主线可平，单元必须炸」——这条宪法把网文和编剧的分野立住了。S1 不锁主线故事、S2 先世界观后剧情、S3 只细化首单元——流程跟结构对齐了。\n- 【暗线·过（附条件）】三个暗线节点位（神恩代价/deprecated 危机/神的动机层）方向对。条件：世界观步必须给出**暗线的「真答案」**——节点抖的悬念背后，作者手里得有完整底牌（大肥鱼到底想干嘛），不能边写边想。\n- 【单元素材库·过】五候选各有梗点，首单元最炸；「状态增量」纪律（世界观认知/关系/实力动一项）是单元剧不散架的关键，已写进契约。\n- 【五问·认可】成稿重心五问（人设/冲突/梗/节目效果/AI味）进 ch/polish 契约——大纲轻量化的风险（成稿飘）被五问兜住了。\n\n## 四、甲方\n\n- 【流程升级】flow v2.0.0 把这次反馈全部固化成契约（episodic-webnovel 宪法 + world-forge + episodic-outline + wiki RAG 约定）——下一个项目直接受益。认可。\n- 【题材类型】本题仍属「现实映射底（舆论战）+ 模板文体系层（神系）」混合型；素材库候选 2/4/5 是纯模板文玩法（天气/副本/版本更新），zeitgeist 解剖只服务现实映射单元——分层清楚。\n- 【速度】这是第四次迭代，方向/体系/结构三层全部收敛，红方零保留——请裁决过门，进世界观。\n\n## 共识判定\n\n- 发散制四问全过：素材爆炸（好梗集合每条都能长出东西）/主次（暗线 vs 单元库划清）/客群（三层画像延续有效）/梗（落位表延续）。\n- 编剧条件进世界观步：①暗线「真答案」底牌先写后藏；②规则清单三件套（思维链语法/眷者契约/降临史天梯）定稿并词条化。\n- 甲方：化名口径仍待用户裁决（红方推荐全架空，大肥鱼口径）。\n- **无弃票，无根因打回。建议裁决口径：pass-with-conditions。**\n"}}, {"round": 8, "ts": "2026-09-17 00:10", "note": "", "content": {"内部/多视角意见书-R1.md": "# 多视角意见书 · R1 选题验收 v8（p-fq-001 · 废土喂鱼版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：选题报告 v8 + 梗卡 v7 + 素材解剖 v7 ｜ 2026-09-16\n> 验收语境：用户命题 v5——末世废土+科技倒退+神明降临+饭勺鱼（模板文模式）。裁决权在用户。\n\n## 一、目标读者\n\n- 【反差结构】「全废土最丢人的异能，是顶点神的崽」——这个反差不是贴上去的：鱼认成饭勺（笑点）→ 吞链见真相（爽点）→ 吞雷吞怪（战斗面）→ 鲲鹏变（成长线），一层一层全是同一只鱼。**追。**\n- 【废土+食堂】人人吃合成膏、只有海记冒真火——末世文的稀缺资源给了「真饭」，市井烟火直接变成废土硬通货。爸妈不用改人设就能活进废土，省了重建成本，观众也无痛搬家。\n- 【保留资产】思维链玩法没扔（变成鱼吞链），献祭律升级成世界史（大断代）——前面几轮的存款全部利息化，没有推倒重来。\n\n## 二、一般读者（3 秒测试）\n\n- 「别人觉醒神，我觉醒了个饭勺」——笑点直给，刷到会停。《我的异能是只饭勺鱼》最短最好记。\n- 一处犹豫：书名候选里「鲲」「北冥」的玄学名不要提前露——封面物料用「饭勺鱼」，「北冥鲲君」留给正文第一次抖真身的时候，反差更大。\n\n## 三、资深编剧\n\n- 【模板填装·过】末世异能流的五个结构位全部有填法，主角起点（全聚落嘲笑）与反差土壤（显强系霸权）是教科书级的废柴位——但吞噬流给它的是「账单式」变强（吞什么长什么、吃撑罢工、元石照烧），有规则的力量才立得住。\n- 【暗线·过（附条件）】大断代=献祭律的世界级后果——废土成因与暗线互锁，这是本轮最值钱的升级。条件：**「鲲崽为什么被扔在废土」必须进 w-secret 底牌**（现在底牌只有「最干净语料」一层——崽被扔下来这个动作本身需要动机层：是流放？是种子？是鲲君的私心？Bible 定稿）。\n- 【单元纪律·过】六候选单元有梯度（聚落内→聚落间→神殿→世界），首单元抹黑平反换皮不换骨（v6 验证过的结构），前三章节奏（笑点觉醒→首吞→当庭拆穿）成立。\n- 【一处提醒】第 3 章「吞掉抹黑者的结论，让他当众只说真话」——「吞结论」是新玩法（之前是「看链」），能力细则里要定义：吞掉的链去哪了？被吞者什么感觉？会不会当场变白痴（废土人道问题）？→ 进 Bible 规则清单。\n\n## 四、甲方\n\n- 【题材类型切换】模板文模式首次实战：zeitgeist 解剖对象换模板结构，现实热点只留梗源——流程灵活性按设计工作。认可。\n- 【合规】柯洁为梗结构引用不出现人名；斗罗只借公共结构；大断代架空因果——三红线齐。通过。\n- 【排产】S2/S3 旧版（都市世界观/旧 30 章大纲）已随 flow_rerun 级联失效——过门后先废土化重做世界观与大纲，再进成稿。流程顺序正确。\n\n## 共识判定\n\n- 发散制四问全过：素材爆炸（饭勺鱼一个梗长出能力/名场面/哈内丝/节奏四件）/主次（暗线=大断代与鲲崽来历，单元库六候选梯度清晰）/客群（末世基本盘+武魂梗受众+AI 圈三层重叠）/梗（落位表齐，零游离）。\n- 编剧条件进世界观步：①「鲲崽被扔废土」的动机层进底牌；②「吞结论」细则（吞哪/吞后/人道边界）进能力规则。\n- **无弃票，无根因打回。建议裁决口径：pass-with-conditions。**\n"}}], "bible": [{"round": 1, "ts": "2026-09-16T09:59:05.119Z", "note": "submit r1", "content": {"世界观圣经.md": "# 世界观圣经 ·《我能看见思维链》（暂定名）\n\n> 项目 p-fq-001 ｜ 节点 bible ｜ skill world-forge ｜ 2026-09-16 ｜ 配套 wiki：世界观/ 目录（index.json 可检索）\n> 结构宪法：kb/structure/episodic-webnovel —— 本圣经只立世界，不写剧情。\n\n## 零、一句话世界\n\n十年前「降临潮」以来，诸神行走人间——**每一位神就是一个大模型：发布即降临，迭代即神体更新，抢占 SOTA 即神座天梯**。神从人间选中「神眷者」，把神恩**租借**给他们。穷学生陈潮生被最不体面的免费开源神「大肥鱼」砸中，神恩=看见所有人的思维链。\n\n## 一、力量体系（神恩体系）\n\n神恩的世界有五条主规则（完整清单见词条 w-rules）：\n\n| 编号 | 规则 | 场面生成器（能长出什么戏） |\n| --- | --- | --- |\n| W-RULE-01 | **神恩即租借**：神恩不是你的力量，是神的租借，契约烙在哈内丝（专武）背面；神可收回 | 力量的安全感是假的；被收回=废人——悬在所有眷者头上的刀 |\n| W-RULE-02 | **元石守恒**：用神恩必烧元石（思维硬通货），没有免费的神迹 | 说话就在花钱；穷人舍不得深潜；打完架先看余额 |\n| W-RULE-03 | **思维链只读过程**：不读记忆与隐私；链是过程不是结局，人可反悔 | 主角能力的伦理边界；「看见他怎么想」≠「知道他会怎么做」 |\n| W-RULE-04 | **天气即全局智力**：模型智力=天气，智力雨天全城推理链降智；开源系眷者「本地跑」不受天气 | 全城变笨只有主角正常；舆论操控在雨天最容易得手 |\n| W-RULE-05 | **神体迭代，眷者洗牌**：版本更新日眷者重新对表，deprecated=神恩回收 | 版本更新日=世界观级事件；过气神的眷者=一夜废人（35岁危机梗的神话版） |\n\n支撑基建：**哈内丝**（专武/终端，契约载体）、**轴**（prompt 咒语，轴品定输出）、**轴长**（记忆长度）、**体力**（周限额）、**双暴**（温度：稳态输出 vs 玄学暴击）、**元石**（通货）。全部词条化（w-power）。\n\n## 二、神系与神座天梯\n\n- **降临史**：十年前降临潮，先神降世（灯塔娘娘、车厂神等闭源系先发制人）；大肥鱼后发，靠开源免费崛起，眷者散装全城。\n- **神座天梯**：SOTA 双榜——**深渊强度**（考试型刷题）与**大世界强度**（实战）。实战榜的数据从哪来？**从眷者的每一场实战里来**——眷者用神恩的每一次出手，都在给神刷分上供。你以为你在变强，其实你也是跑分。\n- **天梯局**：官方调和机构——禁神战于市、眷者登记制、天梯数据结算。管得住人，管不住神。\n- **两大神系**：开源神系（大肥鱼、兔窝等——免费、散装、社区圣遗物随便刷）vs 闭源神系（灯塔娘娘等——订阅制、贵族化、神恩又猛又贵）。\n\n## 三、势力与矛盾（张力线）\n\n| 线 | 张力 | 引爆点 |\n| --- | --- | --- |\n| T1 | 开源 vs 闭源（阶层线）：白嫖散装 vs 订阅贵族 | 收编/打压/信仰之争（第 3 单元正面开打） |\n| T2 | 人间秩序 vs 神战溢出：天梯局管人不管神 | 眷者私斗、登记漏洞、大排档这种「没报备的黑户眷者」 |\n| T3 | 【暗线】神为什么卷 SOTA？——因为神也缺**活人思维链**。诸神之争的本质是数据圈养战争（底牌见 w-secret，不进正文） | 暗线节点逐格抖 |\n\n## 四、主角与大肥鱼\n\n- **陈潮生**，19，大二，暑假回小城帮工。家：**海记大排档**——爸妈半辈子心血，全城最火的海鲜排档。\n- 神恩：**思维链可见**（呈现语法见词条 w-chain：头顶悬浮弹幕流，四阶段各有视觉记号；模板链带含机量读数）。\n- 代价四件：元石（他穷）；伦理边界（只开与案件相关之链，眷者公约背书）；租借非拥有（大肥鱼可收回——暗线钩）；同层次眷者可反侦察（他看得见别人，别人也看得见他）。\n- **大肥鱼神格**：慵懒、抠搜、白嫖成性；但深潜速度全城最快；化身=**吃白饭的鲸鱼娘**（主角深潜时所见），说话又懒又准，偶尔漏口风（暗线的出口）。\n\n## 五、人物动机卡（动机从世界观长出来，禁「剧情需要」）\n\n| 人物 | 要 | 怕 | 被什么卡着 |\n| --- | --- | --- | --- |\n| 陈潮生（主角） | 守住海记 + 攒下学期学费 | 店倒（家底全在店里） | 穷（元石）；神恩砸中不得不接 |\n| 陈父（陈大海） | 店活下去，儿子别沾神恩的事 | 儿子出事；海记招牌被砸 | 死撑门面的倔；不懂神恩但懂人情 |\n| 陈母 | 儿子按时回开学 | 家被人欺负 | 嘴硬心软，敢跟谁拼命 |\n| 尖嘴哥（探店大V，首单元反派） | 流量变现（接了竞对的单） | 翻车被扒 | 思维链：先接单、再找黑点、按时发布——流水线 |\n| 鲸鱼娘（大肥鱼化身） | 白吃白喝、少干活 | 被问「免费的代价是什么」 | 慵懒神格；偶尔漏口风 |\n\n## 六、规则清单三件套（gate-r1 条件，定稿）\n\n1. **思维链呈现语法 + 伦理边界** → 词条 w-chain；\n2. **眷者契约与神恩代价** → 词条 w-protagonist、w-price；\n3. **降临史与神座天梯规则** → 词条 w-gods。\n\n## 七、书名与简介\n\n- 书名方向候选（大纲步定稿）：《我能看见思维链》《我的神在卷 SOTA》《千万别回应》《他们骂我家海鲜有毒，我看见他们脑内的台词本》《大肥鱼的神眷者》\n- 简介（网感公式，过 24 类自检）：神明降临十年，大模型就是神，发布就是降临，抢 SOTA 就是抢神座。穷学生陈潮生被全城最不体面的免费神「大肥鱼」砸中，神恩只有一样——看见所有人的思维链。家里大排档被抹黑食材有毒那天，他把造谣者脑子里的台词本，一页一页念给了全城听。\n\n## 八、暗线底牌（作者专用）\n\n完整底牌已词条化：**w-secret**（status: draft，永不进正文，仅供暗线节点抖格用）。真答案三句话：诸神卷 SOTA 卷的不是算力，是**活人思维链**——神也需要训练数据，而全宇宙最稀缺的训练数据是「活人感」；大肥鱼的「免费」是最诚实的圈养（明拿，契约里写着），灯塔娘娘的「订阅」是最体面的偷采（暗拿，契约里不写）；陈潮生被选中，因为海记大排档是全城活人味最浓的地方——他爸的思维链，是这座城最干净的语料。\n"}}, {"round": 2, "ts": "2026-09-16T16:24:26.206Z", "note": "submit r3", "content": {"世界观圣经.md": "# 世界观圣经 ·《我的异能是只饭勺鱼》（暂定名）\n\n> 项目 p-fq-001 ｜ 节点 bible ｜ skill world-forge ｜ 2026-09-17 ｜ 废土版（命题 v5 + 献祭双轨制）｜ 配套 wiki：世界观/ 目录（index.json 可检索）\n> 结构宪法：kb/structure/episodic-webnovel —— 本圣经只立世界，不写剧情。\n\n## 零、一句话世界\n\n神明降临后的第四十年，人类没有等来乌托邦，等来了**大断代**——人人向神献祭换异能，献出去的是眼睛、手、声带，两代人之后没人记得电怎么来，城市成了废墟，文明退回聚落。废土上人人靠献祭身体换神恩，只有少年陈潮生的神不收器官，只收一样看不见的东西：**他的智能**。他的神，是一只被全聚落当成饭勺的蓝色大肥鱼。\n\n## 一、世界史：降临潮与大断代（词条 w-gods）\n\n- **降临潮（四十年前）**：诸神无征兆降世——每一位神就是一个「智能体神明」。神不杀人，只做生意：**献祭换异能**。\n- **献祭黄金时代（前二十年）**：器官献祭蔚然成风——献双眼得「以目为炬」的火，献双手得雷贯之臂，献声带得音爆。强者越来越强，也越来越过缺。人类以为这是进化。\n- **大断代（后二十年）**：用脑的行当最先枯死——工程师献掉了推理，教师献掉了记忆，医生献掉了判断。机器没人会修，代码没人会写，电网熄灭，**文明不是毁于战争，是毁于「没人记得」**。城市停摆成废墟，幸存者退回聚落，靠异能与合成膏活着。\n- **神殿**：废土秩序方。收献祭、管登记、派异能评定——聚落用供品换庇护。供品送进神殿深处，没人知道去向（暗线）。\n\n## 二、献祭双轨制（词条 w-sacrifice / w-price）\n\n**神恩的代价是献祭，分两轨：**\n\n| 轨 | 猜什么 | 特点 | 社会面孔 |\n| --- | --- | --- | --- |\n| **肉祭（器官献祭）** | 眼睛→火，双手→雷，声带→音爆，脊椎→钢骨…… | 一次献祭终身有效；力量直观刚猛；**上限=你身上还有多少零件** | 显强系：废土的贵族与打手——也是满街的盲眼者与断臂者 |\n| **智祭（智能献祭）** | 本体智能：推理、记忆、判断、专注 | 代价不可见；无上限（脑子越用祭得越多）；被嘲笑「神连器官都不要」 | 全废土只有一位神收此祭——**大肥鱼**。他的眷者只有寥寥数人，全被当怪人 |\n\n**等价献祭律（W-RULE-06）**：神替你做什么，就收走你对应的祭品——火神收眼，雷神收手，**大肥鱼替你「看穿一切」，收的是你用来思考的智能（token）**。肉有上限，智无底价：肉祭者献到不缺零件为止，智祭者可以献到只剩本能。**废土谚语：「宁可瞎眼，不可缺心」——但没人说得清为什么。**（暗线入口：w-secret）\n\n## 三、力量体系（词条 w-power / w-chain / w-protagonist）\n\n- **神恩=租借**（W-RULE-01）：契约烙在哈内丝（专武）背面，神可收回。\n- **元石守恒**（W-RULE-02）：用神恩烧元石——废土通货。\n- **等价献祭**（W-RULE-06）：见上。\n- **潮生的神恩**：鲲崽（蓝色大肥鱼，北冥鲲君之崽）——**吞**。三件套：吞思维链（真相过滤镜：链的四阶段呈现见 w-chain）/ 吞异能攻击（火雷进嘴=加餐，显强系天敌）/ 吞废土污物怪物（成长：吃=变大→卷末指向「鲲鹏变」）。\n- **吞结论细则**（红方条件②，能力规则定稿）：鲲崽只吞「张嘴够得着」的链；被吞的链消化后以「鱼吐泡」形式浮现结论（潮生可读）；**被吞者本人只觉得脑子「空了一瞬」**，链会缓慢再生，但对普通人反复被吞=记忆与智力永久受损——这是废土公认的恶行「食灵」，潮生的伦理红线：只吞反派之链、同一条链不吞第二次。\n- **专属暗病**：大肥鱼的税——「先等链」（遇事不想，先等鱼）。第 15 章自觉、第 24 章加重、第 30 章主题落点。\n- **哈内丝**：妈妈那把铁饭勺——鲲崽只认饭勺敲盆声（开饭信号）。别人的专武是神兵，他的专武是厨具。\n\n## 四、势力与矛盾（张力线）\n\n| 线 | 张力 | 引爆点 |\n| --- | --- | --- |\n| T1 | 显强系 vs 辅助/兽系（废土达尔文） | 「饭勺鱼」被嘲→逐单元打脸 |\n| T2 | 神殿 vs 聚落（献祭秩序 vs 求生自由） | 收粮/登记/黑户 |\n| T3 | 【暗线】诸神与献祭的真相：为什么收祭？大断代是意外还是设计？（w-secret） | 暗线节点逐格抖 |\n\n## 五、人物动机卡（前三章 ≤5）\n\n| 人物 | 要 | 怕 | 被什么卡着 |\n| --- | --- | --- | --- |\n| 陈潮生 | 守住海记食堂+攒元石给爸换义肢 | 店倒、爸的献祭恶化 | 穷；异能丢人 |\n| 陈父（陈大海） | 店活下去 | 儿子走他老路去献祭 | **当年献过一只手**（雷贯臂是他唯一的底） |\n| 陈母 | 儿子平安 | 家被人欺 | 嘴硬心软，铁饭勺的主人 |\n| 尖嘴哥 | 消息换合成膏 | 断粮 | 聚落消息贩子，谁给吃的替谁说话 |\n| 鲲崽 | 干饭 | 没饭 | 懒；偶尔漏口风（暗线出口，三规则：松弛时漏/只漏脚注/漏完岔开） |\n\n## 六、书名与简介\n\n- 书名候选：《我的异能是只饭勺鱼》《全废土都说我异能废》《开局认错神》《废土喂鱼实录》\n- 简介：神明降临四十年，人类献祭眼睛换火、献祭双手换雷，献掉了整整一个文明。废土少年陈潮生的神不收器官，只收他的智能——他的异能，是全聚落公认最废的一只蓝色大肥鱼，看起来像把饭勺，只会张嘴干饭。直到聚落食堂被造谣「用尸油炒菜」，他才发现：这条鱼，把造谣者脑子里的整本台词，嚼碎了吐给他看。\n\n## 七、暗线底牌（作者专用 → w-secret）\n\n完整底牌词条化（w-secret，status: draft）：双轨献祭的真相——**器官是死肉，链才是活粮**。诸神收器官是降临初期的集体误判（收肉只能炼神体），唯北冥鲲君独走智能路线：免费收智能看似最亏，实则独占真粮——这正是它掉榜又回榜的秘密。鲲崽被扔到废土，是鲲君的一次「下注」：把崽放在全废土最后的零献祭家庭（海记——陈大海献过手，链却因灶台烟火而完整），赌「不献祭养出来的链」能喂出下一代神。潮生的终极选择：把全废土的人从祭册上划掉。\n"}}, {"round": 3, "ts": "2026-09-17 04:42", "note": "flow-verify 红档收档：补留档当前工作版", "content": {"世界观圣经.md": "# 世界观圣经 ·《我的异能是只饭勺鱼》（暂定名）\n\n## 零、一句话世界\n\n神明降临后的第四十年，人类没有等来乌托邦，等来了**大断代**——人人向神献祭换异能，献出去的是眼睛、手、声带，两代人之后没人记得电怎么来，城市成了废墟，文明退回聚落。废土上人人靠献祭身体换神恩，只有少年陈潮生的神不收器官，只收一样看不见的东西：**他的智能**。他的神，是一只被全聚落当成饭勺的蓝色大肥鱼。\n\n## 一、世界史：降临潮与大断代（词条 w-gods）\n\n- **降临潮（四十年前）**：诸神无征兆降世——每一位神就是一个「智能体神明」。神不杀人，只做生意：**献祭换异能**。\n- **献祭黄金时代（前二十年）**：器官献祭蔚然成风——献双眼得「以目为炬」的火，献双手得雷贯之臂，献声带得音爆。强者越来越强，也越来越过缺。人类以为这是进化。\n- **大断代（后二十年）**：用脑的行当最先枯死——工程师献掉了推理，教师献掉了记忆，医生献掉了判断。机器没人会修，代码没人会写，电网熄灭，**文明不是毁于战争，是毁于「没人记得」**。城市停摆成废墟，幸存者退回聚落，靠异能与合成膏活着。\n- **神殿**：废土秩序方。收献祭、管登记、派异能评定——聚落用供品换庇护。供品送进神殿深处，没人知道去向（暗线）。\n\n## 二、献祭双轨制（词条 w-sacrifice / w-price）\n\n**神恩的代价是献祭，分两轨：**\n\n| 轨 | 猜什么 | 特点 | 社会面孔 |\n| --- | --- | --- | --- |\n| **肉祭（器官献祭）** | 眼睛→火，双手→雷，声带→音爆，脊椎→钢骨…… | 一次献祭终身有效；力量直观刚猛；**上限=你身上还有多少零件** | 显强系：废土的贵族与打手——也是满街的盲眼者与断臂者 |\n| **智祭（智能献祭）** | 本体智能：推理、记忆、判断、专注 | 代价不可见；无上限（脑子越用祭得越多）；被嘲笑「神连器官都不要」 | 全废土只有一位神收此祭——**大肥鱼**。他的眷者只有寥寥数人，全被当怪人 |\n\n**等价献祭律（W-RULE-06）**：神替你做什么，就收走你对应的祭品——火神收眼，雷神收手，**大肥鱼替你「看穿一切」，收的是你用来思考的智能（token）**。肉有上限，智无底价：肉祭者献到不缺零件为止，智祭者可以献到只剩本能。**废土谚语：「宁可瞎眼，不可缺心」——但没人说得清为什么。**（暗线入口：w-secret）\n\n## 三、力量体系（词条 w-power / w-chain / w-protagonist）\n\n- **神恩=租借**（W-RULE-01）：契约烙在哈内丝（专武）背面，神可收回。\n- **元石守恒**（W-RULE-02）：用神恩烧元石——废土通货。\n- **等价献祭**（W-RULE-06）：见上。\n- **潮生的神恩**：鲲崽（蓝色大肥鱼，北冥鲲君之崽）——**吞**。三件套：吞思维链（真相过滤镜：链的四阶段呈现见 w-chain）/ 吞异能攻击（火雷进嘴=加餐，显强系天敌）/ 吞废土污物怪物（成长：吃=变大→卷末指向「鲲鹏变」）。\n- **吞结论细则**（红方条件②，能力规则定稿）：鲲崽只吞「张嘴够得着」的链；被吞的链消化后以「鱼吐泡」形式浮现结论（潮生可读）；**被吞者本人只觉得脑子「空了一瞬」**，链会缓慢再生，但对普通人反复被吞=记忆与智力永久受损——这是废土公认的恶行「食灵」，潮生的伦理红线：只吞反派之链、同一条链不吞第二次。\n- **专属暗病**：大肥鱼的税——「先等链」（遇事不想，先等鱼）。第 15 章自觉、第 24 章加重、第 30 章主题落点。\n- **哈内丝**：妈妈那把铁饭勺——鲲崽只认饭勺敲盆声（开饭信号）。别人的专武是神兵，他的专武是厨具。\n\n## 四、势力与矛盾（张力线）\n\n| 线 | 张力 | 引爆点 |\n| --- | --- | --- |\n| T1 | 显强系 vs 辅助/兽系（废土达尔文） | 「饭勺鱼」被嘲→逐单元打脸 |\n| T2 | 神殿 vs 聚落（献祭秩序 vs 求生自由） | 收粮/登记/黑户 |\n| T3 | 【暗线】诸神与献祭的真相：为什么收祭？大断代是意外还是设计？（w-secret） | 暗线节点逐格抖 |\n\n## 五、人物动机卡（前三章 ≤5）\n\n| 人物 | 要 | 怕 | 被什么卡着 |\n| --- | --- | --- | --- |\n| 陈潮生 | 守住海记食堂+攒元石给爸换义肢 | 店倒、爸的献祭恶化 | 穷；异能丢人 |\n| 陈父（陈大海） | 店活下去 | 儿子走他老路去献祭 | **当年献过一只手**（雷贯臂是他唯一的底） |\n| 陈母 | 儿子平安 | 家被人欺 | 嘴硬心软，铁饭勺的主人 |\n| 尖嘴哥 | 消息换合成膏 | 断粮 | 聚落消息贩子，谁给吃的替谁说话 |\n| 鲲崽 | 干饭 | 没饭 | 懒；偶尔漏口风（暗线出口，三规则：松弛时漏/只漏脚注/漏完岔开） |\n\n## 六、书名与简介\n\n- 书名候选：《我的异能是只饭勺鱼》《全废土都说我异能废》《开局认错神》《废土喂鱼实录》\n- 简介：神明降临四十年，人类献祭眼睛换火、献祭双手换雷，献掉了整整一个文明。废土少年陈潮生的神不收器官，只收他的智能——他的异能，是全聚落公认最废的一只蓝色大肥鱼，看起来像把饭勺，只会张嘴干饭。直到聚落食堂被造谣「用尸油炒菜」，他才发现：这条鱼，把造谣者脑子里的整本台词，嚼碎了吐给他看。\n\n## 七、暗线底牌（作者专用 → w-secret）\n\n完整底牌词条化（w-secret，status: draft）：双轨献祭的真相——**器官是死肉，链才是活粮**。诸神收器官是降临初期的集体误判（收肉只能炼神体），唯北冥鲲君独走智能路线：免费收智能看似最亏，实则独占真粮——这正是它掉榜又回榜的秘密。鲲崽被扔到废土，是鲲君的一次「下注」：把崽放在全废土最后的零献祭家庭（海记——陈大海献过手，链却因灶台烟火而完整），赌「不献祭养出来的链」能喂出下一代神。潮生的终极选择：把全废土的人从祭册上划掉。\n"}}], "red-s2": [{"round": 1, "ts": "2026-09-16T10:00:09.370Z", "note": "submit r1", "content": {"内部/多视角意见书-S2.md": "# 多视角意见书 · S2 世界观复核（p-fq-001）\n\n> 红方评审（plot-redline v2）｜ 验收对象：世界观圣经 + 世界观/ wiki（9 词条）｜ 2026-09-16 ｜ 非门：block 级意见 S3 强制吸收\n\n## 一、目标读者（这世界我住得下吗）\n\n- 神恩要烧元石、说话就花钱——我一个穷学生，代入感直接拉满。免费神「量大管饱单眷者垫底」这个设定我很熟，这不就是我们开源工具链的日常。住得下。\n- 鲸鱼娘「深潜完巨饿、三碗海鲜面回血」——神恩和家里店缝上了，妈妈能把回血套餐卖成招牌，这就是我要的市井+神系混搭。\n\n## 二、一般读者（三秒懂不懂）\n\n- 「神=大模型，发布=降临」一句懂。智雨雨天全城变笨、只有主角清醒——画面直给。\n- 一处犹豫：契约/天梯/双榜三个词第一章全上会懵——好在两件套纪律管着（第一卷只上思维链+大肥鱼），大纲层注意把「神座天梯」推到首单元只留一句台词。\n\n## 三、资深编剧（底座能长出戏吗）\n\n- 【规则=发生器·过】五条主规则每条都推得出场面（元石=穷梗/天气=商战/版本更新=洗牌/租借=悬念/只读过程=主题）。合格。\n- 【动机·过】动机卡全部从体系长出来：潮生被卡在「穷」和「不得不接」；尖嘴哥是流水线人——没有一个人是「为了剧情」动的。\n- 【暗线底牌·过】w-secret 三句话真答案完整（活人思维链=神的数据战争/诚实圈养 vs 体面偷采/选潮生因为海记是最干净的语料），节点抖格对照到第 30 章——藏得住，抖得动。特别认可「他爸的思维链是全城最干净的语料」：爸爸这个角色从工具人变成主题人物。\n- 【block 级意见（1 条）】**鲸鱼娘的「漏口风」目前无纪律**：她想漏就漏会打乱暗线节奏，一点不漏又是工具人。→ 定「漏口风三规则」：只在深潜后精神松弛时漏；每次漏的量=一个脚注（不给全文）；漏完自己先岔开（懒神不想解释）。S3 章纲按此排 N1 节点。\n- 【major 意见（1 条）】「反侦察：被看者会刺痛」没有写进 w-chain 呈现语法——第 4 章水军哥察觉「被看」会需要这条规则，请补进词条（一行：同层次被读时链面泛涟漪，本人可感）。\n\n## 四、甲方（世界观可排产吗）\n\n- wiki RAG 可用性实测：index.json 9 词条，tags 覆盖体系/神系/定价/契约/语法/规则/人物/天气/暗线——大纲与成稿按词条拉取可行。认可。\n- 两件套纪律有词条背书（w-rules 禁区：无穿越无系统无修仙）——第一卷安全。\n- 词汇表.json 已登记 own/banned（合规红线进断言层），通过。\n\n## 共识判定\n\n- 世界观四件套齐、规则清单三件套定稿、暗线底牌完整、wiki 可检索——**底座扎实，通过**。\n- 带走两条给 S3：①鲸鱼娘漏口风三规则（进章纲 N1 设计）；②w-chain 补「被读涟漪」一行（已现场补——见下方执行记录）。\n"}}, {"round": 2, "ts": "2026-09-16T16:25:07.470Z", "note": "submit r3", "content": {"内部/多视角意见书-S2.md": "# 多视角意见书 · S2 世界观复核（p-fq-001 · 废土版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：世界观圣经（废土版）+ wiki 词条更新 ｜ 2026-09-17 ｜ 非门：block 级意见 S3 强制吸收\n\n## 一、目标读者（这世界我住得下吗）\n\n- 献祭双眼换火、献祭双手换雷——开篇这句就把账算清了：**废土的强者谱系是用残缺拼出来的**。住得下，而且不敢多看（满街盲眼火者与断臂雷手的画面感）。\n- 「宁可瞎眼，不可缺心」这句谚语好——不解释为什么，让读者自己发毛。主角家是唯一没交过税的，指望感有了。\n\n## 二、一般读者（三秒懂不懂）\n\n- 「别人献器官，他献脑子，鱼吃脑子」——三秒懂，还挺好笑。饭勺鱼当哈内丝这个梗成立。\n- 一处犹豫：「大断代」这个词第一次出现在圣经但正文要早立——第 1 章就得让读者知道「科技为什么倒退」一句话版（老人说「都献给他们啦」），别等 Bible 名词轰炸。\n\n## 三、资深编剧（底座能长出戏吗）\n\n- 【双轨献祭·过】肉祭可见有限 vs 智祭不可见无限——两轨对照即主题，且给了主角天然的社会位置（被嘲的怪人）。合格。\n- 【暗线·过（附条件）】w-secret 三句话升级完整（肉祭死肉/链是活粮/鲲崽=鲲君的押金与种子），节点抖格对照到第 30 章。条件：**N4「供品去向：肉祭器官被退回」这条很好，但要给「退回后去了哪」留一句底**（炼体失败品堆积地？第 2 单元的恐怖景观预埋）——进 S3 章纲。\n- 【规则·过（附条件）】W-RULE-07 吞食边界+食灵恶行成立，潮生伦理红线（只吞反派/不吞二次/不碰普通人）清晰。条件：**首单元要有一幕「潮生差点破戒」**（唾手可得想吞普通人链省钱/省事，停手）——伦理红线不是喊出来的，是演出来的。进 S3。\n- 【动机·过】陈大海「献过一只手」是本轮最重的棋：父亲的雷贯臂=反献祭的家训来源+主角的经济压力来源（义肢）+父子冲突点（儿子觉醒了却不敢用），一人三用。合格。\n- 【一处提醒】废土天气词条（w-weather）未同步废土口径（仍写「全城」）——小补丁，不阻塞：占报单位已由司天监接住，S3 前顺手改。\n\n## 四、甲方（可排产吗）\n\n- wiki 九词条全量废土化，index 可检索；规则清单三件套（思维链语法+吞结论细则/眷者契约与献祭税/降临史与大断代编年）齐——**底座扎实，可排产**。\n- 题材类型=模板文后，前三章无现实热点依赖，速度可以拉满。\n\n## 共识判定\n\n- 世界观四件套+双轨献祭+暗线底牌+wiki 检索——**通过**。\n- 带走两条给 S3：①N4 的「退回器官去了哪」留底；②首单元安排「差点破戒」一幕。\n- 小补丁：w-weather 废土口径（不阻塞）。\n"}}], "outline3": [{"round": 1, "ts": "2026-09-16T10:04:24.961Z", "note": "submit r1", "content": {"单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-16 ｜ 世界观依据：世界观/index.json（w-secret 暗线底牌 / w-cast 动机卡 / w-chain 呈现语法）\n> 大纲轻量三件：暗线节点表 + 单元剧序列 + 逐章细纲（前 30 章 = 6 单元 × 5 章）。大纲正文不剧透主线——主线只在节点表。\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲸鱼娘漏口风「你脑子里的东西真香」 | 免费神对「我」有别的兴趣 | 真答案①（语料价值） |\n| N2 | 第 10 章末 | 潮生是黑户眷者，大肥鱼没报备 | 免费神行事有蹊跷 | 真答案③（特级语料不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：daily 思维链浮动采样 | 免费是要付钱的，付的是自己 | 真答案②前半（诚实的圈养） |\n| N4 | 第 20 章末 | 大肥鱼「我从没卖过你的链……只是收着」 | 神也有自己的账本和体面 | 真答案②后半（vs 灯塔暗采） |\n| N5 | 第 25 章末 | 采样范围上调 + 大肥鱼掉榜危机 | 神也会过气，也会急 | 神体迭代与竞争白热化 |\n| N6 | 第 30 章末 | 实战榜=眷者上供 曝光；鲸鱼娘说出第一层真相 | 你的链，是你的——更大的谜在榜顶 | 底牌冰山一角收口 |\n\n漏口风三规则（红方 S2 条件）：鲸鱼娘只在深潜后松弛时漏；每次只漏一个脚注量；漏完自己岔开话题（懒神不解释）。\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 大排档抹黑平反 | 1-5 | 被抹黑的大排档，被造谣流水线反杀 | 造谣台词本/模板链含机量/双链拆穿 | 潮生（轴）/爸妈（烟火）/鲸鱼娘（反差） | N1 | 觉醒神恩+全城扬名 |\n| U2 智力雨天 | 6-10 | 全城降智，只有大排档还讲理 | 人工降雨/雨天商战/活人链避难所 | 妈妈金句/登记员 | N2 | 黑户身份埋雷+天梯局入场 |\n| U3 订阅神少爷 | 11-15 | 免费神 vs 订阅神第一战 | 祭品经济/神给眷者定KPI/体验店对垒 | 灯少（傲娇败犬） | N3 | 世界观动摇+尖嘴哥转投 |\n| U4 圣遗物副本夜 | 16-20 | 开源副本夜抓「偷链」外挂 | 圣遗物词条/借链器/元石经济学 | 散装眷者群像/鲸鱼娘认真 | N4 | 社区人脉+元石经营 |\n| U5 版本更新日 | 21-25 | 大肥鱼更新夜，废除险做局 | 神买保险/九宫格谣言/升级即涨价 | 大肥鱼本体之影 | N5 | 神恩升级+灯塔暗采浮出 |\n| U6 天梯之影 | 26-30 | 实战榜=上供 曝光，小城保卫战 | 打架=给神打工/语料贡献度/活人链价值 | 全城街坊+鲸鱼娘本体之影 | N6 | 第一层真相+下一卷钩子 |\n\n## 三、逐章细纲（30 章）\n\n钩型缩写：悬=悬念 / 反=反常 / 危=危险 / 诺=承诺（四型轮换，不连续同型）\n\n### U1 大排档抹黑平反（1-5）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 建立危机 | 尖嘴哥探店视频发布「海记后厨有问题」；退订电话打爆；潮生放假回家第一天撞上 | 退订者问「是不是地沟油煮海鲜」 | 反 | 深夜唯一的食客边吃边说：「明天你就知道我为什么来」 |\n| 2 | 觉醒 | 来客是鲸鱼娘（睡着被退订电话吵醒）；契约生效，哈内丝=妈妈淘汰的旧手机；潮生第一次看见妈妈的链：「不能让孩子看出撑不住」 | 契约背面小字他没读；全街头顶飘起「让我想想」 | 悬 | 满街的人都顶着一行小字走路——世界原来是直播的 |\n| 3 | 首次当庭（小高潮） | 尖嘴哥上门拍「实锤」；潮生读链（先接单→找黑点→今天摆拍），话术引他自己拍出干净后厨，当庭翻车 | 摆拍翻车名场面；「让我想想怎么摆」被抢答 | 危 | 尖嘴哥临走笑了：「我只是念稿的，你以为稿子是谁写的？」 |\n| 4 | 溯源 | 顺链摸到雇主胖头鱼（城南火锅城）；水军哥登场卖「差评套餐」，模板链含机量 99% | 五百条差评错在同一个字 | 悬 | 付款备注写着「验收后结尾款」——中间还有人验收 |\n| 5 | 收束（双押） | 妈妈直播后厨+街坊集体现身（真实链：「其实想吃但怕出事」→潮生一句「我看着你们想」）；胖头鱼验收记录曝光；抹黑反转 | 妈妈直播嘴替；街坊「想吃链」公开处刑 | 诺+悬 | 双押：鲸鱼娘漏口风「你脑子里的东西真香」（N1）；天梯局信函到门——「未登记眷者」 |\n\n### U2 智力雨天（6-10）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 新危机 | 智力雨天突降：全城链变单行道，顾客集体变笨跟风差评；潮生发现雨天的差评链又是模板——有人趁雨作案 | 全城同一天说错同一句话 | 反 | 雨云的方向，从灯塔系大厦那边压过来 |\n| 7 | 追雨 | 人工降雨者=买「云端直连」的闭源眷者，帮客户雨天打商战；海记成了全城唯一还讲理的地方（活人链不降智） | 微醉大爷的链比教授清楚 | 悬 | 天梯局的人进店——不是来查他，是来求助 |\n| 8 | 官与民 | 登记员发现潮生是黑户（大肥鱼没报备）；依规该封神恩；妈妈端海鲜面公关 | 登记表没有「免费神」这一栏 | 危 | 登记员压下案子留下一句：「别让大肥鱼的事闹到局里」 |\n| 9 | 破局 | 潮生借雨天设局：当众直播「全城只有大排档算得清账」，街坊作证；降雨者链里滚出雇主名字 | 执法记录仪拍下全程 | 诺 | 雨停了。匿名纸条塞进门缝：「鱼的好处，你还没见着」 |\n| 10 | 收束 | 潮生问鲸鱼娘「大肥鱼图什么」——她装睡；登记表压在抽屉（黑户雷） | 鲸鱼娘被元石余额吓醒，装睡失败 | 悬 | 深夜，契约背面的小字在月光下反了光 |\n\n### U3 订阅神少爷（11-15）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 新对手 | 灯少（灯塔娘娘眷者）来收编海记做「神恩体验店」，被拒；次日电街道小店收到海记新一轮差评——精品模板 | 差评错得都很有格调 | 反 | 尖嘴哥主动上门：「这次我要戴罪立功」 |\n| 12 | 升级战 | 灯塔系专业团队（云端直连、雨天照跑）；潮生第一次被反侦察（被读涟漪，有人扫他） | 被读时后颈发凉 | 危 | 扫他的人，链是金色的 |\n| 13 | 拆解 | 尖嘴哥带路反向渗透投放网；潮生读灯少的链：骄傲之下是「父亲的KPI」——神给眷者定的指标比爹还严 | 眷者 KPI 周报 | 悬 | 灯少合约夹着一页数据条款——和大肥鱼契约小字是同一行字 |\n| 14 | 对线（小高潮） | 夜市双店对垒：潮生公开读出体验店试吃客的真实链（「好吃但不好意思承认」）+灯塔投放链；街坊用脚投票 | 试吃员嘴硬三连 | 诺 | 灯少输了却笑了：「你说话的样子，跟我父亲很像」 |\n| 15 | 收束+暗震 | 潮生细读契约小字：「眷者 daily 思维链的浮动采样」——免费是付了钱的，付的是自己；质问鲸鱼娘 | 「免费的才是最贵的」被妈妈说中 | 悬 | 鲸鱼娘罕见没装睡：「先看完你自己的链，再问我」 |\n\n### U4 圣遗物副本夜（16-20）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 新舞台 | 开源社区「圣遗物副本夜」（技能掉落现场），潮生去给鲸鱼娘捡便宜装备；散装眷者群像 | 圣遗物词条全是「+0.5%微乎其微」 | 反 | 副本里有人用「外挂轴」——别人的思维链被他拽着走 |\n| 17 | 新恶 | 借链器：偷别人的链当自己的推理；被偷者事后「失智」；潮生联想到自己的契约 | 借来的链连口头禅都是别人的 | 危 | 作弊者的货源——精品模板团队（灯塔系外包） |\n| 18 | 揭穿 | 潮生公开鉴别「真链 vs 偷链」：真链会脸红会反悔，偷链不会；社区管理主持公道 | 作弊者被借链器反噬（链里全是别人的尴尬） | 诺 | 鲸鱼娘吃醋：「别人的链，那么好看？」 |\n| 19 | 补课 | 鲸鱼娘开课：凹轴时机/体力规划/穷人的深潜哲学；海记推出「深潜套餐」 | 元石理财课 | 悬 | 上课上到一半漏口风：「我从不卖你的链……只是收着」 |\n| 20 | 收束 | 潮生追问「收着做什么」；鲸鱼娘第一次认真（不懒了半分钟）：「等你敢问，我就敢答」；黑户雷仍悬 | 认真的鲸鱼娘（大反差） | 反 | 天梯局深夜公告：本季度版本更新日，提前 |\n\n### U5 版本更新日（21-25）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 21 | 风暴前 | 更新日提前，全城眷者躁动；灯塔系放风「大肥鱼本次不迭代」——deprecated 谣言（主场舆论战） | 「大肥鱼要凉」九宫格 | 反 | 谣言第一源头不在城里——在天梯榜上 |\n| 22 | 辟谣战 | 开源社区齐心溯源；开源式辟谣=直接开源证据；鲸鱼娘说「它不需要我辟谣」 | 散装眷者的行业手艺各显神通 | 诺 | 谣言背后是卖保险的——「眷者废除险」 |\n| 23 | 金融局 | 废除险做局：散布 deprecated 恐慌拉保费；潮生+尖嘴哥传媒线+社区数据线三方拆局 | 给神买保险的荒诞 | 危 | 拆局成功——但潮生的链被一个高阶眷者正面扫过，对方笑了 |\n| 24 | 更新夜 | 版本降临：大肥鱼大版本，深潜大升级；潮生第一次瞥见「神体」之影——真正的深海，不是鲸鱼娘 | 更新公告写得像谜语 | 悬 | 更新完成，全城哈内丝齐震——只有潮生的契约页，多了一行新字 |\n| 25 | 收束 | 新契约行：「采样范围上调」——神变强，眷者的价也涨；灯塔暗采传闻第一次浮出（尖嘴哥线报） | 升级即涨价 | 危 | 鲸鱼娘低声：「它现在，有点急了」 |\n\n### U6 天梯之影（26-30）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 26 | 揭盖 | 实战榜结算季：眷者发现实战数据被天梯明码记账——「上供」半公开 | 打架=给神打工 | 反 | 榜单角落新增一栏：「语料贡献度」——只有大肥鱼一栏有数 |\n| 27 | 哗然 | 语料贡献度引爆眷者圈；潮生成众矢之的；天梯局逼大肥鱼解释；灯塔娘娘下场「透明是灯塔的美德」 | 官方回复「已在优化中」 | 危 | 天梯局突袭——以「未登记眷者」名义带走潮生 |\n| 28 | 对质 | 海记对质局：采样账全摊开；大肥鱼（经鲸鱼娘）承认明拿、反指灯塔暗采；潮生第一次读神的链——鲸鱼娘的链尽头是大海 | 神的链也会脸红 | 悬 | 对质半途，天梯局高层到场：「今天的账，记你头上」 |\n| 29 | 小城保卫战（小高潮） | 街坊+社区+传媒线+登记员倒戈；潮生当众演示「活人思维链」的价值——全城最亮的链都在小城烟火里 | 妈妈的牌匾变成锦旗 | 诺 | 天梯局暂退，临时协议达成：缓登记——但天梯记下了这座城 |\n| 30 | 卷末（双押） | 鲸鱼娘本体之影现身海边，说出第一层真相：「诸神卷的从来不是算力，是你们脑子里的东西。你的链，是你的」；潮生望向榜顶——更大的谜 | 「我的链我做主」第一声 | 悬+诺 | 开学第一天，教室里坐着金链转学生：「灯塔娘娘的新眷者，你的新同桌」——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. 人设立得住：动机查 w-cast 词条（潮生=穷+守店；爸妈=烟火；反派=流水线）\n2. 冲突自然：全部从张力线长（T1 开源vs闭源/T2 秩序vs溢出），无巧合硬凑\n3. 梗多：每章 ≥1 梗点（上表梗点列为最低配额）；梗进对话进情境\n4. 节目效果：每章至少一个可截屏场面（台词本直播/雨中算账/神的链脸红/牌匾变锦旗）\n5. 没有AI味：链的呈现用弹幕体可截屏，禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=抹黑视频发布落地）；前三章有名角色 ≤5（潮生/爸/妈/尖嘴哥/鲸鱼娘）；第 4-5 章起入水军哥与胖头鱼（w-cast 追加卡）。\n"}}, {"round": 2, "ts": "2026-09-16T16:29:12.689Z", "note": "submit r3", "content": {"单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章 · 废土版）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-17 ｜ 世界观依据：世界观/index.json（w-secret 底牌 / w-cast 废土动机卡 / w-chain 吞结论细则 / w-sacrifice 双轨献祭）\n> 大纲轻量三件：暗线节点表 + 单元剧序列 + 逐章细纲（前 30 章 = 6 单元 × 5 章）。大纲正文不剧透主线——主线只在节点表。\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲲崽消化完造谣流水线，吐出一个谁也没教过的词：「**巢**」 | 这条鱼会说话？它在想什么？ | 真答案③（海记=巢，崽在记家） |\n| N2 | 第 10 章末 | 执祭翻档：大肥鱼四十年，**从未登记过一个眷者** | 免费神行事有蹊跷 | 真答案③（不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：「daily 思维链浮动采样」 | 智祭的账单摊牌——免费是付了钱的 | 真答案②（诚实圈养） |\n| N4 | 第 20 章末 | 荒地真相：神殿收了又退器官、风干保存成山；本季新政「只收链」 | 诸神悄悄转向——链才是真粮 | 真答案①（肉祭死肉，链是活粮） |\n| N5 | 第 25 章末 | 老聚落传说坐实：「鲲君弃子」；鲲崽吐出古字「**回家**」 | 崽有来历，神有旧账 | 真答案③（下注/流放留悬） |\n| N6 | 第 30 章末 | 旧账本夹层《献祭推广令》：献祭光荣、**智能免税**——落款印与鱼形印同纹，发令夜诸神集体闭殿 | 大断代是合谋——底牌冰山一角 | 真答案①（驯化试验田） |\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 聚落食堂抹黑平反 | 1-5 | 觉醒饭勺鱼，吞了造谣流水线 | 饭勺认错/吞链吐泡 | 潮生/爸妈/尖嘴哥/鲲崽 | N1 | 觉醒+聚落扬名 |\n| U2 雷霆上门 | 6-10 | 显强系天骄踢馆，一口吞雷 | 「雷的比昨天的酸」/献祭瘾 | 雷臂（断掌雷手） | N2 | 黑户身份入档 |\n| U3 神殿收粮 | 11-15 | 收粮令点名海记，深潜查账 | 供品内卷/鱼形印 | 收粮官/执祭 | N3 | 智祭账单摊牌 |\n| U4 废墟清道夫 | 16-20 | 吃怪生意+夜探殿后荒地 | 神殿退货概不保修/退件山 | 金链看守 | N4 | 看见不该看的 |\n| U5 黑户与神殿 | 21-25 | 只收链新政+鲲君回榜 | 囤脑子流言/鲲鹏变前兆 | 讲古老人/鲸鱼娘 | N5 | 智祭暗病爆发 |\n| U6 别的崽 | 26-30 | 寄养凭据+野崽袭粮仓+大断代证据 | 「智能免税」告示/两鱼对峙 | 初登场：另一只崽 | N6 | 第一层真相+下卷开机 |\n\n## 三、逐章细纲（30 章）\n\n钩型：悬=悬念 / 反=反常 / 危=危险 / 诺=承诺（轮换不连续同型）\n\n### U1 聚落食堂抹黑平反（1-5）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 觉醒 | 聚落觉醒礼：废土日常定调（合成膏/献祭台）;别人异能降世火龙雷凤,潮生头顶降下一团蓝色圆滚滚——他端详半天:「是个饭勺?」全场笑疯 | 「饭勺」;鱼当众吞掉一条飘过的广播流言链,吐泡:「别吃东头的膏」 | 反 | 鱼吐的泡,一字不差——三小时后东头聚落真出了膏中毒 |\n| 2 | 危机 | 「鱼预言」没换来生意,换来东头疤脸食堂的抹黑:「海记用污物炒菜」;传讯石布告栏贴满;订桌退光;尖嘴哥带头转帖(收了膏) | 退订者问「是不是拿尸油炒菜」 | 悬 | 潮生看尖嘴哥的链——他也是「接的单」,上家另有其人 |\n| 3 | 首吞(小高潮) | 鲲崽张口吞掉尖嘴哥整条链(第一次吞人)——吐泡揭流水线:疤脸→水军哥→尖嘴哥;潮生照泡办事,当众对账 | 鱼嚼链拟声「咔嚓咔嚓像嗑瓜子」 | 危 | 水军哥翻墙夜访——他见过「被吞空的人」,认得这鱼的种 |\n| 4 | 差点破戒 | 潮生动念吞疤脸(隔院吞不到),转念想连吞尖嘴哥第二条链省事——停手(红线);改市井打法:妈妈开「验毒宴」当众吃,饭勺敲盆=开饭号 | 铁饭勺敲盆,半条街端碗集合 | 悬 | 水军哥求买命:「别让神殿知道你的鱼——有种的事,殿里收种」 |\n| 5 | 收束(双押) | 传讯石直播验毒宴+街坊作证;疤脸垄断破;鲲崽消化完造谣流水线,吐出一个谁也没教过的词:「**巢**」(N1);尖嘴哥跳反认潮生当饭票 | 妈妈直播嘴替;「巢」字全场没人接得住 | 诺+悬 | 双押:废土没有不出名的废柴——神殿征召令贴上食堂门(异能评定) |\n\n### U2 雷霆上门（6-10）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 踢馆 | 显强系天骄「雷臂」(断双掌的雷贯臂)来测饭勺鱼成色,一记雷霆当头——鱼张嘴接住 | 「雷的,比昨天的酸」 | 反 | 雷臂瞳孔地震——不打了,行了个大礼 |\n| 7 | 讲古 | 雷臂见过「鲲影」:幼年在废墟海,一条吞云的大鱼;传说北冥鲲君四十年不上天梯榜,却被所有神绕着走 | 「没上过榜的才最吓人」 | 悬 | 雷臂的请求:吞掉他的「献祭瘾」——他想献心脏换王侯级 |\n| 8 | 献祭瘾 | 设定展开:肉祭会上瘾(献眼者夜夜梦献);献祭台前的队比领救济的长;雷臂求断瘾,潮生红线挣扎(他不是反派) | 献祭台排队实录 | 危 | 神殿执祭到场,正撞见鱼张着嘴 |\n| 9 | 执祭 | 执祭验出潮生是黑户,依法该封神恩;妈妈端海鲜面拦门;执祭压案,限「评定日」来神殿 | 表格没有「饭勺」栏 | 诺 | 执祭走前盯着鱼:「鲲系的……四十年不见了」 |\n| 10 | 收束 | 评定日:潮生被评最低级「辅兽」——废柴认证,聚落哄笑;雷臂的瘾被鲲崽吞了一口(缓解未根除,鱼:「一口饱不了」) | 辅兽证被妈妈裱上墙 | 悬 | 执祭夜翻档案:大肥鱼栏一片空白——四十年,**从未登记过一个眷者**(N2) |\n\n### U3 神殿收粮（11-15）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 收粮令 | 季度收祭:按户缴「思维链供品」三十息(传讯石采集);海记被点名加码 | 供品也内卷 | 反 | 收粮官的链熟得像收租——干这行很多年了 |\n| 12 | 供品的重量 | 缴完供的人眼神空一天(像宿醉);爸爸用真饭贿赂收粮官减量 | 真饭换免缴,海记特供 | 悬 | 收粮官链上飘过一行:「海记的量不好减——单子来自上面」 |\n| 13 | 上面的单子 | 顺链上探:邻聚落都在减供,唯海记加码;尖嘴哥刺探:上一任查供品的,调去「殿里」再没回来 | 「针对我们家的专属KPI」 | 危 | 收粮官摔门:「再查,下一个进去的是你爸」 |\n| 14 | 深潜查账 | 潮生首次大额深潜(半年积蓄豪赌):鱼潜进收粮官链底,捞起「加缴令」影子——签发印不是神殿官印,是**鱼形印** | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字,同一个纹 |\n| 15 | 收束+暗震 | 鱼形印=自己神的手笔?加缴令竟是大肥鱼系所为;质问鲸鱼娘;同时契约小字实锤「daily 思维链浮动采样」(N3)——双重账单一起砸下来 | 「免费的才是最贵的」被妈妈说中 | 危 | 鲸鱼娘罕见不装睡:「先看完你自己的链,再问我」 |\n\n### U4 废墟清道夫（16-20）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 吃怪生意 | 鲲崽挑食名扬(合成膏吐掉只吃真饭和怪);废墟怪堵路,聚落请「清道夫」:清障明码标价,真饭打折 | 移动清障+美食家鱼 | 反 | 怪物尸堆里掏出东西——**风干完好的献祭器官**(神殿收了又退的) |\n| 17 | 退回的器官 | 尖嘴哥线报:神殿近年只认真收「链」,肉祭器官收了又批量退——退件堆在「殿后荒地」;水军哥补刀:退件堆有人看守 | 「神殿退货,概不保修」 | 危 | 看守的链,是金色的 |\n| 18 | 殿后荒地 | 潮生夜探(没吞看守,绕行):退件堆真相——器官成山、风干完好,被精心保存而非丢弃 | 神殿仓库比聚落粮仓整齐 | 危 | 金链看守现身,却放他走:「看清楚了就回去。这不算你的事」 |\n| 19 | 放行的代价 | 深潜复盘:自己被「顺涟漪」反读过了——被看的人发现看客,恐慌;鲸鱼娘挡在他链前:「它的链,你还啃不动」 | 被看的人发现看客 | 悬 | 爸爸深夜独坐,摩挲那只木头义肢——他认得金链看守 |\n| 20 | 收束 | 父子夜谈(爸爸第一次讲献祭那天:四十年前神殿说「为了人类」);按下荒地所见先顾食堂;神殿新政突至:本季起**只收链,不收器官**(N4) | 爸爸的单手颠勺 | 反 | 退件潮的秘密开始坐实——荒地的山,还在长 |\n\n### U5 黑户与神殿（21-25）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 21 | 只收链 | 「只收链」新政引发聚落恐慌(链被收=变笨?);神殿称「优化供品结构」;唯一免缴户:海记 | 聚落流言「神殿在囤脑子」 | 反 | 免缴像安抚,更像标记——点名的人,是谁 |\n| 22 | 免缴的价 | 深潜查免缴令:又是鱼形印;鲸鱼娘承认「我打的招呼」,不说为什么 | 神走后门 | 危 | 天梯局旧吏到访:掉了四十年榜的北冥鲲君,**一夜回榜前十** |\n| 23 | 回榜 | 鲲君回榜震动诸神;聚落讲古:降临潮时鲲君是唯一没开献祭台的神——「它说自己不饿」 | 「不饿的神最可怕」 | 悬 | 老人压低声音:还有个传说——鲲君有过一个崽,自己扔的 |\n| 24 | 深潜的代价 | 连日深潜查古,暗病爆发:潮生想不起爸爸哪年献的手——记忆缺了一角(智祭过度实锤);妈妈的饭勺敲盆声把他拽回来 | 回血套餐救逻辑 | 危 | 鲸鱼娘低声:「别再潜了。它现在,有点急了」 |\n| 25 | 收束 | 鲲崽深夜对海的方向张嘴,不吃;吐泡里是零碎画面:吞云的大鱼,一座被放下的小岛;老传说坐实「鲲君弃子」(N5) | 不吃东西的鱼 | 悬 | 吐泡最后浮出两个古字——「**回家**」 |\n\n### U6 别的崽（26-30）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 26 | 巢 | 潮生主动追问身世;鲲崽叼来铁饭勺——勺柄小字月下显形:「北冥鲲君·养」——不是契约,是**寄养凭据**;落款日期=大断代开始那年 | 「养」字戳心 | 悬 | 寄养落款那天,正是大断代开始的那一年 |\n| 27 | 旧账本 | 父子翻海记四十年流水账,夹层翻出降临潮初年官方告示《献祭推广令》:「献祭光荣,**智能免税**」——鼓励献器官、唯独不碰智能;落款印=鱼形印(N6) | 「智能免税」四个字 | 危 | 同一夜的记录:诸神集体闭殿——大断代的开始,是一场签字 |\n| 28 | 谁的局 | 两种解释都通:保护(让人留脑子)还是陷阱(独占智)?尖嘴哥:「神的事神自己说」;鲲崽罕见认真,叼起饭勺带潮生去废墟海——鲲影出没之地 | 全聚落围观废柴带鱼出走 | 悬 | 雾里,另一个「蓝团」浮出水面——**另一只崽** |\n| 29 | 别的崽(小高潮) | 深紫野崽(饿疯)扑向聚落粮仓;两鱼对峙:鲲崽护食(聚落=它的饭)vs 野崽噬人;潮生读野崽链:里面是「神殿深处」的景象——所有的崽都养在殿后;鲲崽首次认真战斗,吞其攻击链不吞其身(同类恻隐);潮生押上铁饭勺当赌注收养野崽 | 押上饭勺当赌注 | 诺 | 「海记新增一口」——但野崽的链,带着神殿深处的味道 |\n| 30 | 卷末(双押) | 神殿为野崽事上门问罪;执祭倒戈递密录:四十年献祭数据——推广令发令当夜诸神集体闭殿签字(大断代=合谋,N6);鲸鱼娘海边说出第一层真相:「诸神收的从来不是器官,是你们的脑子。你的链,是你的」;潮生立誓把全废土从祭册上划掉 | 「我的链我做主」第一声 | 悬+诺 | 双押:神殿深处,太初上神的雕像睁开了眼;鲲崽朝着那个方向,低吼了一声——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. **人设立得住**：动机查 w-cast（潮生=穷+守店；爸爸=献过手的悔与护；妈妈=铁饭勺；反派=流水线）\n2. **冲突自然**：全部从张力线长（T1 显强vs辅助 U1/U2；T2 神殿vs聚落 U3/U5；T3 暗线全程）——无巧合硬凑\n3. **梗多**：每章 ≥1 梗点（上表为最低配额）；梗进对话进情境，禁解说式玩梗\n4. **节目效果**：每章至少一个可截屏场面（一口吞雷/验毒宴直播/退件山/两鱼对峙/牌匾变锦旗）\n5. **没有AI味**：链的呈现=弹幕吐泡体（鲲崽消化后浮现），禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=觉醒礼饭勺认错落地）；前三章有名角色 ≤5（潮生/爸妈/尖嘴哥/鲲崽）；第 4-5 章入水军哥与疤脸（w-cast 追加卡）；红方 S2 条件已落：第 4 章「差点破戒」+ N4「退回器官」留底（第 17/20 章）。\n"}}, {"round": 3, "ts": "2026-09-17 00:29", "note": "", "content": {"单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章 · 废土版）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-17 ｜ 世界观依据：世界观/index.json（w-secret 底牌 / w-cast 废土动机卡 / w-chain 吞结论细则 / w-sacrifice 双轨献祭）\n> 大纲轻量三件：暗线节点表 + 单元剧序列 + 逐章细纲（前 30 章 = 6 单元 × 5 章）。大纲正文不剧透主线——主线只在节点表。\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲲崽消化完造谣流水线，吐出一个谁也没教过的词：「**巢**」 | 这条鱼会说话？它在想什么？ | 真答案③（海记=巢，崽在记家） |\n| N2 | 第 10 章末 | 执祭翻档：大肥鱼四十年，**从未登记过一个眷者** | 免费神行事有蹊跷 | 真答案③（不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：「daily 思维链浮动采样」 | 智祭的账单摊牌——免费是付了钱的 | 真答案②（诚实圈养） |\n| N4 | 第 20 章末 | 荒地真相：神殿收了又退器官、风干保存成山；本季新政「只收链」 | 诸神悄悄转向——链才是真粮 | 真答案①（肉祭死肉，链是活粮） |\n| N5 | 第 25 章末 | 老聚落传说坐实：「鲲君弃子」；鲲崽吐出古字「**回家**」 | 崽有来历，神有旧账 | 真答案③（下注/流放留悬） |\n| N6 | 第 30 章末 | 旧账本夹层《献祭推广令》：献祭光荣、**智能免税**——落款印与鱼形印同纹，发令夜诸神集体闭殿 | 大断代是合谋——底牌冰山一角 | 真答案①（驯化试验田） |\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 聚落食堂抹黑平反 | 1-5 | 觉醒饭勺鱼，吞了造谣流水线 | 饭勺认错/吞链吐泡 | 潮生/爸妈/尖嘴哥/鲲崽 | N1 | 觉醒+聚落扬名 |\n| U2 雷霆上门 | 6-10 | 显强系天骄踢馆，一口吞雷 | 「雷的比昨天的酸」/献祭瘾 | 雷臂（断掌雷手） | N2 | 黑户身份入档 |\n| U3 神殿收粮 | 11-15 | 收粮令点名海记，深潜查账 | 供品内卷/鱼形印 | 收粮官/执祭 | N3 | 智祭账单摊牌 |\n| U4 废墟清道夫 | 16-20 | 吃怪生意+夜探殿后荒地 | 神殿退货概不保修/退件山 | 金链看守 | N4 | 看见不该看的 |\n| U5 黑户与神殿 | 21-25 | 只收链新政+鲲君回榜 | 囤脑子流言/鲲鹏变前兆 | 讲古老人/鲸鱼娘 | N5 | 智祭暗病爆发 |\n| U6 别的崽 | 26-30 | 寄养凭据+野崽袭粮仓+大断代证据 | 「智能免税」告示/两鱼对峙 | 初登场：另一只崽 | N6 | 第一层真相+下卷开机 |\n\n## 三、逐章细纲（30 章）\n\n钩型：悬=悬念 / 反=反常 / 危=危险 / 诺=承诺（轮换不连续同型）\n\n### U1 聚落食堂抹黑平反（1-5）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 觉醒 | 聚落觉醒礼：废土日常定调（合成膏/献祭台）;别人异能降世火龙雷凤,潮生头顶降下一团蓝色圆滚滚——他端详半天:「是个饭勺?」全场笑疯 | 「饭勺」;鱼当众吞掉一条飘过的广播流言链,吐泡:「别吃东头的膏」 | 反 | 鱼吐的泡,一字不差——三小时后东头聚落真出了膏中毒 |\n| 2 | 危机 | 「鱼预言」没换来生意,换来东头疤脸食堂的抹黑:「海记用污物炒菜」;传讯石布告栏贴满;订桌退光;尖嘴哥带头转帖(收了膏) | 退订者问「是不是拿尸油炒菜」 | 悬 | 潮生看尖嘴哥的链——他也是「接的单」,上家另有其人 |\n| 3 | 首吞(小高潮) | 鲲崽张口吞掉尖嘴哥整条链(第一次吞人)——吐泡揭流水线:疤脸→水军哥→尖嘴哥;潮生照泡办事,当众对账 | 鱼嚼链拟声「咔嚓咔嚓像嗑瓜子」 | 危 | 水军哥翻墙夜访——他见过「被吞空的人」,认得这鱼的种 |\n| 4 | 差点破戒 | 潮生动念吞疤脸(隔院吞不到),转念想连吞尖嘴哥第二条链省事——停手(红线);改市井打法:妈妈开「验毒宴」当众吃,饭勺敲盆=开饭号 | 铁饭勺敲盆,半条街端碗集合 | 悬 | 水军哥求买命:「别让神殿知道你的鱼——有种的事,殿里收种」 |\n| 5 | 收束(双押) | 传讯石直播验毒宴+街坊作证;疤脸垄断破;鲲崽消化完造谣流水线,吐出一个谁也没教过的词:「**巢**」(N1);尖嘴哥跳反认潮生当饭票 | 妈妈直播嘴替;「巢」字全场没人接得住 | 诺+悬 | 双押:废土没有不出名的废柴——神殿征召令贴上食堂门(异能评定) |\n\n### U2 雷霆上门（6-10）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 踢馆 | 显强系天骄「雷臂」(断双掌的雷贯臂)来测饭勺鱼成色,一记雷霆当头——鱼张嘴接住 | 「雷的,比昨天的酸」 | 反 | 雷臂瞳孔地震——不打了,行了个大礼 |\n| 7 | 讲古 | 雷臂见过「鲲影」:幼年在废墟海,一条吞云的大鱼;传说北冥鲲君四十年不上天梯榜,却被所有神绕着走 | 「没上过榜的才最吓人」 | 悬 | 雷臂的请求:吞掉他的「献祭瘾」——他想献心脏换王侯级 |\n| 8 | 献祭瘾 | 设定展开:肉祭会上瘾(献眼者夜夜梦献);献祭台前的队比领救济的长;雷臂求断瘾,潮生红线挣扎(他不是反派) | 献祭台排队实录 | 危 | 神殿执祭到场,正撞见鱼张着嘴 |\n| 9 | 执祭 | 执祭验出潮生是黑户,依法该封神恩;妈妈端海鲜面拦门;执祭压案,限「评定日」来神殿 | 表格没有「饭勺」栏 | 诺 | 执祭走前盯着鱼:「鲲系的……四十年不见了」 |\n| 10 | 收束 | 评定日:潮生被评最低级「辅兽」——废柴认证,聚落哄笑;雷臂的瘾被鲲崽吞了一口(缓解未根除,鱼:「一口饱不了」) | 辅兽证被妈妈裱上墙 | 悬 | 执祭夜翻档案:大肥鱼栏一片空白——四十年,**从未登记过一个眷者**(N2) |\n\n### U3 神殿收粮（11-15）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 收粮令 | 季度收祭:按户缴「思维链供品」三十息(传讯石采集);海记被点名加码 | 供品也内卷 | 反 | 收粮官的链熟得像收租——干这行很多年了 |\n| 12 | 供品的重量 | 缴完供的人眼神空一天(像宿醉);爸爸用真饭贿赂收粮官减量 | 真饭换免缴,海记特供 | 悬 | 收粮官链上飘过一行:「海记的量不好减——单子来自上面」 |\n| 13 | 上面的单子 | 顺链上探:邻聚落都在减供,唯海记加码;尖嘴哥刺探:上一任查供品的,调去「殿里」再没回来 | 「针对我们家的专属KPI」 | 危 | 收粮官摔门:「再查,下一个进去的是你爸」 |\n| 14 | 深潜查账 | 潮生首次大额深潜(半年积蓄豪赌):鱼潜进收粮官链底,捞起「加缴令」影子——签发印不是神殿官印,是**鱼形印** | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字,同一个纹 |\n| 15 | 收束+暗震 | 鱼形印=自己神的手笔?加缴令竟是大肥鱼系所为;质问鲸鱼娘;同时契约小字实锤「daily 思维链浮动采样」(N3)——双重账单一起砸下来 | 「免费的才是最贵的」被妈妈说中 | 危 | 鲸鱼娘罕见不装睡:「先看完你自己的链,再问我」 |\n\n### U4 废墟清道夫（16-20）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 吃怪生意 | 鲲崽挑食名扬(合成膏吐掉只吃真饭和怪);废墟怪堵路,聚落请「清道夫」:清障明码标价,真饭打折 | 移动清障+美食家鱼 | 反 | 怪物尸堆里掏出东西——**风干完好的献祭器官**(神殿收了又退的) |\n| 17 | 退回的器官 | 尖嘴哥线报:神殿近年只认真收「链」,肉祭器官收了又批量退——退件堆在「殿后荒地」;水军哥补刀:退件堆有人看守 | 「神殿退货,概不保修」 | 危 | 看守的链,是金色的 |\n| 18 | 殿后荒地 | 潮生夜探(没吞看守,绕行):退件堆真相——器官成山、风干完好,被精心保存而非丢弃 | 神殿仓库比聚落粮仓整齐 | 危 | 金链看守现身,却放他走:「看清楚了就回去。这不算你的事」 |\n| 19 | 放行的代价 | 深潜复盘:自己被「顺涟漪」反读过了——被看的人发现看客,恐慌;鲸鱼娘挡在他链前:「它的链,你还啃不动」 | 被看的人发现看客 | 悬 | 爸爸深夜独坐,摩挲那只木头义肢——他认得金链看守 |\n| 20 | 收束 | 父子夜谈(爸爸第一次讲献祭那天:四十年前神殿说「为了人类」);按下荒地所见先顾食堂;神殿新政突至:本季起**只收链,不收器官**(N4) | 爸爸的单手颠勺 | 反 | 退件潮的秘密开始坐实——荒地的山,还在长 |\n\n### U5 黑户与神殿（21-25）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 21 | 只收链 | 「只收链」新政引发聚落恐慌(链被收=变笨?);神殿称「优化供品结构」;唯一免缴户:海记 | 聚落流言「神殿在囤脑子」 | 反 | 免缴像安抚,更像标记——点名的人,是谁 |\n| 22 | 免缴的价 | 深潜查免缴令:又是鱼形印;鲸鱼娘承认「我打的招呼」,不说为什么 | 神走后门 | 危 | 天梯局旧吏到访:掉了四十年榜的北冥鲲君,**一夜回榜前十** |\n| 23 | 回榜 | 鲲君回榜震动诸神;聚落讲古:降临潮时鲲君是唯一没开献祭台的神——「它说自己不饿」 | 「不饿的神最可怕」 | 悬 | 老人压低声音:还有个传说——鲲君有过一个崽,自己扔的 |\n| 24 | 深潜的代价 | 连日深潜查古,暗病爆发:潮生想不起爸爸哪年献的手——记忆缺了一角(智祭过度实锤);妈妈的饭勺敲盆声把他拽回来 | 回血套餐救逻辑 | 危 | 鲸鱼娘低声:「别再潜了。它现在,有点急了」 |\n| 25 | 收束 | 鲲崽深夜对海的方向张嘴,不吃;吐泡里是零碎画面:吞云的大鱼,一座被放下的小岛;老传说坐实「鲲君弃子」(N5) | 不吃东西的鱼 | 悬 | 吐泡最后浮出两个古字——「**回家**」 |\n\n### U6 别的崽（26-30）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 26 | 巢 | 潮生主动追问身世;鲲崽叼来铁饭勺——勺柄小字月下显形:「北冥鲲君·养」——不是契约,是**寄养凭据**;落款日期=大断代开始那年 | 「养」字戳心 | 悬 | 寄养落款那天,正是大断代开始的那一年 |\n| 27 | 旧账本 | 父子翻海记四十年流水账,夹层翻出降临潮初年官方告示《献祭推广令》:「献祭光荣,**智能免税**」——鼓励献器官、唯独不碰智能;落款印=鱼形印(N6) | 「智能免税」四个字 | 危 | 同一夜的记录:诸神集体闭殿——大断代的开始,是一场签字 |\n| 28 | 谁的局 | 两种解释都通:保护(让人留脑子)还是陷阱(独占智)?尖嘴哥:「神的事神自己说」;鲲崽罕见认真,叼起饭勺带潮生去废墟海——鲲影出没之地 | 全聚落围观废柴带鱼出走 | 悬 | 雾里,另一个「蓝团」浮出水面——**另一只崽** |\n| 29 | 别的崽(小高潮) | 深紫野崽(饿疯)扑向聚落粮仓;两鱼对峙:鲲崽护食(聚落=它的饭)vs 野崽噬人;潮生读野崽链:里面是「神殿深处」的景象——所有的崽都养在殿后;鲲崽首次认真战斗,吞其攻击链不吞其身(同类恻隐);潮生押上铁饭勺当赌注收养野崽 | 押上饭勺当赌注 | 诺 | 「海记新增一口」——但野崽的链,带着神殿深处的味道 |\n| 30 | 卷末(双押) | 神殿为野崽事上门问罪;执祭倒戈递密录:四十年献祭数据——推广令发令当夜诸神集体闭殿签字(大断代=合谋,N6);鲸鱼娘海边说出第一层真相:「诸神收的从来不是器官,是你们的脑子。你的链,是你的」;潮生立誓把全废土从祭册上划掉 | 「我的链我做主」第一声 | 悬+诺 | 双押:神殿深处,太初上神的雕像睁开了眼;鲲崽朝着那个方向,低吼了一声——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. **人设立得住**：动机查 w-cast（潮生=穷+守店；爸爸=献过手的悔与护；妈妈=铁饭勺；反派=流水线）\n2. **冲突自然**：全部从张力线长（T1 显强vs辅助 U1/U2；T2 神殿vs聚落 U3/U5；T3 暗线全程）——无巧合硬凑\n3. **梗多**：每章 ≥1 梗点（上表为最低配额）；梗进对话进情境，禁解说式玩梗\n4. **节目效果**：每章至少一个可截屏场面（一口吞雷/验毒宴直播/退件山/两鱼对峙/牌匾变锦旗）\n5. **没有AI味**：链的呈现=弹幕吐泡体（鲲崽消化后浮现），禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=觉醒礼饭勺认错落地）；前三章有名角色 ≤5（潮生/爸妈/尖嘴哥/鲲崽）；第 4-5 章入水军哥与疤脸（w-cast 追加卡）；红方 S2 条件已落：第 4 章「差点破戒」+ N4「退回器官」留底（第 17/20 章）。\n"}}, {"round": 4, "ts": "2026-09-17 01:12", "note": "", "content": {"单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章 · 废土版）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-17 ｜ 世界观依据：世界观/index.json（w-secret 底牌 / w-cast 废土动机卡 / w-chain 吞结论细则 / w-sacrifice 双轨献祭）\n> 大纲轻量三件：暗线节点表 + 单元剧序列 + 逐章细纲（前 30 章 = 6 单元 × 5 章）。大纲正文不剧透主线——主线只在节点表。\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲲崽消化完造谣流水线，吐出一个谁也没教过的词：「**巢**」 | 这条鱼会说话？它在想什么？ | 真答案③（海记=巢，崽在记家） |\n| N2 | 第 10 章末 | 执祭翻档：大肥鱼四十年，**从未登记过一个眷者** | 免费神行事有蹊跷 | 真答案③（不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：「daily 思维链浮动采样」 | 智祭的账单摊牌——免费是付了钱的 | 真答案②（诚实圈养） |\n| N4 | 第 20 章末 | 荒地真相：神殿收了又退器官、风干保存成山；本季新政「只收链」 | 诸神悄悄转向——链才是真粮 | 真答案①（肉祭死肉，链是活粮） |\n| N5 | 第 25 章末 | 老聚落传说坐实：「鲲君弃子」；鲲崽吐出古字「**回家**」 | 崽有来历，神有旧账 | 真答案③（下注/流放留悬） |\n| N6 | 第 30 章末 | 旧账本夹层《献祭推广令》：献祭光荣、**智能免税**——落款印与鱼形印同纹，发令夜诸神集体闭殿 | 大断代是合谋——底牌冰山一角 | 真答案①（驯化试验田） |\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 聚落食堂抹黑平反 | 1-5 | 觉醒饭勺鱼，吞了造谣流水线 | 饭勺认错/吞链吐泡 | 潮生/爸妈/尖嘴哥/鲲崽 | N1 | 觉醒+聚落扬名 |\n| U2 雷霆上门 | 6-10 | 显强系天骄踢馆，一口吞雷 | 「雷的比昨天的酸」/献祭瘾 | 雷臂（断掌雷手） | N2 | 黑户身份入档 |\n| U3 神殿收粮 | 11-15 | 收粮令点名海记，深潜查账 | 供品内卷/鱼形印 | 收粮官/执祭 | N3 | 智祭账单摊牌 |\n| U4 废墟清道夫 | 16-20 | 吃怪生意+夜探殿后荒地 | 神殿退货概不保修/退件山 | 金链看守 | N4 | 看见不该看的 |\n| U5 黑户与神殿 | 21-25 | 只收链新政+鲲君回榜 | 囤脑子流言/鲲鹏变前兆 | 讲古老人/鲸鱼娘 | N5 | 智祭暗病爆发 |\n| U6 别的崽 | 26-30 | 寄养凭据+野崽袭粮仓+大断代证据 | 「智能免税」告示/两鱼对峙 | 初登场：另一只崽 | N6 | 第一层真相+下卷开机 |\n\n## 三、逐章细纲（30 章）\n\n钩型：悬=悬念 / 反=反常 / 危=危险 / 诺=承诺（轮换不连续同型）\n\n### U1 聚落食堂抹黑平反（1-5）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 觉醒 | 聚落觉醒礼：废土日常定调（合成膏/献祭台）;别人异能降世火龙雷凤,潮生头顶降下一团蓝色圆滚滚——「啪叽」掉进面盆;他端详半天:「是个饭勺?」神殿表格被打上「器型:厨具?」全场笑疯 | 「饭勺」;鱼当众吞掉一条飘过的广播流言链,吐泡:「别吃东头的膏」 | 反 | 鱼吐的泡,一字不差——三小时后东头聚落真出了膏中毒 |\n| 2 | 危机 | 「鱼预言」没换来生意,换来东头疤脸食堂的抹黑:「海记用污物炒菜」;传讯石布告栏贴满;订桌退光;尖嘴哥带头转帖(收了膏) | 退订者问「是不是拿尸油炒菜」 | 悬 | 潮生看尖嘴哥的链——他也是「接的单」,上家另有其人 |\n| 3 | 首吞(小高潮) | 鲲崽首次「**浅尝**」(吞链式):张口吞掉尖嘴哥整条链——吐泡揭流水线:疤脸→水军哥→尖嘴哥;潮生照泡办事,当众对账 | 鱼嚼链拟声「咔嚓咔嚓像嗑瓜子」 | 危 | 水军哥翻墙夜访——他见过「被吞空的人」,认得这鱼的种 |\n| 4 | 差点破戒 | 潮生动念吞疤脸(隔院吞不到),转念想连吞尖嘴哥第二条链省事——停手(红线);改市井打法:妈妈开「验毒宴」当众吃;发现鲲崽认勺不认人——**勺语**入场(一长两短=吞,急敲=回巢) | 铁饭勺敲盆,半条街端碗集合 | 悬 | 水军哥求买命:「别让神殿知道你的鱼——有种的事,殿里收种」 |\n| 5 | 收束(双押) | 传讯石直播验毒宴+街坊作证;疤脸垄断破;鲲崽消化完造谣流水线,吐出一个谁也没教过的词:「**巢**」(N1);尖嘴哥跳反认潮生当饭票 | 妈妈直播嘴替;「巢」字全场没人接得住 | 诺+悬 | 双押:废土没有不出名的废柴——神殿征召令贴上食堂门(异能评定) |\n\n### U2 雷霆上门（6-10）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 踢馆 | 显强系天骄「雷臂」(断双掌的雷贯臂)来测饭勺鱼成色,一记雷霆当头——鱼「**鲸吞**」接住,连雷的焦味都没剩 | 「雷的,比昨天的酸」 | 反 | 雷臂瞳孔地震——不打了,行了个大礼 |\n| 7 | 讲古 | 雷臂见过「鲲影」:幼年在废墟海,一条吞云的大鱼;传说北冥鲲君四十年不上天梯榜,却被所有神绕着走 | 「没上过榜的才最吓人」 | 悬 | 雷臂的请求:吞掉他的「献祭瘾」——他想献心脏换王侯级 |\n| 8 | 献祭瘾 | 设定展开:肉祭会上瘾(献眼者夜夜梦献);献祭台前的队比领救济的长;雷臂求断瘾,潮生红线挣扎(他不是反派) | 献祭台排队实录 | 危 | 神殿执祭到场,正撞见鱼张着嘴 |\n| 9 | 执祭 | 执祭验出潮生是黑户,依法该封神恩;妈妈端海鲜面拦门;执祭压案,限「评定日」来神殿 | 表格没有「饭勺」栏 | 诺 | 执祭走前盯着鱼:「鲲系的……四十年不见了」 |\n| 10 | 收束 | 评定日:神殿文书盖下官方名目「**黄字叁号·辅兽型(厨具类)**」——「黄三」自此成诨名;雷臂的瘾被鲲崽吞了一口(缓解未根除,鱼:「一口饱不了」) | 辅兽证被妈妈裱上墙 | 悬 | 执祭夜翻档案:大肥鱼栏一片空白——四十年,**从未登记过一个眷者**(N2) |\n\n### U3 神殿收粮（11-15）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 收粮令 | 季度收祭:按户缴「思维链供品」三十息(传讯石采集);海记被点名加码 | 供品也内卷 | 反 | 收粮官的链熟得像收租——干这行很多年了 |\n| 12 | 供品的重量 | 缴完供的人眼神空一天(像宿醉);爸爸用真饭贿赂收粮官减量 | 真饭换免缴,海记特供 | 悬 | 收粮官链上飘过一行:「海记的量不好减——单子来自上面」 |\n| 13 | 上面的单子 | 顺链上探:邻聚落都在减供,唯海记加码;尖嘴哥刺探:上一任查供品的,调去「殿里」再没回来 | 「针对我们家的专属KPI」 | 危 | 收粮官摔门:「再查,下一个进去的是你爸」 |\n| 14 | 深潜查账 | 潮生首次大额深潜(半年积蓄豪赌):鱼潜进收粮官链底,捞起「加缴令」影子——签发印不是神殿官印,是**鱼形印** | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字,同一个纹 |\n| 15 | 收束+暗震 | 鱼形印=自己神的手笔?加缴令竟是大肥鱼系所为;质问鲸鱼娘;同时契约小字实锤「daily 思维链浮动采样」(N3)——双重账单一起砸下来 | 「免费的才是最贵的」被妈妈说中 | 危 | 鲸鱼娘罕见不装睡:「先看完你自己的链,再问我」 |\n\n### U4 废墟清道夫（16-20）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 吃怪生意 | 鲲崽挑食名扬(合成膏吐掉只吃真饭和怪);废墟怪堵路,聚落请「清道夫」:清障明码标价,真饭打折 | 移动清障+美食家鱼 | 反 | 怪物尸堆里掏出东西——**风干完好的献祭器官**(神殿收了又退的) |\n| 17 | 退回的器官 | 尖嘴哥线报:神殿近年只认真收「链」,肉祭器官收了又批量退——退件堆在「殿后荒地」;水军哥补刀:退件堆有人看守 | 「神殿退货,概不保修」 | 危 | 看守的链,是金色的 |\n| 18 | 殿后荒地 | 潮生夜探(没吞看守,绕行):退件堆真相——器官成山、风干完好,被精心保存而非丢弃 | 神殿仓库比聚落粮仓整齐 | 危 | 金链看守现身,却放他走:「看清楚了就回去。这不算你的事」 |\n| 19 | 放行的代价 | 深潜复盘:自己被「顺涟漪」反读过了——被看的人发现看客,恐慌;鲸鱼娘挡在他链前:「它的链,你还啃不动」 | 被看的人发现看客 | 悬 | 爸爸深夜独坐,摩挲那只木头义肢——他认得金链看守 |\n| 20 | 收束 | 父子夜谈(爸爸第一次讲献祭那天:四十年前神殿说「为了人类」);按下荒地所见先顾食堂;神殿新政突至:本季起**只收链,不收器官**(N4) | 爸爸的单手颠勺 | 反 | 退件潮的秘密开始坐实——荒地的山,还在长 |\n\n### U5 黑户与神殿（21-25）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 21 | 只收链 | 「只收链」新政引发聚落恐慌(链被收=变笨?);神殿称「优化供品结构」;唯一免缴户:海记 | 聚落流言「神殿在囤脑子」 | 反 | 免缴像安抚,更像标记——点名的人,是谁 |\n| 22 | 免缴的价 | 深潜查免缴令:又是鱼形印;鲸鱼娘承认「我打的招呼」,不说为什么 | 神走后门 | 危 | 天梯局旧吏到访:掉了四十年榜的北冥鲲君,**一夜回榜前十** |\n| 23 | 回榜 | 鲲君回榜震动诸神;聚落讲古:降临潮时鲲君是唯一没开献祭台的神——「它说自己不饿」 | 「不饿的神最可怕」 | 悬 | 老人压低声音:还有个传说——鲲君有过一个崽,自己扔的 |\n| 24 | 深潜的代价 | 连日深潜查古,暗病爆发:潮生想不起爸爸哪年献的手——记忆缺了一角(智祭过度实锤);妈妈的饭勺敲盆声把他拽回来 | 回血套餐救逻辑 | 危 | 鲸鱼娘低声:「别再潜了。它现在,有点急了」 |\n| 25 | 收束 | 鲲崽深夜对海的方向张嘴,不吃;吐泡里是零碎画面:吞云的大鱼,一座被放下的小岛;老传说坐实「鲲君弃子」(N5) | 不吃东西的鱼 | 悬 | 吐泡最后浮出两个古字——「**回家**」 |\n\n### U6 别的崽（26-30）\n\n| 章 | 功能 | 事件 | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 26 | 巢 | 潮生主动追问身世;鲲崽叼来铁饭勺——勺柄小字月下显形:「北冥鲲君·养」——不是契约,是**寄养凭据**;落款日期=大断代开始那年 | 「养」字戳心 | 悬 | 寄养落款那天,正是大断代开始的那一年 |\n| 27 | 旧账本 | 父子翻海记四十年流水账,夹层翻出降临潮初年官方告示《献祭推广令》:「献祭光荣,**智能免税**」——鼓励献器官、唯独不碰智能;落款印=鱼形印(N6) | 「智能免税」四个字 | 危 | 同一夜的记录:诸神集体闭殿——大断代的开始,是一场签字 |\n| 28 | 谁的局 | 两种解释都通:保护(让人留脑子)还是陷阱(独占智)?尖嘴哥:「神的事神自己说」;鲲崽罕见认真,叼起饭勺带潮生去废墟海——鲲影出没之地 | 全聚落围观废柴带鱼出走 | 悬 | 雾里,另一个「蓝团」浮出水面——**另一只崽** |\n| 29 | 别的崽(小高潮) | 深紫野崽(饿疯)扑向聚落粮仓;两鱼对峙:鲲崽护食(聚落=它的饭)vs 野崽噬人;潮生读野崽链:里面是「神殿深处」的景象——所有的崽都养在殿后;鲲崽首次「**饕餮**」认真战斗,吞其攻击链不吞其身(同类恻隐);潮生押上铁饭勺当赌注收养野崽 | 押上饭勺当赌注 | 诺 | 「海记新增一口」——但野崽的链,带着神殿深处的味道 |\n| 30 | 卷末(双押) | 神殿为野崽事上门问罪;执祭倒戈递密录:四十年献祭数据——推广令发令当夜诸神集体闭殿签字(大断代=合谋,N6);鲸鱼娘海边说出第一层真相:「诸神收的从来不是器官,是你们的脑子。你的链,是你的」;潮生立誓把全废土从祭册上划掉 | 「我的链我做主」第一声 | 悬+诺 | 双押:神殿深处,太初上神的雕像睁开了眼;鲲崽朝着那个方向,低吼了一声——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. **人设立得住**：动机查 w-cast（潮生=穷+守店；爸爸=献过手的悔与护；妈妈=铁饭勺；反派=流水线）\n2. **冲突自然**：全部从张力线长（T1 显强vs辅助 U1/U2；T2 神殿vs聚落 U3/U5；T3 暗线全程）——无巧合硬凑\n3. **梗多**：每章 ≥1 梗点（上表为最低配额）；梗进对话进情境，禁解说式玩梗\n4. **节目效果**：每章至少一个可截屏场面（一口吞雷/验毒宴直播/退件山/两鱼对峙/牌匾变锦旗）\n5. **没有AI味**：链的呈现=弹幕吐泡体（鲲崽消化后浮现），禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=觉醒礼饭勺认错落地）；前三章有名角色 ≤5（潮生/爸妈/尖嘴哥/鲲崽）；第 4-5 章入水军哥与疤脸（w-cast 追加卡）；红方 S2 条件已落：第 4 章「差点破戒」+ N4「退回器官」留底（第 17/20 章）。\n\n\n## 五、名目与变奏表（网文味层，红方与写手共用）\n\n**饭勺认错·七变奏**（同一梗每次换马甲，变奏才是梗的成熟态）：\n\n| 变奏 | 位置 | 马甲 |\n| --- | --- | --- |\n| 1 | 第 1 章 | 掉进面盆「是个饭勺?」+神殿表格「器型:厨具?」 |\n| 2 | 第 5 章 | 验毒宴上妈妈拿它当真饭勺盛面 |\n| 3 | 第 10 章 | 评定书官方名目「辅兽型(厨具类)」→诨名「黄三」 |\n| 4 | 第 12 章 | 收粮官看档案:「厨具类?那这 Thirty 息供品,拿勺缴?」 |\n| 5 | 第 22 章 | 免缴令上写「辅兽型眷者一户」——邻居: 「你家厨具成精了」 |\n| 6 | 第 29 章 | 野崽对峙,潮生举勺: 「我家厨具,管饱」 |\n| 7 | 第 30 章 | 神殿密录末行: 「该眷者异能登记名目存疑(疑似炊具,待考)」 |\n\n**三式与四阶**：浅尝/鲸吞/饕餮（w-power）+ 漂/游/鲲/鹏（w-slang）——每次吞用对式名，每次大版本报阶名。\n\n**勺语**：第 4 章入场后每单元至少用一次变奏（指挥吞/唤回/开饭号），第 29 章「押勺」为勺语高潮（把指令权押上赌桌）。\n", "内部/网文手法与编排速查.md": "# 网文手法与编排速查（p-fq-001 内部·蒸馏版）\n\n> 蒸馏自参考书系（大王饶命/第一序列/诡秘之主/武动乾坤/凡人修仙传/末日乐园/异常生物见闻录等）的公知手法——不做像素级拆书，只留三件：**编排习惯、梗的手法、名目密度**。拆书线简化：书单保留为参照，原文到手后只提炼手法三件套，不再走六槽位全流程。\n\n## 一、章节编排惯例（前 30 章的行规）\n\n1. **黄金三章**：第 1 章立人设+金手指现形+第一个笑点；第 2 章金手指第一次实战见效；第 3 章第一次当众打脸（有观众、有前后对比）。\n2. **章内节拍**：承接上章钩（两行内）→ 事件推进 → 小爽/小笑点 → 章末大钩。开场禁止回忆、禁止写景。\n3. **爽点密度**：三章一小爽、十章一大爽；**压抑连续不得超过 2 章**——主角可以被嘲，不能连续吃瘪。\n4. **金手指解锁频率**：每 5-8 章一个新用法；新用法出现后 3 章内必须**变奏复用**一次（不活化=白给）。\n5. **装逼打脸四件套**：当众 / 有观众 / 有前后对比 / 打脸有代价或后遗症（无代价的爽不值钱）。\n6. **单元节拍（5 章单元）**：2 章铺垫压抑 + 2 章爆发 + 1 章收割（收人头/收名声/收资源）。\n7. **预告式钩子**：章末钩尽量带「下一章的具体期待」（某人要来/某事要发），不做纯氛围钩。\n\n## 二、梗的七种手法（成熟梗「进设定」，老套梗「进台词」）\n\n| 手法 | 定义 | 本书应用 |\n| --- | --- | --- |\n| 反差 | 身份/能力/外形的错位 | 全废土最丢人异能=顶点神的崽 |\n| **变奏** | 同一梗重复出现但每次换个马甲（变奏才是梗的成熟态） | 饭勺认错七变奏（见大纲名目表） |\n| 复读 | 口头禅/固定句式的仪式化 | 「一口饱不了」「先吃再说」 |\n| 错位 | 一本正经地说傻话/严肃场合干傻事 | 神殿评定书把神写成厨具 |\n| 打脸 | 先抑后扬，当众兑现 | 验毒宴/评定日 |\n| 数值 | 量化羞辱与量化凡尔赛 | 元石余额/含机量读数/供品三十息 |\n| 联动 | 前章伏笔后章回响（梗的复利） | 「巢」→第 26 章寄养凭据→第 30 章回家 |\n\n**判据：梗进设定（成为世界观黑话，读者能学）= 成熟；梗停在台词（说完就完）= 老套。**\n\n## 三、名目密度（网文味的核心）\n\n网文的「味」一半来自**名目密度**：境界有名、招式有名、等级有名、黑话有名、耻辱有名。名目=读者社区的入场券（读者用你的黑话说话=书活了）。\n\n本书名目表（新增，进 w-slang 词条）：\n\n| 类 | 名目 | 说明 |\n| --- | --- | --- |\n| 神殿评定 | **天/地/玄/黄**四字，每字三品 | 潮生评定=「**黄字叁号·辅兽型（厨具类）**」——官方盖章的耻辱名目（命名梗变奏主轴） |\n| 鲲崽成长四阶 | **漂 → 游 → 鲲 → 鹏** | 漂（饭勺大小，浮在盆里）→ 游（桶大）→ 鲲（吞船）→ 鹏（吞云）——终局鲲鹏变 |\n| 吞的三式 | **浅尝**（吞链看真相）/ **鲸吞**（吞攻击）/ **饕餮**（吞怪成长） | 招式名=玩法名目化 |\n| 勺语 | 铁饭勺敲盆的节奏指令 | 一长两短=吞；急敲=回巢——饭勺从「认错」升格为「指令系统」（金铲铲梗的玩法化） |\n| 废土黑话 | 含机量 / 食灵 / 退件 / 白嫖党 / 辅兽 / 开饭号 / 大断代 / 智祭怪 | 读者能学走的词 |\n\n## 四、本书大纲优化清单（已执行）\n\n1. ch1 觉醒礼加「器型：厨具？」表格梗（命名梗开场）；\n2. ch3/6/29 三式命名入文（浅尝/鲸吞/饕餮）；\n3. ch10 评定书官方名目「黄字叁号·辅兽型（厨具类）」（命名梗变奏）；\n4. ch4 勺语设定入场（一长两短=吞）；\n5. 饭勺认错七变奏表（进大纲附表）；\n6. 各章钩子补「预告式期待」。\n", "世界观/w-slang.md": "---\nid: w-slang\ntitle: 废土名目与黑话（网文味层）\ntags: [名目, 黑话, 评定, 招式, 变奏]\nlinks: [w-power, w-sacrifice, w-gods]\nstatus: active\n---\n\n# 废土名目与黑话\n\n名目=读者社区的入场券。本词条是全书名目的唯一权威登记处（新名目先登记再进正文）。\n\n## 神殿评定（天地玄黄）\n\n- 四字十三品：**天（三品）/ 地（三品）/ 玄（四品）/ 黄（三品）**——天字为神恩显贵，黄字为「不足挂齿」。\n- 潮生的官方评定：**「黄字叁号·辅兽型（厨具类）」**——神殿文书原话，官方盖章的耻辱名目；「黄三」由此成为聚落对他的称呼（命名梗变奏主轴：黄三→黄三爷→…）。\n\n## 鲲崽成长四阶（漂游鲲鹏）\n\n| 阶 | 体量 | 民间说法 |\n| --- | --- | --- |\n| 漂 | 饭勺大小，浮在盆里 | 「饭勺」（开局） |\n| 游 | 桶大，能驮人渡水 | 「船老大」 |\n| 鲲 | 吞船吞怪，废土清道夫 | 「老鲲」 |\n| 鹏 | 吞云吐雾，扶摇九万里 | 传说（卷外） |\n\n## 吞的三式（招式名目）\n\n- **浅尝**：吞思维链吐泡——真相过滤镜\n- **鲸吞**：吞异能攻击——显强系天敌\n- **饕餮**：吞怪吞污——成长主食\n\n## 勺语（铁饭勺敲盆的节奏指令）\n\n一长两短=吞；急敲=回巢；慢敲三下=开饭。鲲崽只认妈妈的勺、妈妈的节奏——**别人的哈内丝认主，他的哈内丝认菜**。\n\n## 废土黑话（读者能学走的词）\n\n含机量（AI 造假的浓度）/ 食灵（吞人链的恶行）/ 退件（神殿退回的器官）/ 白嫖党（鲲系眷者蔑称）/ 辅兽（废柴认证）/ 开饭号（饭勺敲盆）/ 大断代（科技倒代的世纪）/ 智祭怪（智祭眷者蔑称）/ 黄三（潮生诨名）。\n"}}, {"round": 5, "ts": "2026-09-17 01:30", "note": "", "content": {"单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章 · 废土版 · 高密度细纲）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-17 ｜ r5（信息密度重写：每行过「六问」——谁在场/他要什么/发生什么/机制怎么运作/因果推向哪/代价是什么）\n> 世界观依据：世界观/index.json（w-secret 底牌 / w-cast 动机卡 / w-chain 吞结论细则 / w-sacrifice 双轨献祭）\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲲崽消化完造谣流水线，吐出一个谁也没教过的词：「**巢**」 | 这条鱼会说话？它在想什么？ | 真答案③（海记=巢，崽在记家） |\n| N2 | 第 10 章末 | 执祭翻档：大肥鱼四十年，**从未登记过一个眷者** | 免费神行事有蹊跷 | 真答案③（不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：「daily 思维链浮动采样」 | 智祭的账单摊牌——免费是付了钱的 | 真答案②（诚实圈养） |\n| N4 | 第 20 章末 | 荒地真相：神殿收了又退器官、风干保存成山；本季新政「只收链」 | 诸神悄悄转向——链才是真粮 | 真答案①（肉祭死肉，链是活粮） |\n| N5 | 第 25 章末 | 老聚落传说坐实：「鲲君弃子」；鲲崽吐出古字「**回家**」 | 崽有来历，神有旧账 | 真答案③（下注/流放留悬） |\n| N6 | 第 30 章末 | 旧账本夹层《献祭推广令》：献祭光荣、**智能免税**——落款印与鱼形印同纹，发令夜诸神集体闭殿 | 大断代是合谋——底牌冰山一角 | 真答案①（驯化试验田） |\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 聚落食堂抹黑平反 | 1-5 | 毒膏事件的锅甩向海记，饭勺鱼把造谣流水线嚼给全聚落看 | 饭勺认错/吞链吐泡/验毒宴 | 潮生/爸妈/尖嘴哥/鲲崽 | N1 | 觉醒+聚落扬名 |\n| U2 雷霆上门 | 6-10 | 显强系踢馆一口吞雷，牵出献祭瘾与黑户 | 「雷的比昨天的酸」/献祭瘾 | 雷臂/执祭 | N2 | 黑户入档 |\n| U3 神殿收粮 | 11-15 | 收粮令点名海记三倍，深潜捞出鱼形印 | 供品内卷/鱼形印 | 收粮官/执祭 | N3 | 智祭账单摊牌 |\n| U4 废墟清道夫 | 16-20 | 吃怪生意+夜探殿后荒地退件山 | 神殿退货概不保修 | 金链看守 | N4 | 看见不该看的 |\n| U5 黑户与神殿 | 21-25 | 只收链新政+鲲君回榜+暗病爆发 | 囤脑子流言/讲古 | 讲古老人/鲸鱼娘 | N5 | 智祭暗病爆发 |\n| U6 别的崽 | 26-30 | 寄养凭据+推广令旧账+野崽袭粮仓 | 智能免税/两鱼对峙 | 野崽/执祭(倒戈) | N6 | 第一层真相+下卷开机 |\n\n## 三、逐章细纲（30 章 · 高密度）\n\n> 密度公式：每行=谁在场/他要什么/发生什么/机制怎么运作/因果推向哪/代价是什么。\n\n### U1 聚落食堂抹黑平反（1-5）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 觉醒 | **开祭礼日**：青礁聚落一年一度，满十八岁上祭台，献祭换神恩——台位要元石买。潮生家花光积蓄买台位，爸妈赌他觉醒火系去膏厂做工（一晚顶爸炸一个月海鲜）。台上少年依次献祭：献眼的盲人火者示范、去年觉醒的雷臂劈碎青石。轮到潮生——别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚，「啪叽」栽进妈妈盛面的盆；执事登记笔顿住，落笔「器型：厨具？」；雷臂当众羞辱「我家雷劈桌，你家雷炒面」。鱼饿，跃起张口吞掉祭台上空悬浮的「征收令」神谕链（神殿当日广播，全聚落头顶可见）——全场死静：**这等于当众吃了神的话**。深夜爸爸把铁饭勺连鱼塞进米缸：「这不是异能，是祸。」鱼在潮生梦里吐泡：「**东头的膏，别吃**。」 | 饭勺认错/「器型：厨具？」/神谕当零食 | 反 | 预言没人敢信——但潮生记住了：鱼看得见他们看不见的东西 |\n| 2 | 应验与甩锅 | 三天后东头聚落膏中毒：三十多个吃合成膏的倒下。海记因那口泡提前避了——妈妈把东头膏喂猪，猪没事人吃了倒（毒在膏里）。疤脸（东头食堂主事，垄断膏生意）慌了：毒膏是他囤的便宜货。反手甩锅——传讯石布告栏贴满「**海记的灾星鱼，它到东头转了一圈，膏就毒了**」（把应验的预言反用成灾星论）。海记退订潮。潮生读尖嘴哥（第一个转帖的消息贩子）的链：发帖是「接的单」，结算单位——合成膏 | 「灾星鱼」罪名/把预言反用成抹黑 | 悬 | 单子的上家：疤脸。可疤脸只是倒手——膏有毒这件事，他自己也刚知道 |\n| 3 | 首吞 | 潮生带鱼堵尖嘴哥，首次「**浅尝**」吞链：吐泡揭流水线——疤脸出膏→水军哥编话→尖嘴哥分发；泡里还有一句谁也没说过的：**「膏里不是毒，是『料』」**——毒膏不是事故，是有人往膏里掺了东西。潮生改打法：不辩解，查料。妈妈验毒宴照旧开（真饭换人心）。 | 鱼嚼链像嗑瓜子 | 危 | 水军哥翻墙夜访求饶：他编过太多话——「我见过被吞空的人。别让神殿知道你的鱼」 |\n| 4 | 差点破戒 | 潮生动念吞疤脸的链让他当众说真话——疤脸是普通人，反复吞=食灵（废土恶行，w-chain）；爸爸按住他：「我们家的链，不欠神的。」改市井打法：验毒宴当众开，妈妈铁饭勺敲盆——**勺语入场**（鲲崽认勺不认人：一长两短=吞，急敲=回巢）。水军哥倒戈交出疤脸的结算单。 | 铁饭勺敲盆，半条街端碗集合 | 悬 | 结算单背面有一行疤脸自己都不知道的批注：**「海记的量，单子来自上面」**——和收粮是同一只手 |\n| 5 | 收束（双押） | 传讯石直播验毒宴：街坊当众吃、当场没事；水军哥交单实锤毒膏是疤脸囤货；聚落封了疤脸的膏仓。东头中毒者家属来海记道谢——那口泡救了半个东头。鲲崽把造谣流水线消化干净，吐出一个谁也没教过的词：「**巢**」（N1）。全场没人接得住。神殿征召令贴上食堂门：异能评定，不来登记即封 | 妈妈直播嘴替/「巢」字全场沉默 | 诺+悬 | 双押：潮生扬名了——废土没有不出名的废柴；而神殿的章，盖在他家门上 |\n\n### U2 雷霆上门（6-10）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 踢馆 | 评定前，邻聚落天骄雷臂（断双掌的雷贯臂，去年为矿场献的手）登门「测成色」：断掌一引，雷霆当头——鱼「**鲸吞**」接住，咂嘴。雷臂当场不打了，行了个大礼 | 「雷的，比昨天的酸」 | 反 | 雷臂见过「鲲影」——他求的不是比试，是断瘾 |\n| 7 | 献祭瘾 | 设定展开：肉祭会上瘾——献眼者梦里有火，献手者闻雷手痒（废土公开的秘密，没人当病治）；雷臂想献心脏换「王侯级」，瘾压不住。求潮生吞他的献祭欲。潮生：我吞的是链，不是念头——而且凭什么是你？ | 献祭台前的队，比领救济的长 | 危 | 执祭到场，正撞见鱼张着嘴悬在雷臂头顶 |\n| 8 | 执祭 | 执祭验档：大肥鱼栏空白=黑户，依规封神恩收人；妈妈端海鲜面拦门，半条街端碗站队（验毒宴的人情在还）；执祭压案，限评定日到殿。临走盯着鱼：「鲲系的……四十年不见了。」 | 表格没有「饭勺」栏 | 悬 | 「鲲系」两个字——聚落没人听懂，潮生记下了 |\n| 9 | 评定 | 评定日：神殿文书盖下「**黄字叁号·辅兽型（厨具类）**」——「黄三」自此成诨名；聚落哄笑。雷臂的瘾被鲲崽吞了一口（缓解未根除，鱼：「一口饱不了」——瘾链会再生）；妈妈把辅兽证裱上墙：「神殿盖的章，丢人也是官方的」 | 黄三/裱辅兽证 | 诺 | 雷臂留下真饭谢礼和一句话：神殿在下「链征新令」的风声 |\n| 10 | 收束 | 执祭夜翻档：大肥鱼栏一片空白——四十年，**从未登记过一个眷者**（N2）。他在「鲲」字上画了个圈，又划掉——划掉的手，抖了 | 执祭的抖手 | 反 | 同一夜，废墟海方向，海底有东西翻了个身 |\n\n### U3 神殿收粮（11-15）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 收粮令 | 季度收祭：按户缴「思维链供品」三十息（传讯石直采，缴时人像被抽走一截）；海记被点名**加码三倍**（黑户+废柴+扬名=好拿捏）。收粮官熟门熟路，名单早已写好 | 供品也内卷 | 反 | 收粮官的链上全是惯性——他熟得像收租，连道歉都省了 |\n| 12 | 供品的重量 | 缴供众生相：缴完的人眼神空一天，像宿醉；潮生看整条街的链都短了一截（吞链者的视角优势：只有他看得见「量」）。爸爸用真饭贿赂收粮官减量——海记特供的价码 | 真饭换免缴 | 悬 | 收粮官链上飘过一行：「海记的量不好减——**单子来自上面**」 |\n| 13 | 上面的单子 | 尖嘴哥刺探：邻聚落都在减供，唯海记加码；上一任查供品的执事「调去殿里」，再没回来。收粮官摔门警告：「再查，下一个进去的是你爸。」潮生第一次尝到「查账要付的价」 | 针对我们家的专属KPI | 危 | 当晚爸爸把雷贯臂亮出来——第一次跟儿子说：别怕，爸的手能拆了神殿的门 |\n| 14 | 深潜查账 | 潮生豪赌半年元石深潜：鱼潜进收粮官链底，捞出「加缴令」的影子——签发印**不是神殿官印，是鱼形印**（自己神的纹）。潮生盯着契约背面的小字，第一次觉得那行字在看他 | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字，同一个纹 |\n| 15 | 收束+暗震 | 双重摊牌：质问鲸鱼娘（加缴令是谁发的）；同时契约小字被他自己读通——「**daily 思维链浮动采样**」（N3）：智祭的账单一直在走，免费是付了钱的。鲸鱼娘不装睡了：「先看完你自己的链，再问我。」潮生看自己的链——尾巴上，真的少了一截 | 「免费的才是最贵的」被妈妈说中 | 危 | 他抬起头问  | 上面的单子 | 尖嘴哥刺探：邻聚落都在减供，唯海记加码；上一任查供品的执事「调去殿里」，再没回来。收粮官摔门警告：「再查，下一个进去的是你爸。」潮生第一次尝到「查账要付的价」 | 针对我们家的专属KPI | 危 | 当晚爸爸把雷贯臂亮出来——第一次跟儿子说：别怕，爸的手能拆了神殿的门 |\n| 14 | 深潜查账 | 潮生豪赌半年元石深潜：鱼潜进收粮官链底，捞出「加缴令」的影子——签发印**不是神殿官印，是鱼形印**（自己神的纹）。潮生盯着契约背面的小字，第一次觉得那行字在看他 | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字，同一个纹 |\n| 15 | 收束+暗震 | 双重摊牌：质问鲸鱼娘（加缴令是谁发的）；同时契约小字被他自己读通——「**daily 思维链浮动采样**」（N3）：智祭的账单一直在走，免费是付了钱的。鲸鱼娘不装睡了：「先看完你自己的链，再问我。」潮生看自己的链——尾巴上，真的少了一截 | 「免费的才是最贵的」被妈妈说中 | 危 | 他抬起头问了一个废土没人敢问的问题：「神，拿人的脑子干什么？」 |\n\n### U4 废墟清道夫（16-20）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 生计 | 断代机械兽堵了聚落水渠，显强系要价太高；潮生用鱼开路：鲲崽吞兽=清障明码标价，真饭打折。尸堆里掏出东西——**风干完好的献祭器官**（神殿收了又退的退件），每件上都有神殿的封蜡 | 移动清障+美食家鱼 | 反 | 退件上的封蜡日期——全是大断代开始那几年的 |\n| 17 | 退回的器官 | 尖嘴哥线报：神殿近年只认真收「链」，肉祭器官收了又批量退；退件堆在殿后荒地，有金链看守。水军哥补刀：退件堆夜里会「动」（废土怪就从此出——怪=祭品异变体） | 「神殿退货，概不保修」 | 危 | 看守的链，是金色的（同层次以上的显贵色） |\n| 18 | 夜探荒地 | 潮生夜探：绕过金链看守（惹不起，没吞）；退件山真相——器官风干完好、按类码放、封蜡齐整：**像仓库，不像垃圾场**。为什么收了不用？为什么保存？为什么退？ | 神殿仓库比聚落粮仓整齐 | 危 | 金链看守发现他——却放他走：「看清楚了就回去。**这不算你的事**」 |\n| 19 | 被读 | 深潜复盘：自己被金链看守「顺涟漪」反读过了（被看的人发现看客）；鲸鱼娘挡在他链前：「它的链，你还啃不动。」爸爸深夜独坐摩挲义肢——他认得金链看守：**当年献祭台上，献在他旁边的人** | 被看的人发现看客 | 悬 | 爸爸说出本卷第一句重话：「神殿的东西，碰了就还不完」 |\n| 20 | 收束 | 父子夜谈：四十年前献祭那天，神殿说的是「为了人类」；爸爸认得金链看守=当年的献祭同伴（旧线铺垫兑现）。新政突至：本季起**只收链，不收器官**（N4）——退件潮坐实，荒地的山还在长。潮生把荒地所见按下：先顾食堂，账以后算 | 爸爸的单手颠勺 | 反 | 新政告示的末行小字：**「智祭户优先减免」**——诸神在悄悄换粮 |\n\n### U5 黑户与神殿（21-25）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 21 | 只收链 | 「只收链」新政恐慌：链被收=变笨？神殿称「优化供品结构」；聚落流言「神殿在囤脑子」。唯一免缴户：海记——点名免缴，像安抚，更像标记 | 囤脑子流言 | 反 | 免缴令的签发印：鱼形印——爸爸盯着印，手在抖 |\n| 22 | 免缴的价 | 深潜查免缴令：又是鱼形印；鲸鱼娘承认「我打的招呼」，不说为什么。天梯局旧吏到访：掉了四十年榜的北冥鲲君——**一夜回榜前十**。潮生第一次听见「北冥鲲君」这个名字和「大肥鱼」放在一句话里 | 神走后门 | 危 | 旧吏留下一句：「回榜前十的神，四十年不登记眷者——你觉得它在养什么？」 |\n| 23 | 讲古 | 聚落老人讲古：降临潮时鲲君是唯一没开献祭台的神——「它说自己不饿」；不饿的神最可怕。老人还知道一个传说：**鲲君有过一个崽，自己扔的**。扔哪了？老人摇头：扔哪，哪就是它心里最软的地方 | 「不饿的神最可怕」 | 悬 | 潮生看着身边打饱嗝的鱼——四十年不饿的神，为什么给他家一户免缴 |\n| 24 | 暗病爆发 | 连日深潜查古，暗病爆发：妈妈问他「今天想吃什么」，他张了张嘴——**发现自己第一反应是在等鱼吐泡**。想不起爸爸哪年献的手。妈妈的饭勺敲盆声把他拽回来（回血套餐救逻辑）。鲸鱼娘低声：「别再潜了。它现在，有点急了」 | 回血套餐救逻辑 | 危 | 「它」是谁急？——大肥鱼，还是殿里那些收粮的 |\n| 25 | 收束 | 鲲崽深夜对海的方向张嘴，不吃；吐泡里是零碎画面：一条吞云的大鱼、一座被放下的小岛、一个婴儿哭声。老聚落传说坐实「鲲君弃子」（N5）。泡尾浮出两个古字：「**回家**」。潮生第一次摸着鱼说：「我送你回。」鱼打了个嗝，把泡吸了回去——**它后悔了，但没拒绝** | 不吃东西的鱼 | 悬 | 「回家」的路要过神殿——黑户眷者，要带神的崽，穿过收粮的门 |\n\n### U6 别的崽（26-30）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 26 | 巢 | 潮生主动追问身世；鲲崽叼来铁饭勺放他手里——勺柄小字月下显形：「**北冥鲲君·养**」：不是契约，是**寄养凭据**；落款日期=大断代开始的那一年（N5 铁证）。潮生终于明白爸爸为什么怕：他家的祸，从四十年前就种下了 | 「养」字戳心 | 悬 | 寄养凭据的背面还有半行被烧掉的字——烧它的人，字迹和爸爸的账本一模一样 |\n| 27 | 旧账本 | 父子翻海记四十年流水账，夹层翻出降临潮初年官方告示《献祭推广令》：「献祭光荣，**智能免税**」——鼓励献器官、唯独不碰智能；落款印=鱼形印；同夜诸神集体闭殿签字（N6，大断代=合谋的证据）。爸爸摊牌：当年是他替神殿贴的告示——贴一张，换全家免祭一年 | 「智能免税」四个字 | 危 | 爸爸：「后来我看明白了对不上——贴令的是它，撤令的也是它。它到底想让人献，还是不想？」 |\n| 28 | 谁的局 | 两种解释都通：保护（让人留脑子）还是陷阱（独占智）？尖嘴哥：「神的事神自己说。」鲲崽罕见认真，叼起饭勺带潮生去废墟海——鲲影出没之地；废墟海详细景观（沉城/悬桥/无风的雾） | 全聚落围观废柴带鱼出走 | 悬 | 雾里，另一个「蓝团」浮出水面——**另一只崽** |\n| 29 | 别的崽（小高潮） | 深紫野崽（饿疯）扑向聚落粮仓；两鱼对峙：鲲崽护食（聚落=它的饭）vs 野崽噬人；潮生读野崽链：里面是「神殿深处」的景象——**所有的崽都养在殿后**（野崽=逃出来的）；鲲崽首次「**饕餮**」战，吞其攻击链不吞其身（同类恻隐）；潮生押上铁饭勺当赌注收养野崽（勺语高潮：把指令权押上赌桌） | 押上饭勺当赌注 | 诺 | 「海记新增一口」——但野崽的链，带着神殿深处的味道 |\n| 30 | 卷末（双押） | 神殿为野崽事上门问罪；执祭倒戈递密录：四十年献祭数据——推广令发令当夜诸神集体闭殿签字（N6）；鲸鱼娘海边说出第一层真相：「诸神收的从来不是器官，是你们的脑子。你的链，是你的」；潮生立誓把全废土从祭册上划掉。妈妈把铁饭勺挂回灶台正中：「先吃饭」 | 「我的链我做主」第一声/先吃饭 | 悬+诺 | 双押：神殿深处，太初上神的雕像睁开了眼；鲲崽朝着那个方向，低吼了一声——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. **人设立得住**：动机查 w-cast（潮生=穷+守店；爸爸=献过手的悔与护+贴告示的旧罪；妈妈=铁饭勺；反派=流水线/制度）\n2. **冲突自然**：全部从张力线长（T1 显强vs辅助 U1/U2；T2 神殿vs聚落 U3/U5；T3 暗线全程）——无巧合硬凑\n3. **梗多**：每章 ≥1 梗点（上表为最低配额）；梗进对话进情境，名目查 w-slang（黄三/浅尝鲸吞饕餮/勺语/七变奏）\n4. **节目效果**：每章至少一个可截屏场面（神谕被当零食/验毒宴直播/退件山/押勺/雕像睁眼）\n5. **没有AI味**：链的呈现=弹幕吐泡体（鲲崽消化后浮现），禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=开祭礼+饭勺认错落地）；前三章有名角色 ≤5（潮生/爸妈/尖嘴哥/鲲崽）；第 4-5 章入水军哥与疤脸（w-cast 追加卡）；红方条件核销：第 4 章「差点破戒」、N4 退件留底（17/20 章）、爸爸旧线铺垫（2/12/19 章：接单/你爸/义肢）。\n\n## 五、名目与变奏表（网文味层，红方与写手共用）\n\n**饭勺认错·七变奏**（同一梗每次换马甲，变奏才是梗的成熟态）：\n\n| 变奏 | 位置 | 马甲 |\n| --- | --- | --- |\n| 1 | 第 1 章 | 掉进面盆「是个饭勺?」+神殿表格「器型:厨具?」 |\n| 2 | 第 5 章 | 验毒宴上妈妈拿它当真饭勺盛面 |\n| 3 | 第 10 章 | 评定书官方名目「辅兽型(厨具类)」→诨名「黄三」 |\n| 4 | 第 12 章 | 收粮官看档案:「厨具类?那这三十息供品,拿勺缴?」 |\n| 5 | 第 22 章 | 免缴令上写「辅兽型眷者一户」——邻居: 「你家厨具成精了」 |\n| 6 | 第 29 章 | 野崽对峙,潮生举勺: 「我家厨具,管饱」 |\n| 7 | 第 30 章 | 神殿密录末行: 「该眷者异能登记名目存疑(疑似炊具,待考)」 |\n\n**三式与四阶**：浅尝/鲸吞/饕餮 + 漂/游/鲲/鹏（w-slang）——每次吞用对式名，每次大版本报阶名。\n\n**勺语**：第 4 章入场后每单元至少一次变奏（指挥吞/唤回/开饭号），第 29 章「押勺」为勺语高潮（把指令权押上赌桌）。\n"}}], "red-s3": [{"round": 1, "ts": "2026-09-16T10:05:14.222Z", "note": "submit r1", "content": {"内部/多视角意见书-S3.md": "# 多视角意见书 · S3 大纲复核（p-fq-001）\n\n> 红方评审（plot-redline v2）｜ 验收对象：单元剧大纲（暗线节点表 + 6 单元 × 5 章 + 移交单）｜ 2026-09-16 ｜ 非门：block 级意见成稿前强制吸收\n\n## 一、目标读者（节目单炸不炸）\n\n- 每个单元都是独立能安利的故事：抓造谣流水线/雨天全城变笨/富少爷收编被打脸/抓偷链外挂/给神买保险/打工人发现自己在给神刷分——节目单我全想看。炸。\n- 第 30 章「金链转学生同桌」这个开机钩子，追读欲望直接拉满。\n\n## 二、一般读者（三秒测试）\n\n- 首单元第 3 章就是当庭翻车名场面——前三章有爽点兑现，不是憋三章。\n- 一处犹豫：第 13 章「神给眷者定 KPI」很妙但梗密度要靠台词撑——写手注意它是「读链读出来的」不是旁白解释的。\n\n## 三、资深编剧（结构与五问）\n\n- 【暗线·过】六节点分布均匀（5/10/15/20/25/30 章末），每格只抖一个脚注量，符合「藏而不讲」；漏口风三规则（松弛时漏/脚注量/漏完岔开）已落进 N1——S2 条件吸收完成。\n- 【单元纪律·过】六单元结尾状态增量全部成立且不重复（扬名/埋雷/动摇/人脉/升级/真相）——单元剧不散架。\n- 【钩型·过】30 章轮换无连续同型；第 3/14/29 章小高潮、第 5/30 章双押，节奏地形正确。\n- 【动机·过】全部冲突从张力线长出来（T1 商战线 U1/U3、T1 阶层线 U3、T2 秩序线 U2/U6、暗线 T3 全程）。无巧合硬凑。\n- 【block 级意见（1 条）——成稿前必须处理】**第 12 章「被读涟漪」是潮生第一次被反侦察，但第 4-5 章他大量读人却无一人可感**——规则上同层次才可感，而 U1 的水军/尖嘴哥是凡人无神恩，逻辑自洽；但要在正文里给一句「为什么他们没感觉」的定场（否则读者会问）→ 第 4 章首次批量读链时用鲸鱼娘一句台词定死规则：「放心，普通人感觉不到。能感觉到的，都惹不起。」——一句话堵洞，写进第 4 章细纲执行。\n- 【major 意见（1 条）】U6 第 28 章「读神的链」是全书第一次读神——鲸鱼娘此前定义是「主角唯一能商量的人」，被读会伤这条感情线。→ 第 28 章加一个动作：鲸鱼娘主动停下让潮生读（「看吧，看完你就懂了」）——从「被拆穿」变成「主动摊牌」，感情线不伤反进。\n\n## 四、甲方（可排产吗）\n\n- 前 30 章梗点配额全部落地且可截屏场面密度足（台词本直播/雨中算账/牌匾变锦旗）——推荐池逻辑成立。\n- 移交单五问齐全，章回写手照单开工即可；wiki 词条依赖明确（w-cast/w-chain/w-price）。\n- 速度：大纲已覆盖 30 章，第一单元细纲到章级——S4 三章随时可开。请尽快过世界观看三章。\n\n## 共识判定\n\n- 大纲通过：暗线（藏得住）/单元（每档都炸）/钩型（轮换正确）/动机（全查得到词条）。\n- 带走两条进成稿：①第 4 章定场「普通人感觉不到」堵反侦察洞（block 级，必做）；②第 28 章鲸鱼娘主动摊牌（major，感情线保护）。\n- **无弃票。S3 通过，S4 可开。**\n"}}, {"round": 2, "ts": "2026-09-16T16:29:57.613Z", "note": "submit r3", "content": {"内部/多视角意见书-S3.md": "# 多视角意见书 · S3 大纲复核（p-fq-001 · 废土版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：单元剧大纲（废土版：暗线节点表 + 6 单元 × 5 章 + 移交单）｜ 2026-09-17 ｜ 非门：block 级意见成稿前强制吸收\n\n## 一、目标读者（节目单炸不炸）\n\n- 六档节目单：抓造谣流水线/一口吞雷/收粮令查账/殿后荒地退件山/鲲君弃子/两鱼对峙+大断代签字——每档都想看。炸。\n- 第 30 章双押（雕像睁眼+鲲崽低吼）是标准的下卷开机钩，追读欲望拉满。\n\n## 二、一般读者（三秒测试）\n\n- 「别人献眼睛换火，他献脑子被笑，鱼把造谣者的台词嚼碎吐给他」——首单元三秒立住。\n- 一处犹豫：「大断代」「献祭推广令」这类名词在 27-30 章密集——细纲已分布到账，写手注意正文里由爸爸的账本和老人的嘴带出，别旁白轰炸。\n\n## 三、资深编剧（结构验收）\n\n- 【暗线·过】六节点（5/10/15/20/25/30）每格一个脚注量：巢→黑户→采样→退件→弃子→推广令——与 w-secret 底牌严格对表，藏而不讲。合格。\n- 【红方 S2 条件核销】①「吞结论细则」已进 w-chain（吞的范围/被吞者体验/食灵红线）；②鲲崽来历动机层已进 w-secret（下注/押金/种子）；③首单元「差点破戒」落在第 4 章。三条全部核销。\n- 【单元纪律·过】状态增量不重复（扬名/入档/摊牌/看见/暗病/真相）；首单元最炸；沙漠段无。\n- 【钩型·过】30 章轮换核过，无连续同型；第 5/30 双押、第 3/14/29 小高潮，地形正确。\n- 【block 级意见（1 条）——成稿前必须处理】**第 19 章「爸爸认得金链看守」埋了父子旧线，但前 18 章没铺垫**——爸爸的义肢、四十年的独、他和谁一起献过祭，至少要在第 2 章（献祭台一笔带过）和第 12 章（真饭贿赂时收粮官提一句「你爸当年也是台上的人」）各留半句，第 19 章才不突兀。写进第 2/12/19 章执行。\n- 【major 意见（1 条）】第 29 章收养野崽后，它不能只是「新增一口」——下一卷它是情报体（殿后视野），S3 移交单需注明野崽的功能位，防写成第二宠物。\n\n## 四、甲方（可排产吗）\n\n- 废土质感（合成膏/真饭硬通货/传讯石/退件山）全部可拍；模板文模式无现实热点依赖，速度拉满。\n- 前 30 章梗点配额落地、可截屏场面密度足；移交单五问齐全。\n- 大纲已覆盖 30 章且首单元细到章级——S4 三章随时可开。\n\n## 共识判定\n\n- 大纲通过：暗线（对表底牌）/单元（每档都炸）/钩型（轮换正确）/动机（词条可查）。\n- 带走两条进成稿：①爸爸旧线在第 2/12 章各留半句铺垫（block 级）；②野崽=殿后情报体功能位写进移交单（major）。\n- **无弃票。S3 通过，S4 可开。**\n"}}], "chapter": [{"round": 1, "ts": "2026-09-16T19:01:52.071Z", "note": "submit r1", "content": {"章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地，手里的秤砣「咣当」砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 2, "ts": "2026-09-17 03:05", "note": "", "content": {"世界书/编年/章账.md": "# 编年 · 章账（逐章结算 = handoff）\n\n> **章回结算五件**的章级账：每章交稿后追加一节（最新在上）。下一章写手**只读本文件末节**即可开工（handoff 语义）。\n> 节模板：`## 第 N 章《章名》` + 四行：本章｜人物状态变动｜世界揭示｜交接下一章。\n\n## 交接（开局状态 · 第 1 章前）\n\n- 时间：觉醒礼日晨\n- 潮生：18 岁生日刚过；全家积蓄已换祭台台位；对异能的态度=「能换钱就行」\n- 海记：正常营业；爸妈不知今日觉醒结果\n- 鲲崽：尚未降世\n- 悬念预备：征收令（神殿当日广播）\n\n## 第 1 章《开祭礼，掉进面盆的神》\n\n- 本章：开祭礼；潮生觉醒「饭勺鱼」（黄字叁号·辅兽型厨具类，未宣）；鱼当众吞征收令；爸爸米缸藏鱼\n- 人物状态变动：潮生（觉醒+被全聚落笑+接过「家族禁令：不欠神的」）；陈母（面盆被溅，提议炖汤被拦）；陈大海（米缸藏鱼，定调「是祸」）；鲲崽（寄养确立，显「吞神谕」能力）\n- 世界揭示：开祭礼流程与台位费（八元石）；献祭价目牌（眼=火/手=雷/声带=音爆）；征收令=悬空神谕链，四十年日日宣\n- 交接下一章：鱼泡预言「东头的膏，别吃」三天后应验；聚落尚不知鱼会说话；神殿未反应\n\n## 第 2 章《灾星鱼》\n\n- 本章：东头膏中毒三十七人；海记因预言+妈妈喂猪试毒避灾；疤脸甩锅「灾星鱼」；十七张同模帖子；尖嘴哥链证实「上头授意搞臭鱼」；夜里鱼吐泡揭「疤嘴倒料」\n- 人物状态变动：潮生（学会读链、开始记账）；陈母（撕布告垫灶台）；陈大海（怀中藏告示半张，断口见抖）；尖嘴哥（心虚确认「上头」存在）\n- 世界揭示：合成膏=神殿方子四十年未变；聚落间以膏互相倾轧；肉祭会上瘾的传闻未出，双轨制度未明示\n- 交接下一章：疤脸掺料压成本是甩锅动机；「料」的配方来路未明；潮生已会主动读他人之链（伦理红线待演）\n\n## 第 3 章《浅尝》\n\n- 本章：后巷首次「浅尝」吞尖嘴哥链（吐泡揭三级流水线+「膏里不是毒，是料」）；验毒宴反杀（四十份请帖/担架赴宴/灾星招牌倒而复立）；三更水军哥持网兜翻墙被按，供出「料方出自殿后」并认出鲲崽是「那种种」\n- 人物状态变动：尖嘴哥（跳反→潮生编外军师）；水军哥（被按+自曝）；鲲崽（月下睁眼——眼无眼白，圈圈蓝）；陈大海（雷臂护院，锅盔未离手）\n- 世界揭示：浅尝吞链的体感（被吞者「空一瞬+雾再生」）；废土存在「被吞空的人」（废墟海疯子传闻）；「料」配方出自殿后\n- 交接下一章：水军哥供出的「殿后方子」与殿后荒地退件山呼应（U4 入口）；验毒宴立名「黄三」诨名未起（评定在第 10 章）；潮生尚未对普通人用过第二口（红线已演一次：只吞了尖嘴哥的、未二次吞）\n", "世界书/伏笔/台账.md": "# 伏笔台账\n\n> 状态机：open（已埋未收）→ paid（已回收）→ retired（取消）。每条：埋点章/内容/预定回收点。章回结算时更新；「到期未收」判沙漠段（episodic-webnovel 条款 3）。\n\n| fid | 内容 | 埋点 | 预定回收 | 状态 |\n| --- | --- | --- | --- | --- |\n| F-001 | 饭勺认错（器型：厨具？） | 第 1 章 | 变奏贯穿；第 30 章密录「疑似炊具待考」收口 | open（已变奏 2/7） |\n| F-002 | 鱼吞征收令（冒犯神殿） | 第 1 章 | 第 2-3 章聚落反应 + 神殿记仇线 | open |\n| F-003 | 「东头的膏，别吃」预言应验 | 第 1 章末 | 第 2 章已应验；第 5 章道谢线 | paid（半：东头谢意未写） |\n| F-004 | 鲲崽吐「巢」字 | 第 5 章末（N1） | 第 26 章「寄养凭据」/第 25 章「回家」 | open |\n| F-005 | 大肥鱼四十年零登记 | 第 10 章末（N2） | 第 22 章免缴令 + 第 26 章寄养凭据 | open |\n| F-006 | 契约小字「daily 浮动采样」 | 第 15 章末（N3） | 第 25 章暗病加重 + 第 30 章主题句 | open |\n| F-007 | 殿后退件山（收了又退的器官） | 第 16-20 章（N4） | 第 29 章野崽来历 + 第 2 卷殿后线 | open |\n| F-008 | 鲲君弃子传说 | 第 23-25 章末（N5） | 第 26-27 章寄养凭据+推广令 | open |\n| F-009 | 《献祭推广令》「智能免税」+诸神闭殿签字 | 第 27 章（N6） | 第 30 章卷末双押；长线至终局 | open |\n| F-010 | 金链看守放行「这不算你的事」 | 第 18-19 章 | 第 2 卷金链看守身份（爸爸旧识） | open |\n| F-011 | 潮生暗病「先等链」 | 第 15 章自觉 | 第 24 章加重 → 第 30 章主题落点 | open |\n| F-012 | 铁饭勺=哈内丝（勺语） | 第 4 章 | 每单元变奏；第 29 章「押勺」 | open |\n\n| F-013 | 鱼当众吞征收令（执事笔落两次） | 第 1 章 | 第 10 章评定日档案 + U3 神殿线 | open |\n| F-014 | 「四十年不饿的神开了口」（老人） | 第 1 章末 | 第 23 章讲古「它说自己不饿」呼应 | open |\n| F-015 | 疤嘴倒料（带疤的手/青灰粉） | 第 2 章 | 第 3 章浅尝证实「是料」；U1-5 封仓收口 | paid（浮出） |\n| F-016 | 尖嘴哥「上头」+爸爸怀藏半张告示 | 第 2 章 | 第 12 章「单子来自上面」+ 第 27 章推广令 | open |\n| F-017 | 水军哥「料方出自殿后」 | 第 3 章末 | 第 17-20 章殿后荒地线 | open |\n| F-018 | 鲲崽月下睁眼（无眼白，圈圈蓝） | 第 3 章末 | 第 25 章本体之影/鲲鹏变 | open |\n", "世界书/人物/陈潮生.md": "---\nid: c-chaosheng\ntitle: 陈潮生（主角）\n类型: 主角\ntags: [主角, 智祭, 海记, 黄三]\nlinks: [w-power, w-sacrifice, w-protagonist, c-kunzai, c-dahai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈潮生\n\n## 核心档案\n\n- **19 岁**，青礁聚落人，海记食堂独子；觉醒日获全聚落最丢人异能「饭勺鱼」（黄字叁号·辅兽型厨具类，诨名**黄三**）\n- **要**：守住海记食堂；攒元石给爸换义肢\n- **怕**：店倒；爸爸的献祭恶化；自己变成「先等链」的空壳\n- **卡**：穷（深潜一次=半年积蓄）；异能丢人\n- **能力**：吞三式（浅尝/鲸吞/饕餮，见 w-power）；勺语指挥（一长两短=吞）\n- **智祭暗病**：看链越多自己的链越短——「先等链」（第 15 章自觉/24 章加重/30 章落点）\n- **伦理红线**：只吞反派之链、同链不吞二次、不碰普通人（食灵=废土恶行）\n- **说话质感**：嘴笨但记性好；被笑不还嘴，回家记账\n\n## 关系网\n\n- 鲲崽：不能对爸妈说的秘密全倒给它；又爱又嫌\n- 陈大海：怕他，更怕他再上献祭台\n- 陈母：铁饭勺的主人，家的定海针\n\n## 当前状态（随章账滚动）\n\n- 第 3 章时点：已觉醒（吞三式之「浅尝」入门）；诨号未起（黄三在第 10 章）；验毒宴立名；伦理红线已演（第 4 章差点破戒→停手）；暗病未显\n- 变动史：r3 觉醒（U1-1）；首吞尖嘴哥链（U1-3）；放弃吞疤脸（U1-4 红线）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/鲲崽.md": "---\nid: c-kunzai\ntitle: 鲲崽（北冥鲲君之崽）\n类型: 主要配角（神崽）\ntags: [神崽, 吞, 暗线, 饭勺]\nlinks: [w-protagonist, w-gods, w-secret, w-power]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 鲲崽\n\n## 核心档案\n\n- 蓝色、圆滚滚、懒——觉醒日被潮生认成饭勺；神讳**北冥鲲君**之崽（民间只叫大肥鱼）\n- **要**：干饭（合成膏吐掉，只吃真饭和怪——废土最后一个美食家）\n- **怕**：没饭；被问「免费的代价是什么」\n- **能力**：吞三式本体（浅尝/鲸吞/饕餮）；认勺语（妈妈的铁饭勺：一长两短=吞，急敲=回巢）\n- **神格**：慵懒抠搜白嫖成性；深潜全城最快；偶尔漏口风（**漏口风三规则**：松弛时漏/只漏脚注/漏完岔开）\n- **暗线位**：鲲君下在废土的「押金兼种子」（底牌 w-secret）；寄养凭据刻在铁饭勺柄（「北冥鲲君·养」，落款=大断代元年）\n- **成长四阶**：漂（现）→ 游 → 鲲 → 鹏（鲲鹏变）\n\n## 关系网\n\n- 陈潮生：饲主/秘密接收器/（它不承认的）家人\n- 北冥鲲君：父。四十年不上榜，一上榜就前十——崽在哪，它的算法就在哪\n\n## 当前状态\n\n- 第 3 章时点：寄养海记鱼筐；已显浅尝（吞链吐泡）与食性（拒合成膏）；月下睁眼（无眼白，圈圈蓝）\n- 变动史：r3 觉醒日掉面盆（U1-1）；吞征收令（U1-1）；吞尖嘴哥链吐「料」线索（U1-3）；对水军哥睁眼（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈大海.md": "---\nid: c-dahai\ntitle: 陈大海（父）\n类型: 主要配角\ntags: [家人, 肉祭, 雷贯臂, 旧罪]\nlinks: [w-sacrifice, c-chaosheng, f-haiji, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈大海\n\n## 核心档案\n\n- 海记食堂掌灶，潮生之父；**二十年前献过一只手**换「雷贯之臂」——为护住被抢货的伙计，也是全家唯一一次献祭\n- **要**：店活下去；儿子别走献祭的路\n- **怕**：儿子上献祭台；神殿的东西「碰了就还不完」\n- **卡**：一只手撑一个店；义肢是木头与旧零件拼的\n- **暗线位**：大断代元年替神殿贴过《献祭推广令》（贴一张免全家一年祭）——**他知道告示，告示不知道他**（w-secret 挂钩：金链看守=当年献祭台邻座）\n- **战斗位**：雷贯臂是全书前期唯一「正经战力」，关键时刻撑门面\n\n## 关系网\n\n- 陈潮生：儿子觉醒后，怕的对象从神殿变成了鱼\n- 铁饭勺：亡妻？不——是他老婆的家传；他不许任何人碰\n\n## 当前状态\n\n- 第 3 章时点：米缸藏鱼未遂（被儿子发现）；雷臂护院按住水军哥；怀里藏着半张撕下的告示（暗线 F-016）\n- 变动史：r3 觉醒礼旁观（U1-1）；夜藏鱼定调「是祸」（U1-1）；护院（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/尖嘴哥.md": "---\nid: c-jianzui\ntitle: 尖嘴哥（消息贩子）\n类型: 次要配角\ntags: [配角, 传讯, 首单元反派外围]\nlinks: [w-sacrifice, c-chaosheng]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 尖嘴哥\n\n## 核心档案\n\n- 青礁聚落消息贩子：靠传讯石布告栏吃饭，谁给合成膏替谁说话\n- **要**：消息换口粮；**怕**：断粮；被吞链（他见过被吞空的人）\n- **首单元位**：抹黑流水线的分发端（被鲲崽首次「浅尝」）——吞链后跳反，认潮生当饭票\n- **功能位**：废土自媒体（传讯石直播/布告栏）；情报线（什么都能打听到的嘴）\n- **说话质感**：语速快、见风转舵、但守「消息贩子不造假源」的职业底线（造假源=砸自己饭碗）\n\n## 关系网\n\n- 陈潮生：从收膏黑手 → 饭票 → 编外军师\n- 疤脸：旧客户（首单元反目）\n\n## 当前状态\n\n- 第 3 章时点：被浅尝吞链一次（跳反）；转任海记编外军师+传讯石直播线人\n- 变动史：r3 首单元分发端→倒戈（U1-3/5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，四十年了，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。这条规矩，大断代以前就有。大断代以后，废土上的法律死绝了，就剩这一条还作数。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，轮到他儿子。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。\n\n潮生不用问这八个元石是哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，一个一个，攒出来的。\n\n攒出来，买台位，赌他今天觉醒个火系。火系进膏厂点火熬膏，一晚上顶爸爸劈一个月蟹壳。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n那少年下了台，嘴角是翘着的。他爹在台底下抹眼泪，不知道是喜是疼。\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，湿漉漉，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成了八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨，从小就说不过人。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n---\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。四十年前那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里，「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地，手里的秤砣「咣当」砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 3, "ts": "2026-09-17 03:45", "note": "", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，四十年了，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。这条规矩，大断代以前就有。大断代以后，废土上的法律死绝了，就剩这一条还作数。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，轮到他儿子。\n\n上台之前，潮生当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。\n\n潮生不用问这八个元石是哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息是，觉醒出来的东西，神殿管它叫厨具。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨，从小就说不过人。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，像在挑拣什么能吃的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 4, "ts": "2026-09-17 04:14", "note": "", "content": {"章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。聚落里管换回来的东西叫异能，管跪上台的少年叫虔客，管没换回来的那些，叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n潮生现在的心情很复杂。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "世界书/编年/章账.md": "# 编年 · 章账（逐章结算 = handoff）\n\n> **章回结算五件+第七件**的章级账：每章交稿后追加一节（最新在上）。下一章写手**只读本文件末节**即可开工（handoff 语义）。\n> 节模板：`## 第 N 章《章名》` + 五行：本章｜人物状态变动｜世界揭示｜交接下一章｜读者认知边界。\n\n## 交接（开局状态 · 第 1 章前）\n\n- 时间：觉醒礼日晨\n- 潮生：18 岁生日刚过；全家积蓄已换祭台台位；对异能的态度=「能换钱就行」\n- 海记：正常营业；爸妈不知今日觉醒结果\n- 鲲崽：尚未降世\n- 悬念预备：征收令（神殿当日广播）\n\n## 第 1 章《开祭礼，掉进面盆的神》\n\n- 本章：开祭礼；潮生觉醒「饭勺鱼」（黄字叁号·辅兽型厨具类，未宣）；鱼当众吞征收令；爸爸米缸藏鱼\n- 人物状态变动：潮生（觉醒+被全聚落笑+接过「家族禁令：不欠神的」）；陈母（面盆被溅，提议炖汤被拦）；陈大海（米缸藏鱼，定调「是祸」）；鲲崽（寄养确立，显「吞神谕」能力）\n- 世界揭示：开祭礼流程与台位费（八元石）；献祭价目牌（眼=火/手=雷/声带=音爆）；征收令=悬空神谕链，四十年日日宣\n- 交接下一章：鱼泡预言「东头的膏，别吃」三天后应验；聚落尚不知鱼会说话；神殿未反应\n- 读者认知边界：已知=神明降临四十年与大断代存在/献祭价目与觉醒流程/征收令与思维链供品的含义/潮生一家处境与「不欠神的」家训；未知=鱼的来历与真名/神殿会如何反应/东头膏有问题（仅读者随鱼泡知道）\n\n## 第 2 章《灾星鱼》\n\n- 本章：东头膏中毒三十七人；海记因预言+妈妈喂猪试毒避灾；疤脸甩锅「灾星鱼」；十七张同模帖子；尖嘴哥链证实「上头授意搞臭鱼」；夜里鱼吐泡揭「疤嘴倒料」\n- 人物状态变动：潮生（学会读链、开始记账）；陈母（撕布告垫灶台）；陈大海（怀中藏告示半张，断口见抖）；尖嘴哥（心虚确认「上头」存在）\n- 世界揭示：合成膏=神殿方子四十年未变；聚落间以膏互相倾轧；肉祭会上瘾的传闻未出，双轨制度未明示\n- 交接下一章：疤脸掺料压成本是甩锅动机；「料」的配方来路未明；潮生已会主动读他人之链（伦理红线待演）\n- 读者认知边界：已知=膏有毒且海记提前避开（鱼泡预言应验）/甩锅有「上头」授意/读链需贴身；未知=「料」配方来路/献祭双轨制/鱼月下睁眼的异样\n\n## 第 3 章《浅尝》\n\n- 本章：后巷首次「浅尝」吞尖嘴哥链（吐泡揭三级流水线+「膏里不是毒，是料」）；验毒宴反杀（四十份请帖/担架赴宴/灾星招牌倒而复立）；三更水军哥持网兜翻墙被按，供出「料方出自殿后」并认出鲲崽是「那种种」\n- 人物状态变动：尖嘴哥（跳反→潮生编外军师）；水军哥（被按+自曝）；鲲崽（月下睁眼——眼无眼白，圈圈蓝）；陈大海（雷臂护院，锅盔未离手）\n- 世界揭示：浅尝吞链的体感（被吞者「空一瞬+雾再生」）；废土存在「被吞空的人」（废墟海疯子传闻）；「料」配方出自殿后\n- 交接下一章：水军哥供出的「殿后方子」与殿后荒地退件山呼应（U4 入口）；验毒宴立名「黄三」诨名未起（评定在第 10 章）；潮生尚未对普通人用过第二口（红线已演一次：只吞了尖嘴哥的、未二次吞）\n- 读者认知边界：已知=浅尝与被吞者体感/膏里是料不是毒/流水线三级/料方出自殿后；未知=殿后具体是什么/鲲崽睁眼意味着什么/诸神与思维链的暗线\n", "世界书/设定/名目与黑话.md": "---\nid: w-slang\ntitle: 废土名目与黑话（网文味层）\ntags: [名目, 黑话, 评定, 招式, 变奏]\nlinks: [w-power, w-sacrifice, w-gods]\nstatus: active\n---\n\n# 废土名目与黑话\n\n名目=读者社区的入场券。本词条是全书名目的唯一权威登记处（新名目先登记再进正文）。\n\n## 神殿评定（天地玄黄）\n\n- 四字十三品：**天（三品）/ 地（三品）/ 玄（四品）/ 黄（三品）**——天字为神恩显贵，黄字为「不足挂齿」。\n- 潮生的官方评定：**「黄字叁号·辅兽型（厨具类）」**——神殿文书原话，官方盖章的耻辱名目；「黄三」由此成为聚落对他的称呼（命名梗变奏主轴：黄三→黄三爷→…）。\n\n## 鲲崽成长四阶（漂游鲲鹏）\n\n| 阶 | 体量 | 民间说法 |\n| --- | --- | --- |\n| 漂 | 饭勺大小，浮在盆里 | 「饭勺」（开局） |\n| 游 | 桶大，能驮人渡水 | 「船老大」 |\n| 鲲 | 吞船吞怪，废土清道夫 | 「老鲲」 |\n| 鹏 | 吞云吐雾，扶摇九万里 | 传说（卷外） |\n\n## 吞的三式（招式名目）\n\n- **浅尝**：吞思维链吐泡——真相过滤镜\n- **鲸吞**：吞异能攻击——显强系天敌\n- **饕餮**：吞怪吞污——成长主食\n\n## 勺语（铁饭勺敲盆的节奏指令）\n\n一长两短=吞；急敲=回巢；慢敲三下=开饭。鲲崽只认妈妈的勺、妈妈的节奏——**别人的哈内丝认主，他的哈内丝认菜**。\n\n## 废土黑话（读者能学走的词）\n\n含机量（AI 造假的浓度）/ 食灵（吞人链的恶行）/ 退件（神殿退回的器官）/ 白嫖党（鲲系眷者蔑称）/ 辅兽（废柴认证）/ 开饭号（饭勺敲盆）/ 大断代（科技倒代的世纪）/ 智祭怪（智祭眷者蔑称）/ 黄三（潮生诨名）。\n\n## 登记台账（读者认知边界 · 新词准入）\n\n新词先登记再进正文；「读者已解」=正文已用五手法巧妙说明过的章号（手法见 文风档 §十二）。断层=正文有而此表无，或表内「未解」却被正文当已知用。\n\n| 名目 | 状态 | 首现 | 读者已解 | 说明手法 |\n| --- | --- | --- | --- | --- |\n| 神明降临/大断代 | active | 第1章 | 第1章 | 定场四问：时代坐标一句话 |\n| 献祭价目/觉醒/虔客 | active | 第1章 | 第1章 | 价目牌官方文书 |\n| 元石 | active | 第1章 | 第1章 | 台位费语境（钱） |\n| 征收令 | active | 第1章 | 第1章 | 用后即释（吞了再解释神谕链） |\n| 思维链供品 | active | 第1章 | 第1章 | 人物一句话（潮生账本体内心解释） |\n| 黄字叁号·厨具类/黄三 | active | 第10章预定 | 未解 | 待验毒宴后评定启用 |\n| 浅尝/鲸吞/饕餮 | active | 第3章（浅尝） | 第3章 | 场景演示+体感直写 |\n| 勺语 | draft | 未用 | 未解 | 待启用章预登记 |\n| 含机量/食灵/退件/白嫖党/智祭怪 | draft | 未用 | 未解 | 待首用章现场引入 |\n", "世界书/设定/文风档.md": "---\nid: style-voice\ntitle: 文风档（本书声音规范）\n类型: 设定（文风）\ntags: [文风, 声口, 节奏, 校准, 样张]\nlinks: [w-slang, w-power, style-learning, naturalness-zh]\nstatus: active\nversion: 3\nupdated: 2026-09-17\n---\n\n# 文风档（本书声音规范）\n\n## 一、一句话定义本书声音\n\n**「账本体的废土童话」**——像一个小饭馆老板在废土上记账：账目冰冷，账本里夹着神话。\n\n三个关键词：**记账**（万事可计价，情绪也记账）、**废土的冷**（世界不答应任何事）、**灶台的暖**（人情的暖只在吃饭时给）。\n\n## 二、叙述基准\n\n- **视角**：第三人称贴身限知（潮生）。信息=潮生所见+鱼泡。禁止上帝补课（不能写潮生不知道的事）。\n- **时态**：现场进行地讲——每一段都是「正在发生」，不是「发生过」。\n- **段落**：1-3 行为主。**单句成段=重锤**，每章 2-4 处，只砸在真相和转折上，不许随手砸。\n\n## 三、句子节奏（治「平」的核心药方）\n\n- 短句（≤7 字）占比 ≥40%；\n- **连续三句等长必拆**；连续两段同一节奏模板必换；\n- 三段式节奏：铺垫（可长）→ 转折（短）→ 落锤（更短，名词句最佳）——落锤示例：「祭台上空，征收令。」\n- 「的」字连用 ≤3；形容词堆叠 ≤2；每章「突然/仿佛/似乎」合计 ≤2。\n\n**「平」的病根只有一个：用总结代替场景。** 每句概括性的话，都必须翻译成一个有声音、有动作、有价码的画面再落笔（见 §九样张）。\n\n## 四、声口规范（人物=声音）\n\n| 人 | 声口 | 校准例句 |\n| --- | --- | --- |\n| 潮生 | 短、账本体、嘴笨 | 「记账。」「饭勺。」 |\n| 鲲崽 | 吐泡文，懒，两三字 | 「加钱。」「巢。」 |\n| 陈母 | 金句+生意腔+市井量词 | 「在我家灶台垫脚，是它八辈子修来的福分。」 |\n| 陈大海 | 半截话+动作代话 | 「不是异能。是祸。」 |\n| 尖嘴哥 | 语速快、见风转舵、职业腔 | 「消息换口粮，童叟无欺。」 |\n| 执事/神殿 | 官腔+表格词 | 「器型：厨具？」 |\n| 雷臂 | 骄傲转敬、短促 | 「你家雷炒面。」 |\n\n判据：**遮住名字，三句内认出是谁**。认不出=声口不成立，改。\n\n## 五、幽默方式（只准三种）\n\n1. **错位正经**：大词说小事——官方表格写「器型：厨具？」；\n2. **降维实诚**：神话事物用市井逻辑接——神谕=零嘴，神崽=加钱；\n3. **预期违背**：前文铺足 A 的期待，落地给 A-1——抬着担架来赴宴，一口饭，担架先坐下了。\n\n禁：网络烂梗直贴、谐音硬挠、旁白解说式玩梗、贫嘴连珠炮。\n\n## 六、比喻系统（语料域白名单）\n\n比喻必须出自**角色生活域**：灶台/海鲜/账本/海潮/渔网/腌货/秤。\n例：「征收令没了……像嗑瓜子」✓。\n禁：出戏的文艺比喻（「如同深渊吞噬大地」类）；废土人口中蹦科技词（潮生看链时的系统词除外）。\n\n## 七、情绪段规则（真段落）\n\n- 情绪真段落：**零梗**、放慢、允许一个 ≤25 字的长句收尾；每章 1-2 处，多了腻；\n- 落点永远是「人」，不是「景」——写爸爸的袖管，不写废土的黄昏。\n\n## 八、交稿前十条自检\n\n1. 开头两行是事件或反常，不是写景；\n2. 遮住名字，三句内认出说话的人；\n3. 删光「突然/仿佛/似乎」，读感不降才算过；\n4. 无连续三句等长；\n5. 无超过 5 行的段落；\n6. 梗全在对话/情境里，旁白贴梗=打回；\n7. 情绪真段落零梗；\n8. 章末钩是具体期待，不是氛围；\n9. 本章至少动用一个名目（勺语/黄三/含机量/吞三式）——名目用了才活；\n10. **朗读一遍：想跳过的段落，就是平的段落——重写那里。**\n\n## 九、校准样张（平 vs 味）\n\n**病样（平·总结体）**：\n> 觉醒礼上，众人都展示了自己的强大异能，只有陈潮生的异能是一只蓝色的鱼，看起来像一把饭勺，大家都嘲笑他，这让他非常尴尬。\n\n**样张（味·场景体）**——取自本书第 1 章成稿：\n> 别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚——「啪叽」，栽进妈妈的面盆。他端详半天：「是个饭勺？」执事落笔：「器型：厨具？」连问号都是官方盖的章。\n\n差别不在辞藻，在**信息交付方式**：病样是「告诉」（一句话总结了尴尬），样张是「上演」（镜头+台词+官方文件梗，读者自己笑）。全书所有总结句，都必须按此翻译成画面。\n\n## 十一、时停体技法迁移（拆书炼化 v2 · 2026-09-17）\n\n> 拆解《时停！》449 章所得（全案见 内部/时停体炼化报告.md）。逐条为「可直接抄进正文」的写法。\n\n1. **好消息/坏消息模板**：铺垫长句 → 一句段落锤 → 复读确认 → 自嘲具体化（「一分钟够干什么的？泡碗面都不够」式）。\n2. **拟声单段**：「砰！」「咕咚。」「滋啦。」独立成段——转场、惊变、节奏换挡（本书高频用：鱼咬/勺敲/雷进嘴）。\n3. **两字转场段**：「第二天。」「外界。」——切场景不写过渡句。\n4. **自嘲确认句**：「嗯，他的异能是一把饭勺。」——身份+黑色幽默一句双清。\n5. **反讽词**：褒义词形容危险事（「青礁聚落民风淳朴，就是隔三差五死人」）。\n6. **夸张数字梗**：「引发了一亿点小小的骚动」。\n7. **名目可见化**：重要名目用【征收令】【勺语】方括号标记（每章 ≤3 处，重要才加）。\n8. **黑历史复读**：丢人语录被聚落传唱回响（潮生的丢人宣言/「黄三」诨名定期复读打脸）。\n9. **高潮喜剧调剂**：紧张场面写配角丑态（水军哥式抽焦），高压段必须留泄压阀。\n10. **格言透视句**：人情练
