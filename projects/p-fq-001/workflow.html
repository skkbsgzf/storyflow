我发请帖……第二，给我水军哥的住处。」——120 字单回合倾倒，两件事之间没有任何反应拍。**方向：在「第一」与「第二」之间插一个尖嘴哥的身体反应拍（他刚腿软坐在地上——让屁股挪半寸的「想溜」动作把两件事隔成两锤），第二件事短促独立成锤。**\n2. 【节奏地形】ch2「链这东西骗不了人：嘴上说的是一套，链上走的是另一套。」——「链这东西骗不了人」与后半句同义复沓（解释双拍），且链的规则已在上下文演示过。**方向：删「链这东西骗不了人：」前缀，让对比对仗直接落地。**\n3. 【节奏地形】ch2「灾星鱼」扩散段（「三个字……给鱼算个命。」）——一段 5 行，传播速度的连写修辞与退订潮的实感之间缺停顿位。**方向：在「退订的人」前分段，连写只保留皮筋词一半；退订+妈妈签筒独立成段（妈妈金句自己就是落锤）。**\n\n## 备查（本轮不动）\n\n- ch1 雷臂段「这才叫异能，废土上的硬通货」为自由间接引语（聚落共识），承担异能经济学主题——保留；\n- ch1「好消息/坏消息两层」为时停体炼化 §十一.1 刻意模板——保留；\n- ch2「潮生看妈妈的眼神，变了」6 字重锤节拍——v7/v8 两轮先例保留。\n", "内部/评审表-终稿-r2.md": "# 评审表 · 前三章终稿 v9 · r2（novel-judge 复判）\n\n> 输入：终稿 v9 全文（r1 三处定向修订后）+ 文风档 v3 + 评审表-终稿-r1.md\n> 独立判分声明：复判为本轮独立思维链，逐维重新对照锚点，不沿用 r1 分数。\n\n| 维度 | r1 | r2 | 变化与依据 |\n| --- | --- | --- | --- |\n| 钩力与入戏 | 8 | 8 | 三处修订均不触及开篇/章末，持平。 |\n| 人设声口 | 8 | 8 | 新增拍「屁股朝后挪了半寸」是尖嘴哥（见风转舵）本体动作，声口加分但不足以升档；受吓者区分度问题仍在（备查）。持平。 |\n| 场景质感 | 8 | 8 | 持平。 |\n| 对话活性 | 7 | **8** | 「办两件事」拆成两锤：第一锤全场报价，尖嘴哥「挪半寸」的想溜动作成为两个事项之间的交锋拍，「第二，」短促独立落锤——单回合倾倒消除，回合恢复不对称。升 1。 |\n| 节奏地形 | 8 | 8 | 灾星鱼段分段后地形更清（妈妈金句独立收锤）；链前缀删除删掉一处复沓——两处均为修平不拔高，持平。 |\n\n**总分：r1 39 → r2 40（Δ+1）** ｜ 判词：**像人写的**（维持）\n**收敛判定：可以交付**（总分 ≥40 且无单维 <6，满足终止条件第一条；继续循环预期 Δ<0.5，按 revision-loop 收敛纪律出环）\n\n## 降分核查（防劣化）\n\n无任何维度降分，无回滚项。机械层 prose-scan-v9：明喻 1.4/千字 ✓、套话零命中 ✓、对白比例 15% ✓。\n\n## 备查（留待后续轮次/单元）\n\n- 尖嘴哥/水军哥受吓质地区分度——建议在后续单元给水军哥独立职业腔（电报腔/顺口溜）；\n- ch1 雷臂嘲讽拍的可预测性——单元 2 反制拍可提前埋「记账」回响。\n", "内部/prose-scan-v9.md": "# prose-scan v9 收据（对象=终稿 v9；三连/不是A是B 配额按章计，逐章判定以内核 audit 为准）\nprose-scan v2 · 配额层 + 八维统计画像（kb/aesthetic/ai-trace v1.1 · metaphor-zh · slop-list v2）\n\n== projects/p-fq-001/对外交付/02-前三章终稿.md ==\n  [·配额内(须为豁免体)] 三连排比(同句)  编一条，念一条，改一条\n  [·计数] 不是A是B ×4(配额2)  不是火。不是 ｜ 不是人念的，是 ｜ 不是仇人。他是 ｜ 不是毒，是\n  ── 八维统计画像（ai-trace v1.1）──\n    1 词汇多样性(2gram proxy)=0.69 (参考: 人工文本经验值 ≥0.6，平台线 0.55)\n    2 句长: 均值14.8 标准差10.92 (过平<2 危险；快餐文大方差属正常形态)\n    3 短语复现(4字≥3次): 「换回来的」×4；「东头的膏」×4；「尖嘴哥的」×4；「来的东西」×3；「十七张帖」×3（专名复现可豁免，非专名复现=3gram 高危）\n    4 标点节奏: 间隔均值6.1 CV=0.61 (平台自然值≈0.45)\n    5 对白比例: 15%（74 句）(平台自然区间 5-65%)\n    6 明喻: 8 处 = 1.4/千字 (配额≤2/千字)；文言壳(仿佛/宛如/恍若)×0(≤1)\n    7 叙事套话: 零命中（命中≠必改，过『删词句意受损吗』判定）\n    8 语义平滑度: —（需向量模型，归评审官/新读者官人工维度）\n\n结论：超配额文件 1 个（三连>1/章 或 不是A是B>2/章）；配额内命中=自行对照豁免条件（文书体/笑点本体/定场区不豁免）\n"}}, {"round": 14, "ts": "2026-09-17T00:34:11.533Z", "note": "submit r19·02-前三章终稿.md", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁，吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。一见他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 15, "ts": "2026-09-17T01:11:42.439Z", "note": "submit r21·02-前三章终稿.md", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意——大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早就在街里横着走，把鱼腥气和神殿的香灰味搅在一起，灌进每一扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。换回来的东西，聚落里叫异能；跪上台的少年，叫虔客。什么都没换回来的那些——叫命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这不全是他放的狠——是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空——下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来——聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。废土上没人嫌这亏——念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝——吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿——儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，蹲在圈边看着猪吃完，一等就是小半天。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词——上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真，好像多抹两下，罪过就能少一点。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边。缸沿冰凉，他把胳膊肘架上去，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。不是谁说过的话——是这条链最底下压着的一句，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦。头一勺油下锅，整条街的味就换了——海记门口头一回，闻不见海腥，只有锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯眼看碗底，像验一张元石的成色，验完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上——饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了——那碟咸鱼是隔壁三婶给的，他当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 16, "ts": "2026-09-17T02:16:54.310Z", "note": "submit r23·02-前三章终稿.md", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早就在街里横着走，把鱼腥气和神殿的香灰味搅在一起，灌进每一扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，蹲在圈边看着猪吃完，一等就是小半天。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边。缸沿冰凉，他把胳膊肘架上去，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，他当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}, {"round": 17, "ts": "2026-09-17T03:21:20.381Z", "note": "submit r25·02-前三章终稿.md", "content": {"对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早在街里横着走，把鱼腥气和香灰味搅在一起，灌进每扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬。名册页边翻起一圈毛边，几十年了。「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色，热浪隔着几步远烘在潮生脸上。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层。裹到第二层，里头动了一下，爸爸手上加了把劲。塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，膏稠，拉出的丝挂在槽沿上半天断不干净。她蹲在圈边看着猪吃完，一等就是小半天，日头斜了又斜，猪低头，她也低头。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，纸边毛糙，裁得急，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，沿着旧折痕折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边，凳腿吱呀了一声。缸沿冰凉，他把胳膊肘架上去，压出一道印，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。有几粒饭粘在了筐沿上。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉，眼睛盯着筐沿那几粒饭，咽了口唾沫。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖上的灰印，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦，人一趴上去，桌面吱呀晃两下就稳了。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，三婶围裙油亮，站在桌边手都没处放，潮生当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放，袖口的缝线都崩开了半寸：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。夜露下来了，他手心里一层潮。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，遇了夜潮发黏。奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}}], "gate-final": [{"round": 1, "ts": "2026-09-17 03:06", "note": "", "content": {"内部/多视角意见书-终稿.md": "# 多视角意见书 · 终稿验收（p-fq-001 · 前三章试稿）\n\n> 红方评审（plot-redline v2）｜ 验收对象：前三章终稿（对外交付/02-前三章终稿.md）+ 章节正文三章 ｜ 2026-09-17\n> 验收五问：人设立得住 / 冲突自然 / 梗多 / 节目效果足 / 有没有AI味。裁决权在用户。\n\n## 一、目标读者（废土异能流基本盘）\n\n- 【开局】「台上不烧香。台上跪人。」——三行进世界，十行进人物，三十行第一个笑点（饭勺掉面盆）。我看的废土文里，这个开局算前 10%。\n- 【追】鱼吞征收令那下我拍桌了——不是「预知」是「当众吃神的话」，冒犯的等级直接拉满。第 3 章验毒宴把「灾星鱼」反着用，憋了三章的气全出了。**追。**\n- 【加钱泡】鱼让东头汉子「借鱼开伙」，泡上俩字「加钱」——这个我截图发群里了。真梗。\n\n## 二、一般读者（三秒测试）\n\n- 「器型：厨具？」+「我家雷劈桌子，你家雷炒面」——不懂废土的也笑得出来。好。\n- 看到第 2 章妈妈拿布告垫灶台，我说这妈真刚；看到爸爸拿锅盔按住翻墙贼，我说这爸真稳。一家人立住了。\n\n## 三、资深编剧（五问验收）\n\n- 【人设·过】潮生嘴笨+记账（说不赢就记账）、妈妈商业嗅觉、爸爸「是祸」定调——三章各有名场面，动机全部可查词条（w-cast）。\n- 【冲突·过】首单元因果链完整：疤脸掺料压成本→毒膏出祸→抢锅甩海记→吞链揭流水线→验毒宴反杀。无巧合硬凑，每个转折有人物选择。\n- 【梗·过】每章 ≥3 梗点（超过 ≥1 底线）：饭勺认错/器型厨具/雷炒面/神谕零食/灾星鱼/加钱泡/种。梗全部进对话进情境。\n- 【节目效果·过】可截屏场面：吞征收令全场死静/撕布告垫灶台/雷臂电苍蝇/「加钱」泡/月下鱼睁眼。够发一周切片。\n- 【AI味·过（附一条复核）】无总分总、无排比堆叠、句长抖动明显；「我们家的链，不欠神的」这类短句收束有力。复核点：第 2 章「他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。」——这是全书第一处「不是A是B」句式（配额≤2，现用 1），后续两卷注意不再连用。\n- 【连续性·过】章账/伏笔台账与正文对得上：食灵红线第 4 章演过、勺语第 4 章入场、疤嘴第 2 章埋第 3 章收——细纲密度公式执行到位。\n\n## 四、甲方（番茄口径）\n\n- 【节奏】三章每章有独立爽点兑现+章末钩（笑点钩/悬念钩/危险钩），第 3 章末「鱼睁眼」是标准的下卷开机钩。前三章立住了推荐池门面。\n- 【AI检测】文风抽查：口语脏东西（吧唧嘴/他娘的/锅盔）在位，无总分总、无 AI 高频词——初步手感过关，正式抽测待朱雀类工具（按纪律：参考信号不作目标函数）。\n- 【合规】无真实品牌/人名（柯洁=结构引用未落地）；「食灵」「献祭」均为架空词。通过。\n\n## 共识判定\n\n五问全过：人设（立）/冲突（自然）/梗（超配额）/节目效果（足）/AI味（过）。\n无弃票。**建议裁决口径：pass**——三章试稿交付；后续按存稿纪律排产（U1 后半第 4-5 章→U2）。\n", "对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章 ｜ 本稿已过三遍法（声口/处境/机味），修订留痕见 内部/修订对照表.md\n\n## 第1章 开祭礼，掉进面盆的神\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。\n\n祭台在聚落正中，青石垒的，四十年了，台阶边角都被手掌磨圆了。台上不烧香。台上跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍——\n\n献双眼，得火。献双手，得雷。献声带，得音爆。\n\n底下还有一行小字：多献多得，神不弃虔客。\n\n神收什么，就还什么。这条规矩，大断代以前就有。大断代以后，废土上的法律死绝了，就剩这一条还作数。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，轮到他儿子。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬，「陈家。缴讫。」\n\n八个元石。\n\n潮生不用问这八个元石是哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，妈妈天不亮去滩涂上捡蚬子，攒够了，还在祭台边支了个面摊——开祭日全村人到场，肚子总是要饿的。\n\n攒出来，买台位，赌他今天觉醒个火系。火系进膏厂点火熬膏，一晚上顶爸爸劈一个月蟹壳。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。火从他掌心里升起来，橘红色，台下一片倒吸凉气的声音。执事拖长了调子唱：「黄字贰号，火器。」\n\n那少年下了台，嘴角是翘着的。他爹在台底下抹眼泪，不知道是喜是疼。\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去，磕了头。\n\n头顶那团东西降下来了。不是火。不是雷。\n\n是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对——蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，悬了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n人堆里，去年觉醒的雷臂晃了出来。这位是聚落的骄傲，双掌献了换雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片——这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨，从小就说不过人。他爸教的——说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕——青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，当着执事、当着全村、当着他爸妈的面，被一只刚出世的鱼当零嘴嚼了。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，第二次掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层，塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，像是在抗议「炖汤」这两个字，又像是在记仇。\n\n做完这些，爸爸一只手的粗糙掌心按在潮生后颈上。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃——空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里飘出来，飘过爸爸的房门，飘过灶台，飘到潮生枕头边，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n## 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。最老的一个七十三，最小的才九岁。吃母乳的婴儿没事——母乳没事，合成膏有事。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n因为开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她没当神仙话。但她干了件妈妈才干的事——把家里囤的十盒东头膏，全喂了猪。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里，「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n不是查毒的告示。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃——东头膏祸，即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。退订的人把海记的门槛都踩薄了——礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。措辞不一样，错别字一模一样——「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张。见看他，搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链——除了自己的。链这东西骗不了人：嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她——她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n潮生记账：灾星鱼，一条。疤脸，上头。十七张帖子，三十盒毒膏，两桌升学酒，三桌寿宴。\n\n这笔账，早晚要清。\n\n夜里，他去米缸蹲着。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂——嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n第二天他才知道，东头人人认得那只手——疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记——\n\n他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝。\n\n像在说：快了。\n\n## 第3章 浅尝\n\n傍晚，海记后巷。\n\n尖嘴哥每天抄这条近道回家。今天他走到一半，发现巷口站着陈潮生，手里端着一小碗真饭，脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子里像塞了两团棉花，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他三天没敢出门了——布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口，像燕子掠过水面。\n\n尖嘴哥整个人僵在原地，手里的秤砣「咣当」砸在脚面上，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格，像传讯石过片子：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。\n\n画面尽头，浮着一行字。不是流水线里任何一个人说过的话，是这条链最底下压着的一句——大概连尖嘴哥自己都没往心里去过的那么一句：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份——三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。第二，给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n三天后，海记门口摆开八张桌。东头的人都来了——抬着担架来的，准备吃完直接抬走的。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。潮生站在桌边，鱼搁在他肩膀上——不是他不放心饭，他是真不放心人：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声——倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n当夜，三更。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n网兜的主人被按在墙上，腿抖得像风里的旗。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的——方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。比抖更吓人的是，他笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的——吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚——鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n\n（前三章试稿 · 完）\n"}}], "src": [{"round": 1, "ts": "2026-09-17 04:42", "note": "flow-verify 红档收档：补留档当前工作版", "content": {"选题素材.md": "# 选题素材 · p-fq-001\n\n> 本文件是甲方（用户）原始需求的结构化记录，2026-09-16 开题。\n\n## 平台与形态\n\n- **目标平台**：番茄小说（免费阅读 · 移动端 · 追读/完读率导向 · AI 检测口径）\n- **形态**：网文长篇连载，快餐向；试稿范围 = 前三章\n- **商业口径**：前三章决定推荐池位；日更 2-3 章，过门后需可排产\n\n## 风格定位\n\n- **快餐**：章短（1500-2400 字）、梗密、钩子狠、段落 1-3 行、开章即入戏\n- **抽象**：逻辑的意外拐弯（预期违背），不是没有逻辑；每个抽象桥段回看能落到人物性格上\n- **去AI味**：最终成品硬要求——结构级去机味（句长抖动/无总分总/口语脏东西保留），能过朱雀类检测抽测\n\n## 选题方式（本次开题的核心指令）\n\n- **从近期大梗热梗出发选题**：先扫近 30 天（2026-08 中旬 → 2026-09-16）正在传播的大梗热梗，由热梗反向定题材方向\n- 热梗素材表 ≥10 条（梗名/来源与传播度/可挂接场景）\n- 同等条件优先**梗储量高的领域**（全民梗库富矿），放弃梗荒领域\n- 设定低代入成本：实事底子或市面验证体系优先，禁原创科幻/架空世界观（kb/market/setting-rules）\n\n## ⚡ 命题作文 v3（gate-r1 用户裁决 2026-09-16，当前生效，最高优先级）\n\n> 用户指令：**主角异能 = 能看见所有人的思维链（大模型式推理过程：让我想想/调用工具/得出结论/深度思考）。**\n\n- **开篇故事**：主角大学暑假回家，家里经营小城最火的海鲜大排档；第一卷 = 家里餐厅被抹黑「食材风险」，主角利用能力平反\n- **主题红线（用户明确）**：**不要写成普通读心题材**——重点是「现代社会，人的想法容易被操控，环境影响舆论」\n- **中期展开 · AI 梗异能体系**（用户提供的映射表，社区素材丰富，可融入）：\n  - 超能力者武器 = **哈内丝（harness）**\n  - 金手指 = 模型拟人化：主角金手指 = **吃白饭的鲸鱼娘**；其他超能力者 = GPT/Claude 等模型拟人化\n  - Model <script>

/* ---------- 文件多版本索引（来自快照）：diff 呈现的数据底座 ---------- */

/* 交付节点集合：唯一真相 = 顶层 outputs[].node（graph.outputs 仅拓扑终点，作渲染兼容并入）——规范 R4 §5.1 */

}

document.getElementById("v").textContent = "";  // 流程名移入「工作流管理」页（顶栏降噪）

});

/* ---------- 中文名映射（画布不露英文术语） ---------- */

  "topic-zeitgeist":"热点扫描","topic-analysis-report":"调研分析","topic-proposal":"方案主笔",

/* ---------- 运行状态 ---------- */
function st(n){ const s = (RS.nodes[n]||{}).status || "none"; return s; }
function persistState(){
  // 用户数据（意见/批注/预设）→ 内部/批注与意见.json；重跑与提交归内核真相
  const userData = {comments: RS.comments||{}, annos: RS.annos||{}, presets: RS.presets||{}, savedAt: new Date().toLocaleString()};
  saveFile("内部/批注与意见.json", JSON.stringify(userData, null, 2), "json")
    .then(m => { const el = document.getElementById("saved"); if (el) el.textContent = m; });
}
window.persistState = persistState;
const handles = {};
async function saveFile(name, content, ext){
  // ① http 服务：POST 直写盘（零弹窗）
  if (location.protocol.startsWith("http")){
    try{
      const rel = DATA.project ? "projects/" + DATA.project + "/" + name : name;
      const r = await fetch("/_kit/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: rel, content})});
      if (r.ok){ const j = await r.json(); return "已写盘：" + j.path; }
    }catch(err){}
  }
  // ② 兜底：File System Access → 下载（file:// 模式）
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

/* ---------- 布局：阶段分段 ｜ 同级同列 ｜ 产物压阶段虚线 ---------- */
const NW=196, NH=76, GX=88, GY=64, MG=44;
let pos = {};
let stageLineX = {}, stageBand = {}, parCols = new Set();
function autoLayout(){
  const stageList = (flow.stages||[]);
  const colOf = {}, colNodes = {};
  let c = 0;
  const push = (n, col)=>{ colOf[n]=col; (colNodes[col]=colNodes[col]||[]).push(n); };
  for (const sg of stageList){
    const work = (sg.nodes||[]).filter(n=>nodes[n] && n!==sg.gate);
    if (!work.length) continue;
    // 阶段内最长路径分层：同一层级的节点共享同一竖线
    const lvl = {}; work.forEach(n=>lvl[n]=0);
    for (let it=0; it<=work.length; it++){
      for (const e of edges){
        if (isBackEdge(e) || lvl[e.from]===undefined || lvl[e.to]===undefined) continue;
        if (lvl[e.to] < lvl[e.from]+1) lvl[e.to] = lvl[e.from]+1;
      }
    }
    const byLevel = {};
    work.forEach(n=>{ (byLevel[lvl[n]] = byLevel[lvl[n]]||[]).push(n); });
    const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
    const base = c;
    levels.forEach((L,i)=>{ byLevel[L].sort().forEach(n=>push(n, base+i)); });
    c = base + levels.length;
    if (sg.gate && nodes[sg.gate]) push(sg.gate, c++);
    stageBand[sg.id] = {from: base, to: c-1};
  }
  Object.keys(nodes).forEach(n=>{ if (colOf[n]===undefined) push(n, c); });
  // 阶段虚线 = 本阶段产物列的中心线：产物骑在虚线上，左侧是本阶段工序，右侧是验收门
  stageLineX = {};
  for (const sg of stageList){
    const prod = (sg.nodes||[]).find(n=>nodes[n] && n!==sg.gate && isDeliveryNode(n));
    const col = prod ? colOf[prod] : (stageBand[sg.id]||{}).from;
    if (col !== undefined) stageLineX[sg.id] = MG + col*(NW+GX) + NW/2;
  }
  // 每列节点围绕中线纵向堆叠；多节点列 = 并行组（同一就绪批）
  parCols = new Set(Object.keys(colNodes).map(Number).filter(c=>colNodes[c].length>1));
  let maxRows = 1; Object.values(colNodes).forEach(a=>maxRows=Math.max(maxRows,a.length));
  const midY = MG + (maxRows*(NH+GY)-GY)/2;
  for (const [col, arr] of Object.entries(colNodes)){
    const colH = arr.length*(NH+GY)-GY;
    const y0 = Math.round(midY - colH/2);
    arr.forEach((n,k)=>{ pos[n] = [MG + col*(NW+GX), y0 + k*(NH+GY)]; });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在阶段；无选中则取第一个未完成阶段 */
function currentStageId(){
  if (sel && nodes[sel] && nodes[sel].stage) return nodes[sel].stage;
  if (lastSel && nodes[lastSel] && nodes[lastSel].stage) return nodes[lastSel].stage;
  for (const s of (flow.stages||[])){
    if ((s.nodes||[]).some(x => st(x) !== "done")) return s.id;
  }
  return ((flow.stages||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = stageBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    const c = Math.round((pt[0]-MG)/(NW+GX));
    if (c >= band.from && c <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (flow.stages||[]).map(s=>s.id);
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z = document.getElementById("zoom-val");
  if (z) z.innerHTML = "缩放 <b>" + Math.round(view.k*100) + "%</b>";
}
function resetZoom(){
  const st = document.getElementById("stage");
  const cx = st.clientWidth/2, cy = st.clientHeight/2;
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = 1; view.x = cx-wx; view.y = cy-wy; applyView();
}
/* 定位：跳转到当前（或最近一次）选中节点；无选中则整图适配 */
let lastSel = null;
function locateSel(){
  const target = sel || lastSel;
  if (!target || !pos[target]) { fitView(); return; }
  const st = document.getElementById("stage");
  const k2 = Math.max(view.k, 0.8);
  view.k = k2;
  view.x = st.clientWidth/2 - (pos[target][0]+NW/2)*k2;
  view.y = st.clientHeight/2 - (pos[target][1]+NH/2)*k2;
  applyView();
}
document.getElementById("stage").addEventListener("wheel", e=>{
  e.preventDefault();
  const r = document.getElementById("stage").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k2 = Math.min(2.2, Math.max(0.35, view.k * (e.deltaY<0?1.12:0.89)));
  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();
}, {passive:false});
let panning = null;
document.getElementById("stage").addEventListener("mousedown", e=>{
  if (e.target.closest(".node") || e.target.closest("#docpanel")) return;
  panning = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
});
window.addEventListener("mousemove", e=>{
  if (drag) { dragMove(e); return; }
  if (panning){ view.x = panning.vx+e.clientX-panning.x; view.y = panning.vy+e.clientY-panning.y; applyView(); }
});
window.addEventListener("mouseup", ()=>{ panning=null; if(drag){ const moved = drag.moved; drag=null; if(moved) render(); } });

/* ---------- 渲染 ---------- */
/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}

function whenText(w){
  if (w===undefined || w===null) return "";

  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");

    s += `<line class="stage-rule" x1="${lx}" y1="20" x2="${lx}" y2="${H-40}" stroke="${col}" stroke-width="1.2"/>`;
    s += `<text class="stage-name" x="${MG + band.from*(NW+GX) + 2}" y="34" fill="${col}">${sg.id} ${STAGE_ZH[sg.id]||sg.name||""}</text>`;
  });
  // 打回回环不常驻画布：每次打回的原因与范围各不相同，属评审结果的具体记录，
  // 仅在查看对应验收门节点时于右侧文档面板按需呈现（openNodeDoc 的「打回与回注」页）。
  // 前向边
  const cctx = condCtx();   // 一次求值上下文，全图共用
  for (const e of edges){
    if (isBackEdge(e)) continue; // 打回/回环边不上画布：原因与范围每次不同，属门语义数据
    if (!pos[e.from] || !pos[e.to]) continue;
    const [x1,y1] = pos[e.from], [x2,y2] = pos[e.to];
    const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;
    const role=edgeRole(e);
    const active = evalWhen(e.when, cctx).active;   // 与内核 cond.ts 同源求值，不再嗅探 when 字符串
    const lab = [whenText(e.when), EDGE_ROLE_ZH[role]||""].filter(Boolean).join(" · ");
    s += `<path class="edge-hit" data-e="${e.id}" d="M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}" fill="none" stroke="#a89f90" stroke-width="1.4"${(e.when||role!=="flow")?' stroke-dasharray="5,4"':""} opacity="${active?0.9:0.35}" marker-end="url(#arw)"/>`;
    if (lab) s += `<text class="edge-label" x="${mx}" y="${(sy+ty)/2-4}" text-anchor="middle">${lab}</text>`;
  }
  svg.innerHTML = s + "</svg>";
  svg.querySelectorAll(".edge-hit").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openEdgeDoc(p.dataset.e); });
  });
}

function dragMove(e){

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function bindVerdict(n){

  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,

    kit:m.kit||undefined, op:m.op||undefined, asserts:m.asserts||undefined, inputs:inputs,

    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>

    <div class="task">${JSON.stringify(tp, null, 2)}</div>

  drawer.classList.add("on");

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);
      if(d!==null&&a!==null&&d!==a){
        const pair=charSpanPair(d,a);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${dHtml}</div>`);
      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }
  return out.join("");
}

function findWrapQuote(quote, aid){
  const tries=[quote.replace(/\s+/g," ").trim(), quote.trim().slice(0,20)].filter(x=>x.length>=4);
  const walker=document.createTreeWalker(dBody, NodeFilter.SHOW_TEXT);
  let node;

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

  if (!rect || (!rect.width && !rect.height)){
    const se=r.startContainer;
    const el=(se.nodeType===1?se:se.parentElement);
    if (el) rect=el.getBoundingClientRect();
  }
  pendingMark=document.createElement("span");
  pendingMark.className="anno-mark draft"; pendingMark.title="批注草稿（提交后生效）";
  pendingMark.appendChild(r.extractContents());
  r.insertNode(pendingMark);
  s.removeAllRanges();
  pendingQuote=raw.length>300 ? raw.slice(0,300)+"…" : raw;
  const pr=document.getElementById("docpanel").getBoundingClientRect();
  pop.dataset.quote=pendingQuote;
  document.getElementById("anno-input").value="";
  // 浮层贴着选区末端；越界收进面板
  pop.style.left=Math.round(Math.min(Math.max(8, rect.left-pr.left), Math.max(8, pr.width-290)))+"px";
  pop.style.top=Math.round(Math.min(Math.max(8, rect.bottom-pr.top+8), Math.max(8, pr.height-150)))+"px";
  pop.style.display="block";
  document.getElementById("anno-input").focus();
});
function submitAnno(){
  const pop=document.getElementById("anno-pop");
  const text=document.getElementById("anno-input").value.trim();
  const quote=pendingQuote || (pop.dataset.quote||"");
  const key=curAnnoKey();
  pop.style.display="none";
  if (!text || !quote || !key || !pendingMark){ unwrapPending(); return; }
  const a={id:"a"+Date.now().toString(36), quote, text, ts:new Date().toLocaleString()};
  annoList(key).push(a);
  pendingMark.classList.remove("draft");
  pendingMark.dataset.aid=a.id;
  pendingMark.title=a.text;
  placeBubble(key, a, pendingMark);
  pendingMark=null; pendingQuote="";
  persistState();
}
document.addEventListener("click", e=>{
  window.__clog = window.__clog || [];
  const where = (e.target.id || e.target.className || e.target.tagName) + "@" + (e.target.closest ? (e.target.closest(".docpaper") ? "正文" : (e.target.closest("#docpanel") ? "面板" : "画布/外")) : "?");
  if (e.target.id==="anno-ok"){ window.__clog.push("anno-ok"); submitAnno(); return; }
  if (e.target.id==="anno-cancel"){ unwrapPending(); return; }
  if (e.target.id==="anno-input"){ window.__clog.push("input click - keep"); return; }
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block"){ window.__clog.push("click(无关, pop未开) @ " + where); return; }
  const inDoc = !!(e.target.closest && e.target.closest(".docpaper"));
  window.__clog.push("click @ " + where + " inDoc=" + inDoc + " → " + (inDoc ? "保留" : "收起"));
  if (!inDoc) unwrapPending();
});
document.addEventListener("keydown", e=>{
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block" || e.target.id!=="anno-input") return;
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitAnno(); }
  if (e.key==="Escape"){ unwrapPending(); }
});
/* contenteditable 粘贴纯文本，防外来脏结构 */
document.addEventListener("paste", e=>{
  const ed = e.target.closest && e.target.closest('.md[contenteditable="true"]');
  if (!ed) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, txt);
});

/* R5：编排数据面横幅——页面画的是不是「真在跑的编排」，必须在页面上说清楚，不能让人猜 */

      未找到 <code>registry/effective.json</code>：项目可能尚未跑过内核（无 overlay / 无 kit 边界验收节点 / 无指标）。

  } else {

      ｜项目覆盖 <b>${ov}</b> 条${pend?`｜优化提案待批 <b>${pend}</b> 条`:""}｜指标事件 <b>${METRICS?METRICS.events:0}</b>
      <span class="msg">（打开「工作流管理」看编排面板；点节点看该 tool 的内容配置项与效率/命中率）</span></div>`;
  }

/* ---------- 流商店（Obsidian 商店式） ---------- */
const ST_GLYPH={ "网文":["文","linear-gradient(135deg,#b3543f,#7d3325)"],
  "剧本":["剧","linear-gradient(135deg,#3f6d8a,#28495e)"],
  "短剧":["短","linear-gradient(135deg,#c07a3a,#8f5620)"],
  "拆书":["拆","linear-gradient(135deg,#5b7d5c,#3c573d)"],
  "其他":["流","linear-gradient(135deg,#7a6f8a,#544d63)"] };
let stCat="全部", stQ="", stSort="default", stSel=null;
const stEsc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function openFlowStore(){
  stSel=null; stQ=""; stCat="全部"; stSort="default";
  document.getElementById("store-q").value="";
  document.getElementById("st-sort").value="default";
  document.getElementById("store").classList.add("on");
  renderStoreCats(); renderStore();
}
function closeFlowStore(){ document.getElementById("store").classList.remove("on"); }
function renderStoreCats(){
  const flows=DATA.flowsIndex||[], cats={};
  flows.forEach(f=>cats[f.category||"其他"]=(cats[f.category||"其他"]||0)+1);
  const box=document.getElementById("st-cats");
  box.innerHTML=["全部",...Object.keys(cats).sort()].map(c=>
    `<button class="st-cat${c===stCat?" on":""}" data-c="${stEsc(c)}">${stEsc(c)} · ${c==="全部"?flows.length:cats[c]}</button>`).join("");
  box.querySelectorAll(".st-cat").forEach(b=>b.addEventListener("click",()=>{ stCat=b.dataset.c; stSel=null; renderStoreCats(); renderStore(); }));
}
const stCmp=(a,b)=>{const p=s=>String(s||"0").split("-")[0].split(".").map(Number);
  const A=p(a),B=p(b);
  for(let i=0;i<3;i++){ if((A[i]||0)!==(B[i]||0)) return (A[i]||0)<(B[i]||0)?-1:1; }
  return 0; };
function stBadge(f){
  if (f.id===DATA.flow.id) return `<span class="sc-badge cur">当前绑定</span>`;
  const uses=f.usage||[];
  if (!uses.length) return `<span class="sc-badge none">未运行</span>`;
  const behind=uses.filter(u=>stCmp(u.version,f.version)<0);
  if (behind.length) return `<span class="sc-badge up" title="${stEsc(behind.map(u=>u.project+" v"+u.version).join("；"))}">可更新 · ${behind.length} 处落后</span>`;
  return `<span class="sc-badge used" title="${stEsc(uses.map(u=>u.project+" v"+u.version).join("；"))}">已运行 · ${uses.length} 项目</span>`;
}
function stFiltered(){
  let arr=(DATA.flowsIndex||[]).slice();
  const q=stQ.trim().toLowerCase();
  if (q) arr=arr.filter(f=>[f.title,f.id,f.desc,(f.skills||[]).join(" "),f.category].join(" ").toLowerCase().includes(q));
  if (stCat!=="全部") arr=arr.filter(f=>(f.category||"其他")===stCat);
  if (stSort==="updated") arr.sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  else if (stSort==="nodes") arr.sort((a,b)=>(b.nNodes||0)-(a.nNodes||0));
  else if (stSort==="name") arr.sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"zh"));
  else arr.sort((a,b)=>((b.id===DATA.flow.id?1:0)-(a.id===DATA.flow.id?1:0)) || (b.updated||"").localeCompare(a.updated||""));
  return arr;
}
function renderStore(){
  document.getElementById("st-count").textContent=(DATA.flowsIndex||[]).length+" 条生产线";
  if (stSel) return renderStoreDetail();
  const body=document.getElementById("st-body"), arr=stFiltered();
  if (!arr.length){ body.innerHTML=`<div class="st-empty">没有匹配的流程——换个关键词或分类看看。</div>`; return; }
  body.innerHTML=`<div class="store-grid">`+arr.map(f=>{
    const cur=f.id===DATA.flow.id, [g,bg]=ST_GLYPH[f.category]||ST_GLYPH["其他"];
    return `<div class="store-card" data-f="${stEsc(f.id)}">
      <div class="sc-head"><span class="st-ico" style="background:${bg}">${g}</span>
        <span style="min-width:0"><div class="sc-name">${stEsc(f.title)}</div><div class="sc-id">${stEsc(f.id)} · v${stEsc(f.version)} <span class="sc-ver${f.official?" rel":""}">${f.official?"官方发布":"初稿"}</span></div></span></div>
      <div class="sc-desc">${stEsc(f.desc)||"（无简介）"}</div>
      <div class="sc-foot"><span class="sc-stat">${[(f.stages||[]).length?((f.stages||[]).length+" 阶段"):"", f.nNodes?(f.nNodes+" 节点"):"", (f.skills||[]).length?((f.skills||[]).length+" 技能"):""].filter(Boolean).join(" · ")}</span>${stBadge(f)}
        ${cur?"":`<button class="sc-go" data-imp="${stEsc(f.id)}">导入 →</button>`}
        ${f.hasDemo?`<button class="sc-go" data-demo="${stEsc(f.id)}" title="从官方 Demo 一键创建新项目（配置+输入已就绪）">装 Demo</button>`:""}
      </div></div>`;
  }).join("")+`</div>`;
  body.querySelectorAll(".store-card").forEach(c=>c.addEventListener("click",e=>{
    if (e.target.closest("[data-imp],[data-demo]")) return;
    stSel=c.dataset.f; renderStore(); body.scrollTop=0;
  }));
  body.querySelectorAll("[data-imp]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importFlowTo(b.dataset.imp); }));
  body.querySelectorAll("[data-demo]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importDemo(b.dataset.demo); }));
}
function renderStoreDetail(){
  const f=(DATA.flowsIndex||[]).find(x=>x.id===stSel), body=document.getElementById("st-body");
  if (!f){ stSel=null; return renderStore(); }
  const cur=f.id===DATA.flow.id, [g,bg]=ST_GLYPH[f.category]||ST_GLYPH["其他"];
  body.innerHTML=`<div class="store-detail">
    <button class="st-back" id="st-backbtn">← 返回商店</button>
    <div class="sd-head"><span class="st-ico" style="background:${bg}">${g}</span>
      <div style="flex:1;min-width:0"><div class="sd-title">${stEsc(f.title)}</div>
        <div class="sd-meta"><span style="font-family:Consolas,monospace">${stEsc(f.id)}</span><span>v${stEsc(f.version)}</span><span>${stEsc(f.category)}</span>
          ${f.updated?`<span>更新 ${stEsc(f.updated)}</span>`:""}${f.engine?`<span>${stEsc(f.engine)}</span>`:""}
          <span class="sc-ver${f.official?" rel":""}">${f.official?"官方发布":"初稿"}</span>
          ${cur?`<span class="sc-badge cur">当前绑定</span>`:`<span class="sc-badge">未绑定</span>`}</div>
        <div class="sd-desc">${stEsc(f.desc)||"（无简介）"}</div></div></div>
    <div class="sd-actions">
      ${cur?`<button class="sd-main" disabled>当前绑定 · 无需导入</button>`
           :`<button class="sd-main" id="st-imp">导入到本项目（${stEsc(DATA.project)}）</button>`}
      <button class="sd-ghost" id="st-close2">继续浏览</button>
      ${f.hasDemo?`<button class="sd-ghost" id="st-demo" style="border-color:var(--accent);color:var(--accent);font-weight:700">装官方 Demo（新项目）</button>`:""}</div>
    <div class="sd-sec"><h4>规模</h4><div class="sd-stats">
      <div class="sd-stat"><b>${(f.stages||[]).length||"-"}</b><span>阶段</span></div>
      <div class="sd-stat"><b>${f.nNodes??"-"}</b><span>节点</span></div>
      <div class="sd-stat"><b>${f.nAgents??"-"}</b><span>Agent 步</span></div>
      <div class="sd-stat"><b>${f.nGates??"-"}</b><span>验收门</span></div>
      <div class="sd-stat"><b>${(f.skills||[]).length}</b><span>技能</span></div></div></div>
    ${(f.stages&&f.stages.length)?`<div class="sd-sec"><h4>阶段流水</h4><div class="sd-stages">${f.stages.map(s=>`<span class="sd-stage"><b>${stEsc(s.id)}</b>${stEsc(s.name||"")}</span>`).join("")}</div></div>`:""}
    ${(f.skills&&f.skills.length)?`<div class="sd-sec"><h4>使用技能（提示词）</h4><div class="sd-skills">${f.skills.map(s=>`<span class="sd-skill">${stEsc(s)}</span>`).join("")}</div></div>`:""}
    <div class="sd-sec"><h4>使用情况（各项目运行版本）</h4><div class="sd-use">${(()=>{const uses=f.usage||[];
      if(!uses.length) return `<div class="sd-use-empty">尚未有任何项目运行此流程——卡片标注「未运行」。</div>`;
      return uses.map(u=>{const rel=stCmp(u.version,f.version);
        const note=rel===0?"与商店版本一致":(rel<0?`落后商店 v${stEsc(f.version)}，重跑或换绑即更新`:"高于商店版本");
        return `<div class="sd-use-row"><b>${stEsc(u.project)}</b><span>v${stEsc(u.version||"?")}</span><span class="msg">${note}</span></div>`;}).join("");
    })()}</div></div>
    <div class="sd-sec"><h4>导入说明</h4><p class="msg" style="margin:0">导入把项目绑定切到该流程：运行状态保留，计划按新流程重编译；flow_init 契约按项目配置重新装载。自建流程先把 flow.json 放入 <code>flows/&lt;新id&gt;/</code>，过 flow-lint 后即出现在本商店。带「装 Demo」标的流有官方示例项目：一键复制为你的新项目，配置与输入素材已就位，<code>flow_run</code> 即可开跑。</p></div>
  </div>`;
  document.getElementById("st-backbtn").onclick=()=>{ stSel=null; renderStore(); };
  document.getElementById("st-close2").onclick=closeFlowStore;
  const imp=document.getElementById("st-imp"); if (imp) imp.onclick=()=>importFlowTo(f.id);
  const dem=document.getElementById("st-demo"); if (dem) dem.onclick=()=>importDemo(f.id);
}
// store 标记位于本脚本之后，须等 DOM 就绪再绑定（否则 getElementById 为 null，绑定全数失败）
(function stBind(){
  const bind = () => {
    document.getElementById("store-q").addEventListener("input",e=>{ stQ=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-sort").addEventListener("change",e=>{ stSort=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-close").addEventListener("click",closeFlowStore);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("store").classList.contains("on")) closeFlowStore(); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
</script>

    <span class="st-brand">流商店</span><span class="st-sub" id="st-count"></span>

      <option value="default">排序：默认</option>
      <option value="updated">最近更新</option>
      <option value="nodes">节点最多</option>
      <option value="name">名称</option>
    </select>
    <button class="tb" id="st-close">✕ 关闭</button>
  </div>
  <div class="st-cats" id="st-cats"></div>
  <div class="store-body" id="st-body"></div>
</div>
