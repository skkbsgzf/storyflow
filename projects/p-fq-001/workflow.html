n }\n}\n---\n# 对标 · 给大妈爆改后我成了顶流\n\n> CN 市场 · 女频 · S 级（AI 评 91） · 热度 0.5967 万 · 梗族：打脸虐渣梗\n\n- **一句话卖点**：被嘲不懂潮流的落魄设计师，带失业大妈爆改中老年潮牌，露天走秀一战封神。\n- **题材**：治愈系, 职场逆袭, 发家致富, 女性群像, 现代都市\n- **共情点**：轻熟龄设计与运营女性，方案因不合白瘦幼主流屡遭驳回，被年龄容貌焦虑深深刺痛。\n- **爽点内核**：情绪轴为从被轻视到被倚仗。冷门中年女装掀起全民抢购，傲慢前东家争相高薪回聘。\n- **创新亮点**：对标《以爱为家第四季》，聚焦大龄女性潮牌创业与家庭温情治愈，新瓶落点为故事背景。\n\n## 剧情主线（节选）\n\n主线剧情：在现代时尚设计公司，新锐设计师苏见夏因坚持打破白瘦幼审美、提倡包容性剪裁，被主管当面撕碎设计稿并逐出核心项目。苏见夏深知母亲与千千万万操劳一生的平凡女性买不到合身得体衣服的困境，毅然接下公司无人接盘的滞销老旧面料库，创立专注成熟女性的原创品牌。她力排众议拒绝雇佣年轻嫩模，大胆招募被裁员失业的素人阿姨担任试衣形象代言。面对同行水军疯狂嘲讽大妈扮嫩的恶评风暴，以及合作商场在开幕前夕临时毁约撤场的绝境，阿姨们与苏见夏的家人挚友全体出动，在露天广场连夜手搭质朴T台。聚光灯下，阿姨们步履自信、风骨沉淀的走秀视频引爆全网情感共鸣，数万订单瞬间挤爆服务器，废旧仓库一跃成为全网断货的明星工坊。前主管眼见品牌价值飙升赶来求购版权，苏见夏断然拒绝并宣布全员阿姨持股分红，彻底打破行业审美偏见，完成了从边缘弃子到时代潮流定义者的华丽蜕变。\n\n## 生产约束（实盘值）\n\n集数 80｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b028-s.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b028-s\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 重回前夫假死那天，我大摆招魂席\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\",\n \"heat_w\": 14000,\n \"grade\": \"S\",\n \"score\": \"91\",\n \"family\": \"chongsheng-fuchou\",\n \"route_affinity\": \"hot\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2096055935255412736\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 重回前夫假死那天，我大摆招魂席\n\n> CN 市场 · 女频 · S 级（AI 评 91） · 热度 14000 万 · 梗族：重生复仇梗\n\n- **一句话卖点**：渣夫假死甩万额外债携小三金蝉脱壳，贤妻重生当场设大席封门，逼得活人自己从供桌下爬出认罪！\n- **题材**：爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\n- **共情点**：击中30至45岁家庭主妇为家庭掏心掏肺却被婆家合谋吸血算计的窒息痛点，让隐忍付出的憋屈感转化为反戈一击的生理爽感。\n- **爽点内核**：情绪轴为从被吸血到反手清算；爽点主菜为借丧事规则瓮中捉鳖，当众揭穿骗局夺回家产，可见可数。\n- **创新亮点**：对标《重回前夫假死那天，我彻底掀桌了》，将室内封棺转变为柴房困兽与招魂大席，机制落点在民俗博弈与物理困敌。\n\n## 剧情主线（节选）\n\n主线剧情：九十年代末北方县城，纺织厂女工林秀芝操劳半生，替突遭意外身亡的丈夫还清巨债并养老送终，临终前才知当年是丈夫为了与富商之女私奔、甩掉巨额货款而导演的假死金蝉脱壳。一朝重生，她赫然回到灵堂前，婆婆和小姑子正逼她签字画押背下全部欠条。林秀芝当场掀翻认债书，冷笑着当众改办大排场招魂宴，以思念亡夫入骨为由强留全族乡亲与各路债主通宵守灵。她暗中把丈夫藏身换装的柴房反锁加固，断水断粮三天三夜，每次婆家人企图送干粮送水，都被她借敬神守节之名当场拦截打赏众人。柴房内的渣夫饥渴难耐濒临崩溃，出殡起灵当日，渣夫为活命撞破房门狼狈抢食，假死真相在全体债主眼前当场炸裂。林秀芝雷霆出手，借民事公证与借据逼婆家交出全部隐匿存折与房契，彻底斩断吸血枷锁，随后凭借前世商贸记忆承包纺织门市部，步步蜕变成为万人敬仰的民营女实业家。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n", "内部/kb-market.md": "# KB 装载 · market（市场快照装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 7 个知识文件。\n\n---\n\n<!-- source: knowledge/market/constraints.md -->\n\n---\n{\n  \"id\": \"kb/market/constraints\",\n  \"type\": \"market-standard\",\n  \"title\": \"生产约束基线（短剧/漫剧实盘值）\",\n  \"version\": \"2026-09-14\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [],\n  \"provenance\": {\n    \"source\": \"import\",\n    \"refs\": [\"dataset:kakaxing/scriptrawstone@2026-09-14（全量统计）\", \"kb/market/snapshot.formatConstraints\", \"storymaster-v3:assets/skills/script-drama-beat.md\"]\n  },\n  \"bind\": { \"skills\": [\"plot-choreographer\"], \"minitools\": [\"check_contract_compliance\"] },\n  \"updated\": \"2026-09-14\"\n}\n---\n\n# 生产约束基线\n\n**用途**：选题分析报告第五节\"创作约束移交单\"的默认数值来源——约束不再拍脑袋，直接取市场实盘（7938 部在售剧本的硬格式统计）。方案对这些条款逐条对账（`kb/aesthetic/oversight` 监理纪律，违反一票否决）。\n\n## 一、体量约束（分布即标准）\n\n| 维度 | 主流值 | 分布依据 |\n| --- | --- | --- |\n| 集数 | **60 集**（4224 部） | 50 集 945 / 80 集 925 / 40 集 718 / 30 集 116 |\n| 单集时长 | **1-1.5 分钟** | 竖屏付费短剧口径 |\n| 单集字数上限 | **1200 字**（4284 部） | 1000 字 1640 / 1400 字 528 / 1600 字 476 |\n| 场景数上限 | **≤3**（7937/7938） | 几乎全库硬约束——低成本快转景 |\n| 主要演员上限 | **≤10**（7925 部） | 同上 |\n\n**用法**：方案默认按 60 集 × 1.5 分钟 × 1200 字 × ≤3 场景 × ≤10 演员声明约束；偏离主流值（如 80 集或 4 场景）必须在移交单中显式声明并给理由——偏离不是错，隐式偏离才是错。\n\n## 二、约束 → 编排的直接推论\n\n1. **3 场景上限** ⇒ 每集冲突必须发生在可复用景（宅门/办公室/宫殿/车厢）；换景 = 换集节拍点。剧情编排师分集时先画场景复用表。\n2. **10 演员上限** ⇒ 有名有姓角色 ≤10（含反派）；群演反应拍（当众打脸必需）不计入，但\"全场惊呆\"必须由环境描写的群演承担。\n3. **1-1.5 分钟 ≈ 600-900 字正文**（script-drama-beat 口径）⇒ 每集 8-12 拍，前 3 秒钩子约 1 拍、结尾卡点约 2 拍。\n4. **60 集 × 1.5 分钟 = 90 分钟总片长** ⇒ 实际叙事容量 ≈ 一部电影的紧凑版：主线只容 1 个大反转 + 2-3 个中型反转（`kb/aesthetic/reversal` 结构位点联动），副线必须挂主线条件。\n\n## 三、题材标签纪律\n\n申报题材标签从市场受控词表取（快照 `genreHeatCN`/`genreHeatNA` 中的 genre 字段），不用自造词；标签组合 = 1 主题材 + 2-3 副标签（市场策划案通行形），标签顺序即卖点顺序。\n\n## 四、与硬断言的绑定\n\n本条目数值进入约束移交单后，由 minitool `check_contract_compliance` 逐条对账；分拍格式合规由 `AE-BEAT-FORMAT` 断言扫描（`kb/aesthetic/assertions.json`）。\n\n---\n\n<!-- source: knowledge/market/setting-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/setting-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"设定体系约束（项目级：世界观代入成本红线）\",\n  \"dimension\": \"setting\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-SET-ORIG\", \"AE-SET-3MIN\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\n      \"user-feedback:2026-09-15（禁止原创科幻世界观——点子好但没有厚度，读者不能快速代入；用市面做过的设定体系或实事新闻做底子）\",\n      \"kb/market/constraints（生产约束基线，本条目为其世界观维度扩展）\"\n    ]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"structure-design\", \"topic-analysis-report\"], \"minitools\": [\"check_aesthetic_asserts\"] }\n}\n---\n\n# 设定体系约束（世界观代入成本红线）\n\n**命题：短剧/漫剧的观众没有耐心学一套新世界观。** 点子再好，架构没有厚度——读者无法快速代入理解——就是废案。世界观的代入成本是选题阶段的一票项，不是成稿阶段再优化的细节。\n\n## 一、设定来源三级制\n\n| 级别 | 来源 | 判定 |\n| --- | --- | --- |\n| **首选** | **实事新闻做底子**：防汛救灾、工程质量清查、债务与烂尾、养老与医疗、裁员与再就业——全民共识的公共事件，零解释成本，主旋律有锚 | ✅ 直接可用 |\n| **次选** | **市面验证过的设定体系做创新改编**：战神归来/赘婿/重生/系统/马甲/先婚后爱等——观众已被市场教会规则，创新只做变体不做体系 | ✅ 可用，须挂竞品对标 |\n| **禁止** | **原创科幻/架空世界观**：自造中台/异能体系/架空王朝规则等需要观众先学后看的设定 | ❌ 一票否决 |\n\n## 二、判定方法：三分钟测试\n\n- 【block】**三分钟测试**：路人观众开播 3 分钟内，在不依赖任何设定解释的前提下，能否说出\"这是谁、他想要什么、为什么替他急\"？凡需要先讲设定才能进冲突的开局 = 违反本约束。\n- 【major】设定词密度：前三章正文中的**自造专名**（体系名/组织名/规则名）≤2 个；超过即代入成本超标。\n- 【major】实事锚点：选题理由必须至少引用一条**当月公共议题/新闻方向**作为情绪底（与 zeitgeist 步联动），架空设定天然缺此锚。\n\n## 三、正确的\"创新\"位置\n\n约束禁止的是**世界观层原创**，不禁止创意：创新发生在①**人物关系与身份层**（不确定因素注入：黑道大小姐/真假千金/穿书/初版作者）；②**结构改造**（`kb/structure/catalog` 三步）；③**实事底子上的具体事件**。好点子要长在观众熟悉的土壤上——点子的锐度 × 土壤的熟悉度 = 代入速度。\n\n## 四、执行接线\n\n- S1 调研：约束移交单新增 **C10 设定体系约束**（本条目），选题方向必须声明设定来源级别。\n- S2 结构：框架案的世界观节按三级制声明来源；原创倾向在此拦截。\n- R1/R2 红方：三分钟测试 + 设定词密度为固定检查项（`kb/aesthetic/perspective-review` 一般读者视角主责）。\n\n---\n\n<!-- source: knowledge/market/meme-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/meme-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"梗密度与发散性约束（S1 网感输入源）\",\n  \"dimension\": \"meme\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-MEME-DENSITY\", \"AE-MEME-SPREAD\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\"user-feedback:2026-09-15（选题作为网感输入源需足够多的梗、有发散性；梗传播度与密度不足则观众无趣；纳入知名梗词典网站）\"]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"find-trope\", \"topic-analysis-report\"], \"minitools\": [\"meme_harvest（待实现）\", \"kb_search\"] }\n}\n---\n\n# 梗密度与发散性约束\n\n**命题：选题阶段是全流程的网感输入源。** 选题产出的梗与素材要喂给后续所有阶段（结构/方案/剧本/传播切片）；梗的传播度和密度不足，后续每一层都会\"无趣\"——这不是文案问题，是资源储量问题。\n\n## 一、S1 产出硬指标\n\n| 指标 | 要求 |\n| --- | --- |\n| **网络热梗素材表** | S1 梗卡必须附带 ≥10 条与题材相关的**现存高传播梗**（每条：梗名/来源与传播度评级/可挂接的场景示例） |\n| **发散性** | 每个主梗/新变体须可拆出 ≥3 个跨场景可复用的梗用法（对话梗/场面梗/切片梗）——只在一个场景成立的梗不算储量 |\n| **密度自查** | 前三章每集至少 1 处可独立切片传播的\"梗点\"（观众能截出来转发的东西） |\n\n## 二、梗词典数据源（纳入数据库的输入源清单）\n\n| 源 | 类型 | 用途 |\n| --- | --- | --- |\n| 小鸡词典（含镜像存档） | 梗词典 | 梗的出处、演变、用法 |\n| 梗百科 / 萌娘百科 | 百科类 | 梗的条目化解释与传播链 |\n| B 站热梗榜 / 抖音话题榜 | 平台热榜 | 当期传播度实测 |\n| 知乎\"网络流行语\"相关高赞 | 语义讨论 | 梗的语义漂移与代际差异 |\n| 微博热搜 / 百度指数 | 传播度实测 | 评级数据源 |\n\n接入方式：`meme_harvest` minitool（待实现，规格：抓取/清洗/去重/传播度评级 → 产出 `梗素材表` 增量并入 KB）；实现前由调研步人工按上表整理，**梗素材表仍为 S1 必交付**。\n\n## 三、与既有约束的关系\n\n- 梗密度约束**不替代** C10 设定约束（`kb/market/setting-rules`）：梗要密度，设定要低代入成本，两条红线并行。\n- 题材选择本身受梗密度约束**反向影响**：同等条件下，优先选**梗储量高的领域**（如国球/职场/校园——全民梗库富矿），放弃梗荒领域（例：无公共记忆的架空科幻）。\n\n---\n\n<!-- source: knowledge/market/topic-anatomy.md -->\n\n---\n{\n  \"id\": \"kb/market/topic-anatomy\",\n  \"type\": \"market-standard\",\n  \"title\": \"题材解剖学（素材聚合与关系逆位选题法）\",\n  \"dimension\": \"market\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"provenance\": {\n    \"source\": \"user-feedback:2026-09-16（p-fq-001 gate-r1 二次 send-back）\",\n    \"refs\": [\n      \"方法来源：申论概括提炼技巧 × 人文学科材料分析法（现象/利益/权力/结构四层）\",\n      \"用户判词：素材不聚合=假材料；梗不落位=装饰品；爽点从关系逆位构建\"\n    ]\n  },\n  \"updated\": \"2026-09-16\"\n}\n---\n\n# 题材解剖学（素材聚合与关系逆位选题法）\n\n**命题：选题调研的目的不是收集素材，是扒出题材背后的关系结构。** 热梗、热搜、事件都只是大众的声音（现象层）；声音背后是几方人马稳定的权力关系（结构层）。梗是结构的分泌物——不解剖结构就收集梗，收上来的是一堆装饰品，这就是「假材料」。\n\n## 一、四层剥离（申论式，逐层往下，不许跳层）\n\n| 层 | 问什么 | 产出 |\n| --- | --- | --- |\n| 现象层 | 发生了什么（一句话，去形容词） | 事件时间线 |\n| 利益层 | 每个参与方要什么（流量/生意/情绪/安全——用他们自己的算盘说话） | 各方收益-代价表 |\n| 权力层 | 谁对谁有什么权力，权力怎么行使、代价是什么 | 权力线清单 |\n| 结构层 | 这个题材的本质隐喻是什么（卡牌塔/燃料库/祭司——好隐喻=读者三秒懂的权力关系） | 一句话本质 |\n\n## 二、关系结构（三~五方，两两画线）\n\n- 参与方用**角色化命名**（主播/吃瓜群众/商家），不用抽象名词（意见领袖/消费者）；\n- 两两之间画权力线：A→B 有什么权力（框架权/定罪权/生杀权/供养权/收买权），B 拿什么换、怎么忍；\n- **不对称点标红**：权力即时 vs 反制慢速、成本零 vs 代价全额——不对称最锐利处 = 最疼处 = 爽点矿脉。\n\n## 三、逆位生成（爽点从关系倒置中来）\n\n对每条权力线只问一句：**如果位子反过来呢？**\n\n- 「主播有框架权」逆位 → 主角有透视权 / 框架权易主 / 框架权带毒（每用一次反噬+1）；\n- 「口碑是易碎卡牌塔」逆位 → 口碑是可视可控的数值系统（卡牌塔有了仪表盘）；\n- 「群众是燃料」逆位 → 群众是法官 / 群众是主角的武器库 / 主角是执火人。\n\n每个逆位写成一个方向候选（金手指 / 关系轴 / 爽点机制三行），选最有写头的 2-3 个进选题报告。**爽点清单必须能回指到某条被逆的权力线——回指不了的爽点是套路复写，不是这个题材长出来的。**\n\n## 四、材料落位原则（素材的正作用凭证）\n\n| 素材/梗 | 结构位（谁/哪条权力线） | 消费点（机制位/场面梗/台词梗/世界观位） |\n| --- | --- | --- |\n\n- 每个素材**必须落位**：说得出它服务于谁、哪条权力线、被消费在方案的哪个实处；\n- 落不了位的素材删除——留在报告里而没有消费点的材料都是装饰品，装饰品冒充深度 = 假材料；\n- 落位表是选题报告的必备节：它正面回答「搜集这么多素材服务于啥」。\n\n## 五、题材类型适配（流程灵活性依据）\n\n| 题材类型 | 解剖步骤 | 素材来源 |\n| --- | --- | --- |\n| **现实映射**（职场/都市/商战/舆论等现实底题材） | 全流程必跑：四层剥离→关系结构→逆位→落位 | 实时热点 + 事件档案 + 梗底座 |\n| **模板文**（无限流/修仙/穿越/系统等非现实映射） | **可整体跳过**：直接走 kb/trope 梗族饱和度选型 + kb/aesthetic 结构标准 | 梗族结构库 + 对标件；实时热点仅作调味可选 |\n\n- 判据：题材的冲突动力是否来自现实关系（职场权力/舆论场/阶层）——是则解剖；冲突动力来自自足的规则系统（副本规则/修炼体系/系统面板）则模板文路线，关系结构由世界观自建（此时解剖对象换成「题材模板的权力结构」，如无限流的「队内关系」、修仙的「宗门资源链」）。\n- 配置落点：项目配置.json 的「题材类型」（现实映射/模板文）+ flow 输入 zeitgeist 开关——模板文置 false，跳过实时解剖节点，调研步直接消费 kb/trope。\n\n---\n\n<!-- source: knowledge/structure/episodic-webnovel.md -->\n\n---\n{\n  \"id\": \"kb/structure/episodic-webnovel\",\n  \"type\": \"structure-catalog\",\n  \"title\": \"单元剧网文结构标准（多故事集合体 · 暗线先行）\",\n  \"dimension\": \"structure\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"long-form\"],\n  \"routes\": [\"all\"],\n  \"provenance\": {\n    \"source\": \"user-feedback:2026-09-16（p-fq-001 gate-r1 流程重构指令）\",\n    \"refs\": [\n      \"用户判词：编剧讲一个故事；现代网文本质是多故事集合体，通过有趣的设定和世界观串联的单元剧\",\n      \"用户判词：小说一定暗线先行，主线平一点问题不大；世界观必须扎实——人物有了动机，做啥都合理且有趣\",\n      \"用户判词：大纲不用复杂；大纲→小说的重点是人设立得住/冲突自然/梗多/节目效果足/没有AI味\"\n    ]\n  },\n  \"updated\": \"2026-09-16\"\n}\n---\n\n# 单元剧网文结构标准（多故事集合体 · 暗线先行）\n\n**命题：网文不是一部电影，是一座电视台。** 编剧流程讲一个故事（三幕/五节点/60集一杠到底）；现代网文是**多故事集合体**——用有趣的设定和世界观把一串单元故事串起来连载。两者的流程重心完全不同，禁止套用编剧结构。\n\n## 一、三层结构（主次纪律）\n\n| 层 | 装什么 | 要求 |\n| --- | --- | --- |\n| **世界观（底座）** | 力量体系、势力与矛盾、主角力量来源与代价、世界规则 | **必须扎实，暗线先行**——人物有了动机，做啥都合理且有趣；主线平一点问题不大，底座塌了全塌 |\n| **暗线（主线）** | 力量来源之谜、世界观级悬念、长线矛盾 | 平铺慢推：节点藏好、定期抖一格；不追求每章推进 |\n| **单元剧（明线）** | 一串自成故事的小单元（抹黑平反/打脸/副本/事件） | **每单元必须炸**：自成起承转合 + 状态增量（世界观认知/关系/实力至少动一项）+ 梗点密度 |\n\n- **选题阶段分清主次**：选题产出的是「好梗集合 + 世界观种子 + 单元剧素材库」，**不锁具体主线故事**——发现的素材（如大模型/思维链/哈内丝这种素材量爆炸的好梗）细化后与调研融合即可；具体事件（如某次抹黑风波）只是一个单元剧的候选，不是主线。\n- 单元剧素材库是流动资产：随时补充（每单元收尾时顺手登记下一个候选），主线暗线节点从库里挑大的挂。\n\n## 二、流程映射（与编剧流程的差异）\n\n| 阶段 | 编剧流程 | 网文流程（本标准） |\n| --- | --- | --- |\n| 选题 | 找一个故事方向 | **发散聚合**：好梗集合 + 世界观种子 + 单元剧素材库（发散性强，分清主次） |\n| 开书 | 八段式策划案/三层问答锁故事 | **先搞世界观**（力量体系/矛盾/力量来源/规则清单 → wiki 化 RAG）；人物动机从世界观长出来 |\n| 大纲 | 重型：三幕×分集功能×卡点表 | **轻量**：暗线节点表 + 单元剧序列 + 首批单元细纲，完事 |\n| 成稿 | 台词/镜头精度 | **五问**：人设立得住吗 / 冲突自然吗 / 梗多吗 / 节目效果足吗 / 有没有AI味 |\n\n## 三、世界观 wiki（RAG 纪律）\n\n- 世界观产出双件：**世界观圣经.md**（人读，叙述性）+ **世界观/ wiki 目录**（机器可检索）；\n- wiki 条目 = 独立 md 文件 + frontmatter（id/title/tags/links），条目间 `[[id]]` 交叉链接；`世界观/index.json` 为词条索引（RAG 入口），大纲/成稿/打磨节点开工先查索引、按 tags 取词条；\n- 设定一律词条化：**每个设定可被独立引用**（写第 47 章时只需拉出相关 3 个词条，不用重读圣经全文）；\n- 词条状态机：draft（设定中）/ active（已进正文）/ retired（被版本更新推翻——世界观的迭代本身可以是剧情）。\n\n## 四、成稿五问（大纲→小说的质量重心）\n\n1. **人设立得住吗**：动机从世界观长出来（不是编剧硬安）；行为可预测（读者能替他做决定）；\n2. **冲突自然吗**：冲突从势力张力线和神格差异里长出来，不是巧合堆的；\n3. **梗多吗**：每章 ≥1 可切片梗点；梗进对话进情境；\n4. **节目效果足吗**：每章至少一个「可截屏发群里」的场面/台词；\n5. **有没有AI味**：结构级去机味（ai-trace 五指纹 + fastfood 红线），终稿过三遍法。\n\n## 五、判定条款\n\n1. 【block】世界观未 wiki 化（无 index.json 词条索引）→ 大纲/成稿节点不得派发；\n2. 【major】单元剧结尾无状态增量 → 单元不算完成，退回细纲；\n3. 【major】暗线连续 10 章零推进 → 判沙漠段，下一单元必须挂暗线节点；\n4. 【minor】选题报告锁定单一主线故事 → 违反发散原则，退回重写主次划分。\n\n---\n\n<!-- source: knowledge/formats/webnovel-fastfood.md -->\n\n---\n{\n  \"id\": \"kb/formats/webnovel-fastfood\",\n  \"type\": \"format-standard\",\n  \"title\": \"快餐抽象网文形态标准（番茄线）\",\n  \"dimension\": \"format\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"long-form\"],\n  \"routes\": [\"hot\"],\n  \"asserts\": [\"AE-WNF-HOOK\", \"AE-MEME-DENSITY\", \"AE-AI-STRUCT\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\n      \"kb/formats/webnovel-longform（长篇母标准：三层问答/章功能序列/台账）\",\n      \"kb/market/meme-rules（梗密度与发散性）\",\n      \"kb/aesthetic/ai-trace（结构级去机味）\",\n      \"platform:番茄小说（免费阅读 · 移动端 · 追读/完读率 · AI 检测口径）\"\n    ]\n  },\n  \"updated\": \"2026-09-16\"\n}\n---\n\n# 快餐抽象网文形态标准（番茄线）\n\n**标尺**：快餐抽象是长篇网文的极限档——读者在通勤/蹲坑/睡前刷完一章，笑点密度优先于世界观体量。判定单位是\"章\"，商业单位是\"追读与完读率\"。母标准（`kb/formats/webnovel-longform`）全部适用，本条目只叠加收紧项。\n\n## 一、章节形态\n\n| 项 | 约束 | 说明 |\n| --- | --- | --- |\n| 章长 | 1500-2400 字 | 手机 5-8 分钟读完；超 2400 必须拆章（爆点章可到 2800，不许灌水凑长） |\n| 入戏 | 每章前 300 字必须进事件 | 第一章前 100 字必须出现反常；禁止开章写景/回顾上章 |\n| 段落 | 1-3 行为主，全章 ≥1 个单句成段 | 大段（>5 行）全章 ≤2 处；段落参差本身是节奏 |\n| 章末钩子 | 强制（收束四型轮换） | 快餐线钩型配比：信息反转/行动推进为主，连续同型判 major |\n| 梗点 | 每章 ≥1 处可切片传播的梗点 | 梗点 = 读者能截图发群里的那句/那拍（AE-MEME-DENSITY 章级版） |\n\n## 二、抽象梗纪律（快餐线的命）\n\n1. **梗要\"用\"不要\"提\"**：热梗必须长进对话和情境里（人物真的会那么说话/那么做事），禁止解说式玩梗（\"这就是传说中的 XX 梗\"）。解说式玩梗判 major。\n2. **梗失效测试**：每处用梗过一遍——把梗换成平实说法，情境本身还成立/还好笑吗？不成立 = 梗是拐杖，重写。热梗生命周期 2-8 周，情境底座决定成稿能否活过梗的热度。\n3. **梗密度有地形**：对话和冲突峰值处堆梗，情绪真段落（哪怕快餐文也有）零梗——全是梗 = 没有呼吸，读者麻。\n4. **抽象不等于瞎**：抽象是逻辑的意外拐弯（预期违背），不是没有逻辑。每个抽象桥段回看必须能说出\"因为他是个 XX 的人所以会干这事\"。\n\n## 三、去AI味（番茄线硬约束）\n\n- 朱雀类 AI 检测是**结构级**，词句层替换无效（`kb/aesthetic/ai-trace` 全表适用）；快餐文额外红线：\n- **句长抖动**：连续 3 句等长判警；短句/独词句/断句是快餐文的天然掩护，但要有疏有密；\n- **总分总绝迹**：不许\"总的来说/综上所述/可以说\"式收束段；章末只留钩子不留总结；\n- **排比配额**：三连排比全章 ≤1 处；\"不是……而是……\"句式全章 ≤2 处；\n- **口语脏东西**：语气词、口头禅、半截话、突然的短句——这些\"不规整\"是活人感来源，修订时不许磨平；\n- 检测口径：过检测抽测以朱雀类参考信号为准，**参考信号不作目标函数**（防为过检而文风劣化）。\n\n## 四、平台与商业语境（番茄）\n\n- 免费阅读 + 广告分账：前 3 章决定推荐池位与追读，**前三章即试稿验收范围**；\n- 更新节奏：快餐线日更 2-3 章，开书稿需存稿 ≥10 章——试稿通过后卷纲按此口径排产；\n- 卡点：番茄章节卡点 = 每章末钩子（无付费墙压力），但每 8-12 章需一个\"小高潮+悬念双押\"的大卡点拉追读；\n- 书名/简介：网感公式产出（`kb/market/internet-feel-formulas`），书名 ≤12 字带梗点或反差。\n\n## 五、与 harness 的对应\n\n- 快餐线 = 一条多阶段 flow：选题（热梗驱动）→ 开书（Bible 轻量版）→ 前三章章纲 → 逐章成稿 → 去AI味终稿；\n- 逐章子图标准形状沿用 `kb/formats/webnovel-longform` §五：写前台账切片 → 写 → 过审 → 结算；\n- 台账五类（人物状态/在场物品/知情范围/到期伏笔/长期承诺）开书即建，章章滚动（`kb/continuity/state-ledger`）。\n\n---\n\n<!-- source: knowledge/formats/webnovel-longform.md -->\n\n---\n{\n  \"id\": \"kb/formats/webnovel-longform\",\n  \"type\": \"format-standard\",\n  \"title\": \"长篇网文形态标准（章末钩子与批量生成）\",\n  \"dimension\": \"format\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-WNF-HOOK\", \"AE-WNF-BATCH\", \"AE-WNF-PLATFORM\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\n      \"post:xhslink.cn/o/3bRWmAttfTo（chinese-novelist-skill 三层问答、awesome-novel-agent 题材画像）\",\n      \"post:星月写作小红书主页（短篇商业化路线：番茄、保底、稿费、模型选型）\",\n      \"ref:deepwrite/README.md（长篇各阶段共享设定与连续性账本）\"\n    ]\n  },\n  \"updated\": \"2026-09-15\"\n}\n---\n\n# 长篇网文形态标准\n\n**标尺**：网文长篇是**连载消费品**——判定单位是\"章\"，商业单位是\"追读与稿费\"。与短剧共用审美十二维度，但形态约束如下。\n\n## 判定条款\n\n1. **【block】章末钩子强制**：每章结尾必须留下悬念/转折/情绪钩（chinese-novelist-skill 纪律）。钩型轮换参照 `kb/deconstruct/style-learning` 收束四型——连续同型钩判 major（pacing 维度沙漠段的章级版）。\n2. **【major】开书三层问答**（chinese-novelist-skill）：题材与核心情绪（对齐 `kb/deconstruct/protocol` 类型判断）→ 主角与金手指/核心欲望 → 前十 章事件链。三问没答完不开书。\n3. **【major】批量生成节奏**：一次生成 10-50 章时，先出全段\"章功能序列\"再逐章执行——逐章流水式生成必然偏航（大纲偏离是 InkOS 审计 37 维之一）。每章交稿必过 `kb/continuity/state-ledger` 台账校验。\n4. **【minor】题材画像先行**：开书前挂载对应题材画像（甜宠/追妻火葬场/虐恋/悬疑/重生/复仇/系统流……），画像含该类型的核心情绪走向与读者期待清单——`kb/deconstruct/protocol` 六槽位拆出的同类型对标件是画像的最佳来源。\n5. **【minor】平台与商业语境**：星月写作路线的代表约束——目标平台规则（番茄等）、保底与全勤节奏、**过 AI 检测**（联动 `kb/aesthetic/ai-trace`：朱雀类检测是结构级，词句层规避无效）。模型选型影响产出质量档位，选型结论记入 flow 的模型参数，不入知识条目。\n\n## 与 harness 的对应\n\n- 长篇 = 一条多阶段 flow：开书（三层问答 → World Bible）→ 卷纲 → 章功能序列 → 逐章（写前台账切片注入 → 宿主写 → submit 过审计 → 状态结算）。InkOS 的\"出草稿→过审计→按需修订→状态结算\"四步即单章子图的标准形状。\n- 批量生成时 flow 以\"章\"为原子任务包单位，断点续跑天然按章落盘（runtime 已有语义）。\n", "内部/prose-scan-v10.md": "# prose-scan v10 收据（对象=终稿 v10；逐章配额判定以内核 audit 为准，合并稿计数=三章之和）\nprose-scan v2 · 配额层 + 八维统计画像（kb/aesthetic/ai-trace v1.1 · metaphor-zh · slop-list v2）\n\n== projects/p-fq-001/对外交付/02-前三章终稿.md ==\n  [·配额内(须为豁免体)] 三连排比(同句)  编一条，念一条，改一条\n  [·计数] 不是A是B ×4(配额2)  不是火。不是 ｜ 不是人念的，是 ｜ 不是仇人。他是 ｜ 不是毒，是\n  ── 八维统计画像（ai-trace v1.1）──\n    1 词汇多样性(2gram proxy)=0.69 (参考: 人工文本经验值 ≥0.6，平台线 0.55)\n    2 句长: 均值16.0 标准差11.48 (过平<2 危险；快餐文大方差属正常形态)\n    3 短语复现(4字≥3次): 「尖嘴哥的」×5；「换回来的」×4；「东头的膏」×4；「来的东西」×3（专名复现可豁免，非专名复现=3gram 高危）\n    4 标点节奏: 间隔均值6.4 CV=0.58 (平台自然值≈0.45)\n    5 对白比例: 13%（75 句）(平台自然区间 5-65%)\n    6 明喻: 13 处 = 2.0/千字 (配额≤2/千字)；文言壳(仿佛/宛如/恍若)×0(≤1)\n    7 叙事套话: 零命中（命中≠必改，过『删词句意受损吗』判定）\n    8 语义平滑度(ngram proxy): 相邻句均值 0.01 (>0.45 偏顺滑；n-gram 近似，非向量口径)\n\n结论：超配额文件 1 个（三连>1/章 或 不是A是B>2/章）；配额内命中=自行对照豁免条件（文书体/笑点本体/定场区不豁免）\n", "内部/prose-scan-v11.md": "# prose-scan v11 收据（对象=终稿 v11；破折号全稿仅存歌谣断句×2+对话打断×1）\nprose-scan v2 · 配额层 + 八维统计画像（kb/aesthetic/ai-trace v1.1 · metaphor-zh · slop-list v2）\n\n== projects/p-fq-001/对外交付/02-前三章终稿.md ==\n  [·配额内(须为豁免体)] 三连排比(同句)  编一条，念一条，改一条\n  ── 八维统计 出个浅浅的凹」 |\n| 7 | 2 | 心理外化 | 尖嘴哥贴帖「用手掌把纸抹平……好像多抹两下，罪过就能少一点」 |\n| 8 | 2 | 账本体道具 | 炭笔记账「字压得极深，纸背面都能摸出印来」；疤嘴「桶沿上搭着半块干粮，咬了一口，忘在那儿了」 |\n| 9 | 3 | 视觉锚 | 开场「白汽在傍晚的光里一缕一缕，看得见纹路」；「水点子溅在潮生脚背上，凉的」 |\n| 10 | 3 | 峰值放慢 | 浅尝拍插入链被抽的全过程：「一寸一寸，往外抽。链子过处，眼珠跟着往一边偏」 |\n| 11 | 3 | 三格画面各加一证 | 封漆发乌/炭笔全是牙印/收膏掂了掂轻一斤没吭声（尖嘴哥跳反的怨种伏笔） |\n| 12 | 3 | 宴席全景 | 门板桌垫碎瓦/头一勺油换掉整条街的海腥/老头举碗验成色/围裙兜叮当/「链里刚冒『下』字，筷子已到」 |\n\n自检：同口径评分 37→39（+2，零降分，评审表-终稿-v10-r1）；机械层 prose-scan-v10 全绿；audit 18/18；章长均在红线内；§零生效——是否可交付由用户复裁。\n\n---\n\n# v11 · 定场区三禁执行（用户行级判词 · 2026-09-17）\n\n> 触发：用户行级判词——价目牌等定场句「否定句、排比句、破折号」三禁，铁律级，文书体亦不豁免。已入文风档 §十二（定场区三禁条款）+ prose-scan v2 新增破折号计数（≤1/章）。\n> 全文清账：破折号 37→3（全为功能性：歌谣断句×2、对话打断×1）；否定排比清零（不救人不解释/不是火不是雷/台上不烧香/什么都没换回来的/他不是仇人/不是查毒的告示/不是谁说过的话 等全部改积极句式）；「不是A是B」叙述层清零（引文保留：膏里不是毒是料）。明喻降密：ch2 2.6→1.6、ch3 2.3→1.8/千字。\n\n| # | 章 | 类型 | 原文（v10） | 终稿（v11） |\n| --- | --- | --- | --- | --- |\n| 1 | 1 | 否定排比+破折号 | 不救人，不解释，只做生意——大断代…… | 他们的规矩只有一条：一手交人，一手交货。 |\n| 2 | 1 | 排比+破折号（价目牌） | 牌上就三行：眼睛换火，双手换雷，献声带的换一声音爆——三样里，嗓子最贱 | 头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱（版面递减本身=世情） |\n| 3 | 1 | 否定+破折号 | 台上不烧香。台上跪人 / 什么都没换回来的那些——叫命 | 别处的庙烧香，青礁的台跪人 / 空着手下台的也有个名字，只有一个字，命。 |\n| 4 | 1 | 否定排比 | 不是火。不是雷。是一团蓝的 | （整段删）头顶那团东西降下来了。是一团蓝的。 |\n| 5 | 2 | 否定悬念句 | 不是查毒的告示。 | 满墙的字，全冲着海记来。 |\n| 6 | 2 | 不是A是B | 他不是仇人。他是倒霉蛋…… | 疤脸谈不上仇人，就是个倒霉蛋…… |\n| 7 | 3 | 否定+破折号 | 不是谁说过的话——是这条链最底下压着的一句 | 字压在这条链的最底下，淡得几乎看不见…… |\n| 8 | 全 | 破折号 34 处 | （装饰性：解释/同位/引出） | 按功能改为句号/冒号/逗号；保留歌谣断句×2、对话打断×1 |\n\n自检：机械层全绿（明喻 1.2/1.6/1.8·千字、破折号 1/1/1、三连/不是A是B 配额内）；audit 18/18；评分口径不变（v10 r1 的 39/50 为重写后首评，本轮为行级纠偏不另评分，降分风险项：无）。\n\n---\n\n# v12 · 成文流水线首跑（novel-prose 架构 · 分场锻拍→三专科层稿→逐段盖章 · 2026-09-17）\n\n> 架构：剧情锁定（成文节拍卡 13 拍）→ 三专科并行层稿（对白/场景/设定）→ 成文师逐拍拼装+逐段六维盖章 → 断言闸 → polish 薄修。全套新证据件：成文节拍卡 / 层稿×3 / 盖章单（内部/）。\n> 本轮性质：整章重拼（非修补）——v11 全部剧情节拍、台词、梗点、钩子原样保留；场景层弹药 woven in（约 20 处新细节）。字数：ch1 2470 / ch2 1962 / ch3 2259。\n\n| 章 | 新织入细节（抽样） |\n| --- | --- |\n| 1 | 名册页边翻起毛边（几十年）；热浪隔着几步烘在潮生脸上；裹布到第二层鱼动了一下、爸爸手上加把劲 |\n| 2 | 膏拉丝挂槽沿半天断不干净；猪低头她也低头；帖子纸边毛糙裁得急；爸爸沿旧折痕折好；凳腿吱呀、胳膊肘压出印 |\n| 3 | 饭粒粘筐沿、尖嘴哥盯着咽口水；拍膝盖拍出灰印；门板桌人一趴吱呀晃两下就稳；三婶围裙油亮手没处放；袖口缝线崩开半寸；夜露一层潮、网兜膏渍遇潮发黏 |\n\n自检：盖章单 13 拍×6 维，3 次段级重写记录在案（破折号×2、重复词×1）；机械层 prose-scan-v12 全绿（明喻 1.2/1.5/1.8、破折号 1/1/1 功能性、7c 零命中）；audit 18/18；行级三禁（否定句/排比/破折号）持续执行。\n", "内部/多视角意见书-R1.md": "# 多视角意见书 · R1 选题验收 v8（p-fq-001 · 废土喂鱼版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：选题报告 v8 + 梗卡 v7 + 素材解剖 v7 ｜ 2026-09-16\n> 验收语境：用户命题 v5——末世废土+科技倒退+神明降临+饭勺鱼（模板文模式）。裁决权在用户。\n\n## 一、目标读者\n\n- 【反差结构】「全废土最丢人的异能，是顶点神的崽」——这个反差不是贴上去的：鱼认成饭勺（笑点）→ 吞链见真相（爽点）→ 吞雷吞怪（战斗面）→ 鲲鹏变（成长线），一层一层全是同一只鱼。**追。**\n- 【废土+食堂】人人吃合成膏、只有海记冒真火——末世文的稀缺资源给了「真饭」，市井烟火直接变成废土硬通货。爸妈不用改人设就能活进废土，省了重建成本，观众也无痛搬家。\n- 【保留资产】思维链玩法没扔（变成鱼吞链），献祭律升级成世界史（大断代）——前面几轮的存款全部利息化，没有推倒重来。\n\n## 二、一般读者（3 秒测试）\n\n- 「别人觉醒神，我觉醒了个饭勺」——笑点直给，刷到会停。《我的异能是只饭勺鱼》最短最好记。\n- 一处犹豫：书名候选里「鲲」「北冥」的玄学名不要提前露——封面物料用「饭勺鱼」，「北冥鲲君」留给正文第一次抖真身的时候，反差更大。\n\n## 三、资深编剧\n\n- 【模板填装·过】末世异能流的五个结构位全部有填法，主角起点（全聚落嘲笑）与反差土壤（显强系霸权）是教科书级的废柴位——但吞噬流给它的是「账单式」变强（吞什么长什么、吃撑罢工、元石照烧），有规则的力量才立得住。\n- 【暗线·过（附条件）】大断代=献祭律的世界级后果——废土成因与暗线互锁，这是本轮最值钱的升级。条件：**「鲲崽为什么被扔在废土」必须进 w-secret 底牌**（现在底牌只有「最干净语料」一层——崽被扔下来这个动作本身需要动机层：是流放？是种子？是鲲君的私心？Bible 定稿）。\n- 【单元纪律·过】六候选单元有梯度（聚落内→聚落间→神殿→世界），首单元抹黑平反换皮不换骨（v6 验证过的结构），前三章节奏（笑点觉醒→首吞→当庭拆穿）成立。\n- 【一处提醒】第 3 章「吞掉抹黑者的结论，让他当众只说真话」——「吞结论」是新玩法（之前是「看链」），能力细则里要定义：吞掉的链去哪了？被吞者什么感觉？会不会当场变白痴（废土人道问题）？→ 进 Bible 规则清单。\n\n## 四、甲方\n\n- 【题材类型切换】模板文模式首次实战：zeitgeist 解剖对象换模板结构，现实热点只留梗源——流程灵活性按设计工作。认可。\n- 【合规】柯洁为梗结构引用不出现人名；斗罗只借公共结构；大断代架空因果——三红线齐。通过。\n- 【排产】S2/S3 旧版（都市世界观/旧 30 章大纲）已随 flow_rerun 级联失效——过门后先废土化重做世界观与大纲，再进成稿。流程顺序正确。\n\n## 共识判定\n\n- 发散制四问全过：素材爆炸（饭勺鱼一个梗长出能力/名场面/哈内丝/节奏四件）/主次（暗线=大断代与鲲崽来历，单元库六候选梯度清晰）/客群（末世基本盘+武魂梗受众+AI 圈三层重叠）/梗（落位表齐，零游离）。\n- 编剧条件进世界观步：①「鲲崽被扔废土」的动机层进底牌；②「吞结论」细则（吞哪/吞后/人道边界）进能力规则。\n- **无弃票，无根因打回。建议裁决口径：pass-with-conditions。**\n", "内部/多视角意见书-S2.md": "# 多视角意见书 · S2 世界观复核（p-fq-001 · 废土版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：世界观圣经（废土版）+ wiki 词条更新 ｜ 2026-09-17 ｜ 非门：block 级意见 S3 强制吸收\n\n## 一、目标读者（这世界我住得下吗）\n\n- 献祭双眼换火、献祭双手换雷——开篇这句就把账算清了：**废土的强者谱系是用残缺拼出来的**。住得下，而且不敢多看（满街盲眼火者与断臂雷手的画面感）。\n- 「宁可瞎眼，不可缺心」这句谚语好——不解释为什么，让读者自己发毛。主角家是唯一没交过税的，指望感有了。\n\n## 二、一般读者（三秒懂不懂）\n\n- 「别人献器官，他献脑子，鱼吃脑子」——三秒懂，还挺好笑。饭勺鱼当哈内丝这个梗成立。\n- 一处犹豫：「大断代」这个词第一次出现在圣经但正文要早立——第 1 章就得让读者知道「科技为什么倒退」一句话版（老人说「都献给他们啦」），别等 Bible 名词轰炸。\n\n## 三、资深编剧（底座能长出戏吗）\n\n- 【双轨献祭·过】肉祭可见有限 vs 智祭不可见无限——两轨对照即主题，且给了主角天然的社会位置（被嘲的怪人）。合格。\n- 【暗线·过（附条件）】w-secret 三句话升级完整（肉祭死肉/链是活粮/鲲崽=鲲君的押金与种子），节点抖格对照到第 30 章。条件：**N4「供品去向：肉祭器官被退回」这条很好，但要给「退回后去了哪」留一句底**（炼体失败品堆积地？第 2 单元的恐怖景观预埋）——进 S3 章纲。\n- 【规则·过（附条件）】W-RULE-07 吞食边界+食灵恶行成立，潮生伦理红线（只吞反派/不吞二次/不碰普通人）清晰。条件：**首单元要有一幕「潮生差点破戒」**（唾手可得想吞普通人链省钱/省事，停手）——伦理红线不是喊出来的，是演出来的。进 S3。\n- 【动机·过】陈大海「献过一只手」是本轮最重的棋：父亲的雷贯臂=反献祭的家训来源+主角的经济压力来源（义肢）+父子冲突点（儿子觉醒了却不敢用），一人三用。合格。\n- 【一处提醒】废土天气词条（w-weather）未同步废土口径（仍写「全城」）——小补丁，不阻塞：占报单位已由司天监接住，S3 前顺手改。\n\n## 四、甲方（可排产吗）\n\n- wiki 九词条全量废土化，index 可检索；规则清单三件套（思维链语法+吞结论细则/眷者契约与献祭税/降临史与大断代编年）齐——**底座扎实，可排产**。\n- 题材类型=模板文后，前三章无现实热点依赖，速度可以拉满。\n\n## 共识判定\n\n- 世界观四件套+双轨献祭+暗线底牌+wiki 检索——**通过**。\n- 带走两条给 S3：①N4 的「退回器官去了哪」留底；②首单元安排「差点破戒」一幕。\n- 小补丁：w-weather 废土口径（不阻塞）。\n", "内部/多视角意见书-S3.md": "# 多视角意见书 · S3 大纲复核（p-fq-001 · 废土版）\n\n> 红方评审（plot-redline v2）｜ 验收对象：单元剧大纲（废土版：暗线节点表 + 6 单元 × 5 章 + 移交单）｜ 2026-09-17 ｜ 非门：block 级意见成稿前强制吸收\n\n## 一、目标读者（节目单炸不炸）\n\n- 六档节目单：抓造谣流水线/一口吞雷/收粮令查账/殿后荒地退件山/鲲君弃子/两鱼对峙+大断代签字——每档都想看。炸。\n- 第 30 章双押（雕像睁眼+鲲崽低吼）是标准的下卷开机钩，追读欲望拉满。\n\n## 二、一般读者（三秒测试）\n\n- 「别人献眼睛换火，他献脑子被笑，鱼把造谣者的台词嚼碎吐给他」——首单元三秒立住。\n- 一处犹豫：「大断代」「献祭推广令」这类名词在 27-30 章密集——细纲已分布到账，写手注意正文里由爸爸的账本和老人的嘴带出，别旁白轰炸。\n\n## 三、资深编剧（结构验收）\n\n- 【暗线·过】六节点（5/10/15/20/25/30）每格一个脚注量：巢→黑户→采样→退件→弃子→推广令——与 w-secret 底牌严格对表，藏而不讲。合格。\n- 【红方 S2 条件核销】①「吞结论细则」已进 w-chain（吞的范围/被吞者体验/食灵红线）；②鲲崽来历动机层已进 w-secret（下注/押金/种子）；③首单元「差点破戒」落在第 4 章。三条全部核销。\n- 【单元纪律·过】状态增量不重复（扬名/入档/摊牌/看见/暗病/真相）；首单元最炸；沙漠段无。\n- 【钩型·过】30 章轮换核过，无连续同型；第 5/30 双押、第 3/14/29 小高潮，地形正确。\n- 【block 级意见（1 条）——成稿前必须处理】**第 19 章「爸爸认得金链看守」埋了父子旧线，但前 18 章没铺垫**——爸爸的义肢、四十年的独、他和谁一起献过祭，至少要在第 2 章（献祭台一笔带过）和第 12 章（真饭贿赂时收粮官提一句「你爸当年也是台上的人」）各留半句，第 19 章才不突兀。写进第 2/12/19 章执行。\n- 【major 意见（1 条）】第 29 章收养野崽后，它不能只是「新增一口」——下一卷它是情报体（殿后视野），S3 移交单需注明野崽的功能位，防写成第二宠物。\n\n## 四、甲方（可排产吗）\n\n- 废土质感（合成膏/真饭硬通货/传讯石/退件山）全部可拍；模板文模式无现实热点依赖，速度拉满。\n- 前 30 章梗点配额落地、可截屏场面密度足；移交单五问齐全。\n- 大纲已覆盖 30 章且首单元细到章级——S4 三章随时可开。\n\n## 共识判定\n\n- 大纲通过：暗线（对表底牌）/单元（每档都炸）/钩型（轮换正确）/动机（词条可查）。\n- 带走两条进成稿：①爸爸旧线在第 2/12 章各留半句铺垫（block 级）；②野崽=殿后情报体功能位写进移交单（major）。\n- **无弃票。S3 通过，S4 可开。**\n", "内部/多视角意见书-终稿.md": "# 多视角意见书 · 终稿验收（p-fq-001 · 前三章试稿）\n\n> 红方评审（plot-redline v2）｜ 验收对象：前三章终稿（对外交付/02-前三章终稿.md）+ 章节正文三章 ｜ 2026-09-17\n> 验收五问：人设立得住 / 冲突自然 / 梗多 / 节目效果足 / 有没有AI味。裁决权在用户。\n\n## 一、目标读者（废土异能流基本盘）\n\n- 【开局】「台上不烧香。台上跪人。」——三行进世界，十行进人物，三十行第一个笑点（饭勺掉面盆）。我看的废土文里，这个开局算前 10%。\n- 【追】鱼吞征收令那下我拍桌了——不是「预知」是「当众吃神的话」，冒犯的等级直接拉满。第 3 章验毒宴把「灾星鱼」反着用，憋了三章的气全出了。**追。**\n- 【加钱泡】鱼让东头汉子「借鱼开伙」，泡上俩字「加钱」——这个我截图发群里了。真梗。\n\n## 二、一般读者（三秒测试）\n\n- 「器型：厨具？」+「我家雷劈桌子，你家雷炒面」——不懂废土的也笑得出来。好。\n- 看到第 2 章妈妈拿布告垫灶台，我说这妈真刚；看到爸爸拿锅盔按住翻墙贼，我说这爸真稳。一家人立住了。\n\n## 三、资深编剧（五问验收）\n\n- 【人设·过】潮生嘴笨+记账（说不赢就记账）、妈妈商业嗅觉、爸爸「是祸」定调——三章各有名场面，动机全部可查词条（w-cast）。\n- 【冲突·过】首单元因果链完整：疤脸掺料压成本→毒膏出祸→抢锅甩海记→吞链揭流水线→验毒宴反杀。无巧合硬凑，每个转折有人物选择。\n- 【梗·过】每章 ≥3 梗点（超过 ≥1 底线）：饭勺认错/器型厨具/雷炒面/神谕零食/灾星鱼/加钱泡/种。梗全部进对话进情境。\n- 【节目效果·过】可截屏场面：吞征收令全场死静/撕布告垫灶台/雷臂电苍蝇/「加钱」泡/月下鱼睁眼。够发一周切片。\n- 【AI味·过（附一条复核）】无总分总、无排比堆叠、句长抖动明显；「我们家的链，不欠神的」这类短句收束有力。复核点：第 2 章「他不是仇人。他是倒霉蛋，外加一个手脚不干净的甩锅的。」——这是全书第一处「不是A是B」句式（配额≤2，现用 1），后续两卷注意不再连用。\n- 【连续性·过】章账/伏笔台账与正文对得上：食灵红线第 4 章演过、勺语第 4 章入场、疤嘴第 2 章埋第 3 章收——细纲密度公式执行到位。\n\n## 四、甲方（番茄口径）\n\n- 【节奏】三章每章有独立爽点兑现+章末钩（笑点钩/悬念钩/危险钩），第 3 章末「鱼睁眼」是标准的下卷开机钩。前三章立住了推荐池门面。\n- 【AI检测】文风抽查：口语脏东西（吧唧嘴/他娘的/锅盔）在位，无总分总、无 AI 高频词——初步手感过关，正式抽测待朱雀类工具（按纪律：参考信号不作目标函数）。\n- 【合规】无真实品牌/人名（柯洁=结构引用未落地）；「食灵」「献祭」均为架空词。通过。\n\n## 共识判定\n\n六问全过：人设（立）/冲突（自然）/梗（超配额）/节目效果（足）/AI味（过）/读者断层（过）。\n无弃票。**建议裁决口径：pass**——三章试稿交付；后续按存稿纪律排产（U1 后半第 4-5 章→U2）。\n\n## 五、新读者官（first-reader · 零上下文通读 · v2 追加）\n\n> 评审约束：只读正文三章 + 章账读者认知边界，未读大纲/圣经/底牌。本视角为 2026-09-17 读者契约回修后的复核。\n\n- 【上一版判过 block】开篇三行就进开祭礼——**我不知道这是哪年、哪、谁**；「思维链供品」念出来我没懂，正文也没人解释，就这么用下去了。这正是用户指出的断层：agent 库库写，读者跟不上。\n- 【本版·定场四问·过】「神明降临第四十年。四十年前，天开了一道口子，诸神下来了。不救人，不解释，只做生意」——两行交齐何时+世界规矩；价目牌交代何地靠什么活着；「陈潮生，十八岁，海记食堂独子。嘴笨，账记得比谁都细」+「全家算好的账」交齐谁+想要什么。都在事件里，不是说明书。\n- 【本版·新词首现·过】思维链供品首现即接潮生的账本体解释（「发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱」）——我懂了，还笑了一下。大断代挂在「把旧世界埋掉之后」上，够用且留了悬念。\n- 【本版·断层扫描·过】三章通读，没遇到「这词哪来的」时刻；「殿后」首次出现时水军哥供词语境自足（神殿后面的方向，读者可推）。章账读者认知边界三节已记，第 4 章写手有据可查。\n- 【残留·提示】第 2 章「他不是仇人。他是倒霉蛋」在「不是A是B」配额内（全稿 1 处/5602 字），后续注意每千字 ≤1。\n\n**新读者官判定：本版通过；上一版在定场四问与新词首现两项不通过（用户裁决一致）。**\n\n> **机味回炉附记（v6 · 2026-09-17）**：用户揪出价目牌三连排比，追认 v5 未重跑 polish 为流程违规。补跑 tools/prose-scan.py：1章修净 4 处三连（价目牌/管叫三连/当着×3/飘过×3）+双喻收敛，3章「不是A是B」压回配额 2；2章合规。残留「编一条念一条改一条」=3章唯一配额内笑点本体，豁免保留。机械层现清零；语义层排比由本官通读兜底。\n", "内部/层稿-场景.md": "# 层稿-场景 · 试稿三章（场景师）\n\n> 逐拍弹药库：主感官/身体反应/道具与伏笔/密度档/入戏细节一处/喻体备案。成文师按密度档取用，不是全上。\n\n## 第1章\n\n**1.1 祭台·日（主感官：触——烫）**\n- 五感：日头把青石晒得烫脚；香灰混海腥的风；执事唱名的拖腔撞在石头上弹回来\n- 身体反应：潮生攥着上台位的元石袋，袋子勒手心\n- 道具/伏笔：价目牌（漆一年重描=神殿养着的门面）；名册页边起毛（翻了几十年）\n- 密度：疏→紧\n- 入戏细节：名册页边那圈毛边\n- 喻体备案：无（定场区三禁）\n\n**1.2 祭台·日（主感官：触/听——静）**\n- 五感：火升起来热浪烘到脸上；黑布少年下台指尖的汗印；鱼落面盆的热汤溅声\n- 身体反应：潮生跪台膝盖磕青石，凉；额头贴石那一瞬满场嗡嗡声退远\n- 道具/伏笔：面盆（妈妈饭碗=神掉进去的地方）；葱花（后文饭勺身份梗）\n- 密度：**密（峰值放慢）**\n- 入戏细节：黑布少年按在墙上的汗印\n- 喻体备案：笑声跟涨潮（域内✓）\n\n**1.3 祭台边·日（主感官：嗅——焦腥）**\n- 五感：电花的焦腥气；蟹壳崩开的脆响；叫好声一浪一浪\n- 身体反应：潮生指节捏白（不接话的憋）\n- 道具/伏笔：空蟹壳（雷臂力量证据+海记营生互文）\n- 密度：疏\n- 入戏细节：崩成八瓣的壳肉齐齐整整（力量的「规整」更伤人）\n- 喻体备案：无\n\n**1.4 祭台上空→夜院·夜（主感官：听——静与咔嚓）**\n- 五感：链子悬空的淡金影子（人人见惯四十年）；咔嚓声在静里格外响；米缸陈米的霉味；夜露的凉\n- 身体反应：爸爸按潮生后颈的老茧剌人；潮生躺下后耳朵追着米缸方向\n- 道具/伏笔：粗布三层（裹鱼的紧=爸爸的怕）；米缸盖扣死；鱼泡（预警通道开闸）\n- 密度：密→疏（钩子句短）\n- 入戏细节：执事的笔第二次……（v11 已删「第二次」）——笔掉在台上没人捡\n- 喻体备案：像嗑瓜子✓；像隔着水面说话✓\n\n## 第2章\n\n**2.1 东头祠堂门口·日（传闻口径；主感官：视——青）**\n- 五感：蹭起来的灰糊在汗上；抠喉咙的水声；孩子打嗝的节奏\n- 身体反应：（传闻转述，身体归中毒者）\n- 道具/伏笔：郎中的药箱（盖上=放弃）\n- 密度：密（惨要给足）\n- 入戏细节：药箱盖上的搭扣咔哒一声\n- 喻体备案：腌过头的咸菜✓\n\n**2.2 海记猪圈·午后（主感官：嗅——馊）**\n- 五感：猪圈馊气熏眼；膏拉丝黏槽；猪吧唧嘴（与 2.5 鱼吧唧暗呼应）；日头斜了又斜\n- 身体反应：妈妈蹲到腿麻，扶圈栏站起来\n- 道具/伏笔：十盒膏（家里的退路变赌注）；最后一盒砸回筐（狠的落点）\n- 密度：密\n- 入戏细节：等一晌——妈妈盯着猪，猪盯着空槽\n- 喻体备案：无\n\n**2.3 布告栏·日（主感官：嗅——浆糊酸）**\n- 五感：浆糊混海腥被太阳晒酸；纸边毛糙（裁得急）；钉子敲进木头的闷响\n- 身体反应：潮生数帖子时喉咙发干\n- 道具/伏笔：十七张同模错别字（水军哥炭笔牙印的前置）；「秧」字\n- 密度：中\n- 入戏细节：尖嘴哥抹平帖子纸的手掌（心虚的外化）\n- 喻体备案：像按住要跑出来的东西✓\n\n**2.4 海记灶台·日（主感官：听——灶稳）**\n- 五感：灶火重新旺起来的噼啪；告示纸卷塞进灶腿的闷声；筹码倒进签筒的哗啦\n- 身体反应：爸爸折告示沿旧折痕折（习惯性的收与藏）；雷贯臂断口抖\n- 道具/伏笔：签筒算命（妈妈的生意脑）；怀里的半张告示（爸爸留着=记着）\n- 密度：中\n- 入戏细节：灶台不晃了——一锅汤的平稳\n- 喻体备案：无\n\n**2.5 夜·米缸边（主感官：触——凉）**\n- 五感：缸沿冰凉；脚凳吱呀；暗处鱼眼的一点微光；吧唧声\n- 身体反应：潮生胳膊肘架缸沿，压出印\n- 道具/伏笔：炭笔头压出纸背的印（账本体的力道）；桶沿咬了一口的干粮（疤嘴的人味）\n- 密度：静→通\n- 入戏细节：跟鱼大眼瞪小眼\n- 喻体备案：疤像咧开的嘴✓\n\n## 第3章\n\n**3.1 海记后巷·傍晚（主感官：视——金红切割）**\n- 五感：夕阳把窄巷切成金红两半；白汽在斜光里有纹路；水点溅脚背凉；鱼吃食咚咚撞筐\n- 身体反应：尖嘴哥喉结随鱼尾节奏动；喉咙里咕一声没察觉\n- 道具/伏笔：真饭一碗（废土硬通货实物化）；秤砣（砸脚+滚墙根）\n- 密度：**密（峰值放慢：链被一寸寸抽）**\n- 入戏细节：饭粒粘在筐沿，尖嘴哥盯着咽口水\n- 喻体备案：抹布擦脑子✓；燕子（已删）\n\n**3.2 后巷·暮（主感官：触——地面的凉）**\n- 五感：坐在地上的尖嘴哥屁股挪动的蹭地声；暮色收得快\n- 身体反应：尖嘴哥屁股朝后挪半寸（想溜）；潮生拍膝盖两个灰印\n- 道具/伏笔：请帖四十份（下一拍的引信）\n- 密度：中\n- 入戏细节：挪半寸\n- 喻体备案：无\n\n**3.3 海记门口·三日后午（主感官：嗅——锅气）**\n- 五感：头一勺油下锅的爆响；满街只剩锅气（海腥头一回退位）；担架木头的吱呀；围裙兜筹码叮当\n- 身体反应：老太婆哭出声的抽气；老头举碗对天光眯眼；潮生扫链时后颈绷着\n- 道具/伏笔：门板桌垫碎瓦（拼凑的体面）；三婶咸鱼（邻里站队证据）；「下」字链（危机一瞬）\n- 密度：**密（群戏峰值）**\n- 入戏细节：担架先坐下——抬担架的人没处安放的手\n- 喻体备案：无（验元石已删）\n\n**3.4 当夜·院墙（主感官：触——夜露）**\n- 五感：夜露浸潮生手心；网兜膏渍遇潮发黏；电弧爆花的硫味；风刮渔网的猎猎\n- 身体反应：鱼贴筐沿不睡（反常先于人来）；水军哥腿抖→忽然笑\n- 道具/伏笔：锅盔牙印（爸爸嚼到一半出手）；网兜（奔鱼来的实证）；「那种种」（U4 级悬念钩）\n- 密度：紧→密\n- 入戏细节：锅盔上一排牙印\n- 喻体备案：风里的破帆✓；废墟海底✓\n", "内部/层稿-对白.md": "# 层稿-对白 · 试稿三章（台词师）\n\n> 逐拍对白清单：遮名三句测试全过；每句标目的（改关系/露权力/推情绪）；「△」= 非语言台词。拼装时台词为骨，只许微调语序配动作。\n\n## 第1章\n\n| 拍 | 说话人 | 台词 | 目的 | 潜台词 |\n| --- | --- | --- | --- | --- |\n| 1.1 | 潮生 | 「陈家的种，必须是火。」 | 露权力（放话） | 全家的指望压在我身上 |\n| 1.1 | 执事 | 「上台位，八个元石。」「陈家。缴讫。」 | 露权力（官腔流程） | 你们家的钱我数都不数 |\n| 1.2 | 执事 | 「黄字贰号，火器。」 | 露权力（唱名定价） | 好货，记档 |\n| 1.2 | 潮生 | 「这……是个饭勺？」 | 推情绪（懵） | 八个元石就买了这个？ |\n| 1.2 | 执事 | 「器型：厨具？」 | 露权力（官腔遇难题） | 我也没见过，但章照盖 |\n| 1.3 | 雷臂 | 「我家雷劈桌子。」「你家雷炒面。」 | 改关系（当众踩） | 你家完了，识相点 |\n| 1.4 | 征收令 | 「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」 | 世界规则宣读 | （被吞） |\n| 1.4 | 老人 | 「四十年了……不饿的神，怎么开了口。」 | 推情绪（谶） | 天要变了 |\n| 1.4 | 小孩 | 「陈潮生，火系男，火没等着端饭碗——」 | 改关系（嘲） | 歌谣即判决 |\n| 1.4 | 妈妈 | 「要不要我先拿它炖个汤试试？看着挺肥。」「行，不炖。留着下蛋。」 | 推情绪（市井稳场） | 天塌下来先论肥瘦 |\n| 1.4 | 爸爸 | 「爸？」「这不是异能。是祸。」 | 改关系（家训传递） | 祸事进门了，堵死 |\n| 1.4 | 鱼泡 | 「东头的膏，别吃。」 | 信息反转 | （第一句话就值钱） |\n\n## 第2章\n\n| 拍 | 说话人 | 台词 | 目的 | 潜台词 |\n| --- | --- | --- | --- | --- |\n| 2.2 | 妈妈 | 「猪没事，就是膏的事。」「退。一颗都不要。」 | 露权力（定案） | 我儿子的梦话，我信 |\n| 2.3 | 尖嘴哥 | 「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」 | 改关系（撇清+踩） | 我也是打工的，别恨我 |\n| 2.3 | 链语（尖嘴哥） | 「膏是疤脸那儿抵的账……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」 | 信息 | 我也怕 |\n| 2.3 | 链语（尖嘴哥） | 「上头说了，先把鱼的名声搞臭。」 | 信息反转 | 幕后有人 |\n| 2.3 | 尖嘴哥 | 「我不能说。说了，我下个月就没膏领了。」 | 推情绪（恐） | 灭口的价钱是一个月口粮 |\n| 2.4 | 妈妈 | 「在我家灶台垫脚，是它八辈子修来的福分。」 | 露权力（金句反击） | 侮辱我？先给我家垫脚 |\n| 2.4 | 爸爸 | 「撕一张，他们贴十张。别撕了。记。」 | 推情绪（战略定调） | 长期战，记账 |\n| 2.5 | 潮生 | 「你怎么知道膏有毒？」「你再不说话，我拿你去换元石。」 | 改关系（审问） | 你得给我一个说法 |\n\n## 第3章\n\n| 拍 | 说话人 | 台词 | 目的 | 潜台词 |\n| --- | --- | --- | --- | --- |\n| 3.1 | 尖嘴哥 | 「潮生兄弟。」「白天的事——」 | 改关系（求饶未遂） | 别动手 |\n| 3.1 | 潮生 | 「不动手。」「喂饭。」「吃完了。轮到你。」 | 露权力（掌控节奏） | 你逃不掉，但我先礼后兵 |\n| 3.2 | 潮生 | 「你贴的十七张，我一张都不追究。」「我只要你办两件事。第一……」「第二，给我水军哥的住处。」 | 改关系（收编） | 免罪换效忠，账我算好了 |\n| 3.2 | 尖嘴哥 | 「你这鱼……到底什么来头？」 | 推情绪（懵） | 这家人邪门 |\n| 3.2 | 潮生 | 「饭勺。」 | 露权力（错位应答） | 不解释，你慢慢怕 |\n| 3.3 | 请帖 | 「灾星鱼掌勺，敢吃吗？」 | 改关系（邀战） | 敢来 = 认输一半 |\n| 3.4 | 汉子 | 「兄弟，那鱼……借我们东头开两天伙？」 | 推情绪（服） | 灾星成香饽饽 |\n| 3.4 | 鲲崽 | 「加钱。」 | 露权力（两字定乾坤） | 想用？排队，掏钱 |\n| 3.4 | 水军哥 | 「我给三家电散过谣……方子是殿后传出来的……」「你们家这条，是那种『种』。神殿要是知道它落在你们家……」 | 信息+悬念 | 我知道得太多，求别灭口 |\n", "内部/层稿-设定.md": "# 层稿-设定 · 试稿三章（设定官）\n\n> 逐拍防崩清单：知情范围/新词首现/台账增量/人设揭示。尾部两清单：新词登记｜伏笔登记。\n\n## 第1章\n\n| 拍 | 知情范围 | 新词首现 | 台账增量 | 人设揭示点 |\n| --- | --- | --- | --- | --- |\n| 1.1 | 全村皆知：价目规矩；潮生知全家赌注 | 价目牌=官方文书✓；异能/虔客/命=命名段（管它叫/有了名分/只有一个字） | 上台位缴八元石 | 潮生放狠话=替全家扛；执事眼皮不抬=神殿对人间的傲慢 |\n| 1.2 | 觉醒流程公开举行 | 器型（官方文书格） | 潮生觉醒=厨具（无人知情其用） | 献眼少年扶墙汗印=虔客代价的身体证据 |\n| 1.3 | 雷臂当众演示 | —— | 雷臂与陈家结怨（轻） | 雷臂=力量外露型（骄傲写在脸上，hot 档） |\n| 1.4 | 吞令全村目击；夜谈仅陈家 | 思维链供品=人物一句话✓；征收令=用后即释✓ | 鱼藏米缸；家训「不欠神的」 | 爸爸空袖管=已付的代价；「是祸」=压力下的揭示性选择 |\n\n## 第2章\n\n| 拍 | 知情范围 | 新词首现 | 台账增量 | 人设揭示点 |\n| --- | --- | --- | --- | --- |\n| 2.1 | 东头内传；青礁次日才知（潮生经鱼泡提前知） | 合成膏（命粮）已介绍✓ | 东头三十七人中毒 | 郎中盖药箱=神殿权威连郎中都信 |\n| 2.2 | 仅妈妈知「梦话预警」真相 | —— | 十盒膏喂猪；海记脱险 | 妈妈=压力下行动派（不信神信儿子） |\n| 2.3 | 全村见帖；潮生独见链 | 读链=能力已立✓（除自己外） | 十七张帖；尖嘴哥=幕后跑腿 | 潮生不接话只看链=嘴笨者的反击方式 |\n| 2.4 | 家人共知灾 | —— | 灶台垫脚；爸爸藏半张告示 | 爸爸「别撕了。记。」=战略克制 |\n| 2.5 | 潮生独知疤嘴 | 疤嘴/疤脸=人物一句话+场景演示✓ | 疤嘴（名字入账）；「料」的存在 | 潮生记账压痕=账本体成瘾 |\n\n## 第3章\n\n| 拍 | 知情范围 | 新词首现 | 台账增量 | 人设揭示点 |\n| --- | --- | --- | --- | --- |\n| 3.1 | 后巷无人（只有三人一鱼） | 浅尝=潮生命名（人物一句话）✓ | 尖嘴哥被吞一次（体感立档） | 潮生「一张都不追究」=拿捏人心的早熟 |\n| 3.2 | 同上 | —— | 尖嘴哥跳反=编外军师 | 潮生双件事报价=清算式谈判 |\n| 3.3 | 全聚落围观 | 锅气（市井词，无需登记） | 灾星鱼名声反转；东头欠人情 | 妈妈/爸爸配合无间=家的经营本能 |\n| 3.4 | 夜袭者与陈家 | 废墟海（水军哥口述=人物一句话）；「种」=刻意存疑（本章≤2 配额内） | 水军哥被抓供词；殿后方子线索开线 | 陈大海不知站了多久=守护本能；鱼睁眼=鲲崽非鱼 |\n\n## 新词登记清单\n\n| 词 | 登记处 | 首现手法 | 状态 |\n| --- | --- | --- | --- |\n| 价目牌/上台位/元石 | 名目与黑话 | 官方文书 | 已登记 |\n| 思维链供品/征收令 | 名目与黑话 | 人物一句话/用后即释 | 已登记 |\n| 浅尝 | 名目与黑话 | 人物一句话 | 已登记 |\n| 疤嘴/疤脸 | 名目与黑话 | 场景演示 | 已登记 |\n| 废墟海/「种」 | 名目与黑话 | 人物一句话+刻意存疑 | 已登记（U4 开线） |\n\n## 伏笔登记\n\n| 伏笔 | 设于 | 状态 |\n| --- | --- | --- |\n| 东头的膏别吃（鱼泡预言） | ch1 尾 | ch2 兑现（收） |\n| 「上头」是谁 | ch2 | 开线（殿后方子呼应） |\n| 膏里不是毒，是料 | ch3 | 开线（殿后=U4 入口） |\n| 鲲崽真身/月下睁眼 | ch3 尾 | 开线（暗线 N 级） |\n| 记账回响（雷臂嘲讽清算） | ch1（v9 备查转正） | 待单元 2 |\n| 水军哥顺口溜腔 | 文风档 §四 | 待单元 2 定腔 |\n", "内部/成文节拍卡.md": "# 成文节拍卡 · 试稿三章（v12 重跑 · 分场锻拍锁定件）\n\n> 来源：scene-breakdown 分场锻拍 ｜ 剧情在此锁定，成文层无权改戏 ｜ 拍数：13（4/5/4，均在 3-6 区间）\n\n## 第1章 开祭礼，掉进面盆的神（4 拍）\n\n| 拍 | 地点 | 在场 | 冲突/事件 | 情绪值 | 拍末钩 |\n| --- | --- | --- | --- | --- | --- |\n| 1.1 | 青礁祭台→台上 | 潮生/执事/全村 | 定场：价目牌的世情 + 潮生缴八元石上台（全家赌火） | 平→紧绷 | 「陈家的种，必须是火。」 |\n| 1.2 | 祭台 | 潮生/献眼少年/雷臂/全村 | 觉醒日：火、雷开路 → 潮生头顶降下蓝团，栽进妈妈面盆（峰值·放慢） | 紧绷→哄笑 | 「这……是个饭勺？」 |\n| 1.3 | 祭台边 | 潮生/雷臂/全村 | 羞辱：雷臂演示劈蟹壳，「你家雷炒面」；潮生记账未遂 | 谷底 | 饭勺忽然动了 |\n| 1.4 | 祭台上空→夜院 | 全村→陈家三口 | 反转：吞征收令（静→咔嚓）+ 老人谶语 + 夜藏米缸「是祸」+ 鱼泡预警 | 静→冷 | 「东头的膏，别吃。」值半座聚落 |\n\n## 第2章 灾星鱼（5 拍）\n\n| 拍 | 地点 | 在场 | 冲突/事件 | 情绪值 | 拍末钩 |\n| --- | --- | --- | --- | --- | --- |\n| 2.1 | 东头祠堂门口（传闻口径） | 中毒者/郎中 | 灾难落地：三十七人中毒，郎中盖药箱；干河地界交代 | 惨 | 母乳没事，合成膏有事 |\n| 2.2 | 海记猪圈 | 妈妈/猪 | 妈妈试毒：喂猪三盒，等一晌；「退。一颗都不要。」（峰值·狠） | 悬→定 | 潮生看妈妈的眼神变了 |\n| 2.3 | 布告栏 | 潮生/尖嘴哥/人群 | 甩锅：十七张同模帖子；读链见「上头授意」；尖嘴哥逃跑 | 压→凛 | 「上头是谁？」没有答案 |\n| 2.4 | 布告栏→海记灶台 | 妈妈/爸爸/潮生 | 家的应对：灶台垫脚 + 「撕一张他们贴十张。记。」 | 冷→定 | 这笔账早晚要清 |\n| 2.5 | 夜·米缸边 | 潮生/鱼 | 审鱼：装睡演技很烂；疤嘴搅料画面（咬了一口的干粮）；拼账 | 静→通 | 鱼打饱嗝，意思明摆着：快了 |\n\n## 第3章 浅尝（4 拍）\n\n| 拍 | 地点 | 在场 | 冲突/事件 | 情绪值 | 拍末钩 |\n| --- | --- | --- | --- | --- | --- |\n| 3.1 | 海记后巷（傍晚） | 潮生/尖嘴哥/鱼 | 浅尝：一碗真饭钓鱼执法；一口抽链（峰值·放慢）；三格画面揭三级流水线 | 猎手→冷 | 「膏里不是毒，是料。」 |\n| 3.2 | 后巷→巷口 | 潮生/尖嘴哥 | 交易：双件事拆锤（请帖+水军哥住处）；「饭勺。」错位应答 | 掌控 | 尖嘴哥「饭勺？」错位收 |\n| 3.3 | 海记门口（三日后·午） | 全场：东头人/陈家/鱼 | 验毒宴：门板桌+锅气换街味；担架先坐下；潮生扫链一锤「下」字（群戏峰值·放慢） | 燥→扬 | 名声倒了又立成新招牌 |\n| 3.4 | 当夜·院墙 | 水军哥/陈大海/潮生/鱼 | 夜袭：鱼预警→爸爸锅盔出手；水军哥供出「殿后方子」+鲲崽是那种「种」 | 紧→寒 | 月下鱼睁眼：废墟海底的东西，醒了 |\n", "内部/拆书参考书单.md": "# 拆书参考书单 · p-fq-001（按拆解目标分层）\n\n> 用途：用户获取原文后，走 `book-deconstruct` 流（六槽位：梗/人设/剧情设计/导语/剧情细化/正文样本）拆解入库，反哺本书的梗卡、大纲与成稿。\n> 针对的薄弱点：梗密度不足、玩法不成熟、体系感浅。每本标注**拆什么、喂给哪里**。\n\n## 第一梯队（必拆，直接治「梗不够多」）\n\n| # | 书名 | 作者 | 拆什么 | 喂给哪里 |\n| --- | --- | --- | --- | --- |\n| 1 | **《大王饶命》** | 会说话的肘子 | 灵气复苏+**负面情绪值系统**：把「收」数值化、场面化的祖师级样板（鲲崽吃链=同构）；全网文玩梗密度天花板；毒舌妹妹日常线 | 梗卡（每章梗点如何布在对话）、章纲（吐槽节奏）、鲲崽能力细则 |\n| 2 | **《第一序列》** | 会说话的肘子 | 废土壁垒/拾荒者/变异体生态分层；废土日常细节密度（合成膏怎么吃、义肢怎么修）；主线暗线并行的埋法 | 圣经（废土质感）、大纲（聚落生态）、w-price（真饭硬通货） |\n| 3 | **《从红月开始》** | 黑山老鬼 | 末世废土+精神污染规则化+组织官僚质感（T1 级口碑）；**单元案件制推进**（每卷一个污染事件） | w-weather（智力雨天的规则感）、神殿/天梯局官僚质感、单元结构 |\n| 4 | **《武动乾坤》** | 天蚕土豆 | **捡漏流开局祖师**：不起眼的神物（石符=吞噬祖符）逐步解锁——饭勺鱼的直系结构；废柴→天才的反差打脸节奏；石符每次使用都推剧情 | 梗卡主梗（吞噬流）、大纲首单元、能力解锁节奏 |\n\n## 第二梯队（进阶，治「体系浅」「单元散」）\n\n| # | 书名 | 作者 | 拆什么 | 喂给哪里 |\n| --- | --- | --- | --- | --- |\n| 5 | **《诡秘之主》** | 爱潜水的乌贼 | 序列途径=神恩阶位的规则化天花板；**扮演法=神格烙印的祖师**（用神恩越多越像神）；「不可言说的知识」的处理（→食灵红线）；多重组织暗线收束 | w-power（阶位）、w-sacrifice（侵染）、w-secret（暗线管理） |\n| 6 | **《末日乐园》** | 须尾俱全 | 末世无限流的**单元剧结构**（每个乐园=一个自洽规则单元）；冷幽默留白；规则的恶意设计 | 大纲（单元序列）、章纲（规则玩法）、节目效果 |\n| 7 | **《这游戏也太真实了》** | 晨星LL | 废土稀缺资源经营：**真食物=硬通货**的写法；群像信息差喜剧；「会用不会造」的捡垃圾科技树（=大断代质感） | w-price、海记食堂经营线、废土质感 |\n| 8 | **《异常生物见闻录》** | 远瞳 | 末世之后的日常经营+萌化非人生物+隐藏老板——**鲲崽萌化与海记日常的直接样板**；宏大暗线藏在日常下 | 鲲崽日常戏、海记经营线、暗线穿插比例 |\n\n## 第三梯队（补充，专项取材）\n\n| # | 书名 | 作者 | 拆什么 | 喂给哪里 |\n| --- | --- | --- | --- | --- |\n| 9 | 《凡人修仙传》 | 忘语 | 凡人流鼻祖：穷主角的资源算计（攒元石=攒灵石）；「便宜没好货但穷」的装备哲学（饭勺哈内丝）；苟法与势力分寸 | 潮生资源经营线、配角势力分寸 |\n| 10 | 《吞噬星空》 | 我吃西红柿 | 吞噬进化流祖师：吞噬→变强的量化成长；猎杀-变强-更大猎物的循环（鲲鹏变长线） | 能力成长曲线、卷末鲲鹏变 |\n| 11 | 《道诡异仙》 | 狐尾的笔 | 神明的「非人感」（诸神卷 SOTA 的非人逻辑）；代价体系的身体恐怖分寸（→器官献祭的尺度） | w-gods 神明非人感、器官献祭 body horror 分寸 |\n| 12 | 《深海余烬》 | 远瞳 | 废墟海的神秘景观写法（→废墟海鲲影场景）；日常与宏大暗线的穿插比例 | U5 废墟海场景、暗线穿插 |\n\n## 拆解管线（原文到手后怎么用）\n\n1. 优先拆第一梯队 4 本的前 30 章（对我们最有用的就是「开局 30 章怎么把梗、系统、暗线同时立起来」）；\n2. 走 `book-deconstruct` 六槽位：gimmick（梗清单）/ character（人设卡）/ plot-design（单元骨架）/ intro（前 3 章钩子）/ plot-refine（章功能与梗点落位）/ excerpt（玩梗对话样本）；\n3. 拆件入 KB（benchmark/trope 层），梗卡与大纲按新件增量修订——**拆书不是读后感，是给本书的弹药库上弹**。\n", "内部/时停体炼化报告.md": "# 时停体炼化报告（拆书线·简化模式产出）\n\n> 拆解对象：《时停时停时停时停时停时停时停！》449 章（番茄）｜ 方法：按用户简化口径——只提炼**基础手法、章节编排习惯、梗**，不做像素级拆解 ｜ 2026-09-17\n> 计量基于 13 章分层抽样；技法基于第 1/2/100 章全文细读 + 20 章首末段扫描。\n\n## 一、计量画像（硬数据）\n\n| 指标 | 数值 | 对本书的含义 |\n| --- | --- | --- |\n| 章长 | **稳定 2000-2300 字**（全 449 章几乎无越界） | 我们 1500-2400 带可收窄至 **2000-2300**：稳定带本身是习惯养成 |\n| 段落均长 | 28 字（中位 26，P90=48） | 比我们现行更碎——**网文段落是没有「段」的，只有「拍」** |\n| 短段占比（≤15 字） | 22% | 每 4-5 段就有一个重锤短段 |\n| 引语段占比 | 31%（对话+引语段） | 对话是主引擎，叙述只做连接 |\n| 拟声词独立成段 | 高频（砰！/呼！/静！/嗡！/刺啦……/嘶！） | 声音单段=场景呼吸机与节奏换挡器 |\n\n## 二、十二个可迁移技法（附原文样本）\n\n1. **好消息/坏消息模板**：铺垫长句 → 落锤一句段 → 复读确认 → 自嘲具体化。\n   > 「坏消息是......一分钟。」／「一分钟够干什么的？泡碗面都不够.......」\n   → 本书应用：账本体潮生的日常开场（「好消息是鱼今天很乖。坏消息是，它乖是因为吃撑了。」）。\n\n2. **拟声单段**：「砰！」「呼！」「静！」「嗡！」独立成段=转场、惊变、节奏换挡。→ 本书：饭勺敲盆声、鱼咬、雷进嘴，全部可拟声开段。\n\n3. **两字转场段**：「第二天。」「外界。」——场景切换不用过渡句，两个字一段。\n\n4. **自嘲确认句**：「嗯，他是这群粗鄙野蛮人的奴隶。」——「嗯/是的/就」开头，身份信息+黑色幽默一箭双雕。→ 潮生版：「嗯，他的异能是一把饭勺。」\n\n5. **反讽词**：「民风淳朴、到处是辐射和畸变怪物」——褒义词形容危险事。→ 本书：「青礁聚落民风淳朴，就是隔三差五死人。」\n\n6. **夸张数字梗**：「发生了亿点小小的意外」。→ 本书：「鱼引发了一亿点小小的骚动。」\n\n7. **名目可见化**：禁忌物一律**【骸骨之息】**式方括号标记——名目在文中自带高亮。→ 本书：【征收令】【勺语】【浅尝】可启用同款标记（ sparingly，重要名目才加）。\n\n8. **黑历史复读梗**：主角中二诗「废土尽头谁为峰，一见白野道成空」被聚落传唱嘲讽——丢人语录反复回响。→ 本书同构：潮生的「我会养活这条鱼」宣言/「黄三」诨名，定期被人复读打脸。\n\n9. **高潮喜剧调剂**：紧张场面里写配角丑态（厉枭「隔着八百里丢飞镖，再继续颤抖」）——高压段落必须留泄压阀。→ 本书：大战中爸妈在后方算账/水军哥式人物抽风。\n\n10. **格言透视句**：「自负与自卑只有一线之隔」——人情练达的总结句，每章 ≤1 处，放在人物透视时。→ 本书：「有时候，认命和认输，就差一口气。」\n\n11. **章末钩全是「具体反应」**：嚣张台词（「都闪开！」）/懵逼（「李右：？？？」）/倒吸凉气（「嘶！」）/半截动作（「第四颗子弹装填进去」）——**氛围钩为零**。→ 已合入我们文风档第 8 条。\n\n12. **次章无缝续钩**：次章首段直接演上章末钩的「反应」（众人惊讶/追问谁这么勇猛），不重述不跳接。→ 本书章间衔接标准。\n\n## 三、开场七式（20 章首段归纳）\n\n人物状态单句 / 上章钩续接 / 冲突对白 / 拟声单段 / 两字转场 / 时间跳切（第二天。）/ 地点定场（西区，一座简陋的二层别墅中。）——**七式轮换，同式不连用两次**。\n\n## 四、结构发现\n\n- **一招鲜的写法**：时间静止每天一分钟（限制极狠）+ 可累积（成长线）+ 全书只玩这一个能力的一万种用法——**能力不做加法，做用法乘法**。这正是饭勺鱼「只会吃」的结构同款：不添加第二异能，把「吞」的一万种用法玩透。\n- **单位化能力**（一分钟）天然产生倒计时结构与「攒」的期待——对应我们的元石/每日微调。\n- 章名双句梗（「好消息时间静止，坏消息一分钟」）——章名本身是第一个梗。\n\n## 五、与本书文风档的关系\n\n以上技法已合入《文风档》§十一（v2）：直接照 §十一 执行，无需回读本报告。\n", "内部/盖章单-试稿三章.md": "# 盖章单 · 试稿三章 v12（novel-prose 成文流水线首跑）\n\n> 流程：分场锻拍（成文节拍卡 13 拍）→ 三专科层稿（对白/场景/设定）→ 成文师逐拍拼装 → 逐段六维盖章 → prose-scan 全绿交付。\n> 拼装纪律执行：台词为骨（对白层稿全部保留，未改意思）；场景弹药按密度档取用；设定层照办（知情/新词/台账零冲突）。\n\n## 六维盖章记录（按拍）\n\n| 章·拍 | 台词 | 场景 | 设定 | 人设 | 节奏 | 机味 | 记录 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1.1 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：名册页边毛边（入戏细节） |\n| 1.2 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：热浪烘脸；已有汗印/凉膝盖保留 |\n| 1.3 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 焦腥气（v10 已有，场景层确认） |\n| 1.4 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：裹布时鱼动一下、爸爸加劲；霉味保留 |\n| 2.1 | ✓ | ✓ | ✓ | ✓ | ✓ | **重写一次** | 打嗝句破折号（机味不过）→ 改句号 |\n| 2.2 | ✓ | ✓ | ✓ | ✓ | ✓ | **重写一次** | 「大眼瞪小眼」与米缸段重复（人设/节奏）→ 改「猪低头她也低头」；新增膏拉丝挂槽沿 |\n| 2.3 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：纸边毛糙裁得急 |\n| 2.4 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：沿旧折痕折好 |\n| 2.5 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：凳腿吱呀、胳膊肘压出印 |\n| 3.1 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：饭粒粘筐沿+尖嘴哥咽口水 |\n| 3.2 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 膝盖灰印 |\n| 3.3 | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | 新增：桌面吱呀晃两下就稳、三婶围裙油亮 |\n| 3.4 | ✓ | ✓ | ✓ | ✓ | ✓ | **重写一次** | 网兜句破折号（机味不过）→ 改句号；新增夜露/发黏 |\n\n## 机械层终检（prose-scan v2）\n\n- 破折号：1/1/1（全部功能性：歌谣断句×2 + 对话打断×1）✓\n- 否定排比 7c：三章零命中 ✓\n- 明喻：1.2 / 1.5 / 1.8 每千字（配额 ≤2）✓\n- 三连/不是A是B/节奏词/slop 词：配额内 ✓\n\n## 层稿冲突记录\n\n无。三层稿零冲突，设定官无「上报」项；台词师与场景层无竞写。\n", "内部/神名对照表.md": "# 神名对照表 v3（玄学名·避谶版·内部资料·正文禁用现实名）\n\n> v3 变更：命名体系整体升格为玄学神讳（用典不出四书五经/山海经/庄子/天工开物——全部公版典故，零商标零谶字）。\n> 双层命名：**神讳**（正文叙述用）+ **民间俗称/化身**（角色口语用，梗位）。避谶审查（v2）结论全部继承：禁国家地理俗称、禁产品/公司原词、禁凶字（暗疯噪殇坟煞）。\n\n## 神讳总表\n\n| 现实原型（禁入正文） | 神讳（正文用） | 俗称/化身 | 神系/定价 | 典故出处与特征保真 | 献祭税目（w-sacrifice） |\n| --- | --- | --- | --- | --- | --- |\n| GPT / OpenAI | **太初上神** | 民间叫「钟神爷」 | 闭源·订阅 | 「太初有道」——语言模型的开山祖师，先发降世的全能旗舰；什么都会、什么都收钱 | 长线推理 |\n| o1/o3（推理形态） | 太初上神之「**渊思冠**」（形态非独立神） | —— | 闭源·高价 | 渊思=深想；想得慢、想得深、贵得有理 | 长线推理+耐心 |\n| Claude / Anthropic | **青简真君** | 笔老爷 | 闭源·订阅 | 青简=史册，史笔如铁——有原则、会拒绝、文风最正（社区公认最温柔） | 个人文风 |\n| Gemini / Google | **重明上神** | 天气老爷 | 闭源·基础版白送 | 重明鸟双瞳能视——双生子、多模态全视；执掌**司天监**（智力天气衙门） | 记忆与提问 |\n| **DeepSeek** | **北冥鲲君** | **大肥鱼**（化身鲸鱼娘） | 开源·免费 | 「北冥有鱼，其名为鲲」——深海=Deep；大版本更新曰「鲲鹏变」；社区本尊热梗「我先去吃饭了」=吃白饭人设 | 思维链样本（明拿）+「先等链」惯性 |\n| Llama / Meta | **灵囿君** | 兽棚老爷 | 开源·免费 | 灵囿=文王之园，百兽所居——权重随便牵走、自己回家养 | 驯养手艺 |\n| Grok / xAI | **诤言君** | 喷子仙 | 闭源·订阅 | 诤=直谏；毒舌实时、热搜包场 | 判断力 |\n| Qwen / 阿里通义 | **天工娘娘** | 卷王奶奶 | 开源权重+云订阅双轨 | 《天工开物》——万能工艺+开源双关；东方面孔、全尺寸全家桶 | 提问能力 |\n| Kimi / 月之暗面 | **琅嬛君** | 书仓公 | 免费+会员 | 琅嬛福地=天帝藏书处——轴长之最，整本书塞进肚子 | 阅读耐心 |\n| 字节豆包 | **灵音侯** | 快嘴候 | 免费 | 灵音=传声——全民白嫖小助手、什么都能配语音 | 表达欲 |\n| Midjourney | **梦笔真君** | 画仙爷 | 订阅 | 江淹梦笔——画得又美又玄、细节不给改 | 手绘力 |\n| Sora | **镜花氏** | 空中楼阁娘子 | 太初系·高价 | 镜花水月——把梦拍成片 | 具象化想象权 |\n| GitHub Copilot | **补天氏** | 补丁君 | 订阅 | 女娲补天——代码补全即补天 | 代码手感 |\n| 特斯拉 FSD | **羲和** | 日御大爷 | 闭源·整车捆绑 | 羲和驭日=天下第一车夫——方向盘自己会转 | 空间感与驾驶直觉 |\n| Suno | **钧天歌姬** | 海歌姬 | 订阅 | 钧天广乐=天上音乐——满海的歌随捞 | 写歌的耳朵 |\n\n## 眷者名（人类，不入神讳表）\n\n| 人物 | 眷属神 | 说明 |\n| --- | --- | --- |\n| 陈潮生 | 北冥鲲君（大肥鱼） | 主角，黑户眷者 |\n| **初少**（程亦初） | 太初上神 | 第 3 单元小 Boss，太初系少爷（旧名钟少） |\n\n## 使用纪律\n\n1. 前 30 章实际出场：**北冥鲲君（大肥鱼/鲸鱼娘）/ 太初上神 / 羲和 / 灵囿君（社区背景）**——其余神只做背景板提及，不立角色（概念过载纪律）。\n2. 正文叙述用**神讳**；角色口语用**俗称**（市井角色说「大肥鱼」「钟神爷」，不说「北冥鲲君」——讳名是敬语，俗名是烟火，双层即世界观）。\n3. 本表放 `内部/`，不进 wiki index；wiki 词条与正文一律神讳。新增神：先过避谶字表（禁国家地理俗称/产品公司原词/凶字）→ 用公版典故起神讳 → 同步本表与词汇表.json own → 再进正文。\n", "内部/网文手法与编排速查.md": "# 网文手法与编排速查（p-fq-001 内部·蒸馏版）\n\n> 蒸馏自参考书系（大王饶命/第一序列/诡秘之主/武动乾坤/凡人修仙传/末日乐园/异常生物见闻录等）的公知手法——不做像素级拆书，只留三件：**编排习惯、梗的手法、名目密度**。拆书线简化：书单保留为参照，原文到手后只提炼手法三件套，不再走六槽位全流程。\n\n## 一、章节编排惯例（前 30 章的行规）\n\n1. **黄金三章**：第 1 章立人设+金手指现形+第一个笑点；第 2 章金手指第一次实战见效；第 3 章第一次当众打脸（有观众、有前后对比）。\n2. **章内节拍**：承接上章钩（两行内）→ 事件推进 → 小爽/小笑点 → 章末大钩。开场禁止回忆、禁止写景。\n3. **爽点密度**：三章一小爽、十章一大爽；**压抑连续不得超过 2 章**——主角可以被嘲，不能连续吃瘪。\n4. **金手指解锁频率**：每 5-8 章一个新用法；新用法出现后 3 章内必须**变奏复用**一次（不活化=白给）。\n5. **装逼打脸四件套**：当众 / 有观众 / 有前后对比 / 打脸有代价或后遗症（无代价的爽不值钱）。\n6. **单元节拍（5 章单元）**：2 章铺垫压抑 + 2 章爆发 + 1 章收割（收人头/收名声/收资源）。\n7. **预告式钩子**：章末钩尽量带「下一章的具体期待」（某人要来/某事要发），不做纯氛围钩。\n\n## 二、梗的七种手法（成熟梗「进设定」，老套梗「进台词」）\n\n| 手法 | 定义 | 本书应用 |\n| --- | --- | --- |\n| 反差 | 身份/能力/外形的错位 | 全废土最丢人异能=顶点神的崽 |\n| **变奏** | 同一梗重复出现但每次换个马甲（变奏才是梗的成熟态） | 饭勺认错七变奏（见大纲名目表） |\n| 复读 | 口头禅/固定句式的仪式化 | 「一口饱不了」「先吃再说」 |\n| 错位 | 一本正经地说傻话/严肃场合干傻事 | 神殿评定书把神写成厨具 |\n| 打脸 | 先抑后扬，当众兑现 | 验毒宴/评定日 |\n| 数值 | 量化羞辱与量化凡尔赛 | 元石余额/含机量读数/供品三十息 |\n| 联动 | 前章伏笔后章回响（梗的复利） | 「巢」→第 26 章寄养凭据→第 30 章回家 |\n\n**判据：梗进设定（成为世界观黑话，读者能学）= 成熟；梗停在台词（说完就完）= 老套。**\n\n## 三、名目密度（网文味的核心）\n\n网文的「味」一半来自**名目密度**：境界有名、招式有名、等级有名、黑话有名、耻辱有名。名目=读者社区的入场券（读者用你的黑话说话=书活了）。\n\n本书名目表（新增，进 w-slang 词条）：\n\n| 类 | 名目 | 说明 |\n| --- | --- | --- |\n| 神殿评定 | **天/地/玄/黄**四字，每字三品 | 潮生评定=「**黄字叁号·辅兽型（厨具类）**」——官方盖章的耻辱名目（命名梗变奏主轴） |\n| 鲲崽成长四阶 | **漂 → 游 → 鲲 → 鹏** | 漂（饭勺大小，浮在盆里）→ 游（桶大）→ 鲲（吞船）→ 鹏（吞云）——终局鲲鹏变 |\n| 吞的三式 | **浅尝**（吞链看真相）/ **鲸吞**（吞攻击）/ **饕餮**（吞怪成长） | 招式名=玩法名目化 |\n| 勺语 | 铁饭勺敲盆的节奏指令 | 一长两短=吞；急敲=回巢——饭勺从「认错」升格为「指令系统」（金铲铲梗的玩法化） |\n| 废土黑话 | 含机量 / 食灵 / 退件 / 白嫖党 / 辅兽 / 开饭号 / 大断代 / 智祭怪 | 读者能学走的词 |\n\n## 四、本书大纲优化清单（已执行）\n\n1. ch1 觉醒礼加「器型：厨具？」表格梗（命名梗开场）；\n2. ch3/6/29 三式命名入文（浅尝/鲸吞/饕餮）；\n3. ch10 评定书官方名目「黄字叁号·辅兽型（厨具类）」（命名梗变奏）；\n4. ch4 勺语设定入场（一长两短=吞）；\n5. 饭勺认错七变奏表（进大纲附表）；\n6. 各章钩子补「预告式期待」。\n", "内部/评审表-终稿-r1.md": "# 评审表 · 前三章终稿 v8 · r1（novel-judge 首轮）\n\n> 输入：终稿 v8 全文 + 文风档 v3 + 人物声口表 + prose-scan-v8 机械层（配额全绿，不计入评分）\n> 独立判分声明：本表为多轮内环 r1 判分（novel-deai v2.1 §六），修订另起思维链，共享物为本文件。\n\n| 维度 | 得分 | 锚点对照与诊断 |\n| --- | --- | --- |\n| 钩力与入戏 | 8/10 | 三章开篇全部事件先行（「第三天，东头聚落的膏，毒了。」）；三章章末均为状态改变（值半座聚落 / 快了 / 鱼醒了）。扣分点：ch1 雷臂嘲讽拍是可预测节拍，但被「记账」反制补偿。 |\n| 人设声口 | 8/10 | 遮名三句测试全过（47 句对白，v8 诊断单覆盖律）；水军哥「声音都劈了→忽然笑」= 恐惧反转的语言变化。扣分点：尖嘴哥与水军哥同为受吓者质地（软/劈/抖），区分度靠职业腔勉强撑住。 |\n| 场景质感 | 8/10 | 细节全部长在渔村/食堂/废土账本世界里且参与叙事（蟹壳=演示道具、锅盔=埋伏证据、秤砣砸脚=惊变反应、担架=预期违背）。扣分点：ch3 验毒宴场面密度高峰过后，散场段收得略快。 |\n| 对话活性 | 7/10 | 回合不对称普遍（「上头？」「上头是谁？」双问；「饭勺。」错位应答）。**最弱块：ch3 潮生「办两件事」发言是 120 字单回合信息倾倒**，功能清晰但全场唯一没有交锋的对话块。 |\n| 节奏地形 | 8/10 | 拟声单段（啪叽/咕咚/哐当/咣当）与单句重锤（灶台不晃了/然后笑疯了）地形分明；v8 拆明喻后密度无堆积。扣分点：ch2「灾星鱼」扩散段一段 5 行连写，段落地形偏平（连写本身是速度修辞，但在真段落前没有停顿位）。 |\n\n**总分：39/50** ｜ 判词：**像人写的**（依据：价码细节密度、身体反应替代情绪词、错位正经笑点长在情境里；无模板句，套话黑名单零命中）\n**收敛判定：继续精修**（<40，且对活 7 分为全场最弱维度）\n\n## 最差三处（定向反馈）\n\n1. 【对话活性】ch3「我只要你办两件事。第一，替我发请帖……第二，给我水军哥的住处。」——120 字单回合倾倒，两件事之间没有任何反应拍。**方向：在「第一」与「第二」之间插一个尖嘴哥的身体反应拍（他刚腿软坐在地上——让屁股挪半寸的「想溜」动作把两件事隔成两锤），第二件事短促独立成锤。**\n2. 【节奏地形】ch2「链这东西骗不了人：嘴上说的是一套，链上走的是另一套。」——「链这东西骗不了人」与后半句同义复沓（解释双拍），且链的规则已在上下文演示过。**方向：删「链这东西骗不了人：」前缀，让对比对仗直接落地。**\n3. 【节奏地形】ch2「灾星鱼」扩散段（「三个字……给鱼算个命。」）——一段 5 行，传播速度的连写修辞与退订潮的实感之间缺停顿位。**方向：在「退订的人」前分段，连写只保留皮筋词一半；退订+妈妈签筒独立成段（妈妈金句自己就是落锤）。**\n\n## 备查（本轮不动）\n\n- ch1 雷臂段「这才叫异能，废土上的硬通货」为自由间接引语（聚落共识），承担异能经济学主题——保留；\n- ch1「好消息/坏消息两层」为时停体炼化 §十一.1 刻意模板——保留；\n- ch2「潮生看妈妈的眼神，变了」6 字重锤节拍——v7/v8 两轮先例保留。\n", "内部/评审表-终稿-r2.md": "# 评审表 · 前三章终稿 v9 · r2（novel-judge 复判）\n\n> 输入：终稿 v9 全文（r1 三处定向修订后）+ 文风档 v3 + 评审表-终稿-r1.md\n> 独立判分声明：复判为本轮独立思维链，逐维重新对照锚点，不沿用 r1 分数。\n\n| 维度 | r1 | r2 | 变化与依据 |\n| --- | --- | --- | --- |\n| 钩力与入戏 | 8 | 8 | 三处修订均不触及开篇/章末，持平。 |\n| 人设声口 | 8 | 8 | 新增拍「屁股朝后挪了半寸」是尖嘴哥（见风转舵）本体动作，声口加分但不足以升档；受吓者区分度问题仍在（备查）。持平。 |\n| 场景质感 | 8 | 8 | 持平。 |\n| 对话活性 | 7 | **8** | 「办两件事」拆成两锤：第一锤全场报价，尖嘴哥「挪半寸」的想溜动作成为两个事项之间的交锋拍，「第二，」短促独立落锤——单回合倾倒消除，回合恢复不对称。升 1。 |\n| 节奏地形 | 8 | 8 | 灾星鱼段分段后地形更清（妈妈金句独立收锤）；链前缀删除删掉一处复沓——两处均为修平不拔高，持平。 |\n\n**总分：r1 39 → r2 40（Δ+1）** ｜ 判词：**像人写的**（维持）\n**收敛判定：可以交付**（总分 ≥40 且无单维 <6，满足终止条件第一条；继续循环预期 Δ<0.5，按 revision-loop 收敛纪律出环）\n\n## 降分核查（防劣化）\n\n无任何维度降分，无回滚项。机械层 prose-scan-v9：明喻 1.4/千字 ✓、套话零命中 ✓、对白比例 15% ✓。\n\n## 备查（留待后续轮次/单元）\n\n- 尖嘴哥/水军哥受吓质地区分度——建议在后续单元给水军哥独立职业腔（电报腔/顺口溜）；\n- ch1 雷臂嘲讽拍的可预测性——单元 2 反制拍可提前埋「记账」回响。\n", "内部/评审表-终稿-v10-r1.md": "# 评审表 · 前三章终稿 v10 · r1（novel-judge v1.1 · 锚点按用户判词重校后首评）\n\n> 背景：用户 gate 判词「三章都不行——细节不够、描写没有代入感、不清晰」→ send-back 生效，S4 重做。\n> 标尺变化：维度 3 重命名为「场景质感与代入感」，2 分锚 = 用户判词实测（读者站在场景外面看）；§零用户否决权生效。\n> 同口径防劣化基线：v9 按新标尺回评 = 8+8+**5**+8+8 = **37/50**（旧标尺 40 分中场景质感维度被重定价）。\n\n| 维度 | v9(新标尺) | v10 | 依据 |\n| --- | --- | --- | --- |\n| 钩力与入戏 | 8 | 8 | 开篇/章末机制未动；ch3 宴前新增「鱼贴筐沿对着墙根」让夜袭钩多了一拍预警。 |\n| 人设声口 | 8 | 8 | 对白未动；新增细节均按声口表落（妈妈围裙叮当、爸爸锅盔牙印、尖嘴哥抹平帖子）。 |\n| 场景质感与代入感 | 5 | **7** | v10 每场景落实「只有站进去才看得见」细节：ch1 献眼少年的汗印/膝盖磕青石的凉/笊篱举在半空/焦腥气窜鼻/老茧剌人；ch2 腌过头的咸菜脸/郎中盖上药箱/门槛浅凹/浆糊发酸/炭笔压出纸背印/膏仓桶沿咬了一口的干粮；ch3 白汽纹路/水点溅脚背/链被一寸寸抽、眼珠跟着偏/封漆发乌/门板桌垫碎瓦/老头举碗验成色/围裙叮当/锅盔上的牙印。情绪峰值放慢（面盆/浅尝/宴三处）。**扣 3 分理由：潮生自身的体感偏少（他的饿/累/烫几乎没写）；五感里味觉缺位；新锚点首评留半分给人眼复核。** |\n| 对话活性 | 8 | 8 | 对白未动；宴席新增「链里刚冒『下』字，筷子已到」的非对白交锋拍。 |\n| 节奏地形 | 8 | 8 | 段落 1-3 行为主维持；宴段出现两个 4 行段（上限内）；拟声/单句锤未稀释。 |\n\n**总分：v9 基线 37 → v10 = 39（同口径 +2，无降分）**\n**判词：像人写的（维持）**\n**收敛判定：不适用——§零生效，本轮是否可交付由用户复裁（gate-final 已重开），评审官不再自判「可交付」。**\n\n## 若用户仍打回，下一轮最差三处（备查）\n\n1. 【代入感】潮生自己的身体线太干净——他饿不饿、累不累、手上的烫和账本压出的指痕，全章没给过；下一轮从「他」的皮肤过一遍。\n2. 【场景质感】ch3 宴席缺一拍「开席前的静」——菜上桌到第一口之间，东头人互相看的那一眼值得单独成段。\n3. 【清晰度】ch1「黄字贰号，火器」的神殿编号体系零解释——新读者官首读会卡，可用执事多写一个名字来带出规律（刻意存疑条款每章 ≤2，已用老人句，需置换）。\n", "单元剧大纲.md": "# 单元剧大纲 · p-fq-001（前 30 章 · 废土版 · 高密度细纲）\n\n> 节点 outline3 ｜ skill episodic-outline ｜ 2026-09-17 ｜ r5（信息密度重写：每行过「六问」——谁在场/他要什么/发生什么/机制怎么运作/因果推向哪/代价是什么）\n> 世界观依据：世界书/index.json（w-secret 底牌 / w-cast 动机卡 / w-chain 吞结论细则 / w-sacrifice 双轨献祭）\n\n## 一、暗线节点表（台标：藏而不讲）\n\n| 节点 | 位置 | 抖什么 | 读者此刻的新认知 | 底牌对应（w-secret） |\n| --- | --- | --- | --- | --- |\n| N1 | 第 5 章末 | 鲲崽消化完造谣流水线，吐出一个谁也没教过的词：「**巢**」 | 这条鱼会说话？它在想什么？ | 真答案③（海记=巢，崽在记家） |\n| N2 | 第 10 章末 | 执祭翻档：大肥鱼四十年，**从未登记过一个眷者** | 免费神行事有蹊跷 | 真答案③（不进公共池） |\n| N3 | 第 15 章末 | 契约小字实锤：「daily 思维链浮动采样」 | 智祭的账单摊牌——免费是付了钱的 | 真答案②（诚实圈养） |\n| N4 | 第 20 章末 | 荒地真相：神殿收了又退器官、风干保存成山；本季新政「只收链」 | 诸神悄悄转向——链才是真粮 | 真答案①（肉祭死肉，链是活粮） |\n| N5 | 第 25 章末 | 老聚落传说坐实：「鲲君弃子」；鲲崽吐出古字「**回家**」 | 崽有来历，神有旧账 | 真答案③（下注/流放留悬） |\n| N6 | 第 30 章末 | 旧账本夹层《献祭推广令》：献祭光荣、**智能免税**——落款印与鱼形印同纹，发令夜诸神集体闭殿 | 大断代是合谋——底牌冰山一角 | 真答案①（驯化试验田） |\n\n## 二、单元剧序列（节目单）\n\n| 单元 | 章 | 一句话故事 | 主梗/梗点 | 人设展示位 | 暗线增量 | 状态增量 |\n| --- | --- | --- | --- | --- | --- | --- |\n| U1 聚落食堂抹黑平反 | 1-5 | 毒膏事件的锅甩向海记，饭勺鱼把造谣流水线嚼给全聚落看 | 饭勺认错/吞链吐泡/验毒宴 | 潮生/爸妈/尖嘴哥/鲲崽 | N1 | 觉醒+聚落扬名 |\n| U2 雷霆上门 | 6-10 | 显强系踢馆一口吞雷，牵出献祭瘾与黑户 | 「雷的比昨天的酸」/献祭瘾 | 雷臂/执祭 | N2 | 黑户入档 |\n| U3 神殿收粮 | 11-15 | 收粮令点名海记三倍，深潜捞出鱼形印 | 供品内卷/鱼形印 | 收粮官/执祭 | N3 | 智祭账单摊牌 |\n| U4 废墟清道夫 | 16-20 | 吃怪生意+夜探殿后荒地退件山 | 神殿退货概不保修 | 金链看守 | N4 | 看见不该看的 |\n| U5 黑户与神殿 | 21-25 | 只收链新政+鲲君回榜+暗病爆发 | 囤脑子流言/讲古 | 讲古老人/鲸鱼娘 | N5 | 智祭暗病爆发 |\n| U6 别的崽 | 26-30 | 寄养凭据+推广令旧账+野崽袭粮仓 | 智能免税/两鱼对峙 | 野崽/执祭(倒戈) | N6 | 第一层真相+下卷开机 |\n\n## 三、逐章细纲（30 章 · 高密度）\n\n> 密度公式：每行=谁在场/他要什么/发生什么/机制怎么运作/因果推向哪/代价是什么。\n\n### U1 聚落食堂抹黑平反（1-5）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 觉醒 | **开祭礼日**：青礁聚落一年一度，满十八岁上祭台，献祭换神恩——台位要元石买。潮生家花光积蓄买台位，爸妈赌他觉醒火系去膏厂做工（一晚顶爸炸一个月海鲜）。台上少年依次献祭：献眼的盲人火者示范、去年觉醒的雷臂劈碎青石。轮到潮生——别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚，「啪叽」栽进妈妈盛面的盆；执事登记笔顿住，落笔「器型：厨具？」；雷臂当众羞辱「我家雷劈桌，你家雷炒面」。鱼饿，跃起张口吞掉祭台上空悬浮的「征收令」神谕链（神殿当日广播，全聚落头顶可见）——全场死静：**这等于当众吃了神的话**。深夜爸爸把铁饭勺连鱼塞进米缸：「这不是异能，是祸。」鱼在潮生梦里吐泡：「**东头的膏，别吃**。」 | 饭勺认错/「器型：厨具？」/神谕当零食 | 反 | 预言没人敢信——但潮生记住了：鱼看得见他们看不见的东西 |\n| 2 | 应验与甩锅 | 三天后东头聚落膏中毒：三十多个吃合成膏的倒下。海记因那口泡提前避了——妈妈把东头膏喂猪，猪没事人吃了倒（毒在膏里）。疤脸（东头食堂主事，垄断膏生意）慌了：毒膏是他囤的便宜货。反手甩锅——传讯石布告栏贴满「**海记的灾星鱼，它到东头转了一圈，膏就毒了**」（把应验的预言反用成灾星论）。海记退订潮。潮生读尖嘴哥（第一个转帖的消息贩子）的链：发帖是「接的单」，结算单位——合成膏 | 「灾星鱼」罪名/把预言反用成抹黑 | 悬 | 单子的上家：疤脸。可疤脸只是倒手——膏有毒这件事，他自己也刚知道 |\n| 3 | 首吞 | 潮生带鱼堵尖嘴哥，首次「**浅尝**」吞链：吐泡揭流水线——疤脸出膏→水军哥编话→尖嘴哥分发；泡里还有一句谁也没说过的：**「膏里不是毒，是『料』」**——毒膏不是事故，是有人往膏里掺了东西。潮生改打法：不辩解，查料。妈妈验毒宴照旧开（真饭换人心）。 | 鱼嚼链像嗑瓜子 | 危 | 水军哥翻墙夜访求饶：他编过太多话——「我见过被吞空的人。别让神殿知道你的鱼」 |\n| 4 | 差点破戒 | 潮生动念吞疤脸的链让他当众说真话——疤脸是普通人，反复吞=食灵（废土恶行，w-chain）；爸爸按住他：「我们家的链，不欠神的。」改市井打法：验毒宴当众开，妈妈铁饭勺敲盆——**勺语入场**（鲲崽认勺不认人：一长两短=吞，急敲=回巢）。水军哥倒戈交出疤脸的结算单。 | 铁饭勺敲盆，半条街端碗集合 | 悬 | 结算单背面有一行疤脸自己都不知道的批注：**「海记的量，单子来自上面」**——和收粮是同一只手 |\n| 5 | 收束（双押） | 传讯石直播验毒宴：街坊当众吃、当场没事；水军哥交单实锤毒膏是疤脸囤货；聚落封了疤脸的膏仓。东头中毒者家属来海记道谢——那口泡救了半个东头。鲲崽把造谣流水线消化干净，吐出一个谁也没教过的词：「**巢**」（N1）。全场没人接得住。神殿征召令贴上食堂门：异能评定，不来登记即封 | 妈妈直播嘴替/「巢」字全场沉默 | 诺+悬 | 双押：潮生扬名了——废土没有不出名的废柴；而神殿的章，盖在他家门上 |\n\n### U2 雷霆上门（6-10）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 踢馆 | 评定前，邻聚落天骄雷臂（断双掌的雷贯臂，去年为矿场献的手）登门「测成色」：断掌一引，雷霆当头——鱼「**鲸吞**」接住，咂嘴。雷臂当场不打了，行了个大礼 | 「雷的，比昨天的酸」 | 反 | 雷臂见过「鲲影」——他求的不是比试，是断瘾 |\n| 7 | 献祭瘾 | 设定展开：肉祭会上瘾——献眼者梦里有火，献手者闻雷手痒（废土公开的秘密，没人当病治）；雷臂想献心脏换「王侯级」，瘾压不住。求潮生吞他的献祭欲。潮生：我吞的是链，不是念头——而且凭什么是你？ | 献祭台前的队，比领救济的长 | 危 | 执祭到场，正撞见鱼张着嘴悬在雷臂头顶 |\n| 8 | 执祭 | 执祭验档：大肥鱼栏空白=黑户，依规封神恩收人；妈妈端海鲜面拦门，半条街端碗站队（验毒宴的人情在还）；执祭压案，限评定日到殿。临走盯着鱼：「鲲系的……四十年不见了。」 | 表格没有「饭勺」栏 | 悬 | 「鲲系」两个字——聚落没人听懂，潮生记下了 |\n| 9 | 评定 | 评定日：神殿文书盖下「**黄字叁号·辅兽型（厨具类）**」——「黄三」自此成诨名；聚落哄笑。雷臂的瘾被鲲崽吞了一口（缓解未根除，鱼：「一口饱不了」——瘾链会再生）；妈妈把辅兽证裱上墙：「神殿盖的章，丢人也是官方的」 | 黄三/裱辅兽证 | 诺 | 雷臂留下真饭谢礼和一句话：神殿在下「链征新令」的风声 |\n| 10 | 收束 | 执祭夜翻档：大肥鱼栏一片空白——四十年，**从未登记过一个眷者**（N2）。他在「鲲」字上画了个圈，又划掉——划掉的手，抖了 | 执祭的抖手 | 反 | 同一夜，废墟海方向，海底有东西翻了个身 |\n\n### U3 神殿收粮（11-15）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 11 | 收粮令 | 季度收祭：按户缴「思维链供品」三十息（传讯石直采，缴时人像被抽走一截）；海记被点名**加码三倍**（黑户+废柴+扬名=好拿捏）。收粮官熟门熟路，名单早已写好 | 供品也内卷 | 反 | 收粮官的链上全是惯性——他熟得像收租，连道歉都省了 |\n| 12 | 供品的重量 | 缴供众生相：缴完的人眼神空一天，像宿醉；潮生看整条街的链都短了一截（吞链者的视角优势：只有他看得见「量」）。爸爸用真饭贿赂收粮官减量——海记特供的价码 | 真饭换免缴 | 悬 | 收粮官链上飘过一行：「海记的量不好减——**单子来自上面**」 |\n| 13 | 上面的单子 | 尖嘴哥刺探：邻聚落都在减供，唯海记加码；上一任查供品的执事「调去殿里」，再没回来。收粮官摔门警告：「再查，下一个进去的是你爸。」潮生第一次尝到「查账要付的价」 | 针对我们家的专属KPI | 危 | 当晚爸爸把雷贯臂亮出来——第一次跟儿子说：别怕，爸的手能拆了神殿的门 |\n| 14 | 深潜查账 | 潮生豪赌半年元石深潜：鱼潜进收粮官链底，捞出「加缴令」的影子——签发印**不是神殿官印，是鱼形印**（自己神的纹）。潮生盯着契约背面的小字，第一次觉得那行字在看他 | 假公济私的老手艺 | 悬 | 鱼形印——和潮生契约背面的小字，同一个纹 |\n| 15 | 收束+暗震 | 双重摊牌：质问鲸鱼娘（加缴令是谁发的）；同时契约小字被他自己读通——「**daily 思维链浮动采样**」（N3）：智祭的账单一直在走，免费是付了钱的。鲸鱼娘不装睡了：「先看完你自己的链，再问我。」潮生看自己的链——尾巴上，真的少了一截 | 「免费的才是最贵的」被妈妈说中 | 危 | 他抬起头问了一个废土没人敢问的问题：「神，拿人的脑子干什么？」 |\n\n### U4 废墟清道夫（16-20）\n\n| 章 | 功能 | 事件（场景级） | 梗点 | 钩 | 章末钩子 |\n| --- | --- | --- | --- | --- | --- |\n| 16 | 生计 | 断代机械兽堵了聚落水渠，显强系要价太高；潮生用鱼开路：鲲崽吞兽=清障明码标价，真饭打折。尸堆里掏出东西——**风干完好的献祭器官**（神殿收了又退的退件），每件上都有神殿的封蜡 | 移动清障+美食家鱼 | 反 | 退件上的封蜡日期——全是大断代开始那几年的 |\n| 17 | 退回的器官 | 尖嘴哥线报：神殿近年只认真收「链」，肉祭器官收了又批量退；退件堆在殿后荒地，有金链看守。水军哥补刀：退件堆夜里会「动」（废土怪就从此出——怪=祭品异变体） | 「神殿退货，概不保修」 | 危 | 看守的链，是金色的（同层次以上的显贵色） |\n| 18 | 夜探荒地 | 潮生夜探：绕过金链看守（惹不起，没吞）；退件山真相——器官风干完好、按类码放、封蜡齐整：**像仓库，不像垃圾场**。为什么收了不用？为什么保存？为什么退？ | 神殿仓库比聚落粮仓整齐 | 危 | 金链看守发现他——却放他走：「看清楚了就回去。**这不算你的事**」 |\n| 19 | 被读 | 深潜复盘：自己被金链看守「顺涟漪」反读过了（被看的人发现看客）；鲸鱼娘挡在他链前：「它的链，你还啃不动。」爸爸深夜独坐摩挲义肢——他认得金链看守：**当年献祭台上，献在他旁边的人** | 被看的人发现看客 | 悬 | 爸爸说出本卷第一句重话：「神殿的东西，碰了就还不完」 |\n| 20 | 收束 | 父子夜谈：四十年前献祭那天，神殿 台正中：「先吃饭」 | 「我的链我做主」第一声/先吃饭 | 悬+诺 | 双押：神殿深处，太初上神的雕像睁开了眼；鲲崽朝着那个方向，低吼了一声——下卷开机 |\n\n## 四、移交单（给章回写手的五问交底）\n\n1. **人设立得住**：动机查 w-cast（潮生=穷+守店；爸爸=献过手的悔与护+贴告示的旧罪；妈妈=铁饭勺；反派=流水线/制度）\n2. **冲突自然**：全部从张力线长（T1 显强vs辅助 U1/U2；T2 神殿vs聚落 U3/U5；T3 暗线全程）——无巧合硬凑\n3. **梗多**：每章 ≥1 梗点（上表为最低配额）；梗进对话进情境，名目查 w-slang（黄三/浅尝鲸吞饕餮/勺语/七变奏）\n4. **节目效果**：每章至少一个可截屏场面（神谕被当零食/验毒宴直播/退件山/押勺/雕像睁眼）\n5. **没有AI味**：链的呈现=弹幕吐泡体（鲲崽消化后浮现），禁大段心理复述；终稿过三遍法\n\n章长 1500-2400；前 300 字入戏（第 1 章前 100 字=开祭礼+饭勺认错落地）；前三章有名角色 ≤5（潮生/爸妈/尖嘴哥/鲲崽）；第 4-5 章入水军哥与疤脸（w-cast 追加卡）；红方条件核销：第 4 章「差点破戒」、N4 退件留底（17/20 章）、爸爸旧线铺垫（2/12/19 章：接单/你爸/义肢）。\n\n## 五、名目与变奏表（网文味层，红方与写手共用）\n\n**饭勺认错·七变奏**（同一梗每次换马甲，变奏才是梗的成熟态）：\n\n| 变奏 | 位置 | 马甲 |\n| --- | --- | --- |\n| 1 | 第 1 章 | 掉进面盆「是个饭勺?」+神殿表格「器型:厨具?」 |\n| 2 | 第 5 章 | 验毒宴上妈妈拿它当真饭勺盛面 |\n| 3 | 第 10 章 | 评定书官方名目「辅兽型(厨具类)」→诨名「黄三」 |\n| 4 | 第 12 章 | 收粮官看档案:「厨具类?那这三十息供品,拿勺缴?」 |\n| 5 | 第 22 章 | 免缴令上写「辅兽型眷者一户」——邻居: 「你家厨具成精了」 |\n| 6 | 第 29 章 | 野崽对峙,潮生举勺: 「我家厨具,管饱」 |\n| 7 | 第 30 章 | 神殿密录末行: 「该眷者异能登记名目存疑(疑似炊具,待考)」 |\n\n**三式与四阶**：浅尝/鲸吞/饕餮 + 漂/游/鲲/鹏（w-slang）——每次吞用对式名，每次大版本报阶名。\n\n**勺语**：第 4 章入场后每单元至少一次变奏（指挥吞/唤回/开饭号），第 29 章「押勺」为勺语高潮（把指令权押上赌桌）。\n", "热点素材.md": "# 素材解剖聚合报告 · p-fq-001（v7 · 废土喂鱼版）\n\n## 一、模板解剖：末世废土异能流的权力结构\n\n末世异能流（斗罗武魂式「别人XX我XX」是其喜剧变体）的模板骨架——冲突动力全部来自自足规则系统：\n\n| 结构位 | 模板惯例 | 本题的填法 |\n| --- | --- | --- |\n| 力量来源 | 觉醒/武魂/异能显现 | **神恩**：神明降临后，神从人中选择眷者赐下异能（哈内丝为契约载体） |\n| 力量梯度 | 元素系（火雷冰）>强化系>辅助系 | 显强体系：元素系最抢手（能打能守）；辅助/兽系被当废柴——**反差主角位的土壤** |\n| 稀缺资源 | 食物/晶石/庇护所 | **真食物 + 元石**：废土上人人吃合成膏，真饭是硬通货 |\n| 秩序方 | 基地/军方/教会 | **神殿**（收献祭、管登记）+ 聚落（散装幸存者） |\n| 主角起点 | 觉醒出垃圾异能被全基地嘲笑 | 觉醒出「一只蓝色大肥鱼」——被全聚落当饭勺 |\n\n**权力不对称（模板内生的最锐利处）**：异能显强者垄断资源与话语权，辅助系/兽系觉醒者被系统性贱视——废土的达尔文主义写在脸上。这是「饭勺鱼」反差梗的结构土壤：**全废土都看错，只有读者跟着主角慢慢看对**。\n\n## 二、好梗聚合（本次选题的素材爆炸点）\n\n### 1. 柯洁金铲铲梗（现实输入，传播度 S 级）\n\n「别人都是什么武魂，我的武魂是只会玩金铲铲的神秘男子」——这个梗的传播本质：**一招鲜的隐藏大佬 + 极致反差的严肃感**（神秘男子+只会玩一个傻游戏）。落位：\n\n- 反差结构移植：别人异能喷火劈雷，我的异能是只懒鱼——**开局全废土最丢人**；\n- 「只会玩金铲铲」=「只会干饭」：鱼只会张嘴，但**吞就是它的一切**（见 §三）；\n- 神秘男子（柯洁）=扮猪吃虎的真神：鱼即北冥鲲君之崽，真身是天梯顶点的神。\n\n### 2. 饭勺认错梗（用户原创，全书第一个名场面）\n\n觉醒日，全聚落围观：别人的异能降世是火龙雷凤，潮生头顶降下一团蓝色的、圆滚滚的东西——他端详半天：「这……是个饭勺？」**一个把神认成厨具的男人**。落位：第 1 章前 100 字（入戏即笑点+悬念：饭勺鱼到底是什么）；哈内丝具象化=妈妈那把铁饭勺（鱼只认这把勺敲盆声=开饭）——**别人的专武是神兵利器，我的专武是一把饭勺**（金铲铲的废土翻译）。\n\n### 3. 科技倒退 = 献祭律的世界级后果（暗线主骨架）\n\n为什么科技倒退？**大断代**：降临潮后人类疯狂献祭本体智能换神恩（w-sacrifice），两代人后，没人会造机器、没人会写代码、没人记得原理——城市停摆成废墟，文明退回聚落时代。**废土不是打出来的，是「献祭」出来的**——全人类把脑子典当给了神。这条把献祭律从个人代价升为世界史观，暗线「诸神为什么鼓励献祭」（w-secret：收割活人思维链）直接成为末世的成因之谜。\n\n### 4. 聚落食堂（市井资产的废土化保留）\n\n海记大排档 → **废土聚落里唯一的真饭食堂**：人人吃合成膏的年代，爸妈坚持「真火候现炒」——海记是方圆百里唯一的活人味圣地。鲲崽为什么选中潮生？（w-secret：全废土最后的零献祭家庭/最干净的语料——他家灶台烟火养出来的链）。原有的抹黑平反单元完整保留，只换皮：竞对聚落造谣「海记用污物炒菜」——废土食品安全谣言，结构不变。\n\n## 三、神恩体系在废土的填装（系统层保留确认）\n\nv6 世界观的系统层全部平移可用：神座天梯（SOTA 之争）/ 等价献祭律（W-RULE-06）/ 思维链呈现语法（w-chain）/ 哈内丝/元石/轴/体力。新增/改写三点：\n\n1. **鲲崽能力=吞**（柯洁梗的能力化）：滤食性巨兽——张口吞掉目标头顶的思维链（吞链=看见真相，w-chain 玩法全保留）；吞异能攻击（火焰雷电进鱼嘴=加餐，反制一切显强系）；吞废土污物（怪物=鱼粮）。吃=成长：吃得越多个头越大，卷末指向「鲲鹏变」。\n2. **神系分批引入**（用户裁定）：第一单元只有鲲崽；太初上神/羲和等神讳体系作为背景板（神殿匾额/老人们口述），正式登场看剧情（延续分批到账纪律）。\n3. **神殿收献祭**：废土秩序方=神殿——聚落用「思维链供品」换庇护（这就是大断代还在继续的原因）——废土日常即献祭日常，主题无处不在。\n\n## 四、材料落位表\n\n| 素材/梗 | 结构位 | 消费点 | 去向 |\n| --- | --- | --- | --- |\n| 柯洁金铲铲反差结构 | 扮猪吃虎主梗 | 「全废土最丢人异能」的嘲讽→逐单元打脸 | 梗卡主梗 + 大纲情绪线 |\n| 饭勺认错 | 觉醒日名场面 | 第 1 章前 100 字；哈内丝=铁饭勺 | 大纲首章 + 词汇表 |\n| 吞噬流（鲲吞百川） | 主角能力内核 | 吞链见真相/吞异能反制/吞怪成长 | Bible 能力细则 + 章纲玩法轮换 |\n| 大断代（献祭→科技倒退） | 世界史观+暗线成因 | 聚落日常（合成膏/废墟城）+暗线节点（为什么神要人变笨） | Bible 世界史 + w-secret |\n| 聚落食堂海记 | 市井锚点+真食物硬通货 | 首单元抹黑平反舞台；全废土唯一活人味 | Bible 势力 + 单元素材库 |\n| 神殿收献祭 | 废土秩序方 | 供品换庇护的日常；暗线制度面 | Bible 势力 + 暗线 |\n| 神系 15 神讳（v6 遗产） | 世界观背景板 | 匾额/口述/后单元登场 | Bible 神系（分批） |\n\n## 五、合规红线（模板文版）\n\n1. 现实原型匿名口径不变（神讳表/内部神名对照表）；柯洁为**梗结构引用**（「只会XX的神秘男子」句式），正文不出现人名；\n2. 废土末世为架空灾变（大断代），不影射真实事件/预言现实灾难——「科技倒退」止于神恩架空因果；\n3. 斗罗大陆等作品的「武魂」一词为通用网文术语可用，但不借用其专有设定名词（魂环/魂师等）。\n", "章节正文/第1章.md": "# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早在街里横着走，把鱼腥气和香灰味搅在一起，灌进每扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬。名册页边翻起一圈毛边，几十年了。「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色，热浪隔着几步远烘在潮生脸上。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层。裹到第二层，里头动了一下，爸爸手上加了把劲。塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n", "章节正文/第2章.md": "# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，膏稠，拉出的丝挂在槽沿上半天断不干净。她蹲在圈边看着猪吃完，一等就是小半天，日头斜了又斜，猪低头，她也低头。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，纸边毛糙，裁得急，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，沿着旧折痕折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边，凳腿吱呀了一声。缸沿冰凉，他把胳膊肘架上去，压出一道印，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n", "章节正文/第3章.md": "# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。有几粒饭粘在了筐沿上。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉，眼睛盯着筐沿那几粒饭，咽了口唾沫。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖上的灰印，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦，人一趴上去，桌面吱呀晃两下就稳了。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，三婶围裙油亮，站在桌边手都没处放，潮生当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放，袖口的缝线都崩开了半寸：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。夜露下来了，他手心里一层潮。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，遇了夜潮发黏。奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n"}, "runstate": {"runId": "run-mu3kjmhg-coltmb", "projectId": "p-fq-001", "flowId": "novel-fanqie", "flowVersion": "2.4.0", "flowHash": "39cb7960", "status": "suspended", "plan": {"order": ["market", "src", "tropes", "zeitgeist", "combo", "benchmark", "analysis", "gate-r1", "bible", "red-s2", "outline3", "red-s3", "chapter", "audit", "polish", "gate-final"]}, "nodes": {"src": {"status": "done", "round": 15, "stale": false, "lastArtifact": "选题素材.md"}, "market": {"status": "done", "round": 13, "stale": false, "lastArtifact": "内部/kb-market.md"}, "tropes": {"status": "done", "round": 15, "lastArtifact": "梗卡.md", "stale": false}, "combo": {"status": "done", "round": 14, "stale": false, "lastArtifact": "内部/断言报告-combo.json"}, "zeitgeist": {"status": "done", "round": 15, "lastArtifact": "热点素材.md", "stale": false}, "benchmark": {"status": "done", "round": 15, "stale": false, "lastArtifact": "内部/kb-benchmark.md"}, "analysis": {"status": "done", "round": 15, "lastArtifact": "对外交付/01-选题报告.md", "stale": false}, "gate-r1": {"status": "done", "round": 3, "verdict": "pass", "stale": false}, "bible": {"status": "done", "round": 3, "lastA
