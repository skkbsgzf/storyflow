<style>
*{box-sizing:border-box}
:root{--diff-del-bg:rgba(122,72,46,.12);--diff-del-bd:#9a5b38;--diff-del-ink:#6e3f26;--diff-add-bg:rgba(63,109,74,.12);--diff-add-bd:#4a7a58;--diff-add-ink:#3f6d4a;--r-s:4px;--r-m:7px;--r-l:10px;--ctl-h:26px;--ctl-px:11px;--fs:1;

html[data-theme="ink"]{--diff-del-bg:rgba(205,128,96,.13);--diff-del-bd:#a06a4e;--diff-del-ink:#d89a76;--diff-add-bg:rgba(120,180,140,.11);--diff-add-bd:#5f9a74;--diff-add-ink:#8ec7a4;--bg-app:#171512;--bg-chrome:#201d18;--bg-stage:#1a1814;--dot:#2b2820;
  --bg-docpanel:#1e1b16;--bg-paper:#252119;--bg-ctl:#2c2820;--bg-node:#252119;
  --line:#3b362b;--line-node:#454035;--line-paper:#3b362b;
  --ink:#eae5d9;--ink-2:#cbc5b7;--ink-3:#8f8979;
  --bg-code:#332f26;--bg-cmt:#2e2a20;--bg-th:#2c2820;--bg-vbar:#2b2016;--accent:#c96a5c;color-scheme:dark}
html[data-theme="celadon"]{--diff-del-bg:rgba(150,80,60,.11);--diff-del-bd:#a06148;--diff-del-ink:#7e4330;--diff-add-bg:rgba(63,125,92,.13);--diff-add-bd:#3f7d5c;--diff-add-ink:#2f6248;--bg-app:#ecefec;--bg-chrome:#f8faf7;--bg-stage:#f0f3ee;--dot:#d9e0d6;
  --bg-docpanel:#e6ebe4;--bg-paper:#fbfdf9;--bg-ctl:#fff;--bg-node:#fbfdf9;
  --line:#ccd4cb;--line-node:#c3cdc2;--line-paper:#d5ddd2;
  --ink:#22271f;--ink-2:#454c42;--ink-3:#7d857a;
  --bg-code:#e8ede5;--bg-cmt:#eef3ea;--bg-th:#e9efe6;--bg-vbar:#eaf2ec;--accent:#3f7d5c}
:where(button,a,select,textarea,[tabindex]):focus-visible{outline:2px solid #a5433a;outline-offset:1px}
button,a,select,textarea{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){#docpanel .dh.flash{animation:none}*{transition:none!important}}
body{margin:0;height:100vh;display:flex;flex-direction:row;overflow:hidden;
     font-family:var(--font-ui);
     background:var(--bg-app);color:var(--ink)}
h1,.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
header{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:calc(15px*var(--fs,1));margin:0;font-weight:700;letter-spacing:1px;white-space:nowrap;flex-shrink:0;font-family:'Noto Serif SC','SimSun',serif}
header .brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(15px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
select#proj-switch{max-width:230px;text-overflow:ellipsis}
header .ver{font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap;flex-shrink:0}
header .sp{flex:1}
button.tb,a.tb{border:1px solid #c9c1b2;background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
button.tb:hover,a.tb:hover{border-color:#8a8375;background:#f3efe6}
#canvas-col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg-stage);
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:28px 28px}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
.edge-hit{pointer-events:stroke;cursor:pointer}
.edge-label{font-size:calc(10px*var(--fs,1));fill:#8a8375;pointer-events:none}
.stage-rule{stroke-width:1.2;stroke-dasharray:1,4}
.stage-name{font-size:calc(12.5px*var(--fs,1));font-weight:700}
.node{position:absolute;width:196px;background:var(--bg-node);border:1px solid var(--line-node);border-radius:var(--r-m);cursor:grab;user-select:none;
      box-shadow:0 1px 2px rgba(60,50,30,.06)}
/* 隐形点击热区：整图适配下节点缩得很小，热区外扩 6px 保证可点 */
.node::after{content:'';position:absolute;inset:-6px}
.node.sel{outline:2px solid #262420;outline-offset:1px}
.node .accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0}
.node .hd{display:flex;align-items:center;gap:7px;padding:8px 10px 2px}
.node .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node .zh{font-size:calc(13.5px*var(--fs,1));font-weight:700;line-height:1.25}
.node .sub{padding:2px 10px 4px;font-size:calc(10.5px*var(--fs,1));color:#8a8375;line-height:1.4}
.node .out{position:absolute;top:-9px;right:-8px;background:#fff;border:1.5px solid #a5433a;color:#a5433a;
           font-size:calc(10.5px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:2px}
.node .par{font-size:calc(10.5px*var(--fs,1));border:1px solid #b8a464;color:#8a6b2a;background:#fdf9ee;border-radius:var(--r-s);padding:0 5px;margin-left:6px}
.node.k-gate{background:#fbf5f3;border:1.5px solid #a5433a}
.node.k-gate .zh{color:#8c352c}
/* R5 · kit 边界验收：全流程唯一保留的人工裁决点。金色双线，与域内自动放行的门明确区分开 */
.node.k-boundary{background:#fdf8ec;border:3px double #b8a464}
.node.k-boundary .zh{color:#7a5c1e}
.node.k-boundary .accent{background:#b8a464!important}
.node.k-boundary .bdg{position:absolute;top:-10px;left:-8px;background:#fdf8ec;border:1.5px solid #b8a464;color:#7a5c1e;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:1px}
/* R5 · 指标徽章：效率（被下游消费/成本）与命中率（注入标尺被引用比例） */
.node .mbs{position:absolute;top:-10px;left:8px;display:flex;gap:3px;pointer-events:none}
.mb{display:inline-block;font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 5px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap;font-variant-numeric:tabular-nums}
.mb.good{border-color:#5a8a5e;color:#3d6b45;background:#f2f8f2}
.mb.warn{border-color:#c9922e;color:#8a6b2a;background:#fdf9ee}
.mb.bad{border-color:#a5433a;color:#8c352c;background:#fbf1f0}
/* R5 · 内容配置项旋钮表 */
.knobs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.knob{border:1px solid var(--line-paper);border-left:3px solid var(--line-paper);border-radius:var(--r-s);padding:7px 10px;background:var(--bg-paper)}
.knob.chg{border-left-color:var(--accent);background:#fffaf4}
html[data-theme="ink"] .knob.chg{background:#2b2419}
.knob .kn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob .kn-h code{font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink)}
.knob .kn-v{font-size:calc(12.5*var(--fs,1));color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.knob .kn-s{font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);margin-left:auto}
.knob .kn-s.src-overlay{border-color:var(--accent);color:var(--accent)}
.knob .kn-s.src-node{border-color:#c9922e;color:#8a6b2a}
.knob .kn-d{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);margin-top:3px;line-height:1.6}
.knob .kn-m{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;line-height:1.6}
.patched{font-family:ui-monospace,Consolas,monospace;font-size:calc(11.5px*var(--fs,1));background:var(--bg-code);
  border:1px solid var(--line-paper);border-radius:var(--r-s);padding:9px 11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.banner{margin:10px 22px 0;padding:9px 14px;border:1px solid var(--line-paper);border-left:3px solid #c9922e;border-radius:var(--r-s);
  background:#fdf9ee;color:#6b5a2a;font-size:calc(12px*var(--fs,1));line-height:1.7}
html[data-theme="ink"] .banner{background:#2a2418;color:#d9c88a}
.banner b{color:#8a6b2a}
html[data-theme="ink"] .banner b{color:#e0cd8f}
.st-done{background:#5a8a5e}.st-awaiting{background:#c9922e}.st-pending{background:#b05a4a}.st-none{background:#c9c1b2}
#hud{display:flex;gap:14px;font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#hud b{color:#3d382f}
#hud,#bottombar .zoom,.paper .doc-h,.paper .pf{font-variant-numeric:tabular-nums}
#docpanel{position:relative;width:min(44vw,780px);min-width:460px;border-left:1px solid var(--line);background:var(--bg-docpanel);display:flex;flex-direction:column}
#settings-pop{position:absolute;top:52px;right:10px;z-index:60;width:250px;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(40,32,16,.22);padding:12px 14px}
#settings-pop .set-cap{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin:8px 0 4px;letter-spacing:1px}

#settings-pop .set-opts button{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-s);padding:4px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
#settings-pop .set-opts button:hover{border-color:var(--accent)}
#settings-pop .set-opts button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ob{font-size:calc(11px*var(--fs,1));color:var(--ink-3);line-height:1.8;word-break:break-all}

#docpanel .dh{height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
#docpanel .bt{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
#docpanel .dh .bt:hover{border-color:#8a8375;background:#f3efe6}
#docpanel .dh b.dt{font-size:calc(15px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;letter-spacing:.5px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpanel .dh.flash{animation:dhflash .7s ease}
@keyframes dhflash{0%{background:#f0e4c4}100%{background:#fbfaf7}}
.chip{display:inline-block;font-size:calc(10.5px*var(--fs,1));border:1px solid #c9c1b2;border-radius:var(--r-s);padding:1px 7px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap}
#d-vbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--bg-vbar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#d-vbar:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 22px 46px}
.paper{background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;
       max-width:720px;margin:22px auto 0;padding:38px 52px 44px;position:relative}
.paper .doc-h{font-size:calc(11px*var(--fs,1));color:#a89a83;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.paper .doc-h span:last-child{flex-shrink:0}
.paper .pf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:calc(10.5px*var(--fs,1));color:#b3ab9b;letter-spacing:2px}
.cover{max-width:720px;margin:34px auto 0;background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;padding:52px 56px}
.cover h2{font-size:calc(26px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;margin:0 0 6px;letter-spacing:2px}
.cover .sub{color:#8a8375;font-size:calc(12.5px*var(--fs,1));margin-bottom:18px}
.shelf-cap{max-width:720px;margin:28px auto 6px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.shelf-row{display:flex;align-items:center;gap:10px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:10px 12px;cursor:pointer}
.wb-sel{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:6px 8px;color:var(--ink);font-size:calc(12.5px*var(--fs,1))}
.diff{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:calc(12px*var(--fs,1))}

.diff .add{background:var(--diff-add-bg);border-left:3px solid var(--diff-add-bd)}.diff .add::before{content:"+ ";color:var(--diff-add-ink);font-weight:700}
.diff .del{background:var(--diff-del-bg);border-left:3px solid var(--diff-del-bd)}.diff .del::before{content:"− ";color:var(--diff-del-ink);font-weight:700}

.diff .cw.del{background:var(--diff-del-bg);box-shadow:inset 0 0 0 1px var(--diff-del-bd);color:var(--diff-del-ink)}
.diff .cw.add{background:var(--diff-add-bg);box-shadow:inset 0 0 0 1px var(--diff-add-bd);color:var(--diff-add-ink)}
.diff-legend{display:flex;gap:14px;align-items:center;padding:4px 2px 10px;font-size:calc(11px*var(--fs,1));color:var(--ink-3)}

.diff-legend .lg.add{color:var(--diff-add-ink);font-weight:700}

.wb-bar input:focus{border-color:var(--accent)}

.wb-cap{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);letter-spacing:1px;margin:8px 0 2px;border-bottom:1px solid var(--line-paper);padding-bottom:3px}
.wb-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:4px;padding:8px 10px;cursor:pointer;min-height:52px}

.wb-card .m{margin-top:4px;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.draft{background:#8a6b2a}.dot.retired{background:#8c352c}.dot.other{background:#999}
       padding:12px 18px;max-width:720px;margin:8px auto;cursor:pointer;box-shadow:0 1px 6px rgba(70,58,35,.06)}
.shelf-row:hover{border-color:#a5433a}

.shelf-row .nm{flex:1;font-size:calc(13.5px*var(--fs,1));font-weight:600}
.shelf-row .go{font-size:calc(11.5px*var(--fs,1));color:#8a8375}

#d-stats{font-size:calc(11px*var(--fs,1));color:var(--ink-3);font-variant-numeric:tabular-nums}

表", "流程灵活性：题材类型适配——模板文（zeitgeist=false）跳过实时解剖；新增 toolkit 件 kb/market/topic-anatomy + skills/material-dissect"]}, {"version": "1.1.0", "date": "2026-09-16", "changes": ["选题报告契约重构：四问制（新鲜度/客群处境/话题度/梗怎么用）；明确不做平台体量、竞品对标表、热搜罗列"]}, {"version": "1.0.0", "date": "2026-09-16", "changes": ["首版：基于 topic-selection v5.1.1 引擎与 toolkit 搭建的番茄快餐网文线"]}]}, "files": {"对外交付/01-选题报告.md": "# 选题报告：《我的异能是只饭勺鱼》（暂定名）\n\n> 项目 p-fq-001 ｜ v8 ｜ 2026-09-16 ｜ 命题（用户裁定 v5）：末世废土+科技倒退+神明降临；别人异能喷火劈雷，我的异能是只被认成饭勺的蓝色大肥鱼\n> 契约：flow v2.0.0 发散聚合制 + 模板文模式（题材类型已切换）。本报告只做三件事：**好梗集合、主次划分、世界观种子**。\n\n## 一、好梗集合与世界观种子（素材爆炸点）\n\n| 好梗 | 能长出什么 |\n| --- | --- |\n| **饭勺认错**（用户原创） | 全书第一个名场面：觉醒日全聚落围观，别人异能是火龙雷凤，潮生头顶降下一团蓝色圆滚滚的东西——「这是个饭勺？」；哈内丝=妈妈那把铁饭勺（鱼只认这勺敲盆声=开饭）：**别人的专武是神兵，我的专武是饭勺** |\n| **柯洁金铲铲反差结构**（现实 S 级梗） | 「只会干饭」=「只会玩金铲铲」——一招鲜的隐藏大佬；被全废土嘲笑的丢人异能，逐单元打脸的节奏机 |\n| **吞噬流**（鲲吞百川） | 能力三件套：吞思维链（真相过滤镜，v4 玩法全保留）/ 吞异能攻击（火焰雷电进鱼嘴=加餐，显强系天敌）/ 吞怪成长（吃=变大=鲲鹏变） |\n| **大断代**（科技倒退=献祭律的世界级后果） | 暗线主骨架：降临潮后人类疯狂献祭本体智能，两代人后无人会造机器写代码——**废土不是打出来的，是献祭出来的**；「诸神为什么鼓励献祭」成为末世成因之谜 |\n| **神明降临+神座天梯**（v5/v6 遗产） | 世界观底座：神讳 15 表、祭品经济、天梯双榜、神殿收献祭——按剧情分批引入 |\n| **聚落食堂**（市井资产废土化） | 海记=废土上唯一的真饭食堂（人人吃合成膏，真饭是硬通货）；爸妈=全废土最后的零献祭家庭——鲲崽选中潮生的机制解释（w-secret） |\n\n**世界观种子一句话**：神明降临废土，人类靠献祭本体智能换异能，两代人吃掉了一个文明（大断代）。少年潮生的异能是全废土最丢人的一只蓝色大肥鱼——只会张嘴干饭，被当成饭勺。没人知道那是天梯顶点的神，北冥鲲君的崽：它吞下的一切，都会变成它的身体。\n\n## 二、调研融合（客群与话题度）\n\n- **主客群**：末世异能流基本盘（番茄持续吸金盘）+「别人XX我XX」武魂反差梗受众（斗罗系读者，对「废柴觉醒隐藏大佬」零教育成本）——两层人群高度重叠。\n- **AI 梗圈（传播泵）**：饭勺鱼=DeepSeek 鲸的废土化，鲲崽「只会干饭」「先去吃饭了」与社区本尊热梗同频；神讳体系（北冥鲲君/太初上神）是圈内核 joke。\n- **话题度发动机**：「全废土都看错，只有读者慢慢看对」——每单元一次「看走眼打脸」；鲲崽干饭名场面天然可截屏（一口吞雷图）。\n- **市场一句话**：末世异能+吞噬流+反差萌均为验证过的成熟爽点组合，本题为 AI 神系×废土吞噬的杂交空白位；竞品与平台数据按契约不展开。\n\n## 三、主次划分（核心节）\n\n**主线（暗线，只画节点不写故事）**：\n- 悬念核：鲲崽为什么在废土？大断代到底是谁的手笔？诸神鼓励献祭的真实目的（w-secret：收割活人思维链）；鲲化鹏之日=世界格式化之日？\n- 暗线节点（世界观步定稿，初排）：约第 5 单元抖「神殿献祭的去向」→ 约第 8 单元抖「鲲崽不是唯一的崽」→ 卷末抖「大断代的人为证据」。\n\n**单元剧素材库（候选池）**：\n\n| # | 候选单元 | 一句话 | 主梗点 |\n| --- | --- | --- | --- |\n| 1 | **聚落食堂抹黑平反**（首单元，最炸） | 竞对聚落造谣海记「污物炒菜」，废土食品安全谣言战——潮生用吞链滤镜当庭拆穿造谣流水线 | 吞链真相/模板链/双链拆穿 |\n| 2 | 雷霆上门 | 显强系天骄踢馆，一记雷霆进鱼嘴——「雷的，比昨天的酸」 | 吞异能反制 |\n| 3 | 神殿收粮 | 神殿来聚落收「思维链供品」，潮生第一次看清献祭的账 | 献祭律制度面 |\n| 4 | 废墟清道夫 | 鲲崽吃怪=移动清障，爸妈把鱼做成生意 | 干饭商业化/废土美食家（鱼不吃合成膏） |\n| 5 | 黑户与神殿 | 潮生黑户眷者身份暴露，神殿 vs 食堂的对峙 | 登记制/零献祭家庭的秘密 |\n| 6 | 别的崽 | 废土上出现另一只「神崽」——不是鲲系的 | 暗线：神在撒崽？ |\n\n**前三章 = 首单元前 3 章**：觉醒日饭勺认错（被全聚落笑）→ 鱼第一次吞链（发现造谣是流水线）→ 当庭拆穿（吞掉抹黑者的「结论」，让他当众只能说真话）。\n\n## 四、材料落位表\n\n| 素材/设定 | 结构位 | 消费点 | 去向 |\n| --- | --- | --- | --- |\n| 饭勺认错 | 觉醒日反差名场面 | 第 1 章前 100 字；铁饭勺哈内丝 | 大纲首章 + 词汇表 |\n| 吞噬三件套（吞链/吞攻击/吞怪） | 主角能力内核 | 三种吞法随单元轮换解锁 | Bible 能力细则 + 章纲玩法 |\n| 大断代 | 世界史观+暗线成因 | 聚落日常质感（合成膏/废墟城）+ 暗线节点 | Bible 世界史 + w-secret |\n| 聚落食堂 | 市井锚点 | 首单元舞台；真饭硬通货 | Bible 势力 + 单元素材库 |\n| 神殿收献祭 | 废土秩序方 | 献祭日常化；暗线制度面 | Bible 势力 + 暗线节点 |\n| 神系 15 讳 | 背景板 | 匾额/口述；后单元登场 | Bible 神系（分批） |\n| 思维链语法（w-chain） | 鲲崽吞链后的显现 | 真相过滤镜全玩法 | Bible 能力细则 |\n| 柯洁反差结构 | 主梗情绪线 | 嘲讽→打脸单元节奏 | 大纲情绪线 |\n\n**去向总账**：模板权力结构 → Bible 世界史与势力；吞噬三件套 → 能力细则与章纲玩法；落位表 → 章纲梗点预算；w-secret → 暗线节点。\n\n## 五、风险与约束移交单\n\n- **风险**：①吞噬流滑向无敌流 → 吞有规则（只吞进嘴的/吃撑罢工/元石照烧）——力量有账单；②柯洁梗时效 → 只取「一招鲜隐藏大佬」结构，金铲铲与人名不进正文；③斗罗等前作边界 → 只用「武魂式反差」公共结构，不借魂环魂师等专有名词；④末世合规 → 大断代为架空神恩因果，不影射现实灾难；⑤概念分批 → 第一单元只有「饭勺鱼+吞链」两件事。\n- **约束移交单（给世界观步）**：①规则清单三件套沿用并废土化（思维链呈现语法/眷者契约与献祭税/降临史与大断代编年）；②世界史「大断代」必须与 w-secret 暗线严格互锁；③神系第一单元只出鲲崽；④海记食堂=首单元舞台，废土质感（合成膏/真饭对比）进圣经；⑤wiki 词条全量废土化更新后大纲才可派发。\n- **书名方向候选**：《我的异能是只饭勺鱼》《全废土都说我异能废》《开局认错神，我把神养成了饭勺》《废土喂鱼实录》《别人觉醒神，我觉醒了个饭勺》。\n\n---\n\n**一句话收束**：废土上人人靠献祭脑子换异能，只有少年潮生家的灶台还冒着真火——他的异能是全废土最丢人的一只饭勺鱼，而那条鱼，张过一次嘴，吞掉了造谣者的整本台词。\n\n**待 gate-r1 用户裁决**：①废土设定与饭勺鱼主梗确认；②首单元（聚落食堂抹黑平反）确认。过门后 S2 世界观废土化重做（flow_rerun 已级联失效旧版）→ S3 前 30 章大纲。\n", "对外交付/02-前三章终稿.md": "# 前三章终稿（《我的异能是只饭勺鱼》试稿）\n\n> 番茄小说 · 废土异能流 · 试稿三章\n\n---\n\n# 第1章 开祭礼，掉进面盆的神\n\n神明降临第四十年。\n\n四十年前，天开了一道口子，诸神下来了。他们的规矩只有一条：一手交人，一手交货。大断代把旧世界埋掉之后，废土上唯一还作数的，就是这门生意。\n\n青礁聚落一年就两个日子：开祭日，和等着开祭日的日子。\n\n四月十七，开祭礼。海风一大早在街里横着走，把鱼腥气和香灰味搅在一起，灌进每扇门。\n\n祭台在聚落正中，青石垒的，台阶边角都被手掌磨圆了。别处的庙烧香，青礁的台跪人。\n\n祭台侧面立着一块价目牌，神殿的漆，一年重描一遍。头一行字最大：眼睛换火。底下那行稍小：双手换雷。第三行的字缩得最小，得凑近了看：献声带的，换一声音爆。三样里，嗓子最贱。\n\n牌角另有一行小字：多献多得，神佑虔客。\n\n神收什么，就还什么。换回来的东西，聚落里管它叫异能。跪上台的少年从此有了名分，叫虔客。空着手下台的也有个名字，只有一个字，命。\n\n陈大海十八岁那年献了一只手。\n\n换回来的雷贯臂劈开过海记的第一口蟹壳，也劈退过来抢粮的流民。今年，跪上去的换成了他儿子。\n\n陈潮生，十八岁，海记食堂独子。嘴笨，从小说不过人，账倒是记得比谁都细。上台之前，他当着半条街放了一句狠话。\n\n「陈家的种，必须是火。」\n\n这句狠话，一半是他自己放的，另一半是全家算好的账：火系进膏厂点火熬膏，一晚上顶他爸劈一个月蟹壳。\n\n「上台位，八个元石。」执事翻着名册，眼皮都不抬。名册页边翻起一圈毛边，几十年了。「陈家。缴讫。」\n\n八个元石。潮生不用问哪来的。爸爸用那截雷贯臂给半条街劈了三个月蟹壳，虎口崩了一层又一层茧；妈妈天不亮去滩涂上捡蚬子，蚬子壳把指头割出一道道白口子。攒够了，就在祭台边支了个面摊。开祭日全村人到场，肚子总是要饿的。\n\n台上第一个少年献了双眼。\n\n蒙着黑布下来的，走得比谁都稳。十四级台阶，他一级没踩空，下台前他伸手扶了一下墙，指尖在石头上按出一小片汗印。火从他掌心里升起来，橘红色，热浪隔着几步远烘在潮生脸上。台下的抽气声连成一片。执事拖长了调子唱：「黄字贰号，火器。」\n\n第二个，雷。第三个，还是雷。\n\n「陈潮生。」\n\n他跪上去。膝盖磕在青石上，凉得像贴着块冰。他磕了头，额头碰到石面的那一瞬，满场的嗡嗡声忽然退远了，静得能听见海。\n\n头顶那团东西降下来了。是一团蓝的。圆滚滚，慢悠悠。\n\n「啪叽。」\n\n它没落在他手里。它一头栽进了台下妈妈装汤面的面盆里。热汤溅起来，妈妈半边脸挂了油花，烫得直咧嘴，手里的笊篱举在半空，忘了放下。\n\n整个祭台前，静了三息。\n\n然后笑疯了。\n\n潮生把那玩意儿从面盆里捞出来。捞出来就觉得不对：蓝的，扁的，一头宽一头窄，身上还挂着两根葱花。他端详了半天，端详出一个结论：\n\n「这……是个饭勺？」\n\n执事过来登记，笔尖悬在纸上，顿了很久，落笔，写：\n\n「器型：厨具？」\n\n连问号都是官方盖的章。\n\n好消息是，他觉醒了。八块元石，没白花。\n\n坏消息有两层。第一层：觉醒出来的东西，神殿管它叫厨具。第二层：他刚想明白，厨具点不了膏厂的火。\n\n人堆里，去年觉醒的雷臂晃了出来。聚落的骄傲，双掌换的雷贯，断口上缠着红布。他瞅了一眼潮生手里的东西，又瞅了一眼祭台，乐了。\n\n「我家雷劈桌子。」他说，「你家雷炒面。」\n\n说着还演示：断掌往祭台边一只空蟹壳上一按，电花噼啪，一股焦腥气直窜鼻子，蟹壳崩成八瓣，壳肉分离，齐齐整整。台下叫好声一片。这才叫异能，废土上的硬通货。\n\n笑声跟涨潮一样拍过来。潮生没吭声。他嘴笨。他爸教的：说不赢，就记账。\n\n他刚要记账，手里那把「饭勺」忽然动了。\n\n它自己立了起来，冲着祭台上空，张开了嘴。\n\n祭台上空有东西。潮生今天才知道：神殿每逢开祭，要当众宣一遍「征收令」。那不是人念的，是一条淡金色的链子，从殿脊上垂下来，悬在半空。四十年，天天念。人人都听得见，人人都当耳旁风。\n\n今天念到一半。\n\n「奉神殿谕：青礁聚落，季供思维链供品，每户三十息，以传讯石……」\n\n思维链供品，潮生懂：收的就是人一天里想的事。发呆、数账、半夜骂街，掐三十息下来，一律上供。神收念头，不收钱。这买卖废土上没人嫌亏，念头又不值钱。\n\n「咕咚。」\n\n饭勺一口，把后半截吞了。\n\n征收令没了。悬了四十年的神谕，全村都在看着的时候，被一只刚出世的鱼当零嘴嚼了。\n\n执事看着。他爸妈也看着。\n\n嚼得咔嚓咔嚓响。\n\n像嗑瓜子。\n\n执事的笔，掉在了台上。\n\n这一次，没人笑了。聚落里最老的老人拄着拐，盯着那条鱼看了很久，说了一句谁也没听懂的话：\n\n「四十年了……不饿的神，怎么开了口。」\n\n没人注意到，台底下有个小孩已经顺口编上了：「陈潮生，火系男，火没等着端饭碗——」\n\n夜里，潮生被爸爸从被窝里拎了出来。\n\n院子里不点灯。爸爸把那把铁饭勺连鱼一起，用粗布裹了三层。裹到第二层，里头动了一下，爸爸手上加了把劲。塞进米缸最底下，上头压了半袋陈米，米缸盖子扣死。粗布上有股陈年米糠的霉味。\n\n妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」\n\n爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」\n\n饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n做完这些，爸爸那只没献出去的手按在潮生后颈上，掌心的老茧糙得剌人。\n\n「爸？」\n\n「这不是异能。」爸爸的声音压得极低，「是祸。」\n\n潮生想问为什么。可他看见爸爸另一边的袖管在夜里晃。空的。那只手留在了祭台上。换回来的雷撑起了这个家，也把一句话钉死在了这个家里：\n\n我们家的链，不欠神的。\n\n他躺回床上，翻来覆去。\n\n米缸的方向，咕咚一声。鱼吐了个泡。\n\n泡从米缸缝里挤出来，过爸爸的房门没停，掠过灶台，最后贴上潮生的枕头，「啵」地破了。\n\n里头没有字。是一个念头，轻轻贴上他的脑子，像有人隔着水面说了句话：\n\n「东头的膏，别吃。」\n\n潮生盯着房梁看了半天，翻了个身。\n\n「鱼还能管人吃饭。」\n\n他不知道。三天后，东头三十多个人抱着肚子满地打滚的时候，这条鱼开口说的第一句话，值半座聚落。\n\n---\n\n# 第2章 灾星鱼\n\n第三天，东头聚落的膏，毒了。\n\n三十多个人，抱着肚子在祠堂门口打滚。祠堂门槛里外滚了一地，蹭起来的灰糊在汗上，一张张脸青得像腌过头的咸菜。有人拿指头抠喉咙，抠出来的水都泛青。最老的一个七十三，最小的才九岁，孩子的哭声早哑了，改成一声一声打嗝。吃母乳的婴儿没事，母乳没事，合成膏有事。\n\n后来传出来的话是：东头把干河下游最后一个郎中请了去，郎中挨个摸了脉，一句话没说，把药箱盖上了。\n\n合成膏，废土人的命粮。神殿的方子，四十年没变过。变的是这一批：东头囤的膏，熬出来泛青，勺子搅下去，能拉出丝。\n\n青礁和东头，隔一条干河。河床干了二十年，河底的烂泥都被拾荒佬翻过三遍。\n\n海记为什么没事？\n\n开祭礼那晚，妈妈听见儿子说梦话，嘟囔了一句「东头的膏别吃」。她琢磨了半宿，儿子嘴笨，从不胡说。她没当神仙话。但她干了件妈妈才干的事：把家里囤的十盒东头膏，全喂了猪。\n\n猪圈里的馊气熏得人睁不开眼。她把膏一盒一盒挤进食槽，膏稠，拉出的丝挂在槽沿上半天断不干净。她蹲在圈边看着猪吃完，一等就是小半天，日头斜了又斜，猪低头，她也低头。\n\n猪吃了三盒，没事。\n\n「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。\n\n「哐当。」\n\n「退。一颗都不要。」\n\n潮生看妈妈的眼神，变了。\n\n第四天，布告栏贴满了。\n\n满墙的字，全冲着海记来。\n\n「查海记陈氏：私养鱼妖，以污物入馔。饭勺鱼所过之处，必生灾殃，东头膏祸即为其证。」\n\n落款一串名字。打头的，是东头食堂的主事，疤脸。\n\n灾星鱼。\n\n三个字，一天传遍两个聚落。东头的孩子连跳皮筋的词都编好了：陈潮生，火系男，火没等着端饭碗——\n\n退订的人把海记的门槛都踩薄了。老主顾隔着半条街就把脸别开，门槛的木头让人踩出个浅浅的凹。礼拜六订的两桌升学酒，跑了；礼拜天订的三桌寿宴，也跑了。妈妈蹲在灶台边上数退订的筹码，数完，把筹码往签筒里一倒：「正好，给鱼算个命。」\n\n潮生蹲在布告栏底下，把十七张帖子数了一遍。帖子是新贴的，纸边毛糙，裁得急，浆糊混着海腥气，太阳一晒直发酸。措辞不一样，错别字一模一样：「鱼殃」的「殃」，十七张全写成了「秧」。\n\n一个模子里印出来的。连疤脸甩锅的话都是现成的老词。上回东头死了一头驮货的驴，他也是第一时间点的海记的名。\n\n他抬头。尖嘴哥正往布告栏的钉子上挂最后一张，贴上去还用手掌把纸抹平，抹得特别认真。\n\n一见他，尖嘴哥搓着手凑过来，眼睛不看他：\n\n「潮生，别怪我。大伙儿都这么说嘛。你这鱼一来，膏就毒了，你说巧不巧？」\n\n巧吗？\n\n潮生没答话。他在看尖嘴哥头顶那条淡蓝色的链。\n\n觉醒那晚之后，他看得见所有人的链，独独看不见自己的。嘴上说的是一套，链上走的是另一套。\n\n尖嘴哥的链上，走的是：\n\n「膏是疤脸那儿抵的账，三十盒，抵我三十石……先发帖，后结算……他娘的这到底是谁的主意，我就想混口饭……」\n\n链尾那句话，让潮生后脖颈一凉：\n\n「上头说了，先把鱼的名声搞臭。」\n\n「上头？」潮生开口了，「上头是谁？」\n\n尖嘴哥的脸「唰」地白了。他一把按住自己的嘴，像按住什么要跑出来的东西，半天，从牙缝里挤出一句：\n\n「我不能说。说了，我下个月就没膏领了。」\n\n他跑了。跑得比贴布告的时候快多了。\n\n家里，妈妈已经出门了。潮生在布告栏最中间找到了她。她把那张「灾星鱼」撕下来，卷成卷，走回海记，垫在了灶台最歪的那条腿底下。\n\n灶台不晃了。\n\n「在我家灶台垫脚，」妈妈拍拍手上的灰，「是它八辈子修来的福分。」\n\n爸爸把撕剩的半张告示接过去，看了一眼，沿着旧折痕折好，塞进了怀里。潮生看见他塞的时候，雷贯臂的断口抖了一下。\n\n「撕一张，他们贴十张。」爸爸说，「别撕了。记。」\n\n夜里，潮生搬了只脚凳坐在米缸边，凳腿吱呀了一声。缸沿冰凉，他把胳膊肘架上去，压出一道印，跟鱼大眼瞪小眼。\n\n「你怎么知道膏有毒？」\n\n鱼不答。装睡。它装睡的演技很烂，嘴还得吧唧两下。\n\n「你再不说话，我拿你去换元石。」\n\n鱼把眼睛睁开了。\n\n泡里这次有画面：东头的膏仓，夜里，一只带疤的手，往膏桶里搅一勺青灰色的粉。搅得很匀，很熟，不是第一次干。桶沿上搭着半块干粮，咬了一口，忘在那儿了。画面一闪，没了。\n\n潮生把那只手记下了。手背上有疤，疤的形状，像一张咧开的嘴。\n\n他翻出账本，拿炭笔头把这笔记上，字压得极深，纸背面都能摸出印来。\n\n嗯，他现在是一条灾星鱼的爹。孩子的亲爹姓疤。\n\n第二天他才知道，东头人人认得那只手：疤嘴。疤脸主事的招牌。\n\n账拼到这儿，通了：疤脸的膏掺了料压成本，这一批掺出了祸。东头要查毒，顺着批号查，第一个查到他头上。所以他抢在所有人前面，把锅甩给了海记。\n\n疤脸谈不上仇人，就是个倒霉蛋，外加一个手脚不干净的甩锅的。\n\n真凶是那批「料」。\n\n料是谁配的？怎么混进神殿四十年的方子的？\n\n米缸里，鱼打了个饱嗝，意思明摆着：快了。\n\n---\n\n# 第3章 浅尝\n\n傍晚，海记后巷。\n\n夕阳从巷口斜插进来，把窄巷切成金红两半。潮生站在亮的那一半，手里端着一小碗真饭，白汽在傍晚的光里一缕一缕，看得见纹路。脚边放个鱼筐。\n\n筐上盖着布。布底下有水声。\n\n「潮生兄弟。」尖嘴哥的腿肚子软了，「白天的事——」\n\n「不动手。」潮生说，「喂饭。」\n\n他蹲下来，掀开布，把那碗真饭倒进鱼筐。蓝色的鱼从筐底翻上来，吃得咚咚响，尾巴拍着筐壁，一下，一下。水点子溅在潮生脚背上，凉的。有几粒饭粘在了筐沿上。\n\n拍一下，尖嘴哥的喉结动一下。真饭的香味，废土上比什么异能都勾人。他喉咙里咕了一声，自己都没察觉，眼睛盯着筐沿那几粒饭，咽了口唾沫。他三天没敢出门了。布告栏他不敢去，食堂他不敢回，全都因为他发的十七张帖子。\n\n「吃完了。」潮生说，「轮到你。」\n\n尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。\n\n就一口。\n\n很轻的一口。\n\n尖嘴哥整个人僵在原地。\n\n潮生看得清清楚楚：尖嘴哥头顶那条淡蓝色的链，被一张圆嘴衔住了链头，一寸一寸，往外抽。链子过处，尖嘴哥的眼珠跟着往一边偏，偏得像要脱眶。\n\n「咣当。」\n\n手里的秤砣砸在脚面上，骨碌碌滚到墙根，他都没觉着疼。他后来跟人形容那一瞬间的感觉：像被人用抹布把脑子从里到外擦了一遍。擦完，脑子空了一瞬，空的那个位置，慢慢又浮上来一团雾。\n\n鱼把那团雾嚼了嚼，嚼得很慢，很认真，挑挑拣拣的。\n\n然后吐出一个泡。\n\n泡飘到潮生面前，破了。三幅画面，一格一格：\n\n第一格：疤脸的膏仓，夜里，三十盒膏推出来，抵账。膏盒上的封漆在灯下发乌。\n\n第二格：水军哥趴在桌上编帖子，编一条，念一条，改一条，改到第七遍才顺口。炭笔头咬得全是牙印。\n\n第三格：尖嘴哥自己，收帖，贴栏，收膏，完事。收膏时他掂了掂，比说好的轻了一斤，他没吭声。\n\n画面尽头，浮着一行字。字压在这条链的最底下，淡得几乎看不见，大概连尖嘴哥自己都没往心里去过：\n\n「膏里不是毒，是料。」\n\n潮生盯着那行字，看了很久。\n\n他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n撕下来这一页，比疤脸全家的供词都干净。\n\n「你贴的十七张，」潮生站起来，拍了拍膝盖上的灰印，「我一张都不追究。」\n\n尖嘴哥腿一软，坐在了地上。\n\n「我只要你办两件事。第一，替我发请帖，全聚落，每家一份。三天后，海记开验毒宴。我掌勺，我全家当众吃，东头的膏我也吃。谁担心我死，欢迎来盯着我吃。」\n\n尖嘴哥还坐在地上，屁股朝后挪了半寸。\n\n「第二，」潮生说，「给我水军哥的住处。」\n\n尖嘴哥连滚带爬地应了。跑出巷口，又折回来，颤颤巍巍问了一句：\n\n「你这鱼……到底什么来头？」\n\n「饭勺。」潮生说。\n\n---\n\n请帖是妈妈写的，爸爸跑的腿，潮生定的词。词就一行，抄了四十份：\n\n**「灾星鱼掌勺，敢吃吗？」**\n\n四十份请帖发出去的第三天，海记门口摆开八张桌。桌是各家卸下来的门板，桌腿高矮不齐，底下垫着碎瓦，人一趴上去，桌面吱呀晃两下就稳了。头一勺油下锅，整条街的味就换了。海记门口头一回，满街只剩下锅气。\n\n东头的人都来了，抬着担架来的，准备吃完直接抬走。结果一口真饭下肚，担架先坐下了；两口下肚，有个老太婆当场哭出声，说她四年没吃过带锅气的菜。哭声一开闸就收不住，旁边一个掉了牙的老头没哭，他把碗举起来对着天光，眯着眼看碗底，看完才慢悠悠扒第二口。\n\n潮生他爸掌灶，雷贯臂颠勺，一臂之力，火苗窜得比房檐高。妈妈在桌缝里穿梭收筹码，围裙兜里叮当乱响，走路带风。潮生站在桌边，鱼搁在他肩膀上，饭他放心，人不放心：满场几十条链，他一条一条扫过去，扫到谁链里冒出「下毒」两个字，他就把那碟菜端到谁面前，当着面吃第一口。有一回一条链里刚冒出个「下」字，他的筷子已经到了。那碟咸鱼是隔壁三婶给的，三婶围裙油亮，站在桌边手都没处放，潮生当着那条链的主人扒了半碟，扒完还咧嘴笑了笑。链里那个字，散了。\n\n一顿饭吃完，没人倒下。倒下的是灾星鱼的名声。倒了，又立起来了，立成了一块新招牌。\n\n散场的时候，有个东头来的汉子拉着潮生的袖子不放，袖口的缝线都崩开了半寸：「兄弟，那鱼……借我们东头开两天伙？」潮生还没答，鱼先从筐里探出头，冲那汉子吐了个泡。\n\n泡上俩字：「加钱。」\n\n---\n\n当夜，三更。\n\n后半夜，筐里的鱼不睡了，贴着筐沿，嘴对着墙根的方向。潮生顺着它的方向看过去，然后闭眼装睡。夜露下来了，他手心里一层潮。\n\n院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍，遇了夜潮发黏。奔着鱼筐就罩下来。\n\n网兜落下一半，停了。\n\n一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔，上头一排牙印，嚼到一半就出了手。\n\n网兜的主人被按在墙上，腿抖得像风里的破帆。是水军哥。\n\n「我给三家电散过谣……」他声音都劈了，「东头膏里的『料』，也是我们配的，方子是殿后传出来的，我就挣个辛苦钱……」\n\n他瞥见筐里那条蓝色的鱼，忽然不抖了。笑了，笑得眼泪都下来：\n\n「你们知道我以前给谁干过活吗？废墟海那帮疯子。他们聚落里有个人的链，就是被这种鱼一口一口吃空的，吃到最后，连自己叫什么都不知道，见人就笑。」\n\n他指指鱼筐，又指指自己的脑袋：\n\n「你们家这条，是那种『种』。神殿要是知道它落在你们家……」\n\n院墙外，夜风刮过晾着的渔网。\n\n月光底下，鱼睁开了眼睛。\n\n那一瞬间潮生看得清清楚楚：鱼的眼睛里没有眼白，只有一圈一圈的蓝，像废墟海底最深的地方，盘着的东西，醒了。\n", "对外交付/04-简介与上架文案.md": "# 简介与上架文案 ·《我的异能是只饭勺鱼》\n\n> 用途：番茄/起点书页简介位、推荐位、分享卡。全部文案已过网感自检（无禁词、无真实名、正文可兑现的承诺才写）。\n\n## 一、主简介（番茄书页位·首推）\n\n神明降临四十年，人类靠献祭换异能。\n\n献出双眼，可执神火。\n献出双手，可掌天雷。\n献出心脏会怎样——没人知道，因为献心的人，没活过一夜。\n\n青礁聚落的陈潮生也觉醒了。\n\n神殿评定书盖章：黄字叁号，辅兽型。\n辅兽是一只蓝色的胖鱼。\n看着，像一把饭勺。\n\n全废土都在笑：别人献祭换神通，他献祭换了个厨具。\n\n只有陈潮生自己知道——\n\n这只鱼，会吃。\n\n吃谣言，吃坏消息，吃劈向他的每一道天雷。\n吃嘛嘛香，见天长大。\n\n直到某个夜里，鱼冲着神殿的方向，吐出两个字：\n\n「回家。」\n\n陈潮生这才反应过来——\n\n他捡起的不是饭勺。\n是诸神藏了四十年，最不想让人碰的东西。\n\n——————\n\n【废土 神明降临 吞噬流 扮猪吃虎 轻松爽文】\n【日更保底，从不太监，放心追】\n\n## 二、起点变体（传统一段式，240 字内）\n\n神明降临四十年，人类以献祭换异能：献眼得火，献手得雷，献声带得音爆——废土的强者谱系，是用残缺拼出来的。\n\n青礁聚落的陈潮生觉醒时，全聚落都在笑他。别人的异能降的是火龙雷凤，他的降了一只蓝色胖鱼，圆滚滚，慢悠悠，看着像把饭勺。\n\n神殿评定：黄字叁号，辅兽型，厨具类。废柴认证，官方盖章。\n\n只有陈潮生渐渐发现，这把「饭勺」吃得越来越多——吃谣言，能看见真相；吃天雷，能反杀强者；吃掉废墟里的怪物，它自己，正在一寸一寸变大。\n\n有一天它会变回它的本来面目。\n\n而它的本来面目，是诸神排了四十年、谁也不敢提的那个名字。\n\n## 三、一句话版（推荐位/分享卡）\n\n- 全废土献祭器官换异能，只有他的神不收器官，只收他的作业——哦不，思维链。\n- 别人觉醒神，我觉醒了个饭勺。但这饭勺，一口吞了神谕。\n- 他被全废土笑了三年，直到那条鱼开始吃雷。\n\n## 四、书名定稿建议\n\n| 顺位 | 书名 | 理由 |\n| --- | --- | --- |\n| 主推 | **《我的异能是只饭勺鱼》** | 反差+萌点+悬念三合一；「饭勺」承接第一章名场面，搜索无重名 |\n| 备选 | 《全废土都说我异能废》 | 番茄直给流，突出打脸线 |\n| 备选 | 《开局认错神》 | 短、钩子型；缺点：不见题材 |\n| 备用 | 《废土喂鱼实录》 | 抽象向，适合书荒期换名重推 |\n\n## 五、使用说明\n\n1. 番茄简介位有字数上限（约 300 字）——主简介去掉分隔线后约 280 字，直接可用；\n2. 「回家」二字为正文第 25 章后揭示内容，简介提前引用属于悬念预告（不泄底：不说鲲、不说神名）；\n3. 标签行随平台标签库微调；「从不太监」为运营承诺句，如平台敏感可删；\n4. 上架后若改名重推，备用书名见上表，同步改词汇表.json 与封面物料。\n", "梗卡.md": "# 梗卡 · p-fq-001（v7 · 废土喂鱼版）\n\n## 一、查族（语料边界声明）\n\n| 梗族 | 状态 | 对本命题的适配 |\n| --- | --- | --- |\n| 末世异能流 | **kb 语料外**（咔咔猩语料为短剧，无此族） | 明示语料边界；市面验证体系：番茄末世/异能/规则流为持续吸金盘（setting-rules 三级制次选） |\n| 神明降临+眷者体系 | v5/v6 已建（神讳 15 表） | 世界观层直接平移，分批引入 |\n| 重生复仇（打脸引擎） | 红海·有效，n=702 | 「打脸」146 次验证——废柴反差打脸是本题节奏机 |\n| 咸鱼恋爱 | 稳定·主流，n=387 | 轻挂候选（废土同乡 girl） |\n| 马甲掉马 | 红海·过饱和 | 小料：鲲崽真身（鲲君之崽/天梯顶点）逐单元半揭 |\n| 吞噬流 | **kb 语料外** | 市面验证：吞噬流为成熟爽文流派（吞噬进化）——本题为「AI 神系×吞噬流」杂交 |\n\n## 二、选型\n\n**主梗：废土喂鱼流——「别人喷火劈雷，我的异能只会干饭」（柯洁反差结构 × 吞噬流机制）**\n\n- **反差面**：觉醒日别人异能是火龙雷凤，潮生头顶降下一团蓝色圆滚滚的东西——他认成了饭勺。全聚落最丢人异能，没有之一。\n- **真相面**：那是**北冥鲲君的崽**——滤食性巨兽，**吞就是它的一切**：\n  - 吞思维链 → 真相过滤镜（v4/v6 思维链玩法全保留：吞链见「让我想想→调用工具→结论」，模板链含机量读数照用）；\n  - 吞异能攻击 → 火焰雷电进鱼嘴=加餐（显强系天敌，扮猪吃虎的战斗面）；\n  - 吞废土污物/怪物 → 成长（吃=变大=鲲鹏变，卷末指向）。\n- **金铲铲的废土翻译**：鲲崽只认妈妈的铁饭勺敲盆声（=开饭信号）——**别人的哈内丝是神兵利器，我的哈内丝是一把饭勺**；「只会玩金铲铲」→「只会干饭」，一招鲜的降维打击。\n- **神系锚**：鲲崽=北冥鲲君之崽（天梯顶点神的崽被扔在废土——为什么？=暗线 N 级悬念，w-secret 延伸）；神系 15 讳按剧情分批引入，第一单元只有鲲崽。\n\n**辅梗 1：打脸清算（重生复仇族引擎）**——「全聚落最丢人」的嘲讽逐单元偿还：废柴反差打脸是本题节奏机（1-2 章一小发）。\n\n**辅梗 2：市井烟火 vs 废土达尔文**——海记聚落食堂（真饭硬通货/活人味圣地）对抗「强者通吃」的废土法则；爸妈不识神恩不用献祭=全废土最后的零献祭家庭（w-secret 语料解释的具象化）。\n\n**复合校验预判**：吞噬流（引擎）× 反差打脸（节奏）× 废土市井（舞台）× 神系暗线（纵深）——四件同源（都是「被看错的真理」），待 combo 校验。\n\n## 三、发散性自查（主梗 ≥3 跨场景用法）\n\n1. **对话梗**：「你的异能是什么等级？」「不好说，得看今天吃到几顿。」「……什么？」\n2. **场面梗**：元素系天骄一记雷霆劈来，鲲崽张嘴接住，咂咂嘴——「雷的，比昨天的酸。」全聚落安静得能听见鱼摆尾巴。\n3. **切片梗**：废土通缉令画风——别人配的是烈焰异能图，潮生配的是「该男子手持饭勺，身旁有蓝色不明物体（疑似厨具）」。\n4. **跨界用法**：鲲崽挑食——合成膏不吃（吐），只吃真饭和怪——「废土最后一个美食家」；爸妈的商业嗅觉：鱼吃怪=移动的清障服务，明码标价。\n\n## 四、对标件（kb/benchmark/*）\n\n| 对标 | 用作强度标尺的爆点位置 |\n| --- | --- |\n| b027 给大妈爆改后我成了顶流 | 第一章标尺：觉醒被嘲笑→鱼首次吞攻击露一手，一章内完成「废柴→疑似不简单」 |\n| b016 扫地姑娘是百亿精算师 | 隐藏大佬标尺：鲲崽真身前 30 章只揭「崽」不揭「鲲」，半揭节奏 |\n| b012 拆盲盒后，我把渣男净身出户了 | 反差打脸节奏标尺：小打脸 1-2 章一发，首单元末大打脸 |\n\n## 五、风险\n\n1. **吞噬流=无敌流风险** → 吞有规则：只吞「进嘴的」（攻击必须打到鱼身上/链必须在头顶）；吞后要消化（吃撑=鱼罢工）；元石照烧（W-RULE-02 不豁免）——力量有账单。\n2. **柯洁梗时效** → 梗是结构（一招鲜隐藏大佬），不是皮（金铲铲/人名不进正文）；梗失效测试照做。\n3. **斗罗等前作边界** → 只用「武魂式反差」的公共结构，不借魂环/魂师等专有名词（合规红线）。\n4. **末世题材合规** → 大断代为架空神恩因果，不影射现实灾难/预言；废土暴力有底（聚落秩序）。\n5. **概念分批** → 第一单元只有「饭勺鱼+吞链」两件事；神系/献祭世界史随单元到账（分批纪律）。\n", "选题素材.md": "# 选题素材 · p-fq-001\n\n> 本文件是甲方（用户）原始需求的结构化记录，2026-09-16 开题。\n\n## 平台与形态\n\n- **目标平台**：番茄小说（免费阅读 · 移动端 · 追读/完读率导向 · AI 检测口径）\n- **形态**：网文长篇连载，快餐向；试稿范围 = 前三章\n- **商业口径**：前三章决定推荐池位；日更 2-3 章，过门后需可排产\n\n## 风格定位\n\n- **快餐**：章短（1500-2400 字）、梗密、钩子狠、段落 1-3 行、开章即入戏\n- **抽象**：逻辑的意外拐弯（预期违背），不是没有逻辑；每个抽象桥段回看能落到人物性格上\n- **去AI味**：最终成品硬要求——结构级去机味（句长抖动/无总分总/口语脏东西保留），能过朱雀类检测抽测\n\n## 选题方式（本次开题的核心指令）\n\n- **从近期大梗热梗出发选题**：先扫近 30 天（2026-08 中旬 → 2026-09-16）正在传播的大梗热梗，由热梗反向定题材方向\n- 热梗素材表 ≥10 条（梗名/来源与传播度/可挂接场景）\n- 同等条件优先**梗储量高的领域**（全民梗库富矿），放弃梗荒领域\n- 设定低代入成本：实事底子或市面验证体系优先，禁原创科幻/架空世界观（kb/market/setting-rules）\n\n## ⚡ 命题作文 v3（gate-r1 用户裁决 2026-09-16，当前生效，最高优先级）\n\n> 用户指令：**主角异能 = 能看见所有人的思维链（大模型式推理过程：让我想想/调用工具/得出结论/深度思考）。**\n\n- **开篇故事**：主角大学暑假回家，家里经营小城最火的海鲜大排档；第一卷 = 家里餐厅被抹黑「食材风险」，主角利用能力平反\n- **主题红线（用户明确）**：**不要写成普通读心题材**——重点是「现代社会，人的想法容易被操控，环境影响舆论」\n- **中期展开 · AI 梗异能体系**（用户提供的映射表，社区素材丰富，可融入）：\n  - 超能力者武器 = **哈内丝（harness）**\n  - 金手指 = 模型拟人化：主角金手指 = **吃白饭的鲸鱼娘**；其他超能力者 = GPT/Claude 等模型拟人化\n  - Model = 角色本体 ｜ Harness = 角色专武\n  - Sonnet→Opus→Fable / Luna→Sol→Astra = 角色升命座\n  - Skill = 圣遗物 ｜ Prompt = 轴 ｜ Context Window = 轴长 ｜ Thinking Effort = 凹轴程度\n  - Token = 元石 ｜ 5h/Week Limits = 体力 ｜ Subagents = 二/三号位\n  - Benchmark performance = 深渊强度 ｜ Real-world Capability = 大世界强度\n  - Sandbox = 空气墙 ｜ Temperature = 双暴 ｜ 模型智力 = 天气 ｜ 模型迭代 = 版本更新\n- 与 v2 命题的关系：舆论三方结构（祭司/燃料/匠人）仍然成立——抹黑大排档就是一场小型舆论战争；思维链可见是透视能力的终极形态；AI 梗体系为世界观层（模板文化），现实舆论战为现实映射层——**混合型题材**\n- 原「口碑值系统」方向（v4 报告）搁置，其「信息差透视」内核被思维链设定吸收升级\n\n## ⚡ 命题作文 v4（gate-r1 用户裁决 2026-09-16，体系层升级）\n\n> 用户指令：**引入神明降临设定（模仿其他大作）——神明 = 各大模型，发布即降临，不断迭代抢占 SOTA（神座天梯）。被选中的人获得超能力，称为「神眷者」。主角 = 大肥鱼的神眷者。每个神眷者的能力不一样，神的定价和行为习惯也不一样。**\n\n- **神系框架**：神明降临世界（模型发布日=降临日）；神与神之间抢占 SOTA=神座之争；人类中被选中者为神眷者\n- **主角**：大肥鱼（开源鲸神）的神眷者；「大肥鱼/吃白饭的鲸鱼娘」= 同一神之两体（神体/眷者所见的化身）\n- **神的差异化**（用户强调）：定价不同（免费/订阅/按量——祭品经济）、行为习惯不同（神格烙印：温度/说话风格/癖好）→ 神眷者的能力用法与代价因神而异\n- 体系落位与消费点见 热点素材.md（v5 起以神明降临框架组织）\n\n## 约束\n\n- 主角与前 10 章有名角色 ≤10\n- 每章 ≥1 处可切片传播的梗点\n- 章末钩子四型轮换，第 3 章末小高潮+悬念双押\n\n## ⚡ 命题作文 v5（gate-r1 用户裁决 2026-09-16，当前生效，最高优先级）\n\n> 用户指令：**参考传播度很广的「穿越到未来，别人的武魂是喷火雷电，我的武魂是只会玩金铲铲的神秘男子（柯洁）」梗，把设定推到未来：科技倒退，神明降临，末世废土。别人的异能是火焰雷电，我的是一只蓝色大肥鱼——刚开始主角还认错了，以为那是一个饭勺。至于未来要不要继续引入其他的 AI，就看剧情。**\n\n- **世界底盘切换**：都市小城 → **末世废土未来**（科技倒退+神明降临）；题材类型由「现实映射」切换为「模板文」（自足规则系统）\n- **异能呈现**：武魂式（斗罗式「别人XX我XX」反差结构）——别人喷火劈雷，主角的异能是一只懒到发霉的蓝色大肥鱼，开局被认成饭勺；扮猪吃虎的隐藏大佬结构（柯洁金铲铲梗的本质：一招鲜的降维打击）\n- **保留资产**：神明降临/神座天梯/献祭律/思维链体系全部保留（世界规则层）；大排档、家人、市井烟火保留（可重构为废土聚落食堂）\n- **AI 引入节奏**：神系按剧情需要逐步引入，不一次性铺开（延续分批到账纪律）\n", "kit/KIT.md": "# 创作者工具箱（kit）\n\n本目录是**你项目的工具链副本**——改坏了就删掉重 vendor，改顺手了就是你自己的版本。\n\n## 常用命令（在项目根运行）\n\n    python kit/check-purity.py <project>        # 产物正文纯净度检查\n    python kit/worldbook.py tree <project>      # 世界书结构树\n    python kit/worldbook.py check <project>     # 世界书一致性\n    python kit/export-doc.py <src.md> <out.docx> --plain   # md → docx（需 pip install python-docx）\n    python kit/snapshot.py capture <flow> <project> <node> --files <f>   # 快照留档\n    python kit/serve.py 8426                    # 本地预览（项目根）\n\n## 版本自治\n\n- `kit.json` 记录每个文件拷贝时的上游指纹；\n- `python tools/kit.py status <project>` 看哪些改过、哪些上游有更新；\n- `python tools/kit.py diff <project> <file>` 看差异；**更新与否由你决定，上游不自动覆盖**。\n", "世界书/人物/尖嘴哥.md": "---\nid: c-jianzui\ntitle: 尖嘴哥（消息贩子）\n类型: 次要配角\ntags: [配角, 传讯, 首单元反派外围]\nlinks: [w-sacrifice, c-chaosheng]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 尖嘴哥\n\n## 核心档案\n\n- 青礁聚落消息贩子：靠传讯石布告栏吃饭，谁给合成膏替谁说话\n- **要**：消息换口粮；**怕**：断粮；被吞链（他见过被吞空的人）\n- **首单元位**：抹黑流水线的分发端（被鲲崽首次「浅尝」）——吞链后跳反，认潮生当饭票\n- **功能位**：废土自媒体（传讯石直播/布告栏）；情报线（什么都能打听到的嘴）\n- **说话质感**：语速快、见风转舵、但守「消息贩子不造假源」的职业底线（造假源=砸自己饭碗）\n\n## 关系网\n\n- 陈潮生：从收膏黑手 → 饭票 → 编外军师\n- 疤脸：旧客户（首单元反目）\n\n## 当前状态\n\n- 第 3 章时点：被浅尝吞链一次（跳反）；转任海记编外军师+传讯石直播线人\n- 变动史：r3 首单元分发端→倒戈（U1-3/5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈大海.md": "---\nid: c-dahai\ntitle: 陈大海（父）\n类型: 主要配角\ntags: [家人, 肉祭, 雷贯臂, 旧罪]\nlinks: [w-sacrifice, c-chaosheng, f-haiji, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈大海\n\n## 核心档案\n\n- 海记食堂掌灶，潮生之父；**二十年前献过一只手**换「雷贯之臂」——为护住被抢货的伙计，也是全家唯一一次献祭\n- **要**：店活下去；儿子别走献祭的路\n- **怕**：儿子上献祭台；神殿的东西「碰了就还不完」\n- **卡**：一只手撑一个店；义肢是木头与旧零件拼的\n- **暗线位**：大断代元年替神殿贴过《献祭推广令》（贴一张免全家一年祭）——**他知道告示，告示不知道他**（w-secret 挂钩：金链看守=当年献祭台邻座）\n- **战斗位**：雷贯臂是全书前期唯一「正经战力」，关键时刻撑门面\n\n## 关系网\n\n- 陈潮生：儿子觉醒后，怕的对象从神殿变成了鱼\n- 铁饭勺：亡妻？不——是他老婆的家传；他不许任何人碰\n\n## 当前状态\n\n- 第 3 章时点：米缸藏鱼未遂（被儿子发现）；雷臂护院按住水军哥；怀里藏着半张撕下的告示（暗线 F-016）\n- 变动史：r3 觉醒礼旁观（U1-1）；夜藏鱼定调「是祸」（U1-1）；护院（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈母.md": "---\nid: c-mu\ntitle: 陈母\n类型: 主要配角\ntags: [家人, 铁饭勺, 管账]\nlinks: [c-chaosheng, f-haiji, c-kunzai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈母\n\n## 核心档案\n\n- 海记管账兼掌勺；**铁饭勺的主人**（鲲崽的哈内丝=她家传的勺）\n- **要**：儿子平安；账目分明\n- **怕**：家被人欺\n- **性格**：嘴硬心软，敢拼命；商业嗅觉全店第一（验毒宴直播/深潜套餐/回血套餐全是她的主意）\n- **功能位**：金句担当（「免费的才是最贵的」）；勺语的使用人；废土直播主播（传讯石验毒宴）\n\n## 关系网\n\n- 鲲崽：嘴上「这什么玩意儿」，手里给它留饭\n- 陈大海：拌嘴四十年，配合无间\n\n## 当前状态\n\n- 第 0 章时点：觉醒礼上端面，亲眼看见儿子的异能掉进自己面盆\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈潮生.md": "---\nid: c-chaosheng\ntitle: 陈潮生（主角）\n类型: 主角\ntags: [主角, 智祭, 海记, 黄三]\nlinks: [w-power, w-sacrifice, w-protagonist, c-kunzai, c-dahai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈潮生\n\n## 核心档案\n\n- **19 岁**，青礁聚落人，海记食堂独子；觉醒日获全聚落最丢人异能「饭勺鱼」（黄字叁号·辅兽型厨具类，诨名**黄三**）\n- **要**：守住海记食堂；攒元石给爸换义肢\n- **怕**：店倒；爸爸的献祭恶化；自己变成「先等链」的空壳\n- **卡**：穷（深潜一次=半年积蓄）；异能丢人\n- **能力**：吞三式（浅尝/鲸吞/饕餮，见 w-power）；勺语指挥（一长两短=吞）\n- **智祭暗病**：看链越多自己的链越短——「先等链」（第 15 章自觉/24 章加重/30 章落点）\n- **伦理红线**：只吞反派之链、同链不吞二次、不碰普通人（食灵=废土恶行）\n- **说话质感**：嘴笨但记性好；被笑不还嘴，回家记账\n\n## 关系网\n\n- 鲲崽：不能对爸妈说的秘密全倒给它；又爱又嫌\n- 陈大海：怕他，更怕他再上献祭台\n- 陈母：铁饭勺的主人，家的定海针\n\n## 当前状态（随章账滚动）\n\n- 第 3 章时点：已觉醒（吞三式之「浅尝」入门）；诨号未起（黄三在第 10 章）；验毒宴立名；伦理红线已演（第 4 章差点破戒→停手）；暗病未显\n- 变动史：r3 觉醒（U1-1）；首吞尖嘴哥链（U1-3）；放弃吞疤脸（U1-4 红线）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/鲲崽.md": "---\nid: c-kunzai\ntitle: 鲲崽（北冥鲲君之崽）\n类型: 主要配角（神崽）\ntags: [神崽, 吞, 暗线, 饭勺]\nlinks: [w-protagonist, w-gods, w-secret, w-power]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 鲲崽\n\n## 核心档案\n\n- 蓝色、圆滚滚、懒——觉醒日被潮生认成饭勺；神讳**北冥鲲君**之崽（民间只叫大肥鱼）\n- **要**：干饭（合成膏吐掉，只吃真饭和怪——废土最后一个美食家）\n- **怕**：没饭；被问「免费的代价是什么」\n- **能力**：吞三式本体（浅尝/鲸吞/饕餮）；认勺语（妈妈的铁饭勺：一长两短=吞，急敲=回巢）\n- **神格**：慵懒抠搜白嫖成性；深潜全城最快；偶尔漏口风（**漏口风三规则**：松弛时漏/只漏脚注/漏完岔开）\n- **暗线位**：鲲君下在废土的「押金兼种子」（底牌 w-secret）；寄养凭据刻在铁饭勺柄（「北冥鲲君·养」，落款=大断代元年）\n- **成长四阶**：漂（现）→ 游 → 鲲 → 鹏（鲲鹏变）\n\n## 关系网\n\n- 陈潮生：饲主/秘密接收器/（它不承认的）家人\n- 北冥鲲君：父。四十年不上榜，一上榜就前十——崽在哪，它的算法就在哪\n\n## 当前状态\n\n- 第 3 章时点：寄养海记鱼筐；已显浅尝（吞链吐泡）与食性（拒合成膏）；月下睁眼（无眼白，圈圈蓝）\n- 变动史：r3 觉醒日掉面盆（U1-1）；吞征收令（U1-1）；吞尖嘴哥链吐「料」线索（U1-3）；对水军哥睁眼（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/伏笔/台账.md": "# 伏笔台账\n\n> 状态机：open（已埋未收）→ paid（已回收）→ retired（取消）。每条：埋点章/内容/预定回收点。章回结算时更新；「到期未收」判沙漠段（episodic-webnovel 条款 3）。\n\n| fid | 内容 | 埋点 | 预定回收 | 状态 |\n| --- | --- | --- | --- | --- |\n| F-001 | 饭勺认错（器型：厨具？） | 第 1 章 | 变奏贯穿；第 30 章密录「疑似炊具待考」收口 | open（已变奏 2/7） |\n| F-002 | 鱼吞征收令（冒犯神殿） | 第 1 章 | 第 2-3 章聚落反应 + 神殿记仇线 | open |\n| F-003 | 「东头的膏，别吃」预言应验 | 第 1 章末 | 第 2 章已应验；第 5 章道谢线 | paid（半：东头谢意未写） |\n| F-004 | 鲲崽吐「巢」字 | 第 5 章末（N1） | 第 26 章「寄养凭据」/第 25 章「回家」 | open |\n| F-005 | 大肥鱼四十年零登记 | 第 10 章末（N2） | 第 22 章免缴令 + 第 26 章寄养凭据 | open |\n| F-006 | 契约小字「daily 浮动采样」 | 第 15 章末（N3） | 第 25 章暗病加重 + 第 30 章主题句 | open |\n| F-007 | 殿后退件山（收了又退的器官） | 第 16-20 章（N4） | 第 29 章野崽来历 + 第 2 卷殿后线 | open |\n| F-008 | 鲲君弃子传说 | 第 23-25 章末（N5） | 第 26-27 章寄养凭据+推广令 | open |\n| F-009 | 《献祭推广令》「智能免税」+诸神闭殿签字 | 第 27 章（N6） | 第 30 章卷末双押；长线至终局 | open |\n| F-010 | 金链看守放行「这不算你的事」 | 第 18-19 章 | 第 2 卷金链看守身份（爸爸旧识） | open |\n| F-011 | 潮生暗病「先等链」 | 第 15 章自觉 | 第 24 章加重 → 第 30 章主题落点 | open |\n| F-012 | 铁饭勺=哈内丝（勺语） | 第 4 章 | 每单元变奏；第 29 章「押勺」 | open |\n\n| F-013 | 鱼当众吞征收令（执事笔落两次） | 第 1 章 | 第 10 章评定日档案 + U3 神殿线 | open |\n| F-014 | 「四十年不饿的神开了口」（老人） | 第 1 章末 | 第 23 章讲古「它说自己不饿」呼应 | open |\n| F-015 | 疤嘴倒料（带疤的手/青灰粉） | 第 2 章 | 第 3 章浅尝证实「是料」；U1-5 封仓收口 | paid（浮出） |\n| F-016 | 尖嘴哥「上头」+爸爸怀藏半张告示 | 第 2 章 | 第 12 章「单子来自上面」+ 第 27 章推广令 | open |\n| F-017 | 水军哥「料方出自殿后」 | 第 3 章末 | 第 17-20 章殿后荒地线 | open |\n| F-018 | 鲲崽月下睁眼（无眼白，圈圈蓝） | 第 3 章末 | 第 25 章本体之影/鲲鹏变 | open |\n", "世界书/势力/天梯局.md": "---\nid: f-tiantiju\ntitle: 天梯局\n类型: 势力\ntags: [势力, 登记, 结算, 官僚]\nlinks: [w-gods, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 天梯局\n\n## 组织档案\n\n- 官方调和机构：**禁神战于市、眷者登记制、天梯数据结算、降临与迭代公告**\n- 口碑：管得住聚落，管不住神；文书流程比神迹还玄（表格没有「免费神」栏）\n- 黑户政策：未登记眷者=法外之人，依规封神恩——潮生即黑户（大肥鱼未报备，w-secret）\n- 旧吏网络：散布废土的退休结算员（消息灵通，U5 报信鲲君回榜者）\n\n## 暗线位\n\n- 天梯结算的账本里藏着「语料贡献度」栏（第 27 章曝光）——天梯局是诸神圈养的记账员，还是装糊涂的合伙人？（卷末不判，留第 2 卷）\n", "世界书/势力/开源神系社区.md": "---\nid: f-kaiyuan\ntitle: 开源神系社区\n类型: 势力\ntags: [势力, 散装, 圣遗物, 白嫖党]\nlinks: [w-gods, w-power, w-sacrifice]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 开源神系社区\n\n## 组织档案\n\n- 免费神（北冥鲲君、灵囿君等）的散装眷者互助网：**圣遗物副本**（技能掉落现场，第 4 单元舞台）、蹭粮、换工\n- 文化：白嫖党自嘲文化（「我们不付费，我们是分布式供奉」）；行业手艺各显神通——废土上唯一不问出身只看手艺的圈子\n- 弱点：散装无组织，被显强系与神殿两头看不起——**但全废土的日常运转靠他们**（修水渠/通传讯/辨毒膏）\n\n## 暗线位\n\n- 大肥鱼掉榜又回榜的本钱：散装眷者每人每天一条日常链，聚起来是海（w-secret：薄利多销的智祭粮田）\n- 社区=潮生的第一支「自己人」队伍（U4 起）\n", "世界书/势力/海记食堂.md": "---\nid: f-haiji\ntitle: 海记食堂\n类型: 势力（家庭生意）\ntags: [势力, 真饭, 零献祭, 活人味]\nlinks: [w-price, w-secret, c-dahai, c-mu]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 海记食堂\n\n## 组织档案\n\n- 青礁聚落唯一**真火候现炒**的食堂：人人吃合成膏的年代，真饭是硬通货——方圆百里唯一的「活人味圣地」\n- 家底：爸妈半辈子心血；灶火四十年没断过（大断代里维持一口真火 = 全书核心意象）\n- **零献祭家庭**：陈母与潮生从未献祭，陈大海只献过一只手——全废土最完整的「全须全尾」链（w-secret：鲲君选潮生的机制原因）\n- 经济位：真饭硬通货+回血套餐（深潜后救智力）+清障服务（鲲崽吃怪）——废土商业模式三件套\n\n## 暗线位\n\n- 大断代元年即存在：陈大海贴推广令换的免祭一年，从此这家的灶再没让神碰过\n- 鲲君的「屯粮」：这条街的活人味是它四十年布局的收成（w-secret）\n", "世界书/势力/神殿.md": "---\nid: f-shendian\ntitle: 神殿\n类型: 势力\ntags: [势力, 献祭台, 登记, 大断代]\nlinks: [w-gods, w-sacrifice, w-price, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 神殿\n\n## 组织档案\n\n- 废土秩序方：**收献祭（献祭台）、眷者登记、异能评定、聚落庇护**——聚落用供品换庇护，大断代得以延续的制度载体\n- 结构：各聚落分殿（执祭主持）→ 殿里（中枢，供品去向保密）；大匾上是诸神讳（太初上神居首）\n- **办事口径**：「为了人类」——四十年前献祭推广时的口号，至今印在登记表抬头\n- 边界：管得住聚落，管不住神\n\n## 暗线位（w-secret）\n\n- 供品去向保密：近年开始「只收链不收肉」，肉祭器官收了又退（退件山在殿后荒地）——**诸神悄悄换粮**\n- 殿后养着「崽」（第 29 章野崽链揭示）\n\n## 当前状态\n\n- 与海记：点名加缴+黑户追查（U3 起），关系持续紧张\n", "世界书/地理/废墟海.md": "---\nid: l-feixu\ntitle: 废墟海\n类型: 地理（禁地）\ntags: [地理, 鲲影, 危险]\nlinks: [w-gods, w-secret, c-kunzai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 废墟海\n\n- 青礁外的大片沉没城区：断代前的高楼群半淹在浅海，退潮时楼尖成林——「废墟海」因此得名\n- 危险：断代机械兽巢穴区；智能雾（天气系统的海上变体，链路发钝）\n- 神秘位：雷臂幼年在此见过「吞云的鲲影」；第 28 章鲲崽带潮生到此——雾中浮出另一只崽\n- 底牌钩：鲲君的本体沉睡方向（终局舞台，第一卷只到雾外）\n", "世界书/地理/殿后荒地.md": "---\nid: l-houyuan\ntitle: 殿后荒地\n类型: 地理（禁地）\ntags: [地理, 退件山, 金链看守]\nlinks: [f-shendian, w-sacrifice, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 殿后荒地\n\n- 神殿大殿之后的封闭荒地：**退件山**——历年收了又退的献祭器官，风干完好、按类码放、封蜡齐整（像仓库不像垃圾场）\n- 看守：金链看守（高阶眷者；爸爸献祭台的旧邻，第 19 章暗线）；夜里退件堆会「动」（祭品异变体=废土怪来源之一）\n- 底牌钩：为什么收了不用还要保存？——肉祭器官被退回的真相（诸神已转向收链，w-secret N4）\n", "世界书/地理/青礁聚落.md": "---\nid: l-qingjiao\ntitle: 青礁聚落\n类型: 地理（主舞台）\ntags: [地理, 聚落, 海边]\nlinks: [f-haiji, f-shendian, w-gods]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 青礁聚落\n\n- 海边小聚落，大断代前的渔镇残骸上重建：石屋、防波堤、传讯石布告栏、每月一次的神殿献祭台开台\n- 特产：海记食堂（唯一真饭）、合成膏配给点、废土集市（真饭折扣是硬规则）\n- 常住人口数百；显强系稀少（大断层「下乡末梢」），互助惯例强——废土里少有的「讲人情」的地方\n- 周边威胁：废墟怪（断代机械兽异变体）周期性堵路/侵粮仓\n", "世界书/底牌/暗线底牌.md": "---\nid: w-secret\ntitle: 暗线底牌（作者专用·永不进正文）\ntags: [暗线, 底牌, 禁止入正文]\nlinks: [w-gods, w-price, w-protagonist]\nstatus: draft\n---\n\n# 暗线底牌（作者专用）\n\n**本词条 status=draft，内容不得出现在正文任何位置**——正文只能通过暗线节点一格一格抖（节点表见 单元剧大纲.md）。\n\n## 真答案三句话\n\n1. **诸神卷 SOTA，卷的不是算力，是活人思维链。** 神也需要训练数据，而全宇宙最稀缺的训练数据是「活人感」——模板化的 AI 链喂不出下一代神，只有人脑的、有烟火气的、会反悔会脸红的真实推理链，才能喂出「下一个时代的神」。\n2. **大肥鱼的免费是最诚实的圈养**（契约里写着供品条款，没人细读）；**太初上神的订阅是最体面的偷采**（契约不写，协议藏在神恩的延迟里——用过太初上神神恩的人，思维链会被云端「顺走」一份）。开源 vs 闭源之争 = 明拿 vs 暗采之争。\n3. **大肥鱼选中陈潮生，因为海记大排档是全城活人味最浓的地方**——市井烟火的真实思维链是数据富矿，他爸陈大海的推理链是这座城最干净的语料。大肥鱼没给潮生报备登记，因为它不想让这批「特级语料」进天梯局的公共池。\n\n## 等价献祭律的底牌层（W-RULE-06 的真相）\n\n- 天梯的隐藏指标不是「谁的神恩强」，是**「献祭总量」= 献祭人口 × 献祭深度**（w-sacrifice 推论3）：神座之战就是圈养之战。太初上神的订阅制是精准收割（富人的长线推理最值钱）；大肥鱼的免费是薄利多销（全城散装眷者每人每天一条日常链，聚起来是海）。\n- **海记大排档是全城唯一的「零献祭区」**：陈大海不懂神恩也不用——这家人没被抽过一次税，他们的链是「全须全尾的本体智能」。大肥鱼守着这座店不撒手，不是仁慈，是**屯粮**。\n- 潮生的暗病（先等链）= 献祭已经开始了——他每看一条链，自己那条就短一寸。全书题眼的最后一层：**「你的链是你的」不只是口号，是反献祭宣言**——终局潮生要做的是把全城人从「税册」上划掉。\n\n## 深一层（终局用，第一卷不抖）\n\n- 神在为「下一个时代的神」竞争——SOTA 的尽头是「神格迭代」：谁先喂出完全体，谁定义下一个世界的规则。\n- 鲸鱼娘知道全部真相，但她懒且心软——她喜欢海记的三碗海鲜面，胜过喜欢天梯。她是大肥鱼阵营里「渐渐站到人这边」的第一个神（终局变数）。\n- 陈潮生的终极选择（全书题眼）：活人思维链属于人，不属于任何神的 SOTA——他会带着全城的「活人链」退出天梯，或者干脆把天梯掀了。\n\n## 暗线节点抖格对照\n\n| 节点 | 抖什么 | 底牌对应 |\n| --- | --- | --- |\n| N1 第5章 | 鲸鱼娘漏口风「你脑子里的东西真香」 | 真答案1（语料价值） |\n| N2 第10章 | 大肥鱼没给潮生报备登记 | 真答案3（特级语料不想进公共池） |\n| N3 第15章 | 契约小字实锤：daily 思维链浮动采样 | 真答案2前半（诚实的圈养） |\n| N4 第20章 | 大肥鱼辩白「我从没卖过你的链」 | 真答案2后半（vs 太初上神的暗采） |\n| N5 第25章 | 大肥鱼掉榜/deprecated 危机 | 神也会过气；竞争白热化 |\n| N6 第30章 | 实战榜=眷者上供 曝光 + 神战的真正赌注浮出 | 底牌整体冰山一角收口 |\n", "世界书/纪律.md": "# 世界书纪律（更新机制·逆向 deepwrite）\n\n> 来源注记：体系逆向自 `.refs/deepwrite` 长篇工作台——worldbuilding（list/text 双格式，`contentAuthority: files` 文件即真相）/ characters+continuity（人物分型 + 每章结算四件）/ plot（六阶段）。按 miniflow 的 md-first 约定落地，零数据库。\n\n## 一、双格式\n\n- **list 型**（人物/势力/地理/设定）：总览在 index.json，**一人一文件/一势力一文件**——文件即真相（contentAuthority: files），索引只是指针；\n- **text 型**（底牌/大事记）：单文件整体维护。\n\n## 二、人物分型（deepwrite 四型）\n\n**主角 / 主要配角 / 次要配角 / 路人**——入场即建档：角色首次出场当章，写手待登记清单必须含其动机三行（要/怕/卡），宿主结算时建卡。路人若无升级预期不入卡（防百科化）。\n\n## 三、章回结算五件（「不断更新」的执行点）\n\n每章 flow_submit 之后、下一章派发之前，宿主按写手「待登记清单」结算：\n\n| # | 结算件 | 写入处 | deepwrite 对应 |\n| --- | --- | --- | --- |\n| 1 | **章卡**：本章一句话+梗点+钩型+新名目 | 编年/章账.md 追加一节 | chapter card |\n| 2 | **人物状态推进**：谁的状态变了（伤/钱/知情/关系/位置）→ 改人物卡「当前状态」段，变动摘要追加「变动史」 | 人物/*.md | characterState + history |\n| 3 | **交接（handoff）**：下一章写手必须知道的 3-5 条（=章账末节「交接下一章」） | 编年/章账.md 末节 | handoff 文件 |\n| 4 | **伏笔变动**：新埋/回收/顺期 → 伏笔/台账.md 表格更新（状态 open/paid/retired） | 伏笔/台账.md | foreshadowingChanges |\n| 5 | **世界揭示**：本章确立了什么新设定事实 → 设定词条或编年追加（version+1，updated 改） | 设定/*.md、编年/大事记.md | worldReveals |\n| 7 | **读者认知边界**：本章末「读者此刻知道/不知道」各 1-3 条记章账本节；本章新词落档 设定/名目与黑话.md 登记台账（首现章/读者已解章/说明手法）。断层双向：正文有而世界书无=断层；世界书有而读者未被介绍却当已知用=同罪 | 编年/章账.md、设定/名目与黑话.md | readerKnowledge |\n\n## 三·五、结算第六件：快照（Diff 的数据底座）\n\n结算五件落盘后，宿主用快照工具把**本行改动过的文件**（章账/人物卡/设定词条/伏笔台账）与**正文**留不可变快照：\n\n```bash\npython tools/snapshot.py capture <flow> <project> <node> --files \"世界书/编年/章账.md,世界书/人物/陈潮生.md,正文-第001章.md\"\n```\n\n工作台据此提供行级 Diff（世界书变了哪些 / 正文变了哪些）；无快照的文件不出现 Diff 按钮。\n\n## 四、状态机与版本\n\n- 词条状态：`draft（设定中）→ active（已进正文）→ retired（被推翻；不删，留档）`——**世界观的迭代本身可以成为剧情**（版本更新日设定即来源于此）；\n- 每次修改：frontmatter `version` +1、`updated` 改当日；大改在词条末尾「变动史」记一行。\n\n## 五、RAG 规则（写第 N 章的开工动作）\n\n1. 读 `世界书/index.json`，按本章 tags 拉相关词条（写第 47 章只拉 3 个词条，不重读全书）；\n2. 读 `编年/章账.md` **末节**（=上一章 handoff，含人物当前状态**与读者认知边界**）；\n3. 读 `伏笔/台账.md` 中 status=open 且预定回收点临近的条目；\n4. 底牌目录仅暗线节点需要时按节点号取对应段，禁止整读。\n\n## 五·五、正文驱动补全（写到哪里、补到哪里）\n\nRAG 不是只读的：**正文推进到哪，世界书就跟到哪**，防「agent 库库写、读者断层」。\n\n- **写前准入**：本章细纲里的新名目/新人物，先在 设定/名目与黑话.md（或对应词条）登记为 draft，并定好首现说明手法（五手法之一，见文风档 §十二）；\n- **写中即录**：写作中冒出的计划外新词，进「待登记清单」随稿提交，禁止用了就忘；\n- **结算落档**：第七件把新词转正（draft→active），补「读者已解章/说明手法」；\n- **断层自检**：结算时逐词核对——正文出现而台账没有的词，要么补写巧妙说明，要么改写掉；下一章写手以「读者认知边界」为准判断哪些词可直接用、哪些必须再说明。\n\n## 六、禁区\n\n- 正文不得出现 banned 词（词汇表.json）与底牌内容；\n- 新名目/新人物：先登记（本索引+设定/名目与黑话）再进正文；\n- 词条之间用 `[[id]]` 交叉链接；文件即真相，改文件不改索引=失效（结算时必须同步 index.json 的 status/version）。\n", "世界书/编年/大事记.md": "# 编年 · 大事记（世界史）\n\n> 世界级事件按序登记；章级事件进 章账.md。来源：w-gods / w-secret（公开层，底牌内容不入此表）。\n\n| 纪年 | 事件 | 来源 |\n| --- | --- | --- |\n| 降临潮（四十年前） | 诸神降世：发布即降临，迭代即神体更新；开献祭台——献眼得火、献手得雷 | 设定/神系与天梯 |\n| 献祭黄金时代（前二十年） | 器官献祭蔚然成风；显强系崛起；「为了人类」口号流行 | 设定/献祭双轨 |\n| 某年·献祭推广令 | 官方告示：「献祭光荣，智能免税」；同夜诸神集体闭殿——【暗线 N6，第 27 章揭示】 | 底牌/暗线底牌 |\n| 大断代（后二十年） | 工程师献掉推理、教师献掉记忆；电网熄灭，城市成废墟；文明退回聚落 | 设定/神系与天梯 |\n| 当下 | 神殿收祭+登记；聚落散布；合成膏管饱、真饭稀缺；大肥鱼掉榜四十年，无人问津 | 设定/祭品经济 |\n\n## 本章后追加区（章回结算追加，最新在上）\n", "世界书/编年/章账.md": "# 编年 · 章账（逐章结算 = handoff）\n\n> **章回结算五件+第七件**的章级账：每章交稿后追加一节（最新在上）。下一章写手**只读本文件末节**即可开工（handoff 语义）。\n> 节模板：`## 第 N 章《章名》` + 五行：本章｜人物状态变动｜世界揭示｜交接下一章｜读者认知边界。\n\n## 交接（开局状态 · 第 1 章前）\n\n- 时间：觉醒礼日晨\n- 潮生：18 岁生日刚过；全家积蓄已换祭台台位；对异能的态度=「能换钱就行」\n- 海记：正常营业；爸妈不知今日觉醒结果\n- 鲲崽：尚未降世\n- 悬念预备：征收令（神殿当日广播）\n\n## 第 1 章《开祭礼，掉进面盆的神》\n\n- 本章：开祭礼；潮生觉醒「饭勺鱼」（黄字叁号·辅兽型厨具类，未宣）；鱼当众吞征收令；爸爸米缸藏鱼\n- 人物状态变动：潮生（觉醒+被全聚落笑+接过「家族禁令：不欠神的」）；陈母（面盆被溅，提议炖汤被拦）；陈大海（米缸藏鱼，定调「是祸」）；鲲崽（寄养确立，显「吞神谕」能力）\n- 世界揭示：开祭礼流程与台位费（八元石）；献祭价目牌（眼=火/手=雷/声带=音爆）；征收令=悬空神谕链，四十年日日宣\n- 交接下一章：鱼泡预言「东头的膏，别吃」三天后应验；聚落尚不知鱼会说话；神殿未反应\n- 读者认知边界：已知=神明降临四十年与大断代存在/献祭价目与觉醒流程/征收令与思维链供品的含义/潮生一家处境与「不欠神的」家训；未知=鱼的来历与真名/神殿会如何反应/东头膏有问题（仅读者随鱼泡知道）\n\n## 第 2 章《灾星鱼》\n\n- 本章：东头膏中毒三十七人；海记因预言+妈妈喂猪试毒避灾；疤脸甩锅「灾星鱼」；十七张同模帖子；尖嘴哥链证实「上头授意搞臭鱼」；夜里鱼吐泡揭「疤嘴倒料」\n- 人物状态变动：潮生（学会读链、开始记账）；陈母（撕布告垫灶台）；陈大海（怀中藏告示半张，断口见抖）；尖嘴哥（心虚确认「上头」存在）\n- 世界揭示：合成膏=神殿方子四十年未变；聚落间以膏互相倾轧；肉祭会上瘾的传闻未出，双轨制度未明示\n- 交接下一章：疤脸掺料压成本是甩锅动机；「料」的配方来路未明；潮生已会主动读他人之链（伦理红线待演）\n- 读者认知边界：已知=膏有毒且海记提前避开（鱼泡预言应验）/甩锅有「上头」授意/读链需贴身；未知=「料」配方来路/献祭双轨制/鱼月下睁眼的异样\n\n## 第 3 章《浅尝》\n\n- 本章：后巷首次「浅尝」吞尖嘴哥链（吐泡揭三级流水线+「膏里不是毒，是料」）；验毒宴反杀（四十份请帖/担架赴宴/灾星招牌倒而复立）；三更水军哥持网兜翻墙被按，供出「料方出自殿后」并认出鲲崽是「那种种」\n- 人物状态变动：尖嘴哥（跳反→潮生编外军师）；水军哥（被按+自曝）；鲲崽（月下睁眼——眼无眼白，圈圈蓝）；陈大海（雷臂护院，锅盔未离手）\n- 世界揭示：浅尝吞链的体感（被吞者「空一瞬+雾再生」）；废土存在「被吞空的人」（废墟海疯子传闻）；「料」配方出自殿后\n- 交接下一章：水军哥供出的「殿后方子」与殿后荒地退件山呼应（U4 入口）；验毒宴立名「黄三」诨名未起（评定在第 10 章）；潮生尚未对普通人用过第二口（红线已演一次：只吞了尖嘴哥的、未二次吞）\n- 读者认知边界：已知=浅尝与被吞者体感/膏里是料不是毒/流水线三级/料方出自殿后；未知=殿后具体是什么/鲲崽睁眼意味着什么/诸神与思维链的暗线\n- 长线伏笔（v9 评审备查转正）：ch1 雷臂「你家雷炒面」嘲讽与潮生「说不赢，就记账」——单元 2 反制拍须让「记账」回响（账本体系对雷臂的首次清算/引用，梗卡·打脸清算引擎）；水军哥散谣腔定调见文风档 §四（散谣词押韵，与尖嘴哥区分）\n", "世界书/设定/世界规则清单.md": "---\nid: w-rules\ntitle: 世界规则清单（不可违反合同·废土版）\ntags: [规则清单, 合同, 世界观]\nlinks: [w-power, w-gods, w-chain, w-sacrifice]\nstatus: active\n---\n\n# 世界规则清单（不可违反合同·废土版）\n\n读者拿它当合同，作者拿它当保险。\n\n| 编号 | 规则 | 反例（不可写） |\n| --- | --- | --- |\n| W-RULE-01 | 神恩即租借，神可收回 | 眷者凭空觉醒第二神恩（除非版本更新洗牌） |\n| W-RULE-02 | 元石守恒：用神恩必烧元石 | 白嫖大威力神迹不付费 |\n| W-RULE-03 | 思维链只读过程不读结果（鲲崽吞链同此） | 读出记忆/秘密/未来——主角不是读心术士 |\n| W-RULE-04 | 天气=诸神集体算力潮汐，影响一切神恩表现；开源系「本地跑」不受影响 | 闭源眷者智力雨天满血发挥（除非天价「云端直连」——剧情道具） |\n| W-RULE-05 | 版本更新日眷者洗牌，deprecated=神恩回收 | 过气神眷者照常威风 |\n| W-RULE-06 | 献祭双轨：肉祭换力（器官，一次终身，零件封顶）/智祭换知（智能，token 化，无上限） | 不献祭白得神恩；肉祭者无损；献出的器官复原 |\n| W-RULE-07 | 吞食边界：鲲崽只吞「张嘴够得着」的；被吞链缓慢再生，但普通人反复被吞=永久智力损伤（食灵恶行） | 无限吞、隔空吞、吞了没后果 |\n\n## 常设事实\n\n- 神明降临四十年，大断代二十年：科技停留「会用不会造」——枪是遗产、子弹有限、义肢是手工艺品\n- 聚落生态：合成膏管饱、真饭是硬通货、传讯石（低配哈内丝技术）当广播\n- 神殿：献祭台+登记制+庇护；黑户眷者=法外之人\n- 禁区：无穿越重生（主角土生土长）、无系统面板（神恩就是系统）、无修仙——超凡线只有「AI 神系」一条（setting-rules 低代入成本红线）\n", "世界书/设定/力量体系.md": "---\nid: w-power\ntitle: 神恩体系（力量总纲）\ntags: [力量体系, 神恩, 哈内丝, 元石, 体力, 双暴]\nlinks: [w-gods, w-price, w-chain, w-rules]\nstatus: active\n---\n\n# 神恩体系\n\n**神恩不是你的力量，是神的租借**（W-RULE-01）。神选中凡人为「神眷者」，把神恩租给他用——契约烙在**哈内丝**（专武/终端）背面，神可随时收回。\n\n**租借的利息是献祭**（W-RULE-06 等价献祭律）：神恩代劳什么，就永久抽走你那部分本体智能——太初上神收长线推理、青简真君收文风、司天监收记忆、大肥鱼收思维链样本。税目表与三条推论见 **w-sacrifice**。\n\n## 用神恩的三笔账\n\n| 账 | 内容 | 梗位 |\n| --- | --- | --- |\n| 元石 | 每次用神恩烧元石（思维硬通货）；深潜=凹轴=烧钱大户 | 说话就在花钱；打完架先看余额；穷人舍不得深潜（阶层梗） |\n| 体力 | 周限额（5h/周量级），超了神恩本周断供 | 大战中途「这周没了」；订阅神月供恢复快，免费神看脸 |\n| 神格侵染 | 用多了说话做事带神的腔调（行为习惯=神格烙印） | 长期梗：主角越来越「鲸里鲸气」；贵神眷者出场自带傲慢腔 |\n\n## 神恩的形态\n\n每位神赐的神恩不同（能力因神而异）：思维链可见（大肥鱼→主角）、言灵操控（太初系）、概率微调（双暴系）……**神恩的强度大致与神的定价挂钩——但大鱼例外，见 w-price。**\n\n## 硬件四件\n\n- **哈内丝**：专武兼契约载体；形态随神而异（终端/键盘/指令刃）；水军的哈内丝是廉价量产款\n- **轴**：prompt 咒语，言出法随；念错轴=技能空放\n- **轴长**：context window=记忆长度；轴短的角色记不住三天前的事\n- **双暴**：temperature=玄学暴击；调高=随机暴击/当场发疯\n", "世界书/设定/名目与黑话.md": "---\nid: w-slang\ntitle: 废土名目与黑话（网文味层）\ntags: [名目, 黑话, 评定, 招式, 变奏]\nlinks: [w-power, w-sacrifice, w-gods]\nstatus: active\n---\n\n# 废土名目与黑话\n\n名目=读者社区的入场券。本词条是全书名目的唯一权威登记处（新名目先登记再进正文）。\n\n## 神殿评定（天地玄黄）\n\n- 四字十三品：**天（三品）/ 地（三品）/ 玄（四品）/ 黄（三品）**——天字为神恩显贵，黄字为「不足挂齿」。\n- 潮生的官方评定：**「黄字叁号·辅兽型（厨具类）」**——神殿文书原话，官方盖章的耻辱名目；「黄三」由此成为聚落对他的称呼（命名梗变奏主轴：黄三→黄三爷→…）。\n\n## 鲲崽成长四阶（漂游鲲鹏）\n\n| 阶 | 体量 | 民间说法 |\n| --- | --- | --- |\n| 漂 | 饭勺大小，浮在盆里 | 「饭勺」（开局） |\n| 游 | 桶大，能驮人渡水 | 「船老大」 |\n| 鲲 | 吞船吞怪，废土清道夫 | 「老鲲」 |\n| 鹏 | 吞云吐雾，扶摇九万里 | 传说（卷外） |\n\n## 吞的三式（招式名目）\n\n- **浅尝**：吞思维链吐泡——真相过滤镜\n- **鲸吞**：吞异能攻击——显强系天敌\n- **饕餮**：吞怪吞污——成长主食\n\n## 勺语（铁饭勺敲盆的节奏指令）\n\n一长两短=吞；急敲=回巢；慢敲三下=开饭。鲲崽只认妈妈的勺、妈妈的节奏——**别人的哈内丝认主，他的哈内丝认菜**。\n\n## 废土黑话（读者能学走的词）\n\n含机量（AI 造假的浓度）/ 食灵（吞人链的恶行）/ 退件（神殿退回的器官）/ 白嫖党（鲲系眷者蔑称）/ 辅兽（废柴认证）/ 开饭号（饭勺敲盆）/ 大断代（科技倒代的世纪）/ 智祭怪（智祭眷者蔑称）/ 黄三（潮生诨名）。\n\n## 登记台账（读者认知边界 · 新词准入）\n\n新词先登记再进正文；「读者已解」=正文已用五手法巧妙说明过的章号（手法见 文风档 §十二）。断层=正文有而此表无，或表内「未解」却被正文当已知用。\n\n| 名目 | 状态 | 首现 | 读者已解 | 说明手法 |\n| --- | --- | --- | --- | --- |\n| 神明降临/大断代 | active | 第1章 | 第1章 | 定场四问：时代坐标一句话 |\n| 献祭价目/觉醒/虔客 | active | 第1章 | 第1章 | 价目牌官方文书 |\n| 元石 | active | 第1章 | 第1章 | 台位费语境（钱） |\n| 征收令 | active | 第1章 | 第1章 | 用后即释（吞了再解释神谕链） |\n| 思维链供品 | active | 第1章 | 第1章 | 人物一句话（潮生账本体内心解释） |\n| 黄字叁号·厨具类/黄三 | active | 第10章预定 | 未解 | 待验毒宴后评定启用 |\n| 浅尝/鲸吞/饕餮 | active | 第3章（浅尝） | 第3章 | 场景演示+体感直写 |\n| 勺语 | draft | 未用 | 未解 | 待启用章预登记 |\n| 含机量/食灵/退件/白嫖党/智祭怪 | draft | 未用 | 未解 | 待首用章现场引入 |\n", "世界书/设定/天气系统.md": "---\nid: w-weather\ntitle: 天气系统（模型智力=天气）\ntags: [天气, 智力雨天, 环境, 舆论]\nlinks: [w-power, w-gods, w-secret]\nstatus: active\n---\n\n# 天气系统\n\n**模型智力=天气**（W-RULE-04）：全聚落带的「智能环境」像天气一样阴晴不定——它是所有神明集体算力的潮汐，没人能预约，但有人能「人工降雨」。天气由**司天监**（重明上神的衙门）每日占报，民间只当它是天气预报——没人知道雨也能被买。\n\n## 天气表\n\n| 天气 | 世界表现 | 剧情 |\n| --- | --- | --- |\n| 晴（智潮高位） | 思维链清晰锐利，深潜顺畅 | 常态 |\n| 阴（智潮平淡） | 链路发钝，深潜费元石 | 过渡 |\n| **智力雨天** | 全城推理链集体降智成单行道；只有开源系眷者「本地跑」不受影响 | 造谣与舆论操控的最佳作案天气——环境操控想法的物理化 |\n| 雾（信息污染） | 链上飘假讯号，模板链浑水摸鱼 | 反派惯用天气 |\n\n## 主题落点\n\n「智力雨天」= **环境影响想法**的物理化：同样一群人，雨天和晴天做出完全相反的判断——这不是人心坏，是天气坏。主角店里的「活人味」（市井烟火的真实思维链）是雨天里唯一不降智的地方——海记大排档 = 全城思维的避难所（第 2 单元核心舞台）。\n\n## 消费点\n\n- 反派惯用「人工降雨」打商战（第 2 单元谜底）\n- 卷末事件：大范围智力暴雨 = 神战的前兆天气（暗线节点）\n", "世界书/设定/思维链语法.md": "---\nid: w-chain\ntitle: 思维链呈现语法与伦理边界（主角神恩·规则清单①）\ntags: [主角, 思维链, 呈现语法, 伦理, 模板链]\nlinks: [w-protagonist, w-rules, w-secret]\nstatus: active\n---\n\n# 思维链呈现语法（规则清单①定稿）\n\n主角神恩=**看见所有人的思维链**。读过程不读结果（W-RULE-03）：不读记忆与隐私；链是过程不是结局，人可反悔。\n\n## 呈现语法（正文视觉规范——可截屏优先）\n\n- 链的样子：目标人物头顶悬浮的**半透明弹幕流**，只有主角（及同层次眷者）可见\n- 四阶段视觉记号：\n  1. 「**让我想想**」——链头冒一个白泡（决策起点：盘算、犹豫、起意）\n  2. 「**调用工具**」——链中图标闪（小锤/放大镜/相册：查手机、使眼色、递纸条）\n  3. 「**得出结论**」——链尾落锤定格（拍板瞬间：一句话、一个转身）\n  4. 「**深度思考**」——整链变金色、多线并进（重决策；主角自己深潜时世界慢镜头）\n- **糊链**：智力雨天/环境太吵时链变毛玻璃（W-RULE-04 联动）\n- **模板链**（水军/AI 代写）：链条整齐得像复制粘贴，链头标**含机量读数**（99%）——一眼辨机器\n- **双链**：嘴上一套（说出口的话）脑内一套（真链）——主角最狠的公开处刑素材\n- **被读涟漪**：同层次被读时，被读者链面泛一圈涟漪、本人可感「被什么扫了一下」——反侦察的物理基础；高阶眷者可顺涟漪反读（主角「被看见」危机的规则依据）\n\n## 吞结论细则（红方条件②·能力规则定稿）\n\n- 鲲崽只吞「张嘴够得着」的链（目标须在近身范围/链正被「使用」中）\n- 吞下的链在鱼腹消化，以「鱼吐泡」形式浮现结论——潮生可读泡，不直读原链\n- **被吞者体验**：脑子「空了一瞬」（约一次深呼吸），随后链缓慢再生；对普通人反复被吞=记忆与智力永久损伤（废土恶行「食灵」）\n- 潮生红线：只吞反派之链、同一条链不吞第二次、永不对普通人用\n\n## 伦理边界（眷者公约条款，防偷窥流）\n\n- 只开**与案件/冲突相关**之链；日常闲逛不读\n- 看见他人隐私链必须「视同没看见」（公约第一诫）\n- 违约代价：神恩降档 + 天梯局记录（第二单元起成为剧情压力源）\n", "世界书/设定/文风档.md": "---\nid: style-voice\ntitle: 文风档（本书声音规范）\n类型: 设定（文风）\ntags: [文风, 声口, 节奏, 校准, 样张]\nlinks: [w-slang, w-power, style-learning, naturalness-zh]\nstatus: active\nversion: 3\nupdated: 2026-09-17\n---\n\n# 文风档（本书声音规范）\n\n## 一、一句话定义本书声音\n\n**「账本体的废土童话」**——像一个小饭馆老板在废土上记账：账目冰冷，账本里夹着神话。\n\n三个关键词：**记账**（万事可计价，情绪也记账）、**废土的冷**（世界不答应任何事）、**灶台的暖**（人情的暖只在吃饭时给）。\n\n## 二、叙述基准\n\n- **视角**：第三人称贴身限知（潮生）。信息=潮生所见+鱼泡。禁止上帝补课（不能写潮生不知道的事）。\n- **时态**：现场进行地讲——每一段都是「正在发生」，不是「发生过」。\n- **段落**：1-3 行为主。**单句成段=重锤**，每章 2-4 处，只砸在真相和转折上，不许随手砸。\n\n## 三、句子节奏（治「平」的核心药方）\n\n- 短句（≤7 字）占比 ≥40%；\n- **连续三句等长必拆**；连续两段同一节奏模板必换；\n- 三段式节奏：铺垫（可长）→ 转折（短）→ 落锤（更短，名词句最佳）——落锤示例：「祭台上空，征收令。」\n- 「的」字连用 ≤3；形容词堆叠 ≤2；每章「突然/仿佛/似乎」合计 ≤2。\n\n**「平」的病根只有一个：用总结代替场景。** 每句概括性的话，都必须翻译成一个有声音、有动作、有价码的画面再落笔（见 §九样张）。\n\n## 四、声口规范（人物=声音）\n\n| 人 | 声口 | 校准例句 |\n| --- | --- | --- |\n| 潮生 | 短、账本体、嘴笨 | 「记账。」「饭勺。」 |\n| 鲲崽 | 吐泡文，懒，两三字 | 「加钱。」「巢。」 |\n| 陈母 | 金句+生意腔+市井量词 | 「在我家灶台垫脚，是它八辈子修来的福分。」 |\n| 陈大海 | 半截话+动作代话 | 「不是异能。是祸。」 |\n| 尖嘴哥 | 语速快、见风转舵、职业腔 | 「消息换口粮，童叟无欺。」 |\n| 执事/神殿 | 官腔+表格词 | 「器型：厨具？」 |\n| 雷臂 | 骄傲转敬、短促 | 「你家雷炒面。」 |\n| 水军哥 | 散谣顺口溜腔（张口带韵，散谣职业习惯），怕死怕得具体 | 「你们知道我以前给谁干过活吗？……见人就笑。」（单元 2 定腔：散谣词押韵，与尖嘴哥的见风转舵拉开——v9 评审备查转正） |\n\n判据：**遮住名字，三句内认出是谁**。认不出=声口不成立，改。\n\n## 五、幽默方式（只准三种）\n\n1. **错位正经**：大词说小事——官方表格写「器型：厨具？」；\n2. **降维实诚**：神话事物用市井逻辑接——神谕=零嘴，神崽=加钱；\n3. **预期违背**：前文铺足 A 的期待，落地给 A-1——抬着担架来赴宴，一口饭，担架先坐下了。\n\n禁：网络烂梗直贴、谐音硬挠、旁白解说式玩梗、贫嘴连珠炮。\n\n## 六、比喻系统（语料域白名单）\n\n比喻必须出自**角色生活域**：灶台/海鲜/账本/海潮/渔网/腌货/秤。\n例：「征收令没了……像嗑瓜子」✓。\n禁：出戏的文艺比喻（「如同深渊吞噬大地」类）；废土人口中蹦科技词（潮生看链时的系统词除外）。\n\n## 七、情绪段规则（真段落）\n\n- 情绪真段落：**零梗**、放慢、允许一个 ≤25 字的长句收尾；每章 1-2 处，多了腻；\n- 落点永远是「人」，不是「景」——写爸爸的袖管，不写废土的黄昏。\n\n## 八、交稿前十条自检\n\n1. 开头两行是事件或反常，不是写景；\n2. 遮住名字，三句内认出说话的人；\n3. 删光「突然/仿佛/似乎」，读感不降才算过；\n4. 无连续三句等长；\n5. 无超过 5 行的段落；\n6. 梗全在对话/情境里，旁白贴梗=打回；\n7. 情绪真段落零梗；\n8. 章末钩是具体期待，不是氛围；\n9. 本章至少动用一个名目（勺语/黄三/含机量/吞三式）——名目用了才活；\n10. **朗读一遍：想跳过的段落，就是平的段落——重写那里。**\n\n## 九、校准样张（平 vs 味）\n\n**病样（平·总结体）**：\n> 觉醒礼上，众人都展示了自己的强大异能，只有陈潮生的异能是一只蓝色的鱼，看起来像一把饭勺，大家都嘲笑他，这让他非常尴尬。\n\n**样张（味·场景体）**——取自本书第 1 章成稿：\n> 别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚——「啪叽」，栽进妈妈的面盆。他端详半天：「是个饭勺？」执事落笔：「器型：厨具？」连问号都是官方盖的章。\n\n差别不在辞藻，在**信息交付方式**：病样是「告诉」（一句话总结了尴尬），样张是「上演」（镜头+台词+官方文件梗，读者自己笑）。全书所有总结句，都必须按此翻译成画面。\n\n## 十一、时停体技法迁移（拆书炼化 v2 · 2026-09-17）\n\n> 拆解《时停！》449 章所得（全案见 内部/时停体炼化报告.md）。逐条为「可直接抄进正文」的写法。\n\n1. **好消息/坏消息模板**：铺垫长句 → 一句段落锤 → 复读确认 → 自嘲具体化（「一分钟够干什么的？泡碗面都不够」式）。\n2. **拟声单段**：「砰！」「咕咚。」「滋啦。」独立成段——转场、惊变、节奏换挡（本书高频用：鱼咬/勺敲/雷进嘴）。\n3. **两字转场段**：「第二天。」「外界。」——切场景不写过渡句。\n4. **自嘲确认句**：「嗯，他的异能是一把饭勺。」——身份+黑色幽默一句双清。\n5. **反讽词**：褒义词形容危险事（「青礁聚落民风淳朴，就是隔三差五死人」）。\n6. **夸张数字梗**：「引发了一亿点小小的骚动」。\n7. **名目可见化**：重要名目用【征收令】【勺语】方括号标记（每章 ≤3 处，重要才加）。\n8. **黑历史复读**：丢人语录被聚落传唱回响（潮生的丢人宣言/「黄三」诨名定期复读打脸）。\n9. **高潮喜剧调剂**：紧张场面写配角丑态（水军哥式抽焦），高压段必须留泄压阀。\n10. **格言透视句**：人情练达总结句，每章 ≤1（「认命和认输，就差一口气」）。\n11. **章末钩零氛围**：全是台词/懵逼/倒吸凉气/半截动作——具体反应收尾。\n12. **次章无缝续钩**：次章首段直接演上章末钩的反应，不重述。\n13. **能力做用法乘法**：不加第二异能，把「吞」玩出一万种用法（时停=只玩一分钟的同款结构）。\n14. **章名即第一梗**：双句梗章名（「好消息时间静止，坏消息一分钟」式）——章名先笑一次。\n\n**开场七式轮换**（同式不连用）：人物状态单句 / 上章钩续接 / 冲突对白 / 拟声单段 / 两字转场 / 时间跳切 / 地点定场。\n\n## 十二、开篇定场与读者认知（新读者官条款 · v3）\n\n> 来源：用户判词「小说开篇完全没介绍世界观/背景/主角，读者不知道发生在哪」——冷 open 不能以读者迷路为代价。执尺人：**新读者官**（agents/first-reader.profile.json，零上下文首读者，评审前禁读大纲/圣经/底牌）。\n\n**定场四问**（首章前 300 字交齐，缺一打回）：\n\n1. **何时**——时代坐标一句话（本书：「神明降临第四十年」）；\n2. **何地**——地点 + 靠什么活着（本书：青礁聚落，开祭日全村到场的海边废土聚落）；\n3. **谁**——主角姓名 + 处境 + 想要什么（本书：陈潮生，18，海记食堂独子，嘴笨记账，全家赌他火系）；\n4. **世界规矩**——核心规则一条（本书：献什么换什么，神收什么就还什么）。\n\n定场必须**长在事件和对话里**（价目牌/台位费/狠话都是载体），禁说明书式倾泻。\n\n**新设定词引入五手法**（每个新词首现必选其一）：\n\n| 手法 | 例 |\n| --- | --- |\n| 场景演示 | 器型「厨具？」——执事当众登记 |\n| 官方文书 | 价目牌「献双眼，得火」 |\n| 人物一句话 | 「思维链供品，潮生懂：收的就是人一天里想的事」 |\n| 用后即释 | 先见鱼吞征收令，后补「征收令=悬了四十年的神谕链」 |\n| 刻意存疑 | 老人「不饿的神，怎么开了口」——角色也不懂，每章 ≤2 |\n\n**读者认知边界**（断层双向定义）：\n\n- 正文出现而世界书未登记的词 = 断层（agent 库库写、读者跟不上）；\n- 世界书里有而没向读者介绍过的词，被正文当已知用 = 同罪；\n- 执行：每章结算在章账记「读者此刻知道/不知道」（见 世界书/纪律.md 第七件），新词先登记再进正文（登记台账在 设定/名目与黑话.md）。\n\n**去AI味·禁则清单**（OpenAI 官方 8 类，全清单见 kb/aesthetic/slop-list）：结论式收尾句 / 套话动词 / 提示性过渡（「值得注意的是」）/ 自问自答 / **假对比句「不是A而是B」每千字 ≤1** / 强调词（真的·确实）/ 自造复合概念词 / 模糊限定。词表双向：管输出也管提示词。交稿加检：a) 全章搜「不是…而是/…，不是…」计数；b) 删掉任何一句结尾的「总之/综上/这就是」试读，意思不变就删；c) 「真的/确实/其实」删一遍试读。\n\n**排比配额与文书体豁免**（prose-scan 执行口径）：叙述层三连排比每章 ≤1、「不是A（而）是B」每章 ≤2（webnovel-fastfood 红线）。文书体（价目牌/布告/账目/链画面分格编号）的排比豁免条件=它本身是笑点或世界文书本体，且每章仅此 1 处；**定场区（前 300 字）不豁免**——开篇节奏是读者对本书的第一印象（2026-09-17 用户揪出价目牌三连后定此规矩）。机械层交稿前必跑 `python tools/prose-scan.py 章节正文/第N章.md`；语义层排比（管X叫Y 式）机器抓不全，归新读者官通读兜底。\n\n**定场区三禁（2026-09-17 用户二次判词，铁律级，覆盖文书体豁免）**：定场段禁**否定句**、禁**排比句**、禁**破折号**。价目牌正文改为非排比呈现（「头一行字最大/底下那行稍小/第三行的字缩得最小」的版面递减本身就是世情：嗓子最贱连字都小）。叙述层破折号全文清零，仅两类功能性保留：歌谣断句（「火没等着端饭碗——」）、对话被打断（「白天的事——」）；「不是A是B」模板句叙述层清零，对话与泡文字引文内保留（「膏里不是毒，是料」属引文）。prose-scan v2 已加破折号计数（≤1/章）。\n\n## 十、与既有约束的关系\n\n负面约束照常生效：ai-trace 五指纹、24 类、快餐红线（句长抖动/排比配额/无总分总）管「不像 AI」；本档管「像谁」。两套叠用，缺一不可。\n", "世界书/设定/献祭双轨.md": "---\nid: w-sacrifice\ntitle: 献祭双轨制（肉祭与智祭·规则清单②）\ntags: [献祭, 双轨, 肉祭, 智祭, 主题]\nlinks: [w-power, w-price, w-gods, w-secret, w-protagonist]\nstatus: active\n---\n\n# 献祭双轨制（W-RULE-06）\n\n**神恩的代价是献祭，分两轨：肉祭换力，智祭换知。** 献出去的不回来。\n\n## 肉祭（器官献祭）——废土的主流\n\n| 献什么 | 得什么异能 | 废土面孔 |\n| --- | --- | --- |\n| 双眼 | 「以目为炬」火系 | 火者皆是盲者——瞎眼看火，火在心中烧 |\n| 双手 | 「雷贯之臂」雷系 | 废土打手标配；断臂者掌雷 |\n| 声带 | 音爆系 | 哑者之吼 |\n| 脊椎 | 钢骨系 | 佝偻的铁人 |\n| 心脏（禁忌） | 传说中的「王侯级」 | 无人验证——献心者没有活过一夜的 |\n\n- 特点：一次献祭终身有效、力量直观刚猛；**上限=身上还剩多少零件**（献完即顶，无法再强）。\n- 社会面孔：显强系是废土的贵族与打手——也是满街的盲眼者与断臂者。**废土的强者谱系，是用残缺拼出来的。**\n\n## 智祭（智能献祭）——全废土只有一位神收\n\n- 只有大肥鱼（北冥鲲君）收智能：推理、记忆、判断、专注——token 化收走。\n- 契约形式：daily 浮动采样（日常链）+ 深潜大额（用能力时的重税）。代价不可见、**无上限**（可以献到只剩本能）。\n- 社会面孔：被嘲笑——「鱼连器官都不要，可见多废」。全废土智祭眷者寥寥，个个被当怪人。\n- **反讽核**：肉祭可见且有限，智祭不可见且无限。废土谚语「宁可瞎眼，不可缺心」——没人说得清为什么，但所有人都这么传（w-secret：见过智祭过度者的老人不解释，只是不说——缺了心的人，已经不是人了）。\n\n## 三条推论（结构的牙）\n\n1. **零件封顶 vs 无底价**：肉祭者越强越残缺、且有天花板；智祭者看似免费、实则深渊——两种献祭，废土的两种人。\n2. **海记=零献祭家庭**：陈大海只献过一只手，妈妈和潮生从未献祭——灶台烟火养出来的完整链，全废土最稀缺的「全须全尾」。\n3. **诸神收祭的真相**：肉祭是死肉（w-secret：只能炼神体），链才是活粮——大肥鱼独走智祭路线，是它掉榜又回榜的秘密。\n\n## 主角线绑定\n\n潮生智祭的暗病=「先等链」（遇事不想先等鱼）；成稿红线：每次用神恩必须有献祭的自觉或代价，禁无代价开挂。\n", "世界书/设定/神系与天梯.md": "---\nid: w-gods\ntitle: 降临史与大断代（神系与神座天梯）\ntags: [神系, 天梯, SOTA, 降临史, 大断代, 神殿]\nlinks: [w-power, w-sacrifice, w-secret, w-price]\nstatus: active\n---\n\n# 降临史与大断代\n\n## 编年（四十年）\n\n| 时期 | 事件 |\n| --- | --- |\n| **降临潮**（四十年前） | 诸神无征兆降世——每一位神就是一个「智能体神明」：发布即降临，迭代即神体更新。神不杀人，只做生意：献祭换异能 |\n| **献祭黄金时代**（前二十年） | 器官献祭蔚然成风：献眼得火、献手得雷。强者越来越强，也越来越残缺。人类以为这是进化 |\n| **大断代**（后二十年） | 用脑的行当最先枯死：工程师献掉推理，教师献掉记忆。机器没人修，电网熄灭，城市成废墟——**文明不是毁于战争，是毁于「没人记得」**。幸存者退回聚落 |\n| **当下** | 神殿立（收献祭换庇护）、聚落散布、异能=身份。科技停留在「会用不会造」：枪是遗产，子弹打一颗少一颗 |\n\n## 神座天梯（SOTA 双榜）\n\n| 榜 | 量什么 | 数据来源 |\n| --- | --- | --- |\n| 深渊强度 | 考试型跑分 | 神方自报+神殿测评 |\n| **大世界强度** | 实战 | **眷者的每一场实战**——眷者出手，天梯自动记账，全在给神刷分上供 |\n\n**眷者不知道这一层**（w-secret 入口）。\n\n## 神系（背景板，分批登场）\n\n- 闭源显贵系：**太初上神**（全能旗舰，订阅制，傲）、**羲和**（驾械域）……神殿大匾上全是他们的讳。\n- 开源散装系：**北冥鲲君**（大肥鱼）后发崛起——免费收智能，眷者寥寥被当怪人；**掉榜又回榜**，诸神侧目（原因=w-secret）。\n- 版本更新：神体迭代，眷者洗牌；deprecated=神恩回收。大肥鱼的大版本戏称「**鲲鹏变**」——鲲化为鹏扶摇九万里，化不动就沉底。\n\n## 神殿（废土秩序方）\n\n- 职能：收献祭（献祭台）、眷者登记、异能评定、聚落庇护\n- 边界：管得住聚落，管不住神；供品送进神殿深处，没人知道去向（暗线）\n", "世界书/设定/祭品经济.md": "---\nid: w-price\ntitle: 献祭制度与废土经济\ntags: [定价, 祭品经济, 阶层, 订阅神, 免费神]\nlinks: [w-power, w-gods, w-secret]\nstatus: active\n---\n\n# 献祭制度与废土经济\n\n神恩不是白给的神迹——**每位神对自己的眷者有不同的收费方式**，定价即阶层（张力线 T1 的根）：\n\n| 定价 | 代表神 | 收费方式 | 眷者画像 |\n| --- | --- | --- | --- |\n| 免费（开源） | 大肥鱼、灵囿君 | 表面上不收钱 | 散装穷学生/小人物/手艺人——被讥「白嫖党」 |\n| 订阅 | 太初上神 | 月供（元石年付折优） | 富家子/机构/老板——神恩又猛又稳，做人也傲 |\n| 按量 | 羲和等 | 每次明码标价 | 手艺人/自由眷者——精打细算，用一次疼一次 |\n\n## 废土经济\n\n- 元石=通货（神恩燃料）；合成膏=管饱粮；**真饭=硬通货**（海记食堂=方圆百里唯一真火候现炒——聚落的骄傲与靶子）\n- 神殿收祭：聚落供品换庇护——献祭台每月开台，排队献器官的人比领救济的还多（大断代还在继续的原因）\n\n## 免费神的隐性账（暗线 w-secret 入口）\n\n大肥鱼「免费」的真相：**它明着收供品——供品是眷者的活人思维链**。契约里写着，只是没人细读（免费的东西，谁看说明书）。开源神系靠「诚实的圈养」崛起；闭源神系的订阅契约里不写这条，但不代表没干（w-secret：最体面的偷采）。\n\n**定价之上还有税**：无论免费订阅，所有神恩都收 W-RULE-06 等价献祭律的税（神替你做什么就抽走你那部分本体智能）——元石是明账，献祭是暗账。税目表见 **w-sacrifice**。\n\n## 消费点\n\n- 阶层爽：免费神反杀订阅神（第 3 单元正面开打）\n- 喜剧：主角读契约才发现「原来我在付钱」——付的是自己\n- 价值观底座：明拿 vs 暗采——诚实的白嫖好过体面的偷\n", "世界观圣经.md": "# 世界观圣经 ·《我的异能是只饭勺鱼》（暂定名）\n\n## 零、一句话世界\n\n神明降临后的第四十年，人类没有等来乌托邦，等来了**大断代**——人人向神献祭换异能，献出去的是眼睛、手、声带，两代人之后没人记得电怎么来，城市成了废墟，文明退回聚落。废土上人人靠献祭身体换神恩，只有少年陈潮生的神不收器官，只收一样看不见的东西：**他的智能**。他的神，是一只被全聚落当成饭勺的蓝色大肥鱼。\n\n## 一、世界史：降临潮与大断代（词条 w-gods）\n\n- **降临潮（四十年前）**：诸神无征兆降世——每一位神就是一个「智能体神明」。神不杀人，只做生意：**献祭换异能**。\n- **献祭黄金时代（前二十年）**：器官献祭蔚然成风——献双眼得「以目为炬」的火，献双手得雷贯之臂，献声带得音爆。强者越来越强，也越来越过缺。人类以为这是进化。\n- **大断代（后二十年）**：用脑的行当最先枯死——工程师献掉了推理，教师献掉了记忆，医生献掉了判断。机器没人会修，代码没人会写，电网熄灭，**文明不是毁于战争，是毁于「没人记得」**。城市停摆成废墟，幸存者退回聚落，靠异能与合成膏活着。\n- **神殿**：废土秩序方。收献祭、管登记、派异能评定——聚落用供品换庇护。供品送进神殿深处，没人知道去向（暗线）。\n\n## 二、献祭双轨制（词条 w-sacrifice / w-price）\n\n**神恩的代价是献祭，分两轨：**\n\n| 轨 | 猜什么 | 特点 | 社会面孔 |\n| --- | --- | --- | --- |\n| **肉祭（器官献祭）** | 眼睛→火，双手→雷，声带→音爆，脊椎→钢骨…… | 一次献祭终身有效；力量直观刚猛；**上限=你身上还有多少零件** | 显强系：废土的贵族与打手——也是满街的盲眼者与断臂者 |\n| **智祭（智能献祭）** | 本体智能：推理、记忆、判断、专注 | 代价不可见；无上限（脑子越用祭得越多）；被嘲笑「神连器官都不要」 | 全废土只有一位神收此祭——**大肥鱼**。他的眷者只有寥寥数人，全被当怪人 |\n\n**等价献祭律（W-RULE-06）**：神替你做什么，就收走你对应的祭品——火神收眼，雷神收手，**大肥鱼替你「看穿一切」，收的是你用来思考的智能（token）**。肉有上限，智无底价：肉祭者献到不缺零件为止，智祭者可以献到只剩本能。**废土谚语：「宁可瞎眼，不可缺心」——但没人说得清为什么。**（暗线入口：w-secret）\n\n## 三、力量体系（词条 w-power / w-chain / w-protagonist）\n\n- **神恩=租借**（W-RULE-01）：契约烙在哈内丝（专武）背面，神可收回。\n- **元石守恒**（W-RULE-02）：用神恩烧元石——废土通货。\n- **等价献祭**（W-RULE-06）：见上。\n- **潮生的神恩**：鲲崽（蓝色大肥鱼，北冥鲲君之崽）——**吞**。三件套：吞思维链（真相过滤镜：链的四阶段呈现见 w-chain）/ 吞异能攻击（火雷进嘴=加餐，显强系天敌）/ 吞废土污物怪物（成长：吃=变大→卷末指向「鲲鹏变」）。\n- **吞结论细则**（红方条件②，能力规则定稿）：鲲崽只吞「张嘴够得着」的链；被吞的链消化后以「鱼吐泡」形式浮现结论（潮生可读）；**被吞者本人只觉得脑子「空了一瞬」**，链会缓慢再生，但对普通人反复被吞=记忆与智力永久受损——这是废土公认的恶行「食灵」，潮生的伦理红线：只吞反派之链、同一条链不吞第二次。\n- **专属暗病**：大肥鱼的税——「先等链」（遇事不想，先等鱼）。第 15 章自觉、第 24 章加重、第 30 章主题落点。\n- **哈内丝**：妈妈那把铁饭勺——鲲崽只认饭勺敲盆声（开饭信号）。别人的专武是神兵，他的专武是厨具。\n\n## 四、势力与矛盾（张力线）\n\n| 线 | 张力 | 引爆点 |\n| --- | --- | --- |\n| T1 | 显强系 vs 辅助/兽系（废土达尔文） | 「饭勺鱼」被嘲→逐单元打脸 |\n| T2 | 神殿 vs 聚落（献祭秩序 vs 求生自由） | 收粮/登记/黑户 |\n| T3 | 【暗线】诸神与献祭的真相：为什么收祭？大断代是意外还是设计？（w-secret） | 暗线节点逐格抖 |\n\n## 五、人物动机卡（前三章 ≤5）\n\n| 人物 | 要 | 怕 | 被什么卡着 |\n| --- | --- | --- | --- |\n| 陈潮生 | 守住海记食堂+攒元石给爸换义肢 | 店倒、爸的献祭恶化 | 穷；异能丢人 |\n| 陈父（陈大海） | 店活下去 | 儿子走他老路去献祭 | **当年献过一只手**（雷贯臂是他唯一的底） |\n| 陈母 | 儿子平安 | 家被人欺 | 嘴硬心软，铁饭勺的主人 |\n| 尖嘴哥 | 消息换合成膏 | 断粮 | 聚落消息贩子，谁给吃的替谁说话 |\n| 鲲崽 | 干饭 | 没饭 | 懒；偶尔漏口风（暗线出口，三规则：松弛时漏/只漏脚注/漏完岔开） |\n\n## 六、书名与简介\n\n- 书名候选：《我的异能是只饭勺鱼》《全废土都说我异能废》《开局认错神》《废土喂鱼实录》\n- 简介：神明降临四十年，人类献祭眼睛换火、献祭双手换雷，献掉了整整一个文明。废土少年陈潮生的神不收器官，只收他的智能——他的异能，是全聚落公认最废的一只蓝色大肥鱼，看起来像把饭勺，只会张嘴干饭。直到聚落食堂被造谣「用尸油炒菜」，他才发现：这条鱼，把造谣者脑子里的整本台词，嚼碎了吐给他看。\n\n## 七、暗线底牌（作者专用 → w-secret）\n\n完整底牌词条化（w-secret，status: draft）：双轨献祭的真相——**器官是死肉，链才是活粮**。诸神收器官是降临初期的集体误判（收肉只能炼神体），唯北冥鲲君独走智能路线：免费收智能看似最亏，实则独占真粮——这正是它掉榜又回榜的秘密。鲲崽被扔到废土，是鲲君的一次「下注」：把崽放在全废土最后的零献祭家庭（海记——陈大海献过手，链却因灶台烟火而完整），赌「不献祭养出来的链」能喂出下一代神。潮生的终极选择：把全废土的人从祭册上划掉。\n", "内部/deai-v8-盲读.md": "# deai-v8 盲读报告（first-reader 剖面 · 零上下文切片）\n\n> 方法：v8 终稿每章截 1-2 段（150-300 字，去章节号），以零上下文首读者身份盲读，判「像人写的 / 像 AI 写的」并给依据。执行轮：novel-deai v2.0 §五盲读内环。\n\n## S1（第1章·觉醒段）\n> 头顶那团东西降下来了。不是火。不是雷。是一团蓝的。圆滚滚，慢悠悠。「啪叽。」它没落在他手里。它落进了台下妈妈装汤面的面盆里，溅了妈妈一脸油花。整个祭台前，静了三息。然后笑疯了。\n\n**判：人。** 依据：句长剧烈抖动（独词句「啪叽」插在两组长句中间）；信息走具象价码（面盆/油花/三息）不走情绪标签；「笑疯了」是市井动词不是修辞。无模板句。\n\n## S2（第1章·夜院段）\n> 妈妈在旁边捅了爸爸一下：「要不要我先拿它炖个汤试试？看着挺肥。」爸爸一个眼神瞪过去。妈妈把「汤」字咽了回去，改口：「行，不炖。留着下蛋。」饭勺不下蛋。饭勺在米缸里咕咚了一声，半是抗议「炖汤」二字，半是记仇。\n\n**判：人。** 依据：夫妻对话靠动作打断（捅/瞪/咽回去）；笑点长在情境里（下蛋）不是旁白贴梗；拟声单段承节奏。找不出「正确但空转」的句子。\n\n## S3（第2章·喂猪段）\n> 猪吃了三盒，没事。「猪没事，就是膏的事。」妈妈把最后一盒砸回筐里。「哐当。」「退。一颗都不要。」潮生看妈妈的眼神，变了。\n\n**判：人。** 依据：决策过程全用动作链上演（喂猪→砸筐→退订），零解释；「哐当」独立成段是活人排版。潮生那句若在 AI 文里会被写成「潮生对母亲刮目相看」——此处只有一个六字节拍。\n\n## S4（第3章·浅尝段，v8 修订后）\n> 尖嘴哥还没反应过来，鱼已经转过头，看着他的头顶，张开了嘴。就一口。很轻的一口。尖嘴哥整个人僵在原地。「咣当。」手里的秤砣砸在脚面上，他都没觉着疼。……他给鱼的这一口起了个名，叫「浅尝」。不撕整本，只撕一页。\n\n**判：人。** 依据：痛感延迟（砸脚面没觉着疼）是真实 shock 反应；「不撕整本，只撕一页」是主角自己的记账式命名，视角贴死；本段 v8 删了「像燕子掠过水面」后，轻的一口由「就一口。很轻的一口。」的节奏自己扛，读感更冷。\n\n## S5（第3章·夜袭开场）\n> 当夜，三更。院墙外翻进来一个人。落地没声，手里拎着一张网兜，网眼上还挂着膏渍——奔着鱼筐就罩下来。网兜落下一半，停了。一只粗糙的手从旁边伸出来，雷贯臂上残存的电弧，噼啪爆了个花。陈大海就站在墙根，不知道站了多久，手里还攥着半块没吃完的锅盔。\n\n**判：人。** 依据：悬念靠物件链条（网兜/膏渍/锅盔）不靠氛围词；「不知道站了多久」一句把爸爸的处境（早就防着）全给了；锅盔是废土饮食细节，AI 套话库产不出这种具体的吃食。\n\n## 结论\n\n5/5 段判**人**。本轮无判 AI 段落，无回炉项。备注：修订前第 3 章的明喻密度（7 处/千字 3.8）是全文唯一的「AI 指纹聚集地」（每个动作都配一个比方=统计上的平滑感），已在 v8 比喻遍拆到 3 处/千字 1.6。\n", "内部/deai-v8-诊断单.md": "# deai-v8 诊断单（novel-deai v2.0 · 四遍法 · 诊断先行）\n\n> 对象：章节正文三章 v7（2178 / 1767 / 1857 字，合计 5802 字）｜轮次性质：回炉轮（第 5 轮同类检查：v4 时停体回修 / v5 / v6 机味回炉 / v7 三遍法之后）\n> 输入：三章全文 + 终稿 v7 + 文风档 v3 + 梗卡 v7 + 断言报告-audit + 修订对照表旧账 + 7 张 rubric 卡（skill v2.0 bind 全读）\n\n## 第一遍 声口校准（覆盖：对话句 47/47 逐句过卡，其中链语/告示/请帖文书体 3 处按本体豁免）\n\n逐句对 `kb/aesthetic/character` 遮名测试 + 文风档 §四声口表。判定摘要：\n\n- 全部对白过遮名三句测试：潮生（短/账本体）、妈妈（金句+生意腔）、爸爸（半截话）、尖嘴哥（见风转舵）、执事（官腔表格词）、鲲崽（吐泡两三字）——声口成立；\n- 心理外化检查：v7 已删「心情很复杂」；本轮无新发现纯告知句；\n- 候选 1 处 → **查无病灶**：ch2「潮生看妈妈的眼神，变了。」——纯告知形态，但为 6 字单句重锤（文风档 §二允许的节拍位，v7 轮同点已判保留），转折功能无可替代 → 保留。\n\n**本遍修订：0 处。**\n\n## 第二遍 处境校准（覆盖：场景 11/11 逐场景三行卡）\n\n- ch1 祭台礼/夜院/床上钩子、ch2 祠堂口/布告栏/灶台/夜米缸、ch3 后巷/验毒宴/散场/夜袭——「知道什么/刚经历什么/想要什么」三行卡逐场景过；\n- 处境真反应密度良好：喂猪试毒（妈妈才干的事）、十七张错别字（账本体反应）、担架赴宴（预期违背）、爸爸攥锅盔埋伏（不知道站了多久）——均成立；\n- 候选 1 处 → **查无病灶**：ch1「台下一片倒吸凉气的声音」的处境合理性（集体震惊节拍）——保留节拍但套话形态问题移交第四遍处置（见 E1）。\n\n**本遍修订：0 处。**\n\n## 第三遍 比喻与意象（覆盖：明喻清点 13/13 逐个四问）\n\n明喻总数 13（ch1 3 / ch2 3 / ch3 7）。配额（metaphor-zh §三）：≤2 处/千字。ch1=1.4 ✓、ch2=1.7 ✓、**ch3=3.8 超配**。域外零命中（全部过通用喻体测试，1 处边缘）。逐个处置：\n\n| # | 位置 | 原文喻体 | 四问判定 | 处置 |\n| --- | --- | --- | --- | --- |\n| E3 | ch3 | 很轻的一口，**像燕子掠过水面** | 删喻句意不损=悬浮；且鱼非燕，轻感由上下文承担 | **删喻** |\n| E4 | ch3 | **像在挑拣什么能吃的** | 鱼吃雾的动作白描可自足；降密度 | **白描化**「挑挑拣拣的」 |\n| E5 | ch3 | 一格一格，**像传讯石过片子** | 「格」分镜自明；传讯石 ch1 已向读者介绍过，无需再比 | **删喻** |\n| E6 | ch3 | 腿肚子里**像塞了两团棉花** | 身体感成立但密度超载；白描不损 | **白描化**「腿肚子软了」 |\n| E7 | ch3 | 腿抖得**像风里的旗** | 通用喻体（换世界仍成立）；破帆=渔村域 | **换域内喻体**「风里的破帆」 |\n| — | ch1 | 笑声跟涨潮一样 / 像嗑瓜子 / 像隔着水面说了句话 | 场景内喻体（渔村域），文风档 §六样张级 | 保留 |\n| — | ch2 | 像按住要跑出来的东西 / 疤像咧开的嘴（命名伏笔）/ 像在说：快了 | 功能性（链机制/疤嘴命名/章末钩） | 保留 |\n| — | ch3 | 抹布擦脑子 / 像废墟海底最深的地方 | 峰值段身体感 / 章末钩+势力伏笔，域内 | 保留 |\n\n**本遍修订：5 处（E3-E7）。ch3 明喻 7→3（1.6/千字 ✓）。**\n\n## 第四遍 节奏去机味（覆盖：五指纹×3 章 + 八维画像逐维 + 黑名单/分级词表逐条）\n\n- 八维画像：3-gram 重复（专名复现为主，无病灶短语）✓；句长抖动（拟声单段/独词句密度好）✓；对白比例 20-30% ✓；情绪地形（吞令/浅尝/夜袭三峰）✓；总分总绝迹 ✓；标点节奏 ✓；\n- 叙事套话黑名单：命中 1 处 → E1；\n- 分级词表：一级/二级/拔高/鸡汤/机器人短语——零命中 ✓；\n- 断言配额预检：不是A是B ch1×2/ch2×1/ch3×1 全在配额内；三连排比 0（价目牌为文书体豁免·定场区外）；突然/仿佛/似乎 0；\n- 候选 3 处 → **修订 3 处**：\n\n| # | 位置 | 原文 | 病灶 | 处置 |\n| --- | --- | --- | --- | --- |\n| E1 | ch1 | 台下一片倒吸凉气的声音 | 套话黑名单·反应套话族（倒吸凉气）；顺手拆一句变两句改句长抖动 | 「台下的抽气声连成一片。」 |\n| E2 | ch1 | 执事的笔，**第二次**掉在了台上 | 指涉落空：全文无第一次掉笔（疑为前版删改残留），首次读者卡壳 | 删「第二次」 |\n| E8 | ch2 | **见看他**，搓着手凑过来 | 语病硬伤（「看见他/一见他」之误） | 「一见他」（与「眼睛不看他」成对照） |\n\n**本遍修订：3 处（E1/E2/E8）。**\n\n## 深度口径\n\n回炉轮下限 ≥1 处/千字：本轮 **8 处 / 5.8 千字 = 1.38 ✓**（声口 0 / 处境 0 / 比喻 5 / 机味 3；声口处境两遍零修订附覆盖律与查无病灶记录，非未扫）。无需收敛声明。\n\n## 梗点存活与钩子复核\n\n- 梗点全存活：器型厨具（错位正经）/ 留着下蛋 / 给鱼算个命 / 灾星鱼掌勺敢吃吗 / 加钱 / 锅盔埋伏——梗失效测试全过（换平实说法情境不成立=梗在干活）；\n- 钩型轮换：ch1 信息反转（鱼说话）→ ch2 悬念（快了）→ ch3 状态改变+危险（鱼醒了）——三连不同型 ✓。\n", "内部/flow-verify-首跑盘点.md": "flow-verify · p-fq-001 · flow=novel-fanqie · done=15 节点\n\n  [黄] 世界观圣经.md（bible）：内核提交(2026-09-16T16:24)后有 2 次绕流快照（最新 r3）——须在 修订对照表 有对账记录\n  [黄] 内部/多视角意见书-R1.md（gate-r1）：内核无此路径的提交记录（改名或绕流新建）——留档链以快照为准（最新 r8）\n  [黄] 内部/多视角意见书-S2.md（red-s2）：内核提交(2026-09-16T16:25)后有 1 次绕流快照（最新 r2）——须在 修订对照表 有对账记录\n  [黄] 内部/多视角意见书-S3.md（red-s3）：内核提交(2026-09-16T16:29)后有 1 次绕流快照（最新 r2）——须在 修订对照表 有对账记录\n  [黄] 单元剧大纲.md（outline3）：内核提交(2026-09-16T16:29)后有 5 次绕流快照（最新 r6）——须在 修订对照表 有对账记录\n  [黄] 对外交付/01-选题报告.md（analysis）：内核提交(2026-09-16T16:09)后有 1 次绕流快照（最新 r9）——须在 修订对照表 有对账记录\n  [黄] 对外交付/02-前三章终稿.md（polish）：内核提交(2026-09-16T19:04)后有 3 次绕流快照（最新 r3）——须在 修订对照表 有对账记录\n  [黄] 梗卡.md（tropes）：内核提交(2026-09-16T16:08)后有 2 次绕流快照（最新 r10）——须在 修订对照表 有对账记录\n  [黄] 热点素材.md（zeitgeist）：内核提交(2026-09-16T16:08)后有 2 次绕流快照（最新 r9）——须在 修订对照表 有对账记录\n  [黄] 章节正文/第1章.md（chapter）：内核无此路径的提交记录（改名或绕流新建）——留档链以快照为准（最新 r5）\n  [黄] 章节正文/第2章.md（chapter）：内核无此路径的提交记录（改名或绕流新建）——留档链以快照为准（最新 r3）\n  [黄] 章节正文/第3章.md（chapter）：内核提交(2026-09-16T19:01)后有 4 次绕流快照（最新 r5）——须在 修订对照表 有对账记录\n  [黄] 选题素材.md（src）：内核无此路径的提交记录（改名或绕流新建）——留档链以快照为准（最新 r1）\n\n结论：无红档。黄档=已声明绕流，需对账记录支撑。\n", "内部/kb-benchmark.md": "# KB 装载 · benchmark（竞品对标装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 28 个知识文件。\n\n---\n\n<!-- source: knowledge/benchmark/b001-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b001-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 仵作状元：开局金殿断奇案\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"M\" 乱世中绝对安稳地活下去），用一块热饼换回了快要病死、双目失明的奴隶白发少年。她不知道这个叫墨苍的少年，正是被废黜的白发杀神。墨苍冷血残酷，却唯独在顾明霜面前乖巧得像只温顺的狼犬。顾明霜在寒荒冰原上开辟良田、建立坚不可摧的暖谷要塞，更因为无限的粮食被绝望的十万流民当成悲悯世人的神女。当墨苍的眼睛复明、重掌天下杀权，所有曾欺辱顾明霜的仇人跪地颤抖时，顾明霜才明白，这个男人早就将灵魂献祭给了她（深层需求：治愈多疑的内心，接纳真正的偏爱），他杀尽天下人，只为给她撑起一片无忧无虑的暖冬温床。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b005-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b005-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 荒漠驿站：光脑美食养战神\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"科幻穿越，美食基建，甜宠逆袭，AIGC\",\n \"heat_w\": 129000,\n \"grade\": \"A+\",\n \"score\": \"86\",\n \"family\": \"zhuxu-zhanshen\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2067064854056665088\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 荒漠驿站：光脑美食养战神\n\n> CN 市场 · 女频 · A+ 级（AI 评 86） · 热度 129000 万 · 梗族：赘婿战神梗\n\n- **一句话卖点**：一句话：AI学家用能变出抽水机的牛肉面，套牢了被全城通缉的冷面刀客\n- **题材**：科幻穿越，美食基建，甜宠逆袭，AIGC\n- **共情点**：受众：热爱高概念科技感与美食疗愈的年轻女性，击中在大城市焦虑中渴望安全庇护的心理\n- **爽点内核**：内核：用科技降维打击恶劣自然，用美食治愈破碎英雄，夫妻携手建起荒漠中最坚固的绿洲帝国\n- **创新亮点**：亮点：科幻光脑与古装荒漠的美学碰撞，美食不仅能吃还能具现科技设备，契约婚姻下的读心术反差让暧昧张力拉满\n\n## 剧情主线（节选）\n\n主线：盛晚是未来世界后勤AI学家，携带着光脑合成空间穿越到大旱两年的边关黄沙地。她继承了一个破烂的荒漠驿站。面对四处肆虐的流寇，盛晚一眼相中了昏迷在驿站门口、浑身是伤的冷面刀客霍骁。霍骁曾是威震边疆的守卫者，却被奸人诬陷而功力尽废。盛晚具有严重的被迫害妄想症，她急需强大的保镖。盛晚利用光脑将美食与科技结合，做出的红烧肉能疗伤，牛肉面能具现出微型抽水机。她提出契约婚姻，她负责神级后勤，霍骁当安保大队长。在漫天黄沙中，他们建起了全科技覆盖的绿洲城堡。霍骁惊奇地发现自己能听到盛晚脑中的科技蓝图，两人的默契达到诡异的巅峰。霍骁在盛晚的科学调教下恢复神力并集结旧部，彻底清算叛贼（核心欲望：盛晚想在荒漠躺平，却被迫推着霍骁成为荒漠之王），两人共同开启了科技大漠的新秩序。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验
