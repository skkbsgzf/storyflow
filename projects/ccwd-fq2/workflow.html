<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流画布 · 曹操穿越武大郎 · ccwd-fq2</title>
<style>
*{box-sizing:border-box}
:root{--diff-del-bg:rgba(122,72,46,.12);--diff-del-bd:#9a5b38;--diff-del-ink:#6e3f26;--diff-add-bg:rgba(63,109,74,.12);--diff-add-bd:#4a7a58;--diff-add-ink:#3f6d4a;--r-s:4px;--r-m:7px;--r-l:10px;--ctl-h:26px;--ctl-px:11px;--fs:1;
  --font-ui:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-doc:var(--font-ui);
  --bg-app:#f4f1ea;--bg-chrome:#fbfaf7;--bg-stage:#faf8f3;--dot:#e7e2d6;
  --bg-docpanel:#eee8da;--bg-paper:#fffdf9;--bg-ctl:#fff;--bg-node:#fff;
  --line:#d9d2c5;--line-node:#d3ccc0;--line-paper:#e4ddcd;
  --ink:#262420;--ink-2:#4a453c;--ink-3:#8a8375;
  --bg-code:#efece3;--bg-cmt:#f6f3ea;--bg-th:#f3efe6;--bg-vbar:#fbf5f3;--accent:#a5433a}
html[data-font="serif"]{--font-doc:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
html[data-font="kai"]{--font-doc:'Kaiti SC','KaiTi','STKaiti',serif}
html[data-theme="ink"]{--diff-del-bg:rgba(205,128,96,.13);--diff-del-bd:#a06a4e;--diff-del-ink:#d89a76;--diff-add-bg:rgba(120,180,140,.11);--diff-add-bd:#5f9a74;--diff-add-ink:#8ec7a4;--bg-app:#171512;--bg-chrome:#201d18;--bg-stage:#1a1814;--dot:#2b2820;
  --bg-docpanel:#1e1b16;--bg-paper:#252119;--bg-ctl:#2c2820;--bg-node:#252119;
  --line:#3b362b;--line-node:#454035;--line-paper:#3b362b;
  --ink:#eae5d9;--ink-2:#cbc5b7;--ink-3:#8f8979;
  --bg-code:#332f26;--bg-cmt:#2e2a20;--bg-th:#2c2820;--bg-vbar:#2b2016;--accent:#c96a5c;color-scheme:dark}
html[data-theme="celadon"]{--diff-del-bg:rgba(150,80,60,.11);--diff-del-bd:#a06148;--diff-del-ink:#7e4330;--diff-add-bg:rgba(63,125,92,.13);--diff-add-bd:#3f7d5c;--diff-add-ink:#2f6248;--bg-app:#ecefec;--bg-chrome:#f8faf7;--bg-stage:#f0f3ee;--dot:#d9e0d6;
  --bg-docpanel:#e6ebe4;--bg-paper:#fbfdf9;--bg-ctl:#fff;--bg-node:#fbfdf9;
  --line:#ccd4cb;--line-node:#c3cdc2;--line-paper:#d5ddd2;
  --ink:#22271f;--ink-2:#454c42;--ink-3:#7d857a;
  --bg-code:#e8ede5;--bg-cmt:#eef3ea;--bg-th:#e9efe6;--bg-vbar:#eaf2ec;--accent:#3f7d5c}
:where(button,a,select,textarea,[tabindex]):focus-visible{outline:2px solid #a5433a;outline-offset:1px}
button,a,select,textarea{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){#docpanel .dh.flash{animation:none}*{transition:none!important}}
body{margin:0;height:100vh;display:flex;flex-direction:row;overflow:hidden;
     font-family:var(--font-ui);
     background:var(--bg-app);color:var(--ink)}
h1,.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
header{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:calc(15px*var(--fs,1));margin:0;font-weight:700;letter-spacing:1px;white-space:nowrap;flex-shrink:0;font-family:'Noto Serif SC','SimSun',serif}
header .brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(15px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
select#proj-switch{max-width:230px;text-overflow:ellipsis}
header .ver{font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap;flex-shrink:0}
header .sp{flex:1}
button.tb,a.tb{border:1px solid #c9c1b2;background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
button.tb:hover,a.tb:hover{border-color:#8a8375;background:#f3efe6}
#canvas-col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg-stage);
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:28px 28px}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
.edge-hit{pointer-events:stroke;cursor:pointer}
.edge-label{font-size:calc(10px*var(--fs,1));fill:#8a8375;pointer-events:none}
.stage-rule{stroke-width:1.2;stroke-dasharray:1,4}
.stage-name{font-size:calc(12.5px*var(--fs,1));font-weight:700}
.node{position:absolute;width:196px;background:var(--bg-node);border:1px solid var(--line-node);border-radius:var(--r-m);cursor:grab;user-select:none;
      box-shadow:0 1px 2px rgba(60,50,30,.06)}
/* 隐形点击热区：整图适配下节点缩得很小，热区外扩 6px 保证可点 */
.node::after{content:'';position:absolute;inset:-6px}
.node.sel{outline:2px solid #262420;outline-offset:1px}
.node .accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0}
.node .hd{display:flex;align-items:center;gap:7px;padding:8px 10px 2px}
.node .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node .zh{font-size:calc(13.5px*var(--fs,1));font-weight:700;line-height:1.25}
.node .sub{padding:2px 10px 4px;font-size:calc(10.5px*var(--fs,1));color:#8a8375;line-height:1.4}
.node .out{position:absolute;top:-9px;right:-8px;background:#fff;border:1.5px solid #a5433a;color:#a5433a;
           font-size:calc(10.5px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:2px}
.node .par{font-size:calc(10.5px*var(--fs,1));border:1px solid #b8a464;color:#8a6b2a;background:#fdf9ee;border-radius:var(--r-s);padding:0 5px;margin-left:6px}
.node.k-gate{background:#fbf5f3;border:1.5px solid #a5433a}
.node.k-gate .zh{color:#8c352c}
/* R5 · kit 边界验收：全流程唯一保留的人工裁决点。金色双线，与域内自动放行的门明确区分开 */
.node.k-boundary{background:#fdf8ec;border:3px double #b8a464}
.node.k-boundary .zh{color:#7a5c1e}
.node.k-boundary .accent{background:#b8a464!important}
.node.k-boundary .bdg{position:absolute;top:-10px;left:-8px;background:#fdf8ec;border:1.5px solid #b8a464;color:#7a5c1e;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:1px}
/* R5 · 指标徽章：效率（被下游消费/成本）与命中率（注入标尺被引用比例） */
.node .mbs{position:absolute;top:-10px;left:8px;display:flex;gap:3px;pointer-events:none}
.mb{display:inline-block;font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 5px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap;font-variant-numeric:tabular-nums}
.mb.good{border-color:#5a8a5e;color:#3d6b45;background:#f2f8f2}
.mb.warn{border-color:#c9922e;color:#8a6b2a;background:#fdf9ee}
.mb.bad{border-color:#a5433a;color:#8c352c;background:#fbf1f0}
/* R5 · 内容配置项旋钮表 */
.knobs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.knob{border:1px solid var(--line-paper);border-left:3px solid var(--line-paper);border-radius:var(--r-s);padding:7px 10px;background:var(--bg-paper)}
.knob.chg{border-left-color:var(--accent);background:#fffaf4}
html[data-theme="ink"] .knob.chg{background:#2b2419}
.knob .kn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob .kn-h code{font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink)}
.knob .kn-v{font-size:calc(12.5*var(--fs,1));color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.knob .kn-s{font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);margin-left:auto}
.knob .kn-s.src-overlay{border-color:var(--accent);color:var(--accent)}
.knob .kn-s.src-node{border-color:#c9922e;color:#8a6b2a}
.knob .kn-d{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);margin-top:3px;line-height:1.6}
.knob .kn-m{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;line-height:1.6}
.patched{font-family:ui-monospace,Consolas,monospace;font-size:calc(11.5px*var(--fs,1));background:var(--bg-code);
  border:1px solid var(--line-paper);border-radius:var(--r-s);padding:9px 11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.banner{margin:10px 22px 0;padding:9px 14px;border:1px solid var(--line-paper);border-left:3px solid #c9922e;border-radius:var(--r-s);
  background:#fdf9ee;color:#6b5a2a;font-size:calc(12px*var(--fs,1));line-height:1.7}
html[data-theme="ink"] .banner{background:#2a2418;color:#d9c88a}
.banner b{color:#8a6b2a}
html[data-theme="ink"] .banner b{color:#e0cd8f}
.st-done{background:#5a8a5e}.st-awaiting{background:#c9922e}.st-pending{background:#b05a4a}.st-none{background:#c9c1b2}
#hud{display:flex;gap:14px;font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#hud b{color:#3d382f}
#hud,#bottombar .zoom,.paper .doc-h,.paper .pf{font-variant-numeric:tabular-nums}
#docpanel{position:relative;width:min(44vw,780px);min-width:460px;border-left:1px solid var(--line);background:var(--bg-docpanel);display:flex;flex-direction:column}
#settings-pop{position:absolute;top:52px;right:10px;z-index:60;width:250px;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(40,32,16,.22);padding:12px 14px}
#settings-pop .set-cap{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin:8px 0 4px;letter-spacing:1px}
#settings-pop .set-cap:first-child{margin-top:0}
#settings-pop .set-opts{display:flex;gap:6px;flex-wrap:wrap}
#settings-pop .set-opts button{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-s);padding:4px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
#settings-pop .set-opts button:hover{border-color:var(--accent)}
#settings-pop .set-opts button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ob{font-size:calc(11px*var(--fs,1));color:var(--ink-3);line-height:1.8;word-break:break-all}
.ob .ok{color:#3d6b45;font-weight:700}
.ob .ob-url{color:var(--accent);cursor:pointer;text-decoration:underline}
#docpanel .dh{height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
#docpanel .bt{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
#docpanel .dh .bt:hover{border-color:#8a8375;background:#f3efe6}
#docpanel .dh b.dt{font-size:calc(15px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;letter-spacing:.5px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpanel .dh.flash{animation:dhflash .7s ease}
@keyframes dhflash{0%{background:#f0e4c4}100%{background:#fbfaf7}}
.chip{display:inline-block;font-size:calc(10.5px*var(--fs,1));border:1px solid #c9c1b2;border-radius:var(--r-s);padding:1px 7px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap}
#d-vbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--bg-vbar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#d-vbar:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 22px 46px}
.paper{background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;
       max-width:720px;margin:22px auto 0;padding:38px 52px 44px;position:relative}
.paper .doc-h{font-size:calc(11px*var(--fs,1));color:#a89a83;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.paper .doc-h span:last-child{flex-shrink:0}
.paper .pf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:calc(10.5px*var(--fs,1));color:#b3ab9b;letter-spacing:2px}
.cover{max-width:720px;margin:34px auto 0;background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;padding:52px 56px}
.cover h2{font-size:calc(26px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;margin:0 0 6px;letter-spacing:2px}
.cover .sub{color:#8a8375;font-size:calc(12.5px*var(--fs,1));margin-bottom:18px}
.shelf-cap{max-width:720px;margin:28px auto 6px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.shelf-row{display:flex;align-items:center;gap:10px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:10px 12px;cursor:pointer}
.wb-sel{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:6px 8px;color:var(--ink);font-size:calc(12.5px*var(--fs,1))}
.diff{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:calc(12px*var(--fs,1))}
.diff .ln{display:block;padding:1px 10px;white-space:pre-wrap;word-break:break-all}
.diff .add{background:var(--diff-add-bg);border-left:3px solid var(--diff-add-bd)}.diff .add::before{content:"+ ";color:var(--diff-add-ink);font-weight:700}
.diff .del{background:var(--diff-del-bg);border-left:3px solid var(--diff-del-bd)}.diff .del::before{content:"− ";color:var(--diff-del-ink);font-weight:700}
.diff .ctx{color:var(--ink-3)}
.diff .cw{border-radius:2px;padding:0 1px}
.diff .cw.del{background:var(--diff-del-bg);box-shadow:inset 0 0 0 1px var(--diff-del-bd);color:var(--diff-del-ink)}
.diff .cw.add{background:var(--diff-add-bg);box-shadow:inset 0 0 0 1px var(--diff-add-bd);color:var(--diff-add-ink)}
.diff-legend{display:flex;gap:14px;align-items:center;padding:4px 2px 10px;font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.diff-legend .lg.del{color:var(--diff-del-ink);font-weight:700}
.diff-legend .lg.add{color:var(--diff-add-ink);font-weight:700}
.wb-bar{display:flex;gap:8px;align-items:center;margin:2px 0 12px}
.wb-bar input{flex:1;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:7px 10px;color:var(--ink);font-size:calc(13px*var(--fs,1));outline:none}
.wb-bar input:focus{border-color:var(--accent)}
.wb-bar .cnt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.wb-cap{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);letter-spacing:1px;margin:8px 0 2px;border-bottom:1px solid var(--line-paper);padding-bottom:3px}
.wb-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:4px;padding:8px 10px;cursor:pointer;min-height:52px}
.wb-card:hover{border-color:var(--accent)}
.wb-card .t{font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--ink);word-break:break-all}
.wb-card .m{margin-top:4px;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.draft{background:#8a6b2a}.dot.retired{background:#8c352c}.dot.other{background:#999}
       padding:12px 18px;max-width:720px;margin:8px auto;cursor:pointer;box-shadow:0 1px 6px rgba(70,58,35,.06)}
.shelf-row:hover{border-color:#a5433a}
.shelf-row .no{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;color:#a5433a;font-size:calc(15px*var(--fs,1));width:30px;flex-shrink:0}
.shelf-row .nm{flex:1;font-size:calc(13.5px*var(--fs,1));font-weight:600}
.shelf-row .go{font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#bottombar{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg-chrome);border-top:1px solid var(--line);flex-shrink:0}
#bottombar button{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);white-space:nowrap}
#bottombar button:hover{border-color:#8a8375;background:#f3efe6}
#bottombar .sp{flex:1}
#bottombar .zoom{font-size:calc(11px*var(--fs,1));color:#8a8375;cursor:pointer;padding:2px 6px;border-radius:4px}
#bottombar .zoom:hover{background:#f3efe6}
#bottombar .zoom b{color:#3d382f}
#hud .alarm{color:#a5433a;font-weight:700;cursor:pointer;background:#faeaea;padding:2px 8px;border-radius:var(--r-s)}
#hud .alarm:hover{background:#f3d9d9}
#d-stats{font-size:calc(11px*var(--fs,1));color:var(--ink-3);font-variant-numeric:tabular-nums}
#ctip{position:absolute;display:none;z-index:30;max-width:320px;background:#262420;color:#f4f1ea;font-size:calc(12px*var(--fs,1));line-height:1.7;
      padding:10px 14px;border-radius:var(--r-l);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#ctip code{color:#e8d9a0}
.docpaper{position:relative;padding-right:112px}
.anno-rail{position:absolute;top:60px;right:12px;width:96px}
.anno-bubble{position:absolute;left:0;right:0;background:#fff8e8;border:1px solid #d9b96a;border-left:3px solid #c9922e;border-radius:var(--r-s);padding:5px 8px;font-size:calc(10.5px*var(--fs,1));line-height:1.5;cursor:pointer;box-shadow:0 2px 8px rgba(70,58,35,.14);word-break:break-word}
.anno-bubble .ab-q{color:#8a6b2a;margin-bottom:2px}
.anno-bubble .ab-t{color:var(--ink-2)}
.anno-bubble .ab-x{position:absolute;top:2px;right:4px;color:#a5433a;cursor:pointer}
.anno-mark{background:#ffe9a8;border-bottom:2px solid #c9922e;cursor:pointer}
.anno-mark.flashmark{background:#ffd166}
#anno-pop{position:absolute;z-index:70;display:none;width:270px;background:var(--bg-paper);border:1px solid var(--accent);border-radius:var(--r-m);box-shadow:0 8px 24px rgba(40,32,16,.25);padding:8px}
#anno-pop textarea{width:100%;min-height:56px;font-size:calc(12px*var(--fs,1))}
#anno-pop .ap-act{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.md[contenteditable="true"]:focus{box-shadow:inset 0 0 0 1px var(--line)}
.rawmd{font-family:Consolas,'Microsoft YaHei',monospace;font-size:calc(12px*var(--fs,1));line-height:1.7;white-space:pre-wrap;word-break:break-word;background:var(--bg-ctl);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;height:26px}
.seg button{border:0;background:var(--bg-ctl);color:var(--ink-2);height:26px;padding:0 10px;font-size:calc(12px*var(--fs,1));cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.cmt{background:var(--bg-cmt);border-left:3px solid #c9922e;padding:6px 10px;margin:6px 0;font-size:calc(13px*var(--fs,1));border-radius:0 var(--r-m) var(--r-m) 0}
#drawer{border-top:1px solid var(--line);background:var(--bg-chrome);display:none;max-height:46%;overflow:auto;padding:12px 16px}
#drawer.on{display:block}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:calc(13px*var(--fs,1));margin-bottom:10px;align-items:baseline}
.kv .k{color:var(--ink-3)}.kv .v{color:var(--ink-2);word-break:break-all}
.kv code{background:var(--bg-code);padding:1px 6px;border-radius:var(--r-s);font-size:calc(12px*var(--fs,1))}
.md{font-size:calc(13px*var(--fs,1));line-height:1.9;font-family:var(--font-doc)}
.md h2{font-family:'Noto Serif SC','SimSun',serif;font-size:calc(17px*var(--fs,1));border-left:3px solid var(--accent);padding-left:10px;margin:18px 0 8px}
.md h3{font-size:calc(14.5px*var(--fs,1));margin:16px 0 6px}
.md h4{font-size:calc(13px*var(--fs,1));margin:12px 0 4px}
.md table{border-collapse:collapse;width:100%;font-size:calc(12px*var(--fs,1));margin:10px 0}
.md th,.md td{border:1px solid var(--line);padding:5px 8px}.md th{background:var(--bg-th)}
.md code{background:var(--bg-code);padding:1px 5px;border-radius:var(--r-s);font-size:calc(12px*var(--fs,1))}
.md blockquote{border-left:3px solid #c9c1b2;margin:8px 0;padding:4px 12px;color:#6b665c}
.md ul,.md ol{padding-left:18px}
.md img{max-width:100%;border-radius:var(--r-s);display:block;margin:8px 0}
.md a[data-open]{color:var(--accent);text-decoration:underline;cursor:pointer}
.codeblock{background:var(--bg-code);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;overflow:auto;margin:10px 0}
.codeblock code{background:none;padding:0;font-size:calc(12px*var(--fs,1));white-space:pre}
textarea{width:100%;min-height:340px;background:var(--bg-ctl);color:var(--ink);border:1px solid #d3ccc0;border-radius:var(--r-m);font-size:calc(13px*var(--fs,1));
         font-family:Consolas,'Microsoft YaHei',monospace;font-size:calc(12.5px*var(--fs,1));padding:12px;resize:vertical;line-height:1.6}
.act{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.task{background:var(--bg-ctl);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;font-family:Consolas,monospace;font-size:calc(12px*var(--fs,1));
      white-space:pre-wrap;word-break:break-all;color:#4a453c;max-height:300px;overflow:auto}
.vbtns{display:flex;gap:8px;margin:10px 0}
.vbtns button{flex:1;border-radius:var(--r-m);padding:9px 0;font-size:calc(12px*var(--fs,1));cursor:pointer;border:1px solid var(--line-node);background:var(--bg-ctl);color:var(--ink-2)}
.vbtns .ok:hover{border-color:#5a8a5e;background:#f0f5ee}
.vbtns .no:hover{border-color:#a5433a;background:#faf0ee}
.seal{display:inline-block;border:1.5px solid #a5433a;color:#a5433a;font-size:calc(10.5px*var(--fs,1));font-weight:700;
      padding:0 6px;border-radius:var(--r-s);letter-spacing:1px;margin-left:6px;vertical-align:1px}
.preset{display:inline-block;font-size:calc(10.5px*var(--fs,1));border-radius:var(--r-s);padding:1px 7px;margin-right:6px}
.p-auto{background:#e8efe4;color:#3d6b45}.p-semi{background:#f3ecd8;color:#8a6b2a}.p-manual{background:#f3e4e0;color:#8c352c}
.d-add{background:#e8efe4;color:#3d6b45;display:block;padding:0 5px}
.d-del{background:#f3e4e0;color:#8c352c;display:block;padding:0 5px;text-decoration:line-through}
/* ---- 流商店（Obsidian 商店式独立页） ---- */
#store{position:fixed;inset:0;z-index:120;background:var(--bg-app);display:none;flex-direction:column}
#store.on{display:flex}
.store-top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.store-top .st-brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(16px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
.store-top .st-sub{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
#store-q{flex:1;min-width:180px;max-width:420px;height:30px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-ctl);color:var(--ink);padding:0 12px;font-size:calc(12px*var(--fs,1));outline:none}
#store-q:focus{border-color:var(--accent)}
.st-cat{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:999px;height:26px;padding:0 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
.st-cat.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.st-sort{height:26px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-ctl);color:var(--ink-2);font-size:calc(12px*var(--fs,1))}
.st-cats{display:flex;gap:8px;padding:12px 22px 0;flex-wrap:wrap;max-width:1200px;margin:0 auto;width:100%}
.store-body{flex:1;overflow:auto;padding:18px 22px 46px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.store-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:14px 15px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s,border-color .15s}
.store-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.sc-head{display:flex;gap:10px;align-items:center;min-width:0}
.st-ico{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(19px*var(--fs,1))}
.sc-name{font-weight:700;font-size:calc(13.5px*var(--fs,1));color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sc-id{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;font-family:Consolas,monospace}
.sc-desc{font-size:calc(12px*var(--fs,1));color:var(--ink-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line-paper);min-height:28px}
.sc-stat{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.sc-badge{margin-left:auto;font-size:calc(10.5px*var(--fs,1));border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.sc-badge.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sc-badge.up{border-color:var(--accent);color:var(--accent);font-weight:700}
.sc-badge.used{border-color:#5b7d5c;color:#5b7d5c}
.sc-badge.none{border-style:dashed}
.sc-go{margin-left:8px}
.sc-ver{font-size:calc(10.5px*var(--fs,1));border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.sc-ver.rel{border-color:#5b7d5c;color:#5b7d5c}
.sd-use{display:flex;flex-direction:column;gap:6px}
.sd-use-row{display:flex;align-items:center;gap:10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);flex-wrap:wrap}
.sd-use-row b{color:var(--ink)}
.sd-use-row .msg{color:var(--ink-3);font-size:calc(11px*var(--fs,1))}
.sd-use-empty{font-size:calc(12.5px*var(--fs,1));color:var(--ink-3)}
.sc-go{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:var(--r-m);height:24px;padding:0 10px;font-size:calc(11.5px*var(--fs,1));cursor:pointer;white-space:nowrap;flex-shrink:0}
.sc-go:hover{background:var(--accent);color:#fff}
.store-detail{max-width:820px;margin:0 auto;width:100%}
.st-back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--ink-2);font-size:calc(12.5px*var(--fs,1));cursor:pointer;padding:4px 0;margin-bottom:10px}
.st-back:hover{color:var(--accent)}
.sd-head{display:flex;gap:16px;align-items:flex-start;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:20px 22px}
.sd-head .st-ico{width:56px;height:56px;font-size:calc(25px*var(--fs,1));border-radius:13px}
.sd-title{font-size:calc(17px*var(--fs,1));font-weight:700;color:var(--ink)}
.sd-meta{font-size:calc(12px*var(--fs,1));color:var(--ink-3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sd-desc{margin-top:10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);line-height:1.85}
.sd-actions{display:flex;gap:10px;margin-top:14px}
.sd-main{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-m);height:32px;padding:0 18px;font-size:calc(13px*var(--fs,1));font-weight:700;cursor:pointer}
.sd-main[disabled]{opacity:.55;cursor:default}
.sd-ghost{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:32px;padding:0 16px;font-size:calc(13px*var(--fs,1));cursor:pointer}
.sd-sec{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:16px 20px;margin-top:14px}
.sd-sec h4{margin:0 0 10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);letter-spacing:1px}
.sd-stats{display:flex;gap:28px;flex-wrap:wrap}
.sd-stat b{display:block;font-size:calc(19px*var(--fs,1));color:var(--ink)}
.sd-stat span{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.sd-stages{display:flex;flex-wrap:wrap;gap:8px}
.sd-stage{border:1px solid var(--line);border-radius:var(--r-m);padding:5px 11px;font-size:calc(12px*var(--fs,1));color:var(--ink-2);background:var(--bg-cmt)}
.sd-stage b{color:var(--accent);margin-right:5px;font-family:Consolas,monospace}
.sd-skills{display:flex;flex-wrap:wrap;gap:7px}
.sd-skill{border:1px dashed var(--line);border-radius:999px;padding:3px 11px;font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);font-family:Consolas,monospace}
.st-empty{max-width:1200px;margin:70px auto;text-align:center;color:var(--ink-3);font-size:calc(13px*var(--fs,1))}
</style>

 千年枭雄困在最卑微躯壳：打脸虐渣当众清算 × 马甲掉马身份反差，权谋经验对市井无赖是彻底的降维打击。\n\n## 查族记录（饱和度口径：n + 均热度，快照 2026-09-15）\n\n| 候选族 | 饱和度 | 语料 n | 均热度 | 判定 |\n|---|---|---|---|---|\n| kb/trope/dalian-nuezha 打脸虐渣 | 红海·有效 | 1510 | 18558 万 | **主梗**：有效红海必须带新变体进 |\n| kb/trope/majia-diaoma 马甲掉马 | 红海·过饱和 | 750 | 9215 万 | 辅梗：热度低于全库均值，只借机制不作主轴 |\n| kb/trope/chongsheng-fuchou 重生复仇 | 红海·有效 | 702 | 11978 万 | 辅梗：借「先手布局精准清算」机制 |\n| kb/trope/liufang-zhongtian 流放种田 | 上升期·蓝海偏好 | 92 | 22598 万 | 避开：蓝海但与方向不符，强行挂接=假新意 |\n\n## 主梗机制与新变体落点\n\n主梗 = 打脸虐渣：受辱蓄力 → 当众清算（当众 631 次 / 打脸 574 次，是语料第一爽点引擎）。\n\n新变体 = **权谋降维打击**：链上对标全是现代职场/家庭清算（《离婚后，我送前夫一份PPT》《拆盲盒后，我把渣男净身出户了》），没人做过「三国头号枭雄魂穿市井小贩，用兵法做当众清算」——人设新（枭雄 instead 赘婿/前妻）、武器新（兵法权谋 instead 证据流/PPT）、对手轴新（泼皮无赖/县吏 instead 渣男/资本家）。换皮不换机制是假新意；本落点换的是「清算者的辈分」：你们玩的是刀，我玩的是天下。\n\n## 辅梗复合与相性\n\n- 马甲掉马 × 打脸虐渣：身份反差为当众清算供弹药——掉马瞬间即打脸瞬间，辅梗改变主梗的清算条件（对方以为在欺负武大郎，实际在惹曹操），不是只占时长。\n- 重生复仇 × 打脸虐渣：借「先手」机制——曹操的重生不是信息差而是千年经验差，每场冲突他都是先手布局方。\n\n## 对标件（用作强度标尺）\n\n- kb/benchmark/b016-fam：被低估的专业者——低谷期受辱强度标尺（第 1 章蓄力段对齐）\n- kb/benchmark/b012-cn：清算证据流——当众翻盘的证据链密度（第 2 章爆发段对齐）\n- kb/benchmark/b005-cn：美食赛道——炊饼生意的经营爽感参照\n\n## 风险\n\n- 打脸虐渣红海拥挤：必须保证每场清算都有「权谋.only」的解法，否则退化为普通爽文。\n- 马甲过饱和警告：曹操的真实身份揭示节奏要压到武松回家线，前期只给读者不给角色。\n- 历史人物改编合规：曹操形象正面化处理，不涉敏感史实。\n", "01-选题/material-dissect.md": "---\nartifact: 1\nid: topic.material-dissect\nclass: draft\nnode: m1.material-dissect\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 03:48\nby: module/topic.material-dissect\nupstream:\n  - 01-选题/find-trope.md\n  - kb/market/topic-anatomy\n  - kb/market/meme-rules\nreview: null\n---\n\n# 素材解剖 · 炊饼摊上的权力结构\n\n> 题材为历史穿越模板文：解剖对象不是热点事件，是「北宋市井商战」模板自身的权力结构——泼皮的猎场上，每只猎物都该带着猎人的眼睛。\n\n## 一、四层剥离\n\n- **现象层**：阳谷县街头，一个任人拿捏的炊饼小贩，一夜之间换了个人。\n- **利益层**：泼皮要白吃白拿外加立威的排面；县吏要灰色孝敬加治安考绩；同行要捂死外来的客源；看客白看热闹不嫌事大；武松要哥哥平安——他们各自的算盘互不相认。\n- **权力层**：泼皮对商贩握生杀权（砸摊无人管，零成本行使）；县吏对市集握定罪权与框架权（说你非法摆摊你就非法）；同行握封锁权（价格同盟断你粮道）；武松握暴力威慑但慢速——人在衙门不在场；看客握舆论，谁声音大帮谁。\n- **结构层**：本质隐喻 = **弱者的摊位是强者的猎场**。不对称点：猎杀即时零成本，反制慢速全额代价——这七倍速差就是爽点矿脉。\n\n## 二、关系结构图（不对称标红）\n\n- 泼皮 → 武大：生杀权＋收买权（**即时/零成本 vs 反制慢速/全额**）\n- 县吏 → 全市集：定罪权＋框架权（规矩由他解释）\n- 同行 → 武大：封锁权（断 supply、挖伙计、压价）\n- 武松 → 全县：暴力威慑（强但慢，且反噬哥哥——「打狗看主人」反着用）\n- 看客 → 舆论：框架权（可被主角反向收割为陪审团）\n\n## 三、逆位爽点候选（每个回指被逆的权力线）\n\n1. **生杀权逆位**：如果位子反过来——猎场主变成店规被告。金手指：千年权谋经验做「店规审判」；关系轴：泼皮从猎人变阶下囚；爽点机制：当众清算（店堂即公堂，炊饼幌子即惊堂木）。回指：泼皮→武大的生杀权线。\n2. **定罪权逆位**：县吏的解释权被借力打力——让规矩反咬定规矩的人。金手指：把柄流（每笔孝敬都是证据）；关系轴：执法者变违规者；爽点机制：以其人之规清算其人。回指：县吏→市集的定罪权线。\n3. **威慑慢速逆位**：把武松的暴力背书「即时化」。金手指：名声先行、人到案到（说曹操曹操到的结构化改写）；关系轴：被动等待救兵变主动部署威慑；爽点机制：威慑链解围。回指：武松→全县的慢速威慑线。\n\n## 四、材料落位表（梗素材表 ＋ 正作用凭证）\n\n| 素材/梗（传播度） | 结构位 | 消费点 | 去向 |\n|---|---|---|---|\n| 宁教我负天下人（全民共识·高） | 主角内心 vs 嘴上人设 | 台词梗 | 每章内心独白反差 |\n| 说曹操曹操到（俗语·高） | 武松威慑慢速线 | 出场梗：被欺负必现身 | 第1章解围名场面 |\n| 挟天子以令诸侯（成语·高） | 县吏定罪权逆位 | 台词梗：挟口碑以令市集 | 第2章清算宣言 |\n| 望梅止渴（成语·高） | 同行封锁权线 | 营销梗：饥饿疗法 | 炊饼限量预售桥段 |\n| 煮酒论英雄（成语·高） | 县吏→主角关系轴 | 场面梗：与县令煮酒论市集 | 第2章谈判戏 |\n| 三顾茅庐（成语·高） | 主角身份掉马线 | 反转梗：武松三请出山 | 第3章身份线 |\n| 火烧赤壁（典故·高） | 同行封锁权逆位 | 场面梗：烤炉阵法 | 开业大战 |\n| 短衣帮 vs 长衫客（孔乙己·中高） | 看客舆论线 | 世界观位：市集阶层轴 | 市集群像 |\n| 当众掉马（短剧高热·高） | 马甲辅梗主轴 | 机制位：掉马即打脸 | 每章一处 |\n| 好感度结算（网文热梗·中高） | 泼皮生杀权逆位 | 机制位：店规积分制 | 店规审判桥段 |\n\n无消费点的素材已删除；上表每行均回答「服务于谁、被消费在哪」。\n", "02-编剧/foreshadow-plant.md": "---\nartifact: 1\nid: plot.foreshadow-plant\nclass: draft\nnode: m2.foreshadow-plant\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:34\nby: module/plot.foreshadow-plant\nupstream:\n  - 02-编剧/novel-bible.md\n  - kb/continuity/state-ledger\n  - kb/continuity/worldbook\n  - kb/craft/highlight-loop\nreview: null\n---\n\n# 伏笔台账 · 曹操穿越武大郎（三章试稿）\n\n> 开工先查台账：本项目为首轮生成，无旧债、无到期项、无 retired 词条——首埋即首笔负债，全部登记进台账（伏笔/台账.md），到期单元锁死。\n\n## 选点位（结构位点 × 密度上限 2/单元）\n\n| 编号 | 伏笔 | 位点 | 回收期 | 伪装档 |\n|---|---|---|---|---|\n| F1 | 半枚空白保书（原主藏的后手） | 第1章章末钩旁（钩子位） | 全弧终局对账 | 日常化 |\n| F2 | 白氏木匣里的保书原件 | 第2章卡点前（中距回收位） | 第3章半揭（联反转短伏笔） | 半遮 |\n| F3 | 「说曹操曹操到」的市集传言 | 第1章爽2（钩子位顺风车） | 长线：武松线全弧兑现「人到案到」 | 明示 |\n| F4 | 掌柜头痛发作＋账本上的「三」字暗记 | 第2章爽2 | 第3章末小兑付（兄弟对峙时硬扛一次不发作失手）＋全弧终局大兑付 | 日常化 |\n\n密度：第1章 2（F1/F3）、第2章 2（F2/F4）、第3章 0 新埋——试稿章不透支信用，第3章全力兑付。\n\n## 明面伪装说明（埋设时必须同时干的活）\n\n- **F1 日常化**：拆灶台备开市是主线必做事件，掉出旧纸片顺手收起——单抽这段给新读者，只是「开张打扫」的一笔，无暗示感。回收时换义：随手收起的不是废纸，是原主唯一的自保后手。\n- **F2 半遮**：东家备战戏里木匣一闪，话头立刻被「断粮部署」打断——读者只确认「她有把柄」，内容扣住。回收（第3章指纹对账）时对照感在卡点峰值后兑现。\n- **F3 明示**：传言本身就是笑点与招牌（可切片梗点），赌读者当它是氛围梗；长线回收时它是威慑链的信息机制，同一个梗换功能。\n- **F4 日常化**：头痛是金手指成本的真实展示（有效信息），「三」字暗记是账本细节（氛围）；小兑付时同一事实换义——成本红线第一次真的咬人。\n\n## 台账登记行（写入 伏笔/台账.md）\n\n| id | 内容 | 埋设 | 到期 | 状态 |\n|---|---|---|---|---|\n| F1 | 半枚保书（原主后手） | ch1 | 全弧终局 | open |\n| F2 | 白氏木匣原件 | ch2 | ch3 | open |\n| F3 | 曹操到传言＝威慑机制 | ch1 | 长线 | open |\n| F4 | 头痛三限＋「三」字暗记 | ch2 | ch3 小付/终局大付 | open |\n\n全部挂结构位点、全部带明面功能；无「提前提一嘴」式裸埋。到期未回收即按 AE-CONT-FORESHADOW 卡断言，本表即对账凭据。\n", "02-编剧/novel-bible.md": "---\nartifact: 1\nid: plot.novel-bible\nclass: draft\nnode: m2.novel-bible\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:26\nby: module/plot.novel-bible\nupstream:\n  - 02-编剧/subplot-weave.md\n  - kb/aesthetic/character\n  - kb/aesthetic/conflict-escalation\n  - kb/formats/webnovel-longform\n  - kb/trope/dalian-nuezha\n  - kb/trope/chongsheng-fuchou\nreview: null\n---\n\n# World Bible · 《炊饼令》\n\n> 题材：历史穿越＋美食商战（爽文）。核心情绪：爽（当众清算）＋燃（权谋碾压）。判定单位「章」，商业单位「追读」——三章试稿对齐快餐节奏，日更五千字语境。\n\n## 一、三层问答\n\n**① 题材与核心情绪**：打脸虐渣主梗（红海·有效，1510 部/均热 18558 万）× 马甲掉马辅梗；核心情绪走向 = 压迫 → 释然的循环，每章至少一次「压迫蓄力 → 当众清算」闭环。对标件：kb/benchmark/b016-fam（受辱强度）、b012-cn（清算证据链）。\n\n**② 主角与核心欲望**：\n- **为什么一定是曹操**：市井反制需要的是「体系化权力经验」——泼皮会砸摊，但没人斗过挟天子以令诸侯的人。武松是武力、县令是官身、原主武大郎已死，唯有曹操同时懂「律法怎么被人玩坏」和「人心怎么被规矩管住」。排除法成立。\n- **金手指四件套**：能力 = 千年权谋经验＋军制管理（把炊饼摊当军团管）；限制 = 不识当今字、不通本朝律（须借武大郎遗物补课）；成本 = 每次调用前世记忆剧烈头痛，一日三次为限；失败模式 = 用三国经验硬套市集会翻车（市井不讲信义讲现钱）。\n- **对手配置（给对手一把刀）**：同行东家白氏——京城贬官眷，目标是攥住县市集供应权重回东京。她的刀 = 保书原件＋县吏定罪权，能合法地让武大郎「消失」。她随主角每次行动调整打法（主角立店规，她就用律法拆店规）。\n\n**③ 前十事件链**（冲突升级代价梯，一次动一两个维度）：索孝敬顶回（第1章）→ 店规审判泼皮（1）→ 限量预售立口碑（1）→ 断粮危机（2）→ 分化同盟（2）→ 军粮方立招牌（2）→ 拘票构陷（3）→ 指纹对账（3）→ 兄弟结盟（3）→ 供养链半揭（3）。首卡位：全弧第5集（试稿第3章末供养链半揭即卡点点位）。\n\n## 二、人物卡（≤10 有名角色）\n\n| 人物 | 三维（生理/社会/心理） | 真相（压力下的选择） | 维（矛盾） |\n|---|---|---|---|\n| 曹操（魂穿武大郎） | 矮躯病面／市井最底层贩夫／枭雄心性 | 被踩脸时选择「记账不还手」——压力越大越像掌柜，不像受害者 | 负天下人的傲 × 只剩一间铺面的窘 |\n| 武松 | 魁伟带伤／都头／重亲缘守律法 | 证据指向兄长时，选择「先按刀、再对账」 | 律法的信 × 血缘的疑 |\n| 白氏（同行东家） | 徐娘风韵／官眷出身／恨天不假时运 | 被断粮道反将时，选择直接用保书杀人 | 体面 × 毒辣；她也要在男人局里求生 |\n| 何九叔（县吏） | 精瘦／胥吏头目／欺上瞒下 | 风向变时第一个改口——顺杆爬的老油条 | 想升 × 怕死 |\n| 唐牛儿（泼皮头目） | 壮实流氓／市井打手／欺软怕硬 | 被店规罚过后，选择替武大跑腿——打得服的就是恩人 | 凶横 × 孝母 |\n\n知情范围初表（连续性台账种子）：曹操＝不知原主死因与保书内容；武松＝不知哥哥已换芯；白氏＝知保书、不知对方是曹操；何九叔＝知白氏供养、不知保书；唐牛儿＝全部不知。\n\n## 三、世界规则与金手指\n\n- 唯一超自然件：魂穿。三秒讲完，无系统面板、无异能（设定零原创，全民 IP 零学习成本）。\n- 市集规则照抄北宋市井：行会供应链、胥吏定罪权、都头暴力背书。\n- 力量来源与代价：曹操的兵法权谋 = 力量源；头痛 = 代价；「市集不讲信义讲现钱」= 失败模式。\n\n## 四、长期承诺清单（promises 台账种子）\n\n1. 保书之谜：原主替谁担了什么债（第1章埋）→ 终局对账兑付。\n2. 白氏的东京梦：她的官眷旧案 → 终局反转弹药。\n3. 武松的信任弧：按刀 → 对账 → 交刀（「你的规矩我替你看着」）→ 终局并肩。\n4. 头痛代价：三次限额 → 终局在最关键一战失手一次。\n\n## 五、书名与简介\n\n**书名**：《炊饼令》\n**简介**：一睁眼，三国最强的魂，困进北宋最卑微的躯壳。泼皮踩脸？县吏勒索？同行断粮？曹操把炊饼摊摆成了军营：店规即军法，账本即粮台，市集即战场。他说：宁教我负天下人——但今天，先赔你三十笼炊饼。\n", "02-编剧/plot-choreographer.md": "---\nartifact: 1\nid: plot.plot-choreographer\nclass: draft\nnode: m2.plot-choreographer\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:10\nby: module/plot.plot-choreographer\nupstream:\n  - 02-编剧/structure-design.md\n  - kb/aesthetic/conflict-escalation\n  - kb/aesthetic/emotion-curve\n  - kb/aesthetic/scene-value\n  - kb/aesthetic/reversal\n  - kb/market/constraints\nreview: null\n---\n\n# 编排表 · 曹操穿越武大郎（三章试稿）\n\n> 三章节拍：立规 → 断粮 → 查案。情绪曲线主型「层层递进」（赌注逐级抬高，无失衡级）；暗线「武大郎的债」：原主替人画押的保书在东家手里（F1 第1章埋、第3章半揭）。\n\n## 主线骨架（价值转变链 × 双线拧紧）\n\n激励扰动 = 索孝敬被当众顶回；不可回头点 = 断粮道反击战；中点（全弧第5集，试稿半揭）= 东家供养链曝光；危机选择 = 交出店规自证清白 vs 抗律到底（互不兼容、均有代价）；高潮 + 余波 = 武松对峙后的分工。危机加深线（泼皮→同行→县吏→律法）× 欲望加强线（守摊 → 立店规 → 控市集）逐章同时抬升。\n\n## 三线装配（三章映射）\n\n- **A 主线**：炊饼商战每章推进一格——立店规（第1章）→ 破封锁（第2章）→ 御状倒打（第3章）。\n- **B 情感线**：兄弟轴。武松家书倒计时（每章一封，叮嘱「休惹官非」渐急），交叉点间距 ≤3 拍。\n- **C 爽点线**：hot 档每章 ≥3 爆点 + ≥1 可切片梗点，布点见下。\n\n## 分章功能表\n\n**第1章《开市》（钩子段：立世界立冤屈立钩）**\n- 入戏：县吏上门索月例孝敬，武大郎不跪不递钱，反把「市集五条店规」钉在摊前——价值转变：权力（看客从看笑话变看新鲜）\n- 爽1：店规审判首案——泼皮白吃，按规赔炊饼三十笼，当众执行（切片梗点：店堂即公堂）\n- 爽2：说曹操曹操到的结构化首秀：泼皮的兄弟赶来寻仇，撞见武大早备好的「证词链」\n- 爽3：望梅止渴式限量预售，日炊饼三百笼改「辰时五十笼」，市集口碑反转\n- F1 埋：收拾旧灶台，砖缝里掉出半枚按了指印的空白保书\n- B线：武松第一封家书到，「安分」二字被红线圈过\n- 章末钩（后果型）：县吏笑纳了同行东家递来的一只锦盒——镜头只看到盒盖上的炊饼印花\n\n**第2章《断粮》（蓄力段：压抑蓄力 + 信息差埋设）**\n- 入戏：同行同盟断面粉供，三家粮行同时毁约——价值转变：安全（供给命脉握在别人手里）\n- 爽1：分化同盟——当众揭出同盟里谁在偷偷囤粮抬价，弱者倒戈（切片梗点：粮行对账名场面）\n- 爽2：军粮改良方：三搭面醒面法 + 行军灶控火，粗面做炊饼反成新招牌（代价可见：掌柜连续两夜守灶、头痛欲裂——穿越代价出场）\n- 爽3：以战养战：把同盟违约的毁约金按店规折成「市集信誉银」，反向给粮行定价\n- F2 埋：同行东家翻出一只旧木匣，里面是武大郎按指印的保书原件（与 F1 呼应，读者知角色不知）\n- B线：第二封家书，字迹变急：「近日县中多事，勿开罪胥吏」\n- 章末钩（状态改变型）：县吏带着「私抬粮价、扰乱市集」的拘票上门——告他的人画押名字，是武大郎自己\n\n**第3章《都头》（引爆段：危机选择 + 身份半揭）**\n- 入戏：武松提前归家，跨门槛先按刀——他看到的不是哥哥受难，是哥哥「私设公堂、强买粮行」\n- 对峙：武力试探 + 言语交锋，曹操以军阵答都头的拳，以账本答都头的问（英雄识英雄的错位版：武松疑的不是哥哥变了，是哥哥背后的「高人」）\n- 爽1：保书半揭——拘票上的画押与 F1 的半枚保书指纹对上：有人冒武大郎之名构陷，且只有捏着保书的人做得到（切片梗点：指纹对账）\n- 爽2：御状倒打：店规账目 + 毁约文契整链呈给武松，构陷路径反推至同行东家\n- 爽3：中点半揭（全弧第5集位）：锦盒炊饼印花 → 东家是官眷出身，供养链浮出水面（改写故事模型：对手从「市集无赖」升级为「官商同盟」）\n- B线：武松把刀放在店规匾下——「你的规矩，我替你看着」（兄弟轴从怀疑转结盟）\n- 章末钩（情绪型）：曹操望着兄弟背影出门查案，头痛又发作——「这一次，孤的江山只有一间铺面。」\n\n## 卡点体检\n\n每章末答「观众为什么必须看下一集」：第1章——锦盒是谁的、保书是什么；第2章——冒名画押怎么破、武松信不信；第3章——官商同盟怎么打、头痛的代价是什么。均答得上来，无信息空钩。\n\n## 场景复用表（3 景硬约束）\n\n| 场景 | 承担章 | 复用节拍 |\n|---|---|---|\n| 炊饼铺面 | 1/2/3 | 店规审判、对账、兄弟对峙（当众戏的「众」= 街市群演） |\n| 县市集 | 1/2 | 预售、断粮、同盟倒戈 |\n| 县衙前 | 3 | 拘票、呈账、御状倒打 |\n\n集功能无连续重复；伏笔 F1/F2 均回收有期（全弧第5集半揭、终局对账）。\n", "02-编剧/scene-breakdown.md": "---\nartifact: 1\nid: plot.scene-breakdown\nclass: draft\nnode: m2.scene-breakdown\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:45\nby: module/plot.scene-breakdown\nupstream:\n  - 02-编剧/plot-choreographer.md\n  - 02-编剧/foreshadow-plant.md\n  - kb/aesthetic/hook-3s\n  - kb/aesthetic/scene-value\n  - kb/aesthetic/dialogue\nreview: null\n---\n\n# 小纲 · 三章试稿（批注版）\n\n> 达意即可，不修文采。每场一个主要认知更新，批注请锚定场号。\n\n## 第1章《开市》\n\n- 场1（开场 3 秒钩：递钱的手被按住）场景：县市集炊饼摊/清晨/武大、何九叔、看客。行动：何九叔来收月例，武大把他的手按在钱袋上，钱袋是空的。台词：何九叔：武大郎，你这是要我白跑？武大：月例没有，店规一份，请老爷过目。承接：无（开场即主冲突）。\n- 场2：摊前/同上/武大、唐牛儿。行动：唐牛儿白吃两个炊饼抹嘴要走，武大念出店规第三条。台词：唐牛儿：一个饼你也记账？武大：记账，也记你。价值：权力（看客开始围观起哄）。\n- 场3：摊前/午/武大、唐牛儿、看客。行动：当众宣判：白吃三十笼，赊账做工抵。台词：看客甲：武大郎今天吃错药了？看客乙：我看是唐代了药王。承接：因为场2立了规，所以场3能当众执规。\n- 场4：县市集/傍晚/武大、看客。行动：限量预售，辰时五十笼，卖完关摊。台词：武大：明日辰时，五十笼，过时不候。备注：F3 传言在此起头——「武大郎今天不对劲」。\n- 场5：炊饼铺内/夜/武大。行动：拆洗旧灶台备开市，砖缝掉出半张按了指印的纸。台词：武大：（自语）这怂货还藏了后手？备注：F1 埋，顺手收起不展开。\n- 场6（章末钩）：县市集口/夜/何九叔、蒙面人。行动：蒙面人递锦盒，何九叔掂了掂笑了。台词：何九叔：东家客气。承接：因为白天的规立得太顺，所以夜里就有人合谋。备注：只拍盒盖炊饼印花。\n\n## 第2章《断粮》\n\n- 场1：县市集/晨/武大、粮行掌柜们。行动：三家粮行同时毁约，面粉断供。台词：掌柜甲：契约？契约是死人是活的。承接：因为第1章立了规，所以对手换「断供」这把更狠的刀。\n- 场2：粮行前/午/武大、掌柜乙、看客。行动：当众对账，揭掌柜甲偷偷囤粮抬价，弱者倒戈。台词：武大：李掌柜的账在此，你要跟他一起抬价，还是跟我一起卖饼？备注：切片梗点（对账名场面）。\n- 场3：炊饼铺后厨/夜/武大、两个伙计。行动：三搭面醒面法试做，行军灶控火，粗面饼出锅。台词：武大：火分三堆，如同分兵；面醒三次，如同休整。备注：头痛第一次发作，武大扶灶喘息；账本角落画了个「三」字（F4 埋）。\n- 场4：县市集/晨/武大、看客、掌柜乙。行动：粗面新饼限量开卖，被抢空。台词：看客丙：这粗饼怎么比细面还香？武大：饿出来的手艺。价值：安全（供给命脉夺回一半）。\n- 场5：白氏绸缎庄内/夜/白氏、丫鬟。行动：白氏开木匣取出一纸旧文书冷笑。台词：白氏：他不是要立规矩吗，我让他知道他姓什么。承接：因为明抢失败，所以暗箭上弦。备注：F2 埋（半遮），匣中文书不展示。\n- 场6（章末钩）：炊饼铺/晨/武大、何九叔、伙计。行动：何九叔带拘票上门：私抬粮价、扰乱市集，画押人是「武大郎」。台词：何九叔：大郎，你自己看看这指印。承接：因为场5上了弦，所以场6放箭。\n\n## 第3章《都头》\n\n- 场1：炊饼铺/晨/武松、武大、伙计。行动：武松跨门槛按刀，绕着店规匾走了一圈。台词：武松：哥哥，私设公堂，按律杖八十。武大：三郎，先看账，再办我。承接：拘票把武松提前拽回了局。\n- 场2：铺前院子/午/武松、武大。行动：武松出手试探，武大以扁担列阵法接下三十招不落风。台词：武松：你这身手哪学的？武大：梦里一位故人教的。备注：英雄识英雄的错位版。\n- 场3：铺内账台/午/武大、武松。行动：指纹对账——拘票画押与 F1 半枚保书同源，非武大亲按。台词：武大：这世上知道我指印在哪的，只有一个人。备注：F1/F2 半揭，切片梗点。\n- 场4：县衙前/午/武松、武大、何九叔、看客。行动：呈账本、毁约文契、保书指印，当众倒打御状。台词：武松：都头在此，谁画押，谁对质。承接：因为场3锁了真凶范围，所以场4能公开对质。价值：权力（定罪权第一次反握）。\n- 场5：县衙前/午后/白氏（远远下轿）、武大。行动：白氏遥遥与武大对视一眼，转身回轿。台词：白氏：（低声）好一个武大郎。备注：中点半揭——供养链与官眷身份浮出（信息型反转，故事模型改写：对手升级）。\n- 场6（章末钩）：炊饼铺/夜/武松、武大。行动：武松把佩刀放在店规匾下。台词：武松：你的规矩，我替你看着。武大：（头痛袭来，扶匾而笑）这一次，孤的江山只有一间铺面。备注：F4 小兑付——他硬扛了一次没让人看见。\n\n## 创作思路页\n\n- 第1章放在「立规」：三秒钩是「递钱的手被按住」——最卑微的人做出最不该做的动作；爽点是当众执规（可切片），锦盒钩让读者看见对手在暗处。\n- 第2章放在「断粮」：压抑蓄力段，明抢换暗箭；粗面饼段落同时干三件事（金手指成本展示/生意爽点/F4 埋设），第3章回收指纹对照。\n- 第3章放在「查案」：武松归来按律法「查兄」是预期反转（不是救兵是危机）；指纹对账是明暗线交汇点；白氏下轿一视改写故事模型（对手升级为官商同盟），为续篇留钩。\n- 伏笔：F1（第1章埋）→第3章半揭；F2（第2章埋）→第3章半揭；F3 长线；F4 第3章小付、终局大付。\n", "02-编剧/structure-design.md": "---\nartifact: 1\nid: plot.structure-design\nclass: draft\nnode: m2.structure-design\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 03:58\nby: module/plot.structure-design\nupstream:\n  - 01-选题/material-dissect.md\n  - kb/structure/catalog\n  - kb/aesthetic/conflict-escalation\n  - kb/aesthetic/reversal\n  - kb/aesthetic/pacing-density\n  - kb/market/setting-rules\nreview: null\n---\n\n# 结构选型 · 炊饼摊上的复仇工程\n\n> 主骨复仇（背叛→蛰伏→清账）× 辅骨双线交叉（明线炊饼商战、暗线身份与武松回归）；中点身份反转、结局前预期反转，两次反转皆判型可查。\n\n## 选型三步（深挖 · 改造 · 融合）\n\n**深挖**——主骨选复仇结构，骨架逐节点落到本次选题的具体事件：冤屈建立 = 武大郎被泼皮当街踩脸收摊、县吏罚没烤炉（第1集）；能力获得 = 「店规审判」体系立起来，炊饼军粮改良方打响招牌（第1-2集）；逐层清算 = 泼皮（第2集）→同行内鬼（第4集）→县吏（第6集，中点引爆）；终局对账 = 武松回家，全案对账（第8-10集）。每个节点都有名有姓有摊位号，写不出事件的节点已删。\n\n**改造**——复仇结构的「清算顺序」标志件倒序改造：不按仇怨大小、按**权力依赖链**从叶到根清算（先打爪牙、断供养、最后才动定罪权），每一步清算同时削弱下一层的防御——改造点回指梗卡新变体落点「权谋降维打击」（清算者辈分不同，所以清算顺序也不同）。\n\n**融合**——辅骨双线交叉：A 线明面炊饼商战逐集推进；B 线暗面「哥哥怎么变成这样了」的市井传闻汇聚，武松归期一路倒计时。交叉点即中点反转引爆位；交叉间距控制在 5 拍以内防失衡（AE-INFO-LOAD：每集仍只有一个主认知更新）。\n\n## 两处反转布点（判型 · 铺垫 · 不重复）\n\n- **中点反转（身份反转）**：县吏背后是同行东家——罚没烤炉、泼皮闹事都是同一条供养链上的活。前置暗埋 ≥2：①县吏每次罚没都只罚武大一家、同行摊位绕着走（第1集背景板）；②泼皮被清算后当场喊「东家不会放过你」而非喊冤（第2集）。回看成立，不靠撞见偷听。\n- **结局前反转（预期反转）**：武松推门——观众以为是救兵到家，实际是最大危机：都头按律要查哥哥「妖言惑众、私设公堂」。判型：预期反转（以为 A 发生实为 B）。前置暗埋 ≥2：①武松家书里反复叮嘱「安分守己，休惹官非」（第3集）；②店规审判的「私设公堂」罪名被县吏提前点名威胁过（第5集）。反转落地后全案重算：店规证据链、县吏供词、武松知情范围全部重新清点，无悬空证据。\n- 两处判型不同（身份 / 预期），无同型连用。\n\n## 节奏与密度（hot 档对表）\n\n- 每集爽点 ≥3 处、前三章每集 ≥1 个可独立切片的梗点（当众清算名场面/店规金句/掉马瞬间）。\n- 冲突升级按「代价梯」爬：口头羞辱 → 砸摊 → 断粮道 → 构陷入狱 → 杀局，每次升级都带不可逆损失，杜绝同强度反复摩擦（AE-DENSITY-HOT）。\n\n## 设定体系（代入成本红线）\n\n零原创世界观：三国人物 + 武大郎全部走全民认知，市井规则照抄《金瓶梅》市井逻辑，唯一超自然件是「魂穿」本身——三秒讲完，不设穿越规则说明书（AE-SET-3MIN）。\n\n## 不确定因素注入点（≥2，反单薄）\n\n1. **穿越带代价**：曹操每用一次前世记忆会剧烈头痛——权谋不是免费外挂，清算节奏自带刹车（人物规则反认知）。\n2. **同行东家的身份层**：炊饼同行东家原是京城贬下来的官眷——她与县吏的供养链之外，还藏着一条想重回东京的暗线（身份层变量，为续篇留钩）。\n", "02-编剧/subplot-weave.md": "---\nartifact: 1\nid: plot.subplot-weave\nclass: draft\nnode: m2.subplot-weave\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:18\nby: module/plot.subplot-weave\nupstream:\n  - 02-编剧/plot-choreographer.md\n  - kb/structure/episodic-webnovel\n  - kb/aesthetic/emotion-curve\n  - kb/aesthetic/reversal\nreview: null\n---\n\n# 暗线编织 · 武大郎的债\n\n> 暗线选型 = 身份线：原主武大郎生前按过指印的一纸保书。明线消费「当众清算」的爽点机制，暗线消费「重新解读」——保书揭晓后，读者能重读武大郎生前每一次「懦弱」。\n\n## 第零步：暗线选型（正交性检查）\n\n主线（商战复仇/打脸虐渣）时间方向向前推进欲望；身份线从背后收紧——武大郎到底替谁画了押。读者知道后可重读前文：第1章他为何一见县吏就低头、钱袋为何总留一个空夹层。主线若是复仇、暗线也是复仇 = 复读，已排除；情感线（兄弟轴）在编排表 B 线明写，不作暗线。正交性成立。\n\n## 第一步：暗线锚点表（标准密度：每单元 1 锚点）\n\n| 单元 | 明线事件 | 暗线动作 | 读者可见层 | 实际发生了什么 |\n|---|---|---|---|---|\n| 第1章 | 拆洗旧灶台备开市 | 埋 | 砖缝掉出半枚按了指印的空白保书，武大随手收起 | 原主留的后手：保书一式两份，他生前藏了半份 |\n| 第2章 | 同行东家翻旧账备战 | 推 | 东家从木匣取出「武大郎的把柄」，冷笑收好 | 东家捏着保书原件——构陷的钥匙，也是她拿捏县吏的把柄 |\n| 第3章 | 拘票上门、指纹对账 | 半揭 | 拘票画押与保书指纹同源：有人冒名构陷 | 冒名者必是捏着原件之人；东家供养链因此浮出（与中点反转共用同一场景） |\n\n第1、2章锚点之间暗线各有一拍「不动」（silent beat，明线事件承担节奏）；无连续两单元停摆。\n\n## 第二步：双轨咬合检查\n\n- **抽掉暗线，明线照常成立**：三场商战（开市立规/断粮反击/御状倒打）无需保书也完整——暗线是增量不是承重梁。\n- **抽掉明线，暗线仍可读**：保书有自己的因果链（原主为何画押 → 谁捏着 → 如何反噬），三章锚点连读自成一条「债务追索」线，不是明线装饰回声。\n- **明暗在揭示点交汇**：第3章指纹对账即公开时刻——明线的「自证清白」与暗线的「保书归属」在同一场景（县衙前）共用一拍完成，两线交汇 ✓。\n\n## 第三步：揭示节奏（四拍规划）\n\n1. **埋**（第1章）：半枚保书，只给读者一瞥，不给解释。\n2. **推**（第2章）：东家木匣原件——信息差收紧（读者知道把柄存在，不知内容）。\n3. **半揭**（第3章）：指纹同源 = 冒名构陷实锤；保书内容（原主替谁担保什么债）仍扣住。\n4. **全揭**（全弧终局对账，试稿外）：保书背后是东家家族当年侵产案，原主是唯一活证——她的「重回东京」暗线动机与明线终局对账同场兑付。\n\n## 失衡自检\n\n暗线每拍挂在明线事件的「第二次含义」上，无独立镜头；半揭点与结构设计的中点反转同场，情绪曲线在交叉位单点引爆（情绪曲线：层层递进主型无失衡级）；反转判型不变（身份/预期两型），暗线揭示不新增反转型。\n", "03-写作/layer-canon.md": "---\nartifact: 1\nid: prose.layer-canon\nclass: draft\nnode: m3.layer-canon\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 05:16\nby: module/prose.layer-canon\nupstream:\n  - 03-写作/layer-scenes.md\n  - kb/aesthetic/character\n  - kb/continuity/state-ledger\n  - kb/continuity/worldbook\n  - kb/craft/prose-constraints\n  - kb/craft/user-style-rules\nreview: null\n---\n\n# 层稿 · 设定（防崩清单）\n\n> 本稿用词全部在 World Bible 词汇表内，无世界书外新词；北宋市井名物按「用后即释」处理。\n\n拍 #1\n- 知情范围：何九叔知武大「变了」不知为何；武大知市集规则漏洞；看客只知新鲜。武大必须装傻——不能露出懂律法。\n- 新词首现：店规（场景演示：木牌钉出即释）；月例（人物一句话自释：何九叔开口就是索要）。\n- 台账增量：何九叔索贿未遂→记仇；店规木牌立起；看客围观成习。\n- 人设揭示点：武大被按住钱袋不怒——压力下选择「立规矩不斗气」，与枭雄心性一致；何九叔留后门话（「管不管得了你」），油滑不崩。\n\n拍 #2\n- 知情范围：唐牛儿不知店规效力；众人不知武大身份。武大知唐牛儿背后有人但不说破。\n- 新词首现：店规第三条（用后即释：白吃十倍）。\n- 台账增量：唐牛儿欠三十笼；围观群体形成。\n- 人设揭示点：唐牛儿拉人壮胆——欺软怕硬，与人物卡一致。\n\n拍 #3\n- 知情范围：众看客首次见证店规执行力；唐牛儿开始怕武大。\n- 新词首现：无。\n- 台账增量：唐牛儿按手印欠据；武大立信完成；「武大郎变了」的传言起头。\n- 人设揭示点：武大罚而不辱（磨面抵账而非羞辱）——收人先用恩，权谋底色。\n\n拍 #4\n- 知情范围：市集知「限量」；无人知饥饿疗法的兵法来源。\n- 新词首现：辰时（语境自明：清晨开卖）。\n- 台账增量：炊饼品牌立起；明日开市预告。\n- 人设揭示点：无重大揭示（过渡拍，疏笔合规）。\n\n拍 #5\n- 知情范围：武大知有半枚保书、不知内容（Bible 知情表：不知原主死因）；读者多知一步（纸背透印）。\n- 新词首现：保书（刻意存疑：不解释用途，留钩）。\n- 台账增量：F1 入武大手；原主「藏后手」印象建立。\n- 人设揭示点：武大对原主改口「这怂货」→ 起敬，情绪微转不抢戏。\n\n拍 #6\n- 知情范围：何九叔知有人递钱；武大不知夜局；读者知盒盖印花。\n- 新词首现：东家（称呼先行，身份存疑）。\n- 台账增量：县吏-东家供养链咬合（读者视角）；「武大」标被仿用。\n- 人设揭示点：何九叔掂盒熟练——贪而不蠢。\n\n拍 #7\n- 知情范围：武大知断供即危机；掌柜们知自己违约有靠山。\n- 新词首现：粮行（语境自明）。\n- 台账增量：面粉断供；三车三向（同盟三家的视觉化）。\n- 人设揭示点：武大下颌绷而不语——先忍后算，与拍1一致。\n\n拍 #8\n- 知情范围：众人知有人囤粮；只有武大亮账。掌柜乙知风向可倒。\n- 新词首现：市集信誉银（人物一句话自释：按店规折的违约金）。\n- 台账增量：同盟裂；掌柜乙倒戈；毁约金入库。\n- 人设揭示点：武大给弱者留活路（分化而非赶尽）——曹操「挟恩图报」式收人。\n\n拍 #9\n- 知情范围：伙计知掌柜夜里疼；不知疼因。武大知三限纪律（Bible 金手指成本）。\n- 新词首现：三搭面（用后即释：醒面三次）、行军灶（场景演示：三堆火）。\n- 台账增量：军粮方成；F4 登记在案（账本「三」字）；武大体力消耗。\n- 人设揭示点：数火止疼——军中旧习，身份的生理性泄露（给武松线埋证据）。\n\n拍 #10\n- 知情范围：市集知新饼好；无人知配方来路。\n- 新词首现：无。\n- 台账增量：粗面饼立招牌；细面摊被压。\n- 人设揭示点：无（爽点拍，干脆收）。\n\n拍 #11\n- 知情范围：白氏知保书全貌＋县吏把柄；丫鬟不知文书内容；武大与读者皆不知匣中物。\n- 新词首现：无（「娘子/押司」宋称呼，语境自明）。\n- 台账增量：F2 上弦；请托何九叔——供养链闭合。\n- 人设揭示点：白氏抚印如抚伤疤——她与保书有私仇成分，不纯是利益（维=矛盾的种子）。\n\n拍 #12\n- 知情范围：武大知拘票构陷；伙计不知；何九叔知拘票来路。\n- 新词首现：拘票（官方文书式呈现：朱印＋罪名即释）。\n- 台账增量：武大被诉「私抬粮价」；画押系伪造（读者可推断）。\n- 人设揭示点：武大看拘票先看折痕——从物证入手，不喊冤（权谋惯性）。\n\n拍 #13\n- 知情范围：武松不知内情，只见哥哥「能打」；武大知不能赢太狠（要留兄长脸面）。\n- 新词首现：都头（武松身份，开场已带刀自释）。\n- 台账增量：武力平手；武松起疑「背后高人」；武大虎口伤。\n- 人设揭示点：武大收力让武松收拳——兄弟相认不能靠输赢（情绪线暗写）。\n\n拍 #14\n- 知情范围：武松首次入信息圈（账本/拘票/保书）；知情表更新：他知「有人构陷」，不知魂穿。\n- 新词首现：无。\n- 台账增量：F1/F2 交汇兑付一半；武松知情范围扩大（台账种子兑现）。\n- 人设揭示点：武松捏纸指节白——怒的不是罪，是有人算计他哥（重亲缘，与 Bible 一致）。\n\n拍 #15\n- 知情范围：众看客见证对质；何九叔知大势已去；白氏远观全局。\n- 新词首现：无。\n- 台账增量：何九叔滑跪；定罪权当众反转；「店规第三条」开始口口相传。\n- 人设揭示点：武松「先法后情」反向用——用法办贼护兄，人设双面成立。\n\n拍 #16\n- 知情范围：白氏知武大难缠升级；武大知背后是「东家」；双方互认对手。\n- 新词首现：无。\n- 台账增量：中点半揭完成（供养链/官眷味）；宣战成立。\n- 人设揭示点：白氏挡嘴不挡眼——体面与毒辣同框（人物卡矛盾维可视化）。\n\n拍 #17\n- 知情范围：武松不知头痛底细；武大知三限已用二。\n- 新词首现：无。\n- 台账增量：佩刀交匾下（信任物化）；F4 小兑付；「孤」字差点出口——武松未察。\n- 人设揭示点：武大改口「孤→我」——身份伪装的日常性滑动，压力下的自我纠正即人物真相；配角（武松）不抢戏，存在为刻主角。\n\n## 尾部清单\n\n**新词登记**（进名目台账）：店规 / 月例 / 保书 / 三搭面 / 行军灶 / 市集信誉银 / 拘票 —— 均已标注首现拍与释法；无世界书外私造词。\n\n**伏笔登记**（设/收/转）：F1 设（拍5）→转（拍14）；F2 设（拍11）→半收（拍14/15）；F3 设（拍3-4 传言）→长线；F4 设（拍9）→小收（拍17）。无逾期项。\n\n**时间线对表**：第1章一日（晨-夜）；第2章两日；第3章一日半。合计四日半，无「三天后」漂移。\n", "03-写作/layer-scenes.md": "---\nartifact: 1\nid: prose.layer-scenes\nclass: draft\nnode: m3.layer-scenes\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 05:06\nby: module/prose.layer-scenes\nupstream:\n  - 03-写作/layer-voices.md\n  - kb/aesthetic/metaphor-zh\n  - kb/aesthetic/scene-value\n  - kb/craft/prose-constraints\n  - kb/craft/user-style-rules\nreview: null\n---\n\n# 层稿 · 场景（场景专科）\n\n> 喻体全部域内备案：市集/炊饼/军营行当内取物。明喻配额 ≤2/千字，文言壳全稿 ≤1。零总结句。\n\n拍 #1（县市集炊饼摊/清晨/薄雾未散）\n- 五感计划：主视觉——雾里一张按住钱袋的手；听觉次之（铜钱没响）\n- 身体反应：何九叔的手背被按住时袖口一紧；看客们收了笑、脖子齐齐前伸\n- 道具与布景：空钱袋（当众的羞辱品）、店规木牌（新钉的，木刺还毛）\n- 笔墨密度：密（开场定调）\n- 入戏细节：木牌钉得歪，是武大故意钉歪的——歪头才好念\n- 喻体备案：无（白描更有力）\n\n拍 #2（同摊/晨/雾散）\n- 五感计划：主听觉——两个饼落进唐牛儿怀里的闷响；味觉次之（芝麻渣）\n- 身体反应：唐牛儿嘴角的饼渣；武大按在木牌上的手稳得反常\n- 道具与布景：店规木牌（参与叙事：指给众人看）\n- 笔墨密度：疏\n- 入戏细节：唐牛儿抹嘴用的是武大的笼布\n- 喻体备案：无\n\n拍 #3（摊前当众/午/日头正毒）\n- 五感计划：主听觉——人群起哄声浪；视觉次之（唐牛儿涨红的脸）\n- 身体反应：唐牛儿后颈的汗顺衣领流；看客前排有人踮脚、后排有人跳\n- 道具与布景：三十笼炊饼的赔账字据（按手印）\n- 笔墨密度：密（爽点峰值放慢）\n- 入戏细节：字据按印时，唐牛儿的手指在印泥里按了两回——第一回是抖的\n- 喻体备案：人群围得像新垒的灶（域内：灶）——备用，正文可用可不用\n\n拍 #4（县市集/傍晚/斜阳）\n- 五感计划：主嗅觉——最后一炉饼香勾人；视觉次之（空笼屉摞高）\n- 身体反应：围观者吞咽；孩童拽大人衣角\n- 道具与布景：笼屉（限量道具）、「明日辰时」木牌\n- 笔墨密度：疏\n- 入戏细节：关摊后武大当众洗笼布——洗给明天看\n- 喻体备案：无\n\n拍 #5（铺内/夜/一盏油灯）\n- 五感计划：主触觉——砖缝里抠纸的指尖凉；视觉次之（灯焰抖）\n- 身体反应：武大蹲麻的腿；纸片入手时他愣了半息\n- 道具与布景：半枚保书（F1 道具，登记）、旧灶台\n- 笔墨密度：密（钩前放慢）\n- 入戏细节：纸上的指印按得很重，纸背都透了印——按印的人当时用了大力气\n- 喻体备案：无\n\n拍 #6（县市集口/夜/无月）\n- 五感计划：主视觉——锦盒在暗处开盖一线光；听觉次之（盒盖合上的轻响）\n- 身体反应：何九叔掂盒子的手很熟——掂的是分量不是物件\n- 道具与布景：锦盒（盒盖炊饼印花）\n- 笔墨密度：疏（夜话短）\n- 入戏细节：印花是武大摊上的样式——有人仿了标\n- 喻体备案：无\n\n拍 #7（县市集/次日晨/大晴）\n- 五感计划：主视觉——三辆空粮车掉头；听觉次之（车轴吱呀）\n- 身体反应：武大站在摊后没动，只有下颌线绷了一下\n- 道具与布景：毁约的契约书\n- 笔墨密度：疏\n- 入戏细节：粮车走后，街上留三道新鲜车辙，向三个不同方向\n- 喻体备案：无\n\n拍 #8（粮行前/午/日头）\n- 五感计划：主听觉——算盘珠响、账页翻响；视觉次之（掌柜乙的汗）\n- 身体反应：掌柜乙擦汗擦到第三块帕子；看客里有人跟着心算\n- 道具与布景：账本（参与叙事：四百石陈麦）\n- 笔墨密度：密（对账名场面）\n- 入戏细节：账本翻页处夹着一根麦秸——当年入库的记号\n- 喻体备案：无\n\n拍 #9（后厨/深夜/灶火三堆）\n- 五感计划：主嗅觉——三灶火三种香；触觉次之（灶壁烫，扶灶的手）\n- 身体反应：武大扶灶的手抖、太阳穴暴起；伙计打瞌睡被香气激醒\n- 道具与布景：行军灶（三堆火）、账本角落「三」字（F4 登记）\n- 笔墨密度：密\n- 入戏细节：他把疼的那半边头抵在凉灶壁上，数灶火——数数是军中的止疼法\n- 喻体备案：火堆「像三处哨位」（域内：军哨）——备用\n\n拍 #10（县市集/次日晨/大晴）\n- 五感计划：主嗅觉——粗面饼的麦香压过细面摊；听觉次之（抢购声）\n- 身体反应：看客咬第一口时集体静了一瞬，随后嗡声炸开\n- 道具与布景：粗面新饼、售罄木牌\n- 笔墨密度：疏（爽点干脆利落）\n- 入戏细节：隔壁细面摊掌柜探着头咽口水\n- 喻体备案：无\n\n拍 #11（白氏绸缎庄内室/夜/烛影）\n- 五感计划：主视觉——烛光里木匣开缝；触觉次之（旧文书纸脆）\n- 身体反应：白氏指尖抚过文书上的指印，力道轻得像抚伤疤\n- 道具与布景：木匣、保书原件（F2 道具，登记）\n- 笔墨密度：疏（半遮，一闪即走）\n- 入戏细节：木匣锁是新的，匣身是旧的——换过锁\n- 喻体备案：无\n\n拍 #12（炊饼铺/第三日晨/阴）\n- 五感计划：主听觉——拍门声急；视觉次之（拘票上朱红的印）\n- 身体反应：伙计手里的笼屉差点脱手；武大的眉心跳\n- 道具与布景：拘票（假指印）\n- 笔墨密度：密（钩前放慢）\n- 入戏细节：拘票一角有折痕——是叠小了塞进袖筒带来的\n- 喻体备案：无\n\n拍 #13（铺前院/午/阴云裂一道光）\n- 五感计划：主触觉——扁担相击的麻；听觉次之（武松拳风）\n- 身体反应：武大虎口震裂渗血；武松的拳在半寸处收住\n- 道具与布景：扁担\n- 笔墨密度：密\n- 入戏细节：武大布鞋底磨穿，露出袜子——用小贩的脚站军阵的步\n- 喻体备案：阵步「像围猎圈羊」（域内：猎）——备用\n\n拍 #14（账台/午/同上）\n- 五感计划：主视觉——两张纸并排、指印对齐；听觉次之（武松的呼吸沉了）\n- 身体反应：武松捏纸的手指节白\n- 道具与布景：拘票＋半枚保书（F1/F2 交汇）\n- 笔墨密度：密（信息峰值）\n- 入戏细节：两张纸新旧有别，指印却同——旧纸的印反而更清晰\n- 喻体备案：无\n\n拍 #15（县衙前/午后/云开）\n- 五感计划：主听觉——看客声浪一层压一层；视觉次之（朱红印与白纸的反差）\n- 身体反应：何九叔的官帽檐滴下汗珠；武松按刀的手稳\n- 道具与布景：账册、文契、拘票\n- 笔墨密度：密（公开对质，爽点峰值）\n- 入戏细节：看客里有人小声学舌「店规第三条」——规矩已经传开\n- 喻体备案：无\n\n拍 #16（县衙前远处/午后/同上）\n- 五感计划：主视觉——轿帘半掀一线；听觉次之（轿夫起杠的号子）\n- 身体反应：白氏与武大隔街对视，各自先笑\n- 道具与布景：轿子\n- 笔墨密度：疏\n- 入戏细节：轿帘放下前，白氏用团扇挡了半张脸——只挡嘴不挡眼\n- 喻体备案：无\n\n拍 #17（铺内/夜/一灯如豆）\n- 五感计划：主触觉——刀身入鞘的凉；听觉次之（匾额被刀压出的轻响）\n- 身体反应：武大的太阳穴又跳，他把手背在身后掐住腕子\n- 道具与布景：佩刀（交托道具）、店规匾（F4 小兑付场）\n- 笔墨密度：密（章末情绪）\n- 入戏细节：刀放的位置偏右三寸——武松按自己惯用手给的，让哥哥顺手\n- 喻体备案：无\n\n## 层稿尾部 · 道具/伏笔登记\n\n- F1 半枚保书：拍5 埋 → 拍14 交汇\n- F2 木匣原件：拍11 埋 → 拍14/15 兑\n- F4 头痛＋「三」字暗记：拍9 埋 → 拍17 小兑付\n- 道具全部参与叙事；无摆设性命名物件。\n", "03-写作/layer-voices.md": "---\nartifact: 1\nid: prose.layer-voices\nclass: draft\nnode: m3.layer-voices\nround: 1\nversion: v1\nstate: draft\nat: 2026-09-19 04:56\nby: module/prose.layer-voices\nupstream:\n  - 02-编剧/scene-breakdown.md\n  - kb/aesthetic/character\n  - kb/aesthetic/dialogue\n  - kb/craft/prose-constraints\n  - kb/craft/highlight-loop\n  - kb/craft/user-style-rules\nreview: null\n---\n\n# 层稿 · 台词（对白专科）\n\n> 遮名三句自测通过：武大的官话短促带令、武松的话带刀口、何九叔的话永远留后门、白氏的话裹着笑。hot 档立场写脸上。\n\n## 第1章《开市》\n\n拍 #1（县市集炊饼摊/武大、何九叔、 ，麻烦也来了。\n\n麻烦叫唐牛儿，阳谷县有名的泼皮头子，专吃街面上的白食。他晃到摊前，抓起两个炊饼就往怀里揣，顺手扯起笼布抹了把嘴——抹嘴用的还是武大的笼布。\n\n「老子吃你两个饼，是看得起你。」他嚼着饼说，饼渣粘在嘴角上，「你爹活着的时候，也是这么伺候本大爷的。」\n\n摊子后头静了一下。\n\n「店规第三条。」武大说。\n\n「什么？」\n\n「白吃者，十倍赔。」武大的手按在木牌上，稳得反常，「你吃了两个。记账，也记你。」\n\n唐牛儿愣了愣，随即笑骂出来：「一个卖炊饼的缩头龟，跟本大爷算账？」他一招手，街角蹭着的两三个闲汉晃过来，「兄弟们，有人要请咱们吃饼！」\n\n\n武大没跟他们对骂。他掀开蒸笼，白汽腾起来，把半张摊都罩住了。\n\n「赔不出三十笼，就替我磨三天面。」他把一张字据铺在案板上，白汽散开的时候，满街的人都看清了那五个字：白吃者十赔。\n\n唐牛儿的兄弟们互相看了看，没一个往前站的。白吃两个饼要赔三十笼，这笔账当街就算得清，围观的人替他算得更快，嗡嗡的议论声浪一层压过一层。\n\n「牛儿哥，」有个闲汉小声嘀咕，「十个饼……二十笼，你上个月砸王家茶摊，官府才判赔……」\n\n「闭嘴！」唐牛儿一瞪眼，可那话已经落进人堆里了。满街的人都听见了：官府的板子，还没这木牌上的字重。\n\n字据按手印的时候，唐牛儿的手指在印泥里按了两回——第一回是抖的。\n\n看客里有人喊：「武大郎今儿吃了什么药？」\n\n有人接：「管他什么药，好看就行！」\n\n\n三天面磨完，唐牛儿的手上磨出两个水泡。第三天傍晚交工，他把最后一袋面扛进后院，蹲在墙根下不动窝。武大验面的时候抓了一撮，搓开，吹了吹。\n\n「磨得细。」他把面收进缸里，又说，「明日你再来，我请你吃饼。」\n\n唐牛儿站在原地，半天没说出话来。他挨过衙门的板子，挨过行会老大鞭子，还头一回碰上赔完账还请吃饼的。蹲了半晌，他憋出一句：「……管饭？」\n\n「管饭。」武大说，「管饱。汤随便喝。」\n\n唐牛儿咂咂嘴，把这句话当宝贝似的揣回了家。当晚他娘问他面手上的泡哪来的，他说：「给一位贵人磨面。」他娘追着问了三条街，也没问出贵人是谁。\n\n傍晚关摊，武大当众洗笼布——洗给明天看。次日辰时开卖，五十笼，辰时三刻售罄。有人挤进来问还有没有，他指了指木牌：「明日请早。」\n\n那天夜里，他蹲在灶台边拆洗砖缝，为着明日开市大扫除。指尖忽然触到一片硬物，抠出来，是半张折得极小的纸。油灯下摊开：一张保书，只剩半枚，按着指印，印得很重，纸背都透了印——按印的人当时用了大力气。\n\n「这怂货，」武大对着灯想了想，「倒是比我会藏东西。」\n\n他把纸收进贴身的夹层。窗外有人提着灯笼走过，声音飘进来：「听说了么，武大郎这两天不对劲……」\n\n\n同一个夜里，县市集口没有月亮。\n\n何九叔站在街角的阴影里，掂了掂手里递来的锦盒。他掂得很熟——掂的是分量，不是物件。盒盖开着一线，里面垫着官银，银上压着一张纸，纸上印着炊饼摊的花样。\n\n「押司，这饼花的纸，仿得像么？」递盒子的人声音压得很低。\n\n「像。」何九叔把盒盖合上，那一声轻得像盒盖，「比真的还像。」\n\n「东家还问，那五条规矩……」\n\n「规矩？」何九叔把锦盒拢进袖子里，慢慢往衙门方向去了，「他立他的规矩，我们收我们的月例。这县里三百年，都是这么过的。」\n\n## 第二章《断粮》\n\n\n第二天一早，三辆空粮车从摊前掉头，车辙在青石板上留了三道，朝着三个不同的方向。\n\n三家粮行，同时毁约。\n\n「面粉紧俏，」粮行甲的掌柜站在车辕上，把契约抖得哗哗响，「契约嘛——纸是纸，粮是粮。老爷们如今只认现银，不认纸。」\n\n满街的摊贩都缩着脖子看。行会的规矩他们懂：三家同时断你的供，你这摊子就支不过三天。有个相熟的菜贩子朝武大挤挤眼，嘴型比了个「收摊」，武大只当没看见。\n\n伙计慌得去搬蒸笼：「掌柜的，咱还剩半袋面，撑不过明日……」\n\n「慌什么。」武大站在摊后没动。他等三辆车都走远了，才朝满街的人拱了拱手，声音不大，可每个人都听清了：\n\n「契约是纸，那就请三位掌柜把这纸当众收回去。市集都看着——谁毁约，谁赔市集一个说法。」\n\n\n当天没人当众收回什么。武大也不急。\n\n他花一个下午，把三家粮行近半年的进出账摸了个底。上午买了三斗面，下午拎着账本去了粮行乙——李掌柜的粮栈最小，最经不起折腾。\n\n「李掌柜，你仓里的陈麦囤了四百石。」账本翻开，摊在柜台上。翻页处夹着一根麦秸，是当年入库的记号。「囤着陈麦，抬着新价，跟粮行甲一起做局——这笔账，是要我一个人认，还是全街的人一起算？」\n\n李掌柜的汗擦到第三块帕子：「武掌柜，话、话不能这么说……」\n\n「那就换一句。」武大把账本合上，「跟我走。毁约金按店规折成市集信誉银，往后你的粮、我的饼，一起定价，一起卖。」\n\n柜台上静了半晌。李掌柜看看账本，又看看街上熙熙攘攘买饼的人，把心一横：\n\n「……成。不过武掌柜，粮行甲背后有人，你得罪不起。」他压低了声音，「这话我今日说了，明日可不认。」\n\n「不劳你认。」武大把账本收进怀里，「粮在我的缸里，字在你的柜上。明日辰时，等你送面。」\n\n李掌柜张了张嘴，到底什么也没再说。\n\n\n夜里，后厨点起三堆灶火。\n\n断供断了细面，武大便改用粗面。三搭面，三次醒；行军灶的火候，三堆火各自看住一头，谁也不欺负谁。\n\n「火分三堆，如同分兵；面醒三次，如同休整。」他把面摔上案板，声音不高，却带着股不容错身的劲。两个伙计连夜守灶，打瞌睡都被这股劲激醒。\n\n半夜里，伙计看见掌柜扶着灶壁，半边头抵在凉砖上，额上全是细汗。\n\n「掌柜的，你脸色好白。要不要去躺躺？」\n\n「老毛病。」武大闭着眼数灶火。三，六，九——数数是军中的止疼法，前世每逢头风发作，也是这么数帐前的旗。那时节没人敢问他疼不疼，如今倒有两个伙计守着他熬半夜。他把这个念头掐了，接着数。疼过去那阵，他睁开眼，在账本角落画了个小小的「三」字。\n\n今日，第三次了。\n\n\n第三天清早，粗面新饼开卖。\n\n麦香是压不住的，半条街都闻得见。头一个客人咬下去，整张脸顿了顿；第二口还没咬，周围伸过来的手已经排成了队。看客咬下第一口时齐齐静了一瞬，随后嗡的一声炸开——隔壁细面摊的掌柜探着头，咽了口唾沫，转身把自己摊上的幌子往下摘了一半，怕人比着两家买。\n\n「这粗饼怎么比细面还香？」\n\n「饿出来的手艺。」武大说。\n\n卖到辰时末，售罄的木牌挂出去，人群还不散。有人隔着摊问：「掌柜的，你这手艺收不收徒？」\n\n「收。」武大指了指木牌上的店规，「先背规矩。」\n\n同一时刻，绸缎庄内室。烛影里，白氏开了一只木匣。匣子的锁是新的，匣身是旧的——换过锁。她从里面取出一纸旧文书，指尖抚过上面的指印，力道轻得像抚一道旧伤疤。\n\n「他不是爱立规矩吗。」她把文书放回去，合上匣盖，「春杏，去请何押司。就说，我给他捎了份大礼。」\n\n\n第四天清早，拍门声比鸡叫先到。\n\n何九叔带着两个衙役立在门口，手里一纸拘票，朱红的印，罪名两行：私抬粮价，扰乱市集。画押处一枚指印，按得又重又清。\n\n「武大郎，」何九叔把拘票抖开，眼睛看着街面不看人，「你自己看看这指印。」\n\n伙计手里的笼屉差点脱手。两个衙役上前半步，一左一右。武大却把两只手在围裙上擦了擦，才去接拘票——接官府文书，手上不能有油。\n\n他没看罪名，先看纸角。纸角有一道折痕，叠得很小，是塞在袖筒里揣来的。他又看那枚指印，红得发乌，边上一圈洇开——按印的时候，手指上蘸的东西太多，急了。\n\n他笑了。\n\n「老爷，」他说，「我三个月没出过阳谷县。这指印是谁的手，你猜，还是我猜？」\n\n何九叔的眉毛跳了一下：「少贫嘴。明日辰时，衙门过堂，误了时辰，可是你自己不认拘票。」\n\n「好说。」武大把拘票折好收进怀里，又把围裙解下来，叠好，搭在案板上，像每日收摊那样仔细，「劳烦回禀上差——明日的老面，今夜总得喂最后一遍。」\n\n## 第三章《都头》\n\n\n武松是跨着门槛进来的。刀先进门，人后进门。\n\n打虎都头的名声满天下，可他进门头一件事，是在店规匾底下站定，从头看到尾——五条规矩，一条条看完，脸上什么表情都没有。\n\n「哥哥。」他开口了，「私设公堂，强买粮行。按律，杖八十。」\n\n院子里两个伙计吓得连大气都不敢出。武大却把袖子挽了挽，把账本从案下搬出来，推过去。\n\n「三郎。先看账，再办我。」他说，「账清了，刀我自己领。」\n\n\n账本没看完，武松先出的手。\n\n没有招式，没有试探，第一拳就是打虎的拳。拳风擦着武大的耳朵过去，带起的风压得蒸笼里的白汽都歪了。武大侧身让过，扁担横扫，脚下走的是军阵的步子——布鞋底在院子里磨出半圆，磨穿了，露出袜子，步子却一步不乱，围猎圈羊似的把武松的拳路往死角里带。\n\n武松的第二拳变了线。他不追拳了，去追步子——行伍出身的人认得出，这不是市井把式，是踩过阵、见过血的步子。第三拳收了七分力，落在扁担上，试的是对面的筋骨。\n\n三十招开外，武松跳出战圈，收了拳。\n\n武大虎口裂了，血顺着扁担纹往下走。他把扁担立到墙边，喘匀了气，站直。\n\n「你这身手，」武松盯着他，「哪学的？」\n\n「梦里一位故人，教过我。」\n\n武松盯着他看了很久很久。院子里静得能听见灶上老面开裂的细响。最后说出的话，却不是他预想里任何一句：\n\n「你到底是谁。」\n\n\n武大没答这个问题。他把人领进屋，从贴身夹层里取出那半枚保书，又把昨日的拘票铺在账台上。\n\n两张纸并排。油灯拨亮，两枚指印对齐。\n\n「同一只手按的。」武大说，「拘票上说我私抬粮价——可我这三个月，就没出过阳谷县。这世上知道我指印按在哪份东西上、又能把印仿得这么真的——」\n\n「只有让我画过押的人。」武松替他把话说完了，呼吸沉了下去。\n\n「走。」武大把账册夹上胳膊，把没裂的那只手朝门外一让，「对质去。」\n\n\n县衙前的告示墙下，看客围了三层。\n\n武松把拘票、账册、三家粮行的毁约文契一样一样摆在石阶上，最后是那半枚保书。每摆一样，人群的声音就矮一截；摆到账册那本时，前排已经有人踮着脚念上面的字了。\n\n「都头在此。谁画押，谁对质。」他抱起手臂，「指印在，人证在，账册在。何押司——你收礼的时候，可想到过今日？」\n\n何九叔的官帽檐上滚下来一颗汗珠。他往前挪了半步，腰弯下去一寸：「都头说笑了，下官只是照章办事……」\n\n「照章？」武大接过话头，指着拘票上那枚假指印，「好。那就从这张假指印的『章』，查起。查它从谁手里出来，银子从谁袖子里过去，画的押，照的是谁家的『规』。」\n\n他一口气说了三个「照」，一个比一个慢。满街的人听懂了：这不是卖饼的话，这是审案的话。\n\n人群里有人小声学舌：「店规第三条——」笑声跟着起来了，压过了衙役的呵斥。规矩这种东西，传起来比谣言还快。\n\n\n街对面，一顶青绸小轿停着，一直没动。\n\n轿帘掀开一线。白氏用团扇挡了半张脸——只挡嘴，不挡眼。\n\n「好一个武大郎。」她隔着半条街，声音低得只有自己听得见。\n\n武大像是后颈长了眼睛，遥遥朝轿子方向一揖，笑得像迎接贵客：「东家的茶，改日必登门讨。」\n\n轿帘放下了。轿夫起杠的号子响起来，青绸轿子稳稳抬走，一只手在帘子后面收紧了帕子。今夜，那只木匣要打开第二次。匣底压着的，除了那纸保书，还有一件连何九叔都不知道的东西。\n\n人群散得慢。今天这一场，往后半个月都是阳谷县街面上的下饭菜。有两个老主顾围着武大问长问短，问完了才想起买饼，一人又提了一笼回去。\n\n\n夜里，武松把佩刀放在了店规匾下。\n\n刀身入鞘的轻响里，匾额压出一声吱呀。刀放的位置偏右三寸——按他自己的惯用手估摸的，让哥哥伸手就能拿到。\n\n「你的规矩，」他说，「我替你看着。」\n\n「三郎。」武大应了一声。\n\n太阳穴里那根针又扎下来了，比前两日任何一次都狠。今日已是用到第三次。数火时一次，对账时一次，加上这一回。眼前的灯焰晃成两团，又并成一团。他把一只手背到身后，掐住自己的腕子，指甲掐进肉里，另一只手扶住匾额，没有让笑散掉。\n\n「明日卯时，吃饼再走。孤——」他顿了顿，把那个字咽回去，「我。我等你回来。」\n\n武松走后，铺子里只剩一盏灯。\n\n武大对着店规匾坐了很久。灯芯结了花，他也没去剪。这具躯壳几天前还在被人踩脸，如今全阳谷县最锋利的刀，睡在它的匾底下。\n\n他揉着突突跳的太阳穴，低声说：「这一次，孤的江山，只有一间铺面。」\n\n这一回，他没改口。\n", "03-写作/prose-assembler.md": "---\nartifact: 1\nid: prose.prose-assembler\nclass: draft\nnode: m3.prose-assembler\nround: 1\nversion: v2\nstate: draft\nat: 2026-09-19 06:12\nby: module/prose.prose-assembler\nupstream:\n  - 03-写作/layer-voices.md\n  - 03-写作/layer-scenes.md\n  - 03-写作/layer-canon.md\n  - kb/craft/prose-constraints\n  - kb/aesthetic/ai-trace\n  - kb/aesthetic/slop-list\n  - kb/formats/webnovel-fastfood\nreview: null\n---\n\n# 拼装盖章 · 《炊饼令》三章初稿（r2 扩写版）\n\n> 三层稿拼装为正文初稿，每章 1500-1800 字，章末留钩；盖章单逐段六维自检通过。r2：按章长红线扩写（r1 实测 705/770/892 字，未达标）。\n\n## 第一章《开市》\n\n段一 ｜ 台词□场景□设定□人设□节奏□机味□\n\n雾没散的时候，何九叔的手先到了炊饼摊。\n\n按月例的日子。往常这时候，武大郎会把钱串子双手捧出来，捧的时候腰要弯下去一寸，钱串子外头还要裹一层油纸——何九叔嫌饼渣脏手。\n\n今天那只手伸出来，却落了空。武大没递钱，反而按住了他的手背，把一只瘪钱袋翻了个底朝天。两根麻绳线都磨毛了，一个铜板也没有。\n\n「武大郎，你这是要我白跑一趟？」\n\n「月例没有。」武大松开手，从摊底下抽出块新钉的木牌，立在摊前。木刺还毛着，墨迹也没干透，字是夜里刚写的：店规五条，违者依规。「店规一份。老爷是收钱，还是看规矩？」\n\n何九叔没接话。他先看那块牌——字歪歪的，钉得也歪，可是五条规矩从上到下排得齐整，连罚多少、赔几天都写死了。他看得很慢，像在称这五条规矩有几斤几两。\n\n「新鲜。」他笑了，笑得很慢，把手拢回袖子里，「我倒要看看，你这规矩，管不管得了你自己。」\n\n说完人就走了，鞋底在青石板上蹭出很响的声音。走出七八步，他回头看了一眼那块歪脖子木牌，又看了一眼武大的手——那只按过他手背的手，瘦，粗，指甲缝里还有面粉。\n\n看热闹的几个闲汉还没聚拢，先听了个尾巴。卖菜的、打铁的、挑水的，一大早的市集本来各忙各的，这会儿全往炊饼摊这边斜着身子。\n\n段二 ｜ 台词□场景□设定□人设□节奏□机味□\n\n日头升起来，雾散了，麻烦也来了。\n\n麻烦叫唐牛儿，阳谷县有名的泼皮头子，专吃街面上的白食。他晃到摊前，抓起两个炊饼就往怀里揣，顺手扯起笼布抹了把嘴——抹嘴用的还是武大的笼布。\n\n「老子吃你两个饼，是看得起你。」他嚼着饼说，饼渣粘在嘴角上，「你爹活着的时候，也是这么伺候本大爷的。」\n\n摊子后头静了一下。\n\n「店规第三条。」武大说。\n\n「什么？」\n\n「白吃者，十倍赔。」武大的手按在木牌上，稳得反常，「你吃了两个。记账，也记你。」\n\n唐牛儿愣了愣，随即笑骂出来：「一个卖炊饼的缩头龟，跟本大爷算账？」他一招手，街角蹭着的两三个闲汉晃过来，「兄弟们，有人要请咱们吃饼！」\n\n段三 ｜ 台词□场景□设定□人设□节奏□机味□\n\n武大没跟他们对骂。他掀开蒸笼，白汽腾起来，把半张摊都罩住了。\n\n「赔不出三十笼，就替我磨三天面。」他把一张字据铺在案板上，白汽散开的时候，满街的人都看清了那五个字：白吃者十赔。\n\n唐牛儿的兄弟们互相看了看，没一个往前站的。白吃两个饼要赔三十笼，这笔账当街就算得清，围观的人替他算得更快，嗡嗡的议论声浪一层压过一层。\n\n「牛儿哥，」有个闲汉小声嘀咕，「十个饼……二十笼，你上个月砸王家茶摊，官府才判赔……」\n\n「闭嘴！」唐牛儿一瞪眼，可那话已经落进人堆里了。满街的人都听见了：官府的板子，还没这木牌上的字重。\n\n字据按手印的时候，唐牛儿的手指在印泥里按了两回——第一回是抖的。\n\n看客里有人喊：「武大郎今儿吃了什么药？」\n\n有人接：「管他什么药，好看就行！」\n\n段四 ｜ 台词□场景□设定□人设□节奏□机味□\n\n三天面磨完，唐牛儿的手上磨出两个水泡。第三天傍晚交工，他把最后一袋面扛进后院，蹲在墙根下不动窝。武大验面的时候抓了一撮，搓开，吹了吹。\n\n「磨得细。」他把面收进缸里，又说，「明日你再来，我请你吃饼。」\n\n唐牛儿站在原地，半天没说出话来。他挨过衙门的板子，挨过行会老大鞭子，还头一回碰上赔完账还请吃饼的。蹲了半晌，他憋出一句：「……管饭？」\n\n「管饭。」武大说，「管饱。汤随便喝。」\n\n唐牛儿咂咂嘴，把这句话当宝贝似的揣回了家。当晚他娘问他面手上的泡哪来的，他说：「给一位贵人磨面。」他娘追着问了三条街，也没问出贵人是谁。\n\n傍晚关摊，武大当众洗笼布——洗给明天看。次日辰时开卖，五十笼，辰时三刻售罄。有人挤进来问还有没有，他指了指木牌：「明日请早。」\n\n那天夜里，他蹲在灶台边拆洗砖缝，为着明日开市大扫除。指尖忽然触到一片硬物，抠出来，是半张折得极小的纸。油灯下摊开：一张保书，只剩半枚，按着指印，印得很重，纸背都透了印——按印的人当时用了大力气。\n\n「这怂货，」武大对着灯想了想，「倒是比我会藏东西。」\n\n他把纸收进贴身的夹层。窗外有人提着灯笼走过，声音飘进来：「听说了么，武大郎这两天不对劲……」\n\n段五 ｜ 台词□场景□设定□人设□节奏□机味□\n\n同一个夜里，县市集口没有月亮。\n\n何九叔站在街角的阴影里，掂了掂手里递来的锦盒。他掂得很熟——掂的是分量，不是物件。盒盖开着一线，里面垫着官银，银上压着一张纸，纸上印着炊饼摊的花样。\n\n「押司，这饼花的纸，仿得像么？」递盒子的人声音压得很低。\n\n「像。」何九叔把盒盖合上，那一声轻得像盒盖，「比真的还像。」\n\n「东家还问，那五条规矩……」\n\n「规矩？」何九叔把锦盒拢进袖子里，慢慢往衙门方向去了，「他立他的规矩，我们收我们的月例。这县里三百年，都是这么过的。」\n\n## 第二章《断粮》\n\n段一 ｜ 台词□场景□设定□人设□节奏□机味□\n\n第二天一早，三辆空粮车从摊前掉头，车辙在青石板上留了三道，朝着三个不同的方向。\n\n三家粮行，同时毁约。\n\n「面粉紧俏，」粮行甲的掌柜站在车辕上，把契约抖得哗哗响，「契约嘛——纸是纸，粮是粮。老爷们如今只认现银，不认纸。」\n\n满街的摊贩都缩着脖子看。行会的规矩他们懂：三家同时断你的供，你这摊子就支不过三天。有个相熟的菜贩子朝武大挤挤眼，嘴型比了个「收摊」，武大只当没看见。\n\n伙计慌得去搬蒸笼：「掌柜的，咱还剩半袋面，撑不过明日……」\n\n「慌什么。」武大站在摊后没动。他等三辆车都走远了，才朝满街的人拱了拱手，声音不大，可每个人都听清了：\n\n「契约是纸，那就请三位掌柜把这纸当众收回去。市集都看着——谁毁约，谁赔市集一个说法。」\n\n段二 ｜ 台词□场景□设定□人设□节奏□机味□\n\n当天没人当众收回什么。武大也不急。\n\n他花一个下午，把三家粮行近半年的进出账摸了个底。上午买了三斗面，下午拎着账本去了粮行乙——李掌柜的粮栈最小，最经不起折腾。\n\n「李掌柜，你仓里的陈麦囤了四百石。」账本翻开，摊在柜台上。翻页处夹着一根麦秸，是当年入库的记号。「囤着陈麦，抬着新价，跟粮行甲一起做局——这笔账，是要我一个人认，还是全街的人一起算？」\n\n李掌柜的汗擦到第三块帕子：「武掌柜，话、话不能这么说……」\n\n「那就换一句。」武大把账本合上，「跟我走。毁约金按店规折成市集信誉银，往后你的粮、我的饼，一起定价，一起卖。」\n\n柜台上静了半晌。李掌柜看看账本，又看看街上熙熙攘攘买饼的人，把心一横：\n\n「……成。不过武掌柜，粮行甲背后有人，你得罪不起。」他压低了声音，「这话我今日说了，明日可不认。」\n\n「不劳你认。」武大把账本收进怀里，「粮在我的缸里，字在你的柜上。明日辰时，等你送面。」\n\n李掌柜张了张嘴，到底什么也没再说。\n\n段三 ｜ 台词□场景□设定□人设□节奏□机味□\n\n夜里，后厨点起三堆灶火。\n\n断供断了细面，武大便改用粗面。三搭面，三次醒；行军灶的火候，三堆火各自看住一头，谁也不欺负谁。\n\n「火分三堆，如同分兵；面醒三次，如同休整。」他把面摔上案板，声音不高，却带着股不容错身的劲。两个伙计连夜守灶，打瞌睡都被这股劲激醒。\n\n半夜里，伙计看见掌柜扶着灶壁，半边头抵在凉砖上，额上全是细汗。\n\n「掌柜的，你脸色好白。要不要去躺躺？」\n\n「老毛病。」武大闭着眼数灶火。三，六，九——数数是军中的止疼法，前世每逢头风发作，也是这么数帐前的旗。那时节没人敢问他疼不疼，如今倒有两个伙计守着他熬半夜。他把这个念头掐了，接着数。疼过去那阵，他睁开眼，在账本角落画了个小小的「三」字。\n\n今日，第三次了。\n\n段四 ｜ 台词□场景□设定□人设□节奏□机味□\n\n第三天清早，粗面新饼开卖。\n\n麦香是压不住的，半条街都闻得见。头一个客人咬下去，整张脸顿了顿；第二口还没咬，周围伸过来的手已经排成了队。看客咬下第一口时齐齐静了一瞬，随后嗡的一声炸开——隔壁细面摊的掌柜探着头，咽了口唾沫，转身把自己摊上的幌子往下摘了一半，怕人比着两家买。\n\n「这粗饼怎么比细面还香？」\n\n「饿出来的手艺。」武大说。\n\n卖到辰时末，售罄的木牌挂出去，人群还不散。有人隔着摊问：「掌柜的，你这手艺收不收徒？」\n\n「收。」武大指了指木牌上的店规，「先背规矩。」\n\n同一时刻，绸缎庄内室。烛影里，白氏开了一只木匣。匣子的锁是新的，匣身是旧的——换过锁。她从里面取出一纸旧文书，指尖抚过上面的指印，力道轻得像抚一道旧伤疤。\n\n「他不是爱立规矩吗。」她把文书放回去，合上匣盖，「春杏，去请何押司。就说，我给他捎了份大礼。」\n\n段五 ｜ 台词□场景□设定□人设□节奏□机味□\n\n第四天清早，拍门声比鸡叫先到。\n\n何九叔带着两个衙役立在门口，手里一纸拘票，朱红的印，罪名两行：私抬粮价，扰乱市集。画押处一枚指印，按得又重又清。\n\n「武大郎，」何九叔把拘票抖开，眼睛看着街面不看人，「你自己看看这指印。」\n\n伙计手里的笼屉差点脱手。两个衙役上前半步，一左一右。武大却把两只手在围裙上擦了擦，才去接拘票——接官府文书，手上不能有油。\n\n他没看罪名，先看纸角。纸角有一道折痕，叠得很小，是塞在袖筒里揣来的。他又看那枚指印，红得发乌，边上一圈洇开——按印的时候，手指上蘸的东西太多，急了。\n\n他笑了。\n\n「老爷，」他说，「我三个月没出过阳谷县。这指印是谁的手，你猜，还是我猜？」\n\n何九叔的眉毛跳了一下：「少贫嘴。明日辰时，衙门过堂，误了时辰，可是你自己不认拘票。」\n\n「好说。」武大把拘票折好收进怀里，又把围裙解下来，叠好，搭在案板上，像每日收摊那样仔细，「劳烦回禀上差——明日的老面，今夜总得喂最后一遍。」\n\n## 第三章《都头》\n\n段一 ｜ 台词□场景□设定□人设□节奏□机味□\n\n武松是跨着门槛进来的。刀先进门，人后进门。\n\n打虎都头的名声满天下，可他进门头一件事，是在店规匾底下站定，从头看到尾——五条规矩，一条条看完，脸上什么表情都没有。\n\n「哥哥。」他开口了，「私设公堂，强买粮行。按律，杖八十。」\n\n院子里两个伙计吓得连大气都不敢出。武大却把袖子挽了挽，把账本从案下搬出来，推过去。\n\n「三郎。先看账，再办我。」他说，「账清了，刀我自己领。」\n\n段二 ｜ 台词□场景□设定□人设□节奏□机味□\n\n账本没看完，武松先出的手。\n\n没有招式，没有试探，第一拳就是打虎的拳。拳风擦着武大的耳朵过去，带起的风压得蒸笼里的白汽都歪了。武大侧身让过，扁担横扫，脚下走的是军阵的步子——布鞋底在院子里磨出半圆，磨穿了，露出袜子，步子却一步不乱，围猎圈羊似的把武松的拳路往死角里带。\n\n武松的第二拳变了线。他不追拳了，去追步子——行伍出身的人认得出，这不是市井把式，是踩过阵、见过血的步子。第三拳收了七分力，落在扁担上，试的是对面的筋骨。\n\n三十招开外，武松跳出战圈，收了拳。\n\n武大虎口裂了，血顺着扁担纹往下走。他把扁担立到墙边，喘匀了气，站直。\n\n「你这身手，」武松盯着他，「哪学的？」\n\n「梦里一位故人，教过我。」\n\n武松盯着他看了很久很久。院子里静得能听见灶上老面开裂的细响。最后说出的话，却不是他预想里任何一句：\n\n「你到底是谁。」\n\n段三 ｜ 台词□场景□设定□人设□节奏□机味□\n\n武大没答这个问题。他把人领进屋，从贴身夹层里取出那半枚保书，又把昨日的拘票铺在账台上。\n\n两张纸并排。油灯拨亮，两枚指印对齐。\n\n「同一只手按的。」武大说，「拘票上说我私抬粮价——可我这三个月，就没出过阳谷县。这世上知道我指印按在哪份东西上、又能把印仿得这么真的——」\n\n「只有让我画过押的人。」武松替他把话说完了，呼吸沉了下去。\n\n「走。」武大把账册夹上胳膊，把没裂的那只手朝门外一让，「对质去。」\n\n段四 ｜ 台词□场景□设定□人设□节奏□机味□\n\n县衙前的告示墙下，看客围了三层。\n\n武松把拘票、账册、三家粮行的毁约文契一样一样摆在石阶上，最后是那半枚保书。每摆一样，人群的声音就矮一截；摆到账册那本时，前排已经有人踮着脚念上面的字了。\n\n「都头在此。谁画押，谁对质。」他抱起手臂，「指印在，人证在，账册在。何押司——你收礼的时候，可想到过今日？」\n\n何九叔的官帽檐上滚下来一颗汗珠。他往前挪了半步，腰弯下去一寸：「都头说笑了，下官只是照章办事……」\n\n「照章？」武大接过话头，指着拘票上那枚假指印，「好。那就从这张假指印的『章』，查起。查它从谁手里出来，银子从谁袖子里过去，画的押，照的是谁家的『规』。」\n\n他一口气说了三个「照」，一个比一个慢。满街的人听懂了：这不是卖饼的话，这是审案的话。\n\n人群里有人小声学舌：「店规第三条——」笑声跟着起来了，压过了衙役的呵斥。规矩这种东西，传起来比谣言还快。\n\n段五 ｜ 台词□场景□设定□人设□节奏□机味□\n\n街对面，一顶青绸小轿停着，一直没动。\n\n轿帘掀开一线。白氏用团扇挡了半张脸——只挡嘴，不挡眼。\n\n「好一个武大郎。」她隔着半条街，声音低得只有自己听得见。\n\n武大像是后颈长了眼睛，遥遥朝轿子方向一揖，笑得像迎接贵客：「东家的茶，改日必登门讨。」\n\n轿帘放下了。轿夫起杠的号子响起来，青绸轿子稳稳抬走，一只手在帘子后面收紧了帕子——今夜，那只木匣要打开第二次。匣底压着的，除了那纸保书，还有一件连何九叔都不知道的东西。\n\n人群散得慢。今天这一场，往后半个月都是阳谷县街面上的下饭菜。有两个老主顾围着武大问长问短，问完了才想起买饼，一人又提了一笼回去。\n\n段六 ｜ 台词□场景□设定□人设□节奏□机味□\n\n夜里，武松把佩刀放在了店规匾下。\n\n刀身入鞘的轻响里，匾额压出一声吱呀。刀放的位置偏右三寸——按他自己的惯用手估摸的，让哥哥伸手就能拿到。\n\n「你的规矩，」他说，「我替你看着。」\n\n「三郎。」武大应了一声。\n\n太阳穴里那根针又扎下来了，比前两日任何一次都狠。今日已是用到第三次——数火的时候一次，对账的时候一次，这是第三次。眼前的灯焰晃成两团，又并成一团。他把一只手背到身后，掐住自己的腕子，指甲掐进肉里，另一只手扶住匾额，没有让笑散掉。\n\n「明日卯时，吃饼再走。孤——」他顿了顿，把那个字咽回去，「我。我等你回来。」\n\n武松走后，铺子里只剩一盏灯。\n\n武大对着店规匾坐了很久。灯芯结了花，他也没去剪。这具躯壳几天前还在被人踩脸，如今全阳谷县最锋利的刀，睡在它的匾底下。\n\n他揉着突突跳的太阳穴，低声说：「这一次，孤的江山，只有一间铺面。」\n\n这一回，他没改口。\n"}, "runstate" fig": {"layers": "@default:layers", "inversionCount": "@default:inversionCount", "placement": "@default:placement"}, "desc": "选题素材解剖技能——申论式四层剥离（现象/利益/权力/结构），把热点事件聚合成关系结构与权力不对称，从关系逆位生成爽点候选，产出材料落位表。素材不解剖=假材料，梗不落位=装饰品。"}, "m2.structure-design": {"kind": "agent", "title": "structure-design", "stage": "m2", "module": "m2", "kit": "plot", "op": "structure-design", "output": "02-编剧/structure-design.md", "skill": "structure-design", "minitool": "kb_search", "config": {"fuseCount": "@default:fuseCount", "injectUncertainty": "@default:injectUncertainty", "steps": "@default:steps"}, "desc": "第二阶段技能——从结构目录选型并完成深挖/改造/融合三步，产出故事框架案（结构选型理由+骨架具体化+改造点+不确定因素注入提案），确保节奏对齐市场实盘。"}, "m2.plot-choreographer": {"kind": "agent", "title": "plot-choreographer", "stage": "m2", "module": "m2", "kit": "plot", "op": "plot-choreographer", "output": "02-编剧/plot-choreographer.md", "skill": "plot-choreographer", "minitool": "check_aesthetic_asserts", "asserts": ["AE-CURVE-STALL", "AE-CURVE-TYPE", "AE-CUSHION", "AE-DESERT", "AE-END-MECH", "AE-REV-MIDPOINT", "AE-REV-SETUP"], "config": {"actModel": "@default:actModel", "cardDensity": "@default:cardDensity", "dataAnchor": "@default:dataAnchor", "lineCount": "@default:lineCount"}, "desc": "剧情编排技能——把八段式策划案升级为可拍的三线骨架×分集功能表×卡点编排表；数据骨架（市场实盘）与美学标准（kb/aesthetic）双驱动。"}, "m2.subplot-weave": {"kind": "agent", "title": "暗线编织", "stage": "m2", "module": "m2", "kit": "plot", "op": "subplot-weave", "output": "02-编剧/subplot-weave.md", "skill": "subplot-weave", "minitool": "check_aesthetic_asserts", "knowledge": ["kb/structure/episodic-webnovel", "kb/aesthetic/emotion-curve", "kb/aesthetic/reversal", "kb/craft/highlight-loop"], "config": {"weaveDensity": "@default:weaveDensity", "revealCurve": "@default:revealCurve"}, "desc": "暗线编织技能——在主骨架之上叠加第二条叙事线（身份线/复仇线/情感线）：暗线锚点表（每锚点=明线事件+暗线推进量）、双轨咬合检查（暗线停摆=空转）、揭示节奏规划（铺垫→半揭→反转→兑现）；暗线只在编剧层锁定，成文层无权改戏。"}, "m2.novel-bible": {"kind": "agent", "title": "novel-bible", "stage": "m2", "module": "m2", "kit": "plot", "op": "novel-bible", "output" /* ---------- 布局：模块横向拼接 ｜ 模块内竖向主轴 ｜ 插件左分支 ｜ 连接件在模块缝 ----------
   数据源唯一：DATA.modules（payload 契约「画布布局的唯一来源」）；EFF.links 只出连接件的模式与裁决态。 */
const NW=196, NH=76, GY=64, MG=44;
const PLUGIN_DX=24;                       // 插件分支：骨架主轴左侧的偏移
const SPINE_DX=PLUGIN_DX+NW+18;           // 主轴相对模块带左缘的偏移（≥插件宽度，两列不相交）
const MOD_GAP=132;                        // 模块缝宽：连接件走这里
const MODULE_PALETTE=["#5e7d5a","#4f6d8c","#9c6b4a","#7d5f8a","#a5546b","#5f7d7d","#8c6d4f","#6b4f7d"];
let pos = {};
let moduleBand = {}, moduleLinks = [], nodeMeta = {}, parCols = new Set();
const moduleColor = i => MODULE_PALETTE[i % MODULE_PALETTE.length];
function autoLayout(){
  pos = {}; moduleBand = {}; moduleLinks = []; nodeMeta = {}; parCols = new Set();
  const insts = DATA.modules || [];
  insts.forEach((inst, i) => {
    const spineSet = new Set(inst.spine || []);
    const pluginSet = new Set(inst.plugins || []);
    const allNodes = [...new Set([...(inst.nodes || inst.spine || []), ...(inst.plugins || [])])];
    const bx = MG + i*(SPINE_DX+NW+MOD_GAP);
    moduleBand[inst.id] = {from: bx, to: bx + SPINE_DX + NW, index: i, inst,
                           color: moduleColor(i)};
    allNodes.forEach((nid, k) => {
      const plugin = pluginSet.has(nid);
      nodeMeta[nid] = {instId: inst.id, index: i, plugin, color: moduleColor(i)};
      pos[nid] = [bx + (plugin ? PLUGIN_DX : SPINE_DX), MG + 56 + k*(NH+GY)];
    });
  });
  // 连接件：相邻模块之间铸一个（EFF.links 为内核事实源），画在模块缝上，锚住目标模块入口行
  ((EFF && EFF.links) || []).forEach(l => {
    const from = moduleBand[l.fromModule], to = moduleBand[l.toModule];
    if (!from || !to) return;
    const first = ((DATA.modules[to.index] || {}).spine || []).find(nid => pos[nid]);
    const y = first ? pos[first][1] + NH/2 : MG + 56 + NH/2;
    moduleLinks.push({id: l.id, mode: l.mode || "auto", state: l.state || "pending",
                      x1: from.to + 6, x2: to.from - 6, y, fromModule: l.fromModule, toModule: l.toModule});
  });
  // EFF 里有、DATA.modules 没覆盖的节点（内核先行/数据不同步）：显式可见，不静默丢弃
  const orphans = Object.keys(nodes).filter(nid => !pos[nid] && !nid.endsWith(".link"));
  if (orphans.length){
    const bx = MG + insts.length*(SPINE_DX+NW+MOD_GAP);
    orphans.forEach((nid, k) => {
      nodeMeta[nid] = {instId: "?", index: insts.length, plugin: false, color: "#b8b0a4", orphan: true};
      pos[nid] = [bx + SPINE_DX, MG + 56 + k*(NH+GY)];
    });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在模块；无选中则取第一个未完成模块 */
function currentStageId(){
  const cur = sel || lastSel;
  if (cur && nodeMeta[cur]) return nodeMeta[cur].instId;
  for (const inst of (DATA.modules||[])){
    if ((inst.spine||[]).some(x => st(x) !== "done")) return inst.id;
  }
  return ((DATA.modules||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = moduleBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    if (pt[0] >= band.from && pt[0] <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (DATA.modules||[]).map(s=>s.id);
  if (!ids.length) return;
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 渲染 ---------- */
/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}
/* when 的人类可读摘要（画布标签 / 连线面板） */
function whenText(w){
  if (w===undefined || w===null) return "";
  if (typeof w==="string") return w;
  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");
  if (w.all) parts.push("("+w.all.map(whenText).filter(Boolean).join(" 且 ")+")");
  return parts.join(" 且 ");
}
/* 节点产物路径：唯一事实源 = node.output；交付清单只补"交付路径"（path）——不再有第二个字段名（规范 R4 §5.1） */
function nodeOutputs(n){
  const outs=[];
  const m = nodes[n] || {};
  if (m.output) outs.push(m.output);
  (flow.outputs||[]).forEach(o=>{
    if (o.node!==n) return;
    const p = o.path || m.output;
    if (p && !outs.includes(p)) outs.push(p);
  });
  return outs;
}
/* 节点能力：kit.op 为唯一事实源 → 由 kit 注册表取知识依据/校验；不再读已废弃的 node.kb（规范 R4 §5.1/§5.3） */
function kitOpOf(m){
  if (!m || !m.kit || !m.op) return null;
  const reg = (DATA.kits||{})[m.kit] || {};
  return {kit:m.kit, op:m.op, domain:reg.domain||"", ktitle:reg.title||"", def:(reg.ops||{})[m.op]||{}};
}

/* ================= R5/R6 · 生成式编排数据面 =================
   EFF/OVERLAY/OPTIMIZE/METRICS 已在页首数据缝从 payload 顶层分解（payload@2 五键契约）。
   全部由**内核**算好落盘（registry/effective.json / metrics-summary.json / overlay.json / optimize.json），
   页面只读不改写。派生逻辑刻意不在前端复刻一遍——「人看到的编排」与「跑的编排」必须是同一份东西。 */

/* R6：模块间连接件取代 kit 边界门。旧 isBoundaryNode 语义退役，保留空实现供未迁移面板调用（WO-7 清理） */
function isBoundaryNode(n){ return false; }
/* 本节点的 tool 指标：按 kit.op 归口（换位置不换 tool，指标该跟着 tool 走） */
function toolMetrics(m){
  if (!METRICS || !m || !m.kit || !m.op) return null;
  return (METRICS.byTool||{})[m.kit+"."+m.op] || null;
}
function fmtPct(x){ return (x===undefined||x===null||isNaN(x))?"-":Math.round(x*100)+"%"; }
function fmtEff(x){
  if (x===undefined||x===null||isNaN(x)) return "-";
  if (x===0) return "0";
  return x<0.001 ? x.toExponential(1) : x.toFixed(3);
}
/* 指标徽章：tool 效率（产物被下游真正消费的次数 ÷ 成本） + 上下文命中率（注入的标尺被引用的比例） */
function metricBadges(m){
  const t = toolMetrics(m);
  if (!t) return `<span class="mb" title="本项目尚无该 tool 的运行指标（未跑到 / 未落盘）">未采样</span>`;
  const hit = (t.ctxOffered||0) > 0 ? t.hitRate : null;
  const hitCls = hit===null ? "" : (hit>=0.6?"good":(hit>=0.3?"warn":"bad"));
  const effCls = (t.consumedBy||0) > 0 ? "good" : "bad";

/* artifact@1 头部（规范 R4 §二）：版本与审核背景的唯一落点；正文不再承载这些。
   只认 artifact:1 的头部，解析顶层标量 + 一层嵌套（review）——与内核 asserts.ts 同口径。 */
function parseArtifactHeader(text){
  if (typeof text !== "string") return null;
  const m = /^\uFEFF?---\r?\n([\s\S]{0,3000}?)\r?\n---/.exec(text);
  if (!m || !/^\s*artifact\s*:\s*1\s*$/m.test(m[1])) return null;
  const kv={}, nested=[], list=[]; let sec=null;
  m[1].split(/\r?\n/).forEach(raw=>{
    if (!raw.trim() || raw.trim().startsWith("#")) return;
    const indent=/^\s+\S/.test(raw);
    let mm=/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(raw);
    if (mm){ if (indent && sec) nested.push([sec, mm[1], mm[2].trim()]); else { sec=mm[1]; kv[mm[1]]=mm[2].trim(); } return; }
    mm=/^\s*-\s*(.*)$/.exec(raw);
    if (mm) list.push([sec, mm[1].trim()]);
  });
  return {get:k=>kv[k], kv, nested, list,
          review: Object.fromEntries(nested.filter(x=>x[0]==="review").map(x=>[x[1],x[2]])),
          upstream: list.filter(x=>x[0]==="upstream").map(x=>x[1])};
}

  Object.keys(nodes).forEach(n=>{ const s=st(n); c[s]=(c[s]||0)+1; });
  const pd = pendingDiffs();
  const alarm = pd.length ? `<span id="diff-alarm" class="alarm" title="点击查看未重跑提交的修改清单">✎ ${pd.length} 处修改未重跑</span>` : "";
  document.getElementById("hud").innerHTML =
    `<span>节点 <b>${Object.keys(nodes).length}</b></span><span>完成 <b>${c.done||0}</b></span><span>待决 <b>${c.awaiting||0}</b></span><span>待重跑 <b>${c.pending||0}</b></span>${alarm}<span id="saved" aria-live="polite"></span>`;
  const da = document.getElementById("diff-alarm");
  if (da) da.onclick = openPendingDiffs;
}

/* ---------- 拖拽 ---------- */
let drag = null;
function startDrag(e, n){
  e.stopPropagation(); hideTip();
  drag = {n, sx:e.clientX, sy:e.clientY, ox:pos[n][0], oy:pos[n][1], moved:false};
}
function dragMove(e){
  // 3px 内不算拖动：纯点击绝不能在 mousedown~click 之间重建 DOM，
  // 否则原节点元素被拆除，click 派发到游离元素上丢失，select 永不触发
  if (!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 3) return;
  drag.moved = true;
  const k = view.k;
  pos[drag.n] = [Math.round(drag.ox + (e.clientX-drag.sx)/k), Math.round(drag.oy + (e.clientY-drag.sy)/k)];
  render();
}
function commitDrag(){ drag = null; }

let navStack = [], curNav = {type:"shelf"};
function navPush(d){
  if (JSON.stringify(d) === JSON.stringify(curNav)) { curNav = d; return; }
  navStack.push(curNav); curNav = d;
  dBack.style.display = navStack.length ? "" : "none";
}
function navBack(){
  const prev = navStack.pop() || {type:"shelf"};
  curNav = prev;
  if (prev.type === "node"){ sel = prev.n; curVer = prev.ver || 0; docMode = prev.mode || "view"; render(); openNodeDoc(prev.n); }
  else if (prev.type === "file"){ docMode = prev.mode || "view"; openFileDoc(prev.f); }
  else if (prev.type === "edge") openEdgeDoc(prev.id);
  else if (prev.type === "ledger") openLedger();
  else if (prev.type === "deliverables") openDeliverables();
  else if (prev.type === "worldbook") openWorldbook();
  else if (prev.type === "skill") openSkillEditor(prev.path.replace(/^skills\//,"").replace(/\.md$/,""));
  else if (prev.type === "wfmgmt") openWfMgmt(prev.tab);
  else openShelf();
}

function hideTip(){ document.getElementById("ctip").style.display="none"; }
function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function nodePagesets(n){

    const v=vers[vers.length-1-curVer]||vers[vers.length-1];
    return {from:"snap", v, pages:Object.keys(v.content||{}).map(f=>({name:f, md:v.content[f]||""}))};
  }
  const outs=nodeOutputs(n).filter(f=>files[f]);
  if (outs.length) return {from:"file", pages:outs.map(f=>({name:f, md:files[f]}))};
  return {from:"none", pages:[]};
