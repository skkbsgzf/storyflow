#drawer{border-top:1px solid var(--line);background:var(--bg-chrome);display:none;max-height:46%;overflow:auto;padding:12px 16px}
#drawer.on{display:block}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:calc(13px*var(--fs,1));margin-bottom:10px;align-items:baseline}
.kv .k{color:var(--ink-3)}.kv .v{color:var(--ink-2);word-break:break-all}
.kv code{background:var(--bg-code);padding:1px 6px;border-radius:var(--r-s);font-size:calc(12px*var(--fs,1))}
.md{font-size:calc(13px*var(--fs,1));line-height:1.9;font-family:var(--font-doc)}
.md h2{font-family:'Noto Serif SC','SimSun',serif;font-size:calc(17px*var(--fs,1));border-left:3px solid var(--accent);padding-left:10px;margin:18px 0 8px}
.md h3{font-size:calc(14.5px*var(--fs,1));margin:16px 0 6px}
.md h4{font-size:calc(13px*var(--fs,1));margin:12px 0 4px}
.md table{border-collapse:collapse;width:100%;font-size:calc(12px*var(--fs,1));margin:10px 0}
.md th,.md td{border:1px solid var(--line);padding:5px 8px}.md th{background:var(--bg-th)}
.md code{background:var(--bg-code);padding:1px 5px;border-radius:var(--r-s);font-size:calc(12px*var(--fs,1))}
.md blockquote{border-left:3px solid #c9c1b2;margin:8px 0;padding:4px 12px;color:#6b665c}
.md ul,.md ol{padding-left:18px}
.md img{max-width:100%;border-radius:var(--r-s);display:block;margin:8px 0}
.md a[data-open]{color:var(--accent);text-decoration:underline;cursor:pointer}
.codeblock{background:var(--bg-code);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;overflow:auto;margin:10px 0}
.codeblock code{background:none;padding:0;font-size:calc(12px*var(--fs,1));white-space:pre}
textarea{width:100%;min-height:340px;background:var(--bg-ctl);color:var(--ink);border:1px solid #d3ccc0;border-radius:var(--r-m);font-size:calc(13px*var(--fs,1));
         font-family:Consolas,'Microsoft YaHei',monospace;font-size:calc(12.5px*var(--fs,1));padding:12px;resize:vertical;line-height:1.6}
.act{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.task{background:var(--bg-ctl);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;font-family:Consolas,monospace;font-size:calc(12px*var(--fs,1));
      white-space:pre-wrap;word-break:break-all;color:#4a453c;max-height:300px;overflow:auto}
.vbtns{display:flex;gap:8px;margin:10px 0}
.vbtns button{flex:1;border-radius:var(--r-m);padding:9px 0;font-size:calc(12px*var(--fs,1));cursor:pointer;border:1px solid var(--line-node);background:var(--bg-ctl);color:var(--ink-2)}
.vbtns .ok:hover{border-color:#5a8a5e;background:#f0f5ee}
.vbtns .no:hover{border-color:#a5433a;background:#faf0ee}
.seal{display:inline-block;border:1.5px solid #a5433a;color:#a5433a;font-size:calc(10.5px*var(--fs,1));font-weight:700;
      padding:0 6px;border-radius:var(--r-s);letter-spacing:1px;margin-left:6px;vertical-align:1px}
.preset{display:inline-block;font-size:calc(10.5px*var(--fs,1));border-radius:var(--r-s);padding:1px 7px;margin-right:6px}
.p-auto{background:#e8efe4;color:#3d6b45}.p-semi{background:#f3ecd8;color:#8a6b2a}.p-manual{background:#f3e4e0;color:#8c352c}
.d-add{background:#e8efe4;color:#3d6b45;display:block;padding:0 5px}
.d-del{background:#f3e4e0;color:#8c352c;display:block;padding:0 5px;text-decoration:line-through}
/* ---- 流商店（Obsidian 商店式独立页） ---- */
#store{position:fixed;inset:0;z-index:120;background:var(--bg-app);display:none;flex-direction:column}
#store.on{display:flex}
.store-top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.store-top .st-brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(16px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
.store-top .st-sub{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
#store-q{flex:1;min-width:180px;max-width:420px;height:30px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-ctl);color:var(--ink);padding:0 12px;font-size:calc(12px*var(--fs,1));outline:none}
#store-q:focus{border-color:var(--accent)}
.st-cat{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:999px;height:26px;padding:0 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
.st-cat.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.st-sort{height:26px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-ctl);color:var(--ink-2);font-size:calc(12px*var(--fs,1))}
.st-cats{display:flex;gap:8px;padding:12px 22px 0;flex-wrap:wrap;max-width:1200px;margin:0 auto;width:100%}
.store-body{flex:1;overflow:auto;padding:18px 22px 46px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.store-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:14px 15px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s,border-color .15s}
.store-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.sc-head{display:flex;gap:10px;align-items:center;min-width:0}
.st-ico{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(19px*var(--fs,1))}
.sc-name{font-weight:700;font-size:calc(13.5px*var(--fs,1));color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sc-id{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;font-family:Consolas,monospace}
.sc-desc{font-size:calc(12px*var(--fs,1));color:var(--ink-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line-paper);min-height:28px}
.sc-stat{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.sc-badge{margin-left:auto;font-size:calc(10.5px*var(--fs,1));border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.sc-badge.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sc-badge.up{border-color:var(--accent);color:var(--accent);font-weight:700}
.sc-badge.used{border-color:#5b7d5c;color:#5b7d5c}
.sc-badge.none{border-style:dashed}
.sc-go{margin-left:8px}
.sc-ver{font-size:calc(10.5px*var(--fs,1));border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.sc-ver.rel{border-color:#5b7d5c;color:#5b7d5c}
.sd-use{display:flex;flex-direction:column;gap:6px}
.sd-use-row{display:flex;align-items:center;gap:10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);flex-wrap:wrap}
.sd-use-row b{color:var(--ink)}
.sd-use-row .msg{color:var(--ink-3);font-size:calc(11px*var(--fs,1))}
.sd-use-empty{font-size:calc(12.5px*var(--fs,1));color:var(--ink-3)}
.sc-go{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:var(--r-m);height:24px;padding:0 10px;font-size:calc(11.5px*var(--fs,1));cursor:pointer;white-space:nowrap;flex-shrink:0}
.sc-go:hover{background:var(--accent);color:#fff}
.store-detail{max-width:820px;margin:0 auto;width:100%}
.st-back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--ink-2);font-size:calc(12.5px*var(--fs,1));cursor:pointer;padding:4px 0;margin-bottom:10px}
.st-back:hover{color:var(--accent)}
.sd-head{display:flex;gap:16px;align-items:flex-start;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:20px 22px}
.sd-head .st-ico{width:56px;height:56px;font-size:calc(25px*var(--fs,1));border-radius:13px}
.sd-title{font-size:calc(17px*var(--fs,1));font-weight:700;color:var(--ink)}
.sd-meta{font-size:calc(12px*var(--fs,1));color:var(--ink-3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sd-desc{margin-top:10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);line-height:1.85}
.sd-actions{display:flex;gap:10px;margin-top:14px}
.sd-main{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-m);height:32px;padding:0 18px;font-size:calc(13px*var(--fs,1));font-weight:700;cursor:pointer}
.sd-main[disabled]{opacity:.55;cursor:default}
.sd-ghost{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:32px;padding:0 16px;font-size:calc(13px*var(--fs,1));cursor:pointer}
.sd-sec{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l);padding:16px 20px;margin-top:14px}
.sd-sec h4{margin:0 0 10px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);letter-spacing:1px}
.sd-stats{display:flex;gap:28px;flex-wrap:wrap}
.sd-stat b{display:block;font-size:calc(19px*var(--fs,1));color:var(--ink)}
.sd-stat span{font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.sd-stages{display:flex;flex-wrap:wrap;gap:8px}
.sd-stage{border:1px solid var(--line);border-radius:var(--r-m);padding:5px 11px;font-size:calc(12px*var(--fs,1));color:var(--ink-2);background:var(--bg-cmt)}
.sd-stage b{color:var(--accent);margin-right:5px;font-family:Consolas,monospace}
.sd-skills{display:flex;flex-wrap:wrap;gap:7px}
.sd-skill{border:1px dashed var(--line);border-radius:999px;padding:3px 11px;font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);font-family:Consolas,monospace}
.st-empty{max-width:1200px;margin:70px auto;text-align:center;color:var(--ink-3);font-size:calc(13px*var(--fs,1))}
</style>
</head>

度：重跑范围内就绪批照常并行"}, "intervention": "跨阶段回滚唯一入口 = 用户强行介入：flow_gate {force:true, rootCauseStage} 或 flow_rerun {nodeId, dryRun} 显式指定；任何 agent 不得自作主张打回已验收阶段"}, "roleModel": {"production": "找梗师/网感师/结构选型师/分镜编剧/成品剧本师/台词打磨——在流程里干活", "review": "红方评审/审美总编/交付监理——站在质检位，只看产物、只出意见，不混入生产", "principle": "总工程师不站产线里干活。质检员站在质检位上，对关键返回信息进行把控"}, "displayName": "短剧成稿生产线", "naming": {"rule": "flow 命名 = 生产线（端到端交付物），stage = 生产线内的段落；能力段要独立成 flow 仅当它有独立交付物且被多条生产线复用", "idNote": "id 'topic-selection' 沿用 v1 历史（当时只做选题）；S2-S5 陆续并入后 id 保持稳定以保护已绑定项目，显示名已更正"}}, "files": {"台词打磨对照表.md": "# 《守堤人》台词打磨对照表（内部留痕）\n\n- 项目：p-ts-001（水利题材 · 守堤人）｜剖面：dialogue-polish · script_polish 节点\n- 日期：2026-09-16｜母本：对外交付/04-成品剧本试稿.md｜成品：对外交付/03-剧本试稿.md\n- 依据：skills/dialogue-polish.md（三遍校准，顺序固定）；kb/aesthetic/naturalness-zh（24 类清单）；kb/aesthetic/dialogue（行动性／解释独白条款／hot 档台词纪律）；kb/aesthetic/ai-trace（结构指纹）；kb/aesthetic/character（遮名测试、压力反应）；口吻基准＝选题方案.md 第二节人设语言卡\n- 纪律：情节／卡点／伏笔位零改动；口癖三变奏与关键伏笔句原样保留；本表为内部留痕件，不随对外交付物输出\n\n---\n\n## 一、打磨总览\n\n- 母本台词基线已较好（hot 档短句、口癖三变奏齐、翻译件在位），本轮改动克制：**修订台词 3 处＋标点归位 1 处＋动作说明 1 处**，其余台词逐句复核后判定保留——没有问题的句子不为追求变化而改动（naturalness-zh 判定条款 1）。\n- 主病根集中在两处工程「翻译件」的**讲解腔**：以「X，就是Y」定义句＋填充语向观众上课，命中 dialogue.md 解释独白条款。修法按该条款执行：改为冲突中的不完整信息与后果——翻译内容（土没压瓷实／钻一管土一量便知／该有的力气）原样保住，上课的姿态拆掉。\n- 关键伏笔句零触碰：「这单我不签」「每一页我都抄了三份」及全部卡点台词逐字核对在位。\n\n## 二、逐句修订对照（原句 → 改句 → 理由）\n\n| # | 位置 | 原句 | 改句 | 命中问题与依据 |\n| --- | --- | --- | --- | --- |\n| 1 | E1 场景一 · 秦江海 | 压实度不够——说白了，填堤的土没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。钻芯复检，就是从堤身上钻一管土下来，压没压实，一量便知。数字在这儿。 | 压实度不够——填堤的土，没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。不信，钻一管土上来，一量便知。数字在这儿。 | ①第 22 类填充语「说白了」；②解释独白——「钻芯复检，就是…压没压实」是停下冲突向观众下定义，改为「不信，钻一管土上来」＝当众叫阵（对白即行动：下战书）；③「压没压实」与「一量便知」信息重复，hot 档一句一个信息点。翻译件全保留：土没压瓷实／虚土见水就沉／管涌的口子／钻一管土一量便知。改后句长 4-9-18-11-5，长短错落 |\n| 2 | E3 场景一 · 雷小雨 | 快测结果，低于设计标号。标号，就是这方料该有的力气——它不够。原始样我封了，双份：一份送检，一份留底，谁也换不了！ | 快测结果，低于设计标号——这方料，没长够它该有的力气。原始样我封了，双份。一份送检，一份留底，谁也换不了！ | ①解释独白——「标号，就是X」定义腔；②「——它不够」补刀冗余（「低于」已含不够义）；改为当众指控（行动：宣判），翻译件「该有的力气」以「没长够」的口语指控保住；③冒号改句号：宣读落回口语节奏，「谁也换不了」独立成拍收狠。她 26 岁信数据不信酒桌，「没长够力气」是年轻人骂料的说法，非教科书腔 |\n| 3 | E3 场景一 · 秦江海 | 垫层垫在堤身底下，混凝土一盖，这辈子没人再看得见。规范白纸黑字——隐蔽工程要留影像。你们的影像呢？ | 垫层垫在堤身底下，混凝土一盖，一辈子没人看得见。规范上白纸黑字——隐蔽工程要留影像。你们的影像呢？ | ①「这辈子没人**再**看得见」——「再」暗含从前看得见，书面残迹且于理不合；「一辈子没人看得见」更口语更狠；②「规范」补「上」字成自然口语；③三短句递进收在问句，句长错落。翻译件（盖上就看不见→规范要留影像）零损失 |\n| 4 | E3 场景一 · 秦江海（括注） | 秦江海（不接他的话，**直起身**）：……（下文另有动作行「他直起身，朝堤顶喊。」） | 秦江海（不接他的话）：…… | 动作连续性修复：同一场「直起身」发生两次，第二次（起身朝堤顶喊人取样）才是节拍需要；删括注重复，动作线归一为「蹲着捻料说话→起身喊人」。台词与情节零改动 |\n| 5 | E3 场景二 · 秦江海 | 撕吧。这单我不签——每一页，我都抄了三份。 | 撕吧。这单我不签——每一页我都抄了三份。 | 伏笔句原样纪律：任务与选题方案（E3 拍9）指定保护句为「每一页我都抄了三份」（无逗号）；中间逗号切断后半句冲劲，标点归位，字词零改动。变奏③逐字复位 |\n\n## 三、复核保留清单（命中但不改，附判定）\n\n| 句 | 判定 |\n| --- | --- |\n| 「这单我不签」（E1）／「这一单，我还不签」＋「水，不要你觉得」（E2）／「撕吧。这单我不签——每一页我都抄了三份」（E3） | 口癖三变奏＋任务指定保护句，逐字核对原样保留 |\n| 「签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？」 | 变奏①。破折号为打断功能（第 13 类豁免）；省略句在 hot 档合法，且合他「先给账再给判」的声口 → 保留 |\n| 「堤是修给水看的，不是修给举手看的。」 | 形态近第 9 类否定式对比，但为人物 established 金句（选题方案 E1 拍6 原句）；对动作／信息／关系／节奏／人物声音五维皆不损 → 不判，保留 |\n| 「我不要你觉得，我要你觉得。」（冯有德） | 梗卡指定挂接句，「水，不要你觉得」的反拍以此为靶 → 原样 |\n| 「规矩是死的，人是活的。」（马长贵）／「再研究研究。」（冯有德）／「图纸上没有这个数。」（雷小雨） | 语言卡口癖 → 原样 |\n| 「老伙计，他们把你签出去了。」「要来水了。」「水位涨一格，你们就多欠我一页。」「汛期，会替我试。」「量堤，可以。量人心——你们不够长。」「不。他们欠了一笔——签了字，就生利息。」 | 卡点／钩子／变奏支撑台词，零改动 |\n| 「私留底稿，扰乱验收秩序。这种风气，必须刹。」「验料结果，另行核议。散会。」（冯有德） | 报纸腔正是其人设：把个人撕稿稀释成「风气问题」、把检出的假稀释进「另行核议」——腔调即 character → 保留 |\n| 「程序上，就差这一笔了。」（桂守成） | 「做流程的」层语言卡 → 保留 |\n\n## 四、三遍校准记录\n\n### 第一遍 · 人物声口（遮名抽测）\n\n- 秦江海：抽「3+820 到 3+960…」「不信，钻一管土上来，一量便知」「他们欠了一笔——签了字，就生利息」——先给数字后给判断、只陈述不恳求、把账算到涨水那天；遮名可辨 ✓\n- 马长贵：「挡大家财路」「章硬还是路子硬」「跟你吃肉」——递烟江湖腔，无书面语串味；每处错误选择都有他的理（汛期前回款）✓\n- 冯有德：「表决」「再研究研究」「你自己掂量」——句句往程序与人多后面躲，最狠一句也裹着「为你好」的棉花；阴柔成立 ✓\n- 雷小雨：「图纸上没有这个数」×2＋封样双份——只认数据，年轻不虚；「声音发紧，脚不退」处境注在 ✓\n- 桂守成：「程序上，就差这一笔了」——流程腔 ✓\n- 结论：无串味；未做「为特色而特色」的加戏，老实处的平句（工人甲一句）保平 ✓\n\n### 第二遍 · 处境校准（压力级-句长反向）\n\n- E1 验收会议室（高压·当众）：秦全短句陈述；冯压低声音只七字「全签了，就差你」；表决段台词退化到单词句（「表决。」）✓\n- E1 堤坡（独处·低压）：「老伙计」放软——对堤不说对人，同一人两种温度 ✓\n- E2 档案室（孤立·中压）：对空屋说「这一单，我还不签」，说给空屋子听比说给人听更硬 ✓\n- E3 夜查卸料点（危机）：省略主语「几点了，还在卸料」；E3 受辱当场句最短——「撕吧。」两字起手，压力与句长反向成立 ✓\n\n### 第三遍 · 去AI味（24 类＋结构指纹）\n\n- 词句层：命中并修 3 处（对照表 #1／#2／#3，均解释独白／填充语／书面残迹）；标点归位 1 处（#5）；其余台词未命中损害性条目。\n- 结构指纹：对白回合非对称（冯七字对秦长句；马哄笑—雷拍记录的打断式进出；冯「再研究研究」答非所问式撤退）；同一人物连续台词句长错落；全稿无新增排比抒情、无三段式 ✓\n- 解释残留扫描：剩余专业信息均由物件与动作承载（钢卷尺咔声锁死、快测滴一声、撕纸声独占两秒、存档联半秒特写），无向观众报幕句 ✓\n\n## 五、纪律对账\n\n- [x] 情节／卡点／伏笔位零改动（三集卡点「雷声上弦／抄写背影／反咬信」逐条比对母本一致）\n- [x] 口癖三变奏逐字核对：变奏①②③原样在位；「这单我不签」「每一页我都抄了三份」原样\n- [x] 合规红线：零真实机构名／责任人（项目部／复核组／监理皆通称）；零伤亡消费；自造专名仅临江圩、清川河\n- [x] 未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n- [x] 产物：对外交付/03-剧本试稿.md（UTF-8，成品稿）；本表为内部留痕，不随对外交付物输出\n", "多视角意见书-R1.md": "# 多视角意见书 · R1（调研验收门）｜p-ts-001《守堤人》\n\n- 被审对象：D:\\storymasterv4\\projects\\p-ts-001\\选题分析报告.md（连同其引用的梗卡、热点素材结论一并代入四视角冷读）\n- 评审剖面：plot-redline（R1 调研验收门 · 视角代入制）\n- 评审日期：2026-09-16\n- 隔离声明：未读 journal、未读生产侧推理、未读归档目录；仅依据选题分析报告 / 梗卡 / 热点素材 / 选题素材与 skills/plot-redline.md 方法论出具\n- 判定口径：读者系（目标读者 / 一般读者）给 追｜犹豫｜弃；资深编剧、甲方给 过｜打回；任一\"弃\"= 本阶段整段打回\n\n---\n\n## 一、目标读者意见\n\n**判定：犹豫**\n\n【目标读者 · 一句话标题】「大堤验收在即，全项目部只有老工程师一个人不肯签字」——我看到这行停下来了。我就是那个每次验收会前把规范翻一遍、被同事笑多事的人。这标题写的就是我们单位，不用解释我就懂他在怕什么。→ 因为「会干的不如会混的」不是编剧编的，是我每个月工资条上的事实。→ 这一条，我追。\n\n【目标读者 · 前三集全是受辱】布点我看了：E1 拒签被孤立、E2 被施压、E3 夜查被当场撕单受辱顶点，第一次当众验证要等到第 8-12 集。我看到第三集的想法是：我上班受的气还不够吗，打开手机还要看别人受气？→ 我不缺憋屈，我缺的是\"有人替我赢一次\"。前三集连一场小赢都不给，我大概率第 4 集就退出，卡点再炸我也看不见。→ 前三集里给他一次\"小验证\"我就追：比如「这方混凝土保熟吗」当场验出一车不合格料，或者复核会上老将把年轻主任的\"合格\"结论当场算塌——梗卡素材表里明明躺着这条「你大爷还是你大爷」，前三章却没用上，可惜。\n\n【目标读者 · 主角 58 岁临退】说句实话：58 岁、临退休、没有升职空间——他赢了，我能爽什么？我看这类剧想的是\"换我也能翻身\"的盼头，他这个年纪盼头有限。→ 但换个角度，我爸那代人认\"退了也要个说法\"：赢不是为了升官，是为了名字别刻在豆腐渣的碑上。这个能成立，前提是剧本真拍出\"尊严刻度\"，不许偷偷写成励志逆袭。→ 改成\"他的赢 = 制度和水的胜利 + 他保住了徒弟和堤\"，我就追。\n\n（kb_ref：kb/aesthetic/perspective-review）\n\n## 二、一般读者意见\n\n**判定：犹豫**\n\n【一般读者 · 三秒】切片词「这方混凝土保熟吗」「水位线不认识领导」——行，我笑了一下没划走。修堤的、偷工减料的、不签字的，三秒全懂，不费脑子。→ 开局成立。\n\n【一般读者 · 冷读走向】丑话说前面：这戏的骨架我三集就能背出来——\"全员签他不签 → 被穿小鞋 → 发大水他对了 → 全场下跪\"。不是我聪明，是这类片子我刷到过好几部，水利只是新皮。→ 皮新救不了骨架旧，能救的是\"我背不出来的场面\"。目前我背不出来的只有一个半：「一堤两制」洪峰分屏（他拒签的段 vs 别人签收的段同框）算一个，耳朵贴堤听水算半个。→ 这两张牌别省到后段当底牌，第一集就露脸，不然我跟它的缘分只有三秒。\n\n【一般读者 · 洪水戏期待】报告说\"灾难奇观非卖点、验证逻辑才是\"。对我这种路人，水位线对照有什么可看的？我要看的是水真的下来。→ 我知道成本有限，但「一堤两制」分屏正好是便宜又狠的中间解：不用垮堤，两条水位线一高一低就是奇观。→ 改成\"每三集一次看得见的水、结尾一次真的洪峰\"我就追；全靠会议室念数据，我弃。\n\n（kb_ref：kb/aesthetic/ai-trace——走向可预判即模板感，冷读如实陈述）\n\n## 三、资深编剧意见\n\n**判定：过（附三条手艺警告，须写进移交单）**\n\n【资深编剧 · 主角被动性】\"零反击、纯坚持、洪水替他赢\"——这个变体是真新，但它是双刃剑。清算法官交给洪水没问题（对标《重回前夫假死》\"规则与物理当清算手\"的标尺成立），可主角本人若只挨不打，中段四十集就是受苦装置。→ 底子其实是对的：拒签本身就是招。每张拒签单必须写成一次出击——指出哪个部位、要求什么、赌上什么，而不是一次忍耐。洪峰段他也必须有主动动作：巡堤查险、守住自己签过的段、抢救别人签掉的段，不能站在堤上等水替他说话。→ 这条不进移交，结构阶段一定滑成受气包流水账。\n\n【资深编剧 · 验证的因果链】洪峰验证有个物理软肋，全部材料里没人提：工程质量与水毁是概率关系，不是\"他拒签的段毫发无伤、别人签的段精准垮掉\"。真这么拍，内行当场喊假；垮得不精准，爽点又崩。→ 解法是让因果可归因：垮损部位必须与他书面拒签 / 警告记录一一对应，验证之前要有\"他留过痕\"的铺垫（检测底稿、照片、被撕的复查记录），让\"洪水当法官\"变成\"洪水宣读他早就写好的判词\"。顺带修一个细节：E3\"拒签单被当众撕\"要写清撕的是什么——流程上拒签记录撕不掉，撕他私留的检测底稿才既成立，又顺手埋下复盘实锤的伏笔。\n\n【资深编剧 · 中段燃料】60 集、核心角色 ≤5、场景 ≤3，这个配置全看对手梯子和事件升级。现有对手只有施工方、赶工期上级、复审方，中期拿什么升级？调岗管仓库、举报被压、徒弟被策反——调研只给了\"反派四件套\"的作恶原型，没有排成节拍。→ 不要求本阶段解决，但移交单要写明\"中期升级路径由结构阶段给出\"，别让方案阶段拿受辱循环注水。\n\n【资深编剧 · 蓝海证据的强度】\"语料无水利类目\"这句要打折听：没供给，可能是空白，也可能是坟场。近似带（职场 / 乡村 / 小人物）热度佐证加北美同构件成绩，三角互证是合格的，但机制带的均热度不能直接当本剧的预期热度——分发端本剧吃的是实事+男频+逆袭的流量，吃不到\"神豪暴富\"标签的买量词。报告风险 5 已认账，我只要求下游别把它当成\"已验证的蓝海\"用。\n\n（kb_ref：kb/structure/catalog——本阶段警告若不进移交，根因将顺延至结构阶段爆发）\n\n## 四、甲方意见\n\n**判定：过（附三条行动项）**\n\n【甲方 · 卖点与测试】一句话我说得出口：\"大堤验收在即，全项目部只有老总工不肯签字，洪水一来，谁签的字谁露馅。\"三秒测试过了：修堤的、偷工减料的、不签字的，我妈都能复述。专名两个（清川河 / 临江圩），留了余量。合规 C5（零真实机构名、不消费伤亡、落点问责与守护）齐备，这一块我认。\n\n【甲方 · 付费对标真空】四个对标件我一个个问了：《扫地姑娘》是女频职场，《大妈爆改》是女频，《前夫假死》是女频重生，《Tower Inferno》是北美盘子——没有一个是我要照着掏钱的\"国内男频实事向付费\"同款。报告拿 1.28 万亿水利投资当客群规模代理，那是行业盘子，不是掏钱人数；工地上的老哥确实刷短剧，但他要的是战神还是老总工，现有数据里没有答案。→ 不是打回方向，是要求立项后、开拍前补一个男频实事 / 行业向的付费成功案例或平台侧验证——报告自己标的\"待补充\"，我把它变成硬条件。\n\n【甲方 · 时点与备案】汛期情绪锚 30 天内有效，窗口按 1-2 个月计——可 60 集从立项到上线，赶今年汛期尾巴来不及，锚到播出那天就凉了。这个矛盾报告没有正面回答。→ 我要一句准话：A 级锚只影响发行档期（赶不上就等明年汛期前），长期价值押 C 级制度底座（终身责任制、质量月是年年都有的国家叙事），这笔账要在方案里写清。另外\"国债项目 + 决口\"的组合备案敏感度偏高，平台预沟通要走在剧本前面——质量月反偷工减料是官方叙事，顺着说，绝不能让\"国家的钱打了水漂\"成为主要观感，落点必须是问责机制兑现（C5 已有，执行时盯死）。\n\n## 五、矛盾并列（不合成，留裁决）\n\n1. 读者系要\"早点爽\" vs 编剧\"受辱蓄力是清算的势能\"——仲裁建议：小赢不破势能（赢一场小的、输一局更大的），条件 1 兼顾双方。\n2. 路人要水看得见 vs 调研\"奇观非卖点\"——「一堤两制」分屏是双方都能接受的中间解，建议升格为全剧视觉母题。\n3. 58 岁主角两面性并列：父辈\"退了也要个说法\"的尊严代偿成立（次客群转发的最强动力），但\"逆袭增量不足\"的犹疑同样真实——交给方案阶段在尊严刻度上做实，不许滑向励志模板。\n\n## 六、甲方约束复核（四项）\n\n| 项 | 复核结果 |\n| --- | --- |\n| 三分钟测试（3 秒即懂） | 过。「修堤的 / 偷工减料的 / 不签字的老工程师」+ 片名「守堤人」直白可复述 |\n| 零解释成本 | 设定层过（终身责任制、汛期问责皆公共语汇）；注意验证动作层的次级成本——「耳朵贴堤听水」「手电照管涌」已是不懂术语也能看懂的可视化解法，方案阶段保持这个翻译习惯 |\n| 自造专名 ≤3 | 过。清川河、临江圩共 2 个，余量 1 |\n| 合规红线 | C5 齐备且与热点素材第七节一致；执行层警告：真实灾害只作情绪举证一条是平台审核高频雷区，建议写进审片 checklist，且立项即做备案预沟通 |\n\n## 七、共识判定\n\n- **consensus：附条件过**（无\"弃\"；两处\"犹豫\"均已附条件；编剧、甲方的\"过\"均附警告 / 行动项）\n- **root_cause_stage：无（本阶段不打回）**。方向、人群、机制带选择、合规框架均立得住；缺陷集中在\"移交单缺节拍与因果的硬约束 + 付费与时点两笔账没算清\"，均可在下一阶段约束内修复，不动摇立项方向。\n- **条件清单（追加进创作约束移交单后生效）**：\n  1. 【并入 C6】前 3-5 集内 ≥1 次\"小验证 / 小胜利\"（建议取梗卡素材表 #5 复核打脸场景或「保熟吗」验料），受辱蓄力不得连续铺满 E1-E7。\n  2. 【并入 C7】洪峰验证因果可归因：垮损部位与主角书面拒签 / 警告记录一一对应，验证前有留痕铺垫；禁天罚式精准巧合。\n  3. 【并入 C7】主角主动性：拒签写成出击而非忍耐；洪峰段必须有主动动作，禁全程旁观等水。\n  4. 【甲方行动项】开拍前补男频实事向付费对标或平台侧验证；发行时点策略正面回答汛期锚时效（A 级锚只管档期，长期价值押 C 级制度底座）；立项即做平台备案预沟通。\n- **级联预警**：若选题方案 / 结构阶段无视条件 1-3，R2 验收预期打回，根因届时指认结构阶段（框架单薄 / 节拍失序），本意见书三条相关警告同步失效重审。\n\n## 八、备选增强提案（非\"单薄\"判定，强制机制未触发；供方案阶段选用）\n\n本项目不属\"四视角集体没兴奋\"的单薄案——「一堤两制」「洪水当法官」均有真实兴奋点，故不强制注入。以下为可选增强变量，格式沿 kb/aesthetic/unreasonable-highlight，各注一条合规边界：\n\n- **提案 A（人物前史）：98 洪水的债。** 给老总工加一层前史——九八抗洪时他在抢险队，师父 / 工友死在一处偷工的堤段上。效果：每次拒签从\"职业操守\"升级为\"替人讨债\"，\"零反击纯坚持\"装上发动机；目标读者\"逆袭增量不足\"的犹豫会翻盘——他赌的不是前程是命债，58 岁输得起前程，输不起再来一次。边界：前史为虚构人物往事，只取九八抗洪\"抢险与牺牲\"的英雄记忆，不指认真实事件责任、不用灾情画面。\n- **提案 B（身份层）：徒弟是泄密者。** ≤5 核心角色内，徒弟暗中被施工方收买（或被迫），夜查被提前蹲点的原因在此回收。效果：一般读者\"走向三集可背\"的冷读翻盘——最亲近之人的背叛是观众背不出来的节点，且不加角色、不加场景，燃料效率最高。\n- **提案 C（事件层）：复审组先查他。** 复审方进场，第一份被立案的是举报老总工\"泄露工程数据\"的反咬信，卡点前夜的最低谷从\"受辱\"升级为\"受冤\"。效果：第 8-12 集当众验证叠出\"自证 + 验证\"双爽，甲方\"卡点强度对标《扫地姑娘》同位爆点\"更有保障。\n\n## 九、机读摘要\n\n```json\n{\n  \"gate\": \"R1\",\n  \"project\": \"p-ts-001\",\n  \"reviewed_artifact\": \"选题分析报告.md\",\n  \"date\": \"2026-09-16\",\n  \"per_perspective\": [\n    {\"role\": \"目标读者\", \"verdict\": \"犹豫\", \"key\": \"前三集零小赢 + 58岁主角逆袭增量不足\", \"condition\": \"前3-5集≥1次小验证；尊严刻度不写成励志模板\"},\n    {\"role\": \"一般读者\", \"verdict\": \"犹豫\", \"key\": \"走向三集可背；洪水戏要看得见的水\", \"condition\": \"一堤两制分屏与贴堤听水第一集露脸；每三集一次可见的水\"},\n    {\"role\": \"资深编剧\", \"verdict\": \"过\", \"key\": \"主角被动性 / 验证因果链 / 中段燃料 / 蓝海证据强度，四条手艺警告须进移交单\"},\n    {\"role\": \"甲方\", \"verdict\": \"过\", \"key\": \"男频实事付费对标真空 + 汛期锚与制作周期矛盾 + 国债题材备案敏感度\", \"condition\": \"补付费验证；发行时点策略；备案预沟通\"}\n  ],\n  \"consensus\": \"附条件过\",\n  \"root_cause_stage\": null,\n  \"conditions_count\": 4,\n  \"proposals\": [\n    {\"id\": \"A\", \"layer\": \"人物前史\", \"content\": \"98洪水血债前史\", \"flips\": \"目标读者\"},\n    {\"id\": \"B\", \"layer\": \"身份层\", \"content\": \"徒弟被收买为泄密者\", \"flips\": \"一般读者\"},\n    {\"id\": \"C\", \"layer\": \"事件层\", \"content\": \"复审组先反咬立案老总工\", \"flips\": \"甲方 / 卡点强度\"}\n  ]\n}\n```\n\n---\n\n*依据：skills/plot-redline.md v2.0.0（视角代入制、三段式、级联纪律）；隔离纪律已执行。本意见书为 R1 验收门裁决输入，最终裁决权在流程主控与甲方。*\n", "对外交付/03-剧本试稿.md": "# 《守堤人》剧本试稿（第 1-3 集）\n\n【背景】\n当代，汛期将至。清川河上的临江圩除险加固工程进入验收阶段——大堤那头，是下游几万人的身家性命。\n\n【主角】\n秦江海：58 岁，临江圩除险加固项目部总工程师。守堤三十年，藏蓝工装洗得发白，左胸口袋别两支笔；开会最没存在感，堤上声音最大。\n马长贵：45 岁，施工方负责人。垫资垫到抵押了房子，必须赶在汛期前验收回款；对上点头哈腰递烟，对工人横眉瞪眼。\n冯有德：50 岁，项目部上级。不贪一分钱，但怕担一分责，文件夹永远抱在胸前当盾牌；嗓门越轻的事他越躲。\n雷小雨：26 岁，测绘员，秦江海的徒弟。信数据不信酒桌，全项目部唯一公开站在老头一边的人。\n桂守成：44 岁，监理负责人。头发梳得一丝不乱，从不违反任何一条程序，是验收会上落笔最快的那支笔。\n\n【剧情概括】\n第一集：验收联签只剩秦江海一人拒签，他当场指出堤身填筑压实度不合格、要求钻芯复检，遭全员举手围攻仍掷笔而去；暮色里他贴堤听水，雷声滚过——汛期第一天到了。\n第二集：办公室被搬进档案室的秦江海，用一句「水，不要你觉得」顶回「我不要你觉得」的逼签；深夜他在台灯下抄写什么，雨夜里大堤方向滚过不该有的引擎声。\n第三集：夜巡当场验出卸料混凝土低于设计标号，次日验收会上冯有德撕毁他私留的检测底稿，他以「每一页我都抄了三份」当场回击；暴雨中他把碎纸一片片捡进雨靴，复核组进场的第一份材料却是一封举报他的信。\n\n---\n\n## 第 1 集《这单我不签》\n\n【场景：临江圩除险加固项目部·验收会议室·日·内】\n\n【长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。】\n\n【笔传到长桌尽头，停住了。】\n\n【秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。】\n\n【他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。】\n\n【特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。】\n\n秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。\n\n【会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。】\n\n冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。\n\n【秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。】\n\n秦江海：压实度不够——填堤的土，没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。不信，钻一管土上来，一量便知。数字在这儿。\n\n【冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。】\n\n马长贵（笑）：老秦，你这是挡大家财路！\n\n【哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。】\n\n雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？\n\n【哄笑卡在喉咙里。缓推秦江海面部。】\n\n【特殊镜头：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。】\n\n秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？\n\n【马长贵脸上的笑一层层收干。冯有德举起手。】\n\n冯有德：表决。\n\n【手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。】\n\n【特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。】\n\n桂守成（淡淡）：程序上，就差这一笔了。\n\n冯有德：少数服从多数。\n\n【秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。】\n\n秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。\n\n【背影出门。会议室死静片刻，随即嗡地一声炸开议论。】\n\n【场景：项目部楼道·日·内】\n\n【马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。】\n\n马长贵：老秦，是你的章硬，还是我的路子硬？\n\n【秦江海把烟原样插回他胸袋，脚步没停。】\n\n秦江海：汛期，会替我试。\n\n【马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。】\n\n【场景：清川河堤段·堤坡·暮·外】\n\n【雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。】\n\n【特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。】\n\n【水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。】\n\n【特殊镜头：桩号 3+960。】\n\n【特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。】\n\n秦江海（对堤，像对故人）：老伙计，他们把你签出去了。\n\n【手指在桩号上停了很久。天边一声闷雷。】\n\n【转场：乌云压着河面推过来，雷声滚过堤顶。】\n\n【大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。】\n\n秦江海（抬头看天，轻声）：要来水了。\n\n【字幕卡：汛期第一天。】\n\n---\n\n## 第 2 集《水不要你觉得》\n\n【场景：项目部办公区·走廊→档案室·日·内】\n\n【两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。】\n\n工人甲（嘟囔）：秦总工，先在这儿委屈委屈。\n\n【秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。】\n\n【门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。】\n\n冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。\n\n【秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。】\n\n【特殊镜头：图例一角——「历史最高洪水位」。】\n\n秦江海（头也不回）：水，不要你觉得。\n\n【描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。】\n\n【场景：档案室门口·日·内】\n\n【门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。】\n\n马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。\n\n【秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。】\n\n【雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。】\n\n雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\n\n【马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。】\n\n冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。\n\n【他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。】\n\n【场景：档案室·暮·内】\n\n【秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。】\n\n【他把联签单副本铺平在桌上。】\n\n【特殊镜头：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。】\n\n秦江海（对着空档案室）：这一单，我还不签。\n\n【说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。】\n\n秦江海：量堤，可以。量人心——你们不够长。\n\n【说完才觉出掌心疼，摊开看了一眼，笑了笑。】\n\n【窗外，第一滴雨打在玻璃上。】\n\n【特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。】\n\n【窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。】\n\n【转场：雨声渐密，笔尖沙沙。】\n\n【雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。】\n\n---\n\n## 第 3 集《这方混凝土，保熟吗》\n\n【场景：清川河堤段·卸料点·夜·外】\n\n【夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。】\n\n【特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。】\n\n秦江海（画外，声音不大）：几点了，还在卸料。\n\n【工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。】\n\n工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。\n\n【他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。】\n\n【特殊镜头：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。】\n\n秦江海：这方混凝土——保熟吗？\n\n【捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。】\n\n马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\n\n【他声音抬得越高，眼睛越不看料堆。】\n\n秦江海（不接他的话）：垫层垫在堤身底下，混凝土一盖，一辈子没人看得见。规范上白纸黑字——隐蔽工程要留影像。你们的影像呢？\n\n【他直起身，朝堤顶喊。】\n\n秦江海：小雨——取样。当着大家的面。\n\n【堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。】\n\n【特殊镜头：手电光从四面八方聚拢到料堆。】\n\n【仪器滴一声——数字出来了。】\n\n雷小雨（举着记录板，当众念）：快测结果，低于设计标号——这方料，没长够它该有的力气。原始样我封了，双份。一份送检，一份留底，谁也换不了！\n\n【人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。】\n\n马长贵：明天验收会上说！\n\n【场景：验收会议室·日·内】\n\n【次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。】\n\n冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。\n\n【他开口前，眼珠照例先往左右各扫了一下。纸，碎了。】\n\n【特殊镜头：撕纸声独响，全场无声。】\n\n【特殊镜头：档案柜里，同一份记录的存档联完好归位，标签平整。】\n\n【碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。】\n\n秦江海：撕吧。这单我不签——每一页我都抄了三份。\n\n【不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。】\n\n【特殊镜头：那行批注的笔迹，一闪而过。】\n\n【冯有德趁势合上文件夹。】\n\n冯有德：验料结果，另行核议。散会。\n\n雷小雨（低声）：验了，等于白验？\n\n秦江海：不。他们欠了一笔——签了字，就生利息。\n\n【人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。】\n\n【散会，暴雨正好砸下来。】\n\n【场景：项目部楼门口·檐下·日·外（暴雨）】\n\n【雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。】\n\n【他捡完最后一片，站起身，望向河面。】\n\n【特殊镜头：闪电照出大堤全长。】\n\n【雨顺着他安全帽的帽檐往下灌，连成一道水帘。】\n\n秦江海（雷声里）：水位涨一格，你们就多欠我一页。\n\n【雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。】\n\n【转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。】\n\n【特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。】\n", "对外交付/04-成品剧本试稿.md": "# 《守堤人》成品剧本 · 第 1-3 集（试稿）\n\n- 项目：p-ts-001（水利题材 · 守堤人）｜对外交付件 04\n- 剖面：scene-screenwriter（成品剧本师）· script-final 技能 · final_script 节点\n- 生成日期：2026-09-16\n- 直接母本：小纲-第1-3集.md（B0001-B0032，三集结构、集末卡点、伏笔位全部承袭，未新增情节线）\n- 口径来源：选题方案.md（台词与人物口径）；故事框架案.md（汛期三圈钟、口癖变奏、伤亡红线）\n- 格式说明：场景头＋连贯行动段落＋角色台词；特殊镜头/旁白/转场/字幕卡以中括号一行一条；全稿零内部流程标注\n- 声明：全剧人物、机构、事件均为虚构（临江圩、清川河为自造地名）；未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n\n---\n\n## 第 1 集《这单我不签》\n\n场景一：临江圩除险加固项目部 · 验收会议室 · 日 · 内\n\n长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。笔传到长桌尽头，停住了。\n\n秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。\n\n[特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。]\n\n秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。\n\n会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。\n\n冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。\n\n秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。\n\n秦江海：压实度不够——说白了，填堤的土没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。钻芯复检，就是从堤身上钻一管土下来，压没压实，一量便知。数字在这儿。\n\n冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。\n\n马长贵（笑）：老秦，你这是挡大家财路！\n\n哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。\n\n雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？\n\n哄笑卡在喉咙里。缓推秦江海面部。\n\n[特写：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。]\n\n秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？\n\n马长贵脸上的笑一层层收干。冯有德举起手。\n\n冯有德：表决。\n\n手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。\n\n[特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。]\n\n桂守成（淡淡）：程序上，就差这一笔了。\n\n冯有德：少数服从多数。\n\n秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。\n\n秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。\n\n背影出门。会议室死静两秒，随即嗡地一声炸开议论。\n\n场景二：项目部楼道 · 日 · 内\n\n马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。\n\n马长贵：老秦，是你的章硬，还是我的路子硬？\n\n秦江海把烟原样插回他胸袋，脚步没停。\n\n秦江海：汛期，会替我试。\n\n马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。\n\n场景三：清川河堤段 · 堤坡 · 暮 · 外\n\n雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。\n\n[特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。]\n\n无台词。水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。\n\n[特写：桩号 3+960。]\n\n[特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。]\n\n秦江海（对堤，像对故人）：老伙计，他们把你签出去了。\n\n手指在桩号上停了很久。天边一声闷雷。\n\n[转场：乌云压着河面推过来，雷声滚过堤顶。]\n\n大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。\n\n秦江海（抬头看天，轻声）：要来水了。\n\n[字幕卡：汛期第一天。]\n\n（第一集完）\n\n---\n\n## 第 2 集《水不要你觉得》\n\n场景一：项目部办公区 · 走廊 → 档案室 · 日 · 内\n\n两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。\n\n工人甲（嘟囔）：秦总工，先在这儿委屈委屈。\n\n秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。\n\n门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。\n\n冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。\n\n秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。\n\n[特写：图例一角——「历史最高洪水位」。]\n\n秦江海（头也不回）：水，不要你觉得。\n\n描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。\n\n场景二：档案室门口 · 日 · 内\n\n门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。\n\n马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。\n\n秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。\n\n雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。\n\n雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\n\n马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。\n\n冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。\n\n他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。\n\n场景三：档案室 · 暮 · 内\n\n秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。\n\n他把联签单副本铺平在桌上。\n\n[特写：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。]\n\n秦江海（对着空档案室）：这一单，我还不签。\n\n说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。\n\n秦江海：量堤，可以。量人心——你们不够长。\n\n说完才觉出掌心疼，摊开看了一眼，笑了笑。\n\n窗外，第一滴雨打在玻璃上。\n\n[特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。]\n\n窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。\n\n[转场：雨声渐密，笔尖沙沙。]\n\n雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。\n\n（第二集完）\n\n---\n\n## 第 3 集《这方混凝土，保熟吗》\n\n场景一：清川河堤段 · 卸料点 · 夜 · 外\n\n夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。\n\n[特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。]\n\n秦江海（画外，声音不大）：几点了，还在卸料。\n\n工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。\n\n工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。\n\n他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。\n\n[特写：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。]\n\n秦江海：这方混凝土——保熟吗？\n\n捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。\n\n马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\n\n他声音抬得越高，眼睛越不看料堆。\n\n秦江海（不接他的话，直起身）：垫层垫在堤身底下，混凝土一盖，这辈子没人再看得见。规范白纸黑字——隐蔽工程要留影像。你们的影像呢？\n\n他直起身，朝堤顶喊。\n\n秦江海：小雨——取样。当着大家的面。\n\n堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。\n\n[特殊镜头：手电光从四面八方聚拢到料堆。]\n\n仪器滴一声——数字出来了。\n\n雷小雨（举着记录板，当众念）：快测结果，低于设计标号。标号，就是这方料该有的力气——它不够。原始样我封了，双份：一份送检，一份留底，谁也换不了！\n\n人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。\n\n马长贵：明天验收会上说！\n\n场景二：验收会议室 · 日 · 内\n\n次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。\n\n冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。\n\n他开口前，眼珠照例先往左右各扫了一下。纸，碎了。\n\n[特殊镜头：撕纸声独占两秒，全场无声。]\n\n[特写：半秒——档案柜里，同一份记录的存档联完好归位，标签平整。]\n\n碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。\n\n秦江海：撕吧。这单我不签——每一页，我都抄了三份。\n\n不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。\n\n[特写：那行批注的笔迹，一秒即过。]\n\n冯有德趁势合上文件夹。\n\n冯有德：验料结果，另行核议。散会。\n\n雷小雨（低声）：验了，等于白验？\n\n秦江海：不。他们欠了一笔——签了字，就生利息。\n\n人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。\n\n散会，暴雨正好砸下来。\n\n场景三：项目部楼门口 · 檐下 · 日 · 外（暴雨）\n\n雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。\n\n他捡完最后一片，站起身，望向河面。\n\n[特殊镜头：闪电照出大堤全长。]\n\n雨顺着他安全帽的帽檐往下灌，连成一道水帘。\n\n秦江海（雷声里）：水位涨一格，你们就多欠我一页。\n\n雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。\n\n[转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。]\n\n[特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。]\n\n（第三集完）\n\n---\n\n## 卡点体检（文末附页）\n\n### 第 1 集 · 卡点「雷声上弦」（情绪型）\n\n- 卡点画面与台词：贴堤听水（无台词名场面）→ 分界桩「老伙计，他们把你签出去了」→ 闷雷 → 大远景剪影 +「要来水了」+ 字幕卡「汛期第一天」。\n- 观众必须翻页的问题：这张被全员表决围攻的拒签单，挂不挂得住？水，几时来？\n- 强度自检：钩子不靠悬念信息靠压迫感——雷声是全剧三圈钟的第一声上弦，观众带着「水几时来对账」进第二集；过。\n\n### 第 2 集 · 卡点「抄写背影」（情绪型）\n\n- 卡点画面与台词：窗雨淌过他白天描的水位线 → 台灯下抄写的背影（抄什么不说破）→ 雨夜深处堤上滚过不该出现的引擎声，笔尖停了半拍。\n- 观众必须翻页的问题：他深夜在抄什么？夜里上堤的卡车，在干什么？\n- 强度自检：双钩并置——动作悬念（抄写）+ 事件悬念（夜车），情绪（孤立无援仍不签）与事件（偷工进行时）互为进气口；过。\n\n### 第 3 集 · 卡点「反咬信」（情绪 + 信息型）\n\n- 卡点画面与台词：檐下把碎纸一片片捡进雨靴 +「水位涨一格，你们就多欠我一页」→ 转场复核组进场牌 → 桌上第一份材料是举报秦江海「泄露工程数据」的信。\n- 观众必须翻页的问题：反咬信从哪来？他抄的三份在哪、谁会看到？被「另行核议」合法放过的假堤段，涨水后先出事的是哪一段？\n- 强度自检：受辱当场被回击垫住（撕稿→「抄三份」时差一拍），集尾把受辱升级为受冤，委屈感与信息缺口同时拉满；过。\n\n### 三集连续性复核\n\n- 结构：三集结构与集末卡点全部承自小纲（雷声上弦／抄写背影／反咬信），32 拍逐一扩写，未新增情节线；单集时长量级约 1.5-2 分钟成片（E3 验料场略长），符合竖屏单集体量。\n- 口癖三变奏：E1「这单我不签」＋「三十年押给你」（变奏①）／E2「这一单，我还不签」＋「水不要你觉得」（变奏②）／E3「撕吧。这单我不签——每一页我都抄了三份」（变奏③）。每集 ≥1，三集三变奏。\n- R1 条件可感知：E3「保熟吗」当场验料为实测小胜利（仪器读数当众念、封样双份、马长贵撂话退场）；一堤两制分屏在 E1 以界碑为轴左右摇、一侧扎实一侧水渍，视觉成立；看得见的水三集不断线（E1 河面/听水/雷雨，E2 描水位线/窗雨，E3 夜雨/暴雨/水帘/雨靴）。\n- 工程细节翻译件：压实度＝土没压瓷实、见水就沉；钻芯复检＝钻一管土下来一量便知；标号＝这方料该有的力气；封样双份＝一份送检一份留底谁也换不了；隐蔽工程留影像＝盖上去就看不见的东西必须留记录。全部台词内翻译，零讲解腔。\n- 合规自查：零真实机构名、零真实责任人（项目部/复核组/监理皆通称）；零伤亡、零惨状、零决口，水的威力只用声音与物证（水声、雨声、水渍、料粉、碎纸、雨靴）；灾害画面只拍秩序与物证；自造专名仅临江圩、清川河。\n- 待办交接：按 script-final 流程，本稿台词为初稿级定稿，须强制交接 dialogue-polish（台词去AI味）三遍校准后方可进下一环节。\n", "对外交付/选题交付页.html": "<!doctype html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>智能选题工作流 v5（阶段-菱形循环引擎：调研 → 结构 → 大纲 → 小纲 → 成稿） · 交付页<\/title>\n<style>\nbody{margin:0;background:#f3efe6;color:#2b2822;font:15px/1.75 \"Noto Sans SC\",system-ui,sans-serif}\nheader{background:#2b2822;color:#f4f1ea;padding:28px 22px}\nheader h1{margin:0;font-size:20px;letter-spacing:1px}\nheader p{margin:6px 0 0;color:#b8b0a2;font-size:12px}\nmain{max-width:860px;margin:0 auto;padding:10px 16px 60px}\nsection{background:#fffdf9;border:1px solid #e4ddcd;border-radius:4px;margin:18px 0;padding:22px 26px;box-shadow:0 2px 10px rgba(70,58,35,.07)}\nsection>h1{font-size:15px;color:#a5433a;border-bottom:1px solid #e4ddcd;padding-bottom:8px;letter-spacing:1px}\nfooter{text-align:center;color:#b3ab9b;font-size:11px;padding:20px;letter-spacing:2px}\n<\/style><\/head>\n<body>\n<header><h1>智能选题工作流 v5（阶段-菱形循环引擎：调研 → 结构 → 大纲 → 小纲 → 成稿） · 交付页<\/h1><p>由 miniflow 内核确定性渲染（零 LLM）｜ 13 件产物合一<\/p><\/header>\n<main>\n<section><h1>内部/kb-market.md<\/h1><h2>KB 装载 · market（市场快照装载）<\/h2>\n<p>&gt; 由 miniflow kernel kb_load 内建装载，来源 3 个知识文件。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/constraints.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/constraints\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"生产约束基线（短剧/漫剧实盘值）\",<\/p>\n<p>  \"version\": \"2026-09-14\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"import\",<\/p>\n<p>    \"refs\": [\"dataset:kakaxing/scriptrawstone@2026-09-14（全量统计）\", \"kb/market/snapshot.formatConstraints\", \"storymaster-v3:assets/skills/script-drama-beat.md\"]<\/p>\n<p>  },<\/p>\n<p>  \"bind\": { \"skills\": [\"plot-choreographer\"], \"minitools\": [\"check_contract_compliance\"] },<\/p>\n<p>  \"updated\": \"2026-09-14\"<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>生产约束基线<\/h2>\n<p>**用途**：选题分析报告第五节\"创作约束移交单\"的默认数值来源——约束不再拍脑袋，直接取市场实盘（7938 部在售剧本的硬格式统计）。方案对这些条款逐条对账（`kb/aesthetic/oversight` 监理纪律，违反一票否决）。<\/p>\n<h3>一、体量约束（分布即标准）<\/h3>\n<p class=\"row\"> ┃  维度  ┃  主流值  ┃  分布依据  ┃ <\/p>\n<p class=\"row\"> ┃  集数  ┃  **60 集**（4224 部）  ┃  50 集 945 / 80 集 925 / 40 集 718 / 30 集 116  ┃ <\/p>\n<p class=\"row\"> ┃  单集时长  ┃  **1-1.5 分钟**  ┃  竖屏付费短剧口径  ┃ <\/p>\n<p class=\"row\"> ┃  单集字数上限  ┃  **1200 字**（4284 部）  ┃  1000 字 1640 / 1400 字 528 / 1600 字 476  ┃ <\/p>\n<p class=\"row\"> ┃  场景数上限  ┃  **≤3**（7937/7938）  ┃  几乎全库硬约束——低成本快转景  ┃ <\/p>\n<p class=\"row\"> ┃  主要演员上限  ┃  **≤10**（7925 部）  ┃  同上  ┃ <\/p>\n<p>**用法**：方案默认按 60 集 × 1.5 分钟 × 1200 字 × ≤3 场景 × ≤10 演员声明约束；偏离主流值（如 80 集或 4 场景）必须在移交单中显式声明并给理由——偏离不是错，隐式偏离才是错。<\/p>\n<h3>二、约束 → 编排的直接推论<\/h3>\n<p>1. **3 场景上限** ⇒ 每集冲突必须发生在可复用景（宅门/办公室/宫殿/车厢）；换景 = 换集节拍点。剧情编排师分集时先画场景复用表。<\/p>\n<p>2. **10 演员上限** ⇒ 有名有姓角色 ≤10（含反派）；群演反应拍（当众打脸必需）不计入，但\"全场惊呆\"必须由环境描写的群演承担。<\/p>\n<p>3. **1-1.5 分钟 ≈ 600-900 字正文**（script-drama-beat 口径）⇒ 每集 8-12 拍，前 3 秒钩子约 1 拍、结尾卡点约 2 拍。<\/p>\n<p>4. **60 集 × 1.5 分钟 = 90 分钟总片长** ⇒ 实际叙事容量 ≈ 一部电影的紧凑版：主线只容 1 个大反转 + 2-3 个中型反转（`kb/aesthetic/reversal` 结构位点联动），副线必须挂主线条件。<\/p>\n<h3>三、题材标签纪律<\/h3>\n<p>申报题材标签从市场受控词表取（快照 `genreHeatCN`/`genreHeatNA` 中的 genre 字段），不用自造词；标签组合 = 1 主题材 + 2-3 副标签（市场策划案通行形），标签顺序即卖点顺序。<\/p>\n<h3>四、与硬断言的绑定<\/h3>\n<p>本条目数值进入约束移交单后，由 minitool `check_contract_compliance` 逐条对账；分拍格式合规由 `AE-BEAT-FORMAT` 断言扫描（`kb/aesthetic/assertions.json`）。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/setting-rules.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/setting-rules\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"设定体系约束（项目级：世界观代入成本红线）\",<\/p>\n<p>  \"dimension\": \"setting\",<\/p>\n<p>  \"version\": \"1.0.0\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [\"AE-SET-ORIG\", \"AE-SET-3MIN\"],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"factory\",<\/p>\n<p>    \"refs\": [<\/p>\n<p>      \"user-feedback:2026-09-15（禁止原创科幻世界观——点子好但没有厚度，读者不能快速代入；用市面做过的设定体系或实事新闻做底子）\",<\/p>\n<p>      \"kb/market/constraints（生产约束基线，本条目为其世界观维度扩展）\"<\/p>\n<p>    ]<\/p>\n<p>  },<\/p>\n<p>  \"updated\": \"2026-09-15\",<\/p>\n<p>  \"bind\": { \"skills\": [\"structure-design\", \"topic-analysis-report\"], \"minitools\": [\"check_aesthetic_asserts\"] }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>设定体系约束（世界观代入成本红线）<\/h2>\n<p>**命题：短剧/漫剧的观众没有耐心学一套新世界观。** 点子再好，架构没有厚度——读者无法快速代入理解——就是废案。世界观的代入成本是选题阶段的一票项，不是成稿阶段再优化的细节。<\/p>\n<h3>一、设定来源三级制<\/h3>\n<p class=\"row\"> ┃  级别  ┃  来源  ┃  判定  ┃ <\/p>\n<p class=\"row\"> ┃  **首选**  ┃  **实事新闻做底子**：防汛救灾、工程质量清查、债务与烂尾、养老与医疗、裁员与再就业——全民共识的公共事件，零解释成本，主旋律有锚  ┃  ✅ 直接可用  ┃ <\/p>\n<p class=\"row\"> ┃  **次选**  ┃  **市面验证过的设定体系做创新改编**：战神归来/赘婿/重生/系统/马甲/先婚后爱等——观众已被市场教会规则，创新只做变体不做体系  ┃  ✅ 可用，须挂竞品对标  ┃ <\/p>\n<p class=\"row\"> ┃  **禁止**  ┃  **原创科幻/架空世界观**：自造中台/异能体系/架空王朝规则等需要观众先学后看的设定  ┃  ❌ 一票否决  ┃ <\/p>\n<h3>二、判定方法：三分钟测试<\/h3>\n<ul>\n<li>【block】**三分钟测试**：路人观众开播 3 分钟内，在不依赖任何设定解释的前提下，能否说出\"这是谁、他想要什么、为什么替他急\"？凡需要先讲设定才能进冲突的开局 = 违反本约束。<\/li>\n<li>【major】设定词密度：前三章正文中的**自造专名**（体系名/组织名/规则名）≤2 个；超过即代入成本超标。<\/li>\n<li>【major】实事锚点：选题理由必须至少引用一条**当月公共议题/新闻方向**作为情绪底（与 zeitgeist 步联动），架空设定天然缺此锚。<\/li>\n<\/ul>\n<h3>三、正确的\"创新\"位置<\/h3>\n<p>约束禁止的是**世界观层原创**，不禁止创意：创新发生在①**人物关系与身份层**（不确定因素注入：黑道大小姐/真假千金/穿书/初版作者）；②**结构改造**（`kb/structure/catalog` 三步）；③**实事底子上的具体事件**。好点子要长在观众熟悉的土壤上——点子的锐度 × 土壤的熟悉度 = 代入速度。<\/p>\n<h3>四、执行接线<\/h3>\n<ul>\n<li>S1 调研：约束移交单新增 **C10 设定体系约束**（本条目），选题方向必须声明设定来源级别。<\/li>\n<li>S2 结构：框架案的世界观节按三级制声明来源；原创倾向在此拦截。<\/li>\n<li>R1/R2 红方：三分钟测试 + 设定词密度为固定检查项（`kb/aesthetic/perspective-review` 一般读者视角主责）。<\/li>\n<\/ul>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/meme-rules.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/meme-rules\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"梗密度与发散性约束（S1 网感输入源）\",<\/p>\n<p>  \"dimension\": \"meme\",<\/p>\n<p>  \"version\": \"1.0.0\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [\"AE-MEME-DENSITY\", \"AE-MEME-SPREAD\"],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"factory\",<\/p>\n<p>    \"refs\": [\"user-feedback:2026-09-15（选题作为网感输入源需足够多的梗、有发散性；梗传播度与密度不足则观众无趣；纳入知名梗词典网站）\"]<\/p>\n<p>  },<\/p>\n<p>  \"updated\": \"2026-09-15\",<\/p>\n<p>  \"bind\": { \"skills\": [\"find-trope\", \"topic-analysis-report\"], \"minitools\": [\"meme_harvest（待实现）\", \"kb_search\"] }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>梗密度与发散性约束<\/h2>\n<p>**命题：选题阶段是全流程的网感输入源。** 选题产出的梗与素材要喂给后续所有阶段（结构/方案/剧本/传播切片）；梗的传播度和密度不足，后续每一层都会\"无趣\"——这不是文案问题，是资源储量问题。<\/p>\n<h3>一、S1 产出硬指标<\/h3>\n<p class=\"row\"> ┃  指标  ┃  要求  ┃ <\/p>\n<p class=\"row\"> ┃  **网络热梗素材表**  ┃  S1 梗卡必须附带 ≥10 条与题材相关的**现存高传播梗**（每条：梗名/来源与传播度评级/可挂接的场景示例）  ┃ <\/p>\n<p class=\"row\"> ┃  **发散性**  ┃  每个主梗/新变体须可拆出 ≥3 个跨场景可复用的梗用法（对话梗/场面梗/切片梗）——只在一个场景成立的梗不算储量  ┃ <\/p>\n<p class=\"row\"> ┃  **密度自查**  ┃  前三章每集至少 1 处可独立切片传播的\"梗点\"（观众能截出来转发的东西）  ┃ <\/p>\n<h3>二、梗词典数据源（纳入数据库的输入源清单）<\/h3>\n<p class=\"row\"> ┃  源  ┃  类型  ┃  用途  ┃ <\/p>\n<p class=\"row\"> ┃  小鸡词典（含镜像存档）  ┃  梗词典  ┃  梗的出处、演变、用法  ┃ <\/p>\n<p class=\"row\"> ┃  梗百科 / 萌娘百科  ┃  百科类  ┃  梗的条目化解释与传播链  ┃ <\/p>\n<p class=\"row\"> ┃  B 站热梗榜 / 抖音话题榜  ┃  平台热榜  ┃  当期传播度实测  ┃ <\/p>\n<p class=\"row\"> ┃  知乎\"网络流行语\"相关高赞  ┃  语义讨论  ┃  梗的语义漂移与代际差异  ┃ <\/p>\n<p class=\"row\"> ┃  微博热搜 / 百度指数  ┃  传播度实测  ┃  评级数据源  ┃ <\/p>\n<p>接入方式：`meme_harvest` minitool（待实现，规格：抓取/清洗/去重/传播度评级 → 产出 `梗素材表` 增量并入 KB）；实现前由调研步人工按上表整理，**梗素材表仍为 S1 必交付**。<\/p>\n<h3>三、与既有约束的关系<\/h3>\n<ul>\n<li>梗密度约束**不替代** C10 设定约束（`kb/market/setting-rules`）：梗要密度，设定要低代入成本，两条红线并行。<\/li>\n<li>题材选择本身受梗密度约束**反向影响**：同等条件下，优先选**梗储量高的领域**（如国球/职场/校园——全民梗库富矿），放弃梗荒领域（例：无公共记忆的架空科幻）。<\/li>\n<\/ul><\/section>\n<section><h1>选题素材.md<\/h1><h2>选题素材 · 守堤人（甲方需求，全新重跑 2026-09-16）<\/h2>\n<h3>甲方点子<\/h3>\n<p>老牌水利工程师，众人偷工减料混官场，唯他坚持指出工程问题。<\/p>\n<h3>甲方约束<\/h3>\n<ul>\n<li>实事做底，零解释成本（三分钟测试：观众 3 秒即懂\"修堤的、偷工减料的、不签字的老工程师\"）<\/li>\n<li>自造专名 ≤3 个，无架空体系术语<\/li>\n<\/ul>\n<h3>供给参考（实事底子，非创作成果）<\/h3>\n<ul>\n<li>堤防除险加固国债项目、工程质量终身责任制、汛期应急响应与巡堤问责——公共议题，全民共识<\/li>\n<\/ul><\/section>\n<section><h1>梗卡.md<\/h1><h2>梗卡 · 守堤人（p-ts-001）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>甲方点子：老牌水利工程师，众人偷工减料混官场，唯他坚持指出工程问题（拒签问题堤段）<\/li>\n<li>硬约束：实事做底零解释成本（3 秒即懂\"修堤的、偷工减料的、不签字的老工程师\"）；自造专名 ≤3、无架空术语；不出现真实机构名<\/li>\n<li>数据快照：kakaxing/scriptrawstone@2026-09-15（6928 部解析样本）；本卡生成日 2026-09-16<\/li>\n<li>方法：skills/find-trope 五步；梗密度硬指标按 kb/market/meme-rules<\/li>\n<li>工具披露：本会话未装配 minitool `kb_search` / `check_trope_combo`——查族按 kb/trope/* 全量直读完成；复合相性按 kb/aesthetic/conflict-escalation 副线纪律人工执行（辅梗必须改变主梗的选择条件，不许只占时长）<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、查族结论（13 族全量，快照 2026-09-15）<\/h3>\n<p class=\"row\"> ┃  梗族  ┃  饱和度  ┃  n / 占比  ┃  均热度（万）  ┃  与本选题判定  ┃ <\/p>\n<p class=\"row\"> ┃  神豪暴富  ┃  上升期·蓝海偏好  ┃  380 / 5.5%  ┃  18987  ┃  **主梗候选**：机制已分化出\"隐藏硬实力→当众验证\"支线，链上无水利落点  ┃ <\/p>\n<p class=\"row\"> ┃  打脸虐渣  ┃  红海·有效  ┃  1510 / 21.8%  ┃  18558  ┃  **必备引擎**（横切超族，非题材），须带新变体  ┃ <\/p>\n<p class=\"row\"> ┃  流放种田  ┃  上升期·蓝海偏好  ┃  92 / 1.3%  ┃  22598  ┃  **辅梗候选**：取\"苦地×硬核基建翻盘\"机制，去皮（去系统/空间/穿越）  ┃ <\/p>\n<p class=\"row\"> ┃  马甲掉马  ┃  红海·过饱和  ┃  750 / 10.8%  ┃  9215（低于全库均值 10058）  ┃  只作轻辅梗：拒签单复盘式单点揭示，禁多层马甲当众撕  ┃ <\/p>\n<p class=\"row\"> ┃  赘婿战神  ┃  稳定·主流  ┃  192 / 2.8%  ┃  10684  ┃  备查：《退隐悍匠》证明中年匠人男频可行，但机制被主梗覆盖，不重复挂  ┃ <\/p>\n<p class=\"row\"> ┃  重生复仇  ┃  红海·有效  ┃  702 / 10.1%  ┃  11978  ┃  **不取**：重生把\"坚持\"降级为\"先知\"，毁实事共情底子  ┃ <\/p>\n<p class=\"row\"> ┃  先婚后爱  ┃  稳定·主流  ┃  387 / 5.6%  ┃  10092  ┃  不相性，避开  ┃ <\/p>\n<p class=\"row\"> ┃  追妻火葬场  ┃  上升期·蓝海偏好  ┃  132 / 1.9%  ┃  14218  ┃  情感族，稀释实事底子，避开  ┃ <\/p>\n<p class=\"row\"> ┃  团宠护短 / 真假千金  ┃  退潮期·慎入  ┃  63 / 83  ┃  2703 / 7938  ┃  避开  ┃ <\/p>\n<p class=\"row\"> ┃  豪门财富(NA) / 狼人命定(NA) / 奇幻生物(NA)  ┃  过饱和 / 退潮×2  ┃  895 / 359 / 161  ┃  228 / 167 / 234  ┃  CN 实事流不适用  ┃ <\/p>\n<p>语料未覆盖声明（判定纪律 4）：题材矩阵无\"水利/防汛/基建工程\"直接类目；近似带为**职场**（202 部 / 均 20951 万）、**小人物**（69 部 / 均 17609 万）、**乡村**（153 部 / 均 20748 万）——均高于全库均值 10058 万，判断\"职业实干逆袭\"带供给不足而热度在位，用对标检索兜底（见第四节）。<\/p>\n<h3>二、选型结论<\/h3>\n<p>```text<\/p>\n<p>梗卡：<\/p>\n<p>  主梗：神豪暴富梗（上升期·蓝海偏好 / n=380 / 均 18987 万，快照 2026-09-15）<\/p>\n<p>        取机制\"被低估身份 × 当众验证碾压\"——本族演化链已从\"隐藏财富\"分化出<\/p>\n<p>        \"隐藏硬实力\"支线（《扫地姑娘是百亿精算师》→《她带着百亿订单离职了》→《老炮开山》），<\/p>\n<p>        供给未追上热度，可直接主推。实事流剥离\"财富\"皮毛，只搬机制。<\/p>\n<p>  辅梗：打脸虐渣 × 流放种田（轻辅：马甲掉马）<\/p>\n<p>        相性 1（打脸虐渣，红海·有效 n=1510 / 均 18558 万）：打脸按 kb/market/structure<\/p>\n<p>        判定纪律 1 作必备引擎计。它改变主梗选择条件——主角每一次\"拒签\"都是蓄力，<\/p>\n<p>        被停职/孤立/穿小鞋是受辱；清算法官不是主角的嘴，是洪峰水位。不拒签就无清算，<\/p>\n<p>        拒签清单=清算名单，机制咬合而非占时长。<\/p>\n<p>        相性 2（流放种田，上升期 n=92 / 均 22598 万）：取\"苦地 × 现代技能绝地翻盘\"机制<\/p>\n<p>        （演化链已有《流放荒州》火药水泥硬核基建先例），把苦地从古代边关平移到汛期圩堤，<\/p>\n<p>        为主梗提供可拍的硬核基建场面库（查管涌/打桩/抢培土包）——没有它，<\/p>\n<p>        \"硬实力验证\"在实事流里没有画面落点。剥掉系统/空间/穿越皮，符合零解释成本约束。<\/p>\n<p>        轻辅（马甲掉马，过饱和 n=750 / 均 9215 万）：仅作单点揭示——洪峰后上级复盘，<\/p>\n<p>        发现压在箱底的一摞拒签单全是救命单。物件揭示，不当众撕马甲。<\/p>\n<p>  新变体落点：拒签老总工 × 洪峰当众验证——\"他没打赢任何人，是洪水替他赢了\"<\/p>\n<p>        人设轴新：链上被低估者=保洁/老员工/退休匠人（均靠亮身份翻盘）；本变体是<\/p>\n<p>        58 岁临退水利总工，且不亮任何马甲——水位线替他掉马。链上《老炮开山》做过<\/p>\n<p>        退休匠人，但其翻盘靠爆破财富帝国，\"零反击、纯坚持\"无人做过。<\/p>\n<p>        场景轴新：链上苦地=荒岛/大漠/冰原/边关（古代+架空），\"汛期圩堤 + 除险加固工地\"<\/p>\n<p>        这一现实苦地全链未做；堤防除险加固、质量终身责任制、汛期问责为全民共识公共议题，<\/p>\n<p>        满足甲方\"实事做底零解释成本\"。<\/p>\n<p>        关系轴新：对手轴从渣男/婆婆/豪门 → \"偷工减料的同僚 + 赶工期要签字的官僚链\"；<\/p>\n<p>        更关键的是清算执行者换成自然规律——物理当打脸手，链上未做过。<\/p>\n<p>  对标件：<\/p>\n<p>        kb/benchmark/b016-fam《扫地姑娘是百亿精算师》（A+ / 94000 万）<\/p>\n<p>          爆点位置：对赌谈判死局 → 当众徒手复原数据。用作\"当众验证\"强度标尺：<\/p>\n<p>          本片同位=验收会死局 → 水位/管涌现场当众验证。<\/p>\n<p>        kb/benchmark/b027-s《给大妈爆改后我成了顶流》（S 级 / AI 评 91 / 0.6 万）<\/p>\n<p>          爆点位置：露天走秀引爆全网 + 前东家回聘被拒。用作\"实干逆袭 + 冷处理反派\"<\/p>\n<p>          标尺；其\"低热度高评分\"亦证明评分与热度分离、实事向可冲评级。<\/p>\n<p>        kb/benchmark/b024-na《Tower Inferno: The Lone Architect》（A+ / 24000 万）<\/p>\n<p>          爆点位置：智能锁死火场中\"最懂这栋楼的人\"逆行 + 当众揭露。<\/p>\n<p>          用作\"专业者 × 结构性灾难 × 内部人揭露\"同构强度标尺。<\/p>\n<p>  风险：<\/p>\n<p>        1）换皮陷阱：神豪暴富族标签含\"暴富\"，实事流无暴富——创新亮点段必须回指<\/p>\n<p>        \"拒签×洪峰验证\"机制（find-trope 判定纪律 3），禁止把爽点写成\"身份财富碾压\"。<\/p>\n<p>        2）红海纪律：打脸虐渣 n=1510，不带\"洪水当法官\"新变体不得进；<\/p>\n<p>        马甲掉马过饱和（均热度已低于库均值），仅许物件式单点揭示。<\/p>\n<p>        3）合规：全稿零真实机构名（水利部/流域委等禁用）；建议自造专名仅<\/p>\n<p>        \"清川河\"（河名）\"临江圩\"（堤段名）2 个，留 1 个余量；涉汛画面不渲染灾情惨状，<\/p>\n<p>        落点锚\"问责与守护\"正价值（平台合规）。<\/p>\n<p>        4）数据时效：快照 2026-09-15，水利类目语料未覆盖（见第一节声明）。<\/p>\n<p>        5）退潮预警：勿混入团宠/真假千金/强爱情线，稀释实事底子即打回。<\/p>\n<p>```<\/p>\n<h3>三、网络热梗素材表（meme-rules 硬指标 1，n≥10）<\/h3>\n<p>传播度评级为定性口径（全民级 / 高 / 圈层），待 minitool `meme_harvest` 装配后以平台热榜实测校准（meme-rules 第二节：实现前人工按梗词典源整理）。<\/p>\n<p class=\"row\"> ┃  #  ┃  梗名  ┃  来源与传播度  ┃  可挂接场景示例  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  豆腐渣工程  ┃  98 洪水后定型公共词，官媒历年沿用；全民级  ┃  反派堤段的代名词；\"他签的不是字，是豆腐渣\"  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  基建狂魔  ┃  外媒称谓转网络自称（微博/知乎）；全民级  ┃  主角行业自豪台词：\"真正的基建狂魔，是敢对堤说不的人\"  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  到 XX 看海  ┃  2011 起每逢城市内涝的年度话题；全民级年年返场  ┃  汛期开场钩子/溃堤后果预演：\"今年不用去临江看海了\"  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  扫地僧  ┃  《天龙八部》→ 泛化\"深藏不露的老高手\"；全民级  ┃  老总工身份揭示：褪色劳模奖章 + 一手压箱底拒签单  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  你大爷还是你大爷  ┃  2019 抖音/B 站；全民级  ┃  复核现场老将当场算塌年轻主任的\"合格\"结论  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  00 后整顿职场  ┃  2022 起职场热搜常客；高传播  ┃  变体：\"老师傅整顿工程圈\"——切片标题直接可用  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  我不要你觉得，我要我觉得  ┃  2019\"明学\"；全民级  ┃  施压签字台词，主角回敬：\"水不要你觉得\"  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  格局打开  ┃  2020-2021 泛用劝解梗；全民级  ┃  同僚劝\"别较真，格局打开\"，主角：\"堤垮了格局更大\"  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  实锤 / 求锤得锤  ┃  微博吃瓜语系；全民级  ┃  主角检测报告=实锤；反派堵举报信=求锤得锤  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  塌房  ┃  饭圈泛化（2020 起）；全民级  ┃  双关切片点：人设塌房之前，堤先塌——\"这次塌的是真的\"  ┃ <\/p>\n<p class=\"row\"> ┃  11  ┃  临时工  ┃  2010s 公共回应语；全民级老梗  ┃  出事故全场甩锅\"施工队是临时的\"，问责链现形  ┃ <\/p>\n<p class=\"row\"> ┃  12  ┃  回旋镖  ┃  2023-2024 抖音/B 站；高传播  ┃  洪峰冲垮的正是反派自己签的堤段——回旋镖扎自己  ┃ <\/p>\n<p class=\"row\"> ┃  13  ┃  偷感（很重）  ┃  2024 网络热梗；高传播  ┃  夜间偷工换料被手电钉在堤坡的\"偷感\"名场面  ┃ <\/p>\n<p class=\"row\"> ┃  14  ┃  已老实，求放过  ┃  2024 网络热梗；高传播  ┃  终身责任制条款亮出，反派当场\"已老实\"  ┃ <\/p>\n<p class=\"row\"> ┃  15  ┃  听我说谢谢你  ┃  2022 泛化后带讽刺义；全民级  ┃  表彰会歌舞被一句\"堤还没验\"摁停——讽刺形式主义  ┃ <\/p>\n<p class=\"row\"> ┃  16  ┃  这瓜保熟吗  ┃  《征服》翻红梗；全民级  ┃  验料灵魂拷问：\"这方混凝土，保熟吗？\"  ┃ <\/p>\n<h3>四、发散性与密度自查（meme-rules 硬指标 2、3）<\/h3>\n<p>**主梗/新变体拆解——跨场景可复用梗用法（各 ≥3）：**<\/p>\n<ul>\n<li>对话梗：口癖「这单我不签。」——hot 档每集 ≥1 次、3 集内变奏 3 次（不签 / 签了我把三十年押给你 / 这单我签，命也押上）；calm 档作集尾单句。<\/li>\n<li>对话梗：「水位线不认识领导。」「水不会陪你们演戏。」——理性金句，验收会/抢险/复盘三场景通用。<\/li>\n<li>场面梗：一堤两制同框——他拒签的堤段 vs 签收的堤段在洪峰中分屏对照；天然切片物料，可用于任何\"对照验证\"场景。<\/li>\n<li>场面梗：拒签单物件母题（calm 档硬标准 ≥2 物件之一，另一件建议雨靴）——会议桌拍特写 / 被撕 / 复盘时被上级一页页翻。<\/li>\n<li>场面梗：耳朵贴堤听水声、手电照管涌——专业实感名场面（海报级分镜位），可复用于巡堤/抢险/教学带徒。<\/li>\n<li>切片梗：「这方混凝土保熟吗？」拷问式验料；「偷感」夜施现场面；已老实式认怂——均可独立成 15 秒切片。<\/li>\n<\/ul>\n<p>**前三章梗点布点（密度自查口径：每集 ≥1 处可独立切片的梗点）：**<\/p>\n<ul>\n<li>E1：开标会全员签字、他独拒签 + 「水位线不认识领导」→ 对话切片点<\/li>\n<li>E2：施压戏「我不要你觉得」×「水不要你觉得」→ 对撞切片点<\/li>\n<li>E3：夜查偷工\"偷感\"名场面 + 拒签单被当众撕 → 场面切片点（受辱蓄力顶点，集尾连本带利伏笔）<\/li>\n<\/ul>\n<p>自查结论：前三章每集 ≥1 可切片梗点，通过；主梗机制 × 未使用落点成立，非换皮。<\/p>\n<p>---<\/p>\n<p>*依据：skills/find-trope@find-trope 五步法；kb/market/meme-rules v1.0.0；kb/market/snapshot@2026-09-15；kb/market/structure@2026-09-14；kb/aesthetic/style-routes、conflict-escalation。本卡为选题方案前置件，进分析报告第二节（竞品与梗选型）。*<\/p><\/section>\n<section><h1>内部/断言报告-combo.json<\/h1><p>{<\/p>\n<p>  \"mode\": \"integrity\",<\/p>\n<p>  \"node\": \"combo\",<\/p>\n<p>  \"minitool\": \"check_trope_combo\",<\/p>\n<p>  \"ch 睽下洗脱罪名反转绝杀。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将文抄打脸微创为硬核法医断案，强化智力碾压与悬疑张力。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代首席法医穿越为京城第一草包沈浪，原主因花重金买通考官混入大理寺，恰逢皇室重宝失窃案暴雷，政敌严党趁机将他推上金銮殿当作替罪羊定为死罪。面临当场问斩死局，沈浪果断撕碎纨绔伪装，凭借现代微量物证与法医解剖知识，金殿之上隔空验尸断案，三炷香内揪出真正盗宝内鬼，奇迹般反杀脱罪并被御赐查案特权。沈浪借机深入朝堂，暗中调查沈家满门被诬陷通敌的陈年旧案，面对刑部与外戚世家的连环构陷，他以痕迹学破奇案、以逻辑侧写抓内奸，屡破京城惊天悬案。在此期间，原本对他鄙夷至极的冷面女首辅被其折服，在生死危局中暗送机密，两人在杀机四伏的暗巷中近身藏匿，呼吸交融间情愫暗生。随着真相大白，幕后黑手联合藩王兵变逼宫，沈浪以奇谋瓦解死局，亲手将仇敌送上断头台，从人人唾弃的替罪草包彻底登顶为执掌天下刑狱的第一权臣。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b002-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b002-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 败家状元：开局做空敌国商会\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎\",<\/p>\n<p> \"heat_w\": 150000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"85\",<\/p>\n<p> \"family\": \"zhuangyuan-keju\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2092069560063504384\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 败家状元：开局做空敌国商会<\/h2>\n<p>&gt; CN 市场 · 男频 · A+ 级（AI 评 85） · 热度 150000 万 · 梗族：科举逆袭梗<\/p>\n<ul>\n<li>**一句话卖点**：败光家产的假状元被逼补千万亏空，现代操盘手用降维金融战做空敌国问鼎首辅。<\/li>\n<li>**题材**：爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎<\/li>\n<li>**共情点**：击中当代年轻人背负债务危机、被资方与小人压榨剥削的无力感，渴望财力逆天暴富破局。<\/li>\n<li>**爽点内核**：以现代资本运作和算力认知差疯狂收割古代权臣与敌国财阀，实现财富与权力的绝对碾压。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将朝堂文斗微创为现代金融商战，做空国运爽感拉满。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代顶级量化操盘手苏林穿越成败家世子，原主不仅败光祖业，还借高利贷买通考官混成户部新科状元。开局即逢国库暴雷亏空千万两，内阁首辅趁机发难，逼他三日内补齐亏空否则全家抄斩。面对必死绝境，苏林运用现代金融做空与杠杆原理，以荒唐的赌石和粮券为幌子，诱导满朝贪官与敌国商会入局对赌，一夜之间狂揽三千万两白银填平国库，让企图看笑话的百官当场惊骇瘫软。为保住侯府并查明生母被毒害真相，苏林表面继续挥金如土扮作疯批财神，暗中建立横跨诸国的商贸情报网。敌国首富之女携万金前来经济绞杀，却在生死商战博弈中屡屡被苏林算无遗策所征服，密室对峙时被逼至墙角气息紊乱甘愿奉上全部底牌。最终敌国联合权臣发动粮荒逼宫，苏林以汇率战瞬间搞垮敌国经济，手刃仇敌，从全京城笑柄一跃成为掌控帝国经济命脉的无冕之王。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b003-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b003-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 草包状元：开局沙盘点崩十军\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈\",<\/p>\n<p> \"heat_w\": 150000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"83\",<\/p>\n<p> \"family\": \"zhuangyuan-keju\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2092069560269025280\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 草包状元：开局沙盘点崩十军<\/h2>\n<p>&gt; CN 市场 · 男频 · A 级（AI 评 83） · 热度 150000 万 · 梗族：科举逆袭梗<\/p>\n<ul>\n<li>**一句话卖点**：换得虚名文状元的纨绔质子，在敌国围城之际用现代兵法沙盘推演一战封神。<\/li>\n<li>**题材**：爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈<\/li>\n<li>**共情点**：击中普通人面对强权压制时被边缘化、被当作炮灰的屈辱，渴望在绝境中展现统御全场的实力。<\/li>\n<li>**爽点内核**：以现代超维战术兵法降维碾压古代名将与奸佞，从任人宰割的弃子逆天登顶为镇国统帅。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将文状元微创为兵法奇才，用现代兵棋推演制造反转。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代兵棋推演教官陆宵穿越成敌国为质多年的镇北王幼子，原主为了苟活行贿考官混得文状元虚名，沦为满朝笑柄。恰逢敌国百万铁骑兵临城下并派出使臣金殿威逼割地，主和派权臣趁机进谗推陆宵去前线充当死士炮灰。面对绝命杀局，陆宵在金銮殿当众立下军令状，以现代几何沙盘展开多维战术推演，顷刻间算崩敌国使臣布下的千古杀阵，语惊四座令帝王拜服赐予兵权。为替惨死的镇北军洗刷叛国冤屈，陆宵表面狂放荒唐纵情声色以麻痹政敌，暗中推行特种战术与后勤现代化改革。敌国冷艳刺客公主潜入刺杀却被反制，昏暗帐中兵刃相抵间被其无双韬略彻底折服，由仇敌转为甘愿为他刺探军情的暗桩。最终叛相引敌军围困京师，陆宵亲率奇兵以闪电战包抄敌后全歼叛军诛杀主谋，从人人唾弃的草包质子终成威震天下的帝国第一镇国战神。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b004-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b004-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 天灾流放，我靠百亿空间养活瞎眼杀神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"空间囤粮，天灾末世，宅斗权谋，强强救赎\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"87\",<\/p>\n<p> \"family\": \"chongsheng-fuchou\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427127161913344\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 天灾流放，我靠百亿空间养活瞎眼杀神<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 87） · 热度 129000 万 · 梗族：重生复仇梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：手握百亿空间的黑莲花，在极寒流放地捡了个瞎眼杀神当夫君<\/li>\n<li>**题材**：空间囤粮，天灾末世，宅斗权谋，强强救赎<\/li>\n<li>**共情点**：受众：满足在恶劣环境、天灾之下渴望无限物资的安全感，以及手撕绿茶极品、玩转男神的爽感<\/li>\n<li>**爽点内核**：内核：在冰冷天灾里用无限物资筑起温暖堡垒，两个极度自私破碎的灵魂在互相利用中完成终极救赎<\/li>\n<li>**创新亮点**：亮点：空间囤货配合AIGC生成的风雪、冰暴等天灾特效，视觉对比极强，瞎眼杀神白切黑的极致拉扯<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：顾明霜前世是被至亲背叛、最终在极寒中冻死的世家嫡女，她的致命缺陷是极度多疑、不信任任何人。重生回到全家被流放前夕，她觉醒了无限囤货的百亿储物空间。顾明霜搬空了死敌的国库与粮仓，在发配寒荒的路上，当所有人都在风雪中挨饿受冻时，她却在自己的马车里吃着火锅烤肉。在流放之地的乱石岗，她为了寻找一个强大的保镖（核心欲望：在乱世中绝对安稳地活下去），用一块热饼换回了快要病死、双目失明的奴隶白发少年。她不知道这个叫墨苍的少年，正是被废黜的白发杀神。墨苍冷血残酷，却唯独在顾明霜面前乖巧得像只温顺的狼犬。顾明霜在寒荒冰原上开辟良田、建立坚不可摧的暖谷要塞，更因为无限的粮食被绝望的十万流民当成悲悯世人的神女。当墨苍的眼睛复明、重掌天下杀权，所有曾欺辱顾明霜的仇人跪地颤抖时，顾明霜才明白，这个男人早就将灵魂献祭给了她（深层需求：治愈多疑的内心，接纳真正的偏爱），他杀尽天下人，只为给她撑起一片无忧无虑的暖冬温床。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b005-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b005-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 荒漠驿站：光脑美食养战神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"科幻穿越，美食基建，甜宠逆袭，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"86\",<\/p>\n<p> \"family\": \"zhuxu-zhanshen\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067064854056665088\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 荒漠驿站：光脑美食养战神<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 86） · 热度 129000 万 · 梗族：赘婿战神梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：AI学家用能变出抽水机的牛肉面，套牢了被全城通缉的冷面刀客<\/li>\n<li>**题材**：科幻穿越，美食基建，甜宠逆袭，AIGC<\/li>\n<li>**共情点**：受众：热爱高概念科技感与美食疗愈的年轻女性，击中在大城市焦虑中渴望安全庇护的心理<\/li>\n<li>**爽点内核**：内核：用科技降维打击恶劣自然，用美食治愈破碎英雄，夫妻携手建起荒漠中最坚固的绿洲帝国<\/li>\n<li>**创新亮点**：亮点：科幻光脑与古装荒漠的美学碰撞，美食不仅能吃还能具现科技设备，契约婚姻下的读心术反差让暧昧张力拉满<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：盛晚是未来世界后勤AI学家，携带着光脑合成空间穿越到大旱两年的边关黄沙地。她继承了一个破烂的荒漠驿站。面对四处肆虐的流寇，盛晚一眼相中了昏迷在驿站门口、浑身是伤的冷面刀客霍骁。霍骁曾是威震边疆的守卫者，却被奸人诬陷而功力尽废。盛晚具有严重的被迫害妄想症，她急需强大的保镖。盛晚利用光脑将美食与科技结合，做出的红烧肉能疗伤，牛肉面能具现出微型抽水机。她提出契约婚姻，她负责神级后勤，霍骁当安保大队长。在漫天黄沙中，他们建起了全科技覆盖的绿洲城堡。霍骁惊奇地发现自己能听到盛晚脑中的科技蓝图，两人的默契达到诡异的巅峰。霍骁在盛晚的科学调教下恢复神力并集结旧部，彻底清算叛贼（核心欲望：盛晚想在荒漠躺平，却被迫推着霍骁成为荒漠之王），两人共同开启了科技大漠的新秩序。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b006-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b006-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 深海炼金：我把人鱼养成了皇\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"魔幻逆袭，深海种田，萌宠经营，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"85\",<\/p>\n<p> \"family\": \"yangcheng-huibao\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067064854241214464\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 深海炼金：我把人鱼养成了皇<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 85） · 热度 129000 万 · 梗族：养成回报梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：海洋馆长流放孤岛，用炼金术把捡来的废柴人鱼养成了深海霸主<\/li>\n<li>**题材**：魔幻逆袭，深海种田，萌宠经营，AIGC<\/li>\n<li>**共情点**：受众：追求瑰丽视觉奇观与极致占有欲男主的女性观众，击中女性对神秘力量与偏爱的向往<\/li>\n<li>**爽点内核**：内核：你用海洋庇护我的身躯，我用烈火与黄金为你铸造最璀璨的王冠，双强携手制霸海陆<\/li>\n<li>**创新亮点**：亮点：AIGC完美呈现发光海底、人鱼眼泪化作珍珠、沧龙拉车等瑰丽奇观，傲娇人鱼与高冷馆长的契约甜宠极其好嗑<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：虞娇是现代海洋馆馆长，穿越到孤悬海外、资源匮乏的极恶荒岛。作为罪民之女，她开局被村民逼着祭海。虞娇靠着深海沟通异能不仅没淹死，还在海底捞出了一只遍体鳞伤、被当成废鱼丢弃的蓝发男子澜沧。澜沧其实是遭遇背叛而失忆的深海人鱼皇。虞娇对人类防备心极重，但对海洋生物却无比温柔。她决定和澜沧假结婚，虞娇在荒岛上用炼金术提取深海矿物修筑避风港，种植海底灵药，指挥大白鲨运输队，将荒岛打造成海上帝国的贸易核心。澜沧在虞娇的无限宠溺和美食滋养下逐渐恢复记忆与神力，从傲娇小人鱼变成了占有欲极强的深海霸主（核心欲望：将荒岛建设成最安全的避风港）。当贪婪的外敌舰队降临荒岛时，澜沧掀起万丈巨浪，而虞娇驾驭着深海巨兽，两人彻底改写了海陆规则，虞娇也治愈了自闭的创伤。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b007-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b007-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 荒沙之上，罪妻手握机械狂潮\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"穿越种田，赛博古风，爽剧逆袭，残疾战神\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"xianhun-lianai\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427126981558272\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 荒沙之上，罪妻手握机械狂潮<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：先婚后爱梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：末世机械姬嫁给瘫痪废柴世子，用废铜烂铁打造塞博古风边塞<\/li>\n<li>**题材**：穿越种田，赛博古风，爽剧逆袭，残疾战神<\/li>\n<li>**共情点**：受众：喜欢搞事业、反套路女主、以及迷恋冷面硬汉被科技武装后疯狂打脸反击的女性群体<\/li>\n<li>**爽点内核**：内核：无情机械脑与落魄残疾世子的实用主义婚姻，在绝对力量与重金属美学中绽放的极致安全感<\/li>\n<li>**创新亮点**：亮点：将古风与硬核机械、蒸汽朋克完美融合，AIGC生成的金属异兽、古风机甲极具视觉震撼力<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：叶清是末世顶级的机械改造师，性格冰冷，理性至极，唯一的致命缺陷是对人类情感完全不敏感。她意外穿越到大靖王朝的荒沙边塞，成为一名发配冲喜的罪女，嫁给双腿瘫痪、被家族抛弃的废柴世子陆景川。陆景川心冷如冰，本以为这只是又一次羞辱，冷漠拒绝叶清的靠近。但叶清的核心欲望在古代重组：她要在这片荒凉废土上收集废铁，重建她的机械帝国。她与陆景川达成合作，她负责修复他的双腿并提供防卫，他负责提供边疆名分。叶清利用机械感知能力，将边荒的废弃古矿、破旧农具改装成自动灌溉的微型机械水源、精钢骨骼轮椅，甚至收服了沙漠中暴虐的机械化铁甲巨蜥。在叶清源源不断的降维科技武装下，原本等死的陆景川不仅重新站了起来，更在战场上化身重型装甲战神，横扫外敌。在一次次生死相依中，叶清那颗冰冷的机械心脏被陆景川炽热而偏执的深情融化，她不再将他视为合作伙伴（深层需求：学会信任与去爱），陆景川也彻底化身护妻狂魔，誓死守护他的赛博神女。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b008-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b008-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 流放荒岛：我契约巨兽养出海上帝王\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"荒岛求生，控水神豪，爽剧逆袭，先婚后爱\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"liufang-zhongtian\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427119192735744\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 流放荒岛：我契约巨兽养出海上帝王<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：流放种田梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：海洋学家携控水异能被贬蛮荒海岛，驯服深海巨兽养出海上帝王<\/li>\n<li>**题材**：荒岛求生，控水神豪，爽剧逆袭，先婚后爱<\/li>\n<li>**共情点**：受众：25至45岁女性，钟爱海岛种田、赶海修仙及独立女强逆风翻盘，击中追求绝对自由与掌控力的心理<\/li>\n<li>**爽点内核**：内核：将一片被世人遗弃的死亡之海，用智慧与海兽契约亲手打造成海上黄金帝国，体验绝对的降维打击<\/li>\n<li>**创新亮点**：亮点：海岛赶海种田与深海巨兽契约的完美结合，避开了俗套的陆地斗争，AIGC生成的斑斓海底世界极具视觉诱惑<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：云汐是顶尖的海洋生物学家，因得罪权贵被流放到被称为恶魔之眼的蛮荒孤岛，并被迫嫁给岛上那个被废黜、满身戾气的落魄皇子战云烈。战云烈曾是帝国最耀眼的将星，如今因功高盖主被废黜，性格暴躁且充满毁灭欲。云汐的致命缺陷是严重的逃避型人格，习惯用冷漠和旁观者的姿态来面对危机。起初她只想利用自己能够操控海水和沟通海洋生物的异能，在荒岛默默赶海积攒物资逃往海外。但战云烈虽然厌世，却在海盗夜袭时用自己的身体挡住了射向她的毒箭。那一刻，云汐的逃避面具碎裂，她治愈了战云烈的内伤，并契约了守岛的九头巨蛸，将荒岛海域变成了天然的防御屏障。她带领岛民开展珍珠养殖、提炼精盐、甚至开辟了海上丝绸之路。战云烈在她的支持下重新凝聚旧部，完成从自我放弃到海上帝王的救赎转变，最终驾驶着巨兽牵引的无敌舰队踏平所有背叛者。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b009-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b009-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 暴雪封关，我靠种田捂热冷酷战神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"极寒种田，异能逆袭，先婚后爱，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"zhuxu-zhanshen\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427119012380672\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"fi rovenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2064165692025466880\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 离婚后，前夫跪求当我的贴身男仆<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 87） · 热度 118000 万 · 梗族：追妻火葬场梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：无能弃妇被离婚后继承千亿矿业，前夫为求合同主动当贴身男仆<\/li>\n<li>**题材**：豪门逆袭，职场商战，情感代偿，追妻火葬<\/li>\n<li>**共情点**：受众：25至50岁职场女性及家庭主妇，痛恨生育道德绑架，极度渴望通过经济和精神绝对独立实现话语权反转<\/li>\n<li>**爽点内核**：内核：曾经你对我爱答不理，如今我让你高攀不起，从被践踏自尊的受气包到用资本主宰前夫命运的女皇<\/li>\n<li>**创新亮点**：亮点：颠覆性地将男频爽点和女频情感进行缝合，把傲慢的前夫变成必须听话的私人助理，通过绝对的资源垄断对前夫家进行连环打脸<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：苏星言与豪门总裁薄冷夜结婚三年，因为薄家势利婆婆的重男轻女和薄冷夜的长期冷暴力，她被一纸离婚协议扫地出门，全网甚至群嘲她是三年生不出继承人的弃妇。苏星言的致命缺陷是顾念旧情（深层需求：摆脱生育工具的枷锁，证明自己在商业上的统治力）。然而，离婚当天，她不再隐忍（核心欲望：收回对不值得男人的所有隐忍，用绝对资本碾压薄家），当场继承了全球最大矿业巨头苏氏集团。此时，薄氏集团核心半导体芯片面临原材料断供危机，唯一的救命稻草就是苏星言手中的稀有矿石资源。为了拯救家族企业，薄冷夜不得不低下高傲的头颅求见神秘董事长。当他在董事长办公室看到一身华服、气场全开的前妻苏星言时，整个人信仰崩塌。苏星言根本不屑于听他的忏悔，她利用合同逼迫薄冷夜签署了私人男仆协议。苏星言将他带在身边，当着他新女友和势利母亲的面，用最无情的商战手段和职场降维打击，一点点剥夺薄冷夜的自尊与底牌，直到薄家在商战中彻底沦为底层，而苏星言则在全球商业峰会上绽放万丈光芒。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-2 分钟｜单集字数上限 1000｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b015-fam.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b015-fam\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 被嫌弃的真千金手握封神配方\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"逆袭,真假千金,爽感,科研打脸流\",<\/p>\n<p> \"heat_w\": 50000,<\/p>\n<p> \"grade
