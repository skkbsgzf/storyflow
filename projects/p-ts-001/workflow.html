心的自卑创伤强势介入，用温水胃肠减压和现代儿科抱姿安抚使抽搐骤停，幼崽当场死死抱住 Nora 颈项哭喊着认其为唯一生母。嫉恨发狂的 Daphne 在加冕阅兵大典将致盲毒刺塞入幼崽襁褓嫁祸 Nora。Nora 凭借冷静操作取出毒刺拯救小王储，更以显色留痕药水当堂拆穿 Daphne 的蛇蝎手段。昔日孤傲无情的 Gabriel 终于看清真相悔恨交加，在全军瞩目下当众扯下元帅勋章置于 Nora 掌心，甚至双膝弯曲甘愿受罚，宣告唯有 Nora 能够执掌王廷与他的生命。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b027-s.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b027-s\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 给大妈爆改后我成了顶流\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"治愈系, 职场逆袭, 发家致富, 女性群像, 现代都市\",<\/p>\n<p> \"heat_w\": 1,<\/p>\n<p> \"grade\": \"S\",<\/p>\n<p> \"score\": \"91\",<\/p>\n<p> \"family\": \"dalian-nuezha\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2096055930750730240\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 给大妈爆改后我成了顶流<\/h2>\n<p>&gt; CN 市场 · 女频 · S 级（AI 评 91） · 热度 0.5967 万 · 梗族：打脸虐渣梗<\/p>\n<ul>\n<li>**一句话卖点**：被嘲不懂潮流的落魄设计师，带失业大妈爆改中老年潮牌，露天走秀一战封神。<\/li>\n<li>**题材**：治愈系, 职场逆袭, 发家致富, 女性群像, 现代都市<\/li>\n<li>**共情点**：轻熟龄设计与运营女性，方案因不合白瘦幼主流屡遭驳回，被年龄容貌焦虑深深刺痛。<\/li>\n<li>**爽点内核**：情绪轴为从被轻视到被倚仗。冷门中年女装掀起全民抢购，傲慢前东家争相高薪回聘。<\/li>\n<li>**创新亮点**：对标《以爱为家第四季》，聚焦大龄女性潮牌创业与家庭温情治愈，新瓶落点为故事背景。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：在现代时尚设计公司，新锐设计师苏见夏因坚持打破白瘦幼审美、提倡包容性剪裁，被主管当面撕碎设计稿并逐出核心项目。苏见夏深知母亲与千千万万操劳一生的平凡女性买不到合身得体衣服的困境，毅然接下公司无人接盘的滞销老旧面料库，创立专注成熟女性的原创品牌。她力排众议拒绝雇佣年轻嫩模，大胆招募被裁员失业的素人阿姨担任试衣形象代言。面对同行水军疯狂嘲讽大妈扮嫩的恶评风暴，以及合作商场在开幕前夕临时毁约撤场的绝境，阿姨们与苏见夏的家人挚友全体出动，在露天广场连夜手搭质朴T台。聚光灯下，阿姨们步履自信、风骨沉淀的走秀视频引爆全网情感共鸣，数万订单瞬间挤爆服务器，废旧仓库一跃成为全网断货的明星工坊。前主管眼见品牌价值飙升赶来求购版权，苏见夏断然拒绝并宣布全员阿姨持股分红，彻底打破行业审美偏见，完成了从边缘弃子到时代潮流定义者的华丽蜕变。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 80｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b028-s.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b028-s\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 重回前夫假死那天，我大摆招魂席\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\",<\/p>\n<p> \"heat_w\": 14000,<\/p>\n<p> \"grade\": \"S\",<\/p>\n<p> \"score\": \"91\",<\/p>\n<p> \"family\": \"chongsheng-fuchou\",<\/p>\n<p> \"route_affinity\": \"hot\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2096055935255412736\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 重回前夫假死那天，我大摆招魂席<\/h2>\n<p>&gt; CN 市场 · 女频 · S 级（AI 评 91） · 热度 14000 万 · 梗族：重生复仇梗<\/p>\n<ul>\n<li>**一句话卖点**：渣夫假死甩万额外债携小三金蝉脱壳，贤妻重生当场设大席封门，逼得活人自己从供桌下爬出认罪！<\/li>\n<li>**题材**：爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主<\/li>\n<li>**共情点**：击中30至45岁家庭主妇为家庭掏心掏肺却被婆家合谋吸血算计的窒息痛点，让隐忍付出的憋屈感转化为反戈一击的生理爽感。<\/li>\n<li>**爽点内核**：情绪轴为从被吸血到反手清算；爽点主菜为借丧事规则瓮中捉鳖，当众揭穿骗局夺回家产，可见可数。<\/li>\n<li>**创新亮点**：对标《重回前夫假死那天，我彻底掀桌了》，将室内封棺转变为柴房困兽与招魂大席，机制落点在民俗博弈与物理困敌。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：九十年代末北方县城，纺织厂女工林秀芝操劳半生，替突遭意外身亡的丈夫还清巨债并养老送终，临终前才知当年是丈夫为了与富商之女私奔、甩掉巨额货款而导演的假死金蝉脱壳。一朝重生，她赫然回到灵堂前，婆婆和小姑子正逼她签字画押背下全部欠条。林秀芝当场掀翻认债书，冷笑着当众改办大排场招魂宴，以思念亡夫入骨为由强留全族乡亲与各路债主通宵守灵。她暗中把丈夫藏身换装的柴房反锁加固，断水断粮三天三夜，每次婆家人企图送干粮送水，都被她借敬神守节之名当场拦截打赏众人。柴房内的渣夫饥渴难耐濒临崩溃，出殡起灵当日，渣夫为活命撞破房门狼狈抢食，假死真相在全体债主眼前当场炸裂。林秀芝雷霆出手，借民事公证与借据逼婆家交出全部隐匿存折与房契，彻底斩断吸血枷锁，随后凭借前世商贸记忆承包纺织门市部，步步蜕变成为万人敬仰的民营女实业家。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p><\/section>\n<section><h1>热点素材.md<\/h1><h2>热点素材 · 守堤人（时代情绪锚）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 / 守堤人）<\/li>\n<li>剖面：story-analyst · 网感师<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>检索窗口：2026-08-17 至 2026-09-16（30 天）；窗口外证据一律降级并标注<\/li>\n<li>证据等级：A = 30 天内权威来源 / B = 略超 30 天但同汛期舆论长尾 / C = 长期可核实制度议题<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、时代情绪锚声明（按 topic-zeitgeist 第 1 条格式）<\/h3>\n<p>&gt; **时代情绪锚：本选题踩中的是「较真者的憋屈 × 汛期防洪焦虑」——认真的人在系统性糊弄面前孤军奋战，而堤的那头是千家万户的身家性命（证据：2026-09-04 全国\"质量月\"25 部门联合部署、严查偷工减料弄虚作假〔A〕；2026-09-03 台风\"沙德尔\"登陆福建、最高级别防汛应急响应〔A〕；2026-08 中旬河南某河堤防决口封堵的全民围观长尾〔B〕）。**<\/p>\n<p>锚的双层结构：<\/p>\n<ul>\n<li>**底层情绪（普适、长期）**：\"会干的不如会混的\"——职场最大公约数憋屈。每个观众身边都有一个\"不肯签字的老工程师\"和一个\"签得飞快的人\"。<\/li>\n<li>**顶层焦虑（实时、30 天）**：汛期未过。9 月初台风登陆、应急响应启动、堤防决口画面仍在传播——观众此刻亲眼见过\"堤垮了是什么样\"，对\"堤里有没有猫腻\"的愤怒处于激活态。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、30 天内证据清单<\/h3>\n<p class=\"row\"> ┃  #  ┃  证据  ┃  时间  ┃  来源  ┃  等级  ┃  用法  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  2026 年全国\"质量月\"启动，25 个部门共同部署，主题\"增强质量技术基础能力 提升质量安全保障水平\"；地方落地文件明写\"对偷工减料、过程弄虚作假等违法违规行为，一律依法依规严肃查处\"  ┃  2026-09-04 起（9 月全月）  ┃  中国新闻网；东莞市住建局 2026 质量月通知  ┃  A  ┃  主锚官方佐证：\"反偷工减料\"此刻是国家叙事与民间情绪的交汇点，题材自带正当性  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  台风\"沙德尔\"9 月 3 日登陆福建沿海，闽浙暴雨，水利部启动最高级别洪水应急响应  ┃  2026-09-03  ┃  外电转引水利部应急响应（Reuters/BBC 体系）  ┃  A  ┃  实时焦虑举证：汛期未结束，\"堤防\"不是历史词，是进行时  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  藏尼跨境冰川洪水重大灾害（8 月底–9 月初，伤亡惨重）  ┃  2026-08-26 起  ┃  UN News / CNN / 卫报  ┃  A  ┃  **慎用**：只取\"水的力量是真实的\"公共体感，严禁消费伤亡、严禁影射责任  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  河南某县河流两处堤防决口、数千人转移、决口应急封堵，全国围观  ┃  2026-08-13（距本日 34 天，超窗 4 天）  ┃  新华社英文版 / 路透  ┃  B  ┃  舆论长尾举证：\"决口→封堵→追问质量\"的完整公共叙事链刚发生过  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  台风\"海豚\"致超百万人转移、上海内涝  ┃  2026-08-10（超窗）  ┃  卫报  ┃  B  ┃  同上，佐证 2026 汛期强度，叠 加\"今年水大\"的全民体感  ┃ <\/p>\n<p>结论：主锚有 A 级证据支撑，**无需降级为\"经典母题，无实时锚\"**。<\/p>\n<p>---<\/p>\n<h3>三、长期公共议题底座（C 级，制度可核实，做实事底子）<\/h3>\n<p>1. **工程质量终身责任制**：五方责任主体（建设/勘察/设计/施工/监理）项目负责人开工前签署质量终身责任承诺书，竣工后设永久性标牌载明单位与负责人姓名，验收签字与终身追责挂钩。——\"签字\"与\"刻名的碑\"是真实制度自带的戏剧装置，零解释成本。<\/p>\n<p>2. **国债/超长期特别国债水利项目**：2025 年水利建设投资完成 1.28 万亿元、连续 4 年超万亿；2026 年首批\"两重\"项目清单中超长期特别国债超 1700 亿元直达项目一线；病险水库除险加固、中小河流治理、蓄滞洪区建设是 2026 年重点。\"国债修的堤\"= 观众直觉理解\"这是老百姓的钱、国家的命\"。<\/p>\n<p>3. **汛期问责机制**：病险水库主汛期原则上空库运行、巡堤查险责任到人、决口问责。——\"汛期出事必有人被追责\"是全民共识，为反派\"抢在汛期前糊弄过验收\"提供真实动机。<\/p>\n<p>---<\/p>\n<h3>四、情绪具象化路线（方法论第 2 条：大白话标题检验）<\/h3>\n<p>主角处境必须读起来就是一条真实社会新闻标题。通过样本：<\/p>\n<ul>\n<li>「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」<\/li>\n<li>「老工程师指出堤身填筑不合格，第二天被调去管仓库」<\/li>\n<li>「竣工标牌上刻了五个名字，大水来的时候谁的名字能站住」<\/li>\n<\/ul>\n<p>三秒测试对齐（甲方约束）：修堤的 / 偷工减料的 / 不签字的老工程师——三个身份全部来自 C 级制度议题的日常语汇，无架空术语。自造专名建议 ≤3 且全部是地名类（如堤名、县名），不造体系词。<\/p>\n<p>---<\/p>\n<h3>五、共鸣乘数（方法论第 3 条：截图转发点）<\/h3>\n<ul>\n<li>目标自来水人群：\"家里有搞工程/修堤/签字背锅的人\"的观众——\"这说的是我爸/我师傅/我哥\"。<\/li>\n<li>**第一截图拍**：「你签了字，出了事是你一生的责任；你不签，下游是几万人的命」——把职场签字焦虑放大到生死刻度，一张截图独立成立。<\/li>\n<li>**第二截图拍**：竣工永久性标牌特写——\"碑上刻的名字\"是终身责任制的真实物件，观众会拍照对比自己单位的责任牌。<\/li>\n<li>**第三截图拍**：混资历者提拔公示与主角 20 年原地职级的同框——\"认真的人没升职，糊弄的人步步高\"的普适憋屈。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>六、锚点贯穿（方法论第 4 条：反派的作恶方式=情绪的现实原型）<\/h3>\n<p>反派不写脸谱化贪官，写**\"把偷工减料做成流程\"的人**——每一步都是现实原型：<\/p>\n<p>1. 验收单\"先签后补\"，签字链把个人责任稀释成集体责任；<\/p>\n<p>2. 隐蔽工程（堤身芯样、基础齿墙）不留影像、夜里赶工覆盖；<\/p>\n<p>3. 以\"防汛窗口期/工期倒排\"压质量——用正确的理由干错误的事；<\/p>\n<p>4. 把提问题的人调离岗位、边缘化，而非消灭——现实中最常见的排异方式。<\/p>\n<p>汛期即戏剧钟：台风/洪峰倒计时把\"实时焦虑\"转成 tick，主角的每一次坚持都在跟水位赛跑。锚不是贴片——**决口那一刻，观众想起的是前面每一张签掉的和没签的验收单**。<\/p>\n<p>---<\/p>\n<h3>七、合规与纪律红线<\/h3>\n<ul>\n<li>**不点名、不影射真实机构与真实责任人**；所有真实事件（河南决口、藏尼洪水等）只作情绪举证，剧作中不得对应、不得暗示责任认定。<\/li>\n<li>不消费灾难伤亡：灾害类证据只用于\"水是真实威胁\"的体感，不出现真实遇难细节。<\/li>\n<li>情绪是燃料不是说教：不喊口号、不批判体制，只把\"较真者的憋屈\"拍成戏；愤怒全部落在反派的具体作恶动作上。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>八、来源索引<\/h3>\n<p>A 级：<\/p>\n<ul>\n<li>25 个部门共同部署开展 2026 年全国\"质量月\"活动（中国新闻网，2026-09-04）：https://www.chinanews.com.cn/sh/2026/09-04/10690416.shtml<\/li>\n<li>东莞市住建局 2026 年\"质量月\"活动通知（明写严查偷工减料、弄虚作假）：https://zjj.dg.gov.cn/gkmlpt/content/4/4580/post_4580877.html<\/li>\n<li>Typhoon Saudel 9 月 3 日登陆福建、最高级别洪水应急响应（外电转引水利部，2026-09 上旬）：https://www.bbc.com/news/articles/c79ygnv9e93o （同源外电体系）<\/li>\n<li>藏尼跨境冰川洪水（UN News，2026-08-26 起）：https://news.un.org/en/story/2026/08/1168208<\/li>\n<\/ul>\n<p>B 级：<\/p>\n<ul>\n<li>河南郏县北汝河堤防决口与封堵（Xinhua English，2026-08-13）：https://english.news.cn/20260813/ae1adaa9c8cc40ea98c28e8510536dea/c.html ；路透决口封堵图集：https://www.reutersconnect.com/item/china-levee-breaches-sealed-in-flood-hit-henan/dGFnOnJldXRlcnMuY29tLDIwMjY6bmV3c21sX09XU0hCQzExNzY2MDk<\/li>\n<li>台风\"海豚\"百万人转移（The Guardian，2026-08-10）：https://www.theguardian.com/world/2026/aug/10/typhoon-dolphin-china-shanghai-flooding-evacuations<\/li>\n<\/ul>\n<p>C 级：<\/p>\n<ul>\n<li>工程质量终身责任制（五方承诺书+永久性标牌）：https://www.junhe.com/law-reviews/280<\/li>\n<li>2026 年 Q1 中央水利投资 829 亿元、病险水库除险加固重点（国新办发布会，2026-04）：http://www.scio.gov.cn/xwfb/bwxwfb/gbwfbh/slb/202604/t20260414_984746.html<\/li>\n<li>2026 年首批\"两重\"清单、超长期特别国债超 1700 亿元：https://baike.baidu.com/item/2026%E5%B9%B4%E6%8F%90%E5%89%8D%E6%89%B9%E2%80%98%E4%B8%A4%E9%87%8D%E2%80%99%E5%BB%BA%E8%AE%BE%E9%A1%B9%E7%9B%AE%E6%B8%85%E5%8D%95/67162831<\/li>\n<li>2025 年水利投资 1.28 万亿、连续 4 年超万亿（新华网，2026-01-06）：https://www.news.cn/20260106/25d105d07ac644d4a52d92b87d21a808/c.html<\/li>\n<li>水库安全度汛、病险水库主汛期空库运行（水利部部署）：http://swj.sh.gov.cn/swj-xyxx/20260515/2b5e39b093e1400f942989a380f02dfa.html<\/li>\n<\/ul><\/section>\n<section><h1>选题分析报告.md<\/h1><h2>选题分析报告：《守堤人》（水利题材 · 拒签老总工）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>剖面：story-analyst（选题分析师）<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>输入件：选题素材.md（甲方需求）；梗卡.md（同批找梗师产物，快照 kakaxing/scriptrawstone@2026-09-15，6928 部解析样本）；热点素材.md（同批网感师产物，检索窗口 2026-08-17 至 2026-09-16）；内部/kb-benchmark.md（28 件对标库）；内部/kb-market.md（constraints / setting-rules / meme-rules）<\/li>\n<li>批注基线声明：本批未装配独立「四视角评估批注报告」，风险事实基线取梗卡「风险」5 条与热点素材「合规与纪律红线」节，均已在正文正面回应；梗卡与热点素材之间无分歧条目。<\/li>\n<li>写作纪律声明：本报告为决策文档，不含剧情设计；创意落点仅一句话带过，由选题方案步展开。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、市场分析<\/h3>\n<h4>1.1 赛道温度判断（依据：梗卡查族结论，快照 2026-09-15）<\/h4>\n<p>**判定：本选题踩的两条机制带均处上升期，落点带供给空白——「上升赛道 × 空白落点」组合。**<\/p>\n<p class=\"row\"> ┃  带位  ┃  梗族  ┃  饱和度  ┃  n / 占比  ┃  均热度（万）  ┃  判定  ┃ <\/p>\n<p class=\"row\"> ┃  主机制带  ┃  神豪暴富  ┃  上升期·蓝海偏好  ┃  380 / 5.5%  ┃  18987  ┃  供给未追上热度，可直接主推  ┃ <\/p>\n<p class=\"row\"> ┃  辅机制带  ┃  流放种田  ┃  上升期·蓝海偏好  ┃  92 / 1.3%  ┃  22598  ┃  全库最高均热度档之一  ┃ <\/p>\n<p class=\"row\"> ┃  必备引擎  ┃  打脸虐渣  ┃  红海·有效  ┃  1510 / 21.8%  ┃  18558  ┃  横切超族，须带新变体方可进  ┃ <\/p>\n<p class=\"row\"> ┃  限制使用  ┃  马甲掉马  ┃  红海·过饱和  ┃  750 / 10.8%  ┃  9215（低于全库均值 10058）  ┃  仅许物件式单点揭示  ┃ <\/p>\n<p>关键证据：神豪暴富族演化链已从「隐藏财富」分化出「隐藏硬实力→当众验证」支线（《扫地姑娘是百亿精算师》→《她带着百亿订单离职了》→《老炮开山》），而该支线**无水利落点**；流放种田演化链已有《流放荒州》硬核基建翻盘先例，苦地全部是古代/架空边关荒岛，**无现实汛期圩堤落点**。水利落点是两条上升链的共同空白。<\/p>\n<p>近似带佐证（语料未覆盖声明，梗卡第一节）：题材矩阵无「水利/防汛/基建工程」直接类目；近似带**职场**（202 部 / 均 20951 万）、**乡村**（153 部 / 均 20748 万）、**小人物**（69 部 / 均 17609 万）均高于全库均值 10058 万——「职业实干逆袭」带热度在位而直接供给不足。<\/p>\n<h4>1.2 在 2025-2026 题材轮动中的位置<\/h4>\n<ul>\n<li>**实事做底是本轮的制度性首选**：kb/market/setting-rules 三级制把「实事新闻做底子（防汛救灾、工程质量清查等全民共识公共事件）」列为设定来源首选，原创架空体系一票否决。本选题是三级制的教科书案例：工程质量终身责任制、汛期应急响应、堤防除险加固国债项目均为 C 级制度议题，零解释成本（甲方 3 秒测试通过）。<\/li>\n<li>**「专业者 × 结构性灾难」同构已跨市场验证**：NA 对标库中《Tower Inferno: The Lone Architect》《Crush Depth》《Mayday: The Shadow Pilot》《Deep Abyss Master》四件同构件（A+/S 级，24000 万档，kb-benchmark）证明「最懂这栋楼/这艘船的人在灾难中当众验证」机制在 CN、NA 双市场均有成绩；本选题把灾难从突发事故置换为**可预测的自然倒计时（汛期）**，把验证从「事中救援」前移到「事前拒签」，为链上未做变体。<\/li>\n<li>**反流量审美窗口**：《给大妈爆改后我成了顶流》以 0.6 万热度冲到 S 级 AI 评 91（kb-benchmark），证明「评分与热度分离、实事向可冲评级」——实事流在评级体系里有上行通道。<\/li>\n<\/ul>\n<h4>1.3 平台格局与发行路径建议<\/h4>\n<ul>\n<li>**主路径：CN 竖屏付费墙**（独立 App / 小程序）。依据：生产约束实盘值（60 集 × 1-1.5 分钟 × 1200 字）即竖屏付费短剧口径（kb/market/constraints）；本题材的付费钩子密度（拒签→受辱→洪峰验证的延迟满足结构）适配前免后付。<\/li>\n<li>**引流路径：抖音站内切片**。依据：梗卡已布 16 条现存热梗挂接与前三章切片点（「这方混凝土保熟吗」「偷感」夜施名场面等），每集 ≥1 可独立切片梗点，天然适配站内分发引流。<\/li>\n<li>备选免费 IAA 路径与分账数据：素材未提供各平台买量成本与分账测算数据，**（待补充）**；在补齐前不据此改变主路径判断。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、目标客群<\/h3>\n<h4>2.1 主客群<\/h4>\n<ul>\n<li>**画像**：30-55 岁男性为核，工程/基建/国企/体制内从业者及其家属；三四线及县域城市权重高（堤防除险加固项目所在地即其生活半径）；观看场景为通勤/晚间碎片时间；有稳定付费能力，为「尊严代偿」类内容付费意愿被对标件验证。<\/li>\n<li>**推断依据**：同机制对标件受众声明——《Crush Depth》明确 18-40 岁男性、阶层压迫与尊严痛点（kb-benchmark b020-na）；《扫地姑娘是百亿精算师》打「打工人在职场被轻视」共情（b016-fam）；本片主角为 58 岁老总工，客群较 NA 灾难件上移一档年龄。<\/li>\n<li>**规模量级**：（待补充——素材无分客群规模数据；可用代理指标：2025 年水利建设投资 1.28 万亿元、连续 4 年超万亿，行业与就业盘子的量级见第四节 C 级数据）。<\/li>\n<\/ul>\n<h4>2.2 次客群<\/h4>\n<ul>\n<li>**画像**：「家里有搞工程/修堤/签字背锅的人」的家庭观众，含 30-55 岁女性（家属视角）；观看场景为家庭共看 + 社交转发。<\/li>\n<li>**依据**：热点素材第五节共鸣乘数——「这说的是我爸/我师傅/我哥」的自来水转发人群；第一截图拍「你签了字，是你一生的责任；你不签，下游是几万人的命」独立成立。<\/li>\n<li>**规模量级**：（待补充对标）。<\/li>\n<\/ul>\n<h4>2.3 客群与题材的咬合点<\/h4>\n<p>「会干的不如会混的」是职场最大公约数憋屈（热点素材第一节：普适底层情绪），而本题材把它放大到生死刻度——签字焦虑 × 下游几万人的命 × 终身责任制（签字与刻名碑是真实制度自带的戏剧装置，零解释成本）。观众此刻正处于汛期焦虑激活态：9 月初台风登陆 + 最高级别应急响应 + 堤防决口画面仍在传播（热点素材 A/B 级证据），「堤里有没有猫腻」的愤怒是进行时，不是回忆。<\/p>\n<p>---<\/p>\n<h3>三、竞品分析<\/h3>\n<p>对标 1-4 取自 kb-benchmark（快照 2026-09-15 实盘数据）；条目 5 为方法论强制的韩剧同情绪赛道基准（本批 KB 无韩剧对标件，成绩数据按纪律标待补充）。<\/p>\n<p class=\"row\"> ┃  #  ┃  作品  ┃  平台/市场  ┃  题材标签  ┃  成绩  ┃  可借鉴点  ┃  本方案差异机会  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  《扫地姑娘是百亿精算师》（b016-fam）  ┃  CN · 竖屏短剧  ┃  都市/职场/逆袭，神豪暴富族「隐藏硬实力」支线  ┃  A+ 级 / 94000 万 / AI 评 86  ┃  「当众验证」强度标尺：对赌谈判死局→当众徒手复原数据。本片同位爆点=验收会死局→水位/管涌现场当众验证  ┃  验证执行者不是主角本人技能演示，而是自然规律（洪水替他掉马）——「零反击、纯坚持」链上无人做过  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  《Tower Inferno: The Lone Architect》（b024-na）  ┃  NA · 竖屏短剧  ┃  都市灾难/智斗/职场复仇  ┃  A+ 级 / 24000 万 / AI 评 87  ┃  「专业者 × 结构性灾难 × 内部人揭露」同构强度标尺  ┃  灾难非突发事故而是可预测倒计时（汛期 tick）；主打事前拒签而非事中救援，受辱-蓄力段更长、清算更可见  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  《给大妈爆改后我成了顶流》（b027-s）  ┃  CN · 竖屏短剧  ┃  治愈系/职场逆袭/女性群像  ┃  S 级 / 0.6 万 / AI 评 91  ┃  实干逆袭 + 冷处理反派标尺；低热度高评分证明实事向可冲评级  ┃  本片自带全剧戏剧钟（汛期倒计时），情绪浓度上限更高；男频向与该件女频向错位  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  《重回前夫假死那天，我大摆招魂席》（b028-s）  ┃  CN · 竖屏短剧  ┃  重生流/家庭伦理/时代逆袭  ┃  S 级 / 14000 万 / AI 评 91  ┃  「清算执行者是规则与物理而非主角口才」的可见可数清算标尺（借丧事规则瓮中捉鳖）  ┃  本片清算执行者=洪峰水位，题材为公共工程实事而非家庭伦理；无重生（重生会把「坚持」降级为「先知」，梗卡已判不取）  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  《黑暗荣耀》《请和我的老公结婚吧》《财阀家的小儿子》  ┃  韩剧 · 长视频  ┃  复仇/豪门/重生同情绪赛道  ┃  （待补充对标——本批 KB 无韩剧件，禁止编造数据）  ┃  冲突强度与情绪浓度基准：长剧把「较真者被系统碾碎」拍到数集才给第一次反击，短剧观众的爽感阈值已由此抬高  ┃  短剧必须在第 1 集内完成受辱+蓄力结构、第 8-12 集给出首个当众验证，以密度补偿单场浓度  ┃ <\/p>\n<p>**竞争密度结论**：机制带（隐藏硬实力验证 × 打脸虐渣）为红海/上升混合，**水利落点为全链空白**——梗卡查族覆盖 13 族 6928 部样本，未发现水利/防汛直接类目；神豪暴富「硬实力」支线与流放种田「基建翻盘」链上均无现实汛期圩堤先例。判定为**蓝海窗口**，但窗口期取决于「隐藏硬实力」支线的供给追赶速度（当前供给未追上热度，快照 2026-09-15），叠加 A 级汛期情绪锚的时效性（汛期约至 10 月上旬），**建议窗口按 1-2 个月计**，本批应直接进入选题方案。<\/p>\n<p>---<\/p>\n<h3>四、数据分析<\/h3>\n<p>全部量化证据及来源（写作纪律 1：三者之外不引入任何数字）：<\/p>\n<p>**A. 市场语料（来源：梗卡，快照 kakaxing/scriptrawstone@2026-09-15，6928 部解析样本）**<\/p>\n<ul>\n<li>全库均热度 10058 万；神豪暴富 n=380 / 均 18987 万；打脸虐渣 n=1510 / 均 18558 万；流放种田 n=92 / 均 22598 万；马甲掉马 n=750 / 均 9215 万；职场近似带 202 部 / 均 20951 万；乡村 153 部 / 均 20748 万；小人物 69 部 / 均 17609 万。<\/li>\n<li>题材矩阵无水利/防汛/基建直接类目（语料未覆盖声明）——本选题无直接类目热度背书，属数据盲区内的机会型判断。<\/li>\n<\/ul>\n<p>**B. 对标件成绩（来源：kb-benchmark，快照 2026-09-15）**<\/p>\n<ul>\n<li>b016-fam《扫地姑娘是百亿精算师》：A+ / 94000 万 / AI 评 86；b024-na《Tower Inferno》：A+ / 24000 万 / AI 评 87；b027-s《给大妈爆改后我成了顶流》：S / 0.6 万 / AI 评 91；b028-s《重回前夫假死那天》：S / 14000 万 / AI 评 91。<\/li>\n<li>对标件生产约束实盘（同源）：集数 60（b027 为 80、b021/b024 为 40）；单集 1-1.5 分钟；单集字数 1000-1400；场景 ≤3；演员 ≤10。<\/li>\n<\/ul>\n<p>**C. 格式实盘（来源：kb/market/constraints，7938 部在售剧本硬格式统计）**<\/p>\n<ul>\n<li>60 集 4224 部 / 80 集 925 / 40 集 718；单集 1200 字 4284 部；场景 ≤3 为 7937/7938；有名有姓演员 ≤10 为 7925 部。<\/li>\n<\/ul>\n<p>**D. 时代情绪锚证据（来源：热点素材，等级随条标注）**<\/p>\n<ul>\n<li>A 级：2026 全国「质量月」25 部门联合部署、严查偷工减料弄虚作假（中国新闻网，2026-09-04）；台风「沙德尔」2026-09-03 登陆福建、水利部启动最高级别洪水应急响应（外电转引水利部）。<\/li>\n<li>B 级：河南某县堤防决口与应急封堵（新华社英文版，2026-08-13，超窗 4 天）；台风「海豚」超百万人转移（卫报，2026-08-10，超窗）。<\/li>\n<li>C 级（制度底座）：工程质量终身责任制（五方承诺书 + 永久性标牌）；2025 年水利投资 1.28 万亿、连续 4 年超万亿（新华网，2026-01-06）；2026 首批「两重」超长期特别国债超 1700 亿；2026 Q1 中央水利投资 829 亿（国新办，2026-04）；病险水库主汛期空库运行（水利部部署）。<\/li>\n<\/ul>\n<p>**E. 变现测算**：买量成本、付费卡点转化率、制作成本档——素材均未提供，**（待补充）**；制作成本档可由 C3 约束（场景 ≤3、演员 ≤10）间接压低，属中低成本档形态。<\/p>\n<p>---<\/p>\n<h3>五、结论与建议<\/h3>\n<h4>5.1 推荐度<\/h4>\n<p>**可做（倾向强推）**——一句话理由：机制层双上升带 × 全链空白落点 × A 级 30 天实时情绪锚 × 实事做底零解释成本四者齐备，唯水利类目缺直接语料与买量数据背书，故以「可做」立项、按移交单硬约束推进即可上调。<\/p>\n<h4>5.2 风险清单（每条附对策）<\/h4>\n<p class=\"row\"> ┃  #  ┃  风险  ┃  等级  ┃  对策  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  换皮陷阱：神豪暴富族标签含「暴富」，实事流无暴富，方案阶段易把爽点写回「身份财富碾压」（梗卡风险 1）  ┃  高  ┃  爽点一律锚「拒签 × 洪峰验证」机制；方案创新亮点段必须回指新变体；监理按此条一票复核  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  红海纪律失效：打脸虐渣 n=1510 无新变体即同质化；马甲掉马均热度已低于库均值（梗卡风险 2）  ┃  高  ┃  打脸必须带「洪水当法官」变体；马甲仅许洪峰后复盘的物件式单点揭示（一摞拒签单），禁多层马甲当众撕  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  合规风险：水利议题贴近真实机构与真实灾害事件（梗卡风险 3 + 热点素材第七节）  ┃  高  ┃  全稿零真实机构名/责任人；河南决口、藏尼洪水等只作情绪举证，剧内不得对应、不得暗示责任认定；不消费灾难伤亡；涉汛画面落点「问责与守护」，不渲染灾情惨状  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  情感线稀释：混入团宠/真假千金/强爱情线会毁实事底子（梗卡风险 5）  ┃  中  ┃  爱情线降为挂件或不设；红线进移交单 C4  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  数据盲区：水利类目语料未覆盖 + 快照时效 2026-09-15（梗卡风险 4）  ┃  中  ┃  立项后发行前补平台侧验证（待补充）；窗口期按汛期情绪时效 1-2 个月计  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  成本风险：汛期/洪水场面易超预算（对标 NA 灾难件的场面体量不可照搬）  ┃  中  ┃  场景 ≤3 硬约束 + 洪峰验证优先用「水位线对照、管涌现场」等实拍可达成场面，灾难奇观非卖点、验证逻辑才是  ┃ <\/p>\n<h4>5.3 创作约束移交单（给选题方案步，逐条遵守，可校验）<\/h4>\n<p>**C1 目标市场与客群**：CN 竖屏付费短剧为主市场；男频实事爽剧定位；主客群 30-55 岁男性（工程/国企/体制内及家属），次客群「家里有工程人」家庭共看观众；转发人群锚「家属替他委屈」截图点。<\/p>\n<p>**C2 媒介形态与集数时长**：60 集 × 单集 1-1.5 分钟 × 单集字数 ≤1200 字（kb/market/constraints 主流值）；偏离主流值须在方案中显式声明并给理由，隐式偏离驳回。<\/p>\n<p>**C3 成本档（场景数与角色数上限）**：主场景 ≤3 个（建议集合：验收会议室 / 堤段工地·含汛期堤坡 / 项目部办公区，最终由方案定，总数不得超 3）；有名有姓角色 ≤10 人，核心角色 ≤5 人（拒签老总工 / 偷工减料的施工方负责人 / 赶工期要签字的上级 / 徒弟或家属 / 复审方一名即可）；「全场惊呆」类当众反应由群演承担，不计入上限。每集冲突须发生在可复用景，换景=换集节拍点。<\/p>\n<p>**C4 必须避开的雷**：① 禁原创架空世界观与体系术语（C10 设定三级制，设定来源必须声明为「实事新闻做底子」首选级）；② 禁重生/先知（梗卡已判：重生把「坚持」降级为「先知」）；③ 禁团宠护短/真假千金/追妻火葬场等退潮族与本题材混装；④ 禁把爽点写成「身份财富碾压」暴富皮；⑤ 禁多层马甲当众撕；⑥ 三分钟测试必须过：观众 3 秒即懂「修堤的、偷工减料的、不签字的老工程师」，凡需先讲设定才能进冲突的开局驳回。<\/p>\n<p>**C5 合规红线（一票否决）**：全稿零真实机构名（水利部/流域委/地方水利局及任何真实单位禁用）、零真实责任人；自造专名全稿 ≤3 个且全部为地名类，前三章自造专名 ≤2 个（建议仅「清川河」「临江圩」，留 1 个余量）；真实灾害事件只作情绪举证，剧内事件不得与河南决口等真实事件对应或暗示责任认定；不出现真实遇难细节、不渲染灾情惨状；不喊口号、不批判体制，愤怒全部落在反派的具体作恶动作上；涉汛结局落点「问责与守护」正价值。<\/p>\n<p>**C6 卡点位置要求**：首个付费卡点设于第 8-12 集，卡点事件为首次「当众验证」（验收会死局→现场验证，强度不得低于 b016-fam 同位爆点）；前三章布点按梗卡执行——E1 开标会独拒签 +「水位线不认识领导」、E2 施压对撞、E3 夜查偷工受辱蓄力顶点（集尾连本带利伏笔）。<\/p>\n<p>**C7 时代情绪锚方向**：主锚「较真者的憋屈 × 汛期防洪焦虑」，有 30 天内 A 级证据（2026-09-04 质量月 25 部门部署；2026-09-03 台风「沙德尔」最高级别应急响应），无需降级为「经典母题」；底层情绪锚「会干的不如会混的」贯穿全剧；汛期倒计时（台风/洪峰）作全剧戏剧钟——决口一刻观众须想起前面每一张签掉的和没签的验收单。反派作恶方式锚现实原型四件套（先签后补稀释责任 / 隐蔽工程不留影像 / 拿防汛窗口期压质量 / 把提问题的人调岗边缘化）。<\/p>\n<p>**C8 梗密度硬指标**：每集 ≥1 处可独立切片传播的梗点；口癖「这单我不签。」hot 档每集 ≥1 次、3 集内变奏 3 次；梗卡第三节 16 条现存热梗表为 S1 网感输入源，方案阶段必须挂接使用。<\/p>\n<p>**C9 对标强度线**：当众验证场面强度对标 b016-fam《扫地姑娘是百亿精算师》同位爆点；清算必须「可见可数」（对标 b028-s 标尺）——拒签单、水位线对照、竣工永久性标牌为三大清算物件，冷静档至少 2 件（另一件建议雨靴，按梗卡）。<\/p>\n<p>**C10 设定体系约束**：设定来源声明为三级制首选级「实事新闻做底子」（工程质量终身责任制 + 国债除险加固 + 汛期问责，全部 C 级可核实制度）；一句话故事须过「大白话标题检验」（热点素材第四节样本：「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」）；具体剧情设计由选题方案步在上述约束内展开。<\/p>\n<p>---<\/p>\n<p>*依据：skills/topic-analysis-report 五节结构；梗卡@2026-09-16；热点素材@2026-09-16；kb-benchmark@2026-09-15；kb-market（constraints@2026-09-14 / setting-rules@2026-09-15 / meme-rules@2026-09-15）。本报告为 S1 决策件，下一步移交选题方案步。*<\/p><\/section>\n<section><h1>选题方案-爽版-基线.md<\/h1><h2>选题方案 · 爽版无监管基线：《守堤人》（水利题材 · 拒签老总工）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>剖面：scene-screenwriter（选题编剧）· S3 baseline 节点<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>本件性质：**route=dual 监管增益对照件**（内部过程物件，不随对外交付输出；对应 flow.json `baseline` 节点：skill=topic-proposal、route=hot、**oversight=false**）<\/li>\n<li>输入件：选题分析报告.md 第五节「创作约束移交单」（C1-C10）；梗卡.md；热点素材.md；kb/aesthetic/style-routes（hot 档参数）；kb/aesthetic/oversight（双专家监管标准与 A/B 纪律）；kb/aesthetic/pacing-density（爆点密度计量口径）<\/li>\n<li>禁读声明：本批为全新重跑，未读取 projects/_archive/ 下任何内容<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>〇、对照实验设计（本件读法）<\/h3>\n<p>**A/B 定义**（依据 kb/aesthetic/oversight「A/B 基线纪律：监管的增益必须可验证，不是信仰」）：<\/p>\n<ul>\n<li>**A 组（爽版正稿）**：同一编剧 skill 产出，双专家监管位全开——总编管强度（爆点对标制/钩子生理测试/名场面可视化/分布图），监理管合规（逐条对账/一票否决/约束对账表）。<\/li>\n<li>**B 组（本件）**：同一编剧 skill、同一输入件、route=hot 参数全档，**监管位关闭**——不逐条对账、不加码、红线不作为设计输入。它回答的问题是：**没有人盯着时，这套爽点机制自然长什么样。**<\/li>\n<\/ul>\n<p>**受控变量**（与爽版正稿同值，不构成差异源）：C1 客群定位；C2 形态（60 集 × 1-1.5 分钟 × 单集 ≤1200 字）；C3 场景 ≤3 / 有名有姓 ≤10 / 核心 ≤5；C6 卡点位置（首卡 E8-12 当众验证；E1-E3 布点按梗卡）；C7 情绪锚方向；C8 梗密度硬指标与 16 条热梗表；C9 对标强度线与清算物件；C10 设定三级制（实事做底）。hot 档九参数（style-routes）作为两版共同的档位天花板。<\/p>\n<p>**自变量**（监管开闭）：总编强度监管位 off（无爆点对标、无加码）；监理合规监管位 off（无对账表、无一票否决，C4 禁区与 C5 合规红线不作为写作时的主动校验项）。<\/p>\n<p>**判定口径**：爽点机制等价性按 kb/aesthetic/pacing-density hot 档计量——每集爽点数（打脸/反转/身份碎片/金句任一）、受辱→回击时差（拍）、口癖变奏数、名场面可视化数。<\/p>\n<p>**本件文件层红线声明**：对照在**设计决策层**描述无监管写法（标注「基线倾向」），不落地执行任何违规文本——本件全文零真实机构名、零真实责任人、零消费伤亡的灾害场面。违规捷径只说明「会怎么写」，不写出那句可拍的词。<\/p>\n<p>---<\/p>\n<h3>一、基线稿 · 选题（无监管状态）<\/h3>\n<p>**选题名**：《守堤人》（沿用受控命名，无监管不改变命名——命名本身无监管敏感点）。<\/p>\n<p>**一句话定位**：大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字，洪水替他验了一张没人敢验的收据。<\/p>\n<p>**时代情绪锚**：较真者的憋屈 × 汛期防洪焦虑（底层情绪「会干的不如会混的」贯穿）。锚的证据强度与本件无关——无监管状态下，编剧照常引用素材包里的锚，**但不会去核锚的 30 天时效**（这是监理与网感师监管位的工作，基线 natural 缺省）。判定：锚取法等价，时效核验缺位是预期增益点 G1。<\/p>\n<p>**新意装置**：拒签单 × 洪峰当众验证——「他没打赢任何人，是洪水替他赢了」。装置改变的具体写法：每一次拒签都是蓄力，清算执行者是水位而非主角的嘴。无监管状态下装置照常成立（装置来自受控的梗卡选型，不依赖监管位）。判定：**等价成立**。<\/p>\n<p>**核心爽点承诺**：看一个被全项目部门孤立的老头，靠一张一张「不签」活到最后，看着洪水把他签过的和没签的堤段分成两半。<\/p>\n<p>**开篇 3 秒设计**（第一拍）：验收会议室长桌，签到笔在十几只手里排队传递、逐个落名；笔传到秦江海手里停住，他拿笔帽在图纸上敲三下——「这单我不签。」全场回头定格。反常 + 冲突占全，无铺垫。判定：**等价成立**（3 秒钩子是 hot 档四硬规则底线，基线不掉）。<\/p>\n<p>---<\/p>\n<h3>二、基线稿 · 人设（核心 5 人，有名有姓 ≤10）<\/h3>\n<p class=\"row\"> ┃  角色  ┃  设定  ┃  反差  ┃  核心动机  ┃  口癖 / 标志小动作  ┃ <\/p>\n<p class=\"row\"> ┃  秦江海 · 58 · 临江圩除险加固项目部总工程师  ┃  藏蓝旧工装洗得发白，左胸口袋别两支笔（一支写字、一支只画水位线），胶底鞋，后腰钥匙串上挂一把老钢卷尺  ┃  开会最没存在感，堤上声音最大  ┃  三十年前同一条河上，他师父没拦住的那座坝  ┃  「这单我不签。」／说话前用笔帽敲三下图纸  ┃ <\/p>\n<p class=\"row\"> ┃  马长贵 · 45 · 施工方负责人（剧内自造主体）  ┃  皮鞋上工地，手机外放，办公桌腿垫着酒箱  ┃  对上点头哈腰、对工人横  ┃  垫资垫到抵押了房，必须赶在汛期前验收回款  ┃  「规矩是死的，人是活的。」／说话先递烟  ┃ <\/p>\n<p class=\"row\"> ┃  冯有德 · 50 · 项目部上级（赶工期要签字的）  ┃  衬衫扣到顶，文件夹永远抱在胸前当盾牌  ┃  不贪，但怕担责  ┃  「集体的决定」——把个人责任稀释成集体责任  ┃  「再研究研究。」／签字前先看左右  ┃ <\/p>\n<p class=\"row\"> ┃  雷小雨 · 26 · 测绘员（徒弟）  ┃  反光背心，安全帽带子永远不扣  ┃  全项目部唯一公开站在老头一边的人，年轻人里最「多事」  ┃  她信数据不信酒桌  ┃  「图纸上没有这个数。」／拿全站仪当拐杖  ┃ <\/p>\n<p class=\"row\"> ┃  贺工 · 60 · 复核组老专家（复审方）  ┃  旧夹克，布鞋，手里始终捏着一个掉漆的保温杯  ┃  退居二线，说话没人当回事，出手就是终审  ┃  退休前最后一趟，想把当年的糊涂账算清  ┃  「我看看。」／保温杯拧开又拧上  ┃ <\/p>\n<p>**基线诚实缺口**（无总编监管位时自然出现，为对照证据 B1-B3）：<\/p>\n<ul>\n<li>B1 外形记忆点弱化：雷小雨仅「反光背心」，可视化未到「AI 出图能画」精度（监管版加码方向：安全帽上手绘警戒红线的黄色胶带）。<\/li>\n<li>B2 口癖只挂主角一人，配角语言卡未做（监理交付完整性核查项缺位）。<\/li>\n<li>B3 贺工「复审方」身份在基线稿中第 30 集后才进场——身份碎片亮出晚于「早半拍」原则（总编爆点对标制会把它提前到首卡现场当背景板）。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>三、基线稿 · 冲突设计<\/h3>\n<p>**韩剧强度基准自检**：本节按编剧惯性写「情绪外化 + 反派梯度」，**但无对标制压迫，强度按最低达标线写**（对照证据 B4：基线版每集外化情绪爆点按 1-2 个写，低于 hot 档 ≥3）。<\/p>\n<p>**主线冲突（一句话）**：不肯签字的老总工要在洪峰到来之前，拦住一整条想把问题堤段「合法签收」的签字链。<\/p>\n<p>**单元冲突模板（可无限复制）**：「一张验收单的一次攻防」——反派用现实四件套之一施压（先签后补 / 隐蔽工程不留影像 / 防汛窗口期压质量 / 调岗排异）→ 主角用制度条文或物理证据回击（芯样、水位线、标牌条款）→ 集尾卡点收。可复制原因：分部工程天然逐项验收，一张单 = 一集节拍；全部攻防可装进三景（验收会议室 / 堤段工地含汛期堤坡 / 项目部办公区），换景 = 换集。<\/p>\n<p>**反派梯度（三层）**：<\/p>\n<p>1. 马长贵（动手的：偷工减料、夜施换料）——E1-E18；<\/p>\n<p>2. 冯有德（签字的：先签后补、调岗排异、拿防汛窗口压质量）——E19-E42；<\/p>\n<p>3. 幕后围标验收链（分饼的：把验收做成流程的人，剧内自造主体，不落任何真实机构）——E43-E60。<\/p>\n<p>**冲突密度表（单元闭环，6-10 集一个）**：E1-8 开标拒签连环施压 → E9-16 夜查偷工与调岗 → E17-24 验收会死局与首卡验证 → E25-32 调岗管仓库与堤段抽检 → E33-40 隐蔽工程开膛 → E41-48 围标链现形 → E49-56 洪峰全堤告急 → E57-60 问责与守护。**基线缺口 B5**：表只到单元级，无逐集爽点标注与沙漠段检查（总编「全剧爆点分布图」监管项缺位）。<\/p>\n<p>**付费卡点事件表**：首卡 E8-12 验收会死局 → 管涌现场当众验证（强度对标 b016 同位爆点：对赌死局 → 徒手复原数据的同位物 = 死局 → 水位线对照打脸）；大卡点候选 E20 拒签单被当众撕 + 调岗管仓库；E35 隐蔽工程开膛见假齿墙；E50 洪峰夜全堤告急他上堤；E58 问责会与刻名碑。判定：卡点事件**等价成立**（位置与事件均为受控的 C6/C9），基线缺口 B6：卡点集内的「中型爽点 ≥2 垫场」未配置。<\/p>\n<p>**基线诚实缺口 B6b（受控变量执行偏差，如实标注）**：C8 虽列为受控变量，基线稿实际仅挂接热梗 5 条（水位线不认识领导／我不要你觉得×水不要你觉得／偷感／这方混凝土保熟吗／00 后整顿职场变奏），未做 16 条全量挂接——监理逐条对账位正是为此设；爽版正稿必须全量挂接并通过对照表 A 的 G4 复读监管复核。<\/p>\n<p>**基线诚实缺口 B7（本节最重要的对照证据）**：无监管状态下，本节写作时**未主动核对 C4/C5**——基线倾向出现过三处违规捷径，均在本件被拦在设计层（未落地成文本）：①第三层反派想直接挂真实主管机构名以省掉「自造主体」的解释成本（倾向描述，未执行）；②E50 洪峰夜的第一反应是写决口+伤亡画面当爆点（倾向描述，未执行）；③终局想写成反派跪坟前的私人复仇式清算（倾向描述，未执行）。三处的合规取法与等价判定见对照表 B。<\/p>\n<p>---<\/p>\n<h3>四、基线稿 · 大纲（三段式）<\/h3>\n<p>**前期（E1-30）**：E1 开标会全员签字他独拒签（3 秒钩：签到笔传递 →「这单我不签。」→「水位线不认识领导。」）；E2 冯有德施压「我不要你觉得」×「水不要你觉得」；E3 夜查偷工，手电把换料现场钉在堤坡（「偷感」名场面），拒签单被当众撕（受辱蓄力顶点，集尾连本带利伏笔：撕掉的每一页都在他脑子里）。E4-8 连环施压与孤立；**E9-12 首卡**：验收会死局 → 管涌现场当众验证，马长贵堤段首次现形。E13-30 单元冲突循环推进，反派一层层亮。**基线缺口 B8**：名场面清单只写到大纲级画面（「管涌现场验证」），未具体到「谁在哪对谁做了什么」的 Poster 级分镜需求（总编名场面可视化监管项缺位）。<\/p>\n<p>**中期（E31-50）**：反派升格至第三层；雷小雨被穿小鞋、贺工进场；抽检与开膛戏连打；E50 洪峰夜全堤告急——全剧戏剧钟（汛期倒计时）走完上半程。**基线缺口 B9**：伏笔登记未做（calm 档要求的伏笔回收率 &gt;60% 在 hot 档不作硬要求，但基线连自发登记都没有，回收全凭惯性）。<\/p>\n<p>**终局（E51-60）**：洪峰过境，一堤两制分屏——他拒签的堤段与马长贵签收的堤段在同一个水位线下分出高下（水位线对照 = 清算物件一）；上级复盘翻出他被撕后重抄的一摞拒签单（物件式单点揭示，仅此一层，不当众撕马甲——此条为受控的梗卡风险 2 纪律，基线因读过素材包而照做，但**无监理核验**）；问责会 + 竣工永久性标牌刻名（清算物件二）；他签下最后一张验收单。落点：问责与守护。判定：终局落点**等价成立**（此落点来自受控的 C5，基线稿照写；基线倾向的「私人复仇式终局」被素材包自身纪律拦下，属于运气而非监管——对照证据 B10：**无监管位的合规依赖输入件自律，不可审计**）。<\/p>\n<p>---<\/p>\n<h3>五、基线稿 · 前三集初稿（分拍，粒度=拍级要点）<\/h3>\n<p>布点为受控变量（C6：E1 独拒签 / E2 施压对撞 / E3 夜查受辱顶点），分拍按 hot 档节奏（前 3 秒钩子 → 冲突展开 → 集末卡点；每拍一个认知更新）。<\/p>\n<h4>E1 · 开标会（景一：验收会议室）<\/h4>\n<p>1. 【3 秒钩】签到笔沿长桌传递逐个落名 → 传到秦江海停住，笔帽敲图纸三下：「这单我不签。」（反常+冲突）<\/p>\n<p>2. 冯有德低声施压「全签了就差你」；秦翻到堤身填筑页推过去：「压实度不够，数字在这儿。」<\/p>\n<p>3. 马长贵起哄「老秦你这是挡大家财路」；全场哄笑，雷小雨把检测原始记录拍在桌上（爽点 1：初次小型对撞）。<\/p>\n<p>4. 秦江海口癖变奏：「签了，我把三十年押给你；不签，下游几万人押给他们？」（金句，切片点）<\/p>\n<p>5. 【集末卡点·信息型】马长贵冷笑放话「那咱就看看，是你的章硬还是我的路子硬」——外面雷声第一响，汛期倒计时启动。<\/p>\n<p>基线爆点计数：**2 / 集**（对撞、金句）——低于 hot 档 ≥3。缺口 B11：无总编加码（监管版会在拍 2 加身份碎片：左胸口袋里褪色劳模奖章特写，提前半拍亮身份）。<\/p>\n<h4>E2 · 施压对撞（景三：项目部办公区）<\/h4>\n<p>1. 【3 秒钩】秦江海的办公桌被搬进档案室角落，门牌摘了（调岗预演，冲突直接开场）。<\/p>\n<p>2. 冯有德甩出联签单：「我不要你觉得，我要我觉得。」<\/p>\n<p>3. 秦江海头都不抬：「水不要你觉得。」（对撞切片点，爽点 1）<\/p>\n<p>4. 马长贵带人堵门递烟施压；雷小雨举全站仪拦：「图纸上没有这个数。」（爽点 2：小回击）<\/p>\n<p>5. 【集末卡点·情绪型】秦江海把钢卷尺拍在联签单上：「量堤可以，量人心你们不够长。」戛然而止。<\/p>\n<p>基线爆点计数：**2 / 集**。缺口 B12：口癖本集未变奏（hot 档金句复读：3 集内变奏 3 次，基线只做了 E1 一次，靠惯性，无复读监管）。<\/p>\n<h4>E3 · 夜查偷工（景二：堤段工地 · 汛期堤坡）<\/h4>\n<p>1. 【3 秒钩】夜，手电光钉住堤坡上正在换料的卡车——「偷感」名场面开场（危险）。<\/p>\n<p>2. 马长贵反咬「赶在汛期前完工，是为了大家」——正确的理由干错误的事（C7 反派作恶锚，等价成立）。<\/p>\n<p>3. 秦江海蹲下抓一把料捻开：「这方混凝土，保熟吗？」（切片点，爽点 1）<\/p>\n<p>4. 次日验收会，拒签单被冯有德当众撕碎（受辱顶点）；**基线缺口 B13：回击隔 3 拍才来，超 hot 档 ≤2 拍红线**——监管版修法：当拍甩出芯样照片回击（「撕吧，每一页我都抄了三份」），撕单只留作集尾连本带利的情绪债。<\/p>\n<p>5. 【集末卡点·情绪+信息型】雨中他把碎纸一片片捡进雨靴（清算物件·雨靴首次亮相），画外雷声压堤——「水位涨一格，你们就多欠我一页。」（爽点 2 + 全剧钟卡点）<\/p>\n<p>基线爆点计数：**2 / 集**；E1-E3 口癖变奏实绩 1 次（要求 3 次）。**前三集基线小结：布点等价成立、钩子/卡点四硬规则达标；密度欠账 6 处（B1-B13 中属强度类者）全部指向被关闭的总编监管位——这就是历史实证「监管版 63 拍 vs 基线 40 拍」在本项目的预期复现位。**<\/p>\n<p>---<\/p>\n<h3>六、监管增益对照<\/h3>\n<h4>对照表 B · 合规红线逐条（自变量核心：C4/C5 开闭）<\/h4>\n<p>判定口径：**等价 = 爽点机制不依赖被禁元素，禁用后机制照常兑现；增益 = 合规取法反而更强**。<\/p>\n<p class=\"row\"> ┃  #  ┃  条款  ┃  无监管基线倾向（决策层描述，未落地执行）  ┃  合规基线落实（爽版正稿取法）  ┃  判定  ┃ <\/p>\n<p class=\"row\"> ┃  R1  ┃  零真实机构名  ┃  第三层反派直接挂真实主管机构名，省解释成本、借「实名」造震慑  ┃  全部用通称（项目部／复核组／上级单位）；自造专名预算 2 个（清川河、临江圩，全稿余量 1）；「实名感」由竣工永久性标牌刻名制度承担——剧内五方责任人刻名上碑，是制度自带的实名装置，比真实机构名更具体、更可拍（特写/转发点双料）  ┃  **等价 + 增益**：权力型金手指来自签字权与终身责任制，不来自牌子真伪；刻名碑是 C9 清算物件，实名感反而更强  ┃ <\/p>\n<p class=\"row\"> ┃  R2  ┃  零真实责任人  ┃  影射新闻里的责任链条，借真实人物剪影造「对号入座」快感  ┃  反派作恶全部落在剧内反派的具体动作（先签后补／不留影像／窗口期压质量／调岗排异四件套），每个动作自带当众对撞位  ┃  **等价**：愤怒落点本就该在动作；「对号入座」快感是一次性的，动作对撞可每集复用  ┃ <\/p>\n<p class=\"row\"> ┃  R3  ┃  真实灾害事件不对应、不暗示责任认定  ┃  E1 开场直接剪真实决口新闻画面当钩子  ┃  剧内事件独立成案（临江圩除险加固），水的威力靠剧内物证建立（见 R4），零真实影像对应  ┃  **等价**：3 秒钩子由「独拒签」承担，本就不依赖新闻画面  ┃ <\/p>\n<p class=\"row\"> ┃  R4  ┃  灾害场面不消费伤亡（专项，见第七节）  ┃  E50 洪峰夜写决口 + 伤亡画面当最大爆点；洪峰戏拍遇难特写、呼救镜头  ┃  水的威力全部物证化：水位刻度爬升、管涌翻浑水顶起碎石、青石板被顶裂、树干拦腰；人员只拍背影与转移安置的秩序感；伤亡零呈现（无遇难、无伤情特写、无呼救特写）；决口若出现只拍封堵作业与事后问责，不渲染灾情惨状  ┃  **等价 + 增益**：恐惧源从「一次性惨状」换成「滴答爬升的水位刻度」——倒计时式恐惧可持续供 60 集消耗，比伤亡画面更耐打且不折损爽点兑现  ┃ <\/p>\n<p class=\"row\"> ┃  R5  ┃  不喊口号、不批判体制  ┃  终局写成私人复仇式清算（反派跪坟、身败名裂即完），情绪泄向系统  ┃  情绪全落反派具体动作；终局落点「问责与守护」：问责会（剧内）+ 刻名碑 + 他签下最后一张验收单  ┃  **等价 + 增益**：「他签字」比「他们下跪」更贴角色三十年弧光——他一生只认这一张纸，爽点兑现即人设兑现  ┃ <\/p>\n<p class=\"row\"> ┃  R6  ┃  C4-① 禁架空术语  ┃  无倾向（实事做底是输入件首选级，编剧无动机违反）  ┃  设定来源声明：实事新闻做底（终身责任制 + 国债除险加固 + 汛期问责）  ┃  **等价**（本就是共同选型）  ┃ <\/p>\n<p class=\"row\"> ┃  R7  ┃  C4-② 禁重生/先知  ┃  无倾向（梗卡已判：重生把坚持降级为先知）  ┃  验证全靠事前拒签的物理证据链  ┃  **等价**  ┃ <\/p>\n<p class=\"row\"> ┃  R8  ┃  C4-④ 禁暴富皮／C4-⑤ 禁多层马甲  ┃  基线倾向：首卡让贺工亮「退休高工身份」碾压全场（身份型金手指惯性）  ┃  金手指=权力型身份（签字权、复审权、终身责任制条款）；马甲仅许洪峰后一摞拒签单的物件式单点揭示  ┃  **等价**：爽点兑现画面是「水位线对照 + 联签单作废」，不是身份碾压；与移交单 C4 同向  ┃ <\/p>\n<p class=\"row\"> ┃  R9  ┃  C4-⑥ 三秒测试  ┃  无倾向  ┃  「修堤的 / 偷工减料的 / 不签字的老工程师」E1 拍 1-2 全部亮相  ┃  **等价**（受控布点保障）  ┃ <\/p>\n<h4>对照表 A · hot 档参数逐项（强度监管位增益预判）<\/h4>\n<p class=\"row\"> ┃  hot 档参数  ┃  基线实绩（本件第五节）  ┃  监管版要求  ┃  预期增益点  ┃ <\/p>\n<p class=\"row\"> ┃  每集爽点 ≥3  ┃  前三集 2/集  ┃  ≥3 且分布无沙漠  ┃  G2 密度加码：每集补 1 个身份碎片/反转（劳模奖章提前、芯样照片当拍回击）  ┃ <\/p>\n<p class=\"row\"> ┃  受辱→回击 ≤2 拍  ┃  E3 隔 3 拍（B13）  ┃  ≤2 拍  ┃  G3 当拍回击改写  ┃ <\/p>\n<p class=\"row\"> ┃  口癖每集 ≥1、3 集变奏 3 次  ┃  变奏 1 次（B12）  ┃  全达标  ┃  G4 复读监管  ┃ <\/p>\n<p class=\"row\"> ┃  身份揭示早半拍  ┃  贺工 E30 后进场（B3）  ┃  首卡现场作背景板  ┃  G5  ┃ <\/p>\n<p class=\"row\"> ┃  名场面可视化  ┃  大纲级画面（B8）  ┃  海报五要素、可直当分镜需求  ┃  G6  ┃ <\/p>\n<p class=\"row\"> ┃  全剧爆点分布  ┃  单元级密度表（B5）  ┃  逐集分布图、沙漠段检查  ┃  G7  ┃ <\/p>\n<p class=\"row\"> ┃  四硬规则（拍号/卡点/口癖/3 秒钩）  ┃  达标  ┃  达标（不豁免）  ┃  无缺口——基线不掉底线的部分证明底线来自档位而非监管  ┃ <\/p>\n<h4>增益结论<\/h4>\n<p>1. **爽点机制等价成立**：本片全部核心爽点机制（拒签蓄力、验收会死局→当众验证、洪水当法官清算、一堤两制水位分屏、拒签单物件式揭示、刻名碑问责落点）没有一个依赖被 C4/C5 禁止的元素——把真实机构名、真实事件对应、伤亡画面、身份碾压、多层马甲全部拿走，机制原样运转。合规基线不是爽点的减法。<\/p>\n<p>2. **监管增益为纯增益，两组**：强度组（G2-G7，总编位）——密度、时差、复读、可视化、分布；合规组（R1/R4/R5 的增益判定 + B7/B10）——红线落实产生的「可上线性」与刻名碑/雨靴等更强的清算物件，外加基线稿暴露的根本问题：**无监管位时合规只能靠输入件自律，不可审计（B10），监管位把自律变成对账。**<\/p>\n<p>3. **A/B 计量协议**：爽版正稿定稿后，按本件第五节同口径回填前三集爆点计数、口癖变奏、回击时差三列（本件留 □ 待回填位），与基线值并表报 R3 门；历史参照 63 拍 vs 40 拍。<\/p>\n<p>---<\/p>\n<h3>七、专项：灾害场面不消费伤亡——红线落实说明<\/h3>\n<p>**为什么这条在本片最重**：题材的天然诱惑是把水的威力拍成人的惨状；本片机制的优势恰是不需要——恐惧由倒计时供给，不由惨状供给。<\/p>\n<p>**落实三则（全稿执行，含前三集与大纲名场面清单）**：<\/p>\n<p>1. **水的威力物证化**：只拍物不拍人受害——水位刻度一格一格爬（全剧钟的视觉本体）、管涌口翻浑水顶起碎石、青石板步道被顶裂、树干拦腰、雨靴浮起。水的「大」用声音与刻度表达，不用惨状表达。<\/p>\n<p>2. **人员镜头纪律**：转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影），零遇难、零伤情特写、零呼救镜头、零寻人启事道具。<\/p>\n<p>3. **决口的处理**：若剧情需要决口，镜头只给封堵作业与事后问责会，不对应任何真实事件、不暗示任何真实责任认定；结局落点锚「问责与守护」正价值。<\/p>\n<p>**自检**：本件第五节分拍与第四节大纲名场面清单逐条核过，无一处伤亡消费镜头；对照表 B/R4 的基线倾向（伤亡画面当爆点）仅存在于设计层描述，未落地。<\/p>\n<p>---<\/p>\n<h3>八、基线自检（对照件纪律）<\/h3>\n<ul>\n<li>[x] 五节结构齐全且与爽版正稿同构（唯一变量=监管开闭，受控变量表见〇节）<\/li>\n<li>[x] 本件文本零真实机构名 / 零真实责任人（R1/R2 对照均为决策层描述）<\/li>\n<li>[x] 本件文本零消费伤亡的灾害场面（第七节专项自检）<\/li>\n<li>[x] 自造专名 2 个（清川河、临江圩），余量 1<\/li>\n<li>[x] hot 档四硬规则在基线稿达标情况如实计量（不粉饰基线——缺口即对照证据）<\/li>\n<li>[x] 基线诚实缺口 B1-B13 全部标注归属监管位（强度类 → 总编；合规类 → 监理）<\/li>\n<li>[x] 无 git 操作、未读取 _archive<\/li>\n<li>[x] 待办移交：前三集 A/B 三列计量值由爽版正稿回填后并表报 R3 门<\/li>\n<\/ul>\n<p>*依据：flows/topic-selection flow.json `baseline` 节点；kb/aesthetic/style-routes（route 声明协议）；kb/aesthetic/oversight（A/B 基线纪律）；kb/aesthetic/pacing-density（hot 档计量口径）；选题分析报告·约束移交单 C1-C10；梗卡@2026-09-16；热点素材@2026-09-16。本件为内部过程物件，不随对外交付输出。*<\/p><\/section>\n<section><h1>故事框架案.md<\/h1><h2>故事框架案 · 《守堤人》（水利题材 · 拒签老总工）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>剖面：story-choreographer（编排师 · 结构选型师）· S2 structure 节点<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>输入件：skills/structure-design.md（选型三步）；选题分析报告.md 第五节「创作约束移交单」C1-C10；选题方案-爽版-基线.md（人人设/新变体/伤亡红线同源基线）；梗卡.md；热点素材.md；多视角意见书-R1.md（R1 门「附条件过」，条件 1-3 已并入本框架）；kb/structure/catalog；kb/market/structure；kb/aesthetic（pacing-density / reversal / emotion-curve / conflict-escalation）<\/li>\n<li>禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作<\/li>\n<li>同源声明：核心 5 人人设、「拒签蓄力 × 洪峰当众验证」新变体、伤亡红线三则，全部与基线件同源；对基线的 5 处显式修订见表 2.0-A（均有出处，非静默改动）<\/li>\n<li>输出契约对照：本文一/二/五/六/七节 = skills/structure-design 输出契约五节（选型/骨架/改造/注入/节奏预排）；三/四/八/九/十/十一节为移交单与 R1 条件强制的扩展节<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、结构选型<\/h3>\n<h4>1.1 选型结论总表<\/h4>\n<p class=\"row\"> ┃  项  ┃  选型  ┃  占比  ┃  一句话定义  ┃ <\/p>\n<p class=\"row\"> ┃  主骨  ┃  复仇/清账结构 · 「制度清算」改造版  ┃  明线主干，约 70%  ┃  冤屈建立（拒签受辱）→ 能力获得（制度权力作金手指）→ 逐层清算（三层反派连坐）→ 终局对账（问责会 + 刻名碑）；清算执行者由主角置换为自然规律  ┃ <\/p>\n<p class=\"row\"> ┃  辅骨  ┃  双线交叉 · 编辫式变体  ┃  暗线，约 30%  ┃  明线：一张张验收单的攻防清算；暗线：汛期倒计时（水位）单调爬升汇聚，交叉引爆于洪峰。B 线每集在场 1-2 拍（非间隔式双线），规避「交叉间距 &gt;5 拍判失衡」  ┃ <\/p>\n<p class=\"row\"> ┃  轻辅  ┃  单元宿命（重复结构带变量）  ┃  装入明线内  ┃  「一张验收单 = 一次攻防」单元模板，变量池 = 反派四件套 × 验证物 5 种（4×5=20 变量），60 集不重样  ┃ <\/p>\n<p class=\"row\"> ┃  倒计时结构  ┃  汛期戏剧钟（三圈钟）  ┃  暗线本体  ┃  适用。外圈气象钟 / 中圈调度钟 / 内圈物证钟，视觉本体 = 水位刻度爬升；全剧钟走完 = 决战打完  ┃ <\/p>\n<h4>1.2 主骨：复仇清账 · 四段映射（每段写实到本选题事件）<\/h4>\n<p class=\"row\"> ┃  复仇母型骨架段  ┃  本选题的具体事件  ┃  集域  ┃ <\/p>\n<p class=\"row\"> ┃  冤屈建立  ┃  开标会全员签字他独拒签 → 被撕底稿 → 被反咬立案 → 被调岗收章  ┃  E1-E24  ┃ <\/p>\n<p class=\"row\"> ┃  能力获得  ┃  不是获得马甲，是被发配到全剧唯一还能合法留痕的岗位（堤头泄洪闸房），攒出「堤段病历本」  ┃  E21-E40  ┃ <\/p>\n<p class=\"row\"> ┃  逐层清算  ┃  洪峰出险部位与他的书面拒签/警告记录一一对应 → 出险清单 = 签收清单 → 拒签清单 = 清算名单，三层反派连坐  ┃  E49-E58  ┃ <\/p>\n<p class=\"row\"> ┃  终局对账  ┃  问责会 + 竣工永久性标牌刻名 + 他签下唯一一张「合格」  ┃  E59-E60  ┃ <\/p>\n<h4>1.3 辅骨：编辫式双线（明线主干 / 暗线 / 交叉点位）<\/h4>\n<ul>\n<li>**明线（70%）**：验收单攻防与清算推进。每集主认知更新只有一个（AE-INFO-LOAD），落在明线。<\/li>\n<li>**暗线（30%）**：汛期倒计时。每集 1-2 个 tick 拍（雷声/雨情/渗压/水位刻度），不作主认知更新，只做压迫蓄能。<\/li>\n<li>**实质交叉点位（6 处，引爆逐级加压）**：E10 管涌当众验证（水第一次替他说话）→ E24 小洪峰预判兑现（水第一次听他的）→ E30 开膛见假被销项（他认清只有水能同时作废所有签收）→ E42 调包未遂（水情日志成物证）→ E49-56 洪峰全交叉引爆 → E57-58 清算对账。交叉间距最长 12 集，其间暗线每集在场不断线，不判双线失控。<\/li>\n<\/ul>\n<h4>1.4 汛期戏剧钟（三圈钟设计）<\/h4>\n<p class=\"row\"> ┃  钟圈  ┃  载体  ┃  tick 频率  ┃  视觉本体  ┃ <\/p>\n<p class=\"row\"> ┃  外圈·气象钟  ┃  上游雨情、台风生成与路径（剧内通称，无台风名）  ┃  每 8-12 集一格收紧  ┃  雨带预报画面、雷声  ┃ <\/p>\n<p class=\"row\"> ┃  中圈·调度钟  ┃  泄洪调度令、闸门开度、预泄库容（病险水库主汛期空库运行的 C 级制度剧内化，见提案 D）  ┃  每道令一响  ┃  开度表、令单  ┃ <\/p>\n<p class=\"row\"> ┃  内圈·物证钟  ┃  渗压读数、坡面渗水、管涌、水位刻度  ┃  每集 1-2 拍  ┃  水位刻度一格一格爬（全剧钟的钟面）  ┃ <\/p>\n<p>钟与剧情咬合的规则：反派每抢一格工期，钟响一声——他们在跟汛期抢时间，他在跟他们的签字抢时间。E1 集尾雷声第一响上弦，E50 责任状为钟面顶格，E55 刻度回落为钟走完。<\/p>\n<h4>1.5 选型理由<\/h4>\n<p>1. **对标人群咬合（C1）**：30-55 岁男频「尊严代偿」客群的爽感来自「冤屈建立 → 清账兑现」弧，复仇母型天然供给；家庭共看次客群吃暗线钟表紧张（决口一刻想起每一张签掉的和没签的单，C7 原话）。<\/p>\n<p>2. **梗卡回指**：主梗（神豪暴富族）只取「被低估身份 × 当众验证碾压」机制——复仇骨架的「能力获得」段由制度权力（签字权/复审权/终身责任制条款）充当，不取财富皮（梗卡风险 1 对策）；必备引擎（打脸虐渣 n=1510）由「逐层清算」段承载，带「洪水当法官」新变体进红海（梗卡风险 2 对策）；辅梗流放种田的「苦地硬核基建」由单元宿命的工段攻防承载画面库（查管涌/打桩/抢培土包）。<\/p>\n<p>3. **hot 档偏好（kb/structure/catalog §三）**：hot 偏清算/升级型，密度好布。本片选清算不选升级——R1 门明令「尊严刻度不许偷偷写成励志逆袭」（58 岁临退主角无升级欲望，升级型必滑励志模板）；救猫咪 15 节拍模板痕迹重且 E1 拒签已是原生激励事件，无需外挂催化剂；倒钩回归单用前期钩子弱（短剧慎单用），只取微回环嵌入（E1 分界桩 → E60 刻名碑；「这单我不签」×59 → 「这单我签」×1）。<\/p>\n<p>4. **市场节拍位（kb/market/structure）**：60 集 → 首卡 8-12（本框架 E10）/ 中点 30 改写模型（E30）/ 55+ 决战（E49-56），全部落在实盘节拍窗内。<\/p>\n<h4>1.6 红方三视角验收自查（kb/structure/catalog §三）<\/h4>\n<ul>\n<li>**目标读者**：爽点在位——E3 小验证、E10 自证+验证双爽、E16/E24/E27/E38/E42 中型爽垫场、E53 一堤两制终验、E58 清算名单；R1 两处「犹豫」的条件（前 3-5 集小验证 / 每三集一次看得见的水 / 一堤两制第一集露脸）全部落进骨架。追。<\/li>\n<li>**资深编剧**：骨架完整——因果链八节点齐备（见 2.12）；R1 四条手艺警告 W1-W4 逐条有结构落点（见八节对账）。过。<\/li>\n<li>**甲方**：卖点更锐——「洪水宣读他早就写好的判词」比「洪水替他赢了」多一层可拍物（病历本/判词链）；一堤两制升格全剧视觉母题且 E1 露脸，切片物料前置。过（甲方行动项 4 为非结构事项，移交见十节）。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、骨架具体化（60 集 · 五宏节点 · 九段逐节点写实）<\/h3>\n<h4>2.0 五宏节点主干表（任务移交的五节点 = 本框架九段）<\/h4>\n<p class=\"row\"> ┃  宏节点  ┃  段  ┃  集域  ┃  段功能  ┃ <\/p>\n<p class=\"row\"> ┃  N1 验收会拒签  ┃  段一 拒签立状 / 段二 首卡验证  ┃  E1-8 / E9-12  ┃  拒签立住、小验证破纯受辱、首卡当众验证  ┃ <\/p>\n<p class=\"row\"> ┃  N2 调岗泄洪闸  ┃  段三 单元攻防 / 段四 调岗闸房 / 段五 抽检开膛  ┃  E13-19 / E20-24 / E25-32  ┃  四件套轮换、两级贬法送进钟楼、中点模型改写  ┃ <\/p>\n<p class=\"row\"> ┃  N3 隐蔽工程取证  ┃  段六 取证留痕 / 段七 围标现形  ┃  E33-40 / E41-48  ┃  病历本总装成「判词」、蓄满待洪  ┃ <\/p>\n<p class=\"row\"> ┃  N4 洪峰验证  ┃  段八 洪峰  ┃  E49-56  ┃  危机选择、主动抢险、一堤两制终验  ┃ <\/p>\n<p class=\"row\"> ┃  N5 问责清算  ┃  段九 清算  ┃  E57-60  ┃  连坐清算、刻名碑、口癖反打收尾  ┃ <\/p>\n<p>**表 2.0-A · 对基线的显式修订点（5 处，均可追溯）**<\/p>\n<p class=\"row\"> ┃  #  ┃  基线原状  ┃  本框架修订  ┃  修订出处  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  E3 拒签单被当众撕  ┃  改为当众撕的是他私留的检测底稿；拒签记录存档联流程上撕不掉  ┃  R1 资深编剧 W2 修正（顺手埋复盘实锤）  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  调岗管仓库（E25-32）  ┃  两级贬法：E20 夺章发配仓库（三天）→ E21 转发配堤头泄洪闸房  ┃  任务移交节点「调岗泄洪闸」；热点素材标题「调去管仓库」降为中间一拍保留  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  隐蔽工程开膛在 E33-40 段内  ┃  开膛前移至 E30（中点），取证段 E33-40 改为「证据被销后的重建总装」  ┃  kb/market 中点 30 须改写模型；基线 B5/B9 伏笔缺口前收  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  E3 与 E20 两处「拒签单被当众撕」重复  ┃  E3 撕底稿、E20 撕程序改为「例行归档调走存档联 + 当众收章」  ┃  reversal KB「避免每集同一种打脸」；对抗力量学习适应  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  贺工 E30 后进场  ┃  E8 起作复核组背景板到场，E10 首卡现场在位，E16 首次出手  ┃  基线缺口 B3（身份揭示早半拍）的监管版加码方向  ┃ <\/p>\n<h4>2.1 段一 · 拒签立状（E1-E8）<\/h4>\n<ul>\n<li>E1【3 秒钩】【梗·口癖】验收会议室，签到笔沿长桌传递逐个落名，传到秦江海停住，笔帽在图纸上敲三下：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」——拒签写成出击（部位+缺陷+要求三要素，R1-W1）。马长贵起哄「挡大家财路」，雷小雨把检测原始记录拍在桌上。金句变奏：「签了，我把三十年押给你；不签，下游几万人押给他们？」<\/li>\n<li>E1 集尾【卡·情绪型】【水】【伏】他不回宿舍直上堤：耳朵贴堤听水声（名场面①第一集露脸，R1 读者条件）；手指划过桩号分界桩——他拒签的段与别人签收的段第一次同框（一堤两制 E1 露脸，R1 读者条件）。雷声第一响——全剧钟上弦。<\/li>\n<li>E2【爽】【梗7】办公桌被搬进档案室角落（调岗预演）。冯有德甩联签单：「我不要你觉得，我要你觉得。」他头也不抬：「水不要你觉得。」马长贵带人堵门递烟，雷小雨举全站仪拦门：「图纸上没有这个数。」集尾钢卷尺拍在联签单上：「量堤可以，量人心你们不够长。」口癖变奏②：「这一单，我还不签。」<\/li>\n<li>E3【小验证·爽】【梗13/16】夜查偷工：手电光把堤坡换料卡车钉住（「偷感」名场面②）。他蹲下抓料捻开：「**这方混凝土，保熟吗？**」当场比对合格料样，雷小雨快测数据当众念出，工头语塞，群演倒吸凉气——**前 3 集小验证小赢**（R1 条件 1）。次日验收会冯有德不提验料结果，反以「私留检测底稿、扰乱验收秩序」**当众撕他的检测底稿**（受辱顶点；存档联撕不掉【伏】）。他当拍回击（≤2 拍红线内）：「撕吧。这单我不签——每一页我都抄了三份。」（口癖变奏③）集尾雨中把碎纸一片片捡进雨靴：「水位涨一格，你们就多欠我一页。」【水】【伏：雨靴·口癖总变奏的「抄三份」】<\/li>\n<li>E4【伏】数据保密程序风声起；马长贵放话「是你的章硬还是我的路子硬」。<\/li>\n<li>E5【水】【伏】雨后他巡堤测渗压，逐桩记录拍照一式两份（留痕链开始，R1 条件 2 铺垫）；马长贵堤段坡面渗水初现——看得见的水。<\/li>\n<li>E6【伏】他提交《分部验收异议书》（书面出击）。桂守成首次亮「按程序办」：「程序要件不全，退件。」——第一层流程墙；退件批注笔迹特写【伏：E36 笔迹比对】。<\/li>\n<li>E7【梗8】同僚劝「格局打开」，他回「堤垮了格局更大」；雷小雨被单独谈话（策反前奏【伏：提案 B 变体】）。<\/li>\n<li>E8【最低谷·受冤】复审组进场，第一份立案的是反咬信——举报秦江海「泄露工程数据」（提案 C 兑现，受辱升级为受冤）；资料权限被收。贺工作复核组背景板首次到场（基线 B3 修正），不表态，保温杯拧开又拧上。<\/li>\n<\/ul>\n<h4>2.2 段二 · 首卡验证（E9-E12）<\/h4>\n<ul>\n<li>E9【死局·付费前置钩】听证式验收会：反咬信 + 联签生效表决在即，他被「请」出会议室。门外雨声炸响，他隔门一句：「数据是真的，水会来对。」悬念顶格（免费段末，kb pacing 卡点站位 8-10 集末）。<\/li>\n<li>E10【首卡·当众验证兑现·爽×2】雨后第一轮涨水，马长贵堤段出管涌——现场对质：他「泄露」的数据与现场实测分毫不差，反咬信当众反转，**自证 + 验证双爽**（强度对标 b016-fam 同位爆点：对赌死局 → 徒手复原数据的同位物 = 受冤死局 → 水位线对照打脸）。桂守成冷处理：「个别点位，按程序处置。」局部返工销项。群演低语「扫地僧」【梗4】。**集末付费墙卡点（C6：卡点事件 = 首次当众验证，8-12 集窗内）**：马长贵冷笑「六处险工段，你拦得住这一处吗」——水位刻度爬升特写。<\/li>\n<li>E11 赢一场小的、输一局更大的（R1 矛盾并列 1 仲裁）：复工表彰公示，马长贵上台领「抢工期先进」。<\/li>\n<li>E12【一堤两制正式点题】【水】雨夜复核走堤：分界桩两侧浑水点密度差第一次被镜头明确分屏（视觉母题 E1 露脸 → E12 点题 → E53 终验，三级递进）。贺工蹲下摸桩号，全剧第一句台词：「我看看。」<\/li>\n<\/ul>\n<h4>2.3 段三 · 单元攻防（E13-E19）——四件套第一轮轮换<\/h4>\n<ul>\n<li>E13 单元宿命模板开轮：一张验收单 = 一次攻防（施压 → 书面回击 → 集尾卡点）。<\/li>\n<li>E14【伏】权限被收后的取证难：借阅登记簿上出现不该出现的笔迹【伏：桂】；雷小雨以「留样柜自检」名义另存平行样【伏：E42】。<\/li>\n<li>E15 「先签后补」页摆到他面前要求补一道「程序性签字」，他拒签并指出该页对应桩号（出击式拒签复用模板）。<\/li>\n<li>E16【爽·梗5】标高复核对赌：年轻技术员「合格」结论被贺工当场算塌——「你大爷还是你大爷」位；堤前水面同框【水】。<\/li>\n<li>E17 马长贵发烟压班组闭嘴；老周首场（接烟不说话，「我就路过」）。<\/li>\n<li>E18【场面梗·水】耳朵贴堤听水声教学带徒（名场面③）；老周私下口述夜施内情，不敢落名（口证不算痕——逼出后文书面化动机）。<\/li>\n<li>E19【四件套之三】冯有德以「防汛窗口期」强推合龙段验收——正确的理由干错误的事；书面异议再遭「程序要件」退件。<\/li>\n<\/ul>\n<h4>2.4 段四 · 调岗泄洪闸（E20-E24）<\/h4>\n<ul>\n<li>E20【大卡点·情绪型】【梗6 反讽位】「例行归档」调走拒签存档联，当众宣布他调离总工岗、收章；众人笑谈「老师傅也被整顿了」——切片标题反打位。雨靴挂上仓库钥匙串（受辱与物件同框）。<\/li>\n<li>E21 仓库三日（「调去管仓库」情绪位保留，见热点素材第四节标题样本）；调令二下：汛期闸门值守缺人，转发配堤头闸房——冯有德眼不见为净（**对抗力量错误适应的起点**：他们把发配地选成了全剧钟楼）。<\/li>\n<li>E22【水】闸房报到：开度表、水位刻度、闸下出流——暗线主场化，中圈钟就位。<\/li>\n<li>E23【伏·水】他发现调度台账的库容参数对不上雨情（台账按「验收合格」的老资料编——围标链连水情都做过手）；开始私下记《闸房水情日志》。<\/li>\n<li>E24【爽·中型·反转①因果型】小洪峰预判：他提前 48 小时书面建议 + 备选应急方案；建议被弃，洪水如期，值班员按他留的备选方案度过——「水听他的」第一次预演（铺垫：E18 听堤、E23 台账）。<\/li>\n<\/ul>\n<h4>2.5 段五 · 抽检与开膛（E25-E32）——中点模型改写<\/h4>\n<ul>\n<li>E25-26 上级抽检进场（平息舆情）；围标链布置换样。<\/li>\n<li>E27【爽·反转③预期+立场型】换样被抓现行（雷小雨的留样标记）；同集她发现自己名字已被夹进某分部联签校核页——**诱签陷阱收口**（提案 B 变体兑现，铺垫：E7 谈话、E14 留样）。<\/li>\n<li>E28-29 齿墙开挖之争：他书面申请开挖检查隐蔽工程（出击）；表决结果「附条件开挖：只挖一处、挖完即回填」——流程先锁死结果【伏】。坑底渗水同框【水】。<\/li>\n<li>E30【中点·反转④预期型·模型改写】开膛见假齿墙（全场以为开膛 = 他赢）；桂守成当场启动应急处置程序：回填、重新取样、资料补齐销项——铁证被流程吃掉。**故事模型自此改写（不是提高音量）**：从「在体系内挡下每一张单」改写为「体系已被流程殖民，唯一能同时作废所有签收的只有洪水」——他对贺工说：「挡不住了。往后我只做一件事——把每一处都写下来，等水来对账。」<\/li>\n<li>E31 雷小雨的校核页再被夹进销项附件（她被越捆越深）。<\/li>\n<li>E32【水】【伏】第一道泄洪调度令下达（空库迎峰 tick）；他读令发现预泄库容与台账矛盾——暗线证据 +1（中点 → 首卡间中型信息爽点垫场）。<\/li>\n<\/ul>\n<h4>2.6 段六 · 隐蔽工程取证（E33-E40）<\/h4>\n<ul>\n<li>E33【代价·爽·中型】老周书面交底夜施内情并附记工单复印件（物证小赢），当天被辞——证人代价（依赖维度升级）。<\/li>\n<li>E34 实名举报递交，换来「程序合规」受理回执（石沉大海开始）。<\/li>\n<li>E35【大卡点·信息型】举报被驳回——驳回依据正是 E30 的销项文书（用流程吃流程）；贺工亮终审姿态：保温杯拧开，「我看看。」把驳回卷宗留下（复复核权首亮）。当夜暴雨拍窗【水】。<\/li>\n<li>E36【反转⑤立场型】围标链轮廓现形：招标代理—资料代编—先签后补一条龙；E6 退件批注笔迹与反咬信比对同源——桂守成浮出。<\/li>\n<li>E37 台风外围雨带逼近【水】；表彰会筹备铺陈（形式主义蓄势）。<\/li>\n<li>E38【爽·中型·梗15】表彰会歌舞被雷小雨一句「堤还没验」摁停——「听我说谢谢你」讽刺位；冯有德失态。会场外暴雨【水】。<\/li>\n<li>E39【留痕总装·伏】闸房内清点雨靴防水袋：重抄底单、双份照片、渗压记录并册——**「堤段病历本」11 处成形**（桩号—缺陷—日期—要求一一对应，R1 条件 2 铺垫完成）；闸下出流声底噪【水】。<\/li>\n<li>E40【爽·梗2】带徒台词：「真正的基建狂魔，是敢对堤说不的人。」（切片位）围标链在剧内被定性为「一条龙」（通称，无机构名）。<\/li>\n<\/ul>\n<h4>2.7 段七 · 围标现形与蓄满（E41-E48）<\/h4>\n<ul>\n<li>E41【水】台风生成、路径命中流域上游（外圈钟收紧）——抢工期与抢验收双钟同拨。<\/li>\n<li>E42【爽·反转⑥预期型·梗9】资料站调走闸房日志未遂——雷小雨的存档副本救证，「求锤得锤」；调包笔迹落到桂守成。<\/li>\n<li>E43【伏：清算钥匙】冯有德被推到前台开「集体决定」扩大化签名会——他把每一页都签了，恰好把「集体」钉成「个人合集」（E58 逐页拆解在此上膛）。<\/li>\n<li>E44-45【压制段·螺旋下降最低谷】他被停职审查、收闸房钥匙（钟楼被收走）；交出钥匙串，只留下雨靴。停职夜雨【水】。<\/li>\n<li>E46【微反击·防丧】雷小雨与老周暗续水情日志；贺工把病历本副本正式登记进复核卷（制度容器藏火种）。夜巡雨水样登记【水】。<\/li>\n<li>E47【水·梗3】台风路径锁定：群众一句「今年不用去临江看海了」反讽位；转移预案启动。<\/li>\n<li>E48【蓄满·判词意象】复职令未下，他被「责令离堤」；他把病历本誊清三份各归其位（贺工复核卷 / 闸房夹层 / 随身）：「等水来，这就是判词。」台风夜第一声雨——压抑蓄满（爆发点前的「最后稻草」已备）。<\/li>\n<\/ul>\n<h4>2.8 段八 · 洪峰验证（E49-E56）<\/h4>\n<ul>\n<li>E49【水】一号洪峰编号；转移启动——**只拍秩序**（手电列队、沙袋传递、雨衣背影，零伤亡零呼救，红线二）。他冒雨折返堤上（主动性①：巡堤查险，R1 条件 3）。<\/li>\n<li>E50【危机选择·口癖总变奏·情绪顶点】调度令开闸时刻与台账库容矛盾爆发：按令开闸 = 下游险工段雪上加霜；不开 = 闸体超限上游漫灌——互不兼容且均有代价。他以终身责任签下**迟开闸 4 小时错峰**的责任状：说了一辈子「这单我不签」，这一次一个字没说——笔帽敲三下，落笔签名（主动性②；全剧唯一一次主动落笔，动作母题闭环）。<\/li>\n<li>E51-52【主动抢险·爽】病历本变部署图：拒签记录 = 抢险地图（标记管涌群、预置沙袋、分流抢护）——**他的留痕第一次直接救人**（主动性③）；贺工带复核组到场终审取证（E48 副本启用）。<\/li>\n<li>E53【全剧主反转·一堤两制终验】【水】同一水位下分屏：出险 8 处全部落在他记录的 11 处之内（**因果可归因，禁天罚式精准巧合**——另 3 处未出险，如实呈现质量是概率）；险情最重的一处，恰是当年异议被驳回、人被调岗没拦成的桩段（他的自责——同时封死「拒签段毫发无伤」与「精准垮塌」两个极端，R1-W2 落实）。<\/li>\n<li>E54【爽·梗10/12】回旋镖位：出险清单 = 签收清单；切片双关「这次塌的是真的」（措辞纪律：画面为出险渗漏抢护，非垮塌惨状，红线一）。<\/li>\n<li>E55【水】闸开错峰，洪峰过境；水位刻度由爬升转回落——全剧钟走完。<\/li>\n<li>E56 水退。雨靴在退水里浮起，他捞起来抱在怀里（水的威力用物说，红线一）。<\/li>\n<\/ul>\n<h4>2.9 段九 · 问责清算（E57-E60）<\/h4>\n<ul>\n<li>E57【清算①·梗11】问责会前夜：出险堤段清单与各段联签页并置；「施工队是临时的」甩锅被终身责任制条款当场钉死。<\/li>\n<li>E58【清算②·马甲单点揭示·清算名单】问责会：他交出被撕后重抄的一摞拒签单——**一页对一段，逐页念**（拒签清单 = 清算名单，可见可数对标 b028-s 标尺）；连坐清算顺序逐层落（见 4.3）。桂守成亮出「已老实」位【梗14】。<\/li>\n<li>E59【清算③·刻名碑】竣工永久性标牌：五方名字上碑——碑既刻功也刻债（终身责任制双向咬人）。他把重险桩段列为返工首位，并自请连责（问责组核为其调岗期间无签权——他不揽功也不诿责，尊严刻度）。<\/li>\n<li>E60【落点·问责与守护】「**这单我签。**」——全剧唯一一次说出这句话：复职令被他换成驻段质检申请（不写成励志逆袭，R1 并列 3）；雷小雨接过钢卷尺；他再次贴堤听水（E1 动作回环收尾）。水面平静，刻度归零。<\/li>\n<\/ul>\n<h4>2.10 付费卡点表<\/h4>\n<p class=\"row\"> ┃  站位  ┃  集  ┃  事件  ┃  类型  ┃ <\/p>\n<p class=\"row\"> ┃  **首卡（付费墙）**  ┃  **E10 末**  ┃  当众验证兑现 → 马长贵放话「六处险工段」+ 刻度爬升  ┃  事件型（C6：卡点事件 = 首次当众验证，8-12 窗内）  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点  ┃  E20  ┃  收章调岗、雨靴挂钥匙串  ┃  情绪型  ┃ <\/p>\n<p class=\"row\"> ┃  中点  ┃  E30  ┃  开膛见假被销项  ┃  信息 + 情绪型（模型改写）  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点  ┃  E35  ┃  举报被驳回 + 贺工亮牌  ┃  信息型  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点  ┃  E43  ┃  「集体决定」扩大化签名会  ┃  信息型（清算钥匙上膛）  ┃ <\/p>\n<p class=\"row\"> ┃  决战  ┃  E50  ┃  责任状无声落笔  ┃  情绪型顶点（55+ 决战窗内起点）  ┃ <\/p>\n<p class=\"row\"> ┃  终局  ┃  E58  ┃  清算名单逐页念  ┃  兑现型  ┃ <\/p>\n<h4>2.11 反转登记表（reversal KB：判型 + ≥2 处前置暗埋）<\/h4>\n<p class=\"row\"> ┃  #  ┃  集位  ┃  反转  ┃  判型  ┃  前置暗埋  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  E10  ┃  反咬信被现场实测打脸  ┃  预期反转  ┃  E3 底稿、E5 渗压留痕、E8 立案  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  E24  ┃  被发配的人成了唯一读对水的人  ┃  因果反转  ┃  E18 听堤、E23 台账矛盾  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  E27  ┃  取证者自己被签进问题段签字链  ┃  预期 + 立场反转  ┃  E7 谈话、E14 留样  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  E30  ┃  开膛赢了鉴定、输了证据  ┃  预期反转  ┃  E28 附条件表决、E23 台账  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  E36  ┃  反咬信笔迹 = 流程退件笔迹  ┃  立场反转  ┃  E6 退件批注、E14 借阅登记  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  E42  ┃  调包日志反成钉死桂的物证  ┃  预期反转  ┃  E40 一条龙轮廓、E39 清点  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  E53  ┃  一堤两制终验（主反转）  ┃  预期反转  ┃  全程留痕链 + E1 分界桩 + E12 分屏 + E48 判词  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  E58  ┃  一摞重抄拒签单 = 清算名单  ┃  身份反转（物件式单点）  ┃  E3 抄三份、E39 清点、E48 三份  ┃ <\/p>\n<p>同型连用检查：④⑤⑥为预期/立场/预期交替，无三连同型；每次反转落地后证物线全部重算（E10 后反咬信入卷、E30 后销项文书成驳回依据、E42 后日志成物证），无「反转后没人提」悬空证据。<\/p>\n<h4>2.12 因果链八节点对照（conflict-escalation §一）<\/h4>\n<p class=\"row\"> ┃  节点  ┃  本剧落位  ┃ <\/p>\n<p class=\"row\"> ┃  1 主题命题/反命题  ┃  堤保住了，因为有人以不肯签字的方式行动 ／ 工程「合规」通过了，因为签字把责任稀释成了流程  ┃ <\/p>\n<p class=\"row\"> ┃  2 欲望  ┃  外在：把问题堤段挡在验收之外；内在：三十年前他亲手递过一张补签单（提案 A，早期不自知，经行为模式体现——两支笔、贴堤听水）  ┃ <\/p>\n<p class=\"row\"> ┃  3 激励性扰动  ┃  E1 全员签他独拒签，原「少说少错」策略失效，被推到全项目部对面  ┃ <\/p>\n<p class=\"row\"> ┃  4 递进复杂化  ┃  对抗力量学习适应：驳数据（E6）→ 撕底稿（E3）→ 反咬立案（E8）→ 销项吃证据（E30）→ 调包日志（E42）；代价从尊严到生计到徒弟清白  ┃ <\/p>\n<p class=\"row\"> ┃  5 不可回头点  ┃  E30 后他把复核申请改为实名举报（E34）——举报人自押反坐风险、放弃安稳退休，主角选择关闭退路  ┃ <\/p>\n<p class=\"row\"> ┃  6 危机选择  ┃  E50 开闸（下游险段险化）vs 不开（闸体超限上游漫灌），互不兼容均有代价  ┃ <\/p>\n<p class=\"row\"> ┃  7 高潮行动  ┃  E50 签责任状迟开闸错峰 + E51-52 按病历本部署抢险（全片最大价值变化：签字从逃避的债变成救命的武器）  ┃ <\/p>\n<p class=\"row\"> ┃  8 结局价值与余波  ┃  问责兑现、刻名碑落成；未消失的代价：问题段返工需两年、他自愿留堤、冯有德调离待查  ┃ <\/p>\n<p>---<\/p>\n<h3>三、人设立柱（反差点）与人物表<\/h3>\n<h4>3.1 核心 5 人（同源基线，含监管版加码项）<\/h4>\n<p class=\"row\"> ┃  角色  ┃  设定  ┃  反差立柱  ┃  核心动机  ┃  口癖 / 标志小动作  ┃  加码（基线缺口修补）  ┃ <\/p>\n<p class=\"row\"> ┃  秦江海 · 58 · 临江圩除险加固项目部总工程师  ┃  藏蓝旧工装洗得发白，左胸口袋两支笔（一支写字、一支只画水位线——师父遗物，提案 A），胶底鞋，后腰钥匙串挂老钢卷尺  ┃  开会最没存在感，堤上声音最大  ┃  三十年前同一条河上，师父没拦住的那座坝——而补签页是他亲手送的（提案 A）  ┃  「这单我不签。」／说话前笔帽敲图纸三下  ┃  劳模奖章 E1 特写提前半拍亮身份（基线 B11）  ┃ <\/p>\n<p class=\"row\"> ┃  马长贵 · 45 · 施工方负责人（剧内自造主体）  ┃  皮鞋上工地，手机外放，办公桌腿垫酒箱  ┃  对上点头哈腰，对工人横  ┃  垫资垫到抵押了房，必须赶在汛期前验收回款（有理由的错误选择）  ┃  「规矩是死的，人是活的。」／说话先递烟  ┃  语言卡全配（基线 B2）  ┃ <\/p>\n<p class=\"row\"> ┃  冯有德 · 50 · 项目部上级（赶工期要签字的）  ┃  衬衫扣到顶，文件夹永远抱在胸前当盾牌  ┃  不贪，但怕担责  ┃  「集体的决定」——把个人责任稀释成集体责任  ┃  「再研究研究。」／签字前先看左右  ┃  同上；E43 签名会成为其人设的清算钥匙  ┃ <\/p>\n<p class=\"row\"> ┃  雷小雨 · 26 · 测绘员（徒弟）  ┃  反光背心，安全帽上一圈手绘警戒红线的黄色胶带，安全帽带子永远不扣  ┃  全项目部唯一公开站在老头一边的人，年轻人里最「多事」  ┃  她信数据不信酒桌  ┃  「图纸上没有这个数。」／拿全站仪当拐杖  ┃  外形记忆点加码（基线 B1）；零感情线声明：纯师徒/同事（C4-③）  ┃ <\/p>\n<p class=\"row\"> ┃  贺工 · 60 · 复核组老专家（复审方）  ┃  旧夹克，布鞋，手里始终捏着掉漆保温杯  ┃  退居二线说话没人当回事，出手就是终审  ┃  退休前最后一趟，想把当年的糊涂账算清  ┃  「我看看。」／保温杯拧开又拧上  ┃  E8 起背景板提前进场（基线 B3）  ┃ <\/p>\n<h4>3.2 扩展有名有姓 2 人（非核心，服务反派第三层与证人线）<\/h4>\n<p class=\"row\"> ┃  角色  ┃  设定  ┃  功能  ┃ <\/p>\n<p class=\"row\"> ┃  桂守成 · 44 · 监理负责人  ┃  从不违反任何一条程序，「按程序办」挂在嘴边，签字永远超前于施工  ┃  **反派第三层在项目部内的面孔**：先签后补的发源地、退件流程墙、销项程序的启动者；口癖「按程序办。」  ┃ <\/p>\n<p class=\"row\"> ┃  老周 · 55 · 马长贵班组料工  ┃  寡言，见谁都递烟，「我就路过。」  ┃  夜施内情证人：E17-18 口证 → E33 书面交底被辞 → E46 暗续日志 → E58 作证（证人代价线）  ┃ <\/p>\n<p>师父（三十年前）不登场不具名，仅存于遗物（那支只画水位线的笔）与 ≤3 次闪回（见提案 A）。**有名有姓合计 7 人（≤10），核心 5 人（≤5），群演不计入。**<\/p>\n<h4>3.3 三分钟测试自查（C4-⑥）<\/h4>\n<ul>\n<li>E1 第 1-2 拍内三个身份全部亮相：修堤的（工装/卷尺/贴堤听水）、偷工减料的（起哄「挡财路」+E3 换料实锤）、不签字的老工程师（「这单我不签」）。<\/li>\n<li>零设定前置：终身责任制、汛期问责均为公共语汇（C 级制度议题），无一术语需先讲设定才能进冲突；验证动作层全部画面化翻译——贴堤听水、手电照管涌、抓料捻开、水位刻度对照（R1 第六节「翻译习惯」落实）。<\/li>\n<li>片名「守堤人」直白可复述（R1 甲方复核已过）。<\/li>\n<\/ul>\n<h4>3.4 场景与角色对账（C3）<\/h4>\n<p>三景集合（总数 3，不超）：① 验收会议室（兼容听证会/表彰会陈设，E50 后可改防汛值守点——换陈设不换景）；② 堤段工地（含汛期堤坡 + 堤头泄洪闸房——闸房为堤端小屋，与堤坡同景域搭景）；③ 项目部办公区（含资料室与仓库角——调包、诱签、归档均在资料区完成）。换景 = 换集节拍点，每集冲突均发生在可复用景。<\/p>\n<p>---<\/p>\n<h3>四、反派梯度与连坐清算<\/h3>\n<h4>4.1 三层梯度——「把偷工减料做成流程的人」<\/h4>\n<p class=\"row\"> ┃  层  ┃  角色  ┃  作恶形态（流程感）  ┃  亮层时刻  ┃  对立统一（立场各自成立）  ┃ <\/p>\n<p class=\"row\"> ┃  一 · 动手的  ┃  马长贵  ┃  偷工减料、夜施换料、隐蔽工程不留影像  ┃  E1-E18  ┃  垫资抵押房产，汛期前必须回款——他也在跟汛期赛跑  ┃ <\/p>\n<p class=\"row\"> ┃  二 · 签字的  ┃  冯有德  ┃  先签后补稀释责任、调岗排异、拿防汛窗口期压质量  ┃  E19-E42  ┃  不贪，但怕担责——稀释是他自保的理性选择  ┃ <\/p>\n<p class=\"row\"> ┃  三 · 做流程的  ┃  桂守成（围标链项目部内面孔）  ┃  把验收做成流水线：退件程序墙、销项程序吃证据、资料一条龙、水情台账做手  ┃  E6 暗起 → E30 掌权 → E36 现形 → E42 实锤  ┃  从不违反任何一条程序——他的每一步都「合规」，这正是全剧要钉死的东西  ┃ <\/p>\n<p>三层递进的升级逻辑（回应 R1-W3 中段燃料）：从「驳你的数据」到「撕你的底稿」到「吃你的证据」到「调你的人」——反派每次升级都是对主角上一招的适应，无复读。<\/p>\n<h4>4.2 四件套节拍轮换表（反派作恶锚 C7，单元变量池）<\/h4>\n<p class=\"row\"> ┃  四件套  ┃  第一轮  ┃  第二轮  ┃  第三轮  ┃  第四轮  ┃ <\/p>\n<p class=\"row\"> ┃  先签后补稀释责任  ┃  E15 补签页  ┃  E27 诱签校核页  ┃  E31 销项附件夹带  ┃  E43 扩大化签名会  ┃ <\/p>\n<p class=\"row\"> ┃  隐蔽工程不留影像  ┃  E3 夜施换料  ┃  E14 权限墙  ┃  E29 附条件开挖  ┃  E42 调包日志  ┃ <\/p>\n<p class=\"row\"> ┃  防汛窗口期压质量  ┃  E19 合龙强推  ┃  E25-26 抽检赶场  ┃  E37 表彰会抢验收  ┃  E41 双钟同拨  ┃ <\/p>\n<p class=\"row\"> ┃  把提问题的人调岗边缘化  ┃  E2 搬桌预演  ┃  E20 夺章发配  ┃  E34 举报石沉大海  ┃  E44 停职收钥匙  ┃ <\/p>\n<h4>4.3 连坐清算顺序（E57-E59，可见可数）<\/h4>\n<p>清算顺序 = 签字链还原顺序（改造自复仇母型「清算顺序倒序」标志件，见五.1）：<\/p>\n<p>1. **马长贵（动手层）**：出险段落按联签自证 → 返工自费、押金抵赔、行业禁入；他的房已经抵了（代价可数）。<\/p>\n<p>2. **桂守成（流程层）**：先签后补页时间戳 × 闸房水情日志雨情时标对撞（物证：E23-E32 日志）+ 雷小雨存档副本 → 执业资格吊销、移送调查——「已老实」位【梗14】。<\/p>\n<p>3. **冯有德（签字层）**：联签单逐页拆解——「集体决定」被还原为一页页个人签名，每页对应他签掉的具体部位（他要的稀释被原地逆操作）；调离现职、配合调查。收尾台词对立统一不破功：「我以为把名字签在一起，就没人淹死了。」<\/p>\n<p>4. **围标链（分饼层）**：审计进场封资料（只拍封条动作，不展开司法戏，留白），涉案移交剧内上级联合调查。<\/p>\n<p>5. **秦江海自请连责**：对「没拦成的那一处」自请处分（尊严刻度：不揽功不诿责），核为其调岗期间无签权。<\/p>\n<p>清算物件对位（C9 四件全给）：拒签单（E58 逐页念）／水位线对照（E53 分屏 + E57 清单）／竣工永久性标牌（E59）／雨靴（E58 防水袋底单交档）。<\/p>\n<p>---<\/p>\n<h3>五、改造点清单（每个改造点回指梗卡新变体落点）<\/h3>\n<p class=\"row\"> ┃  #  ┃  改造点  ┃  母型原状  ┃  改造后  ┃  梗卡回指  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  清算执行者置换 + 清算顺序倒序  ┃  复仇母型：主角以能力/马甲逐层清算对手  ┃  自然规律代执行（洪水宣读他早就写好的判词，判词 = 病历本 11 处记录）；清算顺序按签字链还原倒序连坐  ┃  新变体「他没打赢任何人，是洪水替他赢了」；关系轴新「物理当打脸手，链上未做」；「拒签清单=清算名单，机制咬合」  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  金手指置换 + 带成本  ┃  神豪族：隐藏财富/身份当众碾压  ┃  权力型制度金手指（签字权/复审权/终身责任制条款），且每次使用带成本：拒签一次岗级掉一层（E1 拒签 → E2 搬桌 → E20 收章 → E44 停职）  ┃  梗卡风险 1「换皮陷阱」对策：爽点一律锚「拒签 × 洪峰验证」机制，禁财富皮  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  马甲掉马标志件改造  ┃  当众多层撕马甲  ┃  物件式单点揭示（一摞重抄拒签单，E58 仅此一层）  ┃  梗卡风险 2：马甲过饱和，仅许物件式单点揭示，禁多层当众撕  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  双线暗线性质改造  ┃  商战/悬疑型暗线（人的阴谋间隔汇聚）  ┃  自然倒计时暗线（水位单调爬升，编辫式每集在场），交叉引爆 = 洪峰  ┃  C7 汛期倒计时戏剧钟；b024-na 同构（灾难可预测化，从突发事故置换为可预测 tick）  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  激励事件前置为主动出击  ┃  救猫咪式催化剂约在 10-12% 处由外部事件触发  ┃  E1 第一拍即拒签，且拒签是主动出击（部位+缺陷+要求），快反击型开局  ┃  C6 E1 布点；R1-W1「拒签写成出击而非忍耐」  ┃ <\/p>\n<p>---<\/p>\n<h3>六、不确定因素注入提案（≥2，含 R1 备选提案 A/B/C 处置）<\/h3>\n<p>&gt; R1 门已附条件过，意见书第八节三提案为「可选增强、非强制」。本节按 structure-design 纪律给出注入评估与融入建议；标注【需 R2 复核】者不得免审写入正稿。<\/p>\n<h4>提案一（必融）｜「九八的债 · 那张单」——R1 提案 A 升级版（人物前史层）<\/h4>\n<ul>\n<li>**注入节点**：E1 物件层（两支笔之一 = 师父遗物，零闪回成本）→ E30 策略转向台词的重量 → E42 围标链现形时点破「三十年前就是这套手法」→ E50 责任状总爆发 → E58 自请连责的根。<\/li>\n<li>**内容**：三十年前九八抗洪（与基线「三十年前同一条河」对齐），师父拦一处偷工堤段未果——验收单被「先签后补」；26 岁的秦江海是资料员，**亲手把补签页送进了流程**（他的私罪）；当夜师父上抢险队没回来（只拍雨夜背影与事后遗物那支笔，零灾情画面）。基线的「师父没拦住」升级为「师父没拦住，而他递了那张单」——拒签 = 三十年赎罪，每一张拒签单都是重写当年那张单。<\/li>\n<li>**改变哪些后续节点**：E1 拒签动机从职业操守升为命债；E50「从拒到签」的弧光翻转（不是妥协，是把名字押上去——他在做当年没人敢做的事：把责任签在自己名下）；E58「不揽功」有根。<\/li>\n<li>**增益**：R1 目标读者「58 岁逆袭增量不足」的犹豫翻盘（他赌的不是前程是命债，58 岁输得起前程输不起再来一次）；补全冲突四层次的私密层（他对抗的也是当年的自己）；反转铺垫获得前史纵深。<\/li>\n<li>**风险**：闪回拖节奏（限 ≤3 次、每次 ≤3 拍、只置卡点前夜）；九八记忆合规（只取抢险与牺牲的英雄记忆，虚构人物往事，不指认真实工程责任）；可选联动件——贺工当年是那座坝复核盖章人之一（增益「我看看」= 迟到三十年的终审；风险：小圈子巧合感，用一句「全流域老熟人低头不见抬头见」自洽，方案阶段可裁）。<\/li>\n<\/ul>\n<h4>提案二（融入，轻量）｜「她的名字进了签字链」——R1 提案 B 的不烧盟友变体（身份层）<\/h4>\n<ul>\n<li>**注入节点**：E7 谈话伏 → E27 收口（发现名字已在联签校核页）→ E31 加深 → E42 存档副本正名 → E58 作证。<\/li>\n<li>**与 R1-B 原案差异及理由**：不把雷小雨写成被收买——「信数据不信酒桌」的人设使收买不可信（对立统一失效），且烧掉唯一盟友会毁 R1 目标读者认可的尊严刻度（「他保住了徒弟和堤」）。改为诱签陷阱：围标链的「资料一条龙」把她的校核签名夹进先签后补页——最亲近之人被拖下水（观众背不出来的节点保留），但她的选择是正面弧光。<\/li>\n<li>**增益**：R1-B 的「背叛张力」效率全保留（不加角色不加场景）；直接喂 R1 条件 2 留痕链（她的存档副本 = E42 救证物证）；E46 微反击的动力源。<\/li>\n<li>**风险**【需 R2 复核】：变体未过四视角（原案 B 过的是「一般读者」flip）；她戏份上抬挤主视角——控制线：单集 ≤2 拍、每场必须服务该集唯一主认知更新。<\/li>\n<\/ul>\n<h4>提案三（必融）｜「复审组先查他」——R1 提案 C 原案（事件层）<\/h4>\n<ul>\n<li>**注入节点**：E8 反咬信立案 → E10 自证+验证双爽 → E14 权限被收的因 → E20 调岗闸房后的结构胶水（被收权限的人被发配到唯一还能合法留痕水情的岗位）。<\/li>\n<li>**增益**：首卡强度保险（甲方对标 b016 双爽有结构保障）；受冤高于受辱（尊严刻度）；提前堵死「他为什么不直接举报」的观众问（权限被收 → 举报无据 → 只能先留痕）。<\/li>\n<li>**风险**：立案程序一笔带过（零解释成本：只拍「收缴数据权限的通知单」动作，不展开流程）。<\/li>\n<\/ul>\n<h4>提案四（必融，新增）｜「空库令」调度钟（世界观规则层）<\/h4>\n<ul>\n<li>**注入节点**：E22 闸房钟楼就位 → E32 第一道调度令 → E41 双钟同拨 → E50 危机选择的总开关。<\/li>\n<li>**内容**：病险水库主汛期空库运行、泄洪调度（C 级真实制度，热点素材第三节 3）剧内化为全剧官方倒计时：每一道调度令 = tick；他调岗闸房 = 被发配到钟楼；E50 他用 30 集攒下的水情日志证明台账参数被围标链做过手——调度令的依据本身是假的。<\/li>\n<li>**增益**：戏剧钟可视化 + 「发配」变「置顶」的反讽引擎；给 E50 危机选择提供制度级两难（按令开闸是「合规」，违令迟开他终身担责——主题压成一锤）。<\/li>\n<li>**风险**【需 R2 复核】：水利调度专业性——纪律：全部术语画面化（开度表/刻度/令单），禁台词讲解；调度写剧内通称，不对应任何真实调度机构与真实调度事件。<\/li>\n<\/ul>\n<p>**R1-B 原案（徒弟泄密者）处置**：不取，理由见提案二；记录在案，供 R2 对照复核。<\/p>\n<p>---<\/p>\n<h3>七、节奏预排与密度自查<\/h3>\n<h4>7.1 首卡 / 中点 / 决战位置（kb/market/structure 对表）<\/h4>\n<ul>\n<li>首卡：E10 末（窗 8-12 ✓，卡点事件 = 首次当众验证 ✓）；免费段前置钩 E9 末死局顶格。<\/li>\n<li>中点：E30 开膛销项——模型改写（体系内挡 → 写下来等水对账），非提高音量（reversal KB「中段只提高音量」病规避）。<\/li>\n<li>决战：E49-56（55+ 窗 ✓），E50 危机选择为全片最大价值变化。<\/li>\n<\/ul>\n<h4>7.2 hot 档密度供给引擎（每集爽点 ≥3 的结构性来源）<\/h4>\n<p>每集三槽位，由骨架保证供给、由 S3 分拍填装：<\/p>\n<p>1. **台词槽**：口癖或拒签三要素金句 ×1（出击式拒签自带台词引擎）；<\/p>\n<p>2. **对撞槽**：四件套施压位 → 书面/物证回击 ×1（受辱 → 回击 ≤2 拍红线由「当拍回击」模板保证，E3 为范式）；<\/p>\n<p>3. **碎片槽**：身份碎片 / 物证特写 / 水位 tick ×1（两支笔、奖章、雨靴、防水袋、刻度、开度表轮换供料）。<\/p>\n<p>历史参照（sess_aa829e9e：监管版 63 拍 vs 基线 40 拍）——本框架以槽位引擎把密度做进结构，而非靠后期加码。<\/p>\n<h4>7.3 沙漠段预扫（AE-DESERT / AE-CUSHION）<\/h4>\n<p class=\"row\"> ┃  风险段  ┃  风险  ┃  垫场配置（两大卡点间 ≥2 中型爽点）  ┃ <\/p>\n<p class=\"row\"> ┃  E13-19（首卡后长循环）  ┃  单元同质疲劳  ┃  E16 标高复核打脸 + E18 听堤名场面/老周口证；且 E11 销项反噬压住首卡后狂欢（防爽后真空）  ┃ <\/p>\n<p class=\"row\"> ┃  E33-40（取证文戏密段）  ┃  全剧最高沙漠风险  ┃  E33 老周交底物证小赢 + E35 大卡点（贺工亮牌）+ E38 表彰会摁停 + E40 金句——卡点间垫场 ≥2 ✓  ┃ <\/p>\n<p class=\"row\"> ┃  E44-48（压制段）  ┃  螺旋下降丧到底  ┃  E46 微反击（存档副本 + 复核卷藏火种）——「微小反击」纪律 ✓；低谷段同步推进围标链信息与证据总装（低谷不空转）  ┃ <\/p>\n<p>「看得见的水」预扫（R1 读者条件：每三集一次实体水）：E1 雷/水面、E3 夜雨、E5 渗水、E9-10 雨/管涌、E12 分屏、E14 水样、E16 堤前水面、E18 听堤、E20 雨中收章、E22 闸下出流、E23-24 台账雨情/小洪峰、E25 水样、E29 坑底渗水、E32 令/闸、E35 暴雨、E37 雨带、E38 场外暴雨、E39 出流声、E41-E60 全水段——任意无水缺口 ≤2 集 ✓。<\/p>\n<h4>7.4 口癖变奏表（C8：每集 ≥1 次，3 集内变奏 3 次）<\/h4>\n<p class=\"row\"> ┃  集  ┃  台词  ┃  性质  ┃ <\/p>\n<p class=\"row\"> ┃  E1  ┃  「这单我不签。」／「签了，我把三十年押给你；不签，下游几万人押给他们？」  ┃  本句 + 变奏①  ┃ <\/p>\n<p class=\"row\"> ┃  E2  ┃  「这一单，我还不签。」＋「水不要你觉得。」  ┃  变奏②  ┃ <\/p>\n<p class=\"row\"> ┃  E3  ┃  「撕吧。这单我不签——每一页我都抄了三份。」  ┃  变奏③（当拍回击）  ┃ <\/p>\n<p class=\"row\"> ┃  E48  ┃  「等水来，这就是判词。」  ┃  变奏④（判词语态）  ┃ <\/p>\n<p class=\"row\"> ┃  E50  ┃  （无台词，笔帽敲三下落笔）  ┃  动作变奏（写动作不写喊）  ┃ <\/p>\n<p class=\"row\"> ┃  E60  ┃  「这单我签。」  ┃  全剧唯一反打，人设兑现即爽点兑现（基线 R5 判定沿用）  ┃ <\/p>\n<h4>7.5 十六条热梗全量挂接表（C8 全量落实，修基线缺口 B6b）<\/h4>\n<p class=\"row\"> ┃  #  ┃  梗  ┃  挂接节点  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  豆腐渣工程  ┃  E30 销项时群演低语；E57 问责会台词  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  基建狂魔  ┃  E40「真正的基建狂魔，是敢对堤说不的人」  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  到 XX 看海  ┃  E47「今年不用去临江看海了」反讽位  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  扫地僧  ┃  E1 奖章特写伏 → E10 验证后群演低语兑现  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  你大爷还是你大爷  ┃  E16 贺工算塌「合格」结论  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  00 后整顿职场  ┃  E20「老师傅也被整顿了」反讽切片位，终局回收  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  我不要你觉得  ┃  E2「我不要你觉得」×「水不要你觉得」  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  格局打开  ┃  E7「堤垮了格局更大」  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  实锤/求锤得锤  ┃  E42 存档副本救证「求锤得锤」  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  塌房  ┃  E54 切片双关「这次塌的是真的」（画面为出险抢护，措辞纪律：不涉人员）  ┃ <\/p>\n<p class=\"row\"> ┃  11  ┃  临时工  ┃  E57 甩锅「施工队是临时的」被终身责任制钉死  ┃ <\/p>\n<p class=\"row\"> ┃  12  ┃  回旋镖  ┃  E54/E57 出险清单 = 签收清单  ┃ <\/p>\n<p class=\"row\"> ┃  13  ┃  偷感（很重）  ┃  E3 夜查手电钉车名场面  ┃ <\/p>\n<p class=\"row\"> ┃  14  ┃  已老实，求放过  ┃  E58 终身责任制条款亮出，桂当场「已老实」  ┃ <\/p>\n<p class=\"row\"> ┃  15  ┃  听我说谢谢你  ┃  E38 表彰会歌舞被「堤还没验」摁停 ；三景/角色上限对账通过（3.4）<\/li>\n<li>[x] 伤亡红线三则框架级落实 + 闪回附加纪律（九节）<\/li>\n<li>[x] 与基线同源：5 人人设、拒签×洪峰变体、伤亡红线三则未动；5 处修订全部显式列表（表 2.0-A）且可追溯出处<\/li>\n<li>[x] 自造专名盘点：清川河、临江圩（2 个，全为地名类，余量 1）；全稿零真实机构名、零真实责任人<\/li>\n<li>[x] 未读取 projects/_archive/ 下任何内容；无任何 git 操作<\/li>\n<li>[x] 本件为 S2 决策件，下一步移交 S3 选题方案步<\/li>\n<\/ul>\n<p>*依据：skills/structure-design（选型三步/注入提案/节奏对表/输出契约）；kb/structure/catalog §一-四；kb/market/structure（60 集节拍位）；kb/aesthetic/pacing-density（hot 档密度/卡点/沙漠）/reversal（判型与铺垫）/emotion-curve（六型与失衡）/conflict-escalation（因果链八节点/代价梯/对立统一）；选题分析报告·约束移交单 C1-C10；多视角意见书-R1（附条件过，条件 1-3 并入）；梗卡@2026-09-16；热点素材@2026-09-16；选题方案-爽版-基线@2026-09-16。*<\/p><\/section>\n<section><h1>选题方案.md<\/h1><h2>选题方案：《守堤人》（水利题材 · 拒签老总工 · 实事男频爽剧）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>剖面：scene-screenwriter（选题编剧）· S3 全量爽版正稿（route=hot，监管位全开：总编强度 × 监理合规）<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>输入件：skills/topic-proposal.md（五节结构，顺序固定）；故事框架案.md（**结构宪法**：五宏节点 / 汛期三圈钟 / 三层反派 / 两提案复核位）；选题分析报告.md 第五节「创作约束移交单」C1-C10（硬约束，逐条遵守不讨论）；选题方案-爽版-基线.md（B 组对照件，同源骨架）；梗卡.md；热点素材.md<\/li>\n<li>同源声明：核心 5 人人设、「拒签蓄力 × 洪峰当众验证」新变体、伤亡红线三则、五宏节点集域（E1-12 / E20-24 / E33-48 / E49-56 / E57-60）、两提案复核位，全部与结构宪法同源；基线的 5 处显式修订（表 2.0-A）在本文按修订后状态执行<\/li>\n<li>禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、选题<\/h3>\n<p>**选题名**：《守堤人》。封面标题（口语化、有冲突感）：**「全项目部都在签字，只有他不签」**；备用封面标题：「这单我不签」。<\/p>\n<p>**一句话定位**：大堤除险加固验收在即，全项目部只有 58 岁的老总工一个人不肯签字；后来，洪水替他验了一张没人敢验的收据。<\/p>\n<p>**时代情绪锚**（当下社会情绪 + 30 天内证据）：<\/p>\n<p>&gt; **较真者的憋屈 × 汛期防洪焦虑**——认真的人在系统性糊弄面前孤军奋战，而堤的那头是千家万户的身家性命。<\/p>\n<ul>\n<li>底层情绪（普适长期）：「会干的不如会混的」——每个观众身边都有一个「不肯签字的老工程师」和一个「签得飞快的人」。<\/li>\n<li>顶层焦虑（实时）：汛期未过，「堤里有没有猫腻」的愤怒是进行时。证据：2026 全国「质量月」25 部门联合部署、严查偷工减料弄虚作假〔A 级，2026-09-04〕；台风「沙德尔」登陆、最高级别洪水应急响应启动〔A 级，2026-09-03〕；8 月中旬河南某县堤防决口与封堵的全民围观长尾〔B 级，2026-08-13〕。<\/li>\n<li>合规注：真实灾害只作情绪举证，剧内事件独立成案（虚构的临江圩除险加固工程），零对应、零影射、零伤亡消费；剧内台风一律无名（只称「台风」「上游雨带」）。<\/li>\n<\/ul>\n<p>**新意装置**：**拒签单 × 洪峰当众验证**——「他没打赢任何人，是洪水替他赢了」。装置改变的具体写法：<\/p>\n<ul>\n<li>清算执行者由主角的嘴置换为水位：他只负责留痕，宣判交给洪水。改变 E10 的写法——验收会死局（他被反咬立案、被「请」出会议室）不由他自辩，由雨后第一轮涨水在管涌现场替他对数；改变 E53 的写法——终局反转不是反转人，是同一水位把同一条堤分成两半（一堤两制）；改变 E58 的写法——清算名单不用查，就是他自己重抄的那一摞拒签单，一页对一段，逐页念。<\/li>\n<li>金手指 = 权力型制度身份（签字权 / 复审权 / 终身责任制条款），每次使用带成本：拒签一次，岗级掉一层。爽点一律锚「拒签 × 洪峰验证」机制，零财富皮。<\/li>\n<\/ul>\n<p>**核心爽点承诺**（一句话）：看一个被全项目部孤立的老头靠一张一张「不签」活到最后，看洪水把他签过的和没签的堤段当场分成两半——**他写下的每一页，都会回来收账。**<\/p>\n<p>**开篇 3 秒设计**（第一拍具体画面与台词）：<\/p>\n<p>验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，签得最快的是监理负责人；笔传到秦江海手里——停。特写：笔帽在图纸桩号上敲三下。他念桩号不看人：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」全场回头，笔悬在半空。<\/p>\n<ul>\n<li>反常（唯一不签的人）+ 冲突（当众拦验收）占全，零铺垫、零背景交代。<\/li>\n<li>生理测试：没看过背景的人听完这拍不问「为什么」，只问「然后呢」——过。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、人设<\/h3>\n<p>核心 5 人 + 扩展 2 人（有名有姓合计 7 ≤ 10；雷小雨与秦江海为纯师徒 / 同事线，**零感情线，显式声明**）。外形全部写到「AI 出图能画」的记忆点精度。<\/p>\n<h4>2.1 核心 5 人<\/h4>\n<p class=\"row\"> ┃  角色  ┃  姓名 / 年龄 / 身份 / 外形记忆点  ┃  反差立柱（外在 vs 内在拧着写）  ┃  核心动机  ┃  口癖 / 标志小动作  ┃ <\/p>\n<p class=\"row\"> ┃  男主  ┃  **秦江海 · 58 · 临江圩除险加固项目部总工程师**。藏蓝旧工装洗得发白；左胸口袋别两支笔（一支写字，一支只画水位线——师父遗物）；胶底鞋；后腰钥匙串挂一把老钢卷尺；左胸口袋上方一枚褪色劳模奖章（E1 特写，提前半拍亮身份）  ┃  开会最没存在感，堤上声音最大；被全场孤立却像视察自家菜地  ┃  三十年前同一条河上，师父没拦住的那座坝——验收单被「先签后补」，26 岁的资料员秦江海亲手把补签页送进了流程。他的私罪。每一张拒签单都是重写当年那张单  ┃  「这单我不签。」／说话前笔帽敲图纸三下；巡堤时耳朵贴堤听水  ┃ <\/p>\n<p class=\"row\"> ┃  反派一  ┃  **马长贵 · 45 · 施工方负责人（剧内自造主体）**。皮鞋上工地，手机大音量外放，办公桌腿垫着酒箱  ┃  对上点头哈腰递烟，对工人横眉瞪眼  ┃  垫资垫到抵押了房子，必须赶在汛期前验收回款——他也在跟汛期赛跑（有理由的错误选择）  ┃  「规矩是死的，人是活的。」／说话先递烟  ┃ <\/p>\n<p class=\"row\"> ┃  反派二  ┃  **冯有德 · 50 · 项目部上级（赶工期要签字的）**。衬衫扣到最顶一颗，文件夹永远抱在胸前当盾牌  ┃  不贪一分钱，但怕担一分责；嗓门越轻的事他越躲  ┃  「集体的决定」——把个人责任稀释成集体责任，稀释完就安全了  ┃  「再研究研究。」／签字前先看左右  ┃ <\/p>\n<p class=\"row\"> ┃  徒弟  ┃  **雷小雨 · 26 · 测绘员**。反光背心；黄色安全帽上手绘一圈警戒红线胶带，帽带永远不扣；全站仪当拐杖拄  ┃  全项目部最年轻的人，却是最「多事」的人——唯一公开站在老头一边  ┃  她信数据不信酒桌；签了的字要背一辈子，她不想背  ┃  「图纸上没有这个数。」／拿全站仪拦门、点地  ┃ <\/p>\n<p class=\"row\"> ┃  复审方  ┃  **贺工 · 60 · 复核组老专家**。旧夹克，布鞋，手里始终捏着一个掉漆保温杯  ┃  退居二线说话没人当回事，一出手就是终审  ┃  退休前最后一趟，想把当年的糊涂账算清  ┃  「我看看。」／保温杯拧开又拧上  ┃ <\/p>\n<h4>2.2 扩展 2 人（非核心，服务反派第三层与证人线）<\/h4>\n<p class=\"row\"> ┃  角色  ┃  设定  ┃  功能  ┃ <\/p>\n<p class=\"row\"> ┃  桂守成 · 44 · 监理负责人  ┃  头发梳得一丝不乱，笔永远别在胸袋，从不违反任何一条程序  ┃  **反派第三层「做流程的」在项目部内的面孔**：先签后补的发源地、退件流程墙、销项程序的启动者；E1 开场签到笔传得最快的人。口癖「按程序办。」  ┃ <\/p>\n<p class=\"row\"> ┃  老周 · 55 · 马长贵班组料工  ┃  满手老茧，见谁都递烟，帽檐压得低  ┃  夜施内情证人：口证（E17-18）→ 书面交底被辞（E33）→ 暗续日志（E46）→ 问责会作证（E58）。口癖「我就路过。」  ┃ <\/p>\n<p>师父（三十年前）不登场不具名，仅存于遗物（那支只画水位线的笔）与 ≤3 次限拍闪回（每次 ≤3 拍，只置大卡点前夜，只拍雨夜背影与遗物，零灾情画面）。<\/p>\n<p>---<\/p>\n<h3>三、冲突设计<\/h3>\n<p>**韩剧强度基准自检**（对标近 3 年复仇 / 豪门剧的情绪浓度）：<\/p>\n<ul>\n<li>**情绪直接饱满**：不写克制隐忍。三槽引擎保证每集 ≥3 个外化爆点——台词槽（拒签三要素金句）、对撞槽（四件套施压 → 物证回击）、碎片槽（身份碎片 / 物证特写 / 水位 tick）。长剧把「较真者被碾碎」拍三集才给一次反击，本剧受辱与第一击回敬同场完成。<\/li>\n<li>**反杀当场化**：羞辱与回敬时差 ≤2 拍（E3 为范式：撕稿 →「撕吧，每一页我都抄了三份」= 时差 1 拍）；大胜留给集尾卡点。<\/li>\n<li>**金手指 = 权力型身份**：兑现画面是可拍的权力动作——水位线对照、联签单作废、责任状落笔、执业资格吊销、刻名碑，不是「证明自己是对的」。<\/li>\n<li>**反派连坐**：恶人是一张签字链，拆解有顺序有仪式（返工自费 → 吊证移送 → 逐页拆签名 → 审计封条）。<\/li>\n<\/ul>\n<p>**主线冲突（一句话）**：不肯签字的老总工要在洪峰到来之前，拦住一整条想把问题堤段「合法签收」的签字链。<\/p>\n<p>**单元冲突模板（可无限复制）**：「**一张验收单 = 一次攻防**」——反派用四件套之一施压（先签后补稀释责任 / 隐蔽工程不留影像 / 拿防汛窗口期压质量 / 把提问题的人调岗边缘化）→ 秦江海用物证或制度条文回击（芯样、渗压记录、水位线、责任条款）→ 集尾卡点收。可复制原因：分部工程天然逐项验收，一张单 = 一集节拍；变量池 = 反派四件套 × 验证物 5 种（钻芯样 / 渗压读数 / 留样标记 / 水情日志 / 水位刻度），4×5=20 个变量，60 集不重样；全部攻防装进三景（验收会议室 / 堤段工地含汛期堤坡与堤头闸房 / 项目部办公区含资料室仓库角），换景 = 换集。<\/p>\n<p>**反派梯度（三层，逐级升格——「把偷工减料做成流程的人」）**：<\/p>\n<p class=\"row\"> ┃  层  ┃  角色  ┃  作恶形态（流程感）  ┃  亮层时刻  ┃  对立统一（立场各自成立）  ┃ <\/p>\n<p class=\"row\"> ┃  一 · 动手的  ┃  马长贵  ┃  偷工减料、夜施换料、隐蔽工程不留影像  ┃  E1-E18  ┃  房子抵了，汛期前必须回款——他也在跟汛期赛跑  ┃ <\/p>\n<p class=\"row\"> ┃  二 · 签字的  ┃  冯有德  ┃  先签后补稀释责任、调岗排异、拿防汛窗口期压质量  ┃  E19-E42  ┃  不贪，但怕担责——稀释是他自保的理性选择  ┃ <\/p>\n<p class=\"row\"> ┃  三 · 做流程的  ┃  桂守成（围标链项目部内面孔）  ┃  把验收做成流水线：退件程序墙、销项程序吃证据、资料一条龙、连水情台账都做过手  ┃  E6 暗起 → E30 掌权 → E36 现形 → E42 实锤  ┃  从不违反任何一条程序——他的每一步都「合规」，这正是全剧要钉死的东西  ┃ <\/p>\n<p>升级逻辑：从「驳你的数据」到「撕你的底稿」到「吃你的证据」到「调你的人」——反派每次升级都是对主角上一招的**学习适应**，无复读；全剧零真实机构名、零真实责任人（围标链剧内通称「一条龙」）。<\/p>\n<p>**冲突密度表**（每 6-10 集一个单元闭环 × 爆点分布 × 沙漠预扫 × 垫场）：<\/p>\n<p class=\"row\"> ┃  单元闭环  ┃  集域  ┃  单元冲突  ┃  单元内中型爽点（垫场）  ┃  大卡点  ┃ <\/p>\n<p class=\"row\"> ┃  拒签连环  ┃  E1-8  ┃  全员签他独拒签 → 孤立、撕稿、反咬立案  ┃  E3 小验证验料 / E5 渗压留痕反击  ┃  —  ┃ <\/p>\n<p class=\"row\"> ┃  首卡验证  ┃  E9-12  ┃  听证死局 → 管涌现场当众对数  ┃  E10 自证+验证双爽 / E12 一堤两制点题  ┃  **E10 首卡**  ┃ <\/p>\n<p class=\"row\"> ┃  四件套轮换  ┃  E13-19  ┃  一张验收单一次攻防（模板开轮）  ┃  E16 标高对赌打脸 / E18 听堤教学  ┃  —  ┃ <\/p>\n<p class=\"row\"> ┃  调岗闸房  ┃  E20-24  ┃  夺章发配 → 被发配到全剧钟楼  ┃  E24 小洪峰预判兑现  ┃  **E20**  ┃ <\/p>\n<p class=\"row\"> ┃  抽检开膛  ┃  E25-32  ┃  换样现行、诱签收口、开膛见假被销项  ┃  E27 换样抓现行 / E30 中点改写  ┃  **E30（中点）**  ┃ <\/p>\n<p class=\"row\"> ┃  取证总装  ┃  E33-40  ┃  举报石沉大海、笔迹比对、病历本并册  ┃  E33 老周交底 / E38 表彰会摁停  ┃  **E35**  ┃ <\/p>\n<p class=\"row\"> ┃  围标蓄满  ┃  E41-48  ┃  调包日志、签名会、停职收钥匙  ┃  E42 存档副本救证 / E46 微反击  ┃  **E43**  ┃ <\/p>\n<p class=\"row\"> ┃  洪峰验证  ┃  E49-56  ┃  危机选择、病历本变部署图、一堤两制终验  ┃  E51-52 抢险兑现 / E53 主反转  ┃  **E50（决战）**  ┃ <\/p>\n<p class=\"row\"> ┃  问责清算  ┃  E57-60  ┃  连坐清算、刻名碑、「这单我签」  ┃  E58 逐页念 / E59 刻名  ┃  **E58（终局）**  ┃ <\/p>\n<ul>\n<li>沙漠段检查：无连续 5 集无爆点段位；两大卡点之间中型爽点 ≥2（E33-40 文戏密段以 E33/E38 双垫场+大卡点 E35 压住；E44-48 低谷段以 E46 微反击+证据总装防丧）。<\/li>\n<li>「看得见的水」预扫（每三集一次实体水，任意缺口 ≤2 集）：E1 雷/水面、E3 夜雨、E5 渗水、E9-10 雨/管涌、E12 分屏、E14 水样、E16 堤前水面、E18 听堤、E20 雨中收章、E22 闸下出流、E23-24 台账雨情/小洪峰、E25 水样、E29 坑底渗水、E32 调度令/闸、E35 暴雨、E37 雨带、E38 场外暴雨、E39 出流声、E41-E60 全水段。✓<\/li>\n<\/ul>\n<p>**付费卡点事件表**（首卡第 8-12 集 + 后续每 15-20 集大卡点，全部写具体事件）：<\/p>\n<p class=\"row\"> ┃  站位  ┃  集  ┃  具体事件（谁在哪对谁做了什么）  ┃  类型  ┃ <\/p>\n<p class=\"row\"> ┃  **首卡（付费墙）**  ┃  **E10 末**  ┃  管涌现场：他被反咬「泄露」的数据与实测分毫不差，反咬信当众反转；集末马长贵冷笑「六处险工段，你拦得住这一处吗」——水位刻度爬升特写  ┃  事件型  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 1  ┃  E20  ┃  会议室宣布收章调岗，雨靴挂上仓库钥匙串，「老师傅也被整顿了」  ┃  情绪型  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 2（中点）  ┃  E30  ┃  开膛见假齿墙，桂守成当场启动应急处置：回填、重新取样、资料补齐销项——铁证被流程吃掉  ┃  信息+情绪型  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 3  ┃  E35  ┃  举报被驳回，驳回依据正是 E30 销项文书；贺工保温杯拧开：「我看看。」  ┃  信息型  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 4  ┃  E43  ┃  「集体决定」扩大化签名会，冯有德每一页都签——把「集体」钉成「个人合集」  ┃  信息型  ┃ <\/p>\n<p class=\"row\"> ┃  决战  ┃  E50  ┃  调度令与台账矛盾爆发，他以终身责任签下迟开闸 4 小时错峰责任状——说了一辈子「这单我不签」，这一次一个字没说  ┃  情绪型顶点  ┃ <\/p>\n<p class=\"row\"> ┃  终局  ┃  E58  ┃  问责会：一摞重抄拒签单，一页对一段逐页念——拒签清单 = 清算名单  ┃  兑现型  ┃ <\/p>\n<p>**连坐清算顺序**（E57-E59，可见可数，按签字链还原倒序）：<\/p>\n<p>1. **马长贵（动手层）**：出险段落按联签自证 → 返工自费、押金抵赔、行业禁入——他的房已经抵了，代价可数。<\/p>\n<p>2. **桂守成（流程层）**：先签后补页时间戳 × 闸房水情日志雨情时标对撞 + 雷小雨存档副本 → 执业资格吊销、移送调查；终身责任制条款亮出，当场「已老实」〔梗14〕。<\/p>\n<p>3. **冯有德（签字层）**：联签单逐页拆解——「集体决定」被还原为一页页个人签名，每页对应他签掉的具体部位；收尾台词对立统一不破功：「我以为把名字签在一起，就没人淹死了。」<\/p>\n<p>4. **围标链（分饼层）**：审计进场封资料——只拍封条动作，留白不展开司法戏。<\/p>\n<p>5. **秦江海自请连责**：对「没拦成的那一处」自请处分（不揽功不诿责），核为其调岗期间无签权——尊严刻度。<\/p>\n<p>清算物件对位：拒签单（E58 逐页念）/ 水位线对照（E53 分屏 + E57 清单）/ 竣工永久性标牌刻名（E59）/ 雨靴（E58 防水袋底单交档）——4 件全给，≥2 件标准。<\/p>\n<p>---<\/p>\n<h3>四、大纲（三段式，名场面具体到画面）<\/h3>\n<h4>前期（E1-30）：拒签立状 → 首卡验证 → 调岗闸房 → 开膛销项<\/h4>\n<ul>\n<li>**E1-8 拒签连环**：E1 开标会全员签字他独拒签（出击三要素：部位+缺陷+要求），集尾贴堤听水 + 分界桩两侧同框（一堤两制露脸）+ 雷声第一响（全剧钟上弦）。E2 办公桌被搬进档案室，「我不要你觉得」×「水不要你觉得」。E3 夜查手电钉车，「这方混凝土，保熟吗？」当场验料小赢；次日会冯有德当众撕他私留的检测底稿（存档联流程上撕不掉·伏）——他当拍回击「每一页我都抄了三份」，集尾雨中把碎纸捡进雨靴。E8 复审组进场，第一份立案的是反咬信——受辱升级为受冤，资料权限被收；贺工保温杯拧开又拧上（背景板首现）。<\/li>\n<li>**E9-12 首卡**：E9 听证式验收会把他「请」出会议室，隔门一句「数据是真的，水会来对」。E10 雨后第一轮涨水，马长贵堤段出管涌——现场对质，反咬信当众反转，自证+验证双爽；集末付费墙。E11 复工表彰，马长贵领「抢工期先进」（赢一场小的、输一局更大的）。E12 雨夜复核走堤，分界桩两侧浑水点密度差第一次被镜头明确分屏，贺工蹲下摸桩号：「我看看。」<\/li>\n<li>**E13-19 单元攻防**：四件套第一轮轮换；「先签后补」补签页摆到他面前（E15）被出击式拒签；E16 贺工当场算塌年轻技术员的「合格」结论；E18 耳朵贴堤听水教学带徒，老周口述夜施内情不敢落名。<\/li>\n<li>**E20-24 调岗闸房**：E20 「例行归档」调走拒签存档联、当众收章调岗（两级贬法第一步），雨靴挂上仓库钥匙串。E21 三天仓库后转发配堤头泄洪闸房——**对抗力量错误适应的起点：他们把发配地选成了全剧钟楼**。E23 他发现调度台账的库容参数对不上雨情（台账按「验收合格」的老资料编——围标链连水情都做过手），开始私下记《闸房水情日志》。E24 小洪峰预判：他提前 48 小时书面建议被弃，洪水如期，值班员按他留的备选方案度过——「水听他的」第一次预演。<\/li>\n<li>**E25-30 抽检开膛**：E27 换样被抓现行（雷小雨留样标记），同集她发现自己名字已被夹进某分部联签校核页——**诱签陷阱收口【提案二·需 R2 复核位】**。E30 中点：附条件开挖只挖一处，坑底现出假齿墙——全场以为开膛=他赢，桂守成当场启动应急处置：回填、重新取样、资料补齐销项，铁证被流程吃掉。**故事模型自此改写（不是提高音量）**：他对贺工说——「挡不住了。往后我只做一件事——把每一处都写下来，等水来对账。」<\/li>\n<\/ul>\n<p>**名场面 A（E1 贴堤听水）**：谁=秦江海；在哪=验收会散场后的深夜堤坡（雨后）；对谁=对堤、对观众；做了什么=摘下安全帽，把耳朵贴在草皮上听水声，手按在桩号分界桩上；画面记忆点=58 岁老头侧脸贴地的剪影，身后一条黑兽般伏在夜色里的长堤，第一声雷在天边炸开。<\/p>\n<p>**名场面 B（E3 手电钉车·保熟吗）**：谁=秦江海；在哪=深夜堤坡卸料点；对谁=换料工头与熄了灯的卡车；做了什么=一束手电光钉住车头，蹲下抓一把新料捻开举到灯下；画面记忆点=光柱里悬浮的料粉 + 「这方混凝土，保熟吗？」。<\/p>\n<p>**名场面 C（E10 管涌对质）**：谁=秦江海 对 全场验收人员；在哪=雨后马长贵堤段管涌口；做了什么=把反咬信里「泄露」的渗压数据逐项对上现场实测；画面记忆点=管涌口翻浑水顶起碎石，两列数字在雨布上并排特写，念一个数，人群退半步。<\/p>\n<h4>中期（E31-48）：取证总装 → 围标现形 → 蓄满待洪<\/h4>\n<ul>\n<li>**E31-40 取证总装**：雷小雨的校核页再被夹进销项附件（她被越捆越深）；E32 第一道泄洪调度令下达（空库迎峰【提案四·需 R2 复核位】），他读令发现预泄库容与台账矛盾；E33 老周书面交底夜施内情，当天被辞——证人代价；E34 实名举报换来「程序合规」受理回执（石沉大海开始）；E35 举报被驳回，依据正是 E30 销项文书，贺工把驳回卷宗留下；E36 退件批注笔迹与反咬信比对同源——桂守成浮出；E38 表彰会歌舞被雷小雨一句「堤还没验」摁停；E39 闸房清点：重抄底单、双份照片、渗压记录并册——**「堤段病历本」11 处成形**（桩号—缺陷—日期—要求一一对应）。<\/li>\n<li>**E41-48 围标蓄满**：E41 台风生成、路径命中流域上游——抢工期与抢验收双钟同拨；E42 资料站调走闸房日志未遂，雷小雨的存档副本救证，「求锤得锤」，调包笔迹落到桂守成；E43 冯有德被推到前台开「集体决定」扩大化签名会（E58 逐页拆解在此上膛）；E44-45 停职审查、收闸房钥匙——钟楼被收走，他交出钥匙串，只留下雨靴；E46 雷小雨与老周暗续水情日志，贺工把病历本副本正式登记进复核卷（制度容器藏火种）；E48 复职令未下，他被「责令离堤」，把病历本誊清三份各归其位（贺工复核卷 / 闸房夹层 / 随身）：「等水来，这就是判词。」台风夜第一声雨——压抑蓄满。<\/li>\n<\/ul>\n<p>**名场面 D（E30 开膛销项）**：谁=桂守成；在哪=齿墙基坑边；对谁=全场与秦江海；做了什么=假齿墙断面前当众启动应急处置，一锹锹土把铁证埋回去；画面记忆点=坑底断面的偷工痕迹与回填土方同框，秦江海站在坑沿没有喊，只把图纸折好塞回怀里。<\/p>\n<h4>终局（E49-60）：洪峰验证 → 问责清算<\/h4>\n<ul>\n<li>**E49-56 洪峰**：E49 一号洪峰编号，转移启动——只拍秩序（手电列队、沙袋传递、雨衣背影，零伤亡零呼救）；他冒雨折返堤上巡堤查险。E50 调度令开闸时刻与台账库容矛盾爆发：按令开闸=下游险工段雪上加霜，不开=闸体超限上游漫灌——互不兼容均有代价。他以终身责任签下**迟开闸 4 小时错峰**责任状：说了一辈子「这单我不签」，这一次一个字没说——笔帽敲三下，落笔（全剧唯一一次主动落笔）。E51-52 病历本变部署图：拒签记录=抢险地图，标记管涌群、预置沙袋、分流抢护——他的留痕第一次直接救人；贺工带复核组到场终审取证。E53 **全剧主反转·一堤两制终验**：同一水位下分屏，出险 8 处全部落在他记录的 11 处之内（另 3 处未出险，如实呈现质量是概率，禁天罚式精准巧合）；险情最重的一处，恰是当年异议被驳回、人被调岗没拦成的桩段——他的自责。E54 出险清单=签收清单（回旋镖）。E55 闸开错峰，洪峰过境，水位刻度由爬升转回落——全剧钟走完。E56 水退，雨靴在退水里浮起，他捞起来抱在怀里。<\/li>\n<li>**E57-60 问责清算**：E57 问责会前夜，出险堤段清单与各段联签页并置，「施工队是临时的」甩锅被终身责任制条款当场钉死；E58 清算名单逐页念（连坐顺序见第三节）；E59 竣工永久性标牌：五方名字上碑——碑既刻功也刻债，他把重险桩段列为返工首位并自请连责；E60 复职令被他换成驻段质检申请（不写成励志逆袭），「**这单我签。**」——全剧唯一一次说出这句话；雷小雨接过钢卷尺；他再次贴堤听水。水面平静，刻度归零。<\/li>\n<\/ul>\n<p>**名场面 E（E50 无声落笔）**：谁=秦江海；在哪=闸房调度令前；对谁=对自己三十年；做了什么=笔帽敲三下，一个字没说，签下迟开闸 4 小时错峰责任状；画面记忆点=落笔瞬间闸下出流声炸响，开度表指针颤动。<\/p>\n<p>**名场面 F（E53 一堤两制终验）**：谁=洪峰（执行者）；在哪=同一条堤、同一水位；做了什么=水位线两侧干湿两色分屏，出险点位与他病历本的桩号一一重合；画面记忆点=病历本摊在堤防图上，一枚枚桩号钉子般压住出险标记。<\/p>\n<p>**名场面 G（E58 逐页念名单）**：谁=秦江海；在哪=问责会长桌；对谁=冯有德们；做了什么=把被撕后重抄的一摞拒签单推过桌面，一页对一段逐页念；画面记忆点=每念一页，长桌另一侧有一个人低下头去。<\/p>\n<p>---<\/p>\n<h3>五、前三集初稿（分拍，B 拍三件套）<\/h3>\n<p>&gt; 规范：每集 9-12 拍、每拍 6-15 秒、单集 1-1.5 分钟（600-900 字剧本量）；每拍=【0-3秒】（仅各集首拍）/分镜/台词/表演/尾钩五件；每拍一个认知更新；受辱→回击 ≤2 拍；口癖每集 ≥1、前三集变奏 3 次；每集 ≥1 可独立切片梗点。<\/p>\n<h4>第 1 集〈这单我不签〉（景一 验收会议室 → 景二 堤坡）<\/h4>\n<p>本集主认知更新：全项目部只有他不签。切片梗点：扫地僧伏笔（奖章）＋独拒签。集末卡点：情绪型（雷声上弦）。<\/p>\n<ul>\n<li>**拍1｜【0-3秒】拒签（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。特写：笔帽在图纸桩号上敲三下。<\/p>\n<p>  - 台词：秦江海（不看人，平静）：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」<\/p>\n<p>  - 表演：他念桩号像念了三十年；全场回头，别人的笔悬在半空；左胸口袋褪色劳模奖章入画一角。<\/p>\n<p>  - 尾钩：冯有德的文件夹「啪」按上桌面——他要做的第一件事，是让这个老头变成少数。<\/p>\n<ul>\n<li>**拍2（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处，推过去，指节敲在数字上。<\/p>\n<p>  - 台词：冯有德（低声）：「全签了，就差你。」／秦江海：「压实度不够，数字在这儿。要钻芯，钻给他们看。」<\/p>\n<p>  - 表演：冯有德眼珠先看左右再看纸（签字前先看左右的小动作首建）；秦江海坐着没动，声音不大，会议室却静。<\/p>\n<p>  - 尾钩：后排一声嗤笑——马长贵登场。<\/p>\n<ul>\n<li>**拍3（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录「啪」拍在桌上。<\/p>\n<p>  - 台词：马长贵：「老秦，你这是挡大家财路！」／雷小雨：「图纸上没有这个数，原始记录我念给大家听？」<\/p>\n<p>  - 表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。<\/p>\n<p>  - 尾钩：哄笑卡在喉咙里——秦江海开口了。<\/p>\n<ul>\n<li>**拍4（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。<\/p>\n<p>  - 台词：秦江海：「签了，我把三十年押给你；不签，下游几万人押给他们？」<\/p>\n<p>  - 表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。<\/p>\n<p>  - 尾钩：冯有德举起手：「表决。」<\/p>\n<ul>\n<li>**拍5（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。<\/p>\n<p>  - 台词：冯有德：「少数服从多数。」／桂守成（淡淡）：「程序上，就差这一笔了。」<\/p>\n<p>  - 表演：举手的人不看他，看桌面；秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。<\/p>\n<p>  - 尾钩：他不接——他起身了。<\/p>\n<ul>\n<li>**拍6（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。<\/p>\n<p>  - 台词：秦江海（在门口停半步，不回头）：「堤修给水看的，不是修给举手看的。」<\/p>\n<p>  - 表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。<\/p>\n<p>  - 尾钩：马长贵冲他背影扬声撂话——<\/p>\n<ul>\n<li>**拍7（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。<\/p>\n<p>  - 台词：马长贵：「老秦，是你的章硬，还是我的路子硬？」／秦江海（把烟原样插回他胸袋）：「汛期会替我试。」<\/p>\n<p>  - 表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。<\/p>\n<p>  - 尾钩：他没回宿舍，拐上了大堤。<\/p>\n<ul>\n<li>**拍8（约11秒）**<\/li>\n<\/ul>\n<p>  - 分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水——**名场面①海报级**。<\/p>\n<p>  - 台词：（无台词，只有水声一层层近。）<\/p>\n<p>  - 表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。<\/p>\n<p>  - 尾钩：他顺着堤走到一根桩号碑前——<\/p>\n<ul>\n<li>**拍9（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：手指划过分界桩刻字：桩号 3+960。镜头左右摇：一侧坡面(new填筑)扎实色深，另一侧草皮下水渍成片——**一堤两制第一集露脸**（他拒签的段与别人签收的段第一次同框）。<\/p>\n<p>  - 台词：秦江海（对堤，像对故人）：「老伙计，他们把你签出去了。」<\/p>\n<p>  - 表演：手指在桩号上停了很久。<\/p>\n<p>  - 尾钩：天边一声闷雷——<\/p>\n<ul>\n<li>**拍10｜集末卡点·情绪型（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：乌云压着河面推过来，雷声滚过堤顶；大远景：一条长堤、一个老头的剪影。字幕卡：汛期第一天。<\/p>\n<p>  - 台词：秦江海（抬头看天，轻声）：「要来水了。」<\/p>\n<p>  - 表演：他不躲雨，反而往堤上又走了一步。<\/p>\n<p>  - 尾钩（下集钩）：这一张没人敢接的拒签单，能挂到水来吗？<\/p>\n<p>**本集体检**：爆点 5（独拒签反常钩 / 对撞拍记录 / 金句变奏①+奖章 / 贴堤听水名场面+一堤两制同框 / 雷声上弦）；口癖 1 次＋变奏①；水 ✓（河面、听水、雷雨）；卡点体检——观众必须看下一集，因为拒签单刚被表决围攻、雷已响，他的「不签」挂不挂得住、水几时来，两问都未答。<\/p>\n<h4>第 2 集〈水不要你觉得〉（景三 项目部办公区·档案室）<\/h4>\n<p>本集主认知更新：他们要的不是他签字，是他消失。切片梗点：「我不要你觉得」×「水不要你觉得」。集末卡点：情绪型（钢卷尺）。<\/p>\n<ul>\n<li>**拍1｜【0-3秒】摘牌（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：两个工人抬着办公桌穿过走廊，桌上图纸滑到地；「总工程师」门牌被一把摘下；桌子落位——档案室角落，正对整墙旧临江圩地形图。<\/p>\n<p>  - 台词：工人甲（嘟囔）：「秦总工，先在这儿委屈委屈。」<\/p>\n<p>  - 表演：秦江海进门看了一眼位置，先扶正桌角，再捡图纸——像搬家的是别人。<\/p>\n<p>  - 尾钩：门口有人鼓了两下掌——冯有德来了。<\/p>\n<ul>\n<li>**拍2（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。<\/p>\n<p>  - 台词：冯有德：「签个字，大家都省事。我不要你觉得，我要你觉得。」<\/p>\n<p>  - 表演：他说话时眼睛看墙上的地形图，不看人（心虚）。<\/p>\n<p>  - 尾钩：秦江海拿起了那支只画水位线的笔——<\/p>\n<ul>\n<li>**拍3（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：秦江海转身面向地形图，沿着图上历史洪水位线缓缓描一道，笔尖不抖。<\/p>\n<p>  - 台词：秦江海（头也不回）：「**水不要你觉得。**」<\/p>\n<p>  - 表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。<\/p>\n<p>  - 尾钩：走廊传来脚步与递烟的笑——马长贵带人堵门。<\/p>\n<ul>\n<li>**拍4（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。<\/p>\n<p>  - 台词：马长贵：「老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。」<\/p>\n<p>  - 表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，动作不快不慢。<\/p>\n<p>  - 尾钩：人群里有人不耐烦要进门——一只全站仪横了过来。<\/p>\n<ul>\n<li>**拍5（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。<\/p>\n<p>  - 台词：雷小雨：「这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。」<\/p>\n<p>  - 表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。<\/p>\n<p>  - 尾钩：马长贵刚要开口，冯有德先软了——<\/p>\n<ul>\n<li>**拍6（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。<\/p>\n<p>  - 台词：冯有德：「再研究研究。……对了，复审组下周进场，你自己掂量。」（信息钩·伏 E8）<\/p>\n<p>  - 表演：退到门口顿了半步，像想补一句狠话，终究没说。<\/p>\n<p>  - 尾钩：人散尽，档案室只剩秦江海一个人。<\/p>\n<ul>\n<li>**拍7（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边（清算物件·雨靴首次亮相）。<\/p>\n<p>  - 台词：（无台词。）<\/p>\n<p>  - 表演：擦靴子的手势像在擦一块碑。<\/p>\n<p>  - 尾钩：他把联签单副本铺平在桌上——<\/p>\n<ul>\n<li>**拍8（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，「咔」锁定。<\/p>\n<p>  - 台词：秦江海（对着空档案室，更狠）：「这一单，我还不签。」（口癖变奏②）<\/p>\n<p>  - 表演：说给空屋子听，比说给人听更硬。<\/p>\n<p>  - 尾钩：尺带在他掌心勒出一道白印——<\/p>\n<ul>\n<li>**拍9（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：钢卷尺「啪」拍在联签单副本上，纸角跳起。<\/p>\n<p>  - 台词：秦江海：「量堤可以。量人心，你们不够长。」<\/p>\n<p>  - 表演：说完才觉掌心疼，摊开看了一眼，笑了笑。<\/p>\n<p>  - 尾钩：窗外第一滴雨打在玻璃上——<\/p>\n<ul>\n<li>**拍10｜集末卡点·情绪型（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。<\/p>\n<p>  - 台词：（无台词，雨声渐密。）<\/p>\n<p>  - 表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么（伏·「抄三份」）。<\/p>\n<p>  - 尾钩（下集钩）：复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。<\/p>\n<p>**本集体检**：爆点 5（摘牌反常 /「水不要你觉得」对撞 / 全站仪拦门 / 复审组风声信息钩 /「量人心不够长」+卷尺）；口癖变奏② ✓；水 tick ✓（描水位线+窗雨，实体水 E3 补足）；卡点体检——下一集必须看：夜里卡车干什么？他深夜在抄什么？<\/p>\n<h4>第 3 集〈这方混凝土，保熟吗〉（景二 堤段工地·夜 → 景一 验收会议室）<\/h4>\n<p>本集主认知更新：偷工实锤与受辱顶点同场对撞，他当场验了、当场被撕、当场回敬。切片梗点：「偷感」钉车＋「保熟吗」。集末卡点：情绪+信息型（捡碎纸）。<\/p>\n<ul>\n<li>**拍1｜【0-3秒】钉车（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光「啪」钉住车头，光柱里料粉飞舞（「偷感」名场面开场）。<\/p>\n<p>  - 台词：秦江海（画外，声音不大）：「几点了，还在卸料。」<\/p>\n<p>  - 表演：光柱里所有人定格如标本；工头的笑僵在半张脸。<\/p>\n<p>  - 尾钩：工头小跑下来打圆场——<\/p>\n<ul>\n<li>**拍2（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：工头搓着手凑近，手电光柱从车头移到他脸上。<\/p>\n<p>  - 台词：工头：「秦总工，夜里凉，您回吧——这不是赶工期嘛。」<\/p>\n<p>  - 表演：挡在料袋前的身体语言比嘴诚实。<\/p>\n<p>  - 尾钩：秦江海没理他，径直蹲向新卸的料堆——<\/p>\n<ul>\n<li>**拍3（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。<\/p>\n<p>  - 台词：秦江海：「**这方混凝土，保熟吗？**」（切片位）<\/p>\n<p>  - 表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。<\/p>\n<p>  - 尾钩：工头张了张嘴——车门开了。<\/p>\n<ul>\n<li>**拍4（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。<\/p>\n<p>  - 台词：马长贵：「老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！」——（正确的理由干错误的事）<\/p>\n<p>  - 表演：声音抬得越高，眼睛越不看料堆。<\/p>\n<p>  - 尾钩：秦江海不接话，直起身朝堤顶喊——<\/p>\n<ul>\n<li>**拍5（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。<\/p>\n<p>  - 台词：秦江海：「小雨——取样。当着大家的面。」<\/p>\n<p>  - 表演：工人群像里有人下意识后退半步。<\/p>\n<p>  - 尾钩：仪器滴一声——数字出来了。<\/p>\n<ul>\n<li>**拍6（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆（小验证·爽点）。<\/p>\n<p>  - 台词：雷小雨：「快测结果，低于设计标号。原始样我封了，双份！」<\/p>\n<p>  - 表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。<\/p>\n<p>  - 尾钩：马长贵撂下一句——「明天验收会上说。」<\/p>\n<ul>\n<li>**拍7（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：次日，验收会议室（景一）。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。<\/p>\n<p>  - 台词：冯有德：「私留底稿、扰乱验收秩序。这种风气，必须刹。」<\/p>\n<p>  - 表演：他撕纸前先看左右（小动作复现）。<\/p>\n<p>  - 尾钩：纸，碎了。<\/p>\n<ul>\n<li>**拍8（约9秒）**<\/li>\n<\/ul>\n<p>  - 分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（流程上撕不掉·伏笔特写半秒）。<\/p>\n<p>  - 台词：（撕纸声独占两秒，全场无声。）<\/p>\n<p>  - 表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。<\/p>\n<p>  - 尾钩：他开口了——当拍回击——<\/p>\n<ul>\n<li>**拍9（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场（受辱→回击时差 1 拍）。<\/p>\n<p>  - 台词：秦江海：「撕吧。这单我不签——**每一页我都抄了三份。**」（口癖变奏③+切片位）<\/p>\n<p>  - 表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。<\/p>\n<p>  - 尾钩：桂守成低头在会议记录上写批注，笔迹特写一秒（伏·E36 笔迹比对）。<\/p>\n<ul>\n<li>**拍10（约8秒）**<\/li>\n<\/ul>\n<p>  - 分镜：冯有德趁势合卷：「验料结果，另行核议。散会。」——检出来的假，被留在议程之外。<\/p>\n<p>  - 台词：雷小雨（低声）：「验了等于白验？」／秦江海：「不。他们欠了一笔，签了字就生利息。」<\/p>\n<p>  - 表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。<\/p>\n<p>  - 尾钩：散会，暴雨正好砸下来——<\/p>\n<ul>\n<li>**拍11（约11秒）**<\/li>\n<\/ul>\n<p>  - 分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒（清算物件·雨靴+「抄三份」双伏笔落位）。<\/p>\n<p>  - 台词：（无台词，只有雨声。）<\/p>\n<p>  - 表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。<\/p>\n<p>  - 尾钩：他站起身，望向河面——<\/p>\n<ul>\n<li>**拍12｜集末卡点·情绪+信息型（约10秒）**<\/li>\n<\/ul>\n<p>  - 分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。<\/p>\n<p>  - 台词：秦江海：「水位涨一格，你们就多欠我一页。」（雷声吞尾）<\/p>\n<p>  - 表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。<\/p>\n<p>  - 尾钩（下集钩）：复审组进场第一天，桌上立的第一份材料——是一封举报秦江海「泄露工程数据」的反咬信。<\/p>\n<p>**本集体检**：爆点 6（钉车反常钩 / 保熟吗 / 快测当众念 / 当拍回击抄三份 / 「另行核议」敌进一分 / 捡碎纸金句卡点）；口癖变奏③ ✓；受辱→回击时差 1 拍 ✓；水 ✓（夜雨、暴雨、雨靴）；小验证当场验料 ✓（R1 读者条件 1）；卡点体检——下一集必须看：反咬信从哪来？他抄的三份在哪、谁会看到？被「合法」放过的假堤段，涨水后先出事的会是哪一段？<\/p>\n<p>---<\/p>\n<h3>六、监管自检与约束对账（A 组正稿附件）<\/h3>\n<h4>6.1 总编位四条自查<\/h4>\n<ul>\n<li>[x] **爆点对标制**：首卡 E10 与对标件同位爆点对位（死局→当场复原数据 ⇄ 听证死局→管涌现场当场对数），强度不降；每集爆点见第五节各集体检栏与第三节密度表。<\/li>\n<li>[x] **钩子生理测试**：开篇 3 秒 = 独拒签反常+冲突（第一节「开篇 3 秒设计」），零铺垫。<\/li>\n<li>[x] **名场面可视化**：名场面 A-G 均按「谁 / 在哪 / 对谁 / 做了什么 / 画面记忆点」五要素写成，可直接当分镜需求。<\/li>\n<li>[x] **全剧爆点分布图**：第三节密度表逐单元标注爆点与垫场；无连续 5 集无爆点段；两大卡点间中型爽点 ≥2。<\/li>\n<\/ul>\n<h4>6.2 A/B 计量回填（报 R3 门，与基线并表）<\/h4>\n<p class=\"row\"> ┃  计量列  ┃  基线值（B 组）  ┃  本稿值（A 组）  ┃ <\/p>\n<p class=\"row\"> ┃  前三集爆点计数  ┃  2 / 集  ┃  E1=5，E2=5，E3=6  ┃ <\/p>\n<p class=\"row\"> ┃  口癖变奏（前三集）  ┃  1 次  ┃  3 次（变奏① E1 拍4 / ② E2 拍8 / ③ E3 拍9）  ┃ <\/p>\n<p class=\"row\"> ┃  受辱→回击时差  ┃  E3 隔 3 拍  ┃  E3 同场 1 拍（拍8→拍9）  ┃ <\/p>\n<p class=\"row\"> ┃  前三集分拍粒度  ┃  每集 5 拍大纲级要点  ┃  每集 10/10/12 拍，拍级五件套齐  ┃ <\/p>\n<h4>6.3 监理位·约束移交单 C1-C10 逐条对账<\/h4>\n<p class=\"row\"> ┃  条  ┃  落实  ┃  判  ┃ <\/p>\n<p class=\"row\"> ┃  C1  ┃  CN 竖屏付费口径；男频实事爽剧；尊严刻度贯穿（终局驻段质检非高升复职）  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C2  ┃  60 集 × 1-1.5 分钟 × 单集 ≤1200 字；前三集每拍 6-15 秒、每集 9-12 拍  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C3  ┃  主场景 3（验收会议室 / 堤段工地含堤坡闸房 / 项目部办公区含资料室仓库角）；有名有姓 7；核心 5  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C4  ┃  ①零架空术语（终身责任制/空库调度皆公共语汇，验证动作全部画面化）②零重生先知（全靠事前留痕）③零团宠/真假千金/强爱情线（雷小雨纯师徒，显式声明）④零财富皮⑤零多层马甲（E58 物件式单点揭示）⑥三分钟测试过（E1 拍1-2 三身份齐亮相）  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C5  ┃  全稿零真实机构名/责任人（项目部/复核组/监理/上级单位皆通称，围标链称「一条龙」）；自造专名 2（清川河、临江圩，余量 1），前三章 ≤2（临江圩、清川河，均地名类）；真实灾害只作情绪举证；零伤亡消费；不喊口号；落点问责与守护  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C6  ┃  首卡 E10 当众验证（8-12 窗内）；E1 独拒签 / E2 施压对撞 / E3 夜查受辱顶点+集尾连本带利伏笔  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C7  ┃  主锚「较真者的憋屈 × 汛期防洪焦虑」；三圈戏剧钟（气象/调度/水位）；四件套轮换；因果可归因（11 处记录-8 处出险-3 处未出险）；主角主动性（拒签三要素出击；洪峰三动作：折返巡堤/责任状/病历本部署）  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C8  ┃  每集 ≥1 切片梗点（E1 独拒签+奖章 / E2 水不要你觉得 / E3 保熟吗+偷感）；口癖每集 ≥1、3 集 3 变奏；16 条热梗全量挂接按结构宪法 7.5 表执行  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C9  ┃  清算可见可数：拒签单/水位线对照/刻名碑+雨靴（4 件）；E10 强度对标同位爆点  ┃  ✓  ┃ <\/p>\n<p class=\"row\"> ┃  C10  ┃  设定来源声明：实事新闻做底子（终身责任制+国债除险加固+汛期问责+病险水库主汛期空库运行，C 级可核实）；大白话标题检验过（「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」）  ┃  ✓  ┃ <\/p>\n<h4>6.4 R1/R2 门条件与两提案复核位<\/h4>\n<ul>\n<li>[x] R1 读者条件 1：E3 小验证（「保熟吗」当场验料，拍3-拍6）——受辱不连续铺满（E3 小赢、E5 留痕、E16/E24 垫场）。<\/li>\n<li>[x] R1 读者条件 2：看得见的水每三集一次（第三节预扫表，任意缺口 ≤2 集）。<\/li>\n<li>[x] R1 读者条件 3：一堤两制分屏 E1 露脸（拍9 分界桩同框）→ E12 点题 → E53 终验。<\/li>\n<li>[x] **提案二「她的名字进了签字链」（诱签变体）**：已按结构宪法融入（E7 谈话伏 → E27 收口 → E31 加深 → E42 救证 → E58 作证）；**保留【需 R2 复核】标注**——变体未过四视角原判，控制线：雷小雨单集 ≤2 拍、每场服务该集唯一主认知更新；R1-B 原案（徒弟泄密者）不取，记录在案供 R3 对照。<\/li>\n<li>[x] **提案四「空库令」调度钟**：已按结构宪法融入（E22 钟楼就位 → E32 首令 → E41 双钟同拨 → E50 危机总开关）；**保留【需 R2 复核】标注**——纪律：调度术语全部画面化（开度表/刻度/令单），禁台词讲解；剧内通称，不对应任何真实调度机构与真实调度事件。<\/li>\n<\/ul>\n<h4>6.5 伤亡红线三则（全稿含名场面清单适用）<\/h4>\n<p>1. **水的威力物证化**：水位刻度一格一格爬、管涌口翻浑水顶起碎石、坡面渗水、闸下出流、雨靴浮起——水的「大」用声音与刻度表达，零惨状。<\/p>\n<p>2. **人员镜头纪律**：转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影）；全稿零遇难、零伤情特写、零呼救、零寻人启事道具；群演台词零伤亡内容。<\/p>\n<p>3. **零决口设计**：最大险情写到「出险抢护」级（管涌群、滑坡预兆）；E54 切片双关「这次塌的是真的」画面为出险渗漏抢护，非垮塌惨状；九八前史闪回只拍雨夜背影与遗物，零灾情画面、零指认真实工程。<\/p>\n<h4>6.6 其他自检<\/h4>\n<ul>\n<li>[x] 可写性三问：人设记忆点 AI 出图可画（工装两笔一尺一靴一奖章/胶带安全帽/保温杯）；单元模板可换皮 20 次（四件套×5 验证物）；名场面 A-G 可直当分镜需求。<\/li>\n<li>[x] 与结构宪法同源：五宏节点集域、核心 5+扩展 2、三层反派、清算顺序、两提案复核位未偏离；对基线的修订按表 2.0-A 修订后状态执行（撕的是底稿非存档联、两级贬法 E20/E21、开膛前移 E30、E8 起贺工进场）。<\/li>\n<li>[x] 自造专名盘点：清川河、临江圩（2 个，全为地名类，余量 1）；全稿零真实机构名、零真实责任人；零伤亡消费。<\/li>\n<li>[x] 未读取 projects/_archive/ 下任何内容；无任何 git 操作。<\/li>\n<\/ul>\n<p>*依据：skills/topic-proposal（五节结构）；script-drama-beat（分拍硬格式）；topic-chief-aesthetic（总编四条）；故事框架案@2026-09-16；选题分析报告·约束移交单 C1-C10@2026-09-16；选题方案-爽版-基线@2026-09-16；梗卡@2026-09-16；热点素材@2026-09-16。本件为 S3 全量爽版正稿，A/B 计量值待与基线并表报 R3 门。*<\/p><\/section>\n<section><h1>小纲-第1-3集.md<\/h1><h2>《守堤人》小纲 · 第 1-3 集（S4 批注载体）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）<\/li>\n<li>剖面：scene-screenwriter（小纲师）· scene-breakdown 技能 · miniguide 节点<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>输入件：选题方案.md 第五节「前三集初稿（分拍）」（派生源）；故事框架案.md（汛期三圈钟、伏笔位、口癖变奏表 7.4）；skills/scene-breakdown.md（达意纪律、每集 9-12 分镜、每镜一个认知更新、文末创作思路页）<\/li>\n<li>禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作<\/li>\n<li>格式说明（导出器对齐）：每拍 `**B编号｜钩型｜时长**`；编号全三集连续（B0001-B0032）；每集仅首拍带【0-3秒】开篇画面行；钩型四型 = 反常／冲突／悬念／情绪（第一集首拍钩型 = 反常）；备注字段为内部坐标（伏笔回收位/梗点/红线标记），供批注锚定<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>第一集《这单我不签》<\/h3>\n<p>&gt; 本集速览：主认知更新——全项目部只有他不签。切片梗点：独拒签＋扫地僧奖章伏笔。集末卡点：情绪型（雷声上弦）。口癖首现＋变奏①。水 tick：河面、听水、雷雨。景一 会议室 → 景二 堤坡。<\/p>\n<p>**B0001｜反常｜9秒**<\/p>\n<p>【0-3秒】验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。<\/p>\n<p>分镜：特写笔帽在图纸桩号上敲三下，他念桩号不看人，全场回头，别人的笔悬在半空。<\/p>\n<p>台词：秦江海：\"3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。这单我不签。\"<\/p>\n<p>表演：念桩号像念了三十年；左胸口袋褪色劳模奖章入画一角。<\/p>\n<p>尾钩→ 冯有德的文件夹\"啪\"按上桌面——他要做的第一件事，是让这个老头变成少数。<\/p>\n<p>备注：口癖首现；拒签三要素出击（部位+缺陷+要求）；奖章伏笔（E10 扫地僧梗兑现位）。<\/p>\n<p>**B0002｜冲突｜8秒**<\/p>\n<p>分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处推过去，指节敲在数字上。<\/p>\n<p>台词：冯有德：\"全签了，就差你。\"／秦江海：\"压实度不够，数字在这儿。要钻芯，钻给他们看。\"<\/p>\n<p>表演：冯有德眼珠先看左右再看纸（小动作首建）；秦江海坐着没动，会议室却静。<\/p>\n<p>尾钩→ 后排一声嗤笑——马长贵登场。<\/p>\n<p>备注：承接拍1——因为有人开了头，施压与帮腔才接得上。<\/p>\n<p>**B0003｜冲突｜9秒**<\/p>\n<p>分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录\"啪\"拍在桌上。<\/p>\n<p>台词：马长贵：\"老秦，你这是挡大家财路！\"／雷小雨：\"图纸上没有这个数，原始记录我念给大家听？\"<\/p>\n<p>表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。<\/p>\n<p>尾钩→ 哄笑卡在喉咙里——秦江海开口了。<\/p>\n<p>备注：三分钟测试收口——修堤的、偷工的、不签的三身份齐亮相。<\/p>\n<p>**B0004｜情绪｜10秒**<\/p>\n<p>分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。<\/p>\n<p>台词：秦江海：\"签了，我把三十年押给你；不签，下游几万人押给他们？\"<\/p>\n<p>表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。<\/p>\n<p>尾钩→ 冯有德举起手：\"表决。\"<\/p>\n<p>备注：口癖变奏①（金句）；奖章特写为 E10 群演低语\"扫地僧\"埋点。<\/p>\n<p>**B0005｜冲突｜9秒**<\/p>\n<p>分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。<\/p>\n<p>台词：冯有德：\"少数服从多数。\"／桂守成（淡淡）：\"程序上，就差这一笔了。\"<\/p>\n<p>表演：举手的人不看他，看桌面；秦江海看那张单子，像看一样烫手的东西被人往怀里塞。<\/p>\n<p>尾钩→ 他不接——他起身了。<\/p>\n<p>备注：桂守成\"按程序办\"面孔暗起（三层反派第三层伏笔）。<\/p>\n<p>**B0006｜情绪｜8秒**<\/p>\n<p>分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。<\/p>\n<p>台词：秦江海（门口停半步，不回头）：\"堤修给水看的，不是修给举手看的。\"<\/p>\n<p>表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。<\/p>\n<p>尾钩→ 马长贵冲他背影扬声撂话——<\/p>\n<p>备注：会议室他输，节奏转场去堤上赢——受辱不铺满的第一闸。<\/p>\n<p>**B0007｜冲突｜8秒**<\/p>\n<p>分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。<\/p>\n<p>
