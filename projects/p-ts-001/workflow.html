案步\n\n*依据：skills/structure-design（选型三步/注入提案/节奏对表/输出契约）；kb/structure/catalog §一-四；kb/market/structure（60 集节拍位）；kb/aesthetic/pacing-density（hot 档密度/卡点/沙漠）/reversal（判型与铺垫）/emotion-curve（六型与失衡）/conflict-escalation（因果链八节点/代价梯/对立统一）；选题分析报告·约束移交单 C1-C10；多视角意见书-R1（附条件过，条件 1-3 并入）；梗卡@2026-09-16；热点素材@2026-09-16；选题方案-爽版-基线@2026-09-16。*\n"}}], "proposal": [{"round": 1, "ts": "2026-09-15T23:47:06.343Z", "note": "submit r1", "content": {"选题方案.md": "# 选题方案：《守堤人》（水利题材 · 拒签老总工 · 实事男频爽剧）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：scene-screenwriter（选题编剧）· S3 全量爽版正稿（route=hot，监管位全开：总编强度 × 监理合规）\n- 生成日期：2026-09-16\n- 输入件：skills/topic-proposal.md（五节结构，顺序固定）；故事框架案.md（**结构宪法**：五宏节点 / 汛期三圈钟 / 三层反派 / 两提案复核位）；选题分析报告.md 第五节「创作约束移交单」C1-C10（硬约束，逐条遵守不讨论）；选题方案-爽版-基线.md（B 组对照件，同源骨架）；梗卡.md；热点素材.md\n- 同源声明：核心 5 人人设、「拒签蓄力 × 洪峰当众验证」新变体、伤亡红线三则、五宏节点集域（E1-12 / E20-24 / E33-48 / E49-56 / E57-60）、两提案复核位，全部与结构宪法同源；基线的 5 处显式修订（表 2.0-A）在本文按修订后状态执行\n- 禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n\n---\n\n## 一、选题\n\n**选题名**：《守堤人》。封面标题（口语化、有冲突感）：**「全项目部都在签字，只有他不签」**；备用封面标题：「这单我不签」。\n\n**一句话定位**：大堤除险加固验收在即，全项目部只有 58 岁的老总工一个人不肯签字；后来，洪水替他验了一张没人敢验的收据。\n\n**时代情绪锚**（当下社会情绪 + 30 天内证据）：\n\n> **较真者的憋屈 × 汛期防洪焦虑**——认真的人在系统性糊弄面前孤军奋战，而堤的那头是千家万户的身家性命。\n\n- 底层情绪（普适长期）：「会干的不如会混的」——每个观众身边都有一个「不肯签字的老工程师」和一个「签得飞快的人」。\n- 顶层焦虑（实时）：汛期未过，「堤里有没有猫腻」的愤怒是进行时。证据：2026 全国「质量月」25 部门联合部署、严查偷工减料弄虚作假〔A 级，2026-09-04〕；台风「沙德尔」登陆、最高级别洪水应急响应启动〔A 级，2026-09-03〕；8 月中旬河南某县堤防决口与封堵的全民围观长尾〔B 级，2026-08-13〕。\n- 合规注：真实灾害只作情绪举证，剧内事件独立成案（虚构的临江圩除险加固工程），零对应、零影射、零伤亡消费；剧内台风一律无名（只称「台风」「上游雨带」）。\n\n**新意装置**：**拒签单 × 洪峰当众验证**——「他没打赢任何人，是洪水替他赢了」。装置改变的具体写法：\n\n- 清算执行者由主角的嘴置换为水位：他只负责留痕，宣判交给洪水。改变 E10 的写法——验收会死局（他被反咬立案、被「请」出会议室）不由他自辩，由雨后第一轮涨水在管涌现场替他对数；改变 E53 的写法——终局反转不是反转人，是同一水位把同一条堤分成两半（一堤两制）；改变 E58 的写法——清算名单不用查，就是他自己重抄的那一摞拒签单，一页对一段，逐页念。\n- 金手指 = 权力型制度身份（签字权 / 复审权 / 终身责任制条款），每次使用带成本：拒签一次，岗级掉一层。爽点一律锚「拒签 × 洪峰验证」机制，零财富皮。\n\n**核心爽点承诺**（一句话）：看一个被全项目部孤立的老头靠一张一张「不签」活到最后，看洪水把他签过的和没签的堤段当场分成两半——**他写下的每一页，都会回来收账。**\n\n**开篇 3 秒设计**（第一拍具体画面与台词）：\n\n验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，签得最快的是监理负责人；笔传到秦江海手里——停。特写：笔帽在图纸桩号上敲三下。他念桩号不看人：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」全场回头，笔悬在半空。\n\n- 反常（唯一不签的人）+ 冲突（当众拦验收）占全，零铺垫、零背景交代。\n- 生理测试：没看过背景的人听完这拍不问「为什么」，只问「然后呢」——过。\n\n---\n\n## 二、人设\n\n核心 5 人 + 扩展 2 人（有名有姓合计 7 ≤ 10；雷小雨与秦江海为纯师徒 / 同事线，**零感情线，显式声明**）。外形全部写到「AI 出图能画」的记忆点精度。\n\n### 2.1 核心 5 人\n\n| 角色 | 姓名 / 年龄 / 身份 / 外形记忆点 | 反差立柱（外在 vs 内在拧着写） | 核心动机 | 口癖 / 标志小动作 |\n| --- | --- | --- | --- | --- |\n| 男主 | **秦江海 · 58 · 临江圩除险加固项目部总工程师**。藏蓝旧工装洗得发白；左胸口袋别两支笔（一支写字，一支只画水位线——师父遗物）；胶底鞋；后腰钥匙串挂一把老钢卷尺；左胸口袋上方一枚褪色劳模奖章（E1 特写，提前半拍亮身份） | 开会最没存在感，堤上声音最大；被全场孤立却像视察自家菜地 | 三十年前同一条河上，师父没拦住的那座坝——验收单被「先签后补」，26 岁的资料员秦江海亲手把补签页送进了流程。他的私罪。每一张拒签单都是重写当年那张单 | 「这单我不签。」／说话前笔帽敲图纸三下；巡堤时耳朵贴堤听水 |\n| 反派一 | **马长贵 · 45 · 施工方负责人（剧内自造主体）**。皮鞋上工地，手机大音量外放，办公桌腿垫着酒箱 | 对上点头哈腰递烟，对工人横眉瞪眼 | 垫资垫到抵押了房子，必须赶在汛期前验收回款——他也在跟汛期赛跑（有理由的错误选择） | 「规矩是死的，人是活的。」／说话先递烟 |\n| 反派二 | **冯有德 · 50 · 项目部上级（赶工期要签字的）**。衬衫扣到最顶一颗，文件夹永远抱在胸前当盾牌 | 不贪一分钱，但怕担一分责；嗓门越轻的事他越躲 | 「集体的决定」——把个人责任稀释成集体责任，稀释完就安全了 | 「再研究研究。」／签字前先看左右 |\n| 徒弟 | **雷小雨 · 26 · 测绘员**。反光背心；黄色安全帽上手绘一圈警戒红线胶带，帽带永远不扣；全站仪当拐杖拄 | 全项目部最年轻的人，却是最「多事」的人——唯一公开站在老头一边 | 她信数据不信酒桌；签了的字要背一辈子，她不想背 | 「图纸上没有这个数。」／拿全站仪拦门、点地 |\n| 复审方 | **贺工 · 60 · 复核组老专家**。旧夹克，布鞋，手里始终捏着一个掉漆保温杯 | 退居二线说话没人当回事，一出手就是终审 | 退休前最后一趟，想把当年的糊涂账算清 | 「我看看。」／保温杯拧开又拧上 |\n\n### 2.2 扩展 2 人（非核心，服务反派第三层与证人线）\n\n| 角色 | 设定 | 功能 |\n| --- | --- | --- |\n| 桂守成 · 44 · 监理负责人 | 头发梳得一丝不乱，笔永远别在胸袋，从不违反任何一条程序 | **反派第三层「做流程的」在项目部内的面孔**：先签后补的发源地、退件流程墙、销项程序的启动者；E1 开场签到笔传得最快的人。口癖「按程序办。」 |\n| 老周 · 55 · 马长贵班组料工 | 满手老茧，见谁都递烟，帽檐压得低 | 夜施内情证人：口证（E17-18）→ 书面交底被辞（E33）→ 暗续日志（E46）→ 问责会作证（E58）。口癖「我就路过。」 |\n\n师父（三十年前）不登场不具名，仅存于遗物（那支只画水位线的笔）与 ≤3 次限拍闪回（每次 ≤3 拍，只置大卡点前夜，只拍雨夜背影与遗物，零灾情画面）。\n\n---\n\n## 三、冲突设计\n\n**韩剧强度基准自检**（对标近 3 年复仇 / 豪门剧的情绪浓度）：\n\n- **情绪直接饱满**：不写克制隐忍。三槽引擎保证每集 ≥3 个外化爆点——台词槽（拒签三要素金句）、对撞槽（四件套施压 → 物证回击）、碎片槽（身份碎片 / 物证特写 / 水位 tick）。长剧把「较真者被碾碎」拍三集才给一次反击，本剧受辱与第一击回敬同场完成。\n- **反杀当场化**：羞辱与回敬时差 ≤2 拍（E3 为范式：撕稿 →「撕吧，每一页我都抄了三份」= 时差 1 拍）；大胜留给集尾卡点。\n- **金手指 = 权力型身份**：兑现画面是可拍的权力动作——水位线对照、联签单作废、责任状落笔、执业资格吊销、刻名碑，不是「证明自己是对的」。\n- **反派连坐**：恶人是一张签字链，拆解有顺序有仪式（返工自费 → 吊证移送 → 逐页拆签名 → 审计封条）。\n\n**主线冲突（一句话）**：不肯签字的老总工要在洪峰到来之前，拦住一整条想把问题堤段「合法签收」的签字链。\n\n**单元冲突模板（可无限复制）**：「**一张验收单 = 一次攻防**」——反派用四件套之一施压（先签后补稀释责任 / 隐蔽工程不留影像 / 拿防汛窗口期压质量 / 把提问题的人调岗边缘化）→ 秦江海用物证或制度条文回击（芯样、渗压记录、水位线、责任条款）→ 集尾卡点收。可复制原因：分部工程天然逐项验收，一张单 = 一集节拍；变量池 = 反派四件套 × 验证物 5 种（钻芯样 / 渗压读数 / 留样标记 / 水情日志 / 水位刻度），4×5=20 个变量，60 集不重样；全部攻防装进三景（验收会议室 / 堤段工地含汛期堤坡与堤头闸房 / 项目部办公区含资料室仓库角），换景 = 换集。\n\n**反派梯度（三层，逐级升格——「把偷工减料做成流程的人」）**：\n\n| 层 | 角色 | 作恶形态（流程感） | 亮层时刻 | 对立统一（立场各自成立） |\n| --- | --- | --- | --- | --- |\n| 一 · 动手的 | 马长贵 | 偷工减料、夜施换料、隐蔽工程不留影像 | E1-E18 | 房子抵了，汛期前必须回款——他也在跟汛期赛跑 |\n| 二 · 签字的 | 冯有德 | 先签后补稀释责任、调岗排异、拿防汛窗口期压质量 | E19-E42 | 不贪，但怕担责——稀释是他自保的理性选择 |\n| 三 · 做流程的 | 桂守成（围标链项目部内面孔） | 把验收做成流水线：退件程序墙、销项程序吃证据、资料一条龙、连水情台账都做过手 | E6 暗起 → E30 掌权 → E36 现形 → E42 实锤 | 从不违反任何一条程序——他的每一步都「合规」，这正是全剧要钉死的东西 |\n\n升级逻辑：从「驳你的数据」到「撕你的底稿」到「吃你的证据」到「调你的人」——反派每次升级都是对主角上一招的**学习适应**，无复读；全剧零真实机构名、零真实责任人（围标链剧内通称「一条龙」）。\n\n**冲突密度表**（每 6-10 集一个单元闭环 × 爆点分布 × 沙漠预扫 × 垫场）：\n\n| 单元闭环 | 集域 | 单元冲突 | 单元内中型爽点（垫场） | 大卡点 |\n| --- | --- | --- | --- | --- |\n| 拒签连环 | E1-8 | 全员签他独拒签 → 孤立、撕稿、反咬立案 | E3 小验证验料 / E5 渗压留痕反击 | — |\n| 首卡验证 | E9-12 | 听证死局 → 管涌现场当众对数 | E10 自证+验证双爽 / E12 一堤两制点题 | **E10 首卡** |\n| 四件套轮换 | E13-19 | 一张验收单一次攻防（模板开轮） | E16 标高对赌打脸 / E18 听堤教学 | — |\n| 调岗闸房 | E20-24 | 夺章发配 → 被发配到全剧钟楼 | E24 小洪峰预判兑现 | **E20** |\n| 抽检开膛 | E25-32 | 换样现行、诱签收口、开膛见假被销项 | E27 换样抓现行 / E30 中点改写 | **E30（中点）** |\n| 取证总装 | E33-40 | 举报石沉大海、笔迹比对、病历本并册 | E33 老周交底 / E38 表彰会摁停 | **E35** |\n| 围标蓄满 | E41-48 | 调包日志、签名会、停职收钥匙 | E42 存档副本救证 / E46 微反击 | **E43** |\n| 洪峰验证 | E49-56 | 危机选择、病历本变部署图、一堤两制终验 | E51-52 抢险兑现 / E53 主反转 | **E50（决战）** |\n| 问责清算 | E57-60 | 连坐清算、刻名碑、「这单我签」 | E58 逐页念 / E59 刻名 | **E58（终局）** |\n\n- 沙漠段检查：无连续 5 集无爆点段位；两大卡点之间中型爽点 ≥2（E33-40 文戏密段以 E33/E38 双垫场+大卡点 E35 压住；E44-48 低谷段以 E46 微反击+证据总装防丧）。\n- 「看得见的水」预扫（每三集一次实体水，任意缺口 ≤2 集）：E1 雷/水面、E3 夜雨、E5 渗水、E9-10 雨/管涌、E12 分屏、E14 水样、E16 堤前水面、E18 听堤、E20 雨中收章、E22 闸下出流、E23-24 台账雨情/小洪峰、E25 水样、E29 坑底渗水、E32 调度令/闸、E35 暴雨、E37 雨带、E38 场外暴雨、E39 出流声、E41-E60 全水段。✓\n\n**付费卡点事件表**（首卡第 8-12 集 + 后续每 15-20 集大卡点，全部写具体事件）：\n\n| 站位 | 集 | 具体事件（谁在哪对谁做了什么） | 类型 |\n| --- | --- | --- | --- |\n| **首卡（付费墙）** | **E10 末** | 管涌现场：他被反咬「泄露」的数据与实测分毫不差，反咬信当众反转；集末马长贵冷笑「六处险工段，你拦得住这一处吗」——水位刻度爬升特写 | 事件型 |\n| 大卡点 1 | E20 | 会议室宣布收章调岗，雨靴挂上仓库钥匙串，「老师傅也被整顿了」 | 情绪型 |\n| 大卡点 2（中点） | E30 | 开膛见假齿墙，桂守成当场启动应急处置：回填、重新取样、资料补齐销项——铁证被流程吃掉 | 信息+情绪型 |\n| 大卡点 3 | E35 | 举报被驳回，驳回依据正是 E30 销项文书；贺工保温杯拧开：「我看看。」 | 信息型 |\n| 大卡点 4 | E43 | 「集体决定」扩大化签名会，冯有德每一页都签——把「集体」钉成「个人合集」 | 信息型 |\n| 决战 | E50 | 调度令与台账矛盾爆发，他以终身责任签下迟开闸 4 小时错峰责任状——说了一辈子「这单我不签」，这一次一个字没说 | 情绪型顶点 |\n| 终局 | E58 | 问责会：一摞重抄拒签单，一页对一段逐页念——拒签清单 = 清算名单 | 兑现型 |\n\n**连坐清算顺序**（E57-E59，可见可数，按签字链还原倒序）：\n\n1. **马长贵（动手层）**：出险段落按联签自证 → 返工自费、押金抵赔、行业禁入——他的房已经抵了，代价可数。\n2. **桂守成（流程层）**：先签后补页时间戳 × 闸房水情日志雨情时标对撞 + 雷小雨存档副本 → 执业资格吊销、移送调查；终身责任制条款亮出，当场「已老实」〔梗14〕。\n3. **冯有德（签字层）**：联签单逐页拆解——「集体决定」被还原为一页页个人签名，每页对应他签掉的具体部位；收尾台词对立统一不破功：「我以为把名字签在一起，就没人淹死了。」\n4. **围标链（分饼层）**：审计进场封资料——只拍封条动作，留白不展开司法戏。\n5. **秦江海自请连责**：对「没拦成的那一处」自请处分（不揽功不诿责），核为其调岗期间无签权——尊严刻度。\n\n清算物件对位：拒签单（E58 逐页念）/ 水位线对照（E53 分屏 + E57 清单）/ 竣工永久性标牌刻名（E59）/ 雨靴（E58 防水袋底单交档）——4 件全给，≥2 件标准。\n\n---\n\n## 四、大纲（三段式，名场面具体到画面）\n\n### 前期（E1-30）：拒签立状 → 首卡验证 → 调岗闸房 → 开膛销项\n\n- **E1-8 拒签连环**：E1 开标会全员签字他独拒签（出击三要素：部位+缺陷+要求），集尾贴堤听水 + 分界桩两侧同框（一堤两制露脸）+ 雷声第一响（全剧钟上弦）。E2 办公桌被搬进档案室，「我不要你觉得」×「水不要你觉得」。E3 夜查手电钉车，「这方混凝土，保熟吗？」当场验料小赢；次日会冯有德当众撕他私留的检测底稿（存档联流程上撕不掉·伏）——他当拍回击「每一页我都抄了三份」，集尾雨中把碎纸捡进雨靴。E8 复审组进场，第一份立案的是反咬信——受辱升级为受冤，资料权限被收；贺工保温杯拧开又拧上（背景板首现）。\n- **E9-12 首卡**：E9 听证式验收会把他「请」出会议室，隔门一句「数据是真的，水会来对」。E10 雨后第一轮涨水，马长贵堤段出管涌——现场对质，反咬信当众反转，自证+验证双爽；集末付费墙。E11 复工表彰，马长贵领「抢工期先进」（赢一场小的、输一局更大的）。E12 雨夜复核走堤，分界桩两侧浑水点密度差第一次被镜头明确分屏，贺工蹲下摸桩号：「我看看。」\n- **E13-19 单元攻防**：四件套第一轮轮换；「先签后补」补签页摆到他面前（E15）被出击式拒签；E16 贺工当场算塌年轻技术员的「合格」结论；E18 耳朵贴堤听水教学带徒，老周口述夜施内情不敢落名。\n- **E20-24 调岗闸房**：E20 「例行归档」调走拒签存档联、当众收章调岗（两级贬法第一步），雨靴挂上仓库钥匙串。E21 三天仓库后转发配堤头泄洪闸房——**对抗力量错误适应的起点：他们把发配地选成了全剧钟楼**。E23 他发现调度台账的库容参数对不上雨情（台账按「验收合格」的老资料编——围标链连水情都做过手），开始私下记《闸房水情日志》。E24 小洪峰预判：他提前 48 小时书面建议被弃，洪水如期，值班员按他留的备选方案度过——「水听他的」第一次预演。\n- **E25-30 抽检开膛**：E27 换样被抓现行（雷小雨留样标记），同集她发现自己名字已被夹进某分部联签校核页——**诱签陷阱收口【提案二·需 R2 复核位】**。E30 中点：附条件开挖只挖一处，坑底现出假齿墙——全场以为开膛=他赢，桂守成当场启动应急处置：回填、重新取样、资料补齐销项，铁证被流程吃掉。**故事模型自此改写（不是提高音量）**：他对贺工说——「挡不住了。往后我只做一件事——把每一处都写下来，等水来对账。」\n\n**名场面 A（E1 贴堤听水）**：谁=秦江海；在哪=验收会散场后的深夜堤坡（雨后）；对谁=对堤、对观众；做了什么=摘下安全帽，把耳朵贴在草皮上听水声，手按在桩号分界桩上；画面记忆点=58 岁老头侧脸贴地的剪影，身后一条黑兽般伏在夜色里的长堤，第一声雷在天边炸开。\n\n**名场面 B（E3 手电钉车·保熟吗）**：谁=秦江海；在哪=深夜堤坡卸料点；对谁=换料工头与熄了灯的卡车；做了什么=一束手电光钉住车头，蹲下抓一把新料捻开举到灯下；画面记忆点=光柱里悬浮的料粉 + 「这方混凝土，保熟吗？」。\n\n**名场面 C（E10 管涌对质）**：谁=秦江海 对 全场验收人员；在哪=雨后马长贵堤段管涌口；做了什么=把反咬信里「泄露」的渗压数据逐项对上现场实测；画面记忆点=管涌口翻浑水顶起碎石，两列数字在雨布上并排特写，念一个数，人群退半步。\n\n### 中期（E31-48）：取证总装 → 围标现形 → 蓄满待洪\n\n- **E31-40 取证总装**：雷小雨的校核页再被夹进销项附件（她被越捆越深）；E32 第一道泄洪调度令下达（空库迎峰【提案四·需 R2 复核位】），他读令发现预泄库容与台账矛盾；E33 老周书面交底夜施内情，当天被辞——证人代价；E34 实名举报换来「程序合规」受理回执（石沉大海开始）；E35 举报被驳回，依据正是 E30 销项文书，贺工把驳回卷宗留下；E36 退件批注笔迹与反咬信比对同源——桂守成浮出；E38 表彰会歌舞被雷小雨一句「堤还没验」摁停；E39 闸房清点：重抄底单、双份照片、渗压记录并册——**「堤段病历本」11 处成形**（桩号—缺陷—日期—要求一一对应）。\n- **E41-48 围标蓄满**：E41 台风生成、路径命中流域上游——抢工期与抢验收双钟同拨；E42 资料站调走闸房日志未遂，雷小雨的存档副本救证，「求锤得锤」，调包笔迹落到桂守成；E43 冯有德被推到前台开「集体决定」扩大化签名会（E58 逐页拆解在此上膛）；E44-45 停职审查、收闸房钥匙——钟楼被收走，他交出钥匙串，只留下雨靴；E46 雷小雨与老周暗续水情日志，贺工把病历本副本正式登记进复核卷（制度容器藏火种）；E48 复职令未下，他被「责令离堤」，把病历本誊清三份各归其位（贺工复核卷 / 闸房夹层 / 随身）：「等水来，这就是判词。」台风夜第一声雨——压抑蓄满。\n\n**名场面 D（E30 开膛销项）**：谁=桂守成；在哪=齿墙基坑边；对谁=全场与秦江海；做了什么=假齿墙断面前当众启动应急处置，一锹锹土把铁证埋回去；画面记忆点=坑底断面的偷工痕迹与回填土方同框，秦江海站在坑沿没有喊，只把图纸折好塞回怀里。\n\n### 终局（E49-60）：洪峰验证 → 问责清算\n\n- **E49-56 洪峰**：E49 一号洪峰编号，转移启动——只拍秩序（手电列队、沙袋传递、雨衣背影，零伤亡零呼救）；他冒雨折返堤上巡堤查险。E50 调度令开闸时刻与台账库容矛盾爆发：按令开闸=下游险工段雪上加霜，不开=闸体超限上游漫灌——互不兼容均有代价。他以终身责任签下**迟开闸 4 小时错峰**责任状：说了一辈子「这单我不签」，这一次一个字没说——笔帽敲三下，落笔（全剧唯一一次主动落笔）。E51-52 病历本变部署图：拒签记录=抢险地图，标记管涌群、预置沙袋、分流抢护——他的留痕第一次直接救人；贺工带复核组到场终审取证。E53 **全剧主反转·一堤两制终验**：同一水位下分屏，出险 8 处全部落在他记录的 11 处之内（另 3 处未出险，如实呈现质量是概率，禁天罚式精准巧合）；险情最重的一处，恰是当年异议被驳回、人被调岗没拦成的桩段——他的自责。E54 出险清单=签收清单（回旋镖）。E55 闸开错峰，洪峰过境，水位刻度由爬升转回落——全剧钟走完。E56 水退，雨靴在退水里浮起，他捞起来抱在怀里。\n- **E57-60 问责清算**：E57 问责会前夜，出险堤段清单与各段联签页并置，「施工队是临时的」甩锅被终身责任制条款当场钉死；E58 清算名单逐页念（连坐顺序见第三节）；E59 竣工永久性标牌：五方名字上碑——碑既刻功也刻债，他把重险桩段列为返工首位并自请连责；E60 复职令被他换成驻段质检申请（不写成励志逆袭），「**这单我签。**」——全剧唯一一次说出这句话；雷小雨接过钢卷尺；他再次贴堤听水。水面平静，刻度归零。\n\n**名场面 E（E50 无声落笔）**：谁=秦江海；在哪=闸房调度令前；对谁=对自己三十年；做了什么=笔帽敲三下，一个字没说，签下迟开闸 4 小时错峰责任状；画面记忆点=落笔瞬间闸下出流声炸响，开度表指针颤动。\n\n**名场面 F（E53 一堤两制终验）**：谁=洪峰（执行者）；在哪=同一条堤、同一水位；做了什么=水位线两侧干湿两色分屏，出险点位与他病历本的桩号一一重合；画面记忆点=病历本摊在堤防图上，一枚枚桩号钉子般压住出险标记。\n\n**名场面 G（E58 逐页念名单）**：谁=秦江海；在哪=问责会长桌；对谁=冯有德们；做了什么=把被撕后重抄的一摞拒签单推过桌面，一页对一段逐页念；画面记忆点=每念一页，长桌另一侧有一个人低下头去。\n\n---\n\n## 五、前三集初稿（分拍，B 拍三件套）\n\n> 规范：每集 9-12 拍、每拍 6-15 秒、单集 1-1.5 分钟（600-900 字剧本量）；每拍=【0-3秒】（仅各集首拍）/分镜/台词/表演/尾钩五件；每拍一个认知更新；受辱→回击 ≤2 拍；口癖每集 ≥1、前三集变奏 3 次；每集 ≥1 可独立切片梗点。\n\n### 第 1 集〈这单我不签〉（景一 验收会议室 → 景二 堤坡）\n\n本集主认知更新：全项目部只有他不签。切片梗点：扫地僧伏笔（奖章）＋独拒签。集末卡点：情绪型（雷声上弦）。\n\n- **拍1｜【0-3秒】拒签（约9秒）**\n  - 分镜：长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。特写：笔帽在图纸桩号上敲三下。\n  - 台词：秦江海（不看人，平静）：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」\n  - 表演：他念桩号像念了三十年；全场回头，别人的笔悬在半空；左胸口袋褪色劳模奖章入画一角。\n  - 尾钩：冯有德的文件夹「啪」按上桌面——他要做的第一件事，是让这个老头变成少数。\n- **拍2（约8秒）**\n  - 分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处，推过去，指节敲在数字上。\n  - 台词：冯有德（低声）：「全签了，就差你。」／秦江海：「压实度不够，数字在这儿。要钻芯，钻给他们看。」\n  - 表演：冯有德眼珠先看左右再看纸（签字前先看左右的小动作首建）；秦江海坐着没动，声音不大，会议室却静。\n  - 尾钩：后排一声嗤笑——马长贵登场。\n- **拍3（约9秒）**\n  - 分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录「啪」拍在桌上。\n  - 台词：马长贵：「老秦，你这是挡大家财路！」／雷小雨：「图纸上没有这个数，原始记录我念给大家听？」\n  - 表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。\n  - 尾钩：哄笑卡在喉咙里——秦江海开口了。\n- **拍4（约10秒）**\n  - 分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。\n  - 台词：秦江海：「签了，我把三十年押给你；不签，下游几万人押给他们？」\n  - 表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。\n  - 尾钩：冯有德举起手：「表决。」\n- **拍5（约9秒）**\n  - 分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。\n  - 台词：冯有德：「少数服从多数。」／桂守成（淡淡）：「程序上，就差这一笔了。」\n  - 表演：举手的人不看他，看桌面；秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。\n  - 尾钩：他不接——他起身了。\n- **拍6（约8秒）**\n  - 分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。\n  - 台词：秦江海（在门口停半步，不回头）：「堤修给水看的，不是修给举手看的。」\n  - 表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。\n  - 尾钩：马长贵冲他背影扬声撂话——\n- **拍7（约8秒）**\n  - 分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。\n  - 台词：马长贵：「老秦，是你的章硬，还是我的路子硬？」／秦江海（把烟原样插回他胸袋）：「汛期会替我试。」\n  - 表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。\n  - 尾钩：他没回宿舍，拐上了大堤。\n- **拍8（约11秒）**\n  - 分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水——**名场面①海报级**。\n  - 台词：（无台词，只有水声一层层近。）\n  - 表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。\n  - 尾钩：他顺着堤走到一根桩号碑前——\n- **拍9（约10秒）**\n  - 分镜：手指划过分界桩刻字：桩号 3+960。镜头左右摇：一侧坡面(new填筑)扎实色深，另一侧草皮下水渍成片——**一堤两制第一集露脸**（他拒签的段与别人签收的段第一次同框）。\n  - 台词：秦江海（对堤，像对故人）：「老伙计，他们把你签出去了。」\n  - 表演：手指在桩号上停了很久。\n  - 尾钩：天边一声闷雷——\n- **拍10｜集末卡点·情绪型（约9秒）**\n  - 分镜：乌云压着河面推过来，雷声滚过堤顶；大远景：一条长堤、一个老头的剪影。字幕卡：汛期第一天。\n  - 台词：秦江海（抬头看天，轻声）：「要来水了。」\n  - 表演：他不躲雨，反而往堤上又走了一步。\n  - 尾钩（下集钩）：这一张没人敢接的拒签单，能挂到水来吗？\n\n**本集体检**：爆点 5（独拒签反常钩 / 对撞拍记录 / 金句变奏①+奖章 / 贴堤听水名场面+一堤两制同框 / 雷声上弦）；口癖 1 次＋变奏①；水 ✓（河面、听水、雷雨）；卡点体检——观众必须看下一集，因为拒签单刚被表决围攻、雷已响，他的「不签」挂不挂得住、水几时来，两问都未答。\n\n### 第 2 集〈水不要你觉得〉（景三 项目部办公区·档案室）\n\n本集主认知更新：他们要的不是他签字，是他消失。切片梗点：「我不要你觉得」×「水不要你觉得」。集末卡点：情绪型（钢卷尺）。\n\n- **拍1｜【0-3秒】摘牌（约8秒）**\n  - 分镜：两个工人抬着办公桌穿过走廊，桌上图纸滑到地；「总工程师」门牌被一把摘下；桌子落位——档案室角落，正对整墙旧临江圩地形图。\n  - 台词：工人甲（嘟囔）：「秦总工，先在这儿委屈委屈。」\n  - 表演：秦江海进门看了一眼位置，先扶正桌角，再捡图纸——像搬家的是别人。\n  - 尾钩：门口有人鼓了两下掌——冯有德来了。\n- **拍2（约9秒）**\n  - 分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。\n  - 台词：冯有德：「签个字，大家都省事。我不要你觉得，我要你觉得。」\n  - 表演：他说话时眼睛看墙上的地形图，不看人（心虚）。\n  - 尾钩：秦江海拿起了那支只画水位线的笔——\n- **拍3（约9秒）**\n  - 分镜：秦江海转身面向地形图，沿着图上历史洪水位线缓缓描一道，笔尖不抖。\n  - 台词：秦江海（头也不回）：「**水不要你觉得。**」\n  - 表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。\n  - 尾钩：走廊传来脚步与递烟的笑——马长贵带人堵门。\n- **拍4（约9秒）**\n  - 分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。\n  - 台词：马长贵：「老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。」\n  - 表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，动作不快不慢。\n  - 尾钩：人群里有人不耐烦要进门——一只全站仪横了过来。\n- **拍5（约9秒）**\n  - 分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。\n  - 台词：雷小雨：「这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。」\n  - 表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。\n  - 尾钩：马长贵刚要开口，冯有德先软了——\n- **拍6（约8秒）**\n  - 分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。\n  - 台词：冯有德：「再研究研究。……对了，复审组下周进场，你自己掂量。」（信息钩·伏 E8）\n  - 表演：退到门口顿了半步，像想补一句狠话，终究没说。\n  - 尾钩：人散尽，档案室只剩秦江海一个人。\n- **拍7（约10秒）**\n  - 分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边（清算物件·雨靴首次亮相）。\n  - 台词：（无台词。）\n  - 表演：擦靴子的手势像在擦一块碑。\n  - 尾钩：他把联签单副本铺平在桌上——\n- **拍8（约9秒）**\n  - 分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，「咔」锁定。\n  - 台词：秦江海（对着空档案室，更狠）：「这一单，我还不签。」（口癖变奏②）\n  - 表演：说给空屋子听，比说给人听更硬。\n  - 尾钩：尺带在他掌心勒出一道白印——\n- **拍9（约9秒）**\n  - 分镜：钢卷尺「啪」拍在联签单副本上，纸角跳起。\n  - 台词：秦江海：「量堤可以。量人心，你们不够长。」\n  - 表演：说完才觉掌心疼，摊开看了一眼，笑了笑。\n  - 尾钩：窗外第一滴雨打在玻璃上——\n- **拍10｜集末卡点·情绪型（约9秒）**\n  - 分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。\n  - 台词：（无台词，雨声渐密。）\n  - 表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么（伏·「抄三份」）。\n  - 尾钩（下集钩）：复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。\n\n**本集体检**：爆点 5（摘牌反常 /「水不要你觉得」对撞 / 全站仪拦门 / 复审组风声信息钩 /「量人心不够长」+卷尺）；口癖变奏② ✓；水 tick ✓（描水位线+窗雨，实体水 E3 补足）；卡点体检——下一集必须看：夜里卡车干什么？他深夜在抄什么？\n\n### 第 3 集〈这方混凝土，保熟吗〉（景二 堤段工地·夜 → 景一 验收会议室）\n\n本集主认知更新：偷工实锤与受辱顶点同场对撞，他当场验了、当场被撕、当场回敬。切片梗点：「偷感」钉车＋「保熟吗」。集末卡点：情绪+信息型（捡碎纸）。\n\n- **拍1｜【0-3秒】钉车（约9秒）**\n  - 分镜：夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光「啪」钉住车头，光柱里料粉飞舞（「偷感」名场面开场）。\n  - 台词：秦江海（画外，声音不大）：「几点了，还在卸料。」\n  - 表演：光柱里所有人定格如标本；工头的笑僵在半张脸。\n  - 尾钩：工头小跑下来打圆场——\n- **拍2（约8秒）**\n  - 分镜：工头搓着手凑近，手电光柱从车头移到他脸上。\n  - 台词：工头：「秦总工，夜里凉，您回吧——这不是赶工期嘛。」\n  - 表演：挡在料袋前的身体语言比嘴诚实。\n  - 尾钩：秦江海没理他，径直蹲向新卸的料堆——\n- **拍3（约9秒）**\n  - 分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。\n  - 台词：秦江海：「**这方混凝土，保熟吗？**」（切片位）\n  - 表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。\n  - 尾钩：工头张了张嘴——车门开了。\n- **拍4（约9秒）**\n  - 分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。\n  - 台词：马长贵：「老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！」——（正确的理由干错误的事）\n  - 表演：声音抬得越高，眼睛越不看料堆。\n  - 尾钩：秦江海不接话，直起身朝堤顶喊——\n- **拍5（约8秒）**\n  - 分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。\n  - 台词：秦江海：「小雨——取样。当着大家的面。」\n  - 表演：工人群像里有人下意识后退半步。\n  - 尾钩：仪器滴一声——数字出来了。\n- **拍6（约10秒）**\n  - 分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆（小验证·爽点）。\n  - 台词：雷小雨：「快测结果，低于设计标号。原始样我封了，双份！」\n  - 表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。\n  - 尾钩：马长贵撂下一句——「明天验收会上说。」\n- **拍7（约9秒）**\n  - 分镜：次日，验收会议室（景一）。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。\n  - 台词：冯有德：「私留底稿、扰乱验收秩序。这种风气，必须刹。」\n  - 表演：他撕纸前先看左右（小动作复现）。\n  - 尾钩：纸，碎了。\n- **拍8（约9秒）**\n  - 分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（流程上撕不掉·伏笔特写半秒）。\n  - 台词：（撕纸声独占两秒，全场无声。）\n  - 表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。\n  - 尾钩：他开口了——当拍回击——\n- **拍9（约10秒）**\n  - 分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场（受辱→回击时差 1 拍）。\n  - 台词：秦江海：「撕吧。这单我不签——**每一页我都抄了三份。**」（口癖变奏③+切片位）\n  - 表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。\n  - 尾钩：桂守成低头在会议记录上写批注，笔迹特写一秒（伏·E36 笔迹比对）。\n- **拍10（约8秒）**\n  - 分镜：冯有德趁势合卷：「验料结果，另行核议。散会。」——检出来的假，被留在议程之外。\n  - 台词：雷小雨（低声）：「验了等于白验？」／秦江海：「不。他们欠了一笔，签了字就生利息。」\n  - 表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。\n  - 尾钩：散会，暴雨正好砸下来——\n- **拍11（约11秒）**\n  - 分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒（清算物件·雨靴+「抄三份」双伏笔落位）。\n  - 台词：（无台词，只有雨声。）\n  - 表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。\n  - 尾钩：他站起身，望向河面——\n- **拍12｜集末卡点·情绪+信息型（约10秒）**\n  - 分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。\n  - 台词：秦江海：「水位涨一格，你们就多欠我一页。」（雷声吞尾）\n  - 表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。\n  - 尾钩（下集钩）：复审组进场第一天，桌上立的第一份材料——是一封举报秦江海「泄露工程数据」的反咬信。\n\n**本集体检**：爆点 6（钉车反常钩 / 保熟吗 / 快测当众念 / 当拍回击抄三份 / 「另行核议」敌进一分 / 捡碎纸金句卡点）；口癖变奏③ ✓；受辱→回击时差 1 拍 ✓；水 ✓（夜雨、暴雨、雨靴）；小验证当场验料 ✓（R1 读者条件 1）；卡点体检——下一集必须看：反咬信从哪来？他抄的三份在哪、谁会看到？被「合法」放过的假堤段，涨水后先出事的会是哪一段？\n\n---\n\n## 六、监管自检与约束对账（A 组正稿附件）\n\n### 6.1 总编位四条自查\n\n- [x] **爆点对标制**：首卡 E10 与对标件同位爆点对位（死局→当场复原数据 ⇄ 听证死局→管涌现场当场对数），强度不降；每集爆点见第五节各集体检栏与第三节密度表。\n- [x] **钩子生理测试**：开篇 3 秒 = 独拒签反常+冲突（第一节「开篇 3 秒设计」），零铺垫。\n- [x] **名场面可视化**：名场面 A-G 均按「谁 / 在哪 / 对谁 / 做了什么 / 画面记忆点」五要素写成，可直接当分镜需求。\n- [x] **全剧爆点分布图**：第三节密度表逐单元标注爆点与垫场；无连续 5 集无爆点段；两大卡点间中型爽点 ≥2。\n\n### 6.2 A/B 计量回填（报 R3 门，与基线并表）\n\n| 计量列 | 基线值（B 组） | 本稿值（A 组） |\n| --- | --- | --- |\n| 前三集爆点计数 | 2 / 集 | E1=5，E2=5，E3=6 |\n| 口癖变奏（前三集） | 1 次 | 3 次（变奏① E1 拍4 / ② E2 拍8 / ③ E3 拍9） |\n| 受辱→回击时差 | E3 隔 3 拍 | E3 同场 1 拍（拍8→拍9） |\n| 前三集分拍粒度 | 每集 5 拍大纲级要点 | 每集 10/10/12 拍，拍级五件套齐 |\n\n### 6.3 监理位·约束移交单 C1-C10 逐条对账\n\n| 条 | 落实 | 判 |\n| --- | --- | --- |\n| C1 | CN 竖屏付费口径；男频实事爽剧；尊严刻度贯穿（终局驻段质检非高升复职） | ✓ |\n| C2 | 60 集 × 1-1.5 分钟 × 单集 ≤1200 字；前三集每拍 6-15 秒、每集 9-12 拍 | ✓ |\n| C3 | 主场景 3（验收会议室 / 堤段工地含堤坡闸房 / 项目部办公区含资料室仓库角）；有名有姓 7；核心 5 | ✓ |\n| C4 | ①零架空术语（终身责任制/空库调度皆公共语汇，验证动作全部画面化）②零重生先知（全靠事前留痕）③零团宠/真假千金/强爱情线（雷小雨纯师徒，显式声明）④零财富皮⑤零多层马甲（E58 物件式单点揭示）⑥三分钟测试过（E1 拍1-2 三身份齐亮相） | ✓ |\n| C5 | 全稿零真实机构名/责任人（项目部/复核组/监理/上级单位皆通称，围标链称「一条龙」）；自造专名 2（清川河、临江圩，余量 1），前三章 ≤2（临江圩、清川河，均地名类）；真实灾害只作情绪举证；零伤亡消费；不喊口号；落点问责与守护 | ✓ |\n| C6 | 首卡 E10 当众验证（8-12 窗内）；E1 独拒签 / E2 施压对撞 / E3 夜查受辱顶点+集尾连本带利伏笔 | ✓ |\n| C7 | 主锚「较真者的憋屈 × 汛期防洪焦虑」；三圈戏剧钟（气象/调度/水位）；四件套轮换；因果可归因（11 处记录-8 处出险-3 处未出险）；主角主动性（拒签三要素出击；洪峰三动作：折返巡堤/责任状/病历本部署） | ✓ |\n| C8 | 每集 ≥1 切片梗点（E1 独拒签+奖章 / E2 水不要你觉得 / E3 保熟吗+偷感）；口癖每集 ≥1、3 集 3 变奏；16 条热梗全量挂接按结构宪法 7.5 表执行 | ✓ |\n| C9 | 清算可见可数：拒签单/水位线对照/刻名碑+雨靴（4 件）；E10 强度对标同位爆点 | ✓ |\n| C10 | 设定来源声明：实事新闻做底子（终身责任制+国债除险加固+汛期问责+病险水库主汛期空库运行，C 级可核实）；大白话标题检验过（「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」） | ✓ |\n\n### 6.4 R1/R2 门条件与两提案复核位\n\n- [x] R1 读者条件 1：E3 小验证（「保熟吗」当场验料，拍3-拍6）——受辱不连续铺满（E3 小赢、E5 留痕、E16/E24 垫场）。\n- [x] R1 读者条件 2：看得见的水每三集一次（第三节预扫表，任意缺口 ≤2 集）。\n- [x] R1 读者条件 3：一堤两制分屏 E1 露脸（拍9 分界桩同框）→ E12 点题 → E53 终验。\n- [x] **提案二「她的名字进了签字链」（诱签变体）**：已按结构宪法融入（E7 谈话伏 → E27 收口 → E31 加深 → E42 救证 → E58 作证）；**保留【需 R2 复核】标注**——变体未过四视角原判，控制线：雷小雨单集 ≤2 拍、每场服务该集唯一主认知更新；R1-B 原案（徒弟泄密者）不取，记录在案供 R3 对照。\n- [x] **提案四「空库令」调度钟**：已按结构宪法融入（E22 钟楼就位 → E32 首令 → E41 双钟同拨 → E50 危机总开关）；**保留【需 R2 复核】标注**——纪律：调度术语全部画面化（开度表/刻度/令单），禁台词讲解；剧内通称，不对应任何真实调度机构与真实调度事件。\n\n### 6.5 伤亡红线三则（全稿含名场面清单适用）\n\n1. **水的威力物证化**：水位刻度一格一格爬、管涌口翻浑水顶起碎石、坡面渗水、闸下出流、雨靴浮起——水的「大」用声音与刻度表达，零惨状。\n2. **人员镜头纪律**：转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影）；全稿零遇难、零伤情特写、零呼救、零寻人启事道具；群演台词零伤亡内容。\n3. **零决口设计**：最大险情写到「出险抢护」级（管涌群、滑坡预兆）；E54 切片双关「这次塌的是真的」画面为出险渗漏抢护，非垮塌惨状；九八前史闪回只拍雨夜背影与遗物，零灾情画面、零指认真实工程。\n\n### 6.6 其他自检\n\n- [x] 可写性三问：人设记忆点 AI 出图可画（工装两笔一尺一靴一奖章/胶带安全帽/保温杯）；单元模板可换皮 20 次（四件套×5 验证物）；名场面 A-G 可直当分镜需求。\n- [x] 与结构宪法同源：五宏节点集域、核心 5+扩展 2、三层反派、清算顺序、两提案复核位未偏离；对基线的修订按表 2.0-A 修订后状态执行（撕的是底稿非存档联、两级贬法 E20/E21、开膛前移 E30、E8 起贺工进场）。\n- [x] 自造专名盘点：清川河、临江圩（2 个，全为地名类，余量 1）；全稿零真实机构名、零真实责任人；零伤亡消费。\n- [x] 未读取 projects/_archive/ 下任何内容；无任何 git 操作。\n\n*依据：skills/topic-proposal（五节结构）；script-drama-beat（分拍硬格式）；topic-chief-aesthetic（总编四条）；故事框架案@2026-09-16；选题分析报告·约束移交单 C1-C10@2026-09-16；选题方案-爽版-基线@2026-09-16；梗卡@2026-09-16；热点素材@2026-09-16。本件为 S3 全量爽版正稿，A/B 计量值待与基线并表报 R3 门。*\n"}}], "miniguided": [{"round": 1, "ts": "2026-09-15T23:58:53.297Z", "note": "submit r1", "content": {"小纲-第1-3集.md": "# 《守堤人》小纲 · 第 1-3 集（S4 批注载体）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：scene-screenwriter（小纲师）· scene-breakdown 技能 · miniguide 节点\n- 生成日期：2026-09-16\n- 输入件：选题方案.md 第五节「前三集初稿（分拍）」（派生源）；故事框架案.md（汛期三圈钟、伏笔位、口癖变奏表 7.4）；skills/scene-breakdown.md（达意纪律、每集 9-12 分镜、每镜一个认知更新、文末创作思路页）\n- 禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n- 格式说明（导出器对齐）：每拍 `**B编号｜钩型｜时长**`；编号全三集连续（B0001-B0032）；每集仅首拍带【0-3秒】开篇画面行；钩型四型 = 反常／冲突／悬念／情绪（第一集首拍钩型 = 反常）；备注字段为内部坐标（伏笔回收位/梗点/红线标记），供批注锚定\n\n---\n\n## 第一集《这单我不签》\n\n> 本集速览：主认知更新——全项目部只有他不签。切片梗点：独拒签＋扫地僧奖章伏笔。集末卡点：情绪型（雷声上弦）。口癖首现＋变奏①。水 tick：河面、听水、雷雨。景一 会议室 → 景二 堤坡。\n\n**B0001｜反常｜9秒**\n\n【0-3秒】验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。\n分镜：特写笔帽在图纸桩号上敲三下，他念桩号不看人，全场回头，别人的笔悬在半空。\n台词：秦江海：\"3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。这单我不签。\"\n表演：念桩号像念了三十年；左胸口袋褪色劳模奖章入画一角。\n尾钩→ 冯有德的文件夹\"啪\"按上桌面——他要做的第一件事，是让这个老头变成少数。\n备注：口癖首现；拒签三要素出击（部位+缺陷+要求）；奖章伏笔（E10 扫地僧梗兑现位）。\n\n**B0002｜冲突｜8秒**\n\n分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处推过去，指节敲在数字上。\n台词：冯有德：\"全签了，就差你。\"／秦江海：\"压实度不够，数字在这儿。要钻芯，钻给他们看。\"\n表演：冯有德眼珠先看左右再看纸（小动作首建）；秦江海坐着没动，会议室却静。\n尾钩→ 后排一声嗤笑——马长贵登场。\n备注：承接拍1——因为有人开了头，施压与帮腔才接得上。\n\n**B0003｜冲突｜9秒**\n\n分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录\"啪\"拍在桌上。\n台词：马长贵：\"老秦，你这是挡大家财路！\"／雷小雨：\"图纸上没有这个数，原始记录我念给大家听？\"\n表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。\n尾钩→ 哄笑卡在喉咙里——秦江海开口了。\n备注：三分钟测试收口——修堤的、偷工的、不签的三身份齐亮相。\n\n**B0004｜情绪｜10秒**\n\n分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。\n台词：秦江海：\"签了，我把三十年押给你；不签，下游几万人押给他们？\"\n表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。\n尾钩→ 冯有德举起手：\"表决。\"\n备注：口癖变奏①（金句）；奖章特写为 E10 群演低语\"扫地僧\"埋点。\n\n**B0005｜冲突｜9秒**\n\n分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。\n台词：冯有德：\"少数服从多数。\"／桂守成（淡淡）：\"程序上，就差这一笔了。\"\n表演：举手的人不看他，看桌面；秦江海看那张单子，像看一样烫手的东西被人往怀里塞。\n尾钩→ 他不接——他起身了。\n备注：桂守成\"按程序办\"面孔暗起（三层反派第三层伏笔）。\n\n**B0006｜情绪｜8秒**\n\n分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。\n台词：秦江海（门口停半步，不回头）：\"堤修给水看的，不是修给举手看的。\"\n表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。\n尾钩→ 马长贵冲他背影扬声撂话——\n备注：会议室他输，节奏转场去堤上赢——受辱不铺满的第一闸。\n\n**B0007｜冲突｜8秒**\n\n分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。\n台词：马长贵：\"老秦，是你的章硬，还是我的路子硬？\"／秦江海（把烟原样插回他胸袋）：\"汛期会替我试。\"\n表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。\n尾钩→ 他没回宿舍，拐上了大堤。\n备注：马长贵口癖\"规矩是死的，人是活的\"留到 E2 用，本集只立递烟动作。\n\n**B0008｜情绪｜11秒**\n\n分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水。\n台词：（无台词，只有水声一层层近。）\n表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。\n尾钩→ 他顺着堤走到一根桩号碑前——\n备注：名场面①贴堤听水（海报级切片位）；水 tick。\n\n**B0009｜悬念｜10秒**\n\n分镜：手指划过分界桩刻字\"桩号 3+960\"；镜头左右摇：一侧坡面扎实色深（新填筑），另一侧草皮下水渍成片。\n台词：秦江海（对堤，像对故人）：\"老伙计，他们把你签出去了。\"\n表演：手指在桩号上停了很久。\n尾钩→ 天边一声闷雷——\n备注：一堤两制分屏 E1 露脸（R1 条件 3；E12 点题、E53 终验的第一颗钉子）。\n\n**B0010｜悬念｜9秒**\n\n分镜：乌云压着河面推过来，雷声滚过堤顶；大远景一条长堤、一个老头的剪影。字幕卡：汛期第一天。\n台词：秦江海（抬头看天，轻声）：\"要来水了。\"\n表演：他不躲雨，反而往堤上又走了一步。\n尾钩（下集钩）→ 这一张没人敢接的拒签单，能挂到水来吗？\n备注：集末卡点·情绪型；雷声第一响 = 全剧三圈钟上弦。\n\n---\n\n## 第二集《水不要你觉得》\n\n> 本集速览：主认知更新——他们要的不是他签字，是他消失。切片梗点：\"我不要你觉得\"×\"水不要你觉得\"。集末卡点：情绪型（钢卷尺）。口癖变奏②。水 tick：描水位线＋窗雨（实体水 E3 夜雨补足）。景三 办公区·档案室。\n\n**B0011｜反常｜8秒**\n\n【0-3秒】两个工人抬着办公桌穿过走廊，桌上图纸滑到地；\"总工程师\"门牌被一把摘下；桌子落位档案室角落，正对整墙旧临江圩地形图。\n分镜：桌子落定，秦江海进门看一眼位置，先扶正桌角，再捡图纸。\n台词：工人甲（嘟囔）：\"秦总工，先在这儿委屈委屈。\"\n表演：像搬家的是别人，不是他。\n尾钩→ 门口有人鼓了两下掌——冯有德来了。\n备注：调岗边缘化（四件套之四）预演；承接 E1 拒签的代价即刻兑现。\n\n**B0012｜冲突｜9秒**\n\n分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。\n台词：冯有德：\"签个字，大家都省事。我不要你觉得，我要你觉得。\"\n表演：说话时眼睛看墙上的地形图，不看人（心虚）。\n尾钩→ 秦江海拿起了那支只画水位线的笔——\n备注：梗 7 前半；师父遗物笔首用于对撞。\n\n**B0013｜情绪｜9秒**\n\n分镜：秦江海转身面向地形图，沿图上历史洪水位线缓缓描一道，笔尖不抖。\n台词：秦江海（头也不回）：\"水不要你觉得。\"\n表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。\n尾钩→ 走廊传来脚步与递烟的笑——马长贵带人堵门。\n备注：梗 7 后半，本集对撞主句；水 tick（水位线）。\n\n**B0014｜冲突｜9秒**\n\n分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。\n台词：马长贵：\"老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。\"\n表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，不快不慢。\n尾钩→ 人群里有人不耐烦要进门——一只全站仪横了过来。\n备注：马长贵口癖首用；群像压迫位。\n\n**B0015｜冲突｜9秒**\n\n分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。\n台词：雷小雨：\"这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\"\n表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。\n尾钩→ 马长贵刚要开口，冯有德先软了——\n备注：盟友立住；她的台词同款是 E27 诱签线的人格底色。\n\n**B0016｜悬念｜8秒**\n\n分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。\n台词：冯有德：\"再研究研究。……对了，复审组下周进场，你自己掂量。\"\n表演：退到门口顿了半步，像想补一句狠话，终究没说。\n尾钩→ 人散尽，档案室只剩秦江海一个人。\n备注：信息钩伏 E8（复审组进场第一份立案是反咬信）；冯有德口癖\"再研究研究\"。\n\n**B0017｜情绪｜10秒**\n\n分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边。\n台词：（无台词。）\n表演：擦靴子的手势像在擦一块碑。\n尾钩→ 他把联签单副本铺平在桌上——\n备注：清算物件·雨靴首次亮相（E58 防水袋底单交档的远伏）。\n\n**B0018｜情绪｜9秒**\n\n分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，\"咔\"锁定。\n台词：秦江海（对着空档案室）：\"这一单，我还不签。\"\n表演：说给空屋子听，比说给人听更硬。\n尾钩→ 尺带在他掌心勒出一道白印——\n备注：口癖变奏②；钢卷尺量的是他拒签的那一段。\n\n**B0019｜情绪｜9秒**\n\n分镜：钢卷尺\"啪\"拍在联签单副本上，纸角跳起。\n台词：秦江海：\"量堤可以。量人心，你们不够长。\"\n表演：说完才觉掌心疼，摊开看了一眼，笑了笑。\n尾钩→ 窗外第一滴雨打在玻璃上——\n备注：集内金句切片位。\n\n**B0020｜悬念｜9秒**\n\n分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。\n台词：（无台词，雨声渐密。）\n表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么。\n尾钩（下集钩）→ 复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。\n备注：抄写动作伏\"抄三份\"（E3 拍9 说破、E58 清算名单兑现）；集末卡点·情绪型。\n\n---\n\n## 第三集《这方混凝土，保熟吗》\n\n> 本集速览：主认知更新——偷工实锤与受辱顶点同场对撞：当场验了、当场被撕、当场回敬。切片梗点：\"偷感\"钉车＋\"保熟吗\"。集末卡点：情绪+信息型（捡碎纸）。口癖变奏③；受辱→回击时差 1 拍。景二 堤段工地·夜 → 景一 会议室。\n\n**B0021｜反常｜9秒**\n\n【0-3秒】夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光\"啪\"钉住车头，光柱里料粉飞舞。\n分镜：光柱从车头缓缓扫过挡板与料袋，所有人定格如标本。\n台词：秦江海（画外，声音不大）：\"几点了，还在卸料。\"\n表演：工头的笑僵在半张脸。\n尾钩→ 工头小跑下来打圆场——\n备注：名场面②手电钉车开场；梗 13\"偷感\"；承接 E2 集末卡车钩。\n\n**B0022｜冲突｜8秒**\n\n分镜：工头搓着手凑近，手电光柱从车头移到他脸上。\n台词：工头：\"秦总工，夜里凉，您回吧——这不是赶工期嘛。\"\n表演：挡在料袋前的身体语言比嘴诚实。\n尾钩→ 秦江海没理他，径直蹲向新卸的料堆——\n备注：承接拍1——先拦人，再看料。\n\n**B0023｜反常｜9秒**\n\n分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。\n台词：秦江海：\"这方混凝土，保熟吗？\"\n表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。\n尾钩→ 工头张了张嘴——车门开了。\n备注：梗 16\"这瓜保熟吗\"变体；切片位；R1 小验证起点。\n\n**B0024｜冲突｜9秒**\n\n分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。\n台词：马长贵：\"老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\"\n表演：声音抬得越高，眼睛越不看料堆。\n尾钩→ 秦江海不接话，直起身朝堤顶喊——\n备注：有理由的错误选择——他在跟汛期赛跑（对立统一不写成纯坏）。\n\n**B0025｜悬念｜8秒**\n\n分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。\n台词：秦江海：\"小雨——取样。当着大家的面。\"\n表演：工人群像里有人下意识后退半步。\n尾钩→ 仪器滴一声——数字出来了。\n备注：验证动作全部画面化，零术语讲解。\n\n**B0026｜反常｜10秒**\n\n分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆。\n台词：雷小雨：\"快测结果，低于设计标号。原始样我封了，双份！\"\n表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。\n尾钩→ 马长贵撂下一句——\"明天验收会上说。\"\n备注：小验证当场验料 ✓（R1 读者条件 1：前三集小赢一口，受辱不连续铺满）。\n\n**B0027｜冲突｜9秒**\n\n分镜：次日，验收会议室。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。\n台词：冯有德：\"私留底稿、扰乱验收秩序。这种风气，必须刹。\"\n表演：他撕纸前先看左右（小动作复现）。\n尾钩→ 纸，碎了。\n备注：受辱顶点；反派升级 = 从\"驳你的数据\"到\"撕你的底稿\"。\n\n**B0028｜情绪｜9秒**\n\n分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（半秒特写）。\n台词：（撕纸声独占两秒，全场无声。）\n表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。\n尾钩→ 他开口了——当拍回击——\n备注：伏笔——存档联流程上撕不掉（E20\"例行归档\"调走的正是它）。\n\n**B0029｜情绪｜10秒**\n\n分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场。\n台词：秦江海：\"撕吧。这单我不签——每一页我都抄了三份。\"\n表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。\n尾钩→ 桂守成低头在会议记录上写批注，笔迹特写一秒。\n备注：口癖变奏③＋受辱→回击时差 1 拍（拍8→拍9）；\"抄三份\"上膛（E58 清算名单）；桂守成笔迹伏 E36 笔迹比对——客户如删此半秒，E36 需补埋。\n\n**B0030｜冲突｜8秒**\n\n分镜：冯有德趁势合卷宣布散会——检出来的假，被留在议程之外。\n台词：冯有德：\"验料结果，另行核议。散会。\"／雷小雨（低声）：\"验了等于白验？\"／秦江海：\"不。他们欠了一笔，签了字就生利息。\"\n表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。\n尾钩→ 散会，暴雨正好砸下来——\n备注：\"敌进一分\"位：程序吃掉议程，但账记下了。\n\n**B0031｜情绪｜11秒**\n\n分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒。\n台词：（无台词，只有雨声。）\n表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。\n尾钩→ 他站起身，望向河面——\n备注：雨靴＋\"抄三份\"双伏笔同框落位；水的威力物证化（雨声，零惨状）。\n\n**B0032｜悬念｜10秒**\n\n分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。\n台词：秦江海：\"水位涨一格，你们就多欠我一页。\"（雷声吞尾）\n表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。\n尾钩（下集钩）→ 复审组进场第一天，桌上立的第一份材料——是一封举报秦江海\"泄露工程数据\"的反咬信。\n备注：集末卡点·情绪+信息型；受辱升级为受冤（E8-E10 首卡引信）；水 tick（暴雨）。\n\n---\n\n## 创作思路页\n\n### 总说明（给批注人的坐标系）\n\n1. 本稿是选题方案第五节分拍初稿的**小纲派生件**：情节、台词、伏笔位均承自 S3 正稿，未新增情节线；小纲的任务是把每一拍拆到**可画、可拍、可批注**的粒度。台词维持\"达意即可\"，未做成品级打磨——文采、潜台词、金句微调请留在成品剧本轮，此轮改了会浪费修改轮次。\n2. 批注方法：每条意见请锚定 **B 编号**（B0001-B0032，三集连续不重号）。改某一拍的台词不会影响编号；若要求合并/拆分拍，请在批注里写明\"合并 B0005-B0006\"这类区间，回稿时我再重排编号。\n3. 钩型四型口径：**反常**（画面本身不对劲）/ **冲突**（人对人对撞）/ **悬念**（信息缺口）/ **情绪**（压出来的感受）。第一集首拍 B0001 用反常（唯一不签的人），后续每拍标注主导钩型，仅供节奏体检，不必逐拍改。\n4. 边界重申：全三集零真实机构名、零真实责任人；台风雷雨一律无名；零伤亡、零惨状，水的威力只用声音与物证（水渍、料粉、雨声、雨靴）表达。\n\n### 第一集《这单我不签》——为什么这么拆\n\n- **B0001 零铺垫直入拒签**：开篇 3 秒只给\"十几只手都在签、他的笔停了\"这一个反常，不给身份不给背景——没看过设定的人听完这拍不该问\"为什么\"，只问\"然后呢\"。拒签台词按\"部位＋缺陷＋要求\"三要素写，先立**强**再立**惨**：他是出击，不是受气。\n- **B0004 奖章特写提前半拍**：扫地僧身份碎片在金句变奏①前一秒入画，是给 E10 群演低语\"扫地僧\"预埋的视觉账。批注若嫌抢戏可后移半拍，但建议保留在 E1——它是全片唯一一次主动亮底牌。\n- **B0005-B0007 让他输掉会议室**：表决、孤立、塞烟三拍连压，但第 6 拍立刻转场堤上——受辱不给满，观众憋的那口气要在本集内找到一个出口，否则第二集会丧。\n- **B0008-B0010 把出口放在堤上**：贴堤听水（名场面①）＋分界桩两侧同框（一堤两制 E1 露脸）＋雷声上弦，三个画面动作压集尾，一句解释都没有。分界桩这颗钉子 E12 分屏点题、E53 终验收回；雷声是全剧三圈钟的第一声，观众带着\"水几时来\"进第二集。\n\n### 第二集《水不要你觉得》——为什么这么拆\n\n- **B0011 先给\"消失\"的预感**：搬桌摘牌是反派四件套之四（调岗边缘化）的预演版——第二集先让观众看清\"他们的目标不是他的签字，是他的位置\"，后面 E20 收章调岗才有量级。\n- **B0012-B0013 对撞句成对出现**：\"我不要你觉得\"（施压）与\"水不要你觉得\"（回敬）必须隔一拍内完成——这是本集唯一的主认知更新，别的拍都为它让路。师父遗物笔在此第一次用于\"画水位线\"而非写字，身份信息全靠动作，零台词讲解。\n- **B0014-B0015 群像压人、盟友立人**：递烟群像做空间压迫，雷小雨全站仪拦门做破口。她的台词\"图纸上没有这个数\"与 E27 诱签线（她的名字被夹进联签校核页）共用同一个人格底色——信数据的人最容易被签字链算计，此处不展开，只立性格。\n- **B0017-B0019 空屋独角戏是故意降速**：后半集没有对手，只剩雨靴、卷尺、掌心白印三个物件动作。雨靴是 E58 清算段\"防水袋底单交档\"的远伏；卷尺量的正是他拒签的那 140 米——物件在此攒账，客户批注时请把这组当\"记账拍\"看，删任一拍需在后文集找补。\n- **B0020 抄写的背影**：他深夜抄什么不说破，E3 拍9\"每一页我都抄了三份\"才揭晓——两集跨度的信息缺口，是本集集末卡点真正的钩。\n\n### 第三集《这方混凝土，保熟吗》——为什么这么拆\n\n- **B0021-B0026 先赢一口再挨打**：夜查当场验料是 R1 条件要求的前三集小验证。顺序刻意排成\"验料赢（B0026）→ 撕稿辱（B0027-B0028）→ 回敬（B0029）\"——观众刚尝到甜头就被打，回击才有 double 的爽；若把验证挪到撕稿之后，整集会变成纯受辱集，丧掉前三集。\n- **B0023\"保熟吗\"的反差**：专业指法配菜市场问话，笑点与寒点是同一句——寒在\"他连问都懒得跟他们正经问\"。此句是全片切片位，批注改词请保留\"保熟\"二字壳。\n- **B0028 半秒闪现存档联**：撕的是他私留的底稿，流程上撕不掉的存档联只在档案柜里闪半秒、零讲解——这是 E20\"例行归档\"调档戏的预约金。批注若觉得闪现突兀，可改为 B0031 塞雨靴时一瞥，但删除会让 E20 无根。\n- **B0029 回击时差 1 拍**：受辱（拍8）→回击（拍9）压在红线内。桂守成低头写批注的笔迹一秒特写是 E36\"反咬信笔迹比对同源\"的最早埋点，是全稿最远的一颗伏笔——删它不难，难的是 E36 重埋。\n- **B0030-B0032 账要记成利息**：\"另行核议\"让检出的假被程序留在议程外（敌进一分），B0031 捡碎纸塞雨靴把屈辱物理化为存证，B0032\"水位涨一格，你们就多欠我一页\"把汛期钟和清算账拧成同一根弦。集末反咬信一句钩，把受辱升级成受冤——E8-E10 首卡死局从这里点火。\n\n### 三集连续性自查\n\n- 拍数：E1=10 / E2=10 / E3=12，均在 9-12 区间；单集时长约 90/89/100 秒，符合 1-1.5 分钟。\n- 口癖三变奏：E1 B0001+B0004（本句＋金句变奏①）/ E2 B0018（\"这一单，我还不签\"）/ E3 B0029（\"撕吧。这单我不签——\"）。每集 ≥1 ✓，三集三变奏 ✓。\n- 水 tick：E1 河面＋听水＋雷雨；E2 水位线＋窗雨（实体水由 E3 夜雨衔接）；E3 夜雨＋暴雨＋雨靴。任意缺口 ≤2 集 ✓。\n- 三景轮换：会议室（E1）→ 档案室（E2）→ 堤坡·会议室·檐下（E3），全部落在三景集合内，换景即换集节拍。\n- 伏笔台账（本稿埋设 → 回收位）：奖章 B0004→E10；桂守成程序脸 B0005→E30/E36；复审组风声 B0016→E8；雨靴 B0017/B0031→E58；抄三份 B0020/B0029→E58；存档联 B0028→E20；桂守成笔迹 B0029→E36；反咬信 B0032→E8/E10；分界桩 B0009→E12/E53。\n- 客户如对任一拍的拆分、时长、钩型有异议，直接在 B 编号上画圈即可；情节级意见（如调换验证与撕稿顺序）请在批注中注明影响集，我在回稿中同步重排受影响的伏笔位。\n\n---\n\n*依据：skills/scene-breakdown.md（达意纪律/分镜数/思路页）；选题方案.md 第五节分拍初稿@2026-09-16（派生源，未偏离）；故事框架案.md 表 2.0-A、7.4 口癖变奏表、7.5 梗挂接表@2026-09-16。本件为 S4 批注载体，待客户批注回传后修订。*\n"}}], "first3": [{"round": 1, "ts": "2026-09-16T00:13:45.227Z", "note": "submit r1", "content": {"对外交付/04-成品剧本试稿.md": "# 《守堤人》成品剧本 · 第 1-3 集（试稿）\n\n- 项目：p-ts-001（水利题材 · 守堤人）｜对外交付件 04\n- 剖面：scene-screenwriter（成品剧本师）· script-final 技能 · final_script 节点\n- 生成日期：2026-09-16\n- 直接母本：小纲-第1-3集.md（B0001-B0032，三集结构、集末卡点、伏笔位全部承袭，未新增情节线）\n- 口径来源：选题方案.md（台词与人物口径）；故事框架案.md（汛期三圈钟、口癖变奏、伤亡红线）\n- 格式说明：场景头＋连贯行动段落＋角色台词；特殊镜头/旁白/转场/字幕卡以中括号一行一条；全稿零内部流程标注\n- 声明：全剧人物、机构、事件均为虚构（临江圩、清川河为自造地名）；未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n\n---\n\n## 第 1 集《这单我不签》\n\n场景一：临江圩除险加固项目部 · 验收会议室 · 日 · 内\n\n长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。笔传到长桌尽头，停住了。\n\n秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。\n\n[特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。]\n\n秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。\n\n会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。\n\n冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。\n\n秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。\n\n秦江海：压实度不够——说白了，填堤的土没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。钻芯复检，就是从堤身上钻一管土下来，压没压实，一量便知。数字在这儿。\n\n冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。\n\n马长贵（笑）：老秦，你这是挡大家财路！\n\n哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。\n\n雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？\n\n哄笑卡在喉咙里。缓推秦江海面部。\n\n[特写：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。]\n\n秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？\n\n马长贵脸上的笑一层层收干。冯有德举起手。\n\n冯有德：表决。\n\n手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。\n\n[特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。]\n\n桂守成（淡淡）：程序上，就差这一笔了。\n\n冯有德：少数服从多数。\n\n秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。\n\n秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。\n\n背影出门。会议室死静两秒，随即嗡地一声炸开议论。\n\n场景二：项目部楼道 · 日 · 内\n\n马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。\n\n马长贵：老秦，是你的章硬，还是我的路子硬？\n\n秦江海把烟原样插回他胸袋，脚步没停。\n\n秦江海：汛期，会替我试。\n\n马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。\n\n场景三：清川河堤段 · 堤坡 · 暮 · 外\n\n雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。\n\n[特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。]\n\n无台词。水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。\n\n[特写：桩号 3+960。]\n\n[特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。]\n\n秦江海（对堤，像对故人）：老伙计，他们把你签出去了。\n\n手指在桩号上停了很久。天边一声闷雷。\n\n[转场：乌云压着河面推过来，雷声滚过堤顶。]\n\n大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。\n\n秦江海（抬头看天，轻声）：要来水了。\n\n[字幕卡：汛期第一天。]\n\n（第一集完）\n\n---\n\n## 第 2 集《水不要你觉得》\n\n场景一：项目部办公区 · 走廊 → 档案室 · 日 · 内\n\n两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。\n\n工人甲（嘟囔）：秦总工，先在这儿委屈委屈。\n\n秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。\n\n门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。\n\n冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。\n\n秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。\n\n[特写：图例一角——「历史最高洪水位」。]\n\n秦江海（头也不回）：水，不要你觉得。\n\n描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。\n\n场景二：档案室门口 · 日 · 内\n\n门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。\n\n马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。\n\n秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。\n\n雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。\n\n雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\n\n马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。\n\n冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。\n\n他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。\n\n场景三：档案室 · 暮 · 内\n\n秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。\n\n他把联签单副本铺平在桌上。\n\n[特写：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。]\n\n秦江海（对着空档案室）：这一单，我还不签。\n\n说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。\n\n秦江海：量堤，可以。量人心——你们不够长。\n\n说完才觉出掌心疼，摊开看了一眼，笑了笑。\n\n窗外，第一滴雨打在玻璃上。\n\n[特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。]\n\n窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。\n\n[转场：雨声渐密，笔尖沙沙。]\n\n雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。\n\n（第二集完）\n\n---\n\n## 第 3 集《这方混凝土，保熟吗》\n\n场景一：清川河堤段 · 卸料点 · 夜 · 外\n\n夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。\n\n[特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。]\n\n秦江海（画外，声音不大）：几点了，还在卸料。\n\n工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。\n\n工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。\n\n他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。\n\n[特写：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。]\n\n秦江海：这方混凝土——保熟吗？\n\n捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。\n\n马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\n\n他声音抬得越高，眼睛越不看料堆。\n\n秦江海（不接他的话，直起身）：垫层垫在堤身底下，混凝土一盖，这辈子没人再看得见。规范白纸黑字——隐蔽工程要留影像。你们的影像呢？\n\n他直起身，朝堤顶喊。\n\n秦江海：小雨——取样。当着大家的面。\n\n堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。\n\n[特殊镜头：手电光从四面八方聚拢到料堆。]\n\n仪器滴一声——数字出来了。\n\n雷小雨（举着记录板，当众念）：快测结果，低于设计标号。标号，就是这方料该有的力气——它不够。原始样我封了，双份：一份送检，一份留底，谁也换不了！\n\n人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。\n\n马长贵：明天验收会上说！\n\n场景二：验收会议室 · 日 · 内\n\n次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。\n\n冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。\n\n他开口前，眼珠照例先往左右各扫了一下。纸，碎了。\n\n[特殊镜头：撕纸声独占两秒，全场无声。]\n\n[特写：半秒——档案柜里，同一份记录的存档联完好归位，标签平整。]\n\n碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。\n\n秦江海：撕吧。这单我不签——每一页，我都抄了三份。\n\n不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。\n\n[特写：那行批注的笔迹，一秒即过。]\n\n冯有德趁势合上文件夹。\n\n冯有德：验料结果，另行核议。散会。\n\n雷小雨（低声）：验了，等于白验？\n\n秦江海：不。他们欠了一笔——签了字，就生利息。\n\n人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。\n\n散会，暴雨正好砸下来。\n\n场景三：项目部楼门口 · 檐下 · 日 · 外（暴雨）\n\n雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。\n\n他捡完最后一片，站起身，望向河面。\n\n[特殊镜头：闪电照出大堤全长。]\n\n雨顺着他安全帽的帽檐往下灌，连成一道水帘。\n\n秦江海（雷声里）：水位涨一格，你们就多欠我一页。\n\n雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。\n\n[转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。]\n\n[特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。]\n\n（第三集完）\n\n---\n\n## 卡点体检（文末附页）\n\n### 第 1 集 · 卡点「雷声上弦」（情绪型）\n\n- 卡点画面与台词：贴堤听水（无台词名场面）→ 分界桩「老伙计，他们把你签出去了」→ 闷雷 → 大远景剪影 +「要来水了」+ 字幕卡「汛期第一天」。\n- 观众必须翻页的问题：这张被全员表决围攻的拒签单，挂不挂得住？水，几时来？\n- 强度自检：钩子不靠悬念信息靠压迫感——雷声是全剧三圈钟的第一声上弦，观众带着「水几时来对账」进第二集；过。\n\n### 第 2 集 · 卡点「抄写背影」（情绪型）\n\n- 卡点画面与台词：窗雨淌过他白天描的水位线 → 台灯下抄写的背影（抄什么不说破）→ 雨夜深处堤上滚过不该出现的引擎声，笔尖停了半拍。\n- 观众必须翻页的问题：他深夜在抄什么？夜里上堤的卡车，在干什么？\n- 强度自检：双钩并置——动作悬念（抄写）+ 事件悬念（夜车），情绪（孤立无援仍不签）与事件（偷工进行时）互为进气口；过。\n\n### 第 3 集 · 卡点「反咬信」（情绪 + 信息型）\n\n- 卡点画面与台词：檐下把碎纸一片片捡进雨靴 +「水位涨一格，你们就多欠我一页」→ 转场复核组进场牌 → 桌上第一份材料是举报秦江海「泄露工程数据」的信。\n- 观众必须翻页的问题：反咬信从哪来？他抄的三份在哪、谁会看到？被「另行核议」合法放过的假堤段，涨水后先出事的是哪一段？\n- 强度自检：受辱当场被回击垫住（撕稿→「抄三份」时差一拍），集尾把受辱升级为受冤，委屈感与信息缺口同时拉满；过。\n\n### 三集连续性复核\n\n- 结构：三集结构与集末卡点全部承自小纲（雷声上弦／抄写背影／反咬信），32 拍逐一扩写，未新增情节线；单集时长量级约 1.5-2 分钟成片（E3 验料场略长），符合竖屏单集体量。\n- 口癖三变奏：E1「这单我不签」＋「三十年押给你」（变奏①）／E2「这一单，我还不签」＋「水不要你觉得」（变奏②）／E3「撕吧。这单我不签——每一页我都抄了三份」（变奏③）。每集 ≥1，三集三变奏。\n- R1 条件可感知：E3「保熟吗」当场验料为实测小胜利（仪器读数当众念、封样双份、马长贵撂话退场）；一堤两制分屏在 E1 以界碑为轴左右摇、一侧扎实一侧水渍，视觉成立；看得见的水三集不断线（E1 河面/听水/雷雨，E2 描水位线/窗雨，E3 夜雨/暴雨/水帘/雨靴）。\n- 工程细节翻译件：压实度＝土没压瓷实、见水就沉；钻芯复检＝钻一管土下来一量便知；标号＝这方料该有的力气；封样双份＝一份送检一份留底谁也换不了；隐蔽工程留影像＝盖上去就看不见的东西必须留记录。全部台词内翻译，零讲解腔。\n- 合规自查：零真实机构名、零真实责任人（项目部/复核组/监理皆通称）；零伤亡、零惨状、零决口，水的威力只用声音与物证（水声、雨声、水渍、料粉、碎纸、雨靴）；灾害画面只拍秩序与物证；自造专名仅临江圩、清川河。\n- 待办交接：按 script-final 流程，本稿台词为初稿级定稿，须强制交接 dialogue-polish（台词去AI味）三遍校准后方可进下一环节。\n"}}], "polish": [{"round": 1, "ts": "2026-09-16T00:24:03.193Z", "note": "submit r1", "content": {"对外交付/03-剧本试稿.md": "# 《守堤人》剧本试稿 · 第 1-3 集（台词打磨稿）\n\n- 项目：p-ts-001（水利题材 · 守堤人）｜对外交付件 03\n- 剖面：scene-screenwriter（成品剧本师）· dialogue-polish 技能 · script_polish 节点\n- 生成日期：2026-09-16\n- 直接母本：对外交付/04-成品剧本试稿.md（三集结构、集末卡点、伏笔位零改动，仅台词与两处动作说明逐句打磨）\n- 打磨依据：skills/dialogue-polish.md 三遍校准（人物声口 → 处境 → 去AI味清单）；口吻基准＝选题方案.md 人设语言卡（秦江海口癖三变奏／马长贵递烟腔／冯有德阴柔躲责）\n- 修订留痕：台词打磨对照表.md（项目根目录，内部留痕件，不随对外交付）\n- 口径来源：选题方案.md（台词与人物口径）；故事框架案.md（汛期三圈钟、口癖变奏、伤亡红线）\n- 格式说明：场景头＋连贯行动段落＋角色台词；特殊镜头/旁白/转场/字幕卡以中括号一行一条；全稿零内部流程标注\n- 声明：全剧人物、机构、事件均为虚构（临江圩、清川河为自造地名）；未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n\n---\n\n## 第 1 集《这单我不签》\n\n场景一：临江圩除险加固项目部 · 验收会议室 · 日 · 内\n\n长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。笔传到长桌尽头，停住了。\n\n秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。\n\n[特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。]\n\n秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。\n\n会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。\n\n冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。\n\n秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。\n\n秦江海：压实度不够——填堤的土，没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。不信，钻一管土上来，一量便知。数字在这儿。\n\n冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。\n\n马长贵（笑）：老秦，你这是挡大家财路！\n\n哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。\n\n雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？\n\n哄笑卡在喉咙里。缓推秦江海面部。\n\n[特写：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。]\n\n秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？\n\n马长贵脸上的笑一层层收干。冯有德举起手。\n\n冯有德：表决。\n\n手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。\n\n[特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。]\n\n桂守成（淡淡）：程序上，就差这一笔了。\n\n冯有德：少数服从多数。\n\n秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。\n\n秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。\n\n背影出门。会议室死静两秒，随即嗡地一声炸开议论。\n\n场景二：项目部楼道 · 日 · 内\n\n马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。\n\n马长贵：老秦，是你的章硬，还是我的路子硬？\n\n秦江海把烟原样插回他胸袋，脚步没停。\n\n秦江海：汛期，会替我试。\n\n马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。\n\n场景三：清川河堤段 · 堤坡 · 暮 · 外\n\n雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。\n\n[特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。]\n\n无台词。水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。\n\n[特写：桩号 3+960。]\n\n[特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。]\n\n秦江海（对堤，像对故人）：老伙计，他们把你签出去了。\n\n手指在桩号上停了很久。天边一声闷雷。\n\n[转场：乌云压着河面推过来，雷声滚过堤顶。]\n\n大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。\n\n秦江海（抬头看天，轻声）：要来水了。\n\n[字幕卡：汛期第一天。]\n\n（第一集完）\n\n---\n\n## 第 2 集《水不要你觉得》\n\n场景一：项目部办公区 · 走廊 → 档案室 · 日 · 内\n\n两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。\n\n工人甲（嘟囔）：秦总工，先在这儿委屈委屈。\n\n秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。\n\n门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。\n\n冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。\n\n秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。\n\n[特写：图例一角——「历史最高洪水位」。]\n\n秦江海（头也不回）：水，不要你觉得。\n\n描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。\n\n场景二：档案室门口 · 日 · 内\n\n门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。\n\n马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。\n\n秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。\n\n雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。\n\n雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\n\n马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。\n\n冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。\n\n他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。\n\n场景三：档案室 · 暮 · 内\n\n秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。\n\n他把联签单副本铺平在桌上。\n\n[特写：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。]\n\n秦江海（对着空档案室）：这一单，我还不签。\n\n说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。\n\n秦江海：量堤，可以。量人心——你们不够长。\n\n说完才觉出掌心疼，摊开看了一眼，笑了笑。\n\n窗外，第一滴雨打在玻璃上。\n\n[特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。]\n\n窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。\n\n[转场：雨声渐密，笔尖沙沙。]\n\n雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。\n\n（第二集完）\n\n---\n\n## 第 3 集《这方混凝土，保熟吗》\n\n场景一：清川河堤段 · 卸料点 · 夜 · 外\n\n夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。\n\n[特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。]\n\n秦江海（画外，声音不大）：几点了，还在卸料。\n\n工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。\n\n工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。\n\n他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。\n\n[特写：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。]\n\n秦江海：这方混凝土——保熟吗？\n\n捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。\n\n马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\n\n他声音抬得越高，眼睛越不看料堆。\n\n秦江海（不接他的话）：垫层垫在堤身底下，混凝土一盖，一辈子没人看得见。规范上白纸黑字——隐蔽工程要留影像。你们的影像呢？\n\n他直起身，朝堤顶喊。\n\n秦江海：小雨——取样。当着大家的面。\n\n堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。\n\n[特殊镜头：手电光从四面八方聚拢到料堆。]\n\n仪器滴一声——数字出来了。\n\n雷小雨（举着记录板，当众念）：快测结果，低于设计标号——这方料，没长够它该有的力气。原始样我封了，双份。一份送检，一份留底，谁也换不了！\n\n人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。\n\n马长贵：明天验收会上说！\n\n场景二：验收会议室 · 日 · 内\n\n次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。\n\n冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。\n\n他开口前，眼珠照例先往左右各扫了一下。纸，碎了。\n\n[特殊镜头：撕纸声独占两秒，全场无声。]\n\n[特写：半秒——档案柜里，同一份记录的存档联完好归位，标签平整。]\n\n碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。\n\n秦江海：撕吧。这单我不签——每一页我都抄了三份。\n\n不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。\n\n[特写：那行批注的笔迹，一秒即过。]\n\n冯有德趁势合上文件夹。\n\n冯有德：验料结果，另行核议。散会。\n\n雷小雨（低声）：验了，等于白验？\n\n秦江海：不。他们欠了一笔——签了字，就生利息。\n\n人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。\n\n散会，暴雨正好砸下来。\n\n场景三：项目部楼门口 · 檐下 · 日 · 外（暴雨）\n\n雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。\n\n他捡完最后一片，站起身，望向河面。\n\n[特殊镜头：闪电照出大堤全长。]\n\n雨顺着他安全帽的帽檐往下灌，连成一道水帘。\n\n秦江海（雷声里）：水位涨一格，你们就多欠我一页。\n\n雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。\n\n[转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。]\n\n[特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。]\n\n（第三集完）\n\n---\n\n## 卡点体检（文末附页）\n\n### 第 1 集 · 卡点「雷声上弦」（情绪型）\n\n- 卡点画面与台词：贴堤听水（无台词名场面）→ 分界桩「老伙计，他们把你签出去了」→ 闷雷 → 大远景剪影 +「要来水了」+ 字幕卡「汛期第一天」。\n- 观众必须翻页的问题：这张被全员表决围攻的拒签单，挂不挂得住？水，几时来？\n- 强度自检：钩子不靠悬念信息靠压迫感——雷声是全剧三圈钟的第一声上弦，观众带着「水几时来对账」进第二集；过。\n\n### 第 2 集 · 卡点「抄写背影」（情绪型）\n\n- 卡点画面与台词：窗雨淌过他白天描的水位线 → 台灯下抄写的背影（抄什么不说破）→ 雨夜深处堤上滚过不该出现的引擎声，笔尖停了半拍。\n- 观众必须翻页的问题：他深夜在抄什么？夜里上堤的卡车，在干什么？\n- 强度自检：双钩并置——动作悬念（抄写）+ 事件悬念（夜车），情绪（孤立无援仍不签）与事件（偷工进行时）互为进气口；过。\n\n### 第 3 集 · 卡点「反咬信」（情绪 + 信息型）\n\n- 卡点画面与台词：檐下把碎纸一片片捡进雨靴 +「水位涨一格，你们就多欠我一页」→ 转场复核组进场牌 → 桌上第一份材料是举报秦江海「泄露工程数据」的信。\n- 观众必须翻页的问题：反咬信从哪来？他抄的三份在哪、谁会看到？被「另行核议」合法放过的假堤段，涨水后先出事的是哪一段？\n- 强度自检：受辱当场被回击垫住（撕稿→「抄三份」时差一拍），集尾把受辱升级为受冤，委屈感与信息缺口同时拉满；过。\n\n### 三集连续性复核\n\n- 结构：三集结构与集末卡点全部承自小纲（雷声上弦／抄写背影／反咬信），32 拍逐一扩写，未新增情节线；单集时长量级约 1.5-2 分钟成片（E3 验料场略长），符合竖屏单集体量。\n- 口癖三变奏：E1「这单我不签」＋「签了，我把三十年押给这张单」（变奏①）／E2「这一单，我还不签」＋「水，不要你觉得」（变奏②）／E3「撕吧。这单我不签——每一页我都抄了三份」（变奏③）。每集 ≥1，三集三变奏，逐字核对原样在位。\n- R1 条件可感知：E3「保熟吗」当场验料为实测小胜利（仪器读数当众念、封样双份、马长贵撂话退场）；一堤两制分屏在 E1 以界碑为轴左右摇、一侧扎实一侧水渍，视觉成立；看得见的水三集不断线（E1 河面/听水/雷雨，E2 描水位线/窗雨，E3 夜雨/暴雨/水帘/雨靴）。\n- 工程细节翻译件：压实度＝土没压瓷实、虚土见水就沉；钻芯复检＝钻一管土上来一量便知；标号＝这方料没长够该有的力气；封样双份＝一份送检一份留底谁也换不了；隐蔽工程留影像＝混凝土一盖一辈子没人看得见、规范要留影像。全部台词内翻译，零讲解腔（打磨后复检）。\n- 合规自查：零真实机构名、零真实责任人（项目部/复核组/监理皆通称）；零伤亡、零惨状、零决口，水的威力只用声音与物证（水声、雨声、水渍、料粉、碎纸、雨靴）；灾害画面只拍秩序与物证；自造专名仅临江圩、清川河。\n- 台词交接：本稿已过 dialogue-polish 三遍校准（人物声口／处境／去AI味清单），逐句修订留痕见项目根《台词打磨对照表.md》（内部件）；卡点与伏笔位零改动，R4 前语言卡一致性自查完成。\n"}}, {"round": 2, "ts": "2026-09-17 02:32", "note": "", "content": {"对外交付/03-剧本试稿.md": "# 《守堤人》剧本试稿（第 1-3 集）\n\n【背景】\n当代，汛期将至。清川河上的临江圩除险加固工程进入验收阶段——大堤那头，是下游几万人的身家性命。\n\n【主角】\n秦江海：58 岁，临江圩除险加固项目部总工程师。守堤三十年，藏蓝工装洗得发白，左胸口袋别两支笔；开会最没存在感，堤上声音最大。\n马长贵：45 岁，施工方负责人。垫资垫到抵押了房子，必须赶在汛期前验收回款；对上点头哈腰递烟，对工人横眉瞪眼。\n冯有德：50 岁，项目部上级。不贪一分钱，但怕担一分责，文件夹永远抱在胸前当盾牌；嗓门越轻的事他越躲。\n雷小雨：26 岁，测绘员，秦江海的徒弟。信数据不信酒桌，全项目部唯一公开站在老头一边的人。\n桂守成：44 岁，监理负责人。头发梳得一丝不乱，从不违反任何一条程序，是验收会上落笔最快的那支笔。\n\n【剧情概括】\n第一集：验收联签只剩秦江海一人拒签，他当场指出堤身填筑压实度不合格、要求钻芯复检，遭全员举手围攻仍掷笔而去；暮色里他贴堤听水，雷声滚过——汛期第一天到了。\n第二集：办公室被搬进档案室的秦江海，用一句「水，不要你觉得」顶回「我不要你觉得」的逼签；深夜他在台灯下抄写什么，雨夜里大堤方向滚过不该有的引擎声。\n第三集：夜巡当场验出卸料混凝土低于设计标号，次日验收会上冯有德撕毁他私留的检测底稿，他以「每一页我都抄了三份」当场回击；暴雨中他把碎纸一片片捡进雨靴，复核组进场的第一份材料却是一封举报他的信。\n\n---\n\n## 第 1 集《这单我不签》\n\n【场景：临江圩除险加固项目部·验收会议室·日·内】\n\n【长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。】\n\n【笔传到长桌尽头，停住了。】\n\n【秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。】\n\n【他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。】\n\n【特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。】\n\n秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。\n\n【会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。】\n\n冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。\n\n【秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。】\n\n秦江海：压实度不够——填堤的土，没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。不信，钻一管土上来，一量便知。数字在这儿。\n\n【冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。】\n\n马长贵（笑）：老秦，你这是挡大家财路！\n\n【哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。】\n\n雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？\n\n【哄笑卡在喉咙里。缓推秦江海面部。】\n\n【特殊镜头：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。】\n\n秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？\n\n【马长贵脸上的笑一层层收干。冯有德举起手。】\n\n冯有德：表决。\n\n【手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。】\n\n【特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。】\n\n桂守成（淡淡）：程序上，就差这一笔了。\n\n冯有德：少数服从多数。\n\n【秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。】\n\n秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。\n\n【背影出门。会议室死静片刻，随即嗡地一声炸开议论。】\n\n【场景：项目部楼道·日·内】\n\n【马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。】\n\n马长贵：老秦，是你的章硬，还是我的路子硬？\n\n【秦江海把烟原样插回他胸袋，脚步没停。】\n\n秦江海：汛期，会替我试。\n\n【马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。】\n\n【场景：清川河堤段·堤坡·暮·外】\n\n【雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。】\n\n【特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。】\n\n【水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。】\n\n【特殊镜头：桩号 3+960。】\n\n【特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。】\n\n秦江海（对堤，像对故人）：老伙计，他们把你签出去了。\n\n【手指在桩号上停了很久。天边一声闷雷。】\n\n【转场：乌云压着河面推过来，雷声滚过堤顶。】\n\n【大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。】\n\n秦江海（抬头看天，轻声）：要来水了。\n\n【字幕卡：汛期第一天。】\n\n---\n\n## 第 2 集《水不要你觉得》\n\n【场景：项目部办公区·走廊→档案室·日·内】\n\n【两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。】\n\n工人甲（嘟囔）：秦总工，先在这儿委屈委屈。\n\n【秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。】\n\n【门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。】\n\n冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。\n\n【秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。】\n\n【特殊镜头：图例一角——「历史最高洪水位」。】\n\n秦江海（头也不回）：水，不要你觉得。\n\n【描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。】\n\n【场景：档案室门口·日·内】\n\n【门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。】\n\n马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。\n\n【秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。】\n\n【雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。】\n\n雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\n\n【马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。】\n\n冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。\n\n【他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。】\n\n【场景：档案室·暮·内】\n\n【秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。】\n\n【他把联签单副本铺平在桌上。】\n\n【特殊镜头：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。】\n\n秦江海（对着空档案室）：这一单，我还不签。\n\n【说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。】\n\n秦江海：量堤，可以。量人心——你们不够长。\n\n【说完才觉出掌心疼，摊开看了一眼，笑了笑。】\n\n【窗外，第一滴雨打在玻璃上。】\n\n【特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。】\n\n【窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。】\n\n【转场：雨声渐密，笔尖沙沙。】\n\n【雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。】\n\n---\n\n## 第 3 集《这方混凝土，保熟吗》\n\n【场景：清川河堤段·卸料点·夜·外】\n\n【夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。】\n\n【特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。】\n\n秦江海（画外，声音不大）：几点了，还在卸料。\n\n【工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。】\n\n工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。\n\n【他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。】\n\n【特殊镜头：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。】\n\n秦江海：这方混凝土——保熟吗？\n\n【捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。】\n\n马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\n\n【他声音抬得越高，眼睛越不看料堆。】\n\n秦江海（不接他的话）：垫层垫在堤身底下，混凝土一盖，一辈子没人看得见。规范上白纸黑字——隐蔽工程要留影像。你们的影像呢？\n\n【他直起身，朝堤顶喊。】\n\n秦江海：小雨——取样。当着大家的面。\n\n【堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。】\n\n【特殊镜头：手电光从四面八方聚拢到料堆。】\n\n【仪器滴一声——数字出来了。】\n\n雷小雨（举着记录板，当众念）：快测结果，低于设计标号——这方料，没长够它该有的力气。原始样我封了，双份。一份送检，一份留底，谁也换不了！\n\n【人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。】\n\n马长贵：明天验收会上说！\n\n【场景：验收会议室·日·内】\n\n【次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。】\n\n冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。\n\n【他开口前，眼珠照例先往左右各扫了一下。纸，碎了。】\n\n【特殊镜头：撕纸声独响，全场无声。】\n\n【特殊镜头：档案柜里，同一份记录的存档联完好归位，标签平整。】\n\n【碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。】\n\n秦江海：撕吧。这单我不签——每一页我都抄了三份。\n\n【不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。】\n\n【特殊镜头：那行批注的笔迹，一闪而过。】\n\n【冯有德趁势合上文件夹。】\n\n冯有德：验料结果，另行核议。散会。\n\n雷小雨（低声）：验了，等于白验？\n\n秦江海：不。他们欠了一笔——签了字，就生利息。\n\n【人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。】\n\n【散会，暴雨正好砸下来。】\n\n【场景：项目部楼门口·檐下·日·外（暴雨）】\n\n【雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。】\n\n【他捡完最后一片，站起身，望向河面。】\n\n【特殊镜头：闪电照出大堤全长。】\n\n【雨顺着他安全帽的帽檐往下灌，连成一道水帘。】\n\n秦江海（雷声里）：水位涨一格，你们就多欠我一页。\n\n【雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。】\n\n【转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。】\n\n【特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。】\n"}}]}, "kits": {"plot": {"domain": "plot", "title": "", "ops": {"episodic-out <script>

/* ---------- 文件多版本索引（来自快照）：diff 呈现的数据底座 ---------- */

const nodes = flow.graph.nodes, edges = flow.graph.edges;
/* 交付节点集合：唯一真相 = 顶层 outputs[].node（graph.outputs 仅拓扑终点，作渲染兼容并入）——规范 R4 §5.1 */

function deliveryNodes(){
  if (!_deliverySet) _deliverySet = new Set((flow.outputs||[]).map(o=>o.node).filter(Boolean).concat(flow.graph.outputs||[]));
  return _deliverySet;
}
function isDeliveryNode(n){ return deliveryNodes().has(n); }
document.getElementById("v").textContent = "";  // 流程名移入「工作流管理」页（顶栏降噪）

/* ---------- 运行状态 ---------- */
function st(n){ const s = (RS.nodes[n]||{}).status || "none"; return s; }
function persistState(){
  // 用户数据（意见/批注/预设）→ 内部/批注与意见.json；重跑与提交归内核真相
  const userData = {comments: RS.comments||{}, annos: RS.annos||{}, presets: RS.presets||{}, savedAt: new Date().toLocaleString()};
  saveFile("内部/批注与意见.json", JSON.stringify(userData, null, 2), "json")
    .then(m => { const el = document.getElementById("saved"); if (el) el.textContent = m; });
}
window.persistState = persistState;
const handles = {};
async function saveFile(name, content, ext){
  // ① http 服务：POST 直写盘（零弹窗）
  if (location.protocol.startsWith("http")){
    try{
      const rel = DATA.project ? "projects/" + DATA.project + "/" + name : name;
      const r = await fetch("/_kit/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: rel, content})});
      if (r.ok){ const j = await r.json(); return "已写盘：" + j.path; }
    }catch(err){}
  }
  // ② 兜底：File System Access → 下载（file:// 模式）
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

/* ---------- 布局：阶段分段 ｜ 同级同列 ｜ 产物压阶段虚线 ---------- */
const NW=196, NH=76, GX=88, GY=64, MG=44;
let pos = {};
let stageLineX = {}, stageBand = {}, parCols = new Set();
function autoLayout(){
  const stageList = (flow.stages||[]);
  const colOf = {}, colNodes = {};
  let c = 0;
  const push = (n, col)=>{ colOf[n]=col; (colNodes[col]=colNodes[col]||[]).push(n); };
  for (const sg of stageList){
    const work = (sg.nodes||[]).filter(n=>nodes[n] && n!==sg.gate);
    if (!work.length) continue;
    // 阶段内最长路径分层：同一层级的节点共享同一竖线
    const lvl = {}; work.forEach(n=>lvl[n]=0);
    for (let it=0; it<=work.length; it++){
      for (const e of edges){
        if (isBackEdge(e) || lvl[e.from]===undefined || lvl[e.to]===undefined) continue;
        if (lvl[e.to] < lvl[e.from]+1) lvl[e.to] = lvl[e.from]+1;
      }
    }
    const byLevel = {};
    work.forEach(n=>{ (byLevel[lvl[n]] = byLevel[lvl[n]]||[]).push(n); });
    const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
    const base = c;
    levels.forEach((L,i)=>{ byLevel[L].sort().forEach(n=>push(n, base+i)); });
    c = base + levels.length;
    if (sg.gate && nodes[sg.gate]) push(sg.gate, c++);
    stageBand[sg.id] = {from: base, to: c-1};
  }
  Object.keys(nodes).forEach(n=>{ if (colOf[n]===undefined) push(n, c); });
  // 阶段虚线 = 本阶段产物列的中心线：产物骑在虚线上，左侧是本阶段工序，右侧是验收门
  stageLineX = {};
  for (const sg of stageList){
    const prod = (sg.nodes||[]).find(n=>nodes[n] && n!==sg.gate && isDeliveryNode(n));
    const col = prod ? colOf[prod] : (stageBand[sg.id]||{}).from;
    if (col !== undefined) stageLineX[sg.id] = MG + col*(NW+GX) + NW/2;
  }
  // 每列节点围绕中线纵向堆叠；多节点列 = 并行组（同一就绪批）
  parCols = new Set(Object.keys(colNodes).map(Number).filter(c=>colNodes[c].length>1));
  let maxRows = 1; Object.values(colNodes).forEach(a=>maxRows=Math.max(maxRows,a.length));
  const midY = MG + (maxRows*(NH+GY)-GY)/2;
  for (const [col, arr] of Object.entries(colNodes)){
    const colH = arr.length*(NH+GY)-GY;
    const y0 = Math.round(midY - colH/2);
    arr.forEach((n,k)=>{ pos[n] = [MG + col*(NW+GX), y0 + k*(NH+GY)]; });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在阶段；无选中则取第一个未完成阶段 */
function currentStageId(){
  if (sel && nodes[sel] && nodes[sel].stage) return nodes[sel].stage;
  if (lastSel && nodes[lastSel] && nodes[lastSel].stage) return nodes[lastSel].stage;
  for (const s of (flow.stages||[])){
    if ((s.nodes||[]).some(x => st(x) !== "done")) return s.id;
  }
  return ((flow.stages||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = stageBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    const c = Math.round((pt[0]-MG)/(NW+GX));
    if (c >= band.from && c <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (flow.stages||[]).map(s=>s.id);
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z = document.getElementById("zoom-val");
  if (z) z.innerHTML = "缩放 <b>" + Math.round(view.k*100) + "%</b>";
}
function resetZoom(){
  const st = document.getElementById("stage");
  const cx = st.clientWidth/2, cy = st.clientHeight/2;
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = 1; view.x = cx-wx; view.y = cy-wy; applyView();
}
/* 定位：跳转到当前（或最近一次）选中节点；无选中则整图适配 */
let lastSel = null;
function locateSel(){
  const target = sel || lastSel;
  if (!target || !pos[target]) { fitView(); return; }
  const st = document.getElementById("stage");

  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();

/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}
/* when 的人类可读摘要（画布标签 / 连线面板） */
function whenText(w){
  if (w===undefined || w===null) return "";
  if (typeof w==="string") return w;
  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");
  if (w.all) parts.push("("+w.all.map(whenText).filter(Boolean).join(" 且 ")+")");
  return parts.join(" 且 ");
}

/* artifact@1 头部（规范 R4 §二）：版本与审核背景的唯一落点；正文不再承载这些。
   只认 artifact:1 的头部，解析顶层标量 + 一层嵌套（review）——与内核 asserts.ts 同口径。 */
function parseArtifactHeader(text){

  if (!m || !/^\s*artifact\s*:\s*1\s*$/m.test(m[1])) return null;

  m[1].split(/\r?\n/).forEach(raw=>{

    const indent=/^\s+\S/.test(raw);
    let mm=/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(raw);
    if (mm){ if (indent && sec) nested.push([sec, mm[1], mm[2].trim()]); else { sec=mm[1]; kv[mm[1]]=mm[2].trim(); } return; }
    mm=/^\s*-\s*(.*)$/.exec(raw);
    if (mm) list.push([sec, mm[1].trim()]);
  });

          upstream: list.filter(x=>x[0]==="upstream").map(x=>x[1])};

function drawEdges(){

  let maxC = 0, maxR = 0; Object.values(pos).forEach(p=>{maxC=Math.max(maxC,p[0]);maxR=Math.max(maxR,p[1]);});
  const W = maxC+NW+MG+60, H = Math.max(420, maxR+NH+MG*2);
  let s = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible"><defs><marker id="arw" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#a89f90"/></marker></defs>`;
  // 阶段虚线：穿过本阶段产物中心（autoLayout 预计算）；阶段段铺淡色底
  (flow.stages||[]).forEach(sg=>{
    const lx = stageLineX[sg.id], band = stageBand[sg.id];
    if (lx === undefined) return;
    const col = STAGE_COLOR[sg.id] || "#b8b0a4";
    if (band){
      const bx = MG + band.from*(NW+GX) - 18, bx2 = MG + (band.to+1)*(NW+GX) - GX + 18;
      s += `<rect x="${bx}" y="16" width="${bx2-bx}" height="${H-56}" rx="10" fill="${col}" opacity="0.05"/>`;
    }
    s += `<line class="stage-rule" x1="${lx}" y1="20" x2="${lx}" y2="${H-40}" stroke="${col}" stroke-width="1.2"/>`;
    s += `<text class="stage-name" x="${MG + band.from*(NW+GX) + 2}" y="34" fill="${col}">${sg.id} ${STAGE_ZH[sg.id]||sg.name||""}</text>`;
  });
  // 打回回环不常驻画布：每次打回的原因与范围各不相同，属评审结果的具体记录，
  // 仅在查看对应验收门节点时于右侧文档面板按需呈现（openNodeDoc 的「打回与回注」页）。
  // 前向边
  const cctx = condCtx();   // 一次求值上下文，全图共用
  for (const e of edges){
    if (isBackEdge(e)) continue; // 打回/回环边不上画布：原因与范围每次不同，属门语义数据
    if (!pos[e.from] || !pos[e.to]) continue;
    const [x1,y1] = pos[e.from], [x2,y2] = pos[e.to];
    const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;
    const role=edgeRole(e);
    const active = evalWhen(e.when, cctx).active;   // 与内核 cond.ts 同源求值，不再嗅探 when 字符串
    const lab = [whenText(e.when), EDGE_ROLE_ZH[role]||""].filter(Boolean).join(" · ");
    s += `<path class="edge-hit" data-e="${e.id}" d="M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}" fill="none" stroke="#a89f90" stroke-width="1.4"${(e.when||role!=="flow")?' stroke-dasharray="5,4"':""} opacity="${active?0.9:0.35}" marker-end="url(#arw)"/>`;
    if (lab) s += `<text class="edge-label" x="${mx}" y="${(sy+ty)/2-4}" text-anchor="middle">${lab}</text>`;
  }
  svg.innerHTML = s + "</svg>";
  svg.querySelectorAll(".edge-hit").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openEdgeDoc(p.dataset.e); });

function dragMove(e){
  // 3px 内不算拖动：纯点击绝不能在 mousedown~click 之间重建 DOM，

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

      dot:st?`<span class="dot ${dotCls}" title="${st}"></span>`:"",
      meta:[typ,st,ver?"v"+ver:""].filter(Boolean).join(" · ")});
  });
  const secRank=c=>{const i=order.indexOf(c.sec);return i<0?99:i;};
  cards.sort((a,b)=>secRank(a)-secRank(b)||a.title.localeCompare(b.title,"zh"));

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);
      if(d!==null&&a!==null&&d!==a){
        const pair=charSpanPair(d,a);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${dHtml}</div>`);
      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }
  return out.join("");
}

function findWrapQuote(quote, aid){
  const tries=[quote.replace(/\s+/g," ").trim(), quote.trim().slice(0,20)].filter(x=>x.length>=4);
  const walker=document.createTreeWalker(dBody, NodeFilter.SHOW_TEXT);
  let node;

    for (const t of tries){

      if (idx>=0){
        const r=document.createRange();

        const mark=document.createElement("span");

        try{ r.surroundContents(mark); }

        return mark;

    }
  }

}

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

  pushUndo();
  const st = ustate(key);
  if (st.idx <= 0) return;
  st.idx -= 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
function redoDoc(){
  const key = docKey(); if (!key) return;
  const st = ustate(key);
  if (st.idx >= st.stack.length-1) return;
  st.idx += 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
document.addEventListener("input", e=>{
  if (e.target.closest && e.target.closest('.docpaper .md')){
    scheduleUndo();
    updateDocStats();
    scheduleAutoSave();
  }
});
document.addEventListener("keydown", e=>{
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = (e.key||"").toLowerCase();
  if (k === "z" && !e.shiftKey && docKey()){ e.preventDefault(); undoDoc(); }
  else if ((k === "y" || (k === "z" && e.shiftKey)) && docKey()){ e.preventDefault(); redoDoc(); }
});
function unwrapPending(){
  if (pendingMark){ const par=pendingMark.parentNode; if(par){ while(pendingMark.firstChild) par.insertBefore(pendingMark.firstChild, pendingMark); par.removeChild(pendingMark); } pendingMark=null; }
  pendingQuote="";
  const pop=document.getElementById("anno-pop"); if(pop) pop.style.display="none";
}
function dropDraftMark(){
  if (pendingMark){ const par=pendingMark.parentNode; if(par){ while(pendingMark.firstChild) par.insertBefore(pendingMark.firstChild, pendingMark); par.removeChild(pendingMark); } pendingMark=null; }
}
document.addEventListener("mouseup", e=>{
  const pop=document.getElementById("anno-pop");
  if (!pop) return;
  const tc = e.target.closest ? e.target : (e.target.parentElement || document.body);
  if (tc.closest("#anno-pop") || tc.closest("#d-tools")) return;
  if (curNav.type!=="node" && curNav.type!=="file") return;
  const s=window.getSelection();
  if (!s || s.isCollapsed || s.rangeCount===0 || !dBody.contains(s.anchorNode)) return;
  const raw=s.toString().trim();
  if (!raw) return;
  dropDraftMark();   // 重新框选 = 旧草稿作废
  // 立刻把选区固化为高亮标记：高亮不依赖原生选区（输入框聚焦/点击别处都不会丢）
  const r=s.getRangeAt(0);
  let rect=r.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)){
    const se=r.startContainer;
    const el=(se.nodeType===1?se:se.parentElement);
    if (el) rect=el.getBoundingClientRect();
  }
  pendingMark=document.createElement("span");
  pendingMark.className="anno-mark draft"; pendingMark.title="批注草稿（提交后生效）";
  pendingMark.appendChild(r.extractContents());
  r.insertNode(pendingMark);
  s.removeAllRanges();
  pendingQuote=raw.length>300 ? raw.slice(0,300)+"…" : raw;
  const pr=document.getElementById("docpanel").getBoundingClientRect();
  pop.dataset.quote=pendingQuote;
  document.getElementById("anno-input").value="";
  // 浮层贴着选区末端；越界收进面板
  pop.style.left=Math.round(Math.min(Math.max(8, rect.left-pr.left), Math.max(8, pr.width-290)))+"px";
  pop.style.top=Math.round(Math.min(Math.max(8, rect.bottom-pr.top+8), Math.max(8, pr.height-150)))+"px";
  pop.style.display="block";
  document.getElementById("anno-input").focus();
});
function submitAnno(){
  const pop=document.getElementById("anno-pop");
  const text=document.getElementById("anno-input").value.trim();
  const quote=pendingQuote || (pop.dataset.quote||"");
  const key=curAnnoKey();
  pop.style.display="none";
  if (!text || !quote || !key || !pendingMark){ unwrapPending(); return; }
  const a={id:"a"+Date.now().toString(36), quote, text, ts:new Date().toLocaleString()};
  annoList(key).push(a);
  pendingMark.classList.remove("draft");
  pendingMark.dataset.aid=a.id;
  pendingMark.title=a.text;
  placeBubble(key, a, pendingMark);
  pendingMark=null; pendingQuote="";
  persistState();
}
document.addEventListener("click", e=>{
  window.__clog = window.__clog || [];
  const where = (e.target.id || e.target.className || e.target.tagName) + "@" + (e.target.closest ? (e.target.closest(".docpaper") ? "正文" : (e.target.closest("#docpanel") ? "面板" : "画布/外")) : "?");
  if (e.target.id==="anno-ok"){ window.__clog.push("anno-ok"); submitAnno(); return; }
  if (e.target.id==="anno-cancel"){ unwrapPending(); return; }
  if (e.target.id==="anno-input"){ window.__clog.push("input click - keep"); return; }
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block"){ window.__clog.push("click(无关, pop未开) @ " + where); return; }
  const inDoc = !!(e.target.closest && e.target.closest(".docpaper"));
  window.__clog.push("click @ " + where + " inDoc=" + inDoc + " → " + (inDoc ? "保留" : "收起"));
  if (!inDoc) unwrapPending();
});
document.addEventListener("keydown", e=>{
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block" || e.target.id!=="anno-input") return;
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitAnno(); }
  if (e.key==="Escape"){ unwrapPending(); }
});
/* contenteditable 粘贴纯文本，防外来脏结构 */
document.addEventListener("paste", e=>{
  const ed = e.target.closest && e.target.closest('.md[contenteditable="true"]');
  if (!ed) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, txt);
});
