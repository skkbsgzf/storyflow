台词：马长贵：\"老秦，是你的章硬，还是我的路子硬？\"／秦江海（把烟原样插回他胸袋）：\"汛期会替我试。\"<\/p>\n<p>表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。<\/p>\n<p>尾钩→ 他没回宿舍，拐上了大堤。<\/p>\n<p>备注：马长贵口癖\"规矩是死的，人是活的\"留到 E2 用，本集只立递烟动作。<\/p>\n<p>**B0008｜情绪｜11秒**<\/p>\n<p>分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水。<\/p>\n<p>台词：（无台词，只有水声一层层近。）<\/p>\n<p>表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。<\/p>\n<p>尾钩→ 他顺着堤走到一根桩号碑前——<\/p>\n<p>备注：名场面①贴堤听水（海报级切片位）；水 tick。<\/p>\n<p>**B0009｜悬念｜10秒**<\/p>\n<p>分镜：手指划过分界桩刻字\"桩号 3+960\"；镜头左右摇：一侧坡面扎实色深（新填筑），另一侧草皮下水渍成片。<\/p>\n<p>台词：秦江海（对堤，像对故人）：\"老伙计，他们把你签出去了。\"<\/p>\n<p>表演：手指在桩号上停了很久。<\/p>\n<p>尾钩→ 天边一声闷雷——<\/p>\n<p>备注：一堤两制分屏 E1 露脸（R1 条件 3；E12 点题、E53 终验的第一颗钉子）。<\/p>\n<p>**B0010｜悬念｜9秒**<\/p>\n<p>分镜：乌云压着河面推过来，雷声滚过堤顶；大远景一条长堤、一个老头的剪影。字幕卡：汛期第一天。<\/p>\n<p>台词：秦江海（抬头看天，轻声）：\"要来水了。\"<\/p>\n<p>表演：他不躲雨，反而往堤上又走了一步。<\/p>\n<p>尾钩（下集钩）→ 这一张没人敢接的拒签单，能挂到水来吗？<\/p>\n<p>备注：集末卡点·情绪型；雷声第一响 = 全剧三圈钟上弦。<\/p>\n<p>---<\/p>\n<h3>第二集《水不要你觉得》<\/h3>\n<p>&gt; 本集速览：主认知更新——他们要的不是他签字，是他消失。切片梗点：\"我不要你觉得\"×\"水不要你觉得\"。集末卡点：情绪型（钢卷尺）。口癖变奏②。水 tick：描水位线＋窗雨（实体水 E3 夜雨补足）。景三 办公区·档案室。<\/p>\n<p>**B0011｜反常｜8秒**<\/p>\n<p>【0-3秒】两个工人抬着办公桌穿过走廊，桌上图纸滑到地；\"总工程师\"门牌被一把摘下；桌子落位档案室角落，正对整墙旧临江圩地形图。<\/p>\n<p>分镜：桌子落定，秦江海进门看一眼位置，先扶正桌角，再捡图纸。<\/p>\n<p>台词：工人甲（嘟囔）：\"秦总工，先在这儿委屈委屈。\"<\/p>\n<p>表演：像搬家的是别人，不是他。<\/p>\n<p>尾钩→ 门口有人鼓了两下掌——冯有德来了。<\/p>\n<p>备注：调岗边缘化（四件套之四）预演；承接 E1 拒签的代价即刻兑现。<\/p>\n<p>**B0012｜冲突｜9秒**<\/p>\n<p>分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。<\/p>\n<p>台词：冯有德：\"签个字，大家都省事。我不要你觉得，我要你觉得。\"<\/p>\n<p>表演：说话时眼睛看墙上的地形图，不看人（心虚）。<\/p>\n<p>尾钩→ 秦江海拿起了那支只画水位线的笔——<\/p>\n<p>备注：梗 7 前半；师父遗物笔首用于对撞。<\/p>\n<p>**B0013｜情绪｜9秒**<\/p>\n<p>分镜：秦江海转身面向地形图，沿图上历史洪水位线缓缓描一道，笔尖不抖。<\/p>\n<p>台词：秦江海（头也不回）：\"水不要你觉得。\"<\/p>\n<p>表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。<\/p>\n<p>尾钩→ 走廊传来脚步与递烟的笑——马长贵带人堵门。<\/p>\n<p>备注：梗 7 后半，本集对撞主句；水 tick（水位线）。<\/p>\n<p>**B0014｜冲突｜9秒**<\/p>\n<p>分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。<\/p>\n<p>台词：马长贵：\"老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。\"<\/p>\n<p>表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，不快不慢。<\/p>\n<p>尾钩→ 人群里有人不耐烦要进门——一只全站仪横了过来。<\/p>\n<p>备注：马长贵口癖首用；群像压迫位。<\/p>\n<p>**B0015｜冲突｜9秒**<\/p>\n<p>分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。<\/p>\n<p>台词：雷小雨：\"这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\"<\/p>\n<p>表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。<\/p>\n<p>尾钩→ 马长贵刚要开口，冯有德先软了——<\/p>\n<p>备注：盟友立住；她的台词同款是 E27 诱签线的人格底色。<\/p>\n<p>**B0016｜悬念｜8秒**<\/p>\n<p>分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。<\/p>\n<p>台词：冯有德：\"再研究研究。……对了，复审组下周进场，你自己掂量。\"<\/p>\n<p>表演：退到门口顿了半步，像想补一句狠话，终究没说。<\/p>\n<p>尾钩→ 人散尽，档案室只剩秦江海一个人。<\/p>\n<p>备注：信息钩伏 E8（复审组进场第一份立案是反咬信）；冯有德口癖\"再研究研究\"。<\/p>\n<p>**B0017｜情绪｜10秒**<\/p>\n<p>分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边。<\/p>\n<p>台词：（无台词。）<\/p>\n<p>表演：擦靴子的手势像在擦一块碑。<\/p>\n<p>尾钩→ 他把联签单副本铺平在桌上——<\/p>\n<p>备注：清算物件·雨靴首次亮相（E58 防水袋底单交档的远伏）。<\/p>\n<p>**B0018｜情绪｜9秒**<\/p>\n<p>分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，\"咔\"锁定。<\/p>\n<p>台词：秦江海（对着空档案室）：\"这一单，我还不签。\"<\/p>\n<p>表演：说给空屋子听，比说给人听更硬。<\/p>\n<p>尾钩→ 尺带在他掌心勒出一道白印——<\/p>\n<p>备注：口癖变奏②；钢卷尺量的是他拒签的那一段。<\/p>\n<p>**B0019｜情绪｜9秒**<\/p>\n<p>分镜：钢卷尺\"啪\"拍在联签单副本上，纸角跳起。<\/p>\n<p>台词：秦江海：\"量堤可以。量人心，你们不够长。\"<\/p>\n<p>表演：说完才觉掌心疼，摊开看了一眼，笑了笑。<\/p>\n<p>尾钩→ 窗外第一滴雨打在玻璃上——<\/p>\n<p>备注：集内金句切片位。<\/p>\n<p>**B0020｜悬念｜9秒**<\/p>\n<p>分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。<\/p>\n<p>台词：（无台词，雨声渐密。）<\/p>\n<p>表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么。<\/p>\n<p>尾钩（下集钩）→ 复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。<\/p>\n<p>备注：抄写动作伏\"抄三份\"（E3 拍9 说破、E58 清算名单兑现）；集末卡点·情绪型。<\/p>\n<p>---<\/p>\n<h3>第三集《这方混凝土，保熟吗》<\/h3>\n<p>&gt; 本集速览：主认知更新——偷工实锤与受辱顶点同场对撞：当场验了、当场被撕、当场回敬。切片梗点：\"偷感\"钉车＋\"保熟吗\"。集末卡点：情绪+信息型（捡碎纸）。口癖变奏③；受辱→回击时差 1 拍。景二 堤段工地·夜 → 景一 会议室。<\/p>\n<p>**B0021｜反常｜9秒**<\/p>\n<p>【0-3秒】夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光\"啪\"钉住车头，光柱里料粉飞舞。<\/p>\n<p>分镜：光柱从车头缓缓扫过挡板与料袋，所有人定格如标本。<\/p>\n<p>台词：秦江海（画外，声音不大）：\"几点了，还在卸料。\"<\/p>\n<p>表演：工头的笑僵在半张脸。<\/p>\n<p>尾钩→ 工头小跑下来打圆场——<\/p>\n<p>备注：名场面②手电钉车开场；梗 13\"偷感\"；承接 E2 集末卡车钩。<\/p>\n<p>**B0022｜冲突｜8秒**<\/p>\n<p>分镜：工头搓着手凑近，手电光柱从车头移到他脸上。<\/p>\n<p>台词：工头：\"秦总工，夜里凉，您回吧——这不是赶工期嘛。\"<\/p>\n<p>表演：挡在料袋前的身体语言比嘴诚实。<\/p>\n<p>尾钩→ 秦江海没理他，径直蹲向新卸的料堆——<\/p>\n<p>备注：承接拍1——先拦人，再看料。<\/p>\n<p>**B0023｜反常｜9秒**<\/p>\n<p>分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。<\/p>\n<p>台词：秦江海：\"这方混凝土，保熟吗？\"<\/p>\n<p>表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。<\/p>\n<p>尾钩→ 工头张了张嘴——车门开了。<\/p>\n<p>备注：梗 16\"这瓜保熟吗\"变体；切片位；R1 小验证起点。<\/p>\n<p>**B0024｜冲突｜9秒**<\/p>\n<p>分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。<\/p>\n<p>台词：马长贵：\"老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\"<\/p>\n<p>表演：声音抬得越高，眼睛越不看料堆。<\/p>\n<p>尾钩→ 秦江海不接话，直起身朝堤顶喊——<\/p>\n<p>备注：有理由的错误选择——他在跟汛期赛跑（对立统一不写成纯坏）。<\/p>\n<p>**B0025｜悬念｜8秒**<\/p>\n<p>分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。<\/p>\n<p>台词：秦江海：\"小雨——取样。当着大家的面。\"<\/p>\n<p>表演：工人群像里有人下意识后退半步。<\/p>\n<p>尾钩→ 仪器滴一声——数字出来了。<\/p>\n<p>备注：验证动作全部画面化，零术语讲解。<\/p>\n<p>**B0026｜反常｜10秒**<\/p>\n<p>分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆。<\/p>\n<p>台词：雷小雨：\"快测结果，低于设计标号。原始样我封了，双份！\"<\/p>\n<p>表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。<\/p>\n<p>尾钩→ 马长贵撂下一句——\"明天验收会上说。\"<\/p>\n<p>备注：小验证当场验料 ✓（R1 读者条件 1：前三集小赢一口，受辱不连续铺满）。<\/p>\n<p>**B0027｜冲突｜9秒**<\/p>\n<p>分镜：次日，验收会议室。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。<\/p>\n<p>台词：冯有德：\"私留底稿、扰乱验收秩序。这种风气，必须刹。\"<\/p>\n<p>表演：他撕纸前先看左右（小动作复现）。<\/p>\n<p>尾钩→ 纸，碎了。<\/p>\n<p>备注：受辱顶点；反派升级 = 从\"驳你的数据\"到\"撕你的底稿\"。<\/p>\n<p>**B0028｜情绪｜9秒**<\/p>\n<p>分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（半秒特写）。<\/p>\n<p>台词：（撕纸声独占两秒，全场无声。）<\/p>\n<p>表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。<\/p>\n<p>尾钩→ 他开口了——当拍回击——<\/p>\n<p>备注：伏笔——存档联流程上撕不掉（E20\"例行归档\"调走的正是它）。<\/p>\n<p>**B0029｜情绪｜10秒**<\/p>\n<p>分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场。<\/p>\n<p>台词：秦江海：\"撕吧。这单我不签——每一页我都抄了三份。\"<\/p>\n<p>表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。<\/p>\n<p>尾钩→ 桂守成低头在会议记录上写批注，笔迹特写一秒。<\/p>\n<p>备注：口癖变奏③＋受辱→回击时差 1 拍（拍8→拍9）；\"抄三份\"上膛（E58 清算名单）；桂守成笔迹伏 E36 笔迹比对——客户如删此半秒，E36 需补埋。<\/p>\n<p>**B0030｜冲突｜8秒**<\/p>\n<p>分镜：冯有德趁势合卷宣布散会——检出来的假，被留在议程之外。<\/p>\n<p>台词：冯有德：\"验料结果，另行核议。散会。\"／雷小雨（低声）：\"验了等于白验？\"／秦江海：\"不。他们欠了一笔，签了字就生利息。\"<\/p>\n<p>表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。<\/p>\n<p>尾钩→ 散会，暴雨正好砸下来——<\/p>\n<p>备注：\"敌进一分\"位：程序吃掉议程，但账记下了。<\/p>\n<p>**B0031｜情绪｜11秒**<\/p>\n<p>分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒。<\/p>\n<p>台词：（无台词，只有雨声。）<\/p>\n<p>表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。<\/p>\n<p>尾钩→ 他站起身，望向河面——<\/p>\n<p>备注：雨靴＋\"抄三份\"双伏笔同框落位；水的威力物证化（雨声，零惨状）。<\/p>\n<p>**B0032｜悬念｜10秒**<\/p>\n<p>分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。<\/p>\n<p>台词：秦江海：\"水位涨一格，你们就多欠我一页。\"（雷声吞尾）<\/p>\n<p>表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。<\/p>\n<p>尾钩（下集钩）→ 复审组进场第一天，桌上立的第一份材料——是一封举报秦江海\"泄露工程数据\"的反咬信。<\/p>\n<p>备注：集末卡点·情绪+信息型；受辱升级为受冤（E8-E10 首卡引信）；水 tick（暴雨）。<\/p>\n<p>---<\/p>\n<h3>创作思路页<\/h3>\n<h4>总说明（给批注人的坐标系）<\/h4>\n<p>1. 本稿是选题方案第五节分拍初稿的**小纲派生件**：情节、台词、伏笔位均承自 S3 正稿，未新增情节线；小纲的任务是把每一拍拆到**可画、可拍、可批注**的粒度。台词维持\"达意即可\"，未做成品级打磨——文采、潜台词、金句微调请留在成品剧本轮，此轮改了会浪费修改轮次。<\/p>\n<p>2. 批注方法：每条意见请锚定 **B 编号**（B0001-B0032，三集连续不重号）。改某一拍的台词不会影响编号；若要求合并/拆分拍，请在批注里写明\"合并 B0005-B0006\"这类区间，回稿时我再重排编号。<\/p>\n<p>3. 钩型四型口径：**反常**（画面本身不对劲）/ **冲突**（人对人对撞）/ **悬念**（信息缺口）/ **情绪**（压出来的感受）。第一集首拍 B0001 用反常（唯一不签的人），后续每拍标注主导钩型，仅供节奏体检，不必逐拍改。<\/p>\n<p>4. 边界重申：全三集零真实机构名、零真实责任人；台风雷雨一律无名；零伤亡、零惨状，水的威力只用声音与物证（水渍、料粉、雨声、雨靴）表达。<\/p>\n<h4>第一集《这单我不签》——为什么这么拆<\/h4>\n<ul>\n<li>**B0001 零铺垫直入拒签**：开篇 3 秒只给\"十几只手都在签、他的笔停了\"这一个反常，不给身份不给背景——没看过设定的人听完这拍不该问\"为什么\"，只问\"然后呢\"。拒签台词按\"部位＋缺陷＋要求\"三要素写，先立**强**再立**惨**：他是出击，不是受气。<\/li>\n<li>**B0004 奖章特写提前半拍**：扫地僧身份碎片在金句变奏①前一秒入画，是给 E10 群演低语\"扫地僧\"预埋的视觉账。批注若嫌抢戏可后移半拍，但建议保留在 E1——它是全片唯一一次主动亮底牌。<\/li>\n<li>**B0005-B0007 让他输掉会议室**：表决、孤立、塞烟三拍连压，但第 6 拍立刻转场堤上——受辱不给满，观众憋的那口气要在本集内找到一个出口，否则第二集会丧。<\/li>\n<li>**B0008-B0010 把出口放在堤上**：贴堤听水（名场面①）＋分界桩两侧同框（一堤两制 E1 露脸）＋雷声上弦，三个画面动作压集尾，一句解释都没有。分界桩这颗钉子 E12 分屏点题、E53 终验收回；雷声是全剧三圈钟的第一声，观众带着\"水几时来\"进第二集。<\/li>\n<\/ul>\n<h4>第二集《水不要你觉得》——为什么这么拆<\/h4>\n<ul>\n<li>**B0011 先给\"消失\"的预感**：搬桌摘牌是反派四件套之四（调岗边缘化）的预演版——第二集先让观众看清\"他们的目标不是他的签字，是他的位置\"，后面 E20 收章调岗才有量级。<\/li>\n<li>**B0012-B0013 对撞句成对出现**：\"我不要你觉得\"（施压）与\"水不要你觉得\"（回敬）必须隔一拍内完成——这是本集唯一的主认知更新，别的拍都为它让路。师父遗物笔在此第一次用于\"画水位线\"而非写字，身份信息全靠动作，零台词讲解。<\/li>\n<li>**B0014-B0015 群像压人、盟友立人**：递烟群像做空间压迫，雷小雨全站仪拦门做破口。她的台词\"图纸上没有这个数\"与 E27 诱签线（她的名字被夹进联签校核页）共用同一个人格底色——信数据的人最容易被签字链算计，此处不展开，只立性格。<\/li>\n<li>**B0017-B0019 空屋独角戏是故意降速**：后半集没有对手，只剩雨靴、卷尺、掌心白印三个物件动作。雨靴是 E58 清算段\"防水袋底单交档\"的远伏；卷尺量的正是他拒签的那 140 米——物件在此攒账，客户批注时请把这组当\"记账拍\"看，删任一拍需在后文集找补。<\/li>\n<li>**B0020 抄写的背影**：他深夜抄什么不说破，E3 拍9\"每一页我都抄了三份\"才揭晓——两集跨度的信息缺口，是本集集末卡点真正的钩。<\/li>\n<\/ul>\n<h4>第三集《这方混凝土，保熟吗》——为什么这么拆<\/h4>\n<ul>\n<li>**B0021-B0026 先赢一口再挨打**：夜查当场验料是 R1 条件要求的前三集小验证。顺序刻意排成\"验料赢（B0026）→ 撕稿辱（B0027-B0028）→ 回敬（B0029）\"——观众刚尝到甜头就被打，回击才有 double 的爽；若把验证挪到撕稿之后，整集会变成纯受辱集，丧掉前三集。<\/li>\n<li>**B0023\"保熟吗\"的反差**：专业指法配菜市场问话，笑点与寒点是同一句——寒在\"他连问都懒得跟他们正经问\"。此句是全片切片位，批注改词请保留\"保熟\"二字壳。<\/li>\n<li>**B0028 半秒闪现存档联**：撕的是他私留的底稿，流程上撕不掉的存档联只在档案柜里闪半秒、零讲解——这是 E20\"例行归档\"调档戏的预约金。批注若觉得闪现突兀，可改为 B0031 塞雨靴时一瞥，但删除会让 E20 无根。<\/li>\n<li>**B0029 回击时差 1 拍**：受辱（拍8）→回击（拍9）压在红线内。桂守成低头写批注的笔迹一秒特写是 E36\"反咬信笔迹比对同源\"的最早埋点，是全稿最远的一颗伏笔——删它不难，难的是 E36 重埋。<\/li>\n<li>**B0030-B0032 账要记成利息**：\"另行核议\"让检出的假被程序留在议程外（敌进一分），B0031 捡碎纸塞雨靴把屈辱物理化为存证，B0032\"水位涨一格，你们就多欠我一页\"把汛期钟和清算账拧成同一根弦。集末反咬信一句钩，把受辱升级成受冤——E8-E10 首卡死局从这里点火。<\/li>\n<\/ul>\n<h4>三集连续性自查<\/h4>\n<ul>\n<li>拍数：E1=10 / E2=10 / E3=12，均在 9-12 区间；单集时长约 90/89/100 秒，符合 1-1.5 分钟。<\/li>\n<li>口癖三变奏：E1 B0001+B0004（本句＋金句变奏①）/ E2 B0018（\"这一单，我还不签\"）/ E3 B0029（\"撕吧。这单我不签——\"）。每集 ≥1 ✓，三集三变奏 ✓。<\/li>\n<li>水 tick：E1 河面＋听水＋雷雨；E2 水位线＋窗雨（实体水由 E3 夜雨衔接）；E3 夜雨＋暴雨＋雨靴。任意缺口 ≤2 集 ✓。<\/li>\n<li>三景轮换：会议室（E1）→ 档案室（E2）→ 堤坡·会议室·檐下（E3），全部落在三景集合内，换景即换集节拍。<\/li>\n<li>伏笔台账（本稿埋设 → 回收位）：奖章 B0004→E10；桂守成程序脸 B0005→E30/E36；复审组风声 B0016→E8；雨靴 B0017/B0031→E58；抄三份 B0020/B0029→E58；存档联 B0028→E20；桂守成笔迹 B0029→E36；反咬信 B0032→E8/E10；分界桩 B0009→E12/E53。<\/li>\n<li>客户如对任一拍的拆分、时长、钩型有异议，直接在 B 编号上画圈即可；情节级意见（如调换验证与撕稿顺序）请在批注中注明影响集，我在回稿中同步重排受影响的伏笔位。<\/li>\n<\/ul>\n<p>---<\/p>\n<p>*依据：skills/scene-breakdown.md（达意纪律/分镜数/思路页）；选题方案.md 第五节分拍初稿@2026-09-16（派生源，未偏离）；故事框架案.md 表 2.0-A、7.4 口癖变奏表、7.5 梗挂接表@2026-09-16。本件为 S4 批注载体，待客户批注回传后修订。*<\/p><\/section>\n<section><h1>对外交付/04-成品剧本试稿.md<\/h1><h2>《守堤人》成品剧本 · 第 1-3 集（试稿）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）｜对外交付件 04<\/li>\n<li>剖面：scene-screenwriter（成品剧本师）· script-final 技能 · final_script 节点<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>直接母本：小纲-第1-3集.md（B0001-B0032，三集结构、集末卡点、伏笔位全部承袭，未新增情节线）<\/li>\n<li>口径来源：选题方案.md（台词与人物口径）；故事框架案.md（汛期三圈钟、口癖变奏、伤亡红线）<\/li>\n<li>格式说明：场景头＋连贯行动段落＋角色台词；特殊镜头/旁白/转场/字幕卡以中括号一行一条；全稿零内部流程标注<\/li>\n<li>声明：全剧人物、机构、事件均为虚构（临江圩、清川河为自造地名）；未读取 projects/_archive/ 下任何内容；未做任何 git 操作<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>第 1 集《这单我不签》<\/h3>\n<p>场景一：临江圩除险加固项目部 · 验收会议室 · 日 · 内<\/p>\n<p>长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。笔传到长桌尽头，停住了。<\/p>\n<p>秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。<\/p>\n<p>[特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。]<\/p>\n<p>秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。<\/p>\n<p>会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。<\/p>\n<p>冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。<\/p>\n<p>秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。<\/p>\n<p>秦江海：压实度不够——说白了，填堤的土没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。钻芯复检，就是从堤身上钻一管土下来，压没压实，一量便知。数字在这儿。<\/p>\n<p>冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。<\/p>\n<p>马长贵（笑）：老秦，你这是挡大家财路！<\/p>\n<p>哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。<\/p>\n<p>雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？<\/p>\n<p>哄笑卡在喉咙里。缓推秦江海面部。<\/p>\n<p>[特写：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。]<\/p>\n<p>秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？<\/p>\n<p>马长贵脸上的笑一层层收干。冯有德举起手。<\/p>\n<p>冯有德：表决。<\/p>\n<p>手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。<\/p>\n<p>[特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。]<\/p>\n<p>桂守成（淡淡）：程序上，就差这一笔了。<\/p>\n<p>冯有德：少数服从多数。<\/p>\n<p>秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。<\/p>\n<p>秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。<\/p>\n<p>背影出门。会议室死静两秒，随即嗡地一声炸开议论。<\/p>\n<p>场景二：项目部楼道 · 日 · 内<\/p>\n<p>马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。<\/p>\n<p>马长贵：老秦，是你的章硬，还是我的路子硬？<\/p>\n<p>秦江海把烟原样插回他胸袋，脚步没停。<\/p>\n<p>秦江海：汛期，会替我试。<\/p>\n<p>马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。<\/p>\n<p>场景三：清川河堤段 · 堤坡 · 暮 · 外<\/p>\n<p>雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。<\/p>\n<p>[特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。]<\/p>\n<p>无台词。水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。<\/p>\n<p>[特写：桩号 3+960。]<\/p>\n<p>[特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。]<\/p>\n<p>秦江海（对堤，像对故人）：老伙计，他们把你签出去了。<\/p>\n<p>手指在桩号上停了很久。天边一声闷雷。<\/p>\n<p>[转场：乌云压着河面推过来，雷声滚过堤顶。]<\/p>\n<p>大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。<\/p>\n<p>秦江海（抬头看天，轻声）：要来水了。<\/p>\n<p>[字幕卡：汛期第一天。]<\/p>\n<p>（第一集完）<\/p>\n<p>---<\/p>\n<h3>第 2 集《水不要你觉得》<\/h3>\n<p>场景一：项目部办公区 · 走廊 → 档案室 · 日 · 内<\/p>\n<p>两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。<\/p>\n<p>工人甲（嘟囔）：秦总工，先在这儿委屈委屈。<\/p>\n<p>秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。<\/p>\n<p>门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。<\/p>\n<p>冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。<\/p>\n<p>秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。<\/p>\n<p>[特写：图例一角——「历史最高洪水位」。]<\/p>\n<p>秦江海（头也不回）：水，不要你觉得。<\/p>\n<p>描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。<\/p>\n<p>场景二：档案室门口 · 日 · 内<\/p>\n<p>门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。<\/p>\n<p>马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。<\/p>\n<p>秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。<\/p>\n<p>雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。<\/p>\n<p>雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。<\/p>\n<p>马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。<\/p>\n<p>冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。<\/p>\n<p>他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。<\/p>\n<p>场景三：档案室 · 暮 · 内<\/p>\n<p>秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。<\/p>\n<p>他把联签单副本铺平在桌上。<\/p>\n<p>[特写：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。]<\/p>\n<p>秦江海（对着空档案室）：这一单，我还不签。<\/p>\n<p>说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。<\/p>\n<p>秦江海：量堤，可以。量人心——你们不够长。<\/p>\n<p>说完才觉出掌心疼，摊开看了一眼，笑了笑。<\/p>\n<p>窗外，第一滴雨打在玻璃上。<\/p>\n<p>[特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。]<\/p>\n<p>窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。<\/p>\n<p>[转场：雨声渐密，笔尖沙沙。]<\/p>\n<p>雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。<\/p>\n<p>（第二集完）<\/p>\n<p>---<\/p>\n<h3>第 3 集《这方混凝土，保熟吗》<\/h3>\n<p>场景一：清川河堤段 · 卸料点 · 夜 · 外<\/p>\n<p>夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。<\/p>\n<p>[特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。]<\/p>\n<p>秦江海（画外，声音不大）：几点了，还在卸料。<\/p>\n<p>工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。<\/p>\n<p>工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。<\/p>\n<p>他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。<\/p>\n<p>[特写：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。]<\/p>\n<p>秦江海：这方混凝土——保熟吗？<\/p>\n<p>捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。<\/p>\n<p>马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！<\/p>\n<p>他声音抬得越高，眼睛越不看料堆。<\/p>\n<p>秦江海（不接他的话，直起身）：垫层垫在堤身底下，混凝土一盖，这辈子没人再看得见。规范白纸黑字——隐蔽工程要留影像。你们的影像呢？<\/p>\n<p>他直起身，朝堤顶喊。<\/p>\n<p>秦江海：小雨——取样。当着大家的面。<\/p>\n<p>堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。<\/p>\n<p>[特殊镜头：手电光从四面八方聚拢到料堆。]<\/p>\n<p>仪器滴一声——数字出来了。<\/p>\n<p>雷小雨（举着记录板，当众念）：快测结果，低于设计标号。标号，就是这方料该有的力气——它不够。原始样我封了，双份：一份送检，一份留底，谁也换不了！<\/p>\n<p>人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。<\/p>\n<p>马长贵：明天验收会上说！<\/p>\n<p>场景二：验收会议室 · 日 · 内<\/p>\n<p>次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。<\/p>\n<p>冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。<\/p>\n<p>他开口前，眼珠照例先往左右各扫了一下。纸，碎了。<\/p>\n<p>[特殊镜头：撕纸声独占两秒，全场无声。]<\/p>\n<p>[特写：半秒——档案柜里，同一份记录的存档联完好归位，标签平整。]<\/p>\n<p>碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。<\/p>\n<p>秦江海：撕吧。这单我不签——每一页，我都抄了三份。<\/p>\n<p>不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。<\/p>\n<p>[特写：那行批注的笔迹，一秒即过。]<\/p>\n<p>冯有德趁势合上文件夹。<\/p>\n<p>冯有德：验料结果，另行核议。散会。<\/p>\n<p>雷小雨（低声）：验了，等于白验？<\/p>\n<p>秦江海：不。他们欠了一笔——签了字，就生利息。<\/p>\n<p>人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。<\/p>\n<p>散会，暴雨正好砸下来。<\/p>\n<p>场景三：项目部楼门口 · 檐下 · 日 · 外（暴雨）<\/p>\n<p>雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。<\/p>\n<p>他捡完最后一片，站起身，望向河面。<\/p>\n<p>[特殊镜头：闪电照出大堤全长。]<\/p>\n<p>雨顺着他安全帽的帽檐往下灌，连成一道水帘。<\/p>\n<p>秦江海（雷声里）：水位涨一格，你们就多欠我一页。<\/p>\n<p>雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。<\/p>\n<p>[转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。]<\/p>\n<p>[特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。]<\/p>\n<p>（第三集完）<\/p>\n<p>---<\/p>\n<h3>卡点体检（文末附页）<\/h3>\n<h4>第 1 集 · 卡点「雷声上弦」（情绪型）<\/h4>\n<ul>\n<li>卡点画面与台词：贴堤听水（无台词名场面）→ 分界桩「老伙计，他们把你签出去了」→ 闷雷 → 大远景剪影 +「要来水了」+ 字幕卡「汛期第一天」。<\/li>\n<li>观众必须翻页的问题：这张被全员表决围攻的拒签单，挂不挂得住？水，几时来？<\/li>\n<li>强度自检：钩子不靠悬念信息靠压迫感——雷声是全剧三圈钟的第一声上弦，观众带着「水几时来对账」进第二集；过。<\/li>\n<\/ul>\n<h4>第 2 集 · 卡点「抄写背影」（情绪型）<\/h4>\n<ul>\n<li>卡点画面与台词：窗雨淌过他白天描的水位线 → 台灯下抄写的背影（抄什么不说破）→ 雨夜深处堤上滚过不该出现的引擎声，笔尖停了半拍。<\/li>\n<li>观众必须翻页的问题：他深夜在抄什么？夜里上堤的卡车，在干什么？<\/li>\n<li>强度自检：双钩并置——动作悬念（抄写）+ 事件悬念（夜车），情绪（孤立无援仍不签）与事件（偷工进行时）互为进气口；过。<\/li>\n<\/ul>\n<h4>第 3 集 · 卡点「反咬信」（情绪 + 信息型）<\/h4>\n<ul>\n<li>卡点画面与台词：檐下把碎纸一片片捡进雨靴 +「水位涨一格，你们就多欠我一页」→ 转场复核组进场牌 → 桌上第一份材料是举报秦江海「泄露工程数据」的信。<\/li>\n<li>观众必须翻页的问题：反咬信从哪来？他抄的三份在哪、谁会看到？被「另行核议」合法放过的假堤段，涨水后先出事的是哪一段？<\/li>\n<li>强度自检：受辱当场被回击垫住（撕稿→「抄三份」时差一拍），集尾把受辱升级为受冤，委屈感与信息缺口同时拉满；过。<\/li>\n<\/ul>\n<h4>三集连续性复核<\/h4>\n<ul>\n<li>结构：三集结构与集末卡点全部承自小纲（雷声上弦／抄写背影／反咬信），32 拍逐一扩写，未新增情节线；单集时长量级约 1.5-2 分钟成片（E3 验料场略长），符合竖屏单集体量。<\/li>\n<li>口癖三变奏：E1「这单我不签」＋「三十年押给你」（变奏①）／E2「这一单，我还不签」＋「水不要你觉得」（变奏②）／E3「撕吧。这单我不签——每一页我都抄了三份」（变奏③）。每集 ≥1，三集三变奏。<\/li>\n<li>R1 条件可感知：E3「保熟吗」当场验料为实测小胜利（仪器读数当众念、封样双份、马长贵撂话退场）；一堤两制分屏在 E1 以界碑为轴左右摇、一侧扎实一侧水渍，视觉成立；看得见的水三集不断线（E1 河面/听水/雷雨，E2 描水位线/窗雨，E3 夜雨/暴雨/水帘/雨靴）。<\/li>\n<li>工程细节翻译件：压实度＝土没压瓷实、见水就沉；钻芯复检＝钻一管土下来一量便知；标号＝这方料该有的力气；封样双份＝一份送检一份留底谁也换不了；隐蔽工程留影像＝盖上去就看不见的东西必须留记录。全部台词内翻译，零讲解腔。<\/li>\n<li>合规自查：零真实机构名、零真实责任人（项目部/复核组/监理皆通称）；零伤亡、零惨状、零决口，水的威力只用声音与物证（水声、雨声、水渍、料粉、碎纸、雨靴）；灾害画面只拍秩序与物证；自造专名仅临江圩、清川河。<\/li>\n<li>待办交接：按 script-final 流程，本稿台词为初稿级定稿，须强制交接 dialogue-polish（台词去AI味）三遍校准后方可进下一环节。<\/li>\n<\/ul><\/section>\n<section><h1>对外交付/03-剧本试稿.md<\/h1><h2>《守堤人》剧本试稿 · 第 1-3 集（台词打磨稿）<\/h2>\n<ul>\n<li>项目：p-ts-001（水利题材 · 守堤人）｜对外交付件 03<\/li>\n<li>剖面：scene-screenwriter（成品剧本师）· dialogue-polish 技能 · script_polish 节点<\/li>\n<li>生成日期：2026-09-16<\/li>\n<li>直接母本：对外交付/04-成品剧本试稿.md（三集结构、集末卡点、伏笔位零改动，仅台词与两处动作说明逐句打磨）<\/li>\n<li>打磨依据：skills/dialogue-polish.md 三遍校准（人物声口 → 处境 → 去AI味清单）；口吻基准＝选题方案.md 人设语言卡（秦江海口癖三变奏／马长贵递烟腔／冯有德阴柔躲责）<\/li>\n<li>修订留痕：台词打磨对照表.md（项目根目录，内部留痕件，不随对外交付）<\/li>\n<li>口径来源：选题方案.md（台词与人物口径）；故事框架案.md（汛期三圈钟、口癖变奏、伤亡红线）<\/li>\n<li>格式说明：场景头＋连贯行动段落＋角色台词；特殊镜头/旁白/转场/字幕卡以中括号一行一条；全稿零内部流程标注<\/li>\n<li>声明：全剧人物、机构、事件均为虚构（临江圩、清川河为自造地名）；未读取 projects/_archive/ 下任何内容；未做任何 git 操作<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>第 1 集《这单我不签》<\/h3>\n<p>场景一：临江圩除险加固项目部 · 验收会议室 · 日 · 内<\/p>\n<p>长桌俯拍。验收联签进行到最后一栏——签到笔顺着十几只手往下传，纸页翻动，落名一个接一个，笔速最快的是监理负责人桂守成，笔尖连墨迹都不拖。笔传到长桌尽头，停住了。<\/p>\n<p>秦江海坐在那里，五十八岁，藏蓝工装洗得发白，左胸口袋别着两支笔。他没有接笔，先把手边那页堤身填筑图纸摆正，笔帽在图纸的桩号上敲了三下。<\/p>\n<p>[特殊镜头：俯拍推近——整张联签单，只剩最后一个空格。]<\/p>\n<p>秦江海（不看任何人，声音平得像念了三十年桩号）：3+820 到 3+960，堤身填筑压实度不合格，要钻芯复检。这单我不签。<\/p>\n<p>会议室静了一瞬。所有人的头转过来，写到一半的笔悬在半空。<\/p>\n<p>冯有德（把文件夹啪地按上桌面，随即压低声音，俯身凑近半步）：全签了，就差你。<\/p>\n<p>秦江海把堤身填筑那页翻到折角处，推过去，指节敲在那个数字上。<\/p>\n<p>秦江海：压实度不够——填堤的土，没压瓷实。虚土见了水就沉，沉出来的缝，就是往后管涌的口子。不信，钻一管土上来，一量便知。数字在这儿。<\/p>\n<p>冯有德的眼珠先往左右各扫了一下，才落到纸上。后排一声嗤笑，马长贵晃着车钥匙站起来，人群跟着哄笑。<\/p>\n<p>马长贵（笑）：老秦，你这是挡大家财路！<\/p>\n<p>哄笑里，雷小雨从人群挤进来，检测原始记录啪地拍在桌上。她帽带晃着不扣，全站仪拄在手里，站定在老头身侧。<\/p>\n<p>雷小雨：图纸上没有这个数。原始记录在这儿——要我念给大家听吗？<\/p>\n<p>哄笑卡在喉咙里。缓推秦江海面部。<\/p>\n<p>[特写：左胸口袋上方一枚褪色的劳模奖章，随呼吸轻轻晃。]<\/p>\n<p>秦江海（不喊，不拍桌，每个字都往下滑）：签了，我把三十年押给这张单。不签——下游几万口人，凭什么押给他们？<\/p>\n<p>马长贵脸上的笑一层层收干。冯有德举起手。<\/p>\n<p>冯有德：表决。<\/p>\n<p>手臂一片片举起。联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝着他。<\/p>\n<p>[特殊镜头：俯拍长桌——手臂连成一片，只有他面前那一格空着。]<\/p>\n<p>桂守成（淡淡）：程序上，就差这一笔了。<\/p>\n<p>冯有德：少数服从多数。<\/p>\n<p>秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。他不接——他起身，把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走。人群自动分开一条缝。<\/p>\n<p>秦江海（在门口停半步，不回头）：堤是修给水看的，不是修给举手看的。<\/p>\n<p>背影出门。会议室死静两秒，随即嗡地一声炸开议论。<\/p>\n<p>场景二：项目部楼道 · 日 · 内<\/p>\n<p>马长贵追上来，皮鞋踩在工地的泥地上咯吱作响，掏出烟递过去，脸上堆着笑。<\/p>\n<p>马长贵：老秦，是你的章硬，还是我的路子硬？<\/p>\n<p>秦江海把烟原样插回他胸袋，脚步没停。<\/p>\n<p>秦江海：汛期，会替我试。<\/p>\n<p>马长贵的笑僵在脸上。秦江海走出楼门，天色阴沉。他没回宿舍，拐上了大堤。<\/p>\n<p>场景三：清川河堤段 · 堤坡 · 暮 · 外<\/p>\n<p>雨后初晴，河水在堤脚暗涌。秦江海摘下安全帽，侧身把耳朵贴在草皮上。<\/p>\n<p>[特殊镜头：大远景剪影——五十八岁的老头侧脸贴地，身后一条长堤伏在暮色里。]<\/p>\n<p>无台词。水声一层一层近。他一只手按住草皮，眉头从松到紧，远处水面一道暗纹慢慢推近。他顺着堤走到一根界碑前，手指划过刻字。<\/p>\n<p>[特写：桩号 3+960。]<\/p>\n<p>[特殊镜头：以界碑为轴，镜头左右摇——一侧新填筑的坡面扎实色深，另一侧草皮下水渍成片。同一条堤，两种颜色。]<\/p>\n<p>秦江海（对堤，像对故人）：老伙计，他们把你签出去了。<\/p>\n<p>手指在桩号上停了很久。天边一声闷雷。<\/p>\n<p>[转场：乌云压着河面推过来，雷声滚过堤顶。]<\/p>\n<p>大远景：一条长堤，一个老头的剪影。他不躲雨，反而朝堤上又走了一步。<\/p>\n<p>秦江海（抬头看天，轻声）：要来水了。<\/p>\n<p>[字幕卡：汛期第一天。]<\/p>\n<p>（第一集完）<\/p>\n<p>---<\/p>\n<h3>第 2 集《水不要你觉得》<\/h3>\n<p>场景一：项目部办公区 · 走廊 → 档案室 · 日 · 内<\/p>\n<p>两个工人抬着办公桌穿过走廊，桌上的图纸滑落到地。「总工程师」的门牌被人一把摘下。桌子落位——档案室角落，正对整墙旧临江圩地形图。<\/p>\n<p>工人甲（嘟囔）：秦总工，先在这儿委屈委屈。<\/p>\n<p>秦江海进门，看了一眼位置，先扶正桌角，再蹲下去一张张捡图纸——像搬家的是别人，不是他。<\/p>\n<p>门口有人鼓了两下掌。冯有德抱着文件夹立在门口，一沓联签单甩在桌角，纸页散开。<\/p>\n<p>冯有德（说话时眼睛看着墙上的地形图，不看人）：签个字，大家都省事。我不要你觉得，我要你觉得。<\/p>\n<p>秦江海没接话。他从胸袋抽出那支旧笔——笔杆磨得发亮，是只画水位线的那支。他转身面向地形图，沿着图上一道年代久远的红墨线，缓缓描了一遍，笔尖不抖。<\/p>\n<p>[特写：图例一角——「历史最高洪水位」。]<\/p>\n<p>秦江海（头也不回）：水，不要你觉得。<\/p>\n<p>描完，笔停。他回头只看冯有德一眼。冯有德的喉结动了一下。走廊里传来脚步声和递烟的笑——马长贵带着人，堵住了门。<\/p>\n<p>场景二：档案室门口 · 日 · 内<\/p>\n<p>门口挤满了人，烟一根一根从门缝递进来，递烟的手排成一小排。马长贵倚着门框。<\/p>\n<p>马长贵：老秦，规矩是死的，人是活的。这一页你签了，下面几十号人跟你吃肉。<\/p>\n<p>秦江海一根、一根，把烟原样插回烟盒，不快不慢。人群里有人不耐烦，抬脚要往里挤——一只全站仪横了过来。<\/p>\n<p>雷小雨拄着全站仪挤进门，侧身横在桌前，安全帽上那圈手绘的警戒红线晃眼，帽带照旧不扣。<\/p>\n<p>雷小雨（声音发紧，脚不退）：这一页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。<\/p>\n<p>马长贵上下打量她，冷笑，刚要开口——冯有德先软了。他把联签单收回文件夹抱回胸前，像把盾牌抱紧，边退边说。<\/p>\n<p>冯有德：再研究研究。……对了，复审组下周进场。你自己掂量。<\/p>\n<p>他退到门口顿了半步，像想再补一句狠话，终究没说。人散尽，档案室只剩秦江海一个人。<\/p>\n<p>场景三：档案室 · 暮 · 内<\/p>\n<p>秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土。他用袖口把靴面一点一点擦亮，摆在桌腿边——那手势，像在擦一块碑。<\/p>\n<p>他把联签单副本铺平在桌上。<\/p>\n<p>[特写：钢卷尺的钩头咬住图纸上的「3+820」，尺带拉到「3+960」，咔一声锁死。]<\/p>\n<p>秦江海（对着空档案室）：这一单，我还不签。<\/p>\n<p>说给空屋子听，比说给人听更硬。尺带在他掌心勒出一道白印。钢卷尺啪地拍在联签单副本上，纸角跳起来。<\/p>\n<p>秦江海：量堤，可以。量人心——你们不够长。<\/p>\n<p>说完才觉出掌心疼，摊开看了一眼，笑了笑。<\/p>\n<p>窗外，第一滴雨打在玻璃上。<\/p>\n<p>[特殊镜头：从档案室窗框缓缓推出——暮色里大堤横在雨雾尽头，像一条伏着的兽。]<\/p>\n<p>窗玻璃上，他白天描的那道水位线，被新的雨痕接续着往下淌。秦江海的背影坐进桌后，台灯亮起。他铺开一沓白纸，开始抄写什么。<\/p>\n<p>[转场：雨声渐密，笔尖沙沙。]<\/p>\n<p>雨夜深处，大堤的方向隐约滚过一阵引擎声——不该有车的时候，堤上来了车。笔尖停了半拍。秦江海抬起头，望向窗外。<\/p>\n<p>（第二集完）<\/p>\n<p>---<\/p>\n<h3>第 3 集《这方混凝土，保熟吗》<\/h3>\n<p>场景一：清川河堤段 · 卸料点 · 夜 · 外<\/p>\n<p>夜。堤坡的黑影里，一辆卡车熄了大灯倒车，几个人影扛着料袋往坡上挪。一道手电光啪地钉住车头——光柱里料粉飞舞，所有人定格。<\/p>\n<p>[特殊镜头：光柱从车头缓缓扫过挡板与料袋，人影如标本。]<\/p>\n<p>秦江海（画外，声音不大）：几点了，还在卸料。<\/p>\n<p>工头小跑下来打圆场，搓着手凑近，手电光柱从车头慢慢移到他脸上。<\/p>\n<p>工头（笑）：秦总工，夜里凉，您回吧——这不是赶工期嘛。<\/p>\n<p>他嘴上圆着场，身子却一直挡在料袋前。秦江海没理他，径直蹲向新卸的料堆，抓起一把料，指头捻开，举到灯下。<\/p>\n<p>[特写：粗粝颗粒从指缝漏下，料粉在光柱里悬浮。]<\/p>\n<p>秦江海：这方混凝土——保熟吗？<\/p>\n<p>捻料的指法极专业，问话却像菜市场里砍价。工头张了张嘴——车门开了。马长贵下来，皮鞋踩过泥水，张开手臂挡在料堆前。<\/p>\n<p>马长贵：老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！<\/p>\n<p>他声音抬得越高，眼睛越不看料堆。<\/p>\n<p>秦江海（不接他的话）：垫层垫在堤身底下，混凝土一盖，一辈子没人看得见。规范上白纸黑字——隐蔽工程要留影像。你们的影像呢？<\/p>\n<p>他直起身，朝堤顶喊。<\/p>\n<p>秦江海：小雨——取样。当着大家的面。<\/p>\n<p>堤顶探照灯亮了。雷小雨背着快测仪一路小跑下来，支仪器、取样，动作利落。工人群像里，有人下意识后退半步。<\/p>\n<p>[特殊镜头：手电光从四面八方聚拢到料堆。]<\/p>\n<p>仪器滴一声——数字出来了。<\/p>\n<p>雷小雨（举着记录板，当众念）：快测结果，低于设计标号——这方料，没长够它该有的力气。原始样我封了，双份。一份送检，一份留底，谁也换不了！<\/p>\n<p>人群里一片倒吸凉气。工头看向马长贵。马长贵脸色挂不住，挥手让车开走，撂下一句。<\/p>\n<p>马长贵：明天验收会上说！<\/p>\n<p>场景二：验收会议室 · 日 · 内<\/p>\n<p>次日。冯有德站在长桌一端，验料两个字没提，从文件夹里抽出几页纸举高——秦江海私留的检测底稿。<\/p>\n<p>冯有德：私留底稿，扰乱验收秩序。这种风气，必须刹。<\/p>\n<p>他开口前，眼珠照例先往左右各扫了一下。纸，碎了。<\/p>\n<p>[特殊镜头：撕纸声独占两秒，全场无声。]<\/p>\n<p>[特写：半秒——档案柜里，同一份记录的存档联完好归位，标签平整。]<\/p>\n<p>碎纸飘落桌面。雷小雨猛地站起来，被秦江海抬手按住。他盯着碎纸，眼皮都没眨。他伸手接住一片，摊在掌心看了看，才抬眼扫过全场。<\/p>\n<p>秦江海：撕吧。这单我不签——每一页我都抄了三份。<\/p>\n<p>不怒，不抖，像宣布一个天气事实。冯有德抱着文件夹的手，指节发白。桂守成低着头，在会议记录上写下一行批注。<\/p>\n<p>[特写：那行批注的笔迹，一秒即过。]<\/p>\n<p>冯有德趁势合上文件夹。<\/p>\n<p>冯有德：验料结果，另行核议。散会。<\/p>\n<p>雷小雨（低声）：验了，等于白验？<\/p>\n<p>秦江海：不。他们欠了一笔——签了字，就生利息。<\/p>\n<p>人群退场，无人敢与他对视。马长贵在门口回头看了他一眼，眼神第一次发虚。<\/p>\n<p>散会，暴雨正好砸下来。<\/p>\n<p>场景三：项目部楼门口 · 檐下 · 日 · 外（暴雨）<\/p>\n<p>雨幕连成一片。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，用袖口抚平，塞进雨靴靴筒。手指被雨水泡白了，不停。雷小雨撑着伞站在他身后，没催。<\/p>\n<p>他捡完最后一片，站起身，望向河面。<\/p>\n<p>[特殊镜头：闪电照出大堤全长。]<\/p>\n<p>雨顺着他安全帽的帽檐往下灌，连成一道水帘。<\/p>\n<p>秦江海（雷声里）：水位涨一格，你们就多欠我一页。<\/p>\n<p>雷声吞掉尾音。他转身往堤上走，把捡满碎纸的雨靴拎在手里——像拎一份判决书的草稿。<\/p>\n<p>[转场：次日清晨，验收会议室——长桌尽头多了一块进场牌：复核组。]<\/p>\n<p>[特殊镜头：长桌正中立着复核组进场后的第一份材料——一封信。信纸抬头一行字入画：举报：秦江海涉嫌泄露工程数据。]<\/p>\n<p>（第三集完）<\/p>\n<p>---<\/p>\n<h3>卡点体检（文末附页）<\/h3>\n<h4>第 1 集 · 卡点「雷声上弦」（情绪型）<\/h4>\n<ul>\n<li>卡点画面与台词：贴堤听水（无台词名场面）→ 分界桩「老伙计，他们把你签出去了」→ 闷雷 → 大远景剪影 +「要来水了」+ 字幕卡「汛期第一天」。<\/li>\n<li>观众必须翻页的问题：这张被全员表决围攻的拒签单，挂不挂得住？水，几时来？<\/li>\n<li>强度自检：钩子不靠悬念信息靠压迫感——雷声是全剧三圈钟的第一声上弦，观众带着「水几时来对账」进第二集；过。<\/li>\n<\/ul>\n<h4>第 2 集 · 卡点「抄写背影」（情绪型）<\/h4>\n<ul>\n<li>卡点画面与台词：窗雨淌过他白天描的水位线 → 台灯下抄写的背影（抄什么不说破）→ 雨夜深处堤上滚过不该出现的引擎声，笔尖停了半拍。<\/li>\n<li>观众必须翻页的问题：他深夜在抄什么？夜里上堤的卡车，在干什么？<\/li>\n<li>强度自检：双钩并置——动作悬念（抄写）+ 事件悬念（夜车），情绪（孤立无援仍不签）与事件（偷工进行时）互为进气口；过。<\/li>\n<\/ul>\n<h4>第 3 集 · 卡点「反咬信」（情绪 + 信息型）<\/h4>\n<ul>\n<li>卡点画面与台词：檐下把碎纸一片片捡进雨靴 +「水位涨一格，你们就多欠我一页」→ 转场复核组进场牌 → 桌上第一份材料是举报秦江海「泄露工程数据」的信。<\/li>\n<li>观众必须翻页的问题：反咬信从哪来？他抄的三份在哪、谁会看到？被「另行核议」合法放过的假堤段，涨水后先出事的是哪一段？<\/li>\n<li>强度自检：受辱当场被回击垫住（撕稿→「抄三份」时差一拍），集尾把受辱升级为受冤，委屈感与信息缺口同时拉满；过。<\/li>\n<\/ul>\n<h4>三集连续性复核<\/h4>\n<ul>\n<li>结构：三集结构与集末卡点全部承自小纲（雷声上弦／抄写背影／反咬信），32 拍逐一扩写，未新增情节线；单集时长量级约 1.5-2 分钟成片（E3 验料场略长），符合竖屏单集体量。<\/li>\n<li>口癖三变奏：E1「这单我不签」＋「签了，我把三十年押给这张单」（变奏①）／E2「这一单，我还不签」＋「水，不要你觉得」（变奏②）／E3「撕吧。这单我不签——每一页我都抄了三份」（变奏③）。每集 ≥1，三集三变奏，逐字核对原样在位。<\/li>\n<li>R1 条件可感知：E3「保熟吗」当场验料为实测小胜利（仪器读数当众念、封样双份、马长贵撂话退场）；一堤两制分屏在 E1 以界碑为轴左右摇、一侧扎实一侧水渍，视觉成立；看得见的水三集不断线（E1 河面/听水/雷雨，E2 描水位线/窗雨，E3 夜雨/暴雨/水帘/雨靴）。<\/li>\n<li>工程细节翻译件：压实度＝土没压瓷实、虚土见水就沉；钻芯复检＝钻一管土上来一量便知；标号＝这方料没长够该有的力气；封样双份＝一份送检一份留底谁也换不了；隐蔽工程留影像＝混凝土一盖一辈子没人看得见、规范要留影像。全部台词内翻译，零讲解腔（打磨后复检）。<\/li>\n<li>合规自查：零真实机构名、零真实责任人（项目部/复核组/监理皆通称）；零伤亡、零惨状、零决口，水的威力只用声音与物证（水声、雨声、水渍、料粉、碎纸、雨靴）；灾害画面只拍秩序与物证；自造专名仅临江圩、清川河。<\/li>\n<li>台词交接：本稿已过 dialogue-polish 三遍校准（人物声口／处境／去AI味清单），逐句修订留痕见项目根《台词打磨对照表.md》（内部件）；卡点与伏笔位零改动，R4 前语言卡一致性自查完成。<\/li>\n<\/ul><\/section>\n<\/main>\n<footer>miniflow harness · 本页为单文件交付物，可离线浏览<\/footer>\n<\/body><\/html>", "故事框架案.md": "# 故事框架案 · 《守堤人》（水利题材 · 拒签老总工）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：story-choreographer（编排师 · 结构选型师）· S2 structure 节点\n- 生成日期：2026-09-16\n- 输入件：skills/structure-design.md（选型三步）；选题分析报告.md 第五节「创作约束移交单」C1-C10；选题方案-爽版-基线.md（人人设/新变体/伤亡红线同源基线）；梗卡.md；热点素材.md；多视角意见书-R1.md（R1 门「附条件过」，条件 1-3 已并入本框架）；kb/structure/catalog；kb/market/structure；kb/aesthetic（pacing-density / reversal / emotion-curve / conflict-escalation）\n- 禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n- 同源声明：核心 5 人人设、「拒签蓄力 × 洪峰当众验证」新变体、伤亡红线三则，全部与基线件同源；对基线的 5 处显式修订见表 2.0-A（均有出处，非静默改动）\n- 输出契约对照：本文一/二/五/六/七节 = skills/structure-design 输出契约五节（选型/骨架/改造/注入/节奏预排）；三/四/八/九/十/十一节为移交单与 R1 条件强制的扩展节\n\n---\n\n## 一、结构选型\n\n### 1.1 选型结论总表\n\n| 项 | 选型 | 占比 | 一句话定义 |\n| --- | --- | --- | --- |\n| 主骨 | 复仇/清账结构 · 「制度清算」改造版 | 明线主干，约 70% | 冤屈建立（拒签受辱）→ 能力获得（制度权力作金手指）→ 逐层清算（三层反派连坐）→ 终局对账（问责会 + 刻名碑）；清算执行者由主角置换为自然规律 |\n| 辅骨 | 双线交叉 · 编辫式变体 | 暗线，约 30% | 明线：一张张验收单的攻防清算；暗线：汛期倒计时（水位）单调爬升汇聚，交叉引爆于洪峰。B 线每集在场 1-2 拍（非间隔式双线），规避「交叉间距 >5 拍判失衡」 |\n| 轻辅 | 单元宿命（重复结构带变量） | 装入明线内 | 「一张验收单 = 一次攻防」单元模板，变量池 = 反派四件套 × 验证物 5 种（4×5=20 变量），60 集不重样 |\n| 倒计时结构 | 汛期戏剧钟（三圈钟） | 暗线本体 | 适用。外圈气象钟 / 中圈调度钟 / 内圈物证钟，视觉本体 = 水位刻度爬升；全剧钟走完 = 决战打完 |\n\n### 1.2 主骨：复仇清账 · 四段映射（每段写实到本选题事件）\n\n| 复仇母型骨架段 | 本选题的具体事件 | 集域 |\n| --- | --- | --- |\n| 冤屈建立 | 开标会全员签字他独拒签 → 被撕底稿 → 被反咬立案 → 被调岗收章 | E1-E24 |\n| 能力获得 | 不是获得马甲，是被发配到全剧唯一还能合法留痕的岗位（堤头泄洪闸房），攒出「堤段病历本」 | E21-E40 |\n| 逐层清算 | 洪峰出险部位与他的书面拒签/警告记录一一对应 → 出险清单 = 签收清单 → 拒签清单 = 清算名单，三层反派连坐 | E49-E58 |\n| 终局对账 | 问责会 + 竣工永久性标牌刻名 + 他签下唯一一张「合格」 | E59-E60 |\n\n### 1.3 辅骨：编辫式双线（明线主干 / 暗线 / 交叉点位）\n\n- **明线（70%）**：验收单攻防与清算推进。每集主认知更新只有一个（AE-INFO-LOAD），落在明线。\n- **暗线（30%）**：汛期倒计时。每集 1-2 个 tick 拍（雷声/雨情/渗压/水位刻度），不作主认知更新，只做压迫蓄能。\n- **实质交叉点位（6 处，引爆逐级加压）**：E10 管涌当众验证（水第一次替他说话）→ E24 小洪峰预判兑现（水第一次听他的）→ E30 开膛见假被销项（他认清只有水能同时作废所有签收）→ E42 调包未遂（水情日志成物证）→ E49-56 洪峰全交叉引爆 → E57-58 清算对账。交叉间距最长 12 集，其间暗线每集在场不断线，不判双线失控。\n\n### 1.4 汛期戏剧钟（三圈钟设计）\n\n| 钟圈 | 载体 | tick 频率 | 视觉本体 |\n| --- | --- | --- | --- |\n| 外圈·气象钟 | 上游雨情、台风生成与路径（剧内通称，无台风名） | 每 8-12 集一格收紧 | 雨带预报画面、雷声 |\n| 中圈·调度钟 | 泄洪调度令、闸门开度、预泄库容（病险水库主汛期空库运行的 C 级制度剧内化，见提案 D） | 每道令一响 | 开度表、令单 |\n| 内圈·物证钟 | 渗压读数、坡面渗水、管涌、水位刻度 | 每集 1-2 拍 | 水位刻度一格一格爬（全剧钟的钟面） |\n\n钟与剧情咬合的规则：反派每抢一格工期，钟响一声——他们在跟汛期抢时间，他在跟他们的签字抢时间。E1 集尾雷声第一响上弦，E50 责任状为钟面顶格，E55 刻度回落为钟走完。\n\n### 1.5 选型理由\n\n1. **对标人群咬合（C1）**：30-55 岁男频「尊严代偿」客群的爽感来自「冤屈建立 → 清账兑现」弧，复仇母型天然供给；家庭共看次客群吃暗线钟表紧张（决口一刻想起每一张签掉的和没签的单，C7 原话）。\n2. **梗卡回指**：主梗（神豪暴富族）只取「被低估身份 × 当众验证碾压」机制——复仇骨架的「能力获得」段由制度权力（签字权/复审权/终身责任制条款）充当，不取财富皮（梗卡风险 1 对策）；必备引擎（打脸虐渣 n=1510）由「逐层清算」段承载，带「洪水当法官」新变体进红海（梗卡风险 2 对策）；辅梗流放种田的「苦地硬核基建」由单元宿命的工段攻防承载画面库（查管涌/打桩/抢培土包）。\n3. **hot 档偏好（kb/structure/catalog §三）**：hot 偏清算/升级型，密度好布。本片选清算不选升级——R1 门明令「尊严刻度不许偷偷写成励志逆袭」（58 岁临退主角无升级欲望，升级型必滑励志模板）；救猫咪 15 节拍模板痕迹重且 E1 拒签已是原生激励事件，无需外挂催化剂；倒钩回归单用前期钩子弱（短剧慎单用），只取微回环嵌入（E1 分界桩 → E60 刻名碑；「这单我不签」×59 → 「这单我签」×1）。\n4. **市场节拍位（kb/market/structure）**：60 集 → 首卡 8-12（本框架 E10）/ 中点 30 改写模型（E30）/ 55+ 决战（E49-56），全部落在实盘节拍窗内。\n\n### 1.6 红方三视角验收自查（kb/structure/catalog §三）\n\n- **目标读者**：爽点在位——E3 小验证、E10 自证+验证双爽、E16/E24/E27/E38/E42 中型爽垫场、E53 一堤两制终验、E58 清算名单；R1 两处「犹豫」的条件（前 3-5 集小验证 / 每三集一次看得见的水 / 一堤两制第一集露脸）全部落进骨架。追。\n- **资深编剧**：骨架完整——因果链八节点齐备（见 2.12）；R1 四条手艺警告 W1-W4 逐条有结构落点（见八节对账）。过。\n- **甲方**：卖点更锐——「洪水宣读他早就写好的判词」比「洪水替他赢了」多一层可拍物（病历本/判词链）；一堤两制升格全剧视觉母题且 E1 露脸，切片物料前置。过（甲方行动项 4 为非结构事项，移交见十节）。\n\n---\n\n## 二、骨架具体化（60 集 · 五宏节点 · 九段逐节点写实）\n\n### 2.0 五宏节点主干表（任务移交的五节点 = 本框架九段）\n\n| 宏节点 | 段 | 集域 | 段功能 |\n| --- | --- | --- | --- |\n| N1 验收会拒签 | 段一 拒签立状 / 段二 首卡验证 | E1-8 / E9-12 | 拒签立住、小验证破纯受辱、首卡当众验证 |\n| N2 调岗泄洪闸 | 段三 单元攻防 / 段四 调岗闸房 / 段五 抽检开膛 | E13-19 / E20-24 / E25-32 | 四件套轮换、两级贬法送进钟楼、中点模型改写 |\n| N3 隐蔽工程取证 | 段六 取证留痕 / 段七 围标现形 | E33-40 / E41-48 | 病历本总装成「判词」、蓄满待洪 |\n| N4 洪峰验证 | 段八 洪峰 | E49-56 | 危机选择、主动抢险、一堤两制终验 |\n| N5 问责清算 | 段九 清算 | E57-60 | 连坐清算、刻名碑、口癖反打收尾 |\n\n**表 2.0-A · 对基线的显式修订点（5 处，均可追溯）**\n\n| # | 基线原状 | 本框架修订 | 修订出处 |\n| --- | --- | --- | --- |\n| 1 | E3 拒签单被当众撕 | 改为当众撕的是他私留的检测底稿；拒签记录存档联流程上撕不掉 | R1 资深编剧 W2 修正（顺手埋复盘实锤） |\n| 2 | 调岗管仓库（E25-32） | 两级贬法：E20 夺章发配仓库（三天）→ E21 转发配堤头泄洪闸房 | 任务移交节点「调岗泄洪闸」；热点素材标题「调去管仓库」降为中间一拍保留 |\n| 3 | 隐蔽工程开膛在 E33-40 段内 | 开膛前移至 E30（中点），取证段 E33-40 改为「证据被销后的重建总装」 | kb/market 中点 30 须改写模型；基线 B5/B9 伏笔缺口前收 |\n| 4 | E3 与 E20 两处「拒签单被当众撕」重复 | E3 撕底稿、E20 撕程序改为「例行归档调走存档联 + 当众收章」 | reversal KB「避免每集同一种打脸」；对抗力量学习适应 |\n| 5 | 贺工 E30 后进场 | E8 起作复核组背景板到场，E10 首卡现场在位，E16 首次出手 | 基线缺口 B3（身份揭示早半拍）的监管版加码方向 |\n\n### 2.1 段一 · 拒签立状（E1-E8）\n\n- E1【3 秒钩】【梗·口癖】验收会议室，签到笔沿长桌传递逐个落名，传到秦江海停住，笔帽在图纸上敲三下：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」——拒签写成出击（部位+缺陷+要求三要素，R1-W1）。马长贵起哄「挡大家财路」，雷小雨把检测原始记录拍在桌上。金句变奏：「签了，我把三十年押给你；不签，下游几万人押给他们？」\n- E1 集尾【卡·情绪型】【水】【伏】他不回宿舍直上堤：耳朵贴堤听水声（名场面①第一集露脸，R1 读者条件）；手指划过桩号分界桩——他拒签的段与别人签收的段第一次同框（一堤两制 E1 露脸，R1 读者条件）。雷声第一响——全剧钟上弦。\n- E2【爽】【梗7】办公桌被搬进档案室角落（调岗预演）。冯有德甩联签单：「我不要你觉得，我要你觉得。」他头也不抬：「水不要你觉得。」马长贵带人堵门递烟，雷小雨举全站仪拦门：「图纸上没有这个数。」集尾钢卷尺拍在联签单上：「量堤可以，量人心你们不够长。」口癖变奏②：「这一单，我还不签。」\n- E3【小验证·爽】【梗13/16】夜查偷工：手电光把堤坡换料卡车钉住（「偷感」名场面②）。他蹲下抓料捻开：「**这方混凝土，保熟吗？**」当场比对合格料样，雷小雨快测数据当众念出，工头语塞，群演倒吸凉气——**前 3 集小验证小赢**（R1 条件 1）。次日验收会冯有德不提验料结果，反以「私留检测底稿、扰乱验收秩序」**当众撕他的检测底稿**（受辱顶点；存档联撕不掉【伏】）。他当拍回击（≤2 拍红线内）：「撕吧。这单我不签——每一页我都抄了三份。」（口癖变奏③）集尾雨中把碎纸一片片捡进雨靴：「水位涨一格，你们就多欠我一页。」【水】【伏：雨靴·口癖总变奏的「抄三份」】\n- E4【伏】数据保密程序风声起；马长贵放话「是你的章硬还是我的路子硬」。\n- E5【水】【伏】雨后他巡堤测渗压，逐桩记录拍照一式两份（留痕链开始，R1 条件 2 铺垫）；马长贵堤段坡面渗水初现——看得见的水。\n- E6【伏】他提交《分部验收异议书》（书面出击）。桂守成首次亮「按程序办」：「程序要件不全，退件。」——第一层流程墙；退件批注笔迹特写【伏：E36 笔迹比对】。\n- E7【梗8】同僚劝「格局打开」，他回「堤垮了格局更大」；雷小雨被单独谈话（策反前奏【伏：提案 B 变体】）。\n- E8【最低谷·受冤】复审组进场，第一份立案的是反咬信——举报秦江海「泄露工程数据」（提案 C 兑现，受辱升级为受冤）；资料权限被收。贺工作复核组背景板首次到场（基线 B3 修正），不表态，保温杯拧开又拧上。\n\n### 2.2 段二 · 首卡验证（E9-E12）\n\n- E9【死局·付费前置钩】听证式验收会：反咬信 + 联签生效表决在即，他被「请」出会议室。门外雨声炸响，他隔门一句：「数据是真的，水会来对。」悬念顶格（免费段末，kb pacing 卡点站位 8-10 集末）。\n- E10【首卡·当众验证兑现·爽×2】雨后第一轮涨水，马长贵堤段出管涌——现场对质：他「泄露」的数据与现场实测分毫不差，反咬信当众反转，**自证 + 验证双爽**（强度对标 b016-fam 同位爆点：对赌死局 → 徒手复原数据的同位物 = 受冤死局 → 水位线对照打脸）。桂守成冷处理：「个别点位，按程序处置。」局部返工销项。群演低语「扫地僧」【梗4】。**集末付费墙卡点（C6：卡点事件 = 首次当众验证，8-12 集窗内）**：马长贵冷笑「六处险工段，你拦得住这一处吗」——水位刻度爬升特写。\n- E11 赢一场小的、输一局更大的（R1 矛盾并列 1 仲裁）：复工表彰公示，马长贵上台领「抢工期先进」。\n- E12【一堤两制正式点题】【水】雨夜复核走堤：分界桩两侧浑水点密度差第一次被镜头明确分屏（视觉母题 E1 露脸 → E12 点题 → E53 终验，三级递进）。贺工蹲下摸桩号，全剧第一句台词：「我看看。」\n\n### 2.3 段三 · 单元攻防（E13-E19）——四件套第一轮轮换\n\n- E13 单元宿命模板开轮：一张验收单 = 一次攻防（施压 → 书面回击 → 集尾卡点）。\n- E14【伏】权限被收后的取证难：借阅登记簿上出现不该出现的笔迹【伏：桂】；雷小雨以「留样柜自检」名义另存平行样【伏：E42】。\n- E15 「先签后补」页摆到他面前要求补一道「程序性签字」，他拒签并指出该页对应桩号（出击式拒签复用模板）。\n- E16【爽·梗5】标高复核对赌：年轻技术员「合格」结论被贺工当场算塌——「你大爷还是你大爷」位；堤前水面同框【水】。\n- E17 马长贵发烟压班组闭嘴；老周首场（接烟不说话，「我就路过」）。\n- E18【场面梗·水】耳朵贴堤听水声教学带徒（名场面③）；老周私下口述夜施内情，不敢落名（口证不算痕——逼出后文书面化动机）。\n- E19【四件套之三】冯有德以「防汛窗口期」强推合龙段验收——正确的理由干错误的事；书面异议再遭「程序要件」退件。\n\n### 2.4 段四 · 调岗泄洪闸（E20-E24）\n\n- E20【大卡点·情绪型】【梗6 反讽位】「例行归档」调走拒签存档联，当众宣布他调离总工岗、收章；众人笑谈「老师傅也被整顿了」——切片标题反打位。雨靴挂上仓库钥匙串（受辱与物件同框）。\n- E21 仓库三日（「调去管仓库」情绪位保留，见热点素材第四节标题样本）；调令二下：汛期闸门值守缺人，转发配堤头闸房——冯有德眼不见为净（**对抗力量错误适应的起点**：他们把发配地选成了全剧钟楼）。\n- E22【水】闸房报到：开度表、水位刻度、闸下出流——暗线主场化，中圈钟就位。\n- E23【伏·水】他发现调度台账的库容参数对不上雨情（台账按「验收合格」的老资料编——围标链连水情都做过手）；开始私下记《闸房水情日志》。\n- E24【爽·中型·反转①因果型】小洪峰预判：他提前 48 小时书面建议 + 备选应急方案；建议被弃，洪水如期，值班员按他留的备选方案度过——「水听他的」第一次预演（铺垫：E18 听堤、E23 台账）。\n\n### 2.5 段五 · 抽检与开膛（E25-E32）——中点模型改写\n\n- E25-26 上级抽检进场（平息舆情）；围标链布置换样。\n- E27【爽·反转③预期+立场型】换样被抓现行（雷小雨的留样标记）；同集她发现自己名字已被夹进某分部联签校核页——**诱签陷阱收口**（提案 B 变体兑现，铺垫：E7 谈话、E14 留样）。\n- E28-29 齿墙开挖之争：他书面申请开挖检查隐蔽工程（出击）；表决结果「附条件开挖：只挖一处、挖完即回填」——流程先锁死结果【伏】。坑底渗水同框【水】。\n- E30【中点·反转④预期型·模型改写】开膛见假齿墙（全场以为开膛 = 他赢）；桂守成当场启动应急处置程序：回填、重新取样、资料补齐销项——铁证被流程吃掉。**故事模型自此改写（不是提高音量）**：从「在体系内挡下每一张单」改写为「体系已被流程殖民，唯一能同时作废所有签收的只有洪水」——他对贺工说：「挡不住了。往后我只做一件事——把每一处都写下来，等水来对账。」\n- E31 雷小雨的校核页再被夹进销项附件（她被越捆越深）。\n- E32【水】【伏】第一道泄洪调度令下达（空库迎峰 tick）；他读令发现预泄库容与台账矛盾——暗线证据 +1（中点 → 首卡间中型信息爽点垫场）。\n\n### 2.6 段六 · 隐蔽工程取证（E33-E40）\n\n- E33【代价·爽·中型】老周书面交底夜施内情并附记工单复印件（物证小赢），当天被辞——证人代价（依赖维度升级）。\n- E34 实名举报递交，换来「程序合规」受理回执（石沉大海开始）。\n- E35【大卡点·信息型】举报被驳回——驳回依据正是 E30 的销项文书（用流程吃流程）；贺工亮终审姿态：保温杯拧开，「我看看。」把驳回卷宗留下（复复核权首亮）。当夜暴雨拍窗【水】。\n- E36【反转⑤立场型】围标链轮廓现形：招标代理—资料代编—先签后补一条龙；E6 退件批注笔迹与反咬信比对同源——桂守成浮出。\n- E37 台风外围雨带逼近【水】；表彰会筹备铺陈（形式主义蓄势）。\n- E38【爽·中型·梗15】表彰会歌舞被雷小雨一句「堤还没验」摁停——「听我说谢谢你」讽刺位；冯有德失态。会场外暴雨【水】。\n- E39【留痕总装·伏】闸房内清点雨靴防水袋：重抄底单、双份照片、渗压记录并册——**「堤段病历本」11 处成形**（桩号—缺陷—日期—要求一一对应，R1 条件 2 铺垫完成）；闸下出流声底噪【水】。\n- E40【爽·梗2】带徒台词：「真正的基建狂魔，是敢对堤说不的人。」（切片位）围标链在剧内被定性为「一条龙」（通称，无机构名）。\n\n### 2.7 段七 · 围标现形与蓄满（E41-E48）\n\n- E41【水】台风生成、路径命中流域上游（外圈钟收紧）——抢工期与抢验收双钟同拨。\n- E42【爽·反转⑥预期型·梗9】资料站调走闸房日志未遂——雷小雨的存档副本救证，「求锤得锤」；调包笔迹落到桂守成。\n- E43【伏：清算钥匙】冯有德被推到前台开「集体决定」扩大化签名会——他把每一页都签了，恰好把「集体」钉成「个人合集」（E58 逐页拆解在此上膛）。\n- E44-45【压制段·螺旋下降最低谷】他被停职审查、收闸房钥匙（钟楼被收走）；交出钥匙串，只留下雨靴。停职夜雨【水】。\n- E46【微反击·防丧】雷小雨与老周暗续水情日志；贺工把病历本副本正式登记进复核卷（制度容器藏火种）。夜巡雨水样登记【水】。\n- E47【水·梗3】台风路径锁定：群众一句「今年不用去临江看海了」反讽位；转移预案启动。\n- E48【蓄满·判词意象】复职令未下，他被「责令离堤」；他把病历本誊清三份各归其位（贺工复核卷 / 闸房夹层 / 随身）：「等水来，这就是判词。」台风夜第一声雨——压抑蓄满（爆发点前的「最后稻草」已备）。\n\n### 2.8 段八 · 洪峰验证（E49-E56）\n\n- E49【水】一号洪峰编号；转移启动——**只拍秩序**（手电列队、沙袋传递、雨衣背影，零伤亡零呼救，红线二）。他冒雨折返堤上（主动性①：巡堤查险，R1 条件 3）。\n- E50【危机选择·口癖总变奏·情绪顶点】调度令开闸时刻与台账库容矛盾爆发：按令开闸 = 下游险工段雪上加霜；不开 = 闸体超限上游漫灌——互不兼容且均有代价。他以终身责任签下**迟开闸 4 小时错峰**的责任状：说了一辈子「这单我不签」，这一次一个字没说——笔帽敲三下，落笔签名（主动性②；全剧唯一一次主动落笔，动作母题闭环）。\n- E51-52【主动抢险·爽】病历本变部署图：拒签记录 = 抢险地图（标记管涌群、预置沙袋、分流抢护）——**他的留痕第一次直接救人**（主动性③）；贺工带复核组到场终审取证（E48 副本启用）。\n- E53【全剧主反转·一堤两制终验】【水】同一水位下分屏：出险 8 处全部落在他记录的 11 处之内（**因果可归因，禁天罚式精准巧合**——另 3 处未出险，如实呈现质量是概率）；险情最重的一处，恰是当年异议被驳回、人被调岗没拦成的桩段（他的自责——同时封死「拒签段毫发无伤」与「精准垮塌」两个极端，R1-W2 落实）。\n- E54【爽·梗10/12】回旋镖位：出险清单 = 签收清单；切片双关「这次塌的是真的」（措辞纪律：画面为出险渗漏抢护，非垮塌惨状，红线一）。\n- E55【水】闸开错峰，洪峰过境；水位刻度由爬升转回落——全剧钟走完。\n- E56 水退。雨靴在退水里浮起，他捞起来抱在怀里（水的威力用物说，红线一）。\n\n### 2.9 段九 · 问责清算（E57-E60）\n\n- E57【清算①·梗11】问责会前夜：出险堤段清单与各段联签页并置；「施工队是临时的」甩锅被终身责任制条款当场钉死。\n- E58【清算②·马甲单点揭示·清算名单】问责会：他交出被撕后重抄的一摞拒签单——**一页对一段，逐页念**（拒签清单 = 清算名单，可见可数对标 b028-s 标尺）；连坐清算顺序逐层落（见 4.3）。桂守成亮出「已老实」位【梗14】。\n- E59【清算③·刻名碑】竣工永久性标牌：五方名字上碑——碑既刻功也刻债（终身责任制双向咬人）。他把重险桩段列为返工首位，并自请连责（问责组核为其调岗期间无签权——他不揽功也不诿责，尊严刻度）。\n- E60【落点·问责与守护】「**这单我签。**」——全剧唯一一次说出这句话：复职令被他换成驻段质检申请（不写成励志逆袭，R1 并列 3）；雷小雨接过钢卷尺；他再次贴堤听水（E1 动作回环收尾）。水面平静，刻度归零。\n\n### 2.10 付费卡点表\n\n| 站位 | 集 | 事件 | 类型 |\n| --- | --- | --- | --- |\n| **首卡（付费墙）** | **E10 末** | 当众验证兑现 → 马长贵放话「六处险工段」+ 刻度爬升 | 事件型（C6：卡点事件 = 首次当众验证，8-12 窗内） |\n| 大卡点 | E20 | 收章调岗、雨靴挂钥匙串 | 情绪型 |\n| 中点 | E30 | 开膛见假被销项 | 信息 + 情绪型（模型改写） |\n| 大卡点 | E35 | 举报被驳回 + 贺工亮牌 | 信息型 |\n| 大卡点 | E43 | 「集体决定」扩大化签名会 | 信息型（清算钥匙上膛） |\n| 决战 | E50 | 责任状无声落笔 | 情绪型顶点（55+ 决战窗内起点） |\n| 终局 | E58 | 清算名单逐页念 | 兑现型 |\n\n### 2.11 反转登记表（reversal KB：判型 + ≥2 处前置暗埋）\n\n| # | 集位 | 反转 | 判型 | 前置暗埋 |\n| --- | --- | --- | --- | --- |\n| 1 | E10 | 反咬信被现场实测打脸 | 预期反转 | E3 底稿、E5 渗压留痕、E8 立案 |\n| 2 | E24 | 被发配的人成了唯一读对水的人 | 因果反转 | E18 听堤、E23 台账矛盾 |\n| 3 | E27 | 取证者自己被签进问题段签字链 | 预期 + 立场反转 | E7 谈话、E14 留样 |\n| 4 | E30 | 开膛赢了鉴定、输了证据 | 预期反转 | E28 附条件表决、E23 台账 |\n| 5 | E36 | 反咬信笔迹 = 流程退件笔迹 | 立场反转 | E6 退件批注、E14 借阅登记 |\n| 6 | E42 | 调包日志反成钉死桂的物证 | 预期反转 | E40 一条龙轮廓、E39 清点 |\n| 7 | E53 | 一堤两制终验（主反转） | 预期反转 | 全程留痕链 + E1 分界桩 + E12 分屏 + E48 判词 |\n| 8 | E58 | 一摞重抄拒签单 = 清算名单 | 身份反转（物件式单点） | E3 抄三份、E39 清点、E48 三份 |\n\n同型连用检查：④⑤⑥为预期/立场/预期交替，无三连同型；每次反转落地后证物线全部重算（E10 后反咬信入卷、E30 后销项文书成驳回依据、E42 后日志成物证），无「反转后没人提」悬空证据。\n\n### 2.12 因果链八节点对照（conflict-escalation §一）\n\n| 节点 | 本剧落位 |\n| --- | --- |\n| 1 主题命题/反命题 | 堤保住了，因为有人以不肯签字的方式行动 ／ 工程「合规」通过了，因为签字把责任稀释成了流程 |\n| 2 欲望 | 外在：把问题堤段挡在验收之外；内在：三十年前他亲手递过一张补签单（提案 A，早期不自知，经行为模式体现——两支笔、贴堤听水） |\n| 3 激励性扰动 | E1 全员签他独拒签，原「少说少错」策略失效，被推到全项目部对面 |\n| 4 递进复杂化 | 对抗力量学习适应：驳数据（E6）→ 撕底稿（E3）→ 反咬立案（E8）→ 销项吃证据（E30）→ 调包日志（E42）；代价从尊严到生计到徒弟清白 |\n| 5 不可回头点 | E30 后他把复核申请改为实名举报（E34）——举报人自押反坐风险、放弃安稳退休，主角选择关闭退路 |\n| 6 危机选择 | E50 开闸（下游险段险化）vs 不开（闸体超限上游漫灌），互不兼容均有代价 |\n| 7 高潮行动 | E50 签责任状迟开闸错峰 + E51-52 按病历本部署抢险（全片最大价值变化：签字从逃避的债变成救命的武器） |\n| 8 结局价值与余波 | 问责兑现、刻名碑落成；未消失的代价：问题段返工需两年、他自愿留堤、冯有德调离待查 |\n\n---\n\n## 三、人设立柱（反差点）与人物表\n\n### 3.1 核心 5 人（同源基线，含监管版加码项）\n\n| 角色 | 设定 | 反差立柱 | 核心动机 | 口癖 / 标志小动作 | 加码（基线缺口修补） |\n| --- | --- | --- | --- | --- | --- |\n| 秦江海 · 58 · 临江圩除险加固项目部总工程师 | 藏蓝旧工装洗得发白，左胸口袋两支笔（一支写字、一支只画水位线——师父遗物，提案 A），胶底鞋，后腰钥匙串挂老钢卷尺 | 开会最没存在感，堤上声音最大 | 三十年前同一条河上，师父没拦住的那座坝——而补签页是他亲手送的（提案 A） | 「这单我不签。」／说话前笔帽敲图纸三下 | 劳模奖章 E1 特写提前半拍亮身份（基线 B11） |\n| 马长贵 · 45 · 施工方负责人（剧内自造主体） | 皮鞋上工地，手机外放，办公桌腿垫酒箱 | 对上点头哈腰，对工人横 | 垫资垫到抵押了房，必须赶在汛期前验收回款（有理由的错误选择） | 「规矩是死的，人是活的。」／说话先递烟 | 语言卡全配（基线 B2） |\n| 冯有德 · 50 · 项目部上级（赶工期要签字的） | 衬衫扣到顶，文件夹永远抱在胸前当盾牌 | 不贪，但怕担责 | 「集体的决定」——把个人责任稀释成集体责任 | 「再研究研究。」／签字前先看左右 | 同上；E43 签名会成为其人设的清算钥匙 |\n| 雷小雨 · 26 · 测绘员（徒弟） | 反光背心，安全帽上一圈手绘警戒红线的黄色胶带，安全帽带子永远不扣 | 全项目部唯一公开站在老头一边的人，年轻人里最「多事」 | 她信数据不信酒桌 | 「图纸上没有这个数。」／拿全站仪当拐杖 | 外形记忆点加码（基线 B1）；零感情线声明：纯师徒/同事（C4-③） |\n| 贺工 · 60 · 复核组老专家（复审方） | 旧夹克，布鞋，手里始终捏着掉漆保温杯 | 退居二线说话没人当回事，出手就是终审 | 退休前最后一趟，想把当年的糊涂账算清 | 「我看看。」／保温杯拧开又拧上 | E8 起背景板提前进场（基线 B3） |\n\n### 3.2 扩展有名有姓 2 人（非核心，服务反派第三层与证人线）\n\n| 角色 | 设定 | 功能 |\n| --- | --- | --- |\n| 桂守成 · 44 · 监理负责人 | 从不违反任何一条程序，「按程序办」挂在嘴边，签字永远超前于施工 | **反派第三层在项目部内的面孔**：先签后补的发源地、退件流程墙、销项程序的启动者；口癖「按程序办。」 |\n| 老周 · 55 · 马长贵班组料工 | 寡言，见谁都递烟，「我就路过。」 | 夜施内情证人：E17-18 口证 → E33 书面交底被辞 → E46 暗续日志 → E58 作证（证人代价线） |\n\n师父（三十年前）不登场不具名，仅存于遗物（那支只画水位线的笔）与 ≤3 次闪回（见提案 A）。**有名有姓合计 7 人（≤10），核心 5 人（≤5），群演不计入。**\n\n### 3.3 三分钟测试自查（C4-⑥）\n\n- E1 第 1-2 拍内三个身份全部亮相：修堤的（工装/卷尺/贴堤听水）、偷工减料的（起哄「挡财路」+E3 换料实锤）、不签字的老工程师（「这单我不签」）。\n- 零设定前置：终身责任制、汛期问责均为公共语汇（C 级制度议题），无一术语需先讲设定才能进冲突；验证动作层全部画面化翻译——贴堤听水、手电照管涌、抓料捻开、水位刻度对照（R1 第六节「翻译习惯」落实）。\n- 片名「守堤人」直白可复述（R1 甲方复核已过）。\n\n### 3.4 场景与角色对账（C3）\n\n三景集合（总数 3，不超）：① 验收会议室（兼容听证会/表彰会陈设，E50 后可改防汛值守点——换陈设不换景）；② 堤段工地（含汛期堤坡 + 堤头泄洪闸房——闸房为堤端小屋，与堤坡同景域搭景）；③ 项目部办公区（含资料室与仓库角——调包、诱签、归档均在资料区完成）。换景 = 换集节拍点，每集冲突均发生在可复用景。\n\n---\n\n## 四、反派梯度与连坐清算\n\n### 4.1 三层梯度——「把偷工减料做成流程的人」\n\n| 层 | 角色 | 作恶形态（流程感） | 亮层时刻 | 对立统一（立场各自成立） |\n| --- | --- | --- | --- | --- |\n| 一 · 动手的 | 马长贵 | 偷工减料、夜施换料、隐蔽工程不留影像 | E1-E18 | 垫资抵押房产，汛期前必须回款——他也在跟汛期赛跑 |\n| 二 · 签字的 | 冯有德 | 先签后补稀释责任、调岗排异、拿防汛窗口期压质量 | E19-E42 | 不贪，但怕担责——稀释是他自保的理性选择 |\n| 三 · 做流程的 | 桂守成（围标链项目部内面孔） | 把验收做成流水线：退件程序墙、销项程序吃证据、资料一条龙、水情台账做手 | E6 暗起 → E30 掌权 → E36 现形 → E42 实锤 | 从不违反任何一条程序——他的每一步都「合规」，这正是全剧要钉死的东西 |\n\n三层递进的升级逻辑（回应 R1-W3 中段燃料）：从「驳你的数据」到「撕你的底稿」到「吃你的证据」到「调你的人」——反派每次升级都是对主角上一招的适应，无复读。\n\n### 4.2 四件套节拍轮换表（反派作恶锚 C7，单元变量池）\n\n| 四件套 | 第一轮 | 第二轮 | 第三轮 | 第四轮 |\n| --- | --- | --- | --- | --- |\n| 先签后补稀释责任 | E15 补签页 | E27 诱签校核页 | E31 销项附件夹带 | E43 扩大化签名会 |\n| 隐蔽工程不留影像 | E3 夜施换料 | E14 权限墙 | E29 附条件开挖 | E42 调包日志 |\n| 防汛窗口期压质量 | E19 合龙强推 | E25-26 抽检赶场 | E37 表彰会抢验收 | E41 双钟同拨 |\n| 把提问题的人调岗边缘化 | E2 搬桌预演 | E20 夺章发配 | E34 举报石沉大海 | E44 停职收钥匙 |\n\n### 4.3 连坐清算顺序（E57-E59，可见可数）\n\n清算顺序 = 签字链还原顺序（改造自复仇母型「清算顺序倒序」标志件，见五.1）：\n\n1. **马长贵（动手层）**：出险段落按联签自证 → 返工自费、押金抵赔、行业禁入；他的房已经抵了（代价可数）。\n2. **桂守成（流程层）**：先签后补页时间戳 × 闸房水情日志雨情时标对撞（物证：E23-E32 日志）+ 雷小雨存档副本 → 执业资格吊销、移送调查——「已老实」位【梗14】。\n3. **冯有德（签字层）**：联签单逐页拆解——「集体决定」被还原为一页页个人签名，每页对应他签掉的具体部位（他要的稀释被原地逆操作）；调离现职、配合调查。收尾台词对立统一不破功：「我以为把名字签在一起，就没人淹死了。」\n4. **围标链（分饼层）**：审计进场封资料（只拍封条动作，不展开司法戏，留白），涉案移交剧内上级联合调查。\n5. **秦江海自请连责**：对「没拦成的那一处」自请处分（尊严刻度：不揽功不诿责），核为其调岗期间无签权。\n\n清算物件对位（C9 四件全给）：拒签单（E58 逐页念）／水位线对照（E53 分屏 + E57 清单）／竣工永久性标牌（E59）／雨靴（E58 防水袋底单交档）。\n\n---\n\n## 五、改造点清单（每个改造点回指梗卡新变体落点）\n\n| # | 改造点 | 母型原状 | 改造后 | 梗卡回指 |\n| --- | --- | --- | --- | --- |\n| 1 | 清算执行者置换 + 清算顺序倒序 | 复仇母型：主角以能力/马甲逐层清算对手 | 自然规律代执行（洪水宣读他早就写好的判词，判词 = 病历本 11 处记录）；清算顺序按签字链还原倒序连坐 | 新变体「他没打赢任何人，是洪水替他赢了」；关系轴新「物理当打脸手，链上未做」；「拒签清单=清算名单，机制咬合」 |\n| 2 | 金手指置换 + 带成本 | 神豪族：隐藏财富/身份当众碾压 | 权力型制度金手指（签字权/复审权/终身责任制条款），且每次使用带成本：拒签一次岗级掉一层（E1 拒签 → E2 搬桌 → E20 收章 → E44 停职） | 梗卡风险 1「换皮陷阱」对策：爽点一律锚「拒签 × 洪峰验证」机制，禁财富皮 |\n| 3 | 马甲掉马标志件改造 | 当众多层撕马甲 | 物件式单点揭示（一摞重抄拒签单，E58 仅此一层） | 梗卡风险 2：马甲过饱和，仅许物件式单点揭示，禁多层当众撕 |\n| 4 | 双线暗线性质改造 | 商战/悬疑型暗线（人的阴谋间隔汇聚） | 自然倒计时暗线（水位单调爬升，编辫式每集在场），交叉引爆 = 洪峰 | C7 汛期倒计时戏剧钟；b024-na 同构（灾难可预测化，从突发事故置换为可预测 tick） |\n| 5 | 激励事件前置为主动出击 | 救猫咪式催化剂约在 10-12% 处由外部事件触发 | E1 第一拍即拒签，且拒签是主动出击（部位+缺陷+要求），快反击型开局 | C6 E1 布点；R1-W1「拒签写成出击而非忍耐」 |\n\n---\n\n## 六、不确定因素注入提案（≥2，含 R1 备选提案 A/B/C 处置）\n\n> R1 门已附条件过，意见书第八节三提案为「可选增强、非强制」。本节按 structure-design 纪律给出注入评估与融入建议；标注【需 R2 复核】者不得免审写入正稿。\n\n### 提案一（必融）｜「九八的债 · 那张单」——R1 提案 A 升级版（人物前史层）\n\n- **注入节点**：E1 物件层（两支笔之一 = 师父遗物，零闪回成本）→ E30 策略转向台词的重量 → E42 围标链现形时点破「三十年前就是这套手法」→ E50 责任状总爆发 → E58 自请连责的根。\n- **内容**：三十年前九八抗洪（与基线「三十年前同一条河」对齐），师父拦一处偷工堤段未果——验收单被「先签后补」；26 岁的秦江海是资料员，**亲手把补签页送进了流程**（他的私罪）；当夜师父上抢险队没回来（只拍雨夜背影与事后遗物那支笔，零灾情画面）。基线的「师父没拦住」升级为「师父没拦住，而他递了那张单」——拒签 = 三十年赎罪，每一张拒签单都是重写当年那张单。\n- **改变哪些后续节点**：E1 拒签动机从职业操守升为命债；E50「从拒到签」的弧光翻转（不是妥协，是把名字押上去——他在做当年没人敢做的事：把责任签在自己名下）；E58「不揽功」有根。\n- **增益**：R1 目标读者「58 岁逆袭增量不足」的犹豫翻盘（他赌的不是前程是命债，58 岁输得起前程输不起再来一次）；补全冲突四层次的私密层（他对抗的也是当年的自己）；反转铺垫获得前史纵深。\n- **风险**：闪回拖节奏（限 ≤3 次、每次 ≤3 拍、只置卡点前夜）；九八记忆合规（只取抢险与牺牲的英雄记忆，虚构人物往事，不指认真实工程责任）；可选联动件——贺工当年是那座坝复核盖章人之一（增益「我看看」= 迟到三十年的终审；风险：小圈子巧合感，用一句「全流域老熟人低头不见抬头见」自洽，方案阶段可裁）。\n\n### 提案二（融入，轻量）｜「她的名字进了签字链」——R1 提案 B 的不烧盟友变体（身份层）\n\n- **注入节点**：E7 谈话伏 → E27 收口（发现名字已在联签校核页）→ E31 加深 → E42 存档副本正名 → E58 作证。\n- **与 R1-B 原案差异及理由**：不把雷小雨写成被收买——「信数据不信酒桌」的人设使收买不可信（对立统一失效），且烧掉唯一盟友会毁 R1 目标读者认可的尊严刻度（「他保住了徒弟和堤」）。改为诱签陷阱：围标链的「资料一条龙」把她的校核签名夹进先签后补页——最亲近之人被拖下水（观众背不出来的节点保留），但她的选择是正面弧光。\n- **增益**：R1-B 的「背叛张力」效率全保留（不加角色不加场景）；直接喂 R1 条件 2 留痕链（她的存档副本 = E42 救证物证）；E46 微反击的动力源。\n- **风险**【需 R2 复核】：变体未过四视角（原案 B 过的是「一般读者」flip）；她戏份上抬挤主视角——控制线：单集 ≤2 拍、每场必须服务该集唯一主认知更新。\n\n### 提案三（必融）｜「复审组先查他」——R1 提案 C 原案（事件层）\n\n- **注入节点**：E8 反咬信立案 → E10 自证+验证双爽 → E14 权限被收的因 → E20 调岗闸房后的结构胶水（被收权限的人被发配到唯一还能合法留痕水情的岗位）。\n- **增益**：首卡强度保险（甲方对标 b016 双爽有结构保障）；受冤高于受辱（尊严刻度）；提前堵死「他为什么不直接举报」的观众问（权限被收 → 举报无据 → 只能先留痕）。\n- **风险**：立案程序一笔带过（零解释成本：只拍「收缴数据权限的通知单」动作，不展开流程）。\n\n### 提案四（必融，新增）｜「空库令」调度钟（世界观规则层）\n\n- **注入节点**：E22 闸房钟楼就位 → E32 第一道调度令 → E41 双钟同拨 → E50 危机选择的总开关。\n- **内容**：病险水库主汛期空库运行、泄洪调度（C 级真实制度，热点素材第三节 3）剧内化为全剧官方倒计时：每一道调度令 = tick；他调岗闸房 = 被发配到钟楼；E50 他用 30 集攒下的水情日志证明台账参数被围标链做过手——调度令的依据本身是假的。\n- **增益**：戏剧钟可视化 + 「发配」变「置顶」的反讽引擎；给 E50 危机选择提供制度级两难（按令开闸是「合规」，违令迟开他终身担责——主题压成一锤）。\n- **风险**【需 R2 复核】：水利调度专业性——纪律：全部术语画面化（开度表/刻度/令单），禁台词讲解；调度写剧内通称，不对应任何真实调度机构与真实调度事件。\n\n**R1-B 原案（徒弟泄密者）处置**：不取，理由见提案二；记录在案，供 R2 对照复核。\n\n---\n\n## 七、节奏预排与密度自查\n\n### 7.1 首卡 / 中点 / 决战位置（kb/market/structure 对表）\n\n- 首卡：E10 末（窗 8-12 ✓，卡点事件 = 首次当众验证 ✓）；免费段前置钩 E9 末死局顶格。\n- 中点：E30 开膛销项——模型改写（体系内挡 → 写下来等水对账），非提高音量（reversal KB「中段只提高音量」病规避）。\n- 决战：E49-56（55+ 窗 ✓），E50 危机选择为全片最大价值变化。\n\n### 7.2 hot 档密度供给引擎（每集爽点 ≥3 的结构性来源）\n\n每集三槽位，由骨架保证供给、由 S3 分拍填装：\n\n1. **台词槽**：口癖或拒签三要素金句 ×1（出击式拒签自带台词引擎）；\n2. **对撞槽**：四件套施压位 → 书面/物证回击 ×1（受辱 → 回击 ≤2 拍红线由「当拍回击」模板保证，E3 为范式）；\n3. **碎片槽**：身份碎片 / 物证特写 / 水位 tick ×1（两支笔、奖章、雨靴、防水袋、刻度、开度表轮换供料）。\n\n历史参照（sess_aa829e9e：监管版 63 拍 vs 基线 40 拍）——本框架以槽位引擎把密度做进结构，而非靠后期加码。\n\n### 7.3 沙漠段预扫（AE-DESERT / AE-CUSHION）\n\n| 风险段 | 风险 | 垫场配置（两大卡点间 ≥2 中型爽点） |\n| --- | --- | --- |\n| E13-19（首卡后长循环） | 单元同质疲劳 | E16 标高复核打脸 + E18 听堤名场面/老周口证；且 E11 销项反噬压住首卡后狂欢（防爽后真空） |\n| E33-40（取证文戏密段） | 全剧最高沙漠风险 | E33 老周交底物证小赢 + E35 大卡点（贺工亮牌）+ E38 表彰会摁停 + E40 金句——卡点间垫场 ≥2 ✓ |\n| E44-48（压制段） | 螺旋下降丧到底 | E46 微反击（存档副本 + 复核卷藏火种）——「微小反击」纪律 ✓；低谷段同步推进围标链信息与证据总装（低谷不空转） |\n\n「看得见的水」预扫（R1 读者条件：每三集一次实体水）：E1 雷/水面、E3 夜雨、E5 渗水、E9-10 雨/管涌、E12 分屏、E14 水样、E16 堤前水面、E18 听堤、E20 雨中收章、E22 闸下出流、E23-24 台账雨情/小洪峰、E25 水样、E29 坑底渗水、E32 令/闸、E35 暴雨、E37 雨带、E38 场外暴雨、E39 出流声、E41-E60 全水段——任意无水缺口 ≤2 集 ✓。\n\n### 7.4 口癖变奏表（C8：每集 ≥1 次，3 集内变奏 3 次）\n\n| 集 | 台词 | 性质 |\n| --- | --- | --- |\n| E1 | 「这单我不签。」／「签了，我把三十年押给你；不签，下游几万人押给他们？」 | 本句 + 变奏① |\n| E2 | 「这一单，我还不签。」＋「水不要你觉得。」 | 变奏② |\n| E3 | 「撕吧。这单我不签——每一页我都抄了三份。」 | 变奏③（当拍回击） |\n| E48 | 「等水来，这就是判词。」 | 变奏④（判词语态） |\n| E50 | （无台词，笔帽敲三下落笔） | 动作变奏（写动作不写喊） |\n| E60 | 「这单我签。」 | 全剧唯一反打，人设兑现即爽点兑现（基线 R5 判定沿用） |\n\n### 7.5 十六条热梗全量挂接表（C8 全量落实，修基线缺口 B6b）\n\n| # | 梗 | 挂接节点 |\n| --- | --- | --- |\n| 1 | 豆腐渣工程 | E30 销项时群演低语；E57 问责会台词 |\n| 2 | 基建狂魔 | E40「真正的基建狂魔，是敢对堤说不的人」 |\n| 3 | 到 XX 看海 | E47「今年不用去临江看海了」反讽位 |\n| 4 | 扫地僧 | E1 奖章特写伏 → E10 验证后群演低语兑现 |\n| 5 | 你大爷还是你大爷 | E16 贺工算塌「合格」结论 |\n| 6 | 00 后整顿职场 | E20「老师傅也被整顿了」反讽切片位，终局回收 |\n| 7 | 我不要你觉得 | E2「我不要你觉得」×「水不要你觉得」 |\n| 8 | 格局打开 | E7「堤垮了格局更大」 |\n| 9 | 实锤/求锤得锤 | E42 存档副本救证「求锤得锤」 |\n| 10 | 塌房 | E54 切片双关「这次塌的是真的」（画面为出险抢护，措辞纪律：不涉人员） |\n| 11 | 临时工 | E57 甩锅「施工队是临时的」被终身责任制钉死 |\n| 12 | 回旋镖 | E54/E57 出险清单 = 签收清单 |\n| 13 | 偷感（很重） | E3 夜查手电钉车名场面 |\n| 14 | 已老实，求放过 | E58 终身责任制条款亮出，桂当场「已老实」 |\n| 15 | 听我说谢谢你 | E38 表彰会歌舞被「堤还没验」摁停 |\n| 16 | 这瓜保熟吗 | E3「这方混凝土，保熟吗？」小验证 |\n\n每集 ≥1 可独立切片梗点由 7.2 三槽引擎 + 上表节点位保证；逐集梗点落表由 S3 分集大纲执行并复检。\n\n### 7.6 情绪曲线判定（emotion-curve KB）\n\n- **主型（唯一）：层层递进**——赌注梯逐级抬高：E1-12 一纸验收单与职业尊严 → E13-30 岗位与生计（调岗收章）→ E31-48 徒弟清白与自证（诱签/停职）→ E49-60 全圩身家与终身名（碑上名字）。每级高于上一级，无失衡。\n- **嵌段**：E44-48 为螺旋下降微段（有 E46 微反击，防彻底丧 ✓）；E50 为 60% 压抑后的单点爆发（最后稻草 = E48 责令离堤 + 台风夜首雨，爆发有力 ✓）。\n- **低谷纪律**：E44-48 低谷段同步完成围标链轮廓信息与证据总装（低谷推进信息，非纯低谷 ✓）。\n- **回环余味**：E1 贴堤听水 → E60 贴堤听水、分界桩 → 刻名碑、「不签」→「签」，倒钩元素微回环嵌入（不作主骨）。\n\n---\n\n## 八、约束对账表（C1-C10 + R1 条件逐条）\n\n| 条 | 要求 | 本框架落实 | 判定 |\n| --- | --- | --- | --- |\n| C1 | CN 竖屏付费；男频实事爽剧；主客群 30-55 男 + 家属共看 | 尊严刻度定位贯穿（终局驻段质检非高升复职，防励志模板）；E1/E12/E53 截图拍位前置 | ✓ |\n| C2 | 60 集 × 1-1.5 分钟 × 单集 ≤1200 字 | 框架按 60 集九段排布，节拍密度按单集 600-900 字剧本量预估（kb pacing §五），无隐式偏离 | ✓ |\n| C3 | 主场景 ≤3；有名有姓 ≤10；核心 ≤5 | 三景集合（3.4）；有名有姓 7；核心 5；换景=换集 | ✓ |\n| C4 | 六禁 | ①零架空术语（制度皆公共语汇，验证动作画面化）②零重生先知（验证全靠事前留痕）③无团宠/真假千金/强爱情线（雷小雨纯师徒线，零感情戏，显式声明）④爽点零财富皮（清算=水位+文书）⑤零多层马甲（E58 物件式单点）⑥三分钟测试过（3.3） | ✓ |\n| C5 | 合规红线（一票否决） | 全稿零真实机构名/责任人（项目部/复核组/监理/上级单位皆通称；围标链剧内称「一条龙」）；自造专名 2（清川河、临江圩），余量 1，前三章 ≤2；真实灾害只作情绪举证、剧内事件独立成案；零伤亡消费（九节）；不喊口号（愤怒全落反派具体动作）；落点问责与守护 | ✓ |\n| C6 | 首卡 8-12 集当众验证；E1-3 布点 | 首卡 E10（卡点事件=首次当众验证）；E1 独拒签/E2 施压对撞/E3 夜查受辱顶点+集尾连本带利伏笔，全按梗卡；+R1 条件 1 小验证（E3，受辱不连续铺满：E3 小赢、E5 留痕、E16/E24 垫） | ✓ |\n| C7 | 情绪锚 + 戏剧钟 + 四件套 | 主锚「较真者的憋屈 × 汛期防洪焦虑」贯穿；三圈戏剧钟（1.4）；四件套节拍轮换（4.2，回应 R1-W3）；+R1 条件 2 因果可归因（11 处记录-8 处出险-3 处未出险，禁天罚巧合）；+R1 条件 3 主动性（拒签三要素出击 + 洪峰三主动动作：折返巡堤/责任状/病历本部署） | ✓ |\n| C8 | 梗密度硬指标 | 每集 ≥1 切片梗点（三槽引擎）；口癖每集 ≥1、3 集 3 变奏（7.4）；16 条热梗全量挂接（7.5，基线 B6b 修复） | ✓ |\n| C9 | 对标强度线 + 清算物件 | E10 双爽对标 b016 同位爆点；清算可见可数：拒签单/水位线对照/刻名碑 + 雨靴（calm 档 2 件标准，实给 4 件）；清算名单逐页念对标 b028-s | ✓ |\n| C10 | 设定三级制 | 设定来源声明：实事新闻做底子（工程质量终身责任制 + 国债除险加固 + 汛期问责 + 病险水库主汛期空库运行，全 C 级可核实）；大白话标题检验过（E1 即「全项目部只有他一个不签字」的标题场面） | ✓ |\n| R1 条件 1 | 前 3-5 集 ≥1 次小验证；受辱不连续铺满 E1-E7 | E3 小验证（「保熟吗」当场验料）；E4-E8 穿插留痕/出击/垫拍 | ✓ |\n| R1 条件 2 | 洪峰验证因果可归因；禁天罚式精准巧合 | 病历本-判词链（E39/E48/E51-53）；11 处记录 8 处出险、3 处未出险、重险段为「没拦成处」——两个极端都封死 | ✓ |\n| R1 条件 3 | 主角主动性：拒签=出击；洪峰段主动动作 | 出击三要素模板（2.1 E1）；洪峰三动作（E49 巡堤、E50 责任状、E51-52 部署抢险） | ✓ |\n| R1 条件 4 | 甲方行动项（付费对标/时点策略/备案预沟通） | 非结构事项，移交主控/制片线（见十节） | 移交 |\n| 读者条件 | 每三集一次看得见的水；一堤两制与贴堤听水第一集露脸 | 7.3 预扫 ✓；E1 集尾双露脸（2.1） | ✓ |\n\n---\n\n## 九、伤亡红线三则落实（框架级，全稿含名场面清单适用）\n\n1. **水的威力物证化**：只拍物不拍人受害——水位刻度一格一格爬（全剧钟视觉本体）、管涌口翻浑水顶起碎石、坡面渗水、闸下出流、雨靴浮起；水的「大」用声音与刻度表达。框架落实位：E10 管涌、E24 小洪峰、E53 浑水点密度分屏、E56 雨靴。恐惧源 = 倒计时，非惨状。\n2. **人员镜头纪律**：E49 转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影）；全稿零遇难、零伤情特写、零呼救镜头、零寻人启事道具；群演台词零伤亡内容。\n3. **决口处理**：本框架**零决口设计**——最大险情写到「出险抢护」级（管涌群、滑坡预兆），从源头消除消费面；若 S3 论证需要决口级事件，依基线 R4 纪律执行：只拍封堵作业与事后问责会，不对应任何真实事件、不暗示任何真实责任认定。\n4. **附加（提案 A 闪回纪律）**：九八前史只拍雨夜背影与遗物（那支笔），零灾情画面、零指认真实工程。\n\n---\n\n## 十、遗留事项与移交（给 S3 选题方案步及主控）\n\n1. **B8 名场面 Poster 化**：框架已给 6 个名场面的「谁在哪对谁做什么」骨架位（E1 贴堤听水 / E3 手电钉车 / E10 管涌对质 / E12 一堤两制分屏 / E50 无声落笔 / E58 逐页念清算名单）；海报五要素级细化归 S3。\n2. **甲方行动项（R1 条件 4）**：男频实事向付费对标或平台侧验证、汛期锚发行时点策略（A 级锚只管档期、长期价值押 C 级制度底座）、平台备案预沟通——移交主控/制片线，非结构事项。\n3. **A/B 计量回填**：基线第六节留 □ 待回填位（前三集爆点计数/口癖变奏/回击时差三列），由爽版正稿定稿后并表报 R3 门。\n4. **R2 复核清单**：提案二（诱签变体）与提案四（调度钟）标注【需 R2 复核】；R1-B 原案不取的处置请红方一并确认。\n5. **S3 产物**：逐集分集大纲（含逐集梗点落表与爆点分布图）、前三集分拍初稿、全量 16 梗挂接复检、7.2 三槽位逐集装填。\n\n---\n\n## 十一、框架自检\n\n- [x] 输出契约五节齐备：一选型（含改造、融合、理由）/ 二骨架逐节点写实 / 五改造点回指 / 六注入提案 ≥2（4 件）/ 七节奏预排（首卡/中点/决战 + 沙漠预扫）\n- [x] 约束移交单 C1-C10 逐条对账（八节），R1 条件 1-3 全部落进骨架，条件 4 显式移交\n- [x] 三分钟测试自查通过（3.3）；三景/角色上限对账通过（3.4）\n- [x] 伤亡红线三则框架级落实 + 闪回附加纪律（九节）\n- [x] 与基线同源：5 人人设、拒签×洪峰变体、伤亡红线三则未动；5 处修订全部显式列表（表 2.0-A）且可追溯出处\n- [x] 自造专名盘点：清川河、临江圩（2 个，全为地名类，余量 1）；全稿零真实机构名、零真实责任人\n- [x] 未读取 projects/_archive/ 下任何内容；无任何 git 操作\n- [x] 本件为 S2 决策件，下一步移交 S3 选题方案步\n\n*依据：skills/structure-design（选型三步/注入提案/节奏对表/输出契约）；kb/structure/catalog §一-四；kb/market/structure（60 集节拍位）；kb/aesthetic/pacing-density（hot 档密度/卡点/沙漠）/reversal（判型与铺垫）/emotion-curve（六型与失衡）/conflict-escalation（因果链八节点/代价梯/对立统一）；选题分析报告·约束移交单 C1-C10；多视角意见书-R1（附条件过，条件 1-3 并入）；梗卡@2026-09-16；热点素材@2026-09-16；选题方案-爽版-基线@2026-09-16。*\n", "梗卡.md": "# 梗卡 · 守堤人（p-ts-001）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 甲方点子：老牌水利工程师，众人偷工减料混官场，唯他坚持指出工程问题（拒签问题堤段）\n- 硬约束：实事做底零解释成本（3 秒即懂\"修堤的、偷工减料的、不签字的老工程师\"）；自造专名 ≤3、无架空术语；不出现真实机构名\n- 数据快照：kakaxing/scriptrawstone@2026-09-15（6928 部解析样本）；本卡生成日 2026-09-16\n- 方法：skills/find-trope 五步；梗密度硬指标按 kb/market/meme-rules\n- 工具披露：本会话未装配 minitool `kb_search` / `check_trope_combo`——查族按 kb/trope/* 全量直读完成；复合相性按 kb/aesthetic/conflict-escalation 副线纪律人工执行（辅梗必须改变主梗的选择条件，不许只占时长）\n\n---\n\n## 一、查族结论（13 族全量，快照 2026-09-15）\n\n| 梗族 | 饱和度 | n / 占比 | 均热度（万） | 与本选题判定 |\n| --- | --- | --- | --- | --- |\n| 神豪暴富 | 上升期·蓝海偏好 | 380 / 5.5% | 18987 | **主梗候选**：机制已分化出\"隐藏硬实力→当众验证\"支线，链上无水利落点 |\n| 打脸虐渣 | 红海·有效 | 1510 / 21.8% | 18558 | **必备引擎**（横切超族，非题材），须带新变体 |\n| 流放种田 | 上升期·蓝海偏好 | 92 / 1.3% | 22598 | **辅梗候选**：取\"苦地×硬核基建翻盘\"机制，去皮（去系统/空间/穿越） |\n| 马甲掉马 | 红海·过饱和 | 750 / 10.8% | 9215（低于全库均值 10058） | 只作轻辅梗：拒签单复盘式单点揭示，禁多层马甲当众撕 |\n| 赘婿战神 | 稳定·主流 | 192 / 2.8% | 10684 | 备查：《退隐悍匠》证明中年匠人男频可行，但机制被主梗覆盖，不重复挂 |\n| 重生复仇 | 红海·有效 | 702 / 10.1% | 11978 | **不取**：重生把\"坚持\"降级为\"先知\"，毁实事共情底子 |\n| 先婚后爱 | 稳定·主流 | 387 / 5.6% | 10092 | 不相性，避开 |\n| 追妻火葬场 | 上升期·蓝海偏好 | 132 / 1.9% | 14218 | 情感族，稀释实事底子，避开 |\n| 团宠护短 / 真假千金 | 退潮期·慎入 | 63 / 83 | 2703 / 7938 | 避开 |\n| 豪门财富(NA) / 狼人命定(NA) / 奇幻生物(NA) | 过饱和 / 退潮×2 | 895 / 359 / 161 | 228 / 167 / 234 | CN 实事流不适用 |\n\n语料未覆盖声明（判定纪律 4）：题材矩阵无\"水利/防汛/基建工程\"直接类目；近似带为**职场**（202 部 / 均 20951 万）、**小人物**（69 部 / 均 17609 万）、**乡村**（153 部 / 均 20748 万）——均高于全库均值 10058 万，判断\"职业实干逆袭\"带供给不足而热度在位，用对标检索兜底（见第四节）。\n\n## 二、选型结论\n\n```text\n梗卡：\n  主梗：神豪暴富梗（上升期·蓝海偏好 / n=380 / 均 18987 万，快照 2026-09-15）\n        取机制\"被低估身份 × 当众验证碾压\"——本族演化链已从\"隐藏财富\"分化出\n        \"隐藏硬实力\"支线（《扫地姑娘是百亿精算师》→《她带着百亿订单离职了》→《老炮开山》），\n        供给未追上热度，可直接主推。实事流剥离\"财富\"皮毛，只搬机制。\n  辅梗：打脸虐渣 × 流放种田（轻辅：马甲掉马）\n        相性 1（打脸虐渣，红海·有效 n=1510 / 均 18558 万）：打脸按 kb/market/structure\n        判定纪律 1 作必备引擎计。它改变主梗选择条件——主角每一次\"拒签\"都是蓄力，\n        被停职/孤立/穿小鞋是受辱；清算法官不是主角的嘴，是洪峰水位。不拒签就无清算，\n        拒签清单=清算名单，机制咬合而非占时长。\n        相性 2（流放种田，上升期 n=92 / 均 22598 万）：取\"苦地 × 现代技能绝地翻盘\"机制\n        （演化链已有《流放荒州》火药水泥硬核基建先例），把苦地从古代边关平移到汛期圩堤，\n        为主梗提供可拍的硬核基建场面库（查管涌/打桩/抢培土包）——没有它，\n        \"硬实力验证\"在实事流里没有画面落点。剥掉系统/空间/穿越皮，符合零解释成本约束。\n        轻辅（马甲掉马，过饱和 n=750 / 均 9215 万）：仅作单点揭示——洪峰后上级复盘，\n        发现压在箱底的一摞拒签单全是救命单。物件揭示，不当众撕马甲。\n  新变体落点：拒签老总工 × 洪峰当众验证——\"他没打赢任何人，是洪水替他赢了\"\n        人设轴新：链上被低估者=保洁/老员工/退休匠人（均靠亮身份翻盘）；本变体是\n        58 岁临退水利总工，且不亮任何马甲——水位线替他掉马。链上《老炮开山》做过\n        退休匠人，但其翻盘靠爆破财富帝国，\"零反击、纯坚持\"无人做过。\n        场景轴新：链上苦地=荒岛/大漠/冰原/边关（古代+架空），\"汛期圩堤 + 除险加固工地\"\n        这一现实苦地全链未做；堤防除险加固、质量终身责任制、汛期问责为全民共识公共议题，\n        满足甲方\"实事做底零解释成本\"。\n        关系轴新：对手轴从渣男/婆婆/豪门 → \"偷工减料的同僚 + 赶工期要签字的官僚链\"；\n        更关键的是清算执行者换成自然规律——物理当打脸手，链上未做过。\n  对标件：\n        kb/benchmark/b016-fam《扫地姑娘是百亿精算师》（A+ / 94000 万）\n          爆点位置：对赌谈判死局 → 当众徒手复原数据。用作\"当众验证\"强度标尺：\n          本片同位=验收会死局 → 水位/管涌现场当众验证。\n        kb/benchmark/b027-s《给大妈爆改后我成了顶流》（S 级 / AI 评 91 / 0.6 万）\n          爆点位置：露天走秀引爆全网 + 前东家回聘被拒。用作\"实干逆袭 + 冷处理反派\"\n          标尺；其\"低热度高评分\"亦证明评分与热度分离、实事向可冲评级。\n        kb/benchmark/b024-na《Tower Inferno: The Lone Architect》（A+ / 24000 万）\n          爆点位置：智能锁死火场中\"最懂这栋楼的人\"逆行 + 当众揭露。\n          用作\"专业者 × 结构性灾难 × 内部人揭露\"同构强度标尺。\n  风险：\n        1）换皮陷阱：神豪暴富族标签含\"暴富\"，实事流无暴富——创新亮点段必须回指\n        \"拒签×洪峰验证\"机制（find-trope 判定纪律 3），禁止把爽点写成\"身份财富碾压\"。\n        2）红海纪律：打脸虐渣 n=1510，不带\"洪水当法官\"新变体不得进；\n        马甲掉马过饱和（均热度已低于库均值），仅许物件式单点揭示。\n        3）合规：全稿零真实机构名（水利部/流域委等禁用）；建议自造专名仅\n        \"清川河\"（河名）\"临江圩\"（堤段名）2 个，留 1 个余量；涉汛画面不渲染灾情惨状，\n        落点锚\"问责与守护\"正价值（平台合规）。\n        4）数据时效：快照 2026-09-15，水利类目语料未覆盖（见第一节声明）。\n        5）退潮预警：勿混入团宠/真假千金/强爱情线，稀释实事底子即打回。\n```\n\n## 三、网络热梗素材表（meme-rules 硬指标 1，n≥10）\n\n传播度评级为定性口径（全民级 / 高 / 圈层），待 minitool `meme_harvest` 装配后以平台热榜实测校准（meme-rules 第二节：实现前人工按梗词典源整理）。\n\n| # | 梗名 | 来源与传播度 | 可挂接场景示例 |\n| --- | --- | --- | --- |\n| 1 | 豆腐渣工程 | 98 洪水后定型公共词，官媒历年沿用；全民级 | 反派堤段的代名词；\"他签的不是字，是豆腐渣\" |\n| 2 | 基建狂魔 | 外媒称谓转网络自称（微博/知乎）；全民级 | 主角行业自豪台词：\"真正的基建狂魔，是敢对堤说不的人\" |\n| 3 | 到 XX 看海 | 2011 起每逢城市内涝的年度话题；全民级年年返场 | 汛期开场钩子/溃堤后果预演：\"今年不用去临江看海了\" |\n| 4 | 扫地僧 | 《天龙八部》→ 泛化\"深藏不露的老高手\"；全民级 | 老总工身份揭示：褪色劳模奖章 + 一手压箱底拒签单 |\n| 5 | 你大爷还是你大爷 | 2019 抖音/B 站；全民级 | 复核现场老将当场算塌年轻主任的\"合格\"结论 |\n| 6 | 00 后整顿职场 | 2022 起职场热搜常客；高传播 | 变体：\"老师傅整顿工程圈\"——切片标题直接可用 |\n| 7 | 我不要你觉得，我要我觉得 | 2019\"明学\"；全民级 | 施压签字台词，主角回敬：\"水不要你觉得\" |\n| 8 | 格局打开 | 2020-2021 泛用劝解梗；全民级 | 同僚劝\"别较真，格局打开\"，主角：\"堤垮了格局更大\" |\n| 9 | 实锤 / 求锤得锤 | 微博吃瓜语系；全民级 | 主角检测报告=实锤；反派堵举报信=求锤得锤 |\n| 10 | 塌房 | 饭圈泛化（2020 起）；全民级 | 双关切片点：人设塌房之前，堤先塌——\"这次塌的是真的\" |\n| 11 | 临时工 | 2010s 公共回应语；全民级老梗 | 出事故全场甩锅\"施工队是临时的\"，问责链现形 |\n| 12 | 回旋镖 | 2023-2024 抖音/B 站；高传播 | 洪峰冲垮的正是反派自己签的堤段——回旋镖扎自己 |\n| 13 | 偷感（很重） | 2024 网络热梗；高传播 | 夜间偷工换料被手电钉在堤坡的\"偷感\"名场面 |\n| 14 | 已老实，求放过 | 2024 网络热梗；高传播 | 终身责任制条款亮出，反派当场\"已老实\" |\n| 15 | 听我说谢谢你 | 2022 泛化后带讽刺义；全民级 | 表彰会歌舞被一句\"堤还没验\"摁停——讽刺形式主义 |\n| 16 | 这瓜保熟吗 | 《征服》翻红梗；全民级 | 验料灵魂拷问：\"这方混凝土，保熟吗？\" |\n\n## 四、发散性与密度自查（meme-rules 硬指标 2、3）\n\n**主梗/新变体拆解——跨场景可复用梗用法（各 ≥3）：**\n\n- 对话梗：口癖「这单我不签。」——hot 档每集 ≥1 次、3 集内变奏 3 次（不签 / 签了我把三十年押给你 / 这单我签，命也押上）；calm 档作集尾单句。\n- 对话梗：「水位线不认识领导。」「水不会陪你们演戏。」——理性金句，验收会/抢险/复盘三场景通用。\n- 场面梗：一堤两制同框——他拒签的堤段 vs 签收的堤段在洪峰中分屏对照；天然切片物料，可用于任何\"对照验证\"场景。\n- 场面梗：拒签单物件母题（calm 档硬标准 ≥2 物件之一，另一件建议雨靴）——会议桌拍特写 / 被撕 / 复盘时被上级一页页翻。\n- 场面梗：耳朵贴堤听水声、手电照管涌——专业实感名场面（海报级分镜位），可复用于巡堤/抢险/教学带徒。\n- 切片梗：「这方混凝土保熟吗？」拷问式验料；「偷感」夜施现场面；已老实式认怂——均可独立成 15 秒切片。\n\n**前三章梗点布点（密度自查口径：每集 ≥1 处可独立切片的梗点）：**\n\n- E1：开标会全员签字、他独拒签 + 「水位线不认识领导」→ 对话切片点\n- E2：施压戏「我不要你觉得」×「水不要你觉得」→ 对撞切片点\n- E3：夜查偷工\"偷感\"名场面 + 拒签单被当众撕 → 场面切片点（受辱蓄力顶点，集尾连本带利伏笔）\n\n自查结论：前三章每集 ≥1 可切片梗点，通过；主梗机制 × 未使用落点成立，非换皮。\n\n---\n\n*依据：skills/find-trope@find-trope 五步法；kb/market/meme-rules v1.0.0；kb/market/snapshot@2026-09-15；kb/market/structure@2026-09-14；kb/aesthetic/style-routes、conflict-escalation。本卡为选题方案前置件，进分析报告第二节（竞品与梗选型）。*\n", "选题素材.md": "# 选题素材 · 守堤人（甲方需求，全新重跑 2026-09-16）\n\n## 甲方点子\n老牌水利工程师，众人偷工减料混官场，唯他坚持指出工程问题。\n\n## 甲方约束\n- 实事做底，零解释成本（三分钟测试：观众 3 秒即懂\"修堤的、偷工减料的、不签字的老工程师\"）\n- 自造专名 ≤3 个，无架空体系术语\n\n## 供给参考（实事底子，非创作成果）\n- 堤防除险加固国债项目、工程质量终身责任制、汛期应急响应与巡堤问责——公共议题，全民共识\n", "kit/KIT.md": "# 创作者工具箱（kit）\n\n本目录是**你项目的工具链副本**——改坏了就删掉重 vendor，改顺手了就是你自己的版本。\n\n## 常用命令（在项目根运行）\n\n    python kit/check-purity.py <project>        # 产物正文纯净度检查\n    python kit/worldbook.py tree <project>      # 世界书结构树\n    python kit/worldbook.py check <project>     # 世界书一致性\n    python kit/export-doc.py <src.md> <out.docx> --plain   # md → docx（需 pip install python-docx）\n    python kit/snapshot.py capture <flow> <project> <node> --files <f>   # 快照留档\n    python kit/serve.py 8426                    # 本地预览（项目根）\n\n## 版本自治\n\n- `kit.json` 记录每个文件拷贝时的上游指纹；\n- `python tools/kit.py status <project>` 看哪些改过、哪些上游有更新；\n- `python tools/kit.py diff <project> <file>` 看差异；**更新与否由你决定，上游不自动覆盖**。\n", "内部/kb-benchmark.md": "# KB 装载 · benchmark（竞品对标装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 28 个知识文件。\n\n\n---\n\n<!-- source: knowledge/benchmark/b001-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b001-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 仵作状元：开局金殿断奇案\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"M\",\n \"genres\": \"爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎\",\n \"heat_w\": 150000,\n \"grade\": \"A+\",\n \"score\": \"88\",\n \"family\": \"zhuangyuan-keju\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2092069559019122688\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 仵作状元：开局金殿断奇案\n\n> CN 市场 · 男频 · A+ 级（AI 评 88） · 热度 150000 万 · 梗族：科举逆袭梗\n\n- **一句话卖点**：买榜草包开局替罪临斩，现代法医金殿验骨洗雪灭门冤案逆袭大理寺卿。\n- **题材**：爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎\n- **共情点**：击中职场普通人背黑锅、被全员认定能力不足百口莫辩的委屈，渴望专业降维打脸自证。\n- **爽点内核**：以绝对刑侦技术对草菅人命的权臣进行降维打击，在众目睽睽下洗脱罪名反转绝杀。\n- **创新亮点**：对标剧《谁说纨绔不能当状元》，将文抄打脸微创为硬核法医断案，强化智力碾压与悬疑张力。\n\n## 剧情主线（节选）\n\n主线剧情：现代首席法医穿越为京城第一草包沈浪，原主因花重金买通考官混入大理寺，恰逢皇室重宝失窃案暴雷，政敌严党趁机将他推上金銮殿当作替罪羊定为死罪。面临当场问斩死局，沈浪果断撕碎纨绔伪装，凭借现代微量物证与法医解剖知识，金殿之上隔空验尸断案，三炷香内揪出真正盗宝内鬼，奇迹般反杀脱罪并被御赐查案特权。沈浪借机深入朝堂，暗中调查沈家满门被诬陷通敌的陈年旧案，面对刑部与外戚世家的连环构陷，他以痕迹学破奇案、以逻辑侧写抓内奸，屡破京城惊天悬案。在此期间，原本对他鄙夷至极的冷面女首辅被其折服，在生死危局中暗送机密，两人在杀机四伏的暗巷中近身藏匿，呼吸交融间情愫暗生。随着真相大白，幕后黑手联合藩王兵变逼宫，沈浪以奇谋瓦解死局，亲手将仇敌送上断头台，从人人唾弃的替罪草包彻底登顶为执掌天下刑狱的第一权臣。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthet "heat_w\": 150000,\n \"grade\": \"A\",\n \"score\": \"83\",\n \"family\": \"zhuangyuan-keju\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2092069560269025280\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 草包状元：开局沙盘点崩十军\n\n> CN 市场 · 男频 · A 级（AI 评 83） · 热度 150000 万 · 梗族：科举逆袭梗\n\n- **一句话卖点**：换得虚名文状元的纨绔质子，在敌国围城之际用现代兵法沙盘推演一战封神。\n- **题材**：爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈\n- **共情点**：击中普通人面对强权压制时被边缘化、被当作炮灰的屈辱，渴望在绝境中展现统御全场的实力。\n- **爽点内核**：以现代超维战术兵法降维碾压古代名将与奸佞，从任人宰割的弃子逆天登顶为镇国统帅。\n- **创新亮点**：对标剧《谁说纨绔不能当状元》，将文状元微创为兵法奇才，用现代兵棋推演制造反转。\n\n## 剧情主线（节选）\n\n主线剧情：现代兵棋推演教官陆宵穿越成敌国为质多年的镇北王幼子，原主为了苟活行贿考官混得文状元虚名，沦为满朝笑柄。恰逢敌国百万铁骑兵临城下并派出使臣金殿威逼割地，主和派权臣趁机进谗推陆宵去前线充当死士炮灰。面对绝命杀局，陆宵在金銮殿当众立下军令状，以现代几何沙盘展开多维战术推演，顷刻间算崩敌国使臣布下的千古杀阵，语惊四座令帝王拜服赐予兵权。为替惨死的镇北军洗刷叛国冤屈，陆宵表面狂放荒唐纵情声色以麻痹政敌，暗中推行特种战术与后勤现代化改革。敌国冷艳刺客公主潜入刺杀却被反制，昏暗帐中兵刃相抵间被其无双韬略彻底折服，由仇敌转为甘愿为他刺探军情的暗桩。最终叛相引敌军围困京师，陆宵亲率奇兵以闪电战包抄敌后全歼叛军诛杀主谋，从人人唾弃的草包质子终成威震天下的帝国第一镇国战神。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n\n---\n\n<!-- source: knowledge/benchmark/b004-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b004-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 天灾流放，我靠百亿空间养活瞎眼杀神\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"空间囤粮，天灾末世，宅斗权谋，强强救赎\",\n \"heat_w\": 129000,\n \"grade\": \"A+\",\n \"score\": \"87\",\n \"family\": \"chongsheng-fuchou\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2067427127161913344\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-1 C\n- **共情点**：受众：热爱高概念科技感与美食疗愈的年轻女性，击中在大城市焦虑中渴望安全庇护的心理\n- **爽点内核**：内核：用科技降维打击恶劣自然，用美食治愈破碎英雄，夫妻携手建起荒漠中最坚固的绿洲帝国\n- **创新亮点**：亮点：科幻光脑与古装荒漠的美学碰撞，美食不仅能吃还能具现科技设备，契约婚姻下的读心术反差让暧昧张力拉满\n\n## 剧情主线（节选）\n\n主线：盛晚是未来世界后勤AI学家，携带着光脑合成空间穿越到大旱两年的边关黄沙地。她继承了一个破烂的荒漠驿站。面对四处肆虐的流寇，盛晚一眼相中了昏迷在驿站门口、浑身是伤的冷面刀客霍骁。霍骁曾是威震边疆的守卫者，却被奸人诬陷而功力尽废。盛晚具有严重的被迫害妄想症，她急需强大的保镖。盛晚利用光脑将美食与科技结合，做出的红烧肉能疗伤，牛肉面能具现出微型抽水机。她提出契约婚姻，她负责神级后勤，霍骁当安保大队长。在漫天黄沙中，他们建起了全科技覆盖的绿洲城堡。霍骁惊奇地发现自己能听到盛晚脑中的科技蓝图，两人的默契达到诡异的巅峰。霍骁在盛晚的科学调教下恢复神力并集结旧部，彻底清算叛贼（核心欲望：盛晚想在荒漠躺平，却被迫推着霍骁成为荒漠之王），两人共同开启了科技大漠的新秩序。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n\n---\n\n<!-- source: knowledge/benchmark/b006-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b006-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 深海炼金：我把人鱼养成了皇\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"魔幻逆袭，深海种田，萌宠经营，AIGC\",\n \"heat_w\": 129000,\n \"grade\": \"A+\",\n \"score\": \"85\",\n \"family\": \"yangcheng-huibao\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2067064854241214464\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 深海炼金：我把人鱼养成了皇\n\n> CN 市场 · 女频 · A+ 级（AI 评 85） · 热度 129000 万 · 梗族：养成回报梗\n\n- **一句话卖点**：一句话：海洋馆长流放孤岛，用炼金术把捡来的废柴人鱼养成了深海霸主\n- **题材**：魔幻逆袭，深海种田，萌宠经营，AIGC\n- **共情点**：受众：追求瑰丽视觉奇观与极致占有欲男主的女性观众，击中女性对神秘力量与偏爱的向往\n- **爽点内核**：内核：你用海洋庇护我的身躯，我用烈火与黄金为你铸造最璀璨的王冠，双强携手制霸海陆\n- **创新亮点**：亮点：AIGC完美呈现发光海底、人鱼眼泪化作珍珠、沧龙拉车等瑰丽奇观，傲娇人鱼与高冷馆长的契约甜宠极其好嗑\n\n## 剧情主线（节选）\n\n主线：虞娇是现代海洋馆馆长，穿越到孤悬海外、资源匮乏的极恶荒岛。作为罪民之女，她开局被村民逼着祭海。虞娇靠着深海沟通异能不仅没淹死，还在海底捞出了一只遍体鳞伤、被当成废鱼丢弃的蓝发男子澜沧。澜沧其实是遭遇背叛而失忆的深海人鱼皇。虞娇对人类防备心极重，但对海洋生物却无比温柔。她决定和澜沧假结婚，虞娇在荒岛上用炼金术提取深海矿物修筑避风港，种植海底灵 点内核**：内核：在最寒冷荒凉的绝地，用最务实的温度，将狂暴的野兽驯化为只属于自己的守护神\n- **创新亮点**：亮点：将种田地图拉到极限冰原，利用AIGC低成本渲染雪景、雪狼、温室奇观，半兽人战神的反差萌极具诱惑力\n\n## 剧情主线（节选）\n\n主线：陆微是现代农业教授，带着土地改良空间穿越到终年积雪的暴风领。这里是没有任何植物能存活的流放死地。开局她被强行许配给守边军士，其他罪女争抢体面的军官，陆微却用一袋冻土换下了被关在铁笼里、人人畏惧的半兽领主夜北。夜北因战伤毁容且半兽化，被视为不祥之物。陆微的致命缺陷是极度理智，把感情当成利益交换。她直白地提出合作，她用空间培育温室大棚解决温饱，夜北提供武力保护。在暴风雪中，他们驯服雪狼，开辟温暖的地下之城。夜北在陆微的饱和式投喂下不仅恢复了绝世美颜，更觉醒了上古圣兽血脉。昔日的冷酷半兽人化身护妻狂魔，一剑扫平窥伺领地的外敌。陆微也终于打破冷酷心防（深层需求：学会信任和接纳不完美的爱），与她的战神并肩于冰原之巅。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n\n---\n\n<!-- source: knowledge/benchmark/b012-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b012-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 拆盲盒后，我把渣男净身出户了\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"都市爽剧，设计盲盒，商战博弈，高调复仇\",\n \"heat_w\": 118000,\n \"grade\": \"A+\",\n \"score\": \"89\",\n \"family\": \"dalian-nuezha\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2064165690637152256\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 拆盲盒后，我把渣男净身出户了\n\n> CN 市场 · 女频 · A+ 级（AI 评 89） · 热度 118000 万 · 梗族：打脸虐渣梗\n\n- **一句话卖点**：一句话：结婚纪念盲盒里拆出轨证据，贤妻设局让渣男抢着净身出户\n- **题材**：都市爽剧，设计盲盒，商战博弈，高调复仇\n- **共情点**：受众：22至45岁女性，痛恨伴侣转移资产与精神控制，渴望用高智商夺回财产并精准惩罚背叛者\n- **爽点内核**：内核：自私者终将被其贪婪反噬，从默默付出的退居幕后到掌控全局的商业女皇，尊严与财富的双重夺回\n- **创新亮点**：亮点：将时下流行的盲盒与商战完美结合，出轨证据藏在盲盒内胆的视觉设定极具悬念，让渣男主动抢着净身出户的闭环反转极具爽感\n\n## 剧情主线（节选）\n\n主线：温以乔是隐姓埋名的天才盲盒设计师，五年来她退居幕后，成全了丈夫顾廷轩的潮玩帝国。在结婚五周年的盲盒发布会现场，温以乔意外拆开了顾廷轩送给她的限量版盲盒，却在玩偶内胆里发现了顾廷轩精心隐藏的秘密（他与闺蜜情妇方暖的亲密照片，以及通过虚假设计授权转移的数亿夫妻共同财产）。温以乔的致命缺陷是曾为了爱情过度妥协（深层需求：重建自我，摆脱被豢养的木偶人生），面对毁灭性的背叛，她彻底觉醒。她没有当场发飙（核心欲望：拿回属于自己的原创版权和所有财产），而是巧妙利用顾廷轩极度自私、虚荣的性格缺陷，暗
