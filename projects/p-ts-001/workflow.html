\"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2096055935255412736\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 重回前夫假死那天，我大摆招魂席\n\n> CN 市场 · 女频 · S 级（AI 评 91） · 热度 14000 万 · 梗族：重生复仇梗\n\n- **一句话卖点**：渣夫假死甩万额外债携小三金蝉脱壳，贤妻重生当场设大席封门，逼得活人自己从供桌下爬出认罪！\n- **题材**：爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\n- **共情点**：击中30至45岁家庭主妇为家庭掏心掏肺却被婆家合谋吸血算计的窒息痛点，让隐忍付出的憋屈感转化为反戈一击的生理爽感。\n- **爽点内核**：情绪轴为从被吸血到反手清算；爽点主菜为借丧事规则瓮中捉鳖，当众揭穿骗局夺回家产，可见可数。\n- **创新亮点**：对标《重回前夫假死那天，我彻底掀桌了》，将室内封棺转变为柴房困兽与招魂大席，机制落点在民俗博弈与物理困敌。\n\n## 剧情主线（节选）\n\n主线剧情：九十年代末北方县城，纺织厂女工林秀芝操劳半生，替突遭意外身亡的丈夫还清巨债并养老送终，临终前才知当年是丈夫为了与富商之女私奔、甩掉巨额货款而导演的假死金蝉脱壳。一朝重生，她赫然回到灵堂前，婆婆和小姑子正逼她签字画押背下全部欠条。林秀芝当场掀翻认债书，冷笑着当众改办大排场招魂宴，以思念亡夫入骨为由强留全族乡亲与各路债主通宵守灵。她暗中把丈夫藏身换装的柴房反锁加固，断水断粮三天三夜，每次婆家人企图送干粮送水，都被她借敬神守节之名当场拦截打赏众人。柴房内的渣夫饥渴难耐濒临崩溃，出殡起灵当日，渣夫为活命撞破房门狼狈抢食，假死真相在全体债主眼前当场炸裂。林秀芝雷霆出手，借民事公证与借据逼婆家交出全部隐匿存折与房契，彻底斩断吸血枷锁，随后凭借前世商贸记忆承包纺织门市部，步步蜕变成为万人敬仰的民营女实业家。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n", "内部/kb-market.md": "# KB 装载 · market（市场快照装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 3 个知识文件。\n\n\n---\n\n<!-- source: knowledge/market/constraints.md -->\n\n---\n{\n  \"id\": \"kb/market/constraints\",\n  \"type\": \"market-standard\",\n  \"title\": \"生产约束基线（短剧/漫剧实盘值）\",\n  \"version\": \"2026-09-14\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [],\n  \"provenance\": {\n    \"source\": \"import\",\n    \"refs\": [\"dataset:kakaxing/scriptrawstone@2026-09-14（全量统计）\", \"kb/market/snapshot.formatConstraints\", \"storymaster-v3:assets/skills/script-drama-beat.md\"]\n  },\n  \"bind\": { \"skills\": [\"plot-choreographer\"], \"minitools\": [\"check_contract_compliance\"] },\n  \"updated\": \"2026-09-14\"\n}\n---\n\n# 生产约束基线\n\n**用途**：选题分析报告第五节\"创作约束移交单\"的默认数值来源——约束不再拍脑袋，直接取市场实盘（7938 部在售剧本的硬格式统计）。方案对这些条款逐条对账（`kb/aesthetic/oversight` 监理纪律，违反一票否决）。\n\n## 一、体量约束（分布即标准）\n\n| 维度 | 主流值 | 分布依据 |\n| --- | --- | --- |\n| 集数 | **60 集**（4224 部） | 50 集 945 / 80 集 925 / 40 集 718 / 30 集 116 |\n| 单集时长 | **1-1.5 分钟** | 竖屏付费短剧口径 |\n| 单集字数上限 | **1200 字**（4284 部） | 1000 字 1640 / 1400 字 528 / 1600 字 476 |\n| 场景数上限 | **≤3**（7937/7938） | 几乎全库硬约束——低成本快转景 |\n| 主要演员上限 | **≤10**（7925 部） | 同上 |\n\n**用法**：方案默认按 60 集 × 1.5 分钟 × 1200 字 × ≤3 场景 × ≤10 演员声明约束；偏离主流值（如 80 集或 4 场景）必须在移交单中显式声明并给理由——偏离不是错，隐式偏离才是错。\n\n## 二、约束 → 编排的直接推论\n\n1. **3 场景上限** ⇒ 每集冲突必须发生在可复用景（宅门/办公室/宫殿/车厢）；换景 = 换集节拍点。剧情编排师分集时先画场景复用表。\n2. **10 演员上限** ⇒ 有名有姓角色 ≤10（含反派）；群演反应拍（当众打脸必需）不计入，但\"全场惊呆\"必须由环境描写的群演承担。\n3. **1-1.5 分钟 ≈ 600-900 字正文**（script-drama-beat 口径）⇒ 每集 8-12 拍，前 3 秒钩子约 1 拍、结尾卡点约 2 拍。\n4. **60 集 × 1.5 分钟 = 90 分钟总片长** ⇒ 实际叙事容量 ≈ 一部电影的紧凑版：主线只容 1 个大反转 + 2-3 个中型反转（`kb/aesthetic/reversal` 结构位点联动），副线必须挂主线条件。\n\n## 三、题材标签纪律\n\n申报题材标签从市场受控词表取（快照 `genreHeatCN`/`genreHeatNA` 中的 genre 字段），不用自造词；标签组合 = 1 主题材 + 2-3 副标签（市场策划案通行形），标签顺序即卖点顺序。\n\n## 四、与硬断言的绑定\n\n本条目数值进入约束移交单后，由 minitool `check_contract_compliance` 逐条对账；分拍格式合规由 `AE-BEAT-FORMAT` 断言扫描（`kb/aesthetic/assertions.json`）。\n\n\n---\n\n<!-- source: knowledge/market/setting-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/setting-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"设定体系约束（项目级：世界观代入成本红线）\",\n  \"dimension\": \"setting\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-SET-ORIG\", \"AE-SET-3MIN\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\n      \"user-feedback:2026-09-15（禁止原创科幻世界观——点子好但没有厚度，读者不能快速代入；用市面做过的设定体系或实事新闻做底子）\",\n      \"kb/market/constraints（生产约束基线，本条目为其世界观维度扩展）\"\n    ]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"structure-design\", \"topic-analysis-report\"], \"minitools\": [\"check_aesthetic_asserts\"] }\n}\n---\n\n# 设定体系约束（世界观代入成本红线）\n\n**命题：短剧/漫剧的观众没有耐心学一套新世界观。** 点子再好，架构没有厚度——读者无法快速代入理解——就是废案。世界观的代入成本是选题阶段的一票项，不是成稿阶段再优化的细节。\n\n## 一、设定来源三级制\n\n| 级别 | 来源 | 判定 |\n| --- | --- | --- |\n| **首选** | **实事新闻做底子**：防汛救灾、工程质量清查、债务与烂尾、养老与医疗、裁员与再就业——全民共识的公共事件，零解释成本，主旋律有锚 | ✅ 直接可用 |\n| **次选** | **市面验证过的设定体系做创新改编**：战神归来/赘婿/重生/系统/马甲/先婚后爱等——观众已被市场教会规则，创新只做变体不做体系 | ✅ 可用，须挂竞品对标 |\n| **禁止** | **原创科幻/架空世界观**：自造中台/异能体系/架空王朝规则等需要观众先学后看的设定 | ❌ 一票否决 |\n\n## 二、判定方法：三分钟测试\n\n- 【block】**三分钟测试**：路人观众开播 3 分钟内，在不依赖任何设定解释的前提下，能否说出\"这是谁、他想要什么、为什么替他急\"？凡需要先讲设定才能进冲突的开局 = 违反本约束。\n- 【major】设定词密度：前三章正文中的**自造专名**（体系名/组织名/规则名）≤2 个；超过即代入成本超标。\n- 【major】实事锚点：选题理由必须至少引用一条**当月公共议题/新闻方向**作为情绪底（与 zeitgeist 步联动），架空设定天然缺此锚。\n\n## 三、正确的\"创新\"位置\n\n约束禁止的是**世界观层原创**，不禁止创意：创新发生在①**人物关系与身份层**（不确定因素注入：黑道大小姐/真假千金/穿书/初版作者）；②**结构改造**（`kb/structure/catalog` 三步）；③**实事底子上的具体事件**。好点子要长在观众熟悉的土壤上——点子的锐度 × 土壤的熟悉度 = 代入速度。\n\n## 四、执行接线\n\n- S1 调研：约束移交单新增 **C10 设定体系约束**（本条目），选题方向必须声明设定来源级别。\n- S2 结构：框架案的世界观节按三级制声明来源；原创倾向在此拦截。\n- R1/R2 红方：三分钟测试 + 设定词密度为固定检查项（`kb/aesthetic/perspective-review` 一般读者视角主责）。\n\n\n---\n\n<!-- source: knowledge/market/meme-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/meme-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"梗密度与发散性约束（S1 网感输入源）\",\n  \"dimension\": \"meme\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-MEME-DENSITY\", \"AE-MEME-SPREAD\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\"user-feedback:2026-09-15（选题作为网感输入源需足够多的梗、有发散性；梗传播度与密度不足则观众无趣；纳入知名梗词典网站）\"]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"find-trope\", \"topic-analysis-report\"], \"minitools\": [\"meme_harvest（待实现）\", \"kb_search\"] }\n}\n---\n\n# 梗密度与发散性约束\n\n**命题：选题阶段是全流程的网感输入源。** 选题产出的梗与素材要喂给后续所有阶段（结构/方案/剧本/传播切片）；梗的传播度和密度不足，后续每一层都会\"无趣\"——这不是文案问题，是资源储量问题。\n\n## 一、S1 产出硬指标\n\n| 指标 | 要求 |\n| --- | --- |\n| **网络热梗素材表** | S1 梗卡必须附带 ≥10 条与题材相关的**现存高传播梗**（每条：梗名/来源与传播度评级/可挂接的场景示例） |\n| **发散性** | 每个主梗/新变体须可拆出 ≥3 个跨场景可复用的梗用法（对话梗/场面梗/切片梗）——只在一个场景成立的梗不算储量 |\n| **密度自查** | 前三章每集至少 1 处可独立切片传播的\"梗点\"（观众能截出来转发的东西） |\n\n## 二、梗词典数据源（纳入数据库的输入源清单）\n\n| 源 | 类型 | 用途 |\n| --- | --- | --- |\n| 小鸡词典（含镜像存档） | 梗词典 | 梗的出处、演变、用法 |\n| 梗百科 / 萌娘百科 | 百科类 | 梗的条目化解释与传播链 |\n| B 站热梗榜 / 抖音话题榜 | 平台热榜 | 当期传播度实测 |\n| 知乎\"网络流行语\"相关高赞 | 语义讨论 | 梗的语义漂移与代际差异 |\n| 微博热搜 / 百度指数 | 传播度实测 | 评级数据源 |\n\n接入方式：`meme_harvest` minitool（待实现，规格：抓取/清洗/去重/传播度评级 → 产出 `梗素材表` 增量并入 KB）；实现前由调研步人工按上表整理，**梗素材表仍为 S1 必交付**。\n\n## 三、与既有约束的关系\n\n- 梗密度约束**不替代** C10 设定约束（`kb/market/setting-rules`）：梗要密度，设定要低代入成本，两条红线并行。\n- 题材选择本身受梗密度约束**反向影响**：同等条件下，优先选**梗储量高的领域**（如国球/职场/校园——全民梗库富矿），放弃梗荒领域（例：无公共记忆的架空科幻）。\n", "小纲-第1-3集.md": "# 《守堤人》小纲 · 第 1-3 集（S4 批注载体）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：scene-screenwriter（小纲师）· scene-breakdown 技能 · miniguide 节点\n- 生成日期：2026-09-16\n- 输入件：选题方案.md 第五节「前三集初稿（分拍）」（派生源）；故事框架案.md（汛期三圈钟、伏笔位、口癖变奏表 7.4）；skills/scene-breakdown.md（达意纪律、每集 9-12 分镜、每镜一个认知更新、文末创作思路页）\n- 禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n- 格式说明（导出器对齐）：每拍 `**B编号｜钩型｜时长**`；编号全三集连续（B0001-B0032）；每集仅首拍带【0-3秒】开篇画面行；钩型四型 = 反常／冲突／悬念／情绪（第一集首拍钩型 = 反常）；备注字段为内部坐标（伏笔回收位/梗点/红线标记），供批注锚定\n\n---\n\n## 第一集《这单我不签》\n\n> 本集速览：主认知更新——全项目部只有他不签。切片梗点：独拒签＋扫地僧奖章伏笔。集末卡点：情绪型（雷声上弦）。口癖首现＋变奏①。水 tick：河面、听水、雷雨。景一 会议室 → 景二 堤坡。\n\n**B0001｜反常｜9秒**\n\n【0-3秒】验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。\n分镜：特写笔帽在图纸桩号上敲三下，他念桩号不看人，全场回头，别人的笔悬在半空。\n台词：秦江海：\"3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。这单我不签。\"\n表演：念桩号像念了三十年；左胸口袋褪色劳模奖章入画一角。\n尾钩→ 冯有德的文件夹\"啪\"按上桌面——他要做的第一件事，是让这个老头变成少数。\n备注：口癖首现；拒签三要素出击（部位+缺陷+要求）；奖章伏笔（E10 扫地僧梗兑现位）。\n\n**B0002｜冲突｜8秒**\n\n分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处推过去，指节敲在数字上。\n台词：冯有德：\"全签了，就差你。\"／秦江海：\"压实度不够，数字在这儿。要钻芯，钻给他们看。\"\n表演：冯有德眼珠先看左右再看纸（小动作首建）；秦江海坐着没动，会议室却静。\n尾钩→ 后排一声嗤笑——马长贵登场。\n备注：承接拍1——因为有人开了头，施压与帮腔才接得上。\n\n**B0003｜冲突｜9秒**\n\n分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录\"啪\"拍在桌上。\n台词：马长贵：\"老秦，你这是挡大家财路！\"／雷小雨：\"图纸上没有这个数，原始记录我念给大家听？\"\n表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。\n尾钩→ 哄笑卡在喉咙里——秦江海开口了。\n备注：三分钟测试收口——修堤的、偷工的、不签的三身份齐亮相。\n\n**B0004｜情绪｜10秒**\n\n分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。\n台词：秦江海：\"签了，我把三十年押给你；不签，下游几万人押给他们？\"\n表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。\n尾钩→ 冯有德举起手：\"表决。\"\n备注：口癖变奏①（金句）；奖章特写为 E10 群演低语\"扫地僧\"埋点。\n\n**B0005｜冲突｜9秒**\n\n分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。\n台词：冯有德：\"少数服从多数。\"／桂守成（淡淡）：\"程序上，就差这一笔了。\"\n表演：举手的人不看他，看桌面；秦江海看那张单子，像看一样烫手的东西被人往怀里塞。\n尾钩→ 他不接——他起身了。\n备注：桂守成\"按程序办\"面孔暗起（三层反派第三层伏笔）。\n\n**B0006｜情绪｜8秒**\n\n分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。\n台词：秦江海（门口停半步，不回头）：\"堤修给水看的，不是修给举手看的。\"\n表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。\n尾钩→ 马长贵冲他背影扬声撂话——\n备注：会议室他输，节奏转场去堤上赢——受辱不铺满的第一闸。\n\n**B0007｜冲突｜8秒**\n\n分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。\n台词：马长贵：\"老秦，是你的章硬，还是我的路子硬？\"／秦江海（把烟原样插回他胸袋）：\"汛期会替我试。\"\n表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。\n尾钩→ 他没回宿舍，拐上了大堤。\n备注：马长贵口癖\"规矩是死的，人是活的\"留到 E2 用，本集只立递烟动作。\n\n**B0008｜情绪｜11秒**\n\n分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水。\n台词：（无台词，只有水声一层层近。）\n表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。\n尾钩→ 他顺着堤走到一根桩号碑前——\n备注：名场面①贴堤听水（海报级切片位）；水 tick。\n\n**B0009｜悬念｜10秒**\n\n分镜：手指划过分界桩刻字\"桩号 3+960\"；镜头左右摇：一侧坡面扎实色深（新填筑），另一侧草皮下水渍成片。\n台词：秦江海（对堤，像对故人）：\"老伙计，他们把你签出去了。\"\n表演：手指在桩号上停了很久。\n尾钩→ 天边一声闷雷——\n备注：一堤两制分屏 E1 露脸（R1 条件 3；E12 点题、E53 终验的第一颗钉子）。\n\n**B0010｜悬念｜9秒**\n\n分镜：乌云压着河面推过来，雷声滚过堤顶；大远景一条长堤、一个老头的剪影。字幕卡：汛期第一天。\n台词：秦江海（抬头看天，轻声）：\"要来水了。\"\n表演：他不躲雨，反而往堤上又走了一步。\n尾钩（下集钩）→ 这一张没人敢接的拒签单，能挂到水来吗？\n备注：集末卡点·情绪型；雷声第一响 = 全剧三圈钟上弦。\n\n---\n\n## 第二集《水不要你觉得》\n\n> 本集速览：主认知更新——他们要的不是他签字，是他消失。切片梗点：\"我不要你觉得\"×\"水不要你觉得\"。集末卡点：情绪型（钢卷尺）。口癖变奏②。水 tick：描水位线＋窗雨（实体水 E3 夜雨补足）。景三 办公区·档案室。\n\n**B0011｜反常｜8秒**\n\n【0-3秒】两个工人抬着办公桌穿过走廊，桌上图纸滑到地；\"总工程师\"门牌被一把摘下；桌子落位档案室角落，正对整墙旧临江圩地形图。\n分镜：桌子落定，秦江海进门看一眼位置，先扶正桌角，再捡图纸。\n台词：工人甲（嘟囔）：\"秦总工，先在这儿委屈委屈。\"\n表演：像搬家的是别人，不是他。\n尾钩→ 门口有人鼓了两下掌——冯有德来了。\n备注：调岗边缘化（四件套之四）预演；承接 E1 拒签的代价即刻兑现。\n\n**B0012｜冲突｜9秒**\n\n分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。\n台词：冯有德：\"签个字，大家都省事。我不要你觉得，我要你觉得。\"\n表演：说话时眼睛看墙上的地形图，不看人（心虚）。\n尾钩→ 秦江海拿起了那支只画水位线的笔——\n备注：梗 7 前半；师父遗物笔首用于对撞。\n\n**B0013｜情绪｜9秒**\n\n分镜：秦江海转身面向地形图，沿图上历史洪水位线缓缓描一道，笔尖不抖。\n台词：秦江海（头也不回）：\"水不要你觉得。\"\n表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。\n尾钩→ 走廊传来脚步与递烟的笑——马长贵带人堵门。\n备注：梗 7 后半，本集对撞主句；水 tick（水位线）。\n\n**B0014｜冲突｜9秒**\n\n分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。\n台词：马长贵：\"老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。\"\n表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，不快不慢。\n尾钩→ 人群里有人不耐烦要进门——一只全站仪横了过来。\n备注：马长贵口癖首用；群像压迫位。\n\n**B0015｜冲突｜9秒**\n\n分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。\n台词：雷小雨：\"这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。\"\n表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。\n尾钩→ 马长贵刚要开口，冯有德先软了——\n备注：盟友立住；她的台词同款是 E27 诱签线的人格底色。\n\n**B0016｜悬念｜8秒**\n\n分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。\n台词：冯有德：\"再研究研究。……对了，复审组下周进场，你自己掂量。\"\n表演：退到门口顿了半步，像想补一句狠话，终究没说。\n尾钩→ 人散尽，档案室只剩秦江海一个人。\n备注：信息钩伏 E8（复审组进场第一份立案是反咬信）；冯有德口癖\"再研究研究\"。\n\n**B0017｜情绪｜10秒**\n\n分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边。\n台词：（无台词。）\n表演：擦靴子的手势像在擦一块碑。\n尾钩→ 他把联签单副本铺平在桌上——\n备注：清算物件·雨靴首次亮相（E58 防水袋底单交档的远伏）。\n\n**B0018｜情绪｜9秒**\n\n分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，\"咔\"锁定。\n台词：秦江海（对着空档案室）：\"这一单，我还不签。\"\n表演：说给空屋子听，比说给人听更硬。\n尾钩→ 尺带在他掌心勒出一道白印——\n备注：口癖变奏②；钢卷尺量的是他拒签的那一段。\n\n**B0019｜情绪｜9秒**\n\n分镜：钢卷尺\"啪\"拍在联签单副本上，纸角跳起。\n台词：秦江海：\"量堤可以。量人心，你们不够长。\"\n表演：说完才觉掌心疼，摊开看了一眼，笑了笑。\n尾钩→ 窗外第一滴雨打在玻璃上——\n备注：集内金句切片位。\n\n**B0020｜悬念｜9秒**\n\n分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。\n台词：（无台词，雨声渐密。）\n表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么。\n尾钩（下集钩）→ 复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。\n备注：抄写动作伏\"抄三份\"（E3 拍9 说破、E58 清算名单兑现）；集末卡点·情绪型。\n\n---\n\n## 第三集《这方混凝土，保熟吗》\n\n> 本集速览：主认知更新——偷工实锤与受辱顶点同场对撞：当场验了、当场被撕、当场回敬。切片梗点：\"偷感\"钉车＋\"保熟吗\"。集末卡点：情绪+信息型（捡碎纸）。口癖变奏③；受辱→回击时差 1 拍。景二 堤段工地·夜 → 景一 会议室。\n\n**B0021｜反常｜9秒**\n\n【0-3秒】夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光\"啪\"钉住车头，光柱里料粉飞舞。\n分镜：光柱从车头缓缓扫过挡板与料袋，所有人定格如标本。\n台词：秦江海（画外，声音不大）：\"几点了，还在卸料。\"\n表演：工头的笑僵在半张脸。\n尾钩→ 工头小跑下来打圆场——\n备注：名场面②手电钉车开场；梗 13\"偷感\"；承接 E2 集末卡车钩。\n\n**B0022｜冲突｜8秒**\n\n分镜：工头搓着手凑近，手电光柱从车头移到他脸上。\n台词：工头：\"秦总工，夜里凉，您回吧——这不是赶工期嘛。\"\n表演：挡在料袋前的身体语言比嘴诚实。\n尾钩→ 秦江海没理他，径直蹲向新卸的料堆——\n备注：承接拍1——先拦人，再看料。\n\n**B0023｜反常｜9秒**\n\n分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。\n台词：秦江海：\"这方混凝土，保熟吗？\"\n表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。\n尾钩→ 工头张了张嘴——车门开了。\n备注：梗 16\"这瓜保熟吗\"变体；切片位；R1 小验证起点。\n\n**B0024｜冲突｜9秒**\n\n分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。\n台词：马长贵：\"老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！\"\n表演：声音抬得越高，眼睛越不看料堆。\n尾钩→ 秦江海不接话，直起身朝堤顶喊——\n备注：有理由的错误选择——他在跟汛期赛跑（对立统一不写成纯坏）。\n\n**B0025｜悬念｜8秒**\n\n分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。\n台词：秦江海：\"小雨——取样。当着大家的面。\"\n表演：工人群像里有人下意识后退半步。\n尾钩→ 仪器滴一声——数字出来了。\n备注：验证动作全部画面化，零术语讲解。\n\n**B0026｜反常｜10秒**\n\n分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆。\n台词：雷小雨：\"快测结果，低于设计标号。原始样我封了，双份！\"\n表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。\n尾钩→ 马长贵撂下一句——\"明天验收会上说。\"\n备注：小验证当场验料 ✓（R1 读者条件 1：前三集小赢一口，受辱不连续铺满）。\n\n**B0027｜冲突｜9秒**\n\n分镜：次日，验收会议室。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。\n台词：冯有德：\"私留底稿、扰乱验收秩序。这种风气，必须刹。\"\n表演：他撕纸前先看左右（小动作复现）。\n尾钩→ 纸，碎了。\n备注：受辱顶点；反派升级 = 从\"驳你的数据\"到\"撕你的底稿\"。\n\n**B0028｜情绪｜9秒**\n\n分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（半秒特写）。\n台词：（撕纸声独占两秒，全场无声。）\n表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。\n尾钩→ 他开口了——当拍回击——\n备注：伏笔——存档联流程上撕不掉（E20\"例行归档\"调走的正是它）。\n\n**B0029｜情绪｜10秒**\n\n分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场。\n台词：秦江海：\"撕吧。这单我不签——每一页我都抄了三份。\"\n表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。\n尾钩→ 桂守成低头在会议记录上写批注，笔迹特写一秒。\n备注：口癖变奏③＋受辱→回击时差 1 拍（拍8→拍9）；\"抄三份\"上膛（E58 清算名单）；桂守成笔迹伏 E36 笔迹比对——客户如删此半秒，E36 需补埋。\n\n**B0030｜冲突｜8秒**\n\n分镜：冯有德趁势合卷宣布散会——检出来的假，被留在议程之外。\n台词：冯有德：\"验料结果，另行核议。散会。\"／雷小雨（低声）：\"验了等于白验？\"／秦江海：\"不。他们欠了一笔，签了字就生利息。\"\n表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。\n尾钩→ 散会，暴雨正好砸下来——\n备注：\"敌进一分\"位：程序吃掉议程，但账记下了。\n\n**B0031｜情绪｜11秒**\n\n分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒。\n台词：（无台词，只有雨声。）\n表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。\n尾钩→ 他站起身，望向河面——\n备注：雨靴＋\"抄三份\"双伏笔同框落位；水的威力物证化（雨声，零惨状）。\n\n**B0032｜悬念｜10秒**\n\n分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。\n台词：秦江海：\"水位涨一格，你们就多欠我一页。\"（雷声吞尾）\n表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。\n尾钩（下集钩）→ 复审组进场第一天，桌上立的第一份材料——是一封举报秦江海\"泄露工程数据\"的反咬信。\n备注：集末卡点·情绪+信息型；受辱升级为受冤（E8-E10 首卡引信）；水 tick（暴雨）。\n\n---\n\n## 创作思路页\n\n### 总说明（给批注人的坐标系）\n\n1. 本稿是选题方案第五节分拍初稿的**小纲派生件**：情节、台词、伏笔位均承自 S3 正稿，未新增情节线；小纲的任务是把每一拍拆到**可画、可拍、可批注**的粒度。台词维持\"达意即可\"，未做成品级打磨——文采、潜台词、金句微调请留在成品剧本轮，此轮改了会浪费修改轮次。\n2. 批注方法：每条意见请锚定 **B 编号**（B0001-B0032，三集连续不重号）。改某一拍的台词不会影响编号；若要求合并/拆分拍，请在批注里写明\"合并 B0005-B0006\"这类区间，回稿时我再重排编号。\n3. 钩型四型口径：**反常**（画面本身不对劲）/ **冲突**（人对人对撞）/ **悬念**（信息缺口）/ **情绪**（压出来的感受）。第一集首拍 B0001 用反常（唯一不签的人），后续每拍标注主导钩型，仅供节奏体检，不必逐拍改。\n4. 边界重申：全三集零真实机构名、零真实责任人；台风雷雨一律无名；零伤亡、零惨状，水的威力只用声音与物证（水渍、料粉、雨声、雨靴）表达。\n\n### 第一集《这单我不签》——为什么这么拆\n\n- **B0001 零铺垫直入拒签**：开篇 3 秒只给\"十几只手都在签、他的笔停了\"这一个反常，不给身份不给背景——没看过设定的人听完这拍不该问\"为什么\"，只问\"然后呢\"。拒签台词按\"部位＋缺陷＋要求\"三要素写，先立**强**再立**惨**：他是出击，不是受气。\n- **B0004 奖章特写提前半拍**：扫地僧身份碎片在金句变奏①前一秒入画，是给 E10 群演低语\"扫地僧\"预埋的视觉账。批注若嫌抢戏可后移半拍，但建议保留在 E1——它是全片唯一一次主动亮底牌。\n- **B0005-B0007 让他输掉会议室**：表决、孤立、塞烟三拍连压，但第 6 拍立刻转场堤上——受辱不给满，观众憋的那口气要在本集内找到一个出口，否则第二集会丧。\n- **B0008-B0010 把出口放在堤上**：贴堤听水（名场面①）＋分界桩两侧同框（一堤两制 E1 露脸）＋雷声上弦，三个画面动作压集尾，一句解释都没有。分界桩这颗钉子 E12 分屏点题、E53 终验收回；雷声是全剧三圈钟的第一声，观众带着\"水几时来\"进第二集。\n\n### 第二集《水不要你觉得》——为什么这么拆\n\n- **B0011 先给\"消失\"的预感**：搬桌摘牌是反派四件套之四（调岗边缘化）的预演版——第二集先让观众看清\"他们的目标不是他的签字，是他的位置\"，后面 E20 收章调岗才有量级。\n- **B0012-B0013 对撞句成对出现**：\"我不要你觉得\"（施压）与\"水不要你觉得\"（回敬）必须隔一拍内完成——这是本集唯一的主认知更新，别的拍都为它让路。师父遗物笔在此第一次用于\"画水位线\"而非写字，身份信息全靠动作，零台词讲解。\n- **B0014-B0015 群像压人、盟友立人**：递烟群像做空间压迫，雷小雨全站仪拦门做破口。她的台词\"图纸上没有这个数\"与 E27 诱签线（她的名字被夹进联签校核页）共用同一个人格底色——信数据的人最容易被签字链算计，此处不展开，只立性格。\n- **B0017-B0019 空屋独角戏是故意降速**：后半集没有对手，只剩雨靴、卷尺、掌心白印三个物件动作。雨靴是 E58 清算段\"防水袋底单交档\"的远伏；卷尺量的正是他拒签的那 140 米——物件在此攒账，客户批注时请把这组当\"记账拍\"看，删任一拍需在后文集找补。\n- **B0020 抄写的背影**：他深夜抄什么不说破，E3 拍9\"每一页我都抄了三份\"才揭晓——两集跨度的信息缺口，是本集集末卡点真正的钩。\n\n### 第三集《这方混凝土，保熟吗》——为什么这么拆\n\n- **B0021-B0026 先赢一口再挨打**：夜查当场验料是 R1 条件要求的前三集小验证。顺序刻意排成\"验料赢（B0026）→ 撕稿辱（B0027-B0028）→ 回敬（B0029）\"——观众刚尝到甜头就被打，回击才有 double 的爽；若把验证挪到撕稿之后，整集会变成纯受辱集，丧掉前三集。\n- **B0023\"保熟吗\"的反差**：专业指法配菜市场问话，笑点与寒点是同一句——寒在\"他连问都懒得跟他们正经问\"。此句是全片切片位，批注改词请保留\"保熟\"二字壳。\n- **B0028 半秒闪现存档联**：撕的是他私留的底稿，流程上撕不掉的存档联只在档案柜里闪半秒、零讲解——这是 E20\"例行归档\"调档戏的预约金。批注若觉得闪现突兀，可改为 B0031 塞雨靴时一瞥，但删除会让 E20 无根。\n- **B0029 回击时差 1 拍**：受辱（拍8）→回击（拍9）压在红线内。桂守成低头写批注的笔迹一秒特写是 E36\"反咬信笔迹比对同源\"的最早埋点，是全稿最远的一颗伏笔——删它不难，难的是 E36 重埋。\n- **B0030-B0032 账要记成利息**：\"另行核议\"让检出的假被程序留在议程外（敌进一分），B0031 捡碎纸塞雨靴把屈辱物理化为存证，B0032\"水位涨一格，你们就多欠我一页\"把汛期钟和清算账拧成同一根弦。集末反咬信一句钩，把受辱升级成受冤——E8-E10 首卡死局从这里点火。\n\n### 三集连续性自查\n\n- 拍数：E1=10 / E2=10 / E3=12，均在 9-12 区间；单集时长约 90/89/100 秒，符合 1-1.5 分钟。\n- 口癖三变奏：E1 B0001+B0004（本句＋金句变奏①）/ E2 B0018（\"这一单，我还不签\"）/ E3 B0029（\"撕吧。这单我不签——\"）。每集 ≥1 ✓，三集三变奏 ✓。\n- 水 tick：E1 河面＋听水＋雷雨；E2 水位线＋窗雨（实体水由 E3 夜雨衔接）；E3 夜雨＋暴雨＋雨靴。任意缺口 ≤2 集 ✓。\n- 三景轮换：会议室（E1）→ 档案室（E2）→ 堤坡·会议室·檐下（E3），全部落在三景集合内，换景即换集节拍。\n- 伏笔台账（本稿埋设 → 回收位）：奖章 B0004→E10；桂守成程序脸 B0005→E30/E36；复审组风声 B0016→E8；雨靴 B0017/B0031→E58；抄三份 B0020/B0029→E58；存档联 B0028→E20；桂守成笔迹 B0029→E36；反咬信 B0032→E8/E10；分界桩 B0009→E12/E53。\n- 客户如对任一拍的拆分、时长、钩型有异议，直接在 B 编号上画圈即可；情节级意见（如调换验证与撕稿顺序）请在批注中注明影响集，我在回稿中同步重排受影响的伏笔位。\n\n---\n\n*依据：skills/scene-breakdown.md（达意纪律/分镜数/思路页）；选题方案.md 第五节分拍初稿@2026-09-16（派生源，未偏离）；故事框架案.md 表 2.0-A、7.4 口癖变奏表、7.5 梗挂接表@2026-09-16。本件为 S4 批注载体，待客户批注回传后修订。*\n", "热点素材.md": "# 热点素材 · 守堤人（时代情绪锚）\n\n- 项目：p-ts-001（水利题材 / 守堤人）\n- 剖面：story-analyst · 网感师\n- 生成日期：2026-09-16\n- 检索窗口：2026-08-17 至 2026-09-16（30 天）；窗口外证据一律降级并标注\n- 证据等级：A = 30 天内权威来源 / B = 略超 30 天但同汛期舆论长尾 / C = 长期可核实制度议题\n\n---\n\n## 一、时代情绪锚声明（按 topic-zeitgeist 第 1 条格式）\n\n> **时代情绪锚：本选题踩中的是「较真者的憋屈 × 汛期防洪焦虑」——认真的人在系统性糊弄面前孤军奋战，而堤的那头是千家万户的身家性命（证据：2026-09-04 全国\"质量月\"25 部门联合部署、严查偷工减料弄虚作假〔A〕；2026-09-03 台风\"沙德尔\"登陆福建、最高级别防汛应急响应〔A〕；2026-08 中旬河南某河堤防决口封堵的全民围观长尾〔B〕）。**\n\n锚的双层结构：\n- **底层情绪（普适、长期）**：\"会干的不如会混的\"——职场最大公约数憋屈。每个观众身边都有一个\"不肯签字的老工程师\"和一个\"签得飞快的人\"。\n- **顶层焦虑（实时、30 天）**：汛期未过。9 月初台风登陆、应急响应启动、堤防决口画面仍在传播——观众此刻亲眼见过\"堤垮了是什么样\"，对\"堤里有没有猫腻\"的愤怒处于激活态。\n\n---\n\n## 二、30 天内证据清单\n\n| # | 证据 | 时间 | 来源 | 等级 | 用法 |\n|---|------|------|------|------|------|\n| 1 | 2026 年全国\"质量月\"启动，25 个部门共同部署，主题\"增强质量技术基础能力 提升质量安全保障水平\"；地方落地文件明写\"对偷工减料、过程弄虚作假等违法违规行为，一律依法依规严肃查处\" | 2026-09-04 起（9 月全月） | 中国新闻网；东莞市住建局 2026 质量月通知 | A | 主锚官方佐证：\"反偷工减料\"此刻是国家叙事与民间情绪的交汇点，题材自带正当性 |\n| 2 | 台风\"沙德尔\"9 月 3 日登陆福建沿海，闽浙暴雨，水利部启动最高级别洪水应急响应 | 2026-09-03 | 外电转引水利部应急响应（Reuters/BBC 体系） | A | 实时焦虑举证：汛期未结束，\"堤防\"不是历史词，是进行时 |\n| 3 | 藏尼跨境冰川洪水重大灾害（8 月底–9 月初，伤亡惨重） | 2026-08-26 起 | UN News / CNN / 卫报 | A | **慎用**：只取\"水的力量是真实的\"公共体感，严禁消费伤亡、严禁影射责任 |\n| 4 | 河南某县河流两处堤防决口、数千人转移、决口应急封堵，全国围观 | 2026-08-13（距本日 34 天，超窗 4 天） | 新华社英文版 / 路透 | B | 舆论长尾举证：\"决口→封堵→追问质量\"的完整公共叙事链刚发生过 |\n| 5 | 台风\"海豚\"致超百万人转移、上海内涝 | 2026-08-10（超窗） | 卫报 | B | 同上，佐证 2026 汛期强度，叠 加\"今年水大\"的全民体感 |\n\n结论：主锚有 A 级证据支撑，**无需降级为\"经典母题，无实时锚\"**。\n\n---\n\n## 三、长期公共议题底座（C 级，制度可核实，做实事底子）\n\n1. **工程质量终身责任制**：五方责任主体（建设/勘察/设计/施工/监理）项目负责人开工前签署质量终身责任承诺书，竣工后设永久性标牌载明单位与负责人姓名，验收签字与终身追责挂钩。——\"签字\"与\"刻名的碑\"是真实制度自带的戏剧装置，零解释成本。\n2. **国债/超长期特别国债水利项目**：2025 年水利建设投资完成 1.28 万亿元、连续 4 年超万亿；2026 年首批\"两重\"项目清单中超长期特别国债超 1700 亿元直达项目一线；病险水库除险加固、中小河流治理、蓄滞洪区建设是 2026 年重点。\"国债修的堤\"= 观众直觉理解\"这是老百姓的钱、国家的命\"。\n3. **汛期问责机制**：病险水库主汛期原则上空库运行、巡堤查险责任到人、决口问责。——\"汛期出事必有人被追责\"是全民共识，为反派\"抢在汛期前糊弄过验收\"提供真实动机。\n\n---\n\n## 四、情绪具象化路线（方法论第 2 条：大白话标题检验）\n\n主角处境必须读起来就是一条真实社会新闻标题。通过样本：\n\n- 「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」\n- 「老工程师指出堤身填筑不合格，第二天被调去管仓库」\n- 「竣工标牌上刻了五个名字，大水来的时候谁的名字能站住」\n\n三秒测试对齐（甲方约束）：修堤的 / 偷工减料的 / 不签字的老工程师——三个身份全部来自 C 级制度议题的日常语汇，无架空术语。自造专名建议 ≤3 且全部是地名类（如堤名、县名），不造体系词。\n\n---\n\n## 五、共鸣乘数（方法论第 3 条：截图转发点）\n\n- 目标自来水人群：\"家里有搞工程/修堤/签字背锅的人\"的观众——\"这说的是我爸/我师傅/我哥\"。\n- **第一截图拍**：「你签了字，出了事是你一生的责任；你不签，下游是几万人的命」——把职场签字焦虑放大到生死刻度，一张截图独立成立。\n- **第二截图拍**：竣工永久性标牌特写——\"碑上刻的名字\"是终身责任制的真实物件，观众会拍照对比自己单位的责任牌。\n- **第三截图拍**：混资历者提拔公示与主角 20 年原地职级的同框——\"认真的人没升职，糊弄的人步步高\"的普适憋屈。\n\n---\n\n## 六、锚点贯穿（方法论第 4 条：反派的作恶方式=情绪的现实原型）\n\n反派不写脸谱化贪官，写**\"把偷工减料做成流程\"的人**——每一步都是现实原型：\n\n1. 验收单\"先签后补\"，签字链把个人责任稀释成集体责任；\n2. 隐蔽工程（堤身芯样、基础齿墙）不留影像、夜里赶工覆盖；\n3. 以\"防汛窗口期/工期倒排\"压质量——用正确的理由干错误的事；\n4. 把提问题的人调离岗位、边缘化，而非消灭——现实中最常见的排异方式。\n\n汛期即戏剧钟：台风/洪峰倒计时把\"实时焦虑\"转成 tick，主角的每一次坚持都在跟水位赛跑。锚不是贴片——**决口那一刻，观众想起的是前面每一张签掉的和没签的验收单**。\n\n---\n\n## 七、合规与纪律红线\n\n- **不点名、不影射真实机构与真实责任人**；所有真实事件（河南决口、藏尼洪水等）只作情绪举证，剧作中不得对应、不得暗示责任认定。\n- 不消费灾难伤亡：灾害类证据只用于\"水是真实威胁\"的体感，不出现真实遇难细节。\n- 情绪是燃料不是说教：不喊口号、不批判体制，只把\"较真者的憋屈\"拍成戏；愤怒全部落在反派的具体作恶动作上。\n\n---\n\n## 八、来源索引\n\nA 级：\n- 25 个部门共同部署开展 2026 年全国\"质量月\"活动（中国新闻网，2026-09-04）：https://www.chinanews.com.cn/sh/2026/09-04/10690416.shtml\n- 东莞市住建局 2026 年\"质量月\"活动通知（明写严查偷工减料、弄虚作假）：https://zjj.dg.gov.cn/gkmlpt/content/4/4580/post_4580877.html\n- Typhoon Saudel 9 月 3 日登陆福建、最高级别洪水应急响应（外电转引水利部，2026-09 上旬）：https://www.bbc.com/news/articles/c79ygnv9e93o （同源外电体系）\n- 藏尼跨境冰川洪水（UN News，2026-08-26 起）：https://news.un.org/en/story/2026/08/1168208\n\nB 级：\n- 河南郏县北汝河堤防决口与封堵（Xinhua English，2026-08-13）：https://english.news.cn/20260813/ae1adaa9c8cc40ea98c28e8510536dea/c.html ；路透决口封堵图集：https://www.reutersconnect.com/item/china-levee-breaches-sealed-in-flood-hit-henan/dGFnOnJldXRlcnMuY29tLDIwMjY6bmV3c21sX09XU0hCQzExNzY2MDk\n- 台风\"海豚\"百万人转移（The Guardian，2026-08-10）：https://www.theguardian.com/world/2026/aug/10/typhoon-dolphin-china-shanghai-flooding-evacuations\n\nC 级：\n- 工程质量终身责任制（五方承诺书+永久性标牌）：https://www.junhe.com/law-reviews/280\n- 2026 年 Q1 中央水利投资 829 亿元、病险水库除险加固重点（国新办发布会，2026-04）：http://www.scio.gov.cn/xwfb/bwxwfb/gbwfbh/slb/202604/t20260414_984746.html\n- 2026 年首批\"两重\"清单、超长期特别国债超 1700 亿元：https://baike.baidu.com/item/2026%E5%B9%B4%E6%8F%90%E5%89%8D%E6%89%B9%E2%80%98%E4%B8%A4%E9%87%8D%E2%80%99%E5%BB%BA%E8%AE%BE%E9%A1%B9%E7%9B%AE%E6%B8%85%E5%8D%95/67162831\n- 2025 年水利投资 1.28 万亿、连续 4 年超万亿（新华网，2026-01-06）：https://www.news.cn/20260106/25d105d07ac644d4a52d92b87d21a808/c.html\n- 水库安全度汛、病险水库主汛期空库运行（水利部部署）：http://swj.sh.gov.cn/swj-xyxx/20260515/2b5e39b093e1400f942989a380f02dfa.html\n", "选题分析报告.md": "# 选题分析报告：《守堤人》（水利题材 · 拒签老总工）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：story-analyst（选题分析师）\n- 生成日期：2026-09-16\n- 输入件：选题素材.md（甲方需求）；梗卡.md（同批找梗师产物，快照 kakaxing/scriptrawstone@2026-09-15，6928 部解析样本）；热点素材.md（同批网感师产物，检索窗口 2026-08-17 至 2026-09-16）；内部/kb-benchmark.md（28 件对标库）；内部/kb-market.md（constraints / setting-rules / meme-rules）\n- 批注基线声明：本批未装配独立「四视角评估批注报告」，风险事实基线取梗卡「风险」5 条与热点素材「合规与纪律红线」节，均已在正文正面回应；梗卡与热点素材之间无分歧条目。\n- 写作纪律声明：本报告为决策文档，不含剧情设计；创意落点仅一句话带过，由选题方案步展开。\n\n---\n\n## 一、市场分析\n\n### 1.1 赛道温度判断（依据：梗卡查族结论，快照 2026-09-15）\n\n**判定：本选题踩的两条机制带均处上升期，落点带供给空白——「上升赛道 × 空白落点」组合。**\n\n| 带位 | 梗族 | 饱和度 | n / 占比 | 均热度（万） | 判定 |\n| --- | --- | --- | --- | --- | --- |\n| 主机制带 | 神豪暴富 | 上升期·蓝海偏好 | 380 / 5.5% | 18987 | 供给未追上热度，可直接主推 |\n| 辅机制带 | 流放种田 | 上升期·蓝海偏好 | 92 / 1.3% | 22598 | 全库最高均热度档之一 |\n| 必备引擎 | 打脸虐渣 | 红海·有效 | 1510 / 21.8% | 18558 | 横切超族，须带新变体方可进 |\n| 限制使用 | 马甲掉马 | 红海·过饱和 | 750 / 10.8% | 9215（低于全库均值 10058） | 仅许物件式单点揭示 |\n\n关键证据：神豪暴富族演化链已从「隐藏财富」分化出「隐藏硬实力→当众验证」支线（《扫地姑娘是百亿精算师》→《她带着百亿订单离职了》→《老炮开山》），而该支线**无水利落点**；流放种田演化链已有《流放荒州》硬核基建翻盘先例，苦地全部是古代/架空边关荒岛，**无现实汛期圩堤落点**。水利落点是两条上升链的共同空白。\n\n近似带佐证（语料未覆盖声明，梗卡第一节）：题材矩阵无「水利/防汛/基建工程」直接类目；近似带**职场**（202 部 / 均 20951 万）、**乡村**（153 部 / 均 20748 万）、**小人物**（69 部 / 均 17609 万）均高于全库均值 10058 万——「职业实干逆袭」带热度在位而直接供给不足。\n\n### 1.2 在 2025-2026 题材轮动中的位置\n\n- **实事做底是本轮的制度性首选**：kb/market/setting-rules 三级制把「实事新闻做底子（防汛救灾、工程质量清查等全民共识公共事件）」列为设定来源首选，原创架空体系一票否决。本选题是三级制的教科书案例：工程质量终身责任制、汛期应急响应、堤防除险加固国债项目均为 C 级制度议题，零解释成本（甲方 3 秒测试通过）。\n- **「专业者 × 结构性灾难」同构已跨市场验证**：NA 对标库中《Tower Inferno: The Lone Architect》《Crush Depth》《Mayday: The Shadow Pilot》《Deep Abyss Master》四件同构件（A+/S 级，24000 万档，kb-benchmark）证明「最懂这栋楼/这艘船的人在灾难中当众验证」机制在 CN、NA 双市场均有成绩；本选题把灾难从突发事故置换为**可预测的自然倒计时（汛期）**，把验证从「事中救援」前移到「事前拒签」，为链上未做变体。\n- **反流量审美窗口**：《给大妈爆改后我成了顶流》以 0.6 万热度冲到 S 级 AI 评 91（kb-benchmark），证明「评分与热度分离、实事向可冲评级」——实事流在评级体系里有上行通道。\n\n### 1.3 平台格局与发行路径建议\n\n- **主路径：CN 竖屏付费墙**（独立 App / 小程序）。依据：生产约束实盘值（60 集 × 1-1.5 分钟 × 1200 字）即竖屏付费短剧口径（kb/market/constraints）；本题材的付费钩子密度（拒签→受辱→洪峰验证的延迟满足结构）适配前免后付。\n- **引流路径：抖音站内切片**。依据：梗卡已布 16 条现存热梗挂接与前三章切片点（「这方混凝土保熟吗」「偷感」夜施名场面等），每集 ≥1 可独立切片梗点，天然适配站内分发引流。\n- 备选免费 IAA 路径与分账数据：素材未提供各平台买量成本与分账测算数据，**（待补充）**；在补齐前不据此改变主路径判断。\n\n---\n\n## 二、目标客群\n\n### 2.1 主客群\n\n- **画像**：30-55 岁男性为核，工程/基建/国企/体制内从业者及其家属；三四线及县域城市权重高（堤防除险加固项目所在地即其生活半径）；观看场景为通勤/晚间碎片时间；有稳定付费能力，为「尊严代偿」类内容付费意愿被对标件验证。\n- **推断依据**：同机制对标件受众声明——《Crush Depth》明确 18-40 岁男性、阶层压迫与尊严痛点（kb-benchmark b020-na）；《扫地姑娘是百亿精算师》打「打工人在职场被轻视」共情（b016-fam）；本片主角为 58 岁老总工，客群较 NA 灾难件上移一档年龄。\n- **规模量级**：（待补充——素材无分客群规模数据；可用代理指标：2025 年水利建设投资 1.28 万亿元、连续 4 年超万亿，行业与就业盘子的量级见第四节 C 级数据）。\n\n### 2.2 次客群\n\n- **画像**：「家里有搞工程/修堤/签字背锅的人」的家庭观众，含 30-55 岁女性（家属视角）；观看场景为家庭共看 + 社交转发。\n- **依据**：热点素材第五节共鸣乘数——「这说的是我爸/我师傅/我哥」的自来水转发人群；第一截图拍「你签了字，是你一生的责任；你不签，下游是几万人的命」独立成立。\n- **规模量级**：（待补充对标）。\n\n### 2.3 客群与题材的咬合点\n\n「会干的不如会混的」是职场最大公约数憋屈（热点素材第一节：普适底层情绪），而本题材把它放大到生死刻度——签字焦虑 × 下游几万人的命 × 终身责任制（签字与刻名碑是真实制度自带的戏剧装置，零解释成本）。观众此刻正处于汛期焦虑激活态：9 月初台风登陆 + 最高级别应急响应 + 堤防决口画面仍在传播（热点素材 A/B 级证据），「堤里有没有猫腻」的愤怒是进行时，不是回忆。\n\n---\n\n## 三、竞品分析\n\n对标 1-4 取自 kb-benchmark（快照 2026-09-15 实盘数据）；条目 5 为方法论强制的韩剧同情绪赛道基准（本批 KB 无韩剧对标件，成绩数据按纪律标待补充）。\n\n| # | 作品 | 平台/市场 | 题材标签 | 成绩 | 可借鉴点 | 本方案差异机会 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | 《扫地姑娘是百亿精算师》（b016-fam） | CN · 竖屏短剧 | 都市/职场/逆袭，神豪暴富族「隐藏硬实力」支线 | A+ 级 / 94000 万 / AI 评 86 | 「当众验证」强度标尺：对赌谈判死局→当众徒手复原数据。本片同位爆点=验收会死局→水位/管涌现场当众验证 | 验证执行者不是主角本人技能演示，而是自然规律（洪水替他掉马）——「零反击、纯坚持」链上无人做过 |\n| 2 | 《Tower Inferno: The Lone Architect》（b024-na） | NA · 竖屏短剧 | 都市灾难/智斗/职场复仇 | A+ 级 / 24000 万 / AI 评 87 | 「专业者 × 结构性灾难 × 内部人揭露」同构强度标尺 | 灾难非突发事故而是可预测倒计时（汛期 tick）；主打事前拒签而非事中救援，受辱-蓄力段更长、清算更可见 |\n| 3 | 《给大妈爆改后我成了顶流》（b027-s） | CN · 竖屏短剧 | 治愈系/职场逆袭/女性群像 | S 级 / 0.6 万 / AI 评 91 | 实干逆袭 + 冷处理反派标尺；低热度高评分证明实事向可冲评级 | 本片自带全剧戏剧钟（汛期倒计时），情绪浓度上限更高；男频向与该件女频向错位 |\n| 4 | 《重回前夫假死那天，我大摆招魂席》（b028-s） | CN · 竖屏短剧 | 重生流/家庭伦理/时代逆袭 | S 级 / 14000 万 / AI 评 91 | 「清算执行者是规则与物理而非主角口才」的可见可数清算标尺（借丧事规则瓮中捉鳖） | 本片清算执行者=洪峰水位，题材为公共工程实事而非家庭伦理；无重生（重生会把「坚持」降级为「先知」，梗卡已判不取） |\n| 5 | 《黑暗荣耀》《请和我的老公结婚吧》《财阀家的小儿子》 | 韩剧 · 长视频 | 复仇/豪门/重生同情绪赛道 | （待补充对标——本批 KB 无韩剧件，禁止编造数据） | 冲突强度与情绪浓度基准：长剧把「较真者被系统碾碎」拍到数集才给第一次反击，短剧观众的爽感阈值已由此抬高 | 短剧必须在第 1 集内完成受辱+蓄力结构、第 8-12 集给出首个当众验证，以密度补偿单场浓度 |\n\n**竞争密度结论**：机制带（隐藏硬实力验证 × 打脸虐渣）为红海/上升混合，**水利落点为全链空白**——梗卡查族覆盖 13 族 6928 部样本，未发现水利/防汛直接类目；神豪暴富「硬实力」支线与流放种田「基建翻盘」链上均无现实汛期圩堤先例。判定为**蓝海窗口**，但窗口期取决于「隐藏硬实力」支线的供给追赶速度（当前供给未追上热度，快照 2026-09-15），叠加 A 级汛期情绪锚的时效性（汛期约至 10 月上旬），**建议窗口按 1-2 个月计**，本批应直接进入选题方案。\n\n---\n\n## 四、数据分析\n\n全部量化证据及来源（写作纪律 1：三者之外不引入任何数字）：\n\n**A. 市场语料（来源：梗卡，快照 kakaxing/scriptrawstone@2026-09-15，6928 部解析样本）**\n- 全库均热度 10058 万；神豪暴富 n=380 / 均 18987 万；打脸虐渣 n=1510 / 均 18558 万；流放种田 n=92 / 均 22598 万；马甲掉马 n=750 / 均 9215 万；职场近似带 202 部 / 均 20951 万；乡村 153 部 / 均 20748 万；小人物 69 部 / 均 17609 万。\n- 题材矩阵无水利/防汛/基建直接类目（语料未覆盖声明）——本选题无直接类目热度背书，属数据盲区内的机会型判断。\n\n**B. 对标件成绩（来源：kb-benchmark，快照 2026-09-15）**\n- b016-fam《扫地姑娘是百亿精算师》：A+ / 94000 万 / AI 评 86；b024-na《Tower Inferno》：A+ / 24000 万 / AI 评 87；b027-s《给大妈爆改后我成了顶流》：S / 0.6 万 / AI 评 91；b028-s《重回前夫假死那天》：S / 14000 万 / AI 评 91。\n- 对标件生产约束实盘（同源）：集数 60（b027 为 80、b021/b024 为 40）；单集 1-1.5 分钟；单集字数 1000-1400；场景 ≤3；演员 ≤10。\n\n**C. 格式实盘（来源：kb/market/constraints，7938 部在售剧本硬格式统计）**\n- 60 集 4224 部 / 80 集 925 / 40 集 718；单集 1200 字 4284 部；场景 ≤3 为 7937/7938；有名有姓演员 ≤10 为 7925 部。\n\n**D. 时代情绪锚证据（来源：热点素材，等级随条标注）**\n- A 级：2026 全国「质量月」25 部门联合部署、严查偷工减料弄虚作假（中国新闻网，2026-09-04）；台风「沙德尔」2026-09-03 登陆福建、水利部启动最高级别洪水应急响应（外电转引水利部）。\n- B 级：河南某县堤防决口与应急封堵（新华社英文版，2026-08-13，超窗 4 天）；台风「海豚」超百万人转移（卫报，2026-08-10，超窗）。\n- C 级（制度底座）：工程质量终身责任制（五方承诺书 + 永久性标牌）；2025 年水利投资 1.28 万亿、连续 4 年超万亿（新华网，2026-01-06）；2026 首批「两重」超长期特别国债超 1700 亿；2026 Q1 中央水利投资 829 亿（国新办，2026-04）；病险水库主汛期空库运行（水利部部署）。\n\n**E. 变现测算**：买量成本、付费卡点转化率、制作成本档——素材均未提供，**（待补充）**；制作成本档可由 C3 约束（场景 ≤3、演员 ≤10）间接压低，属中低成本档形态。\n\n---\n\n## 五、结论与建议\n\n### 5.1 推荐度\n\n**可做（倾向强推）**——一句话理由：机制层双上升带 × 全链空白落点 × A 级 30 天实时情绪锚 × 实事做底零解释成本四者齐备，唯水利类目缺直接语料与买量数据背书，故以「可做」立项、按移交单硬约束推进即可上调。\n\n### 5.2 风险清单（每条附对策）\n\n| # | 风险 | 等级 | 对策 |\n| --- | --- | --- | --- |\n| 1 | 换皮陷阱：神豪暴富族标签含「暴富」，实事流无暴富，方案阶段易把爽点写回「身份财富碾压」（梗卡风险 1） | 高 | 爽点一律锚「拒签 × 洪峰验证」机制；方案创新亮点段必须回指新变体；监理按此条一票复核 |\n| 2 | 红海纪律失效：打脸虐渣 n=1510 无新变体即同质化；马甲掉马均热度已低于库均值（梗卡风险 2） | 高 | 打脸必须带「洪水当法官」变体；马甲仅许洪峰后复盘的物件式单点揭示（一摞拒签单），禁多层马甲当众撕 |\n| 3 | 合规风险：水利议题贴近真实机构与真实灾害事件（梗卡风险 3 + 热点素材第七节） | 高 | 全稿零真实机构名/责任人；河南决口、藏尼洪水等只作情绪举证，剧内不得对应、不得暗示责任认定；不消费灾难伤亡；涉汛画面落点「问责与守护」，不渲染灾情惨状 |\n| 4 | 情感线稀释：混入团宠/真假千金/强爱情线会毁实事底子（梗卡风险 5） | 中 | 爱情线降为挂件或不设；红线进移交单 C4 |\n| 5 | 数据盲区：水利类目语料未覆盖 + 快照时效 2026-09-15（梗卡风险 4） | 中 | 立项后发行前补平台侧验证（待补充）；窗口期按汛期情绪时效 1-2 个月计 |\n| 6 | 成本风险：汛期/洪水场面易超预算（对标 NA 灾难件的场面体量不可照搬） | 中 | 场景 ≤3 硬约束 + 洪峰验证优先用「水位线对照、管涌现场」等实拍可达成场面，灾难奇观非卖点、验证逻辑才是 |\n\n### 5.3 创作约束移交单（给选题方案步，逐条遵守，可校验）\n\n**C1 目标市场与客群**：CN 竖屏付费短剧为主市场；男频实事爽剧定位；主客群 30-55 岁男性（工程/国企/体制内及家属），次客群「家里有工程人」家庭共看观众；转发人群锚「家属替他委屈」截图点。\n\n**C2 媒介形态与集数时长**：60 集 × 单集 1-1.5 分钟 × 单集字数 ≤1200 字（kb/market/constraints 主流值）；偏离主流值须在方案中显式声明并给理由，隐式偏离驳回。\n\n**C3 成本档（场景数与角色数上限）**：主场景 ≤3 个（建议集合：验收会议室 / 堤段工地·含汛期堤坡 / 项目部办公区，最终由方案定，总数不得超 3）；有名有姓角色 ≤10 人，核心角色 ≤5 人（拒签老总工 / 偷工减料的施工方负责人 / 赶工期要签字的上级 / 徒弟或家属 / 复审方一名即可）；「全场惊呆」类当众反应由群演承担，不计入上限。每集冲突须发生在可复用景，换景=换集节拍点。\n\n**C4 必须避开的雷**：① 禁原创架空世界观与体系术语（C10 设定三级制，设定来源必须声明为「实事新闻做底子」首选级）；② 禁重生/先知（梗卡已判：重生把「坚持」降级为「先知」）；③ 禁团宠护短/真假千金/追妻火葬场等退潮族与本题材混装；④ 禁把爽点写成「身份财富碾压」暴富皮；⑤ 禁多层马甲当众撕；⑥ 三分钟测试必须过：观众 3 秒即懂「修堤的、偷工减料的、不签字的老工程师」，凡需先讲设定才能进冲突的开局驳回。\n\n**C5 合规红线（一票否决）**：全稿零真实机构名（水利部/流域委/地方水利局及任何真实单位禁用）、零真实责任人；自造专名全稿 ≤3 个且全部为地名类，前三章自造专名 ≤2 个（建议仅「清川河」「临江圩」，留 1 个余量）；真实灾害事件只作情绪举证，剧内事件不得与河南决口等真实事件对应或暗示责任认定；不出现真实遇难细节、不渲染灾情惨状；不喊口号、不批判体制，愤怒全部落在反派的具体作恶动作上；涉汛结局落点「问责与守护」正价值。\n\n**C6 卡点位置要求**：首个付费卡点设于第 8-12 集，卡点事件为首次「当众验证」（验收会死局→现场验证，强度不得低于 b016-fam 同位爆点）；前三章布点按梗卡执行——E1 开标会独拒签 +「水位线不认识领导」、E2 施压对撞、E3 夜查偷工受辱蓄力顶点（集尾连本带利伏笔）。\n\n**C7 时代情绪锚方向**：主锚「较真者的憋屈 × 汛期防洪焦虑」，有 30 天内 A 级证据（2026-09-04 质量月 25 部门部署；2026-09-03 台风「沙德尔」最高级别应急响应），无需降级为「经典母题」；底层情绪锚「会干的不如会混的」贯穿全剧；汛期倒计时（台风/洪峰）作全剧戏剧钟——决口一刻观众须想起前面每一张签掉的和没签的验收单。反派作恶方式锚现实原型四件套（先签后补稀释责任 / 隐蔽工程不留影像 / 拿防汛窗口期压质量 / 把提问题的人调岗边缘化）。\n\n**C8 梗密度硬指标**：每集 ≥1 处可独立切片传播的梗点；口癖「这单我不签。」hot 档每集 ≥1 次、3 集内变奏 3 次；梗卡第三节 16 条现存热梗表为 S1 网感输入源，方案阶段必须挂接使用。\n\n**C9 对标强度线**：当众验证场面强度对标 b016-fam《扫地姑娘是百亿精算师》同位爆点；清算必须「可见可数」（对标 b028-s 标尺）——拒签单、水位线对照、竣工永久性标牌为三大清算物件，冷静档至少 2 件（另一件建议雨靴，按梗卡）。\n\n**C10 设定体系约束**：设定来源声明为三级制首选级「实事新闻做底子」（工程质量终身责任制 + 国债除险加固 + 汛期问责，全部 C 级可核实制度）；一句话故事须过「大白话标题检验」（热点素材第四节样本：「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」）；具体剧情设计由选题方案步在上述约束内展开。\n\n---\n\n*依据：skills/topic-analysis-report 五节结构；梗卡@2026-09-16；热点素材@2026-09-16；kb-benchmark@2026-09-15；kb-market（constraints@2026-09-14 / setting-rules@2026-09-15 / meme-rules@2026-09-15）。本报告为 S1 决策件，下一步移交选题方案步。*\n", "选题方案-爽版-基线.md": "# 选题方案 · 爽版无监管基线：《守堤人》（水利题材 · 拒签老总工）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：scene-screenwriter（选题编剧）· S3 baseline 节点\n- 生成日期：2026-09-16\n- 本件性质：**route=dual 监管增益对照件**（内部过程物件，不随对外交付输出；对应 flow.json `baseline` 节点：skill=topic-proposal、route=hot、**oversight=false**）\n- 输入件：选题分析报告.md 第五节「创作约束移交单」（C1-C10）；梗卡.md；热点素材.md；kb/aesthetic/style-routes（hot 档参数）；kb/aesthetic/oversight（双专家监管标准与 A/B 纪律）；kb/aesthetic/pacing-density（爆点密度计量口径）\n- 禁读声明：本批为全新重跑，未读取 projects/_archive/ 下任何内容\n\n---\n\n## 〇、对照实验设计（本件读法）\n\n**A/B 定义**（依据 kb/aesthetic/oversight「A/B 基线纪律：监管的增益必须可验证，不是信仰」）：\n\n- **A 组（爽版正稿）**：同一编剧 skill 产出，双专家监管位全开——总编管强度（爆点对标制/钩子生理测试/名场面可视化/分布图），监理管合规（逐条对账/一票否决/约束对账表）。\n- **B 组（本件）**：同一编剧 skill、同一输入件、route=hot 参数全档，**监管位关闭**——不逐条对账、不加码、红线不作为设计输入。它回答的问题是：**没有人盯着时，这套爽点机制自然长什么样。**\n\n**受控变量**（与爽版正稿同值，不构成差异源）：C1 客群定位；C2 形态（60 集 × 1-1.5 分钟 × 单集 ≤1200 字）；C3 场景 ≤3 / 有名有姓 ≤10 / 核心 ≤5；C6 卡点位置（首卡 E8-12 当众验证；E1-E3 布点按梗卡）；C7 情绪锚方向；C8 梗密度硬指标与 16 条热梗表；C9 对标强度线与清算物件；C10 设定三级制（实事做底）。hot 档九参数（style-routes）作为两版共同的档位天花板。\n\n**自变量**（监管开闭）：总编强度监管位 off（无爆点对标、无加码）；监理合规监管位 off（无对账表、无一票否决，C4 禁区与 C5 合规红线不作为写作时的主动校验项）。\n\n**判定口径**：爽点机制等价性按 kb/aesthetic/pacing-density hot 档计量——每集爽点数（打脸/反转/身份碎片/金句任一）、受辱→回击时差（拍）、口癖变奏数、名场面可视化数。\n\n**本件文件层红线声明**：对照在**设计决策层**描述无监管写法（标注「基线倾向」），不落地执行任何违规文本——本件全文零真实机构名、零真实责任人、零消费伤亡的灾害场面。违规捷径只说明「会怎么写」，不写出那句可拍的词。\n\n---\n\n## 一、基线稿 · 选题（无监管状态）\n\n**选题名**：《守堤人》（沿用受控命名，无监管不改变命名——命名本身无监管敏感点）。\n\n**一句话定位**：大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字，洪水替他验了一张没人敢验的收据。\n\n**时代情绪锚**：较真者的憋屈 × 汛期防洪焦虑（底层情绪「会干的不如会混的」贯穿）。锚的证据强度与本件无关——无监管状态下，编剧照常引用素材包里的锚，**但不会去核锚的 30 天时效**（这是监理与网感师监管位的工作，基线 natural 缺省）。判定：锚取法等价，时效核验缺位是预期增益点 G1。\n\n**新意装置**：拒签单 × 洪峰当众验证——「他没打赢任何人，是洪水替他赢了」。装置改变的具体写法：每一次拒签都是蓄力，清算执行者是水位而非主角的嘴。无监管状态下装置照常成立（装置来自受控的梗卡选型，不依赖监管位）。判定：**等价成立**。\n\n**核心爽点承诺**：看一个被全项目部门孤立的老头，靠一张一张「不签」活到最后，看着洪水把他签过的和没签的堤段分成两半。\n\n**开篇 3 秒设计**（第一拍）：验收会议室长桌，签到笔在十几只手里排队传递、逐个落名；笔传到秦江海手里停住，他拿笔帽在图纸上敲三下——「这单我不签。」全场回头定格。反常 + 冲突占全，无铺垫。判定：**等价成立**（3 秒钩子是 hot 档四硬规则底线，基线不掉）。\n\n---\n\n## 二、基线稿 · 人设（核心 5 人，有名有姓 ≤10）\n\n| 角色 | 设定 | 反差 | 核心动机 | 口癖 / 标志小动作 |\n| --- | --- | --- | --- | --- |\n| 秦江海 · 58 · 临江圩除险加固项目部总工程师 | 藏蓝旧工装洗得发白，左胸口袋别两支笔（一支写字、一支只画水位线），胶底鞋，后腰钥匙串上挂一把老钢卷尺 | 开会最没存在感，堤上声音最大 | 三十年前同一条河上，他师父没拦住的那座坝 | 「这单我不签。」／说话前用笔帽敲三下图纸 |\n| 马长贵 · 45 · 施工方负责人（剧内自造主体） | 皮鞋上工地，手机外放，办公桌腿垫着酒箱 | 对上点头哈腰、对工人横 | 垫资垫到抵押了房，必须赶在汛期前验收回款 | 「规矩是死的，人是活的。」／说话先递烟 |\n| 冯有德 · 50 · 项目部上级（赶工期要签字的） | 衬衫扣到顶，文件夹永远抱在胸前当盾牌 | 不贪，但怕担责 | 「集体的决定」——把个人责任稀释成集体责任 | 「再研究研究。」／签字前先看左右 |\n| 雷小雨 · 26 · 测绘员（徒弟） | 反光背心，安全帽带子永远不扣 | 全项目部唯一公开站在老头一边的人，年轻人里最「多事」 | 她信数据不信酒桌 | 「图纸上没有这个数。」／拿全站仪当拐杖 |\n| 贺工 · 60 · 复核组老专家（复审方） | 旧夹克，布鞋，手里始终捏着一个掉漆的保温杯 | 退居二线，说话没人当回事，出手就是终审 | 退休前最后一趟，想把当年的糊涂账算清 | 「我看看。」／保温杯拧开又拧上 |\n\n**基线诚实缺口**（无总编监管位时自然出现，为对照证据 B1-B3）：\n\n- B1 外形记忆点弱化：雷小雨仅「反光背心」，可视化未到「AI 出图能画」精度（监管版加码方向：安全帽上手绘警戒红线的黄色胶带）。\n- B2 口癖只挂主角一人，配角语言卡未做（监理交付完整性核查项缺位）。\n- B3 贺工「复审方」身份在基线稿中第 30 集后才进场——身份碎片亮出晚于「早半拍」原则（总编爆点对标制会把它提前到首卡现场当背景板）。\n\n---\n\n## 三、基线稿 · 冲突设计\n\n**韩剧强度基准自检**：本节按编剧惯性写「情绪外化 + 反派梯度」，**但无对标制压迫，强度按最低达标线写**（对照证据 B4：基线版每集外化情绪爆点按 1-2 个写，低于 hot 档 ≥3）。\n\n**主线冲突（一句话）**：不肯签字的老总工要在洪峰到来之前，拦住一整条想把问题堤段「合法签收」的签字链。\n\n**单元冲突模板（可无限复制）**：「一张验收单的一次攻防」——反派用现实四件套之一施压（先签后补 / 隐蔽工程不留影像 / 防汛窗口期压质量 / 调岗排异）→ 主角用制度条文或物理证据回击（芯样、水位线、标牌条款）→ 集尾卡点收。可复制原因：分部工程天然逐项验收，一张单 = 一集节拍；全部攻防可装进三景（验收会议室 / 堤段工地含汛期堤坡 / 项目部办公区），换景 = 换集。\n\n**反派梯度（三层）**：\n\n1. 马长贵（动手的：偷工减料、夜施换料）——E1-E18；\n2. 冯有德（签字的：先签后补、调岗排异、拿防汛窗口压质量）——E19-E42；\n3. 幕后围标验收链（分饼的：把验收做成流程的人，剧内自造主体，不落任何真实机构）——E43-E60。\n\n**冲突密度表（单元闭环，6-10 集一个）**：E1-8 开标拒签连环施压 → E9-16 夜查偷工与调岗 → E17-24 验收会死局与首卡验证 → E25-32 调岗管仓库与堤段抽检 → E33-40 隐蔽工程开膛 → E41-48 围标链现形 → E49-56 洪峰全堤告急 → E57-60 问责与守护。**基线缺口 B5**：表只到单元级，无逐集爽点标注与沙漠段检查（总编「全剧爆点分布图」监管项缺位）。\n\n**付费卡点事件表**：首卡 E8-12 验收会死局 → 管涌现场当众验证（强度对标 b016 同位爆点：对赌死局 → 徒手复原数据的同位物 = 死局 → 水位线对照打脸）；大卡点候选 E20 拒签单被当众撕 + 调岗管仓库；E35 隐蔽工程开膛见假齿墙；E50 洪峰夜全堤告急他上堤；E58 问责会与刻名碑。判定：卡点事件**等价成立**（位置与事件均为受控的 C6/C9），基线缺口 B6：卡点集内的「中型爽点 ≥2 垫场」未配置。\n\n**基线诚实缺口 B6b（受控变量执行偏差，如实标注）**：C8 虽列为受控变量，基线稿实际仅挂接热梗 5 条（水位线不认识领导／我不要你觉得×水不要你觉得／偷感／这方混凝土保熟吗／00 后整顿职场变奏），未做 16 条全量挂接——监理逐条对账位正是为此设；爽版正稿必须全量挂接并通过对照表 A 的 G4 复读监管复核。\n\n**基线诚实缺口 B7（本节最重要的对照证据）**：无监管状态下，本节写作时**未主动核对 C4/C5**——基线倾向出现过三处违规捷径，均在本件被拦在设计层（未落地成文本）：①第三层反派想直接挂真实主管机构名以省掉「自造主体」的解释成本（倾向描述，未执行）；②E50 洪峰夜的第一反应是写决口+伤亡画面当爆点（倾向描述，未执行）；③终局想写成反派跪坟前的私人复仇式清算（倾向描述，未执行）。三处的合规取法与等价判定见对照表 B。\n\n---\n\n## 四、基线稿 · 大纲（三段式）\n\n**前期（E1-30）**：E1 开标会全员签字他独拒签（3 秒钩：签到笔传递 →「这单我不签。」→「水位线不认识领导。」）；E2 冯有德施压「我不要你觉得」×「水不要你觉得」；E3 夜查偷工，手电把换料现场钉在堤坡（「偷感」名场面），拒签单被当众撕（受辱蓄力顶点，集尾连本带利伏笔：撕掉的每一页都在他脑子里）。E4-8 连环施压与孤立；**E9-12 首卡**：验收会死局 → 管涌现场当众验证，马长贵堤段首次现形。E13-30 单元冲突循环推进，反派一层层亮。**基线缺口 B8**：名场面清单只写到大纲级画面（「管涌现场验证」），未具体到「谁在哪对谁做了什么」的 Poster 级分镜需求（总编名场面可视化监管项缺位）。\n\n**中期（E31-50）**：反派升格至第三层；雷小雨被穿小鞋、贺工进场；抽检与开膛戏连打；E50 洪峰夜全堤告急——全剧戏剧钟（汛期倒计时）走完上半程。**基线缺口 B9**：伏笔登记未做（calm 档要求的伏笔回收率 >60% 在 hot 档不作硬要求，但基线连自发登记都没有，回收全凭惯性）。\n\n**终局（E51-60）**：洪峰过境，一堤两制分屏——他拒签的堤段与马长贵签收的堤段在同一个水位线下分出高下（水位线对照 = 清算物件一）；上级复盘翻出他被撕后重抄的一摞拒签单（物件式单点揭示，仅此一层，不当众撕马甲——此条为受控的梗卡风险 2 纪律，基线因读过素材包而照做，但**无监理核验**）；问责会 + 竣工永久性标牌刻名（清算物件二）；他签下最后一张验收单。落点：问责与守护。判定：终局落点**等价成立**（此落点来自受控的 C5，基线稿照写；基线倾向的「私人复仇式终局」被素材包自身纪律拦下，属于运气而非监管——对照证据 B10：**无监管位的合规依赖输入件自律，不可审计**）。\n\n---\n\n## 五、基线稿 · 前三集初稿（分拍，粒度=拍级要点）\n\n布点为受控变量（C6：E1 独拒签 / E2 施压对撞 / E3 夜查受辱顶点），分拍按 hot 档节奏（前 3 秒钩子 → 冲突展开 → 集末卡点；每拍一个认知更新）。\n\n### E1 · 开标会（景一：验收会议室）\n\n1. 【3 秒钩】签到笔沿长桌传递逐个落名 → 传到秦江海停住，笔帽敲图纸三下：「这单我不签。」（反常+冲突）\n2. 冯有德低声施压「全签了就差你」；秦翻到堤身填筑页推过去：「压实度不够，数字在这儿。」\n3. 马长贵起哄「老秦你这是挡大家财路」；全场哄笑，雷小雨把检测原始记录拍在桌上（爽点 1：初次小型对撞）。\n4. 秦江海口癖变奏：「签了，我把三十年押给你；不签，下游几万人押给他们？」（金句，切片点）\n5. 【集末卡点·信息型】马长贵冷笑放话「那咱就看看，是你的章硬还是我的路子硬」——外面雷声第一响，汛期倒计时启动。\n\n基线爆点计数：**2 / 集**（对撞、金句）——低于 hot 档 ≥3。缺口 B11：无总编加码（监管版会在拍 2 加身份碎片：左胸口袋里褪色劳模奖章特写，提前半拍亮身份）。\n\n### E2 · 施压对撞（景三：项目部办公区）\n\n1. 【3 秒钩】秦江海的办公桌被搬进档案室角落，门牌摘了（调岗预演，冲突直接开场）。\n2. 冯有德甩出联签单：「我不要你觉得，我要我觉得。」\n3. 秦江海头都不抬：「水不要你觉得。」（对撞切片点，爽点 1）\n4. 马长贵带人堵门递烟施压；雷小雨举全站仪拦：「图纸上没有这个数。」（爽点 2：小回击）\n5. 【集末卡点·情绪型】秦江海把钢卷尺拍在联签单上：「量堤可以，量人心你们不够长。」戛然而止。\n\n基线爆点计数：**2 / 集**。缺口 B12：口癖本集未变奏（hot 档金句复读：3 集内变奏 3 次，基线只做了 E1 一次，靠惯性，无复读监管）。\n\n### E3 · 夜查偷工（景二：堤段工地 · 汛期堤坡）\n\n1. 【3 秒钩】夜，手电光钉住堤坡上正在换料的卡车——「偷感」名场面开场（危险）。\n2. 马长贵反咬「赶在汛期前完工，是为了大家」——正确的理由干错误的事（C7 反派作恶锚，等价成立）。\n3. 秦江海蹲下抓一把料捻开：「这方混凝土，保熟吗？」（切片点，爽点 1）\n4. 次日验收会，拒签单被冯有德当众撕碎（受辱顶点）；**基线缺口 B13：回击隔 3 拍才来，超 hot 档 ≤2 拍红线**——监管版修法：当拍甩出芯样照片回击（「撕吧，每一页我都抄了三份」），撕单只留作集尾连本带利的情绪债。\n5. 【集末卡点·情绪+信息型】雨中他把碎纸一片片捡进雨靴（清算物件·雨靴首次亮相），画外雷声压堤——「水位涨一格，你们就多欠我一页。」（爽点 2 + 全剧钟卡点）\n\n基线爆点计数：**2 / 集**；E1-E3 口癖变奏实绩 1 次（要求 3 次）。**前三集基线小结：布点等价成立、钩子/卡点四硬规则达标；密度欠账 6 处（B1-B13 中属强度类者）全部指向被关闭的总编监管位——这就是历史实证「监管版 63 拍 vs 基线 40 拍」在本项目的预期复现位。**\n\n---\n\n## 六、监管增益对照\n\n### 对照表 B · 合规红线逐条（自变量核心：C4/C5 开闭）\n\n判定口径：**等价 = 爽点机制不依赖被禁元素，禁用后机制照常兑现；增益 = 合规取法反而更强**。\n\n| # | 条款 | 无监管基线倾向（决策层描述，未落地执行） | 合规基线落实（爽版正稿取法） | 判定 |\n| --- | --- | --- | --- | --- |\n| R1 | 零真实机构名 | 第三层反派直接挂真实主管机构名，省解释成本、借「实名」造震慑 | 全部用通称（项目部／复核组／上级单位）；自造专名预算 2 个（清川河、临江圩，全稿余量 1）；「实名感」由竣工永久性标牌刻名制度承担——剧内五方责任人刻名上碑，是制度自带的实名装置，比真实机构名更具体、更可拍（特写/转发点双料） | **等价 + 增益**：权力型金手指来自签字权与终身责任制，不来自牌子真伪；刻名碑是 C9 清算物件，实名感反而更强 |\n| R2 | 零真实责任人 | 影射新闻里的责任链条，借真实人物剪影造「对号入座」快感 | 反派作恶全部落在剧内反派的具体动作（先签后补／不留影像／窗口期压质量／调岗排异四件套），每个动作自带当众对撞位 | **等价**：愤怒落点本就该在动作；「对号入座」快感是一次性的，动作对撞可每集复用 |\n| R3 | 真实灾害事件不对应、不暗示责任认定 | E1 开场直接剪真实决口新闻画面当钩子 | 剧内事件独立成案（临江圩除险加固），水的威力靠剧内物证建立（见 R4），零真实影像对应 | **等价**：3 秒钩子由「独拒签」承担，本就不依赖新闻画面 |\n| R4 | 灾害场面不消费伤亡（专项，见第七节） | E50 洪峰夜写决口 + 伤亡画面当最大爆点；洪峰戏拍遇难特写、呼救镜头 | 水的威力全部物证化：水位刻度爬升、管涌翻浑水顶起碎石、青石板被顶裂、树干拦腰；人员只拍背影与转移安置的秩序感；伤亡零呈现（无遇难、无伤情特写、无呼救特写）；决口若出现只拍封堵作业与事后问责，不渲染灾情惨状 | **等价 + 增益**：恐惧源从「一次性惨状」换成「滴答爬升的水位刻度」——倒计时式恐惧可持续供 60 集消耗，比伤亡画面更耐打且不折损爽点兑现 |\n| R5 | 不喊口号、不批判体制 | 终局写成私人复仇式清算（反派跪坟、身败名裂即完），情绪泄向系统 | 情绪全落反派具体动作；终局落点「问责与守护」：问责会（剧内）+ 刻名碑 + 他签下最后一张验收单 | **等价 + 增益**：「他签字」比「他们下跪」更贴角色三十年弧光——他一生只认这一张纸，爽点兑现即人设兑现 |\n| R6 | C4-① 禁架空术语 | 无倾向（实事做底是输入件首选级，编剧无动机违反） | 设定来源声明：实事新闻做底（终身责任制 + 国债除险加固 + 汛期问责） | **等价**（本就是共同选型） |\n| R7 | C4-② 禁重生/先知 | 无倾向（梗卡已判：重生把坚持降级为先知） | 验证全靠事前拒签的物理证据链 | **等价** |\n| R8 | C4-④ 禁暴富皮／C4-⑤ 禁多层马甲 | 基线倾向：首卡让贺工亮「退休高工身份」碾压全场（身份型金手指惯性） | 金手指=权力型身份（签字权、复审权、终身责任制条款）；马甲仅许洪峰后一摞拒签单的物件式单点揭示 | **等价**：爽点兑现画面是「水位线对照 + 联签单作废」，不是身份碾压；与移交单 C4 同向 |\n| R9 | C4-⑥ 三秒测试 | 无倾向 | 「修堤的 / 偷工减料的 / 不签字的老工程师」E1 拍 1-2 全部亮相 | **等价**（受控布点保障） |\n\n### 对照表 A · hot 档参数逐项（强度监管位增益预判）\n\n| hot 档参数 | 基线实绩（本件第五节） | 监管版要求 | 预期增益点 |\n| --- | --- | --- | --- |\n| 每集爽点 ≥3 | 前三集 2/集 | ≥3 且分布无沙漠 | G2 密度加码：每集补 1 个身份碎片/反转（劳模奖章提前、芯样照片当拍回击） |\n| 受辱→回击 ≤2 拍 | E3 隔 3 拍（B13） | ≤2 拍 | G3 当拍回击改写 |\n| 口癖每集 ≥1、3 集变奏 3 次 | 变奏 1 次（B12） | 全达标 | G4 复读监管 |\n| 身份揭示早半拍 | 贺工 E30 后进场（B3） | 首卡现场作背景板 | G5 |\n| 名场面可视化 | 大纲级画面（B8） | 海报五要素、可直当分镜需求 | G6 |\n| 全剧爆点分布 | 单元级密度表（B5） | 逐集分布图、沙漠段检查 | G7 |\n| 四硬规则（拍号/卡点/口癖/3 秒钩） | 达标 | 达标（不豁免） | 无缺口——基线不掉底线的部分证明底线来自档位而非监管 |\n\n### 增益结论\n\n1. **爽点机制等价成立**：本片全部核心爽点机制（拒签蓄力、验收会死局→当众验证、洪水当法官清算、一堤两制水位分屏、拒签单物件式揭示、刻名碑问责落点）没有一个依赖被 C4/C5 禁止的元素——把真实机构名、真实事件对应、伤亡画面、身份碾压、多层马甲全部拿走，机制原样运转。合规基线不是爽点的减法。\n2. **监管增益为纯增益，两组**：强度组（G2-G7，总编位）——密度、时差、复读、可视化、分布；合规组（R1/R4/R5 的增益判定 + B7/B10）——红线落实产生的「可上线性」与刻名碑/雨靴等更强的清算物件，外加基线稿暴露的根本问题：**无监管位时合规只能靠输入件自律，不可审计（B10），监管位把自律变成对账。**\n3. **A/B 计量协议**：爽版正稿定稿后，按本件第五节同口径回填前三集爆点计数、口癖变奏、回击时差三列（本件留 □ 待回填位），与基线值并表报 R3 门；历史参照 63 拍 vs 40 拍。\n\n---\n\n## 七、专项：灾害场面不消费伤亡——红线落实说明\n\n**为什么这条在本片最重**：题材的天然诱惑是把水的威力拍成人的惨状；本片机制的优势恰是不需要——恐惧由倒计时供给，不由惨状供给。\n\n**落实三则（全稿执行，含前三集与大纲名场面清单）**：\n\n1. **水的威力物证化**：只拍物不拍人受害——水位刻度一格一格爬（全剧钟的视觉本体）、管涌口翻浑水顶起碎石、青石板步道被顶裂、树干拦腰、雨靴浮起。水的「大」用声音与刻度表达，不用惨状表达。\n2. **人员镜头纪律**：转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影），零遇难、零伤情特写、零呼救镜头、零寻人启事道具。\n3. **决口的处理**：若剧情需要决口，镜头只给封堵作业与事后问责会，不对应任何真实事件、不暗示任何真实责任认定；结局落点锚「问责与守护」正价值。\n\n**自检**：本件第五节分拍与第四节大纲名场面清单逐条核过，无一处伤亡消费镜头；对照表 B/R4 的基线倾向（伤亡画面当爆点）仅存在于设计层描述，未落地。\n\n---\n\n## 八、基线自检（对照件纪律）\n\n- [x] 五节结构齐全且与爽版正稿同构（唯一变量=监管开闭，受控变量表见〇节）\n- [x] 本件文本零真实机构名 / 零真实责任人（R1/R2 对照均为决策层描述）\n- [x] 本件文本零消费伤亡的灾害场面（第七节专项自检）\n- [x] 自造专名 2 个（清川河、临江圩），余量 1\n- [x] hot 档四硬规则在基线稿达标情况如实计量（不粉饰基线——缺口即对照证据）\n- [x] 基线诚实缺口 B1-B13 全部标注归属监管位（强度类 → 总编；合规类 → 监理）\n- [x] 无 git 操作、未读取 _archive\n- [x] 待办移交：前三集 A/B 三列计量值由爽版正稿回填后并表报 R3 门\n\n*依据：flows/topic-selection flow.json `baseline` 节点；kb/aesthetic/style-routes（route 声明协议）；kb/aesthetic/oversight（A/B 基线纪律）；kb/aesthetic/pacing-density（hot 档计量口径）；选题分析报告·约束移交单 C1-C10；梗卡@2026-09-16；热点素材@2026-09-16。本件为内部过程物件，不随对外交付输出。*\n", "选题方案.md": "# 选题方案：《守堤人》（水利题材 · 拒签老总工 · 实事男频爽剧）\n\n- 项目：p-ts-001（水利题材 · 守堤人）\n- 剖面：scene-screenwriter（选题编剧）· S3 全量爽版正稿（route=hot，监管位全开：总编强度 × 监理合规）\n- 生成日期：2026-09-16\n- 输入件：skills/topic-proposal.md（五节结构，顺序固定）；故事框架案.md（**结构宪法**：五宏节点 / 汛期三圈钟 / 三层反派 / 两提案复核位）；选题分析报告.md 第五节「创作约束移交单」C1-C10（硬约束，逐条遵守不讨论）；选题方案-爽版-基线.md（B 组对照件，同源骨架）；梗卡.md；热点素材.md\n- 同源声明：核心 5 人人设、「拒签蓄力 × 洪峰当众验证」新变体、伤亡红线三则、五宏节点集域（E1-12 / E20-24 / E33-48 / E49-56 / E57-60）、两提案复核位，全部与结构宪法同源；基线的 5 处显式修订（表 2.0-A）在本文按修订后状态执行\n- 禁读声明：本批未读取 projects/_archive/ 下任何内容；未做任何 git 操作\n\n---\n\n## 一、选题\n\n**选题名**：《守堤人》。封面标题（口语化、有冲突感）：**「全项目部都在签字，只有他不签」**；备用封面标题：「这单我不签」。\n\n**一句话定位**：大堤除险加固验收在即，全项目部只有 58 岁的老总工一个人不肯签字；后来，洪水替他验了一张没人敢验的收据。\n\n**时代情绪锚**（当下社会情绪 + 30 天内证据）：\n\n> **较真者的憋屈 × 汛期防洪焦虑**——认真的人在系统性糊弄面前孤军奋战，而堤的那头是千家万户的身家性命。\n\n- 底层情绪（普适长期）：「会干的不如会混的」——每个观众身边都有一个「不肯签字的老工程师」和一个「签得飞快的人」。\n- 顶层焦虑（实时）：汛期未过，「堤里有没有猫腻」的愤怒是进行时。证据：2026 全国「质量月」25 部门联合部署、严查偷工减料弄虚作假〔A 级，2026-09-04〕；台风「沙德尔」登陆、最高级别洪水应急响应启动〔A 级，2026-09-03〕；8 月中旬河南某县堤防决口与封堵的全民围观长尾〔B 级，2026-08-13〕。\n- 合规注：真实灾害只作情绪举证，剧内事件独立成案（虚构的临江圩除险加固工程），零对应、零影射、零伤亡消费；剧内台风一律无名（只称「台风」「上游雨带」）。\n\n**新意装置**：**拒签单 × 洪峰当众验证**——「他没打赢任何人，是洪水替他赢了」。装置改变的具体写法：\n\n- 清算执行者由主角的嘴置换为水位：他只负责留痕，宣判交给洪水。改变 E10 的写法——验收会死局（他被反咬立案、被「请」出会议室）不由他自辩，由雨后第一轮涨水在管涌现场替他对数；改变 E53 的写法——终局反转不是反转人，是同一水位把同一条堤分成两半（一堤两制）；改变 E58 的写法——清算名单不用查，就是他自己重抄的那一摞拒签单，一页对一段，逐页念。\n- 金手指 = 权力型制度身份（签字权 / 复审权 / 终身责任制条款），每次使用带成本：拒签一次，岗级掉一层。爽点一律锚「拒签 × 洪峰验证」机制，零财富皮。\n\n**核心爽点承诺**（一句话）：看一个被全项目部孤立的老头靠一张一张「不签」活到最后，看洪水把他签过的和没签的堤段当场分成两半——**他写下的每一页，都会回来收账。**\n\n**开篇 3 秒设计**（第一拍具体画面与台词）：\n\n验收会议室长桌俯拍，签到笔沿十几只手传递、逐个落名，签得最快的是监理负责人；笔传到秦江海手里——停。特写：笔帽在图纸桩号上敲三下。他念桩号不看人：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」全场回头，笔悬在半空。\n\n- 反常（唯一不签的人）+ 冲突（当众拦验收）占全，零铺垫、零背景交代。\n- 生理测试：没看过背景的人听完这拍不问「为什么」，只问「然后呢」——过。\n\n---\n\n## 二、人设\n\n核心 5 人 + 扩展 2 人（有名有姓合计 7 ≤ 10；雷小雨与秦江海为纯师徒 / 同事线，**零感情线，显式声明**）。外形全部写到「AI 出图能画」的记忆点精度。\n\n### 2.1 核心 5 人\n\n| 角色 | 姓名 / 年龄 / 身份 / 外形记忆点 | 反差立柱（外在 vs 内在拧着写） | 核心动机 | 口癖 / 标志小动作 |\n| --- | --- | --- | --- | --- |\n| 男主 | **秦江海 · 58 · 临江圩除险加固项目部总工程师**。藏蓝旧工装洗得发白；左胸口袋别两支笔（一支写字，一支只画水位线——师父遗物）；胶底鞋；后腰钥匙串挂一把老钢卷尺；左胸口袋上方一枚褪色劳模奖章（E1 特写，提前半拍亮身份） | 开会最没存在感，堤上声音最大；被全场孤立却像视察自家菜地 | 三十年前同一条河上，师父没拦住的那座坝——验收单被「先签后补」，26 岁的资料员秦江海亲手把补签页送进了流程。他的私罪。每一张拒签单都是重写当年那张单 | 「这单我不签。」／说话前笔帽敲图纸三下；巡堤时耳朵贴堤听水 |\n| 反派一 | **马长贵 · 45 · 施工方负责人（剧内自造主体）**。皮鞋上工地，手机大音量外放，办公桌腿垫着酒箱 | 对上点头哈腰递烟，对工人横眉瞪眼 | 垫资垫到抵押了房子，必须赶在汛期前验收回款——他也在跟汛期赛跑（有理由的错误选择） | 「规矩是死的，人是活的。」／说话先递烟 |\n| 反派二 | **冯有德 · 50 · 项目部上级（赶工期要签字的）**。衬衫扣到最顶一颗，文件夹永远抱在胸前当盾牌 | 不贪一分钱，但怕担一分责；嗓门越轻的事他越躲 | 「集体的决定」——把个人责任稀释成集体责任，稀释完就安全了 | 「再研究研究。」／签字前先看左右 |\n| 徒弟 | **雷小雨 · 26 · 测绘员**。反光背心；黄色安全帽上手绘一圈警戒红线胶带，帽带永远不扣；全站仪当拐杖拄 | 全项目部最年轻的人，却是最「多事」的人——唯一公开站在老头一边 | 她信数据不信酒桌；签了的字要背一辈子，她不想背 | 「图纸上没有这个数。」／拿全站仪拦门、点地 |\n| 复审方 | **贺工 · 60 · 复核组老专家**。旧夹克，布鞋，手里始终捏着一个掉漆保温杯 | 退居二线说话没人当回事，一出手就是终审 | 退休前最后一趟，想把当年的糊涂账算清 | 「我看看。」／保温杯拧开又拧上 |\n\n### 2.2 扩展 2 人（非核心，服务反派第三层与证人线）\n\n| 角色 | 设定 | 功能 |\n| --- | --- | --- |\n| 桂守成 · 44 · 监理负责人 | 头发梳得一丝不乱，笔永远别在胸袋，从不违反任何一条程序 | **反派第三层「做流程的」在项目部内的面孔**：先签后补的发源地、退件流程墙、销项程序的启动者；E1 开场签到笔传得最快的人。口癖「按程序办。」 |\n| 老周 · 55 · 马长贵班组料工 | 满手老茧，见谁都递烟，帽檐压得低 | 夜施内情证人：口证（E17-18）→ 书面交底被辞（E33）→ 暗续日志（E46）→ 问责会作证（E58）。口癖「我就路过。」 |\n\n师父（三十年前）不登场不具名，仅存于遗物（那支只画水位线的笔）与 ≤3 次限拍闪回（每次 ≤3 拍，只置大卡点前夜，只拍雨夜背影与遗物，零灾情画面）。\n\n---\n\n## 三、冲突设计\n\n**韩剧强度基准自检**（对标近 3 年复仇 / 豪门剧的情绪浓度）：\n\n- **情绪直接饱满**：不写克制隐忍。三槽引擎保证每集 ≥3 个外化爆点——台词槽（拒签三要素金句）、对撞槽（四件套施压 → 物证回击）、碎片槽（身份碎片 / 物证特写 / 水位 tick）。长剧把「较真者被碾碎」拍三集才给一次反击，本剧受辱与第一击回敬同场完成。\n- **反杀当场化**：羞辱与回敬时差 ≤2 拍（E3 为范式：撕稿 →「撕吧，每一页我都抄了三份」= 时差 1 拍）；大胜留给集尾卡点。\n- **金手指 = 权力型身份**：兑现画面是可拍的权力动作——水位线对照、联签单作废、责任状落笔、执业资格吊销、刻名碑，不是「证明自己是对的」。\n- **反派连坐**：恶人是一张签字链，拆解有顺序有仪式（返工自费 → 吊证移送 → 逐页拆签名 → 审计封条）。\n\n**主线冲突（一句话）**：不肯签字的老总工要在洪峰到来之前，拦住一整条想把问题堤段「合法签收」的签字链。\n\n**单元冲突模板（可无限复制）**：「**一张验收单 = 一次攻防**」——反派用四件套之一施压（先签后补稀释责任 / 隐蔽工程不留影像 / 拿防汛窗口期压质量 / 把提问题的人调岗边缘化）→ 秦江海用物证或制度条文回击（芯样、渗压记录、水位线、责任条款）→ 集尾卡点收。可复制原因：分部工程天然逐项验收，一张单 = 一集节拍；变量池 = 反派四件套 × 验证物 5 种（钻芯样 / 渗压读数 / 留样标记 / 水情日志 / 水位刻度），4×5=20 个变量，60 集不重样；全部攻防装进三景（验收会议室 / 堤段工地含汛期堤坡与堤头闸房 / 项目部办公区含资料室仓库角），换景 = 换集。\n\n**反派梯度（三层，逐级升格——「把偷工减料做成流程的人」）**：\n\n| 层 | 角色 | 作恶形态（流程感） | 亮层时刻 | 对立统一（立场各自成立） |\n| --- | --- | --- | --- | --- |\n| 一 · 动手的 | 马长贵 | 偷工减料、夜施换料、隐蔽工程不留影像 | E1-E18 | 房子抵了，汛期前必须回款——他也在跟汛期赛跑 |\n| 二 · 签字的 | 冯有德 | 先签后补稀释责任、调岗排异、拿防汛窗口期压质量 | E19-E42 | 不贪，但怕担责——稀释是他自保的理性选择 |\n| 三 · 做流程的 | 桂守成（围标链项目部内面孔） | 把验收做成流水线：退件程序墙、销项程序吃证据、资料一条龙、连水情台账都做过手 | E6 暗起 → E30 掌权 → E36 现形 → E42 实锤 | 从不违反任何一条程序——他的每一步都「合规」，这正是全剧要钉死的东西 |\n\n升级逻辑：从「驳你的数据」到「撕你的底稿」到「吃你的证据」到「调你的人」——反派每次升级都是对主角上一招的**学习适应**，无复读；全剧零真实机构名、零真实责任人（围标链剧内通称「一条龙」）。\n\n**冲突密度表**（每 6-10 集一个单元闭环 × 爆点分布 × 沙漠预扫 × 垫场）：\n\n| 单元闭环 | 集域 | 单元冲突 | 单元内中型爽点（垫场） | 大卡点 |\n| --- | --- | --- | --- | --- |\n| 拒签连环 | E1-8 | 全员签他独拒签 → 孤立、撕稿、反咬立案 | E3 小验证验料 / E5 渗压留痕反击 | — |\n| 首卡验证 | E9-12 | 听证死局 → 管涌现场当众对数 | E10 自证+验证双爽 / E12 一堤两制点题 | **E10 首卡** |\n| 四件套轮换 | E13-19 | 一张验收单一次攻防（模板开轮） | E16 标高对赌打脸 / E18 听堤教学 | — |\n| 调岗闸房 | E20-24 | 夺章发配 → 被发配到全剧钟楼 | E24 小洪峰预判兑现 | **E20** |\n| 抽检开膛 | E25-32 | 换样现行、诱签收口、开膛见假被销项 | E27 换样抓现行 / E30 中点改写 | **E30（中点）** |\n| 取证总装 | E33-40 | 举报石沉大海、笔迹比对、病历本并册 | E33 老周交底 / E38 表彰会摁停 | **E35** |\n| 围标蓄满 | E41-48 | 调包日志、签名会、停职收钥匙 | E42 存档副本救证 / E46 微反击 | **E43** |\n| 洪峰验证 | E49-56 | 危机选择、病历本变部署图、一堤两制终验 | E51-52 抢险兑现 / E53 主反转 | **E50（决战）** |\n| 问责清算 | E57-60 | 连坐清算、刻名碑、「这单我签」 | E58 逐页念 / E59 刻名 | **E58（终局）** |\n\n- 沙漠段检查：无连续 5 集无爆点段位；两大卡点之间中型爽点 ≥2（E33-40 文戏密段以 E33/E38 双垫场+大卡点 E35 压住；E44-48 低谷段以 E46 微反击+证据总装防丧）。\n- 「看得见的水」预扫（每三集一次实体水，任意缺口 ≤2 集）：E1 雷/水面、E3 夜雨、E5 渗水、E9-10 雨/管涌、E12 分屏、E14 水样、E16 堤前水面、E18 听堤、E20 雨中收章、E22 闸下出流、E23-24 台账雨情/小洪峰、E25 水样、E29 坑底渗水、E32 调度令/闸、E35 暴雨、E37 雨带、E38 场外暴雨、E39 出流声、E41-E60 全水段。✓\n\n**付费卡点事件表**（首卡第 8-12 集 + 后续每 15-20 集大卡点，全部写具体事件）：\n\n| 站位 | 集 | 具体事件（谁在哪对谁做了什么） | 类型 |\n| --- | --- | --- | --- |\n| **首卡（付费墙）** | **E10 末** | 管涌现场：他被反咬「泄露」的数据与实测分毫不差，反咬信当众反转；集末马长贵冷笑「六处险工段，你拦得住这一处吗」——水位刻度爬升特写 | 事件型 |\n| 大卡点 1 | E20 | 会议室宣布收章调岗，雨靴挂上仓库钥匙串，「老师傅也被整顿了」 | 情绪型 |\n| 大卡点 2（中点） | E30 | 开膛见假齿墙，桂守成当场启动应急处置：回填、重新取样、资料补齐销项——铁证被流程吃掉 | 信息+情绪型 |\n| 大卡点 3 | E35 | 举报被驳回，驳回依据正是 E30 销项文书；贺工保温杯拧开：「我看看。」 | 信息型 |\n| 大卡点 4 | E43 | 「集体决定」扩大化签名会，冯有德每一页都签——把「集体」钉成「个人合集」 | 信息型 |\n| 决战 | E50 | 调度令与台账矛盾爆发，他以终身责任签下迟开闸 4 小时错峰责任状——说了一辈子「这单我不签」，这一次一个字没说 | 情绪型顶点 |\n| 终局 | E58 | 问责会：一摞重抄拒签单，一页对一段逐页念——拒签清单 = 清算名单 | 兑现型 |\n\n**连坐清算顺序**（E57-E59，可见可数，按签字链还原倒序）：\n\n1. **马长贵（动手层）**：出险段落按联签自证 → 返工自费、押金抵赔、行业禁入——他的房已经抵了，代价可数。\n2. **桂守成（流程层）**：先签后补页时间戳 × 闸房水情日志雨情时标对撞 + 雷小雨存档副本 → 执业资格吊销、移送调查；终身责任制条款亮出，当场「已老实」〔梗14〕。\n3. **冯有德（签字层）**：联签单逐页拆解——「集体决定」被还原为一页页个人签名，每页对应他签掉的具体部位；收尾台词对立统一不破功：「我以为把名字签在一起，就没人淹死了。」\n4. **围标链（分饼层）**：审计进场封资料——只拍封条动作，留白不展开司法戏。\n5. **秦江海自请连责**：对「没拦成的那一处」自请处分（不揽功不诿责），核为其调岗期间无签权——尊严刻度。\n\n清算物件对位：拒签单（E58 逐页念）/ 水位线对照（E53 分屏 + E57 清单）/ 竣工永久性标牌刻名（E59）/ 雨靴（E58 防水袋底单交档）——4 件全给，≥2 件标准。\n\n---\n\n## 四、大纲（三段式，名场面具体到画面）\n\n### 前期（E1-30）：拒签立状 → 首卡验证 → 调岗闸房 → 开膛销项\n\n- **E1-8 拒签连环**：E1 开标会全员签字他独拒签（出击三要素：部位+缺陷+要求），集尾贴堤听水 + 分界桩两侧同框（一堤两制露脸）+ 雷声第一响（全剧钟上弦）。E2 办公桌被搬进档案室，「我不要你觉得」×「水不要你觉得」。E3 夜查手电钉车，「这方混凝土，保熟吗？」当场验料小赢；次日会冯有德当众撕他私留的检测底稿（存档联流程上撕不掉·伏）——他当拍回击「每一页我都抄了三份」，集尾雨中把碎纸捡进雨靴。E8 复审组进场，第一份立案的是反咬信——受辱升级为受冤，资料权限被收；贺工保温杯拧开又拧上（背景板首现）。\n- **E9-12 首卡**：E9 听证式验收会把他「请」出会议室，隔门一句「数据是真的，水会来对」。E10 雨后第一轮涨水，马长贵堤段出管涌——现场对质，反咬信当众反转，自证+验证双爽；集末付费墙。E11 复工表彰，马长贵领「抢工期先进」（赢一场小的、输一局更大的）。E12 雨夜复核走堤，分界桩两侧浑水点密度差第一次被镜头明确分屏，贺工蹲下摸桩号：「我看看。」\n- **E13-19 单元攻防**：四件套第一轮轮换；「先签后补」补签页摆到他面前（E15）被出击式拒签；E16 贺工当场算塌年轻技术员的「合格」结论；E18 耳朵贴堤听水教学带徒，老周口述夜施内情不敢落名。\n- **E20-24 调岗闸房**：E20 「例行归档」调走拒签存档联、当众收章调岗（两级贬法第一步），雨靴挂上仓库钥匙串。E21 三天仓库后转发配堤头泄洪闸房——**对抗力量错误适应的起点：他们把发配地选成了全剧钟楼**。E23 他发现调度台账的库容参数对不上雨情（台账按「验收合格」的老资料编——围标链连水情都做过手），开始私下记《闸房水情日志》。E24 小洪峰预判：他提前 48 小时书面建议被弃，洪水如期，值班员按他留的备选方案度过——「水听他的」第一次预演。\n- **E25-30 抽检开膛**：E27 换样被抓现行（雷小雨留样标记），同集她发现自己名字已被夹进某分部联签校核页——**诱签陷阱收口【提案二·需 R2 复核位】**。E30 中点：附条件开挖只挖一处，坑底现出假齿墙——全场以为开膛=他赢，桂守成当场启动应急处置：回填、重新取样、资料补齐销项，铁证被流程吃掉。**故事模型自此改写（不是提高音量）**：他对贺工说——「挡不住了。往后我只做一件事——把每一处都写下来，等水来对账。」\n\n**名场面 A（E1 贴堤听水）**：谁=秦江海；在哪=验收会散场后的深夜堤坡（雨后）；对谁=对堤、对观众；做了什么=摘下安全帽，把耳朵贴在草皮上听水声，手按在桩号分界桩上；画面记忆点=58 岁老头侧脸贴地的剪影，身后一条黑兽般伏在夜色里的长堤，第一声雷在天边炸开。\n\n**名场面 B（E3 手电钉车·保熟吗）**：谁=秦江海；在哪=深夜堤坡卸料点；对谁=换料工头与熄了灯的卡车；做了什么=一束手电光钉住车头，蹲下抓一把新料捻开举到灯下；画面记忆点=光柱里悬浮的料粉 + 「这方混凝土，保熟吗？」。\n\n**名场面 C（E10 管涌对质）**：谁=秦江海 对 全场验收人员；在哪=雨后马长贵堤段管涌口；做了什么=把反咬信里「泄露」的渗压数据逐项对上现场实测；画面记忆点=管涌口翻浑水顶起碎石，两列数字在雨布上并排特写，念一个数，人群退半步。\n\n### 中期（E31-48）：取证总装 → 围标现形 → 蓄满待洪\n\n- **E31-40 取证总装**：雷小雨的校核页再被夹进销项附件（她被越捆越深）；E32 第一道泄洪调度令下达（空库迎峰【提案四·需 R2 复核位】），他读令发现预泄库容与台账矛盾；E33 老周书面交底夜施内情，当天被辞——证人代价；E34 实名举报换来「程序合规」受理回执（石沉大海开始）；E35 举报被驳回，依据正是 E30 销项文书，贺工把驳回卷宗留下；E36 退件批注笔迹与反咬信比对同源——桂守成浮出；E38 表彰会歌舞被雷小雨一句「堤还没验」摁停；E39 闸房清点：重抄底单、双份照片、渗压记录并册——**「堤段病历本」11 处成形**（桩号—缺陷—日期—要求一一对应）。\n- **E41-48 围标蓄满**：E41 台风生成、路径命中流域上游——抢工期与抢验收双钟同拨；E42 资料站调走闸房日志未遂，雷小雨的存档副本救证，「求锤得锤」，调包笔迹落到桂守成；E43 冯有德被推到前台开「集体决定」扩大化签名会（E58 逐页拆解在此上膛）；E44-45 停职审查、收闸房钥匙——钟楼被收走，他交出钥匙串，只留下雨靴；E46 雷小雨与老周暗续水情日志，贺工把病历本副本正式登记进复核卷（制度容器藏火种）；E48 复职令未下，他被「责令离堤」，把病历本誊清三份各归其位（贺工复核卷 / 闸房夹层 / 随身）：「等水来，这就是判词。」台风夜第一声雨——压抑蓄满。\n\n**名场面 D（E30 开膛销项）**：谁=桂守成；在哪=齿墙基坑边；对谁=全场与秦江海；做了什么=假齿墙断面前当众启动应急处置，一锹锹土把铁证埋回去；画面记忆点=坑底断面的偷工痕迹与回填土方同框，秦江海站在坑沿没有喊，只把图纸折好塞回怀里。\n\n### 终局（E49-60）：洪峰验证 → 问责清算\n\n- **E49-56 洪峰**：E49 一号洪峰编号，转移启动——只拍秩序（手电列队、沙袋传递、雨衣背影，零伤亡零呼救）；他冒雨折返堤上巡堤查险。E50 调度令开闸时刻与台账库容矛盾爆发：按令开闸=下游险工段雪上加霜，不开=闸体超限上游漫灌——互不兼容均有代价。他以终身责任签下**迟开闸 4 小时错峰**责任状：说了一辈子「这单我不签」，这一次一个字没说——笔帽敲三下，落笔（全剧唯一一次主动落笔）。E51-52 病历本变部署图：拒签记录=抢险地图，标记管涌群、预置沙袋、分流抢护——他的留痕第一次直接救人；贺工带复核组到场终审取证。E53 **全剧主反转·一堤两制终验**：同一水位下分屏，出险 8 处全部落在他记录的 11 处之内（另 3 处未出险，如实呈现质量是概率，禁天罚式精准巧合）；险情最重的一处，恰是当年异议被驳回、人被调岗没拦成的桩段——他的自责。E54 出险清单=签收清单（回旋镖）。E55 闸开错峰，洪峰过境，水位刻度由爬升转回落——全剧钟走完。E56 水退，雨靴在退水里浮起，他捞起来抱在怀里。\n- **E57-60 问责清算**：E57 问责会前夜，出险堤段清单与各段联签页并置，「施工队是临时的」甩锅被终身责任制条款当场钉死；E58 清算名单逐页念（连坐顺序见第三节）；E59 竣工永久性标牌：五方名字上碑——碑既刻功也刻债，他把重险桩段列为返工首位并自请连责；E60 复职令被他换成驻段质检申请（不写成励志逆袭），「**这单我签。**」——全剧唯一一次说出这句话；雷小雨接过钢卷尺；他再次贴堤听水。水面平静，刻度归零。\n\n**名场面 E（E50 无声落笔）**：谁=秦江海；在哪=闸房调度令前；对谁=对自己三十年；做了什么=笔帽敲三下，一个字没说，签下迟开闸 4 小时错峰责任状；画面记忆点=落笔瞬间闸下出流声炸响，开度表指针颤动。\n\n**名场面 F（E53 一堤两制终验）**：谁=洪峰（执行者）；在哪=同一条堤、同一水位；做了什么=水位线两侧干湿两色分屏，出险点位与他病历本的桩号一一重合；画面记忆点=病历本摊在堤防图上，一枚枚桩号钉子般压住出险标记。\n\n**名场面 G（E58 逐页念名单）**：谁=秦江海；在哪=问责会长桌；对谁=冯有德们；做了什么=把被撕后重抄的一摞拒签单推过桌面，一页对一段逐页念；画面记忆点=每念一页，长桌另一侧有一个人低下头去。\n\n---\n\n## 五、前三集初稿（分拍，B 拍三件套）\n\n> 规范：每集 9-12 拍、每拍 6-15 秒、单集 1-1.5 分钟（600-900 字剧本量）；每拍=【0-3秒】（仅各集首拍）/分镜/台词/表演/尾钩五件；每拍一个认知更新；受辱→回击 ≤2 拍；口癖每集 ≥1、前三集变奏 3 次；每集 ≥1 可独立切片梗点。\n\n### 第 1 集〈这单我不签〉（景一 验收会议室 → 景二 堤坡）\n\n本集主认知更新：全项目部只有他不签。切片梗点：扫地僧伏笔（奖章）＋独拒签。集末卡点：情绪型（雷声上弦）。\n\n- **拍1｜【0-3秒】拒签（约9秒）**\n  - 分镜：长桌俯拍，签到笔沿十几只手传递、逐个落名，监理桂守成的笔速最快；笔传到秦江海——停。特写：笔帽在图纸桩号上敲三下。\n  - 台词：秦江海（不看人，平静）：「3+820 到 3+960 段，堤身填筑压实度不合格，要求钻芯复检。**这单我不签。**」\n  - 表演：他念桩号像念了三十年；全场回头，别人的笔悬在半空；左胸口袋褪色劳模奖章入画一角。\n  - 尾钩：冯有德的文件夹「啪」按上桌面——他要做的第一件事，是让这个老头变成少数。\n- **拍2（约8秒）**\n  - 分镜：冯有德俯身压低声音；秦江海把堤身填筑页翻到折角处，推过去，指节敲在数字上。\n  - 台词：冯有德（低声）：「全签了，就差你。」／秦江海：「压实度不够，数字在这儿。要钻芯，钻给他们看。」\n  - 表演：冯有德眼珠先看左右再看纸（签字前先看左右的小动作首建）；秦江海坐着没动，声音不大，会议室却静。\n  - 尾钩：后排一声嗤笑——马长贵登场。\n- **拍3（约9秒）**\n  - 分镜：马长贵晃着车钥匙起哄，人群哄笑；雷小雨从人群挤进来，检测原始记录「啪」拍在桌上。\n  - 台词：马长贵：「老秦，你这是挡大家财路！」／雷小雨：「图纸上没有这个数，原始记录我念给大家听？」\n  - 表演：马长贵笑得越大，秦江海越平静；雷小雨帽带不扣、全站仪拄在手里，站定在老头身侧。\n  - 尾钩：哄笑卡在喉咙里——秦江海开口了。\n- **拍4（约10秒）**\n  - 分镜：缓推秦江海面部；特写左胸口袋褪色劳模奖章，随呼吸轻晃（身份碎片，提前半拍）。\n  - 台词：秦江海：「签了，我把三十年押给你；不签，下游几万人押给他们？」\n  - 表演：不喊、不拍桌，每个字都往下滑；马长贵脸上的笑一层层收干。\n  - 尾钩：冯有德举起手：「表决。」\n- **拍5（约9秒）**\n  - 分镜：手臂一片片举起，只他一双胶底鞋边的地面干净；联签单被推到秦江海面前，桂守成把笔搁在单子上，笔尖朝他。\n  - 台词：冯有德：「少数服从多数。」／桂守成（淡淡）：「程序上，就差这一笔了。」\n  - 表演：举手的人不看他，看桌面；秦江海看着那张单子，像看一样烫手的东西被人往怀里塞。\n  - 尾钩：他不接——他起身了。\n- **拍6（约8秒）**\n  - 分镜：秦江海把图纸折好收回文件夹，笔帽拧紧插回左胸口袋，拿起安全帽往外走；人群自动分开一条缝。\n  - 台词：秦江海（在门口停半步，不回头）：「堤修给水看的，不是修给举手看的。」\n  - 表演：背影出门，会议室死静两秒，随即嗡的一声炸开议论。\n  - 尾钩：马长贵冲他背影扬声撂话——\n- **拍7（约8秒）**\n  - 分镜：走廊，马长贵追上来塞烟，皮鞋踩在工地泥地上咯吱作响。\n  - 台词：马长贵：「老秦，是你的章硬，还是我的路子硬？」／秦江海（把烟原样插回他胸袋）：「汛期会替我试。」\n  - 表演：马长贵笑容僵住；秦江海走出楼门，天色阴沉。\n  - 尾钩：他没回宿舍，拐上了大堤。\n- **拍8（约11秒）**\n  - 分镜：暮色堤坡，雨后初晴，河水暗涌；秦江海摘下安全帽，侧身把耳朵贴在草皮上听水——**名场面①海报级**。\n  - 台词：（无台词，只有水声一层层近。）\n  - 表演：一只手按住草皮，眉头从松到紧；远处水面一道暗纹推近。\n  - 尾钩：他顺着堤走到一根桩号碑前——\n- **拍9（约10秒）**\n  - 分镜：手指划过分界桩刻字：桩号 3+960。镜头左右摇：一侧坡面(new填筑)扎实色深，另一侧草皮下水渍成片——**一堤两制第一集露脸**（他拒签的段与别人签收的段第一次同框）。\n  - 台词：秦江海（对堤，像对故人）：「老伙计，他们把你签出去了。」\n  - 表演：手指在桩号上停了很久。\n  - 尾钩：天边一声闷雷——\n- **拍10｜集末卡点·情绪型（约9秒）**\n  - 分镜：乌云压着河面推过来，雷声滚过堤顶；大远景：一条长堤、一个老头的剪影。字幕卡：汛期第一天。\n  - 台词：秦江海（抬头看天，轻声）：「要来水了。」\n  - 表演：他不躲雨，反而往堤上又走了一步。\n  - 尾钩（下集钩）：这一张没人敢接的拒签单，能挂到水来吗？\n\n**本集体检**：爆点 5（独拒签反常钩 / 对撞拍记录 / 金句变奏①+奖章 / 贴堤听水名场面+一堤两制同框 / 雷声上弦）；口癖 1 次＋变奏①；水 ✓（河面、听水、雷雨）；卡点体检——观众必须看下一集，因为拒签单刚被表决围攻、雷已响，他的「不签」挂不挂得住、水几时来，两问都未答。\n\n### 第 2 集〈水不要你觉得〉（景三 项目部办公区·档案室）\n\n本集主认知更新：他们要的不是他签字，是他消失。切片梗点：「我不要你觉得」×「水不要你觉得」。集末卡点：情绪型（钢卷尺）。\n\n- **拍1｜【0-3秒】摘牌（约8秒）**\n  - 分镜：两个工人抬着办公桌穿过走廊，桌上图纸滑到地；「总工程师」门牌被一把摘下；桌子落位——档案室角落，正对整墙旧临江圩地形图。\n  - 台词：工人甲（嘟囔）：「秦总工，先在这儿委屈委屈。」\n  - 表演：秦江海进门看了一眼位置，先扶正桌角，再捡图纸——像搬家的是别人。\n  - 尾钩：门口有人鼓了两下掌——冯有德来了。\n- **拍2（约9秒）**\n  - 分镜：冯有德抱文件夹立在门口，一沓联签单甩在桌角，单子散开。\n  - 台词：冯有德：「签个字，大家都省事。我不要你觉得，我要你觉得。」\n  - 表演：他说话时眼睛看墙上的地形图，不看人（心虚）。\n  - 尾钩：秦江海拿起了那支只画水位线的笔——\n- **拍3（约9秒）**\n  - 分镜：秦江海转身面向地形图，沿着图上历史洪水位线缓缓描一道，笔尖不抖。\n  - 台词：秦江海（头也不回）：「**水不要你觉得。**」\n  - 表演：描完笔停，回头只看冯有德一眼；冯有德喉结动了一下。\n  - 尾钩：走廊传来脚步与递烟的笑——马长贵带人堵门。\n- **拍4（约9秒）**\n  - 分镜：档案室门口挤满人，烟一根根从门缝递进来；马长贵倚门框。\n  - 台词：马长贵：「老秦，规矩是死的，人是活的。这页你签了，下面几十号人跟你吃肉。」\n  - 表演：递烟的手排成一小排；秦江海一根一根原样插回烟盒，动作不快不慢。\n  - 尾钩：人群里有人不耐烦要进门——一只全站仪横了过来。\n- **拍5（约9秒）**\n  - 分镜：雷小雨拄着全站仪挤进门，侧身横在桌前，帽带晃着不扣。\n  - 台词：雷小雨：「这页对应的桩号，图纸上没有这个数。谁签，谁背一辈子。」\n  - 表演：年轻姑娘声音发紧但脚不退；马长贵上下打量她，冷笑。\n  - 尾钩：马长贵刚要开口，冯有德先软了——\n- **拍6（约8秒）**\n  - 分镜：冯有德把联签单收回文件夹（盾牌抱回胸前），边退边说。\n  - 台词：冯有德：「再研究研究。……对了，复审组下周进场，你自己掂量。」（信息钩·伏 E8）\n  - 表演：退到门口顿了半步，像想补一句狠话，终究没说。\n  - 尾钩：人散尽，档案室只剩秦江海一个人。\n- **拍7（约10秒）**\n  - 分镜：秦江海从铁皮柜底拖出一双旧雨靴，靴筒里抖出半包干土；他用袖口把靴面擦亮，摆在桌腿边（清算物件·雨靴首次亮相）。\n  - 台词：（无台词。）\n  - 表演：擦靴子的手势像在擦一块碑。\n  - 尾钩：他把联签单副本铺平在桌上——\n- **拍8（约9秒）**\n  - 分镜：特写钢卷尺钩住图纸桩号 3+820，尺带拉到 3+960，「咔」锁定。\n  - 台词：秦江海（对着空档案室，更狠）：「这一单，我还不签。」（口癖变奏②）\n  - 表演：说给空屋子听，比说给人听更硬。\n  - 尾钩：尺带在他掌心勒出一道白印——\n- **拍9（约9秒）**\n  - 分镜：钢卷尺「啪」拍在联签单副本上，纸角跳起。\n  - 台词：秦江海：「量堤可以。量人心，你们不够长。」\n  - 表演：说完才觉掌心疼，摊开看了一眼，笑了笑。\n  - 尾钩：窗外第一滴雨打在玻璃上——\n- **拍10｜集末卡点·情绪型（约9秒）**\n  - 分镜：镜头从档案室窗框推出：暮色里大堤横在雨雾尽头，像一条伏着的兽；窗玻璃上他描的那道水位线被雨痕接续往下淌。\n  - 台词：（无台词，雨声渐密。）\n  - 表演：秦江海背影坐进桌后，台灯亮起，他开始抄写什么（伏·「抄三份」）。\n  - 尾钩（下集钩）：复审组要来——可在那之前，堤上先来了不该在夜里出现的卡车。\n\n**本集体检**：爆点 5（摘牌反常 /「水不要你觉得」对撞 / 全站仪拦门 / 复审组风声信息钩 /「量人心不够长」+卷尺）；口癖变奏② ✓；水 tick ✓（描水位线+窗雨，实体水 E3 补足）；卡点体检——下一集必须看：夜里卡车干什么？他深夜在抄什么？\n\n### 第 3 集〈这方混凝土，保熟吗〉（景二 堤段工地·夜 → 景一 验收会议室）\n\n本集主认知更新：偷工实锤与受辱顶点同场对撞，他当场验了、当场被撕、当场回敬。切片梗点：「偷感」钉车＋「保熟吗」。集末卡点：情绪+信息型（捡碎纸）。\n\n- **拍1｜【0-3秒】钉车（约9秒）**\n  - 分镜：夜。堤坡黑影里一辆卡车熄灯倒车，几个人影扛着料袋往坡上挪——一道手电光「啪」钉住车头，光柱里料粉飞舞（「偷感」名场面开场）。\n  - 台词：秦江海（画外，声音不大）：「几点了，还在卸料。」\n  - 表演：光柱里所有人定格如标本；工头的笑僵在半张脸。\n  - 尾钩：工头小跑下来打圆场——\n- **拍2（约8秒）**\n  - 分镜：工头搓着手凑近，手电光柱从车头移到他脸上。\n  - 台词：工头：「秦总工，夜里凉，您回吧——这不是赶工期嘛。」\n  - 表演：挡在料袋前的身体语言比嘴诚实。\n  - 尾钩：秦江海没理他，径直蹲向新卸的料堆——\n- **拍3（约9秒）**\n  - 分镜：秦江海蹲下，抓一把料捻开，举到灯下；粗粝颗粒特写。\n  - 台词：秦江海：「**这方混凝土，保熟吗？**」（切片位）\n  - 表演：捻料的指法极专业，问话却像菜市场砍价——反差即笑点即寒点。\n  - 尾钩：工头张了张嘴——车门开了。\n- **拍4（约9秒）**\n  - 分镜：马长贵下车，皮鞋踩过泥水，张开手臂挡在料堆前。\n  - 台词：马长贵：「老秦！赶在汛期前完工，是为了大家。先垫层、后补强，图纸允许！」——（正确的理由干错误的事）\n  - 表演：声音抬得越高，眼睛越不看料堆。\n  - 尾钩：秦江海不接话，直起身朝堤顶喊——\n- **拍5（约8秒）**\n  - 分镜：堤顶探照灯亮，雷小雨背着快测仪一路小跑下来，现场支仪器、取样。\n  - 台词：秦江海：「小雨——取样。当着大家的面。」\n  - 表演：工人群像里有人下意识后退半步。\n  - 尾钩：仪器滴一声——数字出来了。\n- **拍6（约10秒）**\n  - 分镜：雷小雨举着记录板当众念，数字特写；手电光从四面八方聚拢到料堆（小验证·爽点）。\n  - 台词：雷小雨：「快测结果，低于设计标号。原始样我封了，双份！」\n  - 表演：群演倒吸凉气；工头看向马长贵；马长贵脸色挂不住，挥手让车开走。\n  - 尾钩：马长贵撂下一句——「明天验收会上说。」\n- **拍7（约9秒）**\n  - 分镜：次日，验收会议室（景一）。冯有德不提验料一个字，从文件夹抽出几页纸举高——秦江海私留的检测底稿。\n  - 台词：冯有德：「私留底稿、扰乱验收秩序。这种风气，必须刹。」\n  - 表演：他撕纸前先看左右（小动作复现）。\n  - 尾钩：纸，碎了。\n- **拍8（约9秒）**\n  - 分镜：碎纸飘落桌面；快速一闪：档案柜里拒签记录存档联完好归位（流程上撕不掉·伏笔特写半秒）。\n  - 台词：（撕纸声独占两秒，全场无声。）\n  - 表演：雷小雨猛地站起来被秦江海抬手按住；他盯着碎纸，眼皮都没眨。\n  - 尾钩：他开口了——当拍回击——\n- **拍9（约10秒）**\n  - 分镜：秦江海伸手接住一片碎纸，摊在掌心看了看，才抬眼扫过全场（受辱→回击时差 1 拍）。\n  - 台词：秦江海：「撕吧。这单我不签——**每一页我都抄了三份。**」（口癖变奏③+切片位）\n  - 表演：不怒、不抖，像宣布一个天气事实；冯有德握文件夹的手指节发白。\n  - 尾钩：桂守成低头在会议记录上写批注，笔迹特写一秒（伏·E36 笔迹比对）。\n- **拍10（约8秒）**\n  - 分镜：冯有德趁势合卷：「验料结果，另行核议。散会。」——检出来的假，被留在议程之外。\n  - 台词：雷小雨（低声）：「验了等于白验？」／秦江海：「不。他们欠了一笔，签了字就生利息。」\n  - 表演：人群退场时无人敢与他对视；马长贵在门口回头看了他一眼，眼神第一次发虚。\n  - 尾钩：散会，暴雨正好砸下来——\n- **拍11（约11秒）**\n  - 分镜：会场外雨幕。秦江海蹲在檐下，把撕碎的底稿一片、一片捡起来，抚平，塞进雨靴靴筒（清算物件·雨靴+「抄三份」双伏笔落位）。\n  - 台词：（无台词，只有雨声。）\n  - 表演：捡纸的手指被雨水泡白也不停；雷小雨撑伞站在他身后，没催。\n  - 尾钩：他站起身，望向河面——\n- **拍12｜集末卡点·情绪+信息型（约10秒）**\n  - 分镜：闪电照出大堤全长；雨顺安全帽檐往下灌成一道水帘。\n  - 台词：秦江海：「水位涨一格，你们就多欠我一页。」（雷声吞尾）\n  - 表演：他转身往堤上走，把捡满碎纸的雨靴拎在手里，像拎一份判决书草稿。\n  - 尾钩（下集钩）：复审组进场第一天，桌上立的第一份材料——是一封举报秦江海「泄露工程数据」的反咬信。\n\n**本集体检**：爆点 6（钉车反常钩 / 保熟吗 / 快测当众念 / 当拍回击抄三份 / 「另行核议」敌进一分 / 捡碎纸金句卡点）；口癖变奏③ ✓；受辱→回击时差 1 拍 ✓；水 ✓（夜雨、暴雨、雨靴）；小验证当场验料 ✓（R1 读者条件 1）；卡点体检——下一集必须看：反咬信从哪来？他抄的三份在哪、谁会看到？被「合法」放过的假堤段，涨水后先出事的会是哪一段？\n\n---\n\n## 六、监管自检与约束对账（A 组正稿附件）\n\n### 6.1 总编位四条自查\n\n- [x] **爆点对标制**：首卡 E10 与对标件同位爆点对位（死局→当场复原数据 ⇄ 听证死局→管涌现场当场对数），强度不降；每集爆点见第五节各集体检栏与第三节密度表。\n- [x] **钩子生理测试**：开篇 3 秒 = 独拒签反常+冲突（第一节「开篇 3 秒设计」），零铺垫。\n- [x] **名场面可视化**：名场面 A-G 均按「谁 / 在哪 / 对谁 / 做了什么 / 画面记忆点」五要素写成，可直接当分镜需求。\n- [x] **全剧爆点分布图**：第三节密度表逐单元标注爆点与垫场；无连续 5 集无爆点段；两大卡点间中型爽点 ≥2。\n\n### 6.2 A/B 计量回填（报 R3 门，与基线并表）\n\n| 计量列 | 基线值（B 组） | 本稿值（A 组） |\n| --- | --- | --- |\n| 前三集爆点计数 | 2 / 集 | E1=5，E2=5，E3=6 |\n| 口癖变奏（前三集） | 1 次 | 3 次（变奏① E1 拍4 / ② E2 拍8 / ③ E3 拍9） |\n| 受辱→回击时差 | E3 隔 3 拍 | E3 同场 1 拍（拍8→拍9） |\n| 前三集分拍粒度 | 每集 5 拍大纲级要点 | 每集 10/10/12 拍，拍级五件套齐 |\n\n### 6.3 监理位·约束移交单 C1-C10 逐条对账\n\n| 条 | 落实 | 判 |\n| --- | --- | --- |\n| C1 | CN 竖屏付费口径；男频实事爽剧；尊严刻度贯穿（终局驻段质检非高升复职） | ✓ |\n| C2 | 60 集 × 1-1.5 分钟 × 单集 ≤1200 字；前三集每拍 6-15 秒、每集 9-12 拍 | ✓ |\n| C3 | 主场景 3（验收会议室 / 堤段工地含堤坡闸房 / 项目部办公区含资料室仓库角）；有名有姓 7；核心 5 | ✓ |\n| C4 | ①零架空术语（终身责任制/空库调度皆公共语汇，验证动作全部画面化）②零重生先知（全靠事前留痕）③零团宠/真假千金/强爱情线（雷小雨纯师徒，显式声明）④零财富皮⑤零多层马甲（E58 物件式单点揭示）⑥三分钟测试过（E1 拍1-2 三身份齐亮相） | ✓ |\n| C5 | 全稿零真实机构名/责任人（项目部/复核组/监理/上级单位皆通称，围标链称「一条龙」）；自造专名 2（清川河、临江圩，余量 1），前三章 ≤2（临江圩、清川河，均地名类）；真实灾害只作情绪举证；零伤亡消费；不喊口号；落点问责与守护 | ✓ |\n| C6 | 首卡 E10 当众验证（8-12 窗内）；E1 独拒签 / E2 施压对撞 / E3 夜查受辱顶点+集尾连本带利伏笔 | ✓ |\n| C7 | 主锚「较真者的憋屈 × 汛期防洪焦虑」；三圈戏剧钟（气象/调度/水位）；四件套轮换；因果可归因（11 处记录-8 处出险-3 处未出险）；主角主动性（拒签三要素出击；洪峰三动作：折返巡堤/责任状/病历本部署） | ✓ |\n| C8 | 每集 ≥1 切片梗点（E1 独拒签+奖章 / E2 水不要你觉得 / E3 保熟吗+偷感）；口癖每集 ≥1、3 集 3 变奏；16 条热梗全量挂接按结构宪法 7.5 表执行 | ✓ |\n| C9 | 清算可见可数：拒签单/水位线对照/刻名碑+雨靴（4 件）；E10 强度对标同位爆点 | ✓ |\n| C10 | 设定来源声明：实事新闻做底子（终身责任制+国债除险加固+汛期问责+病险水库主汛期空库运行，C 级可核实）；大白话标题检验过（「大堤除险加固验收在即，全项目部只有老工程师一个人不肯签字」） | ✓ |\n\n### 6.4 R1/R2 门条件与两提案复核位\n\n- [x] R1 读者条件 1：E3 小验证（「保熟吗」当场验料，拍3-拍6）——受辱不连续铺满（E3 小赢、E5 留痕、E16/E24 垫场）。\n- [x] R1 读者条件 2：看得见的水每三集一次（第三节预扫表，任意缺口 ≤2 集）。\n- [x] R1 读者条件 3：一堤两制分屏 E1 露脸（拍9 分界桩同框）→ E12 点题 → E53 终验。\n- [x] **提案二「她的名字进了签字链」（诱签变体）**：已按结构宪法融入（E7 谈话伏 → E27 收口 → E31 加深 → E42 救证 → E58 作证）；**保留【需 R2 复核】标注**——变体未过四视角原判，控制线：雷小雨单集 ≤2 拍、每场服务该集唯一主认知更新；R1-B 原案（徒弟泄密者）不取，记录在案供 R3 对照。\n- [x] **提案四「空库令」调度钟**：已按结构宪法融入（E22 钟楼就位 → E32 首令 → E41 双钟同拨 → E50 危机总开关）；**保留【需 R2 复核】标注**——纪律：调度术语全部画面化（开度表/刻度/令单），禁台词讲解；剧内通称，不对应任何真实调度机构与真实调度事件。\n\n### 6.5 伤亡红线三则（全稿含名场面清单适用）\n\n1. **水的威力物证化**：水位刻度一格一格爬、管涌口翻浑水顶起碎石、坡面渗水、闸下出流、雨靴浮起——水的「大」用声音与刻度表达，零惨状。\n2. **人员镜头纪律**：转移安置只拍秩序与背影（手电列队、沙袋传递、雨衣背影）；全稿零遇难、零伤情特写、零呼救、零寻人启事道具；群演台词零伤亡内容。\n3. **零决口设计**：最大险情写到「出险抢护」级（管涌群、滑坡预兆）；E54 切片双关「这次塌的是真的」画面为出险渗漏抢护，非垮塌惨状；九八前史闪回只拍雨夜背影与遗物，零灾情画面、零指认真实工程。\n\n### 6.6 其他自检\n\n- [x] 可写性三问：人设记忆点 AI 出图可画（工装两笔一尺一靴一奖章/胶带安全帽/保温杯）；单元模板可换皮 20 次（四件套×5 验证物）；名场面 A-G 可直当分镜需求。\
