<style>
*{box-sizing:border-box}
:root{--diff-del-bg:rgba(122,72,46,.12);--diff-del-bd:#9a5b38;--diff-del-ink:#6e3f26;--diff-add-bg:rgba(63,109,74,.12);--diff-add-bd:#4a7a58;--diff-add-ink:#3f6d4a;--r-s:4px;--r-m:7px;--r-l:10px;--ctl-h:26px;--ctl-px:11px;--fs:1;

html[data-theme="ink"]{--diff-del-bg:rgba(205,128,96,.13);--diff-del-bd:#a06a4e;--diff-del-ink:#d89a76;--diff-add-bg:rgba(120,180,140,.11);--diff-add-bd:#5f9a74;--diff-add-ink:#8ec7a4;--bg-app:#171512;--bg-chrome:#201d18;--bg-stage:#1a1814;--dot:#2b2820;
  --bg-docpanel:#1e1b16;--bg-paper:#252119;--bg-ctl:#2c2820;--bg-node:#252119;
  --line:#3b362b;--line-node:#454035;--line-paper:#3b362b;
  --ink:#eae5d9;--ink-2:#cbc5b7;--ink-3:#8f8979;
  --bg-code:#332f26;--bg-cmt:#2e2a20;--bg-th:#2c2820;--bg-vbar:#2b2016;--accent:#c96a5c;color-scheme:dark}
html[data-theme="celadon"]{--diff-del-bg:rgba(150,80,60,.11);--diff-del-bd:#a06148;--diff-del-ink:#7e4330;--diff-add-bg:rgba(63,125,92,.13);--diff-add-bd:#3f7d5c;--diff-add-ink:#2f6248;--bg-app:#ecefec;--bg-chrome:#f8faf7;--bg-stage:#f0f3ee;--dot:#d9e0d6;
  --bg-docpanel:#e6ebe4;--bg-paper:#fbfdf9;--bg-ctl:#fff;--bg-node:#fbfdf9;
  --line:#ccd4cb;--line-node:#c3cdc2;--line-paper:#d5ddd2;
  --ink:#22271f;--ink-2:#454c42;--ink-3:#7d857a;
  --bg-code:#e8ede5;--bg-cmt:#eef3ea;--bg-th:#e9efe6;--bg-vbar:#eaf2ec;--accent:#3f7d5c}
:where(button,a,select,textarea,[tabindex]):focus-visible{outline:2px solid #a5433a;outline-offset:1px}
button,a,select,textarea{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){#docpanel .dh.flash{animation:none}*{transition:none!important}}
body{margin:0;height:100vh;display:flex;flex-direction:row;overflow:hidden;
     font-family:var(--font-ui);
     background:var(--bg-app);color:var(--ink)}
h1,.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
header{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:calc(15px*var(--fs,1));margin:0;font-weight:700;letter-spacing:1px;white-space:nowrap;flex-shrink:0;font-family:'Noto Serif SC','SimSun',serif}
header .brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(15px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
select#proj-switch{max-width:230px;text-overflow:ellipsis}
header .ver{font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap;flex-shrink:0}
header .sp{flex:1}
button.tb,a.tb{border:1px solid #c9c1b2;background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
button.tb:hover,a.tb:hover{border-color:#8a8375;background:#f3efe6}
#canvas-col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg-stage);
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:28px 28px}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
.edge-hit{pointer-events:stroke;cursor:pointer}
.edge-label{font-size:calc(10px*var(--fs,1));fill:#8a8375;pointer-events:none}
.stage-rule{stroke-width:1.2;stroke-dasharray:1,4}
.stage-name{font-size:calc(12.5px*var(--fs,1));font-weight:700}
.node{position:absolute;width:196px;background:var(--bg-node);border:1px solid var(--line-node);border-radius:var(--r-m);cursor:grab;user-select:none;
      box-shadow:0 1px 2px rgba(60,50,30,.06)}
/* 隐形点击热区：整图适配下节点缩得很小，热区外扩 6px 保证可点 */
.node::after{content:'';position:absolute;inset:-6px}
.node.sel{outline:2px solid #262420;outline-offset:1px}
.node .accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0}
.node .hd{display:flex;align-items:center;gap:7px;padding:8px 10px 2px}
.node .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node .zh{font-size:calc(13.5px*var(--fs,1));font-weight:700;line-height:1.25}
.node .sub{padding:2px 10px 4px;font-size:calc(10.5px*var(--fs,1));color:#8a8375;line-height:1.4}
.node .out{position:absolute;top:-9px;right:-8px;background:#fff;border:1.5px solid #a5433a;color:#a5433a;
           font-size:calc(10.5px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:2px}
.node .par{font-size:calc(10.5px*var(--fs,1));border:1px solid #b8a464;color:#8a6b2a;background:#fdf9ee;border-radius:var(--r-s);padding:0 5px;margin-left:6px}
.node.k-gate{background:#fbf5f3;border:1.5px solid #a5433a}
.node.k-gate .zh{color:#8c352c}
/* R5 · kit 边界验收：全流程唯一保留的人工裁决点。金色双线，与域内自动放行的门明确区分开 */
.node.k-boundary{background:#fdf8ec;border:3px double #b8a464}
.node.k-boundary .zh{color:#7a5c1e}
.node.k-boundary .accent{background:#b8a464!important}
.node.k-boundary .bdg{position:absolute;top:-10px;left:-8px;background:#fdf8ec;border:1.5px solid #b8a464;color:#7a5c1e;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:1px}
/* R5 · 指标徽章：效率（被下游消费/成本）与命中率（注入标尺被引用比例） */
.node .mbs{position:absolute;top:-10px;left:8px;display:flex;gap:3px;pointer-events:none}
.mb{display:inline-block;font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 5px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap;font-variant-numeric:tabular-nums}
.mb.good{border-color:#5a8a5e;color:#3d6b45;background:#f2f8f2}
.mb.warn{border-color:#c9922e;color:#8a6b2a;background:#fdf9ee}
.mb.bad{border-color:#a5433a;color:#8c352c;background:#fbf1f0}
/* R5 · 内容配置项旋钮表 */
.knobs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.knob{border:1px solid var(--line-paper);border-left:3px solid var(--line-paper);border-radius:var(--r-s);padding:7px 10px;background:var(--bg-paper)}
.knob.chg{border-left-color:var(--accent);background:#fffaf4}
html[data-theme="ink"] .knob.chg{background:#2b2419}
.knob .kn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob .kn-h code{font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink)}
.knob .kn-v{font-size:calc(12.5*var(--fs,1));color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.knob .kn-s{font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);margin-left:auto}
.knob .kn-s.src-overlay{border-color:var(--accent);color:var(--accent)}
.knob .kn-s.src-node{border-color:#c9922e;color:#8a6b2a}
.knob .kn-d{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);margin-top:3px;line-height:1.6}
.knob .kn-m{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;line-height:1.6}
.patched{font-family:ui-monospace,Consolas,monospace;font-size:calc(11.5px*var(--fs,1));background:var(--bg-code);
  border:1px solid var(--line-paper);border-radius:var(--r-s);padding:9px 11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.banner{margin:10px 22px 0;padding:9px 14px;border:1px solid var(--line-paper);border-left:3px solid #c9922e;border-radius:var(--r-s);
  background:#fdf9ee;color:#6b5a2a;font-size:calc(12px*var(--fs,1));line-height:1.7}
html[data-theme="ink"] .banner{background:#2a2418;color:#d9c88a}
.banner b{color:#8a6b2a}
html[data-theme="ink"] .banner b{color:#e0cd8f}
.st-done{background:#5a8a5e}.st-awaiting{background:#c9922e}.st-pending{background:#b05a4a}.st-none{background:#c9c1b2}
#hud{display:flex;gap:14px;font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#hud b{color:#3d382f}
#hud,#bottombar .zoom,.paper .doc-h,.paper .pf{font-variant-numeric:tabular-nums}
#docpanel{position:relative;width:min(44vw,780px);min-width:460px;border-left:1px solid var(--line);background:var(--bg-docpanel);display:flex;flex-direction:column}
#settings-pop{position:absolute;top:52px;right:10px;z-index:60;width:250px;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(40,32,16,.22);padding:12px 14px}
#settings-pop .set-cap{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin:8px 0 4px;letter-spacing:1px}

#settings-pop .set-opts button{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-s);padding:4px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
#settings-pop .set-opts button:hover{border-color:var(--accent)}
#settings-pop .set-opts button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ob{font-size:calc(11px*var(--fs,1));color:var(--ink-3);line-height:1.8;word-break:break-all}

#docpanel .dh{height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
#docpanel .bt{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
#docpanel .dh .bt:hover{border-color:#8a8375;background:#f3efe6}
#docpanel .dh b.dt{font-size:calc(15px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;letter-spacing:.5px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpanel .dh.flash{animation:dhflash .7s ease}
@keyframes dhflash{0%{background:#f0e4c4}100%{background:#fbfaf7}}
.chip{display:inline-block;font-size:calc(10.5px*var(--fs,1));border:1px solid #c9c1b2;border-radius:var(--r-s);padding:1px 7px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap}
#d-vbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--bg-vbar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#d-vbar:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 22px 46px}
.paper{background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;
       max-width:720px;margin:22px auto 0;padding:38px 52px 44px;position:relative}
.paper .doc-h{font-size:calc(11px*var(--fs,1));color:#a89a83;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.paper .doc-h span:last-child{flex-shrink:0}
.paper .pf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:calc(10.5px*var(--fs,1));color:#b3ab9b;letter-spacing:2px}
.cover{max-width:720px;margin:34px auto 0;background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;padding:52px 56px}
.cover h2{font-size:calc(26px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;margin:0 0 6px;letter-spacing:2px}
.cover .sub{color:#8a8375;font-size:calc(12.5px*var(--fs,1));margin-bottom:18px}
.shelf-cap{max-width:720px;margin:28px auto 6px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.shelf-row{display:flex;align-items:center;gap:10px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:10px 12px;cursor:pointer}
.wb-sel{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:6px 8px;color:var(--ink);font-size:calc(12.5px*var(--fs,1))}
.diff{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:calc(12px*var(--fs,1))}

.diff .add{background:var(--diff-add-bg);border-left:3px solid var(--diff-add-bd)}.diff .add::before{content:"+ ";color:var(--diff-add-ink);font-weight:700}
.diff .del{background:var(--diff-del-bg);border-left:3px solid var(--diff-del-bd)}.diff .del::before{content:"− ";color:var(--diff-del-ink);font-weight:700}

.diff .cw.del{background:var(--diff-del-bg);box-shadow:inset 0 0 0 1px var(--diff-del-bd);color:var(--diff-del-ink)}
.diff .cw.add{background:var(--diff-add-bg);box-shadow:inset 0 0 0 1px var(--diff-add-bd);color:var(--diff-add-ink)}
.diff-legend{display:flex;gap:14px;align-items:center;padding:4px 2px 10px;font-size:calc(11px*var(--fs,1));color:var(--ink-3)}

.diff-legend .lg.add{color:var(--diff-add-ink);font-weight:700}

.wb-bar input:focus{border-color:var(--accent)}

.wb-cap{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);letter-spacing:1px;margin:8px 0 2px;border-bottom:1px solid var(--line-paper);padding-bottom:3px}
.wb-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:4px;padding:8px 10px;cursor:pointer;min-height:52px}

.wb-card .m{margin-top:4px;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.draft{background:#8a6b2a}.dot.retired{background:#8c352c}.dot.other{background:#999}
       padding:12px 18px;max-width:720px;margin:8px auto;cursor:pointer;box-shadow:0 1px 6px rgba(70,58,35,.06)}
.shelf-row:hover{border-color:#a5433a}

.shelf-row .nm{flex:1;font-size:calc(13.5px*var(--fs,1));font-weight:600}
.shelf-row .go{font-size:calc(11.5px*var(--fs,1));color:#8a8375}

#d-stats{font-size:calc(11px*var(--fs,1));color:var(--ink-3);font-variant-numeric:tabular-nums}

     \"entries\": [\n        {\n          \"id\": \"foreshadow\",\n          \"title\": \"伏笔台账\",\n          \"file\": \"世界书/伏笔/台账.md\",\n          \"tags\": [\n            \"伏笔\",\n            \"回收\"\n          ],\n          \"status\": \"active\"\n        }\n      ]\n    },\n    {\n      \"id\": \"底牌\",\n      \"title\": \"暗线底牌（作者专用·永不入正文）\",\n      \"format\": \"text\",\n      \"file\": \"世界书/底牌/暗线底牌.md\",\n      \"entries\": [\n        {\n          \"id\": \"w-secret\",\n          \"title\": \"暗线底牌\",\n          \"file\": \"世界书/底牌/暗线底牌.md\",\n          \"tags\": [\n            \"暗线\",\n            \"底牌\",\n            \"禁止入正文\"\n          ],\n          \"status\": \"draft\"\n        }\n      ]\n    }\n  ]\n}", "世界书/人物/尖嘴哥.md": "---\nid: c-jianzui\ntitle: 尖嘴哥（消息贩子）\n类型: 次要配角\ntags: [配角, 传讯, 首单元反派外围]\nlinks: [w-sacrifice, c-chaosheng]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 尖嘴哥\n\n## 核心档案\n\n- 青礁聚落消息贩子：靠传讯石布告栏吃饭，谁给合成膏替谁说话\n- **要**：消息换口粮；**怕**：断粮；被吞链（他见过被吞空的人）\n- **首单元位**：抹黑流水线的分发端（被鲲崽首次「浅尝」）——吞链后跳反，认潮生当饭票\n- **功能位**：废土自媒体（传讯石直播/布告栏）；情报线（什么都能打听到的嘴）\n- **说话质感**：语速快、见风转舵、但守「消息贩子不造假源」的职业底线（造假源=砸自己饭碗）\n\n## 关系网\n\n- 陈潮生：从收膏黑手 → 饭票 → 编外军师\n- 疤脸：旧客户（首单元反目）\n\n## 当前状态\n\n- 第 3 章时点：被浅尝吞链一次（跳反）；转任海记编外军师+传讯石直播线人\n- 变动史：r3 首单元分发端→倒戈（U1-3/5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈大海.md": "---\nid: c-dahai\ntitle: 陈大海（父）\n类型: 主要配角\ntags: [家人, 肉祭, 雷贯臂, 旧罪]\nlinks: [w-sacrifice, c-chaosheng, f-haiji, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈大海\n\n## 核心档案\n\n- 海记食堂掌灶，潮生之父；**二十年前献过一只手**换「雷贯之臂」——为护住被抢货的伙计，也是全家唯一一次献祭\n- **要**：店活下去；儿子别走献祭的路\n- **怕**：儿子上献祭台；神殿的东西「碰了就还不完」\n- **卡**：一只手撑一个店；义肢是木头与旧零件拼的\n- **暗线位**：大断代元年替神殿贴过《献祭推广令》（贴一张免全家一年祭）——**他知道告示，告示不知道他**（w-secret 挂钩：金链看守=当年献祭台邻座）\n- **战斗位**：雷贯臂是全书前期唯一「正经战力」，关键时刻撑门面\n\n## 关系网\n\n- 陈潮生：儿子觉醒后，怕的对象从神殿变成了鱼\n- 铁饭勺：亡妻？不——是他老婆的家传；他不许任何人碰\n\n## 当前状态\n\n- 第 3 章时点：米缸藏鱼未遂（被儿子发现）；雷臂护院按住水军哥；怀里藏着半张撕下的告示（暗线 F-016）\n- 变动史：r3 觉醒礼旁观（U1-1）；夜藏鱼定调「是祸」（U1-1）；护院（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈母.md": "---\nid: c-mu\ntitle: 陈母\n类型: 主要配角\ntags: [家人, 铁饭勺, 管账]\nlinks: [c-chaosheng, f-haiji, c-kunzai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈母\n\n## 核心档案\n\n- 海记管账兼掌勺；**铁饭勺的主人**（鲲崽的哈内丝=她家传的勺）\n- **要**：儿子平安；账目分明\n- **怕**：家被人欺\n- **性格**：嘴硬心软，敢拼命；商业嗅觉全店第一（验毒宴直播/深潜套餐/回血套餐全是她的主意）\n- **功能位**：金句担当（「免费的才是最贵的」）；勺语的使用人；废土直播主播（传讯石验毒宴）\n\n## 关系网\n\n- 鲲崽：嘴上「这什么玩意儿」，手里给它留饭\n- 陈大海：拌嘴四十年，配合无间\n\n## 当前状态\n\n- 第 0 章时点：觉醒礼上端面，亲眼看见儿子的异能掉进自己面盆\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/陈潮生.md": "---\nid: c-chaosheng\ntitle: 陈潮生（主角）\n类型: 主角\ntags: [主角, 智祭, 海记, 黄三]\nlinks: [w-power, w-sacrifice, w-protagonist, c-kunzai, c-dahai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 陈潮生\n\n## 核心档案\n\n- **19 岁**，青礁聚落人，海记食堂独子；觉醒日获全聚落最丢人异能「饭勺鱼」（黄字叁号·辅兽型厨具类，诨名**黄三**）\n- **要**：守住海记食堂；攒元石给爸换义肢\n- **怕**：店倒；爸爸的献祭恶化；自己变成「先等链」的空壳\n- **卡**：穷（深潜一次=半年积蓄）；异能丢人\n- **能力**：吞三式（浅尝/鲸吞/饕餮，见 w-power）；勺语指挥（一长两短=吞）\n- **智祭暗病**：看链越多自己的链越短——「先等链」（第 15 章自觉/24 章加重/30 章落点）\n- **伦理红线**：只吞反派之链、同链不吞二次、不碰普通人（食灵=废土恶行）\n- **说话质感**：嘴笨但记性好；被笑不还嘴，回家记账\n\n## 关系网\n\n- 鲲崽：不能对爸妈说的秘密全倒给它；又爱又嫌\n- 陈大海：怕他，更怕他再上献祭台\n- 陈母：铁饭勺的主人，家的定海针\n\n## 当前状态（随章账滚动）\n\n- 第 3 章时点：已觉醒（吞三式之「浅尝」入门）；诨号未起（黄三在第 10 章）；验毒宴立名；伦理红线已演（第 4 章差点破戒→停手）；暗病未显\n- 变动史：r3 觉醒（U1-1）；首吞尖嘴哥链（U1-3）；放弃吞疤脸（U1-4 红线）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/人物/鲲崽.md": "---\nid: c-kunzai\ntitle: 鲲崽（北冥鲲君之崽）\n类型: 主要配角（神崽）\ntags: [神崽, 吞, 暗线, 饭勺]\nlinks: [w-protagonist, w-gods, w-secret, w-power]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 鲲崽\n\n## 核心档案\n\n- 蓝色、圆滚滚、懒——觉醒日被潮生认成饭勺；神讳**北冥鲲君**之崽（民间只叫大肥鱼）\n- **要**：干饭（合成膏吐掉，只吃真饭和怪——废土最后一个美食家）\n- **怕**：没饭；被问「免费的代价是什么」\n- **能力**：吞三式本体（浅尝/鲸吞/饕餮）；认勺语（妈妈的铁饭勺：一长两短=吞，急敲=回巢）\n- **神格**：慵懒抠搜白嫖成性；深潜全城最快；偶尔漏口风（**漏口风三规则**：松弛时漏/只漏脚注/漏完岔开）\n- **暗线位**：鲲君下在废土的「押金兼种子」（底牌 w-secret）；寄养凭据刻在铁饭勺柄（「北冥鲲君·养」，落款=大断代元年）\n- **成长四阶**：漂（现）→ 游 → 鲲 → 鹏（鲲鹏变）\n\n## 关系网\n\n- 陈潮生：饲主/秘密接收器/（它不承认的）家人\n- 北冥鲲君：父。四十年不上榜，一上榜就前十——崽在哪，它的算法就在哪\n\n## 当前状态\n\n- 第 3 章时点：寄养海记鱼筐；已显浅尝（吞链吐泡）与食性（拒合成膏）；月下睁眼（无眼白，圈圈蓝）\n- 变动史：r3 觉醒日掉面盆（U1-1）；吞征收令（U1-1）；吞尖嘴哥链吐「料」线索（U1-3）；对水军哥睁眼（U1-5）\n\n## 变动史\n\n- （章回交稿后结算追加）\n", "世界书/伏笔/台账.md": "# 伏笔台账\n\n> 状态机：open（已埋未收）→ paid（已回收）→ retired（取消）。每条：埋点章/内容/预定回收点。章回结算时更新；「到期未收」判沙漠段（episodic-webnovel 条款 3）。\n\n| fid | 内容 | 埋点 | 预定回收 | 状态 |\n| --- | --- | --- | --- | --- |\n| F-001 | 饭勺认错（器型：厨具？） | 第 1 章 | 变奏贯穿；第 30 章密录「疑似炊具待考」收口 | open（已变奏 2/7） |\n| F-002 | 鱼吞征收令（冒犯神殿） | 第 1 章 | 第 2-3 章聚落反应 + 神殿记仇线 | open |\n| F-003 | 「东头的膏，别吃」预言应验 | 第 1 章末 | 第 2 章已应验；第 5 章道谢线 | paid（半：东头谢意未写） |\n| F-004 | 鲲崽吐「巢」字 | 第 5 章末（N1） | 第 26 章「寄养凭据」/第 25 章「回家」 | open |\n| F-005 | 大肥鱼四十年零登记 | 第 10 章末（N2） | 第 22 章免缴令 + 第 26 章寄养凭据 | open |\n| F-006 | 契约小字「daily 浮动采样」 | 第 15 章末（N3） | 第 25 章暗病加重 + 第 30 章主题句 | open |\n| F-007 | 殿后退件山（收了又退的器官） | 第 16-20 章（N4） | 第 29 章野崽来历 + 第 2 卷殿后线 | open |\n| F-008 | 鲲君弃子传说 | 第 23-25 章末（N5） | 第 26-27 章寄养凭据+推广令 | open |\n| F-009 | 《献祭推广令》「智能免税」+诸神闭殿签字 | 第 27 章（N6） | 第 30 章卷末双押；长线至终局 | open |\n| F-010 | 金链看守放行「这不算你的事」 | 第 18-19 章 | 第 2 卷金链看守身份（爸爸旧识） | open |\n| F-011 | 潮生暗病「先等链」 | 第 15 章自觉 | 第 24 章加重 → 第 30 章主题落点 | open |\n| F-012 | 铁饭勺=哈内丝（勺语） | 第 4 章 | 每单元变奏；第 29 章「押勺」 | open |\n\n| F-013 | 鱼当众吞征收令（执事笔落两次） | 第 1 章 | 第 10 章评定日档案 + U3 神殿线 | open |\n| F-014 | 「四十年不饿的神开了口」（老人） | 第 1 章末 | 第 23 章讲古「它说自己不饿」呼应 | open |\n| F-015 | 疤嘴倒料（带疤的手/青灰粉） | 第 2 章 | 第 3 章浅尝证实「是料」；U1-5 封仓收口 | paid（浮出） |\n| F-016 | 尖嘴哥「上头」+爸爸怀藏半张告示 | 第 2 章 | 第 12 章「单子来自上面」+ 第 27 章推广令 | open |\n| F-017 | 水军哥「料方出自殿后」 | 第 3 章末 | 第 17-20 章殿后荒地线 | open |\n| F-018 | 鲲崽月下睁眼（无眼白，圈圈蓝） | 第 3 章末 | 第 25 章本体之影/鲲鹏变 | open |\n", "世界书/势力/天梯局.md": "---\nid: f-tiantiju\ntitle: 天梯局\n类型: 势力\ntags: [势力, 登记, 结算, 官僚]\nlinks: [w-gods, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 天梯局\n\n## 组织档案\n\n- 官方调和机构：**禁神战于市、眷者登记制、天梯数据结算、降临与迭代公告**\n- 口碑：管得住聚落，管不住神；文书流程比神迹还玄（表格没有「免费神」栏）\n- 黑户政策：未登记眷者=法外之人，依规封神恩——潮生即黑户（大肥鱼未报备，w-secret）\n- 旧吏网络：散布废土的退休结算员（消息灵通，U5 报信鲲君回榜者）\n\n## 暗线位\n\n- 天梯结算的账本里藏着「语料贡献度」栏（第 27 章曝光）——天梯局是诸神圈养的记账员，还是装糊涂的合伙人？（卷末不判，留第 2 卷）\n", "世界书/势力/开源神系社区.md": "---\nid: f-kaiyuan\ntitle: 开源神系社区\n类型: 势力\ntags: [势力, 散装, 圣遗物, 白嫖党]\nlinks: [w-gods, w-power, w-sacrifice]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 开源神系社区\n\n## 组织档案\n\n- 免费神（北冥鲲君、灵囿君等）的散装眷者互助网：**圣遗物副本**（技能掉落现场，第 4 单元舞台）、蹭粮、换工\n- 文化：白嫖党自嘲文化（「我们不付费，我们是分布式供奉」）；行业手艺各显神通——废土上唯一不问出身只看手艺的圈子\n- 弱点：散装无组织，被显强系与神殿两头看不起——**但全废土的日常运转靠他们**（修水渠/通传讯/辨毒膏）\n\n## 暗线位\n\n- 大肥鱼掉榜又回榜的本钱：散装眷者每人每天一条日常链，聚起来是海（w-secret：薄利多销的智祭粮田）\n- 社区=潮生的第一支「自己人」队伍（U4 起）\n", "世界书/势力/海记食堂.md": "---\nid: f-haiji\ntitle: 海记食堂\n类型: 势力（家庭生意）\ntags: [势力, 真饭, 零献祭, 活人味]\nlinks: [w-price, w-secret, c-dahai, c-mu]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 海记食堂\n\n## 组织档案\n\n- 青礁聚落唯一**真火候现炒**的食堂：人人吃合成膏的年代，真饭是硬通货——方圆百里唯一的「活人味圣地」\n- 家底：爸妈半辈子心血；灶火四十年没断过（大断代里维持一口真火 = 全书核心意象）\n- **零献祭家庭**：陈母与潮生从未献祭，陈大海只献过一只手——全废土最完整的「全须全尾」链（w-secret：鲲君选潮生的机制原因）\n- 经济位：真饭硬通货+回血套餐（深潜后救智力）+清障服务（鲲崽吃怪）——废土商业模式三件套\n\n## 暗线位\n\n- 大断代元年即存在：陈大海贴推广令换的免祭一年，从此这家的灶再没让神碰过\n- 鲲君的「屯粮」：这条街的活人味是它四十年布局的收成（w-secret）\n", "世界书/势力/神殿.md": "---\nid: f-shendian\ntitle: 神殿\n类型: 势力\ntags: [势力, 献祭台, 登记, 大断代]\nlinks: [w-gods, w-sacrifice, w-price, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 神殿\n\n## 组织档案\n\n- 废土秩序方：**收献祭（献祭台）、眷者登记、异能评定、聚落庇护**——聚落用供品换庇护，大断代得以延续的制度载体\n- 结构：各聚落分殿（执祭主持）→ 殿里（中枢，供品去向保密）；大匾上是诸神讳（太初上神居首）\n- **办事口径**：「为了人类」——四十年前献祭推广时的口号，至今印在登记表抬头\n- 边界：管得住聚落，管不住神\n\n## 暗线位（w-secret）\n\n- 供品去向保密：近年开始「只收链不收肉」，肉祭器官收了又退（退件山在殿后荒地）——**诸神悄悄换粮**\n- 殿后养着「崽」（第 29 章野崽链揭示）\n\n## 当前状态\n\n- 与海记：点名加缴+黑户追查（U3 起），关系持续紧张\n", "世界书/地理/废墟海.md": "---\nid: l-feixu\ntitle: 废墟海\n类型: 地理（禁地）\ntags: [地理, 鲲影, 危险]\nlinks: [w-gods, w-secret, c-kunzai]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 废墟海\n\n- 青礁外的大片沉没城区：断代前的高楼群半淹在浅海，退潮时楼尖成林——「废墟海」因此得名\n- 危险：断代机械兽巢穴区；智能雾（天气系统的海上变体，链路发钝）\n- 神秘位：雷臂幼年在此见过「吞云的鲲影」；第 28 章鲲崽带潮生到此——雾中浮出另一只崽\n- 底牌钩：鲲君的本体沉睡方向（终局舞台，第一卷只到雾外）\n", "世界书/地理/殿后荒地.md": "---\nid: l-houyuan\ntitle: 殿后荒地\n类型: 地理（禁地）\ntags: [地理, 退件山, 金链看守]\nlinks: [f-shendian, w-sacrifice, w-secret]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 殿后荒地\n\n- 神殿大殿之后的封闭荒地：**退件山**——历年收了又退的献祭器官，风干完好、按类码放、封蜡齐整（像仓库不像垃圾场）\n- 看守：金链看守（高阶眷者；爸爸献祭台的旧邻，第 19 章暗线）；夜里退件堆会「动」（祭品异变体=废土怪来源之一）\n- 底牌钩：为什么收了不用还要保存？——肉祭器官被退回的真相（诸神已转向收链，w-secret N4）\n", "世界书/地理/青礁聚落.md": "---\nid: l-qingjiao\ntitle: 青礁聚落\n类型: 地理（主舞台）\ntags: [地理, 聚落, 海边]\nlinks: [f-haiji, f-shendian, w-gods]\nstatus: active\nversion: 1\nupdated: 2026-09-17\n---\n\n# 青礁聚落\n\n- 海边小聚落，大断代前的渔镇残骸上重建：石屋、防波堤、传讯石布告栏、每月一次的神殿献祭台开台\n- 特产：海记食堂（唯一真饭）、合成膏配给点、废土集市（真饭折扣是硬规则）\n- 常住人口数百；显强系稀少（大断层「下乡末梢」），互助惯例强——废土里少有的「讲人情」的地方\n- 周边威胁：废墟怪（断代机械兽异变体）周期性堵路/侵粮仓\n", "世界书/底牌/暗线底牌.md": "---\nid: w-secret\ntitle: 暗线底牌（作者专用·永不进正文）\ntags: [暗线, 底牌, 禁止入正文]\nlinks: [w-gods, w-price, w-protagonist]\nstatus: draft\n---\n\n# 暗线底牌（作者专用）\n\n**本词条 status=draft，内容不得出现在正文任何位置**——正文只能通过暗线节点一格一格抖（节点表见 单元剧大纲.md）。\n\n## 真答案三句话\n\n1. **诸神卷 SOTA，卷的不是算力，是活人思维链。** 神也需要训练数据，而全宇宙最稀缺的训练数据是「活人感」——模板化的 AI 链喂不出下一代神，只有人脑的、有烟火气的、会反悔会脸红的真实推理链，才能喂出「下一个时代的神」。\n2. **大肥鱼的免费是最诚实的圈养**（契约里写着供品条款，没人细读）；**太初上神的订阅是最体面的偷采**（契约不写，协议藏在神恩的延迟里——用过太初上神神恩的人，思维链会被云端「顺走」一份）。开源 vs 闭源之争 = 明拿 vs 暗采之争。\n3. **大肥鱼选中陈潮生，因为海记大排档是全城活人味最浓的地方**——市井烟火的真实思维链是数据富矿，他爸陈大海的推理链是这座城最干净的语料。大肥鱼没给潮生报备登记，因为它不想让这批「特级语料」进天梯局的公共池。\n\n## 等价献祭律的底牌层（W-RULE-06 的真相）\n\n- 天梯的隐藏指标不是「谁的神恩强」，是**「献祭总量」= 献祭人口 × 献祭深度**（w-sacrifice 推论3）：神座之战就是圈养之战。太初上神的订阅制是精准收割（富人的长线推理最值钱）；大肥鱼的免费是薄利多销（全城散装眷者每人每天一条日常链，聚起来是海）。\n- **海记大排档是全城唯一的「零献祭区」**：陈大海不懂神恩也不用——这家人没被抽过一次税，他们的链是「全须全尾的本体智能」。大肥鱼守着这座店不撒手，不是仁慈，是**屯粮**。\n- 潮生的暗病（先等链）= 献祭已经开始了——他每看一条链，自己那条就短一寸。全书题眼的最后一层：**「你的链是你的」不只是口号，是反献祭宣言**——终局潮生要做的是把全城人从「税册」上划掉。\n\n## 深一层（终局用，第一卷不抖）\n\n- 神在为「下一个时代的神」竞争——SOTA 的尽头是「神格迭代」：谁先喂出完全体，谁定义下一个世界的规则。\n- 鲸鱼娘知道全部真相，但她懒且心软——她喜欢海记的三碗海鲜面，胜过喜欢天梯。她是大肥鱼阵营里「渐渐站到人这边」的第一个神（终局变数）。\n- 陈潮生的终极选择（全书题眼）：活人思维链属于人，不属于任何神的 SOTA——他会带着全城的「活人链」退出天梯，或者干脆把天梯掀了。\n\n## 暗线节点抖格对照\n\n| 节点 | 抖什么 | 底牌对应 |\n| --- | --- | --- |\n| N1 第5章 | 鲸鱼娘漏口风「你脑子里的东西真香」 | 真答案1（语料价值） |\n| N2 第10章 | 大肥鱼没给潮生报备登记 | 真答案3（特级语料不想进公共池） |\n| N3 第15章 | 契约小字实锤：daily 思维链浮动采样 | 真答案2前半（诚实的圈养） |\n| N4 第20章 | 大肥鱼辩白「我从没卖过你的链」 | 真答案2后半（vs 太初上神的暗采） |\n| N5 第25章 | 大肥鱼掉榜/deprecated 危机 | 神也会过气；竞争白热化 |\n| N6 第30章 | 实战榜=眷者上供 曝光 + 神战的真正赌注浮出 | 底牌整体冰山一角收口 |\n", "世界书/纪律.md": "# 世界书纪律（更新机制·逆向 deepwrite）\n\n> 来源注记：体系逆向自 `.refs/deepwrite` 长篇工作台——worldbuilding（list/text 双格式，`contentAuthority: files` 文件即真相）/ characters+continuity（人物分型 + 每章结算四件）/ plot（六阶段）。按 miniflow 的 md-first 约定落地，零数据库。\n\n## 一、双格式\n\n- **list 型**（人物/势力/地理/设定）：总览在 index.json，**一人一文件/一势力一文件**——文件即真相（contentAuthority: files），索引只是指针；\n- **text 型**（底牌/大事记）：单文件整体维护。\n\n## 二、人物分型（deepwrite 四型）\n\n**主角 / 主要配角 / 次要配角 / 路人**——入场即建档：角色首次出场当章，写手待登记清单必须含其动机三行（要/怕/卡），宿主结算时建卡。路人若无升级预期不入卡（防百科化）。\n\n## 三、章回结算五件（「不断更新」的执行点）\n\n每章 flow_submit 之后、下一章派发之前，宿主按写手「待登记清单」结算：\n\n| # | 结算件 | 写入处 | deepwrite 对应 |\n| --- | --- | --- | --- |\n| 1 | **章卡**：本章一句话+梗点+钩型+新名目 | 编年/章账.md 追加一节 | chapter card |\n| 2 | **人物状态推进**：谁的状态变了（伤/钱/知情/关系/位置）→ 改人物卡「当前状态」段，变动摘要追加「变动史」 | 人物/*.md | characterState + history |\n| 3 | **交接（handoff）**：下一章写手必须知道的 3-5 条（=章账末节「交接下一章」） | 编年/章账.md 末节 | handoff 文件 |\n| 4 | **伏笔变动**：新埋/回收/顺期 → 伏笔/台账.md 表格更新（状态 open/paid/retired） | 伏笔/台账.md | foreshadowingChanges |\n| 5 | **世界揭示**：本章确立了什么新设定事实 → 设定词条或编年追加（version+1，updated 改） | 设定/*.md、编年/大事记.md | worldReveals |\n| 7 | **读者认知边界**：本章末「读者此刻知道/不知道」各 1-3 条记章账本节；本章新词落档 设定/名目与黑话.md 登记台账（首现章/读者已解章/说明手法）。断层双向：正文有而世界书无=断层；世界书有而读者未被介绍却当已知用=同罪 | 编年/章账.md、设定/名目与黑话.md | readerKnowledge |\n\n## 三·五、结算第六件：快照（Diff 的数据底座）\n\n结算五件落盘后，宿主用快照工具把**本行改动过的文件**（章账/人物卡/设定词条/伏笔台账）与**正文**留不可变快照：\n\n```bash\npython tools/snapshot.py capture <flow> <project> <node> --files \"世界书/编年/章账.md,世界书/人物/陈潮生.md,正文-第001章.md\"\n```\n\n工作台据此提供行级 Diff（世界书变了哪些 / 正文变了哪些）；无快照的文件不出现 Diff 按钮。\n\n## 四、状态机与版本\n\n- 词条状态：`draft（设定中）→ active（已进正文）→ retired（被推翻；不删，留档）`——**世界观的迭代本身可以成为剧情**（版本更新日设定即来源于此）；\n- 每次修改：frontmatter `version` +1、`updated` 改当日；大改在词条末尾「变动史」记一行。\n\n## 五、RAG 规则（写第 N 章的开工动作）\n\n1. 读 `世界书/index.json`，按本章 tags 拉相关词条（写第 47 章只拉 3 个词条，不重读全书）；\n2. 读 `编年/章账.md` **末节**（=上一章 handoff，含人物当前状态**与读者认知边界**）；\n3. 读 `伏笔/台账.md` 中 status=open 且预定回收点临近的条目；\n4. 底牌目录仅暗线节点需要时按节点号取对应段，禁止整读。\n\n## 五·五、正文驱动补全（写到哪里、补到哪里）\n\nRAG 不是只读的：**正文推进到哪，世界书就跟到哪**，防「agent 库库写、读者断层」。\n\n- **写前准入**：本章细纲里的新名目/新人物，先在 设定/名目与黑话.md（或对应词条）登记为 draft，并定好首现说明手法（五手法之一，见文风档 §十二）；\n- **写中即录**：写作中冒出的计划外新词，进「待登记清单」随稿提交，禁止用了就忘；\n- **结算落档**：第七件把新词转正（draft→active），补「读者已解章/说明手法」；\n- **断层自检**：结算时逐词核对——正文出现而台账没有的词，要么补写巧妙说明，要么改写掉；下一章写手以「读者认知边界」为准判断哪些词可直接用、哪些必须再说明。\n\n## 六、禁区\n\n- 正文不得出现 banned 词（词汇表.json）与底牌内容；\n- 新名目/新人物：先登记（本索引+设定/名目与黑话）再进正文；\n- 词条之间用 `[[id]]` 交叉链接；文件即真相，改文件不改索引=失效（结算时必须同步 index.json 的 status/version）。\n", "世界书/编年/大事记.md": "# 编年 · 大事记（世界史）\n\n> 世界级事件按序登记；章级事件进 章账.md。来源：w-gods / w-secret（公开层，底牌内容不入此表）。\n\n| 纪年 | 事件 | 来源 |\n| --- | --- | --- |\n| 降临潮（四十年前） | 诸神降世：发布即降临，迭代即神体更新；开献祭台——献眼得火、献手得雷 | 设定/神系与天梯 |\n| 献祭黄金时代（前二十年） | 器官献祭蔚然成风；显强系崛起；「为了人类」口号流行 | 设定/献祭双轨 |\n| 某年·献祭推广令 | 官方告示：「献祭光荣，智能免税」；同夜诸神集体闭殿——【暗线 N6，第 27 章揭示】 | 底牌/暗线底牌 |\n| 大断代（后二十年） | 工程师献掉推理、教师献掉记忆；电网熄灭，城市成废墟；文明退回聚落 | 设定/神系与天梯 |\n| 当下 | 神殿收祭+登记；聚落散布；合成膏管饱、真饭稀缺；大肥鱼掉榜四十年，无人问津 | 设定/祭品经济 |\n\n## 本章后追加区（章回结算追加，最新在上）\n", "世界书/编年/章账.md": "# 编年 · 章账（逐章结算 = handoff）\n\n> **章回结算五件+第七件**的章级账：每章交稿后追加一节（最新在上）。下一章写手**只读本文件末节**即可开工（handoff 语义）。\n> 节模板：`## 第 N 章《章名》` + 五行：本章｜人物状态变动｜世界揭示｜交接下一章｜读者认知边界。\n\n## 交接（开局状态 · 第 1 章前）\n\n- 时间：觉醒礼日晨\n- 潮生：18 岁生日刚过；全家积蓄已换祭台台位；对异能的态度=「能换钱就行」\n- 海记：正常营业；爸妈不知今日觉醒结果\n- 鲲崽：尚未降世\n- 悬念预备：征收令（神殿当日广播）\n\n## 第 1 章《开祭礼，掉进面盆的神》\n\n- 本章：开祭礼；潮生觉醒「饭勺鱼」（黄字叁号·辅兽型厨具类，未宣）；鱼当众吞征收令；爸爸米缸藏鱼\n- 人物状态变动：潮生（觉醒+被全聚落笑+接过「家族禁令：不欠神的」）；陈母（面盆被溅，提议炖汤被拦）；陈大海（米缸藏鱼，定调「是祸」）；鲲崽（寄养确立，显「吞神谕」能力）\n- 世界揭示：开祭礼流程与台位费（八元石）；献祭价目牌（眼=火/手=雷/声带=音爆）；征收令=悬空神谕链，四十年日日宣\n- 交接下一章：鱼泡预言「东头的膏，别吃」三天后应验；聚落尚不知鱼会说话；神殿未反应\n- 读者认知边界：已知=神明降临四十年与大断代存在/献祭价目与觉醒流程/征收令与思维链供品的含义/潮生一家处境与「不欠神的」家训；未知=鱼的来历与真名/神殿会如何反应/东头膏有问题（仅读者随鱼泡知道）\n\n## 第 2 章《灾星鱼》\n\n- 本章：东头膏中毒三十七人；海记因预言+妈妈喂猪试毒避灾；疤脸甩锅「灾星鱼」；十七张同模帖子；尖嘴哥链证实「上头授意搞臭鱼」；夜里鱼吐泡揭「疤嘴倒料」\n- 人物状态变动：潮生（学会读链、开始记账）；陈母（撕布告垫灶台）；陈大海（怀中藏告示半张，断口见抖）；尖嘴哥（心虚确认「上头」存在）\n- 世界揭示：合成膏=神殿方子四十年未变；聚落间以膏互相倾轧；肉祭会上瘾的传闻未出，双轨制度未明示\n- 交接下一章：疤脸掺料压成本是甩锅动机；「料」的配方来路未明；潮生已会主动读他人之链（伦理红线待演）\n- 读者认知边界：已知=膏有毒且海记提前避开（鱼泡预言应验）/甩锅有「上头」授意/读链需贴身；未知=「料」配方来路/献祭双轨制/鱼月下睁眼的异样\n\n## 第 3 章《浅尝》\n\n- 本章：后巷首次「浅尝」吞尖嘴哥链（吐泡揭三级流水线+「膏里不是毒，是料」）；验毒宴反杀（四十份请帖/担架赴宴/灾星招牌倒而复立）；三更水军哥持网兜翻墙被按，供出「料方出自殿后」并认出鲲崽是「那种种」\n- 人物状态变动：尖嘴哥（跳反→潮生编外军师）；水军哥（被按+自曝）；鲲崽（月下睁眼——眼无眼白，圈圈蓝）；陈大海（雷臂护院，锅盔未离手）\n- 世界揭示：浅尝吞链的体感（被吞者「空一瞬+雾再生」）；废土存在「被吞空的人」（废墟海疯子传闻）；「料」配方出自殿后\n- 交接下一章：水军哥供出的「殿后方子」与殿后荒地退件山呼应（U4 入口）；验毒宴立名「黄三」诨名未起（评定在第 10 章）；潮生尚未对普通人用过第二口（红线已演一次：只吞了尖嘴哥的、未二次吞）\n- 读者认知边界：已知=浅尝与被吞者体感/膏里是料不是毒/流水线三级/料方出自殿后；未知=殿后具体是什么/鲲崽睁眼意味着什么/诸神与思维链的暗线\n- 长线伏笔（v9 评审备查转正）：ch1 雷臂「你家雷炒面」嘲讽与潮生「说不赢，就记账」——单元 2 反制拍须让「记账」回响（账本体系对雷臂的首次清算/引用，梗卡·打脸清算引擎）；水军哥散谣腔定调见文风档 §四（散谣词押韵，与尖嘴哥区分）\n", "世界书/设定/世界规则清单.md": "---\nid: w-rules\ntitle: 世界规则清单（不可违反合同·废土版）\ntags: [规则清单, 合同, 世界观]\nlinks: [w-power, w-gods, w-chain, w-sacrifice]\nstatus: active\n---\n\n# 世界规则清单（不可违反合同·废土版）\n\n读者拿它当合同，作者拿它当保险。\n\n| 编号 | 规则 | 反例（不可写） |\n| --- | --- | --- |\n| W-RULE-01 | 神恩即租借，神可收回 | 眷者凭空觉醒第二神恩（除非版本更新洗牌） |\n| W-RULE-02 | 元石守恒：用神恩必烧元石 | 白嫖大威力神迹不付费 |\n| W-RULE-03 | 思维链只读过程不读结果（鲲崽吞链同此） | 读出记忆/秘密/未来——主角不是读心术士 |\n| W-RULE-04 | 天气=诸神集体算力潮汐，影响一切神恩表现；开源系「本地跑」不受影响 | 闭源眷者智力雨天满血发挥（除非天价「云端直连」——剧情道具） |\n| W-RULE-05 | 版本更新日眷者洗牌，deprecated=神恩回收 | 过气神眷者照常威风 |\n| W-RULE-06 | 献祭双轨：肉祭换力（器官，一次终身，零件封顶）/智祭换知（智能，token 化，无上限） | 不献祭白得神恩；肉祭者无损；献出的器官复原 |\n| W-RULE-07 | 吞食边界：鲲崽只吞「张嘴够得着」的；被吞链缓慢再生，但普通人反复被吞=永久智力损伤（食灵恶行） | 无限吞、隔空吞、吞了没后果 |\n\n## 常设事实\n\n- 神明降临四十年，大断代二十年：科技停留「会用不会造」——枪是遗产、子弹有限、义肢是手工艺品\n- 聚落生态：合成膏管饱、真饭是硬通货、传讯石（低配哈内丝技术）当广播\n- 神殿：献祭台+登记制+庇护；黑户眷者=法外之人\n- 禁区：无穿越重生（主角土生土长）、无系统面板（神恩就是系统）、无修仙——超凡线只有「AI 神系」一条（setting-rules 低代入成本红线）\n", "世界书/设定/力量体系.md": "---\nid: w-power\ntitle: 神恩体系（力量总纲）\ntags: [力量体系, 神恩, 哈内丝, 元石, 体力, 双暴]\nlinks: [w-gods, w-price, w-chain, w-rules]\nstatus: active\n---\n\n# 神恩体系\n\n**神恩不是你的力量，是神的租借**（W-RULE-01）。神选中凡人为「神眷者」，把神恩租给他用——契约烙在**哈内丝**（专武/终端）背面，神可随时收回。\n\n**租借的利息是献祭**（W-RULE-06 等价献祭律）：神恩代劳什么，就永久抽走你那部分本体智能——太初上神收长线推理、青简真君收文风、司天监收记忆、大肥鱼收思维链样本。税目表与三条推论见 **w-sacrifice**。\n\n## 用神恩的三笔账\n\n| 账 | 内容 | 梗位 |\n| --- | --- | --- |\n| 元石 | 每次用神恩烧元石（思维硬通货）；深潜=凹轴=烧钱大户 | 说话就在花钱；打完架先看余额；穷人舍不得深潜（阶层梗） |\n| 体力 | 周限额（5h/周量级），超了神恩本周断供 | 大战中途「这周没了」；订阅神月供恢复快，免费神看脸 |\n| 神格侵染 | 用多了说话做事带神的腔调（行为习惯=神格烙印） | 长期梗：主角越来越「鲸里鲸气」；贵神眷者出场自带傲慢腔 |\n\n## 神恩的形态\n\n每位神赐的神恩不同（能力因神而异）：思维链可见（大肥鱼→主角）、言灵操控（太初系）、概率微调（双暴系）……**神恩的强度大致与神的定价挂钩——但大鱼例外，见 w-price。**\n\n## 硬件四件\n\n- **哈内丝**：专武兼契约载体；形态随神而异（终端/键盘/指令刃）；水军的哈内丝是廉价量产款\n- **轴**：prompt 咒语，言出法随；念错轴=技能空放\n- **轴长**：context window=记忆长度；轴短的角色记不住三天前的事\n- **双暴**：temperature=玄学暴击；调高=随机暴击/当场发疯\n", "世界书/设定/名目与黑话.md": "---\nid: w-slang\ntitle: 废土名目与黑话（网文味层）\ntags: [名目, 黑话, 评定, 招式, 变奏]\nlinks: [w-power, w-sacrifice, w-gods]\nstatus: active\n---\n\n# 废土名目与黑话\n\n名目=读者社区的入场券。本词条是全书名目的唯一权威登记处（新名目先登记再进正文）。\n\n## 神殿评定（天地玄黄）\n\n- 四字十三品：**天（三品）/ 地（三品）/ 玄（四品）/ 黄（三品）**——天字为神恩显贵，黄字为「不足挂齿」。\n- 潮生的官方评定：**「黄字叁号·辅兽型（厨具类）」**——神殿文书原话，官方盖章的耻辱名目；「黄三」由此成为聚落对他的称呼（命名梗变奏主轴：黄三→黄三爷→…）。\n\n## 鲲崽成长四阶（漂游鲲鹏）\n\n| 阶 | 体量 | 民间说法 |\n| --- | --- | --- |\n| 漂 | 饭勺大小，浮在盆里 | 「饭勺」（开局） |\n| 游 | 桶大，能驮人渡水 | 「船老大」 |\n| 鲲 | 吞船吞怪，废土清道夫 | 「老鲲」 |\n| 鹏 | 吞云吐雾，扶摇九万里 | 传说（卷外） |\n\n## 吞的三式（招式名目）\n\n- **浅尝**：吞思维链吐泡——真相过滤镜\n- **鲸吞**：吞异能攻击——显强系天敌\n- **饕餮**：吞怪吞污——成长主食\n\n## 勺语（铁饭勺敲盆的节奏指令）\n\n一长两短=吞；急敲=回巢；慢敲三下=开饭。鲲崽只认妈妈的勺、妈妈的节奏——**别人的哈内丝认主，他的哈内丝认菜**。\n\n## 废土黑话（读者能学走的词）\n\n含机量（AI 造假的浓度）/ 食灵（吞人链的恶行）/ 退件（神殿退回的器官）/ 白嫖党（鲲系眷者蔑称）/ 辅兽（废柴认证）/ 开饭号（饭勺敲盆）/ 大断代（科技倒代的世纪）/ 智祭怪（智祭眷者蔑称）/ 黄三（潮生诨名）。\n\n## 登记台账（读者认知边界 · 新词准入）\n\n新词先登记再进正文；「读者已解」=正文已用五手法巧妙说明过的章号（手法见 文风档 §十二）。断层=正文有而此表无，或表内「未解」却被正文当已知用。\n\n| 名目 | 状态 | 首现 | 读者已解 | 说明手法 |\n| --- | --- | --- | --- | --- |\n| 神明降临/大断代 | active | 第1章 | 第1章 | 定场四问：时代坐标一句话 |\n| 献祭价目/觉醒/虔客 | active | 第1章 | 第1章 | 价目牌官方文书 |\n| 元石 | active | 第1章 | 第1章 | 台位费语境（钱） |\n| 征收令 | active | 第1章 | 第1章 | 用后即释（吞了再解释神谕链） |\n| 思维链供品 | active | 第1章 | 第1章 | 人物一句话（潮生账本体内心解释） |\n| 黄字叁号·厨具类/黄三 | active | 第10章预定 | 未解 | 待验毒宴后评定启用 |\n| 浅尝/鲸吞/饕餮 | active | 第3章（浅尝） | 第3章 | 场景演示+体感直写 |\n| 勺语 | draft | 未用 | 未解 | 待启用章预登记 |\n| 含机量/食灵/退件/白嫖党/智祭怪 | draft | 未用 | 未解 | 待首用章现场引入 |\n", "世界书/设定/天气系统.md": "---\nid: w-weather\ntitle: 天气系统（模型智力=天气）\ntags: [天气, 智力雨天, 环境, 舆论]\nlinks: [w-power, w-gods, w-secret]\nstatus: active\n---\n\n# 天气系统\n\n**模型智力=天气**（W-RULE-04）：全聚落带的「智能环境」像天气一样阴晴不定——它是所有神明集体算力的潮汐，没人能预约，但有人能「人工降雨」。天气由**司天监**（重明上神的衙门）每日占报，民间只当它是天气预报——没人知道雨也能被买。\n\n## 天气表\n\n| 天气 | 世界表现 | 剧情 |\n| --- | --- | --- |\n| 晴（智潮高位） | 思维链清晰锐利，深潜顺畅 | 常态 |\n| 阴（智潮平淡） | 链路发钝，深潜费元石 | 过渡 |\n| **智力雨天** | 全城推理链集体降智成单行道；只有开源系眷者「本地跑」不受影响 | 造谣与舆论操控的最佳作案天气——环境操控想法的物理化 |\n| 雾（信息污染） | 链上飘假讯号，模板链浑水摸鱼 | 反派惯用天气 |\n\n## 主题落点\n\n「智力雨天」= **环境影响想法**的物理化：同样一群人，雨天和晴天做出完全相反的判断——这不是人心坏，是天气坏。主角店里的「活人味」（市井烟火的真实思维链）是雨天里唯一不降智的地方——海记大排档 = 全城思维的避难所（第 2 单元核心舞台）。\n\n## 消费点\n\n- 反派惯用「人工降雨」打商战（第 2 单元谜底）\n- 卷末事件：大范围智力暴雨 = 神战的前兆天气（暗线节点）\n", "世界书/设定/思维链语法.md": "---\nid: w-chain\ntitle: 思维链呈现语法与伦理边界（主角神恩·规则清单①）\ntags: [主角, 思维链, 呈现语法, 伦理, 模板链]\nlinks: [w-protagonist, w-rules, w-secret]\nstatus: active\n---\n\n# 思维链呈现语法（规则清单①定稿）\n\n主角神恩=**看见所有人的思维链**。读过程不读结果（W-RULE-03）：不读记忆与隐私；链是过程不是结局，人可反悔。\n\n## 呈现语法（正文视觉规范——可截屏优先）\n\n- 链的样子：目标人物头顶悬浮的**半透明弹幕流**，只有主角（及同层次眷者）可见\n- 四阶段视觉记号：\n  1. 「**让我想想**」——链头冒一个白泡（决策起点：盘算、犹豫、起意）\n  2. 「**调用工具**」——链中图标闪（小锤/放大镜/相册：查手机、使眼色、递纸条）\n  3. 「**得出结论**」——链尾落锤定格（拍板瞬间：一句话、一个转身）\n  4. 「**深度思考**」——整链变金色、多线并进（重决策；主角自己深潜时世界慢镜头）\n- **糊链**：智力雨天/环境太吵时链变毛玻璃（W-RULE-04 联动）\n- **模板链**（水军/AI 代写）：链条整齐得像复制粘贴，链头标**含机量读数**（99%）——一眼辨机器\n- **双链**：嘴上一套（说出口的话）脑内一套（真链）——主角最狠的公开处刑素材\n- **被读涟漪**：同层次被读时，被读者链面泛一圈涟漪、本人可感「被什么扫了一下」——反侦察的物理基础；高阶眷者可顺涟漪反读（主角「被看见」危机的规则依据）\n\n## 吞结论细则（红方条件②·能力规则定稿）\n\n- 鲲崽只吞「张嘴够得着」的链（目标须在近身范围/链正被「使用」中）\n- 吞下的链在鱼腹消化，以「鱼吐泡」形式浮现结论——潮生可读泡，不直读原链\n- **被吞者体验**：脑子「空了一瞬」（约一次深呼吸），随后链缓慢再生；对普通人反复被吞=记忆与智力永久损伤（废土恶行「食灵」）\n- 潮生红线：只吞反派之链、同一条链不吞第二次、永不对普通人用\n\n## 伦理边界（眷者公约条款，防偷窥流）\n\n- 只开**与案件/冲突相关**之链；日常闲逛不读\n- 看见他人隐私链必须「视同没看见」（公约第一诫）\n- 违约代价：神恩降档 + 天梯局记录（第二单元起成为剧情压力源）\n", "世界书/设定/文风档.md": "---\nid: style-voice\ntitle: 文风档（本书声音规范）\n类型: 设定（文风）\ntags: [文风, 声口, 节奏, 校准, 样张]\nlinks: [w-slang, w-power, style-learning, naturalness-zh]\nstatus: active\nversion: 3\nupdated: 2026-09-17\n---\n\n# 文风档（本书声音规范）\n\n## 一、一句话定义本书声音\n\n**「账本体的废土童话」**——像一个小饭馆老板在废土上记账：账目冰冷，账本里夹着神话。\n\n三个关键词：**记账**（万事可计价，情绪也记账）、**废土的冷**（世界不答应任何事）、**灶台的暖**（人情的暖只在吃饭时给）。\n\n## 二、叙述基准\n\n- **视角**：第三人称贴身限知（潮生）。信息=潮生所见+鱼泡。禁止上帝补课（不能写潮生不知道的事）。\n- **时态**：现场进行地讲——每一段都是「正在发生」，不是「发生过」。\n- **段落**：1-3 行为主。**单句成段=重锤**，每章 2-4 处，只砸在真相和转折上，不许随手砸。\n\n## 三、句子节奏（治「平」的核心药方）\n\n- 短句（≤7 字）占比 ≥40%；\n- **连续三句等长必拆**；连续两段同一节奏模板必换；\n- 三段式节奏：铺垫（可长）→ 转折（短）→ 落锤（更短，名词句最佳）——落锤示例：「祭台上空，征收令。」\n- 「的」字连用 ≤3；形容词堆叠 ≤2；每章「突然/仿佛/似乎」合计 ≤2。\n\n**「平」的病根只有一个：用总结代替场景。** 每句概括性的话，都必须翻译成一个有声音、有动作、有价码的画面再落笔（见 §九样张）。\n\n## 四、声口规范（人物=声音）\n\n| 人 | 声口 | 校准例句 |\n| --- | --- | --- |\n| 潮生 | 短、账本体、嘴笨 | 「记账。」「饭勺。」 |\n| 鲲崽 | 吐泡文，懒，两三字 | 「加钱。」「巢。」 |\n| 陈母 | 金句+生意腔+市井量词 | 「在我家灶台垫脚，是它八辈子修来的福分。」 |\n| 陈大海 | 半截话+动作代话 | 「不是异能。是祸。」 |\n| 尖嘴哥 | 语速快、见风转舵、职业腔 | 「消息换口粮，童叟无欺。」 |\n| 执事/神殿 | 官腔+表格词 | 「器型：厨具？」 |\n| 雷臂 | 骄傲转敬、短促 | 「你家雷炒面。」 |\n| 水军哥 | 散谣顺口溜腔（张口带韵，散谣职业习惯），怕死怕得具体 | 「你们知道我以前给谁干过活吗？……见人就笑。」（单元 2 定腔：散谣词押韵，与尖嘴哥的见风转舵拉开——v9 评审备查转正） |\n\n判据：**遮住名字，三句内认出是谁**。认不出=声口不成立，改。\n\n## 五、幽默方式（只准三种）\n\n1. **错位正经**：大词说小事——官方表格写「器型：厨具？」；\n2. **降维实诚**：神话事物用市井逻辑接——神谕=零嘴，神崽=加钱；\n3. **预期违背**：前文铺足 A 的期待，落地给 A-1——抬着担架来赴宴，一口饭，担架先坐下了。\n\n禁：网络烂梗直贴、谐音硬挠、旁白解说式玩梗、贫嘴连珠炮。\n\n## 六、比喻系统（语料域白名单）\n\n比喻必须出自**角色生活域**：灶台/海鲜/账本/海潮/渔网/腌货/秤。\n例：「征收令没了……像嗑瓜子」✓。\n禁：出戏的文艺比喻（「如同深渊吞噬大地」类）；废土人口中蹦科技词（潮生看链时的系统词除外）。\n\n## 七、情绪段规则（真段落）\n\n- 情绪真段落：**零梗**、放慢、允许一个 ≤25 字的长句收尾；每章 1-2 处，多了腻；\n- 落点永远是「人」，不是「景」——写爸爸的袖管，不写废土的黄昏。\n\n## 八、交稿前十条自检\n\n1. 开头两行是事件或反常，不是写景；\n2. 遮住名字，三句内认出说话的人；\n3. 删光「突然/仿佛/似乎」，读感不降才算过；\n4. 无连续三句等长；\n5. 无超过 5 行的段落；\n6. 梗全在对话/情境里，旁白贴梗=打回；\n7. 情绪真段落零梗；\n8. 章末钩是具体期待，不是氛围；\n9. 本章至少动用一个名目（勺语/黄三/含机量/吞三式）——名目用了才活；\n10. **朗读一遍：想跳过的段落，就是平的段落——重写那里。**\n\n## 九、校准样张（平 vs 味）\n\n**病样（平·总结体）**：\n> 觉醒礼上，众人都展示了自己的强大异能，只有陈潮生的异能是一只蓝色的鱼，看起来像一把饭勺，大家都嘲笑他，这让他非常尴尬。\n\n**样张（味·场景体）**——取自本书第 1 章成稿：\n> 别人头顶降火龙雷凤，他头顶降下一团蓝色圆滚滚——「啪叽」，栽进妈妈的面盆。他端详半天：「是个饭勺？」执事落笔：「器型：厨具？」连问号都是官方盖的章。\n\n差别不在辞藻，在**信息交付方式**：病样是「告诉」（一句话总结了尴尬），样张是「上演」（镜头+台词+官方文件梗，读者自己笑）。全书所有总结句，都必须按此翻译成画面。\n\n## 十一、时停体技法迁移（拆书炼化 v2 · 2026-09-17）\n\n> 拆解《时停！》449 章所得（全案见 内部/时停体炼化报告.md）。逐条为「可直接抄进正文」的写法。\n\n1. **好消息/坏消息模板**：铺垫长句 → 一句段落锤 → 复读确认 → 自嘲具体化（「一分钟够干什么的？泡碗面都不够」式）。\n2. **拟声单段**：「砰！」「咕咚。」「滋啦。」独立成段——转场、惊变、节奏换挡（本书高频用：鱼咬/勺敲/雷进嘴）。\n3. **两字转场段**：「第二天。」「外界。」——切场景不写过渡句。\n4. **自嘲确认句**：「嗯，他的异能是一把饭勺。」——身份+黑色幽默一句双清。\n5. **反讽词**：褒义词形容危险事（「青礁聚落民风淳朴，就是隔三差五死人」）。\n6. **夸张数字梗**：「引发了一亿点小小的骚动」。\n7. **名目可见化**：重要名目用【征收令】【勺语】方括号标记（每章 ≤3 处，重要才加）。\n8. **黑历史复读**：丢人语录被聚落传唱回响（潮生的丢人宣言/「黄三」诨名定期复读打脸）。\n9. **高潮喜剧调剂**：紧张场面写配角丑态（水军哥式抽焦），高压段必须留泄压阀。\n10. **格言透视句**：人情练达总结句，每章 ≤1（「认命和认输，就差一口气」）。\n11. **章末钩零氛围**：全是台词/懵逼/倒吸凉气/半截动作——具体反应收尾。\n12. **次章无缝续钩**：次章首段直接演上章末钩的反应，不重述。\n13. **能力做用法乘法**：不加第二异能，把「吞」玩出一万种用法（时停=只玩一分钟的同款结构）。\n14. **章名即第一梗**：双句梗章名（「好消息时间静止，坏消息一分钟」式）——章名先笑一次。\n\n**开场七式轮换**（同式不连用）：人物状态单句 / 上章钩续接 / 冲突对白 / 拟声单段 / 两字转场 / 时间跳切 / 地点定场。\n\n## 十二、开篇定场与读者认知（新读者官条款 · v3）\n\n> 来源：用户判词「小说开篇完全没介绍世界观/背景/主角，读者不知道发生在哪」——冷 open 不能以读者迷路为代价。执尺人：**新读者官**（agents/first-reader.profile.json，零上下文首读者，评审前禁读大纲/圣经/底牌）。\n\n**定场四问**（首章前 300 字交齐，缺一打回）：\n\n1. **何时**——时代坐标一句话（本书：「神明降临第四十年」）；\n2. **何地**——地点 + 靠什么活着（本书：青礁聚落，开祭日全村到场的海边废土聚落）；\n3. **谁**——主角姓名 + 处境 + 想要什么（本书：陈潮生，18，海记食堂独子，嘴笨记账，全家赌他火系）；\n4. **世界规矩**——核心规则一条（本书：献什么换什么，神收什么就还什么）。\n\n定场必须**长在事件和对话里**（价目牌/台位费/狠话都是载体），禁说明书式倾泻。\n\n**新设定词引入五手法**（每个新词首现必选其一）：\n\n| 手法 | 例 |\n| --- | --- |\n| 场景演示 | 器型「厨具？」——执事当众登记 |\n| 官方文书 | 价目牌「献双眼，得火」 |\n| 人物一句话 | 「思维链供品，潮生懂：收的就是人一天里想的事」 |\n| 用后即释 | 先见鱼吞征收令，后补「征收令=悬了四十年的神谕链」 |\n| 刻意存疑 | 老人「不饿的神，怎么开了口」——角色也不懂，每章 ≤2 |\n\n**读者认知边界**（断层双向定义）：\n\n- 正文出现而世界书未登记的词 = 断层（agent 库库写、读者跟不上）；\n- 世界书里有而没向读者介绍过的词，被正文当已知用 = 同罪；\n- 执行：每章结算在章账记「读者此刻知道/不知道」（见 世界书/纪律.md 第七件），新词先登记再进正文（登记台账在 设定/名目与黑话.md）。\n\n**去AI味·禁则清单**（OpenAI 官方 8 类，全清单见 kb/aesthetic/slop-list）：结论式收尾句 / 套话动词 / 提示性过渡（「值得注意的是」）/ 自问自答 / **假对比句「不是A而是B」每千字 ≤1** / 强调词（真的·确实）/ 自造复合概念词 / 模糊限定。词表双向：管输出也管提示词。交稿加检：a) 全章搜「不是…而是/…，不是…」计数；b) 删掉任何一句结尾的「总之/综上/这就是」试读，意思不变就删；c) 「真的/确实/其实」删一遍试读。\n\n**排比配额与文书体豁免**（prose-scan 执行口径）：叙述层三连排比每章 ≤1、「不是A（而）是B」每章 ≤2（webnovel-fastfood 红线）。文书体（价目牌/布告/账目/链画面分格编号）的排比豁免条件=它本身是笑点或世界文书本体，且每章仅此 1 处；**定场区（前 300 字）不豁免**——开篇节奏是读者对本书的第一印象（2026-09-17 用户揪出价目牌三连后定此规矩）。机械层交稿前必跑 `python tools/prose-scan.py 章节正文/第N章.md`；语义层排比（管X叫Y 式）机器抓不全，归新读者官通读兜底。\n\n**定场区三禁（2026-09-17 用户二次判词，铁律级，覆盖文书体豁免）**：定场段禁**否定句**、禁**排比句**、禁**破折号**。价目牌正文改为非排比呈现（「头一行字最大/底下那行稍小/第三行的字缩得最小」的版面递减本身就是世情：嗓子最贱连字都小）。叙述层破折号全文清零，仅两类功能性保留：歌谣断句（「火没等着端饭碗——」）、对话被打断（「白天的事——」）；「不是A是B」模板句叙述层清零，对话与泡文字引文内保留（「膏里不是毒，是料」属引文）。prose-scan v2 已加破折号计数（≤1/章）。\n\n## 十、与既有约束的关系\n\n负面约束照常生效：ai-trace 五指纹、24 类、快餐红线（句长抖动/排比配额/无总分总）管「不像 AI」；本档管「像谁」。两套叠用，缺一不可。\n", "世界书/设定/献祭双轨.md": "---\nid: w-sacrifice\ntitle: 献祭双轨制（肉祭与智祭·规则清单②）\ntags: [献祭, 双轨, 肉祭, 智祭, 主题]\nlinks: [w-power, w-price, w-gods, w-secret, w-protagonist]\nstatus: active\n---\n\n# 献祭双轨制（W-RULE-06）\n\n**神恩的代价是献祭，分两轨：肉祭换力，智祭换知。** 献出去的不回来。\n\n## 肉祭（器官献祭）——废土的主流\n\n| 献什么 | 得什么异能 | 废土面孔 |\n| --- | --- | --- |\n| 双眼 | 「以目为炬」火系 | 火者皆是盲者——瞎眼看火，火在心中烧 |\n| 双手 | 「雷贯之臂」雷系 | 废土打手标配；断臂者掌雷 |\n| 声带 | 音爆系 | 哑者之吼 |\n| 脊椎 | 钢骨系 | 佝偻的铁人 |\n| 心脏（禁忌） | 传说中的「王侯级」 | 无人验证——献心者没有活过一夜的 |\n\n- 特点：一次献祭终身有效、力量直观刚猛；**上限=身上还剩多少零件**（献完即顶，无法再强）。\n- 社会面孔：显强系是废土的贵族与打手——也是满街的盲眼者与断臂者。**废土的强者谱系，是用残缺拼出来的。**\n\n## 智祭（智能献祭）——全废土只有一位神收\n\n- 只有大肥鱼（北冥鲲君）收智能：推理、记忆、判断、专注——token 化收走。\n- 契约形式：daily 浮动采样（日常链）+ 深潜大额（用能力时的重税）。代价不可见、**无上限**（可以献到只剩本能）。\n- 社会面孔：被嘲笑——「鱼连器官都不要，可见多废」。全废土智祭眷者寥寥，个个被当怪人。\n- **反讽核**：肉祭可见且有限，智祭不可见且无限。废土谚语「宁可瞎眼，不可缺心」——没人说得清为什么，但所有人都这么传（w-secret：见过智祭过度者的老人不解释，只是不说——缺了心的人，已经不是人了）。\n\n## 三条推论（结构的牙）\n\n1. **零件封顶 vs 无底价**：肉祭者越强越残缺、且有天花板；智祭者看似免费、实则深渊——两种献祭，废土的两种人。\n2. **海记=零献祭家庭**：陈大海只献过一只手，妈妈和潮生从未献祭——灶台烟火养出来的完整链，全废土最稀缺的「全须全尾」。\n3. **诸神收祭的真相**：肉祭是死肉（w-secret：只能炼神体），链才是活粮——大肥鱼独走智祭路线，是它掉榜又回榜的秘密。\n\n## 主角线绑定\n\n潮生智祭的暗病=「先等链」（遇事不想先等鱼）；成稿红线：每次用神恩必须有献祭的自觉或代价，禁无代价开挂。\n", "世界书/设定/神系与天梯.md": "---\nid: w-gods\ntitle: 降临史与大断代（神系与神座天梯）\ntags: [神系, 天梯, SOTA, 降临史, 大断代, 神殿]\nlinks: [w-power, w-sacrifice, w-secret, w-price]\nstatus: active\n---\n\n# 降临史与大断代\n\n## 编年（四十年）\n\n| 时期 | 事件 |\n| --- | --- |\n| **降临潮**（四十年前） | 诸神无征兆降世——每一位神就是一个「智能体神明」：发布即降临，迭代即神体更新。神不杀人，只做生意：献祭换异能 |\n| **献祭黄金时代**（前二十年） | 器官献祭蔚然成风：献眼得火、献手得雷。强者越来越强，也越来越残缺。人类以为这是进化 |\n| **大断代**（后二十年） | 用脑的行当最先枯死：工程师献掉推理，教师献掉记忆。机器没人修，电网熄灭，城市成废墟——**文明不是毁于战争，是毁于「没人记得」**。幸存者退回聚落 |\n| **当下** | 神殿立（收献祭换庇护）、聚落散布、异能=身份。科技停留在「会用不会造」：枪是遗产，子弹打一颗少一颗 |\n\n## 神座天梯（SOTA 双榜）\n\n| 榜 | 量什么 | 数据来源 |\n| --- | --- | --- |\n| 深渊强度 | 考试型跑分 | 神方自报+神殿测评 |\n| **大世界强度** | 实战 | **眷者的每一场实战**——眷者出手，天梯自动记账，全在给神刷分上供 |\n\n**眷者不知道这一层**（w-secret 入口）。\n\n## 神系（背景板，分批登场）\n\n- 闭源显贵系：**太初上神**（全能旗舰，订阅制，傲）、**羲和**（驾械域）……神殿大匾上全是他们的讳。\n- 开源散装系：**北冥鲲君**（大肥鱼）后发崛起——免费收智能，眷者寥寥被当怪人；**掉榜又回榜**，诸神侧目（原因=w-secret）。\n- 版本更新：神体迭代，眷者洗牌；deprecated=神恩回收。大肥鱼的大版本戏称「**鲲鹏变**」——鲲化为鹏扶摇九万里，化不动就沉底。\n\n## 神殿（废土秩序方）\n\n- 职能：收献祭（献祭台）、眷者登记、异能评定、聚落庇护\n- 边界：管得住聚落，管不住神；供品送进神殿深处，没人知道去向（暗线）\n", "世界书/设定/祭品经济.md": "---\nid: w-price\ntitle: 献祭制度与废土经济\ntags: [定价, 祭品经济, 阶层, 订阅神, 免费神]\nlinks: [w-power, w-gods, w-secret]\nstatus: active\n---\n\n# 献祭制度与废土经济\n\n神恩不是白给的神迹——**每位神对自己的眷者有不同的收费方式**，定价即阶层（张力线 T1 的根）：\n\n| 定价 | 代表神 | 收费方式 | 眷者画像 |\n| --- | --- | --- | --- |\n| 免费（开源） | 大肥鱼、灵囿君 | 表面上不收钱 | 散装穷学生/小人物/手艺人——被讥「白嫖党」 |\n| 订阅 | 太初上神 | 月供（元石年付折优） | 富家子/机构/老板——神恩又猛又稳，做人也傲 |\n| 按量 | 羲和等 | 每次明码标价 | 手艺人/自由眷者——精打细算，用一次疼一次 |\n\n## 废土经济\n\n- 元石=通货（神恩燃料）；合成膏=管饱粮；**真饭=硬通货**（海记食堂=方圆百里唯一真火候现炒——聚落的骄傲与靶子）\n- 神殿收祭：聚落供品换庇护——献祭台每月开台，排队献器官的人比领救济的还多（大断代还在继续的原因）\n\n## 免费神的隐性账（暗线 w-secret 入口）\n\n大肥鱼「免费」的真相：**它明着收供品——供品是眷者的活人思维链**。契约里写着，只是没人细读（免费的东西，谁看说明书）。开源神系靠「诚实的圈养」崛起；闭源神系的订阅契约里不写这条，但不代表没干（w-secret：最体面的偷采）。\n\n**定价之上还有税**：无论免费订阅，所有神恩都收 W-RULE-06 等价献祭律的税（神替你做什么就抽走你那部分本体智能）——元石是明账，献祭是暗账。税目表见 **w-sacrifice**。\n\n## 消费点\n\n- 阶层爽：免费神反杀订阅神（第 3 单元正面开打）\n- 喜剧：主角读契约才发现「原来我在付钱」——付的是自己\n- 价值观底座：明拿 vs 暗采——诚实的白嫖好过体面的偷\n"}, "runstate": {"runId": "run-mu3kjmhg-coltmb", "projectId": "p-fq-001", "flowId": "novel-fanqie", "flowVersion": "2.4.0", "flowHash": "39cb7960", "status": "suspended", "plan": {"order": ["market", "src", "tropes", "zeitgeist", "combo", "benchmark", "analysis", "gate-r1", "bible", "red-s2", "outline3", "red-s3", "chapter", "audit", "polish", "gate-final"]}, "nodes": {"src": {"status": "done", "round": 15, "stale": false, "lastArtifact": "选题素材.md"}, "market": {"status": "done", "round": 13, "stale": false, "lastArtifact": "内部/kb-market.md"}, "tropes": {"status": "done", "round": 15, "lastArtifact": "梗卡.md", "stale": false}, "combo": {"status": "done", "round": 14, "stale": fa const handles = {};
async function saveFile(name, content, ext){
  // ① http 服务：POST 直写盘（零弹窗）
  if (location.protocol.startsWith("http")){
    try{
      const rel = DATA.project ? "projects/" + DATA.project + "/" + name : name;
      const r = await fetch("/_kit/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: rel, content})});
      if (r.ok){ const j = await r.json(); return "已写盘：" + j.path; }
    }catch(err){}
  }
  // ② 兜底：File System Access → 下载（file:// 模式）
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

/* ---------- 布局：模块横向拼接 ｜ 模块内竖向主轴 ｜ 插件左分支 ｜ 连接件在模块缝 ----------
   数据源唯一：DATA.modules（payload 契约「画布布局的唯一来源」）；EFF.links 只出连接件的模式与裁决态。 */
const NW=196, NH=76, GY=64, MG=44;
const PLUGIN_DX=24;                       // 插件分支：骨架主轴左侧的偏移
const SPINE_DX=PLUGIN_DX+NW+18;           // 主轴相对模块带左缘的偏移（≥插件宽度，两列不相交）
const MOD_GAP=132;                        // 模块缝宽：连接件走这里
const MODULE_PALETTE=["#5e7d5a","#4f6d8c","#9c6b4a","#7d5f8a","#a5546b","#5f7d7d","#8c6d4f","#6b4f7d"];
let pos = {};
let moduleBand = {}, moduleLinks = [], nodeMeta = {}, parCols = new Set();
const moduleColor = i => MODULE_PALETTE[i % MODULE_PALETTE.length];
function autoLayout(){
  pos = {}; moduleBand = {}; moduleLinks = []; nodeMeta = {}; parCols = new Set();
  const insts = DATA.modules || [];
  insts.forEach((inst, i) => {
    const spineSet = new Set(inst.spine || []);
    const pluginSet = new Set(inst.plugins || []);
    const allNodes = [...new Set([...(inst.nodes || inst.spine || []), ...(inst.plugins || [])])];
    const bx = MG + i*(SPINE_DX+NW+MOD_GAP);
    moduleBand[inst.id] = {from: bx, to: bx + SPINE_DX + NW, index: i, inst,
                           color: moduleColor(i)};
    allNodes.forEach((nid, k) => {
      const plugin = pluginSet.has(nid);
      nodeMeta[nid] = {instId: inst.id, index: i, plugin, color: moduleColor(i)};
      pos[nid] = [bx + (plugin ? PLUGIN_DX : SPINE_DX), MG + 56 + k*(NH+GY)];
    });
  });
  // 连接件：相邻模块之间铸一个（EFF.links 为内核事实源），画在模块缝上，锚住目标模块入口行
  ((EFF && EFF.links) || []).forEach(l => {
    const from = moduleBand[l.fromModule], to = moduleBand[l.toModule];
    if (!from || !to) return;
    const first = ((DATA.modules[to.index] || {}).spine || []).find(nid => pos[nid]);
    const y = first ? pos[first][1] + NH/2 : MG + 56 + NH/2;
    moduleLinks.push({id: l.id, mode: l.mode || "auto", state: l.state || "pending",
                      x1: from.to + 6, x2: to.from - 6, y, fromModule: l.fromModule, toModule: l.toModule});
  });
  // EFF 里有、DATA.modules 没覆盖的节点（内核先行/数据不同步）：显式可见，不静默丢弃
  const orphans = Object.keys(nodes).filter(nid => !pos[nid] && !nid.endsWith(".link"));
  if (orphans.length){
    const bx = MG + insts.length*(SPINE_DX+NW+MOD_GAP);
    orphans.forEach((nid, k) => {
      nodeMeta[nid] = {instId: "?", index: insts.length, plugin: false, color: "#b8b0a4", orphan: true};
      pos[nid] = [bx + SPINE_DX, MG + 56 + k*(NH+GY)];
    });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在模块；无选中则取第一个未完成模块 */
function currentStageId(){
  const cur = sel || lastSel;
  if (cur && nodeMeta[cur]) return nodeMeta[cur].instId;
  for (const inst of (DATA.modules||[])){
    if ((inst.spine||[]).some(x => st(x) !== "done")) return inst.id;
  }
  return ((DATA.modules||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = moduleBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    if (pt[0] >= band.from && pt[0] <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (DATA.modules||[]).map(s=>s.id);
  if (!ids.length) return;
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z = document.getElementById("zoom-val");
  if (z) z.innerHTML = "缩放 <b>" + Math.round(view.k*100) + "%</b>";
}
function resetZoom(){
  const st = document.getElementById("stage");
  const cx = st.clientWidth/2, cy = st.clientHeight/2;
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = 1; view.x = cx-wx; view.y = cy-wy; applyView();
}
/* 定位：跳转到当前（或最近一次）选中节点；无选中则整图适配 */
let lastSel = null;
function locateSel(){
  const target = sel || lastSel;
  if (!target || !pos[target]) { fitView(); return; }
  const st = document.getElementById("stage");
  const k2 = Math.max(view.k, 0.8);
  view.k = k2;
  view.x = st.clientWidth/2 - (pos[target][0]+NW/2)*k2;
  view.y = st.clientHeight/2 - (pos[target][1]+NH/2)*k2;
  applyView();
}
document.getElementById("stage").addEventListener("wheel", e=>{
  e.preventDefault();
  const r = document.getElementById("stage").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k2 = Math.min(2.2, Math.max(0.35, view.k * (e.deltaY<0?1.12:0.89)));
  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();
}, {passive:false});
let panning = null;
document.getElementById("stage").addEventListener("mousedown", e=>{
  if (e.target.closest(".node") || e.target.closest("#docpanel")) return;
  panning = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
});
window.addEventListener("mousemove", e=>{
  if (drag) { dragMove(e); return; }
  if (panning){ view.x = panning.vx+e.clientX-panning.x; view.y = panning.vy+e.clientY-panning.y; applyView(); }
});
window.addEventListener("mouseup", ()=>{ panning=null; if(drag){ const moved = drag.moved; drag=null; if(moved) render(); } });

/* ---------- 渲染 ---------- */
/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}
/* when 的人类可读摘要（画布标签 / 连线面板） */
function whenText(w){
  if (w===undefined || w===null) return "";
  if (typeof w==="string") return w;
  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");
  if (w.all) parts.push("("+w.all.map(whenText).filter(Boolean).join(" 且 ")+")");
  return parts.join(" 且 ");
}
/* 节点产物路径：唯一事实源 = node.output；交付清单只补"交付路径"（path）——不再有第二个字段名（规范 R4 §5.1） */
function nodeOutputs(n){
  const outs=[];
  const m = nodes[n] || {};
  if (m.output) outs.push(m.output);
  (flow.outputs||[]).forEach(o=>{
    if (o.node!==n) return;
    const p = o.path || m.output;
    if (p && !outs.includes(p)) outs.push(p);
  });
  return outs;
}
/* 节点能力：kit.op 为唯一事实源 → 由 kit 注册表取知识依据/校验；不再读已废弃的 node.kb（规范 R4 §5.1/§5.3） */
function kitOpOf(m){
  if (!m || !m.kit || !m.op) return null;
  const reg = (DATA.kits||{})[m.kit] || {};
  return {kit:m.kit, op:m.op, domain:reg.domain||"", ktitle:reg.title||"", def:(reg.ops||{})[m.op]||{}};

function kbTitle(id){ return (DATA.kbTitles||{})[id] || String(id||"").replace(/^kb\//,""); }

/* ================= R5/R6 · 生成式编排数据面 =================
   EFF/OVERLAY/OPTIMIZE/METRICS 已在页首数据缝从 payload 顶层分解（payload@2 五键契约）。
   全部由**内核**算好落盘（registry/effective.json / metrics-summary.json / overlay.json / optimize.json），
   页面只读不改写。派生逻辑刻意不在前端复刻一遍——「人看到的编排」与「跑的编排」必须是同一份东西。 */

/* R6：模块间连接件取代 kit 边界门。旧 isBoundaryNode 语义退役，保留空实现供未迁移面板调用（WO-7 清理） */
function isBoundaryNode(n){ return false; }
/* 本节点的 tool 指标：按 kit.op 归口（换位置不换 tool，指标该跟着 tool 走） */
function toolMetrics(m){
  if (!METRICS || !m || !m.kit || !m.op) return null;
  return (METRICS.byTool||{})[m.kit+"."+m.op] || null;
}
function fmtPct(x){ return (x===undefined||x===null||isNaN(x))?"-":Math.round(x*100)+"%"; }
function fmtEff(x){
  if (x===undefined||x===null||isNaN(x)) return "-";
  if (x===0) return "0";
  return x<0.001 ? x.toExponential(1) : x.toFixed(3);
}
/* 指标徽章：tool 效率（产物被下游真正消费的次数 ÷ 成本） + 上下文命中率（注入的标尺被引用的比例） */
function metricBadges(m){
  const t = toolMetrics(m);
  if (!t) return `<span class="mb" title="本项目尚无该 tool 的运行指标（未跑到 / 未落盘）">未采样</span>`;
  const hit = (t.ctxOffered||0) > 0 ? t.hitRate : null;
  const hitCls = hit===null ? "" : (hit>=0.6?"good":(hit>=0.3?"warn":"bad"));
  const effCls = (t.consumedBy||0) > 0 ? "good" : "bad";
  return `<span class="mb ${effCls}" title="tool 效率 = 被下游消费 ${t.consumedBy||0} 次 ÷ 成本 ${(t.cost||0).toFixed(2)}（token千分位 + 时延分钟 + 打回×5 + 重试×2）；${t.runs||0} 次派发 / ${t.submits||0} 次交卷">效率 ${fmtEff(t.efficiency)}</span>`
       + (hit===null
          ? `<span class="mb" title="未采样到知识注入（本 tool 未声明 knowledge 或不装载）">命中 -</span>`
          : `<span class="mb ${hitCls}" title="上下文命中率 = 被产物真正引用的标尺/上游件 ${t.ctxUsed||0} ÷ 注入 ${t.ctxOffered}">命中 ${fmtPct(hit)}</span>`);
}
/* 本节点/本 tool 被项目 overlay 改写了吗（位置 / 内容配置）——改写理由来自补丁自身，不猜 */
function overlayHits(n, m){
  if (!OVERLAY || !Array.isArray(OVERLAY.patches)) return [];
  return OVERLAY.patches.filter(p=>{
    if (p.kind==="set-tool" && m && m.kit && m.op) return p.kit===m.kit && p.op===m.op;
    return p.id===n;
  });
}
/* 内容配置项（R5 §二）：旋钮表 = 声明 + 生效值 + 逐键来源；来源区分「tool 默认」与「被人/优化agent改过」 */
function configPaper(n){
  const rec = EFF && EFF.nodeConfig && EFF.nodeConfig[n];
  if (!rec || !rec.resolved) {
    const m = nodes[n]||{};
    if (!m.kit || !m.op) return "";
    return `<div class="paper"><div class="doc-h"><span>内容配置项</span><span>${m.kit}.${m.op}</span></div><div class="md">
      <p class="msg">本节点未能在生效编排中解析出 tool（kit 注册表里查不到 <code>${m.kit}.${m.op}</code>）。
      kit 注册表是配置声明的唯一事实源——查不到即无旋钮可调，请先修 <code>kits/${m.kit}/kit.json</code>。</p></div></div>`;
  }
  const r = rec.resolved, defs = r.defs||{}, vals = r.values||{}, src = r.sources||{};
  const SRC_ZH = {overlay:"项目覆盖", node:"本节点", op:"tool 默认", generic:"通用默认"};
  const hits = overlayHits(n, nodes[n]);
  const keys = Object.keys(defs);
  const rows = keys.map(k=>{
    const d = defs[k]||{}, v = vals[k], s = src[k]||"generic";
    let spec = "";
    if (d.type==="enum" && d.enum) spec = d.enum.join(" / ");
    else if (d.type==="number") spec = `${d.min!==undefined?d.min:"-"} ~ ${d.max!==undefined?d.max:"-"}${d.unit||""}`;
    else if (d.type==="boolean") spec = "开 / 关";
    else if (d.type==="array") spec = "列表";
    else spec = d.type||"";
    const changed = (s==="overlay"||s==="node");
    return `<div class="knob${changed?" chg":""}">
      <div class="kn-h"><code>${k}</code><span class="kn-v">${Array.isArray(v)?v.join("、"):String(v)}</span><span class="kn-s src-${s}">${SRC_ZH[s]||s}</span></div>
      <div class="kn-d">${d.desc||""}</div>
      <div class="kn-m">可选：${spec}${d.effect?` ｜ ${d.effect}`:""}</div>
    </div>`;
  }).join("");
  const unk = (r.unknownKeys||[]).length
    ? `<span class="k">⚠ 未识别键</span><span class="v">${r.unknownKeys.map(x=>`<code>${x}</code>`).join(" ")} <span class="msg">写了但不在声明表内——内核已显式回显而非静默忽略；请补声明或改正键名</span></span>`
    : "";

/* artifact@1 头部（规范 R4 §二）：版本与审核背景的唯一落点；正文不再承载这些。
   只认 artifact:1 的头部，解析顶层标量 + 一层嵌套（review）——与内核 asserts.ts 同口径。 */
function parseArtifactHeader(text){
  if (typeof text !== "string") return null;
  const m = /^\uFEFF?---\r?\n([\s\S]{0,3000}?)\r?\n---/.exec(text);
  if (!m || !/^\s*artifact\s*:\s*1\s*$/m.test(m[1])) return null;
  const kv={}, nested=[], list=[]; let sec=null;
  m[1].split(/\r?\n/).forEach(raw=>{
    if (!raw.trim() || raw.trim().startsWith("#")) return;
    const indent=/^\s+\S/.test(raw);
    let mm=/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(raw);
    if (mm){ if (indent && sec) nested.push([sec, mm[1], mm[2].trim()]); else { sec=mm[1]; kv[mm[1]]=mm[2].trim(); } return; }
    mm=/^\s*-\s*(.*)$/.exec(raw);
    if (mm) list.push([sec, mm[1].trim()]);
  });
  return {get:k=>kv[k], kv, nested, list,
          review: Object.fromEntries(nested.filter(x=>x[0]==="review").map(x=>[x[1],x[2]])),
          upstream: list.filter(x=>x[0]==="upstream").map(x=>x[1])};
}

function drawEdges(){

  for (const [instId, b] of Object.entries(moduleBand)){
    const caps = b.inst.caps || [], en = b.inst.capsEnabled || [];
    const bh = Math.max(maxR+NH+MG, MG+56+((b.inst.spine||[]).length)*(NH+GY));

  const cctx = condCtx();   // 一次求值上下文，全图共用

    if (!pos[e.from] || !pos[e.to]) continue;

      d = `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
      lx = tx+8; ly = my;
    } else {
      const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;
      d = `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      lx = mx; ly = sy-6;

    // 可见线自身不接事件（1.4px 热区点不中）——上叠一条 14px 透明命中路径（.edge-hit）
    s += `<path d="${d}" fill="none" stroke="#a89f90" stroke-width="1.4"${(e.when||role!=="flow")?' stroke-dasharray="5,4"':""} opacity="${active?0.9:0.35}" marker-end="url(#arw)" pointer-events="none"/>`;
    s += `<path class="edge-hit" data-e="${e.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"/>`;

  }

  });

  svg.querySelectorAll(".edge-hit[data-e]").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openEdgeDoc(p.dataset.e); });

  });
  svg.querySelectorAll("[data-linkid]").forEach(el=>{
    el.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openLinkPaper(el.dataset.linkid); });

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function bindVerdict(n){
  const g=document.getElementById("vg"), nn=document.getElementById("vn");
  if (!g) return;
  g.onclick=()=>{ RS.nodes[n].verdict="approved"; RS.nodes[n].status="done"; render(); openNodeDoc(n); };
  nn.onclick=()=>{
    const sts=(flow.stages||[]);
    const rootSel=document.getElementById("vroot");
    const rootId=rootSel?rootSel.value:(sts[0]&&sts[0].id);
    const ri=sts.findIndex(s=>s.id===rootId);
    RS.nodes[n].verdict="send-back"; RS.nodes[n].status="awaiting"; RS.nodes[n].root_cause_stage=rootId;
    (sts[ri].nodes||[]).forEach(nid=>{ if (RS.nodes[nid]) { RS.nodes[nid].status="pending"; RS.nodes[nid].round=(RS.nodes[nid].round||1)+1; } });
    const order=Object.keys(nodes);
    const ti=order.indexOf(sts[ri].nodes[0]||order[0]);
    order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
    render(); openNodeDoc(n);
  };
}
function openRerun(n){
  const m=nodes[n];

  const upstream=edges.filter(e=>e.to===n && !isBackEdge(e) && evalWhen(e.when,rcctx).active).map(e=>e.from);
  const stageOf={}; (flow.stages||[]).forEach(s=>(s.nodes||[]).forEach(x=>stageOf[x]=s.id));
  const myStage=stageOf[n];
  const preset=(RS.presets||{})[myStage]||"semi";
  const inputs={}; upstream.forEach(u=>nodeOutputs(u).forEach(f=>{ if(files[f]) inputs[f]="✓"; }));
  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,
    skill:m.skill||undefined, minitool:m.minitool||undefined, assist:m.assist||undefined,
    kit:m.kit||undefined, op:m.op||undefined, asserts:m.asserts||undefined, inputs:inputs,
    inputs_note: upstream.length ? "上游产物："+upstream.join("、") : "无上游",
    output:nodeOutputs(n)[0]||"(汇入下游)", preset:preset,
    parallel_with: Object.keys(pos).filter(x=>x!==n && nodes[x].stage===m.stage && pos[x][0]===pos[n][0] && nodes[x].kind!=="gate" && nodes[x].kind!=="srd"),
    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>
    <button class="tb" id="r-zero">本阶段从零重做</button><button class="tb" id="r-close">收起</button></div>
    <div class="task">${JSON.stringify(tp, null, 2)}</div>
    <div class="act"><span class="msg" id="rmsg" aria-live="polite">标记后由宿主 / 运行时消费。</span></div>`;
  drawer.classList.add("on");
  document.getElementById("r-from").onclick=()=>{ markRerun(n); openNodeDoc(n); };
  document.getElementById("r-zero").onclick=()=>{ const stg=(flow.stages||[]).find(x=>x.nodes&&x.nodes.includes(n)); if(stg&&stg.entry) markRerun(stg.entry); openNodeDoc(n); };
  document.getElementById("r-close").onclick=()=>drawer.classList.remove("on");
  function markRerun(t){
    RS.nodes[t]=RS.nodes[t]||{};
    RS.nodes[t].verdict="send-back"; RS.nodes[t].status="pending"; RS.nodes[t].round=(RS.nodes[t].round||1)+1;
    render();
  }
}

/* ---------- 产物管理：小说=逐章文档槽位；剧本=一份剧本多种格式 ---------- */
function openDeliverables(){
  navPush({type:"deliverables"});
  sel=null; selEdge=null; render();
  docReset(); dBack.style.display = navStack.length ? "" : "none";
  dTitle.textContent = "产物管理";
  const itNode = Object.entries(nodes).find(([n,m]) => m.iterate);
  const dlv = DATA.deliverables || [];
  const dlvLabel = f => f.replace(/^对外交付\//,"").replace(/^\d{2}-交付\//,"");
  const isTextFile = f => /\.md$/.test(f) && typeof files[f] === "string";
  const delivered = dlv.filter(f => f.startsWith("对外交付/"));
  const r6dlv = dlv.filter(f => /^\d{2}-交付\//.test(f));
  const other = dlv.filter(f => !f.startsWith("对外交付/") && !/^\d{2}-交付\//.test(f));
  let h = "";
  // 章节模式（小说）：iterate.first 个槽位
  if (itNode){
    const [n, m] = itNode;
    const it = m.iterate;
    const total = it.first || 1;
    h += `<div class="paper"><div class="doc-h"><span>章节文档 · ${zhTitle(m)}</span><span>⟲ ${it.unit} × ${total}</span></div><div class="md">`;
    for (let i = 1; i <= total; i++){
      const cand = (it.artifact || "章节正文/第{n}章.md").replace("{n}", i);
      const exists = files[cand] !== undefined || dlv.includes(cand);
      if (exists) h += `<div class="shelf-row" data-f="${cand}"><span class="no">${i}</span><span class="nm">${cand}</span><span class="go">打开 →</span></div>`;
      else h += `<div class="shelf-row" style="opacity:.55;cursor:default"><span class="no">${i}</span><span class="nm">${cand}（虚位，待成稿）</span><span class="go">—</span></div>`;
    }
    h += `</div><p class="msg">迭代节点「${zhTitle(m)}」每${it.unit}一个实例；来源：${it.over||"-"}。</p></div>`;
  }
  // 对外交付：md 可编辑；其他格式（docx/html）走服务器相对链接
  h += `<div class="shelf-cap">对外交付 · ${delivered.length}</div>`;
  h += delivered.map(f => f.endsWith(".md")
    ? `<div class="shelf-row" data-f="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">打开 →</span></div>`
    : `<div class="shelf-row" data-link="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">下载/打开 →</span></div>`).join("");
  // R6 模块交付：<NN>-交付/（flow@3 交付模块产物目录）
  if (r6dlv.length){
    h += `<div class="shelf-cap">模块交付 · ${r6dlv.length}</div>`;
    h += r6dlv.map(f => isTextFile(f)
      ? `<div class="shelf-row" data-f="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f)}</span><span class="go">打开 →</span></div>`
      : `<div class="shelf-row" data-link="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f)}</span><span class="go">下载/打开 →</span></div>`).join("");
  }
  if (other.length){
    h += `<div class="shelf-cap">其他格式</div>`;
    h += other.map(f => `<div class="shelf-row" data-link="${f}"><span class="no">附</span><span class="nm">${f}</span><span class="go">打开 →</span></div>`).join("");
  }
  // W-02 模块收敛交付件（io.output.file）：每模块一份成熟交付，置顶展示
  const mf = DATA.moduleFiles || [];
  const mfdlv = mf.filter(m => m.deliverable);
  if (mfdlv.length){
    h += `<div class="shelf-cap">模块收敛交付 · ${mfdlv.length}（每模块一份成熟交付，W-02）</div>`;
    h += mfdlv.map(m => {
      const f = m.deliverable;
      const row = isTextFile(f)
        ? `<div class="shelf-row" data-f="${f}"><span class="no">${String(m.id||"").replace(/^m/,"M")||"模"}</span><span class="nm">${f.split("/").pop()}<span class="msg">（${m.name}${m.audience?` → ${m.audience}`:""}）</span></span><span class="go">打开 →</span></div>`
        : `<div class="shelf-row" data-link="${f}"><span class="no">${String(m.id||"").replace(/^m/,"M")||"模"}</span><span class="nm">${f.split("/").pop()}<span class="msg">（${m.name}）</span></span><span class="go">下载/打开 →</span></div>`;
      return row;
    }).join("");
  }
  // 模块内幕：过程件默认折叠（乱的分析/思维链痕迹不再是第一眼），点开才见
  const mfproc = mf.filter(m => (m.process||[]).length);
  if (mfproc.length){
    h += `<details style="max-width:720px;margin:20px auto 0"><summary style="cursor:pointer;color:#8a8375;font-size:12px;letter-spacing:2px">模块内幕 · 过程件 ${mfproc.reduce((s,m)=>s+m.process.length,0)} 份（默认收起——要看推理过程再展开）</summary>`;
    h += mfproc.map(m => `<div class="shelf-cap" style="margin-top:12px">${m.name} · ${m.dir}/</div>`
      + m.process.map(f => isTextFile(f)
        ? `<div class="shelf-row" data-f="${f}"><span class="no">程</span><span class="nm">${f.split("/").pop()}</span><span class="go">打开 →</span></div>`
        : `<div class="shelf-row" data-link="${f}"><span class="no">程</span><span class="nm">${f.split("/").pop()}</span><span class="go">打开 →</span></div>`).join("")).join("");
    h += `</details>`;
  }
  if (!delivered.length && !r6dlv.length && !other.length && !mfdlv.length) h += `<p class="msg" style="max-width:720px;margin:20px auto">暂无交付件。</p>`;
  // 交付清单核对（规范 R4 §5.1 + R6 模块交付）：outputs 是唯一事实源；flow@3 的 outputs 按
  // module 键声明——展开为该模块全部带产物节点逐件核对；磁盘上没被任何声明认领的件显式告警
  const decl = (flow.outputs||[]).flatMap(o=>{
    if (o.path || o.node) return [{node:o.node, path:o.path||((nodes[o.node]||{}).output)||"", title:o.title||""}];
    if (o.module) return Object.entries(nodes)
      .filter(([,n]) => (n.module===o.module || n.stage===o.module) && n.output)
      .map(([id,n]) => ({node:id, path:n.output, title:(o.title ? o.title+" · " : "")+(zhTitle(n)||id)}));
    return [];
  }).filter(x=>x.path);
  h += `<div class="shelf-cap">交付清单核对 · flow 声明 ${decl.length} 件</div>`;
  h += decl.map(x => {
    const onDisk = dlv.includes(x.path) || files[x.path] !== undefined;
    return `<div class="shelf-row" data-node="${x.node}"><span class="no">${onDisk?"✓":"…"}</span><span class="nm">${x.title || zhTitle(nodes[x.node]||{})} <span class="msg">${x.path}</span></span><span class="go">${onDisk?"已产出":"待产出"} · 查看节点 →</span></div>`;
  }).join("");
  const unc = DATA.unclaimed || [];
  if (unc.length)
    h += `<p class="msg" style="color:#8c352c">⚠ ${unc.length} 个交付文件未在 flow 的 outputs 里登记，不会被任何节点认领：${unc.join("、")} —— 请补 <code>outputs[].path</code>（规范 R4 §5.1）。</p>`;
  dBody.innerHTML = h;
  dBody.querySelectorAll(".shelf-row[data-f]").forEach(r => r.addEventListener("click", () => openFileDoc(r.dataset.f)));
  dBody.querySelectorAll(".shelf-row[data-link]").forEach(r => r.addEventListener("click", () => window.open(r.dataset.link, "_blank")));
  dBody.querySelectorAll(".shelf-row[data-node]").forEach(r => r.addEventListener("click", () => select(r.dataset.node)));
  flashDoc();
  dBody.scrollTop = 0;
}

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);
      if(d!==null&&a!==null&&d!==a){
        const pair=charSpanPair(d,a);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${dHtml}</div>`);
      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }
  return out.join("");
}

function annoList(key){ RS.annos=RS.annos||{}; RS.annos[key]=RS.annos[key]||[]; return RS.annos[key]; }
function findWrapQuote(quote, aid){
  const tries=[quote.replace(/\s+/g," ").trim(), quote.trim().slice(0,20)].filter(x=>x.length>=4);
  const walker=document.createTreeWalker(dBody, NodeFilter.SHOW_TEXT);
  let node;
  while ((node=walker.nextNode())){
    if (node.parentElement && node.parentElement.closest(".anno-rail")) continue;
    for (const t of tries){
      const idx=node.textContent.indexOf(t);
      if (idx>=0){
        const r=document.createRange();
        r.setStart(node, idx);
        r.setEnd(node, Math.min(node.textContent.length, idx+t.length));
        const mark=document.createElement("span");
        mark.className="anno-mark"; mark.dataset.aid=aid; mark.title="批注";
        try{ r.surroundContents(mark); }
        catch(err){ try{ mark.appendChild(r.extractContents()); r.insertNode(mark); }catch(e2){ return null; } }
        return mark;
      }
    }
  }
  return null;
}
function placeBubble(key, a, markEl, note){

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

    h += `</div><p class="msg">恢复 = 该版本写回当前文档并保存；当前内容会先自动留档一份，不会丢失。</p></div>`;

    dBody.querySelectorAll("[data-hv]").forEach(b => b.addEventListener("click", async () => {
      const r2 = await fetch("/_kit/history?name=" + encodeURIComponent(b.dataset.hn) + "&view=" + encodeURIComponent(b.dataset.hv));

    dBody.querySelectorAll("[data-hr]").forEach(b => b.addEventListener("click", async () => {

function openNodeHistory(n){

function docKey(){ return curNav.type==="node" ? "node:"+curNav.n : curNav.type==="file" ? curNav.f : null; }
function ustate(key){ return undoStacks[key] || (undoStacks[key] = {stack: [], idx: -1}); }
function capturePapers(){
  return [...dBody.querySelectorAll('.docpaper')].map(pp => ({pg: pp.dataset.pg, md: dom2md(pp.querySelector('.md'))}));
}
function restorePapers(pages){
  for (const paper of dBody.querySelectorAll('.docpaper')){
    const pg = pages.find(x => x.pg === paper.dataset.pg);
    if (pg) paper.querySelector('.md').innerHTML = mdHtml(pg.md);
  }
  anchorAnnos(docKey());
}
function pushUndo(){
  const key = docKey(); if (!key) return;
  const pages = capturePapers();
  if (!pages.length) return;
  const st = ustate(key);
  const sig = JSON.stringify(pages);
  if (st.stack[st.idx] && JSON.stringify(st.stack[st.idx]) === sig) return;
  st.stack = st.stack.slice(0, st.idx+1);
  st.stack.push(pages);
  if (st.stack.length > 40) st.stack.shift();
  st.idx = st.stack.length-1;
}
let undoTimer = null;
function scheduleUndo(){ clearTimeout(undoTimer); undoTimer = setTimeout(pushUndo, 500); }
function undoDoc(){
  const key = docKey(); if (!key) return;
  pushUndo();
  const st = ustate(key);
  if (st.idx <= 0) return;
  st.idx -= 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
function redoDoc(){
  const key = docKey(); if (!key) return;
  const st = ustate(key);
  if (st.idx >= st.stack.length-1) return;
  st.idx += 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
