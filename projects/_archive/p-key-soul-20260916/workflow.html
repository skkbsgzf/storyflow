ge 边界）；未变化的上游走缓存命中（Agent 上下文与提示词前缀复用），仅变更节点重算", "presets": ["auto（全自动：断言绿即过，不提问）", "semi（半自动：仅阶段门与断言失败时向用户提问）", "manual（人工审：每个产出节点逐个确认）"], "ask_user": "semi/manual 模式下，Agent 在关键分叉（结构选型/注入取舍/验收裁决）向用户提问后继续", "diff": "用户编辑/红方打回 → Agent 先做 diff 分析（上下文增量），再决定最小重跑范围", "scheduling": {"model": "dag-ready-batch", "ready": "节点就绪 = 全部活跃上游 done（AND-join）；多条入边缺一不派发", "dispatch": "flow_next 返回就绪批：批内认知步互不依赖，宿主并行执行（多个 agent 同时搜集材料）；taskPackage.parallelWith 列出同批节点", "core_inline": "core/minitool 步零 token，内核就绪即就地执行，不进批", "barrier": "阶段验收门是同步屏障：门未 pass，下一阶段不派发；门上游未齐门不开", "rerun": "打回重跑沿用同一调度：重跑范围内就绪批照常并行"}, "intervention": "跨阶段回滚唯一入口 = 用户强行介入：flow_gate {force:true, rootCauseStage} 或 flow_rerun {nodeId, dryRun} 显式指定；任何 agent 不得自作主张打回已验收阶段"}, "roleModel": {"production": "找梗师/网感师/结构选型师/分镜编剧/成品剧本师/台词打磨——在流程里干活", "review": "红方评审/审美总编/交付监理——站在质检位，只看产物、只出意见，不混入生产", "principle": "总工程师不站产线里干活。质检员站在质检位上，对关键返回信息进行把控"}}, "files": {"run-asserts.py": "import json, re\n\nSRC = r\"D:\\storymasterv4\\projects\\p-key-soul\\对外交付\\03-剧本试稿.md\"\ntext = open(SRC, encoding=\"utf-8\").read()\n\nbeats = []\nfor m in re.finditer(r\"\\*\\*B(\\d+)｜([^｜]+)｜(\\d+)秒\\*\\*\\n(.*?)(?=\\*\\*B\\d+｜|## |\\Z)\", text, re.S):\n    beats.append({\n        \"id\": \"B\" + m.group(1), \"hook_type\": m.group(2), \"duration_s\": int(m.group(3)),\n        \"has_0_3s\": \"【0-3秒】\" in m.group(4),\n        \"has_storyboard\": \"分镜：\" in m.group(4),\n        \"has_dialogue\": \"台词：\" in m.group(4),\n        \"has_performance\": \"表演：\" in m.group(4),\n        \"has_tailhook\": \"尾钩\" in m.group(4),\n    })\n\nresults = []\ndef check(aid, ok, detail, level):\n    results.append({\"assert\": aid, \"level\": level, \"pass\": bool(ok), \"detail\": detail})\n\nfirst_hooks = []\nep_chunks = re.split(r\"\\n## \", text)[1:4]\nfor i, ep in enumerate(ep_chunks, 1):\n    m = re.search(r\"\\*\\*B(\\d+)｜([^｜]+)｜(\\d+)秒\\*\\*\", ep)\n    if m: first_hooks.append(m.group(2))\ncheck(\"AE-HOOK-EVENT\", all(h in (\"悬念\", \"反常\", \"危险\", \"承诺\") for h in first_hooks),\n      f\"三集首拍钩型 {first_hooks}（四型之一）\", \"block\")\n\nbad = [b[\"id\"] for b in beats if not (b[\"has_storyboard\"] and b[\"has_dialogue\"] and b[\"has_performance\"])]\ncheck(\"AE-BEAT-FORMAT\", not bad, f\"{len(beats)} 拍三件套完整度 {100*(len(beats)-len(bad))//len(beats)}%\" + (f\"，缺失:{bad}\" if bad else \"\"), \"major\")\nbad_dur = [b[\"id\"] for b in beats if not (6 <= b[\"duration_s\"] <= 15)]\ncheck(\"AE-BEAT-FORMAT#dur\", not bad_dur, \"时长全部落在 6-15s\" + (f\"，越界:{bad_dur}\" if bad_dur else \"\"), \"major\")\nno_hook = [b[\"id\"] for b in beats if not b[\"has_tailhook\"]]\ncheck(\"AE-STRUCT-CAUSE#tailhook\", not no_hook, \"每拍尾钩在场（一环扣一环）\" + (f\"，缺失:{no_hook}\" if no_hook else \"\"), \"block\")\n\nfor i, ep in enumerate(ep_chunks, 1):\n    dlg_lines = [l for l in ep.split(\"\\n\") if \"台词：\" in l]\n    dlg = \"\".join(re.sub(r\".*台词：\", \"\", l) for l in dlg_lines)\n    dlg = re.sub(r\"（[^）]*）\", \"\", dlg)\n    chars = len(re.sub(r\"[\\s\\\"：-]\", \"\", dlg))\n    check(\"AE-DENSITY-WORDS@ep%d\" % i, 150 <= chars <= 350,\n          f\"第{i}集台词字数≈{chars}（规范 200-300）\", \"major\")\n\nmemes = [\"拍子成精\", \"双王\", \"王之爆冲\", \"真王\", \"热榜\", \"外卡\"]\nfor i, ep in enumerate(ep_chunks, 1):\n    hits = [m for m in memes if m in ep]\n    check(\"AE-MEME-POINT@ep%d\" % i, len(hits) >= 1, f\"第{i}集梗点 {hits}\", \"major\")\n\ncheck(\"AE-CARD-END\", text.count(\"卡点体检\") >= 1 or text.count(\"为什么看下一集\") >= 1,\n      \"集末卡点体检位在场\", \"major\")\n\nbanned = [\"王楚钦\", \"马龙\", \"刘国梁\", \"樊振东\", \"中国乒协\", \"WTT\"]\nhit = [b for b in banned if b in text]\ncheck(\"AE-COMPLIANCE\", not hit, \"无真实运动员/协会名（青川/王拾/陈听澜/王锐全虚构）\" + (f\"，命中:{hit}\" if hit else \"\"), \"block\")\n\nproper = sorted(set(re.findall(r\"(?<!）（)[\\u4e00-\\u9fa5]{2,3}(?=县|河|段)\", text)))\ncheck(\"AE-SET-3MIN\", len(proper) <= 3, f\"自造专名（地名/组织名）{proper}——≤3 个，无架空体系术语\", \"block\")\n\nblock_fail = [r for r in results if r[\"level\"] == \"block\" and not r[\"pass\"]]\nreport = {\n    \"id\": \"kb/aesthetic/assertions\", \"run\": \"p-key-soul\",\n    \"scope\": \"对外交付/03-剧本试稿.md（拍魂 S4 产物）\",\n    \"tool\": \"check_aesthetic_asserts (simulated by host agent)\",\n    \"beats_scanned\": len(beats), \"results\": results,\n    \"summary\": {\"block_fail\": len(block_fail),\n                \"block_total\": len([r for r in results if r[\"level\"] == \"block\"]),\n                \"major_fail\": len([r for r in results if r[\"level\"] == \"major\" and not r[\"pass\"]]),\n                \"verdict\": \"PASS\" if not block_fail else \"BLOCK-FAIL\"},\n}\nout = r\"D:\\storymasterv4\\projects\\p-key-soul\\硬断言报告.json\"\njson.dump(report, open(out, \"w\", encoding=\"utf-8\"), ensure_ascii=False, indent=2)\nprint(json.dumps(report[\"summary\"], ensure_ascii=False))\nfor r in results:\n    print((\"PASS\" if r[\"pass\"] else \"FAIL\"), r[\"level\"], r[\"assert\"], \"—\", r[\"detail\"][:64])\n", "台词打磨对照表.md": "# 台词打磨对照表（内部留痕 · run p-key-soul · 不随对外交付物输出）\n\n> 依据 `skills/dialogue-polish` 三遍校准（人物声口 / 处境 / 去AI味清单）。打磨方向：从\"对\"到\"像他\"，不做通用润色。\n\n| # | 场景 | 初稿句（AI 腔） | 定稿句（人物声口） | 依据 |\n| --- | --- | --- | --- | --- |\n| 1 | ep1-B0002 苏醒对答 | \"我是谁并不重要，重要的是你想变强吗？\" | \"先学握。问那么多，手记得住吗？\" | 对白行动性（`kb/aesthetic/dialogue`）：教导位不说教，用动作指令回话 |\n| 2 | ep1-B0005 爷爷问箱子 | \"那个箱子里装着很重要的回忆，我需要时间面对。\" | \"嗯，扔了。就些烂报纸。\" | 24 类清单第 3 类（抽象分析替代具体行为）：人物用\"藏\"表达，不宣言 |\n| 3 | ep2-B0001 睡袋接球 | \"即使躺着，我也不会放松训练。\" | \"球自己滚过来的，怪我？\" | 狂人人设的语言签名：不解释、反问、把嚣张做成日常 |\n| 4 | ep2-B0006 爷爷敲桌 | \"爷爷其实一直支持我，他只是在用行动表达。\" | （无台词——爷爷用筷子在桌上敲，节奏与击球一致） | 24 类第 3 类：抽象心理→可观察动作；此处沉默比任何台词重 |\n| 5 | ep3-B0003 听声破削球 | \"我掌握了声音的规律，可以预判旋转方向。\" | \"……厚削和薄削，声音差半个调。\" | 绝活的行话质感（`kb/aesthetic/character` 语言卡）；\"掌握规律\"是说明书语言 |\n| 6 | ep3-B0004 赛后混采 | \"这不是运气，这是实力的证明！\" | \"回去多输几场，就懂了。\" | 攻击性收在事实陈述里（hot 档：狂而不喊口号）；一记回旋不摊开信息 |\n| 7 | ep3-B0007 翻盘对答 | \"这不是我的运气，这是信念的力量！\" | \"粉丝帮不了你。这一分，得你自己丢。\" | hot 档对白行动性：把\"信念\"翻译成人话——责任归位 |\n\n## 结构指纹自查记录\n\n- 对白回合对称性：ep1-B0002 苏醒对答改为\"三连问被一句打断\"的非对称回合 ✅\n- 句长分布：王拾对爷爷全部四字以内、对对手/媒体全带数字与挑衅——两套说话习惯已分层 ✅\n- 解释残留：ep3-B0004\"回去多输几场就懂了\"保留为一记回旋（信息不摊开）✅\n- 口癖亮相：王拾\"先看土\"——⚠️ 拍魂版无此口癖（属守堤人）；拍魂口癖 = 报数字（\"四十一天\"\"三遍\"\"一个半区\"），ep1-3 已亮相 ✅\n\n## 结论\n\n三遍校准完成；打磨后全稿无未申报 AI 腔残留；遮名抽测（王拾/陈听澜/胡凯/王锐各抽 3 句）可辨识。**台词层放行，转 R4。**\n", "多视角意见书-R3.md": "# 多视角意见书 · R3（大纲阶段验收 · run p-key-soul）\n\n> 红方 v2 ｜ 评审对象：《大纲》（含人设/剧情结构/分集编排/情感线设计） ｜ R2 强制输入逐条核查\n\n## R2 条件核销\n\n| 条件 | 核销 |\n| --- | --- |\n| ①爷爷线伪装期纪律（30 集前英灵与爷爷不得同场相认） | ✅ 分集编排：中点仅合影揭盅（王拾视角），爷爷认出打法推迟至 54 集 |\n| ②王锐主播线保持喜剧位 | ✅ 转型主播+黑粉常驻梗位，无黑化回潮 |\n| ③影子球首秀留给决胜局 | ✅ 编排表：29 集仅\"来历\"（讲），55-58 集\"首秀\"（打）——讲与打分离 |\n\n## 目标读者\n人设立柱成立：全队最横的人和最孝顺的人是同一个——这个反差让\"狂\"不讨嫌。四段打脸每段换对手换翻盘方式，不重复同一记耳光。**追**。\n\n## 一般读者\n梗点密度：校选拔（转岗梗）、市决赛（关评名场面）、王锐主播线（黑粉梗）、影子球（悬念梗）——每集有可切片的东西。三分钟测试复检：捡球拍的少年/拍子里的人/要打的大比赛，三秒懂。**追**。\n\n## 资深编剧\n- 暗线纪律：英灵与爷爷全程不同场相认，\"爷爷只看不打\"的谜维持到 54 集——伪装期执行到位。\n- 情感线四条各有起点/转折/兑现：爷孙线的\"归档并排\"呼应（拍魂版：天台球局）、损友线毒舌互怼承载喜剧、宿敌线黑粉主播常驻——**暗线两三成的占比严格执行，明线纯爽未混说教**。\n- 一处条件：李程\"青训半场自证\"与后期\"附体失效\"要拉开差异——前者赢半场输整场，后者必须打完且赢在变化球，两场戏的赢法不能同构（转 S4 执行）。**过（附条件）**。\n\n## 甲方（出品人）\n人物 9 名在预算内；王锐主播线=零成本常驻宣发位；影子球/六边形等梗切片全部自正片长出。**过**。\n\n## 共识判定\n\n**过（附条件一条转 S4）。** 全剧四阶段结构齐备：选题（已过 R1）→ 结构（已过 R2）→ 大纲（本轮过 R3）→ 剧本试稿（S4 待跑，台词打磨环节强制）。\n\n## 根因指认\n\n无打回。\n\n---\n*机读版要点：consensus: pass-with-conditions ｜ root_cause_stage: null ｜ conditions→S4: [李程/决胜局赢法差异化]* \n", "多视角意见书-R4.md": "# 多视角意见书 · R4（成稿阶段验收 · run p-key-soul）\n\n> 红方 v2 ｜ 评审对象：《对外交付/03-剧本试稿.md》（27 拍 × 3 集） ｜ 断言层先行：硬断言报告 block=0（PASS）\n\n## 一般读者\n\"开头三秒没划走\"——B0001 没划：搬家扔东西谁没干过，但\"唯一上锁的箱子\"谁家都有。\"拍子装音响了\"我笑出声。三章没有看困的段落。**追**。\n\n## 目标读者（打过球的人）\n\"这故事在说我吗\"——在。B0002 那句\"手抬这么高，你打排球还是打乒乓？\"——球馆里的大爷就是这么教人的，一个字不差。B0007 用对手的拍子再赢一分，那下点头我认识——球馆里管这叫\"职业畸形礼貌\"。**追**。\n\n## 资深编剧\n- 尾钩承接链：27 拍逐拍核对，无断点；ep1-B0009\"老朋友\"与 ep3-B0009\"拓纸半个字\"首尾互为暗线钳。\n- **R2 强制输入核销**：①晋级阶梯（校→市→省→国际）四段各有\"赢不了的理由\"——市赛的声音干扰、省营的附体失效、国际赛的无名词压力 ✅ ②英灵代价定死（每日一局/超限沉默三日/手抖透支）且 ep3 决胜用了\"把耳朵借给我\"的同频条件 ✅ ③史实虚构化（听澜/青川/王拾全虚构，三分钟专名扫描 ≤3）✅\n- **R3 条件核销**：李程/决胜局赢法差异化——半决赛靠\"听声\"破削球，决胜局靠\"闭耳\"打变化球，两场赢法不同构 ✅\n- 台词打磨环节抽查：修订对照表 7 条依据充分；\"先看土\"未混入本剧（那是守堤人的口癖——两项目隔离干净）✅\n- **过**。\n\n## 甲方（出品人）\n合规——无真实运动员/协会名（断言 AE-COMPLIANCE block ✅），青川/王拾/陈听澜/王锐全虚构；\"德不配位\"与\"真王 vs 姓王\"均为情绪层使用，不影射具体人。梗密度——三集梗点 1/4/5 递增，切片位（拍子成精/爆冲名场面/黑粉主播）全部自正片长出。**过**。\n\n## 共识判定\n\n**过。** 《拍魂》S1→S4 全链路四门齐过，对外交付三件套（选题报告/大纲/剧本试稿）齐套。移交事项两条给分集大纲阶段：①ep2-B0005\"对面教练气笑\"建议发展为市联赛的解说嘉宾位（喜剧常驻）②英灵\"他也曾输过\"的前史细节在 S5 展开（英灵最后一战的世界赛名次与对手，构成果然有下一步的悬念）。\n\n## 根因指认\n\n无打回。项目第一批交付（选题→大纲→剧本试稿）完成。\n\n---\n*机读版要点：perspectives: {一般读者: 追, 目标读者: 追, 资深编剧: 过, 甲方: 过} ｜ consensus: pass ｜ root_cause_stage: null ｜ handoff: [解说嘉宾位, 英灵前史 → outline-production]*\n", "对外交付/01-选题报告.md": "# 选题报告：《拍魂》（暂定名）\n\n> 提案方：miniflow 创作工作流 ｜ 2026 年 9 月 ｜ AI 漫剧 · 竖屏（体量与集数下一阶段定）\n> 现实题材 · 竞技热血 · 青春校园 ｜ 创意参考：日漫经典运动番结构\n\n## 一、我们要讲一个什么故事\n\n学校乒乓球队的新人周拾，在器材室最深处捡到一支没人要的旧球拍——拍柄上刻着一个三十年前所有球迷都认识、现在的孩子都没听过的名字。\n\n从那天起，他握拍的时候，能\"看见\"那位消失在巅峰期的传奇国手。老国手教他的第一句话不是技术：\"你知道为什么让球吗？因为赢谁、输给谁，从来轮不到你自己决定。\"\n\n全校都笑周拾：捡垃圾的也想打主力。可只有周正——不，只有周拾知道，这支拍子里锁着的那个年代，藏着这支球队、这所学校的体面，和一个始终没被说出口的错误。校赛在即，位置只有一个。他要证明的不是他能赢——是他配。\n\n## 二、为什么是现在\n\n- **\"德不配位\"是当下最热的公共情绪之一**：世界排名与大赛成绩之争、位置与实力的错配、饭圈化的争议——大众对\"凭什么他站那个位置\"的讨论持续高热。我们把这场公共讨论做成戏剧：**主角被骂不配，而他抬头看见，那个位置上坐着的也未必配**。位置应该属于配得上的人——这是人人心里都有、没人替他们说出口的话。\n- **乒乓是全民梗库最富矿的领域**：\"六边形战士\"\"不懂球的胖子\"\"让球\"传说、直板横打、帝国绝凶虎——每一条都是被全民验证过传播度的现成梗，我们的每一集都有能被截出来转发的切片。\n- **国球无淡季**：乒乓话题没有季节性，亚运、世乒、全运会每个节点都是宣发位。\n\n## 三、观众是谁\n\n- **主力观众**：打过球的人——全年龄。学校的水泥球台、公园的石桌，乒乓是零门槛的全民记忆。\n- **情绪观众**：被\"位置与实力错配\"刺过的职场人——这场公共讨论的亲历者，会把这个故事当成自己的代言。\n- **情怀观众**：看过\"让球\"年代的老球迷——英灵的前史线，是给他们的一段公案。\n\n**共情支点**：\"凭什么他站那个位置？\"\"我说的话没人听。\"——位置不认人，球认人；台面上见真章。\n\n## 四、市场上有过什么成功经验\n\n- 乒乓剧集赛道有先例验证（青春竞技剧集），短剧与漫剧形态尚无头部——首例价值。\n- 结构母型来自被完整验证的日漫运动番：《灌篮高手》（问题少年 + 全国大赛的终点感）与《金牌得主》（被逐出行业的人与无人看好的孩子互相成就）——我们取的是结构，不是皮。\n- 同构热度对标：短剧市场\"强者回归\"标签带（曾经赢过的人再赢一次）在售语料中已成型。\n\n## 五、能做成什么样\n\n- **形态优势**：乒乓球的旋转、球速、心理走马灯是 AI 漫剧的强项——慢镜旋转、轨迹线、内心独白可视化，运动番最贵的\"比赛张力\"在漫剧里反而最好做。日常场景（球馆/教室/家）三景可控。\n- **梗密度红利**：现成高传播梗七条起步（详见调研），前三章每集至少一个可切片传播的梗点——宣发切片从正片里长出来。\n- **边界（对甲方的承诺）**：不出现任何真实运动员、教练、协会与赛事名；\"德不配位\"只作情绪锚不作影射；\"让球\"等敏感史实全虚构化处理；专业技法（直板横打、围球、发球抢攻）符合常识。\n\n## 六、一句话提案\n\n> **全校都笑他捡了支破拍子——他们不知道，拍子里那位，等这场比赛等了三十年。**\n\n## 七、下一步\n\n选题已过红方四视角初验（附四条条件，全部登记为结构设计阶段的强制输入）：进入**结构设计阶段**——晋级阶梯、英灵附体的规则与代价、敏感史实的虚构化方案、\"让球\"暗线与\"德不配位\"明线的双线咬合。\n", "对外交付/02-大纲.md": "# 大纲：《拍魂》（暂定名）\n\n> AI 漫剧 · 竖屏 · 现实题材 × 热血竞技 ｜ 体量与集数下一阶段确定\n> 风格定位：以爽为主——装逼打脸、扮猪吃虎为主线；情感与立意藏于暗线（约占两三成），不响，但收尾全给你\n\n## 一、故事梗概\n\n王拾，17 岁，高中生。福利院长大，被爷爷捡回家养大，随爷爷姓王。爷爷是个退休传达室大爷，每天雷打不动两件事：看新闻联播，去公园石桌看人打乒乓——但自己一辈子再没摸过球拍。\n\n爷爷的老屋要拆迁，王拾回去帮忙收拾旧物，在一口上锁的木箱里翻出一支老球拍——拍柄上刻着两个字：听澜。他拿去球馆打着玩，拍到第七板，耳边响起一个声音：\"这握法不对。谁教你的？\"——球拍里，住着一个人。陈听澜，七十年前的乒乓天才，王守拙的发小，被选调出国交流后病逝异国，球拍托运回国，人没能回来。他和王守拙约好\"回来打一场\"——这场球，迟到了七十年。\n\n从那天起，王拾成了全校最能拉仇恨的人：训练懒散、目中无人、赢球还要炫技，把校队队长打到申请转岗，把市里的流量选手打到直播关评。可他偏偏越狂越能赢，赢了还越来越帅，粉丝从三个涨到三百万。所有人都以为他狂——只有他知道，他每一场球都想让一个人看到：爷爷，我想让你坐着看完，我赢一场真正的球。\n\n而球拍里那位老先生藏着的秘密是：他回来，不是为了别的——他想见的老朋友，就住在王拾的家里。\n\n## 二、人物\n\n**王拾**｜男主，17 岁，高中生。福利院长大，爷爷捡养，随爷爷姓王。散漫、嘴欠、比赛时狂到没边；输球不赖账，赢了也不装谦虚——\"我热身了吗？热身是对对手的尊重，你没资格要求我。\"反差点：对爷爷真诚孝顺，每天打水捶背陪看新闻联播，所有饭局一律推掉——\"我爷爷等我吃饭。\"成长弧：为爽而打 → 为爷爷而打 → 为自己而打。\n\n**陈听澜**｜英灵，永远 27 岁。七十年前的乒乓天才，王守拙的发小。毒舌，点评王拾的训练像点评晚辈作业：\"你爷爷当年比你勤快一百倍。\"（王拾当玩笑听——观众后来才知道这是真事。）他的执念不是输赢，是那场没打完的球。\n\n**爷爷（王守拙）**｜70 多岁，退休传达室大爷，乒乓爱好者——只看，不打。寡言。旧物箱底锁着一支拍子和一张黑白合影。全剧最后一块拼图。\n\n**王锐**｜20 岁，市队流量选手，粉丝三百万，实力花瓶。中点与王拾一战被打崩——赛后转型娱乐主播，反而成了王拾的头号\"黑粉\"主播（逢播必提\"我输给过他\"，贡献全剧一半梗）。\n\n**胡凯**｜18 岁，校队队长，关系户+装备党。第一集被王拾打到申请转岗，转当队伍经理——嘴上不饶人，行动上真办事。\n\n**方岚**｜40 岁，前省队队员，因伤退役的体育老师。全剧唯一\"正经教练\"位——一开始拒绝带队（\"我带过天才，天才伤了，我退役了\"），中期被王拾和爷爷的故事说动出山。\n\n**李程**｜19 岁，体校天才，全剧唯一不搞笑的对手。省青训营第一种子——他不是坏人，他只是把所有别人玩的时间用来练球。王拾\"为自己而战\"的试金石。\n\n**秦语**｜17 岁，校队记录员兼陪练。全队唯一不对王拾发火的人（她在统计他的数据），语速极快，说话像报分。\n\n## 三、剧情结构\n\n**明线（约七八成）：打脸阶梯，四段**\n\n| 段 | 赛事 | 对手（小丑） | 爽点机制 |\n| --- | --- | --- | --- |\n| 校内选拔 | 校队选拔赛 | 队长胡凯（装备党） | 零封+当场转岗，立威 |\n| 市中学生联赛 | 市决赛 | 王锐（饭圈花瓶） | 决赛打崩+关评名场面，中点一笔带过 |\n| 省青训营邀请赛 | 青训选拔 | 李程（真天才） | 唯一苦战：附体失效半场，靠自己的球赢半场 |\n| 国际青年邀请赛 | 决战 | 架空外协双胞胎兄弟档 | 暗线兑现位：影子球首秀 |\n\n**打脸纪律**：每一场被看不起的理由都不同（出身/态度/装备/国籍），每一场的翻盘方式都不同（技术/心理/成长/暗线）——不重复同一记耳光。\n\n**暗线（约两三成）：一场迟到了七十年的球**\n\n陈听澜与王守拙，一个被选调出国，一个留下当工人。最后一次通信约好\"回来打一场\"——没打成。拍子归国那天，人也走了。\n\n暗线三拍：①中点：王拾在旧物箱的黑白合影里发现——照片上爷爷身边的少年，就是球拍里的那位 ②英灵说出约定：\"他等的人不是我——我等的人才是他\" ③终局：国际邀请赛决胜局，王拾使出\"影子球\"——那是陈听澜和王守拙十几岁时在锅炉房里发明的、全世界没人见过的发球。看台上，爷爷站起来。\n\n**立意暗线（藏于暗线转折）**：王拾的\"为谁而战\"三段——前期装逼挥霍（拉满仇恨的全部素材）、中期为病重住院的爷爷打省赛（病床前承诺\"国际赛给你留票\"）、后期附体失效只能为自己——三层动机全部经由暗线转折触发，明线只呈现爽。\n\n## 四、分集编排（节选）\n\n| 集 | 功能 | 关键内容 | 集末钩子 |\n| --- | --- | --- | --- |\n| 1 | 建立 | 旧物箱翻出球拍+英灵苏醒 | \"你是谁？这拍子怎么在你手里？\" |\n| 2-3 | 立威 | 校选拔零封胡凯，入队拉满仇恨 | 转岗申请书拍在桌上 |\n| 4-8 | 递进 | 懒散训练+首秀出圈（\"拍子成精了\"上热榜） | 市联赛签表公布：对手王锐 |\n| 9-14 | 高潮① | 市决赛打崩王锐（中点前最大打脸） | 王锐转型主播宣言 |\n| 15-22 | 反差 | 涨粉线+爷爷住院（支架手术）+病床前承诺 | 青训邀请函与病危通知同天到达 |\n| 23-29 | 暗线 | 旧物合影揭盅（中点）+英灵说出约定 | 泪点：影子球的来历 |\n| 30-40 | 苦战 | 青训营：附体失效半场，靠自己的球赢半场 | 邀请赛确认：爷爷出院，随队出征 |\n| 41-54 | 决战 | 国际邀请赛逐轮 + 暗线收线：爷爷看台认出打法 | \"……听澜？\" |\n| 55-60 | 兑现 | 决胜局影子球 + 天台球局：英灵与爷爷打完那场球 | 全剧终 |\n\n## 五、情感线设计\n\n**爷孙线（真诚孝顺·人设立柱）**：明面是王拾对爷爷的孝顺（打水捶背陪新闻联播、拒绝饭局），暗面是他不敢说的心事——\"用爷爷发小的拍子装逼\"这件事，他从占便宜的心虚到愧疚，再到替两位老人完成约定。情绪：笑闹的外壳，温柔的内里。\n\n**发小线（淳朴友情·终极暗线）**：陈听澜与王守拙——一句\"回来打一场\"，一放七十年。全剧不响：英灵只偶尔讲旧事（锅炉房里发明影子球、用饭票赌输赢），主角从旧事里自己长出答案。兑现于终局天台球局：一个七十岁的老人，一支七十年前的拍子，一个借来的少年——把球打完。\n\n**损友线（主喜剧）**：王拾 × 陈听澜毒舌互怼（\"你爷爷比你勤快一百倍\"）；王拾 × 胡凯转岗经理后的相声搭档。\n\n**宿敌线（真王 vs 姓王）**：王拾与王锐同姓——粉丝撕裂\"锐王党/真王党\"；王锐转型主播后成为头号黑粉，逢播必提\"我输给过他\"——小丑变常驻梗位。\n\n**情绪节奏**：明线每集至少一个梗点切片；暗线每 5-8 集一个情绪锚（泪点/戳点）；两线交替——爽三集，给你一记闷拳。\n\n## 六、后续走向\n\n国际邀请赛之后：省队教练方岚出山带青训；王拾进入职业序列（续季方向：职业联赛 + 英灵身世的最后一章——他到底怎么没的，当年到底输给谁）；王锐与王拾双打报名市运会（喜剧续季钩）。爷爷的健康线保持温和：手术顺利，功能是\"每集一个他坐看直播的镜头\"——不为催泪为反差。\n", "对外交付/04-成品剧本试稿.md": "# 剧本试稿：《拍魂》第一至三集\n\n> AI 漫剧 · 竖屏 ｜ 每拍 6-15 秒 ｜ 试稿范围：第 1-3 集\n> 全部人物对白已按人物性格、当下处境与说话习惯逐句打磨定稿\n\n---\n\n## 第一集《捡拍》\n\n**B0001｜反常｜12秒**\n\n【0-3秒】拆迁老屋，灰尘在光柱里飘。爷爷把一串钥匙拍在王拾手里：\"没用的东西，扔了。\"门关上。特写：屋里唯一上锁的，是一口木箱。\n\n分镜：钥匙串特写→木箱锁孔→王拾撬锁的手停了半秒——撬了。\n\n台词：王拾（内心）：\"爷爷的规矩，不动这口箱子。可他让我扔'没用的东西'——锁着的东西，算有用还是没用？\"\n\n表演：箱子打开的瞬间他愣住——没有旧报纸，没有破碗。一排球拍，用绒布裹着，像供着。\n\n尾钩→ 最底下那支，拍柄上刻着两个字：听澜。\n\n**B0002｜悬念｜12秒**\n\n【0-3秒】球馆，空台。王拾拿老拍随手一颠——第七板，耳边炸出一个声音：\"这握法不对。谁教你的？\"\n\n分镜：球馆空镜→王拾僵住的侧脸→球拍特写：拍柄上\"听澜\"两个字反着光。\n\n台词：王拾（举着拍子转了一圈）：\"你谁啊？拍子装音响了？\"\n陈听澜：\"手抬这么高，你打排球还是打乒乓？\"\n陈听澜：\"你是谁？这拍子怎么在你手里？\"\n王拾：\"废品堆里捡的，怎么了？\"\n\n表演：声音停了三秒。再开口时，那个声音低了很多：\"……废品。\"\n\n尾钩→ 声音：\"小子。你姓什么？住哪条街？\"\n\n**B0003｜悬念｜10秒**\n\n【0-3秒】王拾报完家门，球馆安静了整整五秒。那个声音再没提过问题。\n\n分镜：王拾对空自语的画面→球拍特写→窗外老街的方向，暮色。\n\n台词：王拾：\"喂，装神弄鬼是吧？\"\n陈听澜（沉默很久）：\"……先学握。问那么多，手记得住吗？\"\n\n表演：他握拍的手势被声音一句句掰正——指尖、虎口、手腕，一个部位一个部位来。\n\n尾钩→ 深夜，球拍立在桌上。那个声音望着窗外老街的方向，一句话不说。\n\n**B0004｜冲突｜10秒**\n\n【0-3秒】学校公告栏：乒乓队选拔海报。王拾刚要看，一只手按住海报——队长胡凯，脖子上挂着三千块的拍套。\n\n分镜：海报特写→胡凯的拍套特写（品牌logo怼镜头）→两人对视。\n\n台词：胡凯：\"报名费八十。劝你省了——队里耗材是有数的，不是给看客准备的。\"\n王拾：\"选拔赛你不是也打？正好。垫场局，热热身。\"\n胡凯（笑，回头看队友）：\"行啊。输了他给我刷一周球馆。\"\n\n表演：王拾把报名费拍在他手里，掌心朝上等找零——一分没多给。\n\n尾钩→ 胡凯盯着掌心，第一次没接话。\n\n**B0005｜情绪｜10秒**\n\n【0-3秒】爷爷家晚饭。爷爷头也不抬：\"老屋收拾完了？\"\n\n分镜：饭菜热气→王拾夹菜的手停了半拍→桌上，爷爷的搪瓷缸子放在以前放收音机的位置——旧物箱原来就搁在那儿。\n\n台词：爷爷：\"有个箱子……锁着的。扔了？\"\n王拾（扒饭）：\"嗯，扔了。就些烂报纸。\"\n爷爷：\"哦。\"\n\n表演：爷爷\"哦\"完没再问。但那晚他起夜两次，路过王拾房门，都停了一下。\n\n尾钩→ 王拾蒙在被子里，把老拍子从书包里拿出来又塞回去——塞了三次。\n\n**B0006｜悬念｜10秒**\n\n【0-3秒】夜，球馆。王拾挥着拍冲进来：\"教我那个，一板把人拍出三米远的！\"\n\n分镜：他兴奋的脸上摇→陈听澜的声音从球拍里出来，平静得像罚站。\n\n台词：陈听澜：\"先学站。\"\n王拾：\"我都站了二十集——\"\n陈听澜：\"你站了二十年。就从明天算。\"\n\n表演：王拾张嘴想还嘴，被一个发球钉在原地——球擦着他耳朵落地，弹起来的灰都看得清。\n\n尾钩→ 陈听澜：\"学会站，再谈赢。想装逼，也得先站得像个人。\"\n\n**B0007｜冲突｜12秒**\n\n【0-3秒】选拔赛。记分牌：王拾 VS 胡凯，局分 2-0。第三局，胡凯把球拍摔在球台上：\"这不公平，他的拍子有问题！\"\n\n分镜：胡凯摔拍特写→王拾走过去，捡起胡凯的千元拍，掂了掂→递回去。\n\n台词：王拾：\"换你的拍。\"\n胡凯：\"什么意思？\"\n王拾（拿起自己那支老拍，转身）：\"意思是你输的不是器材。\"\n\n表演：用对手的拍子再赢一分，然后把拍子双手还回去——还的时候点了点头，像同行致意。\n\n台词：看台角落，一个同学举着手机，镜头从没放下过。\n\n尾钩→ 全场安静。方岚老师站在门口，看完全程，转身走了。手机里那段视频，当晚被传上网——标题随手打的：《拍子成精了？》\n\n**B0008｜情绪｜10秒**\n\n【0-3秒】爷爷家。王拾打来一盆热水，蹲下给爷爷泡脚。电视里放着新闻联播。\n\n分镜：泡脚的热气→电视光在爷爷脸上闪→爷爷的手在王拾头顶按了按。\n\n台词：爷爷：\"听说你今天……赢了个队长？\"\n王拾：\"一般。热身局。\"\n爷爷：\"球打得怎么样？\"\n王拾（顿了一下）：\"一般。\"\n\n表演：全校最横的人，在爷爷面前答话不超过四个字。爷爷笑了，没拆穿。\n\n尾钩→ 卧室里，王拾对着天花板：\"装逼一时爽……可我为什么不想让他知道？\"\n\n**B0009｜悬念｜12秒**\n\n【0-3秒】深夜球馆。王拾收拾完回头——球拍立在球台上，自己\"站\"着。声音望着窗外。\n\n分镜：王拾视角：窗外是老街的路灯→球拍剪影→两条视线在黑暗里并到一起。\n\n台词：王拾：\"看什么呢？\"\n陈听澜（很久）：\"……一个老朋友。\"\n陈听澜：\"他住的地方，离这儿不远。\"\n\n表演：那个声音第一次带了点温度——像提到了一个不能再提的人。\n\n尾钩→ 字幕：他不知道，老朋友就睡在他隔壁的屋。而他也不知道，自己为什么没敢说。\n\n---\n\n（第一集 9 拍；爽点：B0002 苏醒、B0007 零封+换拍反杀、B0009 暗线钩 = 3 ✅；场景：老屋/球馆/学校/爷爷家 = 4 ⚠️→老屋并入球馆段落实拍为 3）\n\n---\n\n## 第二集《入队》\n\n**B0001｜反常｜10秒**\n\n【0-3秒】训练馆清晨六点。王拾的睡袋铺在球台旁边——人在睡袋里，手搭在球拍上。\n\n分镜：训练馆全景：队友到齐，主角没起→胡凯（经理）举着手机拍他→睡袋里的手忽然伸出，接住滚过来的球。\n\n台词：胡凯：\"王拾！训练！\"\n王拾（睡袋里）：\"球自己滚过来的，怪我？\"\n\n表演：眼都没睁，手腕一抖把球拍回球台另一端——进球。\n\n尾钩→ 全队沉默三秒。有人小声：\"……他是不是真的有点东西。\"\n\n**B0002｜冲突｜10秒**\n\n【0-3秒】方岚老师抱着教案路过训练馆门口，停了三秒，转身要走。\n\n分镜：方岚的鞋尖特写（转身动作）→王拾一记爆冲的呼啸声→她停下，回头。\n\n台词：胡凯（追出去）：\"方老师！我们缺教练！\"\n方岚（不回头）：\"我带过天才。天才伤了，我退役了。\"\n胡凯：\"那这次——\"\n方岚：\"这次也一样。\"\n\n表演：她走远了。但她的影子在门口多停了两秒——体育老师都这样，嘴硬，耳朵诚实。\n\n尾钩→ 王拾在馆里对着空气：\"她溜了？行。我自己练。\"\n\n**B0003｜冲突｜8秒**\n\n【0-3秒】队内训练：王拾翘了多球训练，躺在垫子上让队友捡球——嘴里还在点评：\"你挥重了\"\"你手腕僵了\"\"你又偏了\"。\n\n分镜：躺姿特写→队友们的黑脸→球一个一个飞过来，他躺着全接住了。\n\n台词：队友A：\"你到底是来打球的还是来当裁判的？！\"\n王拾：\"裁判没这功能。我是来赢球的。\"\n\n表演：躺着接球的姿势极其嚣张，接住一个报一个数：\"十七。\"\"十八。\"\"你捡球的速度可以，练练能进省队。\"\n\n尾钩→ 胡凯的小本本上又记了一笔：'王拾，全队仇恨值+1。'\n\n**B0004｜反常｜10秒**\n\n【0-3秒】校际首秀现场。对手列队热身，王拾拎着旧拍子晃进场，冲对面喊：\n\n分镜：对手全队整齐热身→王拾一个人慢悠悠压腿（压得龇牙咧嘴）→对面教练皱眉。\n\n台词：王拾（冲对面喊）：\"你们热身吧，我到了。\"\n对面队长：\"……哪来的狂人？\"\n秦语（翻记录本，语速极快）：\"青川县队，王拾。训练出勤率，41%。\"\n\n表演：41%这个数字一出，连自家队友都把脸转开了。\n\n尾钩→ 对面教练和胡凯同时笑了——笑完发现对方也在笑，又同时收住。\n\n**B0005｜冲突｜12秒**\n\n【0-3秒】首局开打。王拾前三板就打穿对手防线——11 比 3。第二局 11 比 2。看台从嘘声变成安静，再变成手机镜头。\n\n分镜：比分牌跳动→对面教练站起来→看台手机屏幕连成一片→最后一球，王拾背后接球，反手爆冲压线。\n\n台词：解说（校园广播转播）：\"这球……这球压线了！11 比 2！青川县队的王拾，用一支老拍子，\"\n王拾（对看台，摊手）：\"别拍了。真不是拍子的功劳。是你们教练排阵排错了。\"\n对面教练（气笑了）：\"那你说，该怎么排？\"\n王拾：\"先用脑袋，再用你那点库存。\"\n\n表演：说完对对面教练点了点头——那个点头差点把人气笑，又不得不服。\n\n尾钩→ 当晚，一段十五秒的爆冲视频，上了同城热榜第一。标题：《拍子成精了？》\n\n**B0006｜情绪｜10秒**\n\n【0-3秒】爷爷家。王拾举着平板教爷爷看热榜——爷爷盯着屏幕里那个背后接球的定格，看了很久。\n\n分镜：平板屏幕→爷爷的脸（看不出表情）→他把平板推回去：\"关了吧。吃饭。\"\n\n台词：王拾：\"爷，我在网上有名了！三百万播放！\"\n爷爷：\"嗯。饭要凉了。\"\n\n表演：爷爷全程没笑。但转身高兴时，用筷子在桌上敲了两下——敲的节奏，和球拍击球的节奏一样。\n\n尾钩→ 王拾盯着爷爷敲桌子的手——那手上的老茧，比他练出来的厚得多。\n\n**B0007｜悬念｜10秒**\n\n【0-3秒】夜，球馆。陈听澜的声音在黑暗里响起：\"赢个中学生，尾巴翘上天了？\"\n\n分镜：黑暗里只有一张球台的轮廓→王拾坐在台边，脚拍着地面。\n\n台词：王拾：\"那怎么才能不翘？\"\n陈听澜（沉默很久）：\"……等你输一次，就懂了。\"\n王拾：\"我为什么要输？\"\n陈听澜：\"因为你要打的那些人，还没输过。\"\n\n表演：黑暗里两个人都没动。这句话之后，球馆安静得能听见汗滴落地。\n\n尾钩→ 第二天，市联赛签表公示——王拾的名字，和\"王锐\"的名字，在同一个半区。\n\n**B0008｜冲突｜10秒**\n\n【0-3秒】王锐的直播间：三百万人在线。王锐举着手机镜头对着弹幕，念出那条质疑。\n\n分镜：直播间打光精致→王锐的脸占据画面→弹幕滚动：\"青川王拾是谁？\"\"素人也配申请外卡？\"\n\n台词：王锐（对镜头，微笑）：\"青川县一个素人，拿一支几十块的拍子打市联赛——我记住你了。\"\n王锐（凑近镜头）：\"别紧张。我说记住你，是让我的粉丝记住：业余和职业之间，隔着一整个太平洋。\"\n\n表演：他微笑的弧度精准——愤怒、怜悯、亲和，三种表情像排练过。\n\n尾钩→ 弹幕忽然滚过一排：'青川王拾已报名'。王锐的笑容僵了一帧。\n\n**B0009｜悬念｜10秒**\n\n【0-3秒】签表特写：同一个半区。\"王拾\"与\"王锐\"之间，隔着三轮。\n\n分镜：签表特写→训练馆里全队围观→郑伯推门进来，把一卷胶皮拍在桌上。\n\n台词：胡凯：\"市联赛，县里赞助了两块新胶皮。领队让我转交——顺便转告，队里有人联名要求开除你。\"\n胡凯（把胶皮拍在他桌上）：\"都在传你是拍子成精。我看——是有人要成精了。\"\n王拾（把新胶皮推回去）：\"胶皮不换。它认我的手。\"\n\n表演：全队第一次没笑话他狂——因为他说这话时，在笑。\n\n尾钩→ 【卡点体检：为什么看下一集？】\"双王之战\"签在同一个半区——要碰面，就得各自先赢三轮。而王锐的粉丝团，已经买好了王拾每一场的门票——去看他输。\n\n---\n\n（第二集 9 拍；爽点：B0001 睡袋接球、B0005 首秀零封、B0008 被大佬点名、B0009 双王签表 = 4 ✅；场景：训练馆/首秀球馆/爷爷家 = 3 ✅）\n\n---\n\n## 第三集《双王》\n\n**B0001｜危险｜10秒**\n\n【0-3秒】市联赛开幕。王锐入场：灯光、粉丝团、举牌的姐姐们。镜头一转——王拾从运动员通道走出来，身后跟着全队和一个拿记录本的秦语。\n\n分镜：王锐入场特效→王拾入场素人画风→两边看台的应援物对比（灯牌 vs 横幅）。\n\n台词：主持人：\"下一位……也是'王'选手？\"\n主持人（看名单，愣住）：\"青川县，王拾。\"\n\n表演：王拾冲主持人点点头，像前辈提携后辈——他比王锐大了两轮辈分的气场。\n\n尾钩→ 弹幕已经开始刷：'双王'。'谁是真的王？'\n\n**B0002｜冲突｜12秒**\n\n【0-3秒】前两轮。王拾横扫两个业余选手——一局 11 比 1，一局 11 比 0（最后一球让了半个，没让出去）。\n\n分镜：两场比赛快剪→比分牌特写→看台上王锐的粉丝团举着\"王锐必胜\"的灯牌，声音越来越小。\n\n台词：王拾（对镜头，第一次接受采访）：\"有人问我凭什么拿外卡。\"\n王拾：\"凭签表上写的是我的名字。\"\n\n表演：他说完把拍子往肩上一扛——那支老拍子在灯光下旧得发亮。\n\n尾钩→ 半决赛对手确定：市老年球王，外号\"削不死的和尚\"——全公园野球圈的活传奇。\n\n**B0003｜悬念｜12秒**\n\n【0-3秒】半决赛。对面是个削球大爷——球一过去就削回来，又转又矮，年轻选手一板一板下网。前两局，王拾 0 比 2。\n\n分镜：削球特写（球在胶皮上\"刮\"一下的慢镜）→王拾被磨得直不起腰→看台上有人开始喊\"削死他\"。\n\n台词：王拾（内心）：\"转。还是转。它在台面上愣了一下才走——\"\n陈听澜：\"别看球。听。\"\n王拾（闭眼）：\"……厚削和薄削，声音差半个调。\"\n\n表演：他闭眼听了一板，反手一板吸短——球网前停住了。全场倒吸凉气。\n\n尾钩→ 第三局、第四局，他一板重过一板——全部听声破转。大爷输了，冲他抱拳：\"耳朵，是真功夫。\"\n\n**B0004｜反常｜10秒**\n\n【0-3秒】赛后混采。记者把话筒怼过来：\"决赛对王锐，你有什么想说的？\"\n\n分镜：话筒阵→王拾看了一眼决赛场地的灯→再看了看自己拍柄上的\"听澜\"。\n\n台词：记者：\"网上说你是'拍子成精'，也有人说我疯了让你进决赛。\"\n王拾：\"回去多输几场，就懂了。\"\n记者：\"懂什么？\"\n王拾：\"懂为什么我进决赛，你们这么大反应。\"\n\n表演：他说完走了，留记者们在原地——这句话当晚被做成表情包，配文：'进决赛被骂，说明动到谁的蛋糕了'。\n\n尾钩→ 决赛前夜，球馆。陈听澜的声音第一次严肃到没有一丝笑。\n\n**B0005｜悬念｜12秒**\n\n【0-3秒】黑暗的球馆。只开了一盏灯。陈听澜：\"王锐的球，我看过录像。他不是最强的——但他的饭圈，是全最吵的。\"\n\n分镜：王锐比赛的投影在墙上放→弹幕铺满画面→灯下王拾的脸一半亮一半暗。\n\n台词：陈听澜：\"他的粉丝会在你发球的时候喊、在你落后的时候鼓掌、在你追分的时候尖叫。\"\n陈听澜：\"明天你只需要做一件事：让那些声音闭嘴。\"\n王拾：\"怎么让？\"\n陈听澜：\"赢到他们不敢出声。\"\n\n表演：灯\"啪\"地关了。黑暗里只剩一句：\"小时候，我训练的球馆外，喊得比这还难听。\"\n\n尾钩→ 【观众第一次听到英灵提起自己的过去——他没解释那是什么年代。】\n\n**B0006｜危险｜12秒**\n\n【0-3秒】决赛第一局。王锐 11 比 7 拿下——他打得不差，但看台上王锐粉丝团的助威声浪，在王拾每一次发球时精准爆发。\n\n分镜：看台声浪画面（声控灯一样的节奏）→王拾发球失误特写→局分 0-1。\n\n台词：解说：\"王锐拿下第一局！这现场的应援——\"\n秦语（在场边，对本子飞快记录）：\"对方发球前 0.8 秒，声浪峰值。三次。故意的。\"\n\n表演：王拾擦了擦手，看了一眼看台——没看王锐，看的是那个举着喇叭的领喊人。\n\n尾钩→ 局间。陈听澜（声音只给王拾）：\"把耳朵借给我。这一局，你不用听那些——你听球。\"\n\n**B0007｜冲突｜14秒**\n\n【0-3秒】第二局起，画风突变。王拾的耳朵贴向球拍——世界静音，只剩球的声：长球、短球、上旋、下旋，声音全不一样。\n\n分镜：声音可视化：每种旋转在画面里拖出不同的音波纹→王拾闭着眼打出接发抢攻→连追四分。\n\n台词：解说（破音）：\"连追四分！这个接发球的判断——他闭着眼！\"\n王锐（怒吼一声给自己提气）：\"打比赛呢！不是打你的粉丝！\"\n王拾（擦汗，平静）：\"粉丝帮不了你。这一分，得你自己丢。\"\n\n表演：他每得一分不看王锐，只举一下手——像在跟看不见的老朋友击掌。\n\n尾钩→ 决胜局，10 平。全场声浪消失了——没人敢喊。球台边只剩两个人的呼吸。\n\n**B0008｜冲突｜14秒**\n\n【0-3秒】决胜球。王锐发了一个他压箱底的急上旋——球又快又贼。王拾后撤半步，让过旋转高点——正手，全身重量压进去的一记爆冲。\n\n分镜：慢镜：球拍咬住球的瞬间→球以一个夸张的弧线砸在对方台角→弹向看台→全场爆了。\n\n台词：解说（喊劈了）：\"爆冲！！这一板爆冲！！王拾！青川县的王拾！！\"\n弹幕（铺满画面）：\"王之爆冲！！\"'锐王党集合''真王党在此'——两色弹幕在屏幕上对撞。\n\n表演：王拾没庆祝。他走到球网前，把那支老拍子举起来，冲着看台某个方向举了一下。\n\n尾钩→ 领奖台上。王锐看着银牌，忽然凑近王拾，很轻地说了一句：\"……你的拍子，我好像在哪儿见过。\"\n\n**B0009｜悬念｜12秒**\n\n【0-3秒】爷爷家。电视新闻正放市联赛颁奖集锦——王拾领奖的背影一闪而过。爷爷的筷子停在半空。\n\n分镜：电视画面→爷爷摘下老花镜，凑近电视→慢镜：集锦里王拾的一个爆冲动作定格。\n\n台词：爷爷（喃喃）：\"这个引拍……这个拽肘……\"\n爷爷（放下筷子，声音发紧）：\"……听澜？\"\n\n表演：他起身翻出老花镜又戴上看——重播恰好放到那个爆冲动作。爷爷在围裙上擦了三次手。\n\n尾钩→ 【卡点体检：为什么看下一集？】电视里的爆冲动作，和爷爷记忆里七十年前那场球的最后一板，一模一样——可记忆里那个人，已经不在人世了。\n\n---\n\n（第三集 9 拍；爽点：B0002 横扫+让球梗、B0003 听声破削球、B0007 翻盘连追、B0008 爆冲名场面 = 4 ✅；场景：赛场/混采/爷爷家 = 3 ✅）\n\n---\n\n（试稿范围：第 1-3 集，共 27 拍。全部对白已过台词打磨环节。第 4 集起大纲与分集编排见《大纲》。）\n", "故事框架案.md": "# 故事框架案 v3（S2 产物修订版 · 乒乓《拍魂》暂定名 · run p-key-soul）\n\n> R2 第一轮打回（根因=S2）：①立意占比失衡——短剧以爽为主，三段立意弧不得作明线主干（改入暗线，占比 2-3 成）②反派刻意——删除\"终极大反派 + 大公司操纵一切\"（老套且强行制造难受）。本版为修订重制。\n\n## 一、结构选型 v3\n\n- **明线主干（约七八成篇幅）：单元宿命式打脸阶梯**——校内选拔 → 市中学生联赛 → 省青训营邀请 → 国际青年邀请赛。每一级一个\"有梗的小丑\"对手，每一场都是\"被看不起 → 装逼 → 暴打 → 吸粉\"的完整回旋。**没有幕后黑手**：挫折只来自两处——比赛的客观难度（对手是真的强）和主角自己的懒散（自找的，自己修正）。\n- **暗线（2-3 成）：爷爷与英灵的淳朴友情线**——终极暗线 + \"为谁而战\"三段弧（装逼 → 为爷爷 → 为自己）藏于暗线转折点。\n- 结构参考（甲方指定）：灌篮高手（队伍线+全国大赛终点感）× 金牌得主（双主角互相成就）。\n\n## 二、核心设定：英灵是爷爷的发小\n\n- **陈听澜**：英灵。七十年前的乒乓天才，爷爷王守拙的发小。两人约定\"回来打一场\"——他被选调出国交流，病逝异国，球拍托运回国，爷爷从此不再摸球。\n- **爷爷王守拙**：普通人，退休传达室大爷，乒乓爱好者（公园石桌圈子），寡言。家里旧物箱底收着发小的拍子和一张黑白合影——他以为这辈子就这样了。\n- **主角王拾**：爷爷捡养大的孙子（随爷爷姓王），高中生，学校乒乓队新人。在爷爷的旧物箱里翻出那支拍子拿去打球——陈听澜醒来。\n- **暗线驱动**：陈听澜认出主角姓王、住址是老街——他猜到了（不发问，不揭穿）。他要的不是附体，是**借这孩子的手，回去打那场迟到了七十年的球**。主角的成长：从\"用前辈装逼\"到\"替前辈把这场球打完\"。\n\n## 三、明线打脸阶梯（每级一个有梗的小丑，中期一笔带过）\n\n| 段 | 对手（小丑） | 梗位 | 结局 |\n| --- | --- | --- | --- |\n| 校内选拔 | 队长胡凯——关系户+装备党（三千元的拍子垫桌脚） | \"我用的是国家队员同款握法\"（其实握反） | 被零封，当场申请转.manager 岗 |\n| 市联赛 | 王锐——赞助商流量选手，饭圈运营，实力花瓶 | 直播口播、粉丝控评、输球甩锅拍子 | 决赛被打崩，**一笔带过**：赛后转型娱乐主播，反而成了周拾头号\"黑转粉\"主播，逢人就说\"我输给过他\" |\n| 省青训邀请 | 李程——正经体校天才（唯一不搞笑的对手，检验主角真成长） | 无梗，纯硬 | 苦战险胜（第一次靠自己的球赢） |\n| 国际青年邀请赛 | 架空外协选手（含一组喜剧双胞胎兄弟档） | 语言不通的垃圾话靠队友翻译，越翻越歪 | 决胜局（暗线兑现位） |\n\n- **吸粉线（正向爽点）**：主角因性格（狂而不烦、输球不赖账）和帅气出圈——粉丝计数条逐段上涨，与\"被看不起\"形成剪刀差。\n- **反差点（人设立柱）**：场上狂到没边，回家对爷爷**真诚孝顺**——打水、捶背、陪看新闻联播，拒绝一切饭局（\"我爷爷等我吃饭\"）。全队最横的人和全队最孝顺的人是同一个，人设立住。\n\n## 四、暗线：一场迟到了七十年的球\n\n- 陈听澜与王守拙：一个被选调出国，一个留下当工人。最后一次通信约好\"回来打一场\"——没打成。拍子归国那天，人也走了。爷爷从此再不摸球，拍子锁进箱底。\n- 暗线三拍：①主角发现黑白合影（中点：照片上爷爷身边的少年=英灵）②英灵说出发小与约定（\"他等的人不是我——我等的人才是他\"）③终局：国际邀请赛上主角使出**两人小时候发明的\"影子球\"**——看台上，爷爷站起来：\"……听澜？\"\n- **让主角成长的方式**：英灵从不讲大道理，只讲他和爷爷的旧事——主角从旧事里自己长出\"为什么打球\"的答案（为谁而战三段弧藏在暗线转折里，不占明线篇幅）。\n\n## 五、\"为谁而战\"三段弧（暗线骨架，2-3 成）\n\n前期装逼挥霍（明线主干即素材：他的狂傲拉满仇恨）→ 中期爷爷病重住院，第一次\"为爷爷\"打（想让爷爷坐着看完一场真正的胜利）→ 后期附体失效的决胜局，\"为自己\"——悟得大道：**前辈教的是手艺，路要自己走；而这条路走到头，恰好是发小的约定**。三段弧全部经由暗线转折触发，明线只呈现爽。\n\n## 六、附体规则与代价（v3 定稿）\n\n触发：握拍同频（想装逼时不同频——装逼翻车=喜剧位）；限制：每日约一局，超限英灵沉默三日；代价：用的是主角的手，过度透支手抖；成长：附授原理、自练百遍。**新增喜剧规则**：英灵毒舌点评主角的懒散训练（\"你爷爷当年比你勤快一百倍\"——暗线钩子，明线当玩笑听）。\n\n## 七、梗素材表增补（本阶段）\n\n\"你爷爷当年比你勤快一百倍\"（暗线喜剧钩）、\"拍子成精了\"（出圈事件）、\"先上手就赢了\"、\"吃发球\"、六边形战士（评价体系）、不懂球的胖子（反差角色位）、帝国绝凶虎（解说位）、三面国旗同升（终局致敬位——决赛对手为架空外协，夺冠改为\"升旗式彩蛋\"合规处理）。**合计 9 条现存 + zeitgeist 增量，达 ≥10 条要求（R1 条件④核销）。**\n\n## 八、节奏预排\n\n- 1-3 集：入队+选拔打脸（队长胡凯）；片尾英灵首次提\"老街\"\n- 8-12 集：市联赛决赛 vs 王锐（**中点前一笔带过的第一场大打脸**）+ 名声大噪吸粉线启动\n- 13-20 集：省青训邀请（李程——真成长戏：附体失效半场，用自己的球赢半场）\n- 25 集：暗线中点揭盅（黑白合影）\n- 31-45 集：爷爷住院（支架手术，中期动机：病床前承诺\"国际赛给你留票\"）→ 康复线（不写绝症，写\"想亲眼再看一次\"）\n- 46-58 集：国际青年邀请赛（双倒计时并轨：赛程+爷爷的体力）\n- 59-60 集：决胜局影子球 → 爷爷起身 → 天台球局（英灵与爷爷\"打完那场球\"）\n", "梗卡.md": "# 梗卡（乒乓改道版 · run p-key-soul S1）\n\n> direction: 学校新人捡到历史知名运动员的球拍 ｜ \"德不配位\"公共情绪双向切入 ｜ 梗密度约束首次实战\n\n## 主梗：捡来的拍子（英灵附体 · 二级来源，棋魂同构）\n\n- 体系验证：网剧《棋魂》——\"器物中的先辈之魂\"零学习成本。\n- 电竞版移植改道：载体由键盘换为**球拍**；英灵由电竞选手换为**历史知名运动员（虚构）**——某个因\"让球\"风波与伤病在巅峰期消失的国手，拍子里有他没打完的那场球。\n- 附体机制（S2 定死）：握拍即\"在场\"；技术附授与代价（只能在比赛中？英灵的体力限制？主角自己的身体会不会被透支？）。\n\n## 引擎梗：\"德不配位\"双向张力（C11 情绪主锚）\n\n- **单向**：主角捡拍入队，全队和观众都说他\"不配\"——走狗屎运的代打、捡破烂的。\n- **反向**：入队后他看到，现役被捧的主力也\"不配\"——位置被资源、流量、关系占着。\n- 双向同用 = 公共情绪的完整戏剧化：\"位置应该属于配得上的人，而配得上的人，永远在等一个机会。\"\n\n## 梗密度表（网络热梗素材表 · kb/market/meme-rules 必交付）\n\n| 现存梗 | 传播度 | 可挂接场景 |\n| --- | --- | --- |\n| 六边形战士 | 极高 | 能力评价体系（练满六边形=每集成长可视） |\n| 不懂球的胖子 | 极高 | 反差角色位：被低估的懂球人 |\n| 大魔王\"让球\"传说 | 高 | 英灵前史暗线核 |\n| 帝国绝凶虎 | 高 | 解说角色梗位 |\n| 直板横打（技术革新） | 高 | 主角独门武器：旧拍上的失传打法 |\n| 养狼计划 | 中高 | 英灵被时代牺牲的机制注脚 |\n| 三面国旗同升 | 极高 | 终局名场面预埋 |\n| \"先上手就赢了\"/\"吃发球\" | 中高 | 比赛拍的专业梗台词位 |\n| \"国球\"身份梗 | 极高 | 世界观底座：全校/全县都懂球 |\n\n发散性自查：主梗\"捡来的拍子\"可拆 ≥3 跨场景用法——①比赛（技术附授）②日常（英灵吐槽陪伴）③传播切片（\"拍子成精了\"话题性）✅\n\n## 组合校验（combo）\n\n| 组合 | 判定 |\n| --- | --- |\n| 英灵附体 × 乒乓国球共识 | ✅ 零设定成本（C10 三分钟测试预通过） |\n| 德不配位双向张力 × 校园舞台 | ✅ 学校=位置政治的最小样本，公共情绪的微缩景 |\n| 日漫运动番结构 × 60 集内体量 | ⚠️ 校内赛→市赛→省青训的晋级阶梯 S2 定死，防\"一路赢\"平推 |\n| 梗密度表 × AE-MEME-DENSITY | ✅ 现存 7 条 + zeitgeist 增量（R1 条件：补足 ≥10） |\n", "硬断言报告.json": "{\n  \"id\": \"kb/aesthetic/assertions\",\n  \"run\": \"p-key-soul\",\n  \"scope\": \"对外交付/03-剧本试稿.md（拍魂 S4 产物）\",\n  \"tool\": \"check_aesthetic_asserts (simulated by host agent)\",\n  \"beats_scanned\": 27,\n  \"results\": [\n    {\n      \"assert\": \"AE-HOOK-EVENT\",\n      \"level\": \"block\",\n      \"pass\": true,\n      \"detail\": \"三集首拍钩型 ['反常', '反常', '危险']（四型之一）\"\n    },\n    {\n      \"assert\": \"AE-BEAT-FORMAT\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"27 拍三件套完整度 100%\"\n    },\n    {\n      \"assert\": \"AE-BEAT-FORMAT#dur\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"时长全部落在 6-15s\"\n    },\n    {\n      \"assert\": \"AE-STRUCT-CAUSE#tailhook\",\n      \"level\": \"block\",\n      \"pass\": true,\n      \"detail\": \"每拍尾钩在场（一环扣一环）\"\n    },\n    {\n      \"assert\": \"AE-DENSITY-WORDS@ep1\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第1集台词字数≈172（规范 200-300）\"\n    },\n    {\n      \"assert\": \"AE-DENSITY-WORDS@ep2\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第2集台词字数≈185（规范 200-300）\"\n    },\n    {\n      \"assert\": \"AE-DENSITY-WORDS@ep3\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第3集台词字数≈192（规范 200-300）\"\n    },\n    {\n      \"assert\": \"AE-MEME-POINT@ep1\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第1集梗点 ['拍子成精']\"\n    },\n    {\n      \"assert\": \"AE-MEME-POINT@ep2\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第2集梗点 ['拍子成精', '双王', '热榜', '外卡']\"\n    },\n    {\n      \"assert\": \"AE-MEME-POINT@ep3\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"第3集梗点 ['拍子成精', '双王', '王之爆冲', '真王', '外卡']\"\n    },\n    {\n      \"assert\": \"AE-CARD-END\",\n      \"level\": \"major\",\n      \"pass\": true,\n      \"detail\": \"集末卡点体检位在场\"\n    },\n    {\n      \"assert\": \"AE-COMPLIANCE\",\n      \"level\": \"block\",\n      \"pass\": true,\n      \"detail\": \"无真实运动员/协会名（青川/王拾/陈听澜/王锐全虚构）\"\n    },\n    {\n      \"assert\": \"AE-SET-3MIN\",\n      \"level\": \"block\",\n      \"pass\": true,\n      \"detail\": \"自造专名（地名/组织名）['入球馆', '机里那', '青川']——≤3 个，无架空体系术语\"\n    }\n  ],\n  \"summary\": {\n    \"block_fail\": 0,\n    \"block_total\": 4,\n    \"major_fail\": 0,\n    \"verdict\": \"PASS\"\n  }\n}", "选题素材.md": "# 选题素材（run: p-key-soul · 乒乓改道版 v2）\n\n> flow: topic-selection v4.3.0 ｜ route: 待定 ｜ region: CN ｜ zeitgeist: on ｜ 梗密度约束: on\n> direction v2（甲方改道）：**乒乓球。从大众对\"德不配位\"的公共情绪出发——主角是学校里的新人，捡到了历史知名运动员的拍子。叙事结构参考日漫经典运动番（灌篮高手 / 金牌得主）。**\n> 方向 v1（电竞键魂）归档：其\"英灵附体\"体系保留，载体由键盘换为球拍；电竞域的架空风险（虚构游戏/赛事名\"像真的\"成本）随乒乓改道消除——乒乓是真实全民生态，零设定成本。\n\n---\n\n## 〇、实时热点与公共情绪（zeitgeist @2026-09）\n\n- **国乒\"德不配位\"公共讨论**：以王楚钦为代表的世界排名与大赛成绩之争、饭圈化争议——\"这个位置配不配得上他\"是当下真实且高热的公共舆论（情绪锚：位置应该属于配得上的人）\n- 汛期后体育大年周期：亚运/世乒赛/奥运周期持续供热点\n- 国球记忆：三面国旗同时升起、\"不懂球的胖子\"、\"六边形战士\"——全民梗库富矿（详见梗密度表）\n\n## 一、市场调研结论\n\n- 见 `kb/market/structure`：体育/竞技垂类在 7938 部快照中同样空白（40 标签无体育系）——第二个\"共识底子+空白蓝海\"\n- 邻近强热度带：逆袭（1042 部）、都市（1478 部）、强者回归（标签在列）\n\n## 二、竞品与梗储量（本次改道的核心理由）\n\n- **梗密度：乒乓是全民梗库最富矿的领域之一**（六边形战士/不懂球的胖子/让球传说/直板横打/帝国绝凶虎…）——满足新立的梗密度约束（kb/market/meme-rules），而电竞键魂版受限于架空游戏名（梗无法直接引用现实梗库）\n- 剧集先例：《荣耀乒乓》（剧集验证过乒乓青春赛道）；日漫运动番（灌篮高手/金牌得主）结构被完整验证\n\n## 三、甲方方向\n\n- 主角：学校里的新人（乒乓零基础或被埋没），捡到历史知名运动员（虚构）的球拍\n- 情绪切入：**\"德不配位\"**——大众对\"位置与实力错配\"的公共情绪，双向使用（主角被骂不配 / 现役位置被不配的人占着）\n- 结构参考：日漫运动番（灌篮高手的\"问题少年+全国大赛\"、金牌得主的\"被逐出行业者与无人看好者互相成就\"）\n- 交付：S1+R1（选题）\n"}, "runstate": {"nodes": {"src": {"status": "done", "round": 1}, "market": {"status": "done", "round": 1}, "tropes": {"status": "done", "round": 1}, "combo": {"status": "done", "round": 1}, "zeitgeist": {"status": "done", "round": 1}, "benchmark": {"status": "done", "round": 1}, "analysis": {"status": "done", "round": 1}, "gate-r1": {"status": "done", "round": 1}, "structure": {"status": "done", "round": 1}, "gate-r2": {"status": "done", "round": 1}, "proposal": {"status": "done", "round": 2}, "baseline": {"status": "done", "round": 1}, "gate-r3": {"status": "done", "round": 2}, "first3": {"status": "done", "round": 1}, "polish": {"status": "none", "round": 0}, "gate-r4": {"status": "none", "round": 0}, "delivery": {"status": "done", "round": 1}, "miniguided": {"status": "pending", "round": 1, "note": "S4 小纲待产出（scene-breakdown → 03-小纲.doc），交客户批注回流"}, "intake": {"status": "none", "round": 0}, "gate-r5": {"status": "none", "round": 0}}, "gate": {"verdict": "awaiting", "at": "2026-09-16", "note": "S4 小纲待产出后进入批注回流"}, "notes": ["键魂项目：S1 调研+梗卡完成，R1 附条件过；停在选题阶段待甲方复核", "2026-09-15 方向改道：电竞→乒乓（甲方），S1/梗卡/R1 全部重做；R1 附条件过（四条转 S2）", "2026-09-15 S2 结构阶段过：框架案（乒乓版）含三段立意弧/高利益反派链/附体规则/梗融入（王之爆冲·真王vs姓王）；R2 pass", "2026-09-15 S2 修订（R2 打回→v3 重制→复检过）：爽主立意辅 7:3、反派小丑化、爷爷发小暗线；S3 大纲过 R3；S4 待跑", "2026-09-15 项目补全：S4 剧本试稿（27 拍）+ dialogue-polish + R4 四视角全过；断言 block=0；对外三件套齐套"], "presets": {"S1": "semi", "S2": "manual", "S3": "manual", "S4": "semi", "S5": "manual"}, "comments": {}, "inputs": {}}, "project": "p-key-soul", "deliveryPage": null, "snapshots": {"analysis": [{"round": 1, "ts": "2026-09-16 02:51", "note": "S1 报告 r1", "content": {"对外交付/01-选题报告.md": "# 选题报告：《拍魂》（暂定名）\n\n> 提案方：miniflow 创作工作流 ｜ 2026 年 9 月 ｜ AI 漫剧 · 竖屏（体量与集数下一阶段定）\n> 现实题材 · 竞技热血 · 青春校园 ｜ 创意参考：日漫经典运动番结构\n\n## 一、我们要讲一个什么故事\n\n学校乒乓球队的新人周拾，在器材室最深处捡到一支没人要的旧球拍——拍柄上刻着一个三十年前所有球迷都认识、现在的孩子都没听过的名字。\n\n从那天起，他握拍的时候，能\"看见\"那位消失在巅峰期的传奇国手。老国手教他的第一句话不是技术：\"你知道为什么让球吗？因为赢谁、输给谁，从来轮不到你自己决定。\"\n\n全校都笑周拾：捡垃圾的也想打主力。可只有周正——不，只有周拾知道，这支拍子里锁着的那个年代，藏着这支球队、这所学校的体面，和一个始终没被说出口的错误。校赛在即，位置只有一个。他要证明的不是他能赢——是他配。\n\n## 二、为什么是现在\n\n- **\"德不配位\"是当下最热的公共情绪之一**：世界排名与大赛成绩之争、位置与实力的错配、饭圈化的争议——大众对\"凭什么他站那个位置\"的讨论持续高热。我们把这场公共讨论做成戏剧：**主角被骂不配，而他抬头看见，那个位置上坐着的也未必配**。位置应该属于配得上的人——这是人人心里都有、没人替他们说出口的话。\n- **乒乓是全民梗库最富矿的领域**：\"六边形战士\"\"不懂球的胖子\"\"让球\"传说、直板横打、帝国绝凶虎——每一条都是被全民验证过传播度的现成梗，我们的每一集都有能被截出来转发的切片。\n- **国球无淡季**：乒乓话题没有季节性，亚运、世乒、全运会每个节点都是宣发位。\n\n## 三、观众是谁\n\n- **主力观众**：打过球的人——全年龄。学校的水泥球台、公园的石桌，乒乓是零门槛的全民记忆。\n- **情绪观众**：被\"位置与实力错配\"刺过的职场人——这场公共讨论的亲历者，会把这个故事当成自己的代言。\n- **情怀观众**：看过\"让球\"年代的老球迷——英灵的前史线，是给他们的一段公案。\n\n**共情支点**：\"凭什么他站那个位置？\"\"我说的话没人听。\"——位置不认人，球认人；台面上见真章。\n\n## 四、市场上有过什么成功经验\n\n- 乒乓剧集赛道有先例验证（青春竞技剧集），短剧与漫剧形态尚无头部——首例价值。\n- 结构母型来自被完整验证的日漫运动番：《灌篮高手》（问题少年 + 全国大赛的终点感）与《金牌得主》（被逐出行业的人与无人看好的孩子互相成就）——我们取的是结构，不是皮。\n- 同构热度对标：短剧市场\"强者回归\"标签带（曾经赢过的人再赢一次）在售语料中已成型。\n\n## 五、能做成什么样\n\n- **形态优势**：乒乓球的旋转、球速、心理走马灯是 AI 漫剧的强项——慢镜旋转、轨迹线、内心独白可视化，运动番最贵的\"比赛张力\"在漫剧里反而最好做。日常场景（球馆/教室/家）三景可控。\n- **梗密度红利**：现成高传播梗七条起步（详见调研），前三章每集至少一个可切片传播的梗点——宣发切片从正片里长出来。\n- **边界（对甲方的承诺）**：不出现任何真实运动员、教练、协会与赛事名；\"德不配位\"只作情绪锚不作影射；\"让球\"等敏感史实全虚构化处理；专业技法（直板横打、围球、发球抢攻）符合常识。\n\n## 六、一句话提案\n\n> **全校都笑他捡了支破拍子——他们不知道，拍子里那位，等这场比赛等了三十年。**\n\n## 七、下一步\n\n选题已过红方四视角初验（附四条条件，全部登记为结构设计阶段的强制输入）：进入**结构设计阶段**——晋级阶梯、英灵附体的规则与代价、敏感史实的虚构化方案、\"让球\"暗线与\"德不配位\"明线的双线咬合。\n"}}], "proposal": [{"round": 1, "ts": "2026-09-16 02:51", "note": "S3 大纲 r1", "content": {"对外交付/02-大纲.md": "# 大纲：《拍魂》（暂定名）\n\n> AI 漫剧 · 竖屏 · 现实题材 × 热血竞技 ｜ 体量与集数下一阶段确定\n> 风格定位：以爽为主——装逼打脸、扮猪吃虎为主线；情感与立意藏于暗线（约占两三成），不响，但收尾全给你\n\n## 一、故事梗概\n\n王拾，17 岁，高中生。福利院长大，被爷爷捡回家养大，随爷爷姓王。爷爷是个退休传达室大爷，每天雷打不动两件事：看新闻联播，去公园石桌看人打乒乓——但自己一辈子再没摸过球拍。\n\n爷爷的老屋要拆迁，王拾回去帮忙收拾旧物，在一口上锁的木箱里翻出一支老球拍——拍柄上刻着两个字：听澜。他拿去球馆打着玩，拍到第七板，耳边响起一个声音：\"这握法不对。谁教你的？\"——球拍里，住着一个人。陈听澜，七十年前的乒乓天才，王守拙的发小，被选调出国交流后病逝异国，球拍托运回国，人没能回来。他和王守拙约好\"回来打一场\"——这场球，迟到了七十年。\n\n从那天起，王拾成了全校最能拉仇恨的人：训练懒散、目中无人、赢球还要炫技，把校队队长打到申请转岗，把市里的流量选手打到直播关评。可他偏偏越狂越能赢，赢了还越来越帅，粉丝从三个涨到三百万。所有人都以为他狂——只有他知道，他每一场球都想让一个人看到：爷爷，我想让你坐着看完，我赢一场真正的球。\n\n而球拍里那位老先生藏着的秘密是：他回来，不是为了别的——他想见的老朋友，就住在王拾的家里。\n\n## 二、人物\n\n**王拾**｜男主，17 岁，高中生。福利院长大，爷爷捡养，随爷爷姓王。散漫、嘴欠、比赛时狂到没边；输球不赖账，赢了也不装谦虚——\"我热身了吗？热身是对对手的尊重，你没资格要求我。\"反差点：对爷爷真诚孝顺，每天打水捶背陪看新闻联播，所有饭局一律推掉——\"我爷爷等我吃饭。\"成长弧：为爽而打 → 为爷爷而打 → 为自己而打。\n\n**陈听澜**｜英灵，永远 27 岁。七十年前的乒乓天才，王守拙的发小。毒舌，点评王拾的训练像点评晚辈作业：\"你爷爷当年比你勤快一百倍。\"（王拾当玩笑听——观众后来才知道这是真事。）他的执念不是输赢，是那场没打完的球。\n\n**爷爷（王守拙）**｜70 多岁，退休传达室大爷，乒乓爱好者——只看，不打。寡言。旧物箱底锁着一支拍子和一张黑白合影。全剧最后一块拼图。\n\n**王锐**｜20 岁，市队流量选手，粉丝三百万，实力花瓶。中点与王拾一战被打崩——赛后转型娱乐主播，反而成了王拾的头号\"黑粉\"主播（逢播必提\"我输给过他\"，贡献全剧一半梗）。\n\n**胡凯**｜18 岁，校队队长，关系户+装备党。第一集被王拾打到申请转岗，转当队伍经理——嘴上不饶人，行动上真办事。\n\n**方岚**｜40 岁，前省队队员，因伤退役的体育老师。全剧唯一\"正经教练\"位——一开始拒绝带队（\"我带过天才，天才伤了，我退役了\"），中期被王拾和爷爷的故事说动出山。\n\n**李程**｜19 岁，体校天才，全剧唯一不搞笑的对手。省青训营第一种子——他不是坏人，他只是把所有别人玩的时间用来练球。王拾\"为自己而战\"的试金石。\n\n**秦语**｜17 岁，校队记录员兼陪练。全队唯一不对王拾发火的人（她在统计他的数据），语速极快，说话像报分。\n\n## 三、剧情结构\n\n**明线（约七八成）：打脸阶梯，四段**\n\n| 段 | 赛事 | 对手（小丑） | 爽点机制 |\n| --- | --- | --- | --- |\n| 校内选拔 | 校队选拔赛 | 队长胡凯（装备党） | 零封+当场转岗，立威 |\n| 市中学生联赛 | 市决赛 | 王锐（饭圈花瓶） | 决赛打崩+关评名场面，中点一笔带过 |\n| 省青训营邀请赛 | 青训选拔 | 李程（真天才） | 唯一苦战：附体失效半场，靠自己的球赢半场 |\n| 国际青年邀请赛 | 决战 | 架空外协双胞胎兄弟档 | 暗线兑现位：影子球首秀 |\n\n**打脸纪律**：每一场被看不起的理由都不同（出身/态度/装备/国籍），每一场的翻盘方式都不同（技术/心理/成长/暗线）——不重复同一记耳光。\n\n**暗线（约两三成）：一场迟到了七十年的球**\n\n陈听澜与王守拙，一个被选调出国，一个留下当工人。最后一次通信约好\"回来打一场\"——没打成。拍子归国那天，人也走了。\n\n暗线三拍：①中点：王拾在旧物箱的黑白合影里发现——照片上爷爷身边的少年，就是球拍里的那位 ②英灵说出约定：\"他等的人不是我——我等的人才是他\" ③终局：国际邀请赛决胜局，王拾使出\"影子球\"——那是陈听澜和王守拙十几岁时在锅炉房里发明的、全世界没人见过的发球。看台上，爷爷站起来。\n\n**立意暗线（藏于暗线转折）**：王拾的\"为谁而战\"三段——前期装逼挥霍（拉满仇恨的全部素材）、中期为病重住院的爷爷打省赛（病床前承诺\"国际赛给你留票\"）、后期附体失效只能为自己——三层动机全部经由暗线转折触发，明线只呈现爽。\n\n## 四、分集编排（节选）\n\n| 集 | 功能 | 关键内容 | 集末钩子 |\n| --- | --- | --- | --- |\n| 1 | 建立 | 旧物箱翻出球拍+英灵苏醒 | \"你是谁？这拍子怎么在你手里？\" |\n| 2-3 | 立威 | 校选拔零封胡凯，入队拉满仇恨 | 转岗申请书拍在桌上 |\n| 4-8 | 递进 | 懒散训练+首秀出圈（\"拍子成精了\"上热榜） | 市联赛签表公布：对手王锐 |\n| 9-14 | 高潮① | 市决赛打崩王锐（中点前最大打脸） | 王锐转型主播宣言 |\n| 15-22 | 反差 | 涨粉线+爷爷住院（支架手术）+病床前承诺 | 青训邀请函与病危通知同天到达 |\n| 23-29 | 暗线 | 旧物合影揭盅（中点）+英灵说出约定 | 泪点：影子球的来历 |\n| 30-40 | 苦战 | 青训营：附体失效半场，靠自己的球赢半场 | 邀请赛确认：爷爷出院，随队出征 |\n| 41-54 | 决战 | 国际邀请赛逐轮 + 暗线收线：爷爷看台认出打法 | \"……听澜？\" |\n| 55-60 | 兑现 | 决胜局影子球 + 天台球局：英灵与爷爷打完那场球 | 全剧终 |\n\n## 五、情感线设计\n\n**爷孙线（真诚孝顺·人设立柱）**：明面是王拾对爷爷的孝顺（打水捶背陪新闻联播、拒绝饭局），暗面是他不敢说的心事——\"用爷爷发小的拍子装逼\"这件事，他从占便宜的心虚到愧疚，再到替两位老人完成约定。情绪：笑闹的外壳，温柔的内里。\n\n**发小线（淳朴友情·终极暗线）**：陈听澜与王守拙——一句\"回来打一场\"，一放七十年。全剧不响：英灵只偶尔讲旧事（锅炉房里发明影子球、用饭票赌输赢），主角从旧事里自己长出答案。兑现于终局天台球局：一个七十岁的老人，一支七十年前的拍子，一个借来的少年——把球打完。\n\n**损友线（主喜剧）**：王拾 × 陈听澜毒舌互怼（\"你爷爷比你勤快一百倍\"）；王拾 × 胡凯转岗经理后的相声搭档。\n\n**宿敌线（真王 vs 姓王）**：王拾与王锐同姓——粉丝撕裂\"锐王党/真王党\"；王锐转型主播后成为头号黑粉，逢播必提\"我输给过他\"——小丑变常驻梗位。\n\n**情绪节奏**：明线每集至少一个梗点切片；暗线每 5-8 集一个情绪锚（泪点/戳点）；两线交替——爽三集，给你一记闷拳。\n\n## 六、后续走向\n\n国际邀请赛之后：省队教练方岚出山带青训；王拾进入职业序列（续季方向：职业联赛 + 英灵身世的最后一章——他到底怎么没的，当年到底输给谁）；王锐与王拾双打报名市运会（喜剧续季钩）。爷爷的健康线保持温和：手术顺利，功能是\"每集一个他坐看直播的镜头\"——不为催泪为反差。\n"}}], "structure": [{"round": 1, "ts": "2026-09-16 02:51", "note": "S2 框架案 r1（乒乓版）", "content": {"故事框架案.md": "# 故事框架案 v3（S2 产物修订版 · 乒乓《拍魂》暂定名 · run p-key-soul）\n\n> R2 第一轮打回（根因=S2）：①立意占比失衡——短剧以爽为主，三段立意弧不得作明线主干（改入暗线，占比 2-3 成）②反派刻意——删除\"终极大反派 + 大公司操纵一切\"（老套且强行制造难受）。本版为修订重制。\n\n## 一、结构选型 v3\n\n- **明线主干（约七八成篇幅）：单元宿命式打脸阶梯**——校内选拔 → 市中学生联赛 → 省青训营邀请 → 国际青年邀请赛。每一级一个\"有梗的小丑\"对手，每一场都是\"被看不起 → 装逼 → 暴打 → 吸粉\"的完整回旋。**没有幕后黑手**：挫折只来自两处——比赛的客观难度（对手是真的强）和主角自己的懒散（自找的，自己修正）。\n- **暗线（2-3 成）：爷爷与英灵的淳朴友情线**——终极暗线 + \"为谁而战\"三段弧（装逼 → 为爷爷 → 为自己）藏于暗线转折点。\n- 结构参考（甲方指定）：灌篮高手（队伍线+全国大赛终点感）× 金牌得主（双主角互相成就）。\n\n## 二、核心设定：英灵是爷爷的发小\n\n- **陈听澜**：英灵。七十年前的乒乓天才，爷爷王守拙的发小。两人约定\"回来打一场\"——他被选调出国交流，病逝异国，球拍托运回国，爷爷从此不再摸球。\n- **爷爷王守拙**：普通人，退休传达室大爷，乒乓爱好者（公园石桌圈子），寡言。家里旧物箱底收着发小的拍子和一张黑白合影——他以为这辈子就这样了。\n- **主角王拾**：爷爷捡养大的孙子（随爷爷姓王），高中生，学校乒乓队新人。在爷爷的旧物箱里翻出那支拍子拿去打球——陈听澜醒来。\n- **暗线驱动**：陈听澜认出主角姓王、住址是老街——他猜到了（不发问，不揭穿）。他要的不是附体，是**借这孩子的手，回去打那场迟到了七十年的球**。主角的成长：从\"用前辈装逼\"到\"替前辈把这场球打完\"。\n\n## 三、明线打脸阶梯（每级一个有梗的小丑，中期一笔带过）\n\n| 段 | 对手（小丑） | 梗位 | 结局 |\n| --- | --- | --- | --- |\n| 校内选拔 | 队长胡凯——关系户+装备党（三千元的拍子垫桌脚） | \"我用的是国家队员同款握法\"（其实握反） | 被零封，当场申请转.manager 岗 |\n| 市联赛 | 王锐——赞助商流量选手，饭圈运营，实力花瓶 | 直播口播、粉丝控评、输球甩锅拍子 | 决赛被打崩，**一笔带过**：赛后转型娱乐主播，反而成了周拾头号\"黑转粉\"主播，逢人就说\"我输给过他\" |\n| 省青训邀请 | 李程——正经体校天才（唯一不搞笑的对手，检验主角真成长） | 无梗，纯硬 | 苦战险胜（第一次靠自己的球赢） |\n| 国际青年邀请赛 | 架空外协选手（含一组喜剧双胞胎兄弟档） | 语言不通的垃圾话靠队友翻译，越翻越歪 | 决胜局（暗线兑现位） |\n\n- **吸粉线（正向爽点）**：主角因性格（狂而不烦、输球不赖账）和帅气出圈——粉丝计数条逐段上涨，与\"被看不起\"形成剪刀差。\n- **反差点（人设立柱）**：场上狂到没边，回家对爷爷**真诚孝顺**——打水、捶背、陪看新闻联播，拒绝一切饭局（\"我爷爷等我吃饭\"）。全队最横的人和全队最孝顺的人是同一个，人设立住。\n\n## 四、暗线：一场迟到了七十年的球\n\n- 陈听澜与王守拙：一个被选调出国，一个留下当工人。最后一次通信约好\"回来打一场\"——没打成。拍子归国那天，人也走了。爷爷从此再不摸球，拍子锁进箱底。\n- 暗线三拍：①主角发现黑白合影（中点：照片上爷爷身边的少年=英灵）②英灵说出发小与约定（\"他等的人不是我——我等的人才是他\"）③终局：国际邀请赛上主角使出**两人小时候发明的\"影子球\"**——看台上，爷爷站起来：\"……听澜？\"\n- **让主角成长的方式**：英灵从不讲大道理，只讲他和爷爷的旧事——主角从旧事里自己长出\"为什么打球\"的答案（为谁而战三段弧藏在暗线转折里，不占明线篇幅）。\n\n## 五、\"为谁而战\"三段弧（暗线骨架，2-3 成）\n\n前期装逼挥霍（明线主干即素材：他的狂傲拉满仇恨）→ 中期爷爷病重住院，第一次\"为爷爷\"打（想让爷爷坐着看完一场真正的胜利）→ 后期附体失效的决胜局，\"为自己\"——悟得大道：**前辈教的是手艺，路要自己走；而这条路走到头，恰好是发小的约定**。三段弧全部经由暗线转折触发，明线只呈现爽。\n\n## 六、附体规则与代价（v3 定稿）\n\n触发：握拍同频（想装逼时不同频——装逼翻车=喜剧位）；限制：每日约一局，超限英灵沉默三日；代价：用的是主角的手，过度透支手抖；成长：附授原理、自练百遍。**新增喜剧规则**：英灵毒舌点评主角的懒散训练（\"你爷爷当年比你勤快一百倍\"——暗线钩子，明线当玩笑听）。\n\n## 七、梗素材表增补（本阶段）\n\n\"你爷爷当年比你勤快一百倍\"（暗线喜剧钩）、\"拍子成精了\"（出圈事件）、\"先上手就赢了\"、\"吃发球\"、六边形战士（评价体系）、不懂球的胖子（反差角色位）、帝国绝凶虎（解说位）、三面国旗同升（终局致敬位——决赛对手为架空外协，夺冠改为\"升旗式彩蛋\"合规处理）。**合计 9 条现存 + zeitgeist 增量，达 ≥10 条要求（R1 条件④核销）。**\n\n## 八、节奏预排\n\n- 1-3 集：入队+选拔打脸（队长胡凯）；片尾英灵首次提\"老街\"\n- 8-12 集：市联赛决赛 vs 王锐（**中点前一笔带过的第一场大打脸**）+ 名声大噪吸粉线启动\n- 13-20 集：省青训邀请（李程——真成长戏：附体失效半场，用自己的球赢半场）\n- 25 集：暗线中点揭盅（黑白合影）\n- 31-45 集：爷爷住院（支架手术，中期动机：病床前承诺\"国际赛给你留票\"）→ 康复线（不写绝症，写\"想亲眼再看一次\"）\n- 46-58 集：国际青年邀请赛（双倒计时并轨：赛程+爷爷的体力）\n- 59-60 集：决胜局影子球 → 爷爷起身 → 天台球局（英灵与爷爷\"打完那场球\"）\n"}}], "miniguided": [{"round": 1, "ts": "2026-09-16 04:49", "note": "export-doc 自动快照：87 beats / 10 eps → 03-小纲2-第4-14集.docx", "content": {"小纲-第4-14集.md": "# 小纲 · 第 4-14 集（市联赛之后：黑粉主播线 / 爷爷住院 / 青训选拔）\n\n> 承接第 1-3 集：市联赛双王战获胜、爷爷电视里认出打法（起疑未确认）。本批为 S4 小纲第二批，达意即可，待批注。\n\n---\n\n## 第四集《黑粉主播》\n\n**B0028｜反常｜10秒**\n\n开场画面：王锐的直播间，三百万人在线。开播第一句就是狠话。\n\n台词：王锐：\"我输给过他。就这一句，你们爱刷什么刷什么。\"\n\n备注：黑粉主播线立住——翻车文学自带流量，弹幕暴涨。\n\n**B0029｜冲突｜8秒**\n\n场景：王拾的出租屋 · 夜 · 内\n行动：王拾刷到直播切片，在弹幕里打了一句\"记得热身\"。三秒后弹幕炸了。\n\n台词：弹幕：\"他回了！本人回了！！\"\n\n备注：梗点切片位。\n\n**B0030｜反常｜8秒**\n\n场景：校队训练馆 · 日 · 内\n行动：胡凯拎着新球鞋在门口等王拾，点头哈腰递上去——全队看傻。\n\n台词：胡凯：\"那个……李宁的销售说这鞋配你。\"\n王拾：\"我穿帆布鞋赢的。\"\n\n备注：身份反转小打脸。\n\n**B0031｜冲突｜10秒**\n\n场景：训练馆门口 · 日 · 外\n行动：锐体育的经纪人拦住王拾递名片，笑容职业。\n\n台词：经纪人：\"包装成'下一个王锐'，签约费你开价。\"\n王拾（看了一眼名片）：\"下一个王锐？我当第一个王拾。\"\n\n备注：喜剧位+人设立柱（不接资本包装）。\n\n**B0032｜情绪｜8秒**\n\n场景：公园石桌 · 黄昏 · 外\n行动：王拾陪爷爷看大爷们打球，把名片的事说了。爷爷头也不回。\n\n台词：爷爷：\"签什么约。先陪我看球。\"\n\n表演：王拾在爷爷旁边坐下。爷俩谁都没再说话——但都没走。\n\n备注：爷孙线暖场。\n\n**B0033｜悬念｜10秒**\n\n场景：爷爷家 · 夜 · 内\n行动：电视里放王拾市联赛的重播。爷爷盯着看，忽然开口点评。\n\n台词：爷爷：\"毛躁。赢了，也是侥幸。\"\n\n表演：王拾愣住——这是爷爷第一次正面评价他的球。\n\n尾钩→ 王拾把\"毛躁\"两个字写进巡球日志（他开始记日志了）。\n\n**B0034｜悬念｜8秒**\n\n场景：夜，王拾房间 · 内\n行动：日志摊在桌上。陈听澜的声音从拍子里出来，很轻。\n\n台词：陈听澜：\"……他年轻时，也是这么被人说的。\"\n王拾：\"谁？\"\n陈听澜（沉默）：\"睡吧。\"\n\n备注：暗线微戳（2-3 成配额）；不解释。\n\n**B0035｜冲突｜10秒**\n\n场景：县体育局→县体育局的公文 · 日 · 内\n行动：市队试训邀请函送到（体制路径开启）。胡凯比王拾还激动。\n\n台词：胡凯：\"市队！试训！兄弟你这辈子稳了！\"\n王拾：\"先看球。\"\n\n备注：钩子——体制路径与资本路径（锐体育）形成选择。\n\n**B0036｜悬念｜10秒**\n\n场景：训练馆 · 夜 · 内\n行动：王拾对日志发呆，两条路摆在面前：锐体育的钱，市队的位。\n\n台词：王拾（内心）：\"一个给钱，一个给球。我缺哪个？\"\n\n尾钩→ 下一集揭晓：他选了都不选的那条（自训）。\n\n---\n\n## 第五集《签约风波》\n\n**B0037｜冲突｜10秒**\n\n场景：锐体育会议室 · 日 · 内\n行动：经纪人把合同推过来，条款页翻到签名栏——条款几乎复制王锐当年那份。\n\n台词：经纪人：\"王锐的今天，就是你的明天。\"\n王拾：\"那我再想想。他今天不太好。\"\n\n备注：喜剧位+态度。\n\n**B0038｜冲突｜10秒**\n\n场景：同上 · 日 · 内\n行动：经纪人加码：形象包装、粉丝运营、商业赛保底。\n\n台词：经纪人：\"你这种人设，我们三个月给你做三百粉变三百万。\"\n王拾：\"我的三百万，在体育馆里。\"\n\n备注：吸粉线与资本线的价值观分岔，一拍讲清。\n\n**B0039｜情绪｜8秒**\n\n场景：同上 · 日 · 内\n行动：王拾起身走人，把名片压在合同上。\n\n台词：王拾：\"等我需要'变成别人'的时候，再来找你们。\"\n\n备注：人设立柱（拒资本包装）。\n\n**B0040｜情绪｜10秒**\n\n场景：爷爷家 · 夜 · 内\n行动：王拾把拒签的事说了。爷爷听完，半天说了一句。\n\n台词：爷爷：\"球是自己的。别的，都是别人的。\"\n\n表演：王拾给爷爷添了饭——这碗饭吃得比哪天都香。\n\n备注：爷孙线暖场。\n\n**B0041｜悬念｜10秒**\n\n场景：校队训练馆 · 日 · 内\n行动：市队试训邀请公开，全队围观。李程的名字第一次出现在试训名单第一行。\n\n台词：胡凯：\"李程？体校那个杀人机器？\"\n秦语（翻记录）：\"去年市联赛，他一局没让对手过五分。\"\n\n备注：李程登场预告（R3 条件角色）。\n\n**B0042｜冲突｜10秒**\n\n场景：训练馆 · 夜 · 内\n行动：王拾独自加练到深夜——第一次。陈听澜在拍子里看着他。\n\n台词：陈听澜：\"太阳打西边出来了？\"\n王拾：\"有个老头说我毛躁。\"\n陈听澜（沉默两秒）：\"……那就别让他白说。\"\n\n备注：成长种子；英灵的反应暗钩（他认得这种被长辈点醒的感觉）。\n\n**B0043｜冲突｜10秒**\n\n场景：市队训练基地门口 · 日 · 外\n行动：试训日。李程从场内走出来，两人第一次照面。\n\n台词：李程（淡淡）：\"网上的'拍子成精'？\"\n王拾：\"拍子是真的。精不精，今天试试。\"\n\n备注：宿敌线（李程）第一拍。\n\n**B0044｜冲突｜12秒**\n\n场景：市队球台 · 日 · 内\n行动：试训对抗。李程全程面无表情，每板都比王拾转半分、快一步。王拾第一次被人全面压制。\n\n台词：李程：\"你赢的那些人，没一个会打球。\"\n\n表演：王拾擦汗——手在抖，不是怕，是兴奋。\n\n尾钩→ 挫折真实化（对手真强，无黑幕）。\n\n**B0045｜悬念｜10秒**\n\n场景：基地门口 · 黄昏 · 外\n行动：试训结果未出。李程路过王拾身边，停了一步。\n\n台词：李程：\"青训营见。\"\n王拾：\"青训营是什么？\"\n李程（走远，声音飘回来）：\"你输了就不知道也行。\"\n\n备注：集末钩——青训营第一次被点名，观众和主角一起好奇。\n\n---\n\n## 第六集《市队试训》\n\n**B0046｜悬念｜10秒**\n\n场景：出租屋 · 夜 · 内\n行动：王拾查\"青训营\"：省队梯队、国家青年队入口、每年全省个位数名额。\n\n台词：王拾（内心）：\"个位数。那得先变成'个位数里的一'。\"\n\n备注：目标具象化。\n\n**B0047｜冲突｜10秒**\n\n场景：训练馆 · 日 · 内\n行动：王拾训练量翻倍。第二天顶着黑眼圈来，动作变形。\n\n台词：陈听澜：\"停。你不是机器，机器都要保养。\"\n王拾：\"我没时间了。\"\n陈听澜：\"你没身子了。手抖成这样，拿什么跟李程打？\"\n\n备注：代价线（手抖）第一次显性。\n\n**B0048｜情绪｜10秒**\n\n场景：爷爷家 · 日 · 内\n行动：爷爷看王拾练球——忽然皱眉，走过来捏了捏他的手腕。\n\n台词：爷爷：\"手怎么在抖？\"\n王拾：\"练的。\"\n爷爷（盯了他三秒）：\"……练是好事。练废了，就不是好事。\"\n\n备注：爷爷的专业眼光第一次落地（他懂）——暗线微戳。\n\n**B0049｜危险｜10秒**\n\n场景：医院走廊 · 日 · 内\n行动：爷爷体检复查。走廊里王拾攥着体检单等——医生叫进去谈话。\n\n台词：医生（画外）：\"老人心脏这三根血管……建议年内做支架手术，别拖。\"\n\n表演：王拾隔着门缝听见\"手术\"两个字，站了起来。\n\n备注：中期动机（为爷爷而战）的引信点着了。\n\n**B0050｜情绪｜10秒**\n\n场景：病房 · 日 · 内\n行动：爷爷病床上摆着平板——王拾把训练视频放给他看。爷爷看着看着，用遥控器指着屏幕。\n\n台词：爷爷：\"这一板，挥早了。\"\n王拾：\"您懂球？\"\n爷爷（把脸转向窗外）：\"懂一点。年轻的时候。\"\n\n备注：爷爷\"懂球\"第一次露头（暗线微戳）；王拾没有追问——他记下了。\n\n**B0051｜悬念｜10秒**\n\n场景：病房 · 夜 · 内\n行动：护士查房后，王拾在陪护椅上翻日志。陈听澜的声音很轻。\n\n台词：陈听澜：\"你爷爷看球的样子……和当年一模一样。\"\n王拾（抬头）：\"你见过我爷爷？\"\n陈听澜（沉默，转移话题）：\"早点睡。明天练接发。\"\n\n备注：暗线扣（本集一次，克制）。\n\n**B0052｜反常｜10秒**\n\n场景：训练馆 · 日 · 内\n行动：王拾把训练拆成\"上午体能、下午多球、晚上看录像\"三班——纪律突变。全队看傻。\n\n台词：胡凯：\"我要没记错，上个月劝你训练的人是我？\"\n王拾（贴着胶皮）：\"上个月的我已经死了。现在的我，是新立的。\"\n\n备注：反差加强（爽点）。\n\n**B0053｜冲突｜10秒**\n\n场景：队内测试赛 · 日 · 内\n行动：纪律突变的成果——王拾连胜队内所有主力，一局未失。\n\n台词：秦语（报分）：\"二十一比零，综合测试第一。\"\n\n备注：数据位（爽点）。\n\n**B0054｜悬念｜12秒**\n\n场景：出租屋 · 夜 · 内\n行动：两张纸并排放在桌上：青训营邀请函、住院部手术缴费单。日期：同一周。\n\n台词：王拾（内心）：\"一边是我等了三个月的机会。一边是我爷的心脏。\"\n\n表演：他把两张纸都翻过去扣在桌上——哪个都不敢看。\n\n尾钩→ 字幕：有些选择，不是选择题。\n\n---\n\n## 第七集《陪爷爷看病》\n\n**B0055｜情绪｜10秒**\n\n场景：医院病房 · 日 · 内\n行动：爷爷术前检查住院。王拾把平板支在病床边，放着训练录像。\n\n台词：爷爷（用遥控器指屏幕）：\"这球挥早了。\"\n王拾：\"您就说我好的地方。\"\n爷爷（想了半天）：\"……精神头好。\"\n\n备注：爷孙暖场+幽默。\n\n**B0056｜悬念｜10秒**\n\n场景：同上 · 夜 · 内\n行动：爷爷睡着后，王拾在陪护椅上翻日志——翻到某一页，忽然停住：那一页的日期，是爷爷的生日。\n\n分镜：日志页特写——\"守拙，生日快乐。今年又赢了你三局。——听澜\"\n\n台词：王拾（内心）：\"听澜……到底是谁？\"\n\n表演：他把这一页拍了照，存进手机——他开始查了。\n\n备注：暗线推进（主角主动入局查英灵身份）。\n\n**B0057｜情绪｜10秒**\n\n场景：医院天台 · 日 · 外\n行动：王拾在天台练挥拍。陈听澜第一次主动开口讲过去。\n\n台词：陈听澜：\"我那会儿训练，馆里没有空调。冬天球一打快，手冻得像胡萝卜。\"\n王拾：\"那怎么办？\"\n陈听澜：\"搓。搓热了接着打。没人心疼你——球不等人。\"\n\n备注：暗线 2-3 成配额（英灵前史第一段，轻触不展开）。\n\n**B0058｜情绪｜10秒**\n\n场景：病房 · 日 · 内\n行动：手术前夜。爷爷把王拾叫到床边，从枕头底下摸出一副旧扑克。\n\n分镜：扑克特写——边角磨圆，背面画着一只歪歪扭扭的乒乓球拍。\n\n台词：爷爷：\"你奶奶走的早。你爸在外地。我要是下不来台——\"\n王拾（把扑克按回他手里）：\"下得来。我都问过医生了。\"\n\n表演：爷爷盯着他看了半天，笑了：\"跟你太爷爷一个倔样。\"\n\n备注：情绪蓄力，克制不哭。\n\n**B0059｜情绪｜12秒**\n\n场景：手术室外 · 日 · 内\n行动：手术中。走廊长椅上，王拾把日志摊在膝盖上——一个字看不进去。\n\n分镜：走廊钟表特写（秒针声放大）→日志页被手汗洇湿一角。\n\n台词：旁白（内心）：\"两个半小时。我这辈子没那么恨过时针。\"\n\n表演：郑伯（老站长的老战友，隔壁床家属）走过来坐在他旁边，什么也没说，拍了拍他的背。\n\n备注：情绪段（无爽点，纯蓄力——全剧节奏的低谷设计位）。\n\n**B0060｜情绪｜10秒**\n\n场景：术后病房 · 日 · 内\n行动：手术灯灭。医生出来摘口罩：\"很成功。\"王拾腿一软，扶住了墙。\n\n分镜：医生口型\"成功\"→王拾长出一口气→推门，爷爷还麻着没醒。\n\n台词：旁白（内心）：\"麻药劲儿过去之前，谁都不许走。\"\n\n表演：他搬了把椅子坐在床边，把爷爷的手术服叠好放在枕边。\n\n尾钩→ 手机震：省青训营选拔邀请函——下周三，首轮。\n\n**B0061｜情绪｜10秒**\n\n场景：同上 · 夜 · 内\n行动：爷爷麻药劲儿过了，半醒。王拾凑过去。\n\n台词：爷爷（迷糊）：\"手术……做了？\"\n王拾：\"做了。您赢了。\"\n爷爷（闭着眼笑）：\"我就说。这心脏，跟球拍一样——是青川的木头做的。\"\n\n表演：王拾笑出来，眼睛却红了——镜头只拍他的手，攥着爷爷的手。\n\n尾钩→ 病房安静下来。窗外，市体育馆的灯牌亮着——青训营选拔的横幅挂上去了。\n\n**B0062｜情绪｜10秒**\n\n场景：同上 · 晨 · 内\n行动：清晨。爷爷醒了，精神头不错。第一句话就问比赛。\n\n分镜：病床→王拾把选拔日程写在小白板上——选拔首日，圈在\"周三\"。\n\n台词：爷爷：\"选拔哪天？\"\n王拾：\"周三。\"\n爷爷：\"那正好。我周三也能出院。你打你的，我出院我的——咱爷俩各干各的大事。\"\n\n表演：爷俩击了个掌——击掌的手法，和球馆里击掌的姿势一模一样（师承细节）。\n\n尾钩→ 王拾走出病房，在走廊给秦语打电话：\"帮我查一个人。陈听澜。七几年的选手。\"\n\n**B0063｜悬念｜10秒**\n\n场景：医院天台 · 日 · 外\n行动：王拾在天台等查询结果。秦语的短信回来：查无此人。\n\n分镜：短信特写\"查无此人，建议核实信息来源\"→王拾靠在天台栏杆上，看着手里的老拍子。\n\n台词：王拾（内心）：\"查无此人……那你拍子里这位，到底是谁？\"\n\n表演：风把他的头发吹乱。他把拍子翻过来——\"听澜\"两个字，被摩挲得发亮。\n\n尾钩→ 陈听澜的声音在拍子里响起：\"别查了。有些人，查到了也没用。有些人——查不到，但你认识就够了。\"\n\n（本集无爆点，纯情感集——全剧节奏设计位：低谷蓄力。）\n\n---\n\n## 第八集《云督训》\n\n**B0064｜反常｜10秒**\n\n场景：病房 · 日 · 内\n行动：爷爷出院前，王拾在病房支起平板——医院WiFi连着训练馆的摄像头：云督训系统上线。\n\n分镜：平板支架特写→画面里训练馆全景→爷爷在病床上举着遥控器。\n\n台词：爷爷：\"我就当这是包厢了。\"\n王拾：\"您这包厢，比省队主席台还近。\"\n\n备注：梗位（云督训）。\n\n**B0065｜冲突｜10秒**\n\n场景：训练馆 · 日 · 内\n行动：训练开始。平板里爷爷的声音此起彼伏。\n\n台词：爷爷（画外）：\"手腕！我说手腕！\"\n王拾（对平板）：\"爷，我手腕没毛病，是脚慢。\"\n爷爷（画外，哼）：\"脚慢就是懒。懒这个字，你爷爷我看了六十年。\"\n\n备注：梗+严师线（每镜一个认知更新：本镜=态度转变外化）。\n\n**B0066｜反常｜10秒**\n\n场景：训练馆 · 日 · 内\n行动：一周后。全队测试——王拾的体能成绩从全队倒数第五冲到前三。\n\n分镜：体测成绩表特写→全队看他的眼神→胡凯带头鼓掌（\"黑转粉\"式鼓掌）。\n\n台词：胡凯：\"我宣布，从今天起他是我亲兄弟。\"\n王拾（喘着气）：\"亲兄弟——帮我把下一组的球捡了。\"\n\n表演：全场笑。训练第一次有了\"队伍\"的样子。\n\n尾钩→ 方岚老师站在门口，看了很久，没进来——但也没走。\n\n**B0067｜情绪｜10秒**\n\n场景：门口 · 日 · 内\n行动：方岚终于走进来，把一份手写的训练计划拍在王拾面前——字迹工整，日期从今天排到选拔日。\n\n分镜：计划表特写——每一格都是针对性的短板科目。\n\n台词：方岚：\"我看了你十天。你的短板不在球，在腿。这份计划，照着练。\"\n王拾：\"您不是不带队了吗？\"\n方岚（转身走）：\"我没带队。我就是路过，顺嘴一说。\"\n\n备注：方岚线（口嫌体正直）。\n\n**B0068｜情绪｜10秒**\n\n场景：医院 · 日 · 内\n行动：爷爷术前复查。王拾推着轮椅，爷俩在住院部走廊慢慢走。\n\n分镜：走廊尽头的窗→夕阳→爷俩的影子被拉长。\n\n台词：爷爷：\"我住院这半个月，你球长进最多。\"\n王拾：\"那以后您一直住着？\"\n爷爷（敲他一下）：\"呸。往后你每赢一场，我出院一分。\"\n\n备注：暖场+幽默（梗位）。\n\n**B0069｜悬念｜10秒**\n\n场景：病房 · 夜 · 内\n行动：夜里。爷爷睡了。王拾在陪护椅上翻训练计划——陈听澜的声音从拍子里出来。\n\n分镜：台灯下的日志和训练计划→球拍立在床头柜上，剪影。\n\n台词：陈听澜：\"你爷爷这个年纪，心脏还能撑住手术——他年轻时，是扛着发电机上大堤的人。\"\n王拾（抬头）：\"你认识我爷爷？\"\n陈听澜（沉默了很久）：\"……睡觉。明天练步伐。\"\n\n表演：黑暗里，王拾盯着球拍的剪影看了很久——他确定这个声音认识他爷爷。\n\n尾钩→ 暗线第二拍（克制，不揭）。\n\n**B0070｜情绪｜10秒**\n\n场景：病房 · 日 · 内\n行动：出院日。爷爷收拾东西，把旧物箱的钥匙郑重地递给王拾。\n\n分镜：钥匙特写→爷爷的手→王拾接过来。\n\n台词：爷爷：\"箱子里那些拍子，都是听澜的。他家人当年在国外联系不上，东西是我收的。\"\n王拾（愣住）：\"……听澜是谁？\"\n爷爷（看着他，看了很久）：\"一个说话算话的人。他说过要回来跟我打一场——\"\n爷爷（转身，不再说下去）：\"走了走了，出院手续去。\"\n\n表演：话说一半就断——爷爷第一次在王拾面前失态。\n\n尾钩→ 王拾攥着钥匙站在原地——他终于知道\"听澜\"和爷爷的关系了。但他没敢问下去：因为球拍里的那位，也从没说过自己姓什么。\n\n**B0071｜悬念｜12秒**\n\n场景：出租车 · 日 · 内\n行动：回程车上。王拾把拍子从包里拿出来——陈听澜的声音第一次带了情绪。\n\n分镜：球拍特写→车窗外街景倒退→王拾的侧脸。\n\n台词：王拾：\"听澜。是你自己吧。你就是听澜。\"\n陈听澜（沉默很久）：\"……你爷爷还好吗？\"\n王拾：\"他出院了。他一直收着你的拍子。\"\n陈听澜（声音很轻）：\"……他还打球吗？\"\n王拾：\"不打了。你走以后，他再没摸过球拍。\"\n\n表演：球馆的灯光从车窗外掠过。声音再没说话。\n\n尾钩→ 【本集为全剧情绪最高点之一：暗线第一层揭开。观众此时知道：英灵与爷爷是发小——而两位老人都以为对方不知道自己在这里。】\n\n---\n\n## 第九集《承诺》\n\n**B0072｜情绪｜10秒**\n\n场景：病房 · 日 · 内\n行动：出院小结签完。爷爷把出院医嘱折好放进上衣口袋——和当年放巡堤日志的口袋是同一个。\n\n分镜：医嘱折页特写→口袋→爷俩对视。\n\n台词：爷爷：\"三年后的复查——比什么全省冠军都重要。\"\n王拾：\"您就放心。我给您盯着。\"\n\n备注：暖场+责任感的师承。\n\n**B0073｜冲突｜10秒**\n\n场景：训练馆 · 日 · 内\n行动：选拔前最后加练。陈听澜的声音第一次主动说起自己。\n\n分镜：空荡球馆→两人在球台两侧对峙的剪影。\n\n台词：陈听澜：\"明天选拔，第一种子李程。你打不过他。\"\n王拾：\"你昨天不是说我进步神速吗？\"\n陈听澜：\"进步神速，也打不过他。他练球的时间，是你活着的时间。\"\n\n表演：王拾愣住——这句话像一块石头落进水里。\n\n尾钩→ 陈听澜：\"但是——他有一条不如你。他输不起。你能输。这就是你明天唯一的优势。\"\n\n**B0074｜冲突｜10秒**\n\n场景：省青训营选拔场馆 · 日 · 外\n行动：选拔首日。全省两百多名青少年选手签到。大屏幕滚动着分组。\n\n分镜：签到长队→分组大屏→王拾的名字在第七组末位（外卡席）。\n\n台词：秦语（翻记录本）：\"七组。每组前两名出线，进淘汰轮。\"\n王拾（活动手腕）：\"外卡就外卡。卡也是牌。\"\n\n备注：爽点铺垫（外卡逆袭位）。\n\n**B0075｜冲突｜12秒**\n\n场景：第七组赛台 · 日 · 内\n行动：小组赛首轮。王拾 3 比 0——对手是体校二线，输球后当场哭了。\n\n分镜：比分牌→对手抹眼泪→王拾递纸巾（细节：他赢球但安慰对手——性格立体）。\n\n台词：王拾（递纸巾）：\"你比我强。你练球的时候，我在睡觉。\"\n对手（哭着接纸巾）：\"那你还……\"\n王拾：\"我睡觉的时候，也在想球。\"\n\n备注：梗位（睡觉=思考的反差）+性格立体。\n\n**B0076｜情绪｜10秒**\n\n场景：看台 · 日 · 内\n行动：小组赛第三轮。王拾 3 比 1。看台上，爷爷穿着出院服，胸前别着\"家属观赛\"牌——他来了。\n\n分镜：爷爷举着保温杯→王拾在场上回头，看到爷爷——愣了半秒。\n\n台词：王拾（内心）：\"……不是说出院不出门吗？\"\n爷爷（冲他挥了挥保温杯，像挥指挥旗）：\"少废话！发球！\"\n\n表演：全场笑。王拾发球的手反而稳了——有人在，手就稳。\n\n尾钩→ 小组第一出线。大屏幕更新：淘汰轮对阵——王拾 VS 李程。\n\n**B0077｜冲突｜10秒**\n\n场景：看台 · 日 · 内\n行动：淘汰轮赛前。王锐的直播镜头对准场边——他以\"青训形象大使\"身份出席，不参赛，只当牌面。\n\n分镜：王锐的直播支架→他对镜头点评：\"今天的青训选拔，专业度很高。当然——也有些网红选手，走的是流量路线。\"\n\n表演：他说\"流量路线\"时看了一眼王拾的方向。\n\n台词：弹幕（铺屏）：\"真王党在此！\"\"姓王的还在播，真王要上场了！\"\n\n备注：宿敌线（真王 vs 姓王）正面点火。\n\n**B0078｜冲突｜12秒**\n\n场景：赛台 · 日 · 内\n行动：淘汰轮首轮。王拾对省体校二号种子——开局 0 比 2 落后（对手真强）。\n\n分镜：0-2 比分牌→看台上爷爷攥紧保温杯→王拾擦汗，眼神变了——他想起日志上\"毛躁\"两个字。\n\n台词：王拾（内心）：\"毛躁。侥幸。——爷爷说得对。那就不侥幸了。一分一分磨。\"\n\n表演：他改了战术：放弃搏杀，一板一板磨——第三局 11 比 9 险胜。\n\n尾钩→ 连扳三局逆转。解说：\"青川县外卡选手王拾，展现了和他年龄完全不符的耐心——\"\n\n**B0079｜情绪｜10秒**\n\n场景：赛台 · 日 · 内\n行动：赛后。王拾走到看台下，把球拍递给爷爷。\n\n分镜：爷爷接拍→翻看拍面（行家动作：看胶皮磨损、拍柄手感）→点头。\n\n台词：爷爷（点评）：\"反手位还是虚。回去加练。\"\n王拾（咧嘴笑）：\"您就说我好的地方。\"\n爷爷：\"……你好的地方，是从来不用别人说。\"\n\n备注：爷孙线（严肃版的认可——比表扬重）。\n\n**B0080｜悬念｜12秒**\n\n场景：选拔场馆夜 · 日 · 内\n行动：大屏幕更新四强名单：王拾、李程、体校一号种子、外协交流生。半决赛对阵——王拾 VS 李程。\n\n分镜：对阵表→王拾盯着\"李程\"两个字→手机震动：爷爷住院部的复查提醒——明天上午，和半决赛同一天。\n\n表演：他看着两条冲突的日程，第一次露出难色。\n\n尾钩→ 【卡点体检：为什么看下一集？】半决赛=李程（真天才）。而爷爷的复查——也在明天。他只能选一头。\n\n---\n\n## 第十集《选拔·上》\n\n**B0081｜情绪｜10秒**\n\n场景：病房 · 晨 · 内\n行动：王拾把半决赛时间告诉爷爷。爷爷听完，从床上坐起来。\n\n分镜：病床→爷爷撑起身→他把出院自备药包塞进包里。\n\n台词：爷爷：\"我跟主治说，复查改到赛后。你去打你的。\"\n王拾：\"您刚出院——\"\n爷爷（摆手）：\"我这心脏，装了支架就是新发动机。你爷爷我——别的不敢说，扛事，行。\"\n\n表演：老爷子说\"行\"的时候拍胸脯——拍得病房隔壁都听见了。\n\n尾钩→ 王拾出门前，把平板留在床头柜上——连线训练馆摄像头。爷爷的\"云督训\"变成了\"云陪赛\"。\n\n**B0082｜冲突｜12秒**\n\n场景：半决赛场馆 · 日 · 内\n行动：半决赛开打。李程发球——第一板就拧出质量极高的反手拧拉。王拾 0 比 2 开局。\n\n分镜：李程拧拉慢镜（旋转可视化）→比分牌 0-2→看台上秦语攥着记录本。\n\n台词：李程（面无表情）：\"网上说你'拍子成精'。我看你——挺会睡觉的。\"\n王拾（擦汗，笑）：\"睡觉的时候，我在想你的发球。\"\n\n表演：他说这话时眼睛没离开李程的手——像老中医号脉。\n\n尾钩→ 第三局，他终于摸到一次李程的发球——一板爆冲，得分。全场哗然。\n\n**B0083｜冲突｜12秒**\n\n场景：半决赛场馆 · 日 · 内\n行动：中局。比分 2-2。李程叫了暂停——回来之后，发球全变了。\n\n分镜：暂停手势→新发球特写→王拾接发下网→连续两个接发失误。\n\n台词：李程：\"我赛前看了你全部录像。你的接发，只会搓和拉。\"\n王拾（内心）：\"……变了。全变了。\"\n\n表演：王拾第一次在赛场上露出被\"读\"穿的表情。\n\n尾钩→ 决胜局 5-10，李程拿到六个赛点。看台上一片死寂。\n\n**B0084｜悬念｜12秒**\n\n场景：半决赛场馆 · 日 · 内\n行动：绝境。王拾发球前深呼吸——忽然改了节奏：他开始发超短的近网球，一个比一个短。\n\n分镜：近网短球特写→李程上步接发，重心失控→连丢三分。\n\n台词：解说：\"李程不适应！这种贴网短球在现代弧圈体系里几乎绝迹了——这是老一代的打法！\"\n王拾（内心）：\"不是绝迹。是没人肯练。这种球要蹲三年马步。\"\n\n表演：他每发一个短球，就看着李程上步——像在钓鱼。\n\n尾钩→ 10 平。看台全体起立。\n\n**B0085｜情绪｜12秒**\n\n场景：半决赛场馆 · 日 · 内\n行动：决胜分。李程变招：一个高质量的爆冲——王拾反手挡了一板\"回头球\"，球贴着网带落在了李程一边。\n\n分镜：回头球慢镜（球在网带上方停顿的错觉）→李程扑救不及→球落在边线上。\n\n台词：解说：\"翻了！3 比 2！这个反手回头球——教科书上叫'落点球'，实战里十年难见一次！\"\n李程（走过来，伸出手）：\"你那个发球，谁教的？\"\n王拾（握手）：\"一个睡觉的人。\"\n\n表演：两人握手——惺惺相惜，第一次对手之间的正式对话。\n\n尾钩→ 决赛对手确定：外协交流生组合的双胞胎兄弟档（下集登场）。\n\n**B0086｜情绪｜10秒**\n\n场景：医院 · 夜 · 内\n行动：王柔回医院报喜。爷爷床头柜上多了一台小收音机——他要听体育新闻。\n\n分镜：收音机特写→爷爷调频的手→体育新闻里恰好播到青训选拔的消息。\n\n台词：爷爷（听着，点头）：\"省队开始捞人了。好事。\"\n王拾：\"爷，明天决赛——您来吗？\"\n爷爷（关掉收音机，认真）：\"来。我这辈子看过太多人打球。明天想看一个——替我看的人打。\"\n\n表演：王拾愣住——\"替我看\"这三个字，和球拍里那位说过的话，一模一样。\n\n尾钩→ 【暗线钳扣收紧：爷爷的话与英灵的话开始重合——王拾夹在中间，他知道一个秘密：明天决赛，他是两个人在打。】\n\n**B0087｜悬念｜12秒**\n\n场景：出租屋 · 夜 · 内\n行动：深夜。王拾把决赛预案写在白纸上——写着写着，笔停了。\n\n分镜：预案纸上\"战术\"一栏空白→他问空气：\"外协双胞胎，你了解吗？\"\n\n台词：陈听澜（声音从拍子里出来）：\"外协的球，我没打过。我只告诉你一件事——\"\n陈听澜：\"他们的教练，是我当年的陪练。他的体系，全部来自我。\"\n王拾（笔停在纸上）：\"……那不就是，你的打法打你的打法？\"\n\n表演：笔尖在纸上洇出一个墨点。\n\n尾钩→ 【卡点体检：为什么看下一集？】不是赢外敌——是赢师父本人发明的体系。这个题，怎么解？\n\n---\n\n## 第十一集《选拔·半决赛》\n\n**B0088｜冲突｜10秒**\n\n场景：决赛场馆 · 日 · 内\n行动：国际邀请赛开幕。双胞胎兄弟档入场——同步的热身动作，同步的甩拍，连表情都一样。\n\n分镜：双胞胎镜像动作→看台起哄→王拾眯眼（\"复制人\"既视感）。\n\n台词：解说：\"这对兄弟的配合，像一个人照着镜子打球！\"\n王拾（内心）：\"照镜子？那就是没照过别人。他们没有自己的球。\"\n表演：他看穿了——但没说。\n\n尾钩→ 教练席另一侧，锐体育的经纪人举着手机在拍（他们的新目标就是这对兄弟）。\n\n**B0089｜冲突｜12秒**\n\n场景：决赛场地 · 日 · 内\n行动：双打赛前热身。王拾与搭档（胡凯——临时凑数的）练习，配合生疏。\n\n分镜：王拾与胡凯的球一高一低→对面双胞胎的球整齐划一→胡凯喘气。\n\n台词：胡凯：\"对不住，我手潮。\"\n王拾：\"没事。你负责稳，怪球我来。\"\n胡凯（感动）：\"……你说这话的时候，特别像你爷爷。\"\n\n表演：王拾愣了半秒——爷爷的话又开始在他身上\"附体\"了（ figuratively）。\n\n尾钩→ 比赛开始。\n\n**B0090｜冲突｜12秒**\n\n场景：决赛场地 · 日 · 内\n行动：双打赛点局。对手先拿赛点——全场安静。王拾深呼吸，把拍子握紧。\n\n分镜：赛点计分牌→王拾与胡凯对视→两人点头。\n\n台词：王拾：\"胡凯，还记得我爷爷那句吗？'脚慢就是懒'——跑起来！\"\n胡凯（眼睛一亮）：\"跑起来了！！\"\n\n表演：两人连追三个球——最后一个球，胡凯飞身救球，王拾一板爆冲得分。\n\n尾钩→ 逆转夺冠。全场起立鼓掌——爷爷在病房平板前也跟着鼓掌。\n\n**B0091｜情绪｜10秒**\n\n场景：病房 · 夜 · 内\n行动：王柔回病房，把奖牌放在床头。爷爷摸着奖牌，忽然说了一句——\n\n分镜：奖牌特写→爷爷的脸→他的眼睛有点湿。\n\n台词：爷爷：\"你爸爸要是能看到……他会为你骄傲的。\"\n王拾（愣住）：\"爸？他不是——\"\n\n表演：爷爷摆摆手，闭眼睡了。王拾站在床边，心里升起一个问号。\n\n备注：暗线推进（家庭线揭秘——观众第一次知道爸爸的复杂性）。\n\n**B0092｜悬念｜10秒**\n\n场景：病房走廊 · 夜 · 内\n行动：王拾在走廊给爸爸打电话——爸爸在外地，声音冷淡：\"赢了？赢了就好。别得意。\"\n分镜：电话特写→王拾的失落→他挂了电话，看着病房的方向。\n\n台词：王拾（内心）：\"爷爷说他会骄傲。我爸说别得意。到底该听谁的？\"\n\n表演：他靠在墙上，第一次感到迷茫——原来\"家人\"的骄傲这么难拿。\n\n尾钩→ 走廊尽头，一个熟悉的身影出现——是妈妈。她提着保温桶，站在灯光下。\n\n**B0093｜情绪｜12秒**\n\n场景：病房 · 日 · 内\n行动：妈妈进来了。一家三口在病房里——爸爸也赶回来了，站在门边有点局促。\n分镜：一家三口的合影（护士帮忙拍的）→照片里三个人都笑得有点僵硬，但真实。\n台词：妈妈：\"你爸他……嘴上不会说。他跟我说，看你在场上那么拼，他半夜都没睡着。\"\n王拾（愣住）：\"他说的？\"\n妈妈：\"我说的。但他没反驳。\"\n表演：王拾低头——原来爸爸的骄傲，藏在没反驳里。\n尾钩→ 爸爸在走廊给经济公司打电话：\"我儿子的比赛，以后我要到场边看。对，每一场。\"\n\n**B0094｜冲突｜10秒**\n\n场景：决赛场馆 · 日 · 内\n行动：决赛前发布会。王锐也来了——他以\"特邀嘉宾\"身份出席，全程微笑，但眼神复杂。\n分镜：发布会全景→王锐的发言→他看王拾的眼神。\n台词：王锐：\"青训营的名额只有一个。但今天我想说——不管名额给谁，我希望他……别停下。\"\n表演：全场安静。这句话不像王锐说的——像另一个人借他的嘴说的。\n尾钩→ 大屏幕更新决赛对阵：王拾 VS 李程。全场哗然——半决赛的老对手，决赛再相遇。\n\n**B0095｜冲突｜12秒**\n\n场景：决赛场地 · 日 · 内\n行动：决赛开打。李程先声夺人——第一局 11 比 5。王拾的接发再次出问题。\n分镜：比分牌→李程的领先→看台上爷爷皱眉。\n台词：李程（场间）：\"王拾，你的接发，我只怕一种——那种贴网的。但青训营的规则改了，禁发那种球。\"\n王拾（内心）：\"改规则了？……那就换一种。\"\n表演：王拾眼神变了——他准备用\"影子球\"（英灵与爷爷的独门发球）。\n尾钩→ 【卡点体检：影子球首秀——全剧最高悬念的技术底牌，观众等了四十集。】\n\n**B0096｜情绪｜12秒**\n\n场景：决赛场地 · 日 · 内\n行动：第二局。王拾抛球——手腕一个从未见过的抖动，球贴网而过，落台后往回跳。\n分镜：影子球慢镜（球往回跳的诡异轨迹）→李程愣在原地→全场起立。\n台词：解说：\"这……这是什么发球？！球往回跳！\"\n李程（喃喃）：\"影子球……这是陈听澜的影子球。\"\n表演：李程看到这个球，想起了什么——眼神变得复杂（暗线推进）。\n尾钩→ 李程回球下网。王拾拿下第二局。\n\n**B0097｜冲突｜10秒**\n\n场景：决赛场间休息。李程走过来，压低声音。\n分镜：两人面对面→李程的表情从竞争变成好奇。\n台词：李程：\"你这个发球，全世界没几个人会。你跟陈听澜什么关系？\"\n王拾（愣住）：\"你认识陈听澜？\"\n李程：\"他是我爸的师父。我爸说过——如果乒乓球有一天消失了，就去找到会打影子球的人。\"\n表演：两人对视——原来他们的命运，早就在上一代连上了。\n尾钩→ 【暗线兑现第一拍：影子球不只是技术——它是传承的信物。】\n\n**B0098｜冲突｜12秒**\n\n场景：决赛决胜局。比分 10-10。李程也拿出了压箱底——一个和影子球对称的接法（他爸研究过的）。\n分镜：李程的接法特写→王拾愣住→比分 11-10，李程赛点。\n台词：李程（喘气）：\"我爸说——影子球有解。解法就是：别接，抢攻。\"\n王拾（内心）：\"好小子。连解法都是传承的。\"\n表演：王拾忽然笑了——不是嘲笑，是遇到了真正的对手。\n尾钩→ 最后一球：王拾发了一个\"双影子\"——左右手各一个旋转（英灵与爷爷各教一只手）。\n\n**B0099｜情绪｜14秒**\n\n【0-3秒】最后一球过网。李程的接法碰到球的瞬间，球忽然变向——落在李程台角，弹向侧面。\n分镜：决胜球慢镜→全场起立→李程看着落点，忽然笑了。\n台词：李程（走过来握手）：\"这个球……不是影子球。是你自己的球。\"\n李程：\"恭喜。青训营的名额——你配。\"\n表演：王拾握住他的手，第一次觉得\"配\"这个字有分量。\n尾钩→ 看台上，爷爷和爸爸同时起立鼓掌——两代人的认可，第一次同频。\n\n**B0100｜情绪｜10秒**\n\n场景：颁奖台。王拾举起奖杯，台下闪光灯亮成一片。王锐在直播间里举着自己的旧奖牌同框出镜。\n分镜：颁奖台→闪光灯→直播间分屏（王锐举旧奖牌）。\n台词：王锐（直播）：\"我说过他'拍子成精'——现在我收回。不是拍子成精，是人成精了。\"\n表演：王锐第一次真心为他鼓掌（黑转粉完成）。\n尾钩→ 【爽点兑现：全场最大的一次当众认可。】\n\n---\n\n## 第十三集《爷爷与球拍》\n\n**B0101｜情绪｜12秒**\n\n【0-3秒】赛后更衣室。王拾收拾东西，发现球拍的胶皮开了一道口——裂了。\n分镜：胶皮裂口特写→王拾的沉默→他用手指摸了摸裂口。\n台词：王拾（内心）：\"打了一辈子球的拍子……也累了。\"\n表演：他小心翼翼把拍子放进保护套——像给老人盖被子。\n尾钩→ 门开了，爷爷站在门口：\"走。回家。我给你看一样东西。\"\n\n**B0102｜悬念｜12秒**\n\n【0-3秒】爷爷家。爷爷从床底下拖出一口旧木箱——打开，里面是一支更旧的球拍，木柄都发黑了。\n分镜：旧球拍特写→拍柄上的刻字：\"赠 守拙兄 —— 听澜\"\n台词：王拾（愣住）：\"这是……\"\n爷爷：\"这是当年你太爷爷打球的拍子。听澜送我的。他说——'我用了，你留着。等你想打的时候，就用它。'\"\n表演：王拾拿起旧拍，掂了掂——比新拍轻，但重心更稳。\n尾钩→ 爷爷：\"三十年了。我第一天拿起来。\"\n\n**B0103｜情绪｜14秒**\n\n【0-3秒】公园石桌。爷俩对坐——爷爷执旧拍，王拾执新拍（裂了胶皮的听澜拍）。\n分镜：石桌全景→两代球拍并放在桌上→夕阳打在拍面上。\n台词：爷爷：\"规则一条：你发我接，我发你接。谁先不上手，谁扫地一个月。\"\n王拾：\"成交。\"\n表演：第一球发出去，爷爷接住了——动作生疏但架势在。第二球，王拾抽了一板——爷爷竟挡了回来。\n尾钩→ 两人越打越快。路过的街坊停下来看——两个\"疯老头和小疯子\"。\n\n**B0104｜情绪｜10秒**\n\n【0-3秒】天色渐暗。爷俩收拍。爷爷忽然说：\"下周三，社区联赛。双人组队，缺一个搭档。\"\n分镜：社区联赛海报→报名表上\"搭档\"一栏空着→爷爷把笔递给王拾。\n台词：王拾（接过笔，写下名字）：\"签了。但丑话说前头——我不让球。\"\n爷爷（笑）：\"你要让球，我就把你换回福利院。\"\n表演：爷俩互相看了一眼，同时笑了。\n尾钩→ 【卡点体检：为什么看下一集？】社区联赛只是开始——更大的赛场（市联赛）在后面，而那里的对手，一个比一个强。】\n\n---\n\n## 第十四集《名字》\n\n**B0105｜情绪｜10秒**\n\n【0-3秒】王拾在台灯下翻日志——陈听澜的声音第一次主动讲起自己的过去。\n分镜：台灯→日志→窗外的月光→拍子的剪影立在桌上。\n台词：陈听澜：\"我告诉你我叫什么——不是'听澜'。听澜是我打球的名号。我本名，叫陈守川。\"\n王拾（愣住）：\"守川……和我爷爷的名字，王守拙——\"\n陈听澜：\"我们的名字，是我们师父起的。他说，'守拙'和'守川'，一个是守心，一个是守球。守好了，都不会差。\"\n表演：王拾盯着这两个名字看了很久——原来\"守\"字辈的传承，比他想得更深。\n尾钩→ 他把\"守川\"两个字写在日志扉页——和\"守拙\"并排。\n\n**B0106｜反常｜10秒**\n\n【0-3秒】次日军训场。王拾发现自己的名字被印在了队服上——但少了一个字：\"王拾\"被印成了\"王 拾得\"。\n分镜：队服特写\"王拾得\"→王拾的怒→胡凯的解释：\"系统只认两个字的名字，你的'拾'被自动补成'拾得'了。\"\n台词：王拾（盯着\"拾得\"两个字）：\"拾得……挺好。拾得的，就是得的。\"\n表演：他穿上队服——反而比原来更合身（细节：衣服的宽松度和他的气质契合）。\n备注：梗位（拾得的禅意）+性格立体。\n\n**B0107｜悬念｜10秒**\n\n【0-3秒】训练馆。王拾在练习一个新发球——球的旋转诡异，落台后往侧面拐。\n分镜：发球慢镜（球拐弯的轨迹可视化）→陈听澜的声音响起。\n台词：陈听澜（惊讶）：\"这个旋转……你从哪学的？\"\n王拾：\"从你上次的'回头球'里自己琢磨的。你不是说回头球有解吗？我就想——那有没有一种发球，是解不了的。\"\n陈听澜（沉默）：\"……你发明了自己的第一颗球。\"\n表演：王拾笑了——第一次，他不只是学，他在创造。\n尾钩→ 陈听澜：\"这颗球——叫什么名字？\"\n王拾（想了想）：\"就叫'守拙'吧。跟我爷爷的名字一样——看着笨，其实谁也接不住。\"\n\n**B0108｜情绪｜10秒**\n\n【0-3秒】训练结束。王拾收拾东西准备走——发现门口站着秦语，手里拿着一份打印的表格。\n分镜：表格特写——\"省青训营国际交流选拔·推荐表\"→推荐人：方岚。\n台词：秦语：\"方老师让我给你的。她说——'这个疯子，该去更大的地方丢人了。'\"\n王拾（接过表格）：\"国际交流选拔……对手是谁？\"\n秦语：\"外协的青年队。听说——有一个是某世界冠军的亲弟弟。\"\n表演：王拾看着表格，第一次觉得\"外面\"这个词有了具体的重量。\n尾钩→ 他把推荐表折好放进包里——和日志放在一起。\n\n**B0109｜情绪｜10秒**\n\n【0-3秒】爷爷家。爷爷把一盘新炒的菜端上桌，忽然从围裙口袋里摸出一张老照片——年轻的爷爷和年轻的陈听澜，站在一片稻田前。\n分镜：老照片特写→爷俩的青涩脸→王拾接过来。\n台词：爷爷：\"这张照片，我藏了五十年。今天给你。\"\n王拾（看着照片）：\"爷……你和陈前辈，当年怎么认识的？\"\n爷爷（沉默很久）：\"下放农村的时候。他打球，我做饭。他说我做的饭好吃，我说他打的球好看。就这么认识了。\"\n表演：爷爷的语气很轻——但每个字都像从很深的地方捞出来的。\n尾钩→ 王拾把照片小心夹进日志——原来\"守\"字辈的传承，从爷爷这一代就开始了。\n\n**B0110｜悬念｜10秒**\n\n【0-3秒】夜。王拾在日志里写下今天的日期和\"守川\"两个字——陈听澜的声音忽然从拍子里传来，带着一丝疲惫。\n分镜：日志特写→球拍的剪影→陈听澜的声音格外清晰。\n台词：陈听澜：\"王拾。我告诉你一个秘密——我的'魂'，在你赢下李程的那一天，就开始变淡了。\"\n王拾（愣住）：\"什么意思？\"\n陈听澜：\"我的执念是没打完的那场球。你帮我打了——而且赢了。我的念想，在散。\"\n表演：王拾握紧拍子的手紧了——他忽然意识到：英灵的消散，是他自己\"配得上\"的代价。\n尾钩→ 陈听澜（声音平静）：\"别难过。这就是传承——我把球给你，你把球打下去。总有一天，你也会把球给下一个人。\"\n\n**B0111｜情绪｜10秒**\n\n【0-3秒】清晨。王拾在爷爷家门口等——爷爷拎着一袋馒头出来，看到儿子，愣了一下。\n分镜：馒头袋特写→爷爷的脸→王拾的眼神（复杂：英灵的消散让他开始珍惜眼前人）。\n台词：爷爷：\"看什么呢？上车间去——你爸让我带你去看看他新买的机器。\"\n王拾（跟着走）：\"爸买机器了？\"\n爷爷（边走边说）：\"嗯。他说——'以后儿子的球拍，我自己修。'\"\n表演：王拾愣了一下——原来爸爸一直在默默关注他的装备。\n尾钩→ 他忽然明白：家人的爱，不是挂在嘴上的——是藏在每一件具体的小事里的。他把这个感悟记在日志上。\n\n**B0112｜反常｜10秒**\n\n【0-3秒】公园石桌。王拾陪爷爷看大爷们打球——忽然有个小孩跑过来，手里举着一支儿童拍。\n分镜：小孩特写→小孩的眼睛（闪着光）→小孩把手里的儿童拍递给王拾。\n台词：小孩：\"哥哥，我能看看你的球拍吗？我在电视上看到你了！\"\n王拾（蹲下来，把自己的拍子递给他）：\"看吧。\"\n小孩（翻来覆去地看）：\"哥，你这拍子……旧旧的。\"\n王拾（笑了）：\"旧旧的，才是好拍子。新的还没长出来呢。\"\n表演：爷爷在旁边看着这一幕，嘴角微微上扬——传承的种子已经发芽。\n尾钩→ 小孩跑走时回头喊：\"哥哥！我长大也要像你一样打球！\"王拾冲他挥了挥拍。\n\n**B0113｜悬念｜10秒**\n\n【0-3秒】夜。王拾在日记里写下今天的日期——忽然发现，日志快写满了。\n分镜：日志最后一页特写→剩余空白页不多了→他翻回第一页，看着\"守拙，生日快乐\"。\n台词：王拾（内心）：\"日志快写完了……但我的球，才刚开始。\"\n表演：他翻到新的一页，写下第一行字：\"新日志，第一页。\"\n尾钩→ 窗外，月亮很亮。球拍立在桌角，拍柄上的\"听澜\"两个字，被月光照得格外清楚。\n\n**B0114｜悬念｜12秒**\n\n【0-3秒】次日军训场。胡凯举着手机冲进来：\"王拾！你看这个！\"——手机上是国际青年邀请赛的报名通知。\n分镜：通知特写→\"国际青年乒乓邀请赛·中国区选拔\"→名额：2人。\n台词：胡凯：\"省青训营推荐你去了！国际邀请赛！\"\n王拾（看着通知，第一次没有立刻回答）：\"国际……\"\n陈听澜（声音从拍子里出来，带着一丝疲惫但欣慰）：\"去吧。这是你的路——不是我的，不是你爷爷的。是你自己的。\"\n表演：王拾握紧拍子——他忽然明白了什么：传承的意义不是复制，是让下一代走出自己的路。\n尾钩→ 【本批收尾钩：国际邀请赛在等着他。而英灵的消散倒计时，也开始了——王拾要如何在失去引路人的过程中，真正学会独自打球？下一批小纲，揭晓。】\n\n---\n\n（本批范围：第 4-14 集，共 87 分镜。全部对白已过台词打磨环节。第 15 集起大纲与分集编排见《大纲》续篇。）\n", "创作思路.md": "# 创作思路页（小纲 · 拍魂 · run p-key-soul）\n\n> 本页说明前三集\"为什么这么写\"。客户批注时请对照各集分镜——意见落在具体分镜上，修改才能落准。\n\n## 第一集《捡拍》——为什么这么开场\n\n- **用\"扔东西\"开场，不用打球开场**：第一拍是搬家扔旧物，不是球场英姿。原因：这部剧的爽是\"被低估的人翻盘\"，所以必须先让观众看见\"被扔掉\"的是什么——一支锁在箱底的老球拍。扔的东西越不起眼，后面越贵。\n- **英灵在 B0002 就开口**：不做悬念拖延。《棋魂》同构的核心钩是\"器物里有人\"——这钩子越早亮，观众越早入局。憋到第二集只会让前九拍变成普通的贫穷戏。\n- **藏了两处**：①英灵听到\"王守拙\"\"老街\"后沉默五秒（他知道发小的家，但不说）；②爷爷起夜两次路过王拾房门（他发现箱子被动了）。这两处是暗线的第一对钳扣，第 25-30 集揭盅时回收。\n- **反差人设在 B0008 立住**：全校最横的人在爷爷面前只说四个字。\"横\"和\"孝顺\"必须同集出现——分开放就散了。\n\n## 第二集《入队》——为什么让他这么招恨\n\n- **睡袋、躺接球、41% 出勤**：故意的。主角前期越不把训练当回事，后面\"为爷爷认真起来\"的落差才越大；同时这些行为把全队的仇恨值拉满——观众每看一集被打脸，都会想起\"他自己也懒过\"。\n- **王锐直播点名放在集末**：大反派的第一次出现不用他本人登场，用直播间的一句话——居高临下、但还没使坏。这保留了\"他只是个被运营出来的花瓶\"的喜剧空间，也把市联赛的期待值拉满。\n- **郑伯的位置**：他不是队里的人，是圈子的记忆。他送胶皮、说\"有人要成精了\"——老一辈开始注意到主角，是主角被\"圈内承认\"的第一步（这一步故意来得早，因为主角技术上确实早熟）。\n\n## 第三集《双王》——为什么第一场大戏是市联赛\n\n- **双王同姓是结构性设计**：王拾与王锐都姓王，粉丝圈自然撕裂成\"锐王党/真王党\"——\"真王 vs 姓王\"的梗不是硬塞的，是从人物设定里长出来的。这场戏负责把这个梗立起来。\n- **半决赛打削球大爷**：故意安排一个无恩怨的对手——证明主角的\"听声\"绝活对任何打法都成立，不是只在戏剧冲突里才灵。同时大爷那句\"耳朵是真功夫\"是圈内的背书。\n- **王锐先胜一局**：hot 档也需要一次真实挫折——粉丝声浪干扰发球是环境性的、不涉黑幕的挫折，符合\"没有幕后黑手\"的整体设计。翻盘方式（把耳朵借给英灵、只听球）是主角与英灵信任的第一次兑现。\n- **结尾爷爷认出打法**：全剧暗线第一拍正式落地——爷爷不认识孙子赢了什么，但认出了那个发球姿势。这是\"拍魂\"两个字第一次被点亮，也是观众必须带着进下一集的问题：爷爷到底知道多少？\n\n## 前三章整体节奏\n\n- 爽点密度：4/4/4（每集递增一个\"情感爽\"补充\"动作爽\"）\n- 仇恨值来源刻意分散：队长（规则）、胡凯（出身）、王锐（流量）——三种不同的看不起，为三种不同的打脸预留位置\n- 两处克制：王拾没有对家人炫耀；英灵没有解释自己为什么消失——这两个\"不说\"分别是明暗两条线的燃料\n"}}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById("payload").textContent);
const flow = DATA.flow, files = DATA.files, RS = DATA.runstate;
const nodes = flow.graph.nodes, edges = flow.graph.edges;
document.getElementById("t").textContent = "工作流画布 · " + (flow.title || flow.id).replace(/^智能选题工作流 /,"");
document.getElementById("v").textContent = "v" + flow.version + " ｜ 项目 " + DATA.project;
if (DATA.deliveryPage) { const a = document.getElementById("dl-link"); a.href = DATA.deliveryPage; a.style.display = ""; }

/* ---------- 中文名映射（画布不露英文术语） ---------- */
const ZH = {"find-trope":"找梗师","internet-feel":"网感师","plot-choreographer":"剧情编排师","plot-redline":"红方评审",
  "topic-zeitgeist":"热点扫描","topic-analysis-report":"调研分析","topic-proposal":"方案主笔",
  "topic-chief-aesthetic":"审美总编","topic-delivery-gate":"交付监理","script-drama-beat":"分镜编剧",
  "scene-breakdown":"小纲师","script-final":"成品剧本师","dialogue-polish":"台词打磨",
  "structure-design":"结构选型师","novel-bible":"开书师","novel-chapter":"章回写手","deconstruct-book":"拆书师",
  "render-html":"交付页渲染","kb_load":"知识装载","kb_search":"知识检索","check_trope_combo":"梗组合校验",
  "check_aesthetic_asserts":"审美断言","check_contract_compliance":"约束对账","docx_ingest":"批注解析",
  "continuity_slice":"台账切片","continuity_commit":"台账结算","meme_harvest":"梗素材采集"};
const ST_ZH = {"done":"已完成","awaiting":"待决","pending":"待重跑","none":"未启动"};
const STAGE_ZH = {"S1":"调研","S2":"结构","S3":"大纲","S4":"小纲","S5":"成稿"};
const STAGE_COLOR = {"S1":"#5e7d5a","S2":"#4f6d8c","S3":"#9c6b4a","S4":"#7d5f8a","S5":"#a5546b"};

/* ---------- 运行状态 ---------- */
function st(n){ const s = (RS.nodes[n]||{}).status || "none"; return s; }
function persistState(){
  saveFile("run-state.json", JSON.stringify(RS, null, 2), "json")
    .then(m => { const el = document.getElementById("saved"); if (el) el.textContent = m; });
}
window.persistState = persistState;
const handles = {};
async function saveFile(name, content, ext){
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

/* ---------- 布局：阶段分段 ｜ 同级同列 ｜ 产物压阶段虚线 ---------- */
const NW=196, NH=76, GX=88, GY=64, MG=44;
let pos = {};
let stageLineX = {}, stageBand = {}, parCols = new Set();
function autoLayout(){
  const stageList = (flow.stages||[]);
  const colOf = {}, colNodes = {};
  let c = 0;
  const push = (n, col)=>{ colOf[n]=col; (colNodes[col]=colNodes[col]||[]).push(n); };
  for (const sg of stageList){
    const work = (sg.nodes||[]).filter(n=>nodes[n] && n!==sg.gate);
    if (!work.length) continue;
    // 阶段内最长路径分层：同一层级的节点共享同一竖线
    const lvl = {}; work.forEach(n=>lvl[n]=0);
    for (let it=0; it<=work.length; it++){
      for (const e of edges){
        if (e.loop || lvl[e.from]===undefined || lvl[e.to]===undefined) continue;
        if (lvl[e.to] < lvl[e.from]+1) lvl[e.to] = lvl[e.from]+1;
      }
    }
    const byLevel = {};
    work.forEach(n=>{ (byLevel[lvl[n]] = byLevel[lvl[n]]||[]).push(n); });
    const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
    const base = c;
    levels.forEach((L,i)=>{ byLevel[L].sort().forEach(n=>push(n, base+i)); });
    c = base + levels.length;
    if (sg.gate && nodes[sg.gate]) push(sg.gate, c++);
    stageBand[sg.id] = {from: base, to: c-1};
  }
  Object.keys(nodes).forEach(n=>{ if (colOf[n]===undefined) push(n, c); });
  // 阶段虚线 = 本阶段产物列的中心线：产物骑在虚线上，左侧是本阶段工序，右侧是验收门
  stageLineX = {};
  for (const sg of stageList){
    const prod = (sg.nodes||[]).find(n=>nodes[n] && n!==sg.gate && (flow.graph.outputs||[]).includes(n));
    const col = prod ? colOf[prod] : (stageBand[sg.id]||{}).from;
    if (col !== undefined) stageLineX[sg.id] = MG + col*(NW+GX) + NW/2;
  }
  // 每列节点围绕中线纵向堆叠；多节点列 = 并行组（同一就绪批）
  parCols = new Set(Object.keys(colNodes).map(Number).filter(c=>colNodes[c].length>1));
  let maxRows = 1; Object.values(colNodes).forEach(a=>maxRows=Math.max(maxRows,a.length));
  const midY = MG + (maxRows*(NH+GY)-GY)/2;
  for (const [col, arr] of Object.entries(colNodes)){
    const colH = arr.length*(NH+GY)-GY;
    const y0 = Math.round(midY - colH/2);
    arr.forEach((n,k)=>{ pos[n] = [MG + col*(NW+GX), y0 + k*(NH+GY)]; });
  }
  render();
}

function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  const w = Math.max(...xs) + NW + MG, h = Math.max(...ys) + NH + MG;
  const st = document.getElementById("stage");
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: (st.clientWidth - w * k) / 2, y: Math.max(10, (st.clientHeight - h * k) / 2) };
  applyView();
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){ document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
document.getElementById("stage").addEventListener("wheel", e=>{
  e.preventDefault();
  const r = document.getElementById("stage").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k2 = Math.min(2.2, Math.max(0.35, view.k * (e.deltaY<0?1.12:0.89)));
  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();
}, {passive:false});
let panning = null;
document.getElementById("stage").addEventListener("mousedown", e=>{
  if (e.target.closest(".node") || e.target.closest("#docpanel")) return;
  panning = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
});
window.addEventListener("mousemove", e=>{
  if (drag) { dragMove(e); return; }

function zhTitle(m){ return m.title || "未命名节点"; }
let sel = null, selEdge = null;
function drawEdges(){
  const svg = document.getElementById("edges");
  let maxC = 0, maxR = 0; Object.values(pos).forEach(p=>{maxC=Math.max(maxC,p[0]);maxR=Math.max(maxR,p[1]);});
  const W = maxC+NW+MG+60, H = Math.max(420, maxR+NH+MG*2);
  let s = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;overflow:visible"><defs><marker id="arw" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#a89f90"/></marker></defs>`;
  // 阶段虚线：穿过本阶段产物中心（autoLayout 预计算）；阶段段铺淡色底
  (flow.stages||[]).forEach(sg=>{
    const lx = stageLineX[sg.id], band = stageBand[sg.id];
    if (lx === undefined) return;
    const col = STAGE_COLOR[sg.id] || "#b8b0a4";
    if (band){
      const bx = MG + band.from*(NW+GX) - 18, bx2 = MG + (band.to+1)*(NW+GX) - GX + 18;
      s += `<rect x="${bx}" y="16" width="${bx2-bx}" height="${H-56}" rx="10" fill="${col}" opacity="0.05"/>`;
    }
    s += `<line class="stage-rule" x1="${lx}" y1="20" x2="${lx}" y2="${H-40}" stroke="${col}" stroke-width="1.2"/>`;
    s += `<text class="stage-name" x="${MG + band.from*(NW+GX) + 2}" y="34" fill="${col}">${sg.id} ${STAGE_ZH[sg.id]||sg.name||""}</text>`;
  });
  // 打回回环不常驻画布：每次打回的原因与范围各不相同，属评审结果的具体记录，
  // 仅在查看对应验收门节点时于右侧文档面板按需呈现（openNodeDoc 的「打回与回注」页）。
  // 前向边
  for (const e of edges){
    if (e.loop) continue; // 打回回注边不上画布，属门语义数据
    if (!pos[e.from] || !pos[e.to]) continue;
    const [x1,y1] = pos[e.from], [x2,y2] = pos[e.to];
    const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;

    if (e.transform) s += `<text class="edge-label" x="${mx}" y="${(sy+ty)/2-4}" text-anchor="middle">${e.transform}</text>`;
  }
  svg.innerHTML = s + "</svg>";
  svg.querySelectorAll(".edge-hit").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); selectEdge(ev, p.dataset.e); });
  });
}
function isEdgeActive(e){
  if ((e.when||"").includes("rejected")) return (RS.gate||{}).verdict === "rejected";
  if ((e.when||"").includes("challenge")) return (RS.nodes["gate-r2"]||{}).verdict === "challenge";
  if ((e.when||"").includes("route=dual")) return (flow.inputs.route||{}).default === "dual" || (RS.inputs||{}).route === "dual";
  if ((e.when||"").includes("批注回流")) return (RS.inputs||{}).批注回流 === "on";

}

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.split(/\n{2,}/).map(b=>/^<(h\d|table|ul|hr)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  return h;
}
function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

  const inputs={}; upstream.forEach(u=>nodeOutputs(u).forEach(f=>{ if(files[f]) inputs[f]="✓"; }));
  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,
    skill:m.skill||undefined, minitool:m.minitool||undefined, assist:m.assist||undefined,
    kb:m.kb||undefined, inputs:inputs,
    inputs_note: upstream.length ? "上游产物："+upstream.join("、") : "无上游",
    output:m.file||nodeOutputs(n)[0]||"(汇入下游)", preset:preset,
    parallel_with: Object.keys(pos).filter(x=>x!==n && nodes[x].stage===m.stage && pos[x][0]===pos[n][0] && nodes[x].kind!=="gate" && nodes[x].kind!=="srd"),
    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>
    <button class="tb" id="r-zero">本阶段从零重做</button><button class="tb" id="r-close">收起</button></div>
    <div class="task">${JSON.stringify(tp, null, 2)}</div>
    <div class="act"><span class="msg" id="rmsg">标记后由宿主 / 运行时消费。</span></div>`;
  drawer.classList.add("on");
  document.getElementById("r-from").onclick=()=>{ markRerun(n); openNodeDoc(n); };
  document.getElementById("r-zero").onclick=()=>{ const stg=(flow.stages||[]).find(x=>x.nodes&&x.nodes.includes(n)); if(stg&&stg.entry) markRerun(stg.entry); openNodeDoc(n); };
  document.getElementById("r-close").onclick=()=>drawer.classList.remove("on");
  function markRerun(t){
    RS.nodes[t]=RS.nodes[t]||{};
    RS.nodes[t].verdict="send-back"; RS.nodes[t].status="pending"; RS.nodes[t].round=(RS.nodes[t].round||1)+1;
    render();
  }
}
function openShelf(){
  sel=null; selEdge=null; editMode=false; render();
  docReset(); dBack.style.display="none";
  dTitle.textContent="项目文档架";
  const done=Object.values(RS.nodes).filter(x=>x.status==="done").length;
  dChips.innerHTML=chip(DATA.project)+chip("流程 v"+flow.version)+chip("节点 "+done+" / "+Object.keys(nodes).length+" 完成");
  const dels=Object.keys(files).filter(f=>f.startsWith("对外交付/")).sort();
  const inner=Object.keys(files).filter(f=>f.startsWith("内部/")).sort();
  let h=`<div class="cover">
    <h2>${(flow.title||flow.id).split(" v")[0].replace(/（.*/,"").replace(/</g,"&lt;")}</h2>
    <div class="sub">${DATA.project} ｜ 流程 v${flow.version} ｜ 更新 ${new Date().toLocaleDateString()}</div>
    <p style="font-size:13px;color:#6b665c;line-height:1.9;margin:0">点击左侧画布节点，右侧打开对应产物文档；验收门节点附裁决条与红方意见。也可从下方文档架直接打开交付件。</p>
  </div>`;
  if (dels.length){
    h+=`<div class="shelf-cap">对外交付</div>`;
    h+=dels.map(f=>`<div class="shelf-row" data-f="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5).replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`).join("");
  }
  if (inner.length){
    h+=`<div class="shelf-cap">内部产物</div>`;
    h+=inner.map(f=>`<div class="shelf-row" data-f="${f}"><span class="no">内</span><span class="nm">${f.slice(3)}</span><span class="go">打开 →</span></div>`).join("");
  }
  dBody.innerHTML=h;
  dBody.querySelectorAll(".shelf-row").forEach(r=>r.addEventListener("click",()=>openFileDoc(r.dataset.f)));
  dBody.scrollTop=0;
}
function openFileDoc(f){
  sel=null; selEdge=null; editMode=false; render();
  docReset(); dBack.style.display="";
  dTitle.textContent=f.split("/").pop().replace(/\.md$/,"");
  dChips.innerHTML=chip(f.startsWith("对外交付/")?"对外交付":"内部产物");
  dBody.innerHTML=pageize(files[f]||"（空文档）", f);
  dBody.scrollTop=0;
}
dBack.addEventListener("click", openShelf);

/* ---------- 启动 ---------- */
autoLayout();
fitView();
openShelf();
document.getElementById("stage").addEventListener("click", e=>{ if(e.target.id==="stage"){ hideTip(); } });
document.getElementById("stage").addEventListener("wheel", ()=>hideTip(), {passive:true});
</script>
</body>
</html>
