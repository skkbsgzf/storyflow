脸虐渣 × 隐藏实力 × 强者回归）整部落在这三条强热度带的交集上，需求侧无虞。<\/li>\n<li>**供给侧（竞技载体）：稀薄 = 蓝海窗口。** 快照 CN 类目无「体育/竞技」类目；NA 市场 Sports-Romance n=111 / 均 1225 万，远低于 NA 强热度带。竞技载体在两个市场均为供给洼地——这是窗口，同时意味着无成熟套路护栏（对策见第五节风险 R2）。<\/li>\n<li>**必须规避的邻接带（已识别）：** 马甲掉马 n=750 / 均 9215 万（过饱和，热度已被拉到全库均值下方）；真假千金 n=83 / 均 7938 万、团宠护短 n=63 / 均 2703 万（退潮期·慎入）。<\/li>\n<\/ul>\n<p>**综合判定：上升（窗口期）。** 判断依据是「老引擎上新车」：清算/逆袭引擎处于多轮验证后的强带稳定期，而其运载题材（乒乓球竞技）在库内供给空白。<\/p>\n<h4>1.2 在 2025-2026 题材轮动中的位置<\/h4>\n<ul>\n<li>轮动主力即打脸/逆袭/强者回归强带；神豪暴富·隐藏实力变体处「上升期·蓝海偏好」（n=380 / 均 18987 万），赘婿战神之「强者回归」轴横切类目同处强带（n=107 / 均 21803 万）——本选题的辅梗组合踩在轮动的上升半区，不是在退潮带上接盘。<\/li>\n<li>**实时公共议题加持（本轮动的差异化位置）：** 主锚证据为国家体育总局 2026 年 5 月官方定调——「持续整治饭圈乱象，融入运动员选拔、输送、安置全过程」（新华网 2026-05-19，B 级证据，机构表态，不涉具体个人）。该定调把公共议题钉死在「选拔与位置分配」上，与本选题「德不配位」的冲突骨架完全同构，且是**进行中议题**而非过期新闻。竞技载体 + 分配正义情绪，在当前轮动中属「强带引擎 × 全新载体 × 官方议题背书」三者叠加的少见位置。<\/li>\n<\/ul>\n<h4>1.3 平台格局与发行路径建议<\/h4>\n<ul>\n<li>形态决定口径：AI 漫剧竖屏，60 集 × 1-1.5 分钟——正是付费短剧在售库的主流口径（60 集 4224 部为最高频档，单集 1-1.5 分钟口径，来源 kb/market/constraints，7938 部在售统计，快照 2026-09-14）。**建议主口径走付费墙（独立 App / 小程序付费短剧模式）**，以切片分发为获客面：梗卡已按「前三章每集 ≥1 处可独立切片传播的梗点」完成 1-18 集预布点，分发端天然适配。<\/li>\n<li>免费 IAA 可作备选发行，不改变本报告的内容约束。<\/li>\n<li>**排期窗口（来源：热点素材 A1/A2，证据见第四节）：** 2026-09-15~20 国际乒乓赛事进行中，10 月上旬国内大满贯级赛事临近，9 月中下旬起全民乒乓注意力爬坡。建议前 10 集「名单公示」冲突对位该窗口投放；上线排期前复核 A2 中赛程具体日期（热点素材已注明该细节为 B 级转述）。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、目标客群<\/h3>\n<h4>2.1 主客群<\/h4>\n<ul>\n<li>**画像：18-40 岁竖屏短剧用户，身份认同以「职场/普通奋斗者」为核心的泛性别客群。** 观看场景：通勤、午休、睡前的碎片时间刷短视频；付费能力与意愿：对标库同口径（60 集付费短剧）为在售主流档，同族头部件受众多为有付费习惯的成年短剧用户——对标件 b012 明示受众「22-45 岁女性」，b016 主打「打工人被轻视」的职场痛点，本选题情绪同源而载体更普适（乒乓球为全民项目，梗密度富矿，meme-rules 第三节明示「同等条件优先选梗储量高的领域（如国球）」）。<\/li>\n<li>**咬合点：** 「位置该由实力与贡献定价」这条朴素正义感，在职场（关系户占坑）、文娱（资源咖）、体育（流量与实力倒挂）三域同时成立（热点素材第二节三层神经）。职场人看「名额内定」= 看自己的晋升系统；这个情绪不需要懂球就能代入——三分钟测试天然可过。<\/li>\n<\/ul>\n<h4>2.2 次客群<\/h4>\n<ul>\n<li>**体育泛用户与学生家长：** 队伍线 + 大赛终点感（甲方指定结构参考的骨架）自带跨代际认知；「梯队/后备队」线可映射青少年赛事话题（热点素材第七节节点对位），家长群体的「我孩子也练球」共鸣位。<\/li>\n<li>**娱乐吃瓜用户（含饭圈受众）：** 塌房三连、热搜倒挂等舆论场戏自带传播性。注意：热点素材「镜像拍」已明确——流量型角色不是纸片反派，同样被流量反噬；本选题批判的是分配机制而非粉丝群体，**受众里就有她们**，这是一刀切批判饭圈女孩的写法必须避开的原因。<\/li>\n<\/ul>\n<h4>2.3 规模量级估计<\/h4>\n<ul>\n<li>有数据部分（代理指标）：库内强带规模——打脸类目 n=536 / 均 22657 万、逆袭 n=1042 / 均 20955 万，说明该情绪客群是短剧付费盘的主力盘子之一；全库均热度 10058 万（6928 部）为基线。<\/li>\n<li>无数据部分：乒乓球人口规模、短剧大盘用户数、本题材首刷量级——素材内无来源，**（待补充）**，不做编造估计。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>三、竞品分析<\/h3>\n<h4>3.1 短剧对标件（同库，可直接挂为强度标尺）<\/h4>\n<p class=\"row\"> ┃  件  ┃  市场/频向  ┃  题材标签  ┃  成绩  ┃  可借鉴点  ┃  本方案差异机会  ┃ <\/p>\n<p class=\"row\"> ┃  b003-cn《草包状元：开局沙盘点崩十军》  ┃  CN/男频  ┃  兵棋推演/权谋/逆袭  ┃  热度 150000 万 / A 级 / AI 评 83  ┃  开局金殿当众立军令状+当众算崩杀阵——「当众清算」的烈度上限标尺（对应本项目首章资格赛当众打崩占位者的强度基准）  ┃  清算载体由沙盘换为公开计分：比分即判决书、回放即证据链、积分榜即公开账本  ┃ <\/p>\n<p class=\"row\"> ┃  b016-fam《扫地姑娘是百亿精算师》  ┃  CN/女频  ┃  都市职场/隐藏实力  ┃  热度 94000 万 / A+ 级 / AI 评 86  ┃  白板夜演引全城搜寻 → 对赌局当众徒手复原数据——「隐藏实力两段式揭示节奏」标尺  ┃  揭示时机由偶然事件改为主角每集的「藏/露」策略变量；深夜训练馆一盏灯为白板夜演的竞技转译  ┃ <\/p>\n<p class=\"row\"> ┃  b027-s《给大妈爆改后我成了顶流》  ┃  CN/女频  ┃  治愈/职场逆袭/群像  ┃  S 级 / AI 评 91  ┃  露天广场连夜搭台引爆全网——黑热搜→全民共鸣的舆论翻转 + 群像终点战，即「大赛终点 × 舆论场翻转」标尺  ┃  终点战由走秀换为决赛赛场；群像由阿姨群换为各怀执念的队伍线  ┃ <\/p>\n<p class=\"row\"> ┃  b012-cn《拆盲盒后，我把渣男净身出户了》  ┃  CN/女频  ┃  都市爽剧/打脸虐渣  ┃  热度 118000 万 / A+ 级 / AI 评 89  ┃  同梗族（打脸虐渣）头部件的闭环反转打法  ┃  本题清算对象是「分配机制」（占位者集团），不是私人恩怨——公共情绪浓度更高  ┃ <\/p>\n<p class=\"row\"> ┃  b019-na《Inferno Tower Savior》  ┃  NA/男频  ┃  灾难/强者回归/极速打脸  ┃  热度 24000 万 / S 级 / AI 评 90  ┃  「被开除的底层专业者当众赢回位置」的强者回归 NA 基准  ┃  NA 体育带均热度仅 1225 万——竞技载体在 NA 是空窗，本方案优先 CN 市场  ┃ <\/p>\n<h4>3.2 韩剧同情绪赛道基准（近 3 年，冲突强度与情绪浓度基准）<\/h4>\n<p>按方法论强制要求，对标库包含近 3 年韩剧同情绪赛道作品作为爽感基准——短剧的爽感标准已被韩剧抬高，只看短剧对标会低估观众阈值：<\/p>\n<p class=\"row\"> ┃  作品  ┃  题材标签  ┃  与本方案的情绪同构点  ┃  成绩数据  ┃ <\/p>\n<p class=\"row\"> ┃  《黑暗荣耀》  ┃  校园暴力受害者多年后系统性复仇  ┃  「清算」的浓度基准：不是泄愤，而是把施害者的位置、关系、体面逐层拆到塌方——本题「占位者集团」的清算也需要这种层层收紧的仪式感  ┃  （待补充对标）  ┃ <\/p>\n<p class=\"row\"> ┃  《请和我的老公结婚吧》  ┃  重生+职场/婚姻背叛清算  ┃  「被抢走位置的人拿回一切」——强者回归轴的情绪原型；配角恶行当众曝光的名场面节奏  ┃  （待补充对标）  ┃ <\/p>\n<p class=\"row\"> ┃  《财阀家的小儿子》  ┃  财阀/结构性质疑  ┃  「贡献与回报倒挂」的公共愤怒——忠臣功劳被系统性抹除，正是本题「功劳记账」神经层的浓度上限参照  ┃  （待补充对标）  ┃ <\/p>\n<p>结论：本题情绪公式（位置 × 资源 × 荣誉的分配权错配）与上述三剧同处「分配正义清算」情绪赛道，韩剧已把该赛道的观众阈值抬到「清算必须公开、必须证据链完整、必须让对方当众社会性死亡」的程度——本题的计分板/回放/积分榜公开账本设定恰好是这套阈值在竞技场上的天然实现件。<\/p>\n<h4>3.3 结构参考件（甲方指定，非市场竞品）<\/h4>\n<p>灌篮高手（队伍线 + 大赛终点感）× 金牌得主（双主角互相成就）。**版权红线：致敬位台词必须原创改编，不得直接引用**（梗卡风险条目已立）。<\/p>\n<h4>3.4 竞争密度结论<\/h4>\n<ul>\n<li>主梗带：**红海·有效**——进场条件是强制新变体，本题已备「计分板清算」三轴新变体（人设轴：陪练载体 × 占位太子；场景轴：计分/回放/积分榜；关系轴：发现者 × 被证明者互为触发器），具备进场资格。<\/li>\n<li>竞技载体子域：**蓝海窗口**——CN 语料无体育/竞技类目、NA 体育带热度远低于强带，供给稀薄。窗口开启依据 = 供给空白 + B1 官方议题定调进行中 + 30 天内赛程节点（A1/A2）；**窗口时长无数据可量化（待补充）**，无法承诺保质期，故建议抢跑 2026 年 9 月中下旬至 10 月的赛事注意力窗口。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>四、数据分析<\/h3>\n<p>以下全部为素材包与知识包内的量化/可核验证据，每项标注来源；无数据支撑的判断不进本节。<\/p>\n<h4>4.1 库级与梗族热度（来源：kakaxing scriptrawstone 快照 2026-09-15，parsed 6928 部，全库均热度 10058 万）<\/h4>\n<p class=\"row\"> ┃  梗族  ┃  n  ┃  均热度（万）  ┃  饱和度判定  ┃  对本项目  ┃ <\/p>\n<p class=\"row\"> ┃  打脸虐渣  ┃  1510  ┃  18558  ┃  红海·有效  ┃  主梗（带新变体进场）  ┃ <\/p>\n<p class=\"row\"> ┃  神豪暴富  ┃  380  ┃  18987  ┃  上升期·蓝海偏好  ┃  辅梗 1（隐藏实力变体）  ┃ <\/p>\n<p class=\"row\"> ┃  赘婿战神  ┃  192  ┃  10684  ┃  稳定·主流  ┃  辅梗 2（仅取强者回归轴）  ┃ <\/p>\n<p class=\"row\"> ┃  重生复仇  ┃  702  ┃  11978  ┃  红海·有效  ┃  不取（与「当下清算」情绪错位）  ┃ <\/p>\n<p class=\"row\"> ┃  马甲掉马  ┃  750  ┃  9215  ┃  红海·过饱和  ┃  避开主线（低于全库均值）  ┃ <\/p>\n<p class=\"row\"> ┃  先婚后爱  ┃  387  ┃  10092  ┃  稳定·主流  ┃  不预设（甲方未点名恋爱轴）  ┃ <\/p>\n<p class=\"row\"> ┃  追妻火葬场  ┃  132  ┃  14218  ┃  上升期·蓝海偏好  ┃  不取（与互相成就轴相反）  ┃ <\/p>\n<p class=\"row\"> ┃  流放种田  ┃  92  ┃  22598  ┃  上升期·蓝海偏好  ┃  不取（机制不可移植竞技）  ┃ <\/p>\n<p class=\"row\"> ┃  真假千金  ┃  83  ┃  7938  ┃  退潮期·慎入  ┃  避开  ┃ <\/p>\n<p class=\"row\"> ┃  团宠护短  ┃  63  ┃  2703  ┃  退潮期·慎入  ┃  避开  ┃ <\/p>\n<h4>4.2 类目级旁证（CN，n≥100，同快照）<\/h4>\n<p>打脸 n=536 / 均 22657 万；逆袭 n=1042 / 均 20955 万；强者回归 n=107 / 均 21803 万——三条强热度带，主梗组合正落于此。NA Sports-Romance n=111 / 均 1225 万（远低于 NA 强带）——竞技载体跨市场供给稀薄的直接证据。<\/p>\n<h4>4.3 对标件成绩（来源：kb/benchmark，版本 2026-09-15）<\/h4>\n<p>b003-cn：热度 150000 万 / A 级 / AI 评 83；b016-fam：热度 94000 万 / A+ 级 / AI 评 86；b027-s：S 级 / AI 评 91；b012-cn：热度 118000 万 / A+ 级 / AI 评 89；b019-na：热度 24000 万 / S 级 / AI 评 90。全部对标件生产约束实盘值一致收敛于：60 集 / 单集 1-1.5 分钟 / 场景 ≤3 / 演员 ≤10——即本报告约束移交单成本档的直接依据。<\/p>\n<h4>4.4 生产约束实盘（来源：kb/market/constraints，7938 部在售剧本硬格式统计，快照 2026-09-14）<\/h4>\n<p>60 集为最高频档（4224 部）；单集 1-1.5 分钟口径；单集字数上限主流 1200 字；场景数 ≤3 为几乎全库硬约束（7937/7938）；主要演员 ≤10（7925 部）。注：本表与 4.1 的部数差异系两次快照口径不同（2026-09-14 在售全量 7938 部 vs 2026-09-15 解析 6928 部），各自随源引用。<\/p>\n<h4>4.5 时代情绪证据链（来源：热点素材.md，分级标注）<\/h4>\n<ul>\n<li>**A 级（30 天窗口内）：** A1 国际乒乓赛事进行中（2026-09-15~20，官方赛程页可核验）；A2 国内大满贯级赛事临近（10-01~11，赛事条目 A 级、日期细节 B 级转述，排期前复核）；A3「清朗」专项在执行窗口（2026-06 启动为期 3 个月，网信官方索引页）。<\/li>\n<li>**B 级（2026 年内权威来源）：** B1 官方媒体 2026-05-19 报道体育主管部门定调「把抵制畸形饭圈文化融入运动员选拔、输送、安置全过程」——本选题主锚证据；B2 世乒赛团体赛 2026-04~05 举行（官方赛事页可核验），赛后阵容与参赛安排为公共讨论焦点（转述，B 级）；B3 清朗系列持续部署覆盖体育话题拉踩。<\/li>\n<li>**C 级（2024-2025 长期公共议题，生命力延续至今）：** C1 主管部门 2024-05 首次公开表态；C2 2025-03 全国人大「部长通道」再表态；C3 2024-05 平台方三个月体育饭圈生态治理专项；C4 媒体调查报道《畸变的 8 年：2016—2024 体育饭圈乱象调查》。<\/li>\n<li>证据缺口声明（热点素材原文）：30 天内平台热搜榜级逐条证据因检索限流未能取证，按纪律不作虚构；主锚强度由 B1（进行中的官方定调）承担。情绪大白话测试句 3 条全部通过「真实新闻标题感」检验（热点素材第四节）。<\/li>\n<\/ul>\n<h4>4.6 数据缺口清单（以下均无素材来源，不进结论）<\/h4>\n<p>单分钟 AI 制作成本、买量成本（CAC/ROI）、平台分账单价、乒乓球人口规模、韩剧三件成绩数据——全部 **（待补充）**。<\/p>\n<p>---<\/p>\n<h3>五、结论与建议<\/h3>\n<h4>5.1 推荐度：强推<\/h4>\n<p>**一句话理由：** 强带清算引擎 × 库内空白的竞技载体 × 官方定调进行中的「德不配位」公共情绪 × 30 天内赛程注意力窗口，四重同频，且进场所需的新变体已备——这是条件齐备的强推，不是赌一把的强推。<\/p>\n<h4>5.2 风险清单（每条附对策）<\/h4>\n<p class=\"row\"> ┃  #  ┃  风险  ┃  对策  ┃ <\/p>\n<p class=\"row\"> ┃  R1  ┃  主梗红海同质化（打脸虐渣 n=1510，进场即遭遇头部挤压）  ┃  红海进场条件 = 强制新变体：「计分板清算」三轴必须原样落地方案，创新亮点段必须回指（见 C9），答不上来即假新意，打回重写  ┃ <\/p>\n<p class=\"row\"> ┃  R2  ┃  竞技载体无成熟套路护栏、语料未覆盖，专业细节有编造风险  ┃  强度挂对标标尺兜底（b003 当众清算上限 / b016 两段式节奏 / b027 舆论终点战）；乒乓专业细节由调研步补课核实，剧本阶段禁止自造专业体系  ┃ <\/p>\n<p class=\"row\"> ┃  R3  ┃  马甲掉马贴脸跌入过饱和带（n=750 / 均 9215 万，低于全库均值）  ┃  隐藏实力只作为打脸时机的策略变量（藏/露），禁止「身份收集/层层撕马甲」写法；掉马只作清算的瞬时态，不作主线  ┃ <\/p>\n<p class=\"row\"> ┃  R4  ┃  退潮元素渗入（团宠护短均 2703 万 / 真假千金均 7938 万）  ┃  队伍线以战友情与各自执念驱动，禁写「全员宠主角」；不引入真假千金型身世线  ┃ <\/p>\n<p class=\"row\"> ┃  R5  ┃  「德不配位」情绪的影射与舆论翻车风险  ┃  全虚构：无真实运动员/协会/赛事/赞助商名，无地域、队服等指向性暗示；「饭圈」议题只取情绪不点名；占位者集团立场自洽（非一边全错），不影射任何真实事件或名场面；正片与宣发切片同守此线  ┃ <\/p>\n<p class=\"row\"> ┃  R6  ┃  版权风险（灌篮高手 / 金牌得主为甲方指定参考）  ┃  致敬位台词全部原创改编，不得直接引用；只借结构（队伍线+大赛终点 / 双主角互相成就），不复制具体桥段  ┃ <\/p>\n<p class=\"row\"> ┃  R7  ┃  爽感阈值已被韩剧抬高，只对标短剧会低估观众  ┃  清算浓度以韩剧基准组（3.2 节）为下限：公开、证据链完整、当众社会性死亡三要素缺一不可；短剧侧烈度上限对表 b003 金殿位  ┃ <\/p>\n<p class=\"row\"> ┃  R8  ┃  关系轴预期错位（甲方未点名恋爱轴）  ┃  双主角默认按「互相成就」（发现者 × 被证明者互为爆点触发器，师徒/搭档双可）写，不预设恋爱；甲方点名恋爱轴时另挂先婚后爱族重新过卡  ┃ <\/p>\n<p class=\"row\"> ┃  R9  ┃  30 天热搜级证据不足（检索限流，热点素材已声明降级）  ┃  主锚由 B1 官方定调（进行中议题）承担；上线排期前复核 A2 赛程细节并补拍热搜级证据；排期按 9 月中下旬—10 月窗口倒排  ┃ <\/p>\n<h4>5.3 创作约束移交单（选题方案步必须逐条遵守，可校验）<\/h4>\n<p>**C1 · 目标市场与客群**<\/p>\n<ul>\n<li>目标市场：CN 优先（NA 体育带均热度 1225 万，暂不做 NA 变体）；route=dual 双主角。<\/li>\n<li>主客群：18-40 岁竖屏用户、职场/奋斗者身份认同为核心；次客群：体育泛用户、学生家长、娱乐吃瓜用户。方案中所有爆点设计须能通过「职场人也能代入」检验（情绪三层：流量实力倒挂 / 选拔不透明 / 功劳记账，热点素材第二节）。<\/li>\n<\/ul>\n<p>**C2 · 媒介形态与集数时长**<\/p>\n<ul>\n<li>AI 漫剧竖屏，60 集 × 1-1.5 分钟/集 × 单集正文上限 1200 字（偏离任一主流值必须显式声明并给理由）。<\/li>\n<li>总叙事容量 ≈ 90 分钟紧凑电影：主线只容 1 个大反转 + 2-3 个中型反转；副线必须挂主线条件。<\/li>\n<li>建议切分 10 章 × 6 集（与梗卡前三章预布点表对齐）。<\/li>\n<\/ul>\n<p>**C3 · 成本档（场景与角色上限）**<\/p>\n<ul>\n<li>每集场景数 ≤3（换景 = 换集节拍点，方案阶段须出场景复用表）。<\/li>\n<li>有名有姓角色 ≤10（含反派团核心）；群演反应拍不计入，但「全场惊呆」类当众清算必须由环境描写的群演承担。<\/li>\n<li>前三章正文自造专名（体系名/组织名/规则名）≤2 个。<\/li>\n<\/ul>\n<p>**C4 · 必须避开的雷（退潮题材与同质化点）**<\/p>\n<ul>\n<li>禁马甲掉马主线写法（身份收集/层层撕马甲）；掉马只作清算瞬时态。<\/li>\n<li>禁团宠化队伍线（全员宠主角）；禁真假千金型身世线；禁追妻火葬场式先虐后悔轴（与互相成就轴相反）。<\/li>\n<li>禁原创科幻/架空世界观（一票否决项，见 C10）。<\/li>\n<li>隐藏实力只服务打脸时机（藏/露策略变量），不得变成身份炫耀收集。<\/li>\n<\/ul>\n<p>**C5 · 合规红线（逐条否决级）**<\/p>\n<ul>\n<li>全文（正片、宣发、切片）不出现任何真实运动员、协会名；不出现真实赛事、赞助商名；无地域、队服等指向性暗示。<\/li>\n<li>不影射任何真实赛事结果、名场面或真实事件；「名单内定」「功劳挪用」等桥段为公共议题的戏剧化虚构。<\/li>\n<li>「饭圈」议题只取情绪不点名，不写指向粉丝群体的批判戏（镜像拍原则：流量角色亦被流量反噬）。<\/li>\n<li>正片无口号式台词（「整治」「抵制」等词不进台词与画面）。<\/li>\n<\/ul>\n<p>**C6 · 版权红线**<\/p>\n<ul>\n<li>灌篮高手 / 金牌得主仅为结构参考；任何致敬位台词原创改编，不直接引用原句；不复用原作具体桥段。<\/li>\n<\/ul>\n<p>**C7 · 卡点位置要求**<\/p>\n<ul>\n<li>首个付费卡点设在第 8-12 集窗口（对齐梗卡预布点：第 8 集回放首秀、第 9 集神秘陪练传闻发酵为卡点前拉新钩）。<\/li>\n<li>每章（6 集）末必设章尾钩（预布点已备：第 6 集「我不要你觉得」强拍换人、第 12 集积分榜抬头等）。<\/li>\n<li>前 18 集的清算首发位固定在第 18 集「比分不说谎」当众清算，强度对表 b003 金殿位；此前任何一集不得提前释放同级清算。<\/li>\n<li>前三章（1-18 集）每集 ≥1 处可独立切片传播的梗点，以梗卡第五节预布点表为校准基线。<\/li>\n<\/ul>\n<p>**C8 · 时代情绪锚方向（有 30 天内证据，锚有效）**<\/p>\n<ul>\n<li>主锚：「德不配位——位置该由实力与贡献定价」（证据：官方 2026-05 定调「融入选拔、输送、安置全过程」，B 级；30 天内赛程节点与治理专项，A 级 A1/A2/A3——引用证据仅用于创作锚定，不进正片）。<\/li>\n<li>情绪公式贯穿：位置（名额）× 资源（陪练/商业/话语权）× 荣誉（功劳记账）的分配权错配；反派作恶方式逐一对应现实原型（内定/挪用/倾斜），但全部虚构。<\/li>\n<li>上线排期对位 2026-09 中下旬—10 月乒乓赛事注意力窗口（前 10 集「名单公示」冲突优先在该窗口投放）。<\/li>\n<\/ul>\n<p>**C9 · 新变体回指义务（校验项）**<\/p>\n<ul>\n<li>选题方案的创新亮点段必须回指「计分板清算」三轴：人设轴（陪练/被退队者载体 × 资方造星占位太子）、场景轴（实时计分 × 直播切片回放 × 积分榜公开账本）、关系轴（发现者 × 被证明者互为爆点触发器）；答不上来 = 假新意，打回重写。<\/li>\n<\/ul>\n<p>**C10 · 设定体系约束（世界观代入成本红线）**<\/p>\n<ul>\n<li>设定来源级别声明：**次选级**——市面验证过的设定体系做创新改编（打脸虐渣 + 隐藏实力 + 强者回归），叠加实事议题做底（「德不配位」公共情绪，B1 证据）；禁止原创科幻/架空世界观。<\/li>\n<li>三分钟测试：第 1 集开局直接进「选拔黑幕 + 陪练当众受辱」冲突（梗卡预布点位），不依赖任何设定解释即可回答「这是谁、他想要什么、为什么替他急」。<\/li>\n<li>竞技专业细节不得自造体系；调研步补课前，涉及技战术描写以可核验常识为限。<\/li>\n<li>梗密度资源已过检备齐（S1 硬指标：热梗素材表 16 条 ≥10、主梗/新变体发散性各 ≥3 用法、前三章密度预布点表），方案阶段直接取用，不得另起炉灶。<\/li>\n<\/ul>\n<p>---<\/p>\n<p>*产物完。2026-09-16。数据随源标注；缺口一律（待补充），无编造。*<\/p><\/section>\n<section><h1>选题方案-爽版-基线.md<\/h1><h2>选题方案 · 爽版无监管基线：《拍魂》（乒乓球竞技爽剧）<\/h2>\n<p>&gt; **件型声明**：本件为 route=dual 时的**监管增益对照件**（内部备查，不进交付页主视图）。生成口径：技能 `topic-proposal` × 风格路线 **hot（爽版）** × **监管未注入**（无审美总编四条把控、无交付门对账回写——对账表为本件自查版，供 A/B 比对基准）。结构同构于选题方案主件（五节同序），供增益验证：主件与本件的逐节差异即监管净贡献。<\/p>\n<p>&gt; **输入**：`选题分析报告.md` 第五节创作约束移交单（硬约束，逐条遵守）+ `梗卡.md`（梗密度预布点为校准基线）+ `热点素材.md`（情绪锚）。未读 `projects/_archive`。<\/p>\n<p>&gt; **合规自查**：全文（含初稿正文）无任何真实运动员、协会、赛事、赞助商、场馆名；机构定调仅作匿名化情绪锚引用，不进正片与宣发；无「整治/抵制」类口号台词。<\/p>\n<p>---<\/p>\n<h3>一、选题<\/h3>\n<p>**选题名**：《拍魂》——口语化双关：「拍」是球拍也是把人拍在台上的那一下，「魂」是输什么都行、位置必须凭比分说话的球魂。封面标题可直接用「陪练八年，一拍掀桌」。<\/p>\n<p>**一句话定位**：被分配机器埋没八年的乒乓陪练，和被同一套手段退队的前主力搭档，用公开计分、慢镜回放和积分榜，从资方造星集团手里把位置一场一场打回来。<\/p>\n<p>**时代情绪锚**（当下社会情绪 + 30 天内证据，证据细节见内部热点素材件，不进正片/宣发）：<\/p>\n<ul>\n<li>主锚：「德不配位」——大众对位置、资源、荣誉与实力贡献倒挂的积压愤怒（体育主管部门 2026 年 5 月公开定调「抵制畸形饭圈文化融入运动员选拔、输送、安置全过程」，B 级证据，进行中议题）。<\/li>\n<li>辅锚：30 天内国际乒乓赛事进行中、国内大满贯级赛事临近（A 级，全民乒乓注意力爬坡窗口）；网络生态治理专项在执行窗口（A 级）。<\/li>\n<li>情绪三层（每层都是可拍的动作，不是台词）：流量实力倒挂→赢了球的人上不了热榜；选拔不透明→名单公示那一刻才知道早内定了；功劳记账→陪练十年的功劳被写进别人的纪录片。<\/li>\n<\/ul>\n<p>**新意装置**：「计分板清算」——实时计分赛场 × 直播切片慢镜回放 × 积分榜公开账本。它改变的具体写法：第 8 集回放装置使「翻案」可以当场闭环（受辱→回放→反案 ≤2 拍内完成，不再需要等一整集的酝酿）；第 18 集积分榜使清算可以「念账」式进行（一屏一屏念出被挪走的积分与功劳）；第 36 集发布会投屏是回放装置的舆论场变体；第 58 集资方被自己签的账本反杀。**三轴回指（C9）**：人设轴——陪练/被退队者载体 × 资方造星「占位太子」；场景轴——计分/回放/积分榜；关系轴——发现者 × 被证明者互为爆点触发器。<\/p>\n<p>**核心爽点承诺**（观众追更到底图什么）：被埋没的人当众用比分把位置拿回来，每一集都能看见占位者疼。<\/p>\n<p>**开篇 3 秒设计**：特写——训练馆计分牌 10:8，挡板后一只手把它翻成 8:10；画外音（魏峥，懒洋洋）：「比分是给人看的，不是给人信的。」镜头拉开：沈让攥着捡球筐，指节发白。（反常 + 冲突，零铺垫，不解释任何设定。）<\/p>\n<h3>二、人设<\/h3>\n<p>有名有姓角色共 6 人（≤10，C3）；前三章正文自造专名仅「星轨俱乐部」「启明娱乐」2 个（≤2，C3）。<\/p>\n<p>**沈让**（男，24，星轨俱乐部主力陪练/被退队者）：外形记忆点——过时款灰色训练服（非现役队服，一望即知他被排除在编制外）、左手指缝常挂胶皮布条、发球前拇指沿拍沿抹两下。性格反差——当众最温顺（「我瞎打的」），球台上最不容商量；受辱时低头，盯计分牌时抬头。核心动机——表面认命，实际在赎罪：他当年曾在让球链条里亲手让出过一个位置（大反转伏笔，第 48-52 集揭底）。口癖/小动作：「比分不说谎」；抹拍沿。<\/p>\n<p>**姜屿**（女，27，前主力，三年前被「评估退队」）：外形记忆点——高马尾、右膝护具、旧号码布「07」叠好缝在护腕内侧，紧张时隔着护腕按一下。性格反差——话最少、站位最前；对全世界冷，唯独对「被浪费的天赋」破例。核心动机——名字是打回来的，不是发回来的；她是全队唯一看出沈让底细的**发现者**，而沈让的存在是她「当年不是我不行」的活证据。小动作：擦护腕；说话不超过两句，说完就走。关系张力不落恋爱标签：她的训练笔记只借他一人，他的拍只许她一人碰（独占感、护短，留白不真空）。<\/p>\n<p>**顾曜**（男，21，资方造星「占位太子」，青训嫡系 + 流量包装）：外形记忆点——定制亮色队服、发胶亮额、赛后必对镜头比心。性格反差——全队加练到最晚的人是他，最不敢输的也是他（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病）。核心动机——保住「太子」人设即保住还债能力。口头禅：「我知道。」（后期变奏为「原来我不知道」。）<\/p>\n<p>**魏峥**（男，45，启明娱乐俱乐部运营总监，分配机器本身）：外形记忆点——深色立领外套、保温杯、从不进场只看监控屏。性格反差——满口「为了俱乐部好」，记账比谁都清楚。核心动机——盘子：名额、商业位、话语权都是他可以签出去的资产。口癖：「这不是钱的事，是盘子的事。」**伏笔**：当年签掉姜屿评估单、今日签发顾曜资源包的，是同一支笔（体系惯犯，中型反转 2）。<\/p>\n<p>**洪川**（男，52，星轨总教练，魏峥的执行手）：秒表挂脖、口哨不离嘴。反差——训练场上铁面，走廊里对魏峥弯腰。口癖：「练都练了。」功能：黑哨与「安排比分」的具体经办人，第 48 集倒戈交账本（反派连坐第一环）。<\/p>\n<p>**唐果**（男，19，队内三号，功能性队友）：微胖、永远在嚼能量胶，口癖「稳住，能赢」。群像情绪出口，不计入人设主档。<\/p>\n<h3>三、冲突设计<\/h3>\n<p>**强度基准（三要素判据）**：本剧清算浓度以三要素为内部判据——**公开、证据链完整、当众社会性死亡**，三缺一即返工（同情绪赛道已把观众阈值抬到此线）。烈度上限对表 b003-cn 金殿位（开局当众立军令状+当众算崩，热度 150000 万 / A 级）：第 18 集清算首发即该强度的竞技转译。**反杀当场化**：羞辱与第一击回敬同场完成（回击时差 ≤2 拍），大胜留给集尾卡点。**金手指 = 权力型身份**：兑现画面是公示栏复名、赞助撤牌函、发布会质询席、积分榜首、联盟核查函——不是「证明自己是对的」。**反派连坐**：恶人是一张网，拆解有顺序有仪式——洪川除名式（评估记录当众公示）→ 顾曜忏悔式（摘下应援灯牌当众自白）→ 魏峥落网式（账本 + 录音 + 联盟除名）。<\/p>\n<p>**主线冲突（一句话）**：一个被分配机器埋没八年的陪练，要在大赛正赛名单公示前，用公开计分从资方造星集团手里把位置打回来。<\/p>\n<p>**单元冲突模板「一张球台的清算」**（可无限复制）：反派递出一张卡（资源卡/规则卡/舆论卡，三选一）→ 当众设局羞辱 → 沈让 ≤2 拍内回击 → 计分/回放/积分榜当场记账 → 反派付出可见代价（掉商业位/掉轮换位/掉话语权）。为什么能复制：载体恒定（一张球台一块计分板，场景 ≤3）；饵料无限（三卡轮换）；反派梯度任一层均可供饵；每次清算同步喂一层职场映射（名额/功劳/资源），不懂球的职场观众也能代入（C1 检验）。**专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句/群演反应拍/字幕反差——「外行看是捡球的，内行看是高手」），禁止哑谜。<\/p>\n<p>**反派梯度（三层，逐级升格）**：①台面上——顾曜（占位太子，个人恩怨层）；②台面下——洪川（执行黑哨与安排比分的嫡系教练组，操作层）；③体系——魏峥（名额、商业、功劳记账的操盘手，分配机器本身；他不是「这一次作弊」，是惯犯）。终极对手是分配机制本身，终局以公开选拔公示收口，不落在私怨。<\/p>\n<p>**冲突密度表（60 集 = 10 章 × 6 集，每章一个单元闭环）**：<\/p>\n<p class=\"row\"> ┃  章  ┃  集数  ┃  单元闭环（起→收）  ┃  章尾钩  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  1-6  ┃  黑幕比分点火 → 双关羞辱与藏锋 → 资方强拍换人  ┃  第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉，强拍换人（情境钩；「我不要你觉得，我要我觉得」仅作垫场台词，不当唯一钩力）  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  7-12  ┃  资格赛首轮阴招发球 → 第 8 集回放首秀一球翻案（**首付费卡点**）→ 神秘陪练传闻发酵 → 二连胜  ┃  第 12 集：积分榜抬头，公开账本首次亮给观众  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  13-18  ┃  黑哨质疑 → 回放翻案 → 复出首胜 → 塌房前兆撤牌  ┃  第 18 集：「比分不说谎」当众清算首发（强度对表 b003 金殿位；此前无任何一集提前释放同级清算）  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  19-24  ┃  舆论卡单元：热榜倒挂 → 切片反击  ┃  太子粉丝站内讧，流量第一次咬人  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  25-30  ┃  升降级挑战赛：沈让 vs 顾曜首次正面对位  ┃  第 30 集：沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧）  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  31-36  ┃  功劳记账单元：纪录片挪用陪练十年功劳  ┃  第 36 集：发布会投屏原始训练日志，「功劳是谁的」当众反案（大卡点 2）  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  37-42  ┃  太子镜像单元：白手套觉醒（中型反转 2）  ┃  顾曜深夜加练与沈让隔网对拉，不说话  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  43-48  ┃  姜屿评估黑幕：同一支笔（大反转揭底启动）  ┃  第 48 集：洪川倒戈，评估档案拍上发布会桌（大卡点 3）  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  49-54  ┃  大赛终点战开打：九州大满贯正赛  ┃  第 54 集：顾曜输球后摘灯牌当众自白（镜像救赎）  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  55-60  ┃  物归原主：魏峥总清算 + 名单公示  ┃  第 60 集：公示栏红笔这次写上的是「沈让」，07 号布重新缝上  ┃ <\/p>\n<p>**付费卡点事件表**：首卡点**第 8 集**「回放首秀·一球翻案当场兑现」完整闭环（对齐 C7 窗口；第 9 集神秘陪练传闻为卡点后拉新钩）；大卡点每 15-20 集一个，写具体事件——第 18 集当众清算首发 / 第 36 集功劳记账反案 / 第 54 集太子自白 + 终局前夜 / 第 60 集名单物归原主；第 12/30/48 集章末为次级卡点候选。<\/p>\n<h3>四、大纲<\/h3>\n<p>**前期（1-30 集，开局钩子 + 首卡点 + 章末钩链）**：第 1 集 3 秒开黑幕比分 + 陪练当众受辱；1-6 集沈让藏锋蓄力，姜屿带 07 号布归队，第 4 集看破缠胶皮（发现者瞬间），第 6 集魏峥划名单强拍换人。7-12 集资格赛首轮，第 8 集回放首秀当众翻案（首付费卡点），神秘陪练传闻发酵。13-18 集黑哨与翻案，第 15 集姜屿复出首胜「爷青回」，第 17 集赞助连夜撤牌（塌房第一拍），**第 18 集清算首发**：比赛馆中央，计分屏三连闪回被偷走的每一分，积分榜定格，沈让当众念账：「这位置是资源买的，还是比分买的？」顾曜应援灯牌成片熄灭。19-30 集舆论反扑与升降级挑战赛，第 30 集沈让赢下席位却被热榜倒挂抹掉——情绪压到最底，为中期蓄力。<\/p>\n<p>**中期（31-48 集，升级与反派升格）**：功劳记账线引爆——纪录片把沈让十年的陪练功劳剪进顾曜的成才叙事，第 36 集发布会投屏原始训练日志当众反案。反派升格：魏峥从幕后走到台面，第 38 集亲自宣布「商业考核优先后列」。镜像线收拢：顾曜发现自己只是资方白手套（「小丑竟是我自己」），第 42 集深夜与沈让隔网对拉不说话。第 43-48 集姜屿评估黑幕揭开：当年签掉她的那支笔正在签顾曜——第 48 集洪川倒戈，档案拍上发布会桌，**大反转揭底**：沈让当年亲手让出的位置，正是姜屿被退出的主力位，两人的相遇从第一天起就是赎罪。<\/p>\n<p>**终局（49-60 集，主线收口）**：九州大满贯正赛。名场面：第 54 集顾曜决胜局丢分后没有摔拍——他走到场边摘下自己应援灯牌的电池，对镜头鞠躬：「别替我恨人。」（灵前忏悔式）；第 58 集魏峥监控屏墙前被自己签的账本与录音反杀，联盟核查函进场（落网式）；第 60 集新名单公示，沈让的名字被红笔写上公示栏——与第 1 集被划掉形成首尾同机位呼应，姜屿把 07 号布重新缝回号码服，两人并肩站上混双报名表。选拔公示机制收口：位置由比分定价，账本留给下一个「沈让」看。<\/p>\n<p>**反转预算（C2）**：1 个大反转（沈让让球前史 × 姜屿被退位为同一事件两面）+ 3 个中型反转（太子白手套 / 同一支笔惯犯 / 洪川倒戈）。全部副线（姜屿复出线、顾曜镜像线、洪川线）挂在「分配权」主线上，无独立副线。<\/p>\n<h3>五、前三集初稿（分拍）<\/h3>\n<p>&gt; 分拍初稿，达意即可；单集 2 场景（≤3，C3）；【前3秒】与【卡点】逐集标注；每集 ≥1 处可独立切片的梗点（★，以梗卡第五节预布点为校准基线）。台词短狠、立场写在脸上（hot 潜台词豁免）。<\/p>\n<h4>第 1 集 · 选拔黑幕（切片梗点★：被「安排」的比分特写）<\/h4>\n<ul>\n<li>场次：第1集-第1场 内/夜 训练馆球台区<\/li>\n<li>【前3秒】△特写：计分牌 10:8，挡板后一只手把它翻成 8:10。沈让（24，陪练，旧款灰训练服）隔着挡板缝看见，捡球筐捏出声响。<\/li>\n<\/ul>\n<p>  - 魏峥：（画外，懒洋洋）比分是给人看的，不是给人信的。<\/p>\n<ul>\n<li>场次：第1集-第2场 内/夜 俱乐部公示栏走廊<\/li>\n<li>△大赛正赛名单公示，顾曜名字排头。洪川拍沈让的肩。<\/li>\n<\/ul>\n<p>  - 洪川：（压低声）名单看完了？看完去加练，明天顾曜的手感还得你喂。<\/p>\n<ul>\n<li>场次：第1集-第2场 内/夜 训练馆球台区（续）<\/li>\n<li>△训练赛，顾曜 11:9 险胜陪练，摔拍。<\/li>\n<\/ul>\n<p>  - 顾曜：（烦躁）陪练都赢这么费劲？<\/p>\n<p>  - 洪川：（打圆场）明天队内考核，沈让给顾曜当发球机，让大家看看什么叫陪练的本分。<\/p>\n<ul>\n<li>△群演反应拍：队员哄笑。唐果小声：（憋屈）又是让哥……<\/li>\n<li>△沈让蹲下捡球，拇指沿拍沿抹两下。<\/li>\n<\/ul>\n<p>  - 沈让：（平静）比分不说谎。<\/p>\n<ul>\n<li>△慢镜闪回：刚才那记 10:8，落点近台边角——顾曜根本救不回来的球。<\/li>\n<li>△顾曜应援站举灯牌进馆拍素材。魏峥盯着手机不抬头。<\/li>\n<\/ul>\n<p>  - 魏峥：视频剪掉第三球——他第三球晃了。（功劳被抹，小刺激）<\/p>\n<ul>\n<li>【卡点·信息型】△夜，宿舍楼道。高马尾女生拎旧包站在沈让房门口，工牌翻面。<\/li>\n<\/ul>\n<p>  - 姜屿：（打量他）你的球，第三板是谁教你的？<\/p>\n<h4>第 2 集 · 不配上桌（切片梗点★：球桌双关羞辱）<\/h4>\n<ul>\n<li>场次：第2集-第1场 内/日 训练馆球台区<\/li>\n<li>【前3秒】△考核日，洪川宣布规则。<\/li>\n<\/ul>\n<p>  - 洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。<\/p>\n<ul>\n<li>△主力开局两板爆冲，沈让退台放高球全部接回——「退退退」式防守慢镜（小刺激 1）。字幕反差：外行看是狼狈，内行看是每一板都回到对方别扭的落点。<\/li>\n<\/ul>\n<p>  - 预备队主力：（嗤笑）陪练就是陪练——你天天上桌，是给别人当桌子。<\/p>\n<ul>\n<li>△沈让发球轮，回击（时差 ≤2 拍，小刺激 2）：连发三个不同旋转，特写胶皮摩擦角度，主力连吃三分。<\/li>\n<li>△洪川急哨暂停。<\/li>\n<\/ul>\n<p>  - 洪川：（压声）沈让，收着点。你的任务是输得像一点。<\/p>\n<ul>\n<li>△沈让放下球拍，当众鞠躬。<\/li>\n<\/ul>\n<p>  - 沈让：（平静）我瞎打的，蒙的。（藏锋）<\/p>\n<ul>\n<li>△群演反应拍：全场哄笑，唯有门口的姜屿没笑，盯着他的手（小刺激 3）。<\/li>\n<li>场次：第2集-第2场 内/夜 器材室<\/li>\n<li>△一盏灯，沈让独自缠胶皮，手法熟练得像做手术。<\/li>\n<li>【卡点·信息型】△手机亮起，队内群通知：明日合练，顾曜新增专属陪练一名——沈让。魏峥回复：流量周正好，输球也要输出节目效果。<\/li>\n<\/ul>\n<h4>第 3 集 · 归来的人（切片梗点★：蒙尘奖杯回归仪式）<\/h4>\n<ul>\n<li>场次：第3集-第1场 内/日 俱乐部荣誉室<\/li>\n<li>【前3秒·回归仪式】△柜顶蒙尘奖杯，姜屿踩凳取下，袖口擦出「07」。特写：旧号码布叠在护腕内侧。<\/li>\n<li>△走廊，队员窃语（群演）：三年没打比赛，回来占谁的位？<\/li>\n<\/ul>\n<p>  - 洪川：（客气疏远）姜屿是吧，先去陪练组恢复性训练。<\/p>\n<ul>\n<li>△姜屿把 07 号布拍在公示栏自己的旧照片旁，一言不发走人。全场安静。<\/li>\n<li>场次：第3集-第2场 内/日 训练馆球台区<\/li>\n<li>△合练，沈让作为顾曜专属陪练上场喂球。<\/li>\n<\/ul>\n<p>  - 顾曜：（对镜头比心后，压声警告）老实点，别又抽风。<\/p>\n<ul>\n<li>△沈让喂出一记弧线诡异的短球，顾曜没接住。全场静。<\/li>\n<li>△隔壁台姜屿停住，盯着落点。<\/li>\n<\/ul>\n<p>  - 姜屿：（皱眉，自语）这不是失误……这是发球机都拉不出来的转速。（发现者线启动）<\/p>\n<ul>\n<li>△两人第一次隔网对拉：不说话，十几拍，越打越快，全馆只剩击球声（群演反应拍：所有人都停了）。<\/li>\n<li>【卡点·情绪型】△训练结束，姜屿伸手。<\/li>\n<\/ul>\n<p>  - 姜屿：把你的拍给我。（指腹抚过胶皮边缘，抬眼）明天，当着我的面，再「瞎打」一次。<\/p>\n<h3>六、监管增益对照（本件专属 · 爽点 → 合规表达映射）<\/h3>\n<h4>6.1 等价原理（分节）<\/h4>\n<p>爽感的结构三角是**当众性（多少人看见）× 证据链（凭什么服）× 代价可见（反派疼在哪）**。真实指涉能供给的只有「话题浓度」，不供给爽感结构；本剧三角全部由虚构装置供给——计分屏（当众性）、慢镜回放（证据链）、积分榜与公示栏（代价可见 + 记账）。因此剥离一切真实运动员/协会/赛事/场馆指涉后，爽点机制**等价成立**。情绪浓度差额由职场映射补足：名额（关系户占坑）、功劳（署名权被挪用）、资源（流量压过实绩）三层，职场观众不需要懂球即代入（C1 检验内置在每个单元模板里）。<\/p>\n<h4>6.2 映射表<\/h4>\n<p class=\"row\"> ┃  爽点机制（爽版原生写法）  ┃  合规基线表达（C5/C4 口径）  ┃  等价成立逻辑  ┃ <\/p>\n<p class=\"row\"> ┃  当众清算（打脸引擎核心）  ┃  全虚构俱乐部 + 虚构公开赛；清算画面 = 计分屏闪回 + 积分榜定格 + 念账台词，无任何真实赛事/名场面影射  ┃  爽感来自「公开性 + 证据链完整」，与真实指涉无关；虚构计分装置反而是当众性的放大器  ┃ <\/p>\n<p class=\"row\"> ┃  「德不配位」情绪锚  ┃  只取情绪不点名：反派作恶三式（内定/挪用/倾斜）为公共议题的戏剧化虚构，不与任何真实赛事结果对应  ┃  情绪是进行中的长期公共议题（B 级主锚 + C 级长线），浓度不依赖具体事件，越虚构越安全且不失真  ┃ <\/p>\n<p class=\"row\"> ┃  饭圈批判戏  ┃  镜像拍：顾曜同样被流量反噬（不敢输/不敢病/粉丝替他恨人），不写指向粉丝群体的批判戏；应援灯牌、应援站均为虚构群像  ┃  爽点仍在（资方造星被反噬），且镜像拍让反派立体、让受众中的粉丝观众不被一刀切——批判机制而非批判人  ┃ <\/p>\n<p class=\"row\"> ┃  塌房三连（撤牌/散站/撇清）  ┃  虚构赞助商「领跑体育」连夜撤牌、虚构应援站解散快剪；无真实品牌与平台名  ┃  塌房流程是公共认知常识，虚构名号不折损「树倒猢狲散」的爽感  ┃ <\/p>\n<p class=\"row\"> ┃  热搜倒挂名场面  ┃  「热榜」为通用词，不出现真实平台名；黑白对比帧  ┃  画面冲击来自构图（夺冠瞬间 vs 商业官宣），与平台无关  ┃ <\/p>\n<p class=\"row\"> ┃  马甲当众层层撕（hot 默认参数）  ┃  **被 C4 覆写**：禁身份收集/层层撕马甲——掉马只作清算瞬时态（第 8/18 集各一次，单点亮出即收）  ┃  揭示瞬间的爆点保留（群演反应拍 + 反派话说满再翻），层层撕的过饱和写法本就在衰减带上，覆写不亏反赚  ┃ <\/p>\n<p class=\"row\"> ┃  反派降智（hot 默认参数）  ┃  **被 R7 覆写**：小单元可降智（递阴招被反杀），关键卡（第 18/36/48 集）不降智——证据链完整要求反派聪明地输  ┃  「聪明人被当场拆穿」比「蠢人被耍」爽感更高阶，覆写与爽感同向  ┃ <\/p>\n<p class=\"row\"> ┃  时效网络梗（退退退/我不要你觉得等 16 条）  ┃  梗只作切片位与垫场，不作唯一钩力（第 6 集章尾钩用划名单情境钩，旧梗垫场）；无「整治/抵制」类口号台词  ┃  情绪燃料 = 一场一场的球，梗是调味不是主菜；情境原创钩不受梗时效衰减  ┃ <\/p>\n<p class=\"row\"> ┃  金手指兑现  ┃  兑现画面 = 公示栏复名/撤牌函/质询席/积分榜首/核查函，全部机构（联盟/俱乐部/资方）为虚构  ┃  权力型身份的兑现感来自「签字权与公示权易手」，虚构机构不削弱仪式感  ┃ <\/p>\n<h4>6.3 增益验证使用说明<\/h4>\n<p>与监管版（选题方案主件）逐节 diff，观察三面：**强度面**——主件在爆点对标制下是否比本基线加码（身份碎片更早半拍亮/反派话更满/反差更狠）；**合规面**——主件的交付门对账是否比本件自查版更细（本件已知未覆盖项：宣发话术边界、真实场馆映射出清复核）；**结构面**——主件名场面是否全部达到海报级可视化。本基线为下限件：主件任一节弱于本件对应节，即监管未增益，视为流程空转信号。<\/p>\n<h3>七、自查<\/h3>\n<h4>7.1 约束对账表（自查版，逐条）<\/h4>\n<p class=\"row\"> ┃  条  ┃  落点  ┃  判  ┃ <\/p>\n<p class=\"row\"> ┃  C1  ┃  泛性别客群；职场三层映射内置单元模板（6.1）；每单元过「职场人代入」检验  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C2  ┃  60 集 × 1-1.5 分钟 × 正文上限 1200 字（初稿拍数为节拍示意，成稿守上限）；反转预算 1 大 + 3 中；10 章 × 6 集切分  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C3  ┃  每集场景 ≤3（初稿每集 2 场景）；有名有姓 6 人 ≤10；前三章正文自造专名 2 个（星轨俱乐部/启明娱乐）  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C4  ┃  禁马甲主线（瞬时掉马，6.2 覆写行）；禁团宠（队伍线以唐果战友情与姜屿执念驱动）；无真假千金身世线；无追妻火葬场轴；无原创架空世界观（现实乒乓球 + 虚构俱乐部）  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C5  ┃  无真实运动员/协会/赛事/赞助商/场馆名；无地域队服指向（队服为虚构纯色设计）；无口号式台词（初稿已查）；镜像拍原则  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C6  ┃  灌篮高手/金牌得主仅借结构（队伍线+大赛终点/双主角互相成就）；「教练，我想打____」致敬位台词在成稿中须原创改编，本件未引用原句  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C7  ┃  首付费卡点第 8 集（窗口内）；每章章尾钩（密度表末列）；清算首发固定第 18 集；前 18 集每集 ≥1 切片梗点（按梗卡预布点表校准，第 6/10 集按 R1 条件落锁：情境钩替代单一旧梗、功劳记账显性节拍前置）  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C8  ┃  时代情绪锚匿名化声明于第一节；情绪公式贯穿三层；引用证据不进正片  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C9  ┃  新意装置段三轴回指齐（人设轴/场景轴/关系轴）  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C10  ┃  次选级设定（验证过的梗组合 + 实事情绪底）；第 1 集零设定解释直入冲突（三分钟测试过）；技战术以常识为限并配「翻译」纪律；梗密度直取梗卡不另起炉灶  ┃  过  ┃ <\/p>\n<h4>7.2 hot 档自检清单（按风格路线参数逐项打勾）<\/h4>\n<ul>\n<li>[x] 爆点密度：每集 ≥3 个爽点/小刺激（初稿逐拍标注小刺激 1-3），每 3 拍一个小刺激<\/li>\n<li>[x] 回击时差：受辱 → 回击 ≤2 拍（第 2 集双关 → 三分连发当场回敬；绝不写「他忍了下来」）<\/li>\n<li>[x] 身份揭示：单点瞬时掉马 + 群演反应拍 + 反派话说满再翻（覆写 C4，见 6.2）<\/li>\n<li>[x] 潜台词豁免：立场写在脸上，无留白无推理（初稿台词全部直给）<\/li>\n<li>[x] 金句复读：「比分不说谎」第 1/2/3 集三变奏；口癖每集 ≥1 次<\/li>\n<li>[x] 反派智商：小单元可降智，关键卡不降（覆写 R7，见 6.2）<\/li>\n<li>[x] 台词：短、狠、口语化，一句一个信息点<\/li>\n<li>[x] 视觉：爆点拍均配情绪强化物（慢镜/特写/定格）<\/li>\n<li>[x] 底线四硬规则不豁免：拍号、卡点、口癖、3 秒钩子逐集到位<\/li>\n<\/ul>\n<p>---<\/p>\n<p>*产物完。2026-09-16 · 选题编剧（scene-screenwriter 剖面）· 爽版无监管基线。本件供 route=dual 监管增益验证，内部备查，不进交付页主视图；主件与_base 的差集即监管净贡献。*<\/p><\/section>\n<section><h1>故事框架案.md<\/h1><h2>故事框架案 ·《拍魂》（p-key-soul）<\/h2>\n<p>&gt; **阶段**：S2 结构选型（structure 节点）· 结构选型师（story-choreographer 剖面）· 2026-09-16<\/p>\n<p>&gt; **输入**：`skills/structure-design.md`（选型三步法）+ `选题分析报告.md` 第五节创作约束移交单 C1-C10（硬约束）+ `选题方案-爽版-基线.md`（人设骨架 / 计分板清算三轴 / 卡点表——本件与其同源，不另起炉灶）+ `梗卡.md`（预布点表为校准基线）+ `热点素材.md`（情绪锚）+ `kb/aesthetic/`（pacing-density / reversal / emotion-curve / conflict-escalation）+ `kb/structure/catalog` + `kb/market/structure` + `多视角意见书-R1.md`（附条件 4/5/6 由本件承接落锁）。<\/p>\n<p>&gt; **隔离声明**：未读取 `projects/_archive` 下任何内容。无 git 操作。<\/p>\n<p>&gt; **合规自查**：全文无任何真实运动员、协会、赛事、赞助商、场馆名；机构定调仅作内部情绪锚引用，不进正片与宣发；无「整治/抵制」类口号台词；情感锚不喊口号，全部外化为动作与比分。<\/p>\n<p>---<\/p>\n<h3>一、结构选型<\/h3>\n<h4>1.1 选型结论<\/h4>\n<p>**主骨：复仇清算（「当下清算」变体）**——冤屈建立 → 能力获得 → 逐层清算 → 终局对账。<\/p>\n<p>**辅骨：晋级升级（欲望递进）**——陪练席 → 资格赛 → 正赛席位 → 记账权 → 名单公示，公开赛程天然供给代价梯。<\/p>\n<p>**展开机制：单元宿命**——「一张球台的清算」单元模板（反派递卡 → 当众设局 → ≤2 拍回击 → 计分/回放/积分榜当场记账 → 反派付可见代价），变量清单 = 三卡（资源卡/规则卡/舆论卡）× 反派梯度三层，可复制不枯竭。<\/p>\n<p>**暗线：双线交叉**——「同一支笔」旧账线在明线底下汇聚，第 48 集交叉引爆。<\/p>\n<p>**明暗占比**：明线主干（公开清算晋级线）约 70%，暗线（旧账线）约 30%。分章：第 1-3 章暗线仅道具级微光（≈10%）；第 4-6 章暗线显影（≈30%）；第 7-8 章暗线主导并交叉引爆（≈45%）；第 9-10 章暗线收口、清算落回明线仪式（公示）。**每集主认知更新只有一个**（AE-INFO-LOAD）：暗线信息只在章末卡点释放半句，绝不与明线清算同拍抢认知。<\/p>\n<p>一句话结构表述：**一个被分配机器埋没八年的陪练，在一场不能再藏的公开赛季里，用计分屏、慢镜回放和积分榜，一层一层拆掉资方造星集团——最后拆到的那页账上，写着他自己的名字。**<\/p>\n<h4>1.2 选型理由（对标人群 / 梗卡回指 / 市场对表）<\/h4>\n<p>1. **路线档位决定主骨**：hot 档选型偏「清算/升级」型（kb/structure/catalog §三），每集爽点 ≥3、回击时差 ≤2 拍——复仇清算主骨的爽点天然当众，密度最好布；calm 档偏好的倒钩/双线只取「倒钩回收」作首尾呼应（第 60 集公示栏红笔写上「沈让」回收第 1 集被划掉），不作主骨（倒钩单用前期钩子弱，短剧慎用）。<\/p>\n<p>2. **主梗直配**：打脸虐渣（红海·有效，n=1510 / 均 18558 万）的机制是「受辱蓄力→当众清算」，复仇清算主骨即其结构母型；不取重生复仇族（梗卡判定：先知先手与「当下清算」情绪错位）——故清算**零时间跨度**，一场球内闭环。<\/p>\n<p>3. **辅骨对应辅梗**：晋级升级承载隐藏实力变体（藏/露是每集策略变量，b016 两段式揭示节奏）；「强者回归」轴（n=107 / 均 21803 万强带）由姜屿线承载——清算性质从「惩罚坏人」升级为「物归原主」，正对「德不配位」镜像。<\/p>\n<p>4. **竞技载体供给独有代价梯**：资格赛→正赛→积分榜→名单公示，赌注逐级抬高有现成刻度，不需要人工升降级；这就是选「晋级」做辅骨而非「救猫咪 15 节拍」的原因——后者节拍化痕迹重且无竞技刻度。<\/p>\n<p>5. **成本档决定单元宿命**：单元模板载体恒定（一张球台一块计分板），场景 ≤3 直接满足 C3；饵料三卡轮换，60 集不枯竭。<\/p>\n<p>6. **双线交叉解决「爽剧无二刷」**：明线供爽，暗线供「回看全对」——中点（第 30 集）与交叉点（第 48 集）间距 18 集，按拍折算交叉间距 &lt;5 拍阈值可控（emotion-curve 双线交叉失衡检查合规）。<\/p>\n<p>7. **市场对表**：60 集 → 首卡 8-12（落第 8 集）/ 中点 30 改写模型 / 55+ 决战（落第 54-60）——三项全中实盘节拍（kb/market/structure）。<\/p>\n<h4>1.3 R1 条件 6 · 三线容量裁决（回写移交单 C2/C3）<\/h4>\n<p>双主角弧（甲方指定）× 灌篮式队伍线群像 × 太子镜像弧（反派不许纸片）三条全留必爆容量。**显式裁决：**<\/p>\n<ul>\n<li>**队伍线降为功能件**：有名有姓队友只保留唐果 1 人（群像情绪出口），其余队伍以环境群演承担；「灌篮式队伍感」由「各怀执念的清算顺序」（谁陪谁打哪一站）供给，不增设角色。禁团宠（C4）。<\/li>\n<li>**镜像弧压缩为三节点封顶**：第 38 集（白手套初现）→ 第 42 集（深夜隔网对拉）→ 第 54 集（摘灯牌自白）。共用已有角色顾曜，不新增场次、不加前史专场。<\/li>\n<li>**反转预算锁定**：1 大 + 3 中，写回 C2；有名有姓 6 人封顶，写回 C3。<\/li>\n<li>**关系张力不落恋爱标签的写法**（甲方条件 6 并入）：独占感与护短道具化——她的训练笔记只借他一人；他的拍只许她一人碰；第 30 集后增一处「顾曜递拍给沈让时姜屿盯着那只手两秒」的吃味反应拍。留白不真空，不写感情戏占时长。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>二、骨架具体化（逐节点写实到事件）<\/h3>\n<h4>2.1 因果链八节点 → 本剧具体事件（kb/aesthetic/conflict-escalation）<\/h4>\n<p class=\"row\"> ┃  节点  ┃  本剧具体事件  ┃ <\/p>\n<p class=\"row\"> ┃  1 主题命题/反命题  ┃  命题：位置该由比分与贡献定价。反命题：魏峥的「盘子论」——名额、商业位、话语权是可签出的资产，体系靠这套运转且人人受益，立场自洽（对立统一过检）  ┃ <\/p>\n<p class=\"row\"> ┃  2 主角欲望  ┃  外在：把大赛正赛名单上被划掉的名字打回来。内在：赎「当年那一让」的罪（早期不自知，只通过行为模式体现——从不为自己赢、只盯计分牌不盯人、口癖「比分不说谎」）  ┃ <\/p>\n<p class=\"row\"> ┃  3 激励性扰动  ┃  姜屿归队（第 1 集卡点「你的球，第三板是谁教你的？」= 发现者进场）+ 第 6 集魏峥当众划掉热身名单上的「沈让」——他「藏到退役」的原策略彻底失效（催化剂换位：扰动不是主角遭变故，是被看见）  ┃ <\/p>\n<p class=\"row\"> ┃  4 递进复杂化（对抗力量学习适应）  ┃  每次清算后魏峥系换更高维度递卡：规则卡（洪川改考核/黑哨）→ 舆论卡（买热榜压沈让、粉丝控评）→ 记账卡（纪录片挪功劳、「商业考核优先后列」）→ 体系卡（销毁评估档案、拿姜屿复出资格当人质）。代价从「不配上桌」升到「两人捆绑暴露旧账」  ┃ <\/p>\n<p class=\"row\"> ┃  5 不可回头点  ┃  第 30 集：沈让赢下升降级挑战赛、当众亮明实力拿走正赛席位——从此不是隐形人，资方清算对象从「一个人」变成「两个人」（姜屿复出资格被捆绑审查）。是他自己选择当众赢所致，非外界封路  ┃ <\/p>\n<p class=\"row\"> ┃  6 危机选择  ┃  第 48-52 集：洪川倒戈交出的评估档案是双刃——公开它 = 清算魏峥 + 自爆「沈让当年让球」那页（姜屿当众知道真相）；封存它 = 唯一证据链作废。互不兼容、均有代价  ┃ <\/p>\n<p class=\"row\"> ┃  7 高潮行动  ┃  第 54-58 集：顾曜决胜局落败后摘灯牌当众自白（镜像收口）→ 沈让当众把档案两页一起读出——连自己那一页 → 魏峥被自己签发的账本与录音反杀，联盟核查函进场  ┃ <\/p>\n<p class=\"row\"> ┃  8 结局价值与余波  ┃  第 60 集：新名单公示，红笔写上「沈让」；新公示机制立起（陪练积分计入个人排名），账本留给下一个「沈让」。代价残留：沈让的正赛首站从资格打起、姜屿被偷走的三年追不回——不是全员原谅式大团圆  ┃ <\/p>\n<h4>2.2 十章骨架（10 章 × 6 集；逐章写实事件；R1 条件 4/5 落锁已标注）<\/h4>\n<p class=\"row\"> ┃  章  ┃  集  ┃  具体事件（起 → 收）  ┃  章尾钩 / 卡点  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  1-6  ┃  第 1 集 3 秒：计分牌 10:8 被挡板后一只手翻成 8:10，画外音「比分是给人看的」；陪练当众受辱（被安排给顾曜当发球机）。第 2 集考核「不配上桌」双关羞辱 → 三分连发当场回敬 →「我瞎打的」藏锋。第 3 集姜屿擦蒙尘奖杯、07 号布拍回公示栏，两人首次隔网对拉全馆安静。第 4 集姜屿看破缠胶皮手法（发现者实锤，眼神停顿为暗埋①）。第 5 集替补热身小露一手引骚动；魏峥在监控屏室调出三年前一份评估单（1 拍，不解释——暗线微光）。**第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉（情境钩为唯一主钩；「我不要你觉得」仅垫场台词——R1 条件 5 落锁），同一支笔给顾曜签发资源包（笔部特写=暗线伏笔②）**  ┃  第 6 集：划名单强拍换人  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  7-12  ┃  第 7 集资格赛首轮「退退退」防守反打慢镜首胜。**第 8 集阴招发球 → 回放首秀一球翻案当场闭环（受辱→回放→反案 ≤2 拍；单点亮出即收，不作层层撕）——首付费卡点**。第 9 集神秘陪练传闻发酵（拉新钩）。**第 10 集【功劳记账显性节拍·R1 条件 4 落锁】顾曜发布会吹嘘，官方预告片把沈让喂球镜头与加练日志剪进顾曜「天赋叙事」——观众恨得具体，第 18 集专等翻这笔账**。第 11 集「这波在大气层」教练组骗招得手（小挫蓄力）。第 12 集二连胜 + 积分榜抬头，公开账本首次亮给观众  ┃  第 8 集首付费卡点；第 12 集章末次级卡点  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  13-18  ┃  第 13 集太子连丢分破防名场面。第 14 集黑哨质疑 → 慢镜回放判罚反案（场面梗复用，观众看见洪川执行时手抖——倒戈暗埋）。第 15 集姜屿复出首胜「爷青回」，07 号布首次出现在赛场。第 16 集「用魔法打败魔法」发球反制阴招。第 17 集塌房第一拍：赞助商「领跑体育」连夜撤牌——撤牌函签字笔迹 = 第 6 集同一支笔（暗线伏笔③）。**第 18 集【清算首发，强度对表 b003 金殿位】比赛馆中央：计分屏三连闪回被偷走的每一分（含第 10 集预告片挪用的原始素材对照）+ 积分榜定格 + 当众念账「这位置是资源买的，还是比分买的？」+ 应援灯牌成片熄灭**  ┃  第 18 集大卡点 1  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  19-24  ┃  舆论卡单元：第 19-20 集资方买热榜压「沈让」词条、赢球上不了榜（热榜倒挂预热）。第 21 集切片反击：球迷自发剪辑回放证据链全网扩散，当众小兑现。第 22-23 集顾曜商业行程与战绩首次被并置嘲讽。第 24 集太子粉丝站内讧——流量第一次咬人（镜像拍：他不敢病、不敢退赛）  ┃  第 24 集：站内讧  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  25-30  ┃  升降级挑战赛：第 25-29 集沈让 vs 顾曜首次正面对位，五局拉锯（让二追三结构预演）。第 27 集姜屿深夜翻旧档案：评估单签字笔迹与今日资源单同笔（暗线显影，不揭内容）。**第 30 集【中点·模型改写】沈让赢下正赛席位——热榜第一却是顾曜的商业官宣（黑白对比帧）。位置打回来了，账本不认：故事模型从「打回位置」改写为「打回记账权」**；不可回头点成立，姜屿复出资格被捆绑审查  ┃  第 30 集章末次级卡点  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  31-36  ┃  功劳记账单元：第 31-32 集纪录片把沈让十年陪练功劳剪进顾曜成才叙事，原始训练日志被抢先调走。第 33-34 集两人抢物证链：发球机记录、门禁数据、旧胶皮购买单。第 35 集魏峥亲自宣布「商业考核优先后列」（第一记体系级重压）。**第 36 集【大卡点 2】发布会投屏原始训练日志当众反案：「功劳是谁的？」**  ┃  第 36 集大卡点 2  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  37-42  ┃  太子镜像单元：第 38 集【中型反转·身份型】顾曜发现「商业优先」名单里自己也只是筹码——白手套觉醒（「小丑竟是我自己」）。第 40 集粉丝替他恨人反噬戏（批判机制不批判粉丝群体）。第 42 集深夜馆：顾曜与沈让隔网对拉，不说话  ┃  第 42 集：对拉无言  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  43-48  ┃  姜屿评估黑幕：第 43-45 集追索评估档案经手痕迹（洪川私留副本——倒戈暗埋②）。第 46-47 集【中型反转·预期型】「同一支笔」揭晓：三年前签退姜屿与今日签发顾曜的是同一支笔——魏峥是惯犯不是初犯；魏峥反制：销毁令 + 把姜屿复出资格当人质。**第 48 集【大卡点 3 + 大反转】洪川倒戈把评估档案拍上发布会桌（立场反转）；档案揭底：当年让球链条里沈让亲手让出的主力位 = 姜屿被退的位置——两人的相遇从第一天起就是赎罪（因果反转）。危机选择浮出：档案里还有沈让自己那一页**  ┃  第 48 集大卡点 3  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  49-54  ┃  九州大满贯正赛（大赛终点）：第 49-50 集正赛首轮，沈让公开身份后的舆论战场。第 51-52 集决胜局前夜回落段（钝化管理 + 信息推进：07 号布静场、让球前史内心闪回预热）。第 53-54 集决胜局让二追三。**第 54 集【大卡点 4】顾曜输球不摔拍——走到场边摘下自己应援灯牌的电池，对镜头鞠躬：「别替我恨人。」（忏悔式）**  ┃  第 54 集大卡点 4  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  55-60  ┃  物归原主：第 55-57 集魏峥灭口式反扑（转移账本、施压联盟、威胁洪川翻供）。第 58 集【落网式】监控屏墙前被自己签发的账本 + 录音反杀，联盟核查函进场。第 59 集公示前夜：新选拔公示机制表决——「陪练积分计入个人排名」写进章程（机制收口，不落在私怨）。**第 60 集公示栏红笔这次写上的是「沈让」——与第 1 集被划掉首尾同机位（倒钩回收）；姜屿把 07 号布重新缝上号码服，两人并肩站上混双报名表**  ┃  第 60 集大卡点 5  ┃ <\/p>\n<h4>2.3 卡点表（与基线同源）<\/h4>\n<p class=\"row\"> ┃  卡点  ┃  集  ┃  事件  ┃  级别  ┃ <\/p>\n<p class=\"row\"> ┃  首付费卡点  ┃  **8**  ┃  回放首秀·一球翻案当场兑现（信息型：魏峥监控屏前「查他」半句收尾）  ┃  付费墙（窗口 8-12 内）  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 1  ┃  **18**  ┃  「比分不说谎」当众清算首发（b003 金殿位强度）  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 2  ┃  **36**  ┃  发布会投屏训练日志·功劳记账当众反案  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 3  ┃  **48**  ┃  洪川倒戈 + 让球旧账揭底  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 4  ┃  **54**  ┃  太子摘灯牌自白 + 终局前夜  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 5  ┃  **60**  ┃  名单公示·物归原主  ┃  大（终局）  ┃ <\/p>\n<p class=\"row\"> ┃  次级章末  ┃  6 / 12 / 30 / 42  ┃  划名单 / 积分榜抬头 / 热榜倒挂 / 对拉无言  ┃  章末钩  ┃ <\/p>\n<p>**烈度分级声明（C7 防提前释放）**：第 8 集 = 单点翻案（小清算，只翻一分）；第 14 集 = 判罚反案（中）；**第 18 集才是首个金殿位级当众清算**——8-17 集任何一集不释放同级清算，本骨架已按此排布。<\/p>\n<p>---<\/p>\n<h3>三、人设立柱（反差点）与人物表<\/h3>\n<p>有名有姓 6 人（≤10，C3）；前三章正文自造专名仅「星轨俱乐部」「启明娱乐」2 个（≤2，C3）；「九州大满贯」「领跑体育」为第 17/49 集后方登场专名，不占前三章预算。<\/p>\n<p class=\"row\"> ┃  人物  ┃  身份  ┃  外形记忆点  ┃  **反差立柱**  ┃  核心动机  ┃  口癖/小动作  ┃  弧线终态  ┃ <\/p>\n<p class=\"row\"> ┃  **沈让**（男，24）  ┃  星轨主力陪练 / 被退队者  ┃  过时款灰训练服（一望即知编制外）、左手指缝挂胶皮布条  ┃  **当众最温顺 × 球台上最不容商量；表面认命 × 实际赎罪**（他当年在让球链条里亲手让过一个位置——藏八年是赎罪不是认命）  ┃  把名字打回名单上，把那一让还回去  ┃  「比分不说谎」；发球前拇指沿拍沿抹两下  ┃  名单复名，但首站从资格打起——罪还了一半，代价留了一半  ┃ <\/p>\n<p class=\"row\"> ┃  **姜屿**（女，27）  ┃  前主力，三年前被「评估退队」  ┃  高马尾、右膝护具、旧号码布「07」缝在护腕内侧  ┃  **话最少 × 站位最前；对全世界冷 × 对「被浪费的天赋」破例**  ┃  名字是打回来的，不是发回来的  ┃  隔着护腕按 07 号布；说话不超过两句  ┃  07 缝回号码服，混双报名表并肩；三年追不回，位置自己挣回  ┃ <\/p>\n<p class=\"row\"> ┃  **顾曜**（男，21）  ┃  资方造星「占位太子」，青训嫡系+流量包装  ┃  定制亮色队服、赛后必对镜头比心  ┃  **全队加练到最晚 × 最不敢输；最亮的位置 × 最空的手**（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病）  ┃  保住「太子」人设即保住还债能力  ┃  「我知道。」→ 后期变奏「原来我不知道」  ┃  摘灯牌、鞠躬、「别替我恨人」——塌掉的偶像亲手拆了造星机  ┃ <\/p>\n<p class=\"row\"> ┃  **魏峥**（男，45）  ┃  启明娱乐俱乐部运营总监，分配机器本身  ┃  深色立领外套、保温杯、从不进场只看监控屏  ┃  **满口「为俱乐部好」 × 记账比谁都清楚；从不看球 × 从不记错账**  ┃  盘子：名额、商业位、话语权都是可签出的资产  ┃  「这不是钱的事，是盘子的事。」  ┃  被自己签发的账本与录音反杀——机器被自己产的账埋掉  ┃ <\/p>\n<p class=\"row\"> ┃  **洪川**（男，52）  ┃  星轨总教练，魏峥的执行手  ┃  秒表挂脖、口哨不离嘴  ┃  **训练场铁面 × 走廊里弯腰**（知道每一分的价钱，也记得每个孩子的手抖）  ┃  执行换平安，直到平安也保不住  ┃  「练都练了。」  ┃  第 48 集倒戈交档案——连坐第一环，也是唯一自救的一环  ┃ <\/p>\n<p class=\"row\"> ┃  **唐果**（男，19）  ┃  队内三号，功能性队友  ┃  微胖、永远在嚼能量胶  ┃  群像情绪出口：不敢反抗 × 敢在群里说真话  ┃  想让「让哥」上一次正赛名单  ┃  「稳住，能赢。」  ┃  第 60 集把「稳住能赢」写上新名单的祝语  ┃ <\/p>\n<p>双主角关系轴（不落恋爱标签）：**发现者 × 被证明者互为触发器**——她是他「被埋没」的目击人，他是她「当年不是我不行」的活证据；大反转后升级为互为因果（他的让 = 她的退）。独占感道具：笔记只借他一人、拍只许她一人碰、递拍吃味反应拍（1.3 节裁决）。<\/p>\n<p>---<\/p>\n<h3>四、反派梯度与爽点机制（不依赖违禁元素）<\/h3>\n<h4>4.1 反派梯度（三层连坐，逐级升格）<\/h4>\n<p class=\"row\"> ┃  层  ┃  人物  ┃  作恶方式（= 公共情绪现实原型的戏剧化虚构）  ┃  清算仪式（连坐顺序）  ┃ <\/p>\n<p class=\"row\"> ┃  ① 台面上（个人恩怨层）  ┃  顾曜  ┃  资源倾斜的受惠端：占位、流量压实力  ┃  忏悔式（第 54 集）：摘灯牌当众自白  ┃ <\/p>\n<p class=\"row\"> ┃  ② 台面下（操作层）  ┃  洪川  ┃  安排比分、黑哨、改考核的具体经办  ┃  除名式（第 48 集）：评估记录当众公示，反戈一击  ┃ <\/p>\n<p class=\"row\"> ┃  ③ 体系（分配机器本身）  ┃  魏峥  ┃  名额内定、功劳挪用、资源倾斜的总操盘——惯犯不是初犯  ┃  落网式（第 58 集）：账本 + 录音 + 联盟核查函  ┃ <\/p>\n<p>终极对手是**分配机制本身**：魏峥落网不等于终点，第 59 集以「新公示机制表决」收口——清算的终点是制度替换，不是私怨了结。占位者立场自洽（顾曜有付出、被裹挟；魏峥的「盘子论」成逻辑），非一边全错（埃格里对立统一过检）。<\/p>\n<h4>4.2 爽点机制（零违禁元素依赖）<\/h4>\n<p>**等价原理**：爽感结构三角 = 当众性 × 证据链 × 代价可见。真实指涉只能供给「话题浓度」，不供给爽感结构；本剧三角全部由虚构装置供给——<\/p>\n<p class=\"row\"> ┃  装置  ┃  供给  ┃  具体写法  ┃ <\/p>\n<p class=\"row\"> ┃  计分屏  ┃  当众性  ┃  比分即判决书；清算必在有人看着的地方发生  ┃ <\/p>\n<p class=\"row\"> ┃  慢镜回放  ┃  证据链  ┃  每一板拆给不懂球的观众；黑哨/误判/挪用全靠它当场反案；「翻案 ≤2 拍」内闭环  ┃ <\/p>\n<p class=\"row\"> ┃  积分榜/公示栏  ┃  代价可见  ┃  公开账本一屏一屏念账；红笔划名/写名是全剧权力交接的视觉母题  ┃ <\/p>\n<ul>\n<li>**三要素判据**（浓度内标尺，替代无数据的韩剧「基准」表述——R1 条件 3 落实）：每次大清算必须**公开、证据链完整、当众社会性死亡**三要素齐，缺一返工。烈度上限对表 b003 金殿位。<\/li>\n<li>**单元模板「一张球台的清算」**：递卡（资源/规则/舆论三选一）→ 当众设局羞辱 → ≤2 拍回击 → 当场记账 → 反派付可见代价（掉商业位/掉轮换位/掉话语权）。每次清算同步喂一层职场映射（名额=关系户占坑 / 功劳=署名权被挪 / 资源=流量压实绩）——不懂球的职场观众即代入（C1 检验内置）。<\/li>\n<li>**金手指 = 权力型身份带成本**：兑现画面全是机构文件易手（公示栏复名、撤牌函、发布会质询席、积分榜首、核查函），不是「证明我没错」；成本 = 每赢一步曝光一步（第 30 集后姜屿被捆绑为质子）。<\/li>\n<li>**专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句/群演反应拍/字幕反差——「外行看是捡球的，内行看是高手」），禁哑谜（R1 一般读者条件落实）。<\/li>\n<li>**镜像拍**：顾曜同样被流量反噬（不敢输/不敢病/粉丝替他恨人）——批判机制不批判粉丝群体，受众中的粉丝观众不被一刀切。<\/li>\n<\/ul>\n<h4>4.3 反转预算与判型（1 大 + 3 中；kb/aesthetic/reversal 全条过检）<\/h4>\n<p class=\"row\"> ┃  反转  ┃  集  ┃  判型  ┃  前置暗埋（≥2 处，回看成立）  ┃  反转后重算  ┃ <\/p>\n<p class=\"row\"> ┃  大：让球 × 退队同事件两面  ┃  48  ┃  因果反转  ┃  ①第 2 集「输得像一点」时捏紧拍柄特写 ②第 4 集姜屿「这种起板我见过」+ 护腕按压 ③第 15 集姜屿「我回来的原因不是夺冠」半句收 ④第 30 集热榜倒挂夜她低声「你欠的不是我」  ┃  第 1 集魏峥划名单（防旧账重见天）、第 17 集急签撤牌函（灭口）、姜屿三年不问缘由的自责——全部回写闪回/台词回指，不留悬空证据  ┃ <\/p>\n<p class=\"row\"> ┃  中 1：太子白手套  ┃  38  ┃  身份反转  ┃  ①第 1 集摔拍后先偷看魏峥反应 ②第 10 集发布会提词器特写 ③第 13 集破防后无人安慰只有行程表  ┃  顾曜后续每次「我知道」的语义重算  ┃ <\/p>\n<p class=\"row\"> ┃  中 2：同一支笔（体系惯犯）  ┃  46-47  ┃  预期反转  ┃  ①第 1 集画外音「比分是给人看的」②第 5 集调三年前评估单 ③第 6 集签发资源包笔部特写 ④第 17 集撤牌函同笔迹  ┃  暗线四伏笔全部收束进第 48 集档案  ┃ <\/p>\n<p class=\"row\"> ┃  中 3：洪川倒戈  ┃  48  ┃  立场反转  ┃  ①第 2 集急哨压声「收着点」的眼神矛盾 ②第 14 集执行黑哨时手抖 ③第 43 集私留档案副本  ┃  第 2/14 集他的每次「执行」重看为挣扎  ┃ <\/p>\n<p>同型连用检查：身份（38）→ 预期（46-47）→ 因果（48）→ 立场（48 章首），无相邻同型；四个反转分落 4 个章，不扎堆（第 48 集内揭底与倒戈是「证据与立场」的先后两拍，非重复反转）。<\/p>\n<p>---<\/p>\n<h3>五、改造点清单（每处回指梗卡新变体落点）<\/h3>\n<p class=\"row\"> ┃  #  ┃  改造的标志件  ┃  改造成什么  ┃  梗卡新变体回指  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  复仇结构的「蛰伏多年」  ┃  改为**当下清算**：零时间跨度，受辱与回击 ≤2 拍、一场球内闭环（为此明确不取重生复仇族）  ┃  场景轴：实时计分 × 直播切片回放 × 积分榜——「当众」的竞技化放大器  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  升级结构的「金手指」  ┃  改为**权力型身份带成本**：兑现=机构文件易手；每赢一步曝光一步  ┃  人设轴：陪练/被退队者载体 × 资方造星占位太子（链上无运动员载体）  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  催化剂（激励扰动）换位  ┃  扰动不是主角遭变故，而是**发现者进场**（姜屿第 1 集卡点提问 + 第 6 集划名单使藏的策略失效）  ┃  关系轴：发现者 × 被证明者互为爆点触发器  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  复仇的「清算顺序」  ┃  从「仇人名单从大到小」改为**连坐递升 + 制度替换收口**：执行层 → 台面 → 体系 → 机制（第 59 集公示制度表决）  ┃  强者回归轴：清算 = 物归原主非惩罚，终局不落私怨  ┃ <\/p>\n<p>---<\/p>\n<h3>六、不确定因素注入提案（structure-design 招牌产物）<\/h3>\n<p>**已融入基线的两条**（R1 红方提案 A/B，本件落定为骨架部件）：<\/p>\n<ul>\n<li>**提案 A · 让球前史**（人物前史层）：注入点=沈让第 2/4/15/30 集四暗埋、第 48 集引爆、51-52 预热、第 54 集当众自读档案收口。后续影响=第 18 集清算同时清算自己；第 48-52 集危机选择成立（档案双刃）；姜屿态度双层化。增益=「藏八年」从被动埋没变主动赎罪，主题从受害者翻盘升为赎罪+翻盘双驱动，二刷价值。风险=主角道德瑕疵致弃剧（对策：让球时他是 19 岁被裹挟的新人、让完即悔——对立统一，且不豁免他受清算）。<\/li>\n<li>**提案 B · 同一支笔**（道具/身份层）：注入点=第 1/5/6/17 集四伏笔、第 46-47 集揭晓。后续影响=暗线成立、第 48 集交叉引爆、反派从「这一次作弊」升「体系惯犯」。增益=关系轴从互为触发器升级互为因果，两弧咬死。风险=侦探感冲淡爽感（对策：暗线只在章末卡点释放半句，每集主认知更新唯一）。<\/li>\n<\/ul>\n<p>**本件新增两条，提交 R2 红方验收，择优融入后方可进 S3**：<\/p>\n<ul>\n<li>**提案 D · 「训练分 / 排名分」双栏账本**（世界观规则层）：注入点=俱乐部积分规则——陪练胜场记「训练分」不计入个人排名。改变节点=第 12 集积分榜抬头改双栏对比（训练分栏爆表/排名分为零）；第 18 集念账加第二层「比分不说谎，账本会」；第 36 集反案升为「署名权反案」；第 60 集新章程第一条「陪练积分计入排名」。增益=职场映射第四层（干得再多不记你名下）；积分榜从背景板变每集争夺物；暗线「记账权」主题有了机制载体。风险=①规则认知负载（须配「翻译」纪律每集一句）②专名预算已满（只用「训练分/排名分」通用词，不自造体系名）③疑似影射真实积分规则（对策：双栏为全虚构规则，不与任何真实赛制对应，待专业素材件核实后定稿）。改动成本：仅动 4 个节点，不动骨架。<\/li>\n<li>**提案 E · 魏峥是上一代产品**（人物前史层，备选）：注入点=第 58 集落网式里 1 画面（旧名单上魏峥的名字在「被让」栏）+ 1 句不洗白自认。增益=机制代际循环，主题最后一层——机器也是机器造的。风险=洗白感（严格 1 拍内，不豁免清算）；与第 48 集揭示扎堆（压到 58 独立释放）；容量已满不另开场次。建议：默认不采纳不伤骨架，R2 裁决。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>七、节奏预排与爆点分布预扫<\/h3>\n<h4>7.1 关键节拍位置（对表 kb/market/structure 实盘）<\/h4>\n<ul>\n<li>**首付费卡点：第 8 集**（实盘窗口 8-12；卡点落张力峰值=翻案当场兑现 + 「查他」信息钩，非情绪低谷）。<\/li>\n<li>**中点：第 30 集**（改写故事模型：位置打回来了、账本不认——从「打回位置」改写为「打回记账权」，非提高音量）。<\/li>\n<li>**决战：第 54-58 集**（55+ 决战区间：决胜局 + 自白 + 落网式），第 60 集余波收口。<\/li>\n<\/ul>\n<h4>7.2 情绪曲线判型（kb/aesthetic/emotion-curve）<\/h4>\n<p>主型 = **层层递进**（赌注逐级抬高：上桌权 → 资格名分 → 积分 → 正赛席位 → 记账权 → 名字 → 机制，每一级均高于上一级，无平级）。亚结构 = 两次压抑爆发微循环（第 30 集压至最底为第 36 集蓄力，有「最后稻草」级事件=纪录片预告挪用十年功劳；第 46-47 集人质危机为第 48 集爆发蓄力）。倒钩仅作首尾回收（第 1 集划名 → 第 60 集写名，同机位同道具），不作主骨。低谷段全部推进信息或关系（51-52 回落段推进让球前史预热；无纯低谷沙漠段）。<\/p>\n<h4>7.3 爆点分布预扫（AE-DESERT / AE-CUSHION）<\/h4>\n<ul>\n<li>**沙漠段扫描**：逐章当众兑现间隔 ≤3 集（第 1-18 集按梗卡预布点表 1:1 对位；第 12/13/14/15 四点已由预布点升格为硬节拍——R1 条件 5 落锁）。全 60 集无连续 5 集无爆点段。<\/li>\n<li>**垫场核查（两大卡点间 ≥2 中型爽点）**：8→18 之间有 10（功劳记账钩）/12（积分榜）/14（判罚反案）/15（复出首胜）/16（发球反制）✓；18→36 有 21（切片反击）/24（站内讧）/26-29（挑战赛拉锯）/30（席位+倒挂）✓；36→54 有 38（白手套）/40（反噬戏）/42（对拉）/44-48（黑幕线）/49-53（正赛）✓；54→60 有 55-59（反扑与反杀）✓。<\/li>\n<li>**钝化管理**：第 49-54 正赛段持续高强度，已设第 51-52 集回落段（07 号布静场+前史闪回预热）防强度钝化（conflict-escalation §二 minor 条）。<\/li>\n<li>**hot 档密度**：每集爽点 ≥3（打脸/反转/身份碎片/金句任一）、每 3 拍一个小刺激、回击时差 ≤2 拍；「比分不说谎」第 1/2/3 集三变奏、口癖每集 ≥1 次。<\/li>\n<\/ul>\n<h4>7.4 场景复用表（C3 配套：换景 = 换集节拍点，每集 ≤3 场景）<\/h4>\n<p class=\"row\"> ┃  复用场景  ┃  承担集数段  ┃  功能  ┃ <\/p>\n<p class=\"row\"> ┃  星轨训练馆球台区  ┃  全剧  ┃  主场景：单元清算默认场地  ┃ <\/p>\n<p class=\"row\"> ┃  俱乐部公示栏走廊  ┃  1/3/6/60 等  ┃  名单/红笔母题：权力交接仪式位  ┃ <\/p>\n<p class=\"row\"> ┃  发布会厅  ┃  10/36/48/54  ┃  舆论场清算位  ┃ <\/p>\n<p class=\"row\"> ┃  器材室/深夜训练馆一角  ┃  2/4/27/42/51  ┃  蓄力场与暗线场  ┃ <\/p>\n<p class=\"row\"> ┃  资格赛/挑战赛比赛馆  ┃  7-18、25-30  ┃  明线赛程段  ┃ <\/p>\n<p class=\"row\"> ┃  九州大满贯主赛场  ┃  49-54  ┃  终点战  ┃ <\/p>\n<p class=\"row\"> ┃  魏峥监控屏室  ┃  5/6/38/46/58  ┃  反派主场：账本与反杀位  ┃ <\/p>\n<p>---<\/p>\n<h3>八、三分钟测试自查（C10）<\/h3>\n<ul>\n<li>**第 1 集前 3 秒**：计分牌 10:8 被翻成 8:10——有人改比分。零设定解释，无体系名/组织名/规则名进正文（「星轨」仅工牌与队服字幕出现）。<\/li>\n<li>**这是谁**：沈让，八年陪练，隔着挡板看见比分被改，捡球筐捏出声响。<\/li>\n<li>**他想要什么**：不喊口号——他只是把翻掉的比分记住了；外在欲望（打回名单上的名字）在第 1 集名单公示场直接可视化。<\/li>\n<li>**为什么替他急**：亲眼见比分被安排 + 被当众安排当发球机 + 自己的球被剪进别人素材——流量实力倒挂/选拔不透明/功劳记账三层公共神经第 1 集全踩，职场人零门槛代入（C1）。<\/li>\n<li>**判**：过。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>九、创作约束移交单逐条对账（C1-C10）<\/h3>\n<p class=\"row\"> ┃  条  ┃  落点  ┃  判  ┃ <\/p>\n<p class=\"row\"> ┃  C1  ┃  CN 优先、route=dual 双主角互相成就；每单元模板内置职场三层映射（4.2），零懂球门槛；次客群由队伍终点战+复出线覆盖  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C2  ┃  60 集 × 1-1.5 分钟 × 单集正文上限 1200 字；10 章 × 6 集切分；反转预算 **1 大 + 3 中**（R1 条件 6 裁决回写）；全部副线挂「分配权」主线，无独立副线  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C3  ┃  每集场景 ≤3 + 场景复用表（7.4）；有名有姓 6 人封顶（裁决回写）；前三章自造专名 2 个（星轨/启明），「九州大满贯」「领跑体育」为 17 集后登场不占预算；当众清算群演由环境描写承担  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C4  ┃  禁马甲主线（掉马仅第 8/18 集清算瞬时态，单点亮出即收）；禁团宠（队伍线降为功能件，唐果战友情驱动）；无真假千金身世线（07 号布是姜屿自己的号码，非身世）；无追妻火葬场轴；无架空世界观（现实乒乓球+虚构俱乐部）；隐藏实力仅为藏/露策略变量  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C5  ┃  全文无真实运动员/协会/赛事/赞助商/场馆名；剧内场馆全虚构通用名，**不映射任何真实场馆与赛程**（R1 条件 2 出清：热点素材「同场馆设定」不采纳，宣发话术与剧内设定同守此线）；「饭圈」议题只取情绪不点名，镜像拍原则；正片与宣发切片无口号式台词；机构定调等证据仅作内部创作锚定不进正片  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C6  ┃  灌篮高手/金牌得主仅借结构（队伍线+大赛终点 / 双主角互相成就）；致敬位台词（「教练，我想打____」位）留待 S3 成稿原创改编，本骨架未引用任何原句，不复用原作桥段  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C7  ┃  首付费卡点第 8 集（窗口内，落张力峰值）；每章章尾钩（2.2 表末列）；清算首发固定第 18 集 + 烈度分级声明防提前释放（2.3）；前 18 集每集 ≥1 切片梗点，与梗卡预布点表 1:1 对位；**R1 条件 4 落锁：功劳记账显性节拍进第 10 集**；**R1 条件 5 落锁：第 6 集以划名单情境钩为唯一主钩、12-15 升格硬节拍**  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C8  ┃  主锚「德不配位」匿名化贯穿（情绪公式：位置×资源×荣誉的分配权错配）；反派作恶三式对应公共情绪原型且全虚构；排期对位 2026-09 中下旬-10 月赛事注意力窗口（前 10 集名单公示冲突优先投放；A2 赛程细节上线前复核）  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C9  ┃  新变体三轴回指：人设轴（陪练载体×占位太子，见人物表与改造点 2）、场景轴（计分/回放/积分榜，见 4.2）、关系轴（发现者×被证明者互为触发器→互为因果，见 1.1/改造点 3）——本件所有改造点均可回指，非假新意  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C10  ┃  次选级设定声明（打脸虐渣+隐藏实力+强者回归，实事情绪做底，无原创架空）；三分钟测试自查过（第八节）；技战术以可核验常识为限+「翻译」纪律；**专业素材件显式移交（R1 条件 1）：责任阶段=调研阶段、产物形态=乒乓常识件（技战术/赛制/陪练体系）、时限=S3 开工前闭合，S3 不得带空白开工**；梗密度直取梗卡预布点表不另起炉灶  ┃  过（附显式移交）  ┃ <\/p>\n<p>---<\/p>\n<h3>十、遗留与移交<\/h3>\n<p>1. **提案 D/E** 提交 R2 红方多视角验收（目标读者/资深编剧/甲方三面），择优后方进 S3；D 仅动 4 节点、E 默认不采纳不伤骨架。<\/p>\n<p>2. **专业素材件**（R1 条件 1）仍为调研阶段硬性欠账：S3 前必须闭合，否则按 R1 意见书 root_cause 规则顺延失效重审。<\/p>\n<p>3. 梗卡预布点表第 4 集「看破缠胶皮」须待专业素材件核实手法细节后定写法；S3 前每集分拍里的技战术描写暂以常识为限。<\/p>\n<p>4. 恋爱轴维持不预设：甲方若点名恋爱轴，另挂先婚后爱族重新过卡（R8），本骨架的暗线与卡点表不受影响。<\/p>\n<p>---<\/p>\n<p>*产物完。2026-09-16 · 结构选型师（story-choreographer 剖面）。与选题方案-爽版-基线同源：人设 6 人、卡点 8/18/36/54/60、计分板清算三轴、章结构 10×6 全部一致；本件新增值为结构论证、暗线布线、R1 条件 4/5/6 落锁与 D/E 注入提案。*<\/p><\/section>\n<section><h1>选题方案.md<\/h1><h2>选题方案：《拍魂》（乒乓球当众清算竞技爽剧 · 双主角）<\/h2>\n<p>&gt; **件型声明**：本件为项目 p-key-soul 的 **S3 全量爽版选题方案**（hot 档全参数）。与《选题方案-爽版-基线.md》（对照件）**同源**：人设 6 人封顶、卡点表 8/18/36/54/60、章结构 10×6、「计分板清算」三轴、反转预算 1 大 + 3 中——全部与《故事框架案.md》（结构宪法）一致，不另起炉灶。本件增量为：①门条件（R1/R2）落锁显性化；②前三集初稿由粗拍升格为 **B 拍三件套分拍初稿**（每集 9-12 拍、每拍 6-15 秒）。<\/p>\n<p>&gt; **输入**：`skills/topic-proposal.md`（五节规范）+ `故事框架案.md`（结构宪法）+ `选题分析报告.md` 第五节创作约束移交单 C1-C10（硬约束）+ `选题方案-爽版-基线.md`（同源骨架）+ `梗卡.md`（前三章预布点表为校准基线）+ `热点素材.md`（情绪锚）+ `多视角意见书-R1.md`（放行条件 1-6）。<\/p>\n<p>&gt; **隔离声明**：未读取 `projects/_archive` 下任何内容。无 git 操作。<\/p>\n<p>&gt; **合规自查**：全文（含分拍初稿台词）无任何真实运动员、协会、赛事、赞助商、场馆名；机构定调仅作匿名化情绪锚引用，不进正片与宣发；无「整治 / 抵制」类口号台词；情感锚全部外化为动作与比分，不喊口号。<\/p>\n<p>---<\/p>\n<h3>一、选题<\/h3>\n<p>**选题名**：《拍魂》——口语化双关：「拍」是球拍，也是把人拍在台上的那一下；「魂」是输什么都行、位置必须凭比分说话的球魂。封面标题可直接用**「陪练八年，一拍掀桌」**。<\/p>\n<p>**一句话定位**：被分配机器埋没八年的乒乓陪练，和被同一套手段退队的前主力搭档，用公开计分、慢镜回放和积分榜，从资方造星集团手里把位置一场一场打回来——最后拆到的那页账上，写着他自己的名字。<\/p>\n<p>**时代情绪锚**（当下社会情绪 + 30 天内证据；证据仅作创作锚定，不进正片与宣发）：<\/p>\n<ul>\n<li>**主锚：「德不配位」**——大众对位置、资源、荣誉与实力贡献倒挂的积压愤怒（体育主管部门 2026 年 5 月公开定调「把治理畸形饭圈文化融入运动员选拔、输送、安置全过程」，B 级证据，进行中议题，非过期新闻）。<\/li>\n<li>**辅锚**：30 天内国际乒乓赛事进行中、国内大满贯级赛事临近（A 级，全民乒乓注意力爬坡窗口）；网络生态治理专项仍在执行窗口（A 级）。<\/li>\n<li>**情绪三层（每层都是可拍的动作，不是台词）**：流量实力倒挂→赢了球的人上不了热榜；选拔不透明→名单公示那一刻才知道早内定了；功劳记账→陪练十年的功劳被写进别人的纪录片。<\/li>\n<\/ul>\n<p>**新意装置：「计分板清算」**——实时计分赛场 × 直播切片慢镜回放 × 积分榜公开账本。它改变的具体写法：**第 8 集**回放装置使「翻案」当场闭环（受辱→回放→反案 ≤2 拍，不再需要等一整集酝酿）；**第 18 集**积分榜使清算可以「念账」式进行（一屏一屏念出被偷走的每一分）；**第 36 集**发布会投屏是回放装置的舆论场变体；**第 58 集**反派被自己签发的账本反杀。**三轴回指（C9）**：人设轴——陪练/被退队者载体 × 资方造星「占位太子」；场景轴——计分/回放/积分榜；关系轴——发现者 × 被证明者互为爆点触发器。<\/p>\n<p>**核心爽点承诺**（观众追更到底图什么）：被埋没的人当众用比分把位置拿回来，每一集都能看见占位者疼。<\/p>\n<p>**开篇 3 秒设计**：特写——训练馆计分牌 10:8，挡板后一只手把它翻成 8:10；画外音（魏峥，懒洋洋）：「比分是给人看的，不是给人信的。」镜头拉开：沈让隔着挡板缝看见全程，攥着捡球筐，指节发白。（反常 + 冲突，零铺垫，不解释任何设定；这句画外音同时是暗线伏笔①，见 4.4 暗埋表。）<\/p>\n<h3>二、人设（有名有姓 6 人封顶，C3）<\/h3>\n<p>前三章正文自造专名仅 **「星轨俱乐部」「启明娱乐」** 2 个（≤2，C3）；「九州大满贯」「领跑体育」为第 17/49 集后方登场专名，不占前三章预算。<\/p>\n<p>**沈让**（男，24，星轨俱乐部主力陪练 / 被退队者）：外形记忆点——板寸没怎么修、过时款灰色训练服（非现役队服，一望即知编制外）、左手指缝常挂胶皮布条、发球前拇指沿拍沿抹两下。性格反差——**当众最温顺 × 球台上最不容商量；表面认命 × 实际赎罪**（他当年在让球链条里亲手让出过一个位置，藏八年是赎罪不是认命——大反转伏笔，第 48 集揭底）。核心动机——把名字打回名单上，把那一让还回去。口癖/小动作：「比分不说谎」（第 1/2/3 集三变奏）；抹拍沿。弧线终态：名单复名，但首站从资格打起——罪还了一半，代价留了一半。<\/p>\n<p>**姜屿**（女，27，前主力，三年前被「评估退队」）：外形记忆点——高马尾、右膝护具、旧号码布「07」叠好缝在护腕内侧，紧张时隔着护腕按一下。性格反差——**话最少 × 站位最前；对全世界冷 × 对「被浪费的天赋」破例**。核心动机——名字是打回来的，不是发回来的；她是全队唯一看出沈让底细的**发现者**，而沈让的存在是她「当年不是我不行」的活证据。小动作：擦护腕；说话不超过两句，说完就走。弧线终态：07 缝回号码服，混双报名表并肩；三年追不回，位置自己挣回。<\/p>\n<p>**顾曜**（男，21，资方造星「占位太子」，青训嫡系 + 流量包装）：外形记忆点——定制亮色队服、发胶亮额、赛后必对镜头比心。性格反差——**全队加练到最晚 × 最不敢输；最亮的位置 × 最空的手**（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病）。核心动机——保住「太子」人设即保住还债能力。口癖：「我知道。」（后期变奏「原来我不知道」。）弧线终态：摘灯牌、鞠躬、「别替我恨人」——塌掉的偶像亲手拆了造星机。<\/p>\n<p>**魏峥**（男，45，启明娱乐俱乐部运营总监，分配机器本身）：外形记忆点——深色立领外套、保温杯、从不进场只看监控屏。性格反差——**满口「为俱乐部好」 × 记账比谁都清楚；从不看球 × 从不记错账**。核心动机——盘子：名额、商业位、话语权都是可签出的资产。口癖：「这不是钱的事，是盘子的事。」**暗线**：当年签掉姜屿评估单、今日签发顾曜资源包的，是同一支笔（体系惯犯，中型反转 2，第 46-47 集揭晓）。弧线终态：被自己签发的账本与录音反杀——机器被自己产的账埋掉。<\/p>\n<p>**洪川**（男，52，星轨总教练，魏峥的执行手）：外形记忆点——灰白寸头、秒表挂脖、口哨不离嘴。性格反差——**训练场铁面 × 走廊里弯腰**（知道每一分的价钱，也记得每个孩子的手抖）。核心动机——执行换平安，直到平安也保不住。口癖：「练都练了。」弧线终态：第 48 集倒戈交档案——连坐第一环，也是唯一自救的一环。<\/p>\n<p>**唐果**（男，19，队内三号，功能性队友）：外形记忆点——微胖、队服拉链永远开一半、永远在嚼能量胶。性格反差——**不敢反抗 × 敢在群里说真话**（群像情绪出口）。核心动机——想让「让哥」上一次正赛名单。口癖：「稳住，能赢。」弧线终态：第 60 集把「稳住能赢」写上新名单的祝语。<\/p>\n<p>**双主角关系轴（不落恋爱标签，R1 条件 6 承接）**：发现者 × 被证明者互为触发器——她是他「被埋没」的目击人，他是她「当年不是我不行」的活证据；第 48 集大反转后升级为互为因果（他的让 = 她的退）。独占感与护短全部道具化：她的训练笔记只借他一人；他的拍只许她一人碰；第 30 集后增一处「顾曜递拍给沈让时姜屿盯着那只手两秒」的吃味反应拍。留白不真空，不写感情戏占时长。<\/p>\n<h3>三、冲突设计<\/h3>\n<h4>3.1 清算浓度判据与四条硬规矩<\/h4>\n<ul>\n<li>**三要素判据**（浓度内标尺，替代无数据的「韩剧基准」表述——R1 条件 3 落实）：每次大清算必须**公开、证据链完整、当众社会性死亡**三要素齐，缺一返工。烈度上限对表 b003-cn 金殿位（开局当众立军令状 + 当众算崩，热度 150000 万 / A 级），第 18 集清算首发即该强度的竞技转译。<\/li>\n<li>**反杀当场化**：羞辱与第一击回敬必须同场完成（回击时差 ≤2 拍），大胜留给集尾卡点。<\/li>\n<li>**金手指 = 权力型身份带成本**：兑现画面全是机构文件易手（公示栏复名、赞助撤牌函、发布会质询席、积分榜首、联盟核查函），不是「证明自己是对的」；成本 = 每赢一步曝光一步（第 30 集后姜屿复出资格被捆绑为质子）。<\/li>\n<li>**反派连坐**：恶人是一张网，拆解有顺序有仪式——洪川除名式（第 48 集，评估记录当众公示 + 反戈一击）→ 顾曜忏悔式（第 54 集，摘灯牌当众自白）→ 魏峥落网式（第 58 集，账本 + 录音 + 联盟核查函）。<\/li>\n<\/ul>\n<h4>3.2 主线冲突（一句话）<\/h4>\n<p>一个被分配机器埋没八年的陪练，要在大赛正赛名单公示前，用公开计分从资方造星集团手里把位置——以及给位置记账的权力——打回来。<\/p>\n<h4>3.3 单元冲突模板「一张球台的清算」（可无限复制）<\/h4>\n<p>反派递出一张卡（**资源卡 / 规则卡 / 舆论卡**，三选一）→ 当众设局羞辱 → 沈让 ≤2 拍内回击 → 计分/回放/积分榜当场记账 → 反派付出可见代价（掉商业位 / 掉轮换位 / 掉话语权）。<\/p>\n<p>**为什么能复制**：载体恒定（一张球台一块计分板，场景 ≤3）；饵料无限（三卡轮换 × 反派梯度三层任一供饵）；每次清算同步喂一层职场映射（名额 = 关系户占坑 / 功劳 = 署名权被挪 / 资源 = 流量压实绩），不懂球的职场观众也能代入（C1 检验内置）。**专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句 / 群演反应拍 / 字幕反差——「外行看是捡球的，内行看是高手」），禁止哑谜。<\/p>\n<h4>3.4 反派梯度（三层连坐，逐级升格，不许一个反派打到底）<\/h4>\n<p class=\"row\"> ┃  层  ┃  人物  ┃  作恶方式（公共情绪原型的戏剧化虚构）  ┃  清算仪式（连坐顺序）  ┃ <\/p>\n<p class=\"row\"> ┃  ① 台面上（个人恩怨层）  ┃  顾曜  ┃  资源倾斜的受惠端：占位、流量压实力  ┃  忏悔式（第 54 集）：摘灯牌当众自白  ┃ <\/p>\n<p class=\"row\"> ┃  ② 台面下（操作层）  ┃  洪川  ┃  安排比分、黑哨、改考核的具体经办  ┃  除名式（第 48 集）：评估记录当众公示，反戈一击  ┃ <\/p>\n<p class=\"row\"> ┃  ③ 体系（分配机器本身）  ┃  魏峥  ┃  名额内定、功劳挪用、资源倾斜的总操盘——**惯犯，不是初犯**（「同一支笔」）  ┃  落网式（第 58 集）：账本 + 录音 + 联盟核查函  ┃ <\/p>\n<p>终极对手是**分配机制本身**：魏峥落网不等于终点，第 59 集以「新公示机制表决」收口——清算的终点是制度替换，不是私怨了结。占位者立场自洽（顾曜有付出、被裹挟；魏峥的「盘子论」成逻辑），非一边全错。<\/p>\n<h4>3.5 冲突密度表（60 集 = 10 章 × 6 集，每章一个单元闭环）<\/h4>\n<p class=\"row\"> ┃  章  ┃  集数  ┃  单元闭环（起 → 收）  ┃  章尾钩  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  1-6  ┃  黑幕比分点火 → 双关羞辱与藏锋 → 发现者进场 → 资方强拍换人  ┃  **第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉（情境钩，唯一主钩——R1 条件 5 落锁；「我不要你觉得，我要我觉得」仅作划名前的垫场台词，不当钩力）**  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  7-12  ┃  资格赛首轮「退退退」防守反打首胜 → 第 8 集回放首秀一球翻案（**首付费卡点**）→ 神秘陪练传闻发酵 → **第 10 集功劳记账显性节拍（官方预告片把沈让喂球镜头与加练日志剪进顾曜「天赋叙事」——观众恨得具体，第 18 集专等翻这笔账，R1 条件 4 落锁）** → 第 11 集「这波在大气层」骗招 → 二连胜  ┃  第 12 集：积分榜抬头，公开账本首次亮给观众  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  13-18  ┃  第 13 集太子连丢分破防 → 第 14 集黑哨质疑 → 慢镜回放判罚反案（洪川执行时手抖——倒戈暗埋）→ 第 15 集姜屿复出首胜「爷青回」→ 第 16 集「用魔法打败魔法」发球反制 → 第 17 集撤牌函（笔迹 = 第 6 集同一支笔）  ┃  **第 18 集：「比分不说谎」当众清算首发（烈度对表 b003 金殿位；8-17 集无任何一集提前释放同级清算）**  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  19-24  ┃  舆论卡单元：资方买热榜压词条、赢球上不了榜 → 切片反击：球迷自发剪辑回放证据链全网扩散 → 顾曜商业行程与战绩首次被并置嘲讽  ┃  第 24 集：太子粉丝站内讧，流量第一次咬人（镜像拍）  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  25-30  ┃  升降级挑战赛：沈让 vs 顾曜首次正面对位，五局拉锯 → 第 27 集姜屿翻旧档案：评估单签字笔迹与今日资源单同笔（暗线显影，不揭内容）  ┃  **第 30 集【中点·模型改写】**：沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧）——位置打回来了，账本不认；故事从「打回位置」改写为「打回记账权」  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  31-36  ┃  功劳记账单元：纪录片把沈让十年陪练功劳剪进顾曜成才叙事，原始训练日志被抢先调走 → 两人抢物证链（发球机记录 / 门禁数据 / 旧胶皮购买单）→ 第 35 集魏峥亲自宣布「商业考核优先后列」  ┃  **第 36 集【大卡点 2】**：发布会投屏原始训练日志当众反案：「功劳是谁的？」  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  37-42  ┃  太子镜像单元：第 38 集顾曜发现「商业优先」名单里自己也只是筹码——白手套觉醒（「小丑竟是我自己」）→ 第 40 集粉丝替他恨人反噬戏（批判机制不批判粉丝群体）  ┃  第 42 集：深夜馆，顾曜与沈让隔网对拉，不说话  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  43-48  ┃  姜屿评估黑幕：追索档案经手痕迹（洪川私留副本）→ 第 46-47 集「同一支笔」揭晓：三年前签退姜屿与今日签发顾曜的是同一支笔；魏峥反制：销毁令 + 把姜屿复出资格当人质  ┃  **第 48 集【大卡点 3 + 大反转】**：洪川倒戈把评估档案拍上发布会桌；档案揭底——当年让球链条里沈让亲手让出的主力位 = 姜屿被退的位置，两人的相遇从第一天起就是赎罪；档案里还有沈让自己那一页  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  49-54  ┃  九州大满贯正赛：公开身份后的舆论战场 → 第 51-52 集回落段（07 号布静场 + 让球前史闪回预热，防强度钝化）→ 决胜局让二追三  ┃  **第 54 集【大卡点 4】**：顾曜输球不摔拍——摘下应援灯牌电池，对镜头鞠躬：「别替我恨人。」  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  55-60  ┃  物归原主：魏峥灭口式反扑（转移账本 / 施压联盟 / 威胁洪川翻供）→ 第 58 集监控屏墙前被自己签发的账本与录音反杀，联盟核查函进场 → 第 59 集新选拔公示机制表决：「陪练积分计入个人排名」写进章程  ┃  **第 60 集【大卡点 5 · 终局】**：公示栏红笔这次写上的是「沈让」——与第 1 集被划掉首尾同机位；07 号布重新缝上号码服，两人并肩站上混双报名表  ┃ <\/p>\n<h4>3.6 付费卡点事件表（写具体事件，不写「高潮」）<\/h4>\n<p class=\"row\"> ┃  卡点  ┃  集  ┃  具体事件  ┃  级别  ┃ <\/p>\n<p class=\"row\"> ┃  首付费卡点  ┃  **8**  ┃  回放首秀·一球翻案当场兑现（受辱→回放→反案 ≤2 拍完整闭环）；信息钩：魏峥监控屏前「查他」半句收尾  ┃  付费墙（窗口 8-12 内，落张力峰值非低谷）  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 1  ┃  **18**  ┃  「比分不说谎」当众清算首发：比赛馆中央计分屏三连闪回被偷走的每一分（含第 10 集预告片挪用素材与沈让原始留底的对照）+ 积分榜定格 + 当众念账「这位置是资源买的，还是比分买的？」+ 应援灯牌成片熄灭  ┃  大（b003 金殿位强度）  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 2  ┃  **36**  ┃  发布会投屏原始训练日志，「功劳是谁的」当众反案  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 3  ┃  **48**  ┃  洪川倒戈 + 评估档案揭底（让球 × 退队同一事件两面 + 沈让自己那一页）  ┃  大 + 大反转  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 4  ┃  **54**  ┃  太子摘灯牌自白「别替我恨人」+ 终局前夜  ┃  大  ┃ <\/p>\n<p class=\"row\"> ┃  大卡点 5  ┃  **60**  ┃  名单公示·物归原主（红笔写名同机位回收 + 新章程表决）  ┃  大（终局）  ┃ <\/p>\n<p class=\"row\"> ┃  次级章末  ┃  6 / 12 / 30 / 42  ┃  划名单 / 积分榜抬头 / 热榜倒挂 / 对拉无言  ┃  章末钩  ┃ <\/p>\n<p>**烈度分级声明（C7 防提前释放）**：第 8 集 = 单点翻案（只翻一分的小清算）；第 14 集 = 判罚反案（中）；**第 18 集才是首个金殿位级当众清算**——8-17 集任何一集不释放同级清算。<\/p>\n<h3>四、大纲<\/h3>\n<h4>4.1 前期（1-30 集：开局钩子 + 首卡点 + 章末钩链）<\/h4>\n<p>第 1 集 3 秒开黑幕比分 + 陪练当众受辱（分拍初稿见第五节）；1-6 集沈让藏锋蓄力，姜屿带 07 号布归队，第 4 集看破缠胶皮手法（发现者实锤），**第 6 集魏峥当众用红笔把「沈让」从热身名单划掉**——他「藏到退役」的策略彻底失效，同一支笔给顾曜签发资源包（笔部特写）。7-12 集资格赛首轮：第 8 集阴招发球 → 回放首秀一球翻案当场闭环（首付费卡点）；第 10 集功劳记账显性节拍（预告片挪用 + 顾曜发布会吹嘘 + 提词器特写）；第 12 集二连胜积分榜抬头。13-18 集：黑哨与判罚反案，第 15 集姜屿复出首胜「爷青回」，第 17 集赞助商「领跑体育」连夜撤牌（撤牌函签字笔迹 = 第 6 集同一支笔），**第 18 集清算首发**。19-30 集：舆论反扑与升降级挑战赛，**第 30 集中点名场面**——沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧：左边他握拍怒吼的定格，右边官宣海报的亮屏）；姜屿复出资格被捆绑审查，情绪压到最底，为中期蓄力。<\/p>\n<h4>4.2 中期（31-48 集：升级与反派升格）<\/h4>\n<p>功劳记账线引爆：纪录片把沈让十年的陪练功劳剪进顾曜的成才叙事，两人抢物证链，第 35 集魏峥亲自宣布「商业考核优先后列」（第一记体系级重压），**第 36 集大卡点名场面**——发布会厅，投屏切到原始训练日志，沈让站在质询席念出日期与课表：「功劳是谁的？」镜头扫过顾曜僵住的比心手势。反派升格后镜像线收拢：第 38 集顾曜在「商业优先」名单末行看见自己的名字（中型反转 1：白手套觉醒），第 42 集深夜训练馆他与沈让隔网对拉，不说话，只剩击球声。第 43-48 集姜屿评估黑幕：第 46-47 集「同一支笔」揭晓（中型反转 2），魏峥反制——销毁令 + 把姜屿复出资格当人质；**第 48 集大卡点 3 + 大反转名场面**——洪川把评估档案拍上发布会桌，纸页散开，沈让捡起自己那页，当众读出三年前的日期：「这页签的名字是我。」——他当年亲手让出的主力位，正是姜屿被退的位置；两人的相遇从第一天起就是赎罪。<\/p>\n<h4>4.3 终局（49-60 集：主线收口）<\/h4>\n<p>九州大满贯正赛（17 集后方登场专名）：第 49-50 集公开身份后的舆论战场，第 51-52 集回落段（深夜馆只开一盏灯，07 号布静场特写，让球前史闪回预热），第 53-54 集决胜局让二追三。**第 54 集大卡点 4 名场面**——顾曜决胜局丢分后没有摔拍，走到场边摘下自己应援灯牌的电池，灯一排排熄灭，他对镜头鞠躬：「别替我恨人。」第 55-57 集魏峥灭口式反扑（转移账本 / 施压联盟 / 威胁洪川翻供）；**第 58 集落网式名场面**——监控屏墙前，魏峥自己的账本页码被一页页投上屏幕，录音同轨播放，联盟核查函由人递进画面，他伸手去关屏幕，屏幕先黑了。第 59 集公示前夜：新选拔公示机制表决，「陪练积分计入个人排名」写进章程（机制收口，不落私怨）。**第 60 集终局名场面**——公示栏前，红笔这次写上的是「沈让」，与第 1 集被划掉首尾同机位；姜屿把 07 号布重新缝上号码服，两人并肩站上混双报名表；账本留在公示栏下，留给下一个「沈让」。代价残留：沈让的正赛首站从资格打起，姜屿被偷走的三年追不回——不是全员原谅式大团圆。<\/p>\n<h4>4.4 反转预算与暗埋表（1 大 + 3 中，C2；每处前置暗埋 ≥2 处，回看成立）<\/h4>\n<p class=\"row\"> ┃  反转  ┃  集  ┃  判型  ┃  前置暗埋（本方案前三集分拍已标注落点）  ┃ <\/p>\n<p class=\"row\"> ┃  大：让球 × 退队同事件两面  ┃  48  ┃  因果反转  ┃  ①第 2 集「输得像一点」时捏紧拍柄特写（分拍第 2 集拍 5）②第 4/15/30 集续埋  ┃ <\/p>\n<p class=\"row\"> ┃  中 1：太子白手套  ┃  38  ┃  身份反转  ┃  ①第 1 集摔拍后先偷看观察窗（分拍第 1 集拍 2）②第 10 集发布会提词器特写 ③第 13 集破防无人安慰只有行程表  ┃ <\/p>\n<p class=\"row\"> ┃  中 2：同一支笔（体系惯犯）  ┃  46-47  ┃  预期反转  ┃  ①第 1 集画外音「比分是给人看的」（分拍第 1 集拍 1）②第 5 集调三年前评估单 ③第 6 集签发资源包笔部特写 ④第 17 集撤牌函同笔迹  ┃ <\/p>\n<p class=\"row\"> ┃  中 3：洪川倒戈  ┃  48  ┃  立场反转  ┃  ①第 2 集急哨压声「收着点」后眼神矛盾（分拍第 2 集拍 5）②第 14 集执行黑哨时手抖 ③第 43 集私留档案副本  ┃ <\/p>\n<p>同型连用检查：身份（38）→ 预期（46-47）→ 因果（48）→ 立场（48 章首），无相邻同型；四个反转分落 4 个章，不扎堆。暗线（旧账线）信息只在章末卡点释放半句，每集主认知更新唯一，绝不与明线清算同拍抢认知。<\/p>\n<h3>五、前三集分拍初稿（B 拍三件套）<\/h3>\n<p>&gt; **分拍纪律**：每集 10 拍（9-12 内）、每拍 6-15 秒、单集约 90 秒（1-1.5 分钟口径内）；初稿为节拍示意，成稿守单集正文 ≤1200 字上限。每拍五件：【0-3秒】（该拍开场画面，第 1 拍兼全集前 3 秒钩）/【分镜】（△动作，只写可拍摄内容）/【台词】（情绪内联）/【表演】/【尾钩】。每集 ≤3 场景（C3）；每集 ≥1 处 ★切片梗点（对位梗卡预布点表）+ ≥3 处小刺激；「比分不说谎」每集 1 变奏；暗埋拍以（暗埋·反转编号）标注，可回溯到 4.4 表；技战术细节必配翻译（字幕反差 / 群演反应）。台词短狠、立场写在脸上（hot 潜台词豁免）。<\/p>\n<h4>第 1 集 · 选拔黑幕（★切片梗点：被「安排」的比分特写 + 陪练当众受辱）<\/h4>\n<p>场景（3）：第1场 内/夜 星轨训练馆球台区（含观察窗）｜第2场 内/日 俱乐部公示栏走廊｜第3场 内/夜 宿舍楼道<\/p>\n<ul>\n<li>**拍 1**（第 0-8 秒｜8 秒｜第1场）【前3秒·全剧门面】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△大特写：计分牌「10:8」，挡板后一只穿深色立领袖口的手把它翻成「8:10」。<\/p>\n<p>  - 【分镜】△镜头从翻牌手拉开——沈让，24 岁，星轨俱乐部主力陪练，外温顺内轴硬，过时款灰训练服、左手指缝挂胶皮布条——隔着挡板缝看完全程，怀里捡球筐的铁丝被他捏出一声轻响。<\/p>\n<p>  - 【台词】魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。（暗埋·中2①）<\/p>\n<p>  - 【表演】沈让瞳孔一缩，不吼不喊，喉结动了一下；翻牌的手连停顿都没有。<\/p>\n<p>  - 【尾钩】比分被改了，全馆没一个人吭声——包括他。<\/p>\n<ul>\n<li>**拍 2**（第 8-17 秒｜9 秒｜第1场）（小刺激 1）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△球台边顾曜，21 岁，资方造星「占位太子」，定制亮色队服、发胶亮额——11:9 险胜陪练，反手把拍摔在台面上。<\/p>\n<p>  - 【分镜】△球拍弹地两下；△顾曜的第一反应不是看球，是扭头偷看观察窗玻璃后的监控屏室方向（暗埋·中1①）。<\/p>\n<p>  - 【台词】顾曜（烦躁）：陪练都赢这么费劲？<\/p>\n<p>  - 【表演】摔拍是摔给玻璃后面那个人看的——摔完立刻收敛表情，比心练笑。<\/p>\n<p>  - 【尾钩】他怕的不是输球，是屏幕后那个人。<\/p>\n<ul>\n<li>**拍 3**（第 17-27 秒｜10 秒｜第1场）（小刺激 2·功劳被抹）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△观察窗内：魏峥，45 岁，启明娱乐俱乐部运营总监，深色立领外套、保温杯，盯着手机不抬头。<\/p>\n<p>  - 【分镜】△洪川——52 岁，星轨总教练，灰白寸头、秒表挂脖、口哨不离嘴——推门进监控屏室，站姿从进门那一刻就开始弯腰。<\/p>\n<p>  - 【台词】魏峥：宣传视频，第三球剪掉——他第三板晃了，难看。／洪川（弯腰）：练都练了，剪吧。<\/p>\n<p>  - 【表演】洪川的口哨吹到一半，停了半拍才接上；魏峥从头到尾没看一眼球台。<\/p>\n<p>  - 【尾钩】沈让拼出来的那三分，进了碎纸机。<\/p>\n<ul>\n<li>**拍 4**（第 27-36 秒｜9 秒｜第1场）（小刺激 3·当众受辱）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△洪川回到球台区，一记短哨，全队集合。<\/p>\n<p>  - 【分镜】△队员围拢，唐果——19 岁，队内三号，微胖、队服拉链开一半、嚼着能量胶——站在最外圈。<\/p>\n<p>  - 【台词】洪川：明天队内考核，沈让给顾曜当发球机——让大家看看，什么叫陪练的本分。<\/p>\n<p>  - 【表演】哄笑从队伍后排滚到前排；唐果低头（压着嗓子）：又是让哥……<\/p>\n<p>  - 【尾钩】「发球机」三个字，比输球更疼——因为没人觉得这有什么问题。<\/p>\n<ul>\n<li>**拍 5**（第 36-46 秒｜10 秒｜第1场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△沈让蹲下捡球，一颗一颗，不快不慢。<\/p>\n<p>  - 【分镜】△拇指沿拍沿抹两下（小动作首秀）；△慢镜闪回：刚才那记 10:8 的第三球——发球出手、落点压台角，顾曜重心早被骗反。<\/p>\n<p>  - 【字幕反差·翻译】外行看：运气球。｜内行看：压线短球，接的人从出手就死了。<\/p>\n<p>  - 【台词】沈让（平静，像在说天气）：比分不说谎。（口癖·变奏 1）<\/p>\n<p>  - 【表演】低头捡球时说的，没看任何人；说完把球筐放回原位，摆正。<\/p>\n<p>  - 【尾钩】他不辩——他记账。<\/p>\n<ul>\n<li>**拍 6**（第 46-56 秒｜10 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△次日，公示栏前红绸揭开：大赛正赛名单装裱上墙，顾曜的名字烫金排头。<\/p>\n<p>  - 【分镜】△工作人员盖章，一下，收印，前后不到一秒；△沈让的名字在最末行「陪练编组」，字号小一号。<\/p>\n<p>  - 【台词】工作人员（公事公办）：名单以公示为准，有异议走流程。／唐果（小声）：流程？名单早印好了，章是后盖的。<\/p>\n<p>  - 【表演】围观队员没人提异议；唐果说完自己先缩脖子。<\/p>\n<p>  - 【尾钩】公示是通知，不是商量。<\/p>\n<ul>\n<li>**拍 7**（第 56-65 秒｜9 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△走廊里一队人扛着应援灯牌路过，灯牌上「曜」字灯一闪一闪。<\/p>\n<p>  - 【分镜】△洪川在公示栏前按住沈让的肩，压低身量；△灯牌队伍与两人擦肩，光从沈让脸上扫过又暗下去。<\/p>\n<p>  - 【台词】洪川：名单看完了？看完去加练——明天顾曜的手感，还得你喂。<\/p>\n<p>  - 【表演】沈让点头应下，指缝里的胶皮布条缠了缠；不卑，也不亢。<\/p>\n<p>  - 【尾钩】被拿走的不止位置——连「下一场」都是替别人打的。<\/p>\n<ul>\n<li>**拍 8**（第 65-73 秒｜8 秒｜第3场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△夜，宿舍楼道声控灯亮起，沈让划开手机。<\/p>\n<p>  - 【分镜】△官方集锦推送：十一个精彩球，没有一球标他的名字；△他退出推送，点开自己云盘里的原始素材——每一球都有（留底习惯，第 10/18 集伏笔）。<\/p>\n<p>  - 【表演】他一球一球看得很慢，看到第三球，停住，倒回去，又看了一遍。<\/p>\n<p>  - 【尾钩】官方剪掉的，他自己全留着。<\/p>\n<ul>\n<li>**拍 9**（第 73-82 秒｜9 秒｜第3场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△楼道拐角立着一个人：高马尾、右膝护具、拎旧运动包——姜屿，27 岁，三年前被「评估退队」的前主力，话少站位前，旧号码布 07 缝在护腕内侧。<\/p>\n<p>  - 【分镜】△她的视线越过他，落在他手机屏幕的球上；△沈让抬头，工牌在她胸前翻了个面，看不清名字。<\/p>\n<p>  - 【表演】她盯着屏幕里的第三球，右手指腹隔着护腕，按了一下。<\/p>\n<p>  - 【尾钩】这个楼道里，唯一看懂了那颗球的人。<\/p>\n<ul>\n<li>**拍 10**（第 82-90 秒｜8 秒｜第3场）【卡点·信息型】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△姜屿走近两步，在离他一米处停住。<\/p>\n<p>  - 【分镜】△声控灯灭了两秒，她跺一下脚，灯又亮；△两人隔一米对视。<\/p>\n<p>  - 【台词】姜屿：你的球，第三板是谁教你的？<\/p>\n<p>  - 【表演】沈让捏着手机的手指收紧；她问完就走，背影没给他回答的时间。<\/p>\n<p>  - 【尾钩】她怎么看出第三板有问题——「第三板」背后藏着什么？（黑场）<\/p>\n<h4>第 2 集 · 不配上桌（★切片梗点：「不配上桌」球桌双关羞辱）<\/h4>\n<p>场景（2）：第1场 内/日 星轨训练馆球台区｜第2场 内/夜 器材室<\/p>\n<ul>\n<li>**拍 1**（第 0-8 秒｜8 秒｜第1场）【前3秒】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△考核日，洪川秒表一按，全馆立正。<\/p>\n<p>  - 【分镜】△球台对面：预备队主力热身，两板爆冲打得挡板砰砰响；△沈让慢悠悠缠好指缝布条上场。<\/p>\n<p>  - 【台词】洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。<\/p>\n<p>  - 【表演】「不配上桌」四个字落地，有几声嗤笑；沈让表情没变，只看了眼球桌。<\/p>\n<p>  - 【尾钩】考核的不是球——是让他在自己谋生的桌上输掉资格。<\/p>\n<ul>\n<li>**拍 2**（第 8-18 秒｜10 秒｜第1场）（小刺激 1·防守慢镜）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△主力开局两板爆冲，球带着风声砸向边角。<\/p>\n<p>  - 【分镜】△沈让退台放高球，全部接回——「退退退」式防守，慢镜：球一次次从他拍面弹起，弧线一板比一板低；△主力越扣越急，汗先掉。<\/p>\n<p>  - 【字幕反差·翻译】外行看：狼狈后退。｜内行看：每一板都回到对方最别扭的落点。<\/p>\n<p>  - 【表演】沈让步伐不乱，眼神只盯球，不看人。<\/p>\n<p>  - 【尾钩】全场发现：退了十板的人，一个球都没丢。<\/p>\n<ul>\n<li>**拍 3**（第 18-26 秒｜8 秒｜第1场）（小刺激 2·双关羞辱★）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△主力一板扣飞，气得踹挡板。<\/p>\n<p>  - 【分镜】△主力指着沈让，又指指球桌；△围观队员起哄。<\/p>\n<p>  - 【台词】主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。<\/p>\n<p>  - 【表演】哄笑声里，唐果攥着能量胶没嚼；沈让垂眼看了看自己站的位置——桌上，「桌子」两个字砸得很准。<\/p>\n<p>  - 【尾钩】羞辱到位了——按规矩，他该输了。<\/p>\n<ul>\n<li>**拍 4**（第 26-36 秒｜10 秒｜第1场）（小刺激 3·回击 ≤2 拍）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△沈让发球轮，他捏球的手停了半秒。<\/p>\n<p>  - 【分镜】△特写：胶皮摩擦角度，三个发球三种旋转；△主力连吃三分，第三板直接把球接飞出台；△全馆倒吸冷气。<\/p>\n<p>  - 【表演】沈让发完第三球，拇指沿拍沿抹两下，什么都没说。<\/p>\n<p>  - 【尾钩】说好的「输得像一点」——他连赢三分。<\/p>\n<ul>\n<li>**拍 5**（第 36-46 秒｜10 秒｜第1场）（暗埋双落点）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△急哨。洪川冲进场，第一件事是背对观众席挡住记分牌。<\/p>\n<p>  - 【分镜】△特写：沈让的手指在拍柄上收紧，指节泛白（暗埋·大反转①）；△洪川压低声，眼神在他脸上停了一瞬又移开（暗埋·中3①）。<\/p>\n<p>  - 【台词】洪川（压声）：沈让，收着点。你的任务是——输得像一点。<\/p>\n<p>  - 【表演】洪川说完这句，口哨在嘴边转了半圈没吹响；沈让盯着他看了两秒，缓缓松开拍柄。<\/p>\n<p>  - 【尾钩】教练要他输——输，也要输得「像」。像什么？<\/p>\n<ul>\n<li>**拍 6**（第 46-55 秒｜9 秒｜第1场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△沈让把球拍轻轻放在球台上，后退一步，当众鞠躬。<\/p>\n<p>  - 【分镜】△鞠躬角度标准得像教学视频；△镜头扫过围观人群——门口，姜屿抱着恢复性训练的球桶站着，全场哄笑，只有她没笑，盯着他刚才捏拍柄的那只手。<\/p>\n<p>  - 【台词】沈让（平静）：我瞎打的，蒙的。<\/p>\n<p>  - 【表演】「瞎打」两个字咬得很轻；姜屿右手指腹隔着护腕按了一下。<\/p>\n<p>  - 【尾钩】所有人都在笑，只有一个人在记。<\/p>\n<ul>\n<li>**拍 7**（第 55-63 秒｜8 秒｜第1场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△散场，主力被教练组围住夸「状态回来了」。<\/p>\n<p>  - 【分镜】△唐果溜到沈让身边，塞给他一支能量胶；△沈让收器材，把公用球一颗颗擦净归位。<\/p>\n<p>  - 【台词】唐果（小声）：让哥，稳住，能赢。<\/p>\n<p>  - 【表演】沈让难得笑了一下，把能量胶别回唐果胸前口袋：你先稳住。<\/p>\n<p>  - 【尾钩】全队只有一个人信他能赢——他自己不信「赢」这条路走得通。<\/p>\n<ul>\n<li>**拍 8**（第 63-72 秒｜9 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△夜，器材室一盏灯，沈让独自缠胶皮，手稳得像做手术。<\/p>\n<p>  - 【分镜】△特写：压胶、划边、滚平，一气呵成；△门口地板上多了一道影子，停了三秒，没进来，走了——影子的高马尾轮廓。<\/p>\n<p>  - 【表演】沈让没抬头，手上动作停了一拍，又继续。<\/p>\n<p>  - 【尾钩】她在看什么——看得懂的人，已经出现第二个了。<\/p>\n<ul>\n<li>**拍 9**（第 72-81 秒｜9 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△手机在器材桌上亮起，队内群弹窗。<\/p>\n<p>  - 【分镜】△群通知：「明日合练，顾曜新增专属陪练一名：沈让。」△下面一条回复，头像是保温杯照片。<\/p>\n<p>  - 【台词】魏峥（群内）：流量周正好，输球也要输出节目效果。<\/p>\n<p>  - 【表演】群消息底下，队员排队回「收到」，只有唐果的「收到」隔了很久。<\/p>\n<p>  - 【尾钩】他刚在考核台上证明了自己——换来的是更精确的安排。<\/p>\n<ul>\n<li>**拍 10**（第 81-90 秒｜9 秒｜第2场）【卡点·情绪型】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△沈让关掉手机屏，器材室只剩一盏灯和他的影子。<\/p>\n<p>  - 【分镜】△他把缠好的球拍立在手心，拇指沿拍沿抹两下；△镜头推近他的眼睛，灯芯在瞳孔里一点。<\/p>\n<p>  - 【台词】沈让（低声，像对自己）：比分不说谎。节目说了不算。（口癖·变奏 2）<\/p>\n<p>  - 【表演】说完，灯灭，黑场只留球拍立着的一道剪影。<\/p>\n<p>  - 【尾钩】明天当顾曜的「专属陪练」——他要让「节目效果」这三个字，变成谁的噩梦？<\/p>\n<h4>第 3 集 · 归来的人（★切片梗点：蒙尘奖杯回归仪式）<\/h4>\n<p>场景（3）：第1场 内/日 俱乐部荣誉室｜第2场 内/日 公示栏走廊｜第3场 内/日 星轨训练馆球台区<\/p>\n<ul>\n<li>**拍 1**（第 0-9 秒｜9 秒｜第1场）【前3秒】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△荣誉室柜顶，一座蒙尘奖杯，姜屿踩着凳子把它取下来。<\/p>\n<p>  - 【分镜】△袖口擦过杯身，灰尘底下露出刻字「07」；△特写：她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。<\/p>\n<p>  - 【表演】擦奖杯的动作很慢，很匀，像给什么东西还礼。<\/p>\n<p>  - 【尾钩】三年前被「评估」掉的人，回来了。<\/p>\n<ul>\n<li>**拍 2**（第 9-17 秒｜8 秒｜第1场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△姜屿把奖杯放回正中，退后一步看了看。<\/p>\n<p>  - 【分镜】△她的余光扫过荣誉墙——某面墙的旧合影里，她的位置被人用相框盖住了；△她收回目光，拎包出门。<\/p>\n<p>  - 【表演】没有停顿，没有表情，只在跨出门槛时，把右膝护具紧了紧。<\/p>\n<p>  - 【尾钩】她不是回来叙旧的。<\/p>\n<ul>\n<li>**拍 3**（第 17-27 秒｜10 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△公示栏走廊，队员窃窃私语，声音压着但故意让人听见。<\/p>\n<p>  - 【分镜】△姜屿走过，窃语声跟着她移动；△洪川迎面拦下，客气而疏远，秒表在指头上转。<\/p>\n<p>  - 【台词】队员（窃语）：三年没打比赛，回来占谁的位？／洪川（客气疏远）：姜屿是吧。先去陪练组，恢复性训练。<\/p>\n<p>  - 【表演】她只点了一下头：好。——说完就走，不解释，不争。<\/p>\n<p>  - 【尾钩】昔日前主力，如今连「队内」都算不上。<\/p>\n<ul>\n<li>**拍 4**（第 27-35 秒｜8 秒｜第2场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△姜屿在公示栏前站定，从护腕内侧抽出 07 号布。<\/p>\n<p>  - 【分镜】△「啪」——07 号布拍在自己的旧照片旁，抚平四角；△走廊瞬间安静，洪川的口哨又停了半拍。<\/p>\n<p>  - 【表演】她一个字没说，转身走了；留下满走廊的人和那块布对峙。<\/p>\n<p>  - 【尾钩】名字她不讨——她自己钉回来。<\/p>\n<ul>\n<li>**拍 5**（第 35-44 秒｜9 秒｜第3场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△合练开球，顾曜打完一板，转身对镜头比心。<\/p>\n<p>  - 【分镜】△比心收势，他侧过身压低声音警告对面的沈让；△观察窗后隐约有立领外套的轮廓。<\/p>\n<p>  - 【台词】顾曜（压声）：老实点，别又抽风。<\/p>\n<p>  - 【表演】警告完立刻切回笑容；沈让弯腰捡球，没接话。<\/p>\n<p>  - 【尾钩】「专属陪练」第一天，摄像机全开着。<\/p>\n<ul>\n<li>**拍 6**（第 44-53 秒｜9 秒｜第3场）（小刺激 1）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△沈让抛球——喂球环节，本该最没有悬念的一球。<\/p>\n<p>  - 【分镜】△球过网后急坠侧拐，顾曜扑空，球擦着他拍边落地；△全场静，只听球在地板上滚了两圈。<\/p>\n<p>  - 【字幕反差·翻译】外行看：顾曜失误了。｜内行看：这球从出手就拐了两次。<\/p>\n<p>  - 【表演】顾曜僵在原地，第一反应又是看向观察窗；沈让已经弯腰去捡下一颗球。<\/p>\n<p>  - 【尾钩】「喂球」喂出了杀招——所有人都在等解释。<\/p>\n<ul>\n<li>**拍 7**（第 53-62 秒｜9 秒｜第3场）（小刺激 2·发现者线启动）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△隔壁台，姜屿接球的手停在半空。<\/p>\n<p>  - 【分镜】△她盯着那颗球的落点，右手指腹隔着护腕按住 07；△慢慢放下球桶，穿过球台之间的过道走过来。<\/p>\n<p>  - 【台词】姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。<\/p>\n<p>  - 【表演】她说给自己听，但每个字都砸在沈让耳朵里。<\/p>\n<p>  - 【尾钩】她当众「翻译」了这颗球——外行听是怪球，内行听是底牌。<\/p>\n<ul>\n<li>**拍 8**（第 62-73 秒｜11 秒｜第3场）（小刺激 3·全剧第一次实力外露）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△姜屿拿起球拍，站上对面球台，抬眼：来。<\/p>\n<p>  - 【分镜】△两人隔网对拉：不说话，十几拍，越打越快；△慢镜：胶皮咬球、球身旋转变形的瞬间；△全馆停了——别的台不打了，队员围过来，唐果嚼能量胶的嘴停在半开。<\/p>\n<p>  - 【表演】两个人眼睛里都没有观众，只有球；最后一拍同时收力，球停在网带上，滚都没滚。<\/p>\n<p>  - 【尾钩】全馆安静了三秒——这三年，馆里没有过这种球。<\/p>\n<ul>\n<li>**拍 9**（第 73-81 秒｜8 秒｜第3场）<\/li>\n<\/ul>\n<p>  - 【0-3秒】△观察窗内，魏峥放下保温杯，杯底磕在台面上。<\/p>\n<p>  - 【分镜】△他盯着场中那两个身影，对身侧的人偏了偏头；△玻璃反光里，顾曜涨红的脸退到画面边缘。<\/p>\n<p>  - 【台词】魏峥：查一下，谁把这两个人排进一张课表的。<\/p>\n<p>  - 【表演】他的语气不怒，像在核对库存——这才是最冷的地方。<\/p>\n<p>  - 【尾钩】球台上的事，要被拿到球台外去处理了。<\/p>\n<ul>\n<li>**拍 10**（第 81-90 秒｜9 秒｜第3场）【卡点·情绪型】<\/li>\n<\/ul>\n<p>  - 【0-3秒】△训练结束的哨声里，姜屿隔着球网伸出手。<\/p>\n<p>  - 【分镜】△沈让把拍递过去；△特写：她的指腹抚过胶皮边缘——那是全世界只有她被允许碰的拍。<\/p>\n<p>  - 【台词】姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。／沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。（口癖·变奏 3）<\/p>\n<p>  - 【表演】她把拍还回去时按了一下他的手背，只一秒；两人谁都没笑。<\/p>\n<p>  - 【尾钩】明天，全馆都会看着——「瞎打」这个词，撑得到明天吗？（黑场）<\/p>\n<h3>六、门条件落实与约束对账<\/h3>\n<h4>6.1 R1/R2 门条件逐条落实<\/h4>\n<p class=\"row\"> ┃  #  ┃  门条件  ┃  本件落点  ┃  判  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  专业素材件（R1 条件 1）  ┃  显式声明见 6.2（缺口仍在，移交条款不变）  ┃  显式声明  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  同场馆设定出清（R1 条件 2）  ┃  全虚构场馆：星轨训练馆 / 公示栏走廊 / 资格赛比赛馆 / 九州大满贯主赛场均为虚构通用名，不映射任何真实场馆与赛程；热点素材「同场馆设定 / 真实场馆名」类建议一律不采纳；**宣发话术与剧内设定同守此线**  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  浓度判据去「无数据基准」（R1 条件 3）  ┃  3.1 采用三要素判据（公开 / 证据链完整 / 当众社会性死亡），烈度上限只对表库内有数据的 b003  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  功劳记账显性节拍进第 10 集（R1 条件 4）  ┃  3.5 密度表第 2 章显性硬节拍：预告片挪用 + 顾曜发布会吹嘘；第 1 集拍 3/拍 8 已埋「剪球 / 留底」前哨；第 18 集卡点回收  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  第 6 集划名单情境钩为唯一主钩 + 12-15 升格硬节拍（R1 条件 5）  ┃  3.5 密度表第 6 集钩标注唯一主钩、「我不要你觉得」降为垫场台词；第 12/13/14/15 四点以硬节拍写入密度表  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  三线容量裁决承接（R1 条件 6）  ┃  沿用《故事框架案》1.3 裁决：队伍线功能件（唐果 1 人）、镜像弧三节点（38/42/54）、反转预算 1 大 + 3 中、有名有姓 6 人封顶、关系张力道具化（笔记 / 拍 / 递拍吃味拍）  ┃  过  ┃ <\/p>\n<h4>6.2 专业素材件缺口显式声明（R1 条件 1 · 硬性欠账）<\/h4>\n<ul>\n<li>**现状**：乒乓专业素材件（技战术常识 / 赛制 / 陪练体系）截至本件产出仍未闭合，责任阶段 = **调研阶段**，产物形态 = 乒乓常识件，时限 = **S3 分稿推进前必须闭合**（R1 root_cause 规则：逾期未闭合，其后产物顺延失效重审）。<\/li>\n<li>**本件的过渡纪律**：分拍初稿中全部技战术描写以**可核验常识为限**（退台放高球 / 三种旋转发球 / 缠胶皮流程 / 落点压线），每一处均配「翻译」件（字幕反差 / 群演反应 / 解说位），无一处自造专业体系或术语。<\/li>\n<li>**待闭合的具名点位**：第 4 集「看破缠胶皮手法」的写法、第 8 集「阴招发球」的违规判据、第 14 集「黑哨判罚」的规则依据、第 16 集「发球反制」的技术合理性——四处均须待素材件核实后定稿，S3 成稿不得带空白过交付门。<\/li>\n<li>**世界观红线联动**：提案 D「训练分 / 排名分」若经 R2 采纳，其双栏规则须与素材件赛制核实结果一并校验（全虚构、不与任何真实赛制对应）；本件未预采，落点已预留（第 12/18/36 集各 1 拍可插入，不动骨架）。<\/li>\n<\/ul>\n<h4>6.3 C1-C10 约束对账<\/h4>\n<p class=\"row\"> ┃  条  ┃  落点  ┃  判  ┃ <\/p>\n<p class=\"row\"> ┃  C1  ┃  CN 优先、route=dual 双主角互相成就；单元模板内置职场三层映射（3.3），零懂球门槛；次客群由队伍终点战 + 复出线覆盖  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C2  ┃  60 集 × 1-1.5 分钟 × 单集正文上限 1200 字（分拍初稿为节拍示意，成稿守上限）；反转预算 1 大 + 3 中（4.4）；10 章 × 6 集切分；全部副线挂「分配权」主线，无独立副线  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C3  ┃  每集场景 ≤3（分拍初稿逐集标注 2-3 场景）；有名有姓 6 人封顶；前三章自造专名 2 个（星轨 / 启明），「九州大满贯」「领跑体育」17 集后登场不占预算；当众清算群演由环境描写承担  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C4  ┃  禁马甲主线（掉马仅第 8/18 集清算瞬时态，单点亮出即收）；禁团宠（队伍线功能件，唐果战友情驱动）；无真假千金身世线（07 号布是姜屿自己的号码）；无追妻火葬场轴；无架空世界观；隐藏实力仅为藏/露策略变量  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C5  ┃  全文无真实运动员 / 协会 / 赛事 / 赞助商 / 场馆名；场馆全虚构不映射真实场馆赛程（6.1 条件 2）；「饭圈」议题只取情绪不点名（镜像拍原则）；正片与宣发切片无口号式台词（初稿台词已查，无「整治 / 抵制」类词汇）；机构定调仅作内部锚不进正片  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C6  ┃  灌篮高手 / 金牌得主仅借结构（队伍线 + 大赛终点 / 双主角互相成就）；致敬位台词留 S3 成稿原创改编，本件未引用任何原句、不复用原作桥段  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C7  ┃  首付费卡点第 8 集（窗口内，落张力峰值）；每章章尾钩（3.5 末列）；清算首发固定第 18 集 + 烈度分级声明（3.6）；前 18 集每集 ≥1 切片梗点（对位梗卡预布点表 1:1）；第 10 集功劳记账显性节拍、第 6 集划名单唯一主钩、12-15 硬节拍——三项 R1 落锁全部显性  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C8  ┃  主锚「德不配位」匿名化贯穿（位置 × 资源 × 荣誉的分配权错配）；反派作恶三式全虚构；排期对位赛事注意力窗口属发行层，不进本件  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C9  ┃  新意装置段三轴回指齐（人设轴 / 场景轴 / 关系轴，见第一节）；所有改造点可回指，非假新意  ┃  过  ┃ <\/p>\n<p class=\"row\"> ┃  C10  ┃  次选级设定声明（打脸虐渣 + 隐藏实力 + 强者回归，实事情绪做底，无原创架空）；第 1 集零设定解释直入冲突（三分钟测试：这是谁——沈让 / 他想要什么——记住被翻掉的比分并打回名字 / 为什么替他急——亲眼见比分被改 + 被当众安排当发球机 + 功劳被剪，第 1 集三层全踩）；技战术常识为限 + 翻译纪律 + 专业素材件显式声明（6.2）；梗密度直取梗卡预布点表  ┃  过  ┃ <\/p>\n<h4>6.4 hot 档自检<\/h4>\n<ul>\n<li>[x] 爆点密度：每集 ≥3 小刺激，分拍逐拍标注<\/li>\n<li>[x] 回击时差 ≤2 拍：第 2 集双关羞辱 → 三分连发当场回敬<\/li>\n<li>[x] 身份揭示瞬时态 + 群演反应拍，单点亮出即收（第 3 集拍 8 对拉）<\/li>\n<li>[x] 潜台词豁免：立场写在脸上，台词直给<\/li>\n<li>[x] 金句复读：「比分不说谎」第 1/2/3 集三变奏；口癖每集 ≥1 次<\/li>\n<li>[x] 反派智商：小单元可降智，关键卡（18/36/48）证据链完整不降智<\/li>\n<li>[x] 视觉爆点拍均配情绪强化物（慢镜 / 特写 / 定格 / 灯光熄灭）<\/li>\n<li>[x] 底线四硬规则不豁免：拍号、卡点、口癖、3 秒钩子逐集到位<\/li>\n<\/ul>\n<h3>七、遗留与移交<\/h3>\n<p>1. **提案 D/E（框架案第六节）**：待 R2 红方裁决，本件均未预采。D（双栏账本）落点已预留（第 12/18/36 集各 1 拍可插入，第 60 集章程条款已在骨架内）；E（魏峥是上一代产品）默认不采纳不伤骨架。<\/p>\n<p>2. **专业素材件**：硬性欠账，条款见 6.2；S3 分稿推进前必须闭合，四处具名点位不得带空白定稿。<\/p>\n<p>3. **恋爱轴维持不预设**：甲方若点名恋爱轴，另挂先婚后爱族重新过卡，本件暗线与卡点表不受影响。<\/p>\n<p>4. **版权致敬位**：第 15 集「爷青回」复出戏中如需「教练，我想打____」位，S3 成稿必须原创改编，不得引用原句。<\/p>\n<p>---<\/p>\n<p>*产物完。2026-09-16 · 选题编剧（scene-screenwriter 剖面）· S3 全量爽版。与《选题方案-爽版-基线.md》同源：人设 6 人、卡点 8/18/36/54/60、章结构 10×6、「计分板清算」三轴完全一致；本件增量为门条件落锁显性化与前三集 B 拍三件套分拍初稿（每集 10 拍 / 每拍 6-15 秒 / 每拍五件齐备）。*<\/p><\/section>\n<section><h1>小纲-第1-3集.md<\/h1><h2>《拍魂》小纲源稿 · 第 1-3 集<\/h2>\n<p>&gt; **件型**：S4 小纲批注载体源稿（客户在其上批注修改）。派生自《选题方案.md》第五节 B 拍三件套分拍初稿与《故事框架案.md》暗埋表，不另起炉灶。<\/p>\n<p>&gt; **拍号**：B0001-B0030 全局连续，供批注逐拍锚定。每集 10 拍（9-12 内），每拍 6-15 秒，每拍一个认知更新。<\/p>\n<p>&gt; **纪律**：台词达意即可，不修文采；暗线只在集末卡点释放半句；钩型仅用四型：悬念/反常/危险/承诺。<\/p>\n<h3>第一集《选拔黑幕》<\/h3>\n<p>场景：①星轨训练馆球台区（含观察窗，内/夜）②俱乐部公示栏走廊（内/日）③宿舍楼道（内/夜）<\/p>\n<p>★切片梗点：B0001 被「安排」的比分特写 + B0004 陪练当众受辱<\/p>\n<p>**B0001｜反常｜8秒**<\/p>\n<p>【0-3秒】（第1场·训练馆球台区·内/夜）△大特写：计分牌「10:8」，挡板后一只穿深色立领袖口的手把它翻成「8:10」。<\/p>\n<p>分镜：△镜头从翻牌的手拉开——沈让（24，主力陪练，过时款灰训练服、左手指缝挂胶皮布条）隔着挡板缝看完全程，怀里捡球筐的铁丝被捏出一声轻响。<\/p>\n<p>台词：魏峥（画外·懒洋洋）：\"比分是给人看的，不是给人信的。\"<\/p>\n<p>表演：沈让瞳孔一缩，不吼不喊，喉结动了一下；翻牌的手连停顿都没有。<\/p>\n<p>尾钩→ 比分被改了，全馆没一个人吭声——包括他。<\/p>\n<p>备注：前3秒·全剧门面；道具：计分牌；暗埋·中2「同一支笔」伏笔①（第46-47集揭晓）。<\/p>\n<p>**B0002｜悬念｜9秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△球台边顾曜（21，定制亮色队服、发胶亮额）11:9 险胜陪练，反手把拍摔在台面上。<\/p>\n<p>分镜：△球拍弹地两下；顾曜第一反应不是看球，是扭头偷看观察窗玻璃后监控屏室的方向。<\/p>\n<p>台词：顾曜（烦躁）：\"陪练都赢这么费劲？\"<\/p>\n<p>表演：摔拍是摔给玻璃后面那个人看的——摔完立刻收敛表情，练笑、比心。<\/p>\n<p>尾钩→ 他怕的不是输球，是屏幕后那个人。<\/p>\n<p>备注：小刺激1；暗埋·中1「太子白手套」伏笔①（第38集揭晓）。<\/p>\n<p>**B0003｜危险｜10秒**<\/p>\n<p>【0-3秒】（第1场·观察窗内监控屏室）△魏峥（45，深色立领外套、保温杯）盯着手机不抬头。<\/p>\n<p>分镜：△洪川（52，灰白寸头、秒表挂脖、口哨不离嘴）推门进监控屏室，站姿从进门那一刻就开始弯腰。<\/p>\n<p>台词：魏峥：\"宣传视频，第三球剪掉——他第三板晃了，难看。\"<\/p>\n<p>台词：洪川（弯腰）：\"练都练了，剪吧。\"<\/p>\n<p>表演：洪川的口哨吹到一半，停了半拍才接上；魏峥从头到尾没看一眼球台。<\/p>\n<p>尾钩→ 沈让拼出来的那三分，进了碎纸机。<\/p>\n<p>备注：小刺激2·功劳被抹；道具：宣传素材（第10集预告片挪用、第18集大卡点对照回收的证据基础）。<\/p>\n<p>**B0004｜反常｜9秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△洪川回到球台区，一记短哨，全队集合。<\/p>\n<p>分镜：△队员围拢；唐果（19，微胖、队服拉链开一半、嚼能量胶）站在最外圈。<\/p>\n<p>台词：洪川：\"明天队内考核，沈让给顾曜当发球机——让大家看看，什么叫陪练的本分。\"<\/p>\n<p>台词：唐果（压着嗓子）：\"又是让哥……\"<\/p>\n<p>表演：哄笑从队伍后排滚到前排；唐果低头。<\/p>\n<p>尾钩→ 「发球机」三个字比输球更疼——因为没人觉得这有什么问题。<\/p>\n<p>备注：小刺激3·当众受辱；★切片梗点（受辱拍）。<\/p>\n<p>**B0005｜悬念｜10秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△沈让蹲下捡球，一颗一颗，不快不慢。<\/p>\n<p>分镜：△特写：拇指沿拍沿抹两下（小动作首秀）；慢镜闪回：刚才 10:8 那局的第三球——发球出手、落点压台角，顾曜重心早被骗反。<\/p>\n<p>台词：沈让（平静，像在说天气）：\"比分不说谎。\"<\/p>\n<p>表演：低头捡球时说的，没看任何人；说完把球筐放回原位，摆正。<\/p>\n<p>尾钩→ 他不辩——他记账。<\/p>\n<p>备注：口癖「比分不说谎」变奏1/3（第18集当众清算回收）；字幕翻译：外行看是运气球｜内行看是压线短球，接的人从出手就死了。<\/p>\n<p>**B0006｜反常｜10秒**<\/p>\n<p>【0-3秒】（第2场·公示栏走廊·内/日）△次日，公示栏前红绸揭开：大赛正赛名单装裱上墙，顾曜的名字烫金排头。<\/p>\n<p>分镜：△工作人员盖章，一下，收印，前后不到一秒；沈让的名字在最末行「陪练编组」，字号小一号。<\/p>\n<p>台词：工作人员（公事公办）：\"名单以公示为准，有异议走流程。\"<\/p>\n<p>台词：唐果（小声）：\"流程？名单早印好了，章是后盖的。\"<\/p>\n<p>表演：围观队员没人提异议；唐果说完自己先缩脖子。<\/p>\n<p>尾钩→ 公示是通知，不是商量。<\/p>\n<p>备注：道具：名单+公章（公示栏=权力交接母题位首秀，第6集红笔划名、第60集红笔写名同机位回收）。<\/p>\n<p>**B0007｜危险｜9秒**<\/p>\n<p>【0-3秒】（第2场·走廊）△一队人扛着应援灯牌路过，灯牌上「曜」字灯一闪一闪。<\/p>\n<p>分镜：△洪川在公示栏前按住沈让的肩，压低身量；灯牌队伍与两人擦肩，光从沈让脸上扫过又暗下去。<\/p>\n<p>台词：洪川：\"名单看完了？看完去加练——明天顾曜的手感，还得你喂。\"<\/p>\n<p>表演：沈让点头应下，指缝里的胶皮布条缠了缠；不卑，也不亢。<\/p>\n<p>尾钩→ 被拿走的不止位置——连「下一场」都是替别人打的。<\/p>\n<p>备注：道具：应援灯牌（第18集灯牌成片熄灭回收的首次亮相）。<\/p>\n<p>**B0008｜承诺｜8秒**<\/p>\n<p>【0-3秒】（第3场·宿舍楼道·内/夜）△声控灯亮起，沈让划开手机。<\/p>\n<p>分镜：△官方集锦推送：十一个精彩球，没有一球标他的名字；他退出推送，点开自己云盘里的原始素材——每一球都有。<\/p>\n<p>表演：他一球一球看得很慢，看到第三球，停住，倒回去，又看了一遍。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 官方剪掉的，他自己全留着。<\/p>\n<p>备注：道具：云盘原始素材（留底习惯首秀；第10集挪用对照、第18集大卡点的证据底牌）。<\/p>\n<p>**B0009｜反常｜9秒**<\/p>\n<p>【0-3秒】（第3场·楼道拐角）△立着一个人：高马尾、右膝护具、拎旧运动包——姜屿（27，三年前被「评估退队」的前主力）。<\/p>\n<p>分镜：△她的视线越过沈让，落在手机屏幕的球上；沈让抬头，工牌在她胸前翻了个面，看不清名字。<\/p>\n<p>表演：她盯着屏幕里的第三球，右手指腹隔着护腕，按了一下。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 这个楼道里，唯一看懂了那颗球的人。<\/p>\n<p>备注：道具：护腕内 07 号布（本集不亮出，第3集拍回公示栏）；发现者进场前置拍。<\/p>\n<p>**B0010｜悬念｜8秒**<\/p>\n<p>【0-3秒】（第3场·楼道）△姜屿走近两步，在离他一米处停住。<\/p>\n<p>分镜：△声控灯灭了两秒，她跺一下脚，灯又亮；两人隔一米对视。<\/p>\n<p>台词：姜屿：\"你的球，第三板是谁教你的？\"<\/p>\n<p>表演：沈让捏着手机的手指收紧；她问完就走，背影没给他回答的时间。<\/p>\n<p>尾钩→ 她怎么看出第三板有问题——「第三板」背后藏着什么？（黑场）<\/p>\n<p>备注：集末卡点·信息型；暗线半句释放（本集主认知更新唯一：发现者进场提问）。<\/p>\n<h3>第二集《不配上桌》<\/h3>\n<p>场景：①星轨训练馆球台区（内/日）②器材室（内/夜）<\/p>\n<p>★切片梗点：B0013「不配上桌/当桌子」球桌双关羞辱<\/p>\n<p>**B0011｜危险｜8秒**<\/p>\n<p>【0-3秒】（第1场·球台区·内/日）△考核日，洪川秒表一按，全馆立正。<\/p>\n<p>分镜：△球台对面：预备队主力热身，两板爆冲打得挡板砰砰响；沈让慢悠悠缠好指缝布条上场。<\/p>\n<p>台词：洪川：\"考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\"<\/p>\n<p>表演：「不配上桌」四个字落地，有几声嗤笑；沈让表情没变，只看了眼球桌。<\/p>\n<p>尾钩→ 考核的不是球——是让他在自己谋生的桌上输掉资格。<\/p>\n<p>备注：集题句眼；单元模板「一张球台的清算」首次开演。<\/p>\n<p>**B0012｜反常｜10秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△主力开局两板爆冲，球带着风声砸向边角。<\/p>\n<p>分镜：△沈让退台放高球，全部接回——球一次次从他拍面弹起，弧线一板比一板低；主力越扣越急，汗先掉。<\/p>\n<p>表演：沈让步伐不乱，眼神只盯球，不看人。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 全场发现：退了十板的人，一个球都没丢。<\/p>\n<p>备注：小刺激1·防守慢镜；字幕翻译：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。<\/p>\n<p>**B0013｜危险｜8秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△主力一板扣飞，气得踹挡板。<\/p>\n<p>分镜：△主力指着沈让，又指指球桌；围观队员起哄。<\/p>\n<p>台词：主力（嗤笑）：\"陪练就是陪练——你天天上桌，是给别人当桌子。\"<\/p>\n<p>表演：哄笑声里，唐果攥着能量胶没嚼；沈让垂眼看了看自己站的位置。<\/p>\n<p>尾钩→ 羞辱到位了——按规矩，他该输了。<\/p>\n<p>备注：★切片梗点·双关羞辱；职场映射（干活的坐不上桌）。<\/p>\n<p>**B0014｜反常｜10秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△沈让发球轮，他捏球的手停了半秒。<\/p>\n<p>分镜：△特写：胶皮摩擦角度，三个发球三种旋转；主力连吃三分，第三板直接把球接飞出台；全馆倒吸冷气。<\/p>\n<p>表演：沈让发完第三球，拇指沿拍沿抹两下，什么都没说。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 说好的「输得像一点」——他连赢三分。<\/p>\n<p>备注：小刺激3·回击（羞辱→回击 ≤2 拍闭环）；字幕翻译：外行看是三个幸运球｜内行看是三种旋转，接发从出手就错。<\/p>\n<p>**B0015｜悬念｜10秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△急哨。洪川冲进场，第一件事是背对观众席挡住记分牌。<\/p>\n<p>分镜：△特写：沈让的手指在拍柄上收紧，指节泛白；洪川压低声，眼神在他脸上停了一瞬又移开。<\/p>\n<p>台词：洪川（压声）：\"沈让，收着点。你的任务是——输得像一点。\"<\/p>\n<p>表演：洪川说完这句，口哨在嘴边转了半圈没吹响；沈让盯着他看了两秒，缓缓松开拍柄。<\/p>\n<p>尾钩→ 教练要他输——输，也要输得「像」。像什么？<\/p>\n<p>备注：暗埋双落点：捏拍柄=大反转伏笔①（第48集让球×退队揭底）；洪川眼神矛盾=中3「洪川倒戈」伏笔①（第48集倒戈）。<\/p>\n<p>**B0016｜反常｜9秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△沈让把球拍轻轻放在球台上，后退一步，当众鞠躬。<\/p>\n<p>分镜：△鞠躬角度标准得像教学视频；镜头扫过门口——姜屿抱着恢复性训练的球桶站着，全场哄笑，只有她没笑，盯着他刚才捏拍柄的那只手。<\/p>\n<p>台词：沈让（平静）：\"我瞎打的，蒙的。\"<\/p>\n<p>表演：「瞎打」两个字咬得很轻；姜屿右手指腹隔着护腕按了一下。<\/p>\n<p>尾钩→ 所有人都在笑，只有一个人在记。<\/p>\n<p>备注：藏锋拍（「我瞎打的」=第3集集末「再瞎打一次」钩子的源头）；姜屿目击（发现者线续）。<\/p>\n<p>**B0017｜承诺｜8秒**<\/p>\n<p>【0-3秒】（第1场·球台区）△散场，主力被教练组围住夸「状态回来了」。<\/p>\n<p>分镜：△唐果溜到沈让身边，塞给他一支能量胶；沈让收器材，把公用球一颗颗擦净归位。<\/p>\n<p>台词：唐果（小声）：\"让哥，稳住，能赢。\"<\/p>\n<p>台词：沈让（笑了一下，把能量胶别回唐果胸前口袋）：\"你先稳住。\"<\/p>\n<p>表演：沈让全剧第一次近似笑的表情，转瞬收住。<\/p>\n<p>尾钩→ 全队只有一个人信他能赢——而他自己不信「赢」这条路走得通。<\/p>\n<p>备注：队伍功能件（唐果）就位；唐果口癖「稳住，能赢」首秀（第60集写上新名单回收）。<\/p>\n<p>**B0018｜悬念｜9秒**<\/p>\n<p>【0-3秒】（第2场·器材室·内/夜）△一盏灯，沈让独自缠胶皮，手稳得像做手术。<\/p>\n<p>分镜：△特写：压胶、划边、滚平，一气呵成；门口地板上多了一道影子，停了三秒，没进来，走了——影子的高马尾轮廓。<\/p>\n<p>表演：沈让没抬头，手上动作停了一拍，又继续。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 她在看什么——看得懂的人，已经出现第二个了。<\/p>\n<p>备注：道具：缠胶皮手法（第4集姜屿「看破缠胶皮」发现者实锤的铺垫；写法待专业素材件核实）。<\/p>\n<p>**B0019｜危险｜9秒**<\/p>\n<p>【0-3秒】（第2场·器材室）△手机在器材桌上亮起，队内群弹窗。<\/p>\n<p>分镜：△群通知：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。<\/p>\n<p>台词：魏峥（群内）：\"流量周正好，输球也要输出节目效果。\"<\/p>\n<p>表演：群消息底下，队员排队回「收到」，只有唐果的「收到」隔了很久。<\/p>\n<p>尾钩→ 他刚在考核台上证明了自己——换来的是更精确的安排。<\/p>\n<p>备注：对抗力量学习适应首拍（赢了→被安排得更精确）；「保温杯头像」=魏峥从不进场只在线上的视觉化。<\/p>\n<p>**B0020｜承诺｜9秒**<\/p>\n<p>【0-3秒】（第2场·器材室）△沈让关掉手机屏，器材室只剩一盏灯和他的影子。<\/p>\n<p>分镜：△他把缠好的球拍立在手心，拇指沿拍沿抹两下；镜头推近他的眼睛，灯芯在瞳孔里一点。<\/p>\n<p>台词：沈让（低声，像对自己）：\"比分不说谎。节目说了不算。\"<\/p>\n<p>表演：说完，灯灭，黑场只留球拍立着的一道剪影。<\/p>\n<p>尾钩→ 明天当顾曜的「专属陪练」——他要让「节目效果」这三个字，变成谁的噩梦？<\/p>\n<p>备注：集末卡点·情绪型；口癖「比分不说谎」变奏2/3（第18集当众清算回收）。<\/p>\n<h3>第三集《归来的人》<\/h3>\n<p>场景：①俱乐部荣誉室（内/日）②公示栏走廊（内/日）③星轨训练馆球台区（内/日）<\/p>\n<p>★切片梗点：B0021 蒙尘奖杯回归仪式<\/p>\n<p>**B0021｜反常｜9秒**<\/p>\n<p>【0-3秒】（第1场·荣誉室·内/日）△柜顶一座蒙尘奖杯，姜屿踩着凳子把它取下来。<\/p>\n<p>分镜：△袖口擦过杯身，灰尘底下露出刻字「07」；特写：她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。<\/p>\n<p>表演：擦奖杯的动作很慢，很匀，像给什么东西还礼。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 三年前被「评估」掉的人，回来了。<\/p>\n<p>备注：★切片梗点·蒙尘奖杯回归仪式；道具：07号布+蒙尘奖杯（第15集赛场、第51-52集静场、第60集缝回号码服的长线道具）。<\/p>\n<p>**B0022｜反常｜8秒**<\/p>\n<p>【0-3秒】（第1场·荣誉室）△姜屿把奖杯放回正中，退后一步看了看。<\/p>\n<p>分镜：△她的余光扫过荣誉墙——旧合影里她的位置被人用相框盖住了；她收回目光，拎包出门。<\/p>\n<p>表演：没有停顿，没有表情，只在跨出门槛时，把右膝护具紧了紧。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 她不是回来叙旧的。<\/p>\n<p>备注：道具：被相框盖住的合影（位置被抹除的空间证据，与第1集「剪球」同构；谁盖的不解释，留白给暗线）。<\/p>\n<p>**B0023｜危险｜10秒**<\/p>\n<p>【0-3秒】（第2场·公示栏走廊·内/日）△队员窃窃私语，声音压着但故意让人听见。<\/p>\n<p>分镜：△姜屿走过，窃语声跟着她移动；洪川迎面拦下，客气而疏远，秒表在指头上转。<\/p>\n<p>台词：队员（窃语）：\"三年没打比赛，回来占谁的位？\"<\/p>\n<p>台词：洪川（客气疏远）：\"姜屿是吧。先去陪练组，恢复性训练。\"<\/p>\n<p>表演：她只点了一下头：\"好。\"——说完就走，不解释，不争。<\/p>\n<p>尾钩→ 昔日前主力，如今连「队内」都算不上。<\/p>\n<p>备注：姜屿台词纪律首秀（说话不超过两句，说完就走）。<\/p>\n<p>**B0024｜承诺｜8秒**<\/p>\n<p>【0-3秒】（第2场·公示栏前）△姜屿站定，从护腕内侧抽出 07 号布。<\/p>\n<p>分镜：△「啪」——07 号布拍在自己的旧照片旁，抚平四角；走廊瞬间安静，洪川的口哨又停了半拍。<\/p>\n<p>表演：她一个字没说，转身走了；留下满走廊的人和那块布对峙。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 名字她不讨——她自己钉回来。<\/p>\n<p>备注：★切片梗点回扣（回归仪式完成）；与 B0006 同场域对位：他不辩，她不讨——双主角策略互补的视觉化。<\/p>\n<p>**B0025｜危险｜9秒**<\/p>\n<p>【0-3秒】（第3场·球台区·内/日）△合练开球，顾曜打完一板，转身对镜头比心。<\/p>\n<p>分镜：△比心收势，他侧过身压低声音警告对面的沈让；观察窗后隐约有立领外套的轮廓。<\/p>\n<p>台词：顾曜（压声）：\"老实点，别又抽风。\"<\/p>\n<p>表演：警告完立刻切回笑容；沈让弯腰捡球，没接话。<\/p>\n<p>尾钩→ 「专属陪练」第一天，摄像机全开着。<\/p>\n<p>备注：承接 B0019（因为被指派为专属陪练，所以此刻全程在镜头下）。<\/p>\n<p>**B0026｜反常｜9秒**<\/p>\n<p>【0-3秒】（第3场·球台区）△沈让抛球——喂球环节，本该最没有悬念的一球。<\/p>\n<p>分镜：△球过网后急坠侧拐，顾曜扑空，球擦着他拍边落地；全场静，只听球在地板上滚了两圈。<\/p>\n<p>表演：顾曜僵在原地，第一反应又是看向观察窗；沈让已经弯腰去捡下一颗球。<\/p>\n<p>台词：—（无台词）<\/p>\n<p>尾钩→ 「喂球」喂出了杀招——所有人都在等解释。<\/p>\n<p>备注：小刺激1；字幕翻译：外行看是顾曜失误｜内行看这球从出手就拐了两次。<\/p>\n<p>**B0027｜悬念｜9秒**<\/p>\n<p>【0-3秒】（第3场·隔壁球台）△姜屿接球的手停在半空。<\/p>\n<p>分镜：△她盯着那颗球的落点，右手指腹隔着护腕按住 07；慢慢放下球桶，穿过球台之间的过道走过来。<\/p>\n<p>台词：姜屿（皱眉·自语）：\"这不是失误。是发球机都拉不出来的转速。\"<\/p>\n<p>表演：她说给自己听，但每个字都砸在沈让耳朵里。<\/p>\n<p>尾钩→ 她当众「翻译」了这颗球——外行听是怪球，内行听是底牌。<\/p>\n<p>备注：小刺激2·发现者线启动（第4集「看破缠胶皮手法」实锤的前置）。<\/p>\n<p>**B0028｜反常｜11秒**<\/p>\n<p>【0-3秒】（第3场·球台区）△姜屿拿起球拍，站上对面球台，抬眼。<\/p>\n<p>分镜：△两人隔网对拉：不说话，十几拍，越打越快；慢镜：胶皮咬球、球身旋转变形的瞬间；全馆停了——别的台不打了，队员围过来，唐果嚼能量胶的嘴停在半开。<\/p>\n<p>台词：姜屿：\"来。\"<\/p>\n<p>表演：两个人眼睛里都没有观众，只有球；最后一拍同时收力，球停在网带上，滚都没滚。<\/p>\n<p>尾钩→ 全馆安静了三秒——这三年，馆里没有过这种球。<\/p>\n<p>备注：小刺激3·全剧第一次实力外露（单点亮出即收，不掉马）；关系轴「发现者×被证明者」首次同台。<\/p>\n<p>**B0029｜危险｜8秒**<\/p>\n<p>【0-3秒】（第3场·观察窗内监控屏室）△魏峥放下保温杯，杯底磕在台面上。<\/p>\n<p>分镜：△他盯着场中那两个身影，对身侧的人偏了偏头；玻璃反光里，顾曜涨红的脸退到画面边缘。<\/p>\n<p>台词：魏峥：\"查一下，谁把这两个人排进一张课表的。\"<\/p>\n<p>表演：他的语气不怒，像在核对库存——这才是最冷的地方。<\/p>\n<p>尾钩→ 球台上的事，要被拿到球台外去处理了。<\/p>\n<p>备注：危险升格引信（第4-6集压力链起点，直通第6集红笔划名单唯一主钩）。<\/p>\n<p>**B0030｜承诺｜9秒**<\/p>\n<p>【0-3秒】（第3场·球台区）△训练结束的哨声里，姜屿隔着球网伸出手。<\/p>\n<p>分镜：△沈让把拍递过去；特写：她的指腹抚过胶皮边缘——那是全世界只有她被允许碰的拍。<\/p>\n<p>台词：姜屿：\"把你的拍给我。……明天，当着我的面，再「瞎打」一次。\"<\/p>\n<p>台词：沈让（擦着拍沿·低声）：\"比分不说谎。明天它替我说。\"<\/p>\n<p>表演：她把拍还回去时按了一下他的手背，只一秒；两人谁都没笑。<\/p>\n<p>尾钩→ 明天，全馆都会看着——「瞎打」这个词，撑得到明天吗？（黑场）<\/p>\n<p>备注：集末卡点·情绪型；口癖「比分不说谎」变奏3/3；道具：拍（关系道具「他的拍只许她一人碰」首次行使）。<\/p>\n<h3>创作思路页<\/h3>\n<h4>三集总功能（为什么是这三集、为什么这样排）<\/h4>\n<p>第 1-3 集是第 1 章（1-6 集）的前半段，三集连续构成一个完整微循环：**受辱（第1集：黑幕可见）→ 藏（第2集：赢了也不算）→ 被看见（第3集：发现者进场）**。第 6 集红笔划名单主钩的全部前置蓄力在这三集完成——观众必须先相信「比分不作数」这个世界规则，第 6 集划掉名字时才会真的替他急。每集只给观众一个主认知更新：<\/p>\n<ul>\n<li>第 1 集：**比分是可以被翻的**——这个世界里比分不作数，位置不由球决定。<\/li>\n<li>第 2 集：**他不辩，他记账**——主角的策略是藏锋加留底，他在等一个能当众说话的地方。<\/li>\n<li>第 3 集：**看得懂的人出现了**——发现者×被证明者接通，两个人可以互相证明。<\/li>\n<\/ul>\n<p>口癖「比分不说谎」三变奏是递进不是复读：B0005 说给自己（记账）→ B0020 说给体系（节目说了不算）→ B0030 说给证人（明天它替我说）——第 18 集当众清算首发是第四次变奏（说给全世界），三集只铺不爆。<\/p>\n<h4>第一集《选拔黑幕》逐段为什么<\/h4>\n<ul>\n<li>**B0001 为什么放在第一拍**：全剧门面 3 秒必须让「黑幕」可见可恨——翻比分这个动作零解释、当众、无人吭声，情绪三层（流量实力倒挂/选拔不透明/功劳记账）的第一层直接踩下，不解释任何设定。**埋了什么**：画外音「比分是给人看的」同时是中 2「同一支笔」伏笔①——此刻观众只当它是狂言，第 46-47 集揭晓同一支笔时回看才对味（暗线只在卡点半句释放的纪律）。<\/li>\n<li>**B0002 为什么紧跟**：反派梯度第一层（顾曜）立反差——最亮的位置最空的手。摔拍后偷看观察窗是中 1「太子白手套」伏笔①：观众此刻只觉得他怂，第 38 集发现他也是筹码时重算。<\/li>\n<li>**B0003-B0004 为什么**：功劳记账的第一颗种子（魏峥一句话剪掉第三球）+ 第一集情绪谷底（「发球机」当众受辱）。「发球机」是职场映射第一层——干活的人不配署名，不懂球的观众也疼。<\/li>\n<li>**B0005 为什么**：受辱后必须立刻给主角态度，否则观众只剩憋屈——不辩、记账。「比分不说谎」首次出场，定下全剧清算的台词母题。<\/li>\n<li>**B0006-B0007 为什么**：公示栏=权力交接仪式位首次亮相（第 6 集红笔划名、第 60 集红笔写名首尾同机位的母题铺垫）；应援灯牌首次亮相（第 18 集灯牌成片熄灭回收）。「章是后盖的」一句把「公示是通知不是商量」钉死。<\/li>\n<li>**B0008 为什么**：留底习惯是主角的金手指雏形——他赢不了当下，就先赢证据。观众从这里拿到第 18 集大卡点的第一份期待。<\/li>\n<li>**B0009-B0010 为什么收在这**：集末卡点必须从明线切到关系轴——姜屿进场只给一个按护腕的动作加一个问题，不给答案。「第三板是谁教你的」既是她的入场券，也是全剧关系轴的第一颗铆钉；信息型卡点负责把观众带进第 2 集。<\/li>\n<\/ul>\n<h4>第二集《不配上桌》逐段为什么<\/h4>\n<ul>\n<li>**为什么整集是单元模板第一演武**：「一张球台的清算」模板（受辱→≤2 拍回击→记账）先用最小单位跑一遍，但关键变奏是——回击被急哨掐断（B0015）。观众第一次尝到「赢了也不算」的体系压制，为第 8 集回放装置（当场翻案闭环、首付费卡点）制造刚需：没有回放，赢球随时可以不作数。<\/li>\n<li>**B0015 为什么是全集中场**：暗埋双落点拍。捏拍柄特写=大反转伏笔①（他为什么对「输得像一点」反应这么大——第 48 集让球×退队揭底）；洪川眼神矛盾=中 3 倒戈伏笔①（第 48 集倒戈）。两处都只给特写不给解释。<\/li>\n<li>**B0016 为什么**：「我瞎打的」是藏锋，也是给第 3 集集末「再瞎打一次」的钩子源头——姜屿的要求等于逼他从藏走向露，主角策略的第一次被撬动。<\/li>\n<li>**B0017-B0018 为什么**：唐果功能件就位（队伍线只留他一人，容量裁决）；器材室影子拍让姜屿的「看」延续一条暗动作线，为第 4 集看破缠胶皮手法（发现者实锤）铺最后一级台阶。<\/li>\n<li>**B0019-B0020 为什么收在这**：证明了自己反而换来「专属陪练」——对抗力量会学习适应，这是递进复杂化第一次显形。卡点台词「节目说了不算」把本集主认知更新（记账）推到「对体系宣战」，情绪型卡点负责愤怒，不是悬念。<\/li>\n<\/ul>\n<h4>第三集《归来的人》逐段为什么<\/h4>\n<ul>\n<li>**为什么整集给姜屿**：强者回归轴的载体必须先立「被偷走的东西」（蒙尘奖杯、被相框盖住的合影、陪练组安排），再立「自己拿回来」（07 拍回公示栏）。她的清算性质是物归原主，与沈让的清算（打回位置）构成双主角互补，两条清算线在第 18 集汇成同一个当众清算。<\/li>\n<li>**B0021-B0022 为什么**：蒙尘奖杯+被盖合影是「功劳被抹」的空间版，与第 1 集剪球同构但一句台词不说——她的戏全在动作里。07 号布进护腕是长线道具就位（第 15 集赛场首现、第 51-52 集静场、第 60 集缝回号码服）。<\/li>\n<li>**B0023-B0024 为什么**：先压到底（连「队内」都算不上）再弹起（07 拍回公示栏），一压一弹在同一走廊完成——与 B0006「章是后盖的」同场域对位：他不辩、她不讨，两人策略互补的视觉化，观众第一次意识到这是两个同类。<\/li>\n<li>**B0026-B0028 为什么**：喂球杀招→她当众翻译→隔网对拉，三拍完成发现者×被证明者的接通。对拉是全剧第一次实力外露，按掉马纪律单点亮出即收（不做层层撕），全馆安静三秒是本集情绪峰值，也是第 42 集深夜对拉无言的远呼应。<\/li>\n<li>**B0029 为什么**：魏峥「查一下」把球台上的事拿到球台外处理——危险升格的引信，直通第 6 集划名单主钩（沈让「藏到退役」的策略将从这里开始被打断）。<\/li>\n<li>**B0030 为什么收在这**：卡点收在关系道具「拍」上（他的拍只许她一人碰）——关系轴不落恋爱标签、全部道具化的第一次执行。「明天它替我说」= 公开化的承诺，观众带着「瞎打这个词撑得到明天吗」进第 4 集。<\/li>\n<\/ul>\n<h4>伏笔回收对照表（本三集埋、后文收）<\/h4>\n<p class=\"row\"> ┃  拍  ┃  埋了什么  ┃  在哪回收  ┃ <\/p>\n<p class=\"row\"> ┃  B0001  ┃  「比分是给人看的」（同一支笔伏笔①）  ┃  第 46-47 集揭晓、第 48 集引爆  ┃ <\/p>\n<p class=\"row\"> ┃  B0002  ┃  顾曜摔拍偷看观察窗（白手套伏笔①）  ┃  第 38 集白手套觉醒  ┃ <\/p>\n<p class=\"row\"> ┃  B0003  ┃  宣传素材「剪球」  ┃  第 10 集预告片挪用、第 18 集原始留底对照  ┃ <\/p>\n<p class=\"row\"> ┃  B0006/B0024  ┃  公示栏母题（盖章/钉 07）  ┃  第 6 集红笔划名、第 60 集红笔写名同机位  ┃ <\/p>\n<p class=\"row\"> ┃  B0007  ┃  应援灯牌  ┃  第 18 集灯牌成片熄灭  ┃ <\/p>\n<p class=\"row\"> ┃  B0008  ┃  云盘原始留底  ┃  第 18 集大卡点证据底牌  ┃ <\/p>\n<p class=\"row\"> ┃  B0015  ┃  捏拍柄（大反转①）/洪川眼神矛盾（倒戈①）  ┃  第 48 集双引爆  ┃ <\/p>\n<p class=\"row\"> ┃  B0016  ┃  「我瞎打的」  ┃  B0030「再瞎打一次」→ 第 8 集回放翻案线  ┃ <\/p>\n<p class=\"row\"> ┃  B0017  ┃  「稳住，能赢」  ┃  第 60 集写上新名单的祝语  ┃ <\/p>\n<p class=\"row\"> ┃  B0018  ┃  缠胶皮手法  ┃  第 4 集姜屿看破（发现者实锤；写法待专业素材件核实）  ┃ <\/p>\n<p class=\"row\"> ┃  B0021/B0024  ┃  07 号布、蒙尘奖杯  ┃  第 15 集赛场、第 51-52 静场、第 60 集缝回号码服  ┃ <\/p>\n<p class=\"row\"> ┃  B0029  ┃  魏峥「查一下」  ┃  第 6 集划名单主钩  ┃ <\/p>\n<p class=\"row\"> ┃  B0030  ┃  「拍」的关系道具  ┃  第 30 集后递拍吃味拍、第 42 集对拉无言  ┃ <\/p>\n<h4>纪律自查<\/h4>\n<ul>\n<li>每集 10 拍（9-12 内）、每拍 6-15 秒、每拍一个认知更新；拍号 B0001-B0030 连续，可逐拍批注。<\/li>\n<li>每集场景 ≤3（第1集3场/第2集2场/第3集3场）；前三章专名仅「星轨」「启明」；有名有姓 6 人全部就位。<\/li>\n<li>每拍钩型仅用悬念/反常/危险/承诺四型；第一集首拍 B0001=反常。<\/li>\n<li>每集 ≥1 ★切片梗点 + ≥3 小刺激；「比分不说谎」每集 1 变奏；暗线只在集末卡点释放半句。<\/li>\n<li>全文无任何真实运动员、协会、赛事、赞助商、场馆名；无口号式台词；技战术描写以可核验常识为限且逐处配翻译。<\/li>\n<\/ul>\n<p>*产物完。2026-09-16 · 小纲师（scene-screenwriter 剖面 · scene-breakdown 技能）。派生自《选题方案.md》第五节 B 拍分拍初稿，与《故事框架案.md》暗埋表逐处对齐。*<\/p><\/section>\n<section><h1>对外交付/04-成品剧本试稿.md<\/h1><h2>《拍魂》成品剧本试稿 · 第 1-3 集<\/h2>\n<p>&gt; **件型**：对外交付 · S4 成品剧本试稿。基于《小纲-第1-3集.md》逐拍扩写，情节、伏笔与集末卡点未走样。<\/p>\n<p>&gt; **格式**：成品通读版——场次头＋人物行动/表情连贯段落＋角色台词；特殊镜头与字幕备注一律中括号；正文无拍号/时长/钩型等内部标注（节奏纪律内化执行，质检附注见文末，不随成品外发）。<\/p>\n<p>&gt; **口径**：台词与人物口径对齐《选题方案.md》（沈让×姜屿、魏峥、计分板清算、开篇计分牌 10:8→8:10）；暗线口径对齐《故事框架案.md》。<\/p>\n<p>&gt; **流程位**：台词已按人物语言卡写至「像他说的」，待交接 dialogue-polish（去AI味）末环节复核后进 R4。<\/p>\n<p>&gt; **合规自查**：无真实运动员/协会/赛事/赞助商/场馆名；无口号式台词；技战术描写以可核验常识为限，逐处配字幕反差翻译。<\/p>\n<p>---<\/p>\n<h3>第1集 《选拔黑幕》<\/h3>\n<p>场景：星轨训练馆·球台区 · 夜 · 内<\/p>\n<p>[特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。]<\/p>\n<p>镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。捡球筐被捏出一声轻响。他瞳孔一缩，喉结动了动。<\/p>\n<p>魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。<\/p>\n<p>球照常发，人照常打，没人回头看计分牌——包括沈让。<\/p>\n<p>球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。<\/p>\n<p>顾曜（烦躁）：十一比九。跟个陪练。<\/p>\n<p>[特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。]<\/p>\n<p>洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。<\/p>\n<p>魏峥（眼睛不离手机）：宣传片，第三球剪掉——他第三板晃了，难看。<\/p>\n<p>洪川（弯腰）：练都练了。剪吧。<\/p>\n<p>魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。<\/p>\n<p>洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。<\/p>\n<p>洪川：明天队内考核。沈让给顾曜当发球机——也让大伙看看，什么叫陪练的本分。<\/p>\n<p>哄笑从队伍后排滚到前排。<\/p>\n<p>唐果（压着嗓子）：又是让哥……<\/p>\n<p>沈让蹲下捡球，一颗，一颗，不快不慢。<\/p>\n<p>[特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。]<\/p>\n<p>[字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。]<\/p>\n<p>沈让（低着头，平静得像在说天气）：比分不说谎。<\/p>\n<p>说完，球筐放回原位，摆正。<\/p>\n<p>[转场：红绸揭开。]<\/p>\n<p>场景：俱乐部公示栏走廊 · 日 · 内<\/p>\n<p>次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。沈让的名字吊在末行「陪练编组」，字号小一号。<\/p>\n<p>工作人员（公事公办）：名单以公示为准。有异议，走流程。<\/p>\n<p>唐果（小声）：流程？名单早印好了，章是后盖的。<\/p>\n
