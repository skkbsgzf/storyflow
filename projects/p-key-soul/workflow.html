<p>没人提异议。唐果说完先缩了脖子。<\/p>\n<p>一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。<\/p>\n<p>洪川：名单看完了？看完了去加练——明天顾曜的手感，还得你一板一板喂。<\/p>\n<p>沈让点头应下，指缝的布条缠了缠。不卑，也不亢。<\/p>\n<p>场景：宿舍楼道 · 夜 · 内<\/p>\n<p>声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。<\/p>\n<p>楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。<\/p>\n<p>声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。<\/p>\n<p>姜屿：你的球，第三板是谁教你的？<\/p>\n<p>沈让捏手机的手指收紧。她问完就走，没给他回答的时间。<\/p>\n<p>[特殊镜头：黑场。]<\/p>\n<h3>第2集 《不配上桌》<\/h3>\n<p>场景：星轨训练馆·球台区 · 日 · 内<\/p>\n<p>考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。沈让缠好指缝布条，慢悠悠上场。<\/p>\n<p>洪川：考核内容——陪练沈让，对预备队主力。输的那个，今天不配上桌，器材自己收。<\/p>\n<p>「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。<\/p>\n<p>主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。<\/p>\n<p>[特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。]<\/p>\n<p>[字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。]<\/p>\n<p>沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。<\/p>\n<p>主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。<\/p>\n<p>哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。<\/p>\n<p>轮到沈让发球。他捏球的手，停了半秒。<\/p>\n<p>[特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。]<\/p>\n<p>沈让发完第三球，拇指沿拍沿抹两下，什么都没说。<\/p>\n<p>急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。<\/p>\n<p>[特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。]<\/p>\n<p>洪川（压低声）：沈让。收着点。你的任务是——输得像一点。<\/p>\n<p>说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。沈让盯着他看了两秒，缓缓松开拍柄。<\/p>\n<p>沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。<\/p>\n<p>沈让（平静）：我瞎打的。蒙的。<\/p>\n<p>「瞎打」两个字，他咬得很轻。全场哄笑。镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。<\/p>\n<p>散场。主力被教练组围住，夸「状态回来了」。唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。<\/p>\n<p>唐果（小声）：让哥，稳住，能赢。<\/p>\n<p>沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋。<\/p>\n<p>沈让：你先稳住。<\/p>\n<p>[转场：夜。一盏灯。]<\/p>\n<p>场景：器材室 · 夜 · 内<\/p>\n<p>一盏灯。沈让独自缠胶皮，手稳得像做手术。<\/p>\n<p>[特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。]<\/p>\n<p>沈让没抬头。手上的动作停了一拍，又继续。<\/p>\n<p>器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。<\/p>\n<p>魏峥（群内）：流量周正好。输球也要输出节目效果。<\/p>\n<p>群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。<\/p>\n<p>沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。<\/p>\n<p>[特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。]<\/p>\n<p>沈让（低声，像对自己）：比分不说谎。节目说了不算。<\/p>\n<p>灯灭。黑场里只剩球拍立着的一道剪影。<\/p>\n<h3>第3集 《归来的人》<\/h3>\n<p>场景：俱乐部荣誉室 · 日 · 内<\/p>\n<p>柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。<\/p>\n<p>[特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。]<\/p>\n<p>她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。<\/p>\n<p>场景：俱乐部公示栏走廊 · 日 · 内<\/p>\n<p>窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。<\/p>\n<p>队员（窃语）：三年没打比赛，回来占谁的位？<\/p>\n<p>洪川迎面拦下，客气而疏远，秒表在指头上转。<\/p>\n<p>洪川：姜屿是吧。先去陪练组，恢复性训练。<\/p>\n<p>姜屿（只点了一下头）：好。<\/p>\n<p>说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。<\/p>\n<p>[特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。]<\/p>\n<p>她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。<\/p>\n<p>[转场：合练哨声。]<\/p>\n<p>场景：星轨训练馆·球台区 · 日 · 内<\/p>\n<p>合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。<\/p>\n<p>顾曜（压声）：老实点，别又抽风。<\/p>\n<p>警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。<\/p>\n<p>沈让抛球——喂球环节，本该最没有悬念的一球。<\/p>\n<p>[特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。]<\/p>\n<p>[字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。]<\/p>\n<p>顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。<\/p>\n<p>隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。<\/p>\n<p>姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。<\/p>\n<p>她说给自己听，可每个字都砸在沈让耳朵里。<\/p>\n<p>姜屿拿起球拍，站上对面球台，抬眼。<\/p>\n<p>姜屿：来。<\/p>\n<p>[特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。]<\/p>\n<p>两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。<\/p>\n<p>观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。玻璃反光里，顾曜涨红的脸退到画面边缘。<\/p>\n<p>魏峥：查一下，谁把这两个人排进一张课表的。<\/p>\n<p>他的语气不怒，像在核对库存——这才是最冷的地方。<\/p>\n<p>训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。<\/p>\n<p>[特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。]<\/p>\n<p>姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。<\/p>\n<p>沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。<\/p>\n<p>她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。<\/p>\n<p>[特殊镜头：黑场。]<\/p>\n<p>---<\/p>\n<h3>附一：卡点体检（内部质检附注，不随成品外发）<\/h3>\n<p>**时长结构**（对齐小纲拍数与秒数标注）：<\/p>\n<p class=\"row\"> ┃  集  ┃  拍数/总时长  ┃  场次分布（场景 ≤3）  ┃  末卡点对应小纲拍  ┃ <\/p>\n<p class=\"row\"> ┃  第1集  ┃  10 拍 / 90 秒  ┃  球台区 46s·5拍 → 公示栏走廊 19s·2拍 → 宿舍楼道 25s·3拍  ┃  B0010  ┃ <\/p>\n<p class=\"row\"> ┃  第2集  ┃  10 拍 / 90 秒  ┃  球台区 63s·7拍 → 器材室 27s·3拍  ┃  B0020  ┃ <\/p>\n<p class=\"row\"> ┃  第3集  ┃  10 拍 / 90 秒  ┃  荣誉室 17s·2拍 → 公示栏走廊 18s·2拍 → 球台区 55s·6拍  ┃  B0030  ┃ <\/p>\n<p>**集末卡点逐体检**：<\/p>\n<p class=\"row\"> ┃  集  ┃  卡点落点  ┃  型  ┃  体检结论  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  姜屿「你的球，第三板是谁教你的？」问完即走，黑场  ┃  信息型  ┃  信息增量唯一：发现者进场＋「第三板」悬问；暗线半句释放纪律达成（护腕只按不亮）；黑场落在问题悬空处，非情绪低谷；直接给第2集考核日续力。过  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  「比分不说谎。节目说了不算。」灯灭，只剩球拍剪影  ┃  情绪型  ┃  情绪目标=宣战/愤怒，不靠新悬念供钩；口癖变奏2落位；与第1集信息型明确区分；钩力指向明日「专属陪练」的课表。过  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  「明天它替我说」＋她按他手背一秒，谁都没笑，黑场  ┃  情绪型  ┃  关系道具「拍」首次行使（只许她一人碰）；公开化承诺=期待＋隐忧双情绪；口癖变奏3落位；「瞎打」悬置进第4集。过  ┃ <\/p>\n<p>**主认知更新唯一性**：第1集「比分是可以被翻的」；第2集「赢了也不算——他不辩，他记账」；第3集「看得懂的人出现了」。三集卡点均落张力峰值非低谷，无与明线抢认知的暗线信息（「同一支笔」「让球前史」在三集内零泄露，仅道具级微光）。<\/p>\n<h3>附二：切片梗点标注（对位梗卡预布点表）<\/h3>\n<p class=\"row\"> ┃  集  ┃  ★切片梗点（成片位置）  ┃  对位梗卡预布点  ┃  建议切片入点/出点  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  开场计分牌 10:8→8:10 特写（被「安排」的比分）＋「发球机」当众受辱  ┃  预布点表第1集「选拔黑幕一瞬＋陪练当众受辱——打脸引擎点火位」  ┃  入点：翻牌手特写；出点：哄笑滚到前排＋唐果低头。备选：压线短球慢镜＋外行/内行字幕反差  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  「你天天上桌，是给别人当桌子」双关羞辱 → 三分连发当场回敬（受辱→回击 ≤2 拍）  ┃  预布点表第2集「不配上桌球桌双关（切片位）」＝主梗切片3「双关嫁接位」  ┃  入点：主力踹挡板；出点：全馆倒吸冷气＋抹拍沿。备选：「我瞎打的」鞠躬  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  蒙尘奖杯/07 号布回归仪式；07「啪」拍回公示栏；隔网对拉全馆静三秒  ┃  预布点表第3集「蒙尘奖杯/旧号码——回归仪式梗点（强者回归轴）」  ┃  入点：袖口擦杯露「07」；出点：球停网带、滚都没滚。备选：07 拍墙「啪」一声＋满走廊安静  ┃ <\/p>\n<p>---<\/p>\n<p>*产物完。2026-09-16 · 编剧（scene-screenwriter 剖面 · script-final 技能）。基于《小纲-第1-3集.md》B0001-B0030 逐拍扩写，与《选题方案.md》《故事框架案.md》口径逐处对齐；未读取 projects/_archive 下任何内容；无 git 操作。*<\/p><\/section>\n<section><h1>对外交付/03-剧本试稿.md<\/h1><h2>《拍魂》剧本试稿 · 第 1-3 集（成品稿）<\/h2>\n<p>&gt; **件型**：对外交付 · S4 剧本试稿成品稿。基于《04-成品剧本试稿.md》完成 dialogue-polish 末环节逐句打磨：**只动台词与表演提示，情节、卡点、伏笔位零改动**。<\/p>\n<p>&gt; **保真清单**：口癖三变奏（「比分不说谎」第 1/2/3 集各一变奏）与关键伏笔句（「比分是给人看的，不是给人信的」「输得像一点」「我瞎打的」）原样保留。逐条改动留痕见《台词打磨对照表.md》（内部件，不随本稿外发）。<\/p>\n<p>&gt; **格式**：成品通读版——场次头＋人物行动/表情连贯段落＋角色台词；特殊镜头、字幕与提示音一律中括号；正文无拍号/时长/钩型等内部标注。<\/p>\n<p>&gt; **合规自查**：无真实运动员/协会/赛事/赞助商/场馆名；无口号式台词；技战术描写以可核验常识为限，逐处配字幕反差翻译。<\/p>\n<p>---<\/p>\n<h3>第1集 《选拔黑幕》<\/h3>\n<p>场景：星轨训练馆·球台区 · 夜 · 内<\/p>\n<p>[特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。]<\/p>\n<p>镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。捡球筐被捏出一声轻响。他瞳孔一缩，喉结动了动。<\/p>\n<p>魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。<\/p>\n<p>[音效：击球声没有任何变化。]<\/p>\n<p>球照常发，人照常打，没人回头看计分牌——包括沈让。<\/p>\n<p>球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。<\/p>\n<p>顾曜（烦躁，喘着气）：十一比九。……跟个陪练。<\/p>\n<p>[特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。]<\/p>\n<p>洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。<\/p>\n<p>魏峥（眼睛不离手机）：宣传片，第三球剪掉。<\/p>\n<p>洪川没问。<\/p>\n<p>魏峥：他第三板晃了。难看。<\/p>\n<p>洪川（弯腰）：练都练了。剪吧。<\/p>\n<p>魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。<\/p>\n<p>洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。<\/p>\n<p>洪川：明天队内考核。沈让给顾曜当发球机——都学着点，什么叫陪练的本分。<\/p>\n<p>哄笑从队伍后排滚到前排。<\/p>\n<p>唐果（压着嗓子）：又是让哥……<\/p>\n<p>沈让蹲下捡球，一颗，一颗，不快不慢。<\/p>\n<p>[特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。]<\/p>\n<p>[字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。]<\/p>\n<p>沈让（低着头，平静得像在说天气）：比分不说谎。<\/p>\n<p>没人接话。一颗球从筐沿滚下去，撞上另一颗，停了。<\/p>\n<p>球筐放回原位，摆正。<\/p>\n<p>[转场：红绸揭开。]<\/p>\n<p>场景：俱乐部公示栏走廊 · 日 · 内<\/p>\n<p>次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。沈让的名字吊在末行「陪练编组」，字号小一号。<\/p>\n<p>工作人员（公事公办）：名单以公示为准。有异议？走流程。<\/p>\n<p>唐果左右看了一眼，声音压得更低。<\/p>\n<p>唐果（小声）：流程？名单早印好了，章是后盖的。<\/p>\n<p>没人提异议。唐果说完先缩了脖子。<\/p>\n<p>一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。<\/p>\n<p>洪川（眼睛还在名单上）：名单看完了？看完了去加练。明天顾曜的手感，还得你一板一板喂。<\/p>\n<p>沈让点头应下，指缝的布条缠了缠。不卑，也不亢。<\/p>\n<p>场景：宿舍楼道 · 夜 · 内<\/p>\n<p>声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。<\/p>\n<p>楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。<\/p>\n<p>声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。<\/p>\n<p>姜屿：你的球，第三板是谁教你的？<\/p>\n<p>沈让捏手机的手指收紧。她问完就走，没给他回答的时间。<\/p>\n<p>[特殊镜头：黑场。]<\/p>\n<h3>第2集 《不配上桌》<\/h3>\n<p>场景：星轨训练馆·球台区 · 日 · 内<\/p>\n<p>考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。沈让缠好指缝布条，慢悠悠上场。<\/p>\n<p>洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。<\/p>\n<p>「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。<\/p>\n<p>主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。<\/p>\n<p>[特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。]<\/p>\n<p>[字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。]<\/p>\n<p>沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。<\/p>\n<p>主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。<\/p>\n<p>哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。<\/p>\n<p>轮到沈让发球。他捏球的手，停了半秒。<\/p>\n<p>[特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。]<\/p>\n<p>[音效：人群里一只矿泉水瓶被捏响，又赶紧松开。]<\/p>\n<p>沈让发完第三球，拇指沿拍沿抹两下，什么都没说。<\/p>\n<p>急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。<\/p>\n<p>[特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。]<\/p>\n<p>[音效：急哨的余音还在馆顶绕。]<\/p>\n<p>洪川（压低声）：沈让。收着点。你的任务是——输得像一点。<\/p>\n<p>说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。沈让盯着他看了两秒，缓缓松开拍柄。<\/p>\n<p>沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。<\/p>\n<p>沈让（平静）：我瞎打的。蒙的。<\/p>\n<p>「瞎打」两个字，他咬得很轻。全场哄笑。镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。<\/p>\n<p>散场。主力被教练组围住，夸「状态回来了」。唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。<\/p>\n<p>唐果（小声）：让哥，稳住，能赢。<\/p>\n<p>沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋，才开口。<\/p>\n<p>沈让：你先稳住。<\/p>\n<p>[转场：夜。一盏灯。]<\/p>\n<p>场景：器材室 · 夜 · 内<\/p>\n<p>一盏灯。<\/p>\n<p>[音效：刮胶皮的沙沙声，一下一下，很匀。]<\/p>\n<p>沈让独自缠胶皮，手稳得像做手术。<\/p>\n<p>[特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。]<\/p>\n<p>沈让没抬头。手上的动作停了一拍，又继续。<\/p>\n<p>器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。<\/p>\n<p>魏峥（群内）：流量周正好。输球也要输出节目效果。<\/p>\n<p>群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。<\/p>\n<p>沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。<\/p>\n<p>[特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。]<\/p>\n<p>沈让（低声，像对自己）：比分不说谎。节目说了不算。<\/p>\n<p>灯灭。[音效：咔哒一声，之后什么声音都没有。]黑场里只剩球拍立着的一道剪影。<\/p>\n<h3>第3集 《归来的人》<\/h3>\n<p>场景：俱乐部荣誉室 · 日 · 内<\/p>\n<p>柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。<\/p>\n<p>[特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。]<\/p>\n<p>她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。<\/p>\n<p>[音效：柜门合上，很轻。]<\/p>\n<p>场景：俱乐部公示栏走廊 · 日 · 内<\/p>\n<p>窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。<\/p>\n<p>队员甲（窃语）：三年没打比赛，回来占谁的位？<\/p>\n<p>队员乙（更低）：嘘——人过来了。<\/p>\n<p>窃语声齐齐掐断。<\/p>\n<p>洪川迎面拦下，客气而疏远，秒表在指头上转，转得比平时快。<\/p>\n<p>洪川：姜屿是吧。先去陪练组，恢复性训练。<\/p>\n<p>姜屿（只点了一下头）：好。<\/p>\n<p>说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。<\/p>\n<p>[特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。]<\/p>\n<p>她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。<\/p>\n<p>[转场：合练哨声。]<\/p>\n<p>场景：星轨训练馆·球台区 · 日 · 内<\/p>\n<p>合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。<\/p>\n<p>顾曜（压声）：老实点，别又抽风。<\/p>\n<p>警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。<\/p>\n<p>沈让抛球——喂球环节，本该最没有悬念的一球。<\/p>\n<p>[特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。]<\/p>\n<p>[字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。]<\/p>\n<p>顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。<\/p>\n<p>隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。<\/p>\n<p>姜屿（盯着球的落点，像自语）：喂球？……发球机都拉不出这种转速。<\/p>\n<p>她说给自己听，可每个字都砸在沈让耳朵里。<\/p>\n<p>姜屿拿起球拍，站上对面球台，抬眼。<\/p>\n<p>姜屿：来。<\/p>\n<p>[特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。]<\/p>\n<p>两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。<\/p>\n<p>[音效：没有球声。空调风声。]<\/p>\n<p>观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。玻璃反光里，顾曜涨红的脸退到画面边缘。<\/p>\n<p>魏峥：查一下。谁把这两个人排进一张课表的。<\/p>\n<p>他的语气不怒，像在核对库存——这才是最冷的地方。<\/p>\n<p>训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。<\/p>\n<p>[特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。]<\/p>\n<p>姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。<\/p>\n<p>沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。<\/p>\n<p>她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。<\/p>\n<p>[特殊镜头：黑场。]<\/p>\n<p>---<\/p>\n<p>*产物完。2026-09-16 · 润色（dialogue-polish 技能）。基于《04-成品剧本试稿.md》逐句三遍打磨（人物声口→处境→去AI味），只动台词与表演提示，情节、卡点、伏笔位零改动；逐条改动留痕见项目根《台词打磨对照表.md》。未读取 projects/_archive 下任何内容；无 git 操作。*<\/p><\/section>\n<\/main>\n<footer>miniflow harness · 本页为单文件交付物，可离线浏览<\/footer>\n<\/body><\/html>", "故事框架案.md": "# 故事框架案 ·《拍魂》（p-key-soul）\n\n---\n\n## 一、结构选型\n\n### 1.1 选型结论\n\n**主骨：复仇清算（「当下清算」变体）**——冤屈建立 → 能力获得 → 逐层清算 → 终局对账。\n**辅骨：晋级升级（欲望递进）**——陪练席 → 资格赛 → 正赛席位 → 记账权 → 名单公示，公开赛程天然供给代价梯。\n**展开机制：单元宿命**——「一张球台的清算」单元模板（反派递卡 → 当众设局 → ≤2 拍回击 → 计分/回放/积分榜当场记账 → 反派付可见代价），变量清单 = 三卡（资源卡/规则卡/舆论卡）× 反派梯度三层，可复制不枯竭。\n**暗线：双线交叉**——「同一支笔」旧账线在明线底下汇聚，第 48 集交叉引爆。\n\n**明暗占比**：明线主干（公开清算晋级线）约 70%，暗线（旧账线）约 30%。分章：第 1-3 章暗线仅道具级微光（≈10%）；第 4-6 章暗线显影（≈30%）；第 7-8 章暗线主导并交叉引爆（≈45%）；第 9-10 章暗线收口、清算落回明线仪式（公示）。**每集主认知更新只有一个**（AE-INFO-LOAD）：暗线信息只在章末卡点释放半句，绝不与明线清算同拍抢认知。\n\n一句话结构表述：**一个被分配机器埋没八年的陪练，在一场不能再藏的公开赛季里，用计分屏、慢镜回放和积分榜，一层一层拆掉资方造星集团——最后拆到的那页账上，写着他自己的名字。**\n\n### 1.2 选型理由（对标人群 / 梗卡回指 / 市场对表）\n\n1. **路线档位决定主骨**：hot 档选型偏「清算/升级」型（kb/structure/catalog §三），每集爽点 ≥3、回击时差 ≤2 拍——复仇清算主骨的爽点天然当众，密度最好布；calm 档偏好的倒钩/双线只取「倒钩回收」作首尾呼应（第 60 集公示栏红笔写上「沈让」回收第 1 集被划掉），不作主骨（倒钩单用前期钩子弱，短剧慎用）。\n2. **主梗直配**：打脸虐渣（红海·有效，n=1510 / 均 18558 万）的机制是「受辱蓄力→当众清算」，复仇清算主骨即其结构母型；不取重生复仇族（梗卡判定：先知先手与「当下清算」情绪错位）——故清算**零时间跨度**，一场球内闭环。\n3. **辅骨对应辅梗**：晋级升级承载隐藏实力变体（藏/露是每集策略变量，b016 两段式揭示节奏）；「强者回归」轴（n=107 / 均 21803 万强带）由姜屿线承载——清算性质从「惩罚坏人」升级为「物归原主」，正对「德不配位」镜像。\n4. **竞技载体供给独有代价梯**：资格赛→正赛→积分榜→名单公示，赌注逐级抬高有现成刻度，不需要人工升降级；这就是选「晋级」做辅骨而非「救猫咪 15 节拍」的原因——后者节拍化痕迹重且无竞技刻度。\n5. **成本档决定单元宿命**：单元模板载体恒定（一张球台一块计分板），场景 ≤3 直接满足 C3；饵料三卡轮换，60 集不枯竭。\n6. **双线交叉解决「爽剧无二刷」**：明线供爽，暗线供「回看全对」——中点（第 30 集）与交叉点（第 48 集）间距 18 集，按拍折算交叉间距 <5 拍阈值可控（emotion-curve 双线交叉失衡检查合规）。\n7. **市场对表**：60 集 → 首卡 8-12（落第 8 集）/ 中点 30 改写模型 / 55+ 决战（落第 54-60）——三项全中实盘节拍（kb/market/structure）。\n\n### 1.3 R1 条件 6 · 三线容量裁决（回写移交单 C2/C3）\n\n双主角弧（甲方指定）× 灌篮式队伍线群像 × 太子镜像弧（反派不许纸片）三条全留必爆容量。**显式裁决：**\n\n- **队伍线降为功能件**：有名有姓队友只保留唐果 1 人（群像情绪出口），其余队伍以环境群演承担；「灌篮式队伍感」由「各怀执念的清算顺序」（谁陪谁打哪一站）供给，不增设角色。禁团宠（C4）。\n- **镜像弧压缩为三节点封顶**：第 38 集（白手套初现）→ 第 42 集（深夜隔网对拉）→ 第 54 集（摘灯牌自白）。共用已有角色顾曜，不新增场次、不加前史专场。\n- **反转预算锁定**：1 大 + 3 中，写回 C2；有名有姓 6 人封顶，写回 C3。\n- **关系张力不落恋爱标签的写法**（甲方条件 6 并入）：独占感与护短道具化——她的训练笔记只借他一人；他的拍只许她一人碰；第 30 集后增一处「顾曜递拍给沈让时姜屿盯着那只手两秒」的吃味反应拍。留白不真空，不写感情戏占时长。\n\n---\n\n## 二、骨架具体化（逐节点写实到事件）\n\n### 2.1 因果链八节点 → 本剧具体事件（kb/aesthetic/conflict-escalation）\n\n| 节点 | 本剧具体事件 |\n| --- | --- |\n| 1 主题命题/反命题 | 命题：位置该由比分与贡献定价。反命题：魏峥的「盘子论」——名额、商业位、话语权是可签出的资产，体系靠这套运转且人人受益，立场自洽（对立统一过检） |\n| 2 主角欲望 | 外在：把大赛正赛名单上被划掉的名字打回来。内在：赎「当年那一让」的罪（早期不自知，只通过行为模式体现——从不为自己赢、只盯计分牌不盯人、口癖「比分不说谎」） |\n| 3 激励性扰动 | 姜屿归队（第 1 集卡点「你的球，第三板是谁教你的？」= 发现者进场）+ 第 6 集魏峥当众划掉热身名单上的「沈让」——他「藏到退役」的原策略彻底失效（催化剂换位：扰动不是主角遭变故，是被看见） |\n| 4 递进复杂化（对抗力量学习适应） | 每次清算后魏峥系换更高维度递卡：规则卡（洪川改考核/黑哨）→ 舆论卡（买热榜压沈让、粉丝控评）→ 记账卡（纪录片挪功劳、「商业考核优先后列」）→ 体系卡（销毁评估档案、拿姜屿复出资格当人质）。代价从「不配上桌」升到「两人捆绑暴露旧账」 |\n| 5 不可回头点 | 第 30 集：沈让赢下升降级挑战赛、当众亮明实力拿走正赛席位——从此不是隐形人，资方清算对象从「一个人」变成「两个人」（姜屿复出资格被捆绑审查）。是他自己选择当众赢所致，非外界封路 |\n| 6 危机选择 | 第 48-52 集：洪川倒戈交出的评估档案是双刃——公开它 = 清算魏峥 + 自爆「沈让当年让球」那页（姜屿当众知道真相）；封存它 = 唯一证据链作废。互不兼容、均有代价 |\n| 7 高潮行动 | 第 54-58 集：顾曜决胜局落败后摘灯牌当众自白（镜像收口）→ 沈让当众把档案两页一起读出——连自己那一页 → 魏峥被自己签发的账本与录音反杀，联盟核查函进场 |\n| 8 结局价值与余波 | 第 60 集：新名单公示，红笔写上「沈让」；新公示机制立起（陪练积分计入个人排名），账本留给下一个「沈让」。代价残留：沈让的正赛首站从资格打起、姜屿被偷走的三年追不回——不是全员原谅式大团圆 |\n\n### 2.2 十章骨架（10 章 × 6 集；逐章写实事件；R1 条件 4/5 落锁已标注）\n\n| 章 | 集 | 具体事件（起 → 收） | 章尾钩 / 卡点 |\n| --- | --- | --- | --- |\n| 1 | 1-6 | 第 1 集 3 秒：计分牌 10:8 被挡板后一只手翻成 8:10，画外音「比分是给人看的」；陪练当众受辱（被安排给顾曜当发球机）。第 2 集考核「不配上桌」双关羞辱 → 三分连发当场回敬 →「我瞎打的」藏锋。第 3 集姜屿擦蒙尘奖杯、07 号布拍回公示栏，两人首次隔网对拉全馆安静。第 4 集姜屿看破缠胶皮手法（发现者实锤，眼神停顿为暗埋①）。第 5 集替补热身小露一手引骚动；魏峥在监控屏室调出三年前一份评估单（1 拍，不解释——暗线微光）。**第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉（情境钩为唯一主钩；「我不要你觉得」仅垫场台词——R1 条件 5 落锁），同一支笔给顾曜签发资源包（笔部特写=暗线伏笔②）** | 第 6 集：划名单强拍换人 |\n| 2 | 7-12 | 第 7 集资格赛首轮「退退退」防守反打慢镜首胜。**第 8 集阴招发球 → 回放首秀一球翻案当场闭环（受辱→回放→反案 ≤2 拍；单点亮出即收，不作层层撕）——首付费卡点**。第 9 集神秘陪练传闻发酵（拉新钩）。**第 10 集【功劳记账显性节拍·R1 条件 4 落锁】顾曜发布会吹嘘，官方预告片把沈让喂球镜头与加练日志剪进顾曜「天赋叙事」——观众恨得具体，第 18 集专等翻这笔账**。第 11 集「这波在大气层」教练组骗招得手（小挫蓄力）。第 12 集二连胜 + 积分榜抬头，公开账本首次亮给观众 | 第 8 集首付费卡点；第 12 集章末次级卡点 |\n| 3 | 13-18 | 第 13 集太子连丢分破防名场面。第 14 集黑哨质疑 → 慢镜回放判罚反案（场面梗复用，观众看见洪川执行时手抖——倒戈暗埋）。第 15 集姜屿复出首胜「爷青回」，07 号布首次出现在赛场。第 16 集「用魔法打败魔法」发球反制阴招。第 17 集塌房第一拍：赞助商「领跑体育」连夜撤牌——撤牌函签字笔迹 = 第 6 集同一支笔（暗线伏笔③）。**第 18 集【清算首发，强度对表 b003 金殿位】比赛馆中央：计分屏三连闪回被偷走的每一分（含第 10 集预告片挪用的原始素材对照）+ 积分榜定格 + 当众念账「这位置是资源买的，还是比分买的？」+ 应援灯牌成片熄灭** | 第 18 集大卡点 1 |\n| 4 | 19-24 | 舆论卡单元：第 19-20 集资方买热榜压「沈让」词条、赢球上不了榜（热榜倒挂预热）。第 21 集切片反击：球迷自发剪辑回放证据链全网扩散，当众小兑现。第 22-23 集顾曜商业行程与战绩首次被并置嘲讽。第 24 集太子粉丝站内讧——流量第一次咬人（镜像拍：他不敢病、不敢退赛） | 第 24 集：站内讧 |\n| 5 | 25-30 | 升降级挑战赛：第 25-29 集沈让 vs 顾曜首次正面对位，五局拉锯（让二追三结构预演）。第 27 集姜屿深夜翻旧档案：评估单签字笔迹与今日资源单同笔（暗线显影，不揭内容）。**第 30 集【中点·模型改写】沈让赢下正赛席位——热榜第一却是顾曜的商业官宣（黑白对比帧）。位置打回来了，账本不认：故事模型从「打回位置」改写为「打回记账权」**；不可回头点成立，姜屿复出资格被捆绑审查 | 第 30 集章末次级卡点 |\n| 6 | 31-36 | 功劳记账单元：第 31-32 集纪录片把沈让十年陪练功劳剪进顾曜成才叙事，原始训练日志被抢先调走。第 33-34 集两人抢物证链：发球机记录、门禁数据、旧胶皮购买单。第 35 集魏峥亲自宣布「商业考核优先后列」（第一记体系级重压）。**第 36 集【大卡点 2】发布会投屏原始训练日志当众反案：「功劳是谁的？」** | 第 36 集大卡点 2 |\n| 7 | 37-42 | 太子镜像单元：第 38 集【中型反转·身份型】顾曜发现「商业优先」名单里自己也只是筹码——白手套觉醒（「小丑竟 敢输；最亮的位置 × 最空的手**（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病） | 保住「太子」人设即保住还债能力 | 「我知道。」→ 后期变奏「原来我不知道」 | 摘灯牌、鞠躬、「别替我恨人」——塌掉的偶像亲手拆了造星机 |\n| **魏峥**（男，45） | 启明娱乐俱乐部运营总监，分配机器本身 | 深色立领外套、保温杯、从不进场只看监控屏 | **满口「为俱乐部好」 × 记账比谁都清楚；从不看球 × 从不记错账** | 盘子：名额、商业位、话语权都是可签出的资产 | 「这不是钱的事，是盘子的事。」 | 被自己签发的账本与录音反杀——机器被自己产的账埋掉 |\n| **洪川**（男，52） | 星轨总教练，魏峥的执行手 | 秒表挂脖、口哨不离嘴 | **训练场铁面 × 走廊里弯腰**（知道每一分的价钱，也记得每个孩子的手抖） | 执行换平安，直到平安也保不住 | 「练都练了。」 | 第 48 集倒戈交档案——连坐第一环，也是唯一自救的一环 |\n| **唐果**（男，19） | 队内三号，功能性队友 | 微胖、永远在嚼能量胶 | 群像情绪出口：不敢反抗 × 敢在群里说真话 | 想让「让哥」上一次正赛名单 | 「稳住，能赢。」 | 第 60 集把「稳住能赢」写上新名单的祝语 |\n\n双主角关系轴（不落恋爱标签）：**发现者 × 被证明者互为触发器**——她是他「被埋没」的目击人，他是她「当年不是我不行」的活证据；大反转后升级为互为因果（他的让 = 她的退）。独占感道具：笔记只借他一人、拍只许她一人碰、递拍吃味反应拍（1.3 节裁决）。\n\n---\n\n## 四、反派梯度与爽点机制（不依赖违禁元素）\n\n### 4.1 反派梯度（三层连坐，逐级升格）\n\n| 层 | 人物 | 作恶方式（= 公共情绪现实原型的戏剧化虚构） | 清算仪式（连坐顺序） |\n| --- | --- | --- | --- |\n| ① 台面上（个人恩怨层） | 顾曜 | 资源倾斜的受惠端：占位、流量压实力 | 忏悔式（第 54 集）：摘灯牌当众自白 |\n| ② 台面下（操作层） | 洪川 | 安排比分、黑哨、改考核的具体经办 | 除名式（第 48 集）：评估记录当众公示，反戈一击 |\n| ③ 体系（分配机器本身） | 魏峥 | 名额内定、功劳挪用、资源倾斜的总操盘——惯犯不是初犯 | 落网式（第 58 集）：账本 + 录音 + 联盟核查函 |\n\n终极对手是**分配机制本身**：魏峥落网不等于终点，第 59 集以「新公示机制表决」收口——清算的终点是制度替换，不是私怨了结。占位者立场自洽（顾曜有付出、被裹挟；魏峥的「盘子论」成逻辑），非一边全错（埃格里对立统一过检）。\n\n### 4.2 爽点机制（零违禁元素依赖）\n\n**等价原理**：爽感结构三角 = 当众性 × 证据链 × 代价可见。真实指涉只能供给「话题浓度」，不供给爽感结构；本剧三角全部由虚构装置供给——\n\n| 装置 | 供给 | 具体写法 |\n| --- | --- | --- |\n| 计分屏 | 当众性 | 比分即判决书；清算必在有人看着的地方发生 |\n| 慢镜回放 | 证据链 | 每一板拆给不懂球的观众；黑哨/误判/挪用全靠它当场反案；「翻案 ≤2 拍」内闭环 |\n| 积分榜/公示栏 | 代价可见 | 公开账本一屏一屏念账；红笔划名/写名是全剧权力交接的视觉母题 |\n\n- **三要素判据**（浓度内标尺，替代无数据的韩剧「基准」表述——R1 条件 3 落实）：每次大清算必须**公开、证据链完整、当众社会性死亡**三要素齐，缺一返工。烈度上限对表 b003 金殿位。\n- **单元模板「一张球台的清算」**：递卡（资源/规则/舆论三选一）→ 当众设局羞辱 → ≤2 拍回击 → 当场记账 → 反派付可见代价（掉商业位/掉轮换位/掉话语权）。每次清算同步喂一层职场映射（名额=关系户占坑 / 功劳=署名权被挪 / 资源=流量压实绩）——不懂球的职场观众即代入（C1 检验内置）。\n- **金手指 = 权力型身份带成本**：兑现画面全是机构文件易手（公示栏复名、撤牌函、发布会质询席、积分榜首、核查函），不是「证明我没错」；成本 = 每赢一步曝光一步（第 30 集后姜屿被捆绑为质子）。\n- **专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句/群演反应拍/字幕反差——「外行看是捡球的，内行看是高手」），禁哑谜（R1 一般读者条件落实）。\n- **镜像拍**：顾曜同样被流量反噬（不敢输/不敢病/粉丝替他恨人）——批判机制不批判粉丝群体，受众中的粉丝观众不被一刀切。\n\n### 4.3 反转预算与判型（1 大 + 3 中；kb/aesthetic/reversal 全条过检）\n\n| 反转 | 集 | 判型 | 前置暗埋（≥2 处，回看成立） | 反转后重算 |\n| --- | --- | --- | --- | --- |\n| 大：让球 × 退队同事件两面 | 48 | 因果反转 | ①第 2 集「输得像一点」时捏紧拍柄特写 ②第 4 集姜屿「这种起板我见过」+ 护腕按压 ③第 15 集姜屿「我回来的原因不是夺冠」半句收 ④第 30 集热榜倒挂夜她低声「你欠的不是我」 | 第 1 集魏峥划名单（防旧账重见天）、第 17 集急签撤牌函（灭口）、姜屿三年不问缘由的自责——全部回写闪回/台词回指，不留悬空证据 |\n| 中 1：太子白手套 | 38 | 身份反转 | ①第 1 集摔拍后先偷看魏峥反应 ②第 10 集发布会提词器特写 ③第 13 集破防后无人安慰只有行程表 | 顾曜后续每次「我知道」的语义重算 |\n| 中 2：同一支笔（体系惯犯） | 46-47 | 预期反转 | ①第 1 集画外音「比分是给人看的」②第 5 集调三年前评估单 ③第 6 集签发资源包笔部特写 ④第 17 集撤牌函同笔迹 | 暗线四伏笔全部收束进第 48 集档案 |\n| 中 3：洪川倒戈 | 48 | 立场反转 | ①第 2 集急哨压声「收着点」的眼神矛盾 ②第 14 集执行黑哨时手抖 ③第 43 集私留档案副本 | 第 2/14 集他的每次「执行」重看为挣扎 |\n\n同型连用检查：身份（38）→ 预期（46-47）→ 因果（48）→ 立场（48 章首），无相邻同型；四个反转分落 4 个章，不扎堆（第 48 集内揭底与倒戈是「证据与立场」的先后两拍，非重复反转）。\n\n---\n\n## 五、改造点清单（每处回指梗卡新变体落点）\n\n| # | 改造的标志件 | 改造成什么 | 梗卡新变体回指 |\n| --- | --- | --- | --- |\n| 1 | 复仇结构的「蛰伏多年」 | 改为**当下清算**：零时间跨度，受辱与回击 ≤2 拍、一场球内闭环（为此明确不取重生复仇族） | 场景轴：实时计分 × 直播切片回放 × 积分榜——「当众」的竞技化放大器 |\n| 2 | 升级结构的「金手指」 | 改为**权力型身份带成本**：兑现=机构文件易手；每赢一步曝光一步 | 人设轴：陪练/被退队者载体 × 资方造星占位太子（链上无运动员载体） |\n| 3 | 催化剂（激励扰动）换位 | 扰动不是主角遭变故，而是**发现者进场**（姜屿第 1 集卡点提问 + 第 6 集划名单使藏的策略失效） | 关系轴：发现者 × 被证明者互为爆点触发器 |\n| 4 | 复仇的「清算顺序」 | 从「仇人名单从大到小」改为**连坐递升 + 制度替换收口**：执行层 → 台面 → 体系 → 机制（第 59 集公示制度表决） | 强者回归轴：清算 = 物归原主非惩罚，终局不落私怨 |\n\n---\n\n## 六、不确定因素注入提案（structure-design 招牌产物）\n\n**已融入基线的两条**（R1 红方提案 A/B，本件落定为骨架部件）：\n\n- **提案 A · 让球前史**（人物前史层）：注入点=沈让第 2/4/15/30 集四暗埋、第 48 集引爆、51-52 预热、第 54 集当众自读档案收口。后续影响=第 18 集清算同时清算自己；第 48-52 集危机选择成立（档案双刃）；姜屿态度双层化。增益=「藏八年」从被动埋没变主动赎罪，主题从受害者翻盘升为赎罪+翻盘双驱动，二刷价值。风险=主角道德瑕疵致弃剧（对策：让球时他是 19 岁被裹挟的新人、让完即悔——对立统一，且不豁免他受清算）。\n- **提案 B · 同一支笔**（道具/身份层）：注入点=第 1/5/6/17 集四伏笔、第 46-47 集揭晓。后续影响=暗线成立、第 48 集交叉引爆、反派从「这一次作弊」升「体系惯犯」。增益=关系轴从互为触发器升级互为因果，两弧咬死。风险=侦探感冲淡爽感（对策：暗线只在章末卡点释放半句，每集主认知更新唯一）。\n\n**本件新增两条，提交 R2 红方验收，择优融入后方可进 S3**：\n\n- **提案 D · 「训练分 / 排名分」双栏账本**（世界观规则层）：注入点=俱乐部积分规则——陪练胜场记「训练分」不计入个人排名。改变节点=第 12 集积分榜抬头改双栏对比（训练分栏爆表/排名分为零）；第 18 集念账加第二层「比分不说谎，账本会」；第 36 集反案升为「署名权反案」；第 60 集新章程第一条「陪练积分计入排名」。增益=职场映射第四层（干得再多不记你名下）；积分榜从背景板变每集争夺物；暗线「记账权」主题有了机制载体。风险=①规则认知负载（须配「翻译」纪律每集一句）②专名预算已满（只用「训练分/排名分」通用词，不自造体系名）③疑似影射真实积分规则（对策：双栏为全虚构规则，不与任何真实赛制对应，待专业素材件核实后定稿）。改动成本：仅动 4 个节点，不动骨架。\n- **提案 E · 魏峥是上一代产品**（人物前史层，备选）：注入点=第 58 集落网式里 1 画面（旧名单上魏峥的名字在「被让」栏）+ 1 句不洗白自认。增益=机制代际循环，主题最后一层——机器也是机器造的。风险=洗白感（严格 1 拍内，不豁免清算）；与第 48 集揭示扎堆（压到 58 独立释放）；容量已满不另开场次。建议：默认不采纳不伤骨架，R2 裁决。\n\n---\n\n## 七、节奏预排与爆点分布预扫\n\n### 7.1 关键节拍位置（对表 kb/market/structure 实盘）\n\n- **首付费卡点：第 8 集**（实盘窗口 8-12；卡点落张力峰值=翻案当场兑现 + 「查他」信息钩，非情绪低谷）。\n- **中点：第 30 集**（改写故事模型：位置打回来了、账本不认——从「打回位置」改写为「打回记账权」，非提高音量）。\n- **决战：第 54-58 集**（55+ 决战区间：决胜局 + 自白 + 落网式），第 60 集余波收口。\n\n### 7.2 情绪曲线判型（kb/aesthetic/emotion-curve）\n\n主型 = **层层递进**（赌注逐级抬高：上桌权 → 资格名分 → 积分 → 正赛席位 → 记账权 → 名字 → 机制，每一级均高于上一级，无平级）。亚结构 = 两次压抑爆发微循环（第 30 集压至最底为第 36 集蓄力，有「最后稻草」级事件=纪录片预告挪用十年功劳；第 46-47 集人质危机为第 48 集爆发蓄力）。倒钩仅作首尾回收（第 1 集划名 → 第 60 集写名，同机位同道具），不作主骨。低谷段全部推进信息或关系（51-52 回落段推进让球前史预热；无纯低谷沙漠段）。\n\n### 7.3 爆点分布预扫（AE-DESERT / AE-CUSHION）\n\n- **沙漠段扫描**：逐章当众兑现间隔 ≤3 集（第 1-18 集按梗卡预布点表 1:1 对位；第 12/13/14/15 四点已由预布点升格为硬节拍——R1 条件 5 落锁）。全 60 集无连续 5 集无爆点段。\n- **垫场核查（两大卡点间 ≥2 中型爽点）**：8→18 之间有 10（功劳记账钩）/12（积分榜）/14（判罚反案）/15（复出首胜）/16（发球反制）✓；18→36 有 21（切片反击）/24（站内讧）/26-29（挑战赛拉锯）/30（席位+倒挂）✓；36→54 有 38（白手套）/40（反噬戏）/42（对拉）/44-48（黑幕线）/49-53（正赛）✓；54→60 有 55-59（反扑与反杀）✓。\n- **钝化管理**：第 49-54 正赛段持续高强度，已设第 51-52 集回落段（07 号布静场+前史闪回预热）防强度钝化（conflict-escalation §二 minor 条）。\n- **hot 档密度**：每集爽点 ≥3（打脸/反转/身份碎片/金句任一）、每 3 拍一个小刺激、回击时差 ≤2 拍；「比分不说谎」第 1/2/3 集三变奏、口癖每集 ≥1 次。\n\n### 7.4 场景复用表（C3 配套：换景 = 换集节拍点，每集 ≤3 场景）\n\n| 复用场景 | 承担集数段 | 功能 |\n| --- | --- | --- |\n| 星轨训练馆球台区 | 全剧 | 主场景：单元清算默认场地 |\n| 俱乐部公示栏走廊 | 1/3/6/60 等 | 名单/红笔母题：权力交接仪式位 |\n| 发布会厅 | 10/36/48/54 | 舆论场清算位 |\n| 器材室/深夜训练馆一角 | 2/4/27/42/51 | 蓄力场与暗线场 |\n| 资格赛/挑战赛比赛馆 | 7-18、25-30 | 明线赛程段 |\n| 九州大满贯主赛场 | 49-54 | 终点战 |\n| 魏峥监控屏室 | 5/6/38/46/58 | 反派主场：账本与反杀位 |\n\n---\n\n## 八、三分钟测试自查（C10）\n\n- **第 1 集前 3 秒**：计分牌 10:8 被翻成 8:10——有人改比分。零设定解释，无体系名/组织名/规则名进正文（「星轨」仅工牌与队服字幕出现）。\n- **这是谁**：沈让，八年陪练，隔着挡板看见比分被改，捡球筐捏出声响。\n- **他想要什么**：不喊口号——他只是把翻掉的比分记住了；外在欲望（打回名单上的名字）在第 1 集名单公示场直接可视化。\n- **为什么替他急**：亲眼见比分被安排 + 被当众安排当发球机 + 自己的球被剪进别人素材——流量实力倒挂/选拔不透明/功劳记账三层公共神经第 1 集全踩，职场人零门槛代入（C1）。\n- **判**：过。\n\n---\n\n## 九、创作约束移交单逐条对账（C1-C10）\n\n| 条 | 落点 | 判 |\n| --- | --- | --- |\n| C1 | CN 优先、route=dual 双主角互相成就；每单元模板内置职场三层映射（4.2），零懂球门槛；次客群由队伍终点战+复出线覆盖 | 过 |\n| C2 | 60 集 × 1-1.5 分钟 × 单集正文上限 1200 字；10 章 × 6 集切分；反转预算 **1 大 + 3 中**（R1 条件 6 裁决回写）；全部副线挂「分配权」主线，无独立副线 | 过 |\n| C3 | 每集场景 ≤3 + 场景复用表（7.4）；有名有姓 6 人封顶（裁决回写）；前三章自造专名 2 个（星轨/启明），「九州大满贯」「领跑体育」为 17 集后登场不占预算；当众清算群演由环境描写承担 | 过 |\n| C4 | 禁马甲主线（掉马仅第 8/18 集清算瞬时态，单点亮出即收）；禁团宠（队伍线降为功能件，唐果战友情驱动）；无真假千金身世线（07 号布是姜屿自己的号码，非身世）；无追妻火葬场轴；无架空世界观（现实乒乓球+虚构俱乐部）；隐藏实力仅为藏/露策略变量 | 过 |\n| C5 | 全文无真实运动员/协会/赛事/赞助商/场馆名；剧内场馆全虚构通用名，**不映射任何真实场馆与赛程**（R1 条件 2 出清：热点素材「同场馆设定」不采纳，宣发话术与剧内设定同守此线）；「饭圈」议题只取情绪不点名，镜像拍原则；正片与宣发切片无口号式台词；机构定调等证据仅作内部创作锚定不进正片 | 过 |\n| C6 | 灌篮高手/金牌得主仅借结构（队伍线+大赛终点 / 双主角互相成就）；致敬位台词（「教练，我想打____」位）留待 S3 成稿原创改编，本骨架未引用任何原句，不复用原作桥段 | 过 |\n| C7 | 首付费卡点第 8 集（窗口内，落张力峰值）；每章章尾钩（2.2 表末列）；清算首发固定第 18 集 + 烈度分级声明防提前释放（2.3）；前 18 集每集 ≥1 切片梗点，与梗卡预布点表 1:1 对位；**R1 条件 4 落锁：功劳记账显性节拍进第 10 集**；**R1 条件 5 落锁：第 6 集以划名单情境钩为唯一主钩、12-15 升格硬节拍** | 过 |\n| C8 | 主锚「德不配位」匿名化贯穿（情绪公式：位置×资源×荣誉的分配权错配）；反派作恶三式对应公共情绪原型且全虚构；排期对位 2026-09 中下旬-10 月赛事注意力窗口（前 10 集名单公示冲突优先投放；A2 赛程细节上线前复核） | 过 |\n| C9 | 新变体三轴回指：人设轴（陪练载体×占位太子，见人物表与改造点 2）、场景轴（计分/回放/积分榜，见 4.2）、关系轴（发现者×被证明者互为触发器→互为因果，见 1.1/改造点 3）——本件所有改造点均可回指，非假新意 | 过 |\n| C10 | 次选级设定声明（打脸虐渣+隐藏实力+强者回归，实事情绪做底，无原创架空）；三分钟测试自查过（第八节）；技战术以可核验常识为限+「翻译」纪律；**专业素材件显式移交（R1 条件 1）：责任阶段=调研阶段、产物形态=乒乓常识件（技战术/赛制/陪练体系）、时限=S3 开工前闭合，S3 不得带空白开工**；梗密度直取梗卡预布点表不另起炉灶 | 过（附显式移交） |\n\n---\n\n## 十、遗留与移交\n\n1. **提案 D/E** 提交 R2 红方多视角验收（目标读者/资深编剧/甲方三面），择优后方进 S3；D 仅动 4 节点、E 默认不采纳不伤骨架。\n2. **专业素材件**（R1 条件 1）仍为调研阶段硬性欠账：S3 前必须闭合，否则按 R1 意见书 root_cause 规则顺延失效重审。\n3. 梗卡预布点表第 4 集「看破缠胶皮」须待专业素材件核实手法细节后定写法；S3 前每集分拍里的技战术描写暂以常识为限。\n4. 恋爱轴维持不预设：甲方若点名恋爱轴，另挂先婚后爱族重新过卡（R8），本骨架的暗线与卡点表不受影响。\n\n---\n\n*产物完。2026-09-16 · 结构选型师（story-choreographer 剖面）。与选题方案-爽版-基线同源：人设 6 人、卡点 8/18/36/54/60、计分板清算三轴、章结构 10×6 全部一致；本件新增值为结构论证、暗线布线、R1 条件 4/5/6 落锁与 D/E 注入提案。*\n", "梗卡.md": "# 梗卡 · 拍魂（p-key-soul · 乒乓竞技爽剧）\n\n## 一、查族：候选梗族饱和度总表（快照 2026-09-15）\n\n| 大妈，无运动员陪练）；反派 = 资方造星\"占位太子\"（青训嫡系+流量包装），\n          \"德不配位\"的具象化。\n        - 场景轴新：实时计分赛场 × 直播切片 × 积分榜公开账本——\"当众\"的竞技化放大器：\n          比分即判决书、慢镜回放即证据链、积分榜即公开账本。打脸链已用落点（兵棋沙盘/\n          机械改装/学术打假/查账/镬气/走秀）无一处用计分清算。\n        - 关系轴新：双主角互为触发器（发现者×被证明者）；对手轴 = 占位者集团（嫡系\n          教练组/资方/数据包装），非情敌非豪门非婆媳——竞技关系轴在链上空白。\n\n  对标件：kb/benchmark/b003-cn《草包状元：开局沙盘点崩十军》（150000 万 / A）\n          爆点位置 = 开局金殿当众立军令状+沙盘算崩杀阵——用作\"当众清算烈度上限\"标尺\n          （对应本项目首章资格赛当众打崩占位者的强度基准）。\n          kb/benchmark/b016-fam《扫地姑娘是百亿精算师》（94000 万 / A+，hot 档亲和）\n          爆点位置 = 白板夜演引全城搜寻→对赌局当众徒手复原数据——用作\"隐藏实力两段式\n          揭示节奏\"标尺。\n          kb/benchmark/b027-s《给大妈爆改后我成了顶流》（S 级 / AI 评 91）\n          爆点位置 = 露天广场连夜搭台走秀引爆全网（黑热搜→全民共鸣的舆论翻转+群像\n          终点战）——用作\"大赛终点 × 舆论场翻转\"标尺（灌篮高手大赛终点感的放大器）。\n\n  风险：- 过饱和警告：马甲掉马族（n=750 / 均 9215 万）贴脸——隐藏实力只服务打脸时机\n          纪律，禁\"身份收集/层层撕马甲\"写法，掉马当清算的瞬时态不当主线，否则跌入\n          过饱和带热度陷阱。\n        - 退潮预警：团宠护短（均 2703 万）、真假千金（均 7938 万）不入主线——队伍线\n          靠战友情与各自执念驱动，不写全员宠主角。\n        - 语料未覆盖：竞技载体无 CN 类目、NA 体育带热度低——供给稀薄=窗口，但无\n          套路护栏；强度只能挂对标标尺，竞技专业度留调研步核实，不许编。\n        - 合规：全虚构——无真实运动员/协会/赛事/赞助商名；\"德不配位\"只借公共情绪，\n          占位者集团不得影射真实事件或人物（\"饭圈\"议题只取情绪不点名）。\n        - 版权：《灌篮高手》为甲方指定结构参考，致敬位须原创改编台词，不得直接引用。\n        - 关系线：双主角默认按\"互相成就\"写（师徒/搭档双可）；甲方点名要恋爱轴时，\n          另挂先婚后爱族重新过卡，本卡不预设。\n```\n\n## 三、网络热梗素材表（meme-rules S1 硬指标，≥10 条）\n\n评级口径：定性评级（极高=全网刷屏级；高=多平台通用；中=圈层内高传），来源对表 meme-rules 第二节源清单；`meme_harvest` minitool 未实现，本次为人工评级。所有条目不含真实运动员/协会名。\n\n| # | 梗名 | 来源与传播度评级 | 可挂接的场景示例 |\n| --- | --- | --- | --- |\n| 1 | 不讲武德 / 耗子尾汁 | 2020 年武术访谈名场面，全网刷屏（极高） | 反派场外使绊被嘲；主角用规则内骚操作反杀后的赛后采访位 |\n| 2 | 退退退 | 抖音名场面（极高） | 主角连续防转攻，把对面三板爆冲全挡回去，\"退退退\"节奏慢镜切片 |\n| 3 | 六边形战士 | 日媒乒乓雷达图解说玩梗，已泛化为\"全能者\"代称，不指向具体人物（体育/二次元圈层极高） | 集尾主角能力雷达图可视化（竖屏 AI 漫剧天然适配数据可视化） |\n| 4 | \"教练，我想打____\" | 《灌篮高手》三井寿名场面，二次元母梗（极高；甲方指定参考） | 强者回归主角归队致敬位——台词必须原创改编，版权红线 |\n| 5 | 让二追三 | 体育解说通用语（高） | 决胜局 0:2 落后翻盘的解说词与切片标题位 |\n| 6 | \"不配上桌\" | 职场/圈层话语高传梗（高） | 与球桌双关：被嘲\"陪练不配上桌\"→把对面打\"下桌\"。本项目独有的双关嫁接位 |\n| 7 | 杀疯了 | B 站/网络通用（高） | 主角连得分段的弹幕位、解说词位 |\n| 8 | 破防了 | 网络通用（高） | 占位太子连丢分、黑粉刷屏被反杀后的反应戏 |\n| 9 | 塌房 | 饭圈通用（高） | 太子当众翻车后：广告连夜撤牌、后援群解散的快剪 |\n| 10 | 饭圈入侵体育圈 | 近年官媒批评的公共议题词（极高，公共情绪） | 资方流量造星 vs 实力派的世界观底噪——\"德不配位\"的现实共振位（不点名任何真实事件） |\n| 11 | 小丑竟是我自己 | 网络通用（高） | 太子发现自己是资方白手套工具人时的自嘲位 |\n| 12 | \"我不要你觉得，我要我觉得\" | 综艺\"明学\"名场面（高） | 霸道资方总监强拍换人决策——后期被打脸回收的伏笔台词 |\n| 13 | 实力不允许我低调 | 网络流行语（高） | 掉马集标题位/主角当众亮实力台词位 |\n| 14 | 爷青回 | B 站高传（高） | 老将/原天才复出首胜的弹幕共振位 |\n| 15 | 这波在大气层 | 电竞解说梗（高） | 教练组神换人、战术骗招被解描述评位 |\n| 16 | 用魔法打败魔法 | 网络通用（高） | 主角用以彼之道的发球反制对方阴招 |\n\n## 四、发散性拆解（meme-rules：主梗/新变体各拆 ≥3 个跨场景复用用法）\n\n**主梗新变体「计分板清算」**\n1. 对话梗：口癖\"比分不说谎\"——解说/教练/主角三人复读，3 集内 3 变奏（hot 档金句复读纪律），任何对局/采访/发布会场景通用。\n2. 场面梗：慢镜回放当证据链——每一板拆给\"看不懂球\"的观众，翻案戏通用件（黑哨/误判/让球质疑全靠它清算）。\n3. 切片梗：11 分制单挑局、让二追三大逆转、\"不配上桌\"球桌双关——不依赖前后剧情可独立转发。\n\n**辅梗 1「隐藏实力」**\n1. 对话梗：\"他就是个捡球的\"→递拍/缠胶皮的手部特写露底——\"行家一出手\"模板，任何场景可复用。\n2. 场面梗：深夜训练馆一盏灯 × 发球机（扫地姑娘白板夜演的乒乓转译），蓄力戏通用件。\n3. 切片梗：\"实力不允许我低调\"掉马名场面；握拍/胶皮细节党的考据向切片。\n\n**辅梗 2「强者回归」**\n1. 对话梗：\"名字是打回来的，不是发回来的\"——归队、领装备场景通用。\n2. 场面梗：蒙尘奖杯擦拭开场、旧球衣号码特写——回归仪式感通用件。\n3. 切片梗：\"爷青回\"复出首胜；\"教练，我想打____\"致敬位（原创改编）。\n\n**反派轴「德不配位」（随主梗附赠）**\n1. 对话梗：\"这位置是资源买的，还是比分买的？\"\n2. 场面梗：发布会吹上天 → 次日资格赛一轮游的对照剪辑。\n3. 切片梗：塌房三连快剪（撤广告/散超话/资方撇清）——现实塌房流程的戏剧化。\n\n## 五、前三章梗点密度自查（meme-rules 硬指标·预布点）\n\n按 60 集 = 10 章 × 6 集的切分建议，前三章 = 第 1-18 集。本表是**梗资源预布点**（供 S2 结构 / S3 大纲校准），不是结构决定——每集至少 1 处可独立切片传播的梗点：\n\n| 集 | 可切片梗点 |\n| --- | --- |\n| 1 | 选拔黑幕一瞬（被\"安排\"的比分特写）+ 陪练当众受辱——打脸引擎点火位 |\n| 2 | \"不配上桌\"球桌双关羞辱（切片位） |\n| 3 | 强者回归主角登场：蒙尘奖杯/旧号码（回归仪式梗点） |\n| 4 | 发现者瞬间：看破缠胶皮手法（细节暴露梗点） |\n| 5 | 替补热身小露一手引骚动（\"实力不允许低调\"预告位） |\n| 6 | 章尾钩：\"我不要你觉得\"资方强拍换人（打脸伏笔台词） |\n| 7 | 资格赛首胜：\"退退退\"防守反打慢镜（切片位） |\n| 8 | \"他就是个捡球的\" vs 慢镜回放首秀（回放即证据链首次启用） |\n| 9 | 神秘陪练传闻发酵（b016 式\"全城搜寻\"线启动） |\n| 10 | 占位太子发布会吹嘘（对照剪辑梗点埋设） |\n| 11 | \"这波在大气层\"：教练组骗招得手 |\n| 12 | 二连胜 + 积分榜抬头（公开账本首次亮给观众） |\n| 13 | 太子丢分破防名场面（切片位） |\n| 14 | 黑哨质疑 → 慢镜回放翻案（场面梗复用） |\n| 15 | 强者回归主角复出首胜\"爷青回\"（切片位） |\n| 16 | \"用魔法打败魔法\"发球反制阴招 |\n| 17 | 塌房前兆：赞助连夜撤牌（塌房三连第一拍） |\n| 18 | 章尾爆：\"比分不说谎\"当众清算首发位——口癖完整版首现，强度对标 b003 金殿位 |\n\n## 六、判定纪律留痕\n\n1. **数据日期**：所有 n / 均热度引快照 2026-09-15；判定口径按 kb/market/structure（n + 均热度，单部爆点不算带）。\n2. **语料未覆盖**：竞技载体（CN 无类目；NA Sports-Romance n=111 / 均 1225 万）——结论只用对标兜底，未编数据。\n3. **路线适配**（kb/aesthetic/style-routes，route=dual）：本梗组合双档兼容——hot 档每集按 打脸/当众/反杀 keywords 布点、回击时差 ≤2 拍、口癖复读；calm 档 9:1 浓度（预选赛长蓄力+决赛单爆点）、物件母题 ≥2（蒙尘奖杯/旧胶皮）。档位是风格参数，不影响梗选型（判定纪律 2）。\n4. **相性检查留痕**：`check_trope_combo` minitool 未实现（tools/ 无脚本），按梗族元数据 + kb/aesthetic/conflict-escalation 副线纪律人工过检：两辅梗均改变主梗选择条件（藏露策略变量 / 对手轴换轴），非占时长；对立统一过检（占位者立场自洽）。\n5. **创新亮点回指**（判定纪律 3）：后续方案的创新亮点段必须能回指「计分板清算」三轴新变体（人设轴：陪练载体与占位太子；场景轴：计分/回放/积分榜；关系轴：发现者×被证明者互为触发器）——答不上来 = 假新意，打回重写。\n", "选题素材.md": "# 选题素材 · 拍魂（甲方需求，全新重跑 2026-09-16）\n\n## 甲方点子（改道指令，2026-09-15）\n原方向电竞键魂，甲方改道：**乒乓球**，以\"德不配位\"公共情绪切入。\n\n## 甲方指定参考\n- 结构：灌篮高手（队伍线+大赛终点感）× 金牌得主（双主角互相成就）\n\n## 甲方约束\n- 形态：AI 漫剧竖屏，60 集体量\n- 合规红线：无真实运动员/协会名，全虚构\n", "kit/KIT.md": "# 创作者工具箱（kit）\n\n本目录是**你项目的工具链副本**——改坏了就删掉重 vendor，改顺手了就是你自己的版本。\n\n## 常用命令（在项目根运行）\n\n    python kit/check-purity.py <project>        # 产物正文纯净度检查\n    python kit/worldbook.py tree <project>      # 世界书结构树\n    python kit/worldbook.py check <project>     # 世界书一致性\n    python kit/export-doc.py <src.md> <out.docx> --plain   # md → docx（需 pip install python-docx）\n    python kit/snapshot.py capture <flow> <project> <node> --files <f>   # 快照留档\n    python kit/serve.py 8426                    # 本地预览（项目根）\n\n## 版本自治\n\n- `kit.json` 记录每个文件拷贝时的上游指纹；\n- `python tools/kit.py status <project>` 看哪些改过、哪些上游有更新；\n- `python tools/kit.py diff <project> <file>` 看差异；**更新与否由你决定，上游不自动覆盖**。\n", "内部/kb-benchmark.md": "# KB 装载 · benchmark（竞品对标装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 28 个知识文件。\n\n---\n\n<!-- source: knowledge/benchmark/b001-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b001-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 仵作状元：开局金殿断奇案\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"M\",\n \"genres\": \"爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎\",\n \"heat_w\": 150000,\n \"grade\": \"A+\",\n \"score\": \"88\",\n \"family\": \"zhuangyuan-keju\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2092069559019122688\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 仵作状元：开局金殿断奇案\n\n> CN 市场 · 男频 · A+ 级（AI 评 88） · 热度 150000 万 · 梗族：科举逆袭梗\n\n- **一句话卖点**：买榜草包开局替罪临斩，现代法医金殿验骨洗雪灭门冤案逆袭大理寺卿。\n- **题材**：爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎\n- **共情点**：击中职场普通人背黑锅、被全员认定能力不足百口莫辩的委屈，渴望专业降维打脸自证。\n- **爽点内核**：以绝对刑侦技术对草菅人命的权臣进行降维打击，在众目睽睽下洗脱罪名反转绝杀。\n- **创新亮点**：对标剧《谁说纨绔不能当状元》，将文抄打脸微创为硬核法医断案，强化智力碾压与悬疑张力。\n\n## 剧情主线（节选）\n\n主线剧情：现代首席法医穿越为京城第一草包沈浪，原主因花重金买通考官混入大理寺，恰逢皇室重宝失窃案暴雷，政敌严党趁机将他推上金銮殿当作替罪羊定为死罪。面临当场问斩死局，沈浪果断撕碎纨绔伪装，凭借现代微量物证与法医解剖知识，金殿之上隔空验尸断案，三炷香内揪出真正盗宝内鬼，奇迹般反杀脱罪并被御赐查案特权。沈浪借机深入朝堂，暗中调查沈家满门被诬陷通敌的陈年旧案，面对刑部与外戚世家的连环构陷，他以痕迹学破奇案、以逻辑侧写抓内奸，屡破京城惊天悬案。在此期间，原本对他鄙夷至极的冷面女首辅被其折服，在生死危局中暗送机密，两人在杀机四伏的暗巷中近身藏匿，呼吸交融间情愫暗生。随着真相大白，幕后黑手联合藩王兵变逼宫，沈浪以奇谋瓦解死局，亲手将仇敌送上断头台，从人人唾弃的替罪草包彻底登顶为执掌天下刑狱的第一权臣。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b002-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b002-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 败家状元：开局做空敌国商会\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"M\",\n \"genres\": \"爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎\",\n \"heat_w\": 150000,\n \"grade\": \"A+\",\n \"score\": \"85\",\n \"family\": \"zhuangyuan-keju\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2092069560063504384\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 败家状元：开局做空敌国商会\n\n> CN 市场 · 男频 · A+ 级（AI 评 85） · 热度 150000 万 · 梗族：科举逆袭梗\n\n- **一句话卖点**：败光家产的假状元被逼补千万亏空，现代操盘手用降维金融战做空敌国问鼎首辅。\n- **题材**：爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎\n- **共情点**：击中当代年轻人背负债务危机、被资方与小人压榨剥削的无力感，渴望财力逆天暴富破局。\n- **爽点内核**：以现代资本运作和算力认知差疯狂收割古代权臣与敌国财阀，实现财富与权力的绝对碾压。\n- **创新亮点**：对标剧《谁说纨绔不能当状元》，将朝堂文斗微创为现代金融商战，做空国运爽感拉满。\n\n## 剧情主线（节选）\n\n主线剧情：现代顶级量化操盘手苏林穿越成败家世子，原主不仅败光祖业，还借高利贷买通考官混成户部新科状元。开局即逢国库暴雷亏空千万两，内阁首辅趁机发难，逼他三日内补齐亏空否则全家抄斩。面对必死绝境，苏林运用现代金融做空与杠杆原理，以荒唐的赌石和粮券为幌子，诱导满朝贪官与敌国商会入局对赌，一夜之间狂揽三千万两白银填平国库，让企图看笑话的百官当场惊骇瘫软。为保住侯府并查明生母被毒害真相，苏林表面继续挥金如土扮作疯批财神，暗中建立横跨诸国的商贸情报网。敌国首富之女携万金前来经济绞杀，却在生死商战博弈中屡屡被苏林算无遗策所征服，密室对峙时被逼至墙角气息紊乱甘愿奉上全部底牌。最终敌国联合权臣发动粮荒逼宫，苏林以汇率战瞬间搞垮敌国经济，手刃仇敌，从全京城笑柄一跃成为掌控帝国经济命脉的无冕之王。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b003-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b003-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 草包状元：开局沙盘点崩十军\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"M\",\n \"genres\": \"爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈\",\n \"heat_w\": 150000,\n \"grade\": \"A\",\n \"score\": \"83\",\n \"family\": \"zhuangyuan-keju\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2092069560269025280\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 草包状元：开局沙盘点崩十军\n\n> CN 市场 · 男频 · A 级（AI 评 83） · 热度 150000 万 · 梗族：科举逆袭梗\n\n- **一句话卖点**：换得虚名文状元的纨绔质子，在敌国围城之际用现代兵法沙盘推演一战封神。\n- **题材**：爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈\n- **共情点**：击中普通人面对强权压制时被边缘化、被当作炮灰的屈辱，渴望在绝境中展现统御全场的实力。\n- **爽 - **创新亮点**：亮点：将极寒末世求生与古代基建完美结合，AIGC精准渲染冰雪神迹与巨狼坐骑的奇幻奇观，双向救赎拉满\n\n## 剧情主线（节选）\n\n主线：顾宛宁是现代顶尖的极地植物学家，意外穿成大楚王朝被贬至北疆冰川的罪臣之女。在这个连年暴雪、滴水成冰的绝境，她被指配给被剥夺一切且冷酷失势的前北境统帅陆九渊。陆九渊性格孤僻冷硬，坚信自己是天煞孤星，对她百般防备，甚至直言不需要累赘。顾宛宁的致命缺陷是极度的情感洁癖与利己主义，起初她只想利用自己的极地大棚系统在雪地里培育暖冬作物，实现物资垄断并伺机逃离北疆。然而，当陆九渊在雪崩中拼死将她护在身下，用残存的体温救活她最后一株麦苗时，她的情感防线彻底崩塌。她利用木系治愈异能催生冰雪灵芝，治好了陆九渊的旧疾，还带领流民在万丈冰川下建立起抗寒蔬菜基地。原本冷酷的陆九渊在她的温暖下逐渐化为忠犬。当朝廷奸臣试图再次迫害他们时，顾宛宁已带领北境军民在冻土之上建立起钢铁要塞，而陆九渊则在她的雄厚后勤支持下，一步步踏碎阴谋，成为名震天下的雪原战神。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b010-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b010-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 大漠狂沙：我驯服异兽与糙汉将军\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"御兽开荒，荒漠求生，爽剧逆袭，奇幻脑洞\",\n \"heat_w\": 129000,\n \"grade\": \"A\",\n \"score\": \"84\",\n \"family\": \"liufang-zhongtian\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2067427118672642048\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 大漠狂沙：我驯服异兽与糙汉将军\n\n> CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：流放种田梗\n\n- **一句话卖点**：一句话：御兽女狂医携兽语系统流放沙海，把残暴土匪头子训成忠犬战神\n- **题材**：御兽开荒，荒漠求生，爽剧逆袭，奇幻脑洞\n- **共情点**：受众：18至35岁女性，向往野性张力与奇幻宠物，满足女性在力量博弈中占据绝对主导权的潜意识欲望\n- **爽点内核**：内核：在荒凉暴烈的狂沙中，以温柔与绝对实力征服狂暴巨兽和桀骜不驯的糙汉，实现身体与心灵的双重驯服\n- **创新亮点**：亮点：狂野糙汉与御兽女王的极致拉扯，大漠沙暴与神话异兽通过AIGC展现极致视觉冲击，荒漠开荒爽感爆棚\n\n## 剧情主线（节选）\n\n主线：苏青野是狂野的动物学专家，携御兽语言系统穿越到寸草不生的大漠流放地，被迫嫁给恶名昭彰的荒漠狼匪首领霍骁。霍骁外表狂放不羁、嗜血冷酷，实则是被朝廷陷害的蒙冤将军，在沙漠中隐忍筹谋。苏青野的致命缺陷是因前世背叛而产生的重度防御心理，她宁可信任野兽也不愿相信人类，甚至在新婚夜用麻药放倒霍骁。但在艰难的荒漠求生中，她发现霍骁虽然粗鲁，却将唯一的干净水源和活命机会都留给了她。当大漠遭遇百年一遇的狂沙暴和变异沙虫袭击时，苏青野不再逃避，她用系统召唤并驯服了沙漠深处的巨型沙雕和沙蟒，将天灾化为农耕便利。在霍骁的配合下，他们将死寂的沙海开辟成了富庶的绿洲通商口岸。霍骁被她的野性与聪慧折服，从一匹孤狼彻底驯化为专属她的忠犬战神，两人最终联手横扫大漠，重建天下秩序。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b011-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b011-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 冰原种田：发配边关养大猫\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"奇幻种田，先婚后爱，领地基建，AIGC\",\n \"heat_w\": 129000,\n \"grade\": \"A\",\n \"score\": \"83\",\n \"family\": \"liufang-zhongtian\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2067064854429958144\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 冰原种田：发配边关养大猫\n\n> CN 市场 · 女频 · A 级（AI 评 83） · 热度 129000 万 · 梗族：流放种田梗\n\n- **一句话卖点**：一句话：农业教授携空间系统流放冰原，契约铁笼里的毁容半兽战神\n- **题材**：奇幻种田，先婚后爱，领地基建，AIGC\n- **共情点**：受众：喜欢逆袭爽感与毛茸茸治愈系的青年女性，击中对于纯粹偏爱与陪伴的渴望\n- **爽点内核**：内核：在最寒冷荒凉的绝地，用最务实的温度，将狂暴的野兽驯化为只属于自己的守护神\n- **创新亮点**：亮点：将种田地图拉到极限冰原，利用AIGC低成本渲染雪景、雪狼、温室奇观，半兽人战神的反差萌极具诱惑力\n\n## 剧情主线（节选）\n\n主线：陆微是现代农业教授，带着土地改良空间穿越到终年积雪的暴风领。这里是没有任何植物能存活的流放死地。开局她被强行许配给守边军士，其他罪女争抢体面的军官，陆微却用一袋冻土换下了被关在铁笼里、人人畏惧的半兽领主夜北。夜北因战伤毁容且半兽化，被视为不祥之物。陆微的致命缺陷是极度理智，把感情当成利益交换。她直白地提出合作，她用空间培育温室大棚解决温饱，夜北提供武力保护。在暴风雪中，他们驯服雪狼，开辟温暖的地下之城。夜北在陆微的饱和式投喂下不仅恢复了绝世美颜，更觉醒了上古圣兽血脉。昔日的冷酷半兽人化身护妻狂魔，一剑扫平窥伺领地的外敌。陆微也终于打破冷酷心防（深层需求：学会信任和接纳不完美的爱），与她的战神并肩于冰原之巅。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b012-cn.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b012-cn\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 拆盲盒后，我把渣男净身出户了\",\
