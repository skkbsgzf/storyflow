d": "# 《拍魂》小纲源稿 · 第 1-3 集\n\n> **件型**：S4 小纲批注载体源稿（客户在其上批注修改）。派生自《选题方案.md》第五节 B 拍三件套分拍初稿与《故事框架案.md》暗埋表，不另起炉灶。\n> **拍号**：B0001-B0030 全局连续，供批注逐拍锚定。每集 10 拍（9-12 内），每拍 6-15 秒，每拍一个认知更新。\n> **纪律**：台词达意即可，不修文采；暗线只在集末卡点释放半句；钩型仅用四型：悬念/反常/危险/承诺。\n\n## 第一集《选拔黑幕》\n\n场景：①星轨训练馆球台区（含观察窗，内/夜）②俱乐部公示栏走廊（内/日）③宿舍楼道（内/夜）\n★切片梗点：B0001 被「安排」的比分特写 + B0004 陪练当众受辱\n\n**B0001｜反常｜8秒**\n\n【0-3秒】（第1场·训练馆球台区·内/夜）△大特写：计分牌「10:8」，挡板后一只穿深色立领袖口的手把它翻成「8:10」。\n分镜：△镜头从翻牌的手拉开——沈让（24，主力陪练，过时款灰训练服、左手指缝挂胶皮布条）隔着挡板缝看完全程，怀里捡球筐的铁丝被捏出一声轻响。\n台词：魏峥（画外·懒洋洋）：\"比分是给人看的，不是给人信的。\"\n表演：沈让瞳孔一缩，不吼不喊，喉结动了一下；翻牌的手连停顿都没有。\n尾钩→ 比分被改了，全馆没一个人吭声——包括他。\n备注：前3秒·全剧门面；道具：计分牌；暗埋·中2「同一支笔」伏笔①（第46-47集揭晓）。\n\n**B0002｜悬念｜9秒**\n\n【0-3秒】（第1场·球台区）△球台边顾曜（21，定制亮色队服、发胶亮额）11:9 险胜陪练，反手把拍摔在台面上。\n分镜：△球拍弹地两下；顾曜第一反应不是看球，是扭头偷看观察窗玻璃后监控屏室的方向。\n台词：顾曜（烦躁）：\"陪练都赢这么费劲？\"\n表演：摔拍是摔给玻璃后面那个人看的——摔完立刻收敛表情，练笑、比心。\n尾钩→ 他怕的不是输球，是屏幕后那个人。\n备注：小刺激1；暗埋·中1「太子白手套」伏笔①（第38集揭晓）。\n\n**B0003｜危险｜10秒**\n\n【0-3秒】（第1场·观察窗内监控屏室）△魏峥（45，深色立领外套、保温杯）盯着手机不抬头。\n分镜：△洪川（52，灰白寸头、秒表挂脖、口哨不离嘴）推门进监控屏室，站姿从进门那一刻就开始弯腰。\n台词：魏峥：\"宣传视频，第三球剪掉——他第三板晃了，难看。\"\n台词：洪川（弯腰）：\"练都练了，剪吧。\"\n表演：洪川的口哨吹到一半，停了半拍才接上；魏峥从头到尾没看一眼球台。\n尾钩→ 沈让拼出来的那三分，进了碎纸机。\n备注：小刺激2·功劳被抹；道具：宣传素材（第10集预告片挪用、第18集大卡点对照回收的证据基础）。\n\n**B0004｜反常｜9秒**\n\n【0-3秒】（第1场·球台区）△洪川回到球台区，一记短哨，全队集合。\n分镜：△队员围拢；唐果（19，微胖、队服拉链开一半、嚼能量胶）站在最外圈。\n台词：洪川：\"明天队内考核，沈让给顾曜当发球机——让大家看看，什么叫陪练的本分。\"\n台词：唐果（压着嗓子）：\"又是让哥……\"\n表演：哄笑从队伍后排滚到前排；唐果低头。\n尾钩→ 「发球机」三个字比输球更疼——因为没人觉得这有什么问题。\n备注：小刺激3·当众受辱；★切片梗点（受辱拍）。\n\n**B0005｜悬念｜10秒**\n\n【0-3秒】（第1场·球台区）△沈让蹲下捡球，一颗一颗，不快不慢。\n分镜：△特写：拇指沿拍沿抹两下（小动作首秀）；慢镜闪回：刚才 10:8 那局的第三球——发球出手、落点压台角，顾曜重心早被骗反。\n台词：沈让（平静，像在说天气）：\"比分不说谎。\"\n表演：低头捡球时说的，没看任何人；说完把球筐放回原位，摆正。\n尾钩→ 他不辩——他记账。\n备注：口癖「比分不说谎」变奏1/3（第18集当众清算回收）；字幕翻译：外行看是运气球｜内行看是压线短球，接的人从出手就死了。\n\n**B0006｜反常｜10秒**\n\n【0-3秒】（第2场·公示栏走廊·内/日）△次日，公示栏前红绸揭开：大赛正赛名单装裱上墙，顾曜的名字烫金排头。\n分镜：△工作人员盖章，一下，收印，前后不到一秒；沈让的名字在最末行「陪练编组」，字号小一号。\n台词：工作人员（公事公办）：\"名单以公示为准，有异议走流程。\"\n台词：唐果（小声）：\"流程？名单早印好了，章是后盖的。\"\n表演：围观队员没人提异议；唐果说完自己先缩脖子。\n尾钩→ 公示是通知，不是商量。\n备注：道具：名单+公章（公示栏=权力交接母题位首秀，第6集红笔划名、第60集红笔写名同机位回收）。\n\n**B0007｜危险｜9秒**\n\n【0-3秒】（第2场·走廊）△一队人扛着应援灯牌路过，灯牌上「曜」字灯一闪一闪。\n分镜：△洪川在公示栏前按住沈让的肩，压低身量；灯牌队伍与两人擦肩，光从沈让脸上扫过又暗下去。\n台词：洪川：\"名单看完了？看完去加练——明天顾曜的手感，还得你喂。\"\n表演：沈让点头应下，指缝里的胶皮布条缠了缠；不卑，也不亢。\n尾钩→ 被拿走的不止位置——连「下一场」都是替别人打的。\n备注：道具：应援灯牌（第18集灯牌成片熄灭回收的首次亮相）。\n\n**B0008｜承诺｜8秒**\n\n【0-3秒】（第3场·宿舍楼道·内/夜）△声控灯亮起，沈让划开手机。\n分镜：△官方集锦推送：十一个精彩球，没有一球标他的名字；他退出推送，点开自己云盘里的原始素材——每一球都有。\n表演：他一球一球看得很慢，看到第三球，停住，倒回去，又看了一遍。\n台词：—（无台词）\n尾钩→ 官方剪掉的，他自己全留着。\n备注：道具：云盘原始素材（留底习惯首秀；第10集挪用对照、第18集大卡点的证据底牌）。\n\n**B0009｜反常｜9秒**\n\n【0-3秒】（第3场·楼道拐角）△立着一个人：高马尾、右膝护具、拎旧运动包——姜屿（27，三年前被「评估退队」的前主力）。\n分镜：△她的视线越过沈让，落在手机屏幕的球上；沈让抬头，工牌在她胸前翻了个面，看不清名字。\n表演：她盯着屏幕里的第三球，右手指腹隔着护腕，按了一下。\n台词：—（无台词）\n尾钩→ 这个楼道里，唯一看懂了那颗球的人。\n备注：道具：护腕内 07 号布（本集不亮出，第3集拍回公示栏）；发现者进场前置拍。\n\n**B0010｜悬念｜8秒**\n\n【0-3秒】（第3场·楼道）△姜屿走近两步，在离他一米处停住。\n分镜：△声控灯灭了两秒，她跺一下脚，灯又亮；两人隔一米对视。\n台词：姜屿：\"你的球，第三板是谁教你的？\"\n表演：沈让捏着手机的手指收紧；她问完就走，背影没给他回答的时间。\n尾钩→ 她怎么看出第三板有问题——「第三板」背后藏着什么？（黑场）\n备注：集末卡点·信息型；暗线半句释放（本集主认知更新唯一：发现者进场提问）。\n\n## 第二集《不配上桌》\n\n场景：①星轨训练馆球台区（内/日）②器材室（内/夜）\n★切片梗点：B0013「不配上桌/当桌子」球桌双关羞辱\n\n**B0011｜危险｜8秒**\n\n【0-3秒】（第1场·球台区·内/日）△考核日，洪川秒表一按，全馆立正。\n分镜：△球台对面：预备队主力热身，两板爆冲打得挡板砰砰响；沈让慢悠悠缠好指缝布条上场。\n台词：洪川：\"考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\"\n表演：「不配上桌」四个字落地，有几声嗤笑；沈让表情没变，只看了眼球桌。\n尾钩→ 考核的不是球——是让他在自己谋生的桌上输掉资格。\n备注：集题句眼；单元模板「一张球台的清算」首次开演。\n\n**B0012｜反常｜10秒**\n\n【0-3秒】（第1场·球台区）△主力开局两板爆冲，球带着风声砸向边角。\n分镜：△沈让退台放高球，全部接回——球一次次从他拍面弹起，弧线一板比一板低；主力越扣越急，汗先掉。\n表演：沈让步伐不乱，眼神只盯球，不看人。\n台词：—（无台词）\n尾钩→ 全场发现：退了十板的人，一个球都没丢。\n备注：小刺激1·防守慢镜；字幕翻译：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。\n\n**B0013｜危险｜8秒**\n\n【0-3秒】（第1场·球台区）△主力一板扣飞，气得踹挡板。\n分镜：△主力指着沈让，又指指球桌；围观队员起哄。\n台词：主力（嗤笑）：\"陪练就是陪练——你天天上桌，是给别人当桌子。\"\n表演：哄笑声里，唐果攥着能量胶没嚼；沈让垂眼看了看自己站的位置。\n尾钩→ 羞辱到位了——按规矩，他该输了。\n备注：★切片梗点·双关羞辱；职场映射（干活的坐不上桌）。\n\n**B0014｜反常｜10秒**\n\n【0-3秒】（第1场·球台区）△沈让发球轮，他捏球的手停了半秒。\n分镜：△特写：胶皮摩擦角度，三个发球三种旋转；主力连吃三分，第三板直接把球接飞出台；全馆倒吸冷气。\n表演：沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n台词：—（无台词）\n尾钩→ 说好的「输得像一点」——他连赢三分。\n备注：小刺激3·回击（羞辱→回击 ≤2 拍闭环）；字幕翻译：外行看是三个幸运球｜内行看是三种旋转，接发从出手就错。\n\n**B0015｜悬念｜10秒**\n\n【0-3秒】（第1场·球台区）△急哨。洪川冲进场，第一件事是背对观众席挡住记分牌。\n分镜：△特写：沈让的手指在拍柄上收紧，指节泛白；洪川压低声，眼神在他脸上停了一瞬又移开。\n台词：洪川（压声）：\"沈让，收着点。你的任务是——输得像一点。\"\n表演：洪川说完这句，口哨在嘴边转了半圈没吹响；沈让盯着他看了两秒，缓缓松开拍柄。\n尾钩→ 教练要他输——输，也要输得「像」。像什么？\n备注：暗埋双落点：捏拍柄=大反转伏笔①（第48集让球×退队揭底）；洪川眼神矛盾=中3「洪川倒戈」伏笔①（第48集倒戈）。\n\n**B0016｜反常｜9秒**\n\n【0-3秒】（第1场·球台区）△沈让把球拍轻轻放在球台上，后退一步，当众鞠躬。\n分镜：△鞠躬角度标准得像教学视频；镜头扫过门口——姜屿抱着恢复性训练的球桶站着，全场哄笑，只有她没笑，盯着他刚才捏拍柄的那只手。\n台词：沈让（平静）：\"我瞎打的，蒙的。\"\n表演：「瞎打」两个字咬得很轻；姜屿右手指腹隔着护腕按了一下。\n尾钩→ 所有人都在笑，只有一个人在记。\n备注：藏锋拍（「我瞎打的」=第3集集末「再瞎打一次」钩子的源头）；姜屿目击（发现者线续）。\n\n**B0017｜承诺｜8秒**\n\n【0-3秒】（第1场·球台区）△散场，主力被教练组围住夸「状态回来了」。\n分镜：△唐果溜到沈让身边，塞给他一支能量胶；沈让收器材，把公用球一颗颗擦净归位。\n台词：唐果（小声）：\"让哥，稳住，能赢。\"\n台词：沈让（笑了一下，把能量胶别回唐果胸前口袋）：\"你先稳住。\"\n表演：沈让全剧第一次近似笑的表情，转瞬收住。\n尾钩→ 全队只有一个人信他能赢——而他自己不信「赢」这条路走得通。\n备注：队伍功能件（唐果）就位；唐果口癖「稳住，能赢」首秀（第60集写上新名单回收）。\n\n**B0018｜悬念｜9秒**\n\n【0-3秒】（第2场·器材室·内/夜）△一盏灯，沈让独自缠胶皮，手稳得像做手术。\n分镜：△特写：压胶、划边、滚平，一气呵成；门口地板上多了一道影子，停了三秒，没进来，走了——影子的高马尾轮廓。\n表演：沈让没抬头，手上动作停了一拍，又继续。\n台词：—（无台词）\n尾钩→ 她在看什么——看得懂的人，已经出现第二个了。\n备注：道具：缠胶皮手法（第4集姜屿「看破缠胶皮」发现者实锤的铺垫；写法待专业素材件核实）。\n\n**B0019｜危险｜9秒**\n\n【0-3秒】（第2场·器材室）△手机在器材桌上亮起，队内群弹窗。\n分镜：△群通知：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。\n台词：魏峥（群内）：\"流量周正好，输球也要输出节目效果。\"\n表演：群消息底下，队员排队回「收到」，只有唐果的「收到」隔了很久。\n尾钩→ 他刚在考核台上证明了自己——换来的是更精确的安排。\n备注：对抗力量学习适应首拍（赢了→被安排得更精确）；「保温杯头像」=魏峥从不进场只在线上的视觉化。\n\n**B0020｜承诺｜9秒**\n\n【0-3秒】（第2场·器材室）△沈让关掉手机屏，器材室只剩一盏灯和他的影子。\n分镜：△他把缠好的球拍立在手心，拇指沿拍沿抹两下；镜头推近他的眼睛，灯芯在瞳孔里一点。\n台词：沈让（低声，像对自己）：\"比分不说谎。节目说了不算。\"\n表演：说完，灯灭，黑场只留球拍立着的一道剪影。\n尾钩→ 明天当顾曜的「专属陪练」——他要让「节目效果」这三个字，变成谁的噩梦？\n备注：集末卡点·情绪型；口癖「比分不说谎」变奏2/3（第18集当众清算回收）。\n\n## 第三集《归来的人》\n\n场景：①俱乐部荣誉室（内/日）②公示栏走廊（内/日）③星轨训练馆球台区（内/日）\n★切片梗点：B0021 蒙尘奖杯回归仪式\n\n**B0021｜反常｜9秒**\n\n【0-3秒】（第1场·荣誉室·内/日）△柜顶一座蒙尘奖杯，姜屿踩着凳子把它取下来。\n分镜：△袖口擦过杯身，灰尘底下露出刻字「07」；特写：她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。\n表演：擦奖杯的动作很慢，很匀，像给什么东西还礼。\n台词：—（无台词）\n尾钩→ 三年前被「评估」掉的人，回来了。\n备注：★切片梗点·蒙尘奖杯回归仪式；道具：07号布+蒙尘奖杯（第15集赛场、第51-52集静场、第60集缝回号码服的长线道具）。\n\n**B0022｜反常｜8秒**\n\n【0-3秒】（第1场·荣誉室）△姜屿把奖杯放回正中，退后一步看了看。\n分镜：△她的余光扫过荣誉墙——旧合影里她的位置被人用相框盖住了；她收回目光，拎包出门。\n表演：没有停顿，没有表情，只在跨出门槛时，把右膝护具紧了紧。\n台词：—（无台词）\n尾钩→ 她不是回来叙旧的。\n备注：道具：被相框盖住的合影（位置被抹除的空间证据，与第1集「剪球」同构；谁盖的不解释，留白给暗线）。\n\n**B0023｜危险｜10秒**\n\n【0-3秒】（第2场·公示栏走廊·内/日）△队员窃窃私语，声音压着但故意让人听见。\n分镜：△姜屿走过，窃语声跟着她移动；洪川迎面拦下，客气而疏远，秒表在指头上转。\n台词：队员（窃语）：\"三年没打比赛，回来占谁的位？\"\n台词：洪川（客气疏远）：\"姜屿是吧。先去陪练组，恢复性训练。\"\n表演：她只点了一下头：\"好。\"——说完就走，不解释，不争。\n尾钩→ 昔日前主力，如今连「队内」都算不上。\n备注：姜屿台词纪律首秀（说话不超过两句，说完就走）。\n\n**B0024｜承诺｜8秒**\n\n【0-3秒】（第2场·公示栏前）△姜屿站定，从护腕内侧抽出 07 号布。\n分镜：△「啪」——07 号布拍在自己的旧照片旁，抚平四角；走廊瞬间安静，洪川的口哨又停了半拍。\n表演：她一个字没说，转身走了；留下满走廊的人和那块布对峙。\n台词：—（无台词）\n尾钩→ 名字她不讨——她自己钉回来。\n备注：★切片梗点回扣（回归仪式完成）；与 B0006 同场域对位：他不辩，她不讨——双主角策略互补的视觉化。\n\n**B0025｜危险｜9秒**\n\n【0-3秒】（第3场·球台区·内/日）△合练开球，顾曜打完一板，转身对镜头比心。\n分镜：△比心收势，他侧过身压低声音警告对面的沈让；观察窗后隐约有立领外套的轮廓。\n台词：顾曜（压声）：\"老实点，别又抽风。\"\n表演：警告完立刻切回笑容；沈让弯腰捡球，没接话。\n尾钩→ 「专属陪练」第一天，摄像机全开着。\n备注：承接 B0019（因为被指派为专属陪练，所以此刻全程在镜头下）。\n\n**B0026｜反常｜9秒**\n\n【0-3秒】（第3场·球台区）△沈让抛球——喂球环节，本该最没有悬念的一球。\n分镜：△球过网后急坠侧拐，顾曜扑空，球擦着他拍边落地；全场静，只听球在地板上滚了两圈。\n表演：顾曜僵在原地，第一反应又是看向观察窗；沈让已经弯腰去捡下一颗球。\n台词：—（无台词）\n尾钩→ 「喂球」喂出了杀招——所有人都在等解释。\n备注：小刺激1；字幕翻译：外行看是顾曜失误｜内行看这球从出手就拐了两次。\n\n**B0027｜悬念｜9秒**\n\n【0-3秒】（第3场·隔壁球台）△姜屿接球的手停在半空。\n分镜：△她盯着那颗球的落点，右手指腹隔着护腕按住 07；慢慢放下球桶，穿过球台之间的过道走过来。\n台词：姜屿（皱眉·自语）：\"这不是失误。是发球机都拉不出来的转速。\"\n表演：她说给自己听，但每个字都砸在沈让耳朵里。\n尾钩→ 她当众「翻译」了这颗球——外行听是怪球，内行听是底牌。\n备注：小刺激2·发现者线启动（第4集「看破缠胶皮手法」实锤的前置）。\n\n**B0028｜反常｜11秒**\n\n【0-3秒】（第3场·球台区）△姜屿拿起球拍，站上对面球台，抬眼。\n分镜：△两人隔网对拉：不说话，十几拍，越打越快；慢镜：胶皮咬球、球身旋转变形的瞬间；全馆停了——别的台不打了，队员围过来，唐果嚼能量胶的嘴停在半开。\n台词：姜屿：\"来。\"\n表演：两个人眼睛里都没有观众，只有球；最后一拍同时收力，球停在网带上，滚都没滚。\n尾钩→ 全馆安静了三秒——这三年，馆里没有过这种球。\n备注：小刺激3·全剧第一次实力外露（单点亮出即收，不掉马）；关系轴「发现者×被证明者」首次同台。\n\n**B0029｜危险｜8秒**\n\n【0-3秒】（第3场·观察窗内监控屏室）△魏峥放下保温杯，杯底磕在台面上。\n分镜：△他盯着场中那两个身影，对身侧的人偏了偏头；玻璃反光里，顾曜涨红的脸退到画面边缘。\n台词：魏峥：\"查一下，谁把这两个人排进一张课表的。\"\n表演：他的语气不怒，像在核对库存——这才是最冷的地方。\n尾钩→ 球台上的事，要被拿到球台外去处理了。\n备注：危险升格引信（第4-6集压力链起点，直通第6集红笔划名单唯一主钩）。\n\n**B0030｜承诺｜9秒**\n\n【0-3秒】（第3场·球台区）△训练结束的哨声里，姜屿隔着球网伸出手。\n分镜：△沈让把拍递过去；特写：她的指腹抚过胶皮边缘——那是全世界只有她被允许碰的拍。\n台词：姜屿：\"把你的拍给我。……明天，当着我的面，再「瞎打」一次。\"\n台词：沈让（擦着拍沿·低声）：\"比分不说谎。明天它替我说。\"\n表演：她把拍还回去时按了一下他的手背，只一秒；两人谁都没笑。\n尾钩→ 明天，全馆都会看着——「瞎打」这个词，撑得到明天吗？（黑场）\n备注：集末卡点·情绪型；口癖「比分不说谎」变奏3/3；道具：拍（关系道具「他的拍只许她一人碰」首次行使）。\n\n## 创作思路页\n\n### 三集总功能（为什么是这三集、为什么这样排）\n\n第 1-3 集是第 1 章（1-6 集）的前半段，三集连续构成一个完整微循环：**受辱（第1集：黑幕可见）→ 藏（第2集：赢了也不算）→ 被看见（第3集：发现者进场）**。第 6 集红笔划名单主钩的全部前置蓄力在这三集完成——观众必须先相信「比分不作数」这个世界规则，第 6 集划掉名字时才会真的替他急。每集只给观众一个主认知更新：\n\n- 第 1 集：**比分是可以被翻的**——这个世界里比分不作数，位置不由球决定。\n- 第 2 集：**他不辩，他记账**——主角的策略是藏锋加留底，他在等一个能当众说话的地方。\n- 第 3 集：**看得懂的人出现了**——发现者×被证明者接通，两个人可以互相证明。\n\n口癖「比分不说谎」三变奏是递进不是复读：B0005 说给自己（记账）→ B0020 说给体系（节目说了不算）→ B0030 说给证人（明天它替我说）——第 18 集当众清算首发是第四次变奏（说给全世界），三集只铺不爆。\n\n### 第一集《选拔黑幕》逐段为什么\n\n- **B0001 为什么放在第一拍**：全剧门面 3 秒必须让「黑幕」可见可恨——翻比分这个动作零解释、当众、无人吭声，情绪三层（流量实力倒挂/选拔不透明/功劳记账）的第一层直接踩下，不解释任何设定。**埋了什么**：画外音「比分是给人看的」同时是中 2「同一支笔」伏笔①——此刻观众只当它是狂言，第 46-47 集揭晓同一支笔时回看才对味（暗线只在卡点半句释放的纪律）。\n- **B0002 为什么紧跟**：反派梯度第一层（顾曜）立反差——最亮的位置最空的手。摔拍后偷看观察窗是中 1「太子白手套」伏笔①：观众此刻只觉得他怂，第 38 集发现他也是筹码时重算。\n- **B0003-B0004 为什么**：功劳记账的第一颗种子（魏峥一句话剪掉第三球）+ 第一集情绪谷底（「发球机」当众受辱）。「发球机」是职场映射第一层——干活的人不配署名，不懂球的观众也疼。\n- **B0005 为什么**：受辱后必须立刻给主角态度，否则观众只剩憋屈——不辩、记账。「比分不说谎」首次出场，定下全剧清算的台词母题。\n- **B0006-B0007 为什么**：公示栏=权力交接仪式位首次亮相（第 6 集红笔划名、第 60 集红笔写名首尾同机位的母题铺垫）；应援灯牌首次亮相（第 18 集灯牌成片熄灭回收）。「章是后盖的」一句把「公示是通知不是商量」钉死。\n- **B0008 为什么**：留底习惯是主角的金手指雏形——他赢不了当下，就先赢证据。观众从这里拿到第 18 集大卡点的第一份期待。\n- **B0009-B0010 为什么收在这**：集末卡点必须从明线切到关系轴——姜屿进场只给一个按护腕的动作加一个问题，不给答案。「第三板是谁教你的」既是她的入场券，也是全剧关系轴的第一颗铆钉；信息型卡点负责把观众带进第 2 集。\n\n### 第二集《不配上桌》逐段为什么\n\n- **为什么整集是单元模板第一演武**：「一张球台的清算」模板（受辱→≤2 拍回击→记账）先用最小单位跑一遍，但关键变奏是——回击被急哨掐断（B0015）。观众第一次尝到「赢了也不算」的体系压制，为第 8 集回放装置（当场翻案闭环、首付费卡点）制造刚需：没有回放，赢球随时可以不作数。\n- **B0015 为什么是全集中场**：暗埋双落点拍。捏拍柄特写=大反转伏笔①（他为什么对「输得像一点」反应这么大——第 48 集让球×退队揭底）；洪川眼神矛盾=中 3 倒戈伏笔①（第 48 集倒戈）。两处都只给特写不给解释。\n- **B0016 为什么**：「我瞎打的」是藏锋，也是给第 3 集集末「再瞎打一次」的钩子源头——姜屿的要求等于逼他从藏走向露，主角策略的第一次被撬动。\n- **B0017-B0018 为什么**：唐果功能件就位（队伍线只留他一人，容量裁决）；器材室影子拍让姜屿的「看」延续一条暗动作线，为第 4 集看破缠胶皮手法（发现者实锤）铺最后一级台阶。\n- **B0019-B0020 为什么收在这**：证明了自己反而换来「专属陪练」——对抗力量会学习适应，这是递进复杂化第一次显形。卡点台词「节目说了不算」把本集主认知更新（记账）推到「对体系宣战」，情绪型卡点负责愤怒，不是悬念。\n\n### 第三集《归来的人》逐段为什么\n\n- **为什么整集给姜屿**：强者回归轴的载体必须先立「被偷走的东西」（蒙尘奖杯、被相框盖住的合影、陪练组安排），再立「自己拿回来」（07 拍回公示栏）。她的清算性质是物归原主，与沈让的清算（打回位置）构成双主角互补，两条清算线在第 18 集汇成同一个当众清算。\n- **B0021-B0022 为什么**：蒙尘奖杯+被盖合影是「功劳被抹」的空间版，与第 1 集剪球同构但一句台词不说——她的戏全在动作里。07 号布进护腕是长线道具就位（第 15 集赛场首现、第 51-52 集静场、第 60 集缝回号码服）。\n- **B0023-B0024 为什么**：先压到底（连「队内」都算不上）再弹起（07 拍回公示栏），一压一弹在同一走廊完成——与 B0006「章是后盖的」同场域对位：他不辩、她不讨，两人策略互补的视觉化，观众第一次意识到这是两个同类。\n- **B0026-B0028 为什么**：喂球杀招→她当众翻译→隔网对拉，三拍完成发现者×被证明者的接通。对拉是全剧第一次实力外露，按掉马纪律单点亮出即收（不做层层撕），全馆安静三秒是本集情绪峰值，也是第 42 集深夜对拉无言的远呼应。\n- **B0029 为什么**：魏峥「查一下」把球台上的事拿到球台外处理——危险升格的引信，直通第 6 集划名单主钩（沈让「藏到退役」的策略将从这里开始被打断）。\n- **B0030 为什么收在这**：卡点收在关系道具「拍」上（他的拍只许她一人碰）——关系轴不落恋爱标签、全部道具化的第一次执行。「明天它替我说」= 公开化的承诺，观众带着「瞎打这个词撑得到明天吗」进第 4 集。\n\n### 伏笔回收对照表（本三集埋、后文收）\n\n| 拍 | 埋了什么 | 在哪回收 |\n| --- | --- | --- |\n| B0001 | 「比分是给人看的」（同一支笔伏笔①） | 第 46-47 集揭晓、第 48 集引爆 |\n| B0002 | 顾曜摔拍偷看观察窗（白手套伏笔①） | 第 38 集白手套觉醒 |\n| B0003 | 宣传素材「剪球」 | 第 10 集预告片挪用、第 18 集原始留底对照 |\n| B0006/B0024 | 公示栏母题（盖章/钉 07） | 第 6 集红笔划名、第 60 集红笔写名同机位 |\n| B0007 | 应援灯牌 | 第 18 集灯牌成片熄灭 |\n| B0008 | 云盘原始留底 | 第 18 集大卡点证据底牌 |\n| B0015 | 捏拍柄（大反转①）/洪川眼神矛盾（倒戈①） | 第 48 集双引爆 |\n| B0016 | 「我瞎打的」 | B0030「再瞎打一次」→ 第 8 集回放翻案线 |\n| B0017 | 「稳住，能赢」 | 第 60 集写上新名单的祝语 |\n| B0018 | 缠胶皮手法 | 第 4 集姜屿看破（发现者实锤；写法待专业素材件核实） |\n| B0021/B0024 | 07 号布、蒙尘奖杯 | 第 15 集赛场、第 51-52 静场、第 60 集缝回号码服 |\n| B0029 | 魏峥「查一下」 | 第 6 集划名单主钩 |\n| B0030 | 「拍」的关系道具 | 第 30 集后递拍吃味拍、第 42 集对拉无言 |\n\n### 纪律自查\n\n- 每集 10 拍（9-12 内）、每拍 6-15 秒、每拍一个认知更新；拍号 B0001-B0030 连续，可逐拍批注。\n- 每集场景 ≤3（第1集3场/第2集2场/第3集3场）；前三章专名仅「星轨」「启明」；有名有姓 6 人全部就位。\n- 每拍钩型仅用悬念/反常/危险/承诺四型；第一集首拍 B0001=反常。\n- 每集 ≥1 ★切片梗点 + ≥3 小刺激；「比分不说谎」每集 1 变奏；暗线只在集末卡点释放半句。\n- 全文无任何真实运动员、协会、赛事、赞助商、场馆名；无口号式台词；技战术描写以可核验常识为限且逐处配翻译。\n\n*产物完。2026-09-16 · 小纲师（scene-screenwriter 剖面 · scene-breakdown 技能）。派生自《选题方案.md》第五节 B 拍分拍初稿，与《故事框架案.md》暗埋表逐处对齐。*\n"}}], "first3": [{"round": 1, "ts": "2026-09-16T00:13:43.732Z", "note": "submit r1", "content": {"对外交付/04-成品剧本试稿.md": "# 《拍魂》成品剧本试稿 · 第 1-3 集\n\n> **件型**：对外交付 · S4 成品剧本试稿。基于《小纲-第1-3集.md》逐拍扩写，情节、伏笔与集末卡点未走样。\n> **格式**：成品通读版——场次头＋人物行动/表情连贯段落＋角色台词；特殊镜头与字幕备注一律中括号；正文无拍号/时长/钩型等内部标注（节奏纪律内化执行，质检附注见文末，不随成品外发）。\n> **口径**：台词与人物口径对齐《选题方案.md》（沈让×姜屿、魏峥、计分板清算、开篇计分牌 10:8→8:10）；暗线口径对齐《故事框架案.md》。\n> **流程位**：台词已按人物语言卡写至「像他说的」，待交接 dialogue-polish（去AI味）末环节复核后进 R4。\n> **合规自查**：无真实运动员/协会/赛事/赞助商/场馆名；无口号式台词；技战术描写以可核验常识为限，逐处配字幕反差翻译。\n\n---\n\n## 第1集 《选拔黑幕》\n\n场景：星轨训练馆·球台区 · 夜 · 内\n\n[特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。]\n\n镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。捡球筐被捏出一声轻响。他瞳孔一缩，喉结动了动。\n\n魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。\n\n球照常发，人照常打，没人回头看计分牌——包括沈让。\n\n球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。\n\n顾曜（烦躁）：十一比九。跟个陪练。\n\n[特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。]\n\n洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。\n\n魏峥（眼睛不离手机）：宣传片，第三球剪掉——他第三板晃了，难看。\n\n洪川（弯腰）：练都练了。剪吧。\n\n魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。\n\n洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。\n\n洪川：明天队内考核。沈让给顾曜当发球机——也让大伙看看，什么叫陪练的本分。\n\n哄笑从队伍后排滚到前排。\n\n唐果（压着嗓子）：又是让哥……\n\n沈让蹲下捡球，一颗，一颗，不快不慢。\n\n[特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。]\n\n[字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。]\n\n沈让（低着头，平静得像在说天气）：比分不说谎。\n\n说完，球筐放回原位，摆正。\n\n[转场：红绸揭开。]\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。沈让的名字吊在末行「陪练编组」，字号小一号。\n\n工作人员（公事公办）：名单以公示为准。有异议，走流程。\n\n唐果（小声）：流程？名单早印好了，章是后盖的。\n\n没人提异议。唐果说完先缩了脖子。\n\n一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。\n\n洪川：名单看完了？看完了去加练——明天顾曜的手感，还得你一板一板喂。\n\n沈让点头应下，指缝的布条缠了缠。不卑，也不亢。\n\n场景：宿舍楼道 · 夜 · 内\n\n声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。\n\n楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。\n\n声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。\n\n姜屿：你的球，第三板是谁教你的？\n\n沈让捏手机的手指收紧。她问完就走，没给他回答的时间。\n\n[特殊镜头：黑场。]\n\n## 第2集 《不配上桌》\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。沈让缠好指缝布条，慢悠悠上场。\n\n洪川：考核内容——陪练沈让，对预备队主力。输的那个，今天不配上桌，器材自己收。\n\n「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。\n\n主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。\n\n[特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。]\n\n[字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。]\n\n沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。\n\n主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。\n\n哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。\n\n轮到沈让发球。他捏球的手，停了半秒。\n\n[特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。]\n\n沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n\n急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。\n\n[特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。]\n\n洪川（压低声）：沈让。收着点。你的任务是——输得像一点。\n\n说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。沈让盯着他看了两秒，缓缓松开拍柄。\n\n沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。\n\n沈让（平静）：我瞎打的。蒙的。\n\n「瞎打」两个字，他咬得很轻。全场哄笑。镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。\n\n散场。主力被教练组围住，夸「状态回来了」。唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。\n\n唐果（小声）：让哥，稳住，能赢。\n\n沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋。\n\n沈让：你先稳住。\n\n[转场：夜。一盏灯。]\n\n场景：器材室 · 夜 · 内\n\n一盏灯。沈让独自缠胶皮，手稳得像做手术。\n\n[特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。]\n\n沈让没抬头。手上的动作停了一拍，又继续。\n\n器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。\n\n魏峥（群内）：流量周正好。输球也要输出节目效果。\n\n群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。\n\n沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。\n\n[特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。]\n\n沈让（低声，像对自己）：比分不说谎。节目说了不算。\n\n灯灭。黑场里只剩球拍立着的一道剪影。\n\n## 第3集 《归来的人》\n\n场景：俱乐部荣誉室 · 日 · 内\n\n柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。\n\n[特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。]\n\n她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。\n\n队员（窃语）：三年没打比赛，回来占谁的位？\n\n洪川迎面拦下，客气而疏远，秒表在指头上转。\n\n洪川：姜屿是吧。先去陪练组，恢复性训练。\n\n姜屿（只点了一下头）：好。\n\n说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。\n\n[特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。]\n\n她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。\n\n[转场：合练哨声。]\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。\n\n顾曜（压声）：老实点，别又抽风。\n\n警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。\n\n沈让抛球——喂球环节，本该最没有悬念的一球。\n\n[特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。]\n\n[字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。]\n\n顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。\n\n隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。\n\n姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。\n\n她说给自己听，可每个字都砸在沈让耳朵里。\n\n姜屿拿起球拍，站上对面球台，抬眼。\n\n姜屿：来。\n\n[特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。]\n\n两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。\n\n观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。玻璃反光里，顾曜涨红的脸退到画面边缘。\n\n魏峥：查一下，谁把这两个人排进一张课表的。\n\n他的语气不怒，像在核对库存——这才是最冷的地方。\n\n训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。\n\n[特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。]\n\n姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。\n\n沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。\n\n她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。\n\n[特殊镜头：黑场。]\n\n---\n\n## 附一：卡点体检（内部质检附注，不随成品外发）\n\n**时长结构**（对齐小纲拍数与秒数标注）：\n\n| 集 | 拍数/总时长 | 场次分布（场景 ≤3） | 末卡点对应小纲拍 |\n| --- | --- | --- | --- |\n| 第1集 | 10 拍 / 90 秒 | 球台区 46s·5拍 → 公示栏走廊 19s·2拍 → 宿舍楼道 25s·3拍 | B0010 |\n| 第2集 | 10 拍 / 90 秒 | 球台区 63s·7拍 → 器材室 27s·3拍 | B0020 |\n| 第3集 | 10 拍 / 90 秒 | 荣誉室 17s·2拍 → 公示栏走廊 18s·2拍 → 球台区 55s·6拍 | B0030 |\n\n**集末卡点逐体检**：\n\n| 集 | 卡点落点 | 型 | 体检结论 |\n| --- | --- | --- | --- |\n| 1 | 姜屿「你的球，第三板是谁教你的？」问完即走，黑场 | 信息型 | 信息增量唯一：发现者进场＋「第三板」悬问；暗线半句释放纪律达成（护腕只按不亮）；黑场落在问题悬空处，非情绪低谷；直接给第2集考核日续力。过 |\n| 2 | 「比分不说谎。节目说了不算。」灯灭，只剩球拍剪影 | 情绪型 | 情绪目标=宣战/愤怒，不靠新悬念供钩；口癖变奏2落位；与第1集信息型明确区分；钩力指向明日「专属陪练」的课表。过 |\n| 3 | 「明天它替我说」＋她按他手背一秒，谁都没笑，黑场 | 情绪型 | 关系道具「拍」首次行使（只许她一人碰）；公开化承诺=期待＋隐忧双情绪；口癖变奏3落位；「瞎打」悬置进第4集。过 |\n\n**主认知更新唯一性**：第1集「比分是可以被翻的」；第2集「赢了也不算——他不辩，他记账」；第3集「看得懂的人出现了」。三集卡点均落张力峰值非低谷，无与明线抢认知的暗线信息（「同一支笔」「让球前史」在三集内零泄露，仅道具级微光）。\n\n## 附二：切片梗点标注（对位梗卡预布点表）\n\n| 集 | ★切片梗点（成片位置） | 对位梗卡预布点 | 建议切片入点/出点 |\n| --- | --- | --- | --- |\n| 1 | 开场计分牌 10:8→8:10 特写（被「安排」的比分）＋「发球机」当众受辱 | 预布点表第1集「选拔黑幕一瞬＋陪练当众受辱——打脸引擎点火位」 | 入点：翻牌手特写；出点：哄笑滚到前排＋唐果低头。备选：压线短球慢镜＋外行/内行字幕反差 |\n| 2 | 「你天天上桌，是给别人当桌子」双关羞辱 → 三分连发当场回敬（受辱→回击 ≤2 拍） | 预布点表第2集「不配上桌球桌双关（切片位）」＝主梗切片3「双关嫁接位」 | 入点：主力踹挡板；出点：全馆倒吸冷气＋抹拍沿。备选：「我瞎打的」鞠躬 |\n| 3 | 蒙尘奖杯/07 号布回归仪式；07「啪」拍回公示栏；隔网对拉全馆静三秒 | 预布点表第3集「蒙尘奖杯/旧号码——回归仪式梗点（强者回归轴）」 | 入点：袖口擦杯露「07」；出点：球停网带、滚都没滚。备选：07 拍墙「啪」一声＋满走廊安静 |\n\n---\n\n*产物完。2026-09-16 · 编剧（scene-screenwriter 剖面 · script-final 技能）。基于《小纲-第1-3集.md》B0001-B0030 逐拍扩写，与《选题方案.md》《故事框架案.md》口径逐处对齐；未读取 projects/_archive 下任何内容；无 git 操作。*\n"}}], "polish": [{"round": 1, "ts": "2026-09-16T00:24:01.645Z", "note": "submit r1", "content": {"对外交付/03-剧本试稿.md": "# 《拍魂》剧本试稿 · 第 1-3 集（成品稿）\n\n> **件型**：对外交付 · S4 剧本试稿成品稿。基于《04-成品剧本试稿.md》完成 dialogue-polish 末环节逐句打磨：**只动台词与表演提示，情节、卡点、伏笔位零改动**。\n> **保真清单**：口癖三变奏（「比分不说谎」第 1/2/3 集各一变奏）与关键伏笔句（「比分是给人看的，不是给人信的」「输得像一点」「我瞎打的」）原样保留。逐条改动留痕见《台词打磨对照表.md》（内部件，不随本稿外发）。\n> **格式**：成品通读版——场次头＋人物行动/表情连贯段落＋角色台词；特殊镜头、字幕与提示音一律中括号；正文无拍号/时长/钩型等内部标注。\n> **合规自查**：无真实运动员/协会/赛事/赞助商/场馆名；无口号式台词；技战术描写以可核验常识为限，逐处配字幕反差翻译。\n\n---\n\n## 第1集 《选拔黑幕》\n\n场景：星轨训练馆·球台区 · 夜 · 内\n\n[特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。]\n\n镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。捡球筐被捏出一声轻响。他瞳孔一缩，喉结动了动。\n\n魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。\n\n[音效：击球声没有任何变化。]\n\n球照常发，人照常打，没人回头看计分牌——包括沈让。\n\n球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。\n\n顾曜（烦躁，喘着气）：十一比九。……跟个陪练。\n\n[特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。]\n\n洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。\n\n魏峥（眼睛不离手机）：宣传片，第三球剪掉。\n\n洪川没问。\n\n魏峥：他第三板晃了。难看。\n\n洪川（弯腰）：练都练了。剪吧。\n\n魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。\n\n洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。\n\n洪川：明天队内考核。沈让给顾曜当发球机——都学着点，什么叫陪练的本分。\n\n哄笑从队伍后排滚到前排。\n\n唐果（压着嗓子）：又是让哥……\n\n沈让蹲下捡球，一颗，一颗，不快不慢。\n\n[特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。]\n\n[字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。]\n\n沈让（低着头，平静得像在说天气）：比分不说谎。\n\n没人接话。一颗球从筐沿滚下去，撞上另一颗，停了。\n\n球筐放回原位，摆正。\n\n[转场：红绸揭开。]\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。沈让的名字吊在末行「陪练编组」，字号小一号。\n\n工作人员（公事公办）：名单以公示为准。有异议？走流程。\n\n唐果左右看了一眼，声音压得更低。\n\n唐果（小声）：流程？名单早印好了，章是后盖的。\n\n没人提异议。唐果说完先缩了脖子。\n\n一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。\n\n洪川（眼睛还在名单上）：名单看完了？看完了去加练。明天顾曜的手感，还得你一板一板喂。\n\n沈让点头应下，指缝的布条缠了缠。不卑，也不亢。\n\n场景：宿舍楼道 · 夜 · 内\n\n声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。\n\n楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。\n\n声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。\n\n姜屿：你的球，第三板是谁教你的？\n\n沈让捏手机的手指收紧。她问完就走，没给他回答的时间。\n\n[特殊镜头：黑场。]\n\n## 第2集 《不配上桌》\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。沈让缠好指缝布条，慢悠悠上场。\n\n洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\n\n「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。\n\n主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。\n\n[特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。]\n\n[字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。]\n\n沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。\n\n主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。\n\n哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。\n\n轮到沈让发球。他捏球的手，停了半秒。\n\n[特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。]\n\n[音效：人群里一只矿泉水瓶被捏响，又赶紧松开。]\n\n沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n\n急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。\n\n[特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。]\n\n[音效：急哨的余音还在馆顶绕。]\n\n洪川（压低声）：沈让。收着点。你的任务是——输得像一点。\n\n说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。沈让盯着他看了两秒，缓缓松开拍柄。\n\n沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。\n\n沈让（平静）：我瞎打的。蒙的。\n\n「瞎打」两个字，他咬得很轻。全场哄笑。镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。\n\n散场。主力被教练组围住，夸「状态回来了」。唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。\n\n唐果（小声）：让哥，稳住，能赢。\n\n沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋，才开口。\n\n沈让：你先稳住。\n\n[转场：夜。一盏灯。]\n\n场景：器材室 · 夜 · 内\n\n一盏灯。\n\n[音效：刮胶皮的沙沙声，一下一下，很匀。]\n\n沈让独自缠胶皮，手稳得像做手术。\n\n[特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。]\n\n沈让没抬头。手上的动作停了一拍，又继续。\n\n器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。\n\n魏峥（群内）：流量周正好。输球也要输出节目效果。\n\n群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。\n\n沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。\n\n[特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。]\n\n沈让（低声，像对自己）：比分不说谎。节目说了不算。\n\n灯灭。[音效：咔哒一声，之后什么声音都没有。]黑场里只剩球拍立着的一道剪影。\n\n## 第3集 《归来的人》\n\n场景：俱乐部荣誉室 · 日 · 内\n\n柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。\n\n[特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。]\n\n她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。\n\n[音效：柜门合上，很轻。]\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。\n\n队员甲（窃语）：三年没打比赛，回来占谁的位？\n\n队员乙（更低）：嘘——人过来了。\n\n窃语声齐齐掐断。\n\n洪川迎面拦下，客气而疏远，秒表在指头上转，转得比平时快。\n\n洪川：姜屿是吧。先去陪练组，恢复性训练。\n\n姜屿（只点了一下头）：好。\n\n说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。\n\n[特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。]\n\n她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。\n\n[转场：合练哨声。]\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。\n\n顾曜（压声）：老实点，别又抽风。\n\n警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。\n\n沈让抛球——喂球环节，本该最没有悬念的一球。\n\n[特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。]\n\n[字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。]\n\n顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。\n\n隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。\n\n姜屿（盯着球的落点，像自语）：喂球？……发球机都拉不出这种转速。\n\n她说给自己听，可每个字都砸在沈让耳朵里。\n\n姜屿拿起球拍，站上对面球台，抬眼。\n\n姜屿：来。\n\n[特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。]\n\n两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。\n\n[音效：没有球声。空调风声。]\n\n观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。玻璃反光里，顾曜涨红的脸退到画面边缘。\n\n魏峥：查一下。谁把这两个人排进一张课表的。\n\n他的语气不怒，像在核对库存——这才是最冷的地方。\n\n训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。\n\n[特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。]\n\n姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。\n\n沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。\n\n她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。\n\n[特殊镜头：黑场。]\n\n---\n\n*产物完。2026-09-16 · 润色（dialogue-polish 技能）。基于《04-成品剧本试稿.md》逐句三遍打磨（人物声口→处境→去AI味），只动台词与表演提示，情节、卡点、伏笔位零改动；逐条改动留痕见项目根《台词打磨对照表.md》。未读取 projects/_archive 下任何内容；无 git 操作。*\n"}}, {"round": 2, "ts": "2026-09-17 02:31", "note": "", "content": {}}]}, "kits": {"plot": {"domain": "plot", "title": "", "ops": {"episodic-outline": {"title": "episodic-outline", "skill": "episodic-outline", "knowledge": ["kb/aesthetic/pacing-density", "kb/formats/webnovel-fastfood", "kb/structure/episodic-webnovel"], "asserts": [], "minitools": [], "config": {"units": {"type": "number", "default": 3, "min": 0, "desc": "首批细纲的单元数", "effect": "提高 = 一次摊得更开，返工成本更大", "tunable_by": ["user", "optimizer"]}, "hookPerUnit": {"type": "boolean", "default": true, "desc": "每个单元末尾强制钩子", "effect": "关掉 = 单元之间可能泄气", "tunable_by": ["user", "optimizer"]}, "darklineDepth": {"type": "enum", "default": "标准", "enum": ["轻", "标准", "重"], "desc": "暗线铺陈力度", "effect": "提高 = 伏笔更厚，读者短期获得感下降", "tunable_by": ["user", "optimizer"]}, "outlineDensity": {"type": "enum", "default": "标准", "enum": ["粗", "标准", "细"], "desc": "细纲颗粒度", "effect": "提高 = 写作期更省心、大纲期更贵", "tunable_by": ["user", "optimizer"]}}}, "novel-bible": {"title": "novel-bible", "skill": "novel-bible", "knowledge": ["kb/aesthetic/character", "kb/aesthetic/conflict-escalation", "kb/formats/webnovel-longform", "kb/trope/*"], "asserts": [], "minitools": ["kb_search", "check_trope_combo"], "config": {"quests": {"type": "number", "default": 3, "min": 0, "desc": "开书三问的问答轮数", "effect": "提高 = 设定更稳，开书更慢", "tunable_by": ["user", "optimizer"]}, "powerSystem": {"type": "enum", "def   if (!_deliverySet) _deliverySet = new Set((flow.outputs||[]).map(o=>o.node).filter(Boolean).concat(flow.graph.outputs||[]));

}

function persistState(){

window.persistState = persistState;
const handles = {};
async function saveFile(name, content, ext){
  // ① http 服务：POST 直写盘（零弹窗）
  if (location.protocol.startsWith("http")){
    try{
      const rel = DATA.project ? "projects/" + DATA.project + "/" + name : name;
      const r = await fetch("/_kit/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: rel, content})});
      if (r.ok){ const j = await r.json(); return "已写盘：" + j.path; }
    }catch(err){}
  }
  // ② 兜底：File System Access → 下载（file:// 模式）
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

function autoLayout(){
  const stageList = (flow.stages||[]);
  const colOf = {}, colNodes = {};
  let c = 0;
  const push = (n, col)=>{ colOf[n]=col; (colNodes[col]=colNodes[col]||[]).push(n); };
  for (const sg of stageList){
    const work = (sg.nodes||[]).filter(n=>nodes[n] && n!==sg.gate);
    if (!work.length) continue;
    // 阶段内最长路径分层：同一层级的节点共享同一竖线
    const lvl = {}; work.forEach(n=>lvl[n]=0);
    for (let it=0; it<=work.length; it++){
      for (const e of edges){
        if (isBackEdge(e) || lvl[e.from]===undefined || lvl[e.to]===undefined) continue;
        if (lvl[e.to] < lvl[e.from]+1) lvl[e.to] = lvl[e.from]+1;
      }
    }
    const byLevel = {};
    work.forEach(n=>{ (byLevel[lvl[n]] = byLevel[lvl[n]]||[]).push(n); });
    const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
    const base = c;
    levels.forEach((L,i)=>{ byLevel[L].sort().forEach(n=>push(n, base+i)); });
    c = base + levels.length;
    if (sg.gate && nodes[sg.gate]) push(sg.gate, c++);
    stageBand[sg.id] = {from: base, to: c-1};
  }
  Object.keys(nodes).forEach(n=>{ if (colOf[n]===undefined) push(n, c); });
  // 阶段虚线 = 本阶段产物列的中心线：产物骑在虚线上，左侧是本阶段工序，右侧是验收门
  stageLineX = {};
  for (const sg of stageList){
    const prod = (sg.nodes||[]).find(n=>nodes[n] && n!==sg.gate && isDeliveryNode(n));
    const col = prod ? colOf[prod] : (stageBand[sg.id]||{}).from;
    if (col !== undefined) stageLineX[sg.id] = MG + col*(NW+GX) + NW/2;
  }
  // 每列节点围绕中线纵向堆叠；多节点列 = 并行组（同一就绪批）
  parCols = new Set(Object.keys(colNodes).map(Number).filter(c=>colNodes[c].length>1));
  let maxRows = 1; Object.values(colNodes).forEach(a=>maxRows=Math.max(maxRows,a.length));
  const midY = MG + (maxRows*(NH+GY)-GY)/2;
  for (const [col, arr] of Object.entries(colNodes)){
    const colH = arr.length*(NH+GY)-GY;
    const y0 = Math.round(midY - colH/2);
    arr.forEach((n,k)=>{ pos[n] = [MG + col*(NW+GX), y0 + k*(NH+GY)]; });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在阶段；无选中则取第一个未完成阶段 */
function currentStageId(){
  if (sel && nodes[sel] && nodes[sel].stage) return nodes[sel].stage;
  if (lastSel && nodes[lastSel] && nodes[lastSel].stage) return nodes[lastSel].stage;
  for (const s of (flow.stages||[])){
    if ((s.nodes||[]).some(x => st(x) !== "done")) return s.id;
  }
  return ((flow.stages||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = stageBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    const c = Math.round((pt[0]-MG)/(NW+GX));
    if (c >= band.from && c <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (flow.stages||[]).map(s=>s.id);
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z = document.getElementById("zoom-val");
  if (z) z.innerHTML = "缩放 <b>" + Math.round(view.k*100) + "%</b>";
}
function resetZoom(){
  const st = document.getElementById("stage");
  const cx = st.clientWidth/2, cy = st.clientHeight/2;
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = 1; view.x = cx-wx; view.y = cy-wy; applyView();
}
/* 定位：跳转到当前（或最近一次）选中节点；无选中则整图适配 */
let lastSel = null;
function locateSel(){
  const target = sel || lastSel;
  if (!target || !pos[target]) { fitView(); return; }
  const st = document.getElementById("stage");
  const k2 = Math.max(view.k, 0.8);
  view.k = k2;
  view.x = st.clientWidth/2 - (pos[target][0]+NW/2)*k2;
  view.y = st.clientHeight/2 - (pos[target][1]+NH/2)*k2;
  applyView();
}
document.getElementById("stage").addEventListener("wheel", e=>{
  e.preventDefault();
  const r = document.getElementById("stage").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k2 = Math.min(2.2, Math.max(0.35, view.k * (e.deltaY<0?1.12:0.89)));
  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();
}, {passive:false});
let panning = null;
document.getElementById("stage").addEventListener("mousedown", e=>{
  if (e.target.closest(".node") || e.target.closest("#docpanel")) return;
  panning = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
});
window.addEventListener("mousemove", e=>{
  if (drag) { dragMove(e); return; }
  if (panning){ view.x = panning.vx+e.clientX-panning.x; view.y = panning.vy+e.clientY-panning.y; applyView(); }
});
window.addEventListener("mouseup", ()=>{ panning=null; if(drag){ const moved = drag.moved; drag=null; if(moved) render(); } });

/* ---------- 渲染 ---------- */
/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}
/* when 的人类可读摘要（画布标签 / 连线面板） */
function whenText(w){
  if (w===undefined || w===null) return "";
  if (typeof w==="string") return w;
  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");
  if (w.all) parts.push("("+w.all.map(whenText).filter(Boolean).join(" 且 ")+")");
  return parts.join(" 且 ");
}
/* 节点产物路径：唯一事实源 = node.output；交付清单只补"交付路径"（path）——不再有第二个字段名（规范 R4 §5.1） */
function nodeOutputs(n){
  const outs=[];
  const m = nodes[n] || {};
  if (m.output) outs.push(m.output);
  (flow.outputs||[]).forEach(o=>{
    if (o.node!==n) return;
    const p = o.path || m.output;
    if (p && !outs.includes(p)) outs.push(p);
  });
  return outs;
}
/* 节点能力：kit.op 为唯一事实源 → 由 kit 注册表取知识依据/校验；不再读已废弃的 node.kb（规范 R4 §5.1/§5.3） */
function kitOpOf(m){
  if (!m || !m.kit || !m.op) return null;
  const reg = (DATA.kits||{})[m.kit] || {};
  return {kit:m.kit, op:m.op, domain:reg.domain||"", ktitle:reg.title||"", def:(reg.ops||{})[m.op]||{}};
}
function kbTitle(id){ return (DATA.kbTitles||{})[id] || String(id||"").replace(/^kb\//,""); }

/* ================= R5 · 生成式编排的四个数据面 =================
   全部由**内核**算好落盘（registry/effective.json / metrics-summary.json / overlay.json / optimize.json），
   页面只读不改写。派生逻辑（overlay 叠加、kit 边界注入、配置合成）刻意不在前端复刻一遍——
   「人看到的编排」与「跑的编排」必须是同一份东西，唯一办法是只有一处实现。 */
const EFF = DATA.effective || null;
const OVERLAY = DATA.overlay || null;
const OPTIMIZE = DATA.optimize || null;
const METRICS = DATA.metrics || null;

/* 本节点是否 kit 边界验收门：以内核标注为准，不靠 id 前缀嗅探 */
function isBoundaryNode(n){
  const rec = EFF && EFF.nodeConfig && EFF.nodeConfig[n];
  if (rec && rec.boundary) return true;
  return (nodes[n]||{}).gate_role === "kit-boundary";
}
/* 本节点的 tool 指标：按 kit.op 归口（换位置不换 tool，指标该跟着 tool 走） */
function toolMetrics(m){
  if (!METRICS || !m || !m.kit || !m.op) return null;
  return (METRICS.byTool||{})[m.kit+"."+m.op] || null;
}
function fmtPct(x){ return (x===undefined||x===null||isNaN(x))?"-":Math.round(x*100)+"%"; }
function fmtEff(x){
  if (x===undefined||x===null||isNaN(x)) return "-";
  if (x===0) return "0";
  return x<0.001 ? x.toExponential(1) : x.toFixed(3);
}
/* 指标徽章：tool 效率（产物被下游真正消费的次数 ÷ 成本） + 上下文命中率（注入的标尺被引用的比例） */
function metricBadges(m){
  const t = toolMetrics(m);
  if (!t) return `<span class="mb" title="本项目尚无该 tool 的运行指标（未跑到 / 未落盘）">未采样</span>`;
  const hit = (t.ctxOffered||0) > 0 ? t.hitRate : null;
  const hitCls = hit===null ? "" : (hit>=0.6?"good":(hit>=0.3?"warn":"bad"));
  const effCls = (t.consumedBy||0) > 0 ? "good" : "bad";
  return `<span class="mb ${effCls}" title="tool 效率 = 被下游消费 ${t.consumedBy||0} 次 ÷ 成本 ${(t.cost||0).toFixed(2)}（token千分位 + 时延分钟 + 打回×5 + 重试×2）；${t.runs||0} 次派发 / ${t.submits||0} 次交卷">效率 ${fmtEff(t.efficiency)}</span>`
       + (hit===null
          ? `<span class="mb" title="未采样到知识注入（本 tool 未声明 knowledge 或不装载）">命中 -</span>`
          : `<span class="mb ${hitCls}" title="上下文命中率 = 被产物真正引用的标尺/上游件 ${t.ctxUsed||0} ÷ 注入 ${t.ctxOffered}">命中 ${fmtPct(hit)}</span>`);
}
/* 本节点/本 tool 被项目 overlay 改写了吗（位置 / 内容配置）——改写理由来自补丁自身，不猜 */
function overlayHits(n, m){
  if (!OVERLAY || !Array.isArray(OVERLAY.patches)) return [];
  return OVERLAY.patches.filter(p=>{
    if (p.kind==="set-tool" && m && m.kit && m.op) return p.kit===m.kit && p.op===m.op;
    return p.id===n;
  });
}
/* 内容配置项（R5 §二）：旋钮表 = 声明 + 生效值 + 逐键来源；来源区分「tool 默认」与「被人/优化agent改过」 */
function configPaper(n){
  const rec = EFF && EFF.nodeConfig && EFF.nodeConfig[n];
  if (!rec || !rec.resolved) {
    const m = nodes[n]||{};
    if (!m.kit || !m.op) return "";
    return `<div class="paper"><div class="doc-h"><span>内容配置项</span><span>${m.kit}.${m.op}</span></div><div class="md">
      <p class="msg">本节点未能在生效编排中解析出 tool（kit 注册表里查不到 <code>${m.kit}.${m.op}</code>）。
      kit 注册表是配置声明的唯一事实源——查不到即无旋钮可调，请先修 <code>kits/${m.kit}/kit.json</code>。</p></div></div>`;
  }
  const r = rec.resolved, defs = r.defs||{}, vals = r.values||{}, src = r.sources||{};
  const SRC_ZH = {overlay:"项目覆盖", node:"本节点", op:"tool 默认", generic:"通用默认"};
  const hits = overlayHits(n, nodes[n]);
  const keys = Object.keys(defs);
  const rows = keys.map(k=>{
    const d = defs[k]||{}, v = vals[k], s = src[k]||"generic";
    let spec = "";
    if (d.type==="enum" && d.enum) spec = d.enum.join(" / ");
    else if (d.type==="number") spec = `${d.min!==undefined?d.min:"-"} ~ ${d.max!==undefined?d.max:"-"}${d.unit||""}`;
    else if (d.type==="boolean") spec = "开 / 关";
    else if (d.type==="array") spec = "列表";
    else spec = d.type||"";
    const changed = (s==="overlay"||s==="node");
    return `<div class="knob${changed?" chg":""}">
      <div class="kn-h"><code>${k}</code><span class="kn-v">${Array.isArray(v)?v.join("、"):String(v)}</span><span class="kn-s src-${s}">${SRC_ZH[s]||s}</span></div>
      <div class="kn-d">${d.desc||""}</div>
      <div class="kn-m">可选：${spec}${d.effect?` ｜ ${d.effect}`:""}</div>
    </div>`;
  }).join("");
  const unk = (r.unknownKeys||[]).length
    ? `<span class="k">⚠ 未识别键</span><span class="v">${r.unknownKeys.map(x=>`<code>${x}</code>`).join(" ")} <span class="msg">写了但不在声明表内——内核已显式回显而非静默忽略；请补声明或改正键名</span></span>`
    : "";
  const ovNote = hits.length
    ? `<div class="knob chg" style="margin-top:8px"><div class="kn-h"><code>项目 overlay 改写</code><span class="kn-v">${hits.length} 条</span></div>
       <div class="kn-m">${hits.map(p=>`<code>${p.kind}</code>｜${p.reason||""}${p.evidence?`（依据 ${p.evidence.rule||""}）`:""}`).join("<br>")}</div></div>`
    : "";
  const patch = JSON.stringify({kind:"set-tool", kit:(nodes[n]||{}).kit, op:(nodes[n]||{}).op,
    config:Object.fromEntries(keys.map(k=>[k, vals[k]])), reason:"（填写调优依据：哪条指标 + 期望改变）"}, null, 2);
  return `<div class="paper"><div class="doc-h"><span>内容配置项 · 可被用户与优化 agent 调优</span><span>${(nodes[n]||{}).kit}.${(nodes[n]||{}).op}${r.genericOnly?" · 仅通用项":""}</span></div><div class="md">
    <div class="kv">
      <span class="k">旋钮数</span><span class="v">${keys.length} 项（${keys.filter(k=>src[k]==="overlay"||src[k]==="node").length} 项已偏离默认）</span>
      <span class="k">生效优先级</span><span class="v">项目 overlay &gt; 本节点 config &gt; tool 默认 &gt; 通用默认 <span class="msg">按 tool 归口：<code>set-tool</code> 改的是「这件事怎么做」，换位置照样生效</span></span>
      ${unk}
    </div>
    ${ovNote}
    <div class="knobs">${rows}</div>
    <p class="msg" style="margin-top:14px">改写方式（编排改动落 <code>registry/overlay.json</code>，内核重编译计划后生效）：</p>
    <div class="patched">${escapeHtml(patch)}</div>
    <p class="msg">落到项目：把上面的补丁存成 JSON 后 <code>npx tsx src/cli.ts flow_overlay --project ${DATA.project} --patches patch.json --reason "…" --replan</code>；
    优化 agent 的自动提案走 <code>flow_optimize</code>，结构类改动（增删节点/改线）一律待批。</p>
  </div></div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* 编排侧栏说明：生效层数 / 边界验收 / 优化提案（待批）。没有这几块，用户就不知道「谁改了我的流程」 */
function orchestrationPaper(){
  if (!EFF && !OVERLAY && !OPTIMIZE) return "";
  const pol = (EFF&&EFF.policy)||{};
  const props=(OPTIMIZE&&OPTIMIZE.proposals)||[];
  const pending=props.filter(p=>p.status==="proposed");
  const gates=(METRICS&&METRICS.gates)||[];
  return `<div class="paper"><div class="doc-h"><span>生成式编排（当前生效）</span><span>${EFF?EFF.format:"bootstrap"}</span></div><div class="md">
    <div class="kv">
      <span class="k">策略</span><span class="v">kit 边界验收 <code>${pol.kit_boundary||"-"}</code> ｜ 域内门 <code>${pol.gate_mode||"-"}</code> ｜ 自动调优 <code>${pol.adapt||"-"}</code>
        <span class="msg">gate_mode=auto ⇒ 域内门断言全过即自过；人只在 kit 边界被叫</span></span>
      <span class="k">编排指纹</span><span class="v"><code>${(EFF&&EFF.overlayHash)||"-"}</code>${EFF&&EFF.planHash?` ｜ 计划 <code>${EFF.planHash}</code>`:""}</span>
      <span class="k">边界验收</span><span class="v">${(EFF&&EFF.boundaries||[]).length} 处${(EFF&&EFF.boundaries||[]).length?`：${EFF.boundaries.map(b=>`<code>${b}</code>`).join(" ")}`:""} <span class="msg">域切换处自动派生，唯一的人工裁决点</span></span>

/* artifact@1 头部（规范 R4 §二）：版本与审核背景的唯一落点；正文不再承载这些。
   只认 artifact:1 的头部，解析顶层标量 + 一层嵌套（review）——与内核 asserts.ts 同口径。 */
function parseArtifactHeader(text){
  if (typeof text !== "string") return null;
  const m = /^\uFEFF?---\r?\n([\s\S]{0,3000}?)\r?\n---/.exec(text);
  if (!m || !/^\s*artifact\s*:\s*1\s*$/m.test(m[1])) return null;
  const kv={}, nested=[], list=[]; let sec=null;
  m[1].split(/\r?\n/).forEach(raw=>{
    if (!raw.trim() || raw.trim().startsWith("#")) return;
    const indent=/^\s+\S/.test(raw);
    let mm=/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(raw);
    if (mm){ if (indent && sec) nested.push([sec, mm[1], mm[2].trim()]); else { sec=mm[1]; kv[mm[1]]=mm[2].trim(); } return; }
    mm=/^\s*-\s*(.*)$/.exec(raw);
    if (mm) list.push([sec, mm[1].trim()]);
  });
  return {get:k=>kv[k], kv, nested, list,
          review: Object.fromEntries(nested.filter(x=>x[0]==="review").map(x=>[x[1],x[2]])),
          upstream: list.filter(x=>x[0]==="upstream").map(x=>x[1])};
}

}

  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function bindComment(key){
  const btn=document.getElementById("cmt-add"), box=document.getElementById("cmt-new");
  if (!btn || !box) return;
  btn.onclick=()=>{
    let v=box.value.trim(); if (!v) return;
    try{
      const s=window.getSelection();
      const st=(s&&s.toString()?s.toString():"").trim();
      if (st && st.length<=160 && dBody.contains(s.anchorNode)) v="「"+st+"」 —— "+v;
    }catch(e){}
    (RS.comments=RS.comments||{})[key]=(RS.comments[key]||[]).concat(v);
    box.value="";
    document.getElementById("cmt-list").insertAdjacentHTML("beforeend", `<div class="cmt">${v}</div>`);
    persistState();
  };
}
function verdictBar(n){
  const v=(RS.nodes[n]||{}).verdict||"awaiting";
  const sts=(flow.stages||[]); const gi=sts.findIndex(s=>s.gate===n);
  const opts=sts.slice(0, gi+1).reverse().map(s=>`<option value="${s.id}">${s.id} ${s.name}（根因）</option>`).join("");
  return `<span style="font-size:calc(12px*var(--fs,1))">验收门 · 当前裁决 <b>${v}</b></span>
    ${opts?`<select id="vroot" style="border:1px solid #c9c1b2;border-radius:var(--r-m);height:26px;padding:0 6px;font-size:calc(12px*var(--fs,1));background:#fff">${opts}</select>`:""}
    <button class="bt" id="vg" style="border-color:#5a8a5e;color:#3d6b45;font-weight:700">通过</button>
    <button class="bt" id="vn" style="border-color:#a5433a;color:#8c352c;font-weight:700">驳回（按根因回注）</button>
    <span class="msg">红方四视角意见书为必读件；裁决权默认人工。</span>`;
}
function bindVerdict(n){
  const g=document.getElementById("vg"), nn=document.getElementById("vn");
  if (!g) return;
  g.onclick=()=>{ RS.nodes[n].verdict="approved"; RS.nodes[n].status="done"; render(); openNodeDoc(n); };
  nn.onclick=()=>{
    const sts=(flow.stages||[]);
    const rootSel=document.getElementById("vroot");
    const rootId=rootSel?rootSel.value:(sts[0]&&sts[0].id);
    const ri=sts.findIndex(s=>s.id===rootId);
    RS.nodes[n].verdict="send-back"; RS.nodes[n].status="awaiting"; RS.nodes[n].root_cause_stage=rootId;
    (sts[ri].nodes||[]).forEach(nid=>{ if (RS.nodes[nid]) { RS.nodes[nid].status="pending"; RS.nodes[nid].round=(RS.nodes[nid].round||1)+1; } });
    const order=Object.keys(nodes);
    const ti=order.indexOf(sts[ri].nodes[0]||order[0]);
    order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
    render(); openNodeDoc(n);
  };
}
function openRerun(n){
  const m=nodes[n];
  const rcctx=condCtx();
  const upstream=edges.filter(e=>e.to===n && !isBackEdge(e) && evalWhen(e.when,rcctx).active).map(e=>e.from);
  const stageOf={}; (flow.stages||[]).forEach(s=>(s.nodes||[]).forEach(x=>stageOf[x]=s.id));
  const myStage=stageOf[n];
  const preset=(RS.presets||{})[myStage]||"semi";
  const inputs={}; upstream.forEach(u=>nodeOutputs(u).forEach(f=>{ if(files[f]) inputs[f]="✓"; }));
  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,
    skill:m.skill||undefined, minitool:m.minitool||undefined, assist:m.assist||undefined,
    kit:m.kit||undefined, op:m.op||undefined, asserts:m.asserts||undefined, inputs:inputs,
    inputs_note: upstream.length ? "上游产物："+upstream.join("、") : "无上游",
    output:nodeOutputs(n)[0]||"(汇入下游)", preset:preset,
    parallel_with: Object.keys(pos).filter(x=>x!==n && nodes[x].stage===m.stage && pos[x][0]===pos[n][0] && nodes[x].kind!=="gate" && nodes[x].kind!=="srd"),
    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>
    <button class="tb" id="r-zero">本阶段从零重做</button><button class="tb" id="r-close">收起</button></div>
    <div class="task">${JSON.stringify(tp, null, 2)}</div>
    <div class="act"><span class="msg" id="rmsg" aria-live="polite">标记后由宿主 / 运行时消费。</span></div>`;
  drawer.classList.add("on");
  document.getElementById("r-from").onclick=()=>{ markRerun(n); openNodeDoc(n); };
  document.getElementById("r-zero").onclick=()=>{ const stg=(flow.stages||[]).find(x=>x.nodes&&x.nodes.includes(n)); if(stg&&stg.entry) markRerun(stg.entry); openNodeDoc(n); };
  document.getElementById("r-close").onclick=()=>drawer.classList.remove("on");
  function markRerun(t){
    RS.nodes[t]=RS.nodes[t]||{};
    RS.nodes[t].verdict="send-back"; RS.nodes[t].status="pending"; RS.nodes[t].round=(RS.nodes[t].round||1)+1;
    render();
  }
}

async function saveApi(path, content){
  const r = await fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({path, content})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "保存失败");
  return "已保存 " + j.saved;
}

  try{

function openDeliverables(){
  navPush({type:"deliverables"});
  sel=null; selEdge=null; render();
  docReset(); dBack.style.display = navStack.length ? "" : "none";
  dTitle.textContent = "产物管理";
  const itNode = Object.entries(nodes).find(([n,m]) => m.iterate);
  const dlv = DATA.deliverables || [];
  const delivered = dlv.filter(f => f.startsWith("对外交付/"));
  const other = dlv.filter(f => !f.startsWith("对外交付/") && !f.endsWith(".md"));
  let h = "";
  // 章节模式（小说）：iterate.first 个槽位
  if (itNode){
    const [n, m] = itNode;
    const it = m.iterate;
    const total = it.first || 1;
    h += `<div class="paper"><div class="doc-h"><span>章节文档 · ${zhTitle(m)}</span><span>⟲ ${it.unit} × ${total}</span></div><div class="md">`;
    for (let i = 1; i <= total; i++){
      const cand = (it.artifact || "章节正文/第{n}章.md").replace("{n}", i);
      const exists = files[cand] !== undefined || dlv.includes(cand);
      if (exists) h += `<div class="shelf-row" data-f="${cand}"><span class="no">${i}</span><span class="nm">${cand}</span><span class="go">打开 →</span></div>`;
      else h += `<div class="shelf-row" style="opacity:.55;cursor:default"><span class="no">${i}</span><span class="nm">${cand}（虚位，待成稿）</span><span class="go">—</span></div>`;
    }
    h += `</div><p class="msg">迭代节点「${zhTitle(m)}」每${it.unit}一个实例；来源：${it.over||"-"}。</p></div>`;
  }
  // 对外交付：md 可编辑；其他格式（docx/html）走服务器相对链接
  h += `<div class="shelf-cap">对外交付 · ${delivered.length}</div>`;
  h += delivered.map(f => f.endsWith(".md")
    ? `<div class="shelf-row" data-f="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">打开 →</span></div>`
    : `<div class="shelf-row" data-link="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">下载/打开 →</span></div>`).join("");
  if (other.length){
    h += `<div class="shelf-cap">其他格式</div>`;
    h += other.map(f => `<div class="shelf-row" data-link="${f}"><span class="no">附</span><span class="nm">${f}</span><span class="go">打开 →</span></div>`).join("");
  }
  if (!delivered.length && !other.length) h += `<p class="msg" style="max-width:720px;margin:20px auto">暂无交付件。</p>`;
  // 交付清单核对（规范 R4 §5.1）：flow.outputs 是唯一事实源；磁盘上没被任何声明认领的件显式告警，不猜归属
  const decl = (flow.outputs||[]).map(o=>({node:o.node, path:o.path||((nodes[o.node]||{}).output)||"", title:o.title||""})).filter(x=>x.path);
  h += `<div class="shelf-cap">交付清单核对 · flow 声明 ${decl.length} 件</div>`;

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);
      if(d!==null&&a!==null&&d!==a){
        const pair=charSpanPair(d,a);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${dHtml}</div>`);
      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }
  return out.join("");
}

function annoList(key){ RS.annos=RS.annos||{}; RS.annos[key]=RS.annos[key]||[]; return RS.annos[key]; }
function findWrapQuote(quote, aid){
  const tries=[quote.replace(/\s+/g," ").trim(), quote.trim().slice(0,20)].filter(x=>x.length>=4);
  const walker=document.createTreeWalker(dBody, NodeFilter.SHOW_TEXT);
  let node;
  while ((node=walker.nextNode())){
    if (node.parentElement && node.parentElement.closest(".anno-rail")) continue;
    for (const t of tries){
      const idx=node.textContent.indexOf(t);
      if (idx>=0){
        const r=document.createRange();
        r.setStart(node, idx);
        r.setEnd(node, Math.min(node.textContent.length, idx+t.length));
        const mark=document.createElement("span");
        mark.className="anno-mark"; mark.dataset.aid=aid; mark.title="批注";
        try{ r.surroundContents(mark); }
        catch(err){ try{ mark.appendChild(r.extractContents()); r.insertNode(mark); }catch(e2){ return null; } }
        return mark;
      }
    }
  }
  return null;
}
function placeBubble(key, a, markEl, note){
  const paper = markEl ? markEl.closest(".docpaper") : dBody.querySelector(".docpaper");
  if (!paper) return;

  let top = markEl ? markEl.offsetTop : 40;
  const bubbles=[...rail.querySelectorAll(".anno-bubble")];

  b.addEventListener("click",ev=>{

      if (m){ const par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m); m.remove(); }

function anchorAnnos(key){

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

function docKey(){ return curNav.type==="node" ? "node:"+curNav.n : curNav.type==="file" ? curNav.f : null; }
function ustate(key){ return undoStacks[key] || (undoStacks[key] = {stack: [], idx: -1}); }
function capturePapers(){
  return [...dBody.querySelectorAll('.docpaper')].map(pp => ({pg: pp.dataset.pg, md: dom2md(pp.querySelector('.md'))}));
}
function restorePapers(pages){
  for (const paper of dBody.querySelectorAll('.docpaper')){
    const pg = pages.find(x => x.pg === paper.dataset.pg);
    if (pg) paper.querySelector('.md').innerHTML = mdHtml(pg.md);
  }
  anchorAnnos(docKey());
}
function pushUndo(){
  const key = docKey(); if (!key) return;
  const pages = capturePapers();
  if (!pages.length) return;
  const st = ustate(key);
  const sig = JSON.stringify(pages);
  if (st.stack[st.idx] && JSON.stringify(st.stack[st.idx]) === sig) return;
  st.stack = st.stack.slice(0, st.idx+1);
  st.stack.push(pages);
  if (st.stack.length > 40) st.stack.shift();
  st.idx = st.stack.length-1;
}
let undoTimer = null;
function scheduleUndo(){ clearTimeout(undoTimer); undoTimer = setTimeout(pushUndo, 500); }
function undoDoc(){
  const key = docKey(); if (!key) return;
  pushUndo();
  const st = ustate(key);
  if (st.idx <= 0) return;
  st.idx -= 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
function redoDoc(){
  const key = docKey(); if (!key) return;
  const st = ustate(key);
  if (st.idx >= st.stack.length-1) return;
  st.idx += 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}

document.addEventListener("keydown", e=>{
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = (e.key||"").toLowerCase();
  if (k === "z" && !e.shiftKey && docKey()){ e.preventDefault(); undoDoc(); }
  else if ((k === "y" || (k === "z" && e.shiftKey)) && docKey()){ e.preventDefault(); redoDoc(); }
});
function unwrapPending(){
  if (pendingMark){ const par=pendingMark.parentNode; if(par){ while(pendingMark.firstChild) par.insertBefore(pendingMark.firstChild, pendingMark); par.removeChild(pendingMark); } pendingMark=null; }
  pendingQuote="";
  const pop=document.getElementById("anno-pop"); if(pop) pop.style.display="none";
}
function dropDraftMark(){
  if (pendingMark){ const par=pendingMark.parentNode; if(par){ while(pendingMark.firstChild) par.insertBefore(pendingMark.firstChild, pendingMark); par.removeChild(pendingMark); } pendingMark=null; }
}
document.addEventListener("mouseup", e=>{
  const pop=document.getElementById("anno-pop");
  if (!pop) return;
  const tc = e.target.closest ? e.target : (e.target.parentElement || document.body);
  if (tc.closest("#anno-pop") || tc.closest("#d-tools")) return;
  if (curNav.type!=="node" && curNav.type!=="file") return;
  const s=window.getSelection();
  if (!s || s.isCollapsed || s.rangeCount===0 || !dBody.contains(s.anchorNode)) return;
  const raw=s.toString().trim();
  if (!raw) return;
  dropDraftMark();   // 重新框选 = 旧草稿作废
  // 立刻把选区固化为高亮标记：高亮不依赖原生选区（输入框聚焦/点击别处都不会丢）
  const r=s.getRangeAt(0);
  let rect=r.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)){
    const se=r.startContainer;
    const el=(se.nodeType===1?se:se.parentElement);
    if (el) rect=el.getBoundingClientRect();
  }
  pendingMark=document.createElement("span");
  pendingMark.className="anno-mark draft"; pendingMark.title="批注草稿（提交后生效）";
  pendingMark.appendChild(r.extractContents());
  r.insertNode(pendingMark);
  s.removeAllRanges();
  pendingQuote=raw.length>300 ? raw.slice(0,300)+"…" : raw;
  const pr=document.getElementById("docpanel").getBoundingClientRect();
  pop.dataset.quote=pendingQuote;
  document.getElementById("anno-input").value="";
  // 浮层贴着选区末端；越界收进面板
  pop.style.left=Math.round(Math.min(Math.max(8, rect.left-pr.left), Math.max(8, pr.width-290)))+"px";
  pop.style.top=Math.round(Math.min(Math.max(8, rect.bottom-pr.top+8), Math.max(8, pr.height-150)))+"px";
  pop.style.display="block";
  document.getElementById("anno-input").focus();
});
function submitAnno(){
  const pop=document.getElementById("anno-pop");
  const text=document.getElementById("anno-input").value.trim();
  const quote=pendingQuote || (pop.dataset.quote||"");
  const key=curAnnoKey();
  pop.style.display="none";
  if (!text || !quote || !key || !pendingMark){ unwrapPending(); return; }
  const a={id:"a"+Date.now().toString(36), quote, text, ts:new Date().toLocaleString()};
  annoList(key).push(a);
  pendingMark.classList.remove("draft");
  pendingMark.dataset.aid=a.id;
  pendingMark.title=a.text;
  placeBubble(key, a, pendingMark);
  pendingMark=null; pendingQuote="";
  persistState();
}
document.addEventListener("click", e=>{
  window.__clog = window.__clog || [];
  const where = (e.target.id || e.target.className || e.target.tagName) + "@" + (e.target.closest ? (e.target.closest(".docpaper") ? "正文" : (e.target.closest("#docpanel") ? "面板" : "画布/外")) : "?");
  if (e.target.id==="anno-ok"){ window.__clog.push("anno-ok"); submitAnno(); return; }
  if (e.target.id==="anno-cancel"){ unwrapPending(); return; }
  if (e.target.id==="anno-input"){ window.__clog.push("input click - keep"); return; }
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block"){ window.__clog.push("click(无关, pop未开) @ " + where); return; }
  const inDoc = !!(e.target.closest && e.target.closest(".docpaper"));
  window.__clog.push("click @ " + where + " inDoc=" + inDoc + " → " + (inDoc ? "保留" : "收起"));
  if (!inDoc) unwrapPending();
});
document.addEventListener("keydown", e=>{

        return `<div class="sd-use-row"><b>${stEsc(u.project)}</b><span>v${stEsc(u.version||"?")}</span><span class="msg">${note}</span></div>`;}).join("");
    })()}</div></div>
    <div class="sd-sec"><h4>导入说明</h4><p class="msg" style="margin:0">导入把项目绑定切到该流程：运行状态保留，计划按新流程重编译；flow_init 契约按项目配置重新装载。自建流程先把 flow.json 放入 <code>flows/&lt;新id&gt;/</code>，过 flow-lint 后即出现在本商店。带「装 Demo」标的流有官方示例项目：一键复制为你的新项目，配置与输入素材已就位，<code>flow_run</code> 即可开跑。</p></div>
  </div>`;
  document.getElementById("st-backbtn").onclick=()=>{ stSel=null; renderStore(); };
  document.getElementById("st-close2").onclick=closeFlowStore;
  const imp=document.getElementById("st-imp"); if (imp) imp.onclick=()=>importFlowTo(f.id);
  const dem=document.getElementById("st-demo"); if (dem) dem.onclick=()=>importDemo(f.id);
}
// store 标记位于本脚本之后，须等 DOM 就绪再绑定（否则 getElementById 为 null，绑定全数失败）
(function stBind(){
  const bind = () => {
    document.getElementById("store-q").addEventListener("input",e=>{ stQ=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-sort").addEventListener("change",e=>{ stSort=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-close").addEventListener("click",closeFlowStore);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("store").classList.contains("on")) closeFlowStore(); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
</script>
<div id="store" role="dialog" aria-label="流商店">
  <div class="store-top">
    <span class="st-brand">流商店</span><span class="st-sub" id="st-count"></span>
    <input id="store-q" type="search" placeholder="搜索流程 / 能力 / 技能…" aria-label="搜索流程">
    <select id="st-sort" class="st-sort" aria-label="排序">
      <option value="default">排序：默认</option>
      <option value="updated">最近更新</option>
      <option value="nodes">节点最多</option>
      <option value="name">名称</option>
    </select>
    <button class="tb" id="st-close">✕ 关闭</button>
  </div>
  <div class="st-cats" id="st-cats"></div>
  <div class="store-body" id="st-body"></div>
</div>
</body>
</html>
