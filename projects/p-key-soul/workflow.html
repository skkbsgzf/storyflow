度：重跑范围内就绪批照常并行"}, "intervention": "跨阶段回滚唯一入口 = 用户强行介入：flow_gate {force:true, rootCauseStage} 或 flow_rerun {nodeId, dryRun} 显式指定；任何 agent 不得自作主张打回已验收阶段"}, "roleModel": {"production": "找梗师/网感师/结构选型师/分镜编剧/成品剧本师/台词打磨——在流程里干活", "review": "红方评审/审美总编/交付监理——站在质检位，只看产物、只出意见，不混入生产", "principle": "总工程师不站产线里干活。质检员站在质检位上，对关键返回信息进行把控"}, "displayName": "短剧成稿生产线", "naming": {"rule": "flow 命名 = 生产线（端到端交付物），stage = 生产线内的段落；能力段要独立成 flow 仅当它有独立交付物且被多条生产线复用", "idNote": "id 'topic-selection' 沿用 v1 历史（当时只做选题）；S2-S5 陆续并入后 id 保持稳定以保护已绑定项目，显示名已更正"}}, "files": {"台词打磨对照表.md": "# 《拍魂》台词打磨对照表（内部留痕 · 不随对外交付物输出）\n\n> **件型**：内部质检留痕。对应交付物：`对外交付/03-剧本试稿.md`（成品稿，dialogue-polish 末环节后）。\n> **打磨对象**：`对外交付/04-成品剧本试稿.md`（第 1-3 集）。\n> **方法**：三遍固定顺序——①人物声口校准（逐角色，遮名测试）→ ②处境校准（逐场，压力-句长反向）→ ③去AI味清单（逐句，24 类＋结构指纹）。\n> **纪律**：情节、卡点、伏笔位零改动，只动台词与表演提示；关键伏笔句与口癖三变奏原样保留。\n> **隔离与合规**：未读取 `projects/_archive` 下任何内容；无 git 操作；无真实运动员/协会/赛事/赞助商/场馆名。\n\n---\n\n## 一、台词层修订（10 条）\n\n| # | 位置 | 原句 | 改句 | 依据 |\n| --- | --- | --- | --- | --- |\n| 1 | 第1集·顾曜险胜后 | 顾曜（烦躁）：十一比九。跟个陪练。 | 顾曜（烦躁，喘着气）：十一比九。……跟个陪练。 | 处境校准：刚打完最后一分，真人气没匀；省略号把羞辱放进拖长的尾音。依据 ai-trace 句长分布＋顾曜语言卡「最不敢输」 |\n| 2 | 第1集·监控屏室 | 魏峥（眼睛不离手机）：宣传片，第三球剪掉——他第三板晃了，难看。 | 魏峥（眼睛不离手机）：宣传片，第三球剪掉。／洪川没问。／魏峥：他第三板晃了。难看。 | 破折号连着解释是书面腔（naturalness-zh）；拆句后「难看」独立成句更像盖章；中间垫一拍「洪川没问」的沉默——不必解释、偏要解释，权力关系比解释更冷 |\n| 3 | 第1集·全队集合 | 洪川：明天队内考核。沈让给顾曜当发球机——也让大伙看看，什么叫陪练的本分。 | 洪川：明天队内考核。沈让给顾曜当发球机——都学着点，什么叫陪练的本分。 | 「让大伙看看」是搭台给观众看的舞台指令腔（讲解腔）；「都学着点」是教练点名上课的真实口吻，羞辱从「展示」变「上课」，更疼。依据 naturalness-zh 讲解腔＋洪川声口 |\n| 4 | 第1集·公示栏 | 工作人员（公事公办）：名单以公示为准。有异议，走流程。 | 工作人员（公事公办）：名单以公示为准。有异议？走流程。 | 短问比陈述更接近窗口办事员的实际腔调，不耐烦在调门里（naturalness-zh） |\n| 5 | 第2集·考核宣布 | 洪川：考核内容——陪练沈让，对预备队主力。输的那个，今天不配上桌，器材自己收。 | 洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。 | 去冗字：「的那个」是书面拖沓；教练宣布规则只说必要词，冷得更狠（naturalness-zh 冗字类） |\n| 6 | 第3集·姜屿自语 | 姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。 | 姜屿（盯着球的落点，像自语）：喂球？……发球机都拉不出这种转速。 | ①「这不是失误」与字幕反差翻译（「外行看是顾曜失误」）信息重复＝解释残留；②改半截问句贴合姜屿「只问不评、说话不超两句」语言卡；③先怀疑环节再怀疑球，是行家看球的反应顺序；④「发球机」回指第1集羞辱绰号——发球机拉不出这球，反讽闭环 |\n| 7 | 第3集·观察窗 | 魏峥：查一下，谁把这两个人排进一张课表的。 | 魏峥：查一下。谁把这两个人排进一张课表的。 | 句号切分＝先下指令、再自问，魏峥的节奏永远是命令在前（character 魏峥「记账式」说话习惯） |\n| 8 | 第3集·走廊窃语 | 队员（窃语）：三年没打比赛，回来占谁的位？ | 队员甲（窃语）：三年没打比赛，回来占谁的位？／队员乙（更低）：嘘——人过来了。／窃语声齐齐掐断。 | 单句闲话略单薄（ai-trace 回合对称）；补半句被掐断的闲话，「窃语声跟着她移动」有了声音落点，群演的怕动作化 |\n| 9 | 第1集·唐果揭底 | 唐果（小声）：流程？名单早印好了，章是后盖的。 | （台词不动）提示语改为：唐果左右看了一眼，声音压得更低。 | 说真话前先确认安全——唐果「不敢反抗×敢说真话」的矛盾动作化（character 唐果） |\n| 10 | 第2集·「你先稳住」 | 沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋。沈让：你先稳住。 | 同句尾加「才开口」三字。 | 先完成动作再答非所问，这句答话更像沈让：话少，好意不直说（character 沈让） |\n\n## 二、沉默与提示音层新增（8 处，均为表演提示，不动情节）\n\n| # | 位置 | 新增 | 依据 |\n| --- | --- | --- | --- |\n| 11 | 第1集·开场画外音后 | [音效：击球声没有任何变化。] | 恐怖感在「什么都没变」——全场对黑幕的默认，替代任何旁白解释 |\n| 12 | 第1集·变奏1落地后 | 没人接话。一颗球从筐沿滚下去，撞上另一颗，停了。（原「说完，球筐放回原位」删「说完」二字） | 金句落地需「无人接话」的沉默压住，不能飘着；球停＝他的话也被停住（他没资格被回应）；ai-trace 沉默纪律 |\n| 13 | 第2集·「输得像一点」前 | [音效：急哨的余音还在馆顶绕。] | 压低声令之前先静场，耳语才立得住 |\n| 14 | 第2集·全馆倒吸冷气后 | [音效：人群里一只矿泉水瓶被捏响，又赶紧松开。] | 群演反应代替抒情；「赶紧松开」＝有人连惊讶都不敢出声 |\n| 15 | 第2集·器材室开场 | [音效：刮胶皮的沙沙声，一下一下，很匀。] | 以声音写「手稳得像做手术」，不靠形容词 |\n| 16 | 第2集·集末灯灭 | 灯灭。[音效：咔哒一声，之后什么声音都没有。] | 卡点台词后留声音真空，球拍剪影更立；卡点落点（台词＋灯灭＋剪影）未动 |\n| 17 | 第3集·荣誉室出门 | [音效：柜门合上，很轻。] | 「还礼」的收势用声音完成——她连关门都收着力气 |\n| 18 | 第3集·对拉结束 | [音效：没有球声。空调风声。] | 「安静了三秒」的实证——用最不戏剧的声音证明馆里有多静 |\n\n## 三、保真清单（逐句核验，原样保留）\n\n| 句 | 保真原因 |\n| --- | --- |\n| 「比分是给人看的，不是给人信的。」 | 暗线伏笔①（中2「同一支笔」第1集暗埋位），一字未动 |\n| 「比分不说谎。」／「比分不说谎。节目说了不算。」／「比分不说谎。明天它替我说。」 | 口癖三变奏（第1/2/3集各一变奏，集末卡点落位），一字未动 |\n| 「沈让。收着点。你的任务是——输得像一点。」 | 暗埋·大反转①（捏拍柄特写同拍），一字未动 |\n| 「我瞎打的。蒙的。」 | 第3集卡点回指句（「再『瞎打』一次」），一字未动 |\n| 「陪练就是陪练——你天天上桌，是给别人当桌子。」 | ★切片梗点（双关羞辱→三分回敬 ≤2 拍），一字未动 |\n| 「你的球，第三板是谁教你的？」／「把你的拍给我。……明天，当着我的面，再『瞎打』一次。」 | 第1/3集集末卡点台词，一字未动 |\n| 口癖：「练都练了」「稳住，能赢」「我知道。」位 | 人物口癖，未动 |\n\n## 四、打磨后自查\n\n- **遮名抽测**（抽 5 句隐去署名）：「流量周正好。输球也要输出节目效果」→ 可辨魏峥（资产语言）；「都学着点，什么叫陪练的本分」→ 可辨洪川（训练场口吻）；「喂球？……发球机都拉不出这种转速」→ 可辨姜屿（行家短问）；「你先稳住」→ 可辨沈让（话少、好意不直说）；「……跟个陪练」→ 可辨顾曜（镜头前的人）。通过。\n- **句长分布**：三集台词无等长往返；最长句（魏峥群内 14 字）与最短句（姜屿「来」1 字、沈让「你先稳住」4 字）错落；同一人物连续台词句长不雷同（魏峥第1集：7 字／5 字＋4 字拆句）。\n- **卡点复验**：三集集末卡点台词、黑场落点、尾钩指向与《04》逐字一致；附一体检表三项「过」不受影响。\n- **24 类扫描**：全稿无排比抒情、无「不是…而是…」新造句（魏峥伏笔句为既定口癖豁免）、无总结陈词、无网络语串味；解释残留清理 2 处（第3条、第6条）。\n- **合规**：无真实运动员/协会/赛事/赞助商/场馆名；无「整治/抵制」类口号词。\n\n---\n\n*留痕完。2026-09-16 · dialogue-polish。本表为内部件，不随对外交付物输出；交付物以 `对外交付/03-剧本试稿.md` 为准。*\n", "多视角意见书-R1.md": "# 多视角意见书 · R1 调研验收门 ·《拍魂》（p-key-soul）\n\n---\n\n## 〇、合规红线快审（红方任务项）\n\n- **真实运动员姓名**：四份产物全文扫描，未发现。玩梗条目已做匿名化处理（\"六边形战士\"标注\"不指向具体人物\"；\"耗子尾汁\"未点名本人；\"教练，我想打____\"指向虚构动画角色）。**过。**\n- **真实协会/赛事/机构名**：仅出现在 `热点素材.md` 证据段（均标注\"不进正片/宣发\"）；被审核心件《选题分析报告》本体已匿名化（\"国际乒乓赛事\"\"国内大满贯级赛事\"）。口径一致，**过。**\n- **一处擦边，须修（不触发打回）**：`热点素材.md` 第七节建议\"青少年大满贯**同场馆设定**……可映射剧中梯队/后备队线，增强'这就是真事'的既视感\"，且节奏建议段出现真实场馆名。空间映射入剧 = 指向性暗示，与移交单 C5\"无地域、队服等指向性暗示\"自相矛盾。改成什么：删去\"同场馆映射\"类表述，真实场馆/赛程只允许留在内部排期证据段；C5 增补一句\"宣发话术与剧内设定禁用真实场馆、赛程对应物\"。→ **条件 2**。\n\n---\n\n## 一、冷读测试：只看调研产物，我就能复述全剧\n\n**我的复述**：第 1 集陪练当众受辱点火 → 中段小露一手、回放翻案、神秘陪练传闻发酵 → 第 18 集\"比分不说谎\"当众清算太子 → 中后期太子发现自己是白手套（\"小丑竟是我自己\"）、塌房三连 → B 强者回归拿回名字、A 打进主力，决赛对位大满贯终点。\n\n**判定**：\n- 骨架可预测是爽剧的\"承诺即满足\"，不是罪——读者买的就是这个兑现，骨架构不成扣分项。\n- 但有两处是\"懒猜\"而不是\"必然\"：**太子白手套自省位**与 **B 当年被退队的原因**，目前调研产物里都是空白，按惯性填就是最俗的填法（工具人觉醒 / 资方要捧新人）。空白即风险，提案见第七节。\n\n---\n\n## 二、目标读者（18-40 岁 · 职场/奋斗者认同 · 竖屏付费用户）——判定：**追**\n\n> 【目标读者 · 第 1 集受辱位】\"被安排的比分\"特写 + 陪练当众受辱——我停下来了。\"名单公示那一刻，才知道有些位置早就内定了\"就是我每个考核季的心情，我不用懂球就懂他。改成什么我会更上头：别只让太子坏，让\"内定\"有流程感（会前定好、会上走过场），我截图发群的欲望翻倍。（kb_ref: kb/aesthetic/perspective-review）\n\n> 【目标读者 · 情绪三层 vs 预布点表】三层神经里最扎我的是第三层——\"陪练十年的功劳，被写进了别人的纪录片\"。但前 18 集预布点表喂我的全是比分、破防、塌房，\"功劳记账\"被排去了中段。我不是要提前大清算，我是要前 18 集里有一场\"功劳被冒领\"的戏让我恨得具体——第 10 集太子发布会吹嘘位就是现成的位置，把一次挪用摆在那，我第 18 集会专等它被翻出来。改成这样，追变氪。（kb_ref: kb/market/meme-rules · 情绪三层）\n\n> 【目标读者 · 付费卡点】卡点押在第 8-9 集\"回放首秀 + 神秘陪练传闻\"——押在\"谜\"上而不是\"爽\"上，我掏钱前会犹豫：谜会被人剧透，爽不会。把第 8 集回放首秀做成\"一球翻案、当场小兑现\"的完整闭环，我就掏。（kb_ref: kb/market/constraints · 付费卡点）\n\n---\n\n## 三、一般读者（刷到即看的路人 · 零耐心）——判定：**犹豫**（附条件）\n\n> 【一般读者 · 前 7 集】前三秒受辱我懂了，没划。但第 3 集蒙尘奖杯、第 4 集看破缠胶皮——我一个不懂球的，看不出\"缠胶皮\"哪里厉害，除非画面替我喊出来\"外行看是捡球的，内行看是高手\"。改成什么我会追：每个专业细节必配一次\"翻译\"（反应拍 / 解说 / 字幕反差），否则我看的是哑谜。（kb_ref: kb/aesthetic/perspective-review · 三分钟测试）\n\n> 【一般读者 · 第 6 集章尾钩】章尾钩押\"我不要你觉得，我要我觉得\"——这句话我几年前就背下来了，刷到只会想\"这剧哪年拍的\"。拿旧梗当唯一钩力，我大概率章尾划走。改成什么我会追：钩子换成情境原创的（比如资方当众拿笔把主角名字从名单上划掉的手部特写），旧梗留着当垫场，别当门面。（kb_ref: kb/market/meme-rules · 梗时效）\n\n> 【一般读者 · 大爆点位置】第一次大清算在第 18 集，付费墙在第 8-9 集——中间若只有\"传闻发酵\"\"发布会吹嘘\"这类铺垫词，我第 11 集就看困了。预布点表里 12-15 集其实有货（积分榜、破防、翻案、复出首胜），但那只是\"预布点\"，不是承诺。改成什么我会追：把这四个点升格成硬节拍，每 3 集给我一次当众兑现，我就能走到 18。（kb_ref: kb/aesthetic/conflict-escalation · 回击时差）\n\n---\n\n## 四、资深编剧（同行 · 只谈手艺）——判定：**过**（附条件）\n\n> 【资深编剧 · 整体】方向、人群、变体三件事，调研做扎实了：主梗带选得准，过饱和带躲得开，\"计分板清算\"三轴是真变体不是换皮——\"慢镜回放当证据链\"是竞技载体独有的叙事装置，职场打脸剧给不了。过。（kb_ref: kb/aesthetic/perspective-review）\n\n> 【资深编剧 · 与读者系的分歧，并列保留】一般读者嫌第 18 集太晚；我不要求提前——章末放大爆点是 60 集体量的正常章法，提前释放会把蓄力拆散。我真正要的是 8-18 集之间的次级兑现梯度被结构层落锁：预布点表自己写着\"不是结构决定\"，S2 必须把 12/13/14/15 四个点升格为硬节拍，而不是留到 S3 现场发挥。（kb_ref: kb/aesthetic/conflict-escalation）→ **条件 5**\n\n> 【资深编剧 · 容量矛盾要在 S2 前显式裁决】移交单 C2 说 90 分钟只容 1 大 2-3 中反转、C3 说有名有姓角色 ≤10，但材料同时承诺了三样：双主角两条人物弧（甲方指定）、灌篮式队伍线群像、太子镜像弧（要求反派有前史、不能纸片）。三条全留，角色预算和反转预算必爆，S3 会自己撞上。改成什么我过：S2 开工前显式裁决——\"队伍线降为功能件\"或\"镜像弧压缩为两场戏\"二选一（或都压），并把裁决写回移交单。（kb_ref: kb/structure/catalog · 容量）→ **条件 6**\n\n> 【资深编剧 · 韩剧这把尺子是潮的】3.2 节拿三部韩剧定\"清算浓度下限\"，可三件的成绩数据全是\"（待补充对标）\"。没数据的标尺定不了下限，只能当风格参照；真要校准浓度，用你们自己写好的三要素判据（公开、证据链完整、当众社会性死亡）就够，别引用一个填不出数字的\"基准\"。（kb_ref: kb/benchmark · 标尺校准）→ **条件 3**\n\n> 【资深编剧 · 调研门最硬的一条】R2 风险对策写着\"乒乓专业细节由调研步补课核实\"——可这里就是调研验收门，全部产物里没有一件是专业素材：技战术常识、赛制、陪练体系，一件都没有。\"调研步补课\"是把活儿指给了自己，然后没交。这个剧的爽点全押在技战术细节上（缠胶皮看破、发球反制、回放证据链），\"可核验常识为限\"撑不住 18 集清算。改成什么我过：专业素材件要么本门内补齐，要么显式移交（谁、何时、什么形态）写进 C10——带着空白进 S3，这块必塌。（kb_ref: kb/market/constraints · 语料未覆盖）→ **条件 1**\n\n---\n\n## 五、甲方（掏钱的人）——判定：**过**（附条件）\n\n> 【甲方 · 一句话卖点】\"被埋没八年的陪练，用比分掀翻资源造星的占位者。\"说得清，我买：老引擎（打脸清算，红海但有效）+ 空白载体（CN 库无体育类目）+ 官方议题顺风（反流量造星与官方定调同向）+ 30 天赛程窗口。四个条件齐，这钱值掏。（kb_ref: kb/market/structure）\n\n> 【甲方 · 排期是双刃的】上线对位大满贯窗口，注意力是真的；但清朗专项还在执行窗口（A3），一个\"选拔黑幕\"题材撞进真实赛事月——立场虽与官方同向，宣发话术只要有一个词蹭到真实赛程/场馆，整盘都可能被要求整改。\"同场馆设定\"这类映射必须出清（见合规快审），出清我过。（kb_ref: 甲方约束 · 合规红线）→ **条件 2**\n\n> 【甲方 · 恋爱轴留白可以，盘子别缩】R8 说不预设恋爱轴——互相成就是我指定的，我认。但对标件 b012/b016/b027 全是女频头部，完全零暧昧的双主角，女频钩子少一条。我不要求加恋爱线，要求 S2 给\"关系张力不落恋爱标签\"的写法（搭档/师徒之间的独占感、吃味、护短都行），留白可以，别真空。（kb_ref: kb/market/meme-rules · 先婚后爱不预设）→ 并入 **条件 6** 交 S2 一并回答。\n\n> 【甲方 · 与目标读者的矛盾，我裁决】目标读者要\"功劳记账\"的情绪更扎，我要合规表述更干净——两个方向不冲突：扎的是桥段（挪用功劳的发布会戏），虚化的是指向（全虚构、不点名）。按这个口径同时满足，不裁边。（kb_ref: kb/aesthetic/perspective-review · 矛盾并列）\n\n---\n\n## 六、共识判定\n\n**四视角判定**：目标读者 **追** ｜ 一般读者 **犹豫（附条件）** ｜ 资深编剧 **过（附条件）** ｜ 甲方 **过（附条件）**。\n\n- **consensus：附条件过。** 无任何视角\"弃\"，不触发整段打回；方向、人群、新变体、合规骨架全部成立，缺的是一件补课、两处小修、三处下游落锁。\n- **root_cause_stage：不适用（未打回）。** 条件性指认：若条件 1 在 S3 开工前仍未闭合，根因阶段 = **调研阶段**（专业素材件缺失且责任归属未指认），其后的 S2/S3 产物顺延失效重审。\n\n**放行条件（闭合才算过）**：\n\n| # | 条件 | 闭合阶段 |\n| --- | --- | --- |\n| 1 | 乒乓专业素材件（技战术常识 / 赛制 / 陪练体系）具名补齐，或显式移交（责任阶段、产物形态、时限）写入 C10；不得带空白进 S3 | 调研阶段（硬性） |\n| 2 | 出清\"同场馆设定 / 真实场馆名\"映射：热点素材第七节改写；C5 增补\"宣发与剧内设定禁用真实场馆、赛程对应物\" | 调研阶段（小修） |\n| 3 | 韩剧三件对标成绩补齐；补不齐则 R7\"浓度下限\"降级为三要素判据表述，删\"基准\"字样 | 调研阶段（小修） |\n| 4 | 情绪神经③\"功劳记账\"在前 18 集至少一个显性节拍位（建议第 10 集发布会位），写入移交单 C7 | S2 承接 |\n| 5 | 第 6 集章尾钩不得以单一旧梗为唯一钩力；预布点 12/13/14/15 升格为硬节拍，写入移交单 C7 | S2 承接 |\n| 6 | 双主角 × 队伍线 × 镜像反派的三线容量矛盾显式裁决（含\"关系张力不落恋爱标签\"写法），裁决回写移交单 C2/C3 | S2 前置 |\n\n---\n\n## 七、不确定因素提案（建议性 · 注入冷读暴露的两处空白）\n\n本框架不算\"集体没兴奋\"的单薄（目标读者已追），但冷读复述暴露两处按惯性填必俗的空白，各提案一个反认知变量：\n\n- **提案 A · A（陪练主角）前史注入\"他曾身在让球链条里\"**：他当年亲手让过球——把位置让给资方要捧的人，后来才明白自己让掉的是什么。\"藏八年\"从被动埋没变成主动赎罪。翻盘预告：目标读者对\"功劳被写进别人纪录片\"会从共情变二刷——他不是纯受害者，他打过同样的牌，第 18 集清算会同时清算他自己。（kb_ref: kb/aesthetic/unreasonable-highlight）\n- **提案 B · B（强者回归主角）当年被退队的手法 = 今日造星太子同一套、同一经手人**：把 B 换下去的那份\"选拔评估\"，与如今把太子捧上位的操作出自同一人之手——反派的可怕从\"这一次作弊\"升级为\"体系惯犯\"。翻盘预告：资深编剧若觉得\"双主角只靠触发器绑定太松\"会翻案——关系轴从互为触发器升级为互为因果，两条弧咬死。（kb_ref: kb/aesthetic/unreasonable-highlight）\n- **提案 C（可选，交 S2 裁容量）· 太子镜像拍升格**：太子是队里加练到最晚的人，流量是他接下时就签好的债。\"小丑竟是我自己\"那集从爽点变痛感。翻盘预告：一般读者的\"反派纸片我划走\"会变\"这集我看完没划\"。90 分钟装不装得下，归条件 6 一并裁决。（kb_ref: kb/aesthetic/unreasonable-highlight）\n\n---\n\n## 八、机读块（嵌于人读件，未另立 .json 文件）\n\n```json\n{\n  \"gate\": \"R1\",\n  \"project\": \"p-key-soul\",\n  \"profile\": \"plot-redline\",\n  \"reviewed\": [\"选题分析报告.md\", \"梗卡.md\", \"热点素材.md\", \"选题素材.md\"],\n  \"isolation\": \"journal/state/registry/snapshots/_archive 未读\",\n  \"machine_layer\": { \"M1_integrity\": \"pass\", \"M2_aesthetic_asserts\": \"not_connected\" },\n  \"verdicts\": {\n    \"目标读者\": \"追\",\n    \"一般读者\": \"犹豫（附条件：专业细节配翻译、第6集钩子去旧梗依赖、12-15集升格硬节拍）\",\n    \"资深编剧\": \"过（附条件）\",\n    \"甲方\": \"过（附条件）\"\n  },\n  \"consensus\": \"附条件过\",\n  \"root_cause_stage\": null,\n  \"root_cause_stage_if_conditions_fail\": \"调研阶段（专业素材件缺失、责任归属未指认）\",\n  \"conditions\": [\n    \"C1 专业素材件补齐或显式移交（调研阶段，硬性）\",\n    \"C2 同场馆/真实场馆名映射出清（调研阶段，小修）\",\n    \"C3 韩剧对标成绩补齐或降级为三要素判据（调研阶段，小修）\",\n    \"C4 功劳记账位进前18集（S2）\",\n    \"C5 第6集钩子去单一旧梗依赖+12/13/14/15升格硬节拍（S2）\",\n    \"C6 三线容量矛盾显式裁决并回写移交单（S2前置）\"\n  ],\n  \"proposals\": [\n    \"A: 主角A前史注入'曾身在让球链条'（赎罪驱动）\",\n    \"B: B当年被退队手法=今日造星同一套同一经手人（体系惯犯）\",\n    \"C(可选): 太子镜像拍升格（加练最狠的人，流量是债主）\"\n  ],\n  \"compliance\": {\n    \"real_athlete_names\": \"none\",\n    \"real_assoc_names_scope\": \"仅内部证据段，报告本体已匿名化\",\n    \"finding\": \"热点素材第七节'同场馆设定'为空间指向擦边，须出清（条件2）\"\n  }\n}\n```\n\n---\n\n*意见书完。2026-09-16 · 红方（R1）。只指认，不越权改稿。*\n", "对外交付/03-剧本试稿.md": "# 《拍魂》剧本（第 1-3 集）\n\n【背景】\n当代职业乒坛：流量与镜头主宰俱乐部赛场，比分成了表演的道具，陪练与幕后手被光鲜的名单挡在视线之外。\n\n【主角】\n沈让——星轨俱乐部编制外陪练，被埋没的发球高手，寡言隐忍，只信「比分不说谎」。\n顾曜——一队主力、流量宠儿，镜头前精致表演的胜负手，容不得半点失控。\n姜屿——三年前离队的传奇女队员「07」，高马尾、右膝护具，冷眼归来的识球行家。\n魏峥——监控屏室里的运营操盘人，深色立领、保温杯不离手，把比赛当流量节目经营。\n洪川——球队教练，秒表与口哨从不离身，夹在上级指令与球员良知之间。\n唐果——微胖的年轻队员，胆小嘴碎，却是沈让身边唯一不设防的暖意。\n\n【剧情概括】\n第1集《选拔黑幕》：陪练沈让在队内对抗中拼出的制胜三分被当烂球剪掉，公示名单把他钉在「陪练编组」末行，深夜楼道里一位神秘女队员认出了他第三板的真功夫。\n第2集《不配上桌》：考核日沈让被要求对预备队主力「输得像一点」，他在满馆哄笑中当众认下「瞎打」，深夜器材室独自缠胶，等来一纸「顾曜专属陪练」的通知。\n第3集《归来的人》：姜屿擦亮荣誉室蒙尘的「07」并当众拍出旧号码布，合练中沈让一记喂球惊动全馆，两人隔网对拉震住观察窗，姜屿约他明天「当着我的面，再瞎打一次」。\n\n## 第1集 《选拔黑幕》\n\n【场景：星轨训练馆·球台区·夜·内】\n\n【特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。】\n\n【镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。】\n\n【沈让把捡球筐捏出一声轻响，瞳孔一缩，喉结动了动。】\n\n魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。\n\n【音效：击球声没有任何变化。】\n\n【球照常发，人照常打，没人回头看计分牌——包括沈让。】\n\n【球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。】\n\n【他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。】\n\n顾曜（烦躁，喘着气）：十一比九。……跟个陪练。\n\n【特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。】\n\n【洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。】\n\n魏峥（眼睛不离手机）：宣传片，第三球剪掉。\n\n【洪川没问。】\n\n魏峥：他第三板晃了。难看。\n\n洪川（弯腰）：练都练了。剪吧。\n\n【魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。】\n\n【洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。】\n\n洪川：明天队内考核。沈让给顾曜当发球机——都学着点，什么叫陪练的本分。\n\n【哄笑从队伍后排滚到前排。】\n\n唐果（压着嗓子）：又是让哥……\n\n【沈让蹲下捡球，一颗，一颗，不快不慢。】\n\n【特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。】\n\n【字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。】\n\n沈让（低着头，平静得像在说天气）：比分不说谎。\n\n【没人接话。一颗球从筐沿滚下去，撞上另一颗，停了。】\n\n【球筐放回原位，摆正。】\n\n【转场：红绸揭开。】\n\n【场景：俱乐部公示栏走廊·日·内】\n\n【次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。】\n\n【沈让的名字吊在末行「陪练编组」，字号小一号。】\n\n工作人员（公事公办）：名单以公示为准。有异议？走流程。\n\n【唐果左右看了一眼，声音压得更低。】\n\n唐果（小声）：流程？名单早印好了，章是后盖的。\n\n【没人提异议。唐果说完先缩了脖子。】\n\n【一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。】\n\n洪川（眼睛还在名单上）：名单看完了？看完了去加练。明天顾曜的手感，还得你一板一板喂。\n\n【沈让点头应下，指缝的布条缠了缠。不卑，也不亢。】\n\n【场景：宿舍楼道·夜·内】\n\n【声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。】\n\n【他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。】\n\n【楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。】\n\n【沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。】\n\n【声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。】\n\n姜屿：你的球，第三板是谁教你的？\n\n【沈让捏手机的手指收紧。她问完就走，没给他回答的时间。】\n\n【特殊镜头：黑场。】\n\n## 第2集 《不配上桌》\n\n【场景：星轨训练馆·球台区·日·内】\n\n【考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。】\n\n【沈让缠好指缝布条，慢悠悠上场。】\n\n洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\n\n【「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。】\n\n【主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。】\n\n【特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。】\n\n【字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。】\n\n【沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。】\n\n【主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。】\n\n主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。\n\n【哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。】\n\n【轮到沈让发球。他捏球的手，停了半秒。】\n\n【特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。】\n\n【音效：人群里一只矿泉水瓶被捏响，又赶紧松开。】\n\n【沈让发完第三球，拇指沿拍沿抹两下，什么都没说。】\n\n【急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。】\n\n【特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。】\n\n【音效：急哨的余音还在馆顶绕。】\n\n洪川（压低声）：沈让。收着点。你的任务是——输得像一点。\n\n【说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。】\n\n【沈让盯着他看了两秒，缓缓松开拍柄。】\n\n【沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。】\n\n沈让（平静）：我瞎打的。蒙的。\n\n【「瞎打」两个字，他咬得很轻。全场哄笑。】\n\n【镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。】\n\n【散场。主力被教练组围住，夸「状态回来了」。】\n\n【唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。】\n\n唐果（小声）：让哥，稳住，能赢。\n\n【沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋，才开口。】\n\n沈让：你先稳住。\n\n【转场：夜。一盏灯。】\n\n【场景：器材室·夜·内】\n\n【一盏灯。】\n\n【音效：刮胶皮的沙沙声，一下一下，很匀。】\n\n【沈让独自缠胶皮，手稳得像做手术。】\n\n【特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。】\n\n【沈让没抬头。手上的动作停了一拍，又继续。】\n\n【器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。】\n\n魏峥（群内）：流量周正好。输球也要输出节目效果。\n\n【群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。】\n\n【沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。】\n\n【特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。】\n\n沈让（低声，像对自己）：比分不说谎。节目说了不算。\n\n【灯灭。】\n\n【音效：咔哒一声，之后什么声音都没有。】\n\n【黑场里只剩球拍立着的一道剪影。】\n\n## 第3集 《归来的人》\n\n【场景：俱乐部荣誉室·日·内】\n\n【柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。】\n\n【特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。】\n\n【她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。】\n\n【余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。】\n\n【音效：柜门合上，很轻。】\n\n【场景：俱乐部公示栏走廊·日·内】\n\n【窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。】\n\n队员甲（窃语）：三年没打比赛，回来占谁的位？\n\n队员乙（更低）：嘘——人过来了。\n\n【窃语声齐齐掐断。】\n\n【洪川迎面拦下，客气而疏远，秒表在指头上转，转得比平时快。】\n\n洪川：姜屿是吧。先去陪练组，恢复性训练。\n\n姜屿（只点了一下头）：好。\n\n【说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。】\n\n【特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。】\n\n【她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。】\n\n【转场：合练哨声。】\n\n【场景：星轨训练馆·球台区·日·内】\n\n【合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。】\n\n【收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。】\n\n顾曜（压声）：老实点，别又抽风。\n\n【警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。】\n\n【沈让抛球——喂球环节，本该最没有悬念的一球。】\n\n【特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。】\n\n【字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。】\n\n【顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。】\n\n【隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。】\n\n姜屿（盯着球的落点，像自语）：喂球？……发球机都拉不出这种转速。\n\n【她说给自己听，可每个字都砸在沈让耳朵里。】\n\n【姜屿拿起球拍，站上对面球台，抬眼。】\n\n姜屿：来。\n\n【特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。】\n\n【两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。】\n\n【音效：没有球声。空调风声。】\n\n【观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。】\n\n【玻璃反光里，顾曜涨红的脸退到画面边缘。】\n\n魏峥：查一下。谁把这两个人排进一张课表的。\n\n【他的语气不怒，像在核对库存——这才是最冷的地方。】\n\n【训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。】\n\n【特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。】\n\n姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。\n\n沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。\n\n【她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。】\n\n【特殊镜头：黑场。】\n", "对外交付/04-成品剧本试稿.md": "# 《拍魂》成品剧本试稿 · 第 1-3 集\n\n---\n\n## 第1集 《选拔黑幕》\n\n场景：星轨训练馆·球台区 · 夜 · 内\n\n[特殊镜头：大特写——计分牌「10:8」，一只深色立领袖口的手把它翻成「8:10」，连停顿都没有。]\n\n镜头拉开：挡板缝后，沈让看完全程——过时款灰训练服，一望即知编制外，指缝缠着胶皮布条。捡球筐被捏出一声轻响。他瞳孔一缩，喉结动了动。\n\n魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。\n\n球照常发，人照常打，没人回头看计分牌——包括沈让。\n\n球台另一头，顾曜十一比九险胜，反手把拍摔在台面上，弹地两下。定制亮色队服，发胶亮额。他第一反应不是看球，是扭头瞥一眼监控屏室方向，随即收敛表情，对镜头练笑、比心。\n\n顾曜（烦躁）：十一比九。跟个陪练。\n\n[特殊镜头：监控屏室——魏峥盯着手机，始终没抬头。深色立领外套，保温杯在手边。]\n\n洪川推门进来，灰白寸头，秒表挂脖，进门腰就弯了；口哨吹到一半，停了半拍才接上。\n\n魏峥（眼睛不离手机）：宣传片，第三球剪掉——他第三板晃了，难看。\n\n洪川（弯腰）：练都练了。剪吧。\n\n魏峥从头到尾没看球台。沈让拼出的那三分，进了碎纸机。\n\n洪川回到球台区，一记短哨，全队集合。唐果站最外圈——微胖，拉链开一半，嚼着能量胶。\n\n洪川：明天队内考核。沈让给顾曜当发球机——也让大伙看看，什么叫陪练的本分。\n\n哄笑从队伍后排滚到前排。\n\n唐果（压着嗓子）：又是让哥……\n\n沈让蹲下捡球，一颗，一颗，不快不慢。\n\n[特殊镜头：特写——拇指沿拍沿抹两下。慢镜闪回：第三球发球出手，落点死压台角，顾曜重心早被骗反。]\n\n[字幕：外行看是运气球｜内行看是压线短球，接的人从出手就死了。]\n\n沈让（低着头，平静得像在说天气）：比分不说谎。\n\n说完，球筐放回原位，摆正。\n\n[转场：红绸揭开。]\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n次日公示栏红绸揭开：正赛名单装裱上墙，顾曜的名字烫金排头。盖章，一下，收印，不到一秒。沈让的名字吊在末行「陪练编组」，字号小一号。\n\n工作人员（公事公办）：名单以公示为准。有异议，走流程。\n\n唐果（小声）：流程？名单早印好了，章是后盖的。\n\n没人提异议。唐果说完先缩了脖子。\n\n一队人扛着应援灯牌经过，「曜」字一闪一闪。洪川按住沈让的肩。灯牌的光从他脸上扫过，又暗下去。\n\n洪川：名单看完了？看完了去加练——明天顾曜的手感，还得你一板一板喂。\n\n沈让点头应下，指缝的布条缠了缠。不卑，也不亢。\n\n场景：宿舍楼道 · 夜 · 内\n\n声控灯亮起。沈让靠墙划开手机：官方推送十一个精彩球，没有一球标他。他退出，点开云盘原始素材——每一球都在。他一球一球看得很慢，看到第三球，停住，倒回去，又看一遍。\n\n楼道拐角立着一个人：高马尾，右膝护具，拎旧运动包。她的视线越过沈让，落在屏幕那颗球上。沈让抬头——她胸前的工牌翻了个面，看不清名字。她盯着屏幕里的第三球，指腹隔着护腕按了一下。\n\n声控灯灭了两秒。她跺一下脚，灯又亮。两人隔一米对视。\n\n姜屿：你的球，第三板是谁教你的？\n\n沈让捏手机的手指收紧。她问完就走，没给他回答的时间。\n\n[特殊镜头：黑场。]\n\n## 第2集 《不配上桌》\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n考核日。洪川秒表一按，全馆立正。球台对面，预备队主力热身，两板爆冲打得挡板砰砰响。沈让缠好指缝布条，慢悠悠上场。\n\n洪川：考核内容——陪练沈让，对预备队主力。输的那个，今天不配上桌，器材自己收。\n\n「不配上桌」四个字落地，队伍里响起几声嗤笑。沈让表情没变，只看了一眼球桌。\n\n主力开局两板爆冲，球带着风声砸向边角。沈让退台放高球，全部接回。\n\n[特殊镜头：慢镜——球一次次从他拍面弹起，弧线一板比一板低。主力越扣越急，汗先掉下来。]\n\n[字幕：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。]\n\n沈让步伐不乱，眼睛只盯球，不看人。退了十板，一个球都没丢。主力一板扣飞，气得踹挡板，指着沈让，又指指球桌。围观队员起哄。\n\n主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。\n\n哄笑声里，唐果攥着能量胶忘了嚼。沈让垂下眼，看了看脚下，又看了看那张球桌。\n\n轮到沈让发球。他捏球的手，停了半秒。\n\n[特殊镜头：特写——胶皮摩擦的角度。三个发球，三种旋转。主力连吃三分，第三板直接把球接飞出台。全馆倒吸冷气。]\n\n沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n\n急哨。洪川冲进场，第一件事是背对人群，挡住记分牌。\n\n[特殊镜头：特写——沈让的手指在拍柄上收紧，指节泛白。]\n\n洪川（压低声）：沈让。收着点。你的任务是——输得像一点。\n\n说完这句，他的口哨在嘴边转了半圈，没吹响。眼神在沈让脸上停了一瞬，又移开。沈让盯着他看了两秒，缓缓松开拍柄。\n\n沈让把球拍轻轻放在球台上，后退一步，当众鞠躬，角度标准得像教学视频。\n\n沈让（平静）：我瞎打的。蒙的。\n\n「瞎打」两个字，他咬得很轻。全场哄笑。镜头扫过门口——姜屿抱着恢复性训练的球桶站在那里，全场只有她没笑，盯着他刚才捏拍柄的那只手，指腹隔着护腕按了一下。\n\n散场。主力被教练组围住，夸「状态回来了」。唐果溜到沈让身边，往他手里塞了支能量胶。沈让收着器材，把公用球一颗颗擦净归位。\n\n唐果（小声）：让哥，稳住，能赢。\n\n沈让笑了一下——头一回长得像笑——把能量胶别回唐果胸前口袋。\n\n沈让：你先稳住。\n\n[转场：夜。一盏灯。]\n\n场景：器材室 · 夜 · 内\n\n一盏灯。沈让独自缠胶皮，手稳得像做手术。\n\n[特殊镜头：特写——压胶、划边、滚平，一气呵成。门口地板上多出一道影子，停了三秒，没进来，走了。影子的轮廓，高马尾。]\n\n沈让没抬头。手上的动作停了一拍，又继续。\n\n器材桌上手机亮起，队内群弹窗：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。\n\n魏峥（群内）：流量周正好。输球也要输出节目效果。\n\n群消息底下，队员排队回「收到」。只有唐果那条「收到」，隔了很久。\n\n沈让关掉屏幕。他把缠好的球拍立在手心，拇指沿拍沿抹了两下。\n\n[特殊镜头：推近他的眼睛——灯芯在瞳孔里一点。]\n\n沈让（低声，像对自己）：比分不说谎。节目说了不算。\n\n灯灭。黑场里只剩球拍立着的一道剪影。\n\n## 第3集 《归来的人》\n\n场景：俱乐部荣誉室 · 日 · 内\n\n柜顶一座蒙尘奖杯。姜屿踩着凳子把它取下来，袖口擦过杯身——灰尘底下露出刻字：「07」。\n\n[特殊镜头：特写——她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。]\n\n她擦得很慢，很匀，像在还礼。擦完，把奖杯放回正中，退后一步看了看。余光扫过荣誉墙——旧合影里她的位置，被另一个相框盖住了。她收回目光，拎包出门，没有停顿，只在跨出门槛时把右膝护具紧了紧。\n\n场景：俱乐部公示栏走廊 · 日 · 内\n\n窃窃私语，声音压着，却故意让人听见。姜屿走过，窃语声跟着她移动。\n\n队员（窃语）：三年没打比赛，回来占谁的位？\n\n洪川迎面拦下，客气而疏远，秒表在指头上转。\n\n洪川：姜屿是吧。先去陪练组，恢复性训练。\n\n姜屿（只点了一下头）：好。\n\n说完就走。她在公示栏前站定，从护腕内侧抽出那块 07 号布。\n\n[特殊镜头：「啪」——07 号布拍在她自己的旧照片旁边。她抚平四个角。走廊瞬间安静，洪川的口哨又停了半拍。]\n\n她一个字没说，转身走了。满走廊的人站在原地，和那块布对峙。\n\n[转场：合练哨声。]\n\n场景：星轨训练馆·球台区 · 日 · 内\n\n合练开球。顾曜打完一板，转身对镜头比心，场边摄像机红灯亮着。收势，他侧身压低声音——观察窗后，隐约有立领外套的轮廓。\n\n顾曜（压声）：老实点，别又抽风。\n\n警告完，笑容立刻切回镜头前那副。沈让弯腰捡球，没接话。\n\n沈让抛球——喂球环节，本该最没有悬念的一球。\n\n[特殊镜头：球过网后急坠、侧拐。顾曜扑空，球擦着他的拍边落地。全场静，只听见球在地板上滚了两圈。]\n\n[字幕：外行看是顾曜失误｜内行看这球从出手就拐了两次。]\n\n顾曜僵在原地，第一反应又是看向观察窗。沈让已经弯腰去捡下一颗球。\n\n隔壁球台，姜屿接球的手停在半空。她盯着球的落点，指腹隔着护腕按住 07，放下球桶，穿过球台间的过道走来。\n\n姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。\n\n她说给自己听，可每个字都砸在沈让耳朵里。\n\n姜屿拿起球拍，站上对面球台，抬眼。\n\n姜屿：来。\n\n[特殊镜头：两人隔网对拉。不说话，十几拍，越打越快。慢镜：胶皮咬住球、球身旋转变形的瞬间。全馆停了——别的台不打了，队员围拢过来，唐果嚼能量胶的嘴停在半开。]\n\n两个人眼睛里都没有观众，只有球。最后一拍，同时收力，球停在网带上，滚都没滚。全馆安静了三秒。\n\n观察窗内，魏峥放下保温杯，杯底磕在台面上。他盯着场中两个身影，对身侧的人偏了偏头。玻璃反光里，顾曜涨红的脸退到画面边缘。\n\n魏峥：查一下，谁把这两个人排进一张课表的。\n\n他的语气不怒，像在核对库存——这才是最冷的地方。\n\n训练结束的哨声里，姜屿隔着球网伸出手。沈让把拍递过去。\n\n[特殊镜头：特写——她的指腹抚过胶皮边缘。那是全世界只有她被允许碰的拍。]\n\n姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。\n\n沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。\n\n她把拍还回去时，按了一下他的手背，只一秒。两个人谁都没笑。\n\n[特殊镜头：黑场。]\n\n---\n\n## 附一：卡点体检（内部质检附注，不随成品外发）\n\n**时长结构**（对齐小纲拍数与秒数标注）：\n\n| 集 | 拍数/总时长 | 场次分布（场景 ≤3） | 末卡点对应小纲拍 |\n| --- | --- | --- | --- |\n| 第1集 | 10 拍 / 90 秒 | 球台区 46s·5拍 → 公示栏走廊 19s·2拍 → 宿舍楼道 25s·3拍 | B0010 |\n| 第2集 | 10 拍 / 90 秒 | 球台区 63s·7拍 → 器材室 27s·3拍 | B0020 |\n| 第3集 | 10 拍 / 90 秒 | 荣誉室 17s·2拍 → 公示栏走廊 18s·2拍 → 球台区 55s·6拍 | B0030 |\n\n**集末卡点逐体检**：\n\n| 集 | 卡点落点 | 型 | 体检结论 |\n| --- | --- | --- | --- |\n| 1 | 姜屿「你的球，第三板是谁教你的？」问完即走，黑场 | 信息型 | 信息增量唯一：发现者进场＋「第三板」悬问；暗线半句释放纪律达成（护腕只按不亮）；黑场落在问题悬空处，非情绪低谷；直接给第2集考核日续力。过 |\n| 2 | 「比分不说谎。节目说了不算。」灯灭，只剩球拍剪影 | 情绪型 | 情绪目标=宣战/愤怒，不靠新悬念供钩；口癖变奏2落位；与第1集信息型明确区分；钩力指向明日「专属陪练」的课表。过 |\n| 3 | 「明天它替我说」＋她按他手背一秒，谁都没笑，黑场 | 情绪型 | 关系道具「拍」首次行使（只许她一人碰）；公开化承诺=期待＋隐忧双情绪；口癖变奏3落位；「瞎打」悬置进第4集。过 |\n\n**主认知更新唯一性**：第1集「比分是可以被翻的」；第2集「赢了也不算——他不辩，他记账」；第3集「看得懂的人出现了」。三集卡点均落张力峰值非低谷，无与明线抢认知的暗线信息（「同一支笔」「让球前史」在三集内零泄露，仅道具级微光）。\n\n## 附二：切片梗点标注（对位梗卡预布点表）\n\n| 集 | ★切片梗点（成片位置） | 对位梗卡预布点 | 建议切片入点/出点 |\n| --- | --- | --- | --- |\n| 1 | 开场计分牌 10:8→8:10 特写（被「安排」的比分）＋「发球机」当众受辱 | 预布点表第1集「选拔黑幕一瞬＋陪练当众受辱——打脸引擎点火位」 | 入点：翻牌手特写；出点：哄笑滚到前排＋唐果低头。备选：压线短球慢镜＋外行/内行字幕反差 |\n| 2 | 「你天天上桌，是给别人当桌子」双关羞辱 → 三分连发当场回敬（受辱→回击 ≤2 拍） | 预布点表第2集「不配上桌球桌双关（切片位）」＝主梗切片3「双关嫁接位」 | 入点：主力踹挡板；出点：全馆倒吸冷气＋抹拍沿。备选：「我瞎打的」鞠躬 |\n| 3 | 蒙尘奖杯/07 号布回归仪式；07「啪」拍回公示栏；隔网对拉全馆静三秒 | 预布点表第3集「蒙尘奖杯/旧号码——回归仪式梗点（强者回归轴）」 | 入点：袖口擦杯露「07」；出点：球停网带、滚都没滚。备选：07 拍墙「啪」一声＋满走廊安静 |\n\n---\n\n*产物完。2026-09-16 · 编剧（scene-screenwriter 剖面 · script-final 技能）。基于《小纲-第1-3集.md》B0001-B0030 逐拍扩写，与《选题方案.md》《故事框架案.md》口径逐处对齐；未读取 projects/_archive 下任何内容；无 git 操作。*\n", "对外交付/选题交付页.html": "<!doctype html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>智能选题工作流 v5（阶段-菱形循环引擎：调研 → 结构 → 大纲 → 小纲 → 成稿） · 交付页<\/title>\n<style>\nbody{margin:0;background:#f3efe6;color:#2b2822;font:15px/1.75 \"Noto Sans SC\",system-ui,sans-serif}\nheader{background:#2b2822;color:#f4f1ea;padding:28px 22px}\nheader h1{margin:0;font-size:20px;letter-spacing:1px}\nheader p{margin:6px 0 0;color:#b8b0a2;font-size:12px}\nmain{max-width:860px;margin:0 auto;padding:10px 16px 60px}\nsection{background:#fffdf9;border:1px solid #e4ddcd;border-radius:4px;margin:18px 0;padding:22px 26px;box-shadow:0 2px 10px rgba(70,58,35,.07)}\nsection>h1{font-size:15px;color:#a5433a;border-bottom:1px solid #e4ddcd;padding-bottom:8px;letter-spacing:1px}\nfooter{text-align:center;color:#b3ab9b;font-size:11px;padding:20px;letter-spacing:2px}\n<\/style><\/head>\n<body>\n<header><h1>智能选题工作流 v5（阶段-菱形循环引擎：调研 → 结构 → 大纲 → 小纲 → 成稿） · 交付页<\/h1><p>由 miniflow 内核确定性渲染（零 LLM）｜ 13 件产物合一<\/p><\/header>\n<main>\n<section><h1>内部/kb-market.md<\/h1><h2>KB 装载 · market（市场快照装载）<\/h2>\n<p>&gt; 由 miniflow kernel kb_load 内建装载，来源 3 个知识文件。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/constraints.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/constraints\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"生产约束基线（短剧/漫剧实盘值）\",<\/p>\n<p>  \"version\": \"2026-09-14\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"import\",<\/p>\n<p>    \"refs\": [\"dataset:kakaxing/scriptrawstone@2026-09-14（全量统计）\", \"kb/market/snapshot.formatConstraints\", \"storymaster-v3:assets/skills/script-drama-beat.md\"]<\/p>\n<p>  },<\/p>\n<p>  \"bind\": { \"skills\": [\"plot-choreographer\"], \"minitools\": [\"check_contract_compliance\"] },<\/p>\n<p>  \"updated\": \"2026-09-14\"<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>生产约束基线<\/h2>\n<p>**用途**：选题分析报告第五节\"创作约束移交单\"的默认数值来源——约束不再拍脑袋，直接取市场实盘（7938 部在售剧本的硬格式统计）。方案对这些条款逐条对账（`kb/aesthetic/oversight` 监理纪律，违反一票否决）。<\/p>\n<h3>一、体量约束（分布即标准）<\/h3>\n<p class=\"row\"> ┃  维度  ┃  主流值  ┃  分布依据  ┃ <\/p>\n<p class=\"row\"> ┃  集数  ┃  **60 集**（4224 部）  ┃  50 集 945 / 80 集 925 / 40 集 718 / 30 集 116  ┃ <\/p>\n<p class=\"row\"> ┃  单集时长  ┃  **1-1.5 分钟**  ┃  竖屏付费短剧口径  ┃ <\/p>\n<p class=\"row\"> ┃  单集字数上限  ┃  **1200 字**（4284 部）  ┃  1000 字 1640 / 1400 字 528 / 1600 字 476  ┃ <\/p>\n<p class=\"row\"> ┃  场景数上限  ┃  **≤3**（7937/7938）  ┃  几乎全库硬约束——低成本快转景  ┃ <\/p>\n<p class=\"row\"> ┃  主要演员上限  ┃  **≤10**（7925 部）  ┃  同上  ┃ <\/p>\n<p>**用法**：方案默认按 60 集 × 1.5 分钟 × 1200 字 × ≤3 场景 × ≤10 演员声明约束；偏离主流值（如 80 集或 4 场景）必须在移交单中显式声明并给理由——偏离不是错，隐式偏离才是错。<\/p>\n<h3>二、约束 → 编排的直接推论<\/h3>\n<p>1. **3 场景上限** ⇒ 每集冲突必须发生在可复用景（宅门/办公室/宫殿/车厢）；换景 = 换集节拍点。剧情编排师分集时先画场景复用表。<\/p>\n<p>2. **10 演员上限** ⇒ 有名有姓角色 ≤10（含反派）；群演反应拍（当众打脸必需）不计入，但\"全场惊呆\"必须由环境描写的群演承担。<\/p>\n<p>3. **1-1.5 分钟 ≈ 600-900 字正文**（script-drama-beat 口径）⇒ 每集 8-12 拍，前 3 秒钩子约 1 拍、结尾卡点约 2 拍。<\/p>\n<p>4. **60 集 × 1.5 分钟 = 90 分钟总片长** ⇒ 实际叙事容量 ≈ 一部电影的紧凑版：主线只容 1 个大反转 + 2-3 个中型反转（`kb/aesthetic/reversal` 结构位点联动），副线必须挂主线条件。<\/p>\n<h3>三、题材标签纪律<\/h3>\n<p>申报题材标签从市场受控词表取（快照 `genreHeatCN`/`genreHeatNA` 中的 genre 字段），不用自造词；标签组合 = 1 主题材 + 2-3 副标签（市场策划案通行形），标签顺序即卖点顺序。<\/p>\n<h3>四、与硬断言的绑定<\/h3>\n<p>本条目数值进入约束移交单后，由 minitool `check_contract_compliance` 逐条对账；分拍格式合规由 `AE-BEAT-FORMAT` 断言扫描（`kb/aesthetic/assertions.json`）。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/setting-rules.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/setting-rules\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"设定体系约束（项目级：世界观代入成本红线）\",<\/p>\n<p>  \"dimension\": \"setting\",<\/p>\n<p>  \"version\": \"1.0.0\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [\"AE-SET-ORIG\", \"AE-SET-3MIN\"],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"factory\",<\/p>\n<p>    \"refs\": [<\/p>\n<p>      \"user-feedback:2026-09-15（禁止原创科幻世界观——点子好但没有厚度，读者不能快速代入；用市面做过的设定体系或实事新闻做底子）\",<\/p>\n<p>      \"kb/market/constraints（生产约束基线，本条目为其世界观维度扩展）\"<\/p>\n<p>    ]<\/p>\n<p>  },<\/p>\n<p>  \"updated\": \"2026-09-15\",<\/p>\n<p>  \"bind\": { \"skills\": [\"structure-design\", \"topic-analysis-report\"], \"minitools\": [\"check_aesthetic_asserts\"] }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>设定体系约束（世界观代入成本红线）<\/h2>\n<p>**命题：短剧/漫剧的观众没有耐心学一套新世界观。** 点子再好，架构没有厚度——读者无法快速代入理解——就是废案。世界观的代入成本是选题阶段的一票项，不是成稿阶段再优化的细节。<\/p>\n<h3>一、设定来源三级制<\/h3>\n<p class=\"row\"> ┃  级别  ┃  来源  ┃  判定  ┃ <\/p>\n<p class=\"row\"> ┃  **首选**  ┃  **实事新闻做底子**：防汛救灾、工程质量清查、债务与烂尾、养老与医疗、裁员与再就业——全民共识的公共事件，零解释成本，主旋律有锚  ┃  ✅ 直接可用  ┃ <\/p>\n<p class=\"row\"> ┃  **次选**  ┃  **市面验证过的设定体系做创新改编**：战神归来/赘婿/重生/系统/马甲/先婚后爱等——观众已被市场教会规则，创新只做变体不做体系  ┃  ✅ 可用，须挂竞品对标  ┃ <\/p>\n<p class=\"row\"> ┃  **禁止**  ┃  **原创科幻/架空世界观**：自造中台/异能体系/架空王朝规则等需要观众先学后看的设定  ┃  ❌ 一票否决  ┃ <\/p>\n<h3>二、判定方法：三分钟测试<\/h3>\n<ul>\n<li>【block】**三分钟测试**：路人观众开播 3 分钟内，在不依赖任何设定解释的前提下，能否说出\"这是谁、他想要什么、为什么替他急\"？凡需要先讲设定才能进冲突的开局 = 违反本约束。<\/li>\n<li>【major】设定词密度：前三章正文中的**自造专名**（体系名/组织名/规则名）≤2 个；超过即代入成本超标。<\/li>\n<li>【major】实事锚点：选题理由必须至少引用一条**当月公共议题/新闻方向**作为情绪底（与 zeitgeist 步联动），架空设定天然缺此锚。<\/li>\n<\/ul>\n<h3>三、正确的\"创新\"位置<\/h3>\n<p>约束禁止的是**世界观层原创**，不禁止创意：创新发生在①**人物关系与身份层**（不确定因素注入：黑道大小姐/真假千金/穿书/初版作者）；②**结构改造**（`kb/structure/catalog` 三步）；③**实事底子上的具体事件**。好点子要长在观众熟悉的土壤上——点子的锐度 × 土壤的熟悉度 = 代入速度。<\/p>\n<h3>四、执行接线<\/h3>\n<ul>\n<li>S1 调研：约束移交单新增 **C10 设定体系约束**（本条目），选题方向必须声明设定来源级别。<\/li>\n<li>S2 结构：框架案的世界观节按三级制声明来源；原创倾向在此拦截。<\/li>\n<li>R1/R2 红方：三分钟测试 + 设定词密度为固定检查项（`kb/aesthetic/perspective-review` 一般读者视角主责）。<\/li>\n<\/ul>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/market/meme-rules.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p>  \"id\": \"kb/market/meme-rules\",<\/p>\n<p>  \"type\": \"market-standard\",<\/p>\n<p>  \"title\": \"梗密度与发散性约束（S1 网感输入源）\",<\/p>\n<p>  \"dimension\": \"meme\",<\/p>\n<p>  \"version\": \"1.0.0\",<\/p>\n<p>  \"status\": \"active\",<\/p>\n<p>  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],<\/p>\n<p>  \"routes\": [\"all\"],<\/p>\n<p>  \"asserts\": [\"AE-MEME-DENSITY\", \"AE-MEME-SPREAD\"],<\/p>\n<p>  \"provenance\": {<\/p>\n<p>    \"source\": \"factory\",<\/p>\n<p>    \"refs\": [\"user-feedback:2026-09-15（选题作为网感输入源需足够多的梗、有发散性；梗传播度与密度不足则观众无趣；纳入知名梗词典网站）\"]<\/p>\n<p>  },<\/p>\n<p>  \"updated\": \"2026-09-15\",<\/p>\n<p>  \"bind\": { \"skills\": [\"find-trope\", \"topic-analysis-report\"], \"minitools\": [\"meme_harvest（待实现）\", \"kb_search\"] }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>梗密度与发散性约束<\/h2>\n<p>**命题：选题阶段是全流程的网感输入源。** 选题产出的梗与素材要喂给后续所有阶段（结构/方案/剧本/传播切片）；梗的传播度和密度不足，后续每一层都会\"无趣\"——这不是文案问题，是资源储量问题。<\/p>\n<h3>一、S1 产出硬指标<\/h3>\n<p class=\"row\"> ┃  指标  ┃  要求  ┃ <\/p>\n<p class=\"row\"> ┃  **网络热梗素材表**  ┃  S1 梗卡必须附带 ≥10 条与题材相关的**现存高传播梗**（每条：梗名/来源与传播度评级/可挂接的场景示例）  ┃ <\/p>\n<p class=\"row\"> ┃  **发散性**  ┃  每个主梗/新变体须可拆出 ≥3 个跨场景可复用的梗用法（对话梗/场面梗/切片梗）——只在一个场景成立的梗不算储量  ┃ <\/p>\n<p class=\"row\"> ┃  **密度自查**  ┃  前三章每集至少 1 处可独立切片传播的\"梗点\"（观众能截出来转发的东西）  ┃ <\/p>\n<h3>二、梗词典数据源（纳入数据库的输入源清单）<\/h3>\n<p class=\"row\"> ┃  源  ┃  类型  ┃  用途  ┃ <\/p>\n<p class=\"row\"> ┃  小鸡词典（含镜像存档）  ┃  梗词典  ┃  梗的出处、演变、用法  ┃ <\/p>\n<p class=\"row\"> ┃  梗百科 / 萌娘百科  ┃  百科类  ┃  梗的条目化解释与传播链  ┃ <\/p>\n<p class=\"row\"> ┃  B 站热梗榜 / 抖音话题榜  ┃  平台热榜  ┃  当期传播度实测  ┃ <\/p>\n<p class=\"row\"> ┃  知乎\"网络流行语\"相关高赞  ┃  语义讨论  ┃  梗的语义漂移与代际差异  ┃ <\/p>\n<p class=\"row\"> ┃  微博热搜 / 百度指数  ┃  传播度实测  ┃  评级数据源  ┃ <\/p>\n<p>接入方式：`meme_harvest` minitool（待实现，规格：抓取/清洗/去重/传播度评级 → 产出 `梗素材表` 增量并入 KB）；实现前由调研步人工按上表整理，**梗素材表仍为 S1 必交付**。<\/p>\n<h3>三、与既有约束的关系<\/h3>\n<ul>\n<li>梗密度约束**不替代** C10 设定约束（`kb/market/setting-rules`）：梗要密度，设定要低代入成本，两条红线并行。<\/li>\n<li>题材选择本身受梗密度约束**反向影响**：同等条件下，优先选**梗储量高的领域**（如国球/职场/校园——全民梗库富矿），放弃梗荒领域（例：无公共记忆的架空科幻）。<\/li>\n<\/ul><\/section>\n<section><h1>选题素材.md<\/h1><h2>选题素材 · 拍魂（甲方需求，全新重跑 2026-09-16）<\/h2>\n<h3>甲方点子（改道指令，2026-09-15）<\/h3>\n<p>原方向电竞键魂，甲方改道：**乒乓球**，以\"德不配位\"公共情绪切入。<\/p>\n<h3>甲方指定参考<\/h3>\n<ul>\n<li>结构：灌篮高手（队伍线+大赛终点感）× 金牌得主（双主角互相成就）<\/li>\n<\/ul>\n<h3>甲方约束<\/h3>\n<ul>\n<li>形态：AI 漫剧竖屏，60 集体量<\/li>\n<li>合规红线：无真实运动员/协会名，全虚构<\/li>\n<\/ul><\/section>\n<section><h1>梗卡.md<\/h1><h2>梗卡 · 拍魂（p-key-soul · 乒乓竞技爽剧）<\/h2>\n<p>&gt; 内部过程物件（flows/topic-selection OUTPUT-FORMAT：不随对外四件套输出）。find-trope 五步产出。<\/p>\n<p>&gt; 数据快照：2026-09-15（kakaxing scriptrawstone，parsed 6928 部，全库均热度 10058 万）；产出日期 2026-09-16。<\/p>\n<p>&gt; 需求向：乒乓球 × \"德不配位\"公共情绪；结构参考 灌篮高手（队伍线+大赛终点）× 金牌得主（双主角互相成就）；AI 漫剧竖屏 60 集；route=dual；region=CN。<\/p>\n<p>&gt; 输入：选题素材.md + kb/trope/* + kb/market/snapshot + kb/market/structure + kb/market/meme-rules + kb/aesthetic/conflict-escalation + kb/aesthetic/style-routes。<\/p>\n<h3>一、查族：候选梗族饱和度总表（快照 2026-09-15）<\/h3>\n<p class=\"row\"> ┃  梗族  ┃  饱和度  ┃  n  ┃  均热度（万）  ┃  对本项目判定  ┃ <\/p>\n<p class=\"row\"> ┃  打脸虐渣  ┃  红海·有效  ┃  1510  ┃  18558  ┃  **主梗候选**：德不配位→当众清算的情绪直配引擎；进必须带新变体  ┃ <\/p>\n<p class=\"row\"> ┃  神豪暴富  ┃  上升期·蓝海偏好  ┃  380  ┃  18987  ┃  **辅梗候选**：取\"被低估硬核实力→当众降维\"机制，可直接主推  ┃ <\/p>\n<p class=\"row\"> ┃  赘婿战神  ┃  稳定·主流  ┃  192  ┃  10684  ┃  辅梗候选：仅取其\"强者回归\"轴；另引类目证据（强者回归 n=107 / 均 21803，强热度带）  ┃ <\/p>\n<p class=\"row\"> ┃  重生复仇  ┃  红海·有效  ┃  702  ┃  11978  ┃  不取：先知先手与\"当下清算\"的公共情绪错位；反派适应问题交给打脸引擎解决  ┃ <\/p>\n<p class=\"row\"> ┃  马甲掉马  ┃  红海·过饱和  ┃  750  ┃  9215  ┃  避开主线：热度已被拉到均值下方；其\"揭示瞬间\"由主梗变体吸收  ┃ <\/p>\n<p class=\"row\"> ┃  先婚后爱  ┃  稳定·主流  ┃  387  ┃  10092  ┃  不预设：本卡不写感情线，甲方要恋爱轴时另行过卡  ┃ <\/p>\n<p class=\"row\"> ┃  追妻火葬场  ┃  上升期·蓝海偏好  ┃  132  ┃  14218  ┃  不取：先虐后悔机制与本项目关系轴（互相成就）相反  ┃ <\/p>\n<p class=\"row\"> ┃  流放种田  ┃  上升期·蓝海偏好  ┃  92  ┃  22598  ┃  不取：苦地基建机制无法移植竞技载体  ┃ <\/p>\n<p class=\"row\"> ┃  真假千金  ┃  退潮期·慎入  ┃  83  ┃  7938  ┃  避开  ┃ <\/p>\n<p class=\"row\"> ┃  团宠护短  ┃  退潮期·慎入  ┃  63  ┃  2703  ┃  避开：队伍线禁写\"全员宠\"  ┃ <\/p>\n<p class=\"row\"> ┃  豪门财富(NA) / 狼人命定(NA) / 奇幻生物(NA)  ┃  过饱和 / 退潮 / 退潮  ┃  895 / 359 / 161  ┃  228 / 167 / 234  ┃  与 CN 项目无关，仅备查  ┃ <\/p>\n<p>类目级旁证（CN，n≥100）：打脸 n=536 / 均 22657；逆袭 n=1042 / 均 20955；强者回归 n=107 / 均 21803——三者皆强热度带，主梗组合正落于此。<\/p>\n<p>**语料未覆盖声明**（判定纪律 4）：快照 CN 类目无\"体育/竞技\"；NA Sports-Romance n=111 / 均 1225 万，远低于 NA 强带。竞技载体在语料中供给稀薄——这是蓝海窗口，同时意味着无成熟套路护栏。本卡不编数据，爆点强度以对标件标尺兜底；竞技专业细节留调研步补课。另按 meme-rules 第三节\"同等条件优先选梗储量高的领域（如国球）\"：乒乓球是全民梗库富矿，梗密度硬指标可满足，反向支撑甲方改道落地。<\/p>\n<h3>二、梗卡<\/h3>\n<p>```text<\/p>\n<p>梗卡：<\/p>\n<p>  主梗：打脸虐渣梗（红海·有效 / n=1510 / 均 18558 万 vs 全库均值 10058 万，快照 2026-09-15）<\/p>\n<p>        取\"受辱蓄力→当众清算\"机制，本题译作\"德不配位→当众拉下\"。<\/p>\n<p>        红海·有效进场的强制新变体：「计分板清算」（见新变体落点）。<\/p>\n<p>  辅梗：神豪暴富梗·隐藏实力变体（上升期·蓝海偏好 / n=380 / 均 18987 万）<\/p>\n<p>        × 赘婿战神梗·强者回归轴（稳定·主流 / n=192 / 均 10684 万；横切类目\"强者回归\" n=107 / 均 21803 万）<\/p>\n<p>        相性说明：<\/p>\n<p>        - 隐藏实力变体改变主梗的选择条件——\"何时打脸\"从情绪事件变成主角每集的<\/p>\n<p>          策略变量（藏/露）：蓄力期有主动理由（护队友、避开占位者把持的选拔通道），<\/p>\n<p>          不是编剧强按头；揭示节奏按 b016 两段式（小露一手引搜寻→关键局当众全开）。<\/p>\n<p>        - 强者回归轴改变主梗的对手轴与清算性质——反派不是抽象恶人，是\"占着他位置的<\/p>\n<p>          人\"；清算从\"惩罚坏人\"升级为\"物归原主\"，正对\"德不配位\"的镜像。<\/p>\n<p>          对立统一过检：占位者立场自洽（有付出、被资方裹挟），非一边全错。<\/p>\n<p>        - 双辅梗互挂即金牌得主结构：A（隐藏实力·被低估者）× B（强者回归·被夺位者）<\/p>\n<p>          互为爆点触发器——B 是唯一看出 A 底细的发现者，A 是 B 证明\"当年不是我不行\"<\/p>\n<p>          的活证据。互相成就 = 爽点触发器互挂，不是感情戏占时长（过副线纪律）。<\/p>\n<p>  新变体落点：「计分板清算」——三轴都新：<\/p>\n<p>        - 人设轴新：隐藏实力载体 = 陪练/被退队者（链上全是保洁精算/焊工/流水线/药房/<\/p>\n<p>          审计/走秀大妈，无运动员陪练）；反派 = 资方造星\"占位太子\"（青训嫡系+流量包装），<\/p>\n<p>          \"德不配位\"的具象化。<\/p>\n<p>        - 场景轴新：实时计分赛场 × 直播切片 × 积分榜公开账本——\"当众\"的竞技化放大器：<\/p>\n<p>          比分即判决书、慢镜回放即证据链、积分榜即公开账本。打脸链已用落点（兵棋沙盘/<\/p>\n<p>          机械改装/学术打假/查账/镬气/走秀）无一处用计分清算。<\/p>\n<p>        - 关系轴新：双主角互为触发器（发现者×被证明者）；对手轴 = 占位者集团（嫡系<\/p>\n<p>          教练组/资方/数据包装），非情敌非豪门非婆媳——竞技关系轴在链上空白。<\/p>\n<p>  对标件：kb/benchmark/b003-cn《草包状元：开局沙盘点崩十军》（150000 万 / A）<\/p>\n<p>          爆点位置 = 开局金殿当众立军令状+沙盘算崩杀阵——用作\"当众清算烈度上限\"标尺<\/p>\n<p>          （对应本项目首章资格赛当众打崩占位者的强度基准）。<\/p>\n<p>          kb/benchmark/b016-fam《扫地姑娘是百亿精算师》（94000 万 / A+，hot 档亲和）<\/p>\n<p>          爆点位置 = 白板夜演引全城搜寻→对赌局当众徒手复原数据——用作\"隐藏实力两段式<\/p>\n<p>          揭示节奏\"标尺。<\/p>\n<p>          kb/benchmark/b027-s《给大妈爆改后我成了顶流》（S 级 / AI 评 91）<\/p>\n<p>          爆点位置 = 露天广场连夜搭台走秀引爆全网（黑热搜→全民共鸣的舆论翻转+群像<\/p>\n<p>          终点战）——用作\"大赛终点 × 舆论场翻转\"标尺（灌篮高手大赛终点感的放大器）。<\/p>\n<p>  风险：- 过饱和警告：马甲掉马族（n=750 / 均 9215 万）贴脸——隐藏实力只服务打脸时机<\/p>\n<p>          纪律，禁\"身份收集/层层撕马甲\"写法，掉马当清算的瞬时态不当主线，否则跌入<\/p>\n<p>          过饱和带热度陷阱。<\/p>\n<p>        - 退潮预警：团宠护短（均 2703 万）、真假千金（均 7938 万）不入主线——队伍线<\/p>\n<p>          靠战友情与各自执念驱动，不写全员宠主角。<\/p>\n<p>        - 语料未覆盖：竞技载体无 CN 类目、NA 体育带热度低——供给稀薄=窗口，但无<\/p>\n<p>          套路护栏；强度只能挂对标标尺，竞技专业度留调研步核实，不许编。<\/p>\n<p>        - 合规：全虚构——无真实运动员/协会/赛事/赞助商名；\"德不配位\"只借公共情绪，<\/p>\n<p>          占位者集团不得影射真实事件或人物（\"饭圈\"议题只取情绪不点名）。<\/p>\n<p>        - 版权：《灌篮高手》为甲方指定结构参考，致敬位须原创改编台词，不得直接引用。<\/p>\n<p>        - 关系线：双主角默认按\"互相成就\"写（师徒/搭档双可）；甲方点名要恋爱轴时，<\/p>\n<p>          另挂先婚后爱族重新过卡，本卡不预设。<\/p>\n<p>```<\/p>\n<h3>三、网络热梗素材表（meme-rules S1 硬指标，≥10 条）<\/h3>\n<p>评级口径：定性评级（极高=全网刷屏级；高=多平台通用；中=圈层内高传），来源对表 meme-rules 第二节源清单；`meme_harvest` minitool 未实现，本次为人工评级。所有条目不含真实运动员/协会名。<\/p>\n<p class=\"row\"> ┃  #  ┃  梗名  ┃  来源与传播度评级  ┃  可挂接的场景示例  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  不讲武德 / 耗子尾汁  ┃  2020 年武术访谈名场面，全网刷屏（极高）  ┃  反派场外使绊被嘲；主角用规则内骚操作反杀后的赛后采访位  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  退退退  ┃  抖音名场面（极高）  ┃  主角连续防转攻，把对面三板爆冲全挡回去，\"退退退\"节奏慢镜切片  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  六边形战士  ┃  日媒乒乓雷达图解说玩梗，已泛化为\"全能者\"代称，不指向具体人物（体育/二次元圈层极高）  ┃  集尾主角能力雷达图可视化（竖屏 AI 漫剧天然适配数据可视化）  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  \"教练，我想打____\"  ┃  《灌篮高手》三井寿名场面，二次元母梗（极高；甲方指定参考）  ┃  强者回归主角归队致敬位——台词必须原创改编，版权红线  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  让二追三  ┃  体育解说通用语（高）  ┃  决胜局 0:2 落后翻盘的解说词与切片标题位  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  \"不配上桌\"  ┃  职场/圈层话语高传梗（高）  ┃  与球桌双关：被嘲\"陪练不配上桌\"→把对面打\"下桌\"。本项目独有的双关嫁接位  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  杀疯了  ┃  B 站/网络通用（高）  ┃  主角连得分段的弹幕位、解说词位  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  破防了  ┃  网络通用（高）  ┃  占位太子连丢分、黑粉刷屏被反杀后的反应戏  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  塌房  ┃  饭圈通用（高）  ┃  太子当众翻车后：广告连夜撤牌、后援群解散的快剪  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  饭圈入侵体育圈  ┃  近年官媒批评的公共议题词（极高，公共情绪）  ┃  资方流量造星 vs 实力派的世界观底噪——\"德不配位\"的现实共振位（不点名任何真实事件）  ┃ <\/p>\n<p class=\"row\"> ┃  11  ┃  小丑竟是我自己  ┃  网络通用（高）  ┃  太子发现自己是资方白手套工具人时的自嘲位  ┃ <\/p>\n<p class=\"row\"> ┃  12  ┃  \"我不要你觉得，我要我觉得\"  ┃  综艺\"明学\"名场面（高）  ┃  霸道资方总监强拍换人决策——后期被打脸回收的伏笔台词  ┃ <\/p>\n<p class=\"row\"> ┃  13  ┃  实力不允许我低调  ┃  网络流行语（高）  ┃  掉马集标题位/主角当众亮实力台词位  ┃ <\/p>\n<p class=\"row\"> ┃  14  ┃  爷青回  ┃  B 站高传（高）  ┃  老将/原天才复出首胜的弹幕共振位  ┃ <\/p>\n<p class=\"row\"> ┃  15  ┃  这波在大气层  ┃  电竞解说梗（高）  ┃  教练组神换人、战术骗招被解描述评位  ┃ <\/p>\n<p class=\"row\"> ┃  16  ┃  用魔法打败魔法  ┃  网络通用（高）  ┃  主角用以彼之道的发球反制对方阴招  ┃ <\/p>\n<h3>四、发散性拆解（meme-rules：主梗/新变体各拆 ≥3 个跨场景复用用法）<\/h3>\n<p>**主梗新变体「计分板清算」**<\/p>\n<p>1. 对话梗：口癖\"比分不说谎\"——解说/教练/主角三人复读，3 集内 3 变奏（hot 档金句复读纪律），任何对局/采访/发布会场景通用。<\/p>\n<p>2. 场面梗：慢镜回放当证据链——每一板拆给\"看不懂球\"的观众，翻案戏通用件（黑哨/误判/让球质疑全靠它清算）。<\/p>\n<p>3. 切片梗：11 分制单挑局、让二追三大逆转、\"不配上桌\"球桌双关——不依赖前后剧情可独立转发。<\/p>\n<p>**辅梗 1「隐藏实力」**<\/p>\n<p>1. 对话梗：\"他就是个捡球的\"→递拍/缠胶皮的手部特写露底——\"行家一出手\"模板，任何场景可复用。<\/p>\n<p>2. 场面梗：深夜训练馆一盏灯 × 发球机（扫地姑娘白板夜演的乒乓转译），蓄力戏通用件。<\/p>\n<p>3. 切片梗：\"实力不允许我低调\"掉马名场面；握拍/胶皮细节党的考据向切片。<\/p>\n<p>**辅梗 2「强者回归」**<\/p>\n<p>1. 对话梗：\"名字是打回来的，不是发回来的\"——归队、领装备场景通用。<\/p>\n<p>2. 场面梗：蒙尘奖杯擦拭开场、旧球衣号码特写——回归仪式感通用件。<\/p>\n<p>3. 切片梗：\"爷青回\"复出首胜；\"教练，我想打____\"致敬位（原创改编）。<\/p>\n<p>**反派轴「德不配位」（随主梗附赠）**<\/p>\n<p>1. 对话梗：\"这位置是资源买的，还是比分买的？\"<\/p>\n<p>2. 场面梗：发布会吹上天 → 次日资格赛一轮游的对照剪辑。<\/p>\n<p>3. 切片梗：塌房三连快剪（撤广告/散超话/资方撇清）——现实塌房流程的戏剧化。<\/p>\n<h3>五、前三章梗点密度自查（meme-rules 硬指标·预布点）<\/h3>\n<p>按 60 集 = 10 章 × 6 集的切分建议，前三章 = 第 1-18 集。本表是**梗资源预布点**（供 S2 结构 / S3 大纲校准），不是结构决定——每集至少 1 处可独立切片传播的梗点：<\/p>\n<p class=\"row\"> ┃  集  ┃  可切片梗点  ┃ <\/p>\n<p class=\"row\"> ┃  1  ┃  选拔黑幕一瞬（被\"安排\"的比分特写）+ 陪练当众受辱——打脸引擎点火位  ┃ <\/p>\n<p class=\"row\"> ┃  2  ┃  \"不配上桌\"球桌双关羞辱（切片位）  ┃ <\/p>\n<p class=\"row\"> ┃  3  ┃  强者回归主角登场：蒙尘奖杯/旧号码（回归仪式梗点）  ┃ <\/p>\n<p class=\"row\"> ┃  4  ┃  发现者瞬间：看破缠胶皮手法（细节暴露梗点）  ┃ <\/p>\n<p class=\"row\"> ┃  5  ┃  替补热身小露一手引骚动（\"实力不允许低调\"预告位）  ┃ <\/p>\n<p class=\"row\"> ┃  6  ┃  章尾钩：\"我不要你觉得\"资方强拍换人（打脸伏笔台词）  ┃ <\/p>\n<p class=\"row\"> ┃  7  ┃  资格赛首胜：\"退退退\"防守反打慢镜（切片位）  ┃ <\/p>\n<p class=\"row\"> ┃  8  ┃  \"他就是个捡球的\" vs 慢镜回放首秀（回放即证据链首次启用）  ┃ <\/p>\n<p class=\"row\"> ┃  9  ┃  神秘陪练传闻发酵（b016 式\"全城搜寻\"线启动）  ┃ <\/p>\n<p class=\"row\"> ┃  10  ┃  占位太子发布会吹嘘（对照剪辑梗点埋设）  ┃ <\/p>\n<p class=\"row\"> ┃  11  ┃  \"这波在大气层\"：教练组骗招得手  ┃ <\/p>\n<p class=\"row\"> ┃  12  ┃  二连胜 + 积分榜抬头（公开账本首次亮给观众）  ┃ <\/p>\n<p class=\"row\"> ┃  13  ┃  太子丢分破防名场面（切片位）  ┃ <\/p>\n<p class=\"row\"> ┃  14  ┃  黑哨质疑 → 慢镜回放翻案（场面梗复用）  ┃ <\/p>\n<p class=\"row\"> ┃  15  ┃  强者回归主角复出首胜\"爷青回\"（切片位）  ┃ <\/p>\n<p class=\"row\"> ┃  16  ┃  \"用魔法打败魔法\"发球反制阴招  ┃ <\/p>\n<p class=\"row\"> ┃  17  ┃  塌房前兆：赞助连夜撤牌（塌房三连第一拍）  ┃ <\/p>\n<p class=\"row\"> ┃  18  ┃  章尾爆：\"比分不说谎\"当众清算首发位——口癖完整版首现，强度对标 b003 金殿位  ┃ <\/p>\n<h3>六、判定纪律留痕<\/h3>\n<p>1. **数据日期**：所有 n / 均热度引快照 2026-09-15；判定口径按 kb/market/structure（n + 均热度，单部爆点不算带）。<\/p>\n<p>2. **语料未覆盖**：竞技载体（CN 无类目；NA Sports-Romance n=111 / 均 1225 万）——结论只用对标兜底，未编数据。<\/p>\n<p>3. **路线适配**（kb/aesthetic/style-routes，route=dual）：本梗组合双档兼容——hot 档每集按 打脸/当众/反杀 keywords 布点、回击时差 ≤2 拍、口癖复读；calm 档 9:1 浓度（预选赛长蓄力+决赛单爆点）、物件母题 ≥2（蒙尘奖杯/旧胶皮）。档位是风格参数，不影响梗选型（判定纪律 2）。<\/p>\n<p>4. **相性检查留痕**：`check_trope_combo` minitool 未实现（tools/ 无脚本），按梗族元数据 + kb/aesthetic/conflict-escalation 副线纪律人工过检：两辅梗均改变主梗选择条件（藏露策略变量 / 对手轴换轴），非占时长；对立统一过检（占位者立场自洽）。<\/p>\n<p>5. **创新亮点回指**（判定纪律 3）：后续方案的创新亮点段必须能回指「计分板清算」三轴新变体（人设轴：陪练载体与占位太子；场景轴：计分/回放/积分榜；关系轴：发现者×被证明者互为触发器）——答不上来 = 假新意，打回重写。<\/p><\/section>\n<section><h1>内部/断言报告-combo.json<\/h1><p>{<\/p>\n<p>  \"mode\": \"integrity\",<\/p>\n<p>  \"node\": \"combo\",<\/p>\n<p>  \"minitool\": \"check_trope_combo\",<\/p>\n<p>  \"checked\": [<\/p>\n<p>    \"梗卡.md\"<\/p>\n<p>  ],<\/p>\n<p>  \"results\": [<\/p>\n<p>    {<\/p>\n<p>      \"name\": \"exists\",<\/p>\n<p>      \"status\": \"pass\",<\/p>\n<p>      \"detail\": \"6847 chars\"<\/p>\n<p>    },<\/p>\n<p>    {<\/p>\n<p>      \"name\": \"no-debris\",<\/p>\n<p>      \"status\": \"pass\"<\/p>\n<p>    }<\/p>\n<p>  ],<\/p>\n<p>  \"note\": \"M1 integrity 模式；check_aesthetic_asserts 66 条美学断言 M2 接入\"<\/p>\n<p>}<\/p><\/section>\n<section><h1>内部/kb-benchmark.md<\/h1><h2>KB 装载 · benchmark（竞品对标装载）<\/h2>\n<p>&gt; 由 miniflow kernel kb_load 内建装载，来源 28 个知识文件。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b001-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b001-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 仵作状元：开局金殿断奇案\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎\",<\/p>\n<p> \"heat_w\": 150000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"88\",<\/p>\n<p> \"family\": \"zhuangyuan-keju\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2092069559019122688\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 仵作状元：开局金殿断奇案<\/h2>\n<p>&gt; CN 市场 · 男频 · A+ 级（AI 评 88） · 热度 150000 万 · 梗族：科举逆袭梗<\/p>\n<ul>\n<li>**一句话卖点**：买榜草包开局替罪临斩，现代法医金殿验骨洗雪灭门冤案逆袭大理寺卿。<\/li>\n<li>**题材**：爽剧/逆袭, 穿越流, 架空历史, 悬疑断案, 扮猪吃虎<\/li>\n<li>**共情点**：击中职场普通人背黑锅、被全员认定能力不足百口莫辩的委屈，渴望专业降维打脸自证。<\/li>\n<li>**爽点内核**：以绝对刑侦技术对草菅人命的权臣进行降维打击，在众目睽睽下洗脱罪名反转绝杀。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将文抄打脸微创为硬核法医断案，强化智力碾压与悬疑张力。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代首席法医穿越为京城第一草包沈浪，原主因花重金买通考官混入大理寺，恰逢皇室重宝失窃案暴雷，政敌严党趁机将他推上金銮殿当作替罪羊定为死罪。面临当场问斩死局，沈浪果断撕碎纨绔伪装，凭借现代微量物证与法医解剖知识，金殿之上隔空验尸断案，三炷香内揪出真正盗宝内鬼，奇迹般反杀脱罪并被御赐查案特权。沈浪借机深入朝堂，暗中调查沈家满门被诬陷通敌的陈年旧案，面对刑部与外戚世家的连环构陷，他以痕迹学破奇案、以逻辑侧写抓内奸，屡破京城惊天悬案。在此期间，原本对他鄙夷至极的冷面女首辅被其折服，在生死危局中暗送机密，两人在杀机四伏的暗巷中近身藏匿，呼吸交融间情愫暗生。随着真相大白，幕后黑手联合藩王兵变逼宫，沈浪以奇谋瓦解死局，亲手将仇敌送上断头台，从人人唾弃的替罪草包彻底登顶为执掌天下刑狱的第一权臣。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b002-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b002-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 败家状元：开局做空敌国商会\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎\",<\/p>\n<p> \"heat_w\": 150000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"85\",<\/p>\n<p> \"family\": \"zhuangyuan-keju\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2092069560063504384\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 败家状元：开局做空敌国商会<\/h2>\n<p>&gt; CN 市场 · 男频 · A+ 级（AI 评 85） · 热度 150000 万 · 梗族：科举逆袭梗<\/p>\n<ul>\n<li>**一句话卖点**：败光家产的假状元被逼补千万亏空，现代操盘手用降维金融战做空敌国问鼎首辅。<\/li>\n<li>**题材**：爽剧/逆袭, 穿越流, 商业逆袭, 架空朝堂, 扮猪吃虎<\/li>\n<li>**共情点**：击中当代年轻人背负债务危机、被资方与小人压榨剥削的无力感，渴望财力逆天暴富破局。<\/li>\n<li>**爽点内核**：以现代资本运作和算力认知差疯狂收割古代权臣与敌国财阀，实现财富与权力的绝对碾压。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将朝堂文斗微创为现代金融商战，做空国运爽感拉满。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代顶级量化操盘手苏林穿越成败家世子，原主不仅败光祖业，还借高利贷买通考官混成户部新科状元。开局即逢国库暴雷亏空千万两，内阁首辅趁机发难，逼他三日内补齐亏空否则全家抄斩。面对必死绝境，苏林运用现代金融做空与杠杆原理，以荒唐的赌石和粮券为幌子，诱导满朝贪官与敌国商会入局对赌，一夜之间狂揽三千万两白银填平国库，让企图看笑话的百官当场惊骇瘫软。为保住侯府并查明生母被毒害真相，苏林表面继续挥金如土扮作疯批财神，暗中建立横跨诸国的商贸情报网。敌国首富之女携万金前来经济绞杀，却在生死商战博弈中屡屡被苏林算无遗策所征服，密室对峙时被逼至墙角气息紊乱甘愿奉上全部底牌。最终敌国联合权臣发动粮荒逼宫，苏林以汇率战瞬间搞垮敌国经济，手刃仇敌，从全京城笑柄一跃成为掌控帝国经济命脉的无冕之王。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b003-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b003-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 草包状元：开局沙盘点崩十军\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈\",<\/p>\n<p> \"heat_w\": 150000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"83\",<\/p>\n<p> \"family\": \"zhuangyuan-keju\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2092069560269025280\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 草包状元：开局沙盘点崩十军<\/h2>\n<p>&gt; CN 市场 · 男频 · A 级（AI 评 83） · 热度 150000 万 · 梗族：科举逆袭梗<\/p>\n<ul>\n<li>**一句话卖点**：换得虚名文状元的纨绔质子，在敌国围城之际用现代兵法沙盘推演一战封神。<\/li>\n<li>**题材**：爽剧/逆袭, 穿越流, 兵棋推演, 架空争霸, 权谋博弈<\/li>\n<li>**共情点**：击中普通人面对强权压制时被边缘化、被当作炮灰的屈辱，渴望在绝境中展现统御全场的实力。<\/li>\n<li>**爽点内核**：以现代超维战术兵法降维碾压古代名将与奸佞，从任人宰割的弃子逆天登顶为镇国统帅。<\/li>\n<li>**创新亮点**：对标剧《谁说纨绔不能当状元》，将文状元微创为兵法奇才，用现代兵棋推演制造反转。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：现代兵棋推演教官陆宵穿越成敌国为质多年的镇北王幼子，原主为了苟活行贿考官混得文状元虚名，沦为满朝笑柄。恰逢敌国百万铁骑兵临城下并派出使臣金殿威逼割地，主和派权臣趁机进谗推陆宵去前线充当死士炮灰。面对绝命杀局，陆宵在金銮殿当众立下军令状，以现代几何沙盘展开多维战术推演，顷刻间算崩敌国使臣布下的千古杀阵，语惊四座令帝王拜服赐予兵权。为替惨死的镇北军洗刷叛国冤屈，陆宵表面狂放荒唐纵情声色以麻痹政敌，暗中推行特种战术与后勤现代化改革。敌国冷艳刺客公主潜入刺杀却被反制，昏暗帐中兵刃相抵间被其无双韬略彻底折服，由仇敌转为甘愿为他刺探军情的暗桩。最终叛相引敌军围困京师，陆宵亲率奇兵以闪电战包抄敌后全歼叛军诛杀主谋，从人人唾弃的草包质子终成威震天下的帝国第一镇国战神。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b004-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b004-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 天灾流放，我靠百亿空间养活瞎眼杀神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"空间囤粮，天灾末世，宅斗权谋，强强救赎\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"87\",<\/p>\n<p> \"family\": \"chongsheng-fuchou\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427127161913344\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 天灾流放，我靠百亿空间养活瞎眼杀神<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 87） · 热度 129000 万 · 梗族：重生复仇梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：手握百亿空间的黑莲花，在极寒流放地捡了个瞎眼杀神当夫君<\/li>\n<li>**题材**：空间囤粮，天灾末世，宅斗权谋，强强救赎<\/li>\n<li>**共情点**：受众：满足在恶劣环境、天灾之下渴望无限物资的安全感，以及手撕绿茶极品、玩转男神的爽感<\/li>\n<li>**爽点内核**：内核：在冰冷天灾里用无限物资筑起温暖堡垒，两个极度自私破碎的灵魂在互相利用中完成终极救赎<\/li>\n<li>**创新亮点**：亮点：空间囤货配合AIGC生成的风雪、冰暴等天灾特效，视觉对比极强，瞎眼杀神白切黑的极致拉扯<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：顾明霜前世是被至亲背叛、最终在极寒中冻死的世家嫡女，她的致命缺陷是极度多疑、不信任任何人。重生回到全家被流放前夕，她觉醒了无限囤货的百亿储物空间。顾明霜搬空了死敌的国库与粮仓，在发配寒荒的路上，当所有人都在风雪中挨饿受冻时，她却在自己的马车里吃着火锅烤肉。在流放之地的乱石岗，她为了寻找一个强大的保镖（核心欲望：在乱世中绝对安稳地活下去），用一块热饼换回了快要病死、双目失明的奴隶白发少年。她不知道这个叫墨苍的少年，正是被废黜的白发杀神。墨苍冷血残酷，却唯独在顾明霜面前乖巧得像只温顺的狼犬。顾明霜在寒荒冰原上开辟良田、建立坚不可摧的暖谷要塞，更因为无限的粮食被绝望的十万流民当成悲悯世人的神女。当墨苍的眼睛复明、重掌天下杀权，所有曾欺辱顾明霜的仇人跪地颤抖时，顾明霜才明白，这个男人早就将灵魂献祭给了她（深层需求：治愈多疑的内心，接纳真正的偏爱），他杀尽天下人，只为给她撑起一片无忧无虑的暖冬温床。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b005-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b005-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 荒漠驿站：光脑美食养战神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"科幻穿越，美食基建，甜宠逆袭，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"86\",<\/p>\n<p> \"family\": \"zhuxu-zhanshen\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067064854056665088\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 荒漠驿站：光脑美食养战神<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 86） · 热度 129000 万 · 梗族：赘婿战神梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：AI学家用能变出抽水机的牛肉面，套牢了被全城通缉的冷面刀客<\/li>\n<li>**题材**：科幻穿越，美食基建，甜宠逆袭，AIGC<\/li>\n<li>**共情点**：受众：热爱高概念科技感与美食疗愈的年轻女性，击中在大城市焦虑中渴望安全庇护的心理<\/li>\n<li>**爽点内核**：内核：用科技降维打击恶劣自然，用美食治愈破碎英雄，夫妻携手建起荒漠中最坚固的绿洲帝国<\/li>\n<li>**创新亮点**：亮点：科幻光脑与古装荒漠的美学碰撞，美食不仅能吃还能具现科技设备，契约婚姻下的读心术反差让暧昧张力拉满<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：盛晚是未来世界后勤AI学家，携带着光脑合成空间穿越到大旱两年的边关黄沙地。她继承了一个破烂的荒漠驿站。面对四处肆虐的流寇，盛晚一眼相中了昏迷在驿站门口、浑身是伤的冷面刀客霍骁。霍骁曾是威震边疆的守卫者，却被奸人诬陷而功力尽废。盛晚具有严重的被迫害妄想症，她急需强大的保镖。盛晚利用光脑将美食与科技结合，做出的红烧肉能疗伤，牛肉面能具现出微型抽水机。她提出契约婚姻，她负责神级后勤，霍骁当安保大队长。在漫天黄沙中，他们建起了全科技覆盖的绿洲城堡。霍骁惊奇地发现自己能听到盛晚脑中的科技蓝图，两人的默契达到诡异的巅峰。霍骁在盛晚的科学调教下恢复神力并集结旧部，彻底清算叛贼（核心欲望：盛晚想在荒漠躺平，却被迫推着霍骁成为荒漠之王），两人共同开启了科技大漠的新秩序。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b006-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b006-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 深海炼金：我把人鱼养成了皇\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"魔幻逆袭，深海种田，萌宠经营，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"85\",<\/p>\n<p> \"family\": \"yangcheng-huibao\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067064854241214464\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 深海炼金：我把人鱼养成了皇<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 85） · 热度 129000 万 · 梗族：养成回报梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：海洋馆长流放孤岛，用炼金术把捡来的废柴人鱼养成了深海霸主<\/li>\n<li>**题材**：魔幻逆袭，深海种田，萌宠经营，AIGC<\/li>\n<li>**共情点**：受众：追求瑰丽视觉奇观与极致占有欲男主的女性观众，击中女性对神秘力量与偏爱的向往<\/li>\n<li>**爽点内核**：内核：你用海洋庇护我的身躯，我用烈火与黄金为你铸造最璀璨的王冠，双强携手制霸海陆<\/li>\n<li>**创新亮点**：亮点：AIGC完美呈现发光海底、人鱼眼泪化作珍珠、沧龙拉车等瑰丽奇观，傲娇人鱼与高冷馆长的契约甜宠极其好嗑<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：虞娇是现代海洋馆馆长，穿越到孤悬海外、资源匮乏的极恶荒岛。作为罪民之女，她开局被村民逼着祭海。虞娇靠着深海沟通异能不仅没淹死，还在海底捞出了一只遍体鳞伤、被当成废鱼丢弃的蓝发男子澜沧。澜沧其实是遭遇背叛而失忆的深海人鱼皇。虞娇对人类防备心极重，但对海洋生物却无比温柔。她决定和澜沧假结婚，虞娇在荒岛上用炼金术提取深海矿物修筑避风港，种植海底灵药，指挥大白鲨运输队，将荒岛打造成海上帝国的贸易核心。澜沧在虞娇的无限宠溺和美食滋养下逐渐恢复记忆与神力，从傲娇小人鱼变成了占有欲极强的深海霸主（核心欲望：将荒岛建设成最安全的避风港）。当贪婪的外敌舰队降临荒岛时，澜沧掀起万丈巨浪，而虞娇驾驭着深海巨兽，两人彻底改写了海陆规则，虞娇也治愈了自闭的创伤。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b007-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b007-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 荒沙之上，罪妻手握机械狂潮\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"穿越种田，赛博古风，爽剧逆袭，残疾战神\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"xianhun-lianai\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427126981558272\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 荒沙之上，罪妻手握机械狂潮<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：先婚后爱梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：末世机械姬嫁给瘫痪废柴世子，用废铜烂铁打造塞博古风边塞<\/li>\n<li>**题材**：穿越种田，赛博古风，爽剧逆袭，残疾战神<\/li>\n<li>**共情点**：受众：喜欢搞事业、反套路女主、以及迷恋冷面硬汉被科技武装后疯狂打脸反击的女性群体<\/li>\n<li>**爽点内核**：内核：无情机械脑与落魄残疾世子的实用主义婚姻，在绝对力量与重金属美学中绽放的极致安全感<\/li>\n<li>**创新亮点**：亮点：将古风与硬核机械、蒸汽朋克完美融合，AIGC生成的金属异兽、古风机甲极具视觉震撼力<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：叶清是末世顶级的机械改造师，性格冰冷，理性至极，唯一的致命缺陷是对人类情感完全不敏感。她意外穿越到大靖王朝的荒沙边塞，成为一名发配冲喜的罪女，嫁给双腿瘫痪、被家族抛弃的废柴世子陆景川。陆景川心冷如冰，本以为这只是又一次羞辱，冷漠拒绝叶清的靠近。但叶清的核心欲望在古代重组：她要在这片荒凉废土上收集废铁，重建她的机械帝国。她与陆景川达成合作，她负责修复他的双腿并提供防卫，他负责提供边疆名分。叶清利用机械感知能力，将边荒的废弃古矿、破旧农具改装成自动灌溉的微型机械水源、精钢骨骼轮椅，甚至收服了沙漠中暴虐的机械化铁甲巨蜥。在叶清源源不断的降维科技武装下，原本等死的陆景川不仅重新站了起来，更在战场上化身重型装甲战神，横扫外敌。在一次次生死相依中，叶清那颗冰冷的机械心脏被陆景川炽热而偏执的深情融化，她不再将他视为合作伙伴（深层需求：学会信任与去爱），陆景川也彻底化身护妻狂魔，誓死守护他的赛博神女。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b008-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b008-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 流放荒岛：我契约巨兽养出海上帝王\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"荒岛求生，控水神豪，爽剧逆袭，先婚后爱\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"liufang-zhongtian\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427119192735744\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 流放荒岛：我契约巨兽养出海上帝王<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：流放种田梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：海洋学家携控水异能被贬蛮荒海岛，驯服深海巨兽养出海上帝王<\/li>\n<li>**题材**：荒岛求生，控水神豪，爽剧逆袭，先婚后爱<\/li>\n<li>**共情点**：受众：25至45岁女性，钟爱海岛种田、赶海修仙及独立女强逆风翻盘，击中追求绝对自由与掌控力的心理<\/li>\n<li>**爽点内核**：内核：将一片被世人遗弃的死亡之海，用智慧与海兽契约亲手打造成海上黄金帝国，体验绝对的降维打击<\/li>\n<li>**创新亮点**：亮点：海岛赶海种田与深海巨兽契约的完美结合，避开了俗套的陆地斗争，AIGC生成的斑斓海底世界极具视觉诱惑<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：云汐是顶尖的海洋生物学家，因得罪权贵被流放到被称为恶魔之眼的蛮荒孤岛，并被迫嫁给岛上那个被废黜、满身戾气的落魄皇子战云烈。战云烈曾是帝国最耀眼的将星，如今因功高盖主被废黜，性格暴躁且充满毁灭欲。云汐的致命缺陷是严重的逃避型人格，习惯用冷漠和旁观者的姿态来面对危机。起初她只想利用自己能够操控海水和沟通海洋生物的异能，在荒岛默默赶海积攒物资逃往海外。但战云烈虽然厌世，却在海盗夜袭时用自己的身体挡住了射向她的毒箭。那一刻，云汐的逃避面具碎裂，她治愈了战云烈的内伤，并契约了守岛的九头巨蛸，将荒岛海域变成了天然的防御屏障。她带领岛民开展珍珠养殖、提炼精盐、甚至开辟了海上丝绸之路。战云烈在她的支持下重新凝聚旧部，完成从自我放弃到海上帝王的救赎转变，最终驾驶着巨兽牵引的无敌舰队踏平所有背叛者。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b009-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b009-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 暴雪封关，我靠种田捂热冷酷战神\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"极寒种田，异能逆袭，先婚后爱，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"zhuxu-zhanshen\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427119012380672\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 暴雪封关，我靠种田捂热冷酷战神<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：赘婿战神梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：极地植物学家携暖房系统穿到冰川边关，把冷酷弃将养成雪原霸主<\/li>\n<li>**题材**：极寒种田，异能逆袭，先婚后爱，AIGC<\/li>\n<li>**共情点**：受众：22至45岁女性，偏爱基建爽感与糙汉甜宠，渴望在恶劣环境中与伴侣共同奋斗逆袭的心理代偿<\/li>\n<li>**爽点内核**：内核：从一无所有的冻土废墟到冰川之巅的巍峨要塞，温度差带来最炽热的救赎与并肩作战的极致爽感<\/li>\n<li>**创新亮点**：亮点：将极寒末世求生与古代基建完美结合，AIGC精准渲染冰雪神迹与巨狼坐骑的奇幻奇观，双向救赎拉满<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：顾宛宁是现代顶尖的极地植物学家，意外穿成大楚王朝被贬至北疆冰川的罪臣之女。在这个连年暴雪、滴水成冰的绝境，她被指配给被剥夺一切且冷酷失势的前北境统帅陆九渊。陆九渊性格孤僻冷硬，坚信自己是天煞孤星，对她百般防备，甚至直言不需要累赘。顾宛宁的致命缺陷是极度的情感洁癖与利己主义，起初她只想利用自己的极地大棚系统在雪地里培育暖冬作物，实现物资垄断并伺机逃离北疆。然而，当陆九渊在雪崩中拼死将她护在身下，用残存的体温救活她最后一株麦苗时，她的情感防线彻底崩塌。她利用木系治愈异能催生冰雪灵芝，治好了陆九渊的旧疾，还带领流民在万丈冰川下建立起抗寒蔬菜基地。原本冷酷的陆九渊在她的温暖下逐渐化为忠犬。当朝廷奸臣试图再次迫害他们时，顾宛宁已带领北境军民在冻土之上建立起钢铁要塞，而陆九渊则在她的雄厚后勤支持下，一步步踏碎阴谋，成为名震天下的雪原战神。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b010-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b010-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 大漠狂沙：我驯服异兽与糙汉将军\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"御兽开荒，荒漠求生，爽剧逆袭，奇幻脑洞\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"84\",<\/p>\n<p> \"family\": \"liufang-zhongtian\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067427118672642048\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 大漠狂沙：我驯服异兽与糙汉将军<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 84） · 热度 129000 万 · 梗族：流放种田梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：御兽女狂医携兽语系统流放沙海，把残暴土匪头子训成忠犬战神<\/li>\n<li>**题材**：御兽开荒，荒漠求生，爽剧逆袭，奇幻脑洞<\/li>\n<li>**共情点**：受众：18至35岁女性，向往野性张力与奇幻宠物，满足女性在力量博弈中占据绝对主导权的潜意识欲望<\/li>\n<li>**爽点内核**：内核：在荒凉暴烈的狂沙中，以温柔与绝对实力征服狂暴巨兽和桀骜不驯的糙汉，实现身体与心灵的双重驯服<\/li>\n<li>**创新亮点**：亮点：狂野糙汉与御兽女王的极致拉扯，大漠沙暴与神话异兽通过AIGC展现极致视觉冲击，荒漠开荒爽感爆棚<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：苏青野是狂野的动物学专家，携御兽语言系统穿越到寸草不生的大漠流放地，被迫嫁给恶名昭彰的荒漠狼匪首领霍骁。霍骁外表狂放不羁、嗜血冷酷，实则是被朝廷陷害的蒙冤将军，在沙漠中隐忍筹谋。苏青野的致命缺陷是因前世背叛而产生的重度防御心理，她宁可信任野兽也不愿相信人类，甚至在新婚夜用麻药放倒霍骁。但在艰难的荒漠求生中，她发现霍骁虽然粗鲁，却将唯一的干净水源和活命机会都留给了她。当大漠遭遇百年一遇的狂沙暴和变异沙虫袭击时，苏青野不再逃避，她用系统召唤并驯服了沙漠深处的巨型沙雕和沙蟒，将天灾化为农耕便利。在霍骁的配合下，他们将死寂的沙海开辟成了富庶的绿洲通商口岸。霍骁被她的野性与聪慧折服，从一匹孤狼彻底驯化为专属她的忠犬战神，两人最终联手横扫大漠，重建天下秩序。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b011-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b011-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 冰原种田：发配边关养大猫\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"奇幻种田，先婚后爱，领地基建，AIGC\",<\/p>\n<p> \"heat_w\": 129000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"83\",<\/p>\n<p> \"family\": \"liufang-zhongtian\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2067064854429958144\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 冰原种田：发配边关养大猫<\/h2>\n<p>&gt; CN 市场 · 女频 · A 级（AI 评 83） · 热度 129000 万 · 梗族：流放种田梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：农业教授携空间系统流放冰原，契约铁笼里的毁容半兽战神<\/li>\n<li>**题材**：奇幻种田，先婚后爱，领地基建，AIGC<\/li>\n<li>**共情点**：受众：喜欢逆袭爽感与毛茸茸治愈系的青年女性，击中对于纯粹偏爱与陪伴的渴望<\/li>\n<li>**爽点内核**：内核：在最寒冷荒凉的绝地，用最务实的温度，将狂暴的野兽驯化为只属于自己的守护神<\/li>\n<li>**创新亮点**：亮点：将种田地图拉到极限冰原，利用AIGC低成本渲染雪景、雪狼、温室奇观，半兽人战神的反差萌极具诱惑力<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：陆微是现代农业教授，带着土地改良空间穿越到终年积雪的暴风领。这里是没有任何植物能存活的流放死地。开局她被强行许配给守边军士，其他罪女争抢体面的军官，陆微却用一袋冻土换下了被关在铁笼里、人人畏惧的半兽领主夜北。夜北因战伤毁容且半兽化，被视为不祥之物。陆微的致命缺陷是极度理智，把感情当成利益交换。她直白地提出合作，她用空间培育温室大棚解决温饱，夜北提供武力保护。在暴风雪中，他们驯服雪狼，开辟温暖的地下之城。夜北在陆微的饱和式投喂下不仅恢复了绝世美颜，更觉醒了上古圣兽血脉。昔日的冷酷半兽人化身护妻狂魔，一剑扫平窥伺领地的外敌。陆微也终于打破冷酷心防（深层需求：学会信任和接纳不完美的爱），与她的战神并肩于冰原之巅。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1400｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b012-cn.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b012-cn\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 拆盲盒后，我把渣男净身出户了\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"都市爽剧，设计盲盒，商战博弈，高调复仇\",<\/p>\n<p> \"heat_w\": 118000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"89\",<\/p>\n<p> \"family\": \"dalian-nuezha\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2064165690637152256\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 拆盲盒后，我把渣男净身出户了<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 89） · 热度 118000 万 · 梗族：打脸虐渣梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：结婚纪念盲盒里拆出轨证据，贤妻设局让渣男抢着净身出户<\/li>\n<li>**题材**：都市爽剧，设计盲盒，商战博弈，高调复仇<\/li>\n<li>**共情点**：受众：22至45岁女性，痛恨伴侣转移资产与精神控制，渴望用高智商夺回财产并精准惩罚背叛者<\/li>\n<li>**爽点内核**：内核：自私者终将被其贪婪反噬，从默默付出的退居幕后到掌控全局的商业女皇，尊严与财富的双重夺回<\/li>\n<li>**创新亮点**：亮点：将时下流行的盲盒与商战完美结合，出轨证据藏在盲盒内胆的视觉设定极具悬念，让渣男主动抢着净身出户的闭环反转极具爽感<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：温以乔是隐姓埋名的天才盲盒设计师，五年来她退居幕后，成全了丈夫顾廷轩的潮玩帝国。在结婚五周年的盲盒发布会现场，温以乔意外拆开了顾廷轩送给她的限量版盲盒，却在玩偶内胆里发现了顾廷轩精心隐藏的秘密（他与闺蜜情妇方暖的亲密照片，以及通过虚假设计授权转移的数亿夫妻共同财产）。温以乔的致命缺陷是曾为了爱情过度妥协（深层需求：重建自我，摆脱被豢养的木偶人生），面对毁灭性的背叛，她彻底觉醒。她没有当场发飙（核心欲望：拿回属于自己的原创版权和所有财产），而是巧妙利用顾廷轩极度自私、虚荣的性格缺陷，暗中引入了一个负债累累的假名媛去勾引顾廷轩。顾廷轩为了所谓的海外财阀资源，千方百计规避夫妻债务，不惜设局让自己净身出户与温以乔离婚，只为迎娶假名媛。就在他高调举办新婚礼的那天，温以乔以真正的版权持有者与新品牌创始人的身份华丽降临，当众展示了版权转让铁证。顾廷轩不仅失去了核心产品线导致公司破产，更背负了假名媛的千万巨债，两人彻底锁死在无尽的争吵与催债中互相折磨，而温以乔则带领新品牌走向世界，活出了成功独立女性的璀璨风采。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-2 分钟｜单集字数上限 1000｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b013-fam.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b013-fam\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 白月光归来：前夫，牢房已满员\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"逆袭打脸，假死复仇，悬疑解谜，马甲爽剧\",<\/p>\n<p> \"heat_w\": 118000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"86\",<\/p>\n<p> \"family\": \"majia-diaoma\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2064165691652173824\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 白月光归来：前夫，牢房已满员<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 86） · 热度 118000 万 · 梗族：马甲掉马梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：死于车祸的妻子毁容后假死，整容成前夫深爱的白月光回国复仇<\/li>\n<li>**题材**：逆袭打脸，假死复仇，悬疑解谜，马甲爽剧<\/li>\n<li>**共情点**：受众：18至35岁年轻女性，偏好高概念设定、悬疑感和极致心理博弈，渴望看到渣男自食其果<\/li>\n<li>**爽点内核**：内核：虚伪的深情一文不值，用你最深处的执念做最致命的诱饵，将背叛者拖入万劫不复的深渊<\/li>\n<li>**创新亮点**：亮点：重生流的无超自然科学转译，整容成前夫深爱的白月光去复仇，完美的心理战术与马甲剥离，将悬念感与爽点推向极致<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：江书瑶深爱丈夫沈修远，甘愿做他背后的温柔贤妻，却在结婚纪念日遭遇惨烈车祸。在火光中，她听到沈修远与秘书情妇通电话，得知车祸是他精心策划，只为吞并江家百亿外祖遗产。江书瑶九死一生，虽然毁容却侥幸活了下来，她的致命缺陷是曾对人性抱有天真幻想（深层需求：斩断病态依恋，找回豪门继承人的风骨）。为了复仇（核心欲望：揭露谋杀真相，夺回百亿家产），她忍受剧痛，将自己重塑成了沈修远电脑深处隐藏的那个因病早逝的白月光的模样，化身跨国集团女总裁苏霓霸气回归。沈修远看到这张熟悉的脸，陷入了疯狂的愧疚与执念中，主动奉上公司控制权只为博取苏霓红颜一笑。江书瑶每一步都走在信息优势的刀刃上，引导沈修远逐步架空自己的公司，并挑拨他与情妇反目成仇。就在沈修远自以为终于能弥补前生遗憾，在万众瞩目的世纪求婚仪式上，江书瑶当众撕下伪装，播放了他当年策划车祸的录音，用无可辩驳的铁证让他跌入无期徒刑的深渊，完成了最震撼的当众清算。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-2 分钟｜单集字数上限 1000｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b014-fam.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b014-fam\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 离婚后，前夫跪求当我的贴身男仆\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"豪门逆袭，职场商战，情感代偿，追妻火葬\",<\/p>\n<p> \"heat_w\": 118000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"87\",<\/p>\n<p> \"family\": \"zhuiqi-huozangchang\",<\/p>\n<p> \"route_affinity\": \"all\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2064165692025466880\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 离婚后，前夫跪求当我的贴身男仆<\/h2>\n<p>&gt; CN 市场 · 女频 · A+ 级（AI 评 87） · 热度 118000 万 · 梗族：追妻火葬场梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：无能弃妇被离婚后继承千亿矿业，前夫为求合同主动当贴身男仆<\/li>\n<li>**题材**：豪门逆袭，职场商战，情感代偿，追妻火葬<\/li>\n<li>**共情点**：受众：25至50岁职场女性及家庭主妇，痛恨生育道德绑架，极度渴望通过经济和精神绝对独立实现话语权反转<\/li>\n<li>**爽点内核**：内核：曾经你对我爱答不理，如今我让你高攀不起，从被践踏自尊的受气包到用资本主宰前夫命运的女皇<\/li>\n<li>**创新亮点**：亮点：颠覆性地将男频爽点和女频情感进行缝合，把傲慢的前夫变成必须听话的私人助理，通过绝对的资源垄断对前夫家进行连环打脸<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：苏星言与豪门总裁薄冷夜结婚三年，因为薄家势利婆婆的重男轻女和薄冷夜的长期冷暴力，她被一纸离婚协议扫地出门，全网甚至群嘲她是三年生不出继承人的弃妇。苏星言的致命缺陷是顾念旧情（深层需求：摆脱生育工具的枷锁，证明自己在商业上的统治力）。然而，离婚当天，她不再隐忍（核心欲望：收回对不值得男人的所有隐忍，用绝对资本碾压薄家），当场继承了全球最大矿业巨头苏氏集团。此时，薄氏集团核心半导体芯片面临原材料断供危机，唯一的救命稻草就是苏星言手中的稀有矿石资源。为了拯救家族企业，薄冷夜不得不低下高傲的头颅求见神秘董事长。当他在董事长办公室看到一身华服、气场全开的前妻苏星言时，整个人信仰崩塌。苏星言根本不屑于听他的忏悔，她利用合同逼迫薄冷夜签署了私人男仆协议。苏星言将他带在身边，当着他新女友和势利母亲的面，用最无情的商战手段和职场降维打击，一点点剥夺薄冷夜的自尊与底牌，直到薄家在商战中彻底沦为底层，而苏星言则在全球商业峰会上绽放万丈光芒。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-2 分钟｜单集字数上限 1000｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b015-fam.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b015-fam\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 被嫌弃的真千金手握封神配方\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"逆袭,真假千金,爽感,科研打脸流\",<\/p>\n<p> \"heat_w\": 50000,<\/p>\n<p> \"grade\": \"A\",<\/p>\n<p> \"score\": \"81\",<\/p>\n<p> \"family\": \"zhenjia-qianjin\",<\/p>\n<p> \"route_affinity\": \"hot\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2081922618549473280\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitoo ing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2089532885970149376\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · Mayday: The Shadow Pilot<\/h2>\n<p>&gt; NA 市场 · 男频 · A+ 级（AI 评 89） · 热度 24000 万 · 梗族：马甲掉马梗<\/p>\n<ul>\n<li>**一句话卖点**：一句话：被吊销执照的底层地勤，在万米高空双发熄火时接管飞机缔造奇迹<\/li>\n<li>**题材**：灾难动作,职场逆袭,高能打脸,生死悬疑<\/li>\n<li>**共情点**：受众：击中职场受气底层青年，满足专业碾压、极限翻盘与万众膜拜欲望<\/li>\n<li>**爽点内核**：内核：在绝境中打破职场构陷，以神级实力救赎至亲并赢回绝对尊严<\/li>\n<li>**创新亮点**：亮点：万米高空密闭高压灾难，落魄机师神级操作打脸傲慢机组，荷尔蒙与肾上腺素双重狂飙<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线：前王牌飞行员Leo Vance遭贪婪高层陷害并吊销执照，被迫沦为机场底层行李员，在护送重病未婚妻就医的航班上受尽机组嘲弄。当客机升至万米高空，遭遇极端气流撕裂机翼，右发爆炸起火，正副机长相继重伤失能，自动驾驶彻底断开，飞机以致命速度向雪山俯冲。全舱陷入毁灭性恐慌，骄傲的乘务长手足无措。危急关头，Leo Vance冲破阻拦坐上机长席。他克服手部旧伤与狭窄空间限制，单发重启引擎，冷静指挥地面排空跑道。面对塔台质疑与暴躁乘客冲击，他凭借超越极限的盲降盲操技巧擦过山脊，在雷暴中完成人类航空史上的奇迹迫降。他不仅洗刷昔日冤屈，将作恶高层送入深渊，更赢得顶级航空财阀女继承人Aria Sinclair的倾心敬仰，重回云端之巅。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 40｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p>\n<p>---<\/p>\n<p>&lt;!-- source: knowledge/benchmark/b022-na.md --&gt;<\/p>\n<p>---<\/p>\n<p>{<\/p>\n<p> \"id\": \"kb/benchmark/b022-na\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · Deadman Velocity\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"NA\",<\/p>\n<p> \"category\": \"M\",<\/p>\n<p> \"genres\": \"动作冒险,马甲翻盘,硬核科技,绝境突围\",<\/p>\n<p> \"heat_w\": 24000,<\/p>\n<p> \"grade\": \"A+\",<\/p>\n<p> \"score\": \"88\",<\/p>\n<p> \"family\": null,<\/p>\n<p> \"route_affinity\": \"hot\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@202 028-s\",<\/p>\n<p> \"type\": \"benchmark\",<\/p>\n<p> \"title\": \"对标 · 重回前夫假死那天，我大摆招魂席\",<\/p>\n<p> \"version\": \"2026-09-15\",<\/p>\n<p> \"status\": \"active\",<\/p>\n<p> \"market\": \"CN\",<\/p>\n<p> \"category\": \"F\",<\/p>\n<p> \"genres\": \"爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\",<\/p>\n<p> \"heat_w\": 14000,<\/p>\n<p> \"grade\": \"S\",<\/p>\n<p> \"score\": \"91\",<\/p>\n<p> \"family\": \"chongsheng-fuchou\",<\/p>\n<p> \"route_affinity\": \"hot\",<\/p>\n<p> \"provenance\": {<\/p>\n<p>  \"source\": \"import\",<\/p>\n<p>  \"refs\": [<\/p>\n<p>   \"dataset:kakaxing/scriptrawstone@2026-09-15\",<\/p>\n<p>   \"platformId:SPTRS2096055935255412736\",<\/p>\n<p>   \"tool:tools/distill-kakaxing.mjs\"<\/p>\n<p>  ]<\/p>\n<p> },<\/p>\n<p> \"updated\": \"2026-09-15\",<\/p>\n<p> \"bind\": {<\/p>\n<p>  \"skills\": [<\/p>\n<p>   \"chief-aesthetic\",<\/p>\n<p>   \"find-trope\"<\/p>\n<p>  ],<\/p>\n<p>  \"minitools\": [<\/p>\n<p>   \"kb_search\"<\/p>\n<p>  ]<\/p>\n<p> }<\/p>\n<p>}<\/p>\n<p>---<\/p>\n<h2>对标 · 重回前夫假死那天，我大摆招魂席<\/h2>\n<p>&gt; CN 市场 · 女频 · S 级（AI 评 91） · 热度 14000 万 · 梗族：重生复仇梗<\/p>\n<ul>\n<li>**一句话卖点**：渣夫假死甩万额外债携小三金蝉脱壳，贤妻重生当场设大席封门，逼得活人自己从供桌下爬出认罪！<\/li>\n<li>**题材**：爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主<\/li>\n<li>**共情点**：击中30至45岁家庭主妇为家庭掏心掏肺却被婆家合谋吸血算计的窒息痛点，让隐忍付出的憋屈感转化为反戈一击的生理爽感。<\/li>\n<li>**爽点内核**：情绪轴为从被吸血到反手清算；爽点主菜为借丧事规则瓮中捉鳖，当众揭穿骗局夺回家产，可见可数。<\/li>\n<li>**创新亮点**：对标《重回前夫假死那天，我彻底掀桌了》，将室内封棺转变为柴房困兽与招魂大席，机制落点在民俗博弈与物理困敌。<\/li>\n<\/ul>\n<h3>剧情主线（节选）<\/h3>\n<p>主线剧情：九十年代末北方县城，纺织厂女工林秀芝操劳半生，替突遭意外身亡的丈夫还清巨债并养老送终，临终前才知当年是丈夫为了与富商之女私奔、甩掉巨额货款而导演的假死金蝉脱壳。一朝重生，她赫然回到灵堂前，婆婆和小姑子正逼她签字画押背下全部欠条。林秀芝当场掀翻认债书，冷笑着当众改办大排场招魂宴，以思念亡夫入骨为由强留全族乡亲与各路债主通宵守灵。她暗中把丈夫藏身换装的柴房反锁加固，断水断粮三天三夜，每次婆家人企图送干粮送水，都被她借敬神守节之名当场拦截打赏众人。柴房内的渣夫饥渴难耐濒临崩溃，出殡起灵当日，渣夫为活命撞破房门狼狈抢食，假死真相在全体债主眼前当场炸裂。林秀芝雷霆出手，借民事公证与借据逼婆家交出全部隐匿存折与房契，彻底斩断吸血枷锁，随后凭借前世商贸记忆承包纺织门市部，步步蜕变成为万人敬仰的民营女实业家。<\/p>\n<h3>生产约束（实盘值）<\/h3>\n<p>集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10<\/p>\n<h3>对标用法<\/h3>\n<p>强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。<\/p><\/section>\n<section><h1>热点素材.md<\/h1><h2>热点素材 · 拍魂（时代情绪锚）<\/h2>\n<ul>\n<li>项目：p-key-soul（乒乓题材竞技爽剧）<\/li>\n<li>生成：2026-09-16 · 网感师（story-analyst 剖面）· 全新重跑<\/li>\n<li>依据：`skills/topic-zeitgeist.md` + `选题素材.md`（甲方：\"德不配位\"公共情绪切入）<\/li>\n<li>证据说明：本轮检索多次触发限流，30 天窗口内逐条热搜证据不足。按技能纪律执行降级策略——主锚采用**可核验的长期公共议题 + 2026 年官方持续动作**，辅以 **30 天内赛事节点**；全部证据标注等级，未编造任何热搜。<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>一、时代情绪锚声明<\/h3>\n<p>&gt; **时代情绪锚**：本选题踩中的是〔\"德不配位\"——大众对\"位置、资源、荣誉与实力贡献倒挂\"的持续愤怒与身份焦虑：凭什么他坐那个位置〕（证据：主锚为国家体育总局 2026 年 5 月\"持续整治饭圈乱象、融入运动员选拔输送安置全过程\"的官方定调（新华网 2026-05-19，B 级）及 2024 年以来总局、网信办多轮整治表态（C 级，见第三节）；辅锚为 2026-09-15 至 10-11 间 WTT 赛事节点带动的全民乒乓注意力（A/B 级，见第三节）。）<\/p>\n<ul>\n<li>情绪本质：不是仇富，也不是反偶像——是**\"位置该由实力与贡献定价\"**这条朴素正义感被反复冒犯后的积压。饭圈化只是该情绪在体育域的显影，同一神经在职场（关系户占坑）、文娱（资源咖）领域同样在疼。<\/li>\n<li>对位甲方需求：甲方指定\"德不配位\"切入，与上述公共议题天然同构；故事即该情绪的具象化执行。<\/li>\n<\/ul>\n<h3>二、情绪拆解：三层公共神经 → 戏剧动作<\/h3>\n<p class=\"row\"> ┃  神经层  ┃  大众原话（情绪句式）  ┃  戏剧动作（爽剧执行）  ┃ <\/p>\n<p class=\"row\"> ┃  ① 流量与实力倒挂  ┃  \"赢了球的人上不了热搜，热搜上的人赢不了球\"  ┃  主角靠硬实力一路打穿名额、排名、商业资源全部由流量逻辑把持的体系  ┃ <\/p>\n<p class=\"row\"> ┃  ② 选拔与资源分配不透明  ┃  \"名单公示那一刻，才知道有些位置早就内定了\"  ┃  大赛名单/梯队名额争夺作为全剧骨架（对位灌篮高手队伍线+大赛终点感）  ┃ <\/p>\n<p class=\"row\"> ┃  ③ 荣誉的营销化  ┃  \"奖牌是他的，功劳是谁的？\"  ┃  隐形贡献被系统性记在别人名下——陪练、让位、战术牺牲被叙事抹除  ┃ <\/p>\n<p>三层叠加出本剧公共情绪公式：**位置（名额）× 资源（陪练/商业/话语权）× 荣誉（功劳记账）** 的分配权，握在不懂球也不尊重球的人手里。<\/p>\n<h3>三、证据清单（分级）<\/h3>\n<h4>A 级 · 30 天内（2026-08-17 ~ 2026-09-16）<\/h4>\n<ul>\n<li>**A1 · WTT 球星挑战赛阿斯塔纳站 2026-09-15~20 进行中**：乒乓球国际赛事正在比赛周，大众注意力在线。来源：WTT 官方赛程页 worldtabletennis.com/eventslist（赛事条目可核验）。<\/li>\n<li>**A2 · WTT 中国大满贯 2026 临近（10 月 1-11 日，北京首钢园，官方特许商品 9 月已在服贸会预售、青少年大满贯门票 9 月 15 日开售）**：9 月中下旬起乒乓话题热度爬坡，10 月初国庆档引爆。来源：worldtabletennis.com 赛程列表（赛事存在，A 级）；具体日期/奖金等细节转述自检索摘要，建议上线排期前以 WTT 官方公告复核（此部分 B 级）。<\/li>\n<li>**A3 · \"清朗·整治账号名称信息乱象\"专项（2026 年 6 月启动、为期 3 个月）至本周期仍在执行窗口**：粉丝冒充、身份伪装类账号治理与体育饭圈同谱系。来源：中国网信网\"清朗\"系列专项行动索引页 cac.gov.cn/wxzw/qinglang/A093711index_1.htm。<\/li>\n<\/ul>\n<h4>B 级 · 2026 年内可核验（权威来源）<\/h4>\n<ul>\n<li>**B1 · 新华网 2026-05-19《国家体育总局：持续整治\"饭圈\"乱象 厚植体育文明风尚》**：总局明确\"把坚决抵制畸形饭圈文化的意识和要求**融入运动员选拔、输送、安置的全过程**\"。——官方把话题钉死在\"选拔与位置分配\"上，与本剧冲突骨架完全同构。<\/li>\n<\/ul>\n<p>  http://www.news.cn/sports/20260519/dcda991a96cf4b91a844dd1507d0d70c/c.html<\/p>\n<ul>\n<li>**B2 · 2026-04-28 ~ 05-10 伦敦世乒赛团体赛举行**（第 58 届，伦敦铜箱馆，64 队规模，Olympics.com 官方赛事页可核验）；赛后国乒新老交替、阵容与参赛安排是公共讨论焦点（此句转述自检索摘要，B 级）。<\/li>\n<\/ul>\n<p>  https://www.olympics.com/zh/sport-events/2026-ittf-table-tennis-world-team-championships-finals-london<\/p>\n<ul>\n<li>**B3 · 中央网信办 2026 年清朗系列持续部署**（含 2026-04\"整治 AI 应用乱象\"等），整治范围一贯覆盖\"借体育赛事话题鼓动饭圈拉踩攻击\"。来源：cac.gov.cn 清朗索引页。<\/li>\n<\/ul>\n<h4>C 级 · 长期公共议题（2024-2025 权威报道，议题生命力延续至今）<\/h4>\n<ul>\n<li>**C1** 光明网 2024-05-16：体育总局首次公开表态\"坚决抵制畸形饭圈文化\"，要求融入运动员管理全链条。https://news.gmw.cn/2024-05/16/content_37325049.htm<\/li>\n<li>**C2** 中国日报网 2025-03-11：体育总局负责人在全国人大\"部长通道\"再次表态抵制饭圈文化侵蚀体育（不点名，仅引机构表态）。https://cn.chinadaily.com.cn/a/202503/11/WS67d01f6aa310510f19eeaff4.html<\/li>\n<li>**C3** 中国新闻网 2024-05-30：微博等平台开展为期 3 个月\"体育饭圈生态治理\"专项，打击互撕、控评、泄露隐私、违规集资。https://www.chinanews.com/ty/2024/05-30/10225699.shtml<\/li>\n<li>**C4** 新京报调查报道《畸变的 8 年：2016—2024 体育饭圈乱象调查》：媒体对该情绪成型的系统梳理。https://m.bjnews.com.cn/detail/1716978715168436.html<\/li>\n<\/ul>\n<h4>证据等级说明<\/h4>\n<ul>\n<li>A = 事件落在 30 天窗口且来源可核验；B = 2026 年内权威来源可核验；C = 长期议题、权威历史报道。<\/li>\n<li>30 天内的**具体舆情热搜条目**（平台热搜榜截图级证据）因检索限流未能逐条取证，按技能纪律不作虚构；主锚证据强度由 B1（官方 2026 年持续定调）承担，其为\"进行中议题\"而非过期新闻。<\/li>\n<\/ul>\n<h3>四、情绪具象化路线（大白话检验）<\/h3>\n<p>按 topic-zeitgeist 第 2 条，把主角处境写成一句大白话，必须是\"像真社会新闻标题\"的句子：<\/p>\n<ul>\n<li>测试句 1：「**他当了八年主力的影子，大赛名单公布那天，名额给了粉丝百万的营销天才**」<\/li>\n<li>测试句 2：「**他赢下决胜分，第二天热搜挂在别人名字下面**」<\/li>\n<li>测试句 3：「**陪练十年的功劳，被写进了别人的纪录片**」<\/li>\n<\/ul>\n<p>三条全部通过\"真实新闻标题感\"检验（对应 B1 官方语境里的\"选拔安置全过程\"+C4 调查里的功劳/叙事争夺）。故事不拍\"坏人夺位\"的私怨，拍**一套分配机制的失灵**——私怨只是它的戏剧外壳。<\/p>\n<h3>五、共鸣乘数：预埋截图转发拍点<\/h3>\n<p>面向\"这说的是我/我同事/我孩子\"的观众（职场人、体育迷、学生家长），在 60 集体量中预埋：<\/p>\n<p>1. **名单公示拍**（约前 10 集内）：主角名次够、名额没份——评论区自.live\"现实里见过\"。首波二创源。<\/p>\n<p>2. **功劳记账拍**（中段）：把队友牺牲写进自己名下的发布会/采访戏——截图自带\"德不配位\"话题标签，天然适配弹幕玩梗。<\/p>\n<p>3. **热搜倒挂拍**：主角夺冠瞬间，镜头一切——热搜第一是别人的商业官宣。黑白对比画面，竖屏漫剧竖构图强项，最佳截图帧。<\/p>\n<p>4. **镜像拍**（对位双主角互相成就）：流量型角色不是纸片反派——他同样被流量反噬（不敢输、不能病、粉丝替他恨人），与主角互为镜子，承接\"双主角互相成就\"的甲方结构，同时避免\"批判饭圈女孩\"的一刀切（受众里就有她们）。<\/p>\n<h3>六、锚点贯穿：反派的作恶方式 = 情绪的现实原型<\/h3>\n<ul>\n<li>反派不是传统意义的坏人，而是**\"分配机器\"本身**：营销化的教练组/经纪逻辑、控评的粉丝团、掌握名额与话语权的体系内人物。其作恶手段逐一对应公共情绪原型：<\/li>\n<\/ul>\n<p>  - 名额内定 ← 现实中\"选拔不透明\"质疑（B1 官方语境）；<\/p>\n<p>  - 功劳挪用 ← 现实中叙事操盘、控评洗地（C3、C4）；<\/p>\n<p>  - 资源倾斜 ← 现实中商业流量优先于竞技价值（B2 赛历/参赛安排讨论）。<\/p>\n<ul>\n<li>情绪是燃料不是说教：全剧不出现\"整治\"\"抵制\"等口号式台词，只把\"位置不该他坐\"拍成一场一场的球。<\/li>\n<\/ul>\n<h3>七、节点对位（上线节奏建议）<\/h3>\n<ul>\n<li>**2026-09 中下旬**：WTT 赛事密度高（阿斯塔纳站进行中 → 中国大满贯 10 月 1-11 日预热期），大众乒乓注意力爬坡——**前 10 集\"名单公示\"冲突在此窗口投放**，蹭真实赛程期的全民讨论。<\/li>\n<li>**2026-10 国庆档**：中国大满贯开赛（北京首钢园），乒乓话题峰值——若排期允许，让剧中\"大赛\"高潮段落与真实赛期共振。<\/li>\n<li>青少年大满贯同场馆设定（9 月起有真实话题度）可映射剧中\"梯队/后备队\"线，增强\"这就是真事\"的既视感。<\/li>\n<\/ul>\n<h3>八、合规红线执行<\/h3>\n<ul>\n<li>**不点名任何真实运动员**：全文无任何真人运动员姓名；情绪证据均引机构表态、官方行动与媒体调查，不引对具体运动员个人的争议事件。<\/li>\n<li>**不影射具体真实比赛/名场面**：剧中大赛、协会、俱乐部全虚构；\"名单内定\"\"功劳挪用\"等桥段为公共议题的戏剧化虚构，不与任何真实赛事结果一一对应。<\/li>\n<li>反派与粉丝群像避免指向性设定（无真实协会名、地域、队服暗示）。<\/li>\n<li>引用证据仅用于创作锚定，不进入正片台词与画面。<\/li>\n<\/ul>\n<p>---<\/p>\n<p>*产物完。数据截至 2026-09-16；排期前建议复核 A2 中 WTT 中国大满贯具体日期与赛程。*<\/p><\/section>\n<section><h1>选题分析报告.md<\/h1><h2>选题分析报告：《拍魂》（乒乓球竞技爽剧 · 项目 p-key-soul）<\/h2>\n<p>&gt; 分析师产出 · 2026-09-16 · 全新重跑<\/p>\n<p>&gt; 输入：`选题素材.md`（甲方需求）+ `梗卡.md`（find-trope 产物，快照 2026-09-15）+ `热点素材.md`（时代情绪锚，证据分级）+ `内部/kb-benchmark.md` + `内部/kb-market.md`（生产约束基线 / 设定体系约束 / 梗密度约束）。<\/p>\n<p>&gt; 声明：本跑次未附四视角评估批注报告，事实基线以上述素材包与知识包为准，分歧条目规则本篇不适用。本报告只做分析判断，不做创作——人设、剧情由选题方案步展开。<\/p>\n<p>&gt; 合规自查：全文不出现任何真实运动员、协会名；真实赛事与机构名仅出现在证据引用段（用于分析锚定），并已标注「不进正片/宣发」。<\/p>\n<p>---<\/p>\n<h3>一、市场分析<\/h3>\n<h4>1.1 赛道温度判断：上升（结构性窗口期）<\/h4>\n<p>按「需求侧热度 × 供给侧密度」双轴判定（口径：n + 均热度，单部爆点不算带，来源 kb/market/structure，数据快照 2026-09-15，parsed 6928 部，全库均热度 10058 万）：<\/p>\n<ul>\n<li>**需求侧（主梗带）：强热。** 打脸虐渣 n=1510 / 均 18558 万，红海·有效（约为全库均值的 1.85 倍）；类目级旁证更硬：打脸 n=536 / 均 22657 万，逆袭 n=1042 / 均 20955 万，强者回归 n=107 / 均 21803 万（CN，n≥100 类目）——本选题的主梗组合（打
