\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · The Beast Prince Refuses Any Other Nanny\n\n> NA 市场 · 女频 · S 级（AI 评 91） · 热度 0.00144 万 · 梗族：奇幻生物梗(NA)\n\n- **一句话卖点**：被退婚驱逐的罪民看护重返狮鹫王宫，暴烈幼主非她不抱，冷血战神前夫终成掌中囚徒。\n- **题材**：超自然, 宿敌恋人, 萌宝助攻, 绝地逆袭\n- **共情点**：击中27岁护理人员出身底层被豪门前夫家庭轻视扫地出门的撕裂痛感，满足前夫全族悔恨求和、至尊唯我独尊的幻象。\n- **爽点内核**：情绪轴：从被鄙弃到被唯一依恋。爽点主菜：曾弃她的全廷贵族集体悔恨挽留与高不可攀暴君的卑微追悔。\n- **创新亮点**：对标《I Spoke Baby Dragon and Won Everyone Over》，关系置换为悔罪前夫与看护，将前任追悔与萌宝依恋极致叠加。\n\n## 剧情主线（节选）\n\n主线剧情：在被古老结界笼罩的北美落基山脉狮鹫领地，因平民身份被当众撕毁婚约并贬为罪徒看护的现代临床护理师 Nora 陷入绝境。此时战力巅峰却冷血残酷的狮鹫战帅 Gabriel 正面临王脉断绝的噩梦，其独子 Mason 因出世异变持续狂躁抽搐拒食，贪恋权势的贵族继任看护 Daphne 滥用迷迭沉睡香导致幼崽呼吸濒停。Nora 凭借独有的读心听诊异能，洞悉幼崽并非顽劣而是严重的胃幽门痉挛与呼吸窘迫。面对前夫与满廷质疑，Nora 克服内心的自卑创伤强势介入，用温水胃肠减压和现代儿科抱姿安抚使抽搐骤停，幼崽当场死死抱住 Nora 颈项哭喊着认其为唯一生母。嫉恨发狂的 Daphne 在加冕阅兵大典将致盲毒刺塞入幼崽襁褓嫁祸 Nora。Nora 凭借冷静操作取出毒刺拯救小王储，更以显色留痕药水当堂拆穿 Daphne 的蛇蝎手段。昔日孤傲无情的 Gabriel 终于看清真相悔恨交加，在全军瞩目下当众扯下元帅勋章置于 Nora 掌心，甚至双膝弯曲甘愿受罚，宣告唯有 Nora 能够执掌王廷与他的生命。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b027-s.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b027-s\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 给大妈爆改后我成了顶流\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"治愈系, 职场逆袭, 发家致富, 女性群像, 现代都市\",\n \"heat_w\": 1,\n \"grade\": \"S\",\n \"score\": \"91\",\n \"family\": \"dalian-nuezha\",\n \"route_affinity\": \"all\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2096055930750730240\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 给大妈爆改后我成了顶流\n\n> CN 市场 · 女频 · S 级（AI 评 91） · 热度 0.5967 万 · 梗族：打脸虐渣梗\n\n- **一句话卖点**：被嘲不懂潮流的落魄设计师，带失业大妈爆改中老年潮牌，露天走秀一战封神。\n- **题材**：治愈系, 职场逆袭, 发家致富, 女性群像, 现代都市\n- **共情点**：轻熟龄设计与运营女性，方案因不合白瘦幼主流屡遭驳回，被年龄容貌焦虑深深刺痛。\n- **爽点内核**：情绪轴为从被轻视到被倚仗。冷门中年女装掀起全民抢购，傲慢前东家争相高薪回聘。\n- **创新亮点**：对标《以爱为家第四季》，聚焦大龄女性潮牌创业与家庭温情治愈，新瓶落点为故事背景。\n\n## 剧情主线（节选）\n\n主线剧情：在现代时尚设计公司，新锐设计师苏见夏因坚持打破白瘦幼审美、提倡包容性剪裁，被主管当面撕碎设计稿并逐出核心项目。苏见夏深知母亲与千千万万操劳一生的平凡女性买不到合身得体衣服的困境，毅然接下公司无人接盘的滞销老旧面料库，创立专注成熟女性的原创品牌。她力排众议拒绝雇佣年轻嫩模，大胆招募被裁员失业的素人阿姨担任试衣形象代言。面对同行水军疯狂嘲讽大妈扮嫩的恶评风暴，以及合作商场在开幕前夕临时毁约撤场的绝境，阿姨们与苏见夏的家人挚友全体出动，在露天广场连夜手搭质朴T台。聚光灯下，阿姨们步履自信、风骨沉淀的走秀视频引爆全网情感共鸣，数万订单瞬间挤爆服务器，废旧仓库一跃成为全网断货的明星工坊。前主管眼见品牌价值飙升赶来求购版权，苏见夏断然拒绝并宣布全员阿姨持股分红，彻底打破行业审美偏见，完成了从边缘弃子到时代潮流定义者的华丽蜕变。\n\n## 生产约束（实盘值）\n\n集数 80｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n\n---\n\n<!-- source: knowledge/benchmark/b028-s.md -->\n\n---\n{\n \"id\": \"kb/benchmark/b028-s\",\n \"type\": \"benchmark\",\n \"title\": \"对标 · 重回前夫假死那天，我大摆招魂席\",\n \"version\": \"2026-09-15\",\n \"status\": \"active\",\n \"market\": \"CN\",\n \"category\": \"F\",\n \"genres\": \"爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\",\n \"heat_w\": 14000,\n \"grade\": \"S\",\n \"score\": \"91\",\n \"family\": \"chongsheng-fuchou\",\n \"route_affinity\": \"hot\",\n \"provenance\": {\n  \"source\": \"import\",\n  \"refs\": [\n   \"dataset:kakaxing/scriptrawstone@2026-09-15\",\n   \"platformId:SPTRS2096055935255412736\",\n   \"tool:tools/distill-kakaxing.mjs\"\n  ]\n },\n \"updated\": \"2026-09-15\",\n \"bind\": {\n  \"skills\": [\n   \"chief-aesthetic\",\n   \"find-trope\"\n  ],\n  \"minitools\": [\n   \"kb_search\"\n  ]\n }\n}\n---\n# 对标 · 重回前夫假死那天，我大摆招魂席\n\n> CN 市场 · 女频 · S 级（AI 评 91） · 热度 14000 万 · 梗族：重生复仇梗\n\n- **一句话卖点**：渣夫假死甩万额外债携小三金蝉脱壳，贤妻重生当场设大席封门，逼得活人自己从供桌下爬出认罪！\n- **题材**：爽剧/逆袭, 重生流, 家庭伦理, 时代逆袭, 大女主\n- **共情点**：击中30至45岁家庭主妇为家庭掏心掏肺却被婆家合谋吸血算计的窒息痛点，让隐忍付出的憋屈感转化为反戈一击的生理爽感。\n- **爽点内核**：情绪轴为从被吸血到反手清算；爽点主菜为借丧事规则瓮中捉鳖，当众揭穿骗局夺回家产，可见可数。\n- **创新亮点**：对标《重回前夫假死那天，我彻底掀桌了》，将室内封棺转变为柴房困兽与招魂大席，机制落点在民俗博弈与物理困敌。\n\n## 剧情主线（节选）\n\n主线剧情：九十年代末北方县城，纺织厂女工林秀芝操劳半生，替突遭意外身亡的丈夫还清巨债并养老送终，临终前才知当年是丈夫为了与富商之女私奔、甩掉巨额货款而导演的假死金蝉脱壳。一朝重生，她赫然回到灵堂前，婆婆和小姑子正逼她签字画押背下全部欠条。林秀芝当场掀翻认债书，冷笑着当众改办大排场招魂宴，以思念亡夫入骨为由强留全族乡亲与各路债主通宵守灵。她暗中把丈夫藏身换装的柴房反锁加固，断水断粮三天三夜，每次婆家人企图送干粮送水，都被她借敬神守节之名当场拦截打赏众人。柴房内的渣夫饥渴难耐濒临崩溃，出殡起灵当日，渣夫为活命撞破房门狼狈抢食，假死真相在全体债主眼前当场炸裂。林秀芝雷霆出手，借民事公证与借据逼婆家交出全部隐匿存折与房契，彻底斩断吸血枷锁，随后凭借前世商贸记忆承包纺织门市部，步步蜕变成为万人敬仰的民营女实业家。\n\n## 生产约束（实盘值）\n\n集数 60｜单集 1-1.5 分钟｜单集字数上限 1200｜场景 ≤3｜演员 ≤10\n\n## 对标用法\n\n强度标尺：本件同等位置的爆点画面与强度，是审美总编（kb/aesthetic/oversight）验收方案时的参照基准。\n", "内部/kb-market.md": "# KB 装载 · market（市场快照装载）\n\n> 由 miniflow kernel kb_load 内建装载，来源 3 个知识文件。\n\n---\n\n<!-- source: knowledge/market/constraints.md -->\n\n---\n{\n  \"id\": \"kb/market/constraints\",\n  \"type\": \"market-standard\",\n  \"title\": \"生产约束基线（短剧/漫剧实盘值）\",\n  \"version\": \"2026-09-14\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [],\n  \"provenance\": {\n    \"source\": \"import\",\n    \"refs\": [\"dataset:kakaxing/scriptrawstone@2026-09-14（全量统计）\", \"kb/market/snapshot.formatConstraints\", \"storymaster-v3:assets/skills/script-drama-beat.md\"]\n  },\n  \"bind\": { \"skills\": [\"plot-choreographer\"], \"minitools\": [\"check_contract_compliance\"] },\n  \"updated\": \"2026-09-14\"\n}\n---\n\n# 生产约束基线\n\n**用途**：选题分析报告第五节\"创作约束移交单\"的默认数值来源——约束不再拍脑袋，直接取市场实盘（7938 部在售剧本的硬格式统计）。方案对这些条款逐条对账（`kb/aesthetic/oversight` 监理纪律，违反一票否决）。\n\n## 一、体量约束（分布即标准）\n\n| 维度 | 主流值 | 分布依据 |\n| --- | --- | --- |\n| 集数 | **60 集**（4224 部） | 50 集 945 / 80 集 925 / 40 集 718 / 30 集 116 |\n| 单集时长 | **1-1.5 分钟** | 竖屏付费短剧口径 |\n| 单集字数上限 | **1200 字**（4284 部） | 1000 字 1640 / 1400 字 528 / 1600 字 476 |\n| 场景数上限 | **≤3**（7937/7938） | 几乎全库硬约束——低成本快转景 |\n| 主要演员上限 | **≤10**（7925 部） | 同上 |\n\n**用法**：方案默认按 60 集 × 1.5 分钟 × 1200 字 × ≤3 场景 × ≤10 演员声明约束；偏离主流值（如 80 集或 4 场景）必须在移交单中显式声明并给理由——偏离不是错，隐式偏离才是错。\n\n## 二、约束 → 编排的直接推论\n\n1. **3 场景上限** ⇒ 每集冲突必须发生在可复用景（宅门/办公室/宫殿/车厢）；换景 = 换集节拍点。剧情编排师分集时先画场景复用表。\n2. **10 演员上限** ⇒ 有名有姓角色 ≤10（含反派）；群演反应拍（当众打脸必需）不计入，但\"全场惊呆\"必须由环境描写的群演承担。\n3. **1-1.5 分钟 ≈ 600-900 字正文**（script-drama-beat 口径）⇒ 每集 8-12 拍，前 3 秒钩子约 1 拍、结尾卡点约 2 拍。\n4. **60 集 × 1.5 分钟 = 90 分钟总片长** ⇒ 实际叙事容量 ≈ 一部电影的紧凑版：主线只容 1 个大反转 + 2-3 个中型反转（`kb/aesthetic/reversal` 结构位点联动），副线必须挂主线条件。\n\n## 三、题材标签纪律\n\n申报题材标签从市场受控词表取（快照 `genreHeatCN`/`genreHeatNA` 中的 genre 字段），不用自造词；标签组合 = 1 主题材 + 2-3 副标签（市场策划案通行形），标签顺序即卖点顺序。\n\n## 四、与硬断言的绑定\n\n本条目数值进入约束移交单后，由 minitool `check_contract_compliance` 逐条对账；分拍格式合规由 `AE-BEAT-FORMAT` 断言扫描（`kb/aesthetic/assertions.json`）。\n\n---\n\n<!-- source: knowledge/market/setting-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/setting-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"设定体系约束（项目级：世界观代入成本红线）\",\n  \"dimension\": \"setting\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-SET-ORIG\", \"AE-SET-3MIN\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\n      \"user-feedback:2026-09-15（禁止原创科幻世界观——点子好但没有厚度，读者不能快速代入；用市面做过的设定体系或实事新闻做底子）\",\n      \"kb/market/constraints（生产约束基线，本条目为其世界观维度扩展）\"\n    ]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"structure-design\", \"topic-analysis-report\"], \"minitools\": [\"check_aesthetic_asserts\"] }\n}\n---\n\n# 设定体系约束（世界观代入成本红线）\n\n**命题：短剧/漫剧的观众没有耐心学一套新世界观。** 点子再好，架构没有厚度——读者无法快速代入理解——就是废案。世界观的代入成本是选题阶段的一票项，不是成稿阶段再优化的细节。\n\n## 一、设定来源三级制\n\n| 级别 | 来源 | 判定 |\n| --- | --- | --- |\n| **首选** | **实事新闻做底子**：防汛救灾、工程质量清查、债务与烂尾、养老与医疗、裁员与再就业——全民共识的公共事件，零解释成本，主旋律有锚 | ✅ 直接可用 |\n| **次选** | **市面验证过的设定体系做创新改编**：战神归来/赘婿/重生/系统/马甲/先婚后爱等——观众已被市场教会规则，创新只做变体不做体系 | ✅ 可用，须挂竞品对标 |\n| **禁止** | **原创科幻/架空世界观**：自造中台/异能体系/架空王朝规则等需要观众先学后看的设定 | ❌ 一票否决 |\n\n## 二、判定方法：三分钟测试\n\n- 【block】**三分钟测试**：路人观众开播 3 分钟内，在不依赖任何设定解释的前提下，能否说出\"这是谁、他想要什么、为什么替他急\"？凡需要先讲设定才能进冲突的开局 = 违反本约束。\n- 【major】设定词密度：前三章正文中的**自造专名**（体系名/组织名/规则名）≤2 个；超过即代入成本超标。\n- 【major】实事锚点：选题理由必须至少引用一条**当月公共议题/新闻方向**作为情绪底（与 zeitgeist 步联动），架空设定天然缺此锚。\n\n## 三、正确的\"创新\"位置\n\n约束禁止的是**世界观层原创**，不禁止创意：创新发生在①**人物关系与身份层**（不确定因素注入：黑道大小姐/真假千金/穿书/初版作者）；②**结构改造**（`kb/structure/catalog` 三步）；③**实事底子上的具体事件**。好点子要长在观众熟悉的土壤上——点子的锐度 × 土壤的熟悉度 = 代入速度。\n\n## 四、执行接线\n\n- S1 调研：约束移交单新增 **C10 设定体系约束**（本条目），选题方向必须声明设定来源级别。\n- S2 结构：框架案的世界观节按三级制声明来源；原创倾向在此拦截。\n- R1/R2 红方：三分钟测试 + 设定词密度为固定检查项（`kb/aesthetic/perspective-review` 一般读者视角主责）。\n\n---\n\n<!-- source: knowledge/market/meme-rules.md -->\n\n---\n{\n  \"id\": \"kb/market/meme-rules\",\n  \"type\": \"market-standard\",\n  \"title\": \"梗密度与发散性约束（S1 网感输入源）\",\n  \"dimension\": \"meme\",\n  \"version\": \"1.0.0\",\n  \"status\": \"active\",\n  \"applies_to\": [\"short-drama\", \"comic-drama\", \"long-form\"],\n  \"routes\": [\"all\"],\n  \"asserts\": [\"AE-MEME-DENSITY\", \"AE-MEME-SPREAD\"],\n  \"provenance\": {\n    \"source\": \"factory\",\n    \"refs\": [\"user-feedback:2026-09-15（选题作为网感输入源需足够多的梗、有发散性；梗传播度与密度不足则观众无趣；纳入知名梗词典网站）\"]\n  },\n  \"updated\": \"2026-09-15\",\n  \"bind\": { \"skills\": [\"find-trope\", \"topic-analysis-report\"], \"minitools\": [\"meme_harvest（待实现）\", \"kb_search\"] }\n}\n---\n\n# 梗密度与发散性约束\n\n**命题：选题阶段是全流程的网感输入源。** 选题产出的梗与素材要喂给后续所有阶段（结构/方案/剧本/传播切片）；梗的传播度和密度不足，后续每一层都会\"无趣\"——这不是文案问题，是资源储量问题。\n\n## 一、S1 产出硬指标\n\n| 指标 | 要求 |\n| --- | --- |\n| **网络热梗素材表** | S1 梗卡必须附带 ≥10 条与题材相关的**现存高传播梗**（每条：梗名/来源与传播度评级/可挂接的场景示例） |\n| **发散性** | 每个主梗/新变体须可拆出 ≥3 个跨场景可复用的梗用法（对话梗/场面梗/切片梗）——只在一个场景成立的梗不算储量 |\n| **密度自查** | 前三章每集至少 1 处可独立切片传播的\"梗点\"（观众能截出来转发的东西） |\n\n## 二、梗词典数据源（纳入数据库的输入源清单）\n\n| 源 | 类型 | 用途 |\n| --- | --- | --- |\n| 小鸡词典（含镜像存档） | 梗词典 | 梗的出处、演变、用法 |\n| 梗百科 / 萌娘百科 | 百科类 | 梗的条目化解释与传播链 |\n| B 站热梗榜 / 抖音话题榜 | 平台热榜 | 当期传播度实测 |\n| 知乎\"网络流行语\"相关高赞 | 语义讨论 | 梗的语义漂移与代际差异 |\n| 微博热搜 / 百度指数 | 传播度实测 | 评级数据源 |\n\n接入方式：`meme_harvest` minitool（待实现，规格：抓取/清洗/去重/传播度评级 → 产出 `梗素材表` 增量并入 KB）；实现前由调研步人工按上表整理，**梗素材表仍为 S1 必交付**。\n\n## 三、与既有约束的关系\n\n- 梗密度约束**不替代** C10 设定约束（`kb/market/setting-rules`）：梗要密度，设定要低代入成本，两条红线并行。\n- 题材选择本身受梗密度约束**反向影响**：同等条件下，优先选**梗储量高的领域**（如国球/职场/校园——全民梗库富矿），放弃梗荒领域（例：无公共记忆的架空科幻）。\n", "小纲-第1-3集.md": "# 《拍魂》小纲源稿 · 第 1-3 集\n\n> **件型**：S4 小纲批注载体源稿（客户在其上批注修改）。派生自《选题方案.md》第五节 B 拍三件套分拍初稿与《故事框架案.md》暗埋表，不另起炉灶。\n> **拍号**：B0001-B0030 全局连续，供批注逐拍锚定。每集 10 拍（9-12 内），每拍 6-15 秒，每拍一个认知更新。\n> **纪律**：台词达意即可，不修文采；暗线只在集末卡点释放半句；钩型仅用四型：悬念/反常/危险/承诺。\n\n## 第一集《选拔黑幕》\n\n场景：①星轨训练馆球台区（含观察窗，内/夜）②俱乐部公示栏走廊（内/日）③宿舍楼道（内/夜）\n★切片梗点：B0001 被「安排」的比分特写 + B0004 陪练当众受辱\n\n**B0001｜反常｜8秒**\n\n【0-3秒】（第1场·训练馆球台区·内/夜）△大特写：计分牌「10:8」，挡板后一只穿深色立领袖口的手把它翻成「8:10」。\n分镜：△镜头从翻牌的手拉开——沈让（24，主力陪练，过时款灰训练服、左手指缝挂胶皮布条）隔着挡板缝看完全程，怀里捡球筐的铁丝被捏出一声轻响。\n台词：魏峥（画外·懒洋洋）：\"比分是给人看的，不是给人信的。\"\n表演：沈让瞳孔一缩，不吼不喊，喉结动了一下；翻牌的手连停顿都没有。\n尾钩→ 比分被改了，全馆没一个人吭声——包括他。\n备注：前3秒·全剧门面；道具：计分牌；暗埋·中2「同一支笔」伏笔①（第46-47集揭晓）。\n\n**B0002｜悬念｜9秒**\n\n【0-3秒】（第1场·球台区）△球台边顾曜（21，定制亮色队服、发胶亮额）11:9 险胜陪练，反手把拍摔在台面上。\n分镜：△球拍弹地两下；顾曜第一反应不是看球，是扭头偷看观察窗玻璃后监控屏室的方向。\n台词：顾曜（烦躁）：\"陪练都赢这么费劲？\"\n表演：摔拍是摔给玻璃后面那个人看的——摔完立刻收敛表情，练笑、比心。\n尾钩→ 他怕的不是输球，是屏幕后那个人。\n备注：小刺激1；暗埋·中1「太子白手套」伏笔①（第38集揭晓）。\n\n**B0003｜危险｜10秒**\n\n【0-3秒】（第1场·观察窗内监控屏室）△魏峥（45，深色立领外套、保温杯）盯着手机不抬头。\n分镜：△洪川（52，灰白寸头、秒表挂脖、口哨不离嘴）推门进监控屏室，站姿从进门那一刻就开始弯腰。\n台词：魏峥：\"宣传视频，第三球剪掉——他第三板晃了，难看。\"\n台词：洪川（弯腰）：\"练都练了，剪吧。\"\n表演：洪川的口哨吹到一半，停了半拍才接上；魏峥从头到尾没看一眼球台。\n尾钩→ 沈让拼出来的那三分，进了碎纸机。\n备注：小刺激2·功劳被抹；道具：宣传素材（第10集预告片挪用、第18集大卡点对照回收的证据基础）。\n\n**B0004｜反常｜9秒**\n\n【0-3秒】（第1场·球台区）△洪川回到球台区，一记短哨，全队集合。\n分镜：△队员围拢；唐果（19，微胖、队服拉链开一半、嚼能量胶）站在最外圈。\n台词：洪川：\"明天队内考核，沈让给顾曜当发球机——让大家看看，什么叫陪练的本分。\"\n台词：唐果（压着嗓子）：\"又是让哥……\"\n表演：哄笑从队伍后排滚到前排；唐果低头。\n尾钩→ 「发球机」三个字比输球更疼——因为没人觉得这有什么问题。\n备注：小刺激3·当众受辱；★切片梗点（受辱拍）。\n\n**B0005｜悬念｜10秒**\n\n【0-3秒】（第1场·球台区）△沈让蹲下捡球，一颗一颗，不快不慢。\n分镜：△特写：拇指沿拍沿抹两下（小动作首秀）；慢镜闪回：刚才 10:8 那局的第三球——发球出手、落点压台角，顾曜重心早被骗反。\n台词：沈让（平静，像在说天气）：\"比分不说谎。\"\n表演：低头捡球时说的，没看任何人；说完把球筐放回原位，摆正。\n尾钩→ 他不辩——他记账。\n备注：口癖「比分不说谎」变奏1/3（第18集当众清算回收）；字幕翻译：外行看是运气球｜内行看是压线短球，接的人从出手就死了。\n\n**B0006｜反常｜10秒**\n\n【0-3秒】（第2场·公示栏走廊·内/日）△次日，公示栏前红绸揭开：大赛正赛名单装裱上墙，顾曜的名字烫金排头。\n分镜：△工作人员盖章，一下，收印，前后不到一秒；沈让的名字在最末行「陪练编组」，字号小一号。\n台词：工作人员（公事公办）：\"名单以公示为准，有异议走流程。\"\n台词：唐果（小声）：\"流程？名单早印好了，章是后盖的。\"\n表演：围观队员没人提异议；唐果说完自己先缩脖子。\n尾钩→ 公示是通知，不是商量。\n备注：道具：名单+公章（公示栏=权力交接母题位首秀，第6集红笔划名、第60集红笔写名同机位回收）。\n\n**B0007｜危险｜9秒**\n\n【0-3秒】（第2场·走廊）△一队人扛着应援灯牌路过，灯牌上「曜」字灯一闪一闪。\n分镜：△洪川在公示栏前按住沈让的肩，压低身量；灯牌队伍与两人擦肩，光从沈让脸上扫过又暗下去。\n台词：洪川：\"名单看完了？看完去加练——明天顾曜的手感，还得你喂。\"\n表演：沈让点头应下，指缝里的胶皮布条缠了缠；不卑，也不亢。\n尾钩→ 被拿走的不止位置——连「下一场」都是替别人打的。\n备注：道具：应援灯牌（第18集灯牌成片熄灭回收的首次亮相）。\n\n**B0008｜承诺｜8秒**\n\n【0-3秒】（第3场·宿舍楼道·内/夜）△声控灯亮起，沈让划开手机。\n分镜：△官方集锦推送：十一个精彩球，没有一球标他的名字；他退出推送，点开自己云盘里的原始素材——每一球都有。\n表演：他一球一球看得很慢，看到第三球，停住，倒回去，又看了一遍。\n台词：—（无台词）\n尾钩→ 官方剪掉的，他自己全留着。\n备注：道具：云盘原始素材（留底习惯首秀；第10集挪用对照、第18集大卡点的证据底牌）。\n\n**B0009｜反常｜9秒**\n\n【0-3秒】（第3场·楼道拐角）△立着一个人：高马尾、右膝护具、拎旧运动包——姜屿（27，三年前被「评估退队」的前主力）。\n分镜：△她的视线越过沈让，落在手机屏幕的球上；沈让抬头，工牌在她胸前翻了个面，看不清名字。\n表演：她盯着屏幕里的第三球，右手指腹隔着护腕，按了一下。\n台词：—（无台词）\n尾钩→ 这个楼道里，唯一看懂了那颗球的人。\n备注：道具：护腕内 07 号布（本集不亮出，第3集拍回公示栏）；发现者进场前置拍。\n\n**B0010｜悬念｜8秒**\n\n【0-3秒】（第3场·楼道）△姜屿走近两步，在离他一米处停住。\n分镜：△声控灯灭了两秒，她跺一下脚，灯又亮；两人隔一米对视。\n台词：姜屿：\"你的球，第三板是谁教你的？\"\n表演：沈让捏着手机的手指收紧；她问完就走，背影没给他回答的时间。\n尾钩→ 她怎么看出第三板有问题——「第三板」背后藏着什么？（黑场）\n备注：集末卡点·信息型；暗线半句释放（本集主认知更新唯一：发现者进场提问）。\n\n## 第二集《不配上桌》\n\n场景：①星轨训练馆球台区（内/日）②器材室（内/夜）\n★切片梗点：B0013「不配上桌/当桌子」球桌双关羞辱\n\n**B0011｜危险｜8秒**\n\n【0-3秒】（第1场·球台区·内/日）△考核日，洪川秒表一按，全馆立正。\n分镜：△球台对面：预备队主力热身，两板爆冲打得挡板砰砰响；沈让慢悠悠缠好指缝布条上场。\n台词：洪川：\"考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\"\n表演：「不配上桌」四个字落地，有几声嗤笑；沈让表情没变，只看了眼球桌。\n尾钩→ 考核的不是球——是让他在自己谋生的桌上输掉资格。\n备注：集题句眼；单元模板「一张球台的清算」首次开演。\n\n**B0012｜反常｜10秒**\n\n【0-3秒】（第1场·球台区）△主力开局两板爆冲，球带着风声砸向边角。\n分镜：△沈让退台放高球，全部接回——球一次次从他拍面弹起，弧线一板比一板低；主力越扣越急，汗先掉。\n表演：沈让步伐不乱，眼神只盯球，不看人。\n台词：—（无台词）\n尾钩→ 全场发现：退了十板的人，一个球都没丢。\n备注：小刺激1·防守慢镜；字幕翻译：外行看是狼狈后退｜内行看每一板都回到对方最别扭的落点。\n\n**B0013｜危险｜8秒**\n\n【0-3秒】（第1场·球台区）△主力一板扣飞，气得踹挡板。\n分镜：△主力指着沈让，又指指球桌；围观队员起哄。\n台词：主力（嗤笑）：\"陪练就是陪练——你天天上桌，是给别人当桌子。\"\n表演：哄笑声里，唐果攥着能量胶没嚼；沈让垂眼看了看自己站的位置。\n尾钩→ 羞辱到位了——按规矩，他该输了。\n备注：★切片梗点·双关羞辱；职场映射（干活的坐不上桌）。\n\n**B0014｜反常｜10秒**\n\n【0-3秒】（第1场·球台区）△沈让发球轮，他捏球的手停了半秒。\n分镜：△特写：胶皮摩擦角度，三个发球三种旋转；主力连吃三分，第三板直接把球接飞出台；全馆倒吸冷气。\n表演：沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n台词：—（无台词）\n尾钩→ 说好的「输得像一点」——他连赢三分。\n备注：小刺激3·回击（羞辱→回击 ≤2 拍闭环）；字幕翻译：外行看是三个幸运球｜内行看是三种旋转，接发从出手就错。\n\n**B0015｜悬念｜10秒**\n\n【0-3秒】（第1场·球台区）△急哨。洪川冲进场，第一件事是背对观众席挡住记分牌。\n分镜：△特写：沈让的手指在拍柄上收紧，指节泛白；洪川压低声，眼神在他脸上停了一瞬又移开。\n台词：洪川（压声）：\"沈让，收着点。你的任务是——输得像一点。\"\n表演：洪川说完这句，口哨在嘴边转了半圈没吹响；沈让盯着他看了两秒，缓缓松开拍柄。\n尾钩→ 教练要他输——输，也要输得「像」。像什么？\n备注：暗埋双落点：捏拍柄=大反转伏笔①（第48集让球×退队揭底）；洪川眼神矛盾=中3「洪川倒戈」伏笔①（第48集倒戈）。\n\n**B0016｜反常｜9秒**\n\n【0-3秒】（第1场·球台区）△沈让把球拍轻轻放在球台上，后退一步，当众鞠躬。\n分镜：△鞠躬角度标准得像教学视频；镜头扫过门口——姜屿抱着恢复性训练的球桶站着，全场哄笑，只有她没笑，盯着他刚才捏拍柄的那只手。\n台词：沈让（平静）：\"我瞎打的，蒙的。\"\n表演：「瞎打」两个字咬得很轻；姜屿右手指腹隔着护腕按了一下。\n尾钩→ 所有人都在笑，只有一个人在记。\n备注：藏锋拍（「我瞎打的」=第3集集末「再瞎打一次」钩子的源头）；姜屿目击（发现者线续）。\n\n**B0017｜承诺｜8秒**\n\n【0-3秒】（第1场·球台区）△散场，主力被教练组围住夸「状态回来了」。\n分镜：△唐果溜到沈让身边，塞给他一支能量胶；沈让收器材，把公用球一颗颗擦净归位。\n台词：唐果（小声）：\"让哥，稳住，能赢。\"\n台词：沈让（笑了一下，把能量胶别回唐果胸前口袋）：\"你先稳住。\"\n表演：沈让全剧第一次近似笑的表情，转瞬收住。\n尾钩→ 全队只有一个人信他能赢——而他自己不信「赢」这条路走得通。\n备注：队伍功能件（唐果）就位；唐果口癖「稳住，能赢」首秀（第60集写上新名单回收）。\n\n**B0018｜悬念｜9秒**\n\n【0-3秒】（第2场·器材室·内/夜）△一盏灯，沈让独自缠胶皮，手稳得像做手术。\n分镜：△特写：压胶、划边、滚平，一气呵成；门口地板上多了一道影子，停了三秒，没进来，走了——影子的高马尾轮廓。\n表演：沈让没抬头，手上动作停了一拍，又继续。\n台词：—（无台词）\n尾钩→ 她在看什么——看得懂的人，已经出现第二个了。\n备注：道具：缠胶皮手法（第4集姜屿「看破缠胶皮」发现者实锤的铺垫；写法待专业素材件核实）。\n\n**B0019｜危险｜9秒**\n\n【0-3秒】（第2场·器材室）△手机在器材桌上亮起，队内群弹窗。\n分镜：△群通知：「明日合练，顾曜新增专属陪练一名：沈让。」下面一条回复，头像是保温杯照片。\n台词：魏峥（群内）：\"流量周正好，输球也要输出节目效果。\"\n表演：群消息底下，队员排队回「收到」，只有唐果的「收到」隔了很久。\n尾钩→ 他刚在考核台上证明了自己——换来的是更精确的安排。\n备注：对抗力量学习适应首拍（赢了→被安排得更精确）；「保温杯头像」=魏峥从不进场只在线上的视觉化。\n\n**B0020｜承诺｜9秒**\n\n【0-3秒】（第2场·器材室）△沈让关掉手机屏，器材室只剩一盏灯和他的影子。\n分镜：△他把缠好的球拍立在手心，拇指沿拍沿抹两下；镜头推近他的眼睛，灯芯在瞳孔里一点。\n台词：沈让（低声，像对自己）：\"比分不说谎。节目说了不算。\"\n表演：说完，灯灭，黑场只留球拍立着的一道剪影。\n尾钩→ 明天当顾曜的「专属陪练」——他要让「节目效果」这三个字，变成谁的噩梦？\n备注：集末卡点·情绪型；口癖「比分不说谎」变奏2/3（第18集当众清算回收）。\n\n## 第三集《归来的人》\n\n场景：①俱乐部荣誉室（内/日）②公示栏走廊（内/日）③星轨训练馆球台区（内/日）\n★切片梗点：B0021 蒙尘奖杯回归仪式\n\n**B0021｜反常｜9秒**\n\n【0-3秒】（第1场·荣誉室·内/日）△柜顶一座蒙尘奖杯，姜屿踩着凳子把它取下来。\n分镜：△袖口擦过杯身，灰尘底下露出刻字「07」；特写：她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。\n表演：擦奖杯的动作很慢，很匀，像给什么东西还礼。\n台词：—（无台词）\n尾钩→ 三年前被「评估」掉的人，回来了。\n备注：★切片梗点·蒙尘奖杯回归仪式；道具：07号布+蒙尘奖杯（第15集赛场、第51-52集静场、第60集缝回号码服的长线道具）。\n\n**B0022｜反常｜8秒**\n\n【0-3秒】（第1场·荣誉室）△姜屿把奖杯放回正中，退后一步看了看。\n分镜：△她的余光扫过荣誉墙——旧合影里她的位置被人用相框盖住了；她收回目光，拎包出门。\n表演：没有停顿，没有表情，只在跨出门槛时，把右膝护具紧了紧。\n台词：—（无台词）\n尾钩→ 她不是回来叙旧的。\n备注：道具：被相框盖住的合影（位置被抹除的空间证据，与第1集「剪球」同构；谁盖的不解释，留白给暗线）。\n\n**B0023｜危险｜10秒**\n\n【0-3秒】（第2场·公示栏走廊·内/日）△队员窃窃私语，声音压着但故意让人听见。\n分镜：△姜屿走过，窃语声跟着她移动；洪川迎面拦下，客气而疏远，秒表在指头上转。\n台词：队员（窃语）：\"三年没打比赛，回来占谁的位？\"\n台词：洪川（客气疏远）：\"姜屿是吧。先去陪练组，恢复性训练。\"\n表演：她只点了一下头：\"好。\"——说完就走，不解释，不争。\n尾钩→ 昔日前主力，如今连「队内」都算不上。\n备注：姜屿台词纪律首秀（说话不超过两句，说完就走）。\n\n**B0024｜承诺｜8秒**\n\n【0-3秒】（第2场·公示栏前）△姜屿站定，从护腕内侧抽出 07 号布。\n分镜：△「啪」——07 号布拍在自己的旧照片旁，抚平四角；走廊瞬间安静，洪川的口哨又停了半拍。\n表演：她一个字没说，转身走了；留下满走廊的人和那块布对峙。\n台词：—（无台词）\n尾钩→ 名字她不讨——她自己钉回来。\n备注：★切片梗点回扣（回归仪式完成）；与 B0006 同场域对位：他不辩，她不讨——双主角策略互补的视觉化。\n\n**B0025｜危险｜9秒**\n\n【0-3秒】（第3场·球台区·内/日）△合练开球，顾曜打完一板，转身对镜头比心。\n分镜：△比心收势，他侧过身压低声音警告对面的沈让；观察窗后隐约有立领外套的轮廓。\n台词：顾曜（压声）：\"老实点，别又抽风。\"\n表演：警告完立刻切回笑容；沈让弯腰捡球，没接话。\n尾钩→ 「专属陪练」第一天，摄像机全开着。\n备注：承接 B0019（因为被指派为专属陪练，所以此刻全程在镜头下）。\n\n**B0026｜反常｜9秒**\n\n【0-3秒】（第3场·球台区）△沈让抛球——喂球环节，本该最没有悬念的一球。\n分镜：△球过网后急坠侧拐，顾曜扑空，球擦着他拍边落地；全场静，只听球在地板上滚了两圈。\n表演：顾曜僵在原地，第一反应又是看向观察窗；沈让已经弯腰去捡下一颗球。\n台词：—（无台词）\n尾钩→ 「喂球」喂出了杀招——所有人都在等解释。\n备注：小刺激1；字幕翻译：外行看是顾曜失误｜内行看这球从出手就拐了两次。\n\n**B0027｜悬念｜9秒**\n\n【0-3秒】（第3场·隔壁球台）△姜屿接球的手停在半空。\n分镜：△她盯着那颗球的落点，右手指腹隔着护腕按住 07；慢慢放下球桶，穿过球台之间的过道走过来。\n台词：姜屿（皱眉·自语）：\"这不是失误。是发球机都拉不出来的转速。\"\n表演：她说给自己听，但每个字都砸在沈让耳朵里。\n尾钩→ 她当众「翻译」了这颗球——外行听是怪球，内行听是底牌。\n备注：小刺激2·发现者线启动（第4集「看破缠胶皮手法」实锤的前置）。\n\n**B0028｜反常｜11秒**\n\n【0-3秒】（第3场·球台区）△姜屿拿起球拍，站上对面球台，抬眼。\n分镜：△两人隔网对拉：不说话，十几拍，越打越快；慢镜：胶皮咬球、球身旋转变形的瞬间；全馆停了——别的台不打了，队员围过来，唐果嚼能量胶的嘴停在半开。\n台词：姜屿：\"来。\"\n表演：两个人眼睛里都没有观众，只有球；最后一拍同时收力，球停在网带上，滚都没滚。\n尾钩→ 全馆安静了三秒——这三年，馆里没有过这种球。\n备注：小刺激3·全剧第一次实力外露（单点亮出即收，不掉马）；关系轴「发现者×被证明者」首次同台。\n\n**B0029｜危险｜8秒**\n\n【0-3秒】（第3场·观察窗内监控屏室）△魏峥放下保温杯，杯底磕在台面上。\n分镜：△他盯着场中那两个身影，对身侧的人偏了偏头；玻璃反光里，顾曜涨红的脸退到画面边缘。\n台词：魏峥：\"查一下，谁把这两个人排进一张课表的。\"\n表演：他的语气不怒，像在核对库存——这才是最冷的地方。\n尾钩→ 球台上的事，要被拿到球台外去处理了。\n备注：危险升格引信（第4-6集压力链起点，直通第6集红笔划名单唯一主钩）。\n\n**B0030｜承诺｜9秒**\n\n【0-3秒】（第3场·球台区）△训练结束的哨声里，姜屿隔着球网伸出手。\n分镜：△沈让把拍递过去；特写：她的指腹抚过胶皮边缘——那是全世界只有她被允许碰的拍。\n台词：姜屿：\"把你的拍给我。……明天，当着我的面，再「瞎打」一次。\"\n台词：沈让（擦着拍沿·低声）：\"比分不说谎。明天它替我说。\"\n表演：她把拍还回去时按了一下他的手背，只一秒；两人谁都没笑。\n尾钩→ 明天，全馆都会看着——「瞎打」这个词，撑得到明天吗？（黑场）\n备注：集末卡点·情绪型；口癖「比分不说谎」变奏3/3；道具：拍（关系道具「他的拍只许她一人碰」首次行使）。\n\n## 创作思路页\n\n### 三集总功能（为什么是这三集、为什么这样排）\n\n第 1-3 集是第 1 章（1-6 集）的前半段，三集连续构成一个完整微循环：**受辱（第1集：黑幕可见）→ 藏（第2集：赢了也不算）→ 被看见（第3集：发现者进场）**。第 6 集红笔划名单主钩的全部前置蓄力在这三集完成——观众必须先相信「比分不作数」这个世界规则，第 6 集划掉名字时才会真的替他急。每集只给观众一个主认知更新：\n\n- 第 1 集：**比分是可以被翻的**——这个世界里比分不作数，位置不由球决定。\n- 第 2 集：**他不辩，他记账**——主角的策略是藏锋加留底，他在等一个能当众说话的地方。\n- 第 3 集：**看得懂的人出现了**——发现者×被证明者接通，两个人可以互相证明。\n\n口癖「比分不说谎」三变奏是递进不是复读：B0005 说给自己（记账）→ B0020 说给体系（节目说了不算）→ B0030 说给证人（明天它替我说）——第 18 集当众清算首发是第四次变奏（说给全世界），三集只铺不爆。\n\n### 第一集《选拔黑幕》逐段为什么\n\n- **B0001 为什么放在第一拍**：全剧门面 3 秒必须让「黑幕」可见可恨——翻比分这个动作零解释、当众、无人吭声，情绪三层（流量实力倒挂/选拔不透明/功劳记账）的第一层直接踩下，不解释任何设定。**埋了什么**：画外音「比分是给人看的」同时是中 2「同一支笔」伏笔①——此刻观众只当它是狂言，第 46-47 集揭晓同一支笔时回看才对味（暗线只在卡点半句释放的纪律）。\n- **B0002 为什么紧跟**：反派梯度第一层（顾曜）立反差——最亮的位置最空的手。摔拍后偷看观察窗是中 1「太子白手套」伏笔①：观众此刻只觉得他怂，第 38 集发现他也是筹码时重算。\n- **B0003-B0004 为什么**：功劳记账的第一颗种子（魏峥一句话剪掉第三球）+ 第一集情绪谷底（「发球机」当众受辱）。「发球机」是职场映射第一层——干活的人不配署名，不懂球的观众也疼。\n- **B0005 为什么**：受辱后必须立刻给主角态度，否则观众只剩憋屈——不辩、记账。「比分不说谎」首次出场，定下全剧清算的台词母题。\n- **B0006-B0007 为什么**：公示栏=权力交接仪式位首次亮相（第 6 集红笔划名、第 60 集红笔写名首尾同机位的母题铺垫）；应援灯牌首次亮相（第 18 集灯牌成片熄灭回收）。「章是后盖的」一句把「公示是通知不是商量」钉死。\n- **B0008 为什么**：留底习惯是主角的金手指雏形——他赢不了当下，就先赢证据。观众从这里拿到第 18 集大卡点的第一份期待。\n- **B0009-B0010 为什么收在这**：集末卡点必须从明线切到关系轴——姜屿进场只给一个按护腕的动作加一个问题，不给答案。「第三板是谁教你的」既是她的入场券，也是全剧关系轴的第一颗铆钉；信息型卡点负责把观众带进第 2 集。\n\n### 第二集《不配上桌》逐段为什么\n\n- **为什么整集是单元模板第一演武**：「一张球台的清算」模板（受辱→≤2 拍回击→记账）先用最小单位跑一遍，但关键变奏是——回击被急哨掐断（B0015）。观众第一次尝到「赢了也不算」的体系压制，为第 8 集回放装置（当场翻案闭环、首付费卡点）制造刚需：没有回放，赢球随时可以不作数。\n- **B0015 为什么是全集中场**：暗埋双落点拍。捏拍柄特写=大反转伏笔①（他为什么对「输得像一点」反应这么大——第 48 集让球×退队揭底）；洪川眼神矛盾=中 3 倒戈伏笔①（第 48 集倒戈）。两处都只给特写不给解释。\n- **B0016 为什么**：「我瞎打的」是藏锋，也是给第 3 集集末「再瞎打一次」的钩子源头——姜屿的要求等于逼他从藏走向露，主角策略的第一次被撬动。\n- **B0017-B0018 为什么**：唐果功能件就位（队伍线只留他一人，容量裁决）；器材室影子拍让姜屿的「看」延续一条暗动作线，为第 4 集看破缠胶皮手法（发现者实锤）铺最后一级台阶。\n- **B0019-B0020 为什么收在这**：证明了自己反而换来「专属陪练」——对抗力量会学习适应，这是递进复杂化第一次显形。卡点台词「节目说了不算」把本集主认知更新（记账）推到「对体系宣战」，情绪型卡点负责愤怒，不是悬念。\n\n### 第三集《归来的人》逐段为什么\n\n- **为什么整集给姜屿**：强者回归轴的载体必须先立「被偷走的东西」（蒙尘奖杯、被相框盖住的合影、陪练组安排），再立「自己拿回来」（07 拍回公示栏）。她的清算性质是物归原主，与沈让的清算（打回位置）构成双主角互补，两条清算线在第 18 集汇成同一个当众清算。\n- **B0021-B0022 为什么**：蒙尘奖杯+被盖合影是「功劳被抹」的空间版，与第 1 集剪球同构但一句台词不说——她的戏全在动作里。07 号布进护腕是长线道具就位（第 15 集赛场首现、第 51-52 集静场、第 60 集缝回号码服）。\n- **B0023-B0024 为什么**：先压到底（连「队内」都算不上）再弹起（07 拍回公示栏），一压一弹在同一走廊完成——与 B0006「章是后盖的」同场域对位：他不辩、她不讨，两人策略互补的视觉化，观众第一次意识到这是两个同类。\n- **B0026-B0028 为什么**：喂球杀招→她当众翻译→隔网对拉，三拍完成发现者×被证明者的接通。对拉是全剧第一次实力外露，按掉马纪律单点亮出即收（不做层层撕），全馆安静三秒是本集情绪峰值，也是第 42 集深夜对拉无言的远呼应。\n- **B0029 为什么**：魏峥「查一下」把球台上的事拿到球台外处理——危险升格的引信，直通第 6 集划名单主钩（沈让「藏到退役」的策略将从这里开始被打断）。\n- **B0030 为什么收在这**：卡点收在关系道具「拍」上（他的拍只许她一人碰）——关系轴不落恋爱标签、全部道具化的第一次执行。「明天它替我说」= 公开化的承诺，观众带着「瞎打这个词撑得到明天吗」进第 4 集。\n\n### 伏笔回收对照表（本三集埋、后文收）\n\n| 拍 | 埋了什么 | 在哪回收 |\n| --- | --- | --- |\n| B0001 | 「比分是给人看的」（同一支笔伏笔①） | 第 46-47 集揭晓、第 48 集引爆 |\n| B0002 | 顾曜摔拍偷看观察窗（白手套伏笔①） | 第 38 集白手套觉醒 |\n| B0003 | 宣传素材「剪球」 | 第 10 集预告片挪用、第 18 集原始留底对照 |\n| B0006/B0024 | 公示栏母题（盖章/钉 07） | 第 6 集红笔划名、第 60 集红笔写名同机位 |\n| B0007 | 应援灯牌 | 第 18 集灯牌成片熄灭 |\n| B0008 | 云盘原始留底 | 第 18 集大卡点证据底牌 |\n| B0015 | 捏拍柄（大反转①）/洪川眼神矛盾（倒戈①） | 第 48 集双引爆 |\n| B0016 | 「我瞎打的」 | B0030「再瞎打一次」→ 第 8 集回放翻案线 |\n| B0017 | 「稳住，能赢」 | 第 60 集写上新名单的祝语 |\n| B0018 | 缠胶皮手法 | 第 4 集姜屿看破（发现者实锤；写法待专业素材件核实） |\n| B0021/B0024 | 07 号布、蒙尘奖杯 | 第 15 集赛场、第 51-52 静场、第 60 集缝回号码服 |\n| B0029 | 魏峥「查一下」 | 第 6 集划名单主钩 |\n| B0030 | 「拍」的关系道具 | 第 30 集后递拍吃味拍、第 42 集对拉无言 |\n\n### 纪律自查\n\n- 每集 10 拍（9-12 内）、每拍 6-15 秒、每拍一个认知更新；拍号 B0001-B0030 连续，可逐拍批注。\n- 每集场景 ≤3（第1集3场/第2集2场/第3集3场）；前三章专名仅「星轨」「启明」；有名有姓 6 人全部就位。\n- 每拍钩型仅用悬念/反常/危险/承诺四型；第一集首拍 B0001=反常。\n- 每集 ≥1 ★切片梗点 + ≥3 小刺激；「比分不说谎」每集 1 变奏；暗线只在集末卡点释放半句。\n- 全文无任何真实运动员、协会、赛事、赞助商、场馆名；无口号式台词；技战术描写以可核验常识为限且逐处配翻译。\n\n*产物完。2026-09-16 · 小纲师（scene-screenwriter 剖面 · scene-breakdown 技能）。派生自《选题方案.md》第五节 B 拍分拍初稿，与《故事框架案.md》暗埋表逐处对齐。*\n", "热点素材.md": "# 热点素材 · 拍魂（时代情绪锚）\n\n- 项目：p-key-soul（乒乓题材竞技爽剧）\n- 生成：2026-09-16 · 网感师（story-analyst 剖面）· 全新重跑\n- 依据：`skills/topic-zeitgeist.md` + `选题素材.md`（甲方：\"德不配位\"公共情绪切入）\n- 证据说明：本轮检索多次触发限流，30 天窗口内逐条热搜证据不足。按技能纪律执行降级策略——主锚采用**可核验的长期公共议题 + 2026 年官方持续动作**，辅以 **30 天内赛事节点**；全部证据标注等级，未编造任何热搜。\n\n---\n\n## 一、时代情绪锚声明\n\n> **时代情绪锚**：本选题踩中的是〔\"德不配位\"——大众对\"位置、资源、荣誉与实力贡献倒挂\"的持续愤怒与身份焦虑：凭什么他坐那个位置〕（证据：主锚为国家体育总局 2026 年 5 月\"持续整治饭圈乱象、融入运动员选拔输送安置全过程\"的官方定调（新华网 2026-05-19，B 级）及 2024 年以来总局、网信办多轮整治表态（C 级，见第三节）；辅锚为 2026-09-15 至 10-11 间 WTT 赛事节点带动的全民乒乓注意力（A/B 级，见第三节）。）\n\n- 情绪本质：不是仇富，也不是反偶像——是**\"位置该由实力与贡献定价\"**这条朴素正义感被反复冒犯后的积压。饭圈化只是该情绪在体育域的显影，同一神经在职场（关系户占坑）、文娱（资源咖）领域同样在疼。\n- 对位甲方需求：甲方指定\"德不配位\"切入，与上述公共议题天然同构；故事即该情绪的具象化执行。\n\n## 二、情绪拆解：三层公共神经 → 戏剧动作\n\n| 神经层 | 大众原话（情绪句式） | 戏剧动作（爽剧执行） |\n| --- | --- | --- |\n| ① 流量与实力倒挂 | \"赢了球的人上不了热搜，热搜上的人赢不了球\" | 主角靠硬实力一路打穿名额、排名、商业资源全部由流量逻辑把持的体系 |\n| ② 选拔与资源分配不透明 | \"名单公示那一刻，才知道有些位置早就内定了\" | 大赛名单/梯队名额争夺作为全剧骨架（对位灌篮高手队伍线+大赛终点感） |\n| ③ 荣誉的营销化 | \"奖牌是他的，功劳是谁的？\" | 隐形贡献被系统性记在别人名下——陪练、让位、战术牺牲被叙事抹除 |\n\n三层叠加出本剧公共情绪公式：**位置（名额）× 资源（陪练/商业/话语权）× 荣誉（功劳记账）** 的分配权，握在不懂球也不尊重球的人手里。\n\n## 三、证据清单（分级）\n\n### A 级 · 30 天内（2026-08-17 ~ 2026-09-16）\n\n- **A1 · WTT 球星挑战赛阿斯塔纳站 2026-09-15~20 进行中**：乒乓球国际赛事正在比赛周，大众注意力在线。来源：WTT 官方赛程页 worldtabletennis.com/eventslist（赛事条目可核验）。\n- **A2 · WTT 中国大满贯 2026 临近（10 月 1-11 日，北京首钢园，官方特许商品 9 月已在服贸会预售、青少年大满贯门票 9 月 15 日开售）**：9 月中下旬起乒乓话题热度爬坡，10 月初国庆档引爆。来源：worldtabletennis.com 赛程列表（赛事存在，A 级）；具体日期/奖金等细节转述自检索摘要，建议上线排期前以 WTT 官方公告复核（此部分 B 级）。\n- **A3 · \"清朗·整治账号名称信息乱象\"专项（2026 年 6 月启动、为期 3 个月）至本周期仍在执行窗口**：粉丝冒充、身份伪装类账号治理与体育饭圈同谱系。来源：中国网信网\"清朗\"系列专项行动索引页 cac.gov.cn/wxzw/qinglang/A093711index_1.htm。\n\n### B 级 · 2026 年内可核验（权威来源）\n\n- **B1 · 新华网 2026-05-19《国家体育总局：持续整治\"饭圈\"乱象 厚植体育文明风尚》**：总局明确\"把坚决抵制畸形饭圈文化的意识和要求**融入运动员选拔、输送、安置的全过程**\"。——官方把话题钉死在\"选拔与位置分配\"上，与本剧冲突骨架完全同构。\n  http://www.news.cn/sports/20260519/dcda991a96cf4b91a844dd1507d0d70c/c.html\n- **B2 · 2026-04-28 ~ 05-10 伦敦世乒赛团体赛举行**（第 58 届，伦敦铜箱馆，64 队规模，Olympics.com 官方赛事页可核验）；赛后国乒新老交替、阵容与参赛安排是公共讨论焦点（此句转述自检索摘要，B 级）。\n  https://www.olympics.com/zh/sport-events/2026-ittf-table-tennis-world-team-championships-finals-london\n- **B3 · 中央网信办 2026 年清朗系列持续部署**（含 2026-04\"整治 AI 应用乱象\"等），整治范围一贯覆盖\"借体育赛事话题鼓动饭圈拉踩攻击\"。来源：cac.gov.cn 清朗索引页。\n\n### C 级 · 长期公共议题（2024-2025 权威报道，议题生命力延续至今）\n\n- **C1** 光明网 2024-05-16：体育总局首次公开表态\"坚决抵制畸形饭圈文化\"，要求融入运动员管理全链条。https://news.gmw.cn/2024-05/16/content_37325049.htm\n- **C2** 中国日报网 2025-03-11：体育总局负责人在全国人大\"部长通道\"再次表态抵制饭圈文化侵蚀体育（不点名，仅引机构表态）。https://cn.chinadaily.com.cn/a/202503/11/WS67d01f6aa310510f19eeaff4.html\n- **C3** 中国新闻网 2024-05-30：微博等平台开展为期 3 个月\"体育饭圈生态治理\"专项，打击互撕、控评、泄露隐私、违规集资。https://www.chinanews.com/ty/2024/05-30/10225699.shtml\n- **C4** 新京报调查报道《畸变的 8 年：2016—2024 体育饭圈乱象调查》：媒体对该情绪成型的系统梳理。https://m.bjnews.com.cn/detail/1716978715168436.html\n\n### 证据等级说明\n\n- A = 事件落在 30 天窗口且来源可核验；B = 2026 年内权威来源可核验；C = 长期议题、权威历史报道。\n- 30 天内的**具体舆情热搜条目**（平台热搜榜截图级证据）因检索限流未能逐条取证，按技能纪律不作虚构；主锚证据强度由 B1（官方 2026 年持续定调）承担，其为\"进行中议题\"而非过期新闻。\n\n## 四、情绪具象化路线（大白话检验）\n\n按 topic-zeitgeist 第 2 条，把主角处境写成一句大白话，必须是\"像真社会新闻标题\"的句子：\n\n- 测试句 1：「**他当了八年主力的影子，大赛名单公布那天，名额给了粉丝百万的营销天才**」\n- 测试句 2：「**他赢下决胜分，第二天热搜挂在别人名字下面**」\n- 测试句 3：「**陪练十年的功劳，被写进了别人的纪录片**」\n\n三条全部通过\"真实新闻标题感\"检验（对应 B1 官方语境里的\"选拔安置全过程\"+C4 调查里的功劳/叙事争夺）。故事不拍\"坏人夺位\"的私怨，拍**一套分配机制的失灵**——私怨只是它的戏剧外壳。\n\n## 五、共鸣乘数：预埋截图转发拍点\n\n面向\"这说的是我/我同事/我孩子\"的观众（职场人、体育迷、学生家长），在 60 集体量中预埋：\n\n1. **名单公示拍**（约前 10 集内）：主角名次够、名额没份——评论区自.live\"现实里见过\"。首波二创源。\n2. **功劳记账拍**（中段）：把队友牺牲写进自己名下的发布会/采访戏——截图自带\"德不配位\"话题标签，天然适配弹幕玩梗。\n3. **热搜倒挂拍**：主角夺冠瞬间，镜头一切——热搜第一是别人的商业官宣。黑白对比画面，竖屏漫剧竖构图强项，最佳截图帧。\n4. **镜像拍**（对位双主角互相成就）：流量型角色不是纸片反派——他同样被流量反噬（不敢输、不能病、粉丝替他恨人），与主角互为镜子，承接\"双主角互相成就\"的甲方结构，同时避免\"批判饭圈女孩\"的一刀切（受众里就有她们）。\n\n## 六、锚点贯穿：反派的作恶方式 = 情绪的现实原型\n\n- 反派不是传统意义的坏人，而是**\"分配机器\"本身**：营销化的教练组/经纪逻辑、控评的粉丝团、掌握名额与话语权的体系内人物。其作恶手段逐一对应公共情绪原型：\n  - 名额内定 ← 现实中\"选拔不透明\"质疑（B1 官方语境）；\n  - 功劳挪用 ← 现实中叙事操盘、控评洗地（C3、C4）；\n  - 资源倾斜 ← 现实中商业流量优先于竞技价值（B2 赛历/参赛安排讨论）。\n- 情绪是燃料不是说教：全剧不出现\"整治\"\"抵制\"等口号式台词，只把\"位置不该他坐\"拍成一场一场的球。\n\n## 七、节点对位（上线节奏建议）\n\n- **2026-09 中下旬**：WTT 赛事密度高（阿斯塔纳站进行中 → 中国大满贯 10 月 1-11 日预热期），大众乒乓注意力爬坡——**前 10 集\"名单公示\"冲突在此窗口投放**，蹭真实赛程期的全民讨论。\n- **2026-10 国庆档**：中国大满贯开赛（北京首钢园），乒乓话题峰值——若排期允许，让剧中\"大赛\"高潮段落与真实赛期共振。\n- 青少年大满贯同场馆设定（9 月起有真实话题度）可映射剧中\"梯队/后备队\"线，增强\"这就是真事\"的既视感。\n\n## 八、合规红线执行\n\n- **不点名任何真实运动员**：全文无任何真人运动员姓名；情绪证据均引机构表态、官方行动与媒体调查，不引对具体运动员个人的争议事件。\n- **不影射具体真实比赛/名场面**：剧中大赛、协会、俱乐部全虚构；\"名单内定\"\"功劳挪用\"等桥段为公共议题的戏剧化虚构，不与任何真实赛事结果一一对应。\n- 反派与粉丝群像避免指向性设定（无真实协会名、地域、队服暗示）。\n- 引用证据仅用于创作锚定，不进入正片台词与画面。\n\n---\n\n*产物完。数据截至 2026-09-16；排期前建议复核 A2 中 WTT 中国大满贯具体日期与赛程。*\n", "选题分析报告.md": "# 选题分析报告：《拍魂》（乒乓球竞技爽剧 · 项目 p-key-soul）\n\n---\n\n## 一、市场分析\n\n### 1.1 赛道温度判断：上升（结构性窗口期）\n\n按「需求侧热度 × 供给侧密度」双轴判定（口径：n + 均热度，单部爆点不算带，来源 kb/market/structure，数据快照 2026-09-15，parsed 6928 部，全库均热度 10058 万）：\n\n- **需求侧（主梗带）：强热。** 打脸虐渣 n=1510 / 均 18558 万，红海·有效（约为全库均值的 1.85 倍）；类目级旁证更硬：打脸 n=536 / 均 22657 万，逆袭 n=1042 / 均 20955 万，强者回归 n=107 / 均 21803 万（CN，n≥100 类目）——本选题的主梗组合（打脸虐渣 × 隐藏实力 × 强者回归）整部落在这三条强热度带的交集上，需求侧无虞。\n- **供给侧（竞技载体）：稀薄 = 蓝海窗口。** 快照 CN 类目无「体育/竞技」类目；NA 市场 Sports-Romance n=111 / 均 1225 万，远低于 NA 强热度带。竞技载体在两个市场均为供给洼地——这是窗口，同时意味着无成熟套路护栏（对策见第五节风险 R2）。\n- **必须规避的邻接带（已识别）：** 马甲掉马 n=750 / 均 9215 万（过饱和，热度已被拉到全库均值下方）；真假千金 n=83 / 均 7938 万、团宠护短 n=63 / 均 2703 万（退潮期·慎入）。\n\n**综合判定：上升（窗口期）。** 判断依据是「老引擎上新车」：清算/逆袭引擎处于多轮验证后的强带稳定期，而其运载题材（乒乓球竞技）在库内供给空白。\n\n### 1.2 在 2025-2026 题材轮动中的位置\n\n- 轮动主力即打脸/逆袭/强者回归强带；神豪暴富·隐藏实力变体处「上升期·蓝海偏好」（n=380 / 均 18987 万），赘婿战神之「强者回归」轴横切类目同处强带（n=107 / 均 21803 万）——本选题的辅梗组合踩在轮动的上升半区，不是在退潮带上接盘。\n- **实时公共议题加持（本轮动的差异化位置）：** 主锚证据为国家体育总局 2026 年 5 月官方定调——「持续整治饭圈乱象，融入运动员选拔、输送、安置全过程」（新华网 2026-05-19，B 级证据，机构表态，不涉具体个人）。该定调把公共议题钉死在「选拔与位置分配」上，与本选题「德不配位」的冲突骨架完全同构，且是**进行中议题**而非过期新闻。竞技载体 + 分配正义情绪，在当前轮动中属「强带引擎 × 全新载体 × 官方议题背书」三者叠加的少见位置。\n\n### 1.3 平台格局与发行路径建议\n\n- 形态决定口径：AI 漫剧竖屏，60 集 × 1-1.5 分钟——正是付费短剧在售库的主流口径（60 集 4224 部为最高频档，单集 1-1.5 分钟口径，来源 kb/market/constraints，7938 部在售统计，快照 2026-09-14）。**建议主口径走付费墙（独立 App / 小程序付费短剧模式）**，以切片分发为获客面：梗卡已按「前三章每集 ≥1 处可独立切片传播的梗点」完成 1-18 集预布点，分发端天然适配。\n- 免费 IAA 可作备选发行，不改变本报告的内容约束。\n- **排期窗口（来源：热点素材 A1/A2，证据见第四节）：** 2026-09-15~20 国际乒乓赛事进行中，10 月上旬国内大满贯级赛事临近，9 月中下旬起全民乒乓注意力爬坡。建议前 10 集「名单公示」冲突对位该窗口投放；上线排期前复核 A2 中赛程具体日期（热点素材已注明该细节为 B 级转述）。\n\n---\n\n## 二、目标客群\n\n### 2.1 主客群\n\n- **画像：18-40 岁竖屏短剧用户，身份认同以「职场/普通奋斗者」为核心的泛性别客群。** 观看场景：通勤、午休、睡前的碎片时间刷短视频；付费能力与意愿：对标库同口径（60 集付费短剧）为在售主流档，同族头部件受众多为有付费习惯的成年短剧用户——对标件 b012 明示受众「22-45 岁女性」，b016 主打「打工人被轻视」的职场痛点，本选题情绪同源而载体更普适（乒乓球为全民项目，梗密度富矿，meme-rules 第三节明示「同等条件优先选梗储量高的领域（如国球）」）。\n- **咬合点：** 「位置该由实力与贡献定价」这条朴素正义感，在职场（关系户占坑）、文娱（资源咖）、体育（流量与实力倒挂）三域同时成立（热点素材第二节三层神经）。职场人看「名额内定」= 看自己的晋升系统；这个情绪不需要懂球就能代入——三分钟测试天然可过。\n\n### 2.2 次客群\n\n- **体育泛用户与学生家长：** 队伍线 + 大赛终点感（甲方指定结构参考的骨架）自带跨代际认知；「梯队/后备队」线可映射青少年赛事话题（热点素材第七节节点对位），家长群体的「我孩子也练球」共鸣位。\n- **娱乐吃瓜用户（含饭圈受众）：** 塌房三连、热搜倒挂等舆论场戏自带传播性。注意：热点素材「镜像拍」已明确——流量型角色不是纸片反派，同样被流量反噬；本选题批判的是分配机制而非粉丝群体，**受众里就有她们**，这是一刀切批判饭圈女孩的写法必须避开的原因。\n\n### 2.3 规模量级估计\n\n- 有数据部分（代理指标）：库内强带规模——打脸类目 n=536 / 均 22657 万、逆袭 n=1042 / 均 20955 万，说明该情绪客群是短剧付费盘的主力盘子之一；全库均热度 10058 万（6928 部）为基线。\n- 无数据部分：乒乓球人口规模、短剧大盘用户数、本题材首刷量级——素材内无来源，**（待补充）**，不做编造估计。\n\n---\n\n## 三、竞品分析\n\n### 3.1 短剧对标件（同库，可直接挂为强度标尺）\n\n| 件 | 市场/频向 | 题材标签 | 成绩 | 可借鉴点 | 本方案差异机会 |\n| --- | --- | --- | --- | --- | --- |\n| b003-cn《草包状元：开局沙盘点崩十军》 | CN/男频 | 兵棋推演/权谋/逆袭 | 热度 150000 万 / A 级 / AI 评 83 | 开局金殿当众立军令状+当众算崩杀阵——「当众清算」的烈度上限标尺（对应本项目首章资格赛当众打崩占位者的强度基准） | 清算载体由沙盘换为公开计分：比分即判决书、回放即证据链、积分榜即公开账本 |\n| b016-fam《扫地姑娘是百亿精算师》 | CN/女频 | 都市职场/隐藏实力 | 热度 94000 万 / A+ 级 / AI 评 86 | 白板夜演引全城搜寻 → 对赌局当众徒手复原数据——「隐藏实力两段式揭示节奏」标尺 | 揭示时机由偶然事件改为主角每集的「藏/露」策略变量；深夜训练馆一盏灯为白板夜演的竞技转译 |\n| b027-s《给大妈爆改后我成了顶流》 | CN/女频 | 治愈/职场逆袭/群像 | S 级 / AI 评 91 | 露天广场连夜搭台引爆全网——黑热搜→全民共鸣的舆论翻转 + 群像终点战，即「大赛终点 × 舆论场翻转」标尺 | 终点战由走秀换为决赛赛场；群像由阿姨群换为各怀执念的队伍线 |\n| b012-cn《拆盲盒后，我把渣男净身出户了》 | CN/女频 | 都市爽剧/打脸虐渣 | 热度 118000 万 / A+ 级 / AI 评 89 | 同梗族（打脸虐渣）头部件的闭环反转打法 | 本题清算对象是「分配机制」（占位者集团），不是私人恩怨——公共情绪浓度更高 |\n| b019-na《Inferno Tower Savior》 | NA/男频 | 灾难/强者回归/极速打脸 | 热度 24000 万 / S 级 / AI 评 90 | 「被开除的底层专业者当众赢回位置」的强者回归 NA 基准 | NA 体育带均热度仅 1225 万——竞技载体在 NA 是空窗，本方案优先 CN 市场 |\n\n### 3.2 韩剧同情绪赛道基准（近 3 年，冲突强度与情绪浓度基准）\n\n按方法论强制要求，对标库包含近 3 年韩剧同情绪赛道作品作为爽感基准——短剧的爽感标准已被韩剧抬高，只看短剧对标会低估观众阈值：\n\n| 作品 | 题材标签 | 与本方案的情绪同构点 | 成绩数据 |\n| --- | --- | --- | --- |\n| 《黑暗荣耀》 | 校园暴力受害者多年后系统性复仇 | 「清算」的浓度基准：不是泄愤，而是把施害者的位置、关系、体面逐层拆到塌方——本题「占位者集团」的清算也需要这种层层收紧的仪式感 | （待补充对标） |\n| 《请和我的老公结婚吧》 | 重生+职场/婚姻背叛清算 | 「被抢走位置的人拿回一切」——强者回归轴的情绪原型；配角恶行当众曝光的名场面节奏 | （待补充对标） |\n| 《财阀家的小儿子》 | 财阀/结构性质疑 | 「贡献与回报倒挂」的公共愤怒——忠臣功劳被系统性抹除，正是本题「功劳记账」神经层的浓度上限参照 | （待补充对标） |\n\n结论：本题情绪公式（位置 × 资源 × 荣誉的分配权错配）与上述三剧同处「分配正义清算」情绪赛道，韩剧已把该赛道的观众阈值抬到「清算必须公开、必须证据链完整、必须让对方当众社会性死亡」的程度——本题的计分板/回放/积分榜公开账本设定恰好是这套阈值在竞技场上的天然实现件。\n\n### 3.3 结构参考件（甲方指定，非市场竞品）\n\n灌篮高手（队伍线 + 大赛终点感）× 金牌得主（双主角互相成就）。**版权红线：致敬位台词必须原创改编，不得直接引用**（梗卡风险条目已立）。\n\n### 3.4 竞争密度结论\n\n- 主梗带：**红海·有效**——进场条件是强制新变体，本题已备「计分板清算」三轴新变体（人设轴：陪练载体 × 占位太子；场景轴：计分/回放/积分榜；关系轴：发现者 × 被证明者互为触发器），具备进场资格。\n- 竞技载体子域：**蓝海窗口**——CN 语料无体育/竞技类目、NA 体育带热度远低于强带，供给稀薄。窗口开启依据 = 供给空白 + B1 官方议题定调进行中 + 30 天内赛程节点（A1/A2）；**窗口时长无数据可量化（待补充）**，无法承诺保质期，故建议抢跑 2026 年 9 月中下旬至 10 月的赛事注意力窗口。\n\n---\n\n## 四、数据分析\n\n以下全部为素材包与知识包内的量化/可核验证据，每项标注来源；无数据支撑的判断不进本节。\n\n### 4.1 库级与梗族热度（来源：kakaxing scriptrawstone 快照 2026-09-15，parsed 6928 部，全库均热度 10058 万）\n\n| 梗族 | n | 均热度（万） | 饱和度判定 | 对本项目 |\n| --- | --- | --- | --- | --- |\n| 打脸虐渣 | 1510 | 18558 | 红海·有效 | 主梗（带新变体进场） |\n| 神豪暴富 | 380 | 18987 | 上升期·蓝海偏好 | 辅梗 1（隐藏实力变体） |\n| 赘婿战神 | 192 | 10684 | 稳定·主流 | 辅梗 2（仅取强者回归轴） |\n| 重生复仇 | 702 | 11978 | 红海·有效 | 不取（与「当下清算」情绪错位） |\n| 马甲掉马 | 750 | 9215 | 红海·过饱和 | 避开主线（低于全库均值） |\n| 先婚后爱 | 387 | 10092 | 稳定·主流 | 不预设（甲方未点名恋爱轴） |\n| 追妻火葬场 | 132 | 14218 | 上升期·蓝海偏好 | 不取（与互相成就轴相反） |\n| 流放种田 | 92 | 22598 | 上升期·蓝海偏好 | 不取（机制不可移植竞技） |\n| 真假千金 | 83 | 7938 | 退潮期·慎入 | 避开 |\n| 团宠护短 | 63 | 2703 | 退潮期·慎入 | 避开 |\n\n### 4.2 类目级旁证（CN，n≥100，同快照）\n\n打脸 n=536 / 均 22657 万；逆袭 n=1042 / 均 20955 万；强者回归 n=107 / 均 21803 万——三条强热度带，主梗组合正落于此。NA Sports-Romance n=111 / 均 1225 万（远低于 NA 强带）——竞技载体跨市场供给稀薄的直接证据。\n\n### 4.3 对标件成绩（来源：kb/benchmark，版本 2026-09-15）\n\nb003-cn：热度 150000 万 / A 级 / AI 评 83；b016-fam：热度 94000 万 / A+ 级 / AI 评 86；b027-s：S 级 / AI 评 91；b012-cn：热度 118000 万 / A+ 级 / AI 评 89；b019-na：热度 24000 万 / S 级 / AI 评 90。全部对标件生产约束实盘值一致收敛于：60 集 / 单集 1-1.5 分钟 / 场景 ≤3 / 演员 ≤10——即本报告约束移交单成本档的直接依据。\n\n### 4.4 生产约束实盘（来源：kb/market/constraints，7938 部在售剧本硬格式统计，快照 2026-09-14）\n\n60 集为最高频档（4224 部）；单集 1-1.5 分钟口径；单集字数上限主流 1200 字；场景数 ≤3 为几乎全库硬约束（7937/7938）；主要演员 ≤10（7925 部）。注：本表与 4.1 的部数差异系两次快照口径不同（2026-09-14 在售全量 7938 部 vs 2026-09-15 解析 6928 部），各自随源引用。\n\n### 4.5 时代情绪证据链（来源：热点素材.md，分级标注）\n\n- **A 级（30 天窗口内）：** A1 国际乒乓赛事进行中（2026-09-15~20，官方赛程页可核验）；A2 国内大满贯级赛事临近（10-01~11，赛事条目 A 级、日期细节 B 级转述，排期前复核）；A3「清朗」专项在执行窗口（2026-06 启动为期 3 个月，网信官方索引页）。\n- **B 级（2026 年内权威来源）：** B1 官方媒体 2026-05-19 报道体育主管部门定调「把抵制畸形饭圈文化融入运动员选拔、输送、安置全过程」——本选题主锚证据；B2 世乒赛团体赛 2026-04~05 举行（官方赛事页可核验），赛后阵容与参赛安排为公共讨论焦点（转述，B 级）；B3 清朗系列持续部署覆盖体育话题拉踩。\n- **C 级（2024-2025 长期公共议题，生命力延续至今）：** C1 主管部门 2024-05 首次公开表态；C2 2025-03 全国人大「部长通道」再表态；C3 2024-05 平台方三个月体育饭圈生态治理专项；C4 媒体调查报道《畸变的 8 年：2016—2024 体育饭圈乱象调查》。\n- 证据缺口声明（热点素材原文）：30 天内平台热搜榜级逐条证据因检索限流未能取证，按纪律不作虚构；主锚强度由 B1（进行中的官方定调）承担。情绪大白话测试句 3 条全部通过「真实新闻标题感」检验（热点素材第四节）。\n\n### 4.6 数据缺口清单（以下均无素材来源，不进结论）\n\n单分钟 AI 制作成本、买量成本（CAC/ROI）、平台分账单价、乒乓球人口规模、韩剧三件成绩数据——全部 **（待补充）**。\n\n---\n\n## 五、结论与建议\n\n### 5.1 推荐度：强推\n\n**一句话理由：** 强带清算引擎 × 库内空白的竞技载体 × 官方定调进行中的「德不配位」公共情绪 × 30 天内赛程注意力窗口，四重同频，且进场所需的新变体已备——这是条件齐备的强推，不是赌一把的强推。\n\n### 5.2 风险清单（每条附对策）\n\n| # | 风险 | 对策 |\n| --- | --- | --- |\n| R1 | 主梗红海同质化（打脸虐渣 n=1510，进场即遭遇头部挤压） | 红海进场条件 = 强制新变体：「计分板清算」三轴必须原样落地方案，创新亮点段必须回指（见 C9），答不上来即假新意，打回重写 |\n| R2 | 竞技载体无成熟套路护栏、语料未覆盖，专业细节有编造风险 | 强度挂对标标尺兜底（b003 当众清算上限 / b016 两段式节奏 / b027 舆论终点战）；乒乓专业细节由调研步补课核实，剧本阶段禁止自造专业体系 |\n| R3 | 马甲掉马贴脸跌入过饱和带（n=750 / 均 9215 万，低于全库均值） | 隐藏实力只作为打脸时机的策略变量（藏/露），禁止「身份收集/层层撕马甲」写法；掉马只作清算的瞬时态，不作主线 |\n| R4 | 退潮元素渗入（团宠护短均 2703 万 / 真假千金均 7938 万） | 队伍线以战友情与各自执念驱动，禁写「全员宠主角」；不引入真假千金型身世线 |\n| R5 | 「德不配位」情绪的影射与舆论翻车风险 | 全虚构：无真实运动员/协会/赛事/赞助商名，无地域、队服等指向性暗示；「饭圈」议题只取情绪不点名；占位者集团立场自洽（非一边全错），不影射任何真实事件或名场面；正片与宣发切片同守此线 |\n| R6 | 版权风险（灌篮高手 / 金牌得主为甲方指定参考） | 致敬位台词全部原创改编，不得直接引用；只借结构（队伍线+大赛终点 / 双主角互相成就），不复制具体桥段 |\n| R7 | 爽感阈值已被韩剧抬高，只对标短剧会低估观众 | 清算浓度以韩剧基准组（3.2 节）为下限：公开、证据链完整、当众社会性死亡三要素缺一不可；短剧侧烈度上限对表 b003 金殿位 |\n| R8 | 关系轴预期错位（甲方未点名恋爱轴） | 双主角默认按「互相成就」（发现者 × 被证明者互为爆点触发器，师徒/搭档双可）写，不预设恋爱；甲方点名恋爱轴时另挂先婚后爱族重新过卡 |\n| R9 | 30 天热搜级证据不足（检索限流，热点素材已声明降级） | 主锚由 B1 官方定调（进行中议题）承担；上线排期前复核 A2 赛程细节并补拍热搜级证据；排期按 9 月中下旬—10 月窗口倒排 |\n\n### 5.3 创作约束移交单（选题方案步必须逐条遵守，可校验）\n\n**C1 · 目标市场与客群**\n- 目标市场：CN 优先（NA 体育带均热度 1225 万，暂不做 NA 变体）；route=dual 双主角。\n- 主客群：18-40 岁竖屏用户、职场/奋斗者身份认同为核心；次客群：体育泛用户、学生家长、娱乐吃瓜用户。方案中所有爆点设计须能通过「职场人也能代入」检验（情绪三层：流量实力倒挂 / 选拔不透明 / 功劳记账，热点素材第二节）。\n\n**C2 · 媒介形态与集数时长**\n- AI 漫剧竖屏，60 集 × 1-1.5 分钟/集 × 单集正文上限 1200 字（偏离任一主流值必须显式声明并给理由）。\n- 总叙事容量 ≈ 90 分钟紧凑电影：主线只容 1 个大反转 + 2-3 个中型反转；副线必须挂主线条件。\n- 建议切分 10 章 × 6 集（与梗卡前三章预布点表对齐）。\n\n**C3 · 成本档（场景与角色上限）**\n- 每集场景数 ≤3（换景 = 换集节拍点，方案阶段须出场景复用表）。\n- 有名有姓角色 ≤10（含反派团核心）；群演反应拍不计入，但「全场惊呆」类当众清算必须由环境描写的群演承担。\n- 前三章正文自造专名（体系名/组织名/规则名）≤2 个。\n\n**C4 · 必须避开的雷（退潮题材与同质化点）**\n- 禁马甲掉马主线写法（身份收集/层层撕马甲）；掉马只作清算瞬时态。\n- 禁团宠化队伍线（全员宠主角）；禁真假千金型身世线；禁追妻火葬场式先虐后悔轴（与互相成就轴相反）。\n- 禁原创科幻/架空世界观（一票否决项，见 C10）。\n- 隐藏实力只服务打脸时机（藏/露策略变量），不得变成身份炫耀收集。\n\n**C5 · 合规红线（逐条否决级）**\n- 全文（正片、宣发、切片）不出现任何真实运动员、协会名；不出现真实赛事、赞助商名；无地域、队服等指向性暗示。\n- 不影射任何真实赛事结果、名场面或真实事件；「名单内定」「功劳挪用」等桥段为公共议题的戏剧化虚构。\n- 「饭圈」议题只取情绪不点名，不写指向粉丝群体的批判戏（镜像拍原则：流量角色亦被流量反噬）。\n- 正片无口号式台词（「整治」「抵制」等词不进台词与画面）。\n\n**C6 · 版权红线**\n- 灌篮高手 / 金牌得主仅为结构参考；任何致敬位台词原创改编，不直接引用原句；不复用原作具体桥段。\n\n**C7 · 卡点位置要求**\n- 首个付费卡点设在第 8-12 集窗口（对齐梗卡预布点：第 8 集回放首秀、第 9 集神秘陪练传闻发酵为卡点前拉新钩）。\n- 每章（6 集）末必设章尾钩（预布点已备：第 6 集「我不要你觉得」强拍换人、第 12 集积分榜抬头等）。\n- 前 18 集的清算首发位固定在第 18 集「比分不说谎」当众清算，强度对表 b003 金殿位；此前任何一集不得提前释放同级清算。\n- 前三章（1-18 集）每集 ≥1 处可独立切片传播的梗点，以梗卡第五节预布点表为校准基线。\n\n**C8 · 时代情绪锚方向（有 30 天内证据，锚有效）**\n- 主锚：「德不配位——位置该由实力与贡献定价」（证据：官方 2026-05 定调「融入选拔、输送、安置全过程」，B 级；30 天内赛程节点与治理专项，A 级 A1/A2/A3——引用证据仅用于创作锚定，不进正片）。\n- 情绪公式贯穿：位置（名额）× 资源（陪练/商业/话语权）× 荣誉（功劳记账）的分配权错配；反派作恶方式逐一对应现实原型（内定/挪用/倾斜），但全部虚构。\n- 上线排期对位 2026-09 中下旬—10 月乒乓赛事注意力窗口（前 10 集「名单公示」冲突优先在该窗口投放）。\n\n**C9 · 新变体回指义务（校验项）**\n- 选题方案的创新亮点段必须回指「计分板清算」三轴：人设轴（陪练/被退队者载体 × 资方造星占位太子）、场景轴（实时计分 × 直播切片回放 × 积分榜公开账本）、关系轴（发现者 × 被证明者互为爆点触发器）；答不上来 = 假新意，打回重写。\n\n**C10 · 设定体系约束（世界观代入成本红线）**\n- 设定来源级别声明：**次选级**——市面验证过的设定体系做创新改编（打脸虐渣 + 隐藏实力 + 强者回归），叠加实事议题做底（「德不配位」公共情绪，B1 证据）；禁止原创科幻/架空世界观。\n- 三分钟测试：第 1 集开局直接进「选拔黑幕 + 陪练当众受辱」冲突（梗卡预布点位），不依赖任何设定解释即可回答「这是谁、他想要什么、为什么替他急」。\n- 竞技专业细节不得自造体系；调研步补课前，涉及技战术描写以可核验常识为限。\n- 梗密度资源已过检备齐（S1 硬指标：热梗素材表 16 条 ≥10、主梗/新变体发散性各 ≥3 用法、前三章密度预布点表），方案阶段直接取用，不得另起炉灶。\n\n---\n\n*产物完。2026-09-16。数据随源标注；缺口一律（待补充），无编造。*\n", "选题方案-爽版-基线.md": "# 选题方案 · 爽版无监管基线：《拍魂》（乒乓球竞技爽剧）\n\n---\n\n## 一、选题\n\n**选题名**：《拍魂》——口语化双关：「拍」是球拍也是把人拍在台上的那一下，「魂」是输什么都行、位置必须凭比分说话的球魂。封面标题可直接用「陪练八年，一拍掀桌」。\n\n**一句话定位**：被分配机器埋没八年的乒乓陪练，和被同一套手段退队的前主力搭档，用公开计分、慢镜回放和积分榜，从资方造星集团手里把位置一场一场打回来。\n\n**时代情绪锚**（当下社会情绪 + 30 天内证据，证据细节见内部热点素材件，不进正片/宣发）：\n- 主锚：「德不配位」——大众对位置、资源、荣誉与实力贡献倒挂的积压愤怒（体育主管部门 2026 年 5 月公开定调「抵制畸形饭圈文化融入运动员选拔、输送、安置全过程」，B 级证据，进行中议题）。\n- 辅锚：30 天内国际乒乓赛事进行中、国内大满贯级赛事临近（A 级，全民乒乓注意力爬坡窗口）；网络生态治理专项在执行窗口（A 级）。\n- 情绪三层（每层都是可拍的动作，不是台词）：流量实力倒挂→赢了球的人上不了热榜；选拔不透明→名单公示那一刻才知道早内定了；功劳记账→陪练十年的功劳被写进别人的纪录片。\n\n**新意装置**：「计分板清算」——实时计分赛场 × 直播切片慢镜回放 × 积分榜公开账本。它改变的具体写法：第 8 集回放装置使「翻案」可以当场闭环（受辱→回放→反案 ≤2 拍内完成，不再需要等一整集的酝酿）；第 18 集积分榜使清算可以「念账」式进行（一屏一屏念出被挪走的积分与功劳）；第 36 集发布会投屏是回放装置的舆论场变体；第 58 集资方被自己签的账本反杀。**三轴回指（C9）**：人设轴——陪练/被退队者载体 × 资方造星「占位太子」；场景轴——计分/回放/积分榜；关系轴——发现者 × 被证明者互为爆点触发器。\n\n**核心爽点承诺**（观众追更到底图什么）：被埋没的人当众用比分把位置拿回来，每一集都能看见占位者疼。\n\n**开篇 3 秒设计**：特写——训练馆计分牌 10:8，挡板后一只手把它翻成 8:10；画外音（魏峥，懒洋洋）：「比分是给人看的，不是给人信的。」镜头拉开：沈让攥着捡球筐，指节发白。（反常 + 冲突，零铺垫，不解释任何设定。）\n\n## 二、人设\n\n有名有姓角色共 6 人（≤10，C3）；前三章正文自造专名仅「星轨俱乐部」「启明娱乐」2 个（≤2，C3）。\n\n**沈让**（男，24，星轨俱乐部主力陪练/被退队者）：外形记忆点——过时款灰色训练服（非现役队服，一望即知他被排除在编制外）、左手指缝常挂胶皮布条、发球前拇指沿拍沿抹两下。性格反差——当众最温顺（「我瞎打的」），球台上最不容商量；受辱时低头，盯计分牌时抬头。核心动机——表面认命，实际在赎罪：他当年曾在让球链条里亲手让出过一个位置（大反转伏笔，第 48-52 集揭底）。口癖/小动作：「比分不说谎」；抹拍沿。\n\n**姜屿**（女，27，前主力，三年前被「评估退队」）：外形记忆点——高马尾、右膝护具、旧号码布「07」叠好缝在护腕内侧，紧张时隔着护腕按一下。性格反差——话最少、站位最前；对全世界冷，唯独对「被浪费的天赋」破例。核心动机——名字是打回来的，不是发回来的；她是全队唯一看出沈让底细的**发现者**，而沈让的存在是她「当年不是我不行」的活证据。小动作：擦护腕；说话不超过两句，说完就走。关系张力不落恋爱标签：她的训练笔记只借他一人，他的拍只许她一人碰（独占感、护短，留白不真空）。\n\n**顾曜**（男，21，资方造星「占位太子」，青训嫡系 + 流量包装）：外形记忆点——定制亮色队服、发胶亮额、赛后必对镜头比心。性格反差——全队加练到最晚的人是他，最不敢输的也是他（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病）。核心动机——保住「太子」人设即保住还债能力。口头禅：「我知道。」（后期变奏为「原来我不知道」。）\n\n**魏峥**（男，45，启明娱乐俱乐部运营总监，分配机器本身）：外形记忆点——深色立领外套、保温杯、从不进场只看监控屏。性格反差——满口「为了俱乐部好」，记账比谁都清楚。核心动机——盘子：名额、商业位、话语权都是他可以签出去的资产。口癖：「这不是钱的事，是盘子的事。」**伏笔**：当年签掉姜屿评估单、今日签发顾曜资源包的，是同一支笔（体系惯犯，中型反转 2）。\n\n**洪川**（男，52，星轨总教练，魏峥的执行手）：秒表挂脖、口哨不离嘴。反差——训练场上铁面，走廊里对魏峥弯腰。口癖：「练都练了。」功能：黑哨与「安排比分」的具体经办人，第 48 集倒戈交账本（反派连坐第一环）。\n\n**唐果**（男，19，队内三号，功能性队友）：微胖、永远在嚼能量胶，口癖「稳住，能赢」。群像情绪出口，不计入人设主档。\n\n## 三、冲突设计\n\n**强度基准（三要素判据）**：本剧清算浓度以三要素为内部判据——**公开、证据链完整、当众社会性死亡**，三缺一即返工（同情绪赛道已把观众阈值抬到此线）。烈度上限对表 b003-cn 金殿位（开局当众立军令状+当众算崩，热度 150000 万 / A 级）：第 18 集清算首发即该强度的竞技转译。**反杀当场化**：羞辱与第一击回敬同场完成（回击时差 ≤2 拍），大胜留给集尾卡点。**金手指 = 权力型身份**：兑现画面是公示栏复名、赞助撤牌函、发布会质询席、积分榜首、联盟核查函——不是「证明自己是对的」。**反派连坐**：恶人是一张网，拆解有顺序有仪式——洪川除名式（评估记录当众公示）→ 顾曜忏悔式（摘下应援灯牌当众自白）→ 魏峥落网式（账本 + 录音 + 联盟除名）。\n\n**主线冲突（一句话）**：一个被分配机器埋没八年的陪练，要在大赛正赛名单公示前，用公开计分从资方造星集团手里把位置打回来。\n\n**单元冲突模板「一张球台的清算」**（可无限复制）：反派递出一张卡（资源卡/规则卡/舆论卡，三选一）→ 当众设局羞辱 → 沈让 ≤2 拍内回击 → 计分/回放/积分榜当场记账 → 反派付出可见代价（掉商业位/掉轮换位/掉话语权）。为什么能复制：载体恒定（一张球台一块计分板，场景 ≤3）；饵料无限（三卡轮换）；反派梯度任一层均可供饵；每次清算同步喂一层职场映射（名额/功劳/资源），不懂球的职场观众也能代入（C1 检验）。**专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句/群演反应拍/字幕反差——「外行看是捡球的，内行看是高手」），禁止哑谜。\n\n**反派梯度（三层，逐级升格）**：①台面上——顾曜（占位太子，个人恩怨层）；②台面下——洪川（执行黑哨与安排比分的嫡系教练组，操作层）；③体系——魏峥（名额、商业、功劳记账的操盘手，分配机器本身；他不是「这一次作弊」，是惯犯）。终极对手是分配机制本身，终局以公开选拔公示收口，不落在私怨。\n\n**冲突密度表（60 集 = 10 章 × 6 集，每章一个单元闭环）**：\n\n| 章 | 集数 | 单元闭环（起→收） | 章尾钩 |\n| --- | --- | --- | --- |\n| 1 | 1-6 | 黑幕比分点火 → 双关羞辱与藏锋 → 资方强拍换人 | 第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉，强拍换人（情境钩；「我不要你觉得，我要我觉得」仅作垫场台词，不当唯一钩力） |\n| 2 | 7-12 | 资格赛首轮阴招发球 → 第 8 集回放首秀一球翻案（**首付费卡点**）→ 神秘陪练传闻发酵 → 二连胜 | 第 12 集：积分榜抬头，公开账本首次亮给观众 |\n| 3 | 13-18 | 黑哨质疑 → 回放翻案 → 复出首胜 → 塌房前兆撤牌 | 第 18 集：「比分不说谎」当众清算首发（强度对表 b003 金殿位；此前无任何一集提前释放同级清算） |\n| 4 | 19-24 | 舆论卡单元：热榜倒挂 → 切片反击 | 太子粉丝站内讧，流量第一次咬人 |\n| 5 | 25-30 | 升降级挑战赛：沈让 vs 顾曜首次正面对位 | 第 30 集：沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧） |\n| 6 | 31-36 | 功劳记账单元：纪录片挪用陪练十年功劳 | 第 36 集：发布会投屏原始训练日志，「功劳是谁的」当众反案（大卡点 2） |\n| 7 | 37-42 | 太子镜像单元：白手套觉醒（中型反转 2） | 顾曜深夜加练与沈让隔网对拉，不说话 |\n| 8 | 43-48 | 姜屿评估黑幕：同一支笔（大反转揭底启动） | 第 48 集：洪川倒戈，评估档案拍上发布会桌（大卡点 3） |\n| 9 | 49-54 | 大赛终点战开打：九州大满贯正赛 | 第 54 集：顾曜输球后摘灯牌当众自白（镜像救赎） |\n| 10 | 55-60 | 物归原主：魏峥总清算 + 名单公示 | 第 60 集：公示栏红笔这次写上的是「沈让」，07 号布重新缝上 |\n\n**付费卡点事件表**：首卡点**第 8 集**「回放首秀·一球翻案当场兑现」完整闭环（对齐 C7 窗口；第 9 集神秘陪练传闻为卡点后拉新钩）；大卡点每 15-20 集一个，写具体事件——第 18 集当众清算首发 / 第 36 集功劳记账反案 / 第 54 集太子自白 + 终局前夜 / 第 60 集名单物归原主；第 12/30/48 集章末为次级卡点候选。\n\n## 四、大纲\n\n**前期（1-30 集，开局钩子 + 首卡点 + 章末钩链）**：第 1 集 3 秒开黑幕比分 + 陪练当众受辱；1-6 集沈让藏锋蓄力，姜屿带 07 号布归队，第 4 集看破缠胶皮（发现者瞬间），第 6 集魏峥划名单强拍换人。7-12 集资格赛首轮，第 8 集回放首秀当众翻案（首付费卡点），神秘陪练传闻发酵。13-18 集黑哨与翻案，第 15 集姜屿复出首胜「爷青回」，第 17 集赞助连夜撤牌（塌房第一拍），**第 18 集清算首发**：比赛馆中央，计分屏三连闪回被偷走的每一分，积分榜定格，沈让当众念账：「这位置是资源买的，还是比分买的？」顾曜应援灯牌成片熄灭。19-30 集舆论反扑与升降级挑战赛，第 30 集沈让赢下席位却被热榜倒挂抹掉——情绪压到最底，为中期蓄力。\n\n**中期（31-48 集，升级与反派升格）**：功劳记账线引爆——纪录片把沈让十年的陪练功劳剪进顾曜的成才叙事，第 36 集发布会投屏原始训练日志当众反案。反派升格：魏峥从幕后走到台面，第 38 集亲自宣布「商业考核优先后列」。镜像线收拢：顾曜发现自己只是资方白手套（「小丑竟是我自己」），第 42 集深夜与沈让隔网对拉不说话。第 43-48 集姜屿评估黑幕揭开：当年签掉她的那支笔正在签顾曜——第 48 集洪川倒戈，档案拍上发布会桌，**大反转揭底**：沈让当年亲手让出的位置，正是姜屿被退出的主力位，两人的相遇从第一天起就是赎罪。\n\n**终局（49-60 集，主线收口）**：九州大满贯正赛。名场面：第 54 集顾曜决胜局丢分后没有摔拍——他走到场边摘下自己应援灯牌的电池，对镜头鞠躬：「别替我恨人。」（灵前忏悔式）；第 58 集魏峥监控屏墙前被自己签的账本与录音反杀，联盟核查函进场（落网式）；第 60 集新名单公示，沈让的名字被红笔写上公示栏——与第 1 集被划掉形成首尾同机位呼应，姜屿把 07 号布重新缝回号码服，两人并肩站上混双报名表。选拔公示机制收口：位置由比分定价，账本留给下一个「沈让」看。\n\n**反转预算（C2）**：1 个大反转（沈让让球前史 × 姜屿被退位为同一事件两面）+ 3 个中型反转（太子白手套 / 同一支笔惯犯 / 洪川倒戈）。全部副线（姜屿复出线、顾曜镜像线、洪川线）挂在「分配权」主线上，无独立副线。\n\n## 五、前三集初稿（分拍）\n\n> 分拍初稿，达意即可；单集 2 场景（≤3，C3）；【前3秒】与【卡点】逐集标注；每集 ≥1 处可独立切片的梗点（★，以梗卡第五节预布点为校准基线）。台词短狠、立场写在脸上（hot 潜台词豁免）。\n\n### 第 1 集 · 选拔黑幕（切片梗点★：被「安排」的比分特写）\n\n- 场次：第1集-第1场 内/夜 训练馆球台区\n- 【前3秒】△特写：计分牌 10:8，挡板后一只手把它翻成 8:10。沈让（24，陪练，旧款灰训练服）隔着挡板缝看见，捡球筐捏出声响。\n  - 魏峥：（画外，懒洋洋）比分是给人看的，不是给人信的。\n- 场次：第1集-第2场 内/夜 俱乐部公示栏走廊\n- △大赛正赛名单公示，顾曜名字排头。洪川拍沈让的肩。\n  - 洪川：（压低声）名单看完了？看完去加练，明天顾曜的手感还得你喂。\n- 场次：第1集-第2场 内/夜 训练馆球台区（续）\n- △训练赛，顾曜 11:9 险胜陪练，摔拍。\n  - 顾曜：（烦躁）陪练都赢这么费劲？\n  - 洪川：（打圆场）明天队内考核，沈让给顾曜当发球机，让大家看看什么叫陪练的本分。\n- △群演反应拍：队员哄笑。唐果小声：（憋屈）又是让哥……\n- △沈让蹲下捡球，拇指沿拍沿抹两下。\n  - 沈让：（平静）比分不说谎。\n- △慢镜闪回：刚才那记 10:8，落点近台边角——顾曜根本救不回来的球。\n- △顾曜应援站举灯牌进馆拍素材。魏峥盯着手机不抬头。\n  - 魏峥：视频剪掉第三球——他第三球晃了。（功劳被抹，小刺激）\n- 【卡点·信息型】△夜，宿舍楼道。高马尾女生拎旧包站在沈让房门口，工牌翻面。\n  - 姜屿：（打量他）你的球，第三板是谁教你的？\n\n### 第 2 集 · 不配上桌（切片梗点★：球桌双关羞辱）\n\n- 场次：第2集-第1场 内/日 训练馆球台区\n- 【前3秒】△考核日，洪川宣布规则。\n  - 洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\n- △主力开局两板爆冲，沈让退台放高球全部接回——「退退退」式防守慢镜（小刺激 1）。字幕反差：外行看是狼狈，内行看是每一板都回到对方别扭的落点。\n  - 预备队主力：（嗤笑）陪练就是陪练——你天天上桌，是给别人当桌子。\n- △沈让发球轮，回击（时差 ≤2 拍，小刺激 2）：连发三个不同旋转，特写胶皮摩擦角度，主力连吃三分。\n- △洪川急哨暂停。\n  - 洪川：（压声）沈让，收着点。你的任务是输得像一点。\n- △沈让放下球拍，当众鞠躬。\n  - 沈让：（平静）我瞎打的，蒙的。（藏锋）\n- △群演反应拍：全场哄笑，唯有门口的姜屿没笑，盯着他的手（小刺激 3）。\n- 场次：第2集-第2场 内/夜 器材室\n- △一盏灯，沈让独自缠胶皮，手法熟练得像做手术。\n- 【卡点·信息型】△手机亮起，队内群通知：明日合练，顾曜新增专属陪练一名——沈让。魏峥回复：流量周正好，输球也要输出节目效果。\n\n### 第 3 集 · 归来的人（切片梗点★：蒙尘奖杯回归仪式）\n\n- 场次：第3集-第1场 内/日 俱乐部荣誉室\n- 【前3秒·回归仪式】△柜顶蒙尘奖杯，姜屿踩凳取下，袖口擦出「07」。特写：旧号码布叠在护腕内侧。\n- △走廊，队员窃语（群演）：三年没打比赛，回来占谁的位？\n  - 洪川：（客气疏远）姜屿是吧，先去陪练组恢复性训练。\n- △姜屿把 07 号布拍在公示栏自己的旧照片旁，一言不发走人。全场安静。\n- 场次：第3集-第2场 内/日 训练馆球台区\n- △合练，沈让作为顾曜专属陪练上场喂球。\n  - 顾曜：（对镜头比心后，压声警告）老实点，别又抽风。\n- △沈让喂出一记弧线诡异的短球，顾曜没接住。全场静。\n- △隔壁台姜屿停住，盯着落点。\n  - 姜屿：（皱眉，自语）这不是失误……这是发球机都拉不出来的转速。（发现者线启动）\n- △两人第一次隔网对拉：不说话，十几拍，越打越快，全馆只剩击球声（群演反应拍：所有人都停了）。\n- 【卡点·情绪型】△训练结束，姜屿伸手。\n  - 姜屿：把你的拍给我。（指腹抚过胶皮边缘，抬眼）明天，当着我的面，再「瞎打」一次。\n\n## 六、监管增益对照（本件专属 · 爽点 → 合规表达映射）\n\n### 6.1 等价原理（分节）\n\n爽感的结构三角是**当众性（多少人看见）× 证据链（凭什么服）× 代价可见（反派疼在哪）**。真实指涉能供给的只有「话题浓度」，不供给爽感结构；本剧三角全部由虚构装置供给——计分屏（当众性）、慢镜回放（证据链）、积分榜与公示栏（代价可见 + 记账）。因此剥离一切真实运动员/协会/赛事/场馆指涉后，爽点机制**等价成立**。情绪浓度差额由职场映射补足：名额（关系户占坑）、功劳（署名权被挪用）、资源（流量压过实绩）三层，职场观众不需要懂球即代入（C1 检验内置在每个单元模板里）。\n\n### 6.2 映射表\n\n| 爽点机制（爽版原生写法） | 合规基线表达（C5/C4 口径） | 等价成立逻辑 |\n| --- | --- | --- |\n| 当众清算（打脸引擎核心） | 全虚构俱乐部 + 虚构公开赛；清算画面 = 计分屏闪回 + 积分榜定格 + 念账台词，无任何真实赛事/名场面影射 | 爽感来自「公开性 + 证据链完整」，与真实指涉无关；虚构计分装置反而是当众性的放大器 |\n| 「德不配位」情绪锚 | 只取情绪不点名：反派作恶三式（内定/挪用/倾斜）为公共议题的戏剧化虚构，不与任何真实赛事结果对应 | 情绪是进行中的长期公共议题（B 级主锚 + C 级长线），浓度不依赖具体事件，越虚构越安全且不失真 |\n| 饭圈批判戏 | 镜像拍：顾曜同样被流量反噬（不敢输/不敢病/粉丝替他恨人），不写指向粉丝群体的批判戏；应援灯牌、应援站均为虚构群像 | 爽点仍在（资方造星被反噬），且镜像拍让反派立体、让受众中的粉丝观众不被一刀切——批判机制而非批判人 |\n| 塌房三连（撤牌/散站/撇清） | 虚构赞助商「领跑体育」连夜撤牌、虚构应援站解散快剪；无真实品牌与平台名 | 塌房流程是公共认知常识，虚构名号不折损「树倒猢狲散」的爽感 |\n| 热搜倒挂名场面 | 「热榜」为通用词，不出现真实平台名；黑白对比帧 | 画面冲击来自构图（夺冠瞬间 vs 商业官宣），与平台无关 |\n| 马甲当众层层撕（hot 默认参数） | **被 C4 覆写**：禁身份收集/层层撕马甲——掉马只作清算瞬时态（第 8/18 集各一次，单点亮出即收） | 揭示瞬间的爆点保留（群演反应拍 + 反派话说满再翻），层层撕的过饱和写法本就在衰减带上，覆写不亏反赚 |\n| 反派降智（hot 默认参数） | **被 R7 覆写**：小单元可降智（递阴招被反杀），关键卡（第 18/36/48 集）不降智——证据链完整要求反派聪明地输 | 「聪明人被当场拆穿」比「蠢人被耍」爽感更高阶，覆写与爽感同向 |\n| 时效网络梗（退退退/我不要你觉得等 16 条） | 梗只作切片位与垫场，不作唯一钩力（第 6 集章尾钩用划名单情境钩，旧梗垫场）；无「整治/抵制」类口号台词 | 情绪燃料 = 一场一场的球，梗是调味不是主菜；情境原创钩不受梗时效衰减 |\n| 金手指兑现 | 兑现画面 = 公示栏复名/撤牌函/质询席/积分榜首/核查函，全部机构（联盟/俱乐部/资方）为虚构 | 权力型身份的兑现感来自「签字权与公示权易手」，虚构机构不削弱仪式感 |\n\n### 6.3 增益验证使用说明\n\n与监管版（选题方案主件）逐节 diff，观察三面：**强度面**——主件在爆点对标制下是否比本基线加码（身份碎片更早半拍亮/反派话更满/反差更狠）；**合规面**——主件的交付门对账是否比本件自查版更细（本件已知未覆盖项：宣发话术边界、真实场馆映射出清复核）；**结构面**——主件名场面是否全部达到海报级可视化。本基线为下限件：主件任一节弱于本件对应节，即监管未增益，视为流程空转信号。\n\n## 七、自查\n\n### 7.1 约束对账表（自查版，逐条）\n\n| 条 | 落点 | 判 |\n| --- | --- | --- |\n| C1 | 泛性别客群；职场三层映射内置单元模板（6.1）；每单元过「职场人代入」检验 | 过 |\n| C2 | 60 集 × 1-1.5 分钟 × 正文上限 1200 字（初稿拍数为节拍示意，成稿守上限）；反转预算 1 大 + 3 中；10 章 × 6 集切分 | 过 |\n| C3 | 每集场景 ≤3（初稿每集 2 场景）；有名有姓 6 人 ≤10；前三章正文自造专名 2 个（星轨俱乐部/启明娱乐） | 过 |\n| C4 | 禁马甲主线（瞬时掉马，6.2 覆写行）；禁团宠（队伍线以唐果战友情与姜屿执念驱动）；无真假千金身世线；无追妻火葬场轴；无原创架空世界观（现实乒乓球 + 虚构俱乐部） | 过 |\n| C5 | 无真实运动员/协会/赛事/赞助商/场馆名；无地域队服指向（队服为虚构纯色设计）；无口号式台词（初稿已查）；镜像拍原则 | 过 |\n| C6 | 灌篮高手/金牌得主仅借结构（队伍线+大赛终点/双主角互相成就）；「教练，我想打____」致敬位台词在成稿中须原创改编，本件未引用原句 | 过 |\n| C7 | 首付费卡点第 8 集（窗口内）；每章章尾钩（密度表末列）；清算首发固定第 18 集；前 18 集每集 ≥1 切片梗点（按梗卡预布点表校准，第 6/10 集按 R1 条件落锁：情境钩替代单一旧梗、功劳记账显性节拍前置） | 过 |\n| C8 | 时代情绪锚匿名化声明于第一节；情绪公式贯穿三层；引用证据不进正片 | 过 |\n| C9 | 新意装置段三轴回指齐（人设轴/场景轴/关系轴） | 过 |\n| C10 | 次选级设定（验证过的梗组合 + 实事情绪底）；第 1 集零设定解释直入冲突（三分钟测试过）；技战术以常识为限并配「翻译」纪律；梗密度直取梗卡不另起炉灶 | 过 |\n\n### 7.2 hot 档自检清单（按风格路线参数逐项打勾）\n\n- [x] 爆点密度：每集 ≥3 个爽点/小刺激（初稿逐拍标注小刺激 1-3），每 3 拍一个小刺激\n- [x] 回击时差：受辱 → 回击 ≤2 拍（第 2 集双关 → 三分连发当场回敬；绝不写「他忍了下来」）\n- [x] 身份揭示：单点瞬时掉马 + 群演反应拍 + 反派话说满再翻（覆写 C4，见 6.2）\n- [x] 潜台词豁免：立场写在脸上，无留白无推理（初稿台词全部直给）\n- [x] 金句复读：「比分不说谎」第 1/2/3 集三变奏；口癖每集 ≥1 次\n- [x] 反派智商：小单元可降智，关键卡不降（覆写 R7，见 6.2）\n- [x] 台词：短、狠、口语化，一句一个信息点\n- [x] 视觉：爆点拍均配情绪强化物（慢镜/特写/定格）\n- [x] 底线四硬规则不豁免：拍号、卡点、口癖、3 秒钩子逐集到位\n\n---\n\n*产物完。2026-09-16 · 选题编剧（scene-screenwriter 剖面）· 爽版无监管基线。本件供 route=dual 监管增益验证，内部备查，不进交付页主视图；主件与_base 的差集即监管净贡献。*\n", "选题方案.md": "# 选题方案：《拍魂》（乒乓球当众清算竞技爽剧 · 双主角）\n\n---\n\n## 一、选题\n\n**选题名**：《拍魂》——口语化双关：「拍」是球拍，也是把人拍在台上的那一下；「魂」是输什么都行、位置必须凭比分说话的球魂。封面标题可直接用**「陪练八年，一拍掀桌」**。\n\n**一句话定位**：被分配机器埋没八年的乒乓陪练，和被同一套手段退队的前主力搭档，用公开计分、慢镜回放和积分榜，从资方造星集团手里把位置一场一场打回来——最后拆到的那页账上，写着他自己的名字。\n\n**时代情绪锚**（当下社会情绪 + 30 天内证据；证据仅作创作锚定，不进正片与宣发）：\n- **主锚：「德不配位」**——大众对位置、资源、荣誉与实力贡献倒挂的积压愤怒（体育主管部门 2026 年 5 月公开定调「把治理畸形饭圈文化融入运动员选拔、输送、安置全过程」，B 级证据，进行中议题，非过期新闻）。\n- **辅锚**：30 天内国际乒乓赛事进行中、国内大满贯级赛事临近（A 级，全民乒乓注意力爬坡窗口）；网络生态治理专项仍在执行窗口（A 级）。\n- **情绪三层（每层都是可拍的动作，不是台词）**：流量实力倒挂→赢了球的人上不了热榜；选拔不透明→名单公示那一刻才知道早内定了；功劳记账→陪练十年的功劳被写进别人的纪录片。\n\n**新意装置：「计分板清算」**——实时计分赛场 × 直播切片慢镜回放 × 积分榜公开账本。它改变的具体写法：**第 8 集**回放装置使「翻案」当场闭环（受辱→回放→反案 ≤2 拍，不再需要等一整集酝酿）；**第 18 集**积分榜使清算可以「念账」式进行（一屏一屏念出被偷走的每一分）；**第 36 集**发布会投屏是回放装置的舆论场变体；**第 58 集**反派被自己签发的账本反杀。**三轴回指（C9）**：人设轴——陪练/被退队者载体 × 资方造星「占位太子」；场景轴——计分/回放/积分榜；关系轴——发现者 × 被证明者互为爆点触发器。\n\n**核心爽点承诺**（观众追更到底图什么）：被埋没的人当众用比分把位置拿回来，每一集都能看见占位者疼。\n\n**开篇 3 秒设计**：特写——训练馆计分牌 10:8，挡板后一只手把它翻成 8:10；画外音（魏峥，懒洋洋）：「比分是给人看的，不是给人信的。」镜头拉开：沈让隔着挡板缝看见全程，攥着捡球筐，指节发白。（反常 + 冲突，零铺垫，不解释任何设定；这句画外音同时是暗线伏笔①，见 4.4 暗埋表。）\n\n## 二、人设（有名有姓 6 人封顶，C3）\n\n前三章正文自造专名仅 **「星轨俱乐部」「启明娱乐」** 2 个（≤2，C3）；「九州大满贯」「领跑体育」为第 17/49 集后方登场专名，不占前三章预算。\n\n**沈让**（男，24，星轨俱乐部主力陪练 / 被退队者）：外形记忆点——板寸没怎么修、过时款灰色训练服（非现役队服，一望即知编制外）、左手指缝常挂胶皮布条、发球前拇指沿拍沿抹两下。性格反差——**当众最温顺 × 球台上最不容商量；表面认命 × 实际赎罪**（他当年在让球链条里亲手让出过一个位置，藏八年是赎罪不是认命——大反转伏笔，第 48 集揭底）。核心动机——把名字打回名单上，把那一让还回去。口癖/小动作：「比分不说谎」（第 1/2/3 集三变奏）；抹拍沿。弧线终态：名单复名，但首站从资格打起——罪还了一半，代价留了一半。\n\n**姜屿**（女，27，前主力，三年前被「评估退队」）：外形记忆点——高马尾、右膝护具、旧号码布「07」叠好缝在护腕内侧，紧张时隔着护腕按一下。性格反差——**话最少 × 站位最前；对全世界冷 × 对「被浪费的天赋」破例**。核心动机——名字是打回来的，不是发回来的；她是全队唯一看出沈让底细的**发现者**，而沈让的存在是她「当年不是我不行」的活证据。小动作：擦护腕；说话不超过两句，说完就走。弧线终态：07 缝回号码服，混双报名表并肩；三年追不回，位置自己挣回。\n\n**顾曜**（男，21，资方造星「占位太子」，青训嫡系 + 流量包装）：外形记忆点——定制亮色队服、发胶亮额、赛后必对镜头比心。性格反差——**全队加练到最晚 × 最不敢输；最亮的位置 × 最空的手**（镜像拍：流量是他签约时就背上的债，粉丝替他恨人，他不敢病）。核心动机——保住「太子」人设即保住还债能力。口癖：「我知道。」（后期变奏「原来我不知道」。）弧线终态：摘灯牌、鞠躬、「别替我恨人」——塌掉的偶像亲手拆了造星机。\n\n**魏峥**（男，45，启明娱乐俱乐部运营总监，分配机器本身）：外形记忆点——深色立领外套、保温杯、从不进场只看监控屏。性格反差——**满口「为俱乐部好」 × 记账比谁都清楚；从不看球 × 从不记错账**。核心动机——盘子：名额、商业位、话语权都是可签出的资产。口癖：「这不是钱的事，是盘子的事。」**暗线**：当年签掉姜屿评估单、今日签发顾曜资源包的，是同一支笔（体系惯犯，中型反转 2，第 46-47 集揭晓）。弧线终态：被自己签发的账本与录音反杀——机器被自己产的账埋掉。\n\n**洪川**（男，52，星轨总教练，魏峥的执行手）：外形记忆点——灰白寸头、秒表挂脖、口哨不离嘴。性格反差——**训练场铁面 × 走廊里弯腰**（知道每一分的价钱，也记得每个孩子的手抖）。核心动机——执行换平安，直到平安也保不住。口癖：「练都练了。」弧线终态：第 48 集倒戈交档案——连坐第一环，也是唯一自救的一环。\n\n**唐果**（男，19，队内三号，功能性队友）：外形记忆点——微胖、队服拉链永远开一半、永远在嚼能量胶。性格反差——**不敢反抗 × 敢在群里说真话**（群像情绪出口）。核心动机——想让「让哥」上一次正赛名单。口癖：「稳住，能赢。」弧线终态：第 60 集把「稳住能赢」写上新名单的祝语。\n\n**双主角关系轴（不落恋爱标签，R1 条件 6 承接）**：发现者 × 被证明者互为触发器——她是他「被埋没」的目击人，他是她「当年不是我不行」的活证据；第 48 集大反转后升级为互为因果（他的让 = 她的退）。独占感与护短全部道具化：她的训练笔记只借他一人；他的拍只许她一人碰；第 30 集后增一处「顾曜递拍给沈让时姜屿盯着那只手两秒」的吃味反应拍。留白不真空，不写感情戏占时长。\n\n## 三、冲突设计\n\n### 3.1 清算浓度判据与四条硬规矩\n\n- **三要素判据**（浓度内标尺，替代无数据的「韩剧基准」表述——R1 条件 3 落实）：每次大清算必须**公开、证据链完整、当众社会性死亡**三要素齐，缺一返工。烈度上限对表 b003-cn 金殿位（开局当众立军令状 + 当众算崩，热度 150000 万 / A 级），第 18 集清算首发即该强度的竞技转译。\n- **反杀当场化**：羞辱与第一击回敬必须同场完成（回击时差 ≤2 拍），大胜留给集尾卡点。\n- **金手指 = 权力型身份带成本**：兑现画面全是机构文件易手（公示栏复名、赞助撤牌函、发布会质询席、积分榜首、联盟核查函），不是「证明自己是对的」；成本 = 每赢一步曝光一步（第 30 集后姜屿复出资格被捆绑为质子）。\n- **反派连坐**：恶人是一张网，拆解有顺序有仪式——洪川除名式（第 48 集，评估记录当众公示 + 反戈一击）→ 顾曜忏悔式（第 54 集，摘灯牌当众自白）→ 魏峥落网式（第 58 集，账本 + 录音 + 联盟核查函）。\n\n### 3.2 主线冲突（一句话）\n\n一个被分配机器埋没八年的陪练，要在大赛正赛名单公示前，用公开计分从资方造星集团手里把位置——以及给位置记账的权力——打回来。\n\n### 3.3 单元冲突模板「一张球台的清算」（可无限复制）\n\n反派递出一张卡（**资源卡 / 规则卡 / 舆论卡**，三选一）→ 当众设局羞辱 → 沈让 ≤2 拍内回击 → 计分/回放/积分榜当场记账 → 反派付出可见代价（掉商业位 / 掉轮换位 / 掉话语权）。\n\n**为什么能复制**：载体恒定（一张球台一块计分板，场景 ≤3）；饵料无限（三卡轮换 × 反派梯度三层任一供饵）；每次清算同步喂一层职场映射（名额 = 关系户占坑 / 功劳 = 署名权被挪 / 资源 = 流量压实绩），不懂球的职场观众也能代入（C1 检验内置）。**专业细节「翻译」纪律**：每个技战术细节必配一次翻译（解说一句 / 群演反应拍 / 字幕反差——「外行看是捡球的，内行看是高手」），禁止哑谜。\n\n### 3.4 反派梯度（三层连坐，逐级升格，不许一个反派打到底）\n\n| 层 | 人物 | 作恶方式（公共情绪原型的戏剧化虚构） | 清算仪式（连坐顺序） |\n| --- | --- | --- | --- |\n| ① 台面上（个人恩怨层） | 顾曜 | 资源倾斜的受惠端：占位、流量压实力 | 忏悔式（第 54 集）：摘灯牌当众自白 |\n| ② 台面下（操作层） | 洪川 | 安排比分、黑哨、改考核的具体经办 | 除名式（第 48 集）：评估记录当众公示，反戈一击 |\n| ③ 体系（分配机器本身） | 魏峥 | 名额内定、功劳挪用、资源倾斜的总操盘——**惯犯，不是初犯**（「同一支笔」） | 落网式（第 58 集）：账本 + 录音 + 联盟核查函 |\n\n终极对手是**分配机制本身**：魏峥落网不等于终点，第 59 集以「新公示机制表决」收口——清算的终点是制度替换，不是私怨了结。占位者立场自洽（顾曜有付出、被裹挟；魏峥的「盘子论」成逻辑），非一边全错。\n\n### 3.5 冲突密度表（60 集 = 10 章 × 6 集，每章一个单元闭环）\n\n| 章 | 集数 | 单元闭环（起 → 收） | 章尾钩 |\n| --- | --- | --- | --- |\n| 1 | 1-6 | 黑幕比分点火 → 双关羞辱与藏锋 → 发现者进场 → 资方强拍换人 | **第 6 集：魏峥当众用红笔把「沈让」从热身名单划掉（情境钩，唯一主钩——R1 条件 5 落锁；「我不要你觉得，我要我觉得」仅作划名前的垫场台词，不当钩力）** |\n| 2 | 7-12 | 资格赛首轮「退退退」防守反打首胜 → 第 8 集回放首秀一球翻案（**首付费卡点**）→ 神秘陪练传闻发酵 → **第 10 集功劳记账显性节拍（官方预告片把沈让喂球镜头与加练日志剪进顾曜「天赋叙事」——观众恨得具体，第 18 集专等翻这笔账，R1 条件 4 落锁）** → 第 11 集「这波在大气层」骗招 → 二连胜 | 第 12 集：积分榜抬头，公开账本首次亮给观众 |\n| 3 | 13-18 | 第 13 集太子连丢分破防 → 第 14 集黑哨质疑 → 慢镜回放判罚反案（洪川执行时手抖——倒戈暗埋）→ 第 15 集姜屿复出首胜「爷青回」→ 第 16 集「用魔法打败魔法」发球反制 → 第 17 集撤牌函（笔迹 = 第 6 集同一支笔） | **第 18 集：「比分不说谎」当众清算首发（烈度对表 b003 金殿位；8-17 集无任何一集提前释放同级清算）** |\n| 4 | 19-24 | 舆论卡单元：资方买热榜压词条、赢球上不了榜 → 切片反击：球迷自发剪辑回放证据链全网扩散 → 顾曜商业行程与战绩首次被并置嘲讽 | 第 24 集：太子粉丝站内讧，流量第一次咬人（镜像拍） |\n| 5 | 25-30 | 升降级挑战赛：沈让 vs 顾曜首次正面对位，五局拉锯 → 第 27 集姜屿翻旧档案：评估单签字笔迹与今日资源单同笔（暗线显影，不揭内容） | **第 30 集【中点·模型改写】**：沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧）——位置打回来了，账本不认；故事从「打回位置」改写为「打回记账权」 |\n| 6 | 31-36 | 功劳记账单元：纪录片把沈让十年陪练功劳剪进顾曜成才叙事，原始训练日志被抢先调走 → 两人抢物证链（发球机记录 / 门禁数据 / 旧胶皮购买单）→ 第 35 集魏峥亲自宣布「商业考核优先后列」 | **第 36 集【大卡点 2】**：发布会投屏原始训练日志当众反案：「功劳是谁的？」 |\n| 7 | 37-42 | 太子镜像单元：第 38 集顾曜发现「商业优先」名单里自己也只是筹码——白手套觉醒（「小丑竟是我自己」）→ 第 40 集粉丝替他恨人反噬戏（批判机制不批判粉丝群体） | 第 42 集：深夜馆，顾曜与沈让隔网对拉，不说话 |\n| 8 | 43-48 | 姜屿评估黑幕：追索档案经手痕迹（洪川私留副本）→ 第 46-47 集「同一支笔」揭晓：三年前签退姜屿与今日签发顾曜的是同一支笔；魏峥反制：销毁令 + 把姜屿复出资格当人质 | **第 48 集【大卡点 3 + 大反转】**：洪川倒戈把评估档案拍上发布会桌；档案揭底——当年让球链条里沈让亲手让出的主力位 = 姜屿被退的位置，两人的相遇从第一天起就是赎罪；档案里还有沈让自己那一页 |\n| 9 | 49-54 | 九州大满贯正赛：公开身份后的舆论战场 → 第 51-52 集回落段（07 号布静场 + 让球前史闪回预热，防强度钝化）→ 决胜局让二追三 | **第 54 集【大卡点 4】**：顾曜输球不摔拍——摘下应援灯牌电池，对镜头鞠躬：「别替我恨人。」 |\n| 10 | 55-60 | 物归原主：魏峥灭口式反扑（转移账本 / 施压联盟 / 威胁洪川翻供）→ 第 58 集监控屏墙前被自己签发的账本与录音反杀，联盟核查函进场 → 第 59 集新选拔公示机制表决：「陪练积分计入个人排名」写进章程 | **第 60 集【大卡点 5 · 终局】**：公示栏红笔这次写上的是「沈让」——与第 1 集被划掉首尾同机位；07 号布重新缝上号码服，两人并肩站上混双报名表 |\n\n### 3.6 付费卡点事件表（写具体事件，不写「高潮」）\n\n| 卡点 | 集 | 具体事件 | 级别 |\n| --- | --- | --- | --- |\n| 首付费卡点 | **8** | 回放首秀·一球翻案当场兑现（受辱→回放→反案 ≤2 拍完整闭环）；信息钩：魏峥监控屏前「查他」半句收尾 | 付费墙（窗口 8-12 内，落张力峰值非低谷） |\n| 大卡点 1 | **18** | 「比分不说谎」当众清算首发：比赛馆中央计分屏三连闪回被偷走的每一分（含第 10 集预告片挪用素材与沈让原始留底的对照）+ 积分榜定格 + 当众念账「这位置是资源买的，还是比分买的？」+ 应援灯牌成片熄灭 | 大（b003 金殿位强度） |\n| 大卡点 2 | **36** | 发布会投屏原始训练日志，「功劳是谁的」当众反案 | 大 |\n| 大卡点 3 | **48** | 洪川倒戈 + 评估档案揭底（让球 × 退队同一事件两面 + 沈让自己那一页） | 大 + 大反转 |\n| 大卡点 4 | **54** | 太子摘灯牌自白「别替我恨人」+ 终局前夜 | 大 |\n| 大卡点 5 | **60** | 名单公示·物归原主（红笔写名同机位回收 + 新章程表决） | 大（终局） |\n| 次级章末 | 6 / 12 / 30 / 42 | 划名单 / 积分榜抬头 / 热榜倒挂 / 对拉无言 | 章末钩 |\n\n**烈度分级声明（C7 防提前释放）**：第 8 集 = 单点翻案（只翻一分的小清算）；第 14 集 = 判罚反案（中）；**第 18 集才是首个金殿位级当众清算**——8-17 集任何一集不释放同级清算。\n\n## 四、大纲\n\n### 4.1 前期（1-30 集：开局钩子 + 首卡点 + 章末钩链）\n\n第 1 集 3 秒开黑幕比分 + 陪练当众受辱（分拍初稿见第五节）；1-6 集沈让藏锋蓄力，姜屿带 07 号布归队，第 4 集看破缠胶皮手法（发现者实锤），**第 6 集魏峥当众用红笔把「沈让」从热身名单划掉**——他「藏到退役」的策略彻底失效，同一支笔给顾曜签发资源包（笔部特写）。7-12 集资格赛首轮：第 8 集阴招发球 → 回放首秀一球翻案当场闭环（首付费卡点）；第 10 集功劳记账显性节拍（预告片挪用 + 顾曜发布会吹嘘 + 提词器特写）；第 12 集二连胜积分榜抬头。13-18 集：黑哨与判罚反案，第 15 集姜屿复出首胜「爷青回」，第 17 集赞助商「领跑体育」连夜撤牌（撤牌函签字笔迹 = 第 6 集同一支笔），**第 18 集清算首发**。19-30 集：舆论反扑与升降级挑战赛，**第 30 集中点名场面**——沈让赢下正赛席位，热榜第一却是顾曜的商业官宣（黑白对比帧：左边他握拍怒吼的定格，右边官宣海报的亮屏）；姜屿复出资格被捆绑审查，情绪压到最底，为中期蓄力。\n\n### 4.2 中期（31-48 集：升级与反派升格）\n\n功劳记账线引爆：纪录片把沈让十年的陪练功劳剪进顾曜的成才叙事，两人抢物证链，第 35 集魏峥亲自宣布「商业考核优先后列」（第一记体系级重压），**第 36 集大卡点名场面**——发布会厅，投屏切到原始训练日志，沈让站在质询席念出日期与课表：「功劳是谁的？」镜头扫过顾曜僵住的比心手势。反派升格后镜像线收拢：第 38 集顾曜在「商业优先」名单末行看见自己的名字（中型反转 1：白手套觉醒），第 42 集深夜训练馆他与沈让隔网对拉，不说话，只剩击球声。第 43-48 集姜屿评估黑幕：第 46-47 集「同一支笔」揭晓（中型反转 2），魏峥反制——销毁令 + 把姜屿复出资格当人质；**第 48 集大卡点 3 + 大反转名场面**——洪川把评估档案拍上发布会桌，纸页散开，沈让捡起自己那页，当众读出三年前的日期：「这页签的名字是我。」——他当年亲手让出的主力位，正是姜屿被退的位置；两人的相遇从第一天起就是赎罪。\n\n### 4.3 终局（49-60 集：主线收口）\n\n九州大满贯正赛（17 集后方登场专名）：第 49-50 集公开身份后的舆论战场，第 51-52 集回落段（深夜馆只开一盏灯，07 号布静场特写，让球前史闪回预热），第 53-54 集决胜局让二追三。**第 54 集大卡点 4 名场面**——顾曜决胜局丢分后没有摔拍，走到场边摘下自己应援灯牌的电池，灯一排排熄灭，他对镜头鞠躬：「别替我恨人。」第 55-57 集魏峥灭口式反扑（转移账本 / 施压联盟 / 威胁洪川翻供）；**第 58 集落网式名场面**——监控屏墙前，魏峥自己的账本页码被一页页投上屏幕，录音同轨播放，联盟核查函由人递进画面，他伸手去关屏幕，屏幕先黑了。第 59 集公示前夜：新选拔公示机制表决，「陪练积分计入个人排名」写进章程（机制收口，不落私怨）。**第 60 集终局名场面**——公示栏前，红笔这次写上的是「沈让」，与第 1 集被划掉首尾同机位；姜屿把 07 号布重新缝上号码服，两人并肩站上混双报名表；账本留在公示栏下，留给下一个「沈让」。代价残留：沈让的正赛首站从资格打起，姜屿被偷走的三年追不回——不是全员原谅式大团圆。\n\n### 4.4 反转预算与暗埋表（1 大 + 3 中，C2；每处前置暗埋 ≥2 处，回看成立）\n\n| 反转 | 集 | 判型 | 前置暗埋（本方案前三集分拍已标注落点） |\n| --- | --- | --- | --- |\n| 大：让球 × 退队同事件两面 | 48 | 因果反转 | ①第 2 集「输得像一点」时捏紧拍柄特写（分拍第 2 集拍 5）②第 4/15/30 集续埋 |\n| 中 1：太子白手套 | 38 | 身份反转 | ①第 1 集摔拍后先偷看观察窗（分拍第 1 集拍 2）②第 10 集发布会提词器特写 ③第 13 集破防无人安慰只有行程表 |\n| 中 2：同一支笔（体系惯犯） | 46-47 | 预期反转 | ①第 1 集画外音「比分是给人看的」（分拍第 1 集拍 1）②第 5 集调三年前评估单 ③第 6 集签发资源包笔部特写 ④第 17 集撤牌函同笔迹 |\n| 中 3：洪川倒戈 | 48 | 立场反转 | ①第 2 集急哨压声「收着点」后眼神矛盾（分拍第 2 集拍 5）②第 14 集执行黑哨时手抖 ③第 43 集私留档案副本 |\n\n同型连用检查：身份（38）→ 预期（46-47）→ 因果（48）→ 立场（48 章首），无相邻同型；四个反转分落 4 个章，不扎堆。暗线（旧账线）信息只在章末卡点释放半句，每集主认知更新唯一，绝不与明线清算同拍抢认知。\n\n## 五、前三集分拍初稿（B 拍三件套）\n\n> **分拍纪律**：每集 10 拍（9-12 内）、每拍 6-15 秒、单集约 90 秒（1-1.5 分钟口径内）；初稿为节拍示意，成稿守单集正文 ≤1200 字上限。每拍五件：【0-3秒】（该拍开场画面，第 1 拍兼全集前 3 秒钩）/【分镜】（△动作，只写可拍摄内容）/【台词】（情绪内联）/【表演】/【尾钩】。每集 ≤3 场景（C3）；每集 ≥1 处 ★切片梗点（对位梗卡预布点表）+ ≥3 处小刺激；「比分不说谎」每集 1 变奏；暗埋拍以（暗埋·反转编号）标注，可回溯到 4.4 表；技战术细节必配翻译（字幕反差 / 群演反应）。台词短狠、立场写在脸上（hot 潜台词豁免）。\n\n### 第 1 集 · 选拔黑幕（★切片梗点：被「安排」的比分特写 + 陪练当众受辱）\n\n场景（3）：第1场 内/夜 星轨训练馆球台区（含观察窗）｜第2场 内/日 俱乐部公示栏走廊｜第3场 内/夜 宿舍楼道\n\n- **拍 1**（第 0-8 秒｜8 秒｜第1场）【前3秒·全剧门面】\n  - 【0-3秒】△大特写：计分牌「10:8」，挡板后一只穿深色立领袖口的手把它翻成「8:10」。\n  - 【分镜】△镜头从翻牌手拉开——沈让，24 岁，星轨俱乐部主力陪练，外温顺内轴硬，过时款灰训练服、左手指缝挂胶皮布条——隔着挡板缝看完全程，怀里捡球筐的铁丝被他捏出一声轻响。\n  - 【台词】魏峥（画外，懒洋洋）：比分是给人看的，不是给人信的。（暗埋·中2①）\n  - 【表演】沈让瞳孔一缩，不吼不喊，喉结动了一下；翻牌的手连停顿都没有。\n  - 【尾钩】比分被改了，全馆没一个人吭声——包括他。\n- **拍 2**（第 8-17 秒｜9 秒｜第1场）（小刺激 1）\n  - 【0-3秒】△球台边顾曜，21 岁，资方造星「占位太子」，定制亮色队服、发胶亮额——11:9 险胜陪练，反手把拍摔在台面上。\n  - 【分镜】△球拍弹地两下；△顾曜的第一反应不是看球，是扭头偷看观察窗玻璃后的监控屏室方向（暗埋·中1①）。\n  - 【台词】顾曜（烦躁）：陪练都赢这么费劲？\n  - 【表演】摔拍是摔给玻璃后面那个人看的——摔完立刻收敛表情，比心练笑。\n  - 【尾钩】他怕的不是输球，是屏幕后那个人。\n- **拍 3**（第 17-27 秒｜10 秒｜第1场）（小刺激 2·功劳被抹）\n  - 【0-3秒】△观察窗内：魏峥，45 岁，启明娱乐俱乐部运营总监，深色立领外套、保温杯，盯着手机不抬头。\n  - 【分镜】△洪川——52 岁，星轨总教练，灰白寸头、秒表挂脖、口哨不离嘴——推门进监控屏室，站姿从进门那一刻就开始弯腰。\n  - 【台词】魏峥：宣传视频，第三球剪掉——他第三板晃了，难看。／洪川（弯腰）：练都练了，剪吧。\n  - 【表演】洪川的口哨吹到一半，停了半拍才接上；魏峥从头到尾没看一眼球台。\n  - 【尾钩】沈让拼出来的那三分，进了碎纸机。\n- **拍 4**（第 27-36 秒｜9 秒｜第1场）（小刺激 3·当众受辱）\n  - 【0-3秒】△洪川回到球台区，一记短哨，全队集合。\n  - 【分镜】△队员围拢，唐果——19 岁，队内三号，微胖、队服拉链开一半、嚼着能量胶——站在最外圈。\n  - 【台词】洪川：明天队内考核，沈让给顾曜当发球机——让大家看看，什么叫陪练的本分。\n  - 【表演】哄笑从队伍后排滚到前排；唐果低头（压着嗓子）：又是让哥……\n  - 【尾钩】「发球机」三个字，比输球更疼——因为没人觉得这有什么问题。\n- **拍 5**（第 36-46 秒｜10 秒｜第1场）\n  - 【0-3秒】△沈让蹲下捡球，一颗一颗，不快不慢。\n  - 【分镜】△拇指沿拍沿抹两下（小动作首秀）；△慢镜闪回：刚才那记 10:8 的第三球——发球出手、落点压台角，顾曜重心早被骗反。\n  - 【字幕反差·翻译】外行看：运气球。｜内行看：压线短球，接的人从出手就死了。\n  - 【台词】沈让（平静，像在说天气）：比分不说谎。（口癖·变奏 1）\n  - 【表演】低头捡球时说的，没看任何人；说完把球筐放回原位，摆正。\n  - 【尾钩】他不辩——他记账。\n- **拍 6**（第 46-56 秒｜10 秒｜第2场）\n  - 【0-3秒】△次日，公示栏前红绸揭开：大赛正赛名单装裱上墙，顾曜的名字烫金排头。\n  - 【分镜】△工作人员盖章，一下，收印，前后不到一秒；△沈让的名字在最末行「陪练编组」，字号小一号。\n  - 【台词】工作人员（公事公办）：名单以公示为准，有异议走流程。／唐果（小声）：流程？名单早印好了，章是后盖的。\n  - 【表演】围观队员没人提异议；唐果说完自己先缩脖子。\n  - 【尾钩】公示是通知，不是商量。\n- **拍 7**（第 56-65 秒｜9 秒｜第2场）\n  - 【0-3秒】△走廊里一队人扛着应援灯牌路过，灯牌上「曜」字灯一闪一闪。\n  - 【分镜】△洪川在公示栏前按住沈让的肩，压低身量；△灯牌队伍与两人擦肩，光从沈让脸上扫过又暗下去。\n  - 【台词】洪川：名单看完了？看完去加练——明天顾曜的手感，还得你喂。\n  - 【表演】沈让点头应下，指缝里的胶皮布条缠了缠；不卑，也不亢。\n  - 【尾钩】被拿走的不止位置——连「下一场」都是替别人打的。\n- **拍 8**（第 65-73 秒｜8 秒｜第3场）\n  - 【0-3秒】△夜，宿舍楼道声控灯亮起，沈让划开手机。\n  - 【分镜】△官方集锦推送：十一个精彩球，没有一球标他的名字；△他退出推送，点开自己云盘里的原始素材——每一球都有（留底习惯，第 10/18 集伏笔）。\n  - 【表演】他一球一球看得很慢，看到第三球，停住，倒回去，又看了一遍。\n  - 【尾钩】官方剪掉的，他自己全留着。\n- **拍 9**（第 73-82 秒｜9 秒｜第3场）\n  - 【0-3秒】△楼道拐角立着一个人：高马尾、右膝护具、拎旧运动包——姜屿，27 岁，三年前被「评估退队」的前主力，话少站位前，旧号码布 07 缝在护腕内侧。\n  - 【分镜】△她的视线越过他，落在他手机屏幕的球上；△沈让抬头，工牌在她胸前翻了个面，看不清名字。\n  - 【表演】她盯着屏幕里的第三球，右手指腹隔着护腕，按了一下。\n  - 【尾钩】这个楼道里，唯一看懂了那颗球的人。\n- **拍 10**（第 82-90 秒｜8 秒｜第3场）【卡点·信息型】\n  - 【0-3秒】△姜屿走近两步，在离他一米处停住。\n  - 【分镜】△声控灯灭了两秒，她跺一下脚，灯又亮；△两人隔一米对视。\n  - 【台词】姜屿：你的球，第三板是谁教你的？\n  - 【表演】沈让捏着手机的手指收紧；她问完就走，背影没给他回答的时间。\n  - 【尾钩】她怎么看出第三板有问题——「第三板」背后藏着什么？（黑场）\n\n### 第 2 集 · 不配上桌（★切片梗点：「不配上桌」球桌双关羞辱）\n\n场景（2）：第1场 内/日 星轨训练馆球台区｜第2场 内/夜 器材室\n\n- **拍 1**（第 0-8 秒｜8 秒｜第1场）【前3秒】\n  - 【0-3秒】△考核日，洪川秒表一按，全馆立正。\n  - 【分镜】△球台对面：预备队主力热身，两板爆冲打得挡板砰砰响；△沈让慢悠悠缠好指缝布条上场。\n  - 【台词】洪川：考核内容——陪练沈让，对预备队主力。输的今天不配上桌，器材自己收。\n  - 【表演】「不配上桌」四个字落地，有几声嗤笑；沈让表情没变，只看了眼球桌。\n  - 【尾钩】考核的不是球——是让他在自己谋生的桌上输掉资格。\n- **拍 2**（第 8-18 秒｜10 秒｜第1场）（小刺激 1·防守慢镜）\n  - 【0-3秒】△主力开局两板爆冲，球带着风声砸向边角。\n  - 【分镜】△沈让退台放高球，全部接回——「退退退」式防守，慢镜：球一次次从他拍面弹起，弧线一板比一板低；△主力越扣越急，汗先掉。\n  - 【字幕反差·翻译】外行看：狼狈后退。｜内行看：每一板都回到对方最别扭的落点。\n  - 【表演】沈让步伐不乱，眼神只盯球，不看人。\n  - 【尾钩】全场发现：退了十板的人，一个球都没丢。\n- **拍 3**（第 18-26 秒｜8 秒｜第1场）（小刺激 2·双关羞辱★）\n  - 【0-3秒】△主力一板扣飞，气得踹挡板。\n  - 【分镜】△主力指着沈让，又指指球桌；△围观队员起哄。\n  - 【台词】主力（嗤笑）：陪练就是陪练——你天天上桌，是给别人当桌子。\n  - 【表演】哄笑声里，唐果攥着能量胶没嚼；沈让垂眼看了看自己站的位置——桌上，「桌子」两个字砸得很准。\n  - 【尾钩】羞辱到位了——按规矩，他该输了。\n- **拍 4**（第 26-36 秒｜10 秒｜第1场）（小刺激 3·回击 ≤2 拍）\n  - 【0-3秒】△沈让发球轮，他捏球的手停了半秒。\n  - 【分镜】△特写：胶皮摩擦角度，三个发球三种旋转；△主力连吃三分，第三板直接把球接飞出台；△全馆倒吸冷气。\n  - 【表演】沈让发完第三球，拇指沿拍沿抹两下，什么都没说。\n  - 【尾钩】说好的「输得像一点」——他连赢三分。\n- **拍 5**（第 36-46 秒｜10 秒｜第1场）（暗埋双落点）\n  - 【0-3秒】△急哨。洪川冲进场，第一件事是背对观众席挡住记分牌。\n  - 【分镜】△特写：沈让的手指在拍柄上收紧，指节泛白（暗埋·大反转①）；△洪川压低声，眼神在他脸上停了一瞬又移开（暗埋·中3①）。\n  - 【台词】洪川（压声）：沈让，收着点。你的任务是——输得像一点。\n  - 【表演】洪川说完这句，口哨在嘴边转了半圈没吹响；沈让盯着他看了两秒，缓缓松开拍柄。\n  - 【尾钩】教练要他输——输，也要输得「像」。像什么？\n- **拍 6**（第 46-55 秒｜9 秒｜第1场）\n  - 【0-3秒】△沈让把球拍轻轻放在球台上，后退一步，当众鞠躬。\n  - 【分镜】△鞠躬角度标准得像教学视频；△镜头扫过围观人群——门口，姜屿抱着恢复性训练的球桶站着，全场哄笑，只有她没笑，盯着他刚才捏拍柄的那只手。\n  - 【台词】沈让（平静）：我瞎打的，蒙的。\n  - 【表演】「瞎打」两个字咬得很轻；姜屿右手指腹隔着护腕按了一下。\n  - 【尾钩】所有人都在笑，只有一个人在记。\n- **拍 7**（第 55-63 秒｜8 秒｜第1场）\n  - 【0-3秒】△散场，主力被教练组围住夸「状态回来了」。\n  - 【分镜】△唐果溜到沈让身边，塞给他一支能量胶；△沈让收器材，把公用球一颗颗擦净归位。\n  - 【台词】唐果（小声）：让哥，稳住，能赢。\n  - 【表演】沈让难得笑了一下，把能量胶别回唐果胸前口袋：你先稳住。\n  - 【尾钩】全队只有一个人信他能赢——他自己不信「赢」这条路走得通。\n- **拍 8**（第 63-72 秒｜9 秒｜第2场）\n  - 【0-3秒】△夜，器材室一盏灯，沈让独自缠胶皮，手稳得像做手术。\n  - 【分镜】△特写：压胶、划边、滚平，一气呵成；△门口地板上多了一道影子，停了三秒，没进来，走了——影子的高马尾轮廓。\n  - 【表演】沈让没抬头，手上动作停了一拍，又继续。\n  - 【尾钩】她在看什么——看得懂的人，已经出现第二个了。\n- **拍 9**（第 72-81 秒｜9 秒｜第2场）\n  - 【0-3秒】△手机在器材桌上亮起，队内群弹窗。\n  - 【分镜】△群通知：「明日合练，顾曜新增专属陪练一名：沈让。」△下面一条回复，头像是保温杯照片。\n  - 【台词】魏峥（群内）：流量周正好，输球也要输出节目效果。\n  - 【表演】群消息底下，队员排队回「收到」，只有唐果的「收到」隔了很久。\n  - 【尾钩】他刚在考核台上证明了自己——换来的是更精确的安排。\n- **拍 10**（第 81-90 秒｜9 秒｜第2场）【卡点·情绪型】\n  - 【0-3秒】△沈让关掉手机屏，器材室只剩一盏灯和他的影子。\n  - 【分镜】△他把缠好的球拍立在手心，拇指沿拍沿抹两下；△镜头推近他的眼睛，灯芯在瞳孔里一点。\n  - 【台词】沈让（低声，像对自己）：比分不说谎。节目说了不算。（口癖·变奏 2）\n  - 【表演】说完，灯灭，黑场只留球拍立着的一道剪影。\n  - 【尾钩】明天当顾曜的「专属陪练」——他要让「节目效果」这三个字，变成谁的噩梦？\n\n### 第 3 集 · 归来的人（★切片梗点：蒙尘奖杯回归仪式）\n\n场景（3）：第1场 内/日 俱乐部荣誉室｜第2场 内/日 公示栏走廊｜第3场 内/日 星轨训练馆球台区\n\n- **拍 1**（第 0-9 秒｜9 秒｜第1场）【前3秒】\n  - 【0-3秒】△荣誉室柜顶，一座蒙尘奖杯，姜屿踩着凳子把它取下来。\n  - 【分镜】△袖口擦过杯身，灰尘底下露出刻字「07」；△特写：她把旧号码布「07」从包里取出，叠好，塞进护腕内侧。\n  - 【表演】擦奖杯的动作很慢，很匀，像给什么东西还礼。\n  - 【尾钩】三年前被「评估」掉的人，回来了。\n- **拍 2**（第 9-17 秒｜8 秒｜第1场）\n  - 【0-3秒】△姜屿把奖杯放回正中，退后一步看了看。\n  - 【分镜】△她的余光扫过荣誉墙——某面墙的旧合影里，她的位置被人用相框盖住了；△她收回目光，拎包出门。\n  - 【表演】没有停顿，没有表情，只在跨出门槛时，把右膝护具紧了紧。\n  - 【尾钩】她不是回来叙旧的。\n- **拍 3**（第 17-27 秒｜10 秒｜第2场）\n  - 【0-3秒】△公示栏走廊，队员窃窃私语，声音压着但故意让人听见。\n  - 【分镜】△姜屿走过，窃语声跟着她移动；△洪川迎面拦下，客气而疏远，秒表在指头上转。\n  - 【台词】队员（窃语）：三年没打比赛，回来占谁的位？／洪川（客气疏远）：姜屿是吧。先去陪练组，恢复性训练。\n  - 【表演】她只点了一下头：好。——说完就走，不解释，不争。\n  - 【尾钩】昔日前主力，如今连「队内」都算不上。\n- **拍 4**（第 27-35 秒｜8 秒｜第2场）\n  - 【0-3秒】△姜屿在公示栏前站定，从护腕内侧抽出 07 号布。\n  - 【分镜】△「啪」——07 号布拍在自己的旧照片旁，抚平四角；△走廊瞬间安静，洪川的口哨又停了半拍。\n  - 【表演】她一个字没说，转身走了；留下满走廊的人和那块布对峙。\n  - 【尾钩】名字她不讨——她自己钉回来。\n- **拍 5**（第 35-44 秒｜9 秒｜第3场）\n  - 【0-3秒】△合练开球，顾曜打完一板，转身对镜头比心。\n  - 【分镜】△比心收势，他侧过身压低声音警告对面的沈让；△观察窗后隐约有立领外套的轮廓。\n  - 【台词】顾曜（压声）：老实点，别又抽风。\n  - 【表演】警告完立刻切回笑容；沈让弯腰捡球，没接话。\n  - 【尾钩】「专属陪练」第一天，摄像机全开着。\n- **拍 6**（第 44-53 秒｜9 秒｜第3场）（小刺激 1）\n  - 【0-3秒】△沈让抛球——喂球环节，本该最没有悬念的一球。\n  - 【分镜】△球过网后急坠侧拐，顾曜扑空，球擦着他拍边落地；△全场静，只听球在地板上滚了两圈。\n  - 【字幕反差·翻译】外行看：顾曜失误了。｜内行看：这球从出手就拐了两次。\n  - 【表演】顾曜僵在原地，第一反应又是看向观察窗；沈让已经弯腰去捡下一颗球。\n  - 【尾钩】「喂球」喂出了杀招——所有人都在等解释。\n- **拍 7**（第 53-62 秒｜9 秒｜第3场）（小刺激 2·发现者线启动）\n  - 【0-3秒】△隔壁台，姜屿接球的手停在半空。\n  - 【分镜】△她盯着那颗球的落点，右手指腹隔着护腕按住 07；△慢慢放下球桶，穿过球台之间的过道走过来。\n  - 【台词】姜屿（皱眉，自语）：这不是失误。是发球机都拉不出来的转速。\n  - 【表演】她说给自己听，但每个字都砸在沈让耳朵里。\n  - 【尾钩】她当众「翻译」了这颗球——外行听是怪球，内行听是底牌。\n- **拍 8**（第 62-73 秒｜11 秒｜第3场）（小刺激 3·全剧第一次实力外露）\n  - 【0-3秒】△姜屿拿起球拍，站上对面球台，抬眼：来。\n  - 【分镜】△两人隔网对拉：不说话，十几拍，越打越快；△慢镜：胶皮咬球、球身旋转变形的瞬间；△全馆停了——别的台不打了，队员围过来，唐果嚼能量胶的嘴停在半开。\n  - 【表演】两个人眼睛里都没有观众，只有球；最后一拍同时收力，球停在网带上，滚都没滚。\n  - 【尾钩】全馆安静了三秒——这三年，馆里没有过这种球。\n- **拍 9**（第 73-81 秒｜8 秒｜第3场）\n  - 【0-3秒】△观察窗内，魏峥放下保温杯，杯底磕在台面上。\n  - 【分镜】△他盯着场中那两个身影，对身侧的人偏了偏头；△玻璃反光里，顾曜涨红的脸退到画面边缘。\n  - 【台词】魏峥：查一下，谁把这两个人排进一张课表的。\n  - 【表演】他的语气不怒，像在核对库存——这才是最冷的地方。\n  - 【尾钩】球台上的事，要被拿到球台外去处理了。\n- **拍 10**（第 81-90 秒｜9 秒｜第3场）【卡点·情绪型】\n  - 【0-3秒】△训练结束的哨声里，姜屿隔着球网伸出手。\n  - 【分镜】△沈让把拍递过去；△特写：她的指腹抚过胶皮边缘——那是全世界只有她被允许碰的拍。\n  - 【台词】姜屿：把你的拍给我。……明天，当着我的面，再「瞎打」一次。／沈让（擦着拍沿，低声）：比分不说谎。明天它替我说。（口癖·变奏 3）\n  - 【表演】她把拍还回去时按了一下他的手背，只一秒；两人谁都没笑。\n  - 【尾钩】明天，全馆都会看着——「瞎打」这个词，撑得到明天吗？（黑场）\n\n## 六、门条件落实与约束对账\n\n### 6.1 R1/R2 门条件逐条落实\n\n| # | 门条件 | 本件落点 | 判 |\n| --- | --- | --- | --- |\n| 1 | 专业素材件（R1 条件 1） | 显式声明见 6.2（缺口仍在，移交条款不变） | 显式声明 |\n| 2 | 同场馆设定出清（R1 条件 2） | 全虚构场馆：星轨训练馆 / 公示栏走廊 / 资格赛比赛馆 / 九州大满贯主赛场均为虚构通用名，不映射任何真实场馆与赛程；热点素材「同场馆设定 / 真实场馆名」类建议一律不采纳；**宣发话术与剧内设定同守此线** | 过 |\n| 3 | 浓度判据去「无数据基准」（R1 条件 3） | 3.1 采用三要素判据（公开 / 证据链完整 / 当众社会性死亡），烈度上限只对表库内有数据的 b003 | 过 |\n| 4 | 功劳记账显性节拍进第 10 集（R1 条件 4） | 3.5 密度表第 2 章显性硬节拍：预告片挪用 + 顾曜发布会吹嘘；第 1 集拍 3/拍 8 已埋「剪球 / 留底」前哨；第 18 集卡点回收 | 过 |\n| 5 | 第 6 集划名单情境钩为唯一主钩 + 12-15 升格硬节拍（R1 条件 5） | 3.5 密度表第 6 集钩标注唯一主钩、「我不要你觉得」降为垫场台词；第 12/13/14/15 四点以硬节拍写入密度表 | 过 |\n| 6 | 三线容量裁决承接（R1 条件 6） | 沿用《故事框架案》1.3 裁决：队伍线功能件（唐果 1 人）、镜像弧三节点（38/42/54）、反转预算 1 大 + 3 中、有名有姓 6 人封顶、关系张力道具化（笔记 / 拍 / 递拍吃味拍） | 过 |\n\n### 6.2 专业素材件缺口显式声明（R1 条件 1 · 硬性欠账）\n\n- **现状**：乒乓专业素材件（技战术常识 / 赛制 / 陪练体系）截至本件产出仍未闭合，责任阶段 = **调研阶段**，产物形态 = 乒乓常识件，时限 = **S3 分稿推进前必须闭合**（R1 root_cause 规则：逾期未闭合，其后产物顺延失效重审）。\n- **本件的过渡纪律**：分拍初稿中全部技战术描写以**可核验常识为限**（退台放高球 / 三种旋转发球 / 缠胶皮流程 / 落点压线），每一处均配「翻译」件（字幕反差 / 群演反应 / 解说位），无一处自造专业体系或术语。\n- **待闭合的具名点位**：第 4 集「看破缠胶皮手法」的写法、第 8 集「阴招发球」的违规判据、第 14 集「黑哨判罚」的规则依据、第 16 集「发球反制」的技术合理性——四处均须待素材件核实后定稿，S3 成稿不得带空白过交付门。\n- **世界观红线联动**：提案 D「训练分 / 排名分」若经 R2 采纳，其双栏规则须与素材件赛制核实结果一并校验（全虚构、不与任何真实赛制对应）；本件未预采，落点已预留（第 12/18/36 集各 1 拍可插入，不动骨架）。\n\n### 6.3 C1-C10 约束对账\n\n| 条 | 落点 | 判 |\n| --- | --- | --- |\n| C1 | CN 优先、route=dual 双主角互相成就；单元模板内置职场三层映射（3.3），零懂球门槛；次客群由队伍终点战 + 复出线覆盖 | 过 |\n| C2 | 60 集 × 1-1.5 分钟 × 单集正文上限 1200 字（分拍初稿为节拍示意，成稿守上限）；反转预算 1 大 + 3 中（4.4）；10 章 × 6 集切分；全部副线挂「分配权」主线，无独立副线 | 过 |\n| C3 | 每集场景 ≤3（分拍初稿逐集标注 2-3 场景）；有名有姓 6 人封顶；前三章自造专名 2 个（星轨 / 启明），「九州大满贯」「领跑体育」17 集后登场不占预算；当众清算群演由环境描写承担 | 过 |\n| C4 | 禁马甲主线（掉马仅第 8/18 集清算瞬时态，单点亮出即收）；禁团宠（队伍线功能件，唐果战友情驱动）；无真假千金身世线（07 号布是姜屿自己的号码）；无追妻火葬场轴；无架空世界观；隐藏实力仅为藏/露策略变量 | 过 |\n| C5 | 全文无真实运动员 / 协会 / 赛事 / 赞助商 / 场馆名；场馆全虚构不映射真实场馆赛程（6.1 条件 2）；「饭圈」议题只取情绪不点名（镜像拍原则）；正片与宣发切片无口号式台词（初稿台词已查，无「整治 / 抵制」类词汇）；机构定调仅作内部锚不进正片 | 过 |\n| C6 | 灌篮高手 / 金牌得主仅借结构（队伍线 + 大赛终点 / 双主角互相成就）；致敬位台词留 S3 成稿原创改编，本件未引用任何原句、不复用原作桥段 | 过 |\n| C7 | 首付费卡点第 8 集（窗口内，落张力峰值）；每章章尾钩（3.5 末列）；清算首发固定第 18 集 + 烈度分级声明（3.6）；前 18 集每集 ≥1 切片梗点（对位梗卡预布点表 1:1）；第 10 集功劳记账显性节拍、第 6 集划名单唯一主钩、12-15 硬节拍——三项 R1 落锁全部显性 | 过 |\n| C8 | 主锚「德不配位」匿名化贯穿（位置 × 资源 × 荣誉的分配权错配）；反派作恶三式全虚构；排期对位赛事注意力窗口属发行层，不进本件 | 过 |\n| C9 | 新意装置段三轴回指齐（人设轴 / 场景轴 / 关系轴，见第一节）；所有改造点可回指，非假新意 | 过 |\n| C10 | 次选级设定声明（打脸虐渣 + 隐藏实力 + 强者回归，实事情绪做底，无原创架空）；第 1 集零设定解释直入冲突（三分钟测试：这是谁——沈让 / 他想要什么——记住被翻掉的比分并打回名字 / 为什么替他急——亲眼见比分被改 + 被当众安排当发球机 + 功劳被剪，第 1 集三层全踩）；技战术常识为限 + 翻译纪律 + 专业素材件显式声明（6.2）；梗密度直取梗卡预布点表 | 过 |\n\n### 6.4 hot 档自检\n\n- [x] 爆点密度：每集 ≥3 小刺激，分拍逐拍标注\n- [x] 回击时差 ≤2 拍：第 2 集双关羞辱 → 三分连发当场回敬\n- [x] 身份揭示瞬时态 + 群演反应拍，单点亮出即收（第 3 集拍 8
