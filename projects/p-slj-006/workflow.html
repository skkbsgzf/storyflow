function bindVerdict(n){
  const g=document.getElementById("vg"), nn=document.getElementById("vn");
  if (!g) return;
  g.onclick=()=>{ RS.nodes[n].verdict="approved"; RS.nodes[n].status="done"; render(); openNodeDoc(n); };
  nn.onclick=()=>{
    const sts=(flow.stages||[]);
    const rootSel=document.getElementById("vroot");
    RS.nodes[n].verdict="send-back"; RS.nodes[n].status="awaiting";
    if (!sts.length){
      // flow@3 语义：模块验收驳回 = 整个上游模块回退重跑（连接件驳回的等价操作）
      const myMid=(nodes[n]||{}).module||(nodes[n]||{}).stage;
      const inst=(DATA.modules||[]).find(x=>x.id===myMid);
      const firstNode=(inst&&inst.spine&&inst.spine[0])||Object.keys(nodes).find(x=>(nodes[x].stage||nodes[x].module)===myMid);
      if (firstNode && RS.nodes[firstNode]){
        Object.keys(nodes).forEach(x=>{
          if ((nodes[x].stage||nodes[x].module)===myMid && RS.nodes[x] && !nodes[x].gate_role){
            RS.nodes[x].status="pending"; RS.nodes[x].round=(RS.nodes[x].round||1)+1;
          }
        });
        const order=Object.keys(nodes);
        const ti=order.indexOf(firstNode);
        order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
        RS.nodes[n].root_cause_module=myMid;
      }
      render(); openNodeDoc(n); return;
    }
    const rootId=rootSel?rootSel.value:(sts[0]&&sts[0].id);
    const ri=sts.findIndex(s=>s.id===rootId);
    RS.nodes[n].root_cause_stage=rootId;
    (sts[ri]&&(sts[ri].nodes||[])).forEach(nid=>{ if (RS.nodes[nid]) { RS.nodes[nid].status="pending"; RS.nodes[nid].round=(RS.nodes[nid].round||1)+1; } });
    const order=Object.keys(nodes);
    const firstOfStage=sts[ri]&&sts[ri].nodes&&sts[ri].nodes[0];
    const ti=order.indexOf(firstOfStage||order[0]);
    order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
    render(); openNodeDoc(n);
  };
}
function openRerun(n){
  const m=nodes[n];
  const rcctx=condCtx();
  const upstream=edges.filter(e=>e.to===n && !isBackEdge(e) && evalWhen(e.when,rcctx).active).map(e=>e.from);
  const stageOf={}; (flow.stages||[]).forEach(s=>(s.nodes||[]).forEach(x=>stageOf[x]=s.id));
  const myStage=stageOf[n];
  const preset=(RS.presets||{})[myStage]||"semi";
  const inputs={}; upstream.forEach(u=>nodeOutputs(u).forEach(f=>{ if(files[f]) inputs[f]="✓"; }));
  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,
    skill:m.skill||undefined, minitool:m.minitool||undefined, assist:m.assist||undefined,
    kit:m.kit||undefined, op:m.op||undefined, asserts:m.asserts||undefined, inputs:inputs,
    inputs_note: upstream.length ? "上游产物："+upstream.join("、") : "无上游",
    output:nodeOutputs(n)[0]||"(汇入下游)", preset:preset,
    parallel_with: Object.keys(pos).filter(x=>x!==n && nodes[x].stage===m.stage && pos[x][0]===pos[n][0] && nodes[x].kind!=="gate" && nodes[x].kind!=="srd"),
    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>
    <button class="tb" id="r-zero">本阶段从零重做</button><button class="tb" id="r-close">收起</button></div>
    <div class="task">${JSON.stringify(tp, null, 2)}</div>
    <div class="act"><span class="msg" id="rmsg" aria-live="polite">标记后由宿主 / 运行时消费。</span></div>`;
  drawer.classList.add("on");
  document.getElementById("r-from").onclick=()=>{ markRerun(n); openNodeDoc(n); };
  document.getElementById("r-zero").onclick=()=>{ const stg=(flow.stages||[]).find(x=>x.nodes&&x.nodes.includes(n)); if(stg&&stg.entry) markRerun(stg.entry); openNodeDoc(n); };
  document.getElementById("r-close").onclick=()=>drawer.classList.remove("on");
  function markRerun(t){
    RS.nodes[t]=RS.nodes[t]||{};
    RS.nodes[t].verdict="send-back"; RS.nodes[t].status="pending"; RS.nodes[t].round=(RS.nodes[t].round||1)+1;
    render();
  }
}

  });

  </div>`;

  const hasWB = Object.keys(files).some(f=>f.startsWith("世界书/"));
  if (hasWB) h+=`<div class="shelf-row" id="open-wb" style="border-color:var(--accent)"><span class="no">书</span><span class="nm">中间件 · 设定真相库（世界书）</span><span class="go">打开 →</span></div>`;

  // 交付件：DATA.deliverables（生成器从 交付/ 对外交付/ 章节正文/ R6 <NN>-交付/ 收集；含二进制 docx/pdf）
  const dlvAll = DATA.deliverables || [];
  if (dlvAll.length){
    const dlvLabel = f => f.replace(/^对外交付\//,"").replace(/^\d{2}-交付\//,"");
    h+=`<div class="shelf-cap">交付件 · ${dlvAll.length}</div>`;
    h+=dlvAll.map(f=>{
      const md = /\.md$/.test(f) && typeof files[f] === "string";
      return md
        ? `<div class="shelf-row" data-f="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f).replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`
        : `<div class="shelf-row" data-link="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f)}</span><span class="go">下载/打开 →</span></div>`;
    }).join("");
  }
  const capMap={"对外交付":"对外交付","内部":"内部产物","过程文件":"过程文件"};
  // W-07 架分组收敛：有模块分组数据（DATA.moduleFiles）时，过程文件按模块折叠展示，替代旧的平铺长列表
  const mf=DATA.moduleFiles||[];
  for (const g of ["对外交付","内部"]){
    const lst=groups[g].filter(f=>!dlvAll.includes(f)); if(!lst.length) continue;
    h+=`<div class="shelf-cap">${capMap[g]} · ${lst.length}</div>`;
    h+=lst.map(f=>{
      const nm=g==="对外交付" ? f.slice(5) : f;
      const no=g==="对外交付" ? f.slice(5,7) : g==="内部" ? "内" : "程";
      return `<div class="shelf-row" data-f="${f}"><span class="no">${no}</span><span class="nm">${nm.replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`;
    }).join("");
  }
  // 过程文件：有模块分组数据时按模块折叠（默认收起），否则平铺
  const procAll=groups["过程文件"].filter(f=>!dlvAll.includes(f));
  if (procAll.length){
    if (mf.length){
      h+=`<div class="shelf-cap">模块过程件 · ${procAll.length}（点模块展开）</div>`;
      mf.forEach(m=>{
        const proc=(m.process||[]).filter(f=>procAll.includes(f));
        if(!proc.length) return;
        h+=`<details><summary class="shelf-cap" style="cursor:pointer;margin:14px auto 6px">${m.id} ${m.name||""} · ${proc.length} 件</summary>`;
        h+=proc.map(f=>`<div class="shelf-row" data-f="${f}"><span class="no">程</span><span class="nm">${f.replace(/^\d{2}-[^/]+\//,"").replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`).join("");
        h+=`</details>`;
      });
      const strayProc=procAll.filter(f=>!mf.some(m=>(m.process||[]).includes(f)));
      if (strayProc.length){
        h+=`<details><summary class="shelf-cap" style="cursor:pointer;margin:14px auto 6px">未归属模块 · ${strayProc.length} 件</summary>`;
        h+=strayProc.map(f=>`<div class="shelf-row" data-f="${f}"><span class="no">程</span><span class="nm">${f.replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`).join("");
        h+=`</details>`;
      }
    } else {
      h+=`<div class="shelf-cap">过程文件 · ${procAll.length}</div>`;
      h+=procAll.map(f=>`<div class="shelf-row" data-f="${f}"><span class="no">程</span><span class="nm">${f.replace(/\.md$/,"")}</span><span class="go">打开 →</span></div>`).join("");
    }
  }
  dBody.innerHTML=h;
  dBody.querySelectorAll(".shelf-row[data-f]").forEach(r=>r.addEventListener("click",()=>openFileDoc(r.dataset.f)));
  dBody.querySelectorAll(".shelf-row[data-link]").forEach(r=>r.addEventListener("click",()=>window.open(r.dataset.link,"_blank")));
  const wb=dBody.querySelector("#open-wb");
  if (wb) wb.addEventListener("click", openWorldbook);
  const lg=dBody.querySelector("#open-ledger");
  if (lg) lg.addEventListener("click", openLedger);
  dBody.scrollTop=0;
}

目录将移入 projects/_archived/（不真正删除，可随时找回）。`)) return;

/* ---------- 产物管理：小说=逐章文档槽位；剧本=一份剧本多种格式 ---------- */
function openDeliverables(){
  navPush({type:"deliverables"});
  sel=null; selEdge=null; render();
  docReset(); dBack.style.display = navStack.length ? "" : "none";
  dTitle.textContent = "产物管理";
  const itNode = Object.entries(nodes).find(([n,m]) => m.iterate);
  const dlv = DATA.deliverables || [];
  const dlvLabel = f => f.replace(/^对外交付\//,"").replace(/^\d{2}-交付\//,"");
  const isTextFile = f => /\.md$/.test(f) && typeof files[f] === "string";
  const delivered = dlv.filter(f => f.startsWith("对外交付/"));
  const r6dlv = dlv.filter(f => /^\d{2}-交付\//.test(f));
  const other = dlv.filter(f => !f.startsWith("对外交付/") && !/^\d{2}-交付\//.test(f));
  let h = "";
  // 章节模式（小说）：iterate.first 个槽位——first≤1（合并稿交付）或槽位全空时隐藏，避免误导
  if (itNode){
    const [n, m] = itNode;
    const it = m.iterate;
    const total = it.first || 1;
    const rows = [];
    for (let i = 1; i <= total; i++){
      const cand = (it.artifact || "章节正文/第{n}章.md").replace("{n}", i);
      const exists = files[cand] !== undefined || dlv.includes(cand);
      rows.push({cand, exists});
    }
    const anyExists = rows.some(r=>r.exists);
    if (total > 1 || anyExists){
      h += `<div class="paper"><div class="doc-h"><span>章节文档 · ${zhTitle(m)}</span><span>⟲ ${it.unit} × ${total}</span></div><div class="md">`;
      rows.forEach((r,i)=>{
        h += r.exists ? `<div class="shelf-row" data-f="${r.cand}"><span class="no">${i+1}</span><span class="nm">${r.cand}</span><span class="go">打开 →</span></div>`
                      : `<div class="shelf-row" style="opacity:.55;cursor:default"><span class="no">${i+1}</span><span class="nm">${r.cand}（虚位，待成稿）</span><span class="go">—</span></div>`;
      });
      h += `</div><p class="msg">迭代节点「${zhTitle(m)}」每${it.unit}一个实例；来源：${it.over||"-"}。</p></div>`;
    }
  }
  // 对外交付：md 可编辑；其他格式（docx/html）走服务器相对链接
  h += `<div class="shelf-cap">对外交付 · ${delivered.length}</div>`;
  h += delivered.map(f => f.endsWith(".md")
    ? `<div class="shelf-row" data-f="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">打开 →</span></div>`
    : `<div class="shelf-row" data-link="${f}"><span class="no">${f.slice(5,7)}</span><span class="nm">${f.slice(5)}</span><span class="go">下载/打开 →</span></div>`).join("");
  // R6 模块交付：<NN>-交付/（flow@3 交付模块产物目录）
  if (r6dlv.length){
    h += `<div class="shelf-cap">模块交付 · ${r6dlv.length}</div>`;
    h += r6dlv.map(f => isTextFile(f)
      ? `<div class="shelf-row" data-f="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f)}</span><span class="go">打开 →</span></div>`
      : `<div class="shelf-row" data-link="${f}"><span class="no">交</span><span class="nm">${dlvLabel(f)}</span><span class="go">下载/打开 →</span></div>`).join("");
  }
  if (other.length){
    h += `<div class="shelf-cap">其他格式</div>`;
    h += other.map(f => `<div class="shelf-row" data-link="${f}"><span class="no">附</span><span class="nm">${f}</span><span class="go">打开 →</span></div>`).join("");
  }
  // W-02 模块收敛交付件（io.output.file）：每模块一份成熟交付，置顶展示
  const mf = DATA.moduleFiles || [];
  const mfdlv = mf.filter(m => m.deliverable);
  if (mfdlv.length){
    h += `<div class="shelf-cap">模块收敛交付 · ${mfdlv.length}（每模块一份成熟交付，W-02）</div>`;
    h += mfdlv.map(m => {
      const f = m.deliverable;
      const row = isTextFile(f)
        ? `<div class="shelf-row" data-f="${f}"><span class="no">${String(m.id||"").replace(/^m/,"M")||"模"}</span><span class="nm">${f.split("/").pop()}<span class="msg">（${m.name}${m.audience?` → ${m.audience}`:""}）</span></span><span class="go">打开 →</span></div>`
        : `<div class="shelf-row" data-link="${f}"><span class="no">${String(m.id||"").replace(/^m/,"M")||"模"}</span><span class="nm">${f.split("/").pop()}<span class="msg">（${m.name}）</span></span><span class="go">下载/打开 →</span></div>`;
      return row;
    }).join("");
  }
  // 模块内幕：过程件默认折叠（乱的分析/思维链痕迹不再是第一眼），点开才见
  const mfproc = mf.filter(m => (m.process||[]).length);
  if (mfproc.length){
    h += `<details style="max-width:720px;margin:20px auto 0"><summary style="cursor:pointer;color:#8a8375;font-size:12px;letter-spacing:2px">模块内幕 · 过程件 ${mfproc.reduce((s,m)=>s+m.process.length,0)} 份（默认收起——要看推理过程再展开）</summary>`;
    h += mfproc.map(m => `<div class="shelf-cap" style="margin-top:12px">${m.name} · ${m.dir}/</div>`
      + m.process.map(f => isTextFile(f)
        ? `<div class="shelf-row" data-f="${f}"><span class="no">程</span><span class="nm">${f.split("/").pop()}</span><span class="go">打开 →</span></div>`
        : `<div class="shelf-row" data-link="${f}"><span class="no">程</span><span class="nm">${f.split("/").pop()}</span><span class="go">打开 →</span></div>`).join("")).join("");
    h += `</details>`;
  }
  if (!delivered.length && !r6dlv.length && !other.length && !mfdlv.length) h += `<p class="msg" style="max-width:720px;margin:20px auto">暂无交付件。</p>`;
  // 交付清单核对（规范 R4 §5.1 + R6 模块交付）：outputs 是唯一事实源；flow@3 的 outputs 按
  // module 键声明——展开为该模块全部带产物节点逐件核对；磁盘上没被任何声明认领的件显式告警
  const decl = (flow.outputs||[]).flatMap(o=>{
    if (o.path || o.node) return [{node:o.node, path:o.path||((nodes[o.node]||{}).output)||"", title:o.title||""}];
    if (o.module) return Object.entries(nodes)
      .filter(([,n]) => (n.module===o.module || n.stage===o.module) && n.output)
      .map(([id,n]) => ({node:id, path:n.output, title:(o.title ? o.title+" · " : "")+(zhTitle(n)||id)}));
    return [];
  }).filter(x=>x.path);
  h += `<div class="shelf-cap">交付清单核对 · flow 声明 ${decl.length} 件</div>`;
  h += decl.map(x => {
    const onDisk = dlv.includes(x.path) || files[x.path] !== undefined;
    return `<div class="shelf-row" data-node="${x.node}"><span class="no">${onDisk?"✓":"…"}</span><span class="nm">${x.title || zhTitle(nodes[x.node]||{})} <span class="msg">${x.path}</span></span><span class="go">${onDisk?"已产出":"待产出"} · 查看节点 →</span></div>`;
  }).join("");
  const unc = DATA.unclaimed || [];
  if (unc.length)
    h += `<p class="msg" style="color:#8c352c">⚠ ${unc.length} 个交付文件未在 flow 的 outputs 里登记，不会被任何节点认领：${unc.join("、")} —— 请补 <code>outputs[].path</code>（规范 R4 §5.1）。</p>`;
  dBody.innerHTML = h;
  dBody.querySelectorAll(".shelf-row[data-f]").forEach(r => r.addEventListener("click", () => openFileDoc(r.dataset.f)));
  dBody.querySelectorAll(".shelf-row[data-link]").forEach(r => r.addEventListener("click", () => window.open(r.dataset.link, "_blank")));
  dBody.querySelectorAll(".shelf-row[data-node]").forEach(r => r.addEventListener("click", () => select(r.dataset.node)));
  flashDoc();
  dBody.scrollTop = 0;
}

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);
      if(d!==null&&a!==null&&d!==a){
        const pair=charSpanPair(d,a);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${dHtml}</div>`);
      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }
  return out.join("");
}

    <div class="diff-legend"><span class="lg del">− 旧版</span><span class="lg add">+ 新版</span><span class="lg cw-hint">高亮 = 该段里真正改动的字词</span></div>
    <div id="df-out"></div>`;
  const sa = document.getElementById("df-a"), sb = document.getElementById("df-b");

/* ---------- 文档三合一：contenteditable 直编 + 框选批注（浮层输入 → 右侧气泡） ---------- */
function curAnnoKey(){
  if (curNav.type==="node") return "node:"+curNav.n;
  if (curNav.type==="file") return curNav.f;
  return null;
}
function renderDocPages(pages, opts){
  const ed = !(opts && opts.readonly);
  let h="";
  for (const pg of pages){
    h+=`<div class="docpaper paper" data-pg="${pg.name}"><div class="doc-h"><span>${pg.name}</span><span>${ed?"点文字直编 · 框选加批注":"参考文档"}</span></div><div class="md"${ed?' contenteditable="true" spellcheck="false"':""}>${mdHtml(pg.md)}</div><div class="anno-rail" aria-hidden="true"></div></div>`;
  }
  return h;
}
function annoList(key){ RS.annos=RS.annos||{}; RS.annos[key]=RS.annos[key]||[]; return RS.annos[key]; }
function findWrapQuote(quote, aid){
  const tries=[quote.replace(/\s+/g," ").trim(), quote.trim().slice(0,20)].filter(x=>x.length>=4);
  const walker=document.createTreeWalker(dBody, NodeFilter.SHOW_TEXT);
  let node;
  while ((node=walker.nextNode())){
    if (node.parentElement && node.parentElement.closest(".anno-rail")) continue;
    for (const t of tries){
      const idx=node.textContent.indexOf(t);
      if (idx>=0){
        const r=document.createRange();
        r.setStart(node, idx);
        r.setEnd(node, Math.min(node.textContent.length, idx+t.length));
        const mark=document.createElement("span");
        mark.className="anno-mark"; mark.dataset.aid=aid; mark.title="批注";
        try{ r.surroundContents(mark); }
        catch(err){ try{ mark.appendChild(r.extractContents()); r.insertNode(mark); }catch(e2){ return null; } }
        return mark;
      }
    }
  }
  return null;
}
function placeBubble(key, a, markEl, note){
  const paper = markEl ? markEl.closest(".docpaper") : dBody.querySelector(".docpaper");
  if (!paper) return;
  const rail=paper.querySelector(".anno-rail");
  if (!rail) return;
  const qFlat=a.quote.replace(/\s+/g," ");
  const b=document.createElement("div");
  b.className="anno-bubble"+(note?" unresolved":"");
  b.innerHTML=`<div class="ab-q">「${qFlat.slice(0,36)}${qFlat.length>36?"…":""}」</div><div class="ab-t">${a.text}</div>${note?`<div class="msg">${note}</div>`:""}<div class="ab-x" title="删除批注">✕</div>`;
  let top = markEl ? markEl.offsetTop : 40;
  const bubbles=[...rail.querySelectorAll(".anno-bubble")];
  const last=bubbles[bubbles.length-1];
  if (last){ const lb=last.offsetTop+last.offsetHeight+8; if (top<lb) top=lb; }
  b.style.top=top+"px";
  rail.appendChild(b);
  b.addEventListener("click",ev=>{
    if (ev.target.classList.contains("ab-x")){
      const m=paper.querySelector(`.anno-mark[data-aid="${a.id}"]`);
      if (m){ const par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m); m.remove(); }
      RS.annos[key]=RS.annos[key].filter(x=>x.id!==a.id);
      persistState();
      b.remove();
      ev.stopPropagation();
      return;
    }
    const m=paper.querySelector(`.anno-mark[data-aid="${a.id}"]`);
    if (m){ m.scrollIntoView({behavior:"smooth",block:"center"}); m.classList.add("flashmark"); setTimeout(()=>m.classList.remove("flashmark"),900); }
  });
}
function anchorAnnos(key){
  const list=(RS.annos||{})[key]||[];
  for (const a of list){
    const mark=findWrapQuote(a.quote, a.id);
    if (mark) placeBubble(key, a, mark);
    else {
      const rail=dBody.querySelector(".docpaper .anno-rail");
      if (rail) placeBubble(key, a, null, "未定位到原文");
    }
  }
}
function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

function pushUndo(){
  const key = docKey(); if (!key) return;
  const pages = capturePapers();
  if (!pages.length) return;
  const st = ustate(key);
  const sig = JSON.stringify(pages);
  if (st.stack[st.idx] && JSON.stringify(st.stack[st.idx]) === sig) return;
  st.stack = st.stack.slice(0, st.idx+1);
  st.stack.push(pages);

  st.idx = st.stack.length-1;

function undoDoc(){
  const key = docKey(); if (!key) return;
  pushUndo();
  const st = ustate(key);
  if (st.idx <= 0) return;
  st.idx -= 1;
  restorePapers(st.stack[st.idx]);
  anchorAnnos(key);
}
function redoDoc(){
  const key = docKey(); if (!key) return;
  const st = ustate(key);
  if (st.idx >= st.stack.length-1) return;
  st.idx += 1;

  anchorAnnos(key);

document.addEventListener("mouseup", e=>{

  const r=s.getRangeAt(0);
  let rect=r.getBoundingClientRect();

  pop.style.top=Math.round(Math.min(Math.max(8, rect.bottom-pr.top+8), Math.max(8, pr.height-150)))+"px";
  pop.style.display="block";
  document.getElementById("anno-input").focus();
});

    if (e.target.closest("[data-imp],[data-demo]")) return;
    stSel=c.dataset.f; renderStore(); body.scrollTop=0;
  }));
  body.querySelectorAll("[data-imp]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importFlowTo(b.dataset.imp); }));
  body.querySelectorAll("[data-demo]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importDemo(b.dataset.demo); }));
}
function renderStoreDetail(){
  const f=(DATA.flowsIndex||[]).find(x=>x.id===stSel), body=document.getElementById("st-body");
  if (!f){ stSel=null; return renderStore(); }
  const cur=f.id===DATA.flow.id, [g,bg]=ST_GLYPH[f.category]||ST_GLYPH["其他"];
  body.innerHTML=`<div class="store-detail">
    <button class="st-back" id="st-backbtn">← 返回商店</button>
    <div class="sd-head"><span class="st-ico" style="background:${bg}">${g}</span>
      <div style="flex:1;min-width:0"><div class="sd-title">${stEsc(f.title)}</div>
        <div class="sd-meta"><span style="font-family:Consolas,monospace">${stEsc(f.id)}</span><span>v${stEsc(f.version)}</span><span>${stEsc(f.category)}</span>
          ${f.updated?`<span>更新 ${stEsc(f.updated)}</span>`:""}${f.engine?`<span>${stEsc(f.engine)}</span>`:""}
          <span class="sc-ver${f.official?" rel":""}">${f.official?"官方发布":"初稿"}</span>
          ${cur?`<span class="sc-badge cur">当前绑定</span>`:`<span class="sc-badge">未绑定</span>`}</div>
        <div class="sd-desc">${stEsc(f.desc)||"（无简介）"}</div></div></div>
    <div class="sd-actions">
      ${cur?`<button class="sd-main" disabled>当前绑定 · 无需导入</button>`
           :`<button class="sd-main" id="st-imp">导入到本项目（${stEsc(DATA.project)}）</button>`}
      <button class="sd-ghost" id="st-close2">继续浏览</button>
      ${f.hasDemo?`<button class="sd-ghost" id="st-demo" style="border-color:var(--accent);color:var(--accent);font-weight:700">装官方 Demo（新项目）</button>`:""}</div>
    <div class="sd-sec"><h4>规模</h4><div class="sd-stats">
      ${(f.modules||[]).length?`<div class="sd-stat"><b>${(f.modules||[]).length}</b><span>模块</span></div>`:`<div class="sd-stat"><b>${(f.stages||[]).length||"-"}</b><span>阶段</span></div>`}
      <div class="sd-stat"><b>${f.nNodes??"-"}</b><span>节点</span></div>
      <div class="sd-stat"><b>${f.nAgents??"-"}</b><span>Agent 步</span></div>
      <div class="sd-stat"><b>${f.nGates??"-"}</b><span>验收门</span></div>
      <div class="sd-stat"><b>${(f.skills||[]).length}</b><span>技能</span></div></div></div>
    ${(f.stages&&f.stages.length)?`<div class="sd-sec"><h4>阶段流水</h4><div class="sd-stages">${f.stages.map(s=>`<span class="sd-stage"><b>${stEsc(s.id)}</b>${stEsc(s.name||"")}</span>`).join("")}</div></div>`:""}
    ${(f.skills&&f.skills.length)?`<div class="sd-sec"><h4>使用技能（提示词）</h4><div class="sd-skills">${f.skills.map(s=>`<span class="sd-skill">${stEsc(s)}</span>`).join("")}</div></div>`:""}
    <div class="sd-sec"><h4>使用情况（各项目运行版本）</h4><div class="sd-use">${(()=>{const uses=f.usage||[];
      if(!uses.length) return `<div class="sd-use-empty">尚未有任何项目运行此流程——卡片标注「未运行」。</div>`;
      return uses.map(u=>{const rel=stCmp(u.version,f.version);
        const note=rel===0?"与商店版本一致":(rel<0?`落后商店 v${stEsc(f.version)}，重跑或换绑即更新`:"高于商店版本");
        return `<div class="sd-use-row"><b>${stEsc(u.project)}</b><span>v${stEsc(u.version||"?")}</span><span class="msg">${note}</span></div>`;}).join("");
    })()}</div></div>
    <div class="sd-sec"><h4>导入说明</h4><p class="msg" style="margin:0">导入把项目绑定切到该流程：运行状态保留，计划按新流程重编译；flow_init 契约按项目配置重新装载。自建流程先把 flow.json 放入 <code>flows/&lt;新id&gt;/</code>，过 flow-lint 后即出现在本商店。带「装 Demo」标的流有官方示例项目：一键复制为你的新项目，配置与输入素材已就位，<code>flow_run</code> 即可开跑。</p></div>
  </div>`;
  document.getElementById("st-backbtn").onclick=()=>{ stSel=null; renderStore(); };
  document.getElementById("st-close2").onclick=closeFlowStore;
  const imp=document.getElementById("st-imp"); if (imp) imp.onclick=()=>importFlowTo(f.id);
  const dem=document.getElementById("st-demo"); if (dem) dem.onclick=()=>importDemo(f.id);
}
// store 标记位于本脚本之后，须等 DOM 就绪再绑定（否则 getElementById 为 null，绑定全数失败）
(function stBind(){
  const bind = () => {
    document.getElementById("store-q").addEventListener("input",e=>{ stQ=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-sort").addEventListener("change",e=>{ stSort=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-close").addEventListener("click",closeFlowStore);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("store").classList.contains("on")) closeFlowStore(); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
</script>
<div id="store" role="dialog" aria-label="流商店">
  <div class="store-top">
    <span class="st-brand">流商店</span><span class="st-sub" id="st-count"></span>
    <input id="store-q" type="search" placeholder="搜索流程 / 能力 / 技能…" aria-label="搜索流程">
    <select id="st-sort" class="st-sort" aria-label="排序">
      <option value="default">排序：默认</option>
      <option value="updated">最近更新</option>
      <option value="nodes">节点最多</option>
      <option value="name">名称</option>
    </select>
    <button class="tb" id="st-close">✕ 关闭</button>
  </div>
  <div class="st-cats" id="st-cats"></div>
  <div class="store-body" id="st-body"></div>
</div>
</body>
</html>
