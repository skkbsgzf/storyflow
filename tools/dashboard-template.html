<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目看板 · __TITLE__</title>
<style>
  /* 项目看板 · dashboard@1 固定模板（批次4 W4.1）。
     零外部依赖：系统字体栈、内联样式、数据生成时内联为惰性 JSON，不回 call kit（ARCHITECTURE §9 不变量 6）。
     视觉对齐 diagnosis-template / kb-graph-template 暗色系金调。 */
  :root { --bg:#16181d; --panel:#1d2027; --panel2:#22262e; --border:#2a2e37; --ink:#d8d4cb;
          --dim:#8a8375; --gold:#e8b33d; --blue:#6ea8fe; --green:#5f9c7a; --red:#d98a83;
          --mono:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font:14px/1.65 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; }
  #app { display:flex; height:100%; }
  /* ── 左侧导航 ── */
  nav { width:196px; flex:0 0 196px; border-right:1px solid var(--border); background:var(--panel);
        display:flex; flex-direction:column; padding:14px 0 10px; }
  nav .brand { padding:0 16px 12px; border-bottom:1px solid var(--border); }
  nav .brand b { font-size:15px; letter-spacing:2px; }
  nav .brand .pid { display:block; font-family:var(--mono); font-size:11px; color:var(--dim);
                    overflow-wrap:anywhere; margin-top:3px; }
  nav .items { padding:8px 0; overflow:auto; flex:1; }
  nav .it { display:flex; align-items:center; gap:8px; padding:8px 16px; cursor:pointer;
            border-left:3px solid transparent; color:var(--dim); user-select:none; white-space:nowrap; }
  nav .it:hover { background:var(--panel2); color:var(--ink); }
  nav .it.on { border-left-color:var(--gold); color:var(--ink); background:var(--panel2); }
  nav .it .n { font-family:var(--mono); font-size:11px; color:var(--dim); margin-left:auto; }
  nav .foot { padding:10px 16px 0; border-top:1px solid var(--border); font-family:var(--mono);
              font-size:11px; color:var(--dim); overflow-wrap:anywhere; }
  /* ── 主区 ── */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 20px 10px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:16px; letter-spacing:2px; display:inline; }
  header .sub { font-family:var(--mono); font-size:12px; color:var(--dim); margin-left:10px; }
  .chips { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--border);
          border-radius:999px; padding:1px 10px; }
  .chip.g { color:var(--gold); border-color:var(--gold); }
  section { display:none; flex:1; min-height:0; overflow:auto; padding:16px 20px 40px; }
  section.on { display:block; }
  section.split { display:none; }
  section.split.on { display:flex; gap:16px; padding:0; overflow:hidden; min-height:0; }
  h2 { font-size:13px; letter-spacing:1px; color:var(--gold); margin:18px 0 8px; font-weight:600; }
  h2:first-child { margin-top:0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .grid { display:grid; gap:10px; }
  .grid.k6 { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .stat .v { font-family:var(--mono); font-size:20px; color:var(--gold); }
  .stat .k { font-size:12px; color:var(--dim); }
  .stat .x { font-family:var(--mono); font-size:11px; color:var(--dim); }
  ul.plain { list-style:none; margin:0; padding:0; }
  .kv { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  input[type=search], select { background:var(--panel2); color:var(--ink); border:1px solid var(--border);
     border-radius:6px; padding:4px 9px; font:12px/1.5 var(--mono); }
  input[type=search] { min-width:220px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--dim); font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0;
       background:var(--bg); white-space:nowrap; }
  th .ar { color:var(--gold); }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--panel); }
  tbody tr.on { background:var(--panel2); }
  td.mono, .mono { font-family:var(--mono); }
  .tag { display:inline-block; font-family:var(--mono); font-size:11px; border:1px solid var(--border);
         border-radius:999px; padding:0 8px; margin:1px 3px 1px 0; color:var(--dim); }
  .st-active { color:var(--green); } .st-draft { color:var(--gold); }
  .st-retired { color:var(--red); } .st-other { color:var(--dim); }
  .role-human { color:var(--gold); } .role-generated { color:var(--blue); }
  .src { color:var(--green); }
  .warn { color:var(--red); }
  .muted { color:var(--dim); }
  .empty { padding:26px 4px; color:var(--dim); font-size:13px; }
  /* ── 抽屉（卡全文） ── */
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(680px,64vw); background:var(--panel);
            border-left:1px solid var(--border); transform:translateX(100%); transition:transform .16s ease;
            display:flex; flex-direction:column; z-index:9; box-shadow:-8px 0 28px rgba(0,0,0,.45); }
  #drawer.open { transform:none; }
  #drawer .hd { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
  #drawer .hd b { font-size:14px; }
  #drawer .hd .x { margin-left:auto; cursor:pointer; color:var(--dim); font-family:var(--mono); }
  #drawer .bd { overflow:auto; padding:14px 16px 40px; }
  pre.md { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:12.5px/1.75 var(--mono); color:var(--ink); }
  /* ── 图谱区 ── */
  #cvwrap { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  #tip { position:absolute; z-index:4; pointer-events:none; display:none; max-width:340px;
         background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 12px;
         font-size:12px; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  #tip .t { font-weight:600; margin-bottom:2px; } #tip .m { font-family:var(--mono); font-size:11px; color:var(--dim); overflow-wrap:anywhere; }
  #graphSide { width:280px; flex:0 0 280px; border-left:1px solid var(--border); padding:12px; overflow:auto; }
  .lg { font-family:var(--mono); font-size:11px; color:var(--ink); border:1px solid var(--border);
        border-radius:999px; padding:1px 9px; margin:2px 3px 2px 0; cursor:pointer; user-select:none;
        display:inline-block; background:var(--panel2); }
  .lg .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .lg.off { opacity:.32; }
  /* ── 大事记（叙事 5W1H 多轨时间线，W4.6） ── */
  #chWrap { border:1px solid var(--border); border-radius:10px; overflow:auto;
            max-height:calc(100vh - 250px); background:var(--bg); }
  .chrow { display:flex; align-items:stretch; border-bottom:1px solid var(--border); min-height:28px; }
  .chrow .lname { position:sticky; left:0; z-index:3; flex:0 0 140px; background:var(--panel);
                  border-right:1px solid var(--border); padding:4px 8px; font-size:12px; cursor:pointer;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .chrow .lname:hover { background:var(--panel2); }
  .chrow .lname .c { float:right; font-family:var(--mono); font-size:11px; color:var(--dim); margin-left:6px; }
  .chrow.off .lname { opacity:.34; }
  .chrow.off .lane { opacity:.25; }
  .chrow .lane { position:relative; flex:0 0 auto; height:28px; }
  .chhead { position:sticky; top:0; z-index:4; }
  .chhead .lname { z-index:5; font-family:var(--mono); font-size:11px; color:var(--dim); cursor:default; }
  .bandseg { padding:5px 8px; font-size:11.5px; border-right:1px solid var(--border); background:var(--panel2);
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .bandseg.on { color:var(--gold); }
  .bandseg .lay { color:var(--dim); font-family:var(--mono); font-size:10.5px; }
  .blk { position:absolute; top:3px; height:22px; line-height:21px; border-radius:5px; font-size:11px;
         padding:0 5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer;
         color:#16181d; border:1px solid rgba(0,0,0,.4); font-weight:600; }
  .blk:hover { outline:2px solid var(--gold); outline-offset:-1px; }
  .blk.drift { box-shadow:inset 0 0 0 2px var(--red); }
  .blk.untracked { font-weight:400; height:18px; line-height:17px; top:5px; }
  .blk.dim { opacity:.13; }
  .btn { background:var(--panel2); color:var(--dim); border:1px solid var(--border); border-radius:6px;
         padding:4px 10px; font:12px/1.4 var(--mono); cursor:pointer; }
  .btn:hover { color:var(--ink); }
  .btn.on { color:var(--gold); border-color:var(--gold); }
  .chrow.fac .lname { color:var(--blue); }
  .chrow.untrackedrow .lname { color:var(--dim); font-style:italic; }
  /* 钻取抽屉：5W1H 分栏 */
  .w5 { display:grid; grid-template-columns:74px 1fr; gap:4px 10px; font-size:12.5px; }
  .w5 .k5 { font-family:var(--mono); font-size:11px; color:var(--gold); padding-top:2px; }
  .w5 .v5 { overflow-wrap:anywhere; }
  .w5 .v5 .none { color:var(--dim); font-style:italic; }
  /* ── 叙述层（W4.7）：人读优先。开场白 / 段带导语 / STAR 四拍 / 轨道串讲 ── */
  .chlead { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--gold);
            border-radius:10px; padding:12px 16px; margin-bottom:12px; font-size:13.5px; line-height:1.95;
            white-space:pre-wrap; overflow-wrap:anywhere; }
  .bandintro { background:var(--panel2); border:1px solid var(--border); border-radius:10px;
               padding:10px 14px; margin-bottom:10px; font-size:13px; line-height:1.9; }
  .bandintro b { color:var(--gold); font-weight:600; }
  .beats { margin:2px 0 12px; }
  .beat { display:grid; grid-template-columns:52px 1fr; gap:10px; padding:9px 0;
          border-bottom:1px dashed var(--border); }
  .beat:last-child { border-bottom:0; }
  .beat .bl { font-family:var(--mono); font-size:11px; color:var(--gold); padding-top:5px; letter-spacing:1px; }
  .beat .bt { font-size:13.5px; line-height:2; overflow-wrap:anywhere; }
  .beat .bt.miss { color:var(--dim); font-style:italic; }
  details.w5d { margin:4px 0 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); }
  details.w5d > summary { cursor:pointer; padding:8px 12px; font-family:var(--mono); font-size:11.5px;
                          color:var(--dim); user-select:none; }
  details.w5d > summary:hover { color:var(--ink); }
  details.w5d .w5 { padding:2px 12px 12px; }
  .gapchips .tag { border-style:dashed; }
  .hintline { font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.85; margin:6px 0 14px; }
  .lanebtn { display:inline-block; margin-left:6px; padding:0 5px; border:1px solid var(--border);
             border-radius:4px; font-family:var(--mono); font-size:10.5px; color:var(--dim); cursor:pointer; }
  .lanebtn:hover { color:var(--gold); border-color:var(--gold); }
  .arc { font-size:13px; line-height:1.95; margin-bottom:12px; }
  .narrlist { border-left:2px solid var(--border); margin-left:4px; padding-left:14px; }
  .narrlist .ni { margin-bottom:13px; }
  .narrlist .nh { font-family:var(--mono); font-size:11px; color:var(--gold); }
  .narrlist .ns { font-size:12.5px; color:var(--dim); line-height:1.85; }
  .narrlist .na { font-size:13px; line-height:1.95; overflow-wrap:anywhere; }
  .narrlist .nr { font-size:12px; color:var(--dim); line-height:1.85; }
  .narrlist .ni.clickable { cursor:pointer; }
  .narrlist .ni.clickable:hover .na { color:var(--gold); }
  /* ── W4.2 三通道（产物读写编辑器） ── */
  .edbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 10px; }
  .edwrap textarea { width:100%; min-height:46vh; resize:vertical; background:var(--panel2); color:var(--ink);
    border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-family:var(--mono);
    font-size:12.5px; line-height:1.9; }
  .edwrap textarea:focus { outline:1px solid var(--gold); }
  .ednote { font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.85; margin:8px 0; }
  .diffbox { max-height:38vh; overflow:auto; background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:11.5px; line-height:1.8; }
  .diffbox .add { color:#7fbf8a; } .diffbox .del { color:#d98a83; } .diffbox .hud { color:var(--gold); }
  .diffbox .ctx { color:var(--dim); }
  .bar input[type=text] { background:var(--panel2); color:var(--ink); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-family:var(--mono); font-size:11.5px; width:250px; }
  /* ── 产物区 ── */
  #artSide { width:360px; flex:0 0 360px; border-left:1px solid var(--border); padding:14px; overflow:auto; }
  .tl { border-left:2px solid var(--border); margin-left:6px; padding-left:14px; }
  .tl .day { font-family:var(--mono); color:var(--gold); font-size:12px; margin:14px 0 6px; }
  .tl .ev { margin-bottom:9px; }
  .tl .ev .e { font-size:12.5px; }
  .tl .ev .m { font-family:var(--mono); font-size:11px; color:var(--dim); }
  @media (max-width:900px) { nav { width:150px; flex-basis:150px; } #graphSide,#artSide { display:none; } }
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="brand"><b>项目看板</b><span class="pid" id="navPid"></span></div>
    <div class="items" id="navItems"></div>
    <div class="foot" id="navFoot"></div>
  </nav>
  <main>
    <header>
      <h1 id="hTitle"></h1><span class="sub" id="hSub"></span>
      <div class="chips" id="hChips"></div>
    </header>
    <section id="z-overview" class="on"></section>
    <section id="z-worldbook"></section>
    <section id="z-chronicle"></section>
    <section id="z-journal"></section>
    <section id="z-graph" class="split">
      <div id="cvwrap"><canvas id="cv"></canvas><div id="tip"></div></div>
      <div id="graphSide"></div>
    </section>
    <section id="z-cards"></section>
    <section id="z-artifacts" class="split">
      <div style="flex:1;min-width:0;overflow:auto;padding:16px 0 40px 20px"><div id="artMain"></div></div>
      <div id="artSide"></div>
    </section>
  </main>
</div>
<div id="drawer">
  <div class="hd"><b id="dwTitle"></b><span class="kv" id="dwMeta"></span><span class="x" id="dwClose">✕ 关闭</span></div>
  <div class="bd"><div class="chips" id="dwChips"></div><pre class="md" id="dwBody"></pre></div>
</div>
<script>
"use strict";
const D = __DASHBOARD__;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OV = D.overview || {}, CT = (D.meta || {}).counts || {};
const byPath = new Map((D.cards || []).map(c => [c.path, c]));
const statusCls = s => s === "active" ? "st-active" : s === "draft" ? "st-draft" : s === "retired" ? "st-retired" : "st-other";
const num = n => (n ?? 0).toLocaleString("zh-CN");

// ── 抽屉：卡全文（内嵌数据，不回 call kit） ──
function openCard(path, altTitle) {
  const c = byPath.get(path);
  const body = c ? c.body : (altTitle ? "（该区数据不含此件正文：产物正文走 W4.2 三通道）" : "");
  document.getElementById("dwTitle").textContent = c ? c.title : (path || altTitle || "");
  document.getElementById("dwMeta").textContent = c ? c.path : (path || "");
  document.getElementById("dwChips").innerHTML = c ? [
    `<span class="chip">${esc(c.source)}</span>`, `<span class="chip">${esc(c.domain)} 域</span>`,
    c.track ? `<span class="chip">${esc(c.track)}</span>` : "",
    `<span class="chip">状态 <b class="${statusCls(c.status)}">${esc(c.status)}</b></span>`,
    c.version ? `<span class="chip">v${esc(c.version)}</span>` : "",
    c.updated ? `<span class="chip">${esc(c.updated)}</span>` : "",
    (c.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(""),
    `<span class="chip">${num(c.bytes)} B</span>`,
  ].join("") : "";
  document.getElementById("dwBody").className = "md";
  document.getElementById("dwBody").textContent = body;
  document.getElementById("drawer").classList.add("open");
}
// 大事记钻取：事件卡走同一抽屉，但正文是 5W1H 分栏（不是 md 原文），故换掉 pre 样式。
function openDrawer(title, meta, chips, htmlBody) {
  document.getElementById("dwTitle").textContent = title;
  document.getElementById("dwMeta").textContent = meta;
  document.getElementById("dwChips").innerHTML = chips;
  const bd = document.getElementById("dwBody");
  bd.className = ""; bd.innerHTML = htmlBody;
  document.getElementById("drawer").classList.add("open");
  wireDrawer();
}
document.getElementById("dwClose").addEventListener("click", () => document.getElementById("drawer").classList.remove("open"));
window.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("drawer").classList.remove("open"); });

// ── 左导航 + tab 切换 ──
const ZONES = [
  ["overview", "总览", () => num((D.artifacts || []).length) + " 件"],
  ["worldbook", "世界书", () => num(CT.worldbook_entries)],
  ["chronicle", "大事记", () => num(CT.chronicle_events)],
  ["journal", "执行流水", () => num(CT.journal_events)],
  ["graph", "RAG 图谱", () => num(CT.graph_nodes)],
  ["cards", "知识表格", () => num(CT.cards)],
  ["artifacts", "产物", () => num(CT.artifacts)],
];
const navItems = document.getElementById("navItems");
navItems.innerHTML = ZONES.map(([k, label, cnt]) =>
  `<div class="it" data-k="${k}"><span>${esc(label)}</span><span class="n">${esc(cnt())}</span></div>`).join("");
let graphReady = false;
function show(k) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("on"));
  document.getElementById("z-" + k).classList.add("on");
  navItems.querySelectorAll(".it").forEach(el => el.classList.toggle("on", el.dataset.k === k));
  if (k === "graph") { if (!graphReady) { initGraph(); graphReady = true; } else resizeGraph(); }
}
navItems.addEventListener("click", e => {
  const el = e.target.closest(".it"); if (el) show(el.dataset.k);
});

// ── 头部 ──
document.getElementById("navPid").textContent = D.project || "-";
document.getElementById("hTitle").textContent = D.title || D.project || "项目看板";
document.getElementById("hSub").textContent = "dashboard@1 · " + (D.meta && D.meta.project_dir ? D.meta.project_dir : "");
document.getElementById("hChips").innerHTML = [
  `<span class="chip g">七区一页 · 自包含</span>`,
  `<span class="chip">世界书 ${num(CT.worldbook_entries)}</span>`,
  `<span class="chip">大事记 ${num(CT.chronicle_events)} 事件 / ${num(CT.chronicle_lanes)} 轨</span>`,
  `<span class="chip">执行流水 ${num(CT.journal_events)}</span>`,
  `<span class="chip">图谱 ${num(CT.graph_nodes)} 节点 / ${num(CT.graph_links)} 边</span>`,
  `<span class="chip">知识卡 ${num(CT.cards)}</span>`,
  `<span class="chip">产物 ${num(CT.artifacts)}</span>`,
].join("");
document.getElementById("navFoot").textContent = "零外部资源 · 生成时内联 · 幂等重跑逐字节一致";

// ── ① 总览 ──
function renderOverview() {
  const cfg = OV.config || {}, kb = OV.kb || {}, ar = OV.artifacts || {}, ca = OV.cards || {};
  const stat = (v, k, x) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div>` +
                            (x ? `<div class="x">${esc(x)}</div>` : "") + `</div>`;
  const CHV = OV.chronicle || {};
  const top = [["世界书词条", (OV.worldbook || {}).entries, "边 " + num((OV.worldbook || {}).edges) + " · 孤立 " + num((OV.worldbook || {}).isolated)],
               ["大事记事件", CHV.events, "轨 " + num(CHV.lanes) + " · 段带 " + num(CHV.bands) + " · Δ " + num(CHV.withDrift)],
               ["执行流水", OV.journal && OV.journal.events, (OV.journal || {}).first ? (OV.journal.first + " → " + OV.journal.last) : "无台账"],
               ["RAG 节点", OV.graph && OV.graph.nodes, "边 " + num((OV.graph || {}).links) + " · scope " + ((OV.graph || {}).scope || "-")],

// ── ③ 大事记（叙事 5W1H 多轨时间线 · chronicle@1） ──
// 形态对标视频编辑软件的多轨：横向＝故事时间（段带连续分列），纵向＝人物/势力轨，块＝一条事件。
// 一个事件可同拍落多条轨（同 NLE 跨轨）；全貌 ↔ 钻取：点块开抽屉看单事件 5W1H 与原文，
// 「退出钻取」一键清筛选与聚焦。数据全部生成时内联，不回 call kit。
const CH = D.chronicle || { events: [], bands: [], lanes: [], stats: {}, sources: [], narrative: {} };
// 叙述层（W4.7）：chronicle.py 生成的 STAR 文本，页面只渲染不改写——工具写的字都过了文风闸。
const NAR = CH.narrative || { lead: "", hint: "", gaps: [], beats: [] };
const chState = { order: "story", q: "", band: "", off: new Set(), focus: "" };
const SLOT_W = 62;
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const chShort = e => {
  // 块上只放得下四五个字：优先章号（作者按章定位最快），其次时刻，末了退回事句首段。
  const r = (e.refs || [])[0];
  if (r) return r.from === r.to ? "第" + r.from + "章" : r.from + "-" + r.to + "章";
  if (e.when && e.when.raw) return e.when.raw.slice(0, 6);
  return (String(e.what || "").split(/[，。；：、「」（]/)[0] || e.id).slice(0, 6);
};
const chCardOf = name => ((D.worldbook || {}).entries || []).find(x => x.title === name);
function chLayout() {
  const q = chState.q.trim().toLowerCase();
  const evs = (CH.events || []).filter(e => (!chState.band || e.band === chState.band) &&
    (!q || ((e.what || "") + (e.who || []).join("") + (e.faction || []).join("") +
      (e.where || []).join("") + (e.body || "") + ((e.when || {}).raw || "")).toLowerCase().includes(q)));
  const firstSeq = {};
  evs.forEach(e => { if (firstSeq[e.band] === undefined) firstSeq[e.band] = e.seq; });
  const groups = (CH.bands || []).filter(b => evs.some(e => e.band === b.id));
  const cmpBand = chState.order === "story"
    ? (a, b) => ((a.storySort || [0, 0])[0] - (b.storySort || [0, 0])[0]) ||
        ((firstSeq[a.id] ?? 0) - (firstSeq[b.id] ?? 0)) || String(a.id).localeCompare(String(b.id))
    : (a, b) => ((firstSeq[a.id] ?? 0) - (firstSeq[b.id] ?? 0)) || String(a.id).localeCompare(String(b.id));
  groups.sort(cmpBand);
  const cmpEv = chState.order === "story"
    ? (x, y) => (x.storyKey[0] - y.storyKey[0]) || (x.storyKey[1] - y.storyKey[1]) || (x.seq - y.seq)
    : (x, y) => x.seq - y.seq;
  let cur = 0; const slotOf = new Map();
  groups.forEach(g => {
    g.list = evs.filter(e => e.band === g.id).sort(cmpEv);
    g.start = cur;
    g.list.forEach(e => { slotOf.set(e.id, cur); cur += 1; });
  });
  return { groups, slotOf, total: cur };
}
function renderChronicle() {
  const keep = (() => { const w = document.getElementById("chWrap");
    return w ? [w.scrollLeft, w.scrollTop] : null; })();
  const el = document.getElementById("z-chronicle");
  const st = CH.stats || {}, bands = CH.bands || [], lanes = CH.lanes || [];
  const bar = `<div class="bar">` +
    `<button class="btn${chState.order === "story" ? " on" : ""}" data-order="story">按故事内时序</button>` +
    `<button class="btn${chState.order === "reveal" ? " on" : ""}" data-order="reveal">按揭示顺序</button>` +
    `<select id="chBand"><option value="">全部段带（${bands.length}）</option>` +
      bands.map(b => `<option value="${esc(b.id)}"${b.id === chState.band ? " selected" : ""}>${esc(b.name || b.id)}${b.sub ? " · " + esc(b.sub) : ""}</option>`).join("") + `</select>` +
    `<input type="search" id="chQ" placeholder="搜事件/人物/地点/原文" value="${esc(chState.q)}">` +
    `<span class="chip">事件 ${num((CH.events || []).length)}</span>` +
    `<span class="chip">段带 ${num(bands.length)}</span>` +
    `<span class="chip">轨道 ${num(lanes.length)}（人物 ${num((st.laneKinds || {}).person)}·势力 ${num((st.laneKinds || {}).faction)}）</span>` +
    `<span class="chip">标时刻 ${num(st.withTime)}${st.approxTime ? `（近似 ${num(st.approxTime)}）` : ""}</span>` +
    `<span class="chip">地标 ${num(st.withPlace)}</span>` +
    `<span class="chip${st.withDrift ? " warn" : ""}">Δ 矛盾 ${num(st.withDrift)}</span>` +
    `<span class="chip">未登记 因/如何 ${num((st.events ?? (CH.events || []).length) - (st.withWhy || 0))}/${num((st.events ?? (CH.events || []).length) - (st.withHow || 0))}</span>` +
    (chState.focus ? `<span class="chip g">聚焦轨：${esc(chState.focus)}（点空白处轨名取消）</span>` : "") +
    (chState.band || chState.q || chState.off.size || chState.focus
      ? `<button class="btn" id="chExit">退出钻取 / 清筛选</button>` : "") +
    `</div>`;
  if (!(CH.events || []).length) {
    el.innerHTML = bar + `<div class="chlead">${esc(NAR.lead || "大事记还是空的。")}</div>` +
      (NAR.hint ? `<div class="hintline">${esc(NAR.hint)}</div>` : "") +
      `<div class="empty">写过条目后跑 <span class="mono">python tools/chronicle.py --root projects/${esc(D.project || "<id>")}</span> 落 chronicle@1，` +
      `再重出看板即成多轨时间线。<br><span class="muted">工具只归纳行法可判的字段（何时/何地/何人/章/Δ/〔因：〕〔如何：〕〔何地：〕），绝不代填内容。</span></div>`;
  } else {
    const { groups, slotOf, total } = chLayout();
    const width = Math.max(total, 1) * SLOT_W;
    const flat = groups.reduce((acc, g) => acc.concat(g.list), []);
    const color = {};
    groups.forEach(g => { color[g.id] = PALETTE[Math.max(0, bands.findIndex(b => b.id === g.id)) % PALETTE.length]; });
    const blk = (e, cls) => {
      const s = slotOf.get(e.id); if (s === undefined) return "";
      const dim = chState.focus && !(e.tracks || []).includes(chState.focus);
      return `<div class="blk${cls || ""}${e.drift ? " drift" : ""}${dim ? " dim" : ""}" data-ev="${esc(e.id)}" ` +
        `style="left:${s * SLOT_W + 2}px;width:${SLOT_W - 4}px;background:${color[e.band] || "#8a8375"}" ` +
        `title="${esc(((e.when || {}).raw || "（未标时刻）") + " ｜ " + (e.who || []).join("、") + " ｜ " + (e.what || ""))}">${esc(chShort(e))}</div>`;
    };
    const headRow = `<div class="chrow chhead"><div class="lname">段带 · ${chState.order === "story" ? "故事内时序" : "揭示顺序"}</div>` +
      `<div class="lane" style="width:${width}px">` + groups.map(g =>
        `<div class="bandseg${g.id === chState.band ? " on" : ""}" data-band="${esc(g.id)}" ` +
        `style="position:absolute;left:${g.start * SLOT_W}px;width:${Math.max(g.list.length, 1) * SLOT_W}px">` +
        `${esc(g.name || g.id)} <span class="lay">${esc(g.layer === "prehistory" ? "倒叙层" : "正叙")}${g.chapters ? " 第" + g.chapters.from + (g.chapters.to && g.chapters.to !== g.chapters.from ? "-" + g.chapters.to : "") + "章" : ""}·${g.list.length}事</span></div>`).join("") +
      `</div></div>`;
    const allRow = `<div class="chrow"><div class="lname" data-all="1">编年全览<span class="c">${total}</span></div>` +
      `<div class="lane" style="width:${width}px">` +
      flat.map(e => blk(e, " untracked")).join("") + `</div></div>`;
    const laneRows = lanes.filter(l => !chState.off.has(l.id)).map(l =>
      `<div class="chrow${l.kind === "faction" ? " fac" : ""}" data-lane="${esc(l.id)}">` +
      `<div class="lname" title="${esc(l.arc || ((l.aliases || []).length ? "化名：" + l.aliases.join("、") : l.source || ""))}">${esc(l.name)}` +
      `<span class="lanebtn" data-laneview="${esc(l.id)}">讲</span>` +
      `<span class="c">${l.kind === "faction" ? "势" : ""}${l.events ?? ""}</span></div>` +
      `<div class="lane" style="width:${width}px">` +
      flat.filter(e => (e.tracks || []).includes(l.name))
        .map(e => blk(e, "")).join("") + `</div></div>`).join("");
    const hidden = lanes.filter(l => chState.off.has(l.id));
    const offRow = hidden.length ? `<div class="chrow"><div class="lname">已收起 ${hidden.length} 轨</div>` +
      `<div class="lane" style="width:${Math.min(width, 600)}px">` +
      hidden.map(l => `<span class="tag" data-show="${esc(l.id)}" style="cursor:pointer">${esc(l.name)} ↺</span>`).join("") +

    const untr = flat.filter(e => !(e.tracks || []).length);

    const leadCard = `<div class="chlead">${esc(NAR.lead || "")}</div>` +
      ((NAR.gaps || []).length
        ? `<div class="hintline">缺项账（记账不是闸，打回只来自确定性完整性或作者点名）：` +
          NAR.gaps.map(g => `${esc(g.k)} ${num(g.n)} 件`).join(" · ") + `。` +
          (NAR.hint ? `<br>${esc(NAR.hint)}` : "") + `</div>`
        : "");
    const curBand = bands.find(b => b.id === chState.band);
    const bandCard = curBand && curBand.intro ? `<div class="bandintro">${esc(curBand.intro)}</div>` : "";
    el.innerHTML = bar + leadCard + bandCard +
      `<div id="chWrap">${headRow}${allRow}${laneRows}${offRow}${untrRow}</div>` +
      `<div class="kv" style="margin-top:8px">轨名＝人物卡/势力卡（<span class="mono">${esc((CH.sources || []).map(s => s.file).join(" + ") || "-")}</span> 归纳）；` +

      `Δ 红框＝原文带 Δ 记号（语义随项目走，详情里逐字端出）；「近似」计数＝相对量/钟表折算，只记账不冒充作者断言。</div>`;

  el.querySelectorAll("[data-lane] .lname").forEach(n => n.addEventListener("click", ev => {

  while (i < s.length) {
    if (!keep[i]) { i++; continue; }
    let j = i; while (j < s.length && keep[j]) j++;
    const lines = [];
    let aN = 0, bN = 0;
    const noNL = (t, idx) => (t === "ins" ? !d.bNL && idx === d.B.length - 1 : !d.aNL && idx === d.A.length - 1);
    for (let k = i; k < j; k++) {
      const e = s[k];
      if (e.t === "ctx") { lines.push(" " + d.A[e.a]); aN++; bN++; if (noNL("ctx", e.a) && !d.bNL) lines.push("\\ No newline at end of file"); }
      else if (e.t === "del") { lines.push("-" + d.A[e.a]); aN++; if (noNL("del", e.a)) lines.push("\\ No newline at end of file"); }
      else { lines.push("+" + d.B[e.b]); bN++; if (noNL("ins", e.b)) lines.push("\\ No newline at end of file"); }
    }
    // 零行侧的起始行号按 diff 规矩写「插入点之前那一行的行号」，不加一。
    const a1 = aN === 0 ? s[i].a : s[i].a + 1, b1 = bN === 0 ? s[i].b : s[i].b + 1;
    out.push("@@ -" + a1 + "," + aN + " +" + b1 + "," + bN + " @@");
    for (const l of lines) out.push(l);
    i = j;
  }
  return out.join("\n");
}
// ops 与 diff 同源（同一次行 diff 推出），不许两套各算一份：替换/删除块→old/new；
// 纯插入块 old 为空，batch-edit 不收——明说走直存或手工补锚点，不硬造 op。
function opsFromDiff(d) {
  const ops = [], notes = [];
  if (d.aNL !== d.bNL) {
    notes.push("这次改动动了文件末尾的换行（原文" + (d.aNL ? "有" : "没有") + "、新文" + (d.bNL ? "有" : "没有") +
      "）：batch-edit 是子串替换，表达不了行尾换行的增删，这一处请走通道 A/B 直存。");
  }
  const seen = new Map();
  for (const h of d.hunks) {
    const old = d.A.slice(h.a1, h.a2).join("\n"), nw = d.B.slice(h.b1, h.b2).join("\n");
    if (!old) { notes.push("纯插入块（新文第 " + (h.b1 + 1) + " 行起 " + (h.b2 - h.b1) + " 行）：batch-edit 的 old 不能为空，此块走通道 A/B 直存，或手工补锚点 op。"); continue; }
    if (seen.has(old)) {
      notes.push("第 " + (h.a1 + 1) + " 行起的这块，与第 " + (seen.get(old) + 1) + " 行起那块原文完全相同：batch-edit 是逐条顺序替换，" +
        "第二条会因原文已被改掉而静默落空（它的 count 校验只对原文算）。这种改法请走通道 A/B 直存，或手工把锚点扩到能区分两块。");
    } else seen.set(old, h.a1);
    ops.push({ old, new: nw, count: 1 });
  }
  return { ops, notes };
}
function edShowDiff() {
  const out = document.getElementById("edOut");
  if (edState.text === edState.orig) { out.innerHTML = `<div class="ednote">与盘上内容一致，无 diff。</div>`; return; }
  const d = lineDiff(edState.orig, edState.text);
  const uni = unifiedDiff(edState.path, d);
  const { ops, notes } = opsFromDiff(d);
  const colored = uni.split("\n").map(l => {
    const cls = l.startsWith("@") || l.startsWith("---") || l.startsWith("+++") ? "hud"
      : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "ctx";
    return `<div class="${cls}">${esc(l)}</div>`;
  }).join("");
  out.innerHTML = `<h2>unified diff（${d.hunks.length} 块）</h2><div class="diffbox">${colored}</div>` +
    `<div class="edbar"><button class="btn" id="dfCopy">复制 diff</button>` +
    `<button class="btn" id="dfDl">下载 diff</button>` +
    `<button class="btn" id="opDl">下载 ops.json（${ops.length} 条）</button></div>` +
    (notes.length ? `<div class="ednote">` + notes.map(esc).join("<br>") + `</div>` : "") +
    `<div class="ednote">通道 C 用法：python tools/batch-edit.py --file &lt;项目根&gt;/${esc(edState.path)} --ops ops.json --receipt &lt;收据路径&gt;（先 --dry-run 看校验）。ops 与 diff 同一次行 diff 推出；count 与<b>原文</b>命中数不符＝整批拒绝、零写入；但多条 op 是顺序替换的，若两块原文一模一样，后一条会静默落空——上面有说明就得改走通道 A/B。</div>`;
  document.getElementById("dfCopy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(uni); document.getElementById("dfCopy").textContent = "已复制"; }
    catch (e) { document.getElementById("dfCopy").textContent = "复制失败（浏览器拒）"; }
  });
  document.getElementById("dfDl").addEventListener("click", () => download(edState.path.split("/").pop() + ".diff", uni, "text/x-diff"));
  document.getElementById("opDl").addEventListener("click", () => download(edState.path.split("/").pop() + ".ops.json", JSON.stringify(ops, null, 1)));
}

// ── ⑦ 产物区（只读清单 + 摘要；正文读写走上面三通道） ──
const aState = { q: "", role: "", kind: "", sel: "" };
function renderArtifacts() {
  const list = D.artifacts || [];
  const uniq = k => [...new Set(list.map(a => a[k] ?? "").filter(Boolean))].sort();
  const rows = list.filter(a => (!aState.role || a.role === aState.role) && (!aState.kind || a.kind === aState.kind) &&
    (!aState.q || (a.path + " " + a.kind + " " + (a.summary || "")).toLowerCase().includes(aState.q.toLowerCase())));
  const size = b => b > 1024 * 1024 ? (b / 1048576).toFixed(2) + " MB" : Math.round(b / 1024) + " KB";
  document.getElementById("artMain").innerHTML =
    `<div class="bar"><input type="search" id="aQ" placeholder="搜路径/类型/摘要" value="${esc(aState.q)}">` +
    `<select id="aRole"><option value="">全部归属</option>` + ["human", "generated"].map(v => `<option${v === aState.role ? " selected" : ""}>${esc(v)}</option>`).join("") + `</select>` +
    `<select id="aKind"><option value="">全部 kind</option>` + uniq("kind").map(v => `<option${v === aState.kind ? " selected" : ""}>${esc(v)}</option>`).join("") + `</select>` +
    `<span class="chip">${rows.length} / ${list.length} 件</span>` +
    `<span class="chip">人写 ${num((OV.artifacts || {}).human)} · 生成 ${num((OV.artifacts || {}).generated)}</span>` +
    `<button class="btn" id="fsPick">授权项目目录（本地读写）</button>` +
    `<span class="chip${fsState.warn || !fsState.root ? " warn" : ""}" id="fsStat">${esc(fsState.msg || (fsState.root ? "通道 A 已授权 " + fsState.root.name : (window.showDirectoryPicker ? "通道 A 未授权" : "本浏览器无通道 A（非 Chromium 系）")))}</span>` +
    `<input type="text" id="apiBase" placeholder="通道 B：8431 地址，如 http://127.0.0.1:8431" value="${esc(apiState.base)}">` +
    `<button class="btn" id="apiPing">连通 8431</button>` +
    `<span class="chip${apiState.warn || !apiState.ok ? " warn" : ""}" id="apiStat">${esc(apiState.msg || (apiState.ok === "ok" ? "通道 B 连通" : apiState.ok === "auth" ? "通道 B 要口令" : "通道 B 未连通"))}</span></div>` +
    (rows.length ? `<table><thead><tr><th>路径</th><th>归属</th><th>kind</th><th>字节</th><th>字符</th><th>摘要</th><th>mtime</th></tr></thead><tbody>` +
      rows.map(a => `<tr data-p="${esc(a.path)}" class="${aState.sel === a.path ? "on" : ""}">` +
        `<td class="mono">${esc(a.path)}${a.missing ? ' <span class="warn">盘上无</span>' : ""}</td>` +
        `<td class="role-${esc(a.role)}">${esc(a.role === "human" ? "人写" : a.role === "generated" ? "生成" : a.role)}</td>` +
        `<td>${esc(a.kind)}</td><td class="mono">${esc(size(a.bytes))}</td><td class="mono">${a.mode === "meta-only" ? "—" : num(a.chars)}</td>` +
        `<td class="muted">${esc(a.summary || "")}</td><td class="mono muted">${esc(a.mtime)}</td></tr>`).join("") +
      `</tbody></table>` : `<div class="empty">无产物件——先跑 python tools/project-index.py index --project ${esc(D.project || "")}</div>`);
  const sel = list.find(a => a.path === aState.sel);
  document.getElementById("artSide").innerHTML = sel
    ? `<h2>${esc(sel.path)}</h2><div class="card">` +
      `<div class="kv">归属 ${esc(sel.role === "human" ? "人写" : sel.role === "generated" ? "生成" : sel.role)} · kind ${esc(sel.kind)} · ${esc(size(sel.bytes))}</div>` +
      `<div class="kv">hash ${esc(sel.hash)} · mtime ${esc(sel.mtime)}</div>` +
      (sel.mode === "meta-only" ? `<div class="kv">体积 ${num(sel.chars)} 字节（JSON/台账类：看板不内嵌正文）</div>`
        : sel.chars ? `<div class="kv">正文 ${num(sel.chars)} 字符（看板只内嵌首段摘要）</div>` : "") +
      `</div>` +
      `<h2>摘要</h2><div class="card"><pre class="md">${esc(sel.summary || "（无摘要：非文本件或超出 200 KB 阈值）")}</pre></div>` +
      `<h2>全文读写（W4.2 三通道）</h2><div class="card">` +
      `<div class="edbar"><button class="btn" id="edOpen">打开阅读 / 编辑</button>` +
      `<button class="btn" id="edDl0">下载副本</button></div>` +
      `<div class="ednote" id="edSideMsg">通道 A＝本地授权目录直读直写（Chromium 系）；通道 B＝8431 读 GET 写 PUT（鉴权走口令）；通道 C＝编辑器产 diff/ops → batch-edit.py 应用＋收据。md/txt 可编，doc 类只读；任何写不得越出项目根。</div>` +
      (sel.mode === "readonly" ? `<span class="warn">${esc(sel.note || "二进制文档只读")}</span><br>` : "") +
      (sel.mode === "meta-only" ? `<span class="muted">JSON/台账类：看板只列字节与字符账（首段是花括号，摘要无意义），全文走 W4.2 通道。</span><br>` : "") +
      (sel.missing ? `<span class="warn">索引登记但盘上无此件——跑 python tools/project-index.py index --project ${esc(D.project || "")} 重对账。</span><br>` : "") + `</div>`
    : `<div class="empty">点左侧任一文件看元数据与首段摘要。<br><br>正文读写走 W4.2 三通道：先在上面授权目录（通道 A）或连通 8431（通道 B），再点「打开阅读 / 编辑」。任何写路径不得越出项目根。</div>`;
  document.getElementById("aQ").addEventListener("input", e => { aState.q = e.target.value; renderArtifacts(); });
  document.getElementById("aRole").addEventListener("change", e => { aState.role = e.target.value; renderArtifacts(); });
  document.getElementById("aKind").addEventListener("change", e => { aState.kind = e.target.value; renderArtifacts(); });
  document.getElementById("artMain").querySelectorAll("tbody tr").forEach(tr_ =>
    tr_.addEventListener("click", () => { aState.sel = tr_.dataset.p; renderArtifacts(); }));
  const fp = document.getElementById("fsPick"); if (fp) fp.addEventListener("click", () => fsPick());
  const ap = document.getElementById("apiPing"); if (ap) ap.addEventListener("click", () => apiPing());
  const eo = document.getElementById("edOpen");
  if (eo) eo.addEventListener("click", () => { if (aState.sel) openEditor(aState.sel); });
  const dl0 = document.getElementById("edDl0");
  if (dl0) dl0.addEventListener("click", async () => {
    const msg = document.getElementById("edSideMsg");
    try {
      const t = fsState.root ? await readViaA(aState.sel) : (await readViaB(aState.sel)).text;
      download(aState.sel.split("/").pop(), t);
      if (msg) msg.textContent = "已下载只读副本（未写盘）。";
    } catch (e) { if (msg) msg.textContent = "读不到：" + (e.message || e) + "——先授权目录或连通 8431。"; }
  });
}

// ── 首屏：各区都渲染（数据已内嵌，切换零延迟） ──
renderOverview(); renderWorldbook(); renderChronicle(); renderJournal(); renderCards(); renderArtifacts();
show("overview");
