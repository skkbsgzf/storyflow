<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  /* 项目看板 v4 · 固定模板（看板 v4 工单 V4-1 三段式框架 + V4-3a 世界书 Pinax 移植 + V4-2 插件化工具栏）。
     顶栏（项目名 + 右上角配置）/ 44px 图标栏（入口注册表驱动，用户可勾选开/关）/ 主区 = 总览面板 ∥ 详情面板（右侧滑入）。
     世界书面板 = 分类树（折叠+计数徽标+状态过滤轴）∥ 统一浏览器（搜索/排序/视图切换记忆；三轴单源：
       词条墙按轴筛、图谱按轴隐节点且布局不重排、检索命中在图上描环、图例点击即分类过滤）∥ 词条 wiki 页（详情面板内，
       含 frontmatter 字段表 / 关联词条跳转链 / 历史栈返回 / 正文页内直读）；图谱点节点直达 wiki。
     主区零弹窗（唯一豁免：破坏性确认）；配置 = 右上角二层抽屉；详情弹性收起（保留滚动状态）；
     文档阅读支持 1+1 并行分栏，分栏比与详情宽度 localStorage 记忆。
     零外部资源：系统字体栈、内联样式、SVG 内联图标、数据生成时内联为惰性 JSON，不回 call kit。
     双主题：暗色（规格 §一色板）为默认，浅色「白灰青」为备选；强调色四选；CSS 变量切换。 */
  :root, body[data-theme="dark"] {
    --bg:#16181d; --panel:#1d2027; --panel2:#22262e; --border:#2a2e37;
    --ink:#d8d4cb; --dim:#8a8375;
    --gold:#e8b33d; --blue:#6ea8fe; --green:#5f9c7a; --red:#d98a83; --purple:#8a6fb0;
    --mono:ui-monospace,Consolas,"Courier New",monospace;
    --fs:15px; --lh:1.8;
  }
  body[data-theme="light"] {
    --bg:#edf0f2; --panel:#ffffff; --panel2:#f4f6f7; --border:#d8dce1;
    --ink:#2c3036; --dim:#78808a;
    --gold:#a97b1a; --blue:#3568c9; --green:#35744f; --red:#b3524b; --purple:#6b53a8;
  }
  body[data-accent="gold"]   { --accent:var(--gold); }
  body[data-accent="blue"]   { --accent:var(--blue); }
  body[data-accent="green"]  { --accent:var(--green); }
  body[data-accent="purple"] { --accent:var(--purple); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font:14px/1.65 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
         display:flex; flex-direction:column; }
  button { font-family:inherit; }
  svg.ic { display:block; }
  /* ── 标题栏 ── */
  #topbar { flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 14px;
            background:var(--panel); border-bottom:1px solid var(--border); }
  #topbar .t { font-size:15px; font-weight:600; letter-spacing:1px; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  #topbar .pid { font-family:var(--mono); font-size:11px; color:var(--dim); flex:1;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tbtn { background:var(--panel2); color:var(--dim); border:1px solid var(--border); border-radius:6px;
          padding:5px 11px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .tbtn:hover { color:var(--ink); border-color:var(--accent); }
  #ovTab { display:none; }
  body.ov-folded #ovTab { display:flex; }
  /* ── 图标工具栏（44px） ── */
  #app { flex:1; display:flex; min-height:0; }
  #rail { width:44px; flex:0 0 44px; background:var(--panel); border-right:1px solid var(--border);
          display:flex; flex-direction:column; padding:6px 0; gap:2px; }
  .railbtn { height:40px; border:0; border-left:2px solid transparent; background:none;
             color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .railbtn:hover { color:var(--ink); background:var(--panel2); }
  .railbtn.on { color:var(--ink); border-left-color:var(--accent); background:var(--panel2); }
  /* ── 主区（总览 ∥ doc 分栏 ∥ 详情滑入） ── */
  #stage { flex:1; display:flex; min-width:0; position:relative; overflow:hidden;
           --dw:460px; padding-right:0; transition:padding-right .18s ease; }
  #stage.has-detail { padding-right:var(--dw); }
  #stage.noanim, #stage.noanim #detail { transition:none; }
  #ov { flex:1; min-width:0; overflow:auto; padding:16px 22px 48px;
        font-size:var(--fs); line-height:var(--lh); }
  body.compact #ov { padding:10px 14px 32px; }
  body.ov-folded #ov { display:none; }
  /* ── 文档阅读区（1+1 并行分栏） ── */
  #docs { flex:1; min-width:0; display:none; flex-direction:column; }
  #doccols { flex:1; display:flex; min-height:0; min-width:0; }
  .dcol { display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  #docGutter { flex:0 0 6px; cursor:col-resize; background:var(--border); }
  #docGutter:hover { background:var(--accent); }
  .dpbody { flex:1; overflow:auto; padding:10px 18px 40px; font-size:var(--fs); line-height:var(--lh); }
  body.compact .dpbody { padding:6px 10px 24px; }
  .wrap { max-width:980px; margin:0 auto; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input[type=search], select { background:var(--panel2); color:var(--ink); border:1px solid var(--border);
     border-radius:6px; padding:4px 9px; font:12px/1.5 var(--mono); }
  input[type=search] { min-width:220px; }
  .btn { background:var(--panel2); color:var(--dim); border:1px solid var(--border); border-radius:6px;
         padding:4px 10px; font:12px/1.4 var(--mono); cursor:pointer; }
  .btn:hover { color:var(--ink); }
  .btn.on { color:var(--accent); border-color:var(--accent); }
  .chip { font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--border);
          border-radius:999px; padding:1px 10px; white-space:nowrap; }
  .chip.g { color:var(--accent); border-color:var(--accent); }
  .chip.warn { color:var(--red); border-color:var(--red); }
  .tag { display:inline-block; font-family:var(--mono); font-size:11px; border:1px solid var(--border);
         border-radius:999px; padding:0 8px; margin:1px 3px 1px 0; color:var(--dim); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:12px 14px; margin-bottom:12px; }
  body.compact .card { padding:8px 10px; margin-bottom:8px; }
  .empty { padding:30px 6px; color:var(--dim); font-size:13px; }
  .muted { color:var(--dim); }
  .mono { font-family:var(--mono); }
  .who { color:var(--blue); }
  /* ── 世界书 ── */
  .row { display:flex; align-items:baseline; gap:8px; padding:6px 10px; border-bottom:1px solid var(--border);
         cursor:pointer; flex-wrap:wrap; }
  body.compact .row { padding:3px 10px; }
  .row:hover { background:var(--panel); }
  .row b { font-weight:600; }
  .row .tm { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--dim); }
  .row.on { background:var(--panel2); box-shadow:inset 2px 0 0 var(--accent); }
  .btn[disabled] { opacity:.4; cursor:default; }
  .btn[disabled]:hover { color:var(--dim); }
  /* 世界书三栏（Pinax CategoryTree/UnifiedEntryBrowser 范式） */
  .wb3 { display:flex; gap:14px; align-items:flex-start; min-width:0; }
  .wbtree { flex:0 0 200px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px; }
  .wbtree .tnode { display:flex; align-items:baseline; gap:6px; padding:4px 8px; cursor:pointer;
                   border-radius:6px; color:var(--dim); font-size:12.5px; }
  .wbtree .tnode:hover { background:var(--panel2); color:var(--ink); }
  .wbtree .tnode.on { color:var(--accent); }
  .wbtree .tnode .n { font-family:var(--mono); font-size:11px; margin-left:auto; }
  .wbtree .ar { font-family:var(--mono); font-size:10px; width:12px; flex:0 0 12px; cursor:pointer; }
  .wbtree .sub { padding-left:16px; }
  .wbtree .sub .tnode { font-size:12px; }
  .wbfilter { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; padding-top:8px;
              border-top:1px solid var(--border); }
  .wbfilter .btn { font-size:11px; padding:2px 8px; }
  .wbmain { flex:1; min-width:0; }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  /* 词条 wiki 页（Pinax EntryWiki 范式） */
  .wikibar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:-2px 0 12px; }
  .lk { font-family:var(--mono); font-size:12px; color:var(--blue); background:var(--panel2);
        border:1px solid var(--border); border-radius:999px; padding:1px 10px; margin:1px 4px 1px 0;
        cursor:pointer; }
  .lk:hover { border-color:var(--accent); color:var(--accent); }
  .lk.dead { color:var(--dim); border-style:dashed; cursor:default; }
  .lk.dead:hover { border-color:var(--border); color:var(--dim); }
  .wbd { margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
  #cvwrap { position:relative; height:calc(100vh - 150px); min-height:380px; background:var(--panel);
            border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  #cv { display:block; width:100%; height:100%; cursor:grab; }
  .lg { font-family:var(--mono); font-size:11px; color:var(--ink); border:1px solid var(--border);
        border-radius:999px; padding:1px 9px; margin:2px 3px 2px 0; cursor:pointer; user-select:none;
        display:inline-block; background:var(--panel2); }
  .lg .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .lg.on { border-color:var(--accent); color:var(--accent); }
  .lg.off { opacity:.32; }
  /* ── 人物 ── */
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  body.compact .pgrid { gap:8px; }
  .pcard { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px;
           cursor:pointer; }
  .pcard:hover { border-color:var(--accent); }
  .pcard .nm { font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .pcard .role { color:var(--dim); font-size:12.5px; margin-top:4px; overflow:hidden; display:-webkit-box;
                 -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; }
  .st-active { color:var(--green); } .st-draft { color:var(--gold); }
  .st-retired { color:var(--red); } .st-other { color:var(--dim); }
  /* ── 大纲 ── */
  .tree .frow { display:flex; align-items:baseline; gap:8px; padding:4px 8px; cursor:pointer;
                border-bottom:1px solid var(--border); flex-wrap:wrap; }
  body.compact .tree .frow { padding:2px 8px; }
  .tree .frow:hover { background:var(--panel); }
  .tree .tw { color:var(--dim); font-family:var(--mono); font-size:10px; width:14px; display:inline-block; }
  .tree .tm { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--dim); }
  .tree .spl { visibility:hidden; padding:1px 8px; }
  .tree .frow:hover .spl { visibility:visible; }
  .role-human { color:var(--gold); } .role-generated { color:var(--blue); }
  /* ── 大事记 ── */
  .tl { border-left:2px solid var(--border); margin-left:8px; padding-left:18px; }
  .tlev { position:relative; padding:7px 0 9px; border-bottom:1px solid var(--border); cursor:pointer; }
  body.compact .tlev { padding:4px 0 5px; }
  .tlev:last-child { border-bottom:0; }
  .tlev::before { content:""; position:absolute; left:-23px; top:16px; width:8px; height:8px;
                  border-radius:50%; background:var(--dim); }
  .tlev:hover::before { background:var(--accent); }
  .tlev.drift::before { background:var(--red); }
  .tlev .tm { font-family:var(--mono); font-size:12px; color:var(--gold); margin-right:8px; }
  .tlev.drift .tm { color:var(--red); }
  .tlev .dr { color:var(--red); font-family:var(--mono); font-size:11px; margin-left:8px; }
  .tlev:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px; background:var(--panel); }
  /* 大事记左栏（Pinax CanvasTimeline 范式：轨道筛选轴 + 时间块导航） */
  .chrhd { font-family:var(--mono); font-size:11px; color:var(--dim); margin:10px 0 4px; padding-top:8px; border-top:1px solid var(--border); }
  .chrhd:first-child { margin-top:0; padding-top:0; border-top:0; }
  .wbtree .tnode .dot { flex:0 0 8px; width:8px; height:8px; margin-right:2px; }
  /* 时间块（band）折叠分组 */
  .chrband { margin-bottom:12px; }
  .chrband-hd { display:flex; align-items:baseline; gap:8px; padding:5px 9px; cursor:pointer;
                border-radius:6px; background:var(--panel); border:1px solid var(--border); }
  .chrband-hd:hover { background:var(--panel2); }
  .chrband-hd:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .chrband-hd .ar { font-family:var(--mono); font-size:10px; width:12px; flex:0 0 12px; }
  .chrband-hd b { font-weight:600; color:var(--gold); }
  .chrband-hd .n { font-family:var(--mono); font-size:11px; margin-left:auto; color:var(--dim); }
  .chrband .tl { margin-top:8px; }
  .chrband.folded { margin-bottom:5px; }
  /* ── doc 排版（居中 720px） ── */
  .docbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 18px 0; }
  body.compact .docbar { padding:6px 10px 0; }
  .docbar .path { font-family:var(--mono); font-size:12px; color:var(--dim); overflow-wrap:anywhere; }
  article.doc { max-width:720px; margin:0 auto; padding:6px 2px 60px; }
  article.doc h1, article.doc h2, article.doc h3,
  article.doc h4, article.doc h5, article.doc h6 { line-height:1.4; margin:1.2em 0 .5em; }
  article.doc h1 { font-size:1.5em; } article.doc h2 { font-size:1.3em; }
  article.doc h3 { font-size:1.15em; } article.doc h4, article.doc h5, article.doc h6 { font-size:1em; }
  article.doc p { margin:0 0 12px; }
  article.doc b, article.doc strong { color:var(--gold); font-weight:600; }
  article.doc ul, article.doc ol { margin:0 0 12px; padding-left:1.5em; }
  article.doc li { margin-bottom:4px; }
  article.doc blockquote { margin:0 0 12px; padding:2px 14px; border-left:3px solid var(--border);
                           color:var(--dim); }
  article.doc pre.code { background:var(--panel); border:1px solid var(--border); border-radius:6px;
                         padding:10px 12px; overflow:auto; font:12.5px/1.7 var(--mono); margin:0 0 12px; }
  article.doc code { font-family:var(--mono); font-size:.92em; background:var(--panel2);
                     border:1px solid var(--border); border-radius:4px; padding:0 4px; }
  article.doc pre.code code { background:none; border:0; padding:0; }
  article.doc hr { border:0; border-top:1px solid var(--border); margin:16px 0; }
  article.plain { white-space:pre-wrap; overflow-wrap:anywhere;
                  font:var(--fs)/var(--lh) var(--mono); }
  .docframe { width:100%; height:calc(100vh - 140px); min-height:400px; border:1px solid var(--border);
              border-radius:8px; background:#fff; }
  /* ── 详情面板（右侧滑入，弹性收起保留状态） ── */
  #detail { position:absolute; top:0; right:0; bottom:0; width:var(--dw); background:var(--panel);
            border-left:1px solid var(--border); transform:translateX(calc(var(--dw) + 8px));
            transition:transform .18s ease; display:flex; flex-direction:column; z-index:12; }
  #detail.open { transform:none; }
  #dresizer { position:absolute; top:0; bottom:0; right:var(--dw); width:6px; cursor:col-resize;
              z-index:13; display:none; }
  #dresizer:hover { background:var(--accent); opacity:.5; }
  #stage.has-detail #dresizer { display:block; }
  .vhead { flex:0 0 auto; padding:12px 16px; border-bottom:1px solid var(--border); display:flex;
           align-items:center; gap:10px; }
  .vhead b { font-size:14px; letter-spacing:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vhead .meta { font-family:var(--mono); font-size:11px; color:var(--dim); flex:1; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .vhead .x { margin-left:auto; cursor:pointer; color:var(--dim); background:none; border:0; font-size:14px; flex:0 0 auto; }
  .vhead .x:hover { color:var(--ink); }
  .vhead .back { background:var(--panel2); border:1px solid var(--border); border-radius:6px;
                 color:var(--dim); cursor:pointer; font-size:12px; padding:2px 9px; flex:0 0 auto; }
  .vhead .back:hover { color:var(--ink); border-color:var(--accent); }
  .vbody { flex:1; overflow:auto; padding:14px 16px 40px; font-size:13px; }
  #detail .vbody { font-size:var(--fs); line-height:var(--lh); }
  /* ── 配置二层抽屉（500px 右滑；一层导航 / 二层内容页） ── */
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(500px,92vw); background:var(--panel);
            border-left:1px solid var(--border); transform:translateX(100%); transition:transform .16s ease;
            display:flex; flex-direction:column; z-index:20; }
  #drawer.open { transform:none; }
  #drawer .vhead b { letter-spacing:2px; }
  #drawer .vbody { font-size:13px; padding:4px 16px 40px; }
  #drawer h3 { font-size:12px; letter-spacing:1px; color:var(--accent); margin:14px 0 8px; font-weight:600; }
  #drawer h3:first-child { margin-top:10px; }
  .navrow { display:flex; align-items:center; gap:10px; padding:13px 10px; cursor:pointer;
            border-bottom:1px solid var(--border); font-size:13.5px; }
  .navrow:hover { background:var(--panel2); }
  .navrow .ar { color:var(--dim); font-family:var(--mono); font-size:11px; margin-left:auto; }
  .lrow { display:flex; gap:8px; align-items:baseline; padding:4px 0; border-bottom:1px solid var(--border);
          font-size:12px; flex-wrap:wrap; }
  .lrow .tm { font-family:var(--mono); font-size:11px; color:var(--dim); flex:0 0 118px; }
  .lv-INFO { color:var(--blue); } .lv-WARN { color:var(--gold); } .lv-ERROR { color:var(--red); }
  .lmsg { overflow-wrap:anywhere; flex:1; min-width:160px; }
  .prefrow { display:flex; align-items:center; gap:10px; padding:7px 0; }
  .prefrow label { flex:0 0 64px; color:var(--dim); font-size:12px; }
  .prefrow input[type=range] { flex:1; accent-color:var(--accent); }
  .prefrow .v { font-family:var(--mono); font-size:11px; color:var(--dim); width:44px; text-align:right; }
  .sw { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:6px;
        background:var(--panel2); color:var(--dim); padding:4px 10px; cursor:pointer; font-size:12px; }
  .sw.on { color:var(--accent); border-color:var(--accent); }
  .sw[disabled] { opacity:.45; cursor:default; }
  .sw .dot { background:currentColor; }
  /* ── 确认弹窗（唯一豁免：破坏性确认「恢复快照」） ── */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30;
           align-items:flex-start; justify-content:center; padding:6vh 16px 16px; }
  #modal.open { display:flex; }
  .mbox { background:var(--panel); border:1px solid var(--border); border-radius:10px; width:640px;
          max-width:100%; max-height:84vh; display:flex; flex-direction:column; }
  /* 详情正文通用块 */
  .w5 { display:grid; grid-template-columns:64px 1fr; gap:6px 12px; font-size:13px; }
  .w5 .k5 { font-family:var(--mono); font-size:11px; color:var(--accent); padding-top:2px; }
  .w5 .v5 { overflow-wrap:anywhere; }
  .w5 .none { color:var(--dim); font-style:italic; }
  pre.view { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.75 var(--mono); }
  .diffbox { max-height:44vh; overflow:auto; background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:11.5px; line-height:1.8; }
  .diffbox .add { color:var(--green); } .diffbox .del { color:var(--red); } .diffbox .hud { color:var(--accent); }
  .diffbox .ctx { color:var(--dim); }
  .note { font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.8; margin:8px 0; }
  /* ── 编辑器（V4-4 编辑回归：textarea 全屏替换渲染区，等宽字体） ── */
  .edbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .edta { display:block; width:100%; height:calc(100vh - 300px); min-height:260px;
          background:var(--panel2); color:var(--ink); border:1px solid var(--border);
          border-radius:6px; padding:10px 12px; font:12.5px/1.7 var(--mono);
          resize:none; outline:none; tab-size:2; }
  .edta:focus { border-color:var(--accent); }
  @media (max-width:640px) { #ov { padding:10px 10px 32px; } .pgrid { grid-template-columns:1fr 1fr; }
    .wb3 { flex-direction:column; } .wbtree { flex:none; align-self:stretch; }
    #doccols { flex-direction:column; } #docGutter { flex:0 0 6px; cursor:row-resize; } }
</style>
</head>
<body data-theme="dark" data-accent="gold">
<header id="topbar">
  <span class="t" id="tbTitle"></span>
  <span class="pid" id="tbPid"></span>
  <button class="tbtn" id="ovTab" title="展开总览">总览</button>
  <button class="tbtn" id="tbConfig"></button>
</header>
<div id="app">
  <nav id="rail"></nav>
  <div id="stage">
    <section id="ov"></section>
    <section id="docs"></section>
    <div id="dresizer" title="拖动调整详情宽度"></div>
    <aside id="detail" aria-hidden="true">
      <div class="vhead"><b id="dtTitle"></b><span class="meta" id="dtMeta"></span><button class="x" id="dtClose" title="关闭">✕</button></div>
      <div class="vbody" id="dtBody"></div>
    </aside>
  </div>
</div>
<aside id="drawer" aria-hidden="true">
  <div class="vhead"><button class="back" id="dwBack" title="返回导航">← 返回</button><b id="dwTitle">配置</b><button class="x" id="dwClose" title="关闭">✕</button></div>
  <div class="vbody" id="dwBody"></div>
</aside>
<div id="modal">
  <div class="mbox">
    <div class="vhead"><b id="mTitle"></b><span class="meta" id="mMeta"></span><button class="x" id="mClose" title="关闭">✕</button></div>
    <div class="vbody" id="mBody"></div>
  </div>
</div>
<script>
"use strict";
const D = __DASHBOARD__;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WB = { entries: (D.worldbook || {}).entries || [], relations: (D.worldbook || {}).relations || [] };
const CH = { events: (D.chronicle || {}).events || [], lanes: (D.chronicle || {}).lanes || [], bands: (D.chronicle || {}).bands || [] };
const ARTS = D.artifacts || [];
const CFG = { models: (D.config || {}).models || [], logs: (D.config || {}).logs || [],
              snapshots: (D.config || {}).snapshots || [],
              // V4-4 本地历史统计视图（只读：{file,versions,lastTs}；patch 正文永不入 payload）
              localHistory: Array.isArray((D.config || {}).localHistory) ? D.config.localHistory : [] };
const PALETTE = ["#e8b33d","#6ea8fe","#5f9c7a","#d98a83","#8a6fb0","#c9a227","#4fb3c9","#b0765a",
                 "#7f9e4a","#c97ba3","#88b0d8","#a3907c","#6fc0a8","#d089c0","#9aa7e0","#c0b28a"];

// ── 状态（v3 §五 + v4 布局记忆键） ──
const PREF_KEY = "dashv3.prefs";
const DETW_KEY = "dashv4.detailW";
const SPLIT_KEY = "dashv4.docSplit";
const state = {
  activePanel: "",   // "" = 空白
  ovPanel: "",       // 总览区当前承载的浏览面板（doc 模式下不清）
  docPath: "",       // 兼容位：等同 docState.a
  config: { fontSize: 15, lineHeight: 1.8, themeColor: "gold", compact: false, theme: "dark", plugins: {},
            // V4-4 偏好：本地历史开关（默认开）+ 定期保存字数间隔 intervalWords（200–2000，默认 500）
            localHistory: true, histInterval: 500 },
};
try {
  const saved = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
  Object.assign(state.config, saved);
} catch (e) { /* 坏档按缺省 */ }
if (!state.config.plugins || typeof state.config.plugins !== "object") state.config.plugins = {};
if (typeof state.config.localHistory !== "boolean") state.config.localHistory = true;
state.config.histInterval = Math.min(2000, Math.max(200, Math.round(+state.config.histInterval || 500)));
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(state.config)); } catch (e) {} }
function applyPrefs() {
  document.body.dataset.theme = state.config.theme === "light" ? "light" : "dark";
  document.body.dataset.accent = state.config.themeColor;
  document.body.classList.toggle("compact", !!state.config.compact);
  const r = document.documentElement.style;
  r.setProperty("--fs", state.config.fontSize + "px");
  r.setProperty("--lh", String(state.config.lineHeight));
}

// ── DOM 锚点 ──
const stage = document.getElementById("stage");
const ovEl = document.getElementById("ov");
const docsEl = document.getElementById("docs");

// ── SVG 图标（内联线性，零外部依赖） ──
const ICONS = {
  worldbook: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/><path d="M7.5 3.5v13"/><path d="M10.5 7.5h3.5M10.5 10h3.5"/></svg>',
  people: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="8" r="2.4"/><path d="M5.6 14.8c.9-2.3 2.5-3.3 4.4-3.3s3.5 1 4.4 3.3"/></svg>',
  outline: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 5.5h12M4 10h12M4 14.5h7"/></svg>',
  chronicle: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v8M6 10h8"/></svg>',
  doc: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3l7 7-7 7-7-7z"/><path d="M10 7.2l2.8 2.8-2.8 2.8L7.2 10z"/></svg>',
  config: '<svg class="ic" width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3"/><circle cx="10" cy="10" r="6.5" stroke-dasharray="3.4 2.2"/></svg>',
};
// ── 入口注册表（V4-2 插件化工具栏；id 与 dashboard.py ENTRY_REGISTRY 一一对齐）──
// 两层配置：① 服务端默认 = D.config.entryDefaults（loadedModules 映射，dashboard.py 据此已跳过采集）；
// ② 客户端个人开关 = localStorage（state.config.plugins，覆盖默认，只藏入口、payload 不变）。
// 优先级：localStorage 覆盖 > 服务端默认 > 注册表 defaultOn。「配置」入口永驻不可关（永驻位 = 顶栏右上角）。
// V4-4 编辑按钮不占注册表位（与 py 表 id 严格一一对齐）：出现与否 = docs 入口开 × 本地历史/写权限，见文档面板。
const ENTRIES = [
  { id: "worldbook", icon: "worldbook", title: "世界书", dataSourceKey: "worldbook", defaultOn: true },
  { id: "people",    icon: "people",    title: "人物",   dataSourceKey: "worldbook", defaultOn: true },
  { id: "outline",   icon: "outline",   title: "大纲",   dataSourceKey: "artifacts", defaultOn: true },
  { id: "chronicle", icon: "chronicle", title: "大事记", dataSourceKey: "chronicle", defaultOn: true },
  { id: "docs",      icon: "doc",       title: "文档",   dataSourceKey: "artifacts", defaultOn: true },
  { id: "edit",      icon: "doc",       title: "编辑",   dataSourceKey: "artifacts", defaultOn: true, hostOnly: true },
  { id: "config",    icon: "config",    title: "配置",   dataSourceKey: "config",    defaultOn: true },
];
const ENTRY_DEFAULTS = Array.isArray((D.config || {}).entryDefaults) ? D.config.entryDefaults : null;
function entryDefault(id) {
  if (id === "config") return true;
  const e = ENTRIES.find(x => x.id === id);
  if (!e) return false;
  return ENTRY_DEFAULTS ? ENTRY_DEFAULTS.includes(id) : !!e.defaultOn;
}
function entryOn(id) {
  if (id === "config") return true;
  const p = state.config.plugins;
  if (p && typeof p[id] === "boolean") return p[id];
  return entryDefault(id);
}

// ── 详情面板（右侧滑入；弹性收起 = 收起不销毁，重开同一详情恢复滚动） ──
const detailEl = document.getElementById("detail");
const dtTitle = document.getElementById("dtTitle");
const dtMeta = document.getElementById("dtMeta");
const dtBody = document.getElementById("dtBody");
const dt = { key: "", scroll: 0, open: false };
let detailW = 460;
function clampDetailW(w) { return Math.max(280, Math.min(w, Math.max(320, window.innerWidth - 300))); }
function setDetailW(w) { detailW = clampDetailW(Math.round(w)); stage.style.setProperty("--dw", detailW + "px"); }
try { const w0 = +localStorage.getItem(DETW_KEY); if (w0 >= 280) setDetailW(w0); } catch (e) {}
setDetailW(detailW);
function openDetail(key, title, meta, htmlBody, wire) {
  if (dt.key !== key) {
    dtBody.innerHTML = htmlBody;
    dt.key = key; dt.scroll = 0; dtBody.scrollTop = 0;
    if (wire) wire();
  }
  dtTitle.textContent = title;
  dtMeta.textContent = meta || "";
  stage.classList.add("has-detail");
  detailEl.classList.add("open");
  detailEl.setAttribute("aria-hidden", "false");
  dt.open = true;
  dtBody.scrollTop = dt.scroll;
}
function closeDetail() {
  if (!dt.open) return;
  dt.scroll = dtBody.scrollTop;        // 弹性收起：保留状态与滚动位置
  dt.open = false;
  stage.classList.remove("has-detail");
  detailEl.classList.remove("open");
  detailEl.setAttribute("aria-hidden", "true");
}
document.getElementById("dtClose").addEventListener("click", closeDetail);
(function wireDetailResizer() {
  const h = document.getElementById("dresizer");
  h.addEventListener("mousedown", e => {
    e.preventDefault();
    stage.classList.add("noanim");
    const move = ev => {
      const r = stage.getBoundingClientRect();
      setDetailW(r.right - ev.clientX - 2);
    };
    const up = () => {
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      stage.classList.remove("noanim");
      try { localStorage.setItem(DETW_KEY, String(detailW)); } catch (err) {}
    };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  });
})();

// ── 图标栏 + 面板切换（点击开 / 再点关 / ESC 关；docs 与浏览面板两翼并行） ──
// 渲染循环 = 注册表驱动：只画开启的入口（config 永驻位另在顶栏，不上栏）；入口关 → 图标消失、面板不可达。
const rail = document.getElementById("rail");
function renderRail() {
  rail.innerHTML = ENTRIES.filter(e => e.id !== "config" && entryOn(e.id)).map(e =>
    `<button class="railbtn" data-k="${e.id}" title="${e.title}">${ICONS[e.icon]}</button>`).join("");
}
renderRail();
rail.addEventListener("click", e => {
  const b = e.target.closest(".railbtn"); if (!b) return;
  show(b.dataset.k === state.activePanel ? "" : b.dataset.k);
});
function usableBrowsePanel() {
  // 兜底选位：当前总览面板 → 注册表序第一个开启的浏览面板 → 无（空白）
  const browse = ENTRIES.filter(e => e.id !== "config" && e.id !== "docs");
  if (state.ovPanel && entryOn(state.ovPanel)) return state.ovPanel;
  const alt = browse.find(e => entryOn(e.id));
  return alt ? alt.id : "";
}
function show(k) {
  if (k && !entryOn(k)) return;           // 入口被关 = 对应面板不可达（含经跳转链/分栏按钮的间接入口）
  stopGraph();
  state.activePanel = k;
  rail.querySelectorAll(".railbtn").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  if (k === "docs") {                     // 文档阅读区展开，总览区保留上一浏览面板
    docsEl.style.display = "flex";
    if (!state.ovPanel && !ovEl.innerHTML) {
      ovEl.innerHTML = `<div class="wrap"><div class="empty">从左侧图标栏选择浏览面板（世界书 / 人物 / 大纲 / 大事记）。</div></div>`;
    }
    renderDoc();
    return;
  }
  docsEl.style.display = "none";           // 切浏览 = 收起 doc 区，总览区清空重渲染（规格 §二）
  state.ovPanel = k;
  ovEl.innerHTML = "";
  if (k === "worldbook") renderWorldbook();
  else if (k === "people") renderPeople();
  else if (k === "outline") renderOutline();
  else if (k === "chronicle") renderChronicle();
  ovEl.scrollTop = 0;
}
document.getElementById("tbConfig").innerHTML = ICONS.config + "<span>配置</span>";
document.getElementById("tbConfig").addEventListener("click", () => openDrawer());
document.getElementById("tbTitle").textContent = D.title || D.project || "项目看板";
document.getElementById("tbPid").textContent = D.project || "";
document.getElementById("ovTab").addEventListener("click", () => {
  document.body.classList.remove("ov-folded");
  show(usableBrowsePanel());
});

// ── 确认弹窗（主区零弹窗的唯一豁免：破坏性确认「恢复快照」） ──
const modal = document.getElementById("modal");
function openConfirm(title, meta, htmlBody) {
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mMeta").textContent = meta || "";
  document.getElementById("mBody").innerHTML = htmlBody;
  modal.classList.add("open");
}
function closeConfirm() { modal.classList.remove("open"); }
document.getElementById("mClose").addEventListener("click", closeConfirm);
modal.addEventListener("click", e => { if (e.target === modal) closeConfirm(); });
function copyText(t, btn, done) {
  const fin = ok => { if (btn) btn.textContent = ok ? (done || "已复制") : "复制失败"; if (btn) setTimeout(() => { btn.textContent = "复制"; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(() => fin(true), () => fin(false));
  else {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); fin(ok);
  }
}

// ── ESC 逐层退：确认弹窗 → 抽屉二层→一层→关 → 详情面板 → 编辑器（V4-4，脏时先问） → 面板 ──
window.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (modal.classList.contains("open")) { closeConfirm(); return; }
  const dw = document.getElementById("drawer");
  if (dw.classList.contains("open")) {
    if (dwPage) { dwGo(""); }
    else { closeDrawer(); }
    return;
  }
  if (dt.open) { closeDetail(); return; }
  const esuf = editingSuf();
  if (esuf) { requestCancelEditor(esuf); return; }
  if (state.activePanel) show("");
});

// ── 总览折叠（给 doc 分栏让位） ──
function foldOverview() { document.body.classList.add("ov-folded"); }
function unfoldOverview() {
  document.body.classList.remove("ov-folded");
  if (!state.ovPanel || !entryOn(state.ovPanel)) show(usableBrowsePanel());
}

// ── 世界书面板（总览区；Pinax 范式移植：CategoryTree 左栏折叠计数 / UnifiedEntryBrowser 筛选排序视图切换 / EntryWiki 词条页＋跳转链） ──
const wbCats = [...new Set(WB.entries.map(e => e.cat || "总览"))].sort((a, b) => a.localeCompare(b, "zh"));
const wbColor = {}; wbCats.forEach((c, i) => wbColor[c] = PALETTE[i % PALETTE.length]);
const WBV_KEY = "dashv4.wbView";
const wbState = { q: "", cat: "", status: "", sort: "title", mode: "list", sel: -1, collapsed: new Set(), hist: [], hi: -1 };
const WB_STATUS_OPTS = [["", "全部状态"], ["draft", "草稿"], ["active", "激活"], ["retired", "退役"]];
try {
  const v0 = JSON.parse(localStorage.getItem(WBV_KEY) || "{}");
  if (v0.mode === "list" || v0.mode === "graph" || v0.mode === "wiki") wbState.mode = v0.mode;
  if (v0.sort === "mtime" || v0.sort === "title") wbState.sort = v0.sort;
  if (typeof v0.cat === "string" && (v0.cat === "" || wbCats.includes(v0.cat))) wbState.cat = v0.cat;
  if (WB_STATUS_OPTS.some(([v]) => v === v0.status)) wbState.status = v0.status;
} catch (e) { /* 坏档按缺省 */ }
function saveWbView() {
  try { localStorage.setItem(WBV_KEY, JSON.stringify({ mode: wbState.mode, sort: wbState.sort, cat: wbState.cat, status: wbState.status })); } catch (e) {}
}
// 词条寻址表：id 与标题皆可命中（与 worldbook_index 关系归纳层的 by_id 语义一致）
const wbIdx = new Map();
WB.entries.forEach((e, i) => {
  if (e.id && !wbIdx.has(e.id)) wbIdx.set(e.id, i);
  if (e.title && !wbIdx.has(e.title)) wbIdx.set(e.title, i);
});
const wbCatCount = {};
WB.entries.forEach(e => { const c = e.cat || "总览"; wbCatCount[c] = (wbCatCount[c] || 0) + 1; });
const wbName = e => String(e.title || e.id || "");
// 三轴单源（Pinax UnifiedEntryBrowser 范式）：cat+status 轴同时驱动词条墙与图谱；q 在墙=过滤、在图=描环
function wbAxisMatch(e) {
  return (!wbState.cat || (e.cat || "总览") === wbState.cat) &&
         (!wbState.status || (e.status || "active") === wbState.status);
}
function wbMatchQ(e) {
  const q = wbState.q.trim().toLowerCase();
  return !q || ((e.title || "") + (e.summary || "") + (e.tags || []).join(" ")).toLowerCase().includes(q);
}
function wbSortedIdx(catFilter) {
  const out = WB.entries.map((e, i) => i).filter(i => !catFilter || (WB.entries[i].cat || "总览") === catFilter);
  out.sort((a, b) => wbState.sort === "mtime"
    ? (String(WB.entries[b].mtime || "").localeCompare(String(WB.entries[a].mtime || "")) || a - b)
    : wbName(WB.entries[a]).localeCompare(wbName(WB.entries[b]), "zh"));
  return out;
}
function wbFiltered() {
  return wbSortedIdx(wbState.cat).filter(i => wbAxisMatch(WB.entries[i]) && wbMatchQ(WB.entries[i]));
}
function wbUpdateCount(shown) {
  const el = document.getElementById("wbCount");
  if (el) el.textContent = shown === WB.entries.length ? `词条 ${shown}` : `显示 ${shown} / ${WB.entries.length}`;
}
function renderWorldbook() {
  if (!WB.entries.length) {
    stopGraph(); graphCtl = null;
    ovEl.innerHTML = `<div class="wrap"><div class="bar"><span class="chip">词条 0</span><span class="chip">关系 ${WB.relations.length}</span></div>` +
      `<div class="empty">世界书无词条卡片——python tools/worldbook.py init ${esc(D.project || "")} 建骨架，写卡后重跑出板。</div></div>`;
    return;
  }
  const bar = `<div class="bar">` +
    `<input type="search" id="wbQ" placeholder="搜标题/摘要/标签" value="${esc(wbState.q)}">` +
    `<button class="btn" id="wbSortT" title="点击切换排序">排序：${wbState.sort === "mtime" ? "更新时间" : "字母序"}</button>` +
    `<span role="tablist" aria-label="视图切换">` + [["list", "列表"], ["graph", "图谱"], ["wiki", "wiki"]].map(([m, lab]) =>
      `<button class="btn${wbState.mode === m ? " on" : ""}" role="tab" aria-selected="${wbState.mode === m}" data-m="${m}">${lab}</button>`).join("") + `</span>` +
    `<span class="chip" id="wbCount"></span><span class="chip">关系 ${WB.relations.length}</span>` +
    `<span id="wbCatInfo"></span></div>`;
  ovEl.innerHTML = `<div class="wrap">${bar}<div class="wb3"><div class="wbtree" id="wbTree"></div><div class="wbmain" id="wbMain"></div></div></div>`;
  const q = document.getElementById("wbQ");
  q.addEventListener("input", () => {
    wbState.q = q.value;
    if (graphCtl) graphCtl.set(); else renderWbMain();
  });
  document.getElementById("wbSortT").addEventListener("click", () => {
    wbState.sort = wbState.sort === "title" ? "mtime" : "title";
    saveWbView();
    document.getElementById("wbSortT").textContent = "排序：" + (wbState.sort === "mtime" ? "更新时间" : "字母序");
    if (!graphCtl) { renderWbSidebar(); renderWbMain(); }
    else renderWbSidebar();
  });
  ovEl.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
    const m = b.dataset.m;
    if (m === "wiki") {
      const t = wbState.sel >= 0 ? wbState.sel : wbFiltered()[0];
      if (t !== undefined) wbShowWiki(t);
      return;
    }
    wbState.mode = m; saveWbView(); renderWorldbook();
  }));
  renderWbSidebar();
  wbPaintCat();
  if (wbState.mode === "graph") { renderWbGraph(); return; }
  graphCtl = null;
  renderWbMain();                        // mode==="wiki" 时 renderWbMain 内部恢复详情
}
// 左栏持久存在（图谱视图也不例外，Pinax ueb-side 范式）：分类树 + 状态过滤轴
function wbSidebarHtml() {
  const tree = [`<div class="tnode${wbState.cat === "" ? " on" : ""}" data-cat=""><span class="ar">•</span>全部词条<span class="n">${WB.entries.length}</span></div>`];
  for (const cat of wbCats) {
    const foldKey = "t:" + cat;
    const collapsed = wbState.collapsed.has(foldKey);
    tree.push(`<div class="tnode${cat === wbState.cat ? " on" : ""}" data-cat="${esc(cat)}">` +
      `<span class="ar" data-fold="${esc(foldKey)}">${collapsed ? "▶" : "▼"}</span>${esc(cat)}` +
      `<span class="n">${wbCatCount[cat]}</span></div>`);
    if (!collapsed) {
      tree.push(`<div class="sub">` + wbSortedIdx(cat).map(i =>
        `<div class="tnode" data-go="${i}"><span class="ar">·</span>${esc(wbName(WB.entries[i]))}</div>`).join("") + `</div>`);
    }
  }
  const st = `<div class="wbfilter" role="group" aria-label="状态过滤">` + WB_STATUS_OPTS.map(([v, l]) =>
    `<button class="btn${wbState.status === v ? " on" : ""}" data-st="${v}">${l}</button>`).join("") + `</div>`;
  return tree.join("") + st;
}
function renderWbSidebar() {
  const el = document.getElementById("wbTree");
  if (!el) return;
  el.innerHTML = wbSidebarHtml();
  el.querySelectorAll("[data-fold]").forEach(a => a.addEventListener("click", ev => {
    ev.stopPropagation();
    const k = a.dataset.fold;
    wbState.collapsed.has(k) ? wbState.collapsed.delete(k) : wbState.collapsed.add(k);
    renderWbSidebar();
  }));
  el.querySelectorAll(".tnode[data-cat]").forEach(t => t.addEventListener("click", () => wbSetCat(t.dataset.cat)));
  el.querySelectorAll(".tnode[data-go]").forEach(t => t.addEventListener("click", () => wbShowWiki(+t.dataset.go)));
  el.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => {
    wbState.status = b.dataset.st; saveWbView();
    renderWbSidebar();
    if (graphCtl) graphCtl.set(); else renderWbMain();
  }));
}
function wbSetCat(c) {

function wbOpenDetail(i) {
  const e = WB.entries[i]; if (!e) return;
  openDetail("wbwiki:" + (e.id || e.path || i), wbName(e),
    `${e.cat || "总览"} · ${e.path || ""}`, wbWikiHtml(i), () => wireWiki(i));
}
function wbShowWiki(i) {
  if (!WB.entries[i]) return;
  if (wbState.hist[wbState.hi] !== i) {          // 跳转链历史栈：截断前向分支再入栈
    wbState.hist = wbState.hist.slice(0, wbState.hi + 1);
    wbState.hist.push(i);
    wbState.hi = wbState.hist.length - 1;
  }
  wbState.sel = i;
  wbState.mode = "wiki";

}
function wbHistGo(d) {
  const t = wbState.hi + d;
  if (t < 0 || t >= wbState.hist.length) return;
  wbState.hi = t;
  wbState.sel = wbState.hist[t];
  wbOpenDetail(wbState.sel);
  if (wbState.mode !== "graph") renderWbMain();   // 同步中栏选中行高亮

function wireWiki(i) {

  const hf = document.getElementById("wbHf"); if (hf) hf.addEventListener("click", () => wbHistGo(1));

function wbLoadBody(i) {
  const e = WB.entries[i];
  const box = document.getElementById("wbDoc");
  const stat = document.getElementById("wbDocStat");
  if (!box) return;
  if (!e.path) { box.innerHTML = `<div class="empty">词条无源文件路径</div>`; return; }
  if (!fsRoot) {
    box.innerHTML = `<div class="empty">正文不内嵌于看板数据（出板规格）——授权项目目录（读写）后页内直读；编辑与本地历史在「文档」面板。<br><br>` +
      `<button class="btn" id="wbAuth">授权项目目录</button></div>`;
    const a = document.getElementById("wbAuth");
    if (a) a.addEventListener("click", () => fsPick(() => wbLoadBody(wbState.sel >= 0 ? wbState.sel : i)));
    return;
  }
  box.innerHTML = `<div class="empty">读取中…</div>`;
  fsRead(e.path)
    .then(f => { if (stat) stat.textContent = `${f.size} 字节`; return f.slice(0, 200 * 1024).text(); })
    .then(t => {
      if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
      const bare = t.replace(/^---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*\r?\n?/, "");
      box.innerHTML = `<article class="doc">${mdRender(bare)}</article>`;
    })
    .catch(err => {
      if (stat) stat.textContent = "";
      box.innerHTML = `<div class="empty">读取失败：${esc(err.message || err)}<br>路径 ${esc(e.path)}（须授权该词条所属项目目录）</div>`;
    });
}
// 力导向图（Canvas）：节点按分类着色；拖节点 / 滚轮缩放 / 拖画布平移；点节点打开 wiki 词条页。
// Pinax GraphCanvas 范式：过滤轴与词条墙同源——按轴隐藏节点但布局不重排（原位收窄）；检索命中集合描环。
let graphRAF = 0, graphTeardown = null, graphCtl = null;
function stopGraph() {
  if (graphRAF) { cancelAnimationFrame(graphRAF); graphRAF = 0; }
  if (graphTeardown) { graphTeardown(); graphTeardown = null; }   // 摘除上一幅图的 window 级拖拽监听
}
function renderWbGraph() {
  stopGraph();
  const main = document.getElementById("wbMain");
  main.innerHTML = `<div id="cvwrap"><canvas id="cv"></canvas></div>` +
    (wbCats.length ? `<div id="wbLeg" style="margin-top:8px">` + wbCats.map(c =>
      `<span class="lg" data-cat="${esc(c)}"><span class="dot" style="background:${wbColor[c]}"></span>${esc(c)}</span>`).join("") +
      `</div><div class="note">图例点击=分类过滤；拖节点 / 空白平移 / 滚轮缩放；点节点打开 wiki 词条页。</div>` : "");
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let vis = null, hi = null;   // vis=null=全量；hi=检索命中集合（描环）
  function paintLeg() {
    document.querySelectorAll("#wbLeg .lg").forEach(el => {
      el.classList.toggle("on", el.dataset.cat === wbState.cat);
      el.classList.toggle("off", !!wbState.cat && el.dataset.cat !== wbState.cat);
    });
  }
  function applyFilter() {
    vis = (wbState.cat || wbState.status)
      ? new Set(WB.entries.map((e, i) => i).filter(i => wbAxisMatch(WB.entries[i])))
      : null;
    hi = wbState.q.trim()
      ? new Set(WB.entries.map((e, i) => i).filter(i => wbAxisMatch(WB.entries[i]) && wbMatchQ(WB.entries[i])))
      : null;
    wbUpdateCount(vis ? vis.size : WB.entries.length);
    paintLeg();
  }
  graphCtl = { set: applyFilter };
  applyFilter();
  if (main) main.querySelectorAll("#wbLeg .lg").forEach(el => el.addEventListener("click", () => {
    wbSetCat(el.dataset.cat === wbState.cat ? "" : el.dataset.cat);
  }));
  let W = 0, H = 0, DPR = 1;
  const view = { tx: 0, ty: 0, scale: 1 };
  const nodes = WB.entries.map((e, i) => ({ i, id: e.id, title: e.title || e.id, cat: e.cat || "总览", r: 6 }));
  const idx = new Map(nodes.map(n => [n.id, n.i]));
  const links = WB.relations.map(l => [idx.get(l.a), idx.get(l.b)])
    .filter(([a, b]) => a !== undefined && b !== undefined && a !== b);
  const deg = {}; links.forEach(([a, b]) => { deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; });
  nodes.forEach(n => n.r = Math.min(4 + Math.sqrt(deg[n.i] || 0) * 2, 14));
  function resize() {
    DPR = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  resize();
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  nodes.forEach((n, i) => { const t = i + 0.5, rad = 16 * Math.sqrt(t);
    n.x = W / 2 + rad * Math.cos(t * GOLDEN); n.y = H / 2 + rad * Math.sin(t * GOLDEN); n.vx = 0; n.vy = 0; });
  const REPULSE = 3000, SPRING = 0.02, REST = 46, CENTER = 0.02, DAMP = 86 / 100, MIN_A = 0.02;
  let alpha = 1;
  function step() {
    for (let i = 0; i < nodes.length; i++) { const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) { const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = Math.random(); dy = Math.random(); }
        const f = REPULSE / d2, d = Math.sqrt(d2), fx = dx / d * f, fy = dy / d * f;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy; } }
    for (const [a, b] of links) { const A = nodes[a], B = nodes[b];
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - REST) * SPRING;
      const fx = dx / d * f, fy = dy / d * f; A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy; }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * CENTER; n.vy += (H / 2 - n.y) * CENTER;
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= DAMP; n.vy *= DAMP;
      n.x += Math.max(-30, Math.min(30, n.vx)) * alpha; n.y += Math.max(-30, Math.min(30, n.vy)) * alpha; }

    ctx.setTransform(DPR * view.scale, 0, 0, DPR * view.scale, DPR * view.tx, DPR * view.ty);
    ctx.lineWidth = 1 / view.scale;
    ctx.strokeStyle = "rgba(138,131,117,0.22)";

      if (vis && (!vis.has(a) || !vis.has(b))) continue;
      ctx.beginPath(); ctx.moveTo(nodes[a].x, nodes[a].y); ctx.lineTo(nodes[b].x, nodes[b].y); ctx.stroke(); }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const accent = getComputedStyle(document.body).getPropertyValue("--accent") || "#e8b33d";
    for (const n of nodes) {
      if (vis && !vis.has(n.i)) continue;
      ctx.fillStyle = wbColor[n.cat] || "#8a8375";
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
      if (hi && hi.has(n.i)) {
        ctx.strokeStyle = accent; ctx.lineWidth = 2 / view.scale;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3 / view.scale, 0, 6.2832); ctx.stroke();
        ctx.lineWidth = 1 / view.scale;
      }
      ctx.font = `${11 / view.scale}px "Noto Sans SC",system-ui,sans-serif`;
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--ink") || "#d8d4cb";
      ctx.fillText(n.title, n.x, n.y + n.r + 2 / view.scale);
    }
  }
  function loop() { if (alpha > MIN_A) step(); draw(); graphRAF = requestAnimationFrame(loop); }
  loop();
  let dragNode = null, panning = false, moved = 0, px = 0, py = 0;
  const toWorld = (mx, my) => ({ x: (mx - view.tx) / view.scale, y: (my - view.ty) / view.scale });
  const pick = (mx, my) => { const p = toWorld(mx, my); let best = null, bd = 1e9;
    for (const n of nodes) { if (vis && !vis.has(n.i)) continue;
      const dx = n.x - p.x, dy = n.y - p.y, d = dx * dx + dy * dy, rr = n.r + 5;
      if (d < rr * rr && d < bd) { best = n; bd = d; } } return best; };
  cv.addEventListener("mousedown", e => { const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top, n = pick(mx, my);
    moved = 0; px = mx; py = my;
    if (n) { dragNode = n; n.fixed = true; alpha = Math.max(alpha, 0.5); } else panning = true; });
  const mm = e => { const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    if (dragNode) { const p = toWorld(mx, my); dragNode.x = p.x; dragNode.y = p.y;
      moved += Math.abs(mx - px) + Math.abs(my - py); alpha = Math.max(alpha, 0.3); px = mx; py = my; return; }
    if (panning) { view.tx += mx - px; view.ty += my - py; moved += Math.abs(mx - px) + Math.abs(my - py); px = mx; py = my; } };
  const mu = () => {
    if (dragNode && moved < 5) { const i = dragNode.i; dragNode.fixed = false; dragNode = null; panning = false; wbShowWiki(i); return; }
    if (dragNode) dragNode.fixed = false;
    dragNode = null; panning = false; };
  window.addEventListener("mousemove", mm);
  window.addEventListener("mouseup", mu);
  graphTeardown = () => { window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu); };
  cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top, f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const ns = Math.max(0.05, Math.min(8, view.scale * f));
    view.tx = mx - (mx - view.tx) * (ns / view.scale); view.ty = my - (my - view.ty) * (ns / view.scale); view.scale = ns; }, { passive: false });
}

// ── 人物档案面板（总览区） ──

          `<div class="nm"><span class="dot ${stCls(e.status)}"></span>${esc(e.title || e.id)}</div>` +
          `<div class="role">${esc(e.summary || "")}</div>` +
          `<div style="margin-top:6px">${(e.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` +

let fsRoot = null;

async function ensureRW() {

  const want = { mode: "readwrite" };
  try {
    let p = fsRoot.queryPermission ? await fsRoot.queryPermission(want) : await fsRoot.getPermission(want);

function mdRender(src) {
  const fences = [];
  src = String(src || "").replace(/\r\n/g, "\n")
    .replace(/```[^\n]*\n([\s\S]*?)(?:```|$)/g, (m, code) => { fences.push(code.replace(/\n$/, "")); return "\n\f" + (fences.length - 1) + "\f\n"; });
  const lines = esc(src).split("\n");
  const out = []; let para = [], list = null, quote = [];
  const flushP = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.o}>` + list.items.map(x => "<li>" + x + "</li>").join("") + `</${list.o}>`); list = null; } };
  const flushQ = () => { if (quote.length) { out.push("<blockquote>" + quote.join("<br>") + "</blockquote>"); quote = []; } };
  const flushAll = () => { flushP(); flushL(); flushQ(); };
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]*)\]\(([^)]*)\)/g, (m, t, u) => `<span title="${u}">${t || u}</span>`);
  for (const line of lines) {
    const fm = line.match(/^\f(\d+)\f$/);
    if (fm) { flushAll(); out.push('<pre class="code">' + esc(fences[+fm[1]]) + "</pre>"); continue; }
    if (/^\s*$/.test(line)) { flushAll(); continue; }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { flushAll(); const lv = hm[1].length; out.push(`<h${lv}>` + inline(hm[2]) + `</h${lv}>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushAll(); out.push("<hr>"); continue; }
    const qm = line.match(/^\s*&gt;\s?(.*)$/);
    if (qm) { flushP(); flushL(); quote.push(inline(qm[1])); continue; }
    const lm = line.match(/^\s*[-*]\s+(.*)$/);
    if (lm) { flushP(); flushQ(); if (!list || list.o !== "ul") { flushL(); list = { o: "ul", items: [] }; } list.items.push(inline(lm[1])); continue; }
    const om = line.match(/^\s*\d+[.、]\s+(.*)$/);
    if (om) { flushP(); flushQ(); if (!list || list.o !== "ol") { flushL(); list = { o: "ol", items: [] }; } list.items.push(inline(om[1])); continue; }
    flushL(); flushQ(); para.push(inline(line));
  }
  flushAll();
  return out.join("\n");
}

  openDetail("lh:" + f.file + ":" + e.ts, f.file.split("/").pop(),
    `${e.ts} · 第 ${vi + 1}/${f.entries.length} 版 · ${e.full ? "full" : "patch"} · 字数 ${e.words}`,
    `<div class="note">${e.full
      ? "首版全文（full）——重放链的锚点。"
      : "unified diff（相对上一版）。恢复此版 = 从最近 full 版顺向重放到本行。"}</div>` + pre +
    `<div class="bar" style="margin-top:12px">` +
    `<button class="btn" id="lhRestore"${canRestore ? "" : " disabled title=\"无项目目录授权，恢复不可用（在线场景只读）\""}>恢复此版</button>` +
    `<span class="muted" style="font-size:12px">写回原文件并记一条新历史</span></div>`,
    () => {
      const b = document.getElementById("lhRestore");
      if (b) b.onclick = () => histRestore(f, vi);
    });
}
function histRestore(f, vi) {
  const r = lhReplayTo(f.entries, vi);
  if (r.err) { lhUI.note = "重建该版失败：" + r.err; dwGo("history"); return; }
  const rel = f.file;
  if (editingSuf() && editState.rel === rel) {
    lhUI.note = "该文件正在编辑中——先退出编辑再恢复（避免覆盖未落盘修改）";
    dwGo("history"); return;
  }
  openConfirm("恢复确认", rel,
    `<div class="note">把「${esc(rel)}」写回到第 ${vi + 1} 版（${esc(f.entries[vi].ts)}）。` +
    `纯静态纪律：FS API 直写项目目录，恢复本身也记一条新历史（不抹旧账）。</div>` +
    `<div class="bar"><button class="btn" id="hrYes">确认恢复</button><button class="btn" id="hrNo">取消</button></div>`);
  document.getElementById("hrNo").onclick = () => closeConfirm();
  document.getElementById("hrYes").onclick = () => {
    document.getElementById("hrYes").disabled = true;
    lhEnqueue(async () => {
      if (!(await ensureRW())) return "无写权限，恢复取消";
      if (!/^(.+\/)?[^/]+\.(md|txt)$/i.test(String(rel).replace(/\\/g, "/")))
        return "恢复目标只收 .md/.txt，已拒绝：" + rel;
      const man = (await lhManifest(await lhDir(fsRoot, rel, false))) || { file: rel, entries: [] };
      const cur = man.entries.length ? lhReplayTo(man.entries, man.entries.length - 1)
                                      : { text: await lhReadText(fsRoot, rel) };
      if (!cur.err && cur.text === r.text) return "目标版与现行版一致，未落盘";
      const ts = await lhAddVersion(fsRoot, rel, r.text);   // 基线=manifest 重放/盘上现文，写文件前记账
      await lhWrite(fsRoot, rel, r.text);
      return ts ? ("已恢复并记入新历史：" + ts) : "已恢复（内容与历史现行版一致）";
    }).then(msg => {
      closeConfirm();
      lhUI.scanned = false; lhUI.note = msg;
      const ds = docState.a === rel ? "A" : docState.b === rel ? "B" : "";
      closeDetail();
      dwGo("history");
      if (ds && editingSuf() !== ds) loadPane(ds, rel);     // 文档分栏打开着同一文件 → 刷新视图
    }).catch(e => {
      closeConfirm();
      lhUI.scanned = false; lhUI.note = "恢复失败：" + ((e && e.message) || e);
      dwGo("history");
    });
  };
}
async function lhRefresh() {
  try {
    const res = await lhScanAll(fsRoot);
    lhUI.scanned = res.scanned; lhUI.files = res.files; lhUI.broken = res.broken;
  } catch (e) {
    lhUI.scanned = false; lhUI.files = []; lhUI.broken = [];
    lhUI.note = "扫描 .history/ 失败：" + ((e && e.message) || e);
  }
  if (dwPage === "history") renderHistory();   // 无条件重渲：扫描失败/不支持也要换掉「正在扫描…」骨架
}

// ── 配置二层抽屉（一层导航：模型配置 / 日志 / 历史快照 / 偏好；二层内容页） ──
const drawer = document.getElementById("drawer");
const dwBody = document.getElementById("dwBody");
const dwBack = document.getElementById("dwBack");
const dwTitle = document.getElementById("dwTitle");
const DW_PAGES = { models: "模型配置", logs: "日志", snaps: "历史快照", history: "本地历史", prefs: "偏好" };
let dwPage = "";
const logState = { level: "", q: "" };
function openDrawer() { drawer.classList.add("open"); dwGo(dwPage); }
function closeDrawer() { drawer.classList.remove("open"); dwPage = ""; }
function dwGo(page) {
  dwPage = page;
  dwBack.style.visibility = page ? "visible" : "hidden";
  dwTitle.textContent = page ? DW_PAGES[page] : "配置";
  if (!page) {
    const c = state.config;
    dwBody.innerHTML = `<h3>配置</h3>` +
      `<div class="navrow" data-p="models"><span>模型配置</span><span class="chip">${CFG.models.length} 项</span><span class="ar">›</span></div>` +
      `<div class="navrow" data-p="logs"><span>日志</span><span class="chip">${CFG.logs.length} 条</span><span class="ar">›</span></div>` +
      `<div class="navrow" data-p="snaps"><span>历史快照</span><span class="chip">${CFG.snapshots.length} 条</span><span class="ar">›</span></div>` +
      `<div class="navrow" data-p="history"><span>本地历史</span><span class="chip">${CFG.localHistory.length} 档</span><span class="ar">›</span></div>` +
      `<div class="navrow" data-p="prefs"><span>偏好</span>` +
      `<span class="chip">${c.theme === "light" ? "白灰青" : "暗色"} · ${{ gold: "金", blue: "蓝", green: "绿", purple: "紫" }[c.themeColor] || c.themeColor}</span>` +
      `<span class="ar">›</span></div>` +
      `<div class="note">「配置」入口在顶栏右上角；ESC 逐层退出。</div>`;
    dwBody.querySelectorAll(".navrow").forEach(r =>
      r.addEventListener("click", () => dwGo(r.dataset.p)));
    return;
  }
  if (page === "models") { dwBody.innerHTML = `<div id="modelsBody"></div>`; renderModels(); }
  else if (page === "logs") {
    dwBody.innerHTML =
      `<div class="bar" style="margin:10px 0 8px">` +
      `<select id="logLevel"><option value="">全部级别</option><option${logState.level === "ERROR" ? " selected" : ""}>ERROR</option><option${logState.level === "WARN" ? " selected" : ""}>WARN</option><option${logState.level === "INFO" ? " selected" : ""}>INFO</option></select>` +
      `<input type="search" id="logQ" placeholder="搜日志内容" value="${esc(logState.q)}" style="min-width:150px">` +
      `<button class="btn" id="logCopy">复制</button>` +
      `<span class="chip" id="logCount"></span></div>` +
      `<div id="logsBody"></div>`;
    document.getElementById("logLevel").addEventListener("change", e => { logState.level = e.target.value; renderLogs(); });
    const lq = document.getElementById("logQ");
    lq.addEventListener("input", () => { logState.q = lq.value; renderLogs();
      const n = document.getElementById("logQ"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
    document.getElementById("logCopy").addEventListener("click", e => {
      copyText(logFiltered().map(l => `${l.time}\t${l.level}\t${l.msg}`).join("\n"), e.target, "已复制");
    });
    renderLogs();
  }
  else if (page === "snaps") { dwBody.innerHTML = `<div id="snapsBody"></div>`; renderSnaps(); }
  else if (page === "history") {
    dwBody.innerHTML = `<div id="histBody"><div class="empty">正在扫描 .history/ …</div></div>`;
    if (fsRoot && !lhUI.scanned) lhRefresh(); else renderHistory();
  }
  else if (page === "prefs") { dwBody.innerHTML = `<div id="prefsBody"></div>`; renderPrefs(); }
}
dwBack.addEventListener("click", () => dwGo(""));
document.getElementById("dwClose").addEventListener("click", closeDrawer);
function renderModels() {
  const el = document.getElementById("modelsBody");
  el.innerHTML = CFG.models.length
    ? CFG.models.map(r => `<div class="lrow"><span class="mono" style="flex:0 0 40%">${esc(r.name)}</span>` +
        `<span class="mono lmsg">${esc(String(r.value))}</span>` +
        `<span class="chip" style="margin-left:auto">${esc(r.source)}</span></div>`).join("")
      + `<div class="note">只读展示；密钥类字段一律不入板。</div>`
    : `<div class="empty">无模型配置</div>`;
}
function logFiltered() {
  const q = logState.q.trim().toLowerCase();
  return CFG.logs.filter(l => (!logState.level || l.level === logState.level) &&
    (!q || l.msg.toLowerCase().includes(q)));
}
function renderLogs() {
  const rows = logFiltered();
  const view = rows.slice().reverse();   // 时间倒序（台账为 append-only 时序）
  document.getElementById("logsBody").innerHTML =
    (view.length ? view.map(l => `<div class="lrow"><span class="tm">${esc(l.time)}</span>` +
      `<span class="lv-${esc(l.level)} mono">${esc(l.level)}</span>` +
      `<span class="lmsg">${esc(l.msg)}</span></div>`).join("")
      : `<div class="empty">无日志（journal.jsonl 缺席或无匹配）</div>`);
  document.getElementById("logCount").textContent = `${rows.length} / ${CFG.logs.length} 条`;
}
function restoreCmd(s) {
  return `python tools/snapshot.py restore ${D.project || "<项目>"} ${s.node} --r ${s.round} --file ${s.file}`;
}
function renderSnaps() {
  const el = document.getElementById("snapsBody");
  el.innerHTML = CFG.snapshots.length
    ? CFG.snapshots.map((s, i) => `<div class="lrow" data-snap="${i}" style="cursor:pointer">` +
        `<span class="tm" style="color:var(--accent)">${esc(s.time)}</span>` +
        `<span class="lmsg mono">${esc(s.name)}</span>` +
        `<span class="chip mono">${esc((s.hash || "—").slice(0, 8))}</span></div>`).join("")
      + `<div class="note">最近 ${CFG.snapshots.length} 条（≤50）；点一条在右侧详情面板预览。</div>`
    : `<div class="empty">无快照（snapshots/index.json 缺席）</div>`;
  el.querySelectorAll("[data-snap]").forEach(r => r.addEventListener("click", () => {
    closeDrawer();               // 快照预览走详情面板（主区零弹窗），抽屉让位
    snapDetail(+r.dataset.snap);
  }));
}
function snapDetail(i) {
  const s = CFG.snapshots[i]; if (!s) return;
  const body = s.text
    ? `<pre class="view">${esc(s.text)}</pre>` + (s.truncated ? `<div class="note">内容超出内嵌上限，只显示前段。</div>` : "")
    : `<div class="empty">快照内容未内嵌（超体积预算或二进制）——用恢复命令取回。</div>`;
  openDetail("snap:" + (s.time || "") + "|" + (s.name || ""), s.name,
    `${s.time} · hash ${s.hash || "—"}` + (s.note ? ` · ${s.note}` : ""),
    body +
    `<div class="bar" style="margin-top:12px">` +
    `<button class="btn" id="snapRestore">恢复到此版本</button>` +
    `<button class="btn" id="snapCmd">复制恢复命令</button></div>`,
    () => {
      document.getElementById("snapCmd").addEventListener("click", e => copyText(restoreCmd(s), e.target, "已复制"));
      document.getElementById("snapRestore").addEventListener("click", () => snapConfirm(s));
    });
}
// 破坏性确认：v4 框架下唯一保留的弹窗（豁免项）
function snapConfirm(s) {
  openConfirm("恢复确认", s.name,
    `<div class="note">把「${esc(s.file)}」恢复到 ${esc(s.node)} 第 ${s.round} 轮（${esc(s.time)}）。<br>` +
    `纯静态页不落盘：生成补丁由你复制落盘，或用快照命令由调用方执行。</div>` +
    `<div class="bar"><button class="btn" id="cfPatch">生成恢复补丁并复制</button>` +
    `<button class="btn" id="cfCmd">复制恢复命令</button></div><div id="cfOut"></div>`);
  document.getElementById("cfCmd").addEventListener("click", e => copyText(restoreCmd(s), e.target, "已复制"));
  document.getElementById("cfPatch").addEventListener("click", e => {
    const out = document.getElementById("cfOut");
    if (!s.text) { out.innerHTML = `<div class="note">该快照内容未内嵌，无法生成补丁——用恢复命令。</div>`; return; }
    const cur = CFG.snapshots.find(x => x.file === s.file && x.cur);
    if (!cur || !cur.cur) { out.innerHTML = `<div class="note">现行版内容未内嵌，无法生成补丁——用恢复命令。</div>`; return; }
    const d = lineDiff(cur.cur, s.text);
    const uni = unifiedDiff(s.file, d);
    copyText(uni, e.target, "补丁已复制");
    out.innerHTML = `<div class="note">补丁（现行版 → 该快照，${d.hunks.length} 块）已复制。粘贴应用到当前文件即恢复该版内容；` +
      `现行版内容为出板时的盘上快照，若此后文件已变，请以恢复命令为准。</div>` +
      `<div class="diffbox">${uni.split("\n").map(l =>
        `<div class="${l.startsWith("@") || l.startsWith("---") || l.startsWith("+++") ? "hud" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "ctx"}">${esc(l)}</div>`).join("")}</div>`;
  });
}
// 行级 diff（splitLines / lineDiff / diffScript / unifiedDiff）与 LocalHistory 纯函数同区，
// 见「LocalHistory 核心」一节（V4-4 收拢为可整段抽取自检的无 DOM 区；快照补丁生成照常调用）。

// ── 偏好（抽屉二层「偏好」页）：字号 / 行高 / 主题色 / 紧凑 / 主题（localStorage 持久化） ──
function renderPrefs() {
  const c = state.config;
  document.getElementById("prefsBody").innerHTML =
    `<div class="prefrow"><label>主题</label>` +
    `<button class="sw${c.theme !== "light" ? " on" : ""}" data-th="dark">暗色</button>` +
    `<button class="sw${c.theme === "light" ? " on" : ""}" data-th="light">白灰青</button></div>` +
    `<div class="prefrow"><label>主题色</label>` +
    ["gold", "blue", "green", "purple"].map(k =>
      `<button class="sw${c.themeColor === k ? " on" : ""}" data-ac="${k}"><span class="dot"></span>${{ gold: "金", blue: "蓝", green: "绿", purple: "紫" }[k]}</button>`).join("") +
    `</div>` +
    `<div class="prefrow"><label>字号</label><input type="range" id="pfFs" min="12" max="20" step="1" value="${c.fontSize}"><span class="v" id="pfFsV">${c.fontSize}px</span></div>` +
    `<div class="prefrow"><label>行高</label><input type="range" id="pfLh" min="1.4" max="2.2" step="0.05" value="${c.lineHeight}"><span class="v" id="pfLhV">${c.lineHeight}</span></div>` +
    `<div class="prefrow"><label>紧凑</label>` +
    `<button class="sw${c.compact ? " on" : ""}" id="pfCompact">紧凑模式</button></div>` +
    `<div class="prefrow"><label>本地历史</label>` +
    `<button class="sw${c.localHistory ? " on" : ""}" id="pfHistSw" title="保存与编辑中的定期保存自动记版到 .history/；关闭后保存照常写文件但不记史">记入本地历史</button></div>` +
    `<div class="prefrow"><label>记档间隔</label><input type="range" id="pfHistInt" min="200" max="2000" step="100" value="${c.histInterval}">` +
    `<span class="v" id="pfHistIntV">${c.histInterval}字</span></div>` +
    `<h3 style="margin:14px 0 6px">功能入口</h3>` +
    `<div class="prefrow"><label>入口开关</label>` + ENTRIES.map(e => {
      const on = entryOn(e.id), locked = e.id === "config";
      return `<button class="sw${on ? " on" : ""}"${locked ? " disabled" : ""} data-pl="${e.id}"` +
        ` title="${locked ? "配置入口永驻，不可关闭" : e.title + (on ? "：开（点击关闭）" : "：关（点击开启）")}">${e.title}</button>`;
    }).join("") + `</div>` +
    `<div class="prefrow"><label></label><button class="btn" id="pfPlReset">重置默认</button>` +
    `<span class="muted" style="font-size:12px">开关只隐藏入口（payload 不变）；关闭后对应面板不可达；重置回默认入口集。</span></div>`;
  const scoped = sel => dwBody.querySelectorAll(sel);
  scoped("[data-th]").forEach(b => b.addEventListener("click", () => { c.theme = b.dataset.th; savePrefs(); applyPrefs(); dwGo("prefs"); }));
  scoped("[data-ac]").forEach(b => b.addEventListener("click", () => { c.themeColor = b.dataset.ac; savePrefs(); applyPrefs(); dwGo("prefs"); }));
  document.getElementById("pfFs").addEventListener("input", e => { c.fontSize = +e.target.value; document.getElementById("pfFsV").textContent = c.fontSize + "px"; savePrefs(); applyPrefs(); });
  document.getElementById("pfLh").addEventListener("input", e => { c.lineHeight = +e.target.value; document.getElementById("pfLhV").textContent = c.lineHeight; savePrefs(); applyPrefs(); });
  document.getElementById("pfCompact").addEventListener("click", () => { c.compact = !c.compact; savePrefs(); applyPrefs(); dwGo("prefs"); });
  document.getElementById("pfHistSw").addEventListener("click", () => { c.localHistory = !c.localHistory; savePrefs(); dwGo("prefs"); });
  document.getElementById("pfHistInt").addEventListener("input", e => {
    c.histInterval = Math.min(2000, Math.max(200, Math.round(+e.target.value || 500)));
    document.getElementById("pfHistIntV").textContent = c.histInterval + "字";
    savePrefs();
  });
  scoped("[data-pl]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.pl;
    if (id === "config") return;                       // 永驻入口不可关（disabled 双保险）
    c.plugins[id] = !entryOn(id);
    savePrefs(); renderRail();
    if (state.activePanel && !entryOn(state.activePanel)) show("");   // 当前面板的入口被关 → 退回空白
    dwGo("prefs");
  }));
  const plReset = document.getElementById("pfPlReset");
  if (plReset) plReset.addEventListener("click", () => {
    c.plugins = {};                                    // 清个人覆盖 → 回默认（服务端默认 > 注册表 defaultOn）
    savePrefs(); renderRail();
    if (state.activePanel && !entryOn(state.activePanel)) show("");
    dwGo("prefs");
  });
}
applyPrefs();
</script>
</body>
</html>
