<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流画布 · __TITLE__</title>
<style>
*{box-sizing:border-box}
:root{--diff-del-bg:rgba(122,72,46,.12);--diff-del-bd:#9a5b38;--diff-del-ink:#6e3f26;--diff-add-bg:rgba(63,109,74,.12);--diff-add-bd:#4a7a58;--diff-add-ink:#3f6d4a;--r-s:4px;--r-m:7px;--r-l:10px;--ctl-h:26px;--ctl-px:11px;--fs:1;
  --font-ui:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-doc:var(--font-ui);
  --bg-app:#f4f1ea;--bg-chrome:#fbfaf7;--bg-stage:#faf8f3;--dot:#e7e2d6;
  --bg-docpanel:#eee8da;--bg-paper:#fffdf9;--bg-ctl:#fff;--bg-node:#fff;
  --line:#d9d2c5;--line-node:#d3ccc0;--line-paper:#e4ddcd;
  --ink:#262420;--ink-2:#4a453c;--ink-3:#8a8375;
  --bg-code:#efece3;--bg-cmt:#f6f3ea;--bg-th:#f3efe6;--bg-vbar:#fbf5f3;--accent:#a5433a}
html[data-font="serif"]{--font-doc:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
html[data-font="kai"]{--font-doc:'Kaiti SC','KaiTi','STKaiti',serif}
html[data-theme="ink"]{--diff-del-bg:rgba(205,128,96,.13);--diff-del-bd:#a06a4e;--diff-del-ink:#d89a76;--diff-add-bg:rgba(120,180,140,.11);--diff-add-bd:#5f9a74;--diff-add-ink:#8ec7a4;--bg-app:#171512;--bg-chrome:#201d18;--bg-stage:#1a1814;--dot:#2b2820;
  --bg-docpanel:#1e1b16;--bg-paper:#252119;--bg-ctl:#2c2820;--bg-node:#252119;
  --line:#3b362b;--line-node:#454035;--line-paper:#3b362b;
  --ink:#eae5d9;--ink-2:#cbc5b7;--ink-3:#8f8979;
  --bg-code:#332f26;--bg-cmt:#2e2a20;--bg-th:#2c2820;--bg-vbar:#2b2016;--accent:#c96a5c;color-scheme:dark}
html[data-theme="celadon"]{--diff-del-bg:rgba(150,80,60,.11);--diff-del-bd:#a06148;--diff-del-ink:#7e4330;--diff-add-bg:rgba(63,125,92,.13);--diff-add-bd:#3f7d5c;--diff-add-ink:#2f6248;--bg-app:#ecefec;--bg-chrome:#f8faf7;--bg-stage:#f0f3ee;--dot:#d9e0d6;
  --bg-docpanel:#e6ebe4;--bg-paper:#fbfdf9;--bg-ctl:#fff;--bg-node:#fbfdf9;
  --line:#ccd4cb;--line-node:#c3cdc2;--line-paper:#d5ddd2;
  --ink:#22271f;--ink-2:#454c42;--ink-3:#7d857a;
  --bg-code:#e8ede5;--bg-cmt:#eef3ea;--bg-th:#e9efe6;--bg-vbar:#eaf2ec;--accent:#3f7d5c}
:where(button,a,select,textarea,[tabindex]):focus-visible{outline:2px solid #a5433a;outline-offset:1px}
button,a,select,textarea{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){#docpanel .dh.flash{animation:none}*{transition:none!important}}
body{margin:0;height:100vh;display:flex;flex-direction:row;overflow:hidden;
     font-family:var(--font-ui);
     background:var(--bg-app);color:var(--ink)}
h1,.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
header{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:calc(15px*var(--fs,1));margin:0;font-weight:700;letter-spacing:1px;white-space:nowrap;flex-shrink:0;font-family:'Noto Serif SC','SimSun',serif}
header .brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(15px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
.view-toggle{display:flex;flex:none;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.view-toggle .vt{border:none;background:transparent;padding:5px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-3);white-space:nowrap}
.view-toggle .vt.on{background:var(--accent);color:#fff;font-weight:700}
header .ver{font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap;flex-shrink:0}
header .sp{flex:1}
header .pname{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(14px*var(--fs,1));letter-spacing:.5px;color:var(--ink);max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;min-width:0}
button.tb,a.tb{border:1px solid #c9c1b2;background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
button.tb:hover,a.tb:hover{border-color:#8a8375;background:#f3efe6}
#canvas-col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg-stage);
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:28px 28px}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
.edge-hit{pointer-events:stroke;cursor:pointer}
.edge-label{font-size:calc(10px*var(--fs,1));fill:#8a8375;pointer-events:none}
.stage-rule{stroke-width:1.2;stroke-dasharray:1,4}
.stage-name{font-size:calc(12.5px*var(--fs,1));font-weight:700}
.node{position:absolute;width:196px;background:var(--bg-node);border:1px solid var(--line-node);border-radius:var(--r-m);cursor:grab;user-select:none;
      box-shadow:0 1px 2px rgba(60,50,30,.06)}
/* 隐形点击热区：整图适配下节点缩得很小，热区外扩 6px 保证可点 */
.node::after{content:'';position:absolute;inset:-6px}
.node.sel{outline:2px solid #262420;outline-offset:1px}
.node .accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0}
.node .hd{display:flex;align-items:center;gap:7px;padding:8px 10px 2px}
.node .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node .zh{font-size:calc(13.5px*var(--fs,1));font-weight:700;line-height:1.25}
.node .sub{padding:2px 10px 4px;font-size:calc(10.5px*var(--fs,1));color:#8a8375;line-height:1.4}
.node .out{position:absolute;top:-9px;right:-8px;background:#fff;border:1.5px solid #a5433a;color:#a5433a;
           font-size:calc(10.5px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:2px}
.node .par{font-size:calc(10.5px*var(--fs,1));border:1px solid #b8a464;color:#8a6b2a;background:#fdf9ee;border-radius:var(--r-s);padding:0 5px;margin-left:6px}
.node.k-gate{background:#fbf5f3;border:1.5px solid #a5433a}
.node.k-gate .zh{color:#8c352c}
/* R5 · kit 边界验收：全流程唯一保留的人工裁决点。金色双线，与域内自动放行的门明确区分开 */
.node.k-boundary{background:#fdf8ec;border:3px double #b8a464}
.node.k-boundary .zh{color:#7a5c1e}
.node.k-boundary .accent{background:#b8a464!important}
.node.k-boundary .bdg{position:absolute;top:-10px;left:-8px;background:#fdf8ec;border:1.5px solid #b8a464;color:#7a5c1e;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:1px}
/* R5 · 指标徽章：效率（被下游消费/成本）与命中率（注入标尺被引用比例） */
.node .mbs{position:absolute;top:-10px;left:8px;display:flex;gap:3px;pointer-events:none}
.mb{display:inline-block;font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 5px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap;font-variant-numeric:tabular-nums}
.mb.good{border-color:#5a8a5e;color:#3d6b45;background:#f2f8f2}
.mb.warn{border-color:#c9922e;color:#8a6b2a;background:#fdf9ee}
.mb.bad{border-color:#a5433a;color:#8c352c;background:#fbf1f0}
/* ---------- 运行状态配色（09-22）：绿=已跑完 灰=未跑 琥珀=待决（挂起等人）。
   小圆点带色 + 卡底色双通道；门/边界门的专属底色（k-gate/k-boundary 定义在后）优先，状态经圆点表达 ---------- */
.node.st-done{background:#f2f7ef;border-color:#8fae86}
.node.st-done .zh{color:#3d5c38}
.node.st-idle{opacity:.66}
.node.st-wait{background:#fdf8ec;border-color:#c9a75a}
.node.st-done .dot{background:#4a7a58;box-shadow:0 0 0 3px rgba(74,122,88,.16)}
.node.st-idle .dot{background:#b8b0a4}
.node.st-wait .dot{background:#c9922e;box-shadow:0 0 0 3px rgba(201,146,46,.16)}
/* 支线：无产物可看的核查件（扫描/核算/域内检）——右侧支线列，虚线卡降低视觉权重 */
.node.lane-side{width:168px;border-style:dashed;box-shadow:none}
.node.lane-side .zh{font-weight:600}
.node.lane-side .accent{opacity:.5}
/* 版本徽标：节点卡右下角 rN = 快照轮次数（点节点开文档可切换轮次 / 对比上一轮） */
.node .vb{position:absolute;bottom:-9px;right:-6px;background:#f2f7ef;border:1.5px solid #4a7a58;color:#3d6b45;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s)}
/* 顶栏图例 */
.lgd{font-size:calc(10.5px*var(--fs,1));color:#8a8375;display:inline-flex;align-items:center;gap:4px;margin-left:8px;white-space:nowrap}
.lgd i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* R5 · 内容配置项旋钮表 */
.knobs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.knob{border:1px solid var(--line-paper);border-left:3px solid var(--line-paper);border-radius:var(--r-s);padding:7px 10px;background:var(--bg-paper)}
.knob.chg{border-left-color:var(--accent);background:#fffaf4}
html[data-theme="ink"] .knob.chg{background:#2b2419}
.knob .kn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob .kn-h code{font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink)}
.knob .kn-v{font-size:calc(12.5*var(--fs,1));color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.knob .kn-s{font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);margin-left:auto}
.knob .kn-s.src-overlay{border-color:var(--accent);color:var(--accent)}
.knob .kn-s.src-node{border-color:#c9922e;color:#8a6b2a}
.knob .kn-d{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);margin-top:3px;line-height:1.6}
.knob .kn-m{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;line-height:1.6}
.patched{font-family:ui-monospace,Consolas,monospace;font-size:calc(11.5px*var(--fs,1));background:var(--bg-code);
  border:1px solid var(--line-paper);border-radius:var(--r-s);padding:9px 11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.banner{margin:10px 22px 0;padding:9px 14px;border:1px solid var(--line-paper);border-left:3px solid #c9922e;border-radius:var(--r-s);
  background:#fdf9ee;color:#6b5a2a;font-size:calc(12px*var(--fs,1));line-height:1.7}
html[data-theme="ink"] .banner{background:#2a2418;color:#d9c88a}
.banner b{color:#8a6b2a}
html[data-theme="ink"] .banner b{color:#e0cd8f}
.st-done{background:#5a8a5e}.st-awaiting{background:#c9922e}.st-pending{background:#b05a4a}.st-none{background:#c9c1b2}
#hud{display:flex;gap:14px;font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#hud b{color:#3d382f}
#hud,#bottombar .zoom,.paper .doc-h,.paper .pf{font-variant-numeric:tabular-nums}
#docpanel{position:relative;width:min(44vw,780px);min-width:460px;border-left:1px solid var(--line);background:var(--bg-docpanel);display:flex;flex-direction:column}
#settings-pop{position:absolute;top:52px;right:10px;z-index:60;width:250px;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(40,32,16,.22);padding:12px 14px}
#settings-pop .set-cap{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin:8px 0 4px;letter-spacing:1px}
#settings-pop .set-cap:first-child{margin-top:0}
#settings-pop .set-opts{display:flex;gap:6px;flex-wrap:wrap}
#settings-pop .set-opts button{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-s);padding:4px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
#settings-pop .set-opts button:hover{border-color:var(--accent)}
#settings-pop .set-opts button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ob{font-size:calc(11px*var(--fs,1));color:var(--ink-3);line-height:1.8;word-break:break-all}
.ob .ok{color:#3d6b45;font-weight:700}
.ob .ob-url{color:var(--accent);cursor:pointer;text-decoration:underline}
#docpanel .dh{height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
#docpanel .bt{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
/* 文档上方全宽工具条（节点：轮次/对比/保存/撤销/历史/重跑）——可换行，不与右栏头部抢位 */
.nbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg-paper)}
#docpanel .dh .bt:hover{border-color:#8a8375;background:#f3efe6}
#docpanel .dh b.dt{font-size:calc(15px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;letter-spacing:.5px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpanel .dh.flash{animation:dhflash .7s ease}
@keyframes dhflash{0%{background:#f0e4c4}100%{background:#fbfaf7}}
.chip{display:inline-block;font-size:calc(10.5px*var(--fs,1));border:1px solid #c9c1b2;border-radius:var(--r-s);padding:1px 7px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap}
#d-vbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--bg-vbar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#d-vbar:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 22px 46px}
.paper{background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;
       max-width:720px;margin:22px auto 0;padding:38px 52px 44px;position:relative}
.paper .doc-h{font-size:calc(11px*var(--fs,1));color:#a89a83;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.paper .doc-h span:last-child{flex-shrink:0}
.paper .pf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:calc(10.5px*var(--fs,1));color:#b3ab9b;letter-spacing:2px}
.cover{max-width:720px;margin:34px auto 0;background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;padding:52px 56px}
.cover h2{font-size:calc(26px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;margin:0 0 6px;letter-spacing:2px}
.cover .sub{color:#8a8375;font-size:calc(12.5px*var(--fs,1));margin-bottom:18px}
.shelf-cap{max-width:720px;margin:28px auto 6px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.shelf-row{display:flex;align-items:center;gap:10px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:10px 12px;cursor:pointer}
.wb-sel{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:6px 8px;color:var(--ink);font-size:calc(12.5px*var(--fs,1))}
.diff{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:calc(12px*var(--fs,1))}
/* GitHub 式：双列行号栏 + 行内 +/− 记号；fold = 折叠的大段相同行（点击展开） */
.diff .ln{display:flex;align-items:baseline;padding:1px 8px;font-variant-numeric:tabular-nums}
.diff .ln .g{flex-shrink:0;width:40px;text-align:right;padding-right:8px;color:#b3ab9b;opacity:.8;user-select:none}
.diff .ln .s{flex:1;white-space:pre-wrap;word-break:break-all}
.diff .ln.add{background:var(--diff-add-bg);border-left:3px solid var(--diff-add-bd)}
.diff .ln.add .s::before{content:"+ ";color:var(--diff-add-ink);font-weight:700}
.diff .ln.del{background:var(--diff-del-bg);border-left:3px solid var(--diff-del-bd)}
.diff .ln.del .s::before{content:"− ";color:var(--diff-del-ink);font-weight:700}
.diff .ln.ctx .s{color:var(--ink-3)}
.diff .ln.fold{justify-content:center;background:var(--bg-ctl);color:var(--ink-3);cursor:pointer;font-size:calc(11px*var(--fs,1));padding:3px 8px;user-select:none}
.diff .ln.fold:hover{color:var(--ink-2);background:#efe9dc}
.diff .cw{border-radius:2px;padding:0 1px}
.diff .cw.del{background:var(--diff-del-bg);box-shadow:inset 0 0 0 1px var(--diff-del-bd);color:var(--diff-del-ink)}
.diff .cw.add{background:var(--diff-add-bg);box-shadow:inset 0 0 0 1px var(--diff-add-bd);color:var(--diff-add-ink)}
.diff-legend{display:flex;gap:14px;align-items:center;padding:4px 2px 10px;font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.diff-legend .lg.del{color:var(--diff-del-ink);font-weight:700}
.diff-legend .lg.add{color:var(--diff-add-ink);font-weight:700}
.wb-bar{display:flex;gap:8px;align-items:center;margin:2px 0 12px}
.wb-bar input{flex:1;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:7px 10px;color:var(--ink);font-size:calc(13px*var(--fs,1));outline:none}
.wb-bar input:focus{border-color:var(--accent)}
.wb-bar .cnt{font-size:12px;color:var(--ink-3);white-space:nowrap}
/* ---------- 文件柜（产物管理三合一）：板块 = 抽屉，两行卡片向右延伸，滚动条/拖拽横移 ---------- */
.cab-cap{margin:22px 0 8px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.cab-strip{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);gap:8px 12px;overflow-x:auto;padding-bottom:10px;user-select:none}
/* ---------- 全局滚动条统一（2026-09-22 用户口径）：黄底 + 深棕条，主窗口/文档面板/世界书/文件柜全吃同一套 ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:#ece5d4;border-radius:5px}
*::-webkit-scrollbar-thumb{background:#a08a58;border-radius:5px}
*::-webkit-scrollbar-thumb:hover{background:#86713f}
*::-webkit-scrollbar-corner{background:#ece5d4}
*{scrollbar-color:#a08a58 #ece5d4}
.cab-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:4px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:66px}
.cab-card:hover{border-color:var(--accent)}
.cab-card .r1{display:flex;align-items:center;gap:8px;min-width:0}
.cab-card .no{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;color:#a5433a;font-size:calc(14px*var(--fs,1));min-width:22px;flex-shrink:0;text-align:center}
.cab-card .nm{font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-card .go{margin-left:auto;flex-shrink:0;font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap}
.cab-card .sub{font-size:calc(11.5px*var(--fs,1));color:var(--ink-3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cab-card .tm{font-size:calc(10.5px*var(--fs,1));color:#a89d87;letter-spacing:.5px}
/* ---------- 世界书（GraphHyperRAG）嵌入式视图：版式=pedia（分类侧栏+Infobox+关系图），配色/字体=工作台同源 ---------- */
#wbstage{flex:1;position:relative;overflow:hidden;display:none;flex-direction:column;background:var(--bg-docpanel)}
#wbstage.on{display:flex}
/* ---------- 立意图（intent-graph@1）嵌入式视图：思维导图式分列 + 候选卡（p=剪枝排序分，禁当闸） ---------- */
#igstage{flex:1;position:relative;overflow:hidden;display:none;flex-direction:column;background:var(--bg-docpanel)}
#igstage.on{display:flex}
#ig-head{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
#ig-head .wt{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(14px*var(--fs,1));letter-spacing:1px;color:var(--ink);white-space:nowrap}
#ig-head .hyper{flex:none;font-size:10px;background:#f2ecfa;color:#5b3a86;border:1px solid #d8c8f0;border-radius:9px;padding:1px 8px;white-space:nowrap}
#ig-head .msg{white-space:nowrap}
#ig-body{flex:1;min-height:0;overflow:auto;padding:20px 26px 80px}
#ig-cols{display:flex;gap:26px;align-items:flex-start;min-width:max-content}
.ig-col{flex:0 0 auto;width:262px;display:flex;flex-direction:column;gap:12px}
.ig-col>.ig-depth{font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);letter-spacing:2px;border-bottom:1px dashed var(--line-paper);padding-bottom:3px}
.ig-node{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:var(--r-l,8px);padding:10px 12px;box-shadow:0 1px 4px rgba(40,32,16,.06)}
.ig-node.committed{border-left:3px solid #4a7a58}
.ig-node.open{border-left:3px solid #c9922e}
.ig-node.excluded{border-left:3px solid #b8b0a4;opacity:.72}
.ig-node .nk{font-size:calc(10px*var(--fs,1));background:#f0ebe0;color:var(--ink-3);border-radius:9px;padding:1px 8px;letter-spacing:1px}
.ig-node .nt{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(13.5px*var(--fs,1));color:var(--ink);margin:5px 0 3px}
.ig-node .nc{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);line-height:1.6}
.ig-node .dk{font-size:calc(10.5px*var(--fs,1));font-family:ui-monospace,Consolas,monospace;color:#5b3a86;margin-top:5px;word-break:break-all}
.ig-cand{margin-top:8px;border-top:1px dashed var(--line-paper);padding-top:7px}
.ig-cand .crow{display:flex;align-items:center;gap:7px;font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);padding:2px 0}
.ig-cand .crow .cdot{flex:none;width:8px;height:8px;border-radius:50%}
.ig-cand .crow.committed .cdot{background:#4a7a58}
.ig-cand .crow.proposed .cdot{background:#c9922e}
.ig-cand .crow.excluded .cdot{background:#b8b0a4}
.ig-cand .crow.excluded span{color:var(--ink-3)}
.ig-cand .crow .ct{font-weight:700;color:var(--ink)}
.ig-cand .crow .pv{margin-left:auto;flex:none;font-family:ui-monospace,Consolas,monospace;font-size:calc(10.5px*var(--fs,1));color:var(--ink-3)}
.ig-cand .pbar{height:4px;background:#ece5d4;border-radius:2px;overflow:hidden;margin:2px 0 2px 15px}
.ig-cand .pbar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.ig-cand .sc{flex:none;font-size:calc(9.5px*var(--fs,1));border:1px solid var(--line-paper);border-radius:8px;padding:0 6px;color:var(--ink-3);white-space:nowrap}
.ig-cand .why{font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);line-height:1.5;margin:2px 0 0 15px}
#ig-empty{max-width:560px;margin:60px auto;background:var(--bg-paper);border:1px dashed var(--line-paper);border-radius:var(--r-l,8px);padding:26px 30px;color:var(--ink-2);font-size:calc(12.5px*var(--fs,1));line-height:1.9}
#ig-empty code{background:#f0ebe0;border-radius:4px;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:calc(11px*var(--fs,1));color:#8a5a2a}
#wb-head{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
#wb-head .wt{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(14px*var(--fs,1));letter-spacing:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wb-head .hyper{flex:none;font-size:10px;background:#eef4ff;color:#2a4d8a;border:1px solid #b8d1ff;border-radius:9px;padding:1px 8px;white-space:nowrap}
#wb-head input{flex:0 1 300px;min-width:120px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:5px 10px;color:var(--ink);font-size:calc(12px*var(--fs,1));outline:none}
#wb-head input:focus{border-color:var(--accent)}
#wb-head .msg{white-space:nowrap}
#wb-body{flex:1;display:flex;min-height:0}
#wb-side{width:220px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:var(--bg-paper);padding:8px 0 50px}
#wb-side h3{font-size:calc(11px*var(--fs,1));color:var(--ink-3);letter-spacing:1.5px;margin:12px 14px 4px;font-weight:700}
#wb-side a{display:block;padding:4px 14px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-2);border-left:3px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wb-side a:hover{background:#f3efe6}
#wb-side a.on{background:#f3efe6;border-left-color:var(--accent);font-weight:700;color:var(--ink)}
#wb-side .grp>.gh{padding:4px 14px;font-size:calc(11.5px*var(--fs,1));color:var(--ink-3);cursor:pointer;display:flex;justify-content:space-between;user-select:none}
#wb-side .grp.closed .items{display:none}
#wb-side .items a{padding-left:26px}
#wb-main{flex:1;min-width:0;overflow-y:auto;padding:22px 32px 90px}
#wb-main .crumb{font-size:calc(12px*var(--fs,1));color:var(--ink-3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line-paper)}
#wb-main h1.art{font-family:'Noto Serif SC','SimSun',serif;font-size:calc(26px*var(--fs,1));font-weight:400;line-height:1.25;border-bottom:1px solid var(--line-paper);padding-bottom:5px;margin:0 0 4px;color:var(--ink)}
#wb-main .cat-badge{display:inline-block;font-size:calc(11px*var(--fs,1));background:#f0ebe0;color:var(--ink-3);border-radius:10px;padding:1px 9px;margin-left:8px;vertical-align:middle}
#wb-main .subtitle{font-size:calc(12.5px*var(--fs,1));color:var(--ink-3);margin-bottom:16px}
#wb-main .infobox{float:right;width:260px;margin:0 0 16px 20px;background:var(--bg-paper);border:1px solid var(--line-paper);font-size:calc(12.5px*var(--fs,1));line-height:1.5}
#wb-main .infobox .ib-h{background:#f0ebe0;padding:7px 10px;text-align:center;font-weight:700;border-bottom:1px solid var(--line-paper);font-family:'Noto Serif SC','SimSun',serif}
#wb-main .infobox table{width:100%;border-collapse:collapse}
#wb-main .infobox th,#wb-main .infobox td{padding:5px 9px;vertical-align:top;border-top:1px solid var(--line-paper);text-align:left;font-weight:400}
#wb-main .infobox th{background:#f0ebe0;width:70px;color:var(--ink-3);white-space:nowrap;font-size:calc(11.5px*var(--fs,1))}
#wb-main .infobox .ib-note{padding:6px 9px;font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);border-top:1px solid var(--line-paper);text-align:center}
#wb-main .sec{margin-bottom:20px}
#wb-main .sec>h2{font-family:'Noto Serif SC','SimSun',serif;font-size:calc(19px*var(--fs,1));font-weight:400;border-bottom:1px solid var(--line-paper);padding-bottom:3px;margin-bottom:9px;color:var(--ink)}
#wb-main p{margin:0 0 9px;line-height:1.8}
#wb-main ul.tight{margin:0 0 9px 20px}
#wb-main ul.tight li{margin-bottom:4px;line-height:1.7}
#wb-main a.wl{color:var(--accent);cursor:pointer}
#wb-main a.wl:hover{text-decoration:underline}
#wb-main .stgrid{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
#wb-main .stgrid .st{border:1px solid var(--line-paper);background:var(--bg-paper);padding:10px 16px;min-width:104px}
#wb-main .stgrid .st b{display:block;font-size:calc(20px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;color:var(--ink)}
#wb-main .stgrid .st span{font-size:calc(11.5px*var(--fs,1));color:var(--ink-3)}
#wb-main .catgrid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
#wb-main .catgrid a{border:1px solid var(--line-paper);background:var(--bg-paper);padding:8px 14px;font-size:calc(13px*var(--fs,1));cursor:pointer;color:var(--ink-2)}
#wb-main .catgrid a b{color:var(--ink)}
#wb-main .catgrid a small{color:var(--ink-3);margin-left:6px}
#wb-main .graphbox{border:1px solid var(--line-paper);background:var(--bg-paper);margin:14px 0;padding:10px}
#wb-main .graphbox svg{display:block;width:100%;height:auto}
#wb-main .glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(11.5px*var(--fs,1));color:var(--ink-3);padding:6px 4px 2px}
#wb-main .glegend span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#wb-main .tag{display:inline-block;background:#f0ebe0;color:var(--ink-2);border:1px solid var(--line-paper);border-radius:11px;padding:1px 9px;font-size:calc(11.5px*var(--fs,1));margin:0 5px 5px 0}
#wb-main .tag.rel{background:#fdf6ec;color:#8a6d1a;border-color:#e8d9a8;cursor:pointer}
#wb-main .wbempty{border:1px solid #e8d9a8;background:#fdf8ec;padding:22px 26px;line-height:2;color:var(--ink-2)}
#wb-main .status-badge{display:inline-block;font-size:calc(10.5px*var(--fs,1));padding:1px 7px;border-radius:9px;vertical-align:middle;margin-left:5px;font-weight:500}
#wb-main .st-active{background:#eef4ee;color:#3d6b45;border:1px solid #c4d8c6}
#wb-main .st-draft{background:#fdf6ec;color:#8a6d1a;border:1px solid #e8d9a8}
#wb-main .st-retired{background:#f3e8e8;color:#8c352c;border:1px solid #dcc3c0}
/* ---------- 对话（pi-agent）：会话侧栏 + 消息流 + 工具调用卡（Cursor 式三栏，工作台主题） ---------- */
#chatstage{flex:1;position:relative;overflow:hidden;display:none;flex-direction:column;background:var(--bg-docpanel)}
#chatstage.on{display:flex}
#chat-head{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
#chat-head .wt{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(14px*var(--fs,1));letter-spacing:1px;color:var(--ink);white-space:nowrap}
#chat-model-chip{flex:none;font-size:calc(11px*var(--fs,1))}
#chat-model-chip.ok{border-color:#4a7a58;color:#3d6b45}
#chat-model-chip.miss{border-color:#c9922e;color:#8a6d1a}
#chat-body{flex:1;display:flex;min-height:0}
#chat-side{width:200px;flex:none;border-right:1px solid var(--line);background:var(--bg-paper);overflow-y:auto;padding-bottom:20px}
#chat-new{margin:8px 10px;width:calc(100% - 20px);border:1px solid var(--accent);color:var(--accent);font-weight:700;background:transparent;cursor:pointer;padding:6px 12px;font-size:calc(12px*var(--fs,1));border-radius:4px}
#chat-new:hover{background:#f3efe6}
#chat-sessions .cs{padding:8px 10px;margin:2px 6px;border-radius:6px;cursor:pointer;border-left:3px solid transparent;font-size:calc(12px*var(--fs,1))}
#chat-sessions .cs:hover{background:#f3efe6}
#chat-sessions .cs.on{background:#f3efe6;border-left-color:var(--accent)}
#chat-sessions .cs .t{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px;position:relative}
#chat-sessions .cs .x{position:absolute;right:0;top:-1px;color:var(--ink-3);cursor:pointer;padding:0 3px;visibility:hidden}
#chat-sessions .cs:hover .x{visibility:visible}
#chat-sessions .cs .x:hover{color:#8c352c}
#chat-sessions .cs .m{font-size:calc(10.5px*var(--fs,1));color:var(--ink-3)}
#chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat-msgs{flex:1;overflow-y:auto;padding:20px 26px 28px}
.cm{margin-bottom:18px;max-width:860px;animation:msgIn .25s ease-out}
.cm.user{margin-left:auto;max-width:72%}
.cm.user .who{text-align:right}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cm .who{font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);letter-spacing:1px;margin-bottom:4px}
.cm .body{border:1px solid var(--line-paper);background:#fffdf8;border-radius:8px;padding:11px 15px;line-height:1.75;word-break:break-word;font-size:calc(12.5px*var(--fs,1));color:var(--ink);box-shadow:0 1px 2px rgba(60,45,20,.05)}
.cm.user .body{background:#f0e9da;border:1px solid #e4d8c0;border-right:3px solid var(--accent);box-shadow:none}
.cm .body.streaming::after{content:"▌";color:var(--accent);animation:cblink 1s steps(2) infinite}
@keyframes cblink{50%{opacity:0}}
.cm .body.err{background:#f8ecea;border-color:#dcc3c0;color:#8c352c}
/* --- markdown 渲染 --- */
.cm .body.md p{margin:0 0 8px;line-height:1.8}
.cm .body.md ul,.cm .body.md ol{margin:0 0 8px 20px}
.cm .body.md li{margin-bottom:3px;line-height:1.7}
.cm .body.md h1,.cm .body.md h2,.cm .body.md h3{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;color:var(--ink);margin:14px 0 6px}
.cm .body.md h1{font-size:calc(16px*var(--fs,1));border-bottom:1px solid var(--line-paper);padding-bottom:4px}
.cm .body.md h2{font-size:calc(14px*var(--fs,1))}
.cm .body.md h3{font-size:calc(13px*var(--fs,1))}
.cm .body.md code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.cm .body.md blockquote{border-left:3px solid var(--line-paper);background:var(--bg-docpanel);padding:7px 12px;margin:0 0 8px;color:var(--ink-3)}
/* --- 门裁决卡（铁律 6：门裁决归人——前端闭环，挂起即弹卡）--- */
#gate-card{position:fixed;top:64px;right:26px;width:400px;z-index:60;background:var(--bg-paper);border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 24px rgba(60,45,20,.18);padding:14px 16px;display:none;font-size:calc(12.5px*var(--fs,1))}
#gate-card.on{display:block}
#gate-card h4{margin:0 0 6px;font-family:'Noto Serif SC','SimSun',serif;color:var(--accent);font-size:calc(14px*var(--fs,1))}
#gate-card .g-meta{color:var(--ink-3);font-size:calc(11px*var(--fs,1));margin-bottom:8px;line-height:1.7}
#gate-card textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-paper);border-radius:4px;padding:6px 8px;font:inherit;resize:vertical;margin:6px 0 10px;background:#fffdf8}
#gate-card .g-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#gate-card .g-btns .bt{padding:4px 12px}
#gate-card .g-btns .bt.pass{border-color:#4a7a58;color:#3d6b45}
#gate-card .g-btns .bt.cond{border-color:#648ab8;color:#3d6b8a}
#gate-card .g-btns .bt.back{border-color:#c9922e;color:#8a6d1a}
#gate-card .g-btns .bt.rej{border-color:#b05a4a;color:#8c352c}
/* --- 对话面追赶（C-A）：搜索/徽标/门重开/运行证据 --- */
#chat-search{margin:6px 10px;width:calc(100% - 20px);box-sizing:border-box;border:1px solid var(--line-paper);border-radius:4px;padding:6px 10px;font:inherit;font-size:calc(12px*var(--fs,1));background:#fffdf8;color:var(--ink);outline:none}
#chat-search:focus{border-color:var(--accent)}
#chat-sessions .cs .t{padding-right:34px}
#chat-sessions .cs .r{position:absolute;right:16px;top:-1px;color:var(--ink-3);cursor:pointer;padding:0 3px;visibility:hidden}
#chat-sessions .cs:hover .r{visibility:visible}
#chat-sessions .cs .r:hover{color:var(--accent)}
#chat-sessions .cs .be{display:inline-block;font-size:calc(10px*var(--fs,1));color:#8a5a20;border:1px solid #e0c890;border-radius:3px;padding:0 3px;margin-right:4px;vertical-align:1px}
#chat-sessions .cs .ldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5a8a5e;margin-right:4px;vertical-align:2px}
#gate-reopen{position:fixed;top:14px;right:26px;z-index:59}
.ge-block{border:1px solid var(--line-paper);border-radius:8px;margin:14px 0 4px;max-width:860px;background:var(--bg-docpanel);overflow:hidden}
.ge-block .ge-h{padding:6px 12px;font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);letter-spacing:1px;border-bottom:1px solid var(--line-paper)}
.ge-row{padding:5px 12px;font-size:calc(11.5px*var(--fs,1));border-bottom:1px dashed var(--line-paper)}
.ge-row:last-child{border-bottom:none}
.ge-row.j{color:#8a6d1a}
.ge-row.r{color:#8c352c}
.ge-row.s{color:#3d6b45}
/* --- thinking 动效 --- */
.cm.thinking .body{border-left:3px solid #b8a464;background:transparent;font-size:calc(11.5px*var(--fs,1));color:var(--ink-3);max-height:180px;overflow:auto}
.cm.thinking .body.live{animation:thinkPulse 2s ease-in-out infinite}
@keyframes thinkPulse{0%,100%{border-left-color:#b8a464}50%{border-left-color:#d4c5a0}}
.cm.thinking .body.done{border-left-color:var(--line-paper);animation:none}
.cm.thinking .who{cursor:pointer;user-select:none}
/* --- 工具卡动效 --- */
.ctool{border:1px solid var(--line-paper);background:var(--bg-paper);border-radius:8px;margin-bottom:12px;max-width:860px;font-size:calc(12px*var(--fs,1));overflow:hidden}
.ctool .ch{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.ctool .ch:hover{background:#f3efe6}
.ctool .ch .nm{font-weight:700;font-family:ui-monospace,Consolas,monospace}
.ctool .ch .st{margin-left:auto;font-size:calc(10.5px*var(--fs,1));color:var(--ink-3);display:flex;align-items:center;gap:5px}
.ctool .ch .spinner{display:inline-block;width:11px;height:11px;border:2px solid #cfc5ae;border-top-color:#a08a58;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctool .cb{display:none;border-top:1px solid var(--line-paper);padding:8px 12px;max-height:260px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:calc(11px*var(--fs,1));color:var(--ink-2);background:var(--bg-docpanel)}
.ctool.open .cb{display:block}
.ctool .ch .arr{transition:transform .15s;font-size:10px;color:var(--ink-3)}
.ctool.open .ch .arr{transform:rotate(90deg)}
#chat-inputbar{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--bg-chrome)}
#chat-input{flex:1;resize:none;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:6px;padding:9px 12px;color:var(--ink);font-size:calc(12.5px*var(--fs,1));font-family:inherit;line-height:1.6;outline:none;min-height:38px;max-height:140px}
#chat-input:focus{border-color:var(--accent)}
#chat-input:disabled{opacity:.55}
#chat-send{flex-shrink:0;white-space:nowrap;align-self:flex-end;padding:9px 22px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;font-size:calc(12.5px*var(--fs,1));border-radius:4px;cursor:pointer}

<script>
const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);

/* ---------- R8-OPS 前端 live 化：这几个绑定必须是**可重赋值**的 ----------
   首屏仍吃生成时注入的 SSR payload（file:// 下也能看，不依赖后端）；但页面若由内核 HTTP 面提供，
   文件末尾的 startLive() 会轮询 /api/projects/<id>/live，把**易变切片**（状态/产物/生效编排/提案/指标/诊断）
   就地替换并重渲染 —— 于是内核推进（CLI / MCP / 面板）之后，页面不再是一张死快照。
   静态切片（DATA.modules / toolbox / kbTitles / flowsIndex / deliverables）不在此列：它们由生成器算好，
   只在换 flow / 加模块时变，那时本来就该重新生成页面。 */
let DATA, files, RS, EFF, OVERLAY, OPTIMIZE, METRICS, flow, nodes, edges, LEGACY_CANVAS;
/* 未迁移面板的缺失键回填（WO-07 面板重写后可删）：只补默认值，不做双名兜底 */
function fillDataDefaults(d){
  d.snapshots = d.snapshots || {}; d.kits = d.kits || {}; d.kbTitles = d.kbTitles || {};
  d.nodeFields = d.nodeFields || []; d.flowsIndex = d.flowsIndex || []; d.skillsIndex = d.skillsIndex || [];
  return d;
}
/* ---------- 文件多版本索引（来自快照）：diff 呈现的数据底座 ---------- */
const fileVersions = {};
function rebuildFileVersions(){
  Object.keys(fileVersions).forEach(k => delete fileVersions[k]);
  Object.entries(DATA.snapshots || {}).forEach(([nid, lst]) => (lst || []).forEach(s => {
    Object.entries(s.content || {}).forEach(([pth, text]) => {
      (fileVersions[pth] = fileVersions[pth] || []).push({ label: `${nid}·r${s.round}`, text });
    });
  }));
  Object.keys(fileVersions).forEach(k => fileVersions[k].sort((x, y) => x.label < y.label ? -1 : 1));
}
/* ---------- 生效编排：节点与边只此一份（EFF，内核 expandFlow 单点派生落盘）---------- */
/* 页面不重算派生（R6 §三）。存量项目（未跑 flow_effect / 未转换）EFF 为空壳 → 画布空，横幅显式说明。 */
function bindCanvas(){
  flow = (EFF && EFF.flow) || DATA.flow || {};   // flow@3 全文（内核内嵌）；无 EFF 时退展示摘要（payload DATA.flow）
  nodes = (EFF && EFF.nodes) || {};    // { <实例id>.<tool>: node }
  edges = (EFF && EFF.edges) || [];    // 骨架边 + 插件自动接线（R6 无 reject/loop 边）
  LEGACY_CANVAS = !Object.keys(nodes).length;
  const vEl = document.getElementById("v");
  if (vEl) vEl.textContent = "";  // 流程名移入「工作流管理」页（顶栏降噪）
  // 顶栏项目名（09-22 用户需求）：title > 项目配置 name/title > 项目 id
  const pn = document.getElementById("proj-name");
  if (pn) {
    const cfg = DATA.projectConfig && !DATA.projectConfig.__invalid ? DATA.projectConfig : {};
    pn.textContent = (RS && RS.title) || cfg.name || cfg.title || DATA.project || "";
  }
  // 分享链接 ?nick= 预置访客昵称（批注/意见署名 annoBy 消费同一键 kit_anno_name）
  try{
    const nk = new URLSearchParams(location.search).get("nick");
    if (nk) localStorage.setItem("kit_anno_name", nk);
  }catch(e){}
}
function bindPayload(payload){
  DATA = fillDataDefaults(payload.DATA);
  files = DATA.files || {}; RS = DATA.runstate;
  if (DATA.annos && RS) RS.annos = DATA.annos;
  EFF = payload.EFF || null;
  OVERLAY = payload.OVERLAY || null;
  OPTIMIZE = payload.OPTIMIZE || null;
  METRICS = payload.METRICS || null;
  rebuildFileVersions(); bindCanvas();
}
bindPayload(PAYLOAD);
/* 视图切换（原「项目下拉」位）：Flow=工作流画布；世界书=嵌入式 pedia 视图（同页互换，不跳页）。
   世界书数据由生成器内嵌（#wbdata，懒解析）；归纳层 graph.json 同步落盘；
   创作时 agent 直调入口 = 内核动词 worldbook_search（CLI/HTTP/MCP 三面同源）。
   独立 worldbook.html（pedia 原版白皮）仍由生成器产出，供外发/存档直读。 */
function switchView(mode){
  const wb = mode === "wb", chat = mode === "chat", ig = mode === "ig";
  document.getElementById("vt-flow").classList.toggle("on", mode === "flow");
  document.getElementById("vt-wb").classList.toggle("on", wb);
  document.getElementById("vt-ig").classList.toggle("on", ig);
  document.getElementById("vt-chat").classList.toggle("on", chat);
  document.getElementById("vt-flow").setAttribute("aria-selected", String(mode === "flow"));
  document.getElementById("vt-wb").setAttribute("aria-selected", String(wb));
  document.getElementById("vt-ig").setAttribute("aria-selected", String(ig));
  document.getElementById("vt-chat").setAttribute("aria-selected", String(chat));
  document.getElementById("stage").style.display = (wb || chat || ig) ? "none" : "";
  document.getElementById("bottombar").style.display = (wb || chat || ig) ? "none" : "";
  document.getElementById("wbstage").classList.toggle("on", wb);
  document.getElementById("igstage").classList.toggle("on", ig);
  document.getElementById("chatstage").classList.toggle("on", chat);
  if (wb){ wbInit(); wbReset(); wbPaint(); }
  else if (ig){ igInit(); }
  else if (chat){ chatInit(); }
  else { fitStage(); }
}
document.getElementById("vt-flow").addEventListener("click", () => switchView("flow"));
document.getElementById("vt-wb").addEventListener("click", () => switchView("wb"));
document.getElementById("vt-ig").addEventListener("click", () => switchView("ig"));
document.getElementById("vt-chat").addEventListener("click", () => switchView("chat"));
/* ---------- 立意图渲染器（intent-graph@1：分列思维导图 + 候选卡；p=剪枝排序分，禁当放行闸） ----------
   数据 = 生成器注入 #igdata（universes/<uid>/intent-graph.json 单源，project-pages.py 拉取）；
   页面只读——commit/exclude/sync 走内核 ig_* 动词（agent 提案制，人拍板），面板不发明第二套写路径。 */
const IGSTAGE = { inited:false, data:null };
function igInit(){
  if (IGSTAGE.inited) return;
  IGSTAGE.inited = true;
  try { IGSTAGE.data = JSON.parse(document.getElementById("igdata").textContent); }
  catch(e){ IGSTAGE.data = { bound:false, reason:"igdata 解析失败" }; }
  igPaint();
}
function igPaint(){
  const cols = document.getElementById("ig-cols"), empty = document.getElementById("ig-empty");
  const meta = document.getElementById("ig-meta");
  const d = IGSTAGE.data;
  if (!d || !d.bound || !Array.isArray(d.nodes) || d.nodes.length === 0){
    cols.style.display = "none"; empty.style.display = "";
    empty.innerHTML = "本页绑定的项目尚未关联宇宙立意图（或宇宙图还是空的）。" +
      "<br><br>立意图存的是「可能是什么」：候选 + 剪枝排序分 + 证据，committed 后经 ig_sync 单向落项目决策。" +
      "<br><br>开图：<code>python tools/intent-graph.py init --universe u-&lt;名&gt; --title &lt;宇宙名&gt;</code>" +
      "<br>绑定本项目：<code>python tools/intent-graph.py bind --project " + wbEsc(DATA.project) + " --universe u-&lt;名&gt;</code>" +
      "<br>方案细节：<code>docs/方案盘-立意图三层架构与laya决策层-20260924.md</code>" +
      (d && d.reason ? "<br><br><span style='color:#8c352c'>注：" + wbEsc(d.reason) + "</span>" : "");
    if (meta) meta.textContent = "";
    return;
  }
  cols.style.display = ""; empty.style.display = "none";
  if (meta) meta.textContent = d.universe + " · " + (d.stats ? (d.stats.nodes + " 节点 / " + d.stats.committed + " 已定 / " + d.stats.candidates + " 候选") : "");
  // 分列：depth 0 = 根，逐 parent 链推深度；同深度一列（思维导图横向展开）
  const depth = {}, kids = {};
  (d.nodes || []).forEach(n => { kids[n.parent || ""] = kids[n.parent || ""] || []; kids[n.parent || ""].push(n); });
  const maxDepth = (() => { let m = 0; const walk = (pid, dp) => { (kids[pid] || []).forEach(n => { depth[n.id] = dp; m = Math.max(m, dp); walk(n.id, dp + 1); }); }; walk("", 0);
    // 悬空节点（parent 不在图内）落到深度 0，不静默丢
    (d.nodes || []).forEach(n => { if (depth[n.id] === undefined){ depth[n.id] = 0; } }); return m; })();
  const stMap = { committed:"✅", open:"◻", excluded:"❌" };
  let html = "";
  for (let dp = 0; dp <= maxDepth; dp++){
    const colNodes = (d.nodes || []).filter(n => depth[n.id] === dp);
    if (!colNodes.length) continue;
    html += "<div class='ig-col'><div class='ig-depth'>" + (dp === 0 ? "根 · 立意" : "第 " + dp + " 层") + " · " + colNodes.length + "</div>";
    colNodes.forEach(n => {
      html += "<div class='ig-node " + wbEsc(n.status) + "'>" +
        "<span class='nk'>" + wbEsc(n.kind) + "</span> <span style='font-size:10px;color:var(--ink-3)'>" + (stMap[n.status] || "◻") + "</span>" +
        "<div class='nt'>" + wbEsc(n.title) + "</div>" +
        (n.content ? "<div class='nc'>" + wbEsc(n.content) + "</div>" : "") +
        (n.decision_key ? "<div class='dk'>⇒ decision:" + wbEsc(n.decision_key) + "</div>" : "");
      const cands = n.candidates || [];
      if (cands.length){
        html += "<div class='ig-cand'>";
        cands.forEach(c => {
          const hasP = c.p !== undefined && c.p !== null;
          html += "<div class='crow " + wbEsc(c.status) + "'>" +
            "<span class='cdot'></span>" +
            "<span class='ct'>" + wbEsc(c.title || c.id) + "</span>" +
            (c.scorer ? "<span class='sc'>" + wbEsc(c.scorer) + "</span>" : "") +
            "<span class='pv'>" + (hasP ? "p=" + c.p : "") + "</span></div>";
          if (hasP) html += "<div class='pbar'><i style='width:" + Math.round(c.p * 100) + "%'></i></div>";
          if (c.status === "excluded" && c.excluded_reason) html += "<div class='why'>排除：" + wbEsc(c.excluded_reason) + "</div>";
          else if (c.evidence) html += "<div class='why'>" + wbEsc(c.evidence) + "</div>";
        });
        html += "</div>";
      }
      html += "</div>";
    });
    html += "</div>";
  }
  cols.innerHTML = html;
}
/* ---------- 世界书嵌入式渲染器（版式=pedia，配色=工作台主题；导航栈 + 统一「← 返回」） ---------- */
const WBSTAGE = { inited:false, stack:[], data:null, ents:[], rels:[], stats:{}, byId:{}, adj:{}, cats:[] };
function wbInit(){
  if (WBSTAGE.inited) return;
  WBSTAGE.inited = true;
  try { WBSTAGE.data = JSON.parse(document.getElementById("wbdata").textContent); }
  catch(e){ WBSTAGE.data = { book:"世界书", graph:{} }; }
  const G = WBSTAGE.data.graph || {};
  WBSTAGE.ents = G.entries || []; WBSTAGE.rels = G.relations || []; WBSTAGE.stats = G.stats || {};
  WBSTAGE.ents.forEach(e => { WBSTAGE.byId[e.id] = e; });
  WBSTAGE.rels.forEach(r => {
    if (!WBSTAGE.byId[r.a] || !WBSTAGE.byId[r.b]) return;
    (WBSTAGE.adj[r.a] = WBSTAGE.adj[r.a] || []).push({ with:r.b, w:r.weight, src:r.src });
    (WBSTAGE.adj[r.b] = WBSTAGE.adj[r.b] || []).push({ with:r.a, w:r.weight, src:r.src });
  });
  Object.values(WBSTAGE.adj).forEach(l => l.sort((a,b) => b.w - a.w));
  WBSTAGE.cats = [...new Set(WBSTAGE.ents.map(e => e.cat))];
  const titles = WBSTAGE.ents.filter(e => e.title && e.title.length >= 2)
    .map(e => e.title).sort((a,b) => b.length - a.length).slice(0, 120);
  WBSTAGE.linkMap = WBSTAGE.ents.filter(e => e.title && e.title.length >= 2).reduce((m,e) => (m[e.title] = e.id, m), {});
  WBSTAGE.linkRe = titles.length ? new RegExp("(" + titles.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g") : null;
  const CAT_COLOR = { "人物":"#3366cc", "设定":"#096c39", "势力":"#8a6d1a", "场景":"#5e2d8a", "道具":"#a5433a", "伏笔":"#b85c00", "底牌":"#096c39", "总览":"#72777d", "分集账":"#2a4d8a", "时间线":"#2a4d8a" };
  WBSTAGE.catColor = c => CAT_COLOR[c] || "#54595d";
  document.getElementById("wb-title").textContent = `世界书 · ${WBSTAGE.data.book || DATA.project}`;
  document.getElementById("wb-back").onclick = wbBack;
  document.getElementById("wb-q").addEventListener("keydown", ev => {
    if (ev.key === "Enter" && ev.target.value.trim()) wbGo({ view:"search", q:ev.target.value.trim() });
  });
  renderWbSide();
}
function wbReset(){ WBSTAGE.stack = [{ view:"home" }]; }
function wbGo(v){ WBSTAGE.stack.push(v); wbPaint(); }
function wbBack(){
  if (WBSTAGE.stack.length > 1){ WBSTAGE.stack.pop(); wbPaint(); }
  else switchView("flow");   // 统一返回：世界书根级 ← = 回 Flow 工作流
}
function wbEsc(s){ return s == null ? "" : String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function wbMd(text){
  let t = wbEsc(text);
  if (WBSTAGE.linkRe) t = t.replace(WBSTAGE.linkRe, m => `<a class="wl" data-e="${WBSTAGE.linkMap[m] || ""}">${m}</a>`);
  const inline = s => s
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, id, label) => `<a class="wl" data-e="${id.trim()}">${wbEsc(label || id)}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let html = "", inList = false;
  for (const ln of t.split(/\r?\n/)){
    const h = ln.match(/^(#{1,3})\s+(.*)$/);
    if (h){ if (inList){ html += "</ul>"; inList = false; } html += h[1].length === 1 ? `<h2>${inline(h[2])}</h2>` : `<div style="font-weight:700;margin:12px 0 5px">${inline(h[2])}</div>`; continue; }
    if (/^[-*]\s+/.test(ln)){ if (!inList){ html += '<ul class="tight">'; inList = true; } html += `<li>${inline(ln.replace(/^[-*]\s+/, ""))}</li>`; continue; }
    if (inList){ html += "</ul>"; inList = false; }
    if (/^>\s?/.test(ln)){ html += `<div class="quote" style="border-left:3px solid var(--line-paper);background:var(--bg-paper);padding:7px 12px;margin:0 0 7px;font-size:calc(12.5px*var(--fs,1))">${inline(ln.replace(/^>\s?/, ""))}</div>`; continue; }
    if (!ln.trim()) continue;
    html += `<p>${inline(ln)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

  const cls = e.status === "active" ? "st-active" : e.status === "retired" ? "st-retired" : "st-draft";
  return `<span class="status-badge ${cls}" title="状态机 draft → active → retired">${zh}</span>`;
}

/* ---------- 对话（pi-agent）：会话管理 + 工具环 SSE 消费（Cursor 式交互，工作台主题） ----------
   后端 = 内核 HTTP 面 /api/projects/<id>/agent/*（会话 CRUD + turn SSE）；
   agent 工具 = miniflow 动词白名单 ∷ 项目文件系统 ∷ flow-lint ∷ MCP（.external/agent-mcp.json）；
   模型凭据只进 .external/agent-model.json（git 忽略区）——面板只显示掩码。 */
const CHAT = { inited:false, sessions:[], cur:null, streaming:false, api:(DATA.agentApi || "") + "/api/projects/" + encodeURIComponent(DATA.project) + "/agent", pendingCards:{} };
const EXEC_API = DATA.agentApi || "http://127.0.0.1:8431";   // 执行器守护进程（storyharness serve）

/* chatMd：对话用轻量 markdown（wbMd 去世界书内链；克制品：标题/列表/引用/粗体/行内码/外链） */
function chatMd(text){
  const inline = s => {
    const e = wbEsc(s == null ? "" : String(s));
    return e
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  };
  let html = "", inList = false;
  for (const ln of String(text == null ? "" : text).split(/\r?\n/)){
    const h = ln.match(/^(#{1,3})\s+(.*)$/);
    if (h){ if (inList){ html += "</ul>"; inList = false; } const tag = h[1].length === 1 ? "h1" : h[1].length === 2 ? "h2" : "h3"; html += `<${tag}>${inline(h[2])}</${tag}>`; continue; }
    if (/^[-*]\s+/.test(ln)){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(ln.replace(/^[-*]\s+/, ""))}</li>`; continue; }
    if (inList){ html += "</ul>"; inList = false; }
    if (/^>\s?/.test(ln)){ html += `<blockquote>${inline(ln.replace(/^>\s?/, ""))}</blockquote>`; continue; }
    if (!ln.trim()) continue;
    html += `<p>${inline(ln)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}
function chatAddMsg(who, text, cls, md){
  const box = document.getElementById("chat-msgs");
  const w = document.createElement("div"); w.className = "cm " + (cls || "");
  w.innerHTML = `<div class="who">${wbEsc(who)}</div><div class="body"></div>`;
  const body = w.querySelector(".body");
  if (md){ body.classList.add("md"); body.innerHTML = chatMd(text); } else body.textContent = text;
  box.appendChild(w); box.scrollTop = box.scrollHeight;
  return { body, close(){ body.classList.remove("streaming"); }, setMd(t){ body.classList.add("md"); body.innerHTML = chatMd(t); } };
}
function chatAddToolCard(name, args){
  const box = document.getElementById("chat-msgs");
  const w = document.createElement("div"); w.className = "ctool";
  w.innerHTML = `<div class="ch"><span>🔧</span><span class="nm">${wbEsc(name)}</span><span class="st"><span class="spinner"></span> 执行中</span></div><div class="cb"></div>`;
  let argsTxt = args;
  try { argsTxt = JSON.stringify(JSON.parse(args), null, 1); } catch { /* 原样 */ }
  const head = w.querySelector(".ch"), cb = w.querySelector(".cb"), st = w.querySelector(".st");
  cb.textContent = "参数：\n" + argsTxt;
  head.addEventListener("click", () => w.classList.toggle("open"));
  box.appendChild(w); box.scrollTop = box.scrollHeight;
  return { setResult(content, ok){ cb.textContent += "\n\n── 结果 ──\n" + content; st.innerHTML = ok === null ? "<span class=\"spinner\"></span> 执行中" : (ok ? "✓ 完成" : "✗ 失败"); st.style.color = ok === false ? "#8c352c" : ""; box.scrollTop = box.scrollHeight; } };
}

  document.getElementById("chat-new").onclick = async () => {
    try { const s = await (await fetch(chatApi("/sessions"), { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" })).json(); await loadChatSessions(); openChatSession(s.id); }

  };

  document.getElementById("chat-search").addEventListener("input", ev => { CHAT.q = ev.target.value; loadChatSessions(); });
  document.getElementById("chat-input").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); chatSend(); } });
  // 模型配置弹层（凭据只写 .external/——git 忽略区，永不入库）
  const pop = document.createElement("div"); pop.id = "chat-config";
  pop.innerHTML = `<div class="cap">模型端点（OpenAI 兼容；如 Z.ai GLM）</div>
    <input id="cf-base" placeholder="https://api.z.ai/api/paas/v4">
    <div class="cap">模型 id</div><input id="cf-model" placeholder="glm-4.6">
    <div class="cap">API Key（只写 .external/agent-model.json，不入库）</div><input id="cf-key" type="password" placeholder="留空 = 沿用已存/环境变量">
    <button class="bt" id="cf-save" style="border-color:var(--accent);color:var(--accent);font-weight:700">保存</button>
    <div class="note">也可用环境变量 MINIFLOW_AGENT_BASE_URL / MINIFLOW_AGENT_MODEL / MINIFLOW_AGENT_KEY（优先级更高）。</div>`;
  document.getElementById("chatstage").appendChild(pop);
  document.getElementById("chat-model-chip").addEventListener("click", async () => {
    pop.style.display = pop.style.display === "block" ? "none" : "block";
    if (pop.style.display === "block"){
      try { const m = await (await fetch((DATA.agentApi || "") + "/api/agent/model")).json();
        document.getElementById("cf-base").value = m.baseUrl || "";
        document.getElementById("cf-model").value = m.model || "";
      } catch { /* 离线 */ }
    }
  });
  document.getElementById("cf-save").addEventListener("click", async () => {
    const body = { baseUrl: document.getElementById("cf-base").value.trim(), model: document.getElementById("cf-model").value.trim() };
    const key = document.getElementById("cf-key").value.trim();
    if (key) body.apiKey = key;
    const r = await fetch((DATA.agentApi || "") + "/api/agent/model", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }).then(x => x.json()).catch(() => null);
    if (r && r.ok){ pop.style.display = "none"; refreshModelChip(); }
    else alert("保存失败：" + ((r && r.error) || "离线"));
  });
  await refreshModelChip();
  await loadChatSessions();
  // 执行器守护进程接驳：storyharness serve（默认 8431，web 模式经 DATA.agentApi 同脑）可选直驱批循环
  const exBtn = document.getElementById("chat-exec");
  if (exBtn) {
    exBtn.style.display = "";
    exBtn.onclick = async () => {
      try {
        const s = await (await fetch(EXEC_API + "/status")).json();
        chatAddMsg("执行器", `守护进程在线：项目 ${s.project}${s.running ? "，批循环运行中" : "，空闲"}${s.last?.stopped ? "，上次停止原因：" + s.last.stopped : ""}（已跑 ${s.last?.ran ?? 0} 节点）`);
        const b = document.createElement("button");
        b.className = "bt"; b.textContent = s.running ? "运行中…" : "▶ 跑一批（真实执行）";
        b.style.marginTop = "6px";
        b.onclick = async () => {
          if (s.running || !confirm(`对 ${s.project} 启动一批真实执行？（会消耗模型额度）`)) return;
          b.disabled = true; b.textContent = "已启动";
          await fetch(EXEC_API + "/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {});
          const finExec = async () => {
            b.textContent = "▶ 再跑一批"; b.disabled = false;
            try { const st = await (await fetch(EXEC_API + "/status")).json(); chatAddMsg("执行器", "批循环结束" + (st.last?.stopped ? "（" + st.last.stopped + "）" : "") + "——共 " + (st.last?.ran ?? 0) + " 节点" + (st.last?.telemetry ? "，遥测 " + st.last.telemetry : "")); } catch { chatAddMsg("执行器", "批循环结束（状态拉取失败）"); }
          };
          const startPolling = () => {
            const poll = setInterval(async () => {
              try {
                const st = await (await fetch(EXEC_API + "/status")).json();
                if (!st.running){ clearInterval(poll); await finExec(); }
                else b.textContent = "运行中 · 已跑 " + (st.last?.ran ?? 0) + " 节点 / " + (st.last?.batches ?? 0) + " 批";
              } catch { /* 单次拉取失败容忍 */ }
            }, 3000);
          };
          let esFail = 0;
          try {
            const es = new EventSource(EXEC_API + "/events");
            es.onmessage = (m) => {
              let ev; try { ev = JSON.parse(m.data); } catch { return; }
              if (ev.event === "node_start") b.textContent = "运行中 · " + (ev.node || "");
              else if (ev.event === "node_end" && ev.ok) b.textContent = "运行中 · 已完成 " + (ev.node || "");
              else if (ev.event === "run_end" || ev.event === "final"){ es.close(); finExec(); }
            };
            es.onerror = () => { esFail += 1; if (esFail >= 2){ es.close(); startPolling(); } };
          } catch { startPolling(); }
        };
        chatAddMsg("执行器", "").body.appendChild(b);
      } catch (e) {
        chatAddMsg("执行器", "执行器守护进程不在线——启动：storyharness serve --port 8431");
      }
      document.getElementById("chat-msgs").scrollTop = document.getElementById("chat-msgs").scrollHeight;
    };
  }
  if (!LIVE.on){
    const box = document.getElementById("chat-msgs");
    box.innerHTML = `<div class="cm"><div class="who">系统</div><div class="body err">当前以 file:// 打开（无后端）——对话需要内核 HTTP 面：起 <code>miniflow up</code>（页面走 http://127.0.0.1:8421/projects/&lt;id&gt;/workflow.html）后刷新本页。</div></div>`;
    document.getElementById("chat-input").disabled = true;
    document.getElementById("chat-send").disabled = true;
  }
}

async function chatSend(){
  if (CHAT.streaming) return;
  if (!CHAT.cur){
    document.getElementById("chat-new").click();
    if (!CHAT.cur) return;
  }
  const inp = document.getElementById("chat-input");
  const text = inp.value.trim();
  if (!text) return;
  CHAT.streaming = true;
  inp.value = ""; inp.disabled = true;
  document.getElementById("chat-send").disabled = true;
  chatAddMsg("我", text, "user");
  let turn = chatAddMsg("pi-agent", "", "assistant");
  turn.body.classList.add("streaming");
  let thinkEl = null;
  const scrollDown = () => { const b = document.getElementById("chat-msgs"); b.scrollTop = b.scrollHeight; };
  try {
    const resp = await fetch(chatApi(`/sessions/${CHAT.cur}/turn`), { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ text }) });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "", full = "", lastR = 0;
    const closeTurn = () => { if (full) turn.setMd(full); turn.body.classList.remove("streaming"); if (!turn.body.textContent.trim()) turn.body.parentElement?.remove(); };
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of frame.split("\n")){
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data) continue;
          if (data === "[DONE]"){ closeTurn(); continue; }
          let ev; try { ev = JSON.parse(data); } catch { continue; }
          if (ev.type === "delta"){ full += ev.text; const _n = Date.now(); if (_n - lastR > 400){ lastR = _n; turn.setMd(full); } scrollDown(); }
          else if (ev.type === "tool_call"){
            if (thinkEl){ thinkEl.body.classList.remove("streaming"); thinkEl = null; }
            closeTurn(); full = "";
            const card = chatAddToolCard(ev.name, ev.args);
            CHAT.pendingCards[ev.id] = card;
            card.setResult("", null);
            turn = chatAddMsg("pi-agent", "", "assistant");
            turn.body.classList.add("streaming");
          }
          else if (ev.type === "tool_result"){ const c = CHAT.pendingCards[ev.id]; if (c) c.setResult(ev.content, ev.ok); }
          else if (ev.type === "thinking_delta"){
          if (!thinkEl){
            thinkEl = chatAddMsg("🧠 思维链", "", "assistant");
            thinkEl.body.classList.add("streaming");
          }
          thinkEl.body.textContent += ev.text;
          scrollDown();
        }
        else if (ev.type === "done"){ closeTurn(); }
          else if (ev.type === "error"){ closeTurn(); turn.body.classList.add("err"); turn.body.textContent = ev.message; }
        }
      }
    }
    closeTurn();
    await loadChatSessions();
  } catch(e){
    turn.body.classList.remove("streaming");
    turn.body.classList.add("err");
    turn.body.textContent = "连接失败：" + e.message + "（对话需内核 HTTP 面：miniflow up）";
  }
  CHAT.streaming = false;
  inp.disabled = false;
  document.getElementById("chat-send").disabled = false;
  inp.focus();
}

/* ---------- 布局：模块横向拼接 ｜ 模块内竖向主轴 ｜ 插件左分支 ｜ 连接件在模块缝 ----------
   数据源唯一：DATA.modules（payload 契约「画布布局的唯一来源」）；EFF.links 只出连接件的模式与裁决态。 */
const NW=196, NH=76, GY=64, MG=44;
const PLUGIN_DX=24;                       // 插件分支：骨架主轴左侧的偏移
const SPINE_DX=PLUGIN_DX+NW+18;           // 主轴相对模块带左缘的偏移（≥插件宽度，两列不相交）
const MOD_GAP=132;                        // 模块缝宽：连接件走这里
const MODULE_PALETTE=["#5e7d5a","#4f6d8c","#9c6b4a","#7d5f8a","#a5546b","#5f7d7d","#8c6d4f","#6b4f7d"];
let pos = {};
let moduleBand = {}, moduleLinks = [], nodeMeta = {}, parCols = new Set();
const moduleColor = i => MODULE_PALETTE[i % MODULE_PALETTE.length];
function autoLayout(){
  pos = {}; moduleBand = {}; moduleLinks = []; nodeMeta = {}; parCols = new Set();
  const SIDE_W = 168 + 18;   // 支线列宽（虚线卡 + 间距）；模块间距统一放宽，连接件缝不受影响
  const insts = DATA.modules || [];
  // 主线/支线（09-22）：产线节点（有产物声明或已有快照）在主轴列；
  // 底座核查件（kit=base：质量扫描/台账切片/结算/对账——确定性工具箱，收据不属交付文线）上右侧支线列。
  // 门（gate）保留主线：人工裁决点必须显眼。
  const isSide = nid => {
    const m = nodes[nid] || {};
    if (m.kind === "gate") return false;
    const k = kitOpOf(m);
    if (k && k.kit === "base") return true;
    if (m.output) return false;
    if ((DATA.snapshots && DATA.snapshots[nid] || []).length) return false;
    return true;
  };
  insts.forEach((inst, i) => {
    const spineSet = new Set(inst.spine || []);
    const pluginSet = new Set(inst.plugins || []);
    const allNodes = [...new Set([...(inst.nodes || inst.spine || []), ...(inst.plugins || [])])];
    const bx = MG + i*(SPINE_DX+NW+MOD_GAP+SIDE_W);
    moduleBand[inst.id] = {from: bx, to: bx + SPINE_DX + NW, index: i, inst,
                           color: moduleColor(i)};
    allNodes.forEach((nid, k) => {
      const plugin = pluginSet.has(nid);
      const side = isSide(nid);   // 支线判定优先于插件：底座核查件即使以插件形态插入也上支线
      if (side) moduleBand[inst.id].to += SIDE_W;
      nodeMeta[nid] = {instId: inst.id, index: i, plugin, side, color: moduleColor(i)};
      pos[nid] = [bx + (side ? SPINE_DX + NW + 18 : plugin ? PLUGIN_DX : SPINE_DX), MG + 56 + k*(NH+GY)];
    });
  });
  // 连接件：相邻模块之间铸一个（EFF.links 为内核事实源），画在模块缝上，锚住目标模块入口行
  ((EFF && EFF.links) || []).forEach(l => {
    const from = moduleBand[l.fromModule], to = moduleBand[l.toModule];
    if (!from || !to) return;
    const first = ((DATA.modules[to.index] || {}).spine || []).find(nid => pos[nid]);
    const y = first ? pos[first][1] + NH/2 : MG + 56 + NH/2;
    moduleLinks.push({id: l.id, mode: l.mode || "auto", state: l.state || "pending",
                      x1: from.to + 6, x2: to.from - 6, y, fromModule: l.fromModule, toModule: l.toModule});
  });
  // EFF 里有、DATA.modules 没覆盖的节点（内核先行/数据不同步）：显式可见，不静默丢弃
  const orphans = Object.keys(nodes).filter(nid => !pos[nid] && !nid.endsWith(".link"));
  if (orphans.length){
    const bx = MG + insts.length*(SPINE_DX+NW+MOD_GAP+SIDE_W);
    orphans.forEach((nid, k) => {
      nodeMeta[nid] = {instId: "?", index: insts.length, plugin: false, color: "#b8b0a4", orphan: true};
      pos[nid] = [bx + SPINE_DX, MG + 56 + k*(NH+GY)];
    });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在模块；无选中则取第一个未完成模块 */
function currentStageId(){
  const cur = sel || lastSel;
  if (cur && nodeMeta[cur]) return nodeMeta[cur].instId;
  for (const inst of (DATA.modules||[])){
    if ((inst.spine||[]).some(x => st(x) !== "done")) return inst.id;
  }
  return ((DATA.modules||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = moduleBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    if (pt[0] >= band.from && pt[0] <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (DATA.modules||[]).map(s=>s.id);
  if (!ids.length) return;
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- flow@3 派生图求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：when 只认结构化谓词（flow@1 字符串形态已随 v4.0.0 处决），不硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || "flow"; }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};

  {

    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;

    if (w.cause!==undefined){

    if (w.input!==undefined){

      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};

function whenText(w){

  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);

  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");

  // 模块带：纵向色带（原横向阶段带）+ 顶栏「NN · 工种 · 能力 n/m」+ 骨架主轴细线
  for (const [instId, b] of Object.entries(moduleBand)){
    const caps = b.inst.caps || [], en = b.inst.capsEnabled || [];
    const bh = Math.max(maxR+NH+MG, MG+56+((b.inst.spine||[]).length)*(NH+GY));
    s += `<rect x="${b.from-18}" y="16" width="${b.to-b.from+36}" height="${bh-16}" rx="10" fill="${b.color}" opacity="0.05"/>`;
    s += `<line x1="${b.from+SPINE_DX+NW/2}" y1="52" x2="${b.from+SPINE_DX+NW/2}" y2="${bh-24}" stroke="${b.color}" stroke-width="1" stroke-dasharray="2,5" opacity="0.5"/>`;
    s += `<text class="stage-name" data-module="${instId}" style="cursor:pointer" x="${b.from-8}" y="34" fill="${b.color}">${String(b.index+1).padStart(2,"0")} ${b.inst.name||instId} · 能力 ${en.length}/${caps.length}${b.inst.link==="manual"?" · 待人工":""}</text>`;
  }
  // 派生边：模块内 = 竖向三次贝塞尔（控制点取 y 中点）；跨模块直连 = 横向贝塞尔。
  // 与 <x>.link 相关的跳线不画——连接件语义由下面的模块缝承载，避免双线。
  const cctx = condCtx();   // 一次求值上下文，全图共用
  for (const e of edges){
    if (!pos[e.from] || !pos[e.to]) continue;
    if (e.from.endsWith(".link") || e.to.endsWith(".link")) continue;
    const [x1,y1] = pos[e.from], [x2,y2] = pos[e.to];
    const role=edgeRole(e);
    const active = evalWhen(e.when, cctx).active;   // 与内核 cond.ts 同源求值，不再嗅探 when 字符串
    const lab = [whenText(e.when), EDGE_ROLE_ZH[role]||""].filter(Boolean).join(" · ");
    let d, lx, ly;
    if ((nodeMeta[e.from]||{}).index === (nodeMeta[e.to]||{}).index){
      const sx=x1+NW/2, sy=y1+NH, tx=x2+NW/2, ty=y2, my=(sy+ty)/2;
      d = `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
      lx = tx+8; ly = my;
    } else {
      const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;
      d = `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      lx = mx; ly = sy-6;
    }
    // 可见线自身不接事件（1.4px 热区点不中）——上叠一条 14px 透明命中路径（.edge-hit）
    s += `<path d="${d}" fill="none" stroke="#a89f90" stroke-width="1.4"${(e.when||role!=="flow")?' stroke-dasharray="5,4"':""} opacity="${active?0.9:0.35}" marker-end="url(#arw)" pointer-events="none"/>`;
    s += `<path class="edge-hit" data-e="${e.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"/>`;
    if (lab) s += `<text class="edge-label" x="${lx}" y="${ly}" text-anchor="start">${lab}</text>`;
  }
  // 连接件（模块缝）：auto = 灰色虚线；manual = 金色实线 + 徽章；点击看连接件页（linkPaper）
  const LINK_ZH = {pending:"待人工", passed:"已放行", rejected:"已驳回 · 重跑上游"};
  moduleLinks.forEach(l => {
    const manual = l.mode === "manual";
    const col = manual ? "#b8a464" : "#a89f90";
    // 缝线热区同样放宽，且命中直达 linkPaper（openEdgeDoc 查 graph.edges，缝线 id 查不到 = 点了没反应）
    s += `<path d="M${l.x1},${l.y} L${l.x2},${l.y}" fill="none" stroke="${col}" stroke-width="${manual?2.2:1.4}"${manual?"":' stroke-dasharray="6,5"'} opacity="${manual?0.95:0.6}" ${manual?"":'marker-end="url(#arw)"'} pointer-events="none"/>`;
    s += `<path class="edge-hit" data-linkid="${l.id}" d="M${l.x1},${l.y} L${l.x2},${l.y}" fill="none" stroke="transparent" stroke-width="16"/>`;
    const label = manual ? (LINK_ZH[l.state]||"待人工") : "自动";
    const wpx = label.length*13+16, mx2 = (l.x1+l.x2)/2;
    s += `<rect data-linkid="${l.id}" x="${mx2-wpx/2}" y="${l.y-12}" width="${wpx}" height="24" rx="12" fill="#fbf7ee" stroke="${col}" stroke-width="1.2" style="cursor:pointer"/>`
       + `<text data-linkid="${l.id}" class="edge-label" x="${mx2}" y="${l.y+4}" text-anchor="middle" fill="${manual?"#8a7434":"#7d7568"}" style="cursor:pointer">${l.mode==="manual"?"⏸ ":""}${label}</text>`;
  });
  svg.innerHTML = s + "</svg>";
  svg.querySelectorAll(".edge-hit[data-e]").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openEdgeDoc(p.dataset.e); });
  });
  svg.querySelectorAll(".stage-name[data-module]").forEach(el=>{
    el.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openModulePaper(el.dataset.module); });
  });
  svg.querySelectorAll("[data-linkid]").forEach(el=>{
    el.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openLinkPaper(el.dataset.linkid); });
  });
}

function startDrag(e, n){

function dragMove(e){
  // 3px 内不算拖动：纯点击绝不能在 mousedown~click 之间重建 DOM，
  // 否则原节点元素被拆除，click 派发到游离元素上丢失，select 永不触发
  if (!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 3) return;
  drag.moved = true;
  const k = view.k;
  pos[drag.n] = [Math.round(drag.ox + (e.clientX-drag.sx)/k), Math.round(drag.oy + (e.clientY-drag.sy)/k)];
  render();
}

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function bindVerdict(n){

    if (!sts.length){
      // flow@3 语义：模块验收驳回 = 整个上游模块回退重跑（连接件驳回的等价操作）
      const myMid=(nodes[n]||{}).module||(nodes[n]||{}).stage;
      const inst=(DATA.modules||[]).find(x=>x.id===myMid);
      const firstNode=(inst&&inst.spine&&inst.spine[0])||Object.keys(nodes).find(x=>(nodes[x].stage||nodes[x].module)===myMid);
      if (firstNode && RS.nodes[firstNode]){
        Object.keys(nodes).forEach(x=>{
          if ((nodes[x].stage||nodes[x].module)===myMid && RS.nodes[x] && !nodes[x].gate_role){
            RS.nodes[x].status="pending"; RS.nodes[x].round=(RS.nodes[x].round||1)+1;
          }
        });
        const order=Object.keys(nodes);
        const ti=order.indexOf(firstNode);
        order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
        RS.nodes[n].root_cause_module=myMid;
      }
      render(); openNodeDoc(n); return;
    }
    const rootId=rootSel?rootSel.value:(sts[0]&&sts[0].id);
    const ri=sts.findIndex(s=>s.id===rootId);
    RS.nodes[n].root_cause_stage=rootId;
    (sts[ri]&&(sts[ri].nodes||[])).forEach(nid=>{ if (RS.nodes[nid]) { RS.nodes[nid].status="pending"; RS.nodes[nid].round=(RS.nodes[nid].round||1)+1; } });
    const order=Object.keys(nodes);
    const firstOfStage=sts[ri]&&sts[ri].nodes&&sts[ri].nodes[0];
    const ti=order.indexOf(firstOfStage||order[0]);
    order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });
    render(); openNodeDoc(n);
  };
}

function budgetZonePaper(){

  for (const g of groups){

        + `<span class="cfg-badge${inProj || fromPolicy ? " on" : ""}">${escapeHtml(badge)}</span>`
        + `<span class="msg">生效 ${escapeHtml(String(eff))} · 区间 ${escapeHtml(range)} · 消费方 ${escapeHtml(d.consumer || "-")}</span>`
        + `</span></div>`

  h += `<p class="msg">留空 = 出厂默认（不写进配置）· 填值 = 只覆盖该键 · 越界/未知键内核会响亮报错。保存后需再 flow_run 一次才会体现在本页显示值。</p>`;
  h += `</div>`;
  return h;

/* ==================== OS-04 余量 · 项目配置模板库 ====================

function tplZoneHtml(){

/** 模板库动词调用（唯一入口；错误消息原样回显内核 message，不吞） */
async function tplVerb(body){

    if (!r.ok) throw new Error(j.message || j.error || ("HTTP " + r.status));

async function tplSaveAs(){

async function tplApply(name){

/** 表单 → 对象。空串一律**不进参**（= 不表态，让内核回退 flow 默认） */
function readConfigForm(){

/** 统一保存路径：内核校验优先，离线降级为文件写并**显式说明** */

  if (LIVE.on){

        {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(obj)});
      const j = await r.json().catch(() => ({}));
