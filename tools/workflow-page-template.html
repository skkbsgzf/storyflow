<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流画布 · __TITLE__</title>
<style>
*{box-sizing:border-box}
:root{--diff-del-bg:rgba(122,72,46,.12);--diff-del-bd:#9a5b38;--diff-del-ink:#6e3f26;--diff-add-bg:rgba(63,109,74,.12);--diff-add-bd:#4a7a58;--diff-add-ink:#3f6d4a;--r-s:4px;--r-m:7px;--r-l:10px;--ctl-h:26px;--ctl-px:11px;--fs:1;
  --font-ui:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-doc:var(--font-ui);
  --bg-app:#f4f1ea;--bg-chrome:#fbfaf7;--bg-stage:#faf8f3;--dot:#e7e2d6;
  --bg-docpanel:#eee8da;--bg-paper:#fffdf9;--bg-ctl:#fff;--bg-node:#fff;
  --line:#d9d2c5;--line-node:#d3ccc0;--line-paper:#e4ddcd;
  --ink:#262420;--ink-2:#4a453c;--ink-3:#8a8375;
  --bg-code:#efece3;--bg-cmt:#f6f3ea;--bg-th:#f3efe6;--bg-vbar:#fbf5f3;--accent:#a5433a}
html[data-font="serif"]{--font-doc:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
html[data-font="kai"]{--font-doc:'Kaiti SC','KaiTi','STKaiti',serif}
html[data-theme="ink"]{--diff-del-bg:rgba(205,128,96,.13);--diff-del-bd:#a06a4e;--diff-del-ink:#d89a76;--diff-add-bg:rgba(120,180,140,.11);--diff-add-bd:#5f9a74;--diff-add-ink:#8ec7a4;--bg-app:#171512;--bg-chrome:#201d18;--bg-stage:#1a1814;--dot:#2b2820;
  --bg-docpanel:#1e1b16;--bg-paper:#252119;--bg-ctl:#2c2820;--bg-node:#252119;
  --line:#3b362b;--line-node:#454035;--line-paper:#3b362b;
  --ink:#eae5d9;--ink-2:#cbc5b7;--ink-3:#8f8979;
  --bg-code:#332f26;--bg-cmt:#2e2a20;--bg-th:#2c2820;--bg-vbar:#2b2016;--accent:#c96a5c;color-scheme:dark}
html[data-theme="celadon"]{--diff-del-bg:rgba(150,80,60,.11);--diff-del-bd:#a06148;--diff-del-ink:#7e4330;--diff-add-bg:rgba(63,125,92,.13);--diff-add-bd:#3f7d5c;--diff-add-ink:#2f6248;--bg-app:#ecefec;--bg-chrome:#f8faf7;--bg-stage:#f0f3ee;--dot:#d9e0d6;
  --bg-docpanel:#e6ebe4;--bg-paper:#fbfdf9;--bg-ctl:#fff;--bg-node:#fbfdf9;
  --line:#ccd4cb;--line-node:#c3cdc2;--line-paper:#d5ddd2;
  --ink:#22271f;--ink-2:#454c42;--ink-3:#7d857a;
  --bg-code:#e8ede5;--bg-cmt:#eef3ea;--bg-th:#e9efe6;--bg-vbar:#eaf2ec;--accent:#3f7d5c}
:where(button,a,select,textarea,[tabindex]):focus-visible{outline:2px solid #a5433a;outline-offset:1px}
button,a,select,textarea{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){#docpanel .dh.flash{animation:none}*{transition:none!important}}
body{margin:0;height:100vh;display:flex;flex-direction:row;overflow:hidden;
     font-family:var(--font-ui);
     background:var(--bg-app);color:var(--ink)}
h1,.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
header{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:calc(15px*var(--fs,1));margin:0;font-weight:700;letter-spacing:1px;white-space:nowrap;flex-shrink:0;font-family:'Noto Serif SC','SimSun',serif}
header .brand{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;font-size:calc(15px*var(--fs,1));letter-spacing:2px;color:var(--accent)}
select#proj-switch{max-width:230px;text-overflow:ellipsis}
header .ver{font-size:calc(11px*var(--fs,1));color:#8a8375;white-space:nowrap;flex-shrink:0}
header .sp{flex:1}
button.tb,a.tb{border:1px solid #c9c1b2;background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
button.tb:hover,a.tb:hover{border-color:#8a8375;background:#f3efe6}
#canvas-col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg-stage);
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:28px 28px}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
.edge-hit{pointer-events:stroke;cursor:pointer}
.edge-label{font-size:calc(10px*var(--fs,1));fill:#8a8375;pointer-events:none}
.stage-rule{stroke-width:1.2;stroke-dasharray:1,4}
.stage-name{font-size:calc(12.5px*var(--fs,1));font-weight:700}
.node{position:absolute;width:196px;background:var(--bg-node);border:1px solid var(--line-node);border-radius:var(--r-m);cursor:grab;user-select:none;
      box-shadow:0 1px 2px rgba(60,50,30,.06)}
/* 隐形点击热区：整图适配下节点缩得很小，热区外扩 6px 保证可点 */
.node::after{content:'';position:absolute;inset:-6px}
.node.sel{outline:2px solid #262420;outline-offset:1px}
.node .accent{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0}
.node .hd{display:flex;align-items:center;gap:7px;padding:8px 10px 2px}
.node .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node .zh{font-size:calc(13.5px*var(--fs,1));font-weight:700;line-height:1.25}
.node .sub{padding:2px 10px 4px;font-size:calc(10.5px*var(--fs,1));color:#8a8375;line-height:1.4}
.node .out{position:absolute;top:-9px;right:-8px;background:#fff;border:1.5px solid #a5433a;color:#a5433a;
           font-size:calc(10.5px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:2px}
.node .par{font-size:calc(10.5px*var(--fs,1));border:1px solid #b8a464;color:#8a6b2a;background:#fdf9ee;border-radius:var(--r-s);padding:0 5px;margin-left:6px}
.node.k-gate{background:#fbf5f3;border:1.5px solid #a5433a}
.node.k-gate .zh{color:#8c352c}
/* R5 · kit 边界验收：全流程唯一保留的人工裁决点。金色双线，与域内自动放行的门明确区分开 */
.node.k-boundary{background:#fdf8ec;border:3px double #b8a464}
.node.k-boundary .zh{color:#7a5c1e}
.node.k-boundary .accent{background:#b8a464!important}
.node.k-boundary .bdg{position:absolute;top:-10px;left:-8px;background:#fdf8ec;border:1.5px solid #b8a464;color:#7a5c1e;
  font-size:calc(10px*var(--fs,1));font-weight:700;padding:0 6px;border-radius:var(--r-s);letter-spacing:1px}
/* R5 · 指标徽章：效率（被下游消费/成本）与命中率（注入标尺被引用比例） */
.node .mbs{position:absolute;top:-10px;left:8px;display:flex;gap:3px;pointer-events:none}
.mb{display:inline-block;font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 5px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap;font-variant-numeric:tabular-nums}
.mb.good{border-color:#5a8a5e;color:#3d6b45;background:#f2f8f2}
.mb.warn{border-color:#c9922e;color:#8a6b2a;background:#fdf9ee}
.mb.bad{border-color:#a5433a;color:#8c352c;background:#fbf1f0}
/* R5 · 内容配置项旋钮表 */
.knobs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.knob{border:1px solid var(--line-paper);border-left:3px solid var(--line-paper);border-radius:var(--r-s);padding:7px 10px;background:var(--bg-paper)}
.knob.chg{border-left-color:var(--accent);background:#fffaf4}
html[data-theme="ink"] .knob.chg{background:#2b2419}
.knob .kn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob .kn-h code{font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink)}
.knob .kn-v{font-size:calc(12.5*var(--fs,1));color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.knob .kn-s{font-size:calc(10px*var(--fs,1));border:1px solid var(--line);border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);margin-left:auto}
.knob .kn-s.src-overlay{border-color:var(--accent);color:var(--accent)}
.knob .kn-s.src-node{border-color:#c9922e;color:#8a6b2a}
.knob .kn-d{font-size:calc(11.5px*var(--fs,1));color:var(--ink-2);margin-top:3px;line-height:1.6}
.knob .kn-m{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin-top:2px;line-height:1.6}
.patched{font-family:ui-monospace,Consolas,monospace;font-size:calc(11.5px*var(--fs,1));background:var(--bg-code);
  border:1px solid var(--line-paper);border-radius:var(--r-s);padding:9px 11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.banner{margin:10px 22px 0;padding:9px 14px;border:1px solid var(--line-paper);border-left:3px solid #c9922e;border-radius:var(--r-s);
  background:#fdf9ee;color:#6b5a2a;font-size:calc(12px*var(--fs,1));line-height:1.7}
html[data-theme="ink"] .banner{background:#2a2418;color:#d9c88a}
.banner b{color:#8a6b2a}
html[data-theme="ink"] .banner b{color:#e0cd8f}
.st-done{background:#5a8a5e}.st-awaiting{background:#c9922e}.st-pending{background:#b05a4a}.st-none{background:#c9c1b2}
#hud{display:flex;gap:14px;font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#hud b{color:#3d382f}
#hud,#bottombar .zoom,.paper .doc-h,.paper .pf{font-variant-numeric:tabular-nums}
#docpanel{position:relative;width:min(44vw,780px);min-width:460px;border-left:1px solid var(--line);background:var(--bg-docpanel);display:flex;flex-direction:column}
#settings-pop{position:absolute;top:52px;right:10px;z-index:60;width:250px;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(40,32,16,.22);padding:12px 14px}
#settings-pop .set-cap{font-size:calc(11px*var(--fs,1));color:var(--ink-3);margin:8px 0 4px;letter-spacing:1px}
#settings-pop .set-cap:first-child{margin-top:0}
#settings-pop .set-opts{display:flex;gap:6px;flex-wrap:wrap}
#settings-pop .set-opts button{border:1px solid var(--line);background:var(--bg-ctl);color:var(--ink-2);border-radius:var(--r-s);padding:4px 12px;font-size:calc(12px*var(--fs,1));cursor:pointer}
#settings-pop .set-opts button:hover{border-color:var(--accent)}
#settings-pop .set-opts button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ob{font-size:calc(11px*var(--fs,1));color:var(--ink-3);line-height:1.8;word-break:break-all}
.ob .ok{color:#3d6b45;font-weight:700}
.ob .ob-url{color:var(--accent);cursor:pointer;text-decoration:underline}
#docpanel .dh{height:46px;padding:0 14px;background:var(--bg-chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
#docpanel .bt{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
#docpanel .dh .bt:hover{border-color:#8a8375;background:#f3efe6}
#docpanel .dh b.dt{font-size:calc(15px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;letter-spacing:.5px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpanel .dh.flash{animation:dhflash .7s ease}
@keyframes dhflash{0%{background:#f0e4c4}100%{background:#fbfaf7}}
.chip{display:inline-block;font-size:calc(10.5px*var(--fs,1));border:1px solid #c9c1b2;border-radius:var(--r-s);padding:1px 7px;color:var(--ink-3);background:var(--bg-ctl);white-space:nowrap}
#d-vbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--bg-vbar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#d-vbar:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 22px 46px}
.paper{background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;
       max-width:720px;margin:22px auto 0;padding:38px 52px 44px;position:relative}
.paper .doc-h{font-size:calc(11px*var(--fs,1));color:#a89a83;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.paper .doc-h span:last-child{flex-shrink:0}
.paper .pf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:calc(10.5px*var(--fs,1));color:#b3ab9b;letter-spacing:2px}
.cover{max-width:720px;margin:34px auto 0;background:var(--bg-paper);border:1px solid var(--line-paper);box-shadow:0 2px 14px rgba(70,58,35,.10);border-radius:3px;padding:52px 56px}
.cover h2{font-size:calc(26px*var(--fs,1));font-family:'Noto Serif SC','SimSun',serif;margin:0 0 6px;letter-spacing:2px}
.cover .sub{color:#8a8375;font-size:calc(12.5px*var(--fs,1));margin-bottom:18px}
.shelf-cap{max-width:720px;margin:28px auto 6px;font-size:calc(12px*var(--fs,1));color:#8a8375;letter-spacing:2px}
.shelf-row{display:flex;align-items:center;gap:10px;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:10px 12px;cursor:pointer}
.wb-sel{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:6px 8px;color:var(--ink);font-size:calc(12.5px*var(--fs,1))}
.diff{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:calc(12px*var(--fs,1))}
.diff .ln{display:block;padding:1px 10px;white-space:pre-wrap;word-break:break-all}
.diff .add{background:var(--diff-add-bg);border-left:3px solid var(--diff-add-bd)}.diff .add::before{content:"+ ";color:var(--diff-add-ink);font-weight:700}
.diff .del{background:var(--diff-del-bg);border-left:3px solid var(--diff-del-bd)}.diff .del::before{content:"− ";color:var(--diff-del-ink);font-weight:700}
.diff .ctx{color:var(--ink-3)}
.diff .cw{border-radius:2px;padding:0 1px}
.diff .cw.del{background:var(--diff-del-bg);box-shadow:inset 0 0 0 1px var(--diff-del-bd);color:var(--diff-del-ink)}
.diff .cw.add{background:var(--diff-add-bg);box-shadow:inset 0 0 0 1px var(--diff-add-bd);color:var(--diff-add-ink)}
.diff-legend{display:flex;gap:14px;align-items:center;padding:4px 2px 10px;font-size:calc(11px*var(--fs,1));color:var(--ink-3)}
.diff-legend .lg.del{color:var(--diff-del-ink);font-weight:700}
.diff-legend .lg.add{color:var(--diff-add-ink);font-weight:700}
.wb-bar{display:flex;gap:8px;align-items:center;margin:2px 0 12px}
.wb-bar input{flex:1;background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:3px;padding:7px 10px;color:var(--ink);font-size:calc(13px*var(--fs,1));outline:none}
.wb-bar input:focus{border-color:var(--accent)}
.wb-bar .cnt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.wb-cap{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);letter-spacing:1px;margin:8px 0 2px;border-bottom:1px solid var(--line-paper);padding-bottom:3px}
.wb-card{background:var(--bg-paper);border:1px solid var(--line-paper);border-radius:4px;padding:8px 10px;cursor:pointer;min-height:52px}
.wb-card:hover{border-color:var(--accent)}
.wb-card .t{font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--ink);word-break:break-all}
.wb-card .m{margin-top:4px;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.draft{background:#8a6b2a}.dot.retired{background:#8c352c}.dot.other{background:#999}
       padding:12px 18px;max-width:720px;margin:8px auto;cursor:pointer;box-shadow:0 1px 6px rgba(70,58,35,.06)}
.shelf-row:hover{border-color:#a5433a}
.shelf-row .no{font-family:'Noto Serif SC','SimSun',serif;font-weight:700;color:#a5433a;font-size:calc(15px*var(--fs,1));width:30px;flex-shrink:0}
.shelf-row .nm{flex:1;font-size:calc(13.5px*var(--fs,1));font-weight:600}
.shelf-row .go{font-size:calc(11.5px*var(--fs,1));color:#8a8375}
#bottombar{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg-chrome);border-top:1px solid var(--line);flex-shrink:0}
#bottombar button{border:1px solid #c9c1b2;background:var(--bg-ctl);border-radius:var(--r-m);height:26px;padding:0 var(--ctl-px);font-size:calc(12px*var(--fs,1));cursor:pointer;color:var(--ink-2);white-space:nowrap}
#bottombar button:hover{border-color:#8a8375;background:#f3efe6}
#bottombar .sp{flex:1}
#bottombar .zoom{font-size:calc(11px*var(--fs,1));color:#8a8375;cursor:pointer;padding:2px 6px;border-radius:4px}
#bottombar .zoom:hover{background:#f3efe6}
#bottombar .zoom b{color:#3d382f}
#hud .alarm{color:#a5433a;font-weight:700;cursor:pointer;background:#faeaea;padding:2px 8px;border-radius:var(--r-s)}
#hud .alarm:hover{background:#f3d9d9}
#d-stats{font-size:calc(11px*var(--fs,1));color:var(--ink-3);font-variant-numeric:tabular-nums}
#ctip{position:absolute;display:none;z-index:30;max-width:320px;background:#262420;color:#f4f1ea;font-size:calc(12px*var(--fs,1));line-height:1.7;
      padding:10px 14px;border-radius:var(--r-l);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#ctip code{color:#e8d9a0}
.docpaper{position:relative;padding-right:112px}
.anno-rail{position:absolute;top:60px;right:12px;width:96px}
.anno-bubble{position:absolute;left:0;right:0;background:#fff8e8;border:1px solid #d9b96a;border-left:3px solid #c9922e;border-radius:var(--r-s);padding:5px 8px;font-size:calc(10.5px*var(--fs,1));line-height:1.5;cursor:pointer;box-shadow:0 2px 8px rgba(70,58,35,.14);word-break:break-word}
.anno-bubble .ab-q{color:#8a6b2a;margin-bottom:2px}
.anno-bubble .ab-t{color:var(--ink-2)}
.anno-bubble .ab-x{position:absolute;top:2px;right:4px;color:#a5433a;cursor:pointer}
.anno-mark{background:#ffe9a8;border-bottom:2px solid #c9922e;cursor:pointer}
.anno-mark.flashmark{background:#ffd166}
#anno-pop{position:absolute;z-index:70;display:none;width:270px;background:var(--bg-paper);border:1px solid var(--accent);border-radius:var(--r-m);box-shadow:0 8px 24px rgba(40,32,16,.25);padding:8px}
#anno-pop textarea{width:100%;min-height:56px;font-size:calc(12px*var(--fs,1))}
#anno-pop .ap-act{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.md[contenteditable="true"]:focus{box-shadow:inset 0 0 0 1px var(--line)}
.rawmd{font-family:Consolas,'Microsoft YaHei',monospace;font-size:calc(12px*var(--fs,1));line-height:1.7;white-space:pre-wrap;word-break:break-word;background:var(--bg-ctl);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;height:26px}
.seg button{border:0;background:var(--bg-ctl);color:var(--ink-2);height:26px;padding:0 10px;font-size:calc(12px*var(--fs,1));cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.cmt{background:var(--bg-cmt);border-left:3px solid #c9922e;padding:6px 10px;margin:6px 0;font-size:calc(13px*var(--fs,1));border-radius:0 var(--r-m) var(--r-m) 0}
#drawer{border-top:1px solid var(--line);background:var(--bg-chrome);display:none;max-height:46%;overflow:auto;padding:12px 16px}
#drawer.on{display:block}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:calc(13px*var(--fs,1));margin-bottom:10px;align-items:baseline}

<script>
const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
/* payload@2 五键冻结契约（contracts/page-payload.schema.json）：顶层 DATA/EFF/OVERLAY/OPTIMIZE/METRICS */
const DATA = PAYLOAD.DATA;
const files = DATA.files, RS = DATA.runstate;
if (DATA.annos) RS.annos = DATA.annos;
/* 未迁移面板的缺失键回填（WO-07 面板重写后可删）：只补默认值，不做双名兜底 */
DATA.snapshots = DATA.snapshots || {}; DATA.kits = DATA.kits || {}; DATA.kbTitles = DATA.kbTitles || {};
DATA.nodeFields = DATA.nodeFields || []; DATA.flowsIndex = DATA.flowsIndex || []; DATA.skillsIndex = DATA.skillsIndex || [];
/* ---------- 文件多版本索引（来自快照）：diff 呈现的数据底座 ---------- */
const fileVersions = {};
Object.entries(DATA.snapshots || {}).forEach(([nid, lst]) => (lst || []).forEach(s => {
  Object.entries(s.content || {}).forEach(([pth, text]) => {
    (fileVersions[pth] = fileVersions[pth] || []).push({ label: `${nid}·r${s.round}`, text });
  });
}));
Object.keys(fileVersions).forEach(k => fileVersions[k].sort((x, y) => x.label < y.label ? -1 : 1));
/* ---------- 生效编排：节点与边只此一份（EFF，内核 expandFlow 单点派生落盘）---------- */
/* 页面不重算派生（R6 §三）。存量项目（未跑 flow_effect / 未转换）EFF 为空壳 → 画布空，横幅显式说明。 */
const EFF = PAYLOAD.EFF || null;
const OVERLAY = PAYLOAD.OVERLAY || null;
const OPTIMIZE = PAYLOAD.OPTIMIZE || null;
const METRICS = PAYLOAD.METRICS || null;
const flow = (EFF && EFF.flow) || DATA.flow || {};   // flow@3 全文（内核内嵌）；无 EFF 时退展示摘要（payload DATA.flow）
const nodes = (EFF && EFF.nodes) || {};    // { <实例id>.<tool>: node }
const edges = (EFF && EFF.edges) || [];    // 骨架边 + 插件自动接线（R6 无 reject/loop 边）
const LEGACY_CANVAS = !Object.keys(nodes).length;
document.getElementById("v").textContent = "";  // 流程名移入「工作流管理」页（顶栏降噪）
// 项目切换下拉：当前项目 + 目录下其他项目 + 新建入口
const projSel = document.getElementById("proj-switch");
(DATA.projects || []).forEach(p => {
  const o = document.createElement("option");
  o.value = p.id; o.textContent = p.id + (p.status === "completed" ? "（已完成）" : "");
  if (p.id === DATA.project) o.selected = true;
  projSel.appendChild(o);
});
const oNew = document.createElement("option");
oNew.value = "__new__"; oNew.textContent = "＋ 新建项目…";
projSel.appendChild(oNew);
projSel.addEventListener("change", e => {
  if (e.target.value === "__new__"){
    e.target.value = DATA.project;
    const tip = document.getElementById("ctip");
    tip.innerHTML = "<b>新建项目</b><br>静态页无后端。请运行：<br><code>python -m core miniflow flow_init --flow <id> --project <新id></code><br><code>python -m core miniflow flow_run --flow <id> --project <新id></code><br>生成页面：<code>python tools/project-pages.py</code>";
    tip.style.display = "block";
    setTimeout(()=>{ tip.style.display = "none"; }, 6000);
    return;
  }
  location.href = "../" + e.target.value + "/workflow.html";
});
function importFlowHint(){ openFlowStore(); }
function importFlowHintOld(){
  const tip = document.getElementById("ctip");
  tip.innerHTML = "<b>导入新流</b><br>1. flow.json 放入 flows/<新id>/ 且通过 flow-lint<br>2. <code>python tools/render-flow.py <新id></code> 出图<br>3. <code>python tools/project-pages.py <新id> <项目></code> 出页";
  tip.style.left = "14px"; tip.style.top = "60px"; tip.style.display = "block";
  setTimeout(()=>{ tip.style.display = "none"; }, 8000);
}
if (DATA.deliveryPage) { const a = document.getElementById("dl-link"); a.href = DATA.deliveryPage; a.style.display = ""; }

/* ---------- 中文名映射（画布不露英文术语） ---------- */
const ZH = {"find-trope":"找梗师","internet-feel":"网感师","plot-choreographer":"剧情编排师","plot-redline":"红方评审",
  "topic-zeitgeist":"热点扫描","topic-analysis-report":"调研分析","topic-proposal":"方案主笔",
  "topic-chief-aesthetic":"审美总编","topic-delivery-gate":"交付监理","script-drama-beat":"分镜编剧",
  "scene-breakdown":"小纲师","script-final":"成品剧本师","dialogue-polish":"台词打磨",
  "structure-design":"结构选型师","novel-bible":"开书师","novel-chapter":"章回写手","deconstruct-book":"拆书师",
  "render-html":"交付页渲染","kb_load":"知识装载","kb_search":"知识检索","check_trope_combo":"梗组合校验",
  "check_aesthetic_asserts":"审美断言","check_contract_compliance":"约束对账","docx_ingest":"批注解析",
  "continuity_slice":"台账切片","continuity_commit":"台账结算","meme_harvest":"梗素材采集"};
const ST_ZH = {"done":"已完成","awaiting":"待决","pending":"待重跑","none":"未启动"};
const STAGE_ZH = {"S1":"调研","S2":"结构","S3":"大纲","S4":"小纲","S5":"成稿"};
const STAGE_COLOR = {"S1":"#5e7d5a","S2":"#4f6d8c","S3":"#9c6b4a","S4":"#7d5f8a","S5":"#a5546b"};

/* ---------- 运行状态 ---------- */
function st(n){ const s = (RS.nodes[n]||{}).status || "none"; return s; }
function persistState(){
  // 用户数据（意见/批注/预设）→ 内部/批注与意见.json；重跑与提交归内核真相
  const userData = {comments: RS.comments||{}, annos: RS.annos||{}, presets: RS.presets||{}, savedAt: new Date().toLocaleString()};
  saveFile("内部/批注与意见.json", JSON.stringify(userData, null, 2), "json")
    .then(m => { const el = document.getElementById("saved"); if (el) el.textContent = m; });
}
window.persistState = persistState;
const handles = {};
async function saveFile(name, content, ext){
  // ① http 服务：POST 直写盘（零弹窗）
  if (location.protocol.startsWith("http")){
    try{
      const rel = DATA.project ? "projects/" + DATA.project + "/" + name : name;
      const r = await fetch("/_kit/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: rel, content})});
      if (r.ok){ const j = await r.json(); return "已写盘：" + j.path; }
    }catch(err){}
  }
  // ② 兜底：File System Access → 下载（file:// 模式）
  try{
    if (window.showSaveFilePicker){
      const h = handles[name] || await showSaveFilePicker({suggestedName: name});
      handles[name] = h;
      const w = await h.createWritable(); await w.write(content); await w.close();
      return "已写回 " + name;
    }
    throw 0;
  }catch(e){
    if (e && e.name === "AbortError") return "已取消";
    const b = new Blob([content], {type: ext==="json"?"application/json":"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name.split("/").pop(); a.click();
    return "浏览器不支持直接写盘，已下载（放回项目目录即生效）";
  }
}

/* ---------- 布局：模块横向拼接 ｜ 模块内竖向主轴 ｜ 插件左分支 ｜ 连接件在模块缝 ----------
   数据源唯一：DATA.modules（payload 契约「画布布局的唯一来源」）；EFF.links 只出连接件的模式与裁决态。 */
const NW=196, NH=76, GY=64, MG=44;
const PLUGIN_DX=24;                       // 插件分支：骨架主轴左侧的偏移
const SPINE_DX=PLUGIN_DX+NW+18;           // 主轴相对模块带左缘的偏移（≥插件宽度，两列不相交）
const MOD_GAP=132;                        // 模块缝宽：连接件走这里
const MODULE_PALETTE=["#5e7d5a","#4f6d8c","#9c6b4a","#7d5f8a","#a5546b","#5f7d7d","#8c6d4f","#6b4f7d"];
let pos = {};
let moduleBand = {}, moduleLinks = [], nodeMeta = {}, parCols = new Set();
const moduleColor = i => MODULE_PALETTE[i % MODULE_PALETTE.length];
function autoLayout(){
  pos = {}; moduleBand = {}; moduleLinks = []; nodeMeta = {}; parCols = new Set();
  const insts = DATA.modules || [];
  insts.forEach((inst, i) => {
    const spineSet = new Set(inst.spine || []);
    const pluginSet = new Set(inst.plugins || []);
    const allNodes = [...new Set([...(inst.nodes || inst.spine || []), ...(inst.plugins || [])])];
    const bx = MG + i*(SPINE_DX+NW+MOD_GAP);
    moduleBand[inst.id] = {from: bx, to: bx + SPINE_DX + NW, index: i, inst,
                           color: moduleColor(i)};
    allNodes.forEach((nid, k) => {
      const plugin = pluginSet.has(nid);
      nodeMeta[nid] = {instId: inst.id, index: i, plugin, color: moduleColor(i)};
      pos[nid] = [bx + (plugin ? PLUGIN_DX : SPINE_DX), MG + 56 + k*(NH+GY)];
    });
  });
  // 连接件：相邻模块之间铸一个（EFF.links 为内核事实源），画在模块缝上，锚住目标模块入口行
  ((EFF && EFF.links) || []).forEach(l => {
    const from = moduleBand[l.fromModule], to = moduleBand[l.toModule];
    if (!from || !to) return;
    const first = ((DATA.modules[to.index] || {}).spine || []).find(nid => pos[nid]);
    const y = first ? pos[first][1] + NH/2 : MG + 56 + NH/2;
    moduleLinks.push({id: l.id, mode: l.mode || "auto", state: l.state || "pending",
                      x1: from.to + 6, x2: to.from - 6, y, fromModule: l.fromModule, toModule: l.toModule});
  });
  // EFF 里有、DATA.modules 没覆盖的节点（内核先行/数据不同步）：显式可见，不静默丢弃
  const orphans = Object.keys(nodes).filter(nid => !pos[nid] && !nid.endsWith(".link"));
  if (orphans.length){
    const bx = MG + insts.length*(SPINE_DX+NW+MOD_GAP);
    orphans.forEach((nid, k) => {
      nodeMeta[nid] = {instId: "?", index: insts.length, plugin: false, color: "#b8b0a4", orphan: true};
      pos[nid] = [bx + SPINE_DX, MG + 56 + k*(NH+GY)];
    });
  }
  render();
}

function fitToBox(x0, y0, x1, y1){
  const st = document.getElementById("stage");
  const w = x1-x0 + MG*2, h = y1-y0 + MG*2;
  const k = Math.min(st.clientWidth / w, st.clientHeight / h, 1.2);
  view = { k, x: st.clientWidth/2 - (x0+(x1-x0)/2)*k, y: Math.max(10, st.clientHeight/2 - (y0+(y1-y0)/2)*k) };
  applyView();
}
/* 全屏：整条流程适配窗口 */
function fitView(){
  const xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
  if (!xs.length) return;
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
/* 本轮：适配当前选中节点所在模块；无选中则取第一个未完成模块 */
function currentStageId(){
  const cur = sel || lastSel;
  if (cur && nodeMeta[cur]) return nodeMeta[cur].instId;
  for (const inst of (DATA.modules||[])){
    if ((inst.spine||[]).some(x => st(x) !== "done")) return inst.id;
  }
  return ((DATA.modules||[])[0]||{}).id;
}
function fitStage(){
  fitStageById(currentStageId());
}
function fitStageById(sid){
  const band = moduleBand[sid];
  if (!band){ fitView(); return; }
  const xs = [], ys = [];
  for (const [n, pt] of Object.entries(pos)){
    if (pt[0] >= band.from && pt[0] <= band.to){ xs.push(pt[0]); ys.push(pt[1]); }
  }
  if (!xs.length){ fitView(); return; }
  fitToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs)+NW, Math.max(...ys)+NH);
}
function fitStageNext(){
  const ids = (DATA.modules||[]).map(s=>s.id);
  if (!ids.length) return;
  const i = ids.indexOf(currentStageId());
  fitStageById(ids[(i+1) % ids.length]);
}

/* ---------- 视图变换 ---------- */
let view = {k:1, x:40, y:30};
function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z = document.getElementById("zoom-val");
  if (z) z.innerHTML = "缩放 <b>" + Math.round(view.k*100) + "%</b>";
}
function resetZoom(){
  const st = document.getElementById("stage");
  const cx = st.clientWidth/2, cy = st.clientHeight/2;
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = 1; view.x = cx-wx; view.y = cy-wy; applyView();
}
/* 定位：跳转到当前（或最近一次）选中节点；无选中则整图适配 */
let lastSel = null;
function locateSel(){
  const target = sel || lastSel;
  if (!target || !pos[target]) { fitView(); return; }
  const st = document.getElementById("stage");
  const k2 = Math.max(view.k, 0.8);
  view.k = k2;
  view.x = st.clientWidth/2 - (pos[target][0]+NW/2)*k2;
  view.y = st.clientHeight/2 - (pos[target][1]+NH/2)*k2;
  applyView();
}
document.getElementById("stage").addEventListener("wheel", e=>{
  e.preventDefault();
  const r = document.getElementById("stage").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k2 = Math.min(2.2, Math.max(0.35, view.k * (e.deltaY<0?1.12:0.89)));
  view.x = mx-(mx-view.x)*k2/view.k; view.y = my-(my-view.y)*k2/view.k; view.k = k2; applyView();
}, {passive:false});
let panning = null;
document.getElementById("stage").addEventListener("mousedown", e=>{
  if (e.target.closest(".node") || e.target.closest("#docpanel")) return;
  panning = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
});
window.addEventListener("mousemove", e=>{
  if (drag) { dragMove(e); return; }
  if (panning){ view.x = panning.vx+e.clientX-panning.x; view.y = panning.vy+e.clientY-panning.y; applyView(); }
});
window.addEventListener("mouseup", ()=>{ panning=null; if(drag){ const moved = drag.moved; drag=null; if(moved) render(); } });

/* ---------- 渲染 ---------- */
/* ---------- flow@2 求值层（与 core/src/cond.ts 同源） ----------
   页面与内核一套判定：不再靠 when 字符串嗅探、不再硬编码节点 id。
   字段唯一：node.output · edge.role/when/params/via（规范 R4 §5.1/§5.2/§5.3）。 */
const EDGE_ROLE_ZH = {flow:"", reject:"打回", optional:"可选", loop:"回环", batch:"成批"};
function edgeRole(e){ return e.role || (e.loop ? "loop" : (e.optional ? "optional" : "flow")); }
function isBackEdge(e){ const r=edgeRole(e); return r==="loop" || r==="reject"; }
function nodeBody(m){ return (m.kit && m.op) ? (m.kit+"."+m.op) : (m.minitool ? ("core."+m.minitool) : (m.kind||"")); }
function edgeVia(e){ if (e.via) return e.via; const to=nodes[e.to]; return to ? nodeBody(to) : ""; }
function condCtx(){
  const nv={}; Object.entries(RS.nodes||{}).forEach(([k,v])=>nv[k]=(v||{}).verdict);
  return {inputs:(RS.inputs||{}), lastRejectReason:RS.lastRejectReason,
          gateVerdict:(RS.gate||{}).verdict, nodeVerdicts:nv,
          pendingInstances:Object.keys(nodes).filter(n=>nodes[n].iterate && ((RS.nodes[n]||{}).status||"none")!=="done").length};
}
const VERDICT_ALIAS = {rejected:"send-back", send_back:"send-back"};
function evalWhen(w, ctx){
  if (w===undefined || w===null) return {active:true};
  if (typeof w==="object"){
    const keys=Object.keys(w).filter(k=>w[k]!==undefined);
    if (!keys.length) return {active:true};
    if (w.any && w.any.length) return {active:w.any.map(x=>evalWhen(x,ctx)).some(r=>r.active)};
    if (w.all && w.all.length) return {active:w.all.map(x=>evalWhen(x,ctx)).every(r=>r.active)};
    if (w.verdict!==undefined){
      const want=VERDICT_ALIAS[w.verdict]||w.verdict;
      if ((ctx.gateVerdict||"none")!==want) return {active:false};
    }
    if (w.challenge!==undefined){
      const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
      const got=votes.includes("challenge") || (ctx.gateVerdict||"")==="challenge";
      if (got!==w.challenge) return {active:false};
    }
    if (w.cause!==undefined){
      const got=ctx.lastRejectReason||"", want=String(w.cause);
      if (!(got.includes(want)||want.includes(got))) return {active:false};
    }
    if (w.input!==undefined){
      const got=ctx.inputs[w.input];
      if (w.eq!==undefined && String(got)!==String(w.eq)) return {active:false};
      if (w.gt!==undefined && !(Number(got)>w.gt)) return {active:false};
      if (w.lt!==undefined && !(Number(got)<w.lt)) return {active:false};
    }
    if (w.loop!==undefined){
      const pending=ctx.pendingInstances||0;
      if (!(w.loop==="pending" ? pending>0 : pending===0)) return {active:false};
    }
    return {active:true};
  }
  const s=String(w).trim();
  if (!s) return {active:true};
  if (s==="rejected") return {active:(ctx.gateVerdict||"none")==="send-back"};
  if (s==="challenge"){
    const votes=Object.values(ctx.nodeVerdicts||{}).map(v=>String(v||""));
    return {active:votes.includes("challenge")||(ctx.gateVerdict||"")==="challenge"};
  }
  let m=s.match(/根因[=：:]\s*(\S+)/);
  if (m){ const got=ctx.lastRejectReason||""; return {active:got.includes(m[1])||m[1].includes(got)}; }
  m=s.match(/^([^=]+)=([^=]+)$/);
  if (m){ const got=ctx.inputs[m[1].trim()]; return {active:got!==undefined && String(got)===m[2].trim()}; }
  return {active:false, unparsable:s};   // 不可解析 → 保守不活跃（lint 报 block）
}
/* when 的人类可读摘要（画布标签 / 连线面板） */
function whenText(w){
  if (w===undefined || w===null) return "";
  if (typeof w==="string") return w;
  const parts=[];
  if (w.verdict!==undefined) parts.push("门裁决="+(w.verdict==="send-back"?"打回":w.verdict));
  if (w.challenge!==undefined) parts.push(w.challenge?"有挑战票":"无挑战票");
  if (w.cause!==undefined) parts.push("根因="+w.cause);
  if (w.input!==undefined){
    if (w.eq!==undefined) parts.push(w.input+"="+w.eq);
    if (w.gt!==undefined) parts.push(w.input+">"+w.gt);
    if (w.lt!==undefined) parts.push(w.input+"<"+w.lt);
  }
  if (w.loop!==undefined) parts.push(w.loop==="pending"?"还有未完成实例":"实例已收口");
  if (w.any) parts.push("("+w.any.map(whenText).filter(Boolean).join(" 或 ")+")");
  if (w.all) parts.push("("+w.all.map(whenText).filter(Boolean).join(" 且 ")+")");
  return parts.join(" 且 ");
}
/* 节点产物路径：唯一事实源 = node.output；交付清单只补"交付路径"（path）——不再有第二个字段名（规范 R4 §5.1） */
function nodeOutputs(n){
  const outs=[];
  const m = nodes[n] || {};
  if (m.output) outs.push(m.output);
  (flow.outputs||[]).forEach(o=>{
    if (o.node!==n) return;
    const p = o.path || m.output;
    if (p && !outs.includes(p)) outs.push(p);
  });
  return outs;
}
/* 节点能力：kit.op 为唯一事实源 → 由 kit 注册表取知识依据/校验；不再读已废弃的 node.kb（规范 R4 §5.1/§5.3） */
function kitOpOf(m){
  if (!m || !m.kit || !m.op) return null;
  const reg = (DATA.kits||{})[m.kit] || {};
  return {kit:m.kit, op:m.op, domain:reg.domain||"", ktitle:reg.title||"", def:(reg.ops||{})[m.op]||{}};
}
function kbTitle(id){ return (DATA.kbTitles||{})[id] || String(id||"").replace(/^kb\//,""); }

/* ================= R5/R6 · 生成式编排数据面 =================
   EFF/OVERLAY/OPTIMIZE/METRICS 已在页首数据缝从 payload 顶层分解（payload@2 五键契约）。
   全部由**内核**算好落盘（registry/effective.json / metrics-summary.json / overlay.json / optimize.json），
   页面只读不改写。派生逻辑刻意不在前端复刻一遍——「人看到的编排」与「跑的编排」必须是同一份东西。 */

/* R6：模块间连接件取代 kit 边界门。旧 isBoundaryNode 语义退役，保留空实现供未迁移面板调用（WO-7 清理） */
function isBoundaryNode(n){ return false; }
/* 本节点的 tool 指标：按 kit.op 归口（换位置不换 tool，指标该跟着 tool 走） */
function toolMetrics(m){
  if (!METRICS || !m || !m.kit || !m.op) return null;
  return (METRICS.byTool||{})[m.kit+"."+m.op] || null;
}
function fmtPct(x){ return (x===undefined||x===null||isNaN(x))?"-":Math.round(x*100)+"%"; }
function fmtEff(x){
  if (x===undefined||x===null||isNaN(x)) return "-";
  if (x===0) return "0";
  return x<0.001 ? x.toExponential(1) : x.toFixed(3);
}
/* 指标徽章：tool 效率（产物被下游真正消费的次数 ÷ 成本） + 上下文命中率（注入的标尺被引用的比例） */
function metricBadges(m){
  const t = toolMetrics(m);
  if (!t) return `<span class="mb" title="本项目尚无该 tool 的运行指标（未跑到 / 未落盘）">未采样</span>`;
  const hit = (t.ctxOffered||0) > 0 ? t.hitRate : null;
  const hitCls = hit===null ? "" : (hit>=0.6?"good":(hit>=0.3?"warn":"bad"));
  const effCls = (t.consumedBy||0) > 0 ? "good" : "bad";
  return `<span class="mb ${effCls}" title="tool 效率 = 被下游消费 ${t.consumedBy||0} 次 ÷ 成本 ${(t.cost||0).toFixed(2)}（token千分位 + 时延分钟 + 打回×5 + 重试×2）；${t.runs||0} 次派发 / ${t.submits||0} 次交卷">效率 ${fmtEff(t.efficiency)}</span>`
       + (hit===null
          ? `<span class="mb" title="未采样到知识注入（本 tool 未声明 knowledge 或不装载）">命中 -</span>`
          : `<span class="mb ${hitCls}" title="上下文命中率 = 被产物真正引用的标尺/上游件 ${t.ctxUsed||0} ÷ 注入 ${t.ctxOffered}">命中 ${fmtPct(hit)}</span>`);
}
/* 本节点/本 tool 被项目 overlay 改写了吗（位置 / 内容配置）——改写理由来自补丁自身，不猜 */
function overlayHits(n, m){
  if (!OVERLAY || !Array.isArray(OVERLAY.patches)) return [];
  return OVERLAY.patches.filter(p=>{
    if (p.kind==="set-tool" && m && m.kit && m.op) return p.kit===m.kit && p.op===m.op;
    return p.id===n;
  });
}
/* 内容配置项（R5 §二）：旋钮表 = 声明 + 生效值 + 逐键来源；来源区分「tool 默认」与「被人/优化agent改过」 */
function configPaper(n){
  const rec = EFF && EFF.nodeConfig && EFF.nodeConfig[n];
  if (!rec || !rec.resolved) {
    const m = nodes[n]||{};
    if (!m.kit || !m.op) return "";
    return `<div class="paper"><div class="doc-h"><span>内容配置项</span><span>${m.kit}.${m.op}</span></div><div class="md">
      <p class="msg">本节点未能在生效编排中解析出 tool（kit 注册表里查不到 <code>${m.kit}.${m.op}</code>）。
      kit 注册表是配置声明的唯一事实源——查不到即无旋钮可调，请先修 <code>kits/${m.kit}/kit.json</code>。</p></div></div>`;
  }
  const r = rec.resolved, defs = r.defs||{}, vals = r.values||{}, src = r.sources||{};
  const SRC_ZH = {overlay:"项目覆盖", node:"本节点", op:"tool 默认", generic:"通用默认"};
  const hits = overlayHits(n, nodes[n]);
  const keys = Object.keys(defs);
  const rows = keys.map(k=>{
    const d = defs[k]||{}, v = vals[k], s = src[k]||"generic";
    let spec = "";
    if (d.type==="enum" && d.enum) spec = d.enum.join(" / ");
    else if (d.type==="number") spec = `${d.min!==undefined?d.min:"-"} ~ ${d.max!==undefined?d.max:"-"}${d.unit||""}`;
    else if (d.type==="boolean") spec = "开 / 关";
    else if (d.type==="array") spec = "列表";
    else spec = d.type||"";
    const changed = (s==="overlay"||s==="node");
    return `<div class="knob${changed?" chg":""}">
      <div class="kn-h"><code>${k}</code><span class="kn-v">${Array.isArray(v)?v.join("、"):String(v)}</span><span class="kn-s src-${s}">${SRC_ZH[s]||s}</span></div>
      <div class="kn-d">${d.desc||""}</div>
      <div class="kn-m">可选：${spec}${d.effect?` ｜ ${d.effect}`:""}</div>
    </div>`;
  }).join("");
  const unk = (r.unknownKeys||[]).length
    ? `<span class="k">⚠ 未识别键</span><span class="v">${r.unknownKeys.map(x=>`<code>${x}</code>`).join(" ")} <span class="msg">写了但不在声明表内——内核已显式回显而非静默忽略；请补声明或改正键名</span></span>`
    : "";
  const ovNote = hits.length
    ? `<div class="knob chg" style="margin-top:8px"><div class="kn-h"><code>项目 overlay 改写</code><span class="kn-v">${hits.length} 条</span></div>
       <div class="kn-m">${hits.map(p=>`<code>${p.kind}</code>｜${p.reason||""}${p.evidence?`（依据 ${p.evidence.rule||""}）`:""}`).join("<br>")}</div></div>`
    : "";
  const patch = JSON.stringify({kind:"set-tool", kit:(nodes[n]||{}).kit, op:(nodes[n]||{}).op,
    config:Object.fromEntries(keys.map(k=>[k, vals[k]])), reason:"（填写调优依据：哪条指标 + 期望改变）"}, null, 2);
  return `<div class="paper"><div class="doc-h"><span>内容配置项 · 可被用户与优化 agent 调优</span><span>${(nodes[n]||{}).kit}.${(nodes[n]||{}).op}${r.genericOnly?" · 仅通用项":""}</span></div><div class="md">
    <div class="kv">
      <span class="k">旋钮数</span><span class="v">${keys.length} 项（${keys.filter(k=>src[k]==="overlay"||src[k]==="node").length} 项已偏离默认）</span>
      <span class="k">生效优先级</span><span class="v">项目 overlay &gt; 本节点 config &gt; tool 默认 &gt; 通用默认 <span class="msg">按 tool 归口：<code>set-tool</code> 改的是「这件事怎么做」，换位置照样生效</span></span>
      ${unk}
    </div>
    ${ovNote}
    <div class="knobs">${rows}</div>

/* artifact@1 头部（规范 R4 §二）：版本与审核背景的唯一落点；正文不再承载这些。
   只认 artifact:1 的头部，解析顶层标量 + 一层嵌套（review）——与内核 asserts.ts 同口径。 */
function parseArtifactHeader(text){
  if (typeof text !== "string") return null;
  const m = /^\uFEFF?---\r?\n([\s\S]{0,3000}?)\r?\n---/.exec(text);
  if (!m || !/^\s*artifact\s*:\s*1\s*$/m.test(m[1])) return null;
  const kv={}, nested=[], list=[]; let sec=null;
  m[1].split(/\r?\n/).forEach(raw=>{
    if (!raw.trim() || raw.trim().startsWith("#")) return;
    const indent=/^\s+\S/.test(raw);
    let mm=/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(raw);
    if (mm){ if (indent && sec) nested.push([sec, mm[1], mm[2].trim()]); else { sec=mm[1]; kv[mm[1]]=mm[2].trim(); } return; }
    mm=/^\s*-\s*(.*)$/.exec(raw);
    if (mm) list.push([sec, mm[1].trim()]);
  });
  return {get:k=>kv[k], kv, nested, list,
          review: Object.fromEntries(nested.filter(x=>x[0]==="review").map(x=>[x[1],x[2]])),
          upstream: list.filter(x=>x[0]==="upstream").map(x=>x[1])};
}
/* 节点产物里第一份带 artifact@1 头部的件（审核页数据源） */

function drawEdges(){

  Object.values(moduleBand).forEach(b=>maxC=Math.max(maxC,b.to));

  for (const [instId, b] of Object.entries(moduleBand)){
    const caps = b.inst.caps || [], en = b.inst.capsEnabled || [];
    const bh = Math.max(maxR+NH+MG, MG+56+((b.inst.spine||[]).length)*(NH+GY));

  // 与 <x>.link 相关的跳线不画——连接件语义由下面的模块缝承载，避免双线。
  const cctx = condCtx();   // 一次求值上下文，全图共用

    if (!pos[e.from] || !pos[e.to]) continue;

    const [x1,y1] = pos[e.from], [x2,y2] = pos[e.to];

      d = `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
      lx = tx+8; ly = my;
    } else {
      const sx=x1+NW, sy=y1+NH/2, tx=x2, ty=y2+NH/2, mx=(sx+tx)/2;
      d = `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      lx = mx; ly = sy-6;

    // 可见线自身不接事件（1.4px 热区点不中）——上叠一条 14px 透明命中路径（.edge-hit）
    s += `<path d="${d}" fill="none" stroke="#a89f90" stroke-width="1.4"${(e.when||role!=="flow")?' stroke-dasharray="5,4"':""} opacity="${active?0.9:0.35}" marker-end="url(#arw)" pointer-events="none"/>`;
    s += `<path class="edge-hit" data-e="${e.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"/>`;

  }
  // 连接件（模块缝）：auto = 灰色虚线；manual = 金色实线 + 徽章；点击看连接件页（linkPaper）

    s += `<path d="M${l.x1},${l.y} L${l.x2},${l.y}" fill="none" stroke="${col}" stroke-width="${manual?2.2:1.4}"${manual?"":' stroke-dasharray="6,5"'} opacity="${manual?0.95:0.6}" ${manual?"":'marker-end="url(#arw)"'} pointer-events="none"/>`;

  });
  svg.innerHTML = s + "</svg>";
  svg.querySelectorAll(".edge-hit[data-e]").forEach(p=>{
    p.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openEdgeDoc(p.dataset.e); });
  });

    el.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openModulePaper(el.dataset.module); });
  });
  svg.querySelectorAll("[data-linkid]").forEach(el=>{
    el.addEventListener("click", ev=>{ ev.stopPropagation(); hideTip(); openLinkPaper(el.dataset.linkid); });

function mdHtml(md){
  let h = md.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  // 围栏代码块先摘出（占位符），避免内部被行级规则改写
  const blocks = [];
  h = h.replace(/```(?:[a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push(`<pre class="codeblock"><code>${code.replace(/^\n|\n$/g,"")}</code></pre>`);
    return `@@CB${blocks.length-1}@@`;
  });
  h = h.replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h = h.replace(/^---+$/gm,"<hr>");
  h = h.replace(/^\|(.+)\|$/gm,(m,row)=>{ const c=row.split("|").map(x=>x.trim()); if(c.every(x=>/^:?-{2,}:?$/.test(x))) return ""; return "<tr>"+c.map(x=>`<td>${x}</td>`).join("")+"</tr>"; });
  h = h.replace(/(<tr>[\s\S]*?<\/tr>)/, "<table>$1</table>").replace(/<\/tr>(\s*)<tr>/g,"</tr><tr>").replace(/<\/table>\s*<table>/g,"");
  h = h.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  h = h.replace(/^\d+\. (.*)$/gm,"<oli>$1</oli>").replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g,"<ol>$1</ol>").replace(/<oli>/g,"<li>").replace(/<\/oli>/g,"</li>");
  // 链接：指向本项目的相对路径 → 右栏打开；其余按外链新窗口
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const clean = href.replace(/&amp;/g,"&");
    if (typeof files !== "undefined" && files[clean] !== undefined) return `<a href="#" data-open="${clean}">${txt}</a>`;
    return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  });
  h = h.split(/\n{2,}/).map(b=>/^(<(h\d|table|ul|ol|hr)|@@CB)/.test(b.trim())?b:"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("\n");
  h = h.replace(/@@CB(\d+)@@/g,(m,i)=>blocks[+i]);
  return h;
}

function pageize(md, docName){
  const lines=String(md).split("\n"); const chunks=[]; let cur=[];
  for (const ln of lines){
    if (/^#{1,2} /.test(ln) && cur.join("").trim()){ chunks.push(cur.join("\n")); cur=[ln]; }
    else cur.push(ln);
  }
  if (cur.join("").trim()) chunks.push(cur.join("\n"));
  if (!chunks.length) chunks.push(String(md));
  const nm=docName.split("/").pop().replace(/\.md$/,"");
  return chunks.map((c,i)=>`<div class="paper"><div class="doc-h"><span>${docName}</span><span>${i+1} / ${chunks.length}</span></div><div class="md">${mdHtml(c)}</div><div class="pf">${nm} · 第 ${i+1} 页</div></div>`).join("");
}

function bindVerdict(n){

  if (!g) return;
  g.onclick=()=>{ RS.nodes[n].verdict="approved"; RS.nodes[n].status="done"; render(); openNodeDoc(n); };

    const ri=sts.findIndex(s=>s.id===rootId);
    RS.nodes[n].verdict="send-back"; RS.nodes[n].status="awaiting"; RS.nodes[n].root_cause_stage=rootId;
    (sts[ri].nodes||[]).forEach(nid=>{ if (RS.nodes[nid]) { RS.nodes[nid].status="pending"; RS.nodes[nid].round=(RS.nodes[nid].round||1)+1; } });

    order.slice(ti+1).forEach(x=>{ if(RS.nodes[x]&&RS.nodes[x].status==="done"){ RS.nodes[x].status="pending"; RS.nodes[x].stale=true; } });

function openRerun(n){

  const stageOf={}; (flow.stages||[]).forEach(s=>(s.nodes||[]).forEach(x=>stageOf[x]=s.id));
  const myStage=stageOf[n];
  const preset=(RS.presets||{})[myStage]||"semi";
  const inputs={}; upstream.forEach(u=>nodeOutputs(u).forEach(f=>{ if(files[f]) inputs[f]="✓"; }));
  const tp={runId:DATA.project+"-r"+((RS.nodes[n]||{}).round||1), nodeId:n, kind:m.kind,
    skill:m.skill||undefined, minitool:m.minitool||undefined, assist:m.assist||undefined,
    kit:m.kit||undefined, op:m.op||undefined, asserts:m.asserts||undefined, inputs:inputs,
    inputs_note: upstream.length ? "上游产物："+upstream.join("、") : "无上游",
    output:nodeOutputs(n)[0]||"(汇入下游)", preset:preset,
    parallel_with: Object.keys(pos).filter(x=>x!==n && nodes[x].stage===m.stage && pos[x][0]===pos[n][0] && nodes[x].kind!=="gate" && nodes[x].kind!=="srd"),
    note:m.kind==="agent" ? "认知任务包：宿主 Agent 用自己的 token 执行，flow_submit 回交；parallel_with 为同批就绪节点，无数据依赖可并行" : "确定性步骤：由工具进程零 token 执行"};
  drawer.innerHTML=`<p class="msg" style="margin:0 0 8px">重跑范围：从本节点重跑，<b>到本阶段验收门即停</b>；未变化的上游走缓存命中（Agent 上下文复用，只喂差异）。</p>
    <div class="act"><button class="tb" style="border-color:#262420;font-weight:700" id="r-from">从本节点重跑 → 阶段门</button>

    <div class="task">${JSON.stringify(tp, null, 2)}</div>

  drawer.classList.add("on");
  document.getElementById("r-from").onclick=()=>{ markRerun(n); openNodeDoc(n); };
  document.getElementById("r-zero").onclick=()=>{ const stg=(flow.stages||[]).find(x=>x.nodes&&x.nodes.includes(n)); if(stg&&stg.entry) markRerun(stg.entry); openNodeDoc(n); };
  document.getElementById("r-close").onclick=()=>drawer.classList.remove("on");

    RS.nodes[t]=RS.nodes[t]||{};

    render();
  }

/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 360000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  const out=[]; let i=0;
  while(i<rows.length){
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${escLine(rows[i].s)}</div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++].s);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++].s);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d), aHtml=a===null?null:escLine(a);

      if(a!==null) out.push(`<div class="ln add">${aHtml}</div>`);
    }
  }

}

function findWrapQuote(quote, aid){

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

    s.removeAllRanges();
  } else {
    // 不安全选区：不拆 DOM，仅记录文字并弹浮层
    s.removeAllRanges();
  }
  pendingQuote=raw.length>300 ? raw.slice(0,300)+"…" : raw;
  const pr=document.getElementById("docpanel").getBoundingClientRect();
  pop.dataset.quote=pendingQuote;
  document.getElementById("anno-input").value="";
  pop.style.left=Math.round(Math.min(Math.max(8, rect.left-pr.left), Math.max(8, pr.width-290)))+"px";
  pop.style.top=Math.round(Math.min(Math.max(8, rect.bottom-pr.top+8), Math.max(8, pr.height-150)))+"px";
  pop.style.display="block";
  document.getElementById("anno-input").focus();
});
function submitAnno(){
  const pop=document.getElementById("anno-pop");
  const text=document.getElementById("anno-input").value.trim();
  const quote=pendingQuote || (pop.dataset.quote||"");
  const key=curAnnoKey();
  pop.style.display="none";
  if (!text || !quote || !key || !pendingMark){ unwrapPending(); return; }
  const a={id:"a"+Date.now().toString(36), quote, text, ts:new Date().toLocaleString()};
  annoList(key).push(a);
  pendingMark.classList.remove("draft");
  pendingMark.dataset.aid=a.id;
  pendingMark.title=a.text;
  placeBubble(key, a, pendingMark);
  pendingMark=null; pendingQuote="";
  persistState();
}
document.addEventListener("click", e=>{
  window.__clog = window.__clog || [];
  const where = (e.target.id || e.target.className || e.target.tagName) + "@" + (e.target.closest ? (e.target.closest(".docpaper") ? "正文" : (e.target.closest("#docpanel") ? "面板" : "画布/外")) : "?");
  if (e.target.id==="anno-ok"){ window.__clog.push("anno-ok"); submitAnno(); return; }
  if (e.target.id==="anno-cancel"){ unwrapPending(); return; }
  if (e.target.id==="anno-input"){ window.__clog.push("input click - keep"); return; }
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block"){ window.__clog.push("click(无关, pop未开) @ " + where); return; }
  const inDoc = !!(e.target.closest && e.target.closest(".docpaper"));
  window.__clog.push("click @ " + where + " inDoc=" + inDoc + " → " + (inDoc ? "保留" : "收起"));
  if (!inDoc) unwrapPending();
});
document.addEventListener("keydown", e=>{
  const pop=document.getElementById("anno-pop");
  if (!pop || pop.style.display!=="block" || e.target.id!=="anno-input") return;
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitAnno(); }
  if (e.key==="Escape"){ unwrapPending(); }
});
/* contenteditable 粘贴纯文本，防外来脏结构 */
document.addEventListener("paste", e=>{
  const ed = e.target.closest && e.target.closest('.md[contenteditable="true"]');
  if (!ed) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, txt);
});

/* ---------- 流商店（Obsidian 商店式） ---------- */
const ST_GLYPH={ "网文":["文","linear-gradient(135deg,#b3543f,#7d3325)"],
  "剧本":["剧","linear-gradient(135deg,#3f6d8a,#28495e)"],
  "短剧":["短","linear-gradient(135deg,#c07a3a,#8f5620)"],
  "拆书":["拆","linear-gradient(135deg,#5b7d5c,#3c573d)"],
  "其他":["流","linear-gradient(135deg,#7a6f8a,#544d63)"] };
let stCat="全部", stQ="", stSort="default", stSel=null;
const stEsc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function openFlowStore(){
  stSel=null; stQ=""; stCat="全部"; stSort="default";
  document.getElementById("store-q").value="";
  document.getElementById("st-sort").value="default";
  document.getElementById("store").classList.add("on");
  renderStoreCats(); renderStore();
}
function closeFlowStore(){ document.getElementById("store").classList.remove("on"); }
function renderStoreCats(){
  const flows=DATA.flowsIndex||[], cats={};
  flows.forEach(f=>cats[f.category||"其他"]=(cats[f.category||"其他"]||0)+1);
  const box=document.getElementById("st-cats");
  box.innerHTML=["全部",...Object.keys(cats).sort()].map(c=>
    `<button class="st-cat${c===stCat?" on":""}" data-c="${stEsc(c)}">${stEsc(c)} · ${c==="全部"?flows.length:cats[c]}</button>`).join("");
  box.querySelectorAll(".st-cat").forEach(b=>b.addEventListener("click",()=>{ stCat=b.dataset.c; stSel=null; renderStoreCats(); renderStore(); }));
}
const stCmp=(a,b)=>{const p=s=>String(s||"0").split("-")[0].split(".").map(Number);
  const A=p(a),B=p(b);
  for(let i=0;i<3;i++){ if((A[i]||0)!==(B[i]||0)) return (A[i]||0)<(B[i]||0)?-1:1; }
  return 0; };
function stBadge(f){
  if (f.id===DATA.flow.id) return `<span class="sc-badge cur">当前绑定</span>`;
  const uses=f.usage||[];
  if (!uses.length) return `<span class="sc-badge none">未运行</span>`;
  const behind=uses.filter(u=>stCmp(u.version,f.version)<0);
  if (behind.length) return `<span class="sc-badge up" title="${stEsc(behind.map(u=>u.project+" v"+u.version).join("；"))}">可更新 · ${behind.length} 处落后</span>`;
  return `<span class="sc-badge used" title="${stEsc(uses.map(u=>u.project+" v"+u.version).join("；"))}">已运行 · ${uses.length} 项目</span>`;
}
function stFiltered(){
  let arr=(DATA.flowsIndex||[]).slice();
  const q=stQ.trim().toLowerCase();
  if (q) arr=arr.filter(f=>[f.title,f.id,f.desc,(f.skills||[]).join(" "),f.category].join(" ").toLowerCase().includes(q));
  if (stCat!=="全部") arr=arr.filter(f=>(f.category||"其他")===stCat);
  if (stSort==="updated") arr.sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  else if (stSort==="nodes") arr.sort((a,b)=>(b.nNodes||0)-(a.nNodes||0));
  else if (stSort==="name") arr.sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"zh"));
  else arr.sort((a,b)=>((b.id===DATA.flow.id?1:0)-(a.id===DATA.flow.id?1:0)) || (b.updated||"").localeCompare(a.updated||""));
  return arr;
}
function renderStore(){
  document.getElementById("st-count").textContent=(DATA.flowsIndex||[]).length+" 条生产线";
  if (stSel) return renderStoreDetail();
  const body=document.getElementById("st-body"), arr=stFiltered();
  if (!arr.length){ body.innerHTML=`<div class="st-empty">没有匹配的流程——换个关键词或分类看看。</div>`; return; }
  body.innerHTML=`<div class="store-grid">`+arr.map(f=>{
    const cur=f.id===DATA.flow.id, [g,bg]=ST_GLYPH[f.category]||ST_GLYPH["其他"];
    return `<div class="store-card" data-f="${stEsc(f.id)}">
      <div class="sc-head"><span class="st-ico" style="background:${bg}">${g}</span>
        <span style="min-width:0"><div class="sc-name">${stEsc(f.title)}</div><div class="sc-id">${stEsc(f.id)} · v${stEsc(f.version)} <span class="sc-ver${f.official?" rel":""}">${f.official?"官方发布":"初稿"}</span></div></span></div>
      <div class="sc-desc">${stEsc(f.desc)||"（无简介）"}</div>
      <div class="sc-foot"><span class="sc-stat">${[(f.stages||[]).length?((f.stages||[]).length+" 阶段"):"", f.nNodes?(f.nNodes+" 节点"):"", (f.skills||[]).length?((f.skills||[]).length+" 技能"):""].filter(Boolean).join(" · ")}</span>${stBadge(f)}
        ${cur?"":`<button class="sc-go" data-imp="${stEsc(f.id)}">导入 →</button>`}
        ${f.hasDemo?`<button class="sc-go" data-demo="${stEsc(f.id)}" title="从官方 Demo 一键创建新项目（配置+输入已就绪）">装 Demo</button>`:""}
      </div></div>`;
  }).join("")+`</div>`;
  body.querySelectorAll(".store-card").forEach(c=>c.addEventListener("click",e=>{
    if (e.target.closest("[data-imp],[data-demo]")) return;
    stSel=c.dataset.f; renderStore(); body.scrollTop=0;
  }));
  body.querySelectorAll("[data-imp]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importFlowTo(b.dataset.imp); }));
  body.querySelectorAll("[data-demo]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); importDemo(b.dataset.demo); }));
}
function renderStoreDetail(){
  const f=(DATA.flowsIndex||[]).find(x=>x.id===stSel), body=document.getElementById("st-body");
  if (!f){ stSel=null; return renderStore(); }
  const cur=f.id===DATA.flow.id, [g,bg]=ST_GLYPH[f.category]||ST_GLYPH["其他"];
  body.innerHTML=`<div class="store-detail">
    <button class="st-back" id="st-backbtn">← 返回商店</button>
    <div class="sd-head"><span class="st-ico" style="background:${bg}">${g}</span>
      <div style="flex:1;min-width:0"><div class="sd-title">${stEsc(f.title)}</div>
        <div class="sd-meta"><span style="font-family:Consolas,monospace">${stEsc(f.id)}</span><span>v${stEsc(f.version)}</span><span>${stEsc(f.category)}</span>
          ${f.updated?`<span>更新 ${stEsc(f.updated)}</span>`:""}${f.engine?`<span>${stEsc(f.engine)}</span>`:""}
          <span class="sc-ver${f.official?" rel":""}">${f.official?"官方发布":"初稿"}</span>
          ${cur?`<span class="sc-badge cur">当前绑定</span>`:`<span class="sc-badge">未绑定</span>`}</div>
        <div class="sd-desc">${stEsc(f.desc)||"（无简介）"}</div></div></div>
    <div class="sd-actions">
      ${cur?`<button class="sd-main" disabled>当前绑定 · 无需导入</button>`
           :`<button class="sd-main" id="st-imp">导入到本项目（${stEsc(DATA.project)}）</button>`}
      <button class="sd-ghost" id="st-close2">继续浏览</button>
      ${f.hasDemo?`<button class="sd-ghost" id="st-demo" style="border-color:var(--accent);color:var(--accent);font-weight:700">装官方 Demo（新项目）</button>`:""}</div>
    <div class="sd-sec"><h4>规模</h4><div class="sd-stats">
      <div class="sd-stat"><b>${(f.stages||[]).length||"-"}</b><span>阶段</span></div>
      <div class="sd-stat"><b>${f.nNodes??"-"}</b><span>节点</span></div>
      <div class="sd-stat"><b>${f.nAgents??"-"}</b><span>Agent 步</span></div>
      <div class="sd-stat"><b>${f.nGates??"-"}</b><span>验收门</span></div>
      <div class="sd-stat"><b>${(f.skills||[]).length}</b><span>技能</span></div></div></div>
    ${(f.stages&&f.stages.length)?`<div class="sd-sec"><h4>阶段流水</h4><div class="sd-stages">${f.stages.map(s=>`<span class="sd-stage"><b>${stEsc(s.id)}</b>${stEsc(s.name||"")}</span>`).join("")}</div></div>`:""}
    ${(f.skills&&f.skills.length)?`<div class="sd-sec"><h4>使用技能（提示词）</h4><div class="sd-skills">${f.skills.map(s=>`<span class="sd-skill">${stEsc(s)}</span>`).join("")}</div></div>`:""}
    <div class="sd-sec"><h4>使用情况（各项目运行版本）</h4><div class="sd-use">${(()=>{const uses=f.usage||[];
      if(!uses.length) return `<div class="sd-use-empty">尚未有任何项目运行此流程——卡片标注「未运行」。</div>`;
      return uses.map(u=>{const rel=stCmp(u.version,f.version);
        const note=rel===0?"与商店版本一致":(rel<0?`落后商店 v${stEsc(f.version)}，重跑或换绑即更新`:"高于商店版本");
        return `<div class="sd-use-row"><b>${stEsc(u.project)}</b><span>v${stEsc(u.version||"?")}</span><span class="msg">${note}</span></div>`;}).join("");
    })()}</div></div>
    <div class="sd-sec"><h4>导入说明</h4><p class="msg" style="margin:0">导入把项目绑定切到该流程：运行状态保留，计划按新流程重编译；flow_init 契约按项目配置重新装载。自建流程先把 flow.json 放入 <code>flows/&lt;新id&gt;/</code>，过 flow-lint 后即出现在本商店。带「装 Demo」标的流有官方示例项目：一键复制为你的新项目，配置与输入素材已就位，<code>flow_run</code> 即可开跑。</p></div>
  </div>`;
  document.getElementById("st-backbtn").onclick=()=>{ stSel=null; renderStore(); };
  document.getElementById("st-close2").onclick=closeFlowStore;
  const imp=document.getElementById("st-imp"); if (imp) imp.onclick=()=>importFlowTo(f.id);
  const dem=document.getElementById("st-demo"); if (dem) dem.onclick=()=>importDemo(f.id);
}
// store 标记位于本脚本之后，须等 DOM 就绪再绑定（否则 getElementById 为 null，绑定全数失败）
(function stBind(){
  const bind = () => {
    document.getElementById("store-q").addEventListener("input",e=>{ stQ=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-sort").addEventListener("change",e=>{ stSort=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-close").addEventListener("click",closeFlowStore);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("store").classList.contains("on")) closeFlowStore(); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
</script>
