/* ---------- 产物管理 · 文件柜（2026-09-22 三合一：原「产物管理/中间件/文档架」收进一个柜子）----------
   板块 = 抽屉：每板块两行卡片、向右延伸、滚动条或按住拖拽横移；每卡必须带中文用途 + 修改时间。
   中文用途单链推导（无双名兜底，R4 §5.3）：模块收敛交付 → op 契约 title/desc → 世界书 frontmatter
   → md 首标题 → 分类默认。修改时间来自 DATA.mtimes（生成器注入；live 同格式切片合并刷新）。 */
function openDeliverables(){
  navPush({type:"deliverables"});
  sel=null; selEdge=null; docMode="view"; render();
  docReset(); dBack.style.display = navStack.length ? "" : "none";
  dTitle.textContent = "产物管理 · 文件柜";
  const dlv = DATA.deliverables || [];
  const M = DATA.mtimes || {};
  const mf = DATA.moduleFiles || [];
  const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  const isText = f => typeof files[f] === "string";
  /* —— 中文用途推导（单链，命中即止）—— */
  const firstHeading = f => {
    if (!isText(f)) return "";
    const m = files[f].match(/^#{1,3}\s+(.+?)\s*$/m);
    return m ? m[1].replace(/[#*`>]/g,"").trim().slice(0,48) : "";
  };
  const fmOf = (t,k) => { const m = t.match(new RegExp("^\\s*" + k + "\\s*:\\s*(.+?)\\s*$","m")); return m ? m[1] : ""; };
  const modOf = f => mf.find(m => m.dir && f.startsWith(m.dir + "/")) || null;
  const opOf = f => {
    const m = modOf(f); if (!m) return null;
    const v = (DATA.modules||[]).find(x => x.id === m.id);
    const reg = v && (DATA.kits||{})[v.module];
    return (reg && reg.ops && reg.ops[f.split("/").pop().replace(/\.md$/,"")]) || null;
  };
  const purposeOf = f => {
    const m = modOf(f);
    if (m && m.deliverable === f)
      return `${m.name} 收敛交付${m.audience ? "（受众：" + m.audience + "）" : "（每模块一份成熟交付）"}`;
    const op = opOf(f);
    if (op && (op.title || op.desc)) return [op.title, op.desc].filter(Boolean).join("：");
    if (f.startsWith("世界书/")) {
      const t = files[f] || "";
      const typ = fmOf(t,"类型"), st = fmOf(t,"status");
      return `设定中间件 · ${typ || "设定卡"}${st==="active" ? " · 生效" : st==="draft" ? " · 草稿" : st==="retired" ? " · 已退役" : ""}`;
    }
    if (f.startsWith("输入/")) return "项目输入素材（开跑前事实，R8）";
    const h = firstHeading(f);
    if (h) return h;
    if (dlv.includes(f)) return f.startsWith("对外交付/") ? "对外成品交付件" : "流程成品交付件";
    return "过程留档文件";
  };
  const mkFileCard = (f, no, extraSub) => ({
    no, name: f.split("/").pop().replace(/\.md$/,""),
    sub: (extraSub ? extraSub + " · " : "") + purposeOf(f),
    path: f, kind: isText(f) ? "f" : "link",
    act: isText(f) ? "打开 →" : "下载/打开 →",
    needle: (f + " " + purposeOf(f) + " " + (extraSub||"")).toLowerCase(),
  });
  /* —— 板块装配（认领序：先到先得，seen 去重；展示序后面单独排）—— */
  const secs = []; const seen = new Set();
  /* ① 工作台：审核意见簿（原文档架首行入口，不能丢） */
  const gateCnt = Object.keys(nodes).filter(n => (nodes[n].kind==="gate"||nodes[n].kind==="srd") && RS.nodes[n]).length;
  secs.push({key:"workbench", cap:"工作台", cards:[{
    no:"审", name:"审核意见簿", sub:"验收裁决与全部批注汇总，可导出 .md 回流（" + gateCnt + " 门有记录）",
    kind:"fn", act:"打开 →", needle:"审核意见簿 裁决 批注 导出 回流 意见",
  }]});
  /* ② 章节文档：iterate 节点逐章槽位（虚位也摆出来，交付进度一眼可见） */
  const itNode = Object.entries(nodes).find(([n,m]) => m.iterate);
  if (itNode){
    const [n, m] = itNode; const it = m.iterate; const total = it.first || 1;
    const unit = it.unit === "chapter" ? "章" : (it.unit || "章");   // flow 声明存英文 id，页面讲中文
    const rows = [];
    for (let i = 1; i <= total; i++){
      const cand = (it.artifact || "章节正文/第{n}章.md").replace("{n}", i);
      const exists = files[cand] !== undefined || dlv.includes(cand);
      seen.add(cand);
      rows.push({no:String(i), name: cand.split("/").pop().replace(/\.md$/,""),
        sub: exists ? `第 ${i} ${unit}成稿 · ${zhTitle(m)} 逐${unit}产出`
                    : `第 ${i} ${unit}槽位 · 虚位待成稿（${zhTitle(m)}）`,
        path: cand, kind: exists ? "f" : "none", act: exists ? "打开 →" : "—",
        needle: (cand + " 章节 " + (exists ? "成稿" : "虚位")).toLowerCase()});
    }
    if (total > 1 || rows.some(r=>r.kind==="f")) secs.push({key:"chapters", cap:`章节文档 · ${zhTitle(m)}（⟲ ${unit} × ${total}）`, cards:rows});
  }
  /* ③ 设定中间件 · 世界书（原「中间件」面板收编，文件即真相） */
  const wbf = Object.keys(files).filter(f=>f.startsWith("世界书/")).sort();
  if (wbf.length){
    secs.push({key:"wb", cap:"设定中间件 · 世界书（文件即真相）", cards: wbf.map(f=>{
      seen.add(f);
      const t = files[f] || "";
      const title = fmOf(t,"title") || f.split("/").pop().replace(/\.(md|json)$/,"");
      const c = mkFileCard(f, "书");
      c.name = title; c.sub = purposeOf(f); c.needle = (title + " " + purposeOf(f) + " " + f).toLowerCase();
      return c;
    })});
  }
  /* ④ 各模块过程件：一个模块一个抽屉（原「模块内幕」默认收起改为平铺横滑） */
  mf.forEach(m=>{
    const proc = (m.process||[]).filter(f=>!seen.has(f)).sort((a,b)=>a.localeCompare(b,"zh"));
    if (!proc.length) return;
    secs.push({key:"mod:"+m.id, cap:`${m.id} ${m.name||""} · 过程件（${m.dir}/）`, cards: proc.map(f=>{
      seen.add(f);
      return mkFileCard(f, "程");
    })});
  });
  /* ⑤ 交付板块：模块收敛交付置前，其余（对外交付 / 交付 / 二进制）随后 */
  const mfdlv = mf.filter(m=>m.deliverable).map(m=>m.deliverable);
  const dlvAll = [...new Set([...dlv, ...mfdlv])].filter(f=>!seen.has(f));
  dlvAll.sort((a,b)=>(mfdlv.includes(b)?1:0)-(mfdlv.includes(a)?1:0) || a.localeCompare(b,"zh"));
  if (dlvAll.length){
    secs.push({key:"dlv", cap:"交付 · 成品与对外", cards: dlvAll.map(f=>{
      seen.add(f);
      const m = mf.find(x=>x.deliverable===f);
      const no = m ? String(m.id||"").replace(/^m/,"M") : (f.startsWith("对外交付/") ? f.slice(5,7) : "交");
      return mkFileCard(f, no, f.startsWith("对外交付/") ? "对外交付" : "");
    })});
  }
  /* ⑥ 输入 / ⑦ 未归属散件 */
  const inp = Object.keys(files).filter(f=>f.startsWith("输入/") && !seen.has(f)).sort();
  if (inp.length){
    secs.push({key:"inputs", cap:"输入 · 开跑前事实", cards: inp.map(f=>{ seen.add(f); return mkFileCard(f, "入"); })});
  }

  }

  const decl = (flow.outputs||[]).flatMap(o=>{
    if (o.path || o.node) return [{node:o.node, path:o.path||((nodes[o.node]||{}).output)||"", title:o.title||""}];
    if (o.module) return Object.entries(nodes)
      .filter(([,n]) => (n.module===o.module || n.stage===o.module) && n.output)
      .map(([id,n]) => ({node:id, path:n.output, title:(o.title ? o.title+" · " : "")+(zhTitle(n)||id)}));

  }).filter(x=>x.path);
  if (decl.length){
    secs.push({key:"decl", cap:`交付清单核对 · flow 声明 ${decl.length} 件`, cards: decl.map(x=>{
      const onDisk = dlv.includes(x.path) || files[x.path] !== undefined;
      return {no:onDisk?"✓":"…", name: x.title || zhTitle(nodes[x.node]||{}) || x.node,
        sub: x.path + (onDisk ? " · 已产出" : " · 待产出"),
        kind:"node", node:x.node, act:onDisk ? "已产出" : "待产出",
        needle:(x.path + " " + (x.title||"") + " 核对 声明").toLowerCase()};
    })});
  }
  /* —— 展示序：工作台 → 交付 → 章节 → 世界书 → 各模块 → 输入 → 散件 → 核对 —— */
  const byKey = {}; secs.forEach(s=>byKey[s.key]=s);
  const order = ["workbench","dlv","chapters","wb"].concat(secs.filter(s=>s.key.startsWith("mod:")).map(s=>s.key)).concat(["inputs","stray","decl"]);
  const view = order.map(k=>byKey[k]).filter(Boolean);
  const totalCards = view.reduce((s,x)=>s+x.cards.length,0);
  dChips.innerHTML = chip(view.length + " 板块 · " + totalCards + " 件");
  dBody.innerHTML = `<div class="wb-bar"><input id="cab-q" type="search" placeholder="搜索：文件名 / 用途 / 模块 / 路径…" autocomplete="off"><span class="cnt" id="cab-cnt"></span></div><div id="cab-body"></div><p class="msg" style="margin:4px 0 0">卡片左键打开；板块内按住拖动或拖下方滚动条横移；滚轮停在板块上即横移，到边缘交还页面滚动。</p>`;
  const grid = document.getElementById("cab-body"), q = document.getElementById("cab-q"), cnt = document.getElementById("cab-cnt");
  function paint(kw){
    kw = (kw||"").trim().toLowerCase();
    let html = "", vis = 0;
    for (const s of view){
      const cards = kw ? s.cards.filter(c=>c.needle.includes(kw)) : s.cards;
      if (!cards.length) continue;
      vis += cards.length;
      html += `<div class="cab-cap">${esc(s.cap)} · ${cards.length} 件</div><div class="cab-strip">` +
        cards.map(c=>{
          const tm = c.path && M[c.path] ? "✎ 修改 " + M[c.path] : (c.kind==="node" ? "以 flow outputs 声明为准" : "时间 —");
          const tip = esc(c.sub) + "（" + (c.path && M[c.path] ? "修改 " + M[c.path] : tm) + "）";
          const tgt = c.kind==="f" || c.kind==="link" ? esc(c.path||"") : esc(c.node||"");
          return `<div class="cab-card" data-kind="${c.kind}" data-t="${tgt}" title="${tip}">` +
            `<div class="r1"><span class="no">${esc(c.no)}</span><span class="nm">${esc(c.name)}</span><span class="go">${esc(c.act||"打开 →")}</span></div>` +
            `<div class="sub">${esc(c.sub)}</div>` +
            `<div class="tm">${esc(tm)}</div></div>`;
        }).join("") + `</div>`;
    }
    grid.innerHTML = html || `<p class="msg" style="margin:20px 0">无匹配——换个关键词试试（可搜文件名、用途、模块名、路径）。</p>`;
    cnt.textContent = vis + " / " + totalCards + " 件";
    bindCab(grid);
  }
  function bindCab(root){
    let moved = false;
    root.querySelectorAll(".cab-strip").forEach(strip=>{
      let down = null;
      strip.addEventListener("pointerdown", e=>{ if(e.button!==0) return; down = {x:e.clientX, sl:strip.scrollLeft}; moved = false; });
      strip.addEventListener("pointermove", e=>{
        if (!down) return;
        const dx = e.clientX - down.x;
        if (Math.abs(dx) > 6){ moved = true; strip.scrollLeft = down.sl - dx; }
      });
      const up = ()=>{ down = null; };
      strip.addEventListener("pointerup", up);
      strip.addEventListener("pointerleave", up);
      strip.addEventListener("wheel", e=>{
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // 横向滚轮交原生
        const max = strip.scrollWidth - strip.clientWidth;
        if (max <= 0) return;
        const atEdge = e.deltaY > 0 ? strip.scrollLeft >= max - 1 : strip.scrollLeft <= 0;
        if (atEdge) return;                                      // 到边缘放行页面滚动
        strip.scrollLeft += e.deltaY;
        e.preventDefault();
      }, {passive:false});
    });
    root.querySelectorAll(".cab-card").forEach(el=>{
      el.addEventListener("click", ()=>{
        if (moved){ moved = false; return; }   // 拖拽松手产生的那次 click 不算点击
        const k = el.dataset.kind, t = el.dataset.t;
        if (k === "f") openFileDoc(t);
        else if (k === "link") window.open(t, "_blank");
        else if (k === "node") select(t);
        else if (k === "fn") openLedger();
      });
    });
  }
  q.addEventListener("input", ()=>paint(q.value));
  paint("");
  flashDoc(); dBody.scrollTop = 0;
}
/* ---------- 版本 Diff：行级对比（世界书改动 / 正文改动） ---------- */
function lineDiff(aText, bText){
  const A = aText.split("\n"), B = bText.split("\n");
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let eA = A.length, eB = B.length;
  while (eA > p && eB > p && A[eA-1] === B[eB-1]) { eA--; eB--; }
  const rows = [];
  for (let i = 0; i < p; i++) rows.push({ t: "ctx", s: A[i] });
  const mA = A.slice(p, eA), mB = B.slice(p, eB);
  const n = mA.length, m = mB.length;
  if (n * m <= 4000000) {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = mA[i] === mB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (mA[i] === mB[j]) { rows.push({ t: "ctx", s: mA[i] }); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({ t: "del", s: mA[i] }); i++; }
      else { rows.push({ t: "add", s: mB[j] }); j++; }
    }
    while (i < n) rows.push({ t: "del", s: mA[i++] });
    while (j < m) rows.push({ t: "add", s: mB[j++] });
  } else {
    mA.forEach(x => rows.push({ t: "del", s: x }));
    mB.forEach(x => rows.push({ t: "add", s: x }));
  }
  for (let k = eB; k < B.length; k++) rows.push({ t: "ctx", s: B[k] });
  return rows;
}
function escLine(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "&nbsp;"; }
/* 字词级细化：一段一行的中文正文里，改一个字 = 整段 del+add。把相邻的 del/add 配对后
   做字符级 LCS，只高亮真正变动的字词——成对段落一眼看出「改了哪几个字」。 */
function charSpanPair(a, b){
  const A=[...a], B=[...b], n=A.length, m=B.length;
  if (n*m > 490000) return null; // 超长段落退回整行标记
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const segs=[]; let i=0,j=0;
  const push=(t,s)=>{ const l=segs[segs.length-1]; if(l&&l.t===t) l.s+=s; else segs.push({t,s}); };
  while(i<n&&j<m){ if(A[i]===B[j]){push("eq",A[i++]);j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i++]);} else {push("add",B[j++]);} }
  while(i<n)push("del",A[i++]); while(j<m)push("add",B[j++]);
  const side=(kind)=>segs.filter(s=>s.t!==(kind==="del"?"add":"del"))
    .map(s=>s.t==="eq"?escLine(s.s):`<span class="cw ${kind}">${escLine(s.s)}</span>`).join("");
  return [side("del"), side("add")];
}
function renderDiffRows(rows){
  // GitHub 式行渲染：行对象可带 a/b（旧/新行号）→ 渲染双列行号栏；t==="fold" → 可点击折叠条
  const out=[]; let i=0;
  const gut=r=>`<span class="g">${r.a??""}</span><span class="g">${r.b??""}</span>`;
  while(i<rows.length){
    if(rows[i].t==="fold"){ out.push(`<div class="ln fold" data-f="${rows[i].f}"><span class="s">⋯ 相同 ${rows[i].n} 行 · 点击展开</span></div>`); i++; continue; }
    if(rows[i].t!=="del" && rows[i].t!=="add"){ out.push(`<div class="ln ctx">${gut(rows[i])}<span class="s">${escLine(rows[i].s)}</span></div>`); i++; continue; }
    const dels=[], adds=[];
    while(i<rows.length&&rows[i].t==="del") dels.push(rows[i++]);
    while(i<rows.length&&rows[i].t==="add") adds.push(rows[i++]);
    const k=Math.max(dels.length,adds.length);
    for(let x=0;x<k;x++){
      const d=dels[x]!==undefined?dels[x]:null, a=adds[x]!==undefined?adds[x]:null;
      let dHtml=d===null?null:escLine(d.s), aHtml=a===null?null:escLine(a.s);
      if(d!==null&&a!==null&&d.s!==a.s){
        const pair=charSpanPair(d.s,a.s);
        if(pair){ dHtml=pair[0]; aHtml=pair[1]; }
      }
      if(d!==null) out.push(`<div class="ln del">${gut(d)}<span class="s">${dHtml}</span></div>`);
      if(a!==null) out.push(`<div class="ln add">${gut(a)}<span class="s">${aHtml}</span></div>`);
    }
  }
  return out.join("");
}
/* 轮次 diff 的行号注记 + 大段相同行折叠（>10 行连续相同 → 首尾各留 3 行 + 折叠条） */
function annotateRows(aText, bText){
  const rows = lineDiff(aText, bText);
  let a=1, b=1;
  for(const r of rows){
    if(r.t==="del"){ r.a=a++; }
    else if(r.t==="add"){ r.b=b++; }
    else { r.a=a++; r.b=b++; }
  }
  return rows;
}
function renderRowsWithFolds(rows, expanded){
  const out=[]; let runStart=-1, segIdx=0;
  const flush=(endEx)=>{
    if(runStart<0) return;
    const run=rows.slice(runStart,endEx);
    if(expanded.has(segIdx) || run.length<11) out.push(...run);
    else{
      for(let x=0;x<3;x++) out.push(run[x]);
      out.push({t:"fold", n:run.length-6, f:segIdx});
      for(let x=run.length-3;x<run.length;x++) out.push(run[x]);
    }
    segIdx++; runStart=-1;
  };
  for(let i=0;i<rows.length;i++){
    if(rows[i].t==="ctx"){ if(runStart<0) runStart=i; }
    else { flush(i); out.push(rows[i]); }
  }
  flush(rows.length);
  return out;
}
function renderFileDiff(f){
  const vers = (fileVersions[f] || []).slice();
  if (files[f] !== undefined) vers.push({ label: "当前（盘上）", text: files[f] });
  if (vers.length < 2) return;
  docReset(); dBack.style.display = navStack.length ? "" : "none";

  dBody.innerHTML = `<div class="wb-bar">

    <span class="cnt" id="df-cnt"></span></div>
    <div class="diff-legend"><span class="lg del">− 旧版</span><span class="lg add">+ 新版</span><span class="lg cw-hint">高亮 = 该段里真正改动的字词</span></div>
    <div id="df-out"></div>`;
  const sa = document.getElementById("df-a"), sb = document.getElementById("df-b");
  sa.selectedIndex = vers.length - 2; sb.selectedIndex = vers.length - 1;
  const paint = () => {
    const rows = lineDiff(vers[sa.selectedIndex].text, vers[sb.selectedIndex].text);
    const adds = rows.filter(r => r.t === "add").length, dels = rows.filter(r => r.t === "del").length;
    document.getElementById("df-cnt").textContent = `+${adds} −${dels}`;
    document.getElementById("df-out").innerHTML = `<div class="diff">` + renderDiffRows(rows) + `</div>`;
  };
  sa.onchange = paint; sb.onchange = paint;
  paint(); dBody.scrollTop = 0;
}
/* 轮次对比（09-22）：所选快照轮 vs 它的上一轮——GitHub 式行号 + 红绿穿插 + 字词高亮 + 大段相同行折叠 */
function diffRoundsDoc(n){
  const vers = (DATA.snapshots[n]||[]);
  const bi = vers.length-1-curVer;           // ver-sel 为倒序索引（0=最新轮）
  const ai = bi-1;
  if (!vers.length || ai < 0) return;
  const a = vers[ai], b = vers[bi];
  docReset(); dBack.style.display = navStack.length ? "" : "none";
  dTitle.textContent = "Diff · " + zhTitle(nodes[n]||{});
  dChips.innerHTML = chip("轮次对比 · 行级+字词");
  const names = [...new Set([...Object.keys(a.content||{}), ...Object.keys(b.content||{})])];
  const secs = names.map(f => ({
    f,
    rows: annotateRows(String((a.content||{})[f] ?? ""), String((b.content||{})[f] ?? "")),
    big: String((a.content||{})[f] ?? "").length + String((b.content||{})[f] ?? "").length > 400000,
  }));
  const expanded = new Set();
  const paint = () => {
    let html = `<div class="wb-bar"><span class="cnt">第 ${a.round} 轮 → 第 ${b.round} 轮${(a.ts||b.ts)?` · ${a.ts||"?"} → ${b.ts||"?"}`:""}</span></div>
      <div class="diff-legend"><span class="lg del">− 旧轮</span><span class="lg add">+ 新轮</span><span class="lg cw-hint">高亮 = 该段里真正改动的字词</span></div>`;
    for (const sec of secs) {
      const rows = sec.big ? [] : renderRowsWithFolds(sec.rows, expanded);
      const adds = sec.rows.filter(r=>r.t==="add").length, dels = sec.rows.filter(r=>r.t==="del").length;
      html += `<div class="doc-h" style="margin:14px 0 4px"><span>${sec.f}</span><span>${sec.big?"内容过大，未渲染":"+"+adds+" −"+dels}</span></div>`
        + (sec.big ? "" : `<div class="diff">` + renderDiffRows(rows) + `</div>`);
    }
    dBody.innerHTML = html;
    dBody.querySelectorAll(".ln.fold").forEach(el => el.addEventListener("click", () => {
      expanded.add(+el.dataset.f); paint();
    }));
    dBody.scrollTop = 0;
  };
  paint();
}
function openFileDoc(f, showDiff){

  document.getElementById("f-save").onclick=async ()=>{
    const paper=dBody.querySelector(".docpaper");

function dom2md(root){
  function inline(el){
    let s="";
    el.childNodes.forEach(n=>{
      if (n.nodeType===3){ s+=n.textContent; return; }
      if (n.nodeType!==1) return;
      const tag=n.tagName;
      if (tag==="BR") s+="\n";
      else if (tag==="STRONG") s+="**"+inline(n)+"**";
      else if (tag==="DEL") s+="~~"+inline(n)+"~~";
      else if (tag==="CODE") s+="`"+n.textContent+"`";
      else if (tag==="A") s+=(n.dataset&&n.dataset.open)?`[${inline(n)}](${n.dataset.open})`:`[${inline(n)}](${n.getAttribute("href")||""})`;
      else if (tag==="IMG") s+=`![${n.getAttribute("alt")||""}](${n.getAttribute("src")||""})`;
      else s+=inline(n);
    });
    return s;
  }
  const out=[];
  root.childNodes.forEach(el=>{
    if (el.nodeType!==1){ const tx=el.textContent.trim(); if(tx) out.push(tx); return; }
    if (el.classList.contains("doc-h")||el.classList.contains("pf")||el.classList.contains("anno-rail")) return;
    const tag=el.tagName;
    if (tag==="H2") out.push("\n# "+inline(el));
    else if (tag==="H3") out.push("\n## "+inline(el));
    else if (tag==="H4") out.push("\n### "+inline(el));
    else if (tag==="P") out.push(inline(el));
    else if (tag==="UL") out.push([...el.children].map(li=>"- "+inline(li)).join("\n"));
    else if (tag==="OL") out.push([...el.children].map((li,i)=>(i+1)+". "+inline(li)).join("\n"));
    else if (tag==="BLOCKQUOTE") out.push(inline(el).split("\n").map(l=>"> "+l).join("\n"));
    else if (tag==="PRE") out.push("```\n"+el.textContent.replace(/\n$/,"")+"\n```");
    else if (tag==="TABLE"){
      const rows=[...el.querySelectorAll("tr")];
      rows.forEach((tr,i)=>out.push("| "+[...tr.children].map(td=>inline(td)).join(" | ")+" |"));
      if (rows[0]) out.splice(out.length-rows.length, 0, "|"+[...rows[0].children].map(()=> "---").join(" | ")+"|");
    }
    else if (tag==="HR") out.push("---");
  });
  return out.join("\n\n");
}

/* ==================== R8-OPS 前端 live 化 ====================
   页面不再是一张死快照：由内核 HTTP 面（miniflow up）提供时，轮询 /api/projects/<id>/live，
   把易变切片就地换上并重渲染。file:// 打开时明确显示「快照」，不假装有后端。
   两个指纹分工：`revision` 决定要不要重渲染；`filesRevision` 决定要不要回来取产物正文（可能上 MB）。 */
/* 注意：page-lint 会在**没有 location/fetch 的裸 VM** 里求值本脚本，所以这里必须防御式探测，
   不能在顶层直接读 location（否则门禁直接 ReferenceError 崩掉）。 */
const LIVE = {
  on: (typeof location !== "undefined") && /^https?:$/.test(location.protocol || ""),
  rev: null, filesRev: null, timer: null,
};
function livePill(text, color, title){
  const el = document.getElementById("live-pill"); if (!el) return;
  el.textContent = text; el.style.color = color; if (title) el.title = title;
}
function liveApi(q){ return "/api/projects/" + encodeURIComponent(DATA.project) + "/live" + (q || ""); }
/* 诊断条 + 结构变化提示（两者都是「本页可能不可信」的显式声明，不是装饰） */
/* R8 选择面：决策三问回显——选了哪个 / 凭什么（by+evidence）/ 有哪些坏决策不可用。 */
function renderDecisionStrip(d){
  const el = document.getElementById("decision-strip"); if (!el) return;
  const list = (d && d.decisions) || [], issues = (d && d.issues) || [];
  if (!list.length && !issues.length){ el.style.display = "none"; el.innerHTML = ""; return; }
  const bits = list.map(x => "决策 <b>" + x.key + "</b> → " + x.picked.map(t => '<span class="chip">' + t + '</span>').join("") +
    (x.excluded_tags && x.excluded_tags.length ? "（排除 " + x.excluded_tags.join("、") + "）" : "") +
    "　<span style='color:var(--ink-3);font-size:calc(10.5px*var(--fs,1))'>by " + x.by + " · 依据 " + x.evidence + "</span>");
  if (issues.length) bits.push("<b>" + issues.length + "</b> 条决策不可用：" + issues.join("；"));
  el.innerHTML = bits.map(b => '<div class="banner" style="border-left-color:#648ab8">' + b + '</div>').join("");
  el.style.display = "";
}
function renderDiagStrip(d, structural){
  const el = document.getElementById("diag-strip"); if (!el) return;  const bits = [];
  if (structural) bits.push("<b>生效编排已变</b>（overlayHash / planHash 变了）：画布已按新编排重绘；模块的增删需重新生成页面");
  if (d && d.count > 0) bits.push("诊断 <b>" + d.count + "</b> 条（" + Object.entries(d.byKind || {}).map(([k, v]) => k + "×" + v).join("、") + "）—— <b>本项目某些结论可能不可信</b>");
  if (!bits.length){ el.style.display = "none"; el.innerHTML = ""; return; }
  el.innerHTML = bits.map(b => '<div class="banner" style="border-left-color:#b8a464">' + b + '</div>').join("");
  el.style.display = "";
}
/* 把 /live 的易变切片换进页面。静态切片（DATA.modules/toolbox/kbTitles…）保持首屏注入不动。 */
function applyLive(live){
  const prevOverlayHash = EFF && EFF.overlayHash, prevPlanHash = EFF && EFF.planHash;
  if (live.state){ RS = live.state; if (DATA.annos) RS.annos = DATA.annos; }
  if (live.files){ files = live.files; DATA.files = live.files; }
  /* 文件柜「备注修改时间」：live 只覆盖内核扫描面（注册产物），生成器注入的交付二进制时间保留——合并而非替换 */
  if (live.mtimes) DATA.mtimes = Object.assign({}, DATA.mtimes, live.mtimes);
  if (live.snapshots){ DATA.snapshots = live.snapshots; rebuildFileVersions(); }
  if (live.eff) EFF = live.eff;
  if (live.overlay !== undefined) OVERLAY = live.overlay;
  if (live.optimize !== undefined) OPTIMIZE = live.optimize;
  if (live.metrics !== undefined) METRICS = live.metrics;
  // OS-04 余量：模板库由内核每次现扫并入 revision（配置面板可能正开着）⇒ 就地回填 + 重渲染。
  // 不这样做的话：用户在别处存了模板，本页会一直显示上一版清单——那就是面板在撒谎。
  if (live.configTemplates !== undefined){ DATA.configTemplates = live.configTemplates; renderTplZone(); }
  const structural = !!(EFF && (EFF.overlayHash !== prevOverlayHash || EFF.planHash !== prevPlanHash));
  bindCanvas();
  // 选中的节点对象属于旧 EFF：先按 id 重指（找不到就置空），再重画——绝不保留悬空引用
  const keepId = sel && sel.id;
  sel = (keepId && nodes[keepId]) ? nodes[keepId] : null;
  lastSel = sel;
  autoLayout();                 // 内部会 render()
  renderEffectiveBanner();
  renderDiagStrip(live.diagnostics, structural);
  renderDecisionStrip(live.decisions);
  if (sel){ render(); openNodeDoc(sel); }        // 右栏内容跟着刷新
  else if (keepId){ docReset(); }                // 选中的节点没了
  checkGateCard();                               // 门挂起 ⇄ 弹卡（人工放行前端闭环）
}
async function pollLive(){
  if (!LIVE.on) return;
  try {
    const r = await fetch(liveApi(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    LIVE.fail = 0;
    const live = await r.json();
    if (live.revision === LIVE.rev){ livePill("● 实时", "#5a8a5e", "与内核实时连接（内容无变化）"); return; }
    if (live.filesRevision !== LIVE.filesRev){
      const rf = await fetch(liveApi("?files=1"), { cache: "no-store" });
      if (rf.ok){ const full = await rf.json(); live.files = full.files; live.snapshots = full.snapshots; live.mtimes = full.mtimes; LIVE.filesRev = full.filesRevision; }
    }
    LIVE.rev = live.revision;
    applyLive(live);
    livePill("● 已同步", "#5a8a5e", "刚刚从内核刷新（rev " + live.revision + "）");
  } catch (e) {
    // 连续失败退避（09-22）：python serve 面没有 /live 端点（那是内核 HTTP 面的）——
    // 每 4s 永久 404 只会刷爆服务日志。连败 3 次即停轮询，明确降级为快照态。
    LIVE.fail = (LIVE.fail || 0) + 1;
    if (LIVE.fail >= 3 && LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer = null; }
    livePill("● 离线", "#a5433a", "连不上内核（" + String(e) + "）—— 当前页面是生成时的快照" +
      (LIVE.fail >= 3 ? "；已停止实时轮询（刷新页面重试）" : ""));
  }
}
function startLive(){
  if (!LIVE.on){
    livePill("● 快照", "#8a8375", "以 file:// 打开：无后端。用 miniflow up 起服务即可实时同步");
    return;
  }
  livePill("● 连接中…", "#8a8375", "正在连接内核");
  pollLive();
  LIVE.timer = setInterval(pollLive, 4000);
}
startLive();

const GATE = { dismissed: {}, doneOk: {} };

  if (!gateUp || GATE.dismissed[g.token || g.node]){ el.classList.remove("on"); return; }
  document.getElementById("gate-meta").innerHTML =

    (g.note ? "　" + wbEsc(g.note) : "") +

    document.getElementById("st-sort").addEventListener("change",e=>{ stSort=e.target.value; stSel=null; renderStore(); });
    document.getElementById("st-close").addEventListener("click",closeFlowStore);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("store").classList.contains("on")) closeFlowStore(); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
</script>
<div id="store" role="dialog" aria-label="流商店">
  <div class="store-top">
    <span class="st-brand">流商店</span><span class="st-sub" id="st-count"></span>
    <input id="store-q" type="search" placeholder="搜索流程 / 能力 / 技能…" aria-label="搜索流程">
    <select id="st-sort" class="st-sort" aria-label="排序">
      <option value="default">排序：默认</option>
      <option value="updated">最近更新</option>
      <option value="nodes">节点最多</option>
      <option value="name">名称</option>
    </select>
    <button class="tb" id="st-close">✕ 关闭</button>
  </div>
  <div class="st-cats" id="st-cats"></div>
  <div class="store-body" id="st-body"></div>
</div>
</body>
</html>
